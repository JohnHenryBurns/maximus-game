<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Blob Army</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1530; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* The same "back to the arcade" pill every game has, in the same corner. */
    a.arcade-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #ffffff; text-decoration: none;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 7px 13px; border-radius: 999px;
      position: fixed; z-index: 10;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
<a id="back" class="arcade-pill" href="index.html"><span>&larr;</span>Arcade</a>
<canvas id="game"></canvas>
<script>
/* The game grabs every touch, which would swallow a tap on the Arcade pill.
   So the pill handles its own taps first and stops them going any further. */
(function () {
  var pill = document.getElementById('back');
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<script>
// =====================================================================
//  BLOB ARMY, by Max.
//
//  You're one little blob, running down a hall. You never stop.
//  Doors come in pairs: pick LEFT or RIGHT. Every door does maths to
//  your army: +1 adds a blob, x2 doubles them, -2 takes two away...
//  At the end of the hall, a red army is waiting. Bigger army wins!
// =====================================================================

// ---------------------------------------------------------------------
//  THE NUMBERS THAT DECIDE HOW IT PLAYS. Try changing them!
// ---------------------------------------------------------------------
const RUN_SPEED = 9;          // how fast the army runs down the hall
const STEER_SPEED = 9;        // how fast you slide left and right
const FAST_STEER_SPEED = 25;  // ...with the FAST MOVEMENT power
const UNLOCK_EVERYTHING = false;   // true = every skin and power is open (for testing!)

// SKINS: they change how your blobs look. "unlock" = which level you
// have to BEAT to get it. (0 = you have it from the start.)
const SKINS = [
  { id: 'classic', name: 'Classic', unlock: 0, body: '#3fa9ff', feet: '#0d3f7a' },
  { id: 'ninja',   name: 'Ninja',   unlock: 1, body: '#2a2a33', feet: '#111111' },
  { id: 'robot',   name: 'Robot',   unlock: 3, body: '#b8c2d0', feet: '#59606b' },
  { id: 'dino',    name: 'Dino',    unlock: 5, body: '#4cc552', feet: '#226b2a' },
  { id: 'king',    name: 'King',    unlock: 7, body: '#ffc933', feet: '#a87400' },
];

// POWERS: you can pick ONE at a time.
const POWERS = [
  { id: 'none',    name: 'No power',      icon: '—',   unlock: 0, about: 'Just you and your blobs' },
  { id: 'fast',    name: 'Fast movement', icon: '⚡',  unlock: 2, about: 'Steer super fast' },
  { id: 'shield',  name: 'Shield',        icon: '🛡️', unlock: 4, about: 'The first bad door does nothing' },
  { id: 'double',  name: 'Double good',   icon: '✨',  unlock: 6, about: 'Good doors count twice' },
  { id: 'hundred', name: '+100 blobs',    icon: '💯',  unlock: 8, about: 'Start every level with 100 more' },
];
const DOOR_PAIRS = 8;         // how many pairs of doors before the fight
const DOOR_GAP = 32;          // how far apart the pairs of doors are
const ENEMY_CHARGE_SPEED = 7; // how fast the red army runs at you
const BATTLE_TIME = 8;       // about how many seconds the big battle lasts
const FIGHT_GAP = 4;         // how close the armies get before EVERYONE charges in
const MOST_BLOBS_DRAWN = 200; // more than this, and we only DRAW 200 (the number still counts them all)

// Every kind of door. "how" is the maths, "chance" is how often it shows up.
const DOOR_KINDS = [
  { label: '+1',  how: function (n) { return n + 1; },  good: true,  chance: 3 },
  { label: '+5',  how: function (n) { return n + 5; },  good: true,  chance: 3 },
  { label: '+10', how: function (n) { return n + 10; }, good: true,  chance: 2 },
  { label: 'x2',  how: function (n) { return n * 2; },  good: true,  chance: 3 },
  { label: 'x4',  how: function (n) { return n * 4; },  good: true,  chance: 1 },
  { label: '-2',  how: function (n) { return n - 2; },  good: false, chance: 3 },
  { label: '-5',  how: function (n) { return n - 5; },  good: false, chance: 2 },
  { label: '-10', how: function (n) { return n - 10; }, good: false, chance: 1 },
  // DIVIDE doors cut your army into pieces. Math.floor rounds DOWN, because
  // you can't have half a blob. (7 ÷ 2 = 3.5, so you get 3.)
  { label: '÷2',  how: function (n) { return Math.floor(n / 2); }, good: false, chance: 2 },
  { label: '÷3',  how: function (n) { return Math.floor(n / 3); }, good: false, chance: 1 },
  { label: '÷4',  how: function (n) { return Math.floor(n / 4); }, good: false, chance: 1 },
];

// The hall is 8 wide: from x = -4 (left wall) to x = 4 (right wall).
const HALL_HALF = 4;

// ---------------------------------------------------------------------
//  THE SCREEN
// ---------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
//  THE GAME'S MEMORY
// ---------------------------------------------------------------------
let mode = 'title';       // 'title', 'run', 'fight', 'win' or 'lose'
let level = 1;
let skin = SKINS[0];       // the skin you're wearing
let power = POWERS[0];     // the power you've got
let buttons = [];          // the buttons on the screen right now (so we know what you tapped)
let lockerFrom = 'title';  // which screen to go back to from SKINS & POWERS
let justUnlocked = [];     // things you JUST unlocked by winning (to show on the win screen)
let startingArmy = 1;      // how many blobs you start this level with (your leftovers from last time!)
let army = { x: 0, z: 0, count: 1 };
let doors = [];           // every pair of doors in this hall
let enemy = { z: 0, count: 0 };
let pops = [];            // floating "+5" and "x2" numbers that drift up and fade
let lastPop = 0;          // when the last fight "pop" sound played
let fight = null;         // the big fight: who started with how many, and is it charging or smashing?
let poofs = [];           // little white puffs where blobs pop in the fight

// ---------------------------------------------------------------------
//  BUILDING A HALL
// ---------------------------------------------------------------------
// Pick a door at random. Doors with a bigger "chance" get picked more.
function randomDoor() {
  let total = 0;
  DOOR_KINDS.forEach(function (d) { total += d.chance; });
  let pick = Math.random() * total;
  for (const d of DOOR_KINDS) {
    pick -= d.chance;
    if (pick < 0) return d;
  }
  return DOOR_KINDS[0];
}

function startLevel() {
  // (The +100 power gives you 100 extra blobs at the start.)
  army = { x: 0, targetX: 0, z: 0, count: startingArmy + (power.id === 'hundred' ? 100 : 0),
           shield: power.id === 'shield' };
  doors = [];
  pops = [];
  fight = null;
  poofs = [];
  // Each pair: one GOOD door for sure, and one random door (could be
  // good, could be bad). Then flip a coin for which side is which.
  let best = startingArmy;   // the biggest army you could POSSIBLY have, if you pick perfectly
  for (let i = 0; i < DOOR_PAIRS; i++) {
    const goodOnes = DOOR_KINDS.filter(function (d) { return d.good; });
    const good = goodOnes[Math.floor(Math.random() * goodOnes.length)];
    const other = randomDoor();
    const goodOnLeft = Math.random() < 0.5;
    doors.push({
      z: 25 + i * DOOR_GAP,
      left: goodOnLeft ? good : other,
      right: goodOnLeft ? other : good,
      picked: null,   // 'left' or 'right', once you've run through
    });
    best = Math.max(good.how(best), other.how(best));
  }
  // THE ENEMY. It's always smaller than the best you could do, so you
  // CAN win if you pick well. Every level, it gets closer to your best.
  const howTough = Math.min(0.9, 0.5 + 0.08 * (level - 1));
  enemy = { z: 25 + DOOR_PAIRS * DOOR_GAP + 10, count: Math.max(3, Math.round(best * howTough)) };
}

// ---------------------------------------------------------------------
//  CONTROLS
//  Keyboard: A/D or the arrow keys. Mouse or finger: drag left and right.
//  Space, click or tap to start.
// ---------------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'Enter') { pressGo(); e.preventDefault(); }
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });

// Dragging: where your finger (or mouse) is, side to side, is where the
// army goes. Left edge of the screen = left wall, right edge = right wall.
let dragging = false;
function steerTo(screenX) {
  const across = screenX / W;           // 0 at the left edge, 1 at the right
  army.targetX = clamp((across - 0.5) * 2 * (HALL_HALF - 0.5), -(HALL_HALF - 0.5), HALL_HALF - 0.5);
}
canvas.addEventListener('pointerdown', function (e) {
  unlockAudio();
  if (mode !== 'run') {
    for (const b of buttons) {
      if (!b.locked && e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h) {
        clickSound();
        b.action();
        return;
      }
    }
    if (mode !== 'locker' && mode !== 'fight') pressGo();
    return;
  }
  dragging = true;
  steerTo(e.clientX);
});
canvas.addEventListener('pointermove', function (e) {
  if (mode !== 'run') return;
  // A mouse steers just by moving. A finger has to be touching.
  if (dragging || e.pointerType === 'mouse') steerTo(e.clientX);
});
window.addEventListener('pointerup', function () { dragging = false; });

// Space / click / tap: start, or play again, or next level.
function pressGo() {
  unlockAudio();
  // Lost? Try this level again, with the same army you started it with.
  if (mode === 'title' || mode === 'lose') { startLevel(); mode = 'run'; }
  // Won? The blobs you have LEFT march on to the next level with you.
  else if (mode === 'win') { level++; startingArmy = army.count; startLevel(); mode = 'run'; justUnlocked = []; }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---------------------------------------------------------------------
//  UPDATE: what happens every frame
// ---------------------------------------------------------------------
function update(dt, now) {
  if (mode === 'run') {
    // Steering. Keys move where you're aiming. Then the army slides
    // toward where you're aiming, at the steering speed. (The FAST power
    // makes it slide way faster.)
    const steer = power.id === 'fast' ? FAST_STEER_SPEED : STEER_SPEED;
    if (keys.KeyA || keys.ArrowLeft)  army.targetX -= steer * dt;
    if (keys.KeyD || keys.ArrowRight) army.targetX += steer * dt;
    army.targetX = clamp(army.targetX, -(HALL_HALF - 0.5), HALL_HALF - 0.5);
    army.x += clamp(army.targetX - army.x, -steer * dt, steer * dt);

    // Run! (Never stop.)
    const before = army.z;
    army.z += RUN_SPEED * dt;

    // Did we just run through a pair of doors? Left half or right half?
    for (const d of doors) {
      if (!d.picked && before < d.z && army.z >= d.z) {
        d.picked = army.x < 0 ? 'left' : 'right';
        const door = d[d.picked];
        if (!door.good && army.shield) {
          // SHIELD! The bad door bounces off. (But only once.)
          army.shield = false;
          pops.push({ text: '🛡️ BLOCKED!', good: true, born: now });
          shieldSound();
          continue;
        }
        if (door.good && power.id === 'double') {
          // DOUBLE GOOD: go through the good door TWICE.
          army.count = door.how(door.how(army.count));
          pops.push({ text: door.label + ' ' + door.label + ' ✨', good: true, born: now });
        } else {
          army.count = Math.max(0, door.how(army.count));
          pops.push({ text: door.label, good: door.good, born: now });
        }
        if (door.good) goodSound(); else badSound();
        if (army.count === 0) { mode = 'lose'; loseSound(); }
      }
    }

    // Reached the enemy? FIGHT!
    if (army.z >= enemy.z - 14) { mode = 'fight'; fight = { phase: 'charge' }; chargeSound(); }
  }

  if (mode === 'fight' && fight.phase === 'charge') {
    // 1. THE CHARGE: both armies run at each other...
    army.z += RUN_SPEED * dt;
    enemy.z -= ENEMY_CHARGE_SPEED * dt;
    // ...until they're close. Then EVERYBODY charges in at once!
    if (enemy.z - army.z < FIGHT_GAP) startBrawl(now);
  }

  if (mode === 'fight' && fight.phase === 'clash') {
    const t = now - fight.start;
    // Everyone runs around the pile, bumping into each other.
    moveBrawlers(fight.blue, dt);
    moveBrawlers(fight.red, dt);

    // CRUNCH! The moment the two armies slam together.
    if (!fight.crashed && t > CRASH_AFTER) {
      fight.crashed = true;
      smashSound();
      fight.shakeUntil = now + 0.5;
      fight.blue.concat(fight.red).forEach(newBrawlTarget);   // now it's a big messy pile
    }

    if (fight.crashed) {
      // POP, POP, POP. Blobs pop out of the pile one blue for one red,
      // at a steady speed, so the battle lasts about BATTLE_TIME seconds.
      fight.owed += fight.popsPerSecond * dt;
      const n = Math.min(Math.floor(fight.owed), army.count, enemy.count);
      if (n > 0) {
        fight.owed -= n;
        army.count -= n;
        enemy.count -= n;
        if (now - lastPop > 0.05) { popSound(); lastPop = now; }
      }
      // The pile gets smaller as blobs pop.
      shrinkPile(fight.blue, army.count, fight.startArmy, now);
      shrinkPile(fight.red, enemy.count, fight.startEnemy, now);
      // BONK! Yellow stars flash all over the pile.
      if (Math.random() < 0.35 && fight.blue.length && fight.red.length) {
        const b = fight.blue[Math.floor(Math.random() * fight.blue.length)];
        fight.stars.push({ x: b.x, z: b.z + 0.2, born: now });
        if (now - fight.lastBonk > 0.08) { bonkSound(); fight.lastBonk = now; }
      }
    }
    fight.stars = fight.stars.filter(function (st) { return now - st.born < 0.15; });

    // 3. Who won? Only the BIGGER army. (A tie means nobody wins.)
    if (fight.crashed && (army.count === 0 || enemy.count === 0)) {
      shrinkPile(fight.blue, army.count, fight.startArmy, now);
      shrinkPile(fight.red, enemy.count, fight.startEnemy, now);
      if (army.count > 0) { mode = 'win'; winSound(); saveBest(); }
      else { mode = 'lose'; loseSound(); }
    }
  }
  poofs = poofs.filter(function (p) { return now - p.born < 0.5; });

  // Old pops float away after a second.
  pops = pops.filter(function (p) { return now - p.born < 1.2; });
}

// THE BRAWL. Every blob you can see stops being part of a neat army and
// becomes a "brawler": its own little guy who runs wherever it wants.
const CRASH_AFTER = 0.45;   // seconds from "CHARGE!" until they slam together

function startBrawl(now) {
  const smaller = Math.min(army.count, enemy.count);
  fight = { phase: 'clash', start: now, startArmy: army.count, startEnemy: enemy.count,
            meetZ: (army.z + enemy.z) / 2, crashed: false, shakeUntil: 0,
            owed: 0, lastBonk: 0, stars: [],
            // Tiny fights are quick, big fights take BATTLE_TIME seconds.
            popsPerSecond: smaller / Math.min(BATTLE_TIME, 1.5 + smaller * 0.4),
            blue: makeBrawlers(army.count, army.x, army.z, false),
            red: makeBrawlers(enemy.count, 0, enemy.z, true) };
}

// Turn an army into brawlers, starting where each blob was standing,
// and send them all running at the other army.
function makeBrawlers(count, x, z, isEnemy) {
  const list = [];
  armySpots(count, x, z, isEnemy).forEach(function (spot) {
    list.push({ x: spot.x, z: spot.z, isEnemy: isEnemy, t: spot.i * 0.37,
                speed: 5 + Math.random() * 3,
                // CHARGE: run to just past the middle, into the other army!
                tx: spot.x * 0.7, tz: 0 });
  });
  const meet = (army.z + enemy.z) / 2;
  list.forEach(function (b) { b.tz = meet + (isEnemy ? -0.4 : 0.4) * Math.random(); });
  list.shown = list.length;   // how many we started with
  return list;
}

// Pick a new random spot in the pile to run to.
function newBrawlTarget(b) {
  const spread = 1.2 + Math.sqrt(b.isEnemy ? fight.red.shown : fight.blue.shown) * 0.12;
  b.tx = clamp((Math.random() - 0.5) * 2 * Math.min(3.3, spread), -HALL_HALF + 0.3, HALL_HALF - 0.3);
  b.tz = fight.meetZ + (Math.random() - 0.5) * Math.min(4, spread);
  b.speed = 1.5 + Math.random() * 2.5;
}

// Move every brawler toward its spot. Once it gets there (and the armies
// have crashed), it picks a new spot: so the pile is always jostling.
function moveBrawlers(list, dt) {
  list.forEach(function (b) {
    const dx = b.tx - b.x, dz = b.tz - b.z;
    const d = Math.hypot(dx, dz);
    const step = b.speed * dt;
    if (d <= step) {
      b.x = b.tx; b.z = b.tz;
      if (fight.crashed) newBrawlTarget(b);
    } else {
      b.x += dx / d * step; b.z += dz / d * step;
    }
  });
}

// Make the pile match the army's number. If the army has lost half its
// blobs, half of its brawlers go POP (in a puff of smoke).
function shrinkPile(list, count, startCount, now) {
  const want = count <= 0 ? 0 : Math.max(1, Math.round(list.shown * count / startCount));
  while (list.length > want) {
    const b = list.splice(Math.floor(Math.random() * list.length), 1)[0];
    poofs.push({ x: b.x, z: b.z, born: now });
  }
}

// ---------------------------------------------------------------------
//  3D, BY HAND. The camera floats up and behind your army, looking
//  down the hall. To draw a point, we measure it from the camera, then
//  squash it onto the screen: far things get squashed toward the middle.
// ---------------------------------------------------------------------
const CAMERA_UP = 6;        // how high the camera floats
const CAMERA_BACK = 9;      // how far behind the army
const CAMERA_TILT = 0.42;   // how much it looks down (in radians)
let cam = { x: 0, y: CAMERA_UP, z: -CAMERA_BACK };

// Turn a point in the world into a spot on the screen.
// Returns null if it's behind the camera.
function toScreen(x, y, z) {
  const rx = x - cam.x, ry = y - cam.y, rz = z - cam.z;
  const c = Math.cos(CAMERA_TILT), s = Math.sin(CAMERA_TILT);
  const depth = rz * c - ry * s;          // how far in front of the camera
  const up = ry * c + rz * s;             // how far above the middle of the view
  if (depth < 0.3) return null;
  const focal = H * 0.9;
  return { x: W / 2 + rx * focal / depth, y: H / 2 - up * focal / depth, depth: depth, scale: focal / depth };
}

// Fill a 4-cornered shape (all four corners in the world).
function quad(corners, color) {
  const pts = corners.map(function (c) { return toScreen(c[0], c[1], c[2]); });
  if (pts.some(function (p) { return !p; })) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.closePath();
  ctx.fill();
}

// Far away things fade into the purple haze at the end of the hall.
const HAZE = [27, 21, 48];
function hazy(rgb, depth) {
  const fade = clamp(depth / 80, 0, 1);
  return 'rgb(' + rgb.map(function (v, i) { return Math.round(v + (HAZE[i] - v) * fade); }).join(',') + ')';
}

// ---------------------------------------------------------------------
//  DRAWING
// ---------------------------------------------------------------------
function draw(now) {
  // The camera follows the army (a little bit side to side, too).
  cam.x = army.x * 0.4;
  // CRUNCH: the screen shakes when the armies slam together.
  if (fight && now < fight.shakeUntil) cam.x += (Math.random() - 0.5) * 0.5;
  cam.z = army.z - CAMERA_BACK;
  // In the brawl, the camera swoops in closer so you can see the fight.
  if (fight && fight.phase === 'clash') cam.z += 4 * Math.min(1, (now - fight.start) / 0.8);

  ctx.fillStyle = 'rgb(' + HAZE.join(',') + ')';
  ctx.fillRect(0, 0, W, H);

  // THE HALL: floor tiles and walls, from far away to close up.
  const TILE = 2;
  const first = Math.floor((army.z - 6) / TILE) * TILE;
  for (let z = first + 90; z >= first; z -= TILE) {
    const depth = z - cam.z;
    const row = Math.round(z / TILE);
    for (let x = -HALL_HALF; x < HALL_HALF; x += TILE) {
      const light = (row + Math.round(x / TILE)) % 2 === 0;
      quad([[x, 0, z], [x + TILE, 0, z], [x + TILE, 0, z + TILE], [x, 0, z + TILE]],
           hazy(light ? [120, 110, 160] : [80, 70, 120], depth));
    }
    const stripe = row % 2 === 0;
    const WALL = stripe ? [70, 60, 110] : [60, 50, 95];
    quad([[-HALL_HALF, 0, z], [-HALL_HALF, 0, z + TILE], [-HALL_HALF, 4, z + TILE], [-HALL_HALF, 4, z]], hazy(WALL, depth));
    quad([[HALL_HALF, 0, z], [HALL_HALF, 0, z + TILE], [HALL_HALF, 4, z + TILE], [HALL_HALF, 4, z]], hazy(WALL, depth));
  }

  // THINGS IN THE HALL: doors, your army, the enemy army. We put them
  // all in one list and draw the farthest first (the painter's trick).
  const things = [];
  doors.forEach(function (d) {
    if (d.z > cam.z + 1 && d.z < cam.z + 95) things.push({ z: d.z, draw: function () { drawDoors(d); } });
  });
  if (fight && fight.phase === 'clash') {
    // THE BRAWL: every blob on its own, plus the stars.
    fight.blue.concat(fight.red).forEach(function (b) {
      things.push({ z: b.z, draw: function () { drawBlob(b.x, b.z, b.isEnemy, now + b.t); } });
    });
    fight.stars.forEach(function (st) {
      things.push({ z: st.z - 0.01, draw: function () { drawCrash(st.x, st.z); } });
    });
    // Just the numbers (0 blobs drawn, but the number still shows).
    things.push({ z: enemy.z + 50, draw: function () { drawArmy(0, 0, fight.meetZ + 1.5, true, now, enemy.count); } });
    things.push({ z: -1e9, draw: function () { drawArmy(0, army.x, fight.meetZ - 0.8, false, now, army.count); } });
  } else {
    if (enemy.count > 0) things.push({ z: enemy.z, draw: function () { drawArmy(enemy.count, 0, enemy.z, true, now, enemy.count); } });
    if (army.count > 0) things.push({ z: army.z, draw: function () { drawArmy(army.count, army.x, army.z, false, now, army.count); } });
  }
  things.sort(function (a, b) { return b.z - a.z; });
  things.forEach(function (t) { t.draw(); });

  drawPoofs(now);
  drawPops(now);
  drawFightSum();
  drawHud();
}

// A pair of doors: a see-through panel on each side, with its maths
// written on it. Good doors are blue, bad doors are red.
function drawDoors(d) {
  ['left', 'right'].forEach(function (side) {
    if (d.picked === side) return;   // you smashed through it!
    const door = d[side];
    const x0 = side === 'left' ? -HALL_HALF : 0, x1 = side === 'left' ? 0 : HALL_HALF;
    const depth = d.z - cam.z;
    ctx.globalAlpha = 0.55;
    quad([[x0 + 0.15, 0, d.z], [x1 - 0.15, 0, d.z], [x1 - 0.15, 3.2, d.z], [x0 + 0.15, 3.2, d.z]],
         door.good ? hazy([60, 160, 255], depth) : hazy([255, 70, 70], depth));
    ctx.globalAlpha = 1;
    // The writing, in the middle of the door.
    const mid = toScreen((x0 + x1) / 2, 1.7, d.z);
    if (mid) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.round(mid.scale * 1.3) + 'px system-ui, sans-serif';
      ctx.fillText(door.label, mid.x, mid.y + mid.scale * 0.45);
    }
  });
  // A post in the middle, between the two doors.
  quad([[-0.15, 0, d.z], [0.15, 0, d.z], [0.15, 3.4, d.z], [-0.15, 3.4, d.z]], hazy([230, 230, 240], d.z - cam.z));
}

// Where does each blob in an army stand?
function armySpots(count, x, z, isEnemy) {
  const shown = Math.min(Math.max(0, count), MOST_BLOBS_DRAWN);
  const spots = [];
  for (let i = 0; i < shown; i++) {
    const r = 0.26 * Math.sqrt(i);
    const angle = i * 2.39996;
    spots.push({
      x: clamp(x + r * Math.cos(angle), -HALL_HALF + 0.3, HALL_HALF - 0.3),
      z: z + (isEnemy ? 1 : -1) * Math.abs(r * Math.sin(angle)),
      i: i,
    });
  }
  return spots;
}

// AN ARMY: lots of blobs packed together in a swirly bunch. (The bunch
// uses the "golden angle", the same trick sunflowers use to pack seeds.)
// count: how many blobs to draw.  label: the number to write (the whole army).
function drawArmy(count, x, z, isEnemy, now, label) {
  const shown = Math.min(Math.max(0, count), MOST_BLOBS_DRAWN);
  const spots = armySpots(count, x, z, isEnemy);
  spots.sort(function (a, b) { return b.z - a.z; });   // far ones first
  spots.forEach(function (s) { drawBlob(s.x, s.z, isEnemy, now + s.i * 0.37); });

  // THE SHIELD: a see-through bubble in front of your army (until it's used).
  if (!isEnemy && army.shield && mode === 'run' && count > 0) {
    const front = toScreen(x, 0.5, z + 0.4);
    if (front) {
      ctx.strokeStyle = 'rgba(120, 220, 255, 0.8)';
      ctx.fillStyle = 'rgba(120, 220, 255, 0.15)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(front.x, front.y, front.scale * (0.6 + 0.26 * Math.sqrt(shown)), front.scale * 0.8, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
  }

  // The number. The enemy's floats above them. Yours sits on the floor
  // just behind your army, so it never covers up the enemy.
  const top = isEnemy ? toScreen(x, 2.2, z) : toScreen(x, 0, z - 0.26 * Math.sqrt(shown) - 0.7);
  if (top) {
    const text = String(label);
    ctx.font = 'bold ' + Math.round(clamp(top.scale * 0.7, 14, 48)) + 'px system-ui, sans-serif';
    const w = ctx.measureText(text).width + 18, h = clamp(top.scale * 0.7, 14, 48) + 10;
    ctx.fillStyle = isEnemy ? 'rgba(200, 30, 30, 0.9)' : 'rgba(30, 110, 220, 0.9)';
    ctx.fillRect(top.x - w / 2, top.y - h / 2, w, h);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(text, top.x, top.y + h * 0.3);
  }
}

// ONE BLOB: a round body, two little feet that pitter-patter, and
// googly eyes. Your blobs are running AWAY from you, so you see their
// eyes poking up over the top. The enemy blobs face you, angry.
function drawBlob(x, z, isEnemy, t) {
  const RADIUS = 0.22;
  const p = toScreen(x, RADIUS + 0.08, z);
  if (!p) return;
  const r = RADIUS * p.scale;
  const step = Math.sin(t * 14);   // feet go up, down, up, down
  const running = mode === 'run' || mode === 'fight';

  drawBlobAt(p.x, p.y, r, isEnemy ? null : skin, isEnemy, t, running);
}

// Draw one blob at a spot ON THE SCREEN, r pixels big, in a skin.
// (The SKINS & POWERS screen uses this too, to show what each skin looks like.)
function drawBlobAt(px, py, r, look, isEnemy, t, running) {
  const p = { x: px, y: py };
  const step = Math.sin(t * 14);   // feet go up, down, up, down

  // Feet.
  ctx.fillStyle = isEnemy ? '#7a1010' : look.feet;
  const footUp = running ? step * r * 0.25 : 0;
  ctx.beginPath(); ctx.ellipse(p.x - r * 0.45, p.y + r * 0.95 - footUp, r * 0.3, r * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(p.x + r * 0.45, p.y + r * 0.95 + footUp, r * 0.3, r * 0.18, 0, 0, Math.PI * 2); ctx.fill();

  // Body (bouncing a little as it runs).
  const bounce = running ? Math.abs(step) * r * 0.15 : 0;
  ctx.fillStyle = isEnemy ? '#e83a3a' : look.body;
  ctx.beginPath(); ctx.arc(p.x, p.y - bounce, r, 0, Math.PI * 2); ctx.fill();
  if (r < 3) return;   // too tiny to bother with eyes
  if (!isEnemy) drawSkinExtras(p.x, p.y - bounce, r, look);

  // Googly eyes.
  const eyeY = isEnemy ? p.y - bounce - r * 0.2 : p.y - bounce - r * 0.85;
  [-1, 1].forEach(function (side) {
    const ex = p.x + side * r * 0.38;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex, eyeY, r * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    const wobble = Math.sin(t * 9 + side) * r * 0.08;   // googly!
    ctx.beginPath(); ctx.arc(ex + wobble, eyeY + (isEnemy ? r * 0.08 : -r * 0.08), r * 0.15, 0, Math.PI * 2); ctx.fill();
  });
  if (isEnemy) {
    // Angry eyebrows.
    ctx.strokeStyle = '#111';
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath();
    ctx.moveTo(p.x - r * 0.65, eyeY - r * 0.45); ctx.lineTo(p.x - r * 0.15, eyeY - r * 0.25);
    ctx.moveTo(p.x + r * 0.65, eyeY - r * 0.45); ctx.lineTo(p.x + r * 0.15, eyeY - r * 0.25);
    ctx.stroke();
  }
}

// THE EXTRA BITS that make each skin special.
function drawSkinExtras(x, y, r, look) {
  if (look.id === 'ninja') {
    // A red headband, with two tails flapping out the back.
    ctx.fillStyle = '#e02424';
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();   // only inside the body
    ctx.fillRect(x - r, y - r * 0.45, r * 2, r * 0.28);
    ctx.restore();
    ctx.strokeStyle = '#e02424';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.beginPath();
    ctx.moveTo(x + r * 0.1, y - r * 0.3); ctx.lineTo(x + r * 0.5, y + r * 0.3);
    ctx.moveTo(x - r * 0.1, y - r * 0.3); ctx.lineTo(x - r * 0.3, y + r * 0.4);
    ctx.stroke();
  } else if (look.id === 'robot') {
    // An antenna with a blinking red light on top, and a bolt.
    ctx.strokeStyle = '#59606b';
    ctx.lineWidth = Math.max(1, r * 0.1);
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x, y - r * 1.55); ctx.stroke();
    ctx.fillStyle = Math.sin(performance.now() / 200) > 0 ? '#ff3030' : '#801010';
    ctx.beginPath(); ctx.arc(x, y - r * 1.6, r * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#59606b';
    ctx.beginPath(); ctx.arc(x, y + r * 0.2, r * 0.12, 0, Math.PI * 2); ctx.fill();
  } else if (look.id === 'dino') {
    // A row of spikes down the middle of its back.
    ctx.fillStyle = '#e8f03a';
    [-0.75, -0.25, 0.25].forEach(function (k) {
      const sy = y + k * r;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.18, sy + r * 0.15); ctx.lineTo(x, sy - r * 0.2); ctx.lineTo(x + r * 0.18, sy + r * 0.15);
      ctx.closePath(); ctx.fill();
    });
  } else if (look.id === 'king') {
    // A crown, with a red jewel.
    const cw = r * 0.55, top = y - r * 1.45, base = y - r * 0.9;
    ctx.fillStyle = '#ffdf3a';
    ctx.beginPath();
    ctx.moveTo(x - cw, base); ctx.lineTo(x - cw, top + r * 0.15); ctx.lineTo(x - cw * 0.5, top + r * 0.3);
    ctx.lineTo(x, top); ctx.lineTo(x + cw * 0.5, top + r * 0.3); ctx.lineTo(x + cw, top + r * 0.15);
    ctx.lineTo(x + cw, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e02424';
    ctx.beginPath(); ctx.arc(x, base - r * 0.15, r * 0.1, 0, Math.PI * 2); ctx.fill();
  }
}

// CRASH: a little yellow star where two fighters bonk heads.
function drawCrash(x, z) {
  const spot = toScreen(x, 0.4, z);
  if (!spot) return;
  const r = spot.scale * 0.22;
  ctx.fillStyle = '#ffe14d';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5;
    const len = i % 2 === 0 ? r : r * 0.45;   // points out, points in, out, in...
    ctx.lineTo(spot.x + Math.cos(a) * len, spot.y + Math.sin(a) * len);
  }
  ctx.closePath();
  ctx.fill();
}

// PUFFS: little white clouds that grow and fade where blobs pop.
function drawPoofs(now) {
  poofs.forEach(function (p) {
    const age = (now - p.born) / 0.5;            // 0 = just popped, 1 = gone
    const spot = toScreen(p.x, 0.4, p.z);
    if (!spot) return;
    ctx.globalAlpha = 1 - age;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(spot.x, spot.y, spot.scale * (0.15 + age * 0.35), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

// THE MATHS OF THE FIGHT, written across the top:  57 - 27 = 30
function drawFightSum() {
  if (!fight || fight.phase !== 'clash') return;
  const big = Math.max(fight.startArmy, fight.startEnemy);
  const small = Math.min(fight.startArmy, fight.startEnemy);
  const blueBigger = fight.startArmy > fight.startEnemy;
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.08) + 'px system-ui, sans-serif';
  ctx.fillStyle = fight.startArmy === fight.startEnemy ? '#fff' : (blueBigger ? '#5fb8ff' : '#ff6b6b');
  ctx.fillText(big + ' − ' + small + ' = ' + (big - small), W / 2, H * 0.18);
}

// The "+5" or "x2" that pops up when you go through a door.
function drawPops(now) {
  pops.forEach(function (p) {
    const age = now - p.born;
    ctx.globalAlpha = 1 - age / 1.2;
    ctx.fillStyle = p.good ? '#7dff9a' : '#ff6b6b';
    ctx.textAlign = 'center';
    ctx.font = 'bold 64px system-ui, sans-serif';
    ctx.fillText(p.text, W / 2, H * 0.4 - age * 80);
    ctx.globalAlpha = 1;
  });
}

// Words on the screen: the level, and the big messages.
function drawHud() {
  buttons = [];
  if (mode === 'locker') { drawLocker(); return; }
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillText('LEVEL ' + level, W - 16, 34);
  if (power.id !== 'none') {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillText(power.icon + ' ' + power.name, W - 16, 58);
  }

  const middle = function (big, small, color) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, H * 0.3, W, H * 0.3);
    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.1) + 'px system-ui, sans-serif';
    ctx.fillText(big, W / 2, H * 0.44);
    ctx.fillStyle = '#fff';
    ctx.font = Math.round(Math.min(W, H) * 0.04) + 'px system-ui, sans-serif';
    ctx.fillText(small, W / 2, H * 0.53);
  };
  if (mode === 'title') {
    middle('BLOB ARMY', 'Steer: drag, mouse, or A / D', '#3fa9ff');
    menuButtons('▶ PLAY');
  } else if (mode === 'win') {
    middle('YOU WIN! 🎉', 'Your ' + army.count + ' blobs march on to level ' + (level + 1) + '!', '#7dff9a');
    if (justUnlocked.length) {
      ctx.fillStyle = '#ffe14d';
      ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.04) + 'px system-ui, sans-serif';
      ctx.fillText('NEW! ' + justUnlocked.join(', '), W / 2, H * 0.58);
    }
    menuButtons('▶ NEXT LEVEL');
  } else if (mode === 'lose') {
    let why = 'YOUR ARMY IS GONE 💀';
    if (fight && fight.phase === 'clash') {
      why = fight.startArmy === fight.startEnemy ? "IT'S A TIE! NOBODY WINS" : 'THE RED ARMY WINS 💀';
    }
    middle(why, '', '#ff6b6b');
    menuButtons('↻ TRY AGAIN');
  }
}

// One button. Grey with a lock if you haven't unlocked it yet.
function drawButton(b) {
  ctx.fillStyle = b.locked ? 'rgba(60, 60, 70, 0.9)' : (b.picked ? '#ffe14d' : 'rgba(30, 25, 60, 0.92)');
  ctx.strokeStyle = b.locked ? '#666' : (b.color || '#fff');
  ctx.lineWidth = 3;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  if (b.label) {
    ctx.fillStyle = b.picked ? '#111' : (b.locked ? '#999' : '#fff');
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(b.h * 0.38) + 'px system-ui, sans-serif';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h * 0.63);
  }
  buttons.push(b);
}

// The two buttons under the big message: GO, and SKINS & POWERS.
function menuButtons(goLabel) {
  const bw = Math.min(230, W * 0.42), bh = 54, gap = 14, y = H * 0.64;
  drawButton({ label: goLabel, color: '#7dff9a', x: W / 2 - bw - gap / 2, y: y, w: bw, h: bh, action: pressGo });
  drawButton({ label: '🎨 SKINS & POWERS', color: '#ffe14d', x: W / 2 + gap / 2, y: y, w: bw, h: bh,
               action: function () { lockerFrom = mode; mode = 'locker'; } });
}

// Have you beaten enough levels to get this skin or power?
function bestBeaten() {
  try { return Number(localStorage.getItem('blobArmyBest') || 0); } catch (e) { return 0; }
}
function isUnlocked(thing) { return UNLOCK_EVERYTHING || thing.unlock <= bestBeaten(); }

// THE SKINS & POWERS SCREEN: a row of skins, a row of powers. Tap one
// to pick it. Locked ones show which level you need to beat.
function drawLocker() {
  ctx.fillStyle = 'rgba(15, 10, 35, 0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  const small = Math.min(W, H);
  ctx.font = 'bold ' + Math.round(small * 0.06) + 'px system-ui, sans-serif';
  ctx.fillText('🎨 SKINS & POWERS', W / 2, H * 0.1);

  const cardW = Math.min(150, (W - 40) / 5 - 10), gap = 10;
  const rowLeft = (W - (cardW * 5 + gap * 4)) / 2;
  const now = performance.now() / 1000;

  // SKINS.
  ctx.font = 'bold ' + Math.round(small * 0.035) + 'px system-ui, sans-serif';
  ctx.fillStyle = '#9fd4ff';
  ctx.fillText('SKINS', W / 2, H * 0.18);
  const skinH = Math.min(cardW * 1.2, H * 0.3);
  SKINS.forEach(function (sk, i) {
    const open = isUnlocked(sk);
    const b = { x: rowLeft + i * (cardW + gap), y: H * 0.21, w: cardW, h: skinH,
                locked: !open, picked: skin === sk,
                action: function () { skin = sk; saveChoice('blobArmySkin', sk.id); } };
    drawButton(b);
    if (open) drawBlobAt(b.x + cardW / 2, b.y + skinH * 0.48, cardW * 0.2, sk, false, now, true);
    ctx.fillStyle = b.picked ? '#111' : (open ? '#fff' : '#999');
    ctx.font = 'bold ' + Math.round(cardW * 0.12) + 'px system-ui, sans-serif';
    ctx.fillText(open ? sk.name : '🔒 beat level ' + sk.unlock, b.x + cardW / 2, b.y + skinH * 0.9);
  });

  // POWERS.
  ctx.font = 'bold ' + Math.round(small * 0.035) + 'px system-ui, sans-serif';
  ctx.fillStyle = '#ffe9a0';
  ctx.fillText('POWERS (pick one)', W / 2, H * 0.21 + skinH + 34);
  const powerY = H * 0.21 + skinH + 46, powerH = Math.min(cardW * 1.1, H * 0.26);
  POWERS.forEach(function (pw, i) {
    const open = isUnlocked(pw);
    const b = { x: rowLeft + i * (cardW + gap), y: powerY, w: cardW, h: powerH,
                locked: !open, picked: power === pw,
                action: function () { power = pw; saveChoice('blobArmyPower', pw.id); } };
    drawButton(b);
    ctx.fillStyle = b.picked ? '#111' : (open ? '#fff' : '#999');
    ctx.font = Math.round(cardW * 0.28) + 'px system-ui, sans-serif';
    ctx.fillText(open ? pw.icon : '🔒', b.x + cardW / 2, b.y + powerH * 0.38);
    ctx.font = 'bold ' + Math.round(cardW * 0.11) + 'px system-ui, sans-serif';
    ctx.fillText(open ? pw.name : 'beat level ' + pw.unlock, b.x + cardW / 2, b.y + powerH * 0.62);
    if (open) {
      ctx.font = Math.round(cardW * 0.085) + 'px system-ui, sans-serif';
      wrapText(pw.about, b.x + cardW / 2, b.y + powerH * 0.78, cardW - 10, cardW * 0.1);
    }
  });

  // BACK.
  drawButton({ label: '← BACK', x: W / 2 - 90, y: Math.min(H - 64, powerY + powerH + 18), w: 180, h: 48,
               action: function () { mode = lockerFrom; } });
}

// Write words in a box, starting a new line when they don't fit.
function wrapText(text, x, y, maxWidth, lineHeight) {
  let line = '';
  text.split(' ').forEach(function (word) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, y);
      line = word; y += lineHeight;
    } else line = test;
  });
  ctx.fillText(line, x, y);
}

// Remember what you picked, for next time.
function saveChoice(name, id) { try { localStorage.setItem(name, id); } catch (e) {} }
function loadChoices() {
  try {
    const sk = SKINS.find(function (k) { return k.id === localStorage.getItem('blobArmySkin'); });
    const pw = POWERS.find(function (k) { return k.id === localStorage.getItem('blobArmyPower'); });
    if (sk && isUnlocked(sk)) skin = sk;
    if (pw && isUnlocked(pw)) power = pw;
  } catch (e) {}
}

// ---------------------------------------------------------------------
//  SOUNDS, made from scratch with the browser's sound machine.
// ---------------------------------------------------------------------
let audio = null;
function unlockAudio() {
  // Browsers only allow sounds after you click or tap.
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
// One note that slides from one pitch to another, then fades out.
function beep(startPitch, endPitch, seconds, type, loudness, delay) {
  if (!audio) return;
  const t = audio.currentTime + (delay || 0);
  const osc = audio.createOscillator();
  const vol = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(startPitch, t);
  osc.frequency.exponentialRampToValueAtTime(endPitch, t + seconds);
  vol.gain.setValueAtTime(loudness, t);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
  osc.connect(vol); vol.connect(audio.destination);
  osc.start(t); osc.stop(t + seconds + 0.05);
}
function goodSound() { beep(500, 700, 0.12, 'square', 0.08); beep(700, 1000, 0.15, 'square', 0.08, 0.1); }
function badSound()  { beep(300, 120, 0.35, 'sawtooth', 0.1); }
function popSound()  { beep(500 + Math.random() * 400, 200, 0.06, 'square', 0.04); }
function chargeSound() { beep(200, 600, 0.6, 'sawtooth', 0.06); }                 // here they come!
function smashSound()  { beep(150, 40, 0.5, 'square', 0.15); beep(90, 30, 0.6, 'sawtooth', 0.1); }   // CRUNCH
function bonkSound()  { beep(260 + Math.random() * 80, 160, 0.07, 'square', 0.05); }   // bonk!
function shieldSound() { beep(900, 1400, 0.25, 'sine', 0.1); beep(1400, 900, 0.25, 'sine', 0.06, 0.1); }   // bwiing!
function clickSound()  { beep(700, 700, 0.04, 'square', 0.05); }
function winSound()  { [0, 0.12, 0.24, 0.4].forEach(function (d, i) { beep(520 * Math.pow(1.26, i), 520 * Math.pow(1.26, i), 0.2, 'square', 0.08, d); }); }
function loseSound() { beep(400, 80, 0.9, 'sawtooth', 0.1); }

// Remember the highest level you've beaten. ("try" in case the browser
// won't let us save, like in some private windows.)
function saveBest() {
  try {
    const best = Number(localStorage.getItem('blobArmyBest') || 0);
    if (level > best) {
      localStorage.setItem('blobArmyBest', String(level));
      // Did beating this level unlock anything?
      justUnlocked = SKINS.concat(POWERS)
        .filter(function (t) { return t.unlock === level; })
        .map(function (t) { return (t.icon ? t.icon + ' ' : '🎨 ') + t.name; });
    }
  } catch (e) {}
}

// ---------------------------------------------------------------------
//  THE GAME LOOP: update, draw, repeat, about 60 times a second.
// ---------------------------------------------------------------------
loadChoices();
startLevel();
let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000);   // (capped, in case the tab was asleep)
  last = t;
  update(dt, t / 1000);
  draw(t / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
