<canvas id="game"></canvas>
<script>
// =====================================================================
// BOOT BALL - football, but wrong.
//
// Two players, one keyboard, one absurdly bouncy ball and two enormous
// boots. There are no rules, no referee and no offside. There are own
// goals. There is a lot of shouting.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }

// The Arcade pill is a real HTML link floating over the top-left corner, so
// the canvas can't see it. Ask the browser where it is — the BOOT BALL title
// was being drawn straight underneath it on a phone held sideways.
function pillBox() {
  const el = document.getElementById('back');
  if (!el) return { right: 109, bottom: 38 };
  const r = el.getBoundingClientRect();
  return { right: Math.ceil(r.right), bottom: Math.ceil(r.bottom) };
}
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// THE RULES OF THIS UNIVERSE
// Every one of these numbers changes how the game FEELS. They are all
// gathered here so you can fiddle with one and see what happens.
// ---------------------------------------------------------------------
const GRAVITY = 2100;            // how hard everything is pulled down
const PLAYER_R = 30;             // how fat a player is
const PLAYER_ACCEL = 3400;       // how quickly you get going
const PLAYER_MAX = 430;          // top running speed
const GROUND_DRAG = 0.82;        // players are heavy and slidey
const AIR_DRAG = 0.96;
const JUMP_V = -880;
const BALL_BOUNCE = 0.84;        // how much bounce it keeps when it lands
const KICK_POWER = 1150;         // the boot
const KICK_LIFT = 620;           // ...and how much of it goes upward
// These three decide whether booting the ball feels GOOD or feels like
// swinging at thin air. The boot stays out longer than you would think,
// the lockout afterwards is short, and pressing too early is remembered
// rather than wasted. Miss and you get another go almost at once.
const KICK_TIME = 0.24;          // how long the boot is stuck out
const KICK_COOLDOWN = 0.26;      // ...and how long before you can swing again
const KICK_BUFFER = 0.32;        // press early and it waits for you
const KICK_REACH = 1.15;         // how far past yourself the boot reaches
const GOAL_H = 0.30;             // goal mouth, as a share of the pitch height
const WIN_GOALS = 5;

// ---- the dials you can turn on the title screen ----
// =====================================================================
// THINGS YOU CAN KICK.
//
// A ball is not one thing any more, it is a KIND of thing. Each kind
// carries its own weight, bounce and air resistance, so a pizza floats
// about like a frisbee and a rugby ball goes wherever it fancies.
// Adding a fourth kind is one line here plus a way to draw it.
// =====================================================================
const BALL_KINDS = {
  football: { r: 20, bounce: 0.84, grav: 1.0, drag: 1.0, wobble: 0, spinny: 0.05 },
  american: { r: 22, bounce: 0.66, grav: 1.05, drag: 1.0, wobble: 260, spinny: 0.12 },
  pizza:    { r: 27, bounce: 0.5, grav: 0.5, drag: 0.985, wobble: 0, spinny: 0.3 },
};
const BALL_MODES = [
  { name: 'THE LOT', desc: 'football, rugby ball AND a pizza',
    list: ['football', 'american', 'pizza'] },
  { name: 'NORMAL', desc: 'one sensible football', list: ['football'] },
  { name: 'BEACH BALL', desc: 'enormous and daft', list: ['football'], scale: 2.1 },
  { name: 'PEA', desc: 'good luck hitting it', list: ['football'], scale: 0.55 },
  { name: 'PIZZA PARTY', desc: 'three pizzas. why not.',
    list: ['pizza', 'pizza', 'pizza'] },
];
const GRAVITIES = [
  { name: 'NORMAL', g: 1.0, desc: 'ordinary falling' },
  { name: 'MOON', g: 0.35, desc: 'everything floats' },
  { name: 'HEAVY', g: 1.9, desc: 'the ball is made of lead' },
];
// How many things are on the pitch. Separate from WHAT they are, so you
// can have one pizza or eight of them. The kinds simply repeat: pick THE
// LOT and eight balls, and you get football, rugby, pizza, football...
const BALL_COUNTS = [1, 2, 3, 5, 8, 12];
let ballCountIx = parseInt(localStorage.getItem('boot_count') || '2');
if (!(ballCountIx >= 0 && ballCountIx < BALL_COUNTS.length)) ballCountIx = 2;
function ballTotal() { return BALL_COUNTS[ballCountIx]; }

let ballSize = parseInt(localStorage.getItem('boot_ball') || '0');
let gravLevel = parseInt(localStorage.getItem('boot_grav') || '0');
if (!(ballSize >= 0 && ballSize < BALL_MODES.length)) ballSize = 0;
if (!(gravLevel >= 0 && gravLevel < GRAVITIES.length)) gravLevel = 0;
function ballMode() { return BALL_MODES[ballSize]; }
// the biggest thing on the pitch - used for reach and goal-line checks
function ballR() {
  let r = 0;
  for (const b of balls) r = Math.max(r, b.r);
  return r || BALL_KINDS.football.r;
}
function gravity() { return GRAVITY * GRAVITIES[gravLevel].g; }

// ---- the two players ----
const TEAMS = [
  { name: 'RED', body: '#ff5a4d', dark: '#c02c22', boot: '#ffd83d', side: -1,
    keys: { a: 'left', d: 'right', w: 'jump', s: 'kick' } },
  { name: 'BLUE', body: '#4da6ff', dark: '#1f63c0', boot: '#ffd83d', side: 1,
    keys: { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'jump', ArrowDown: 'kick' } },
];
let players = [];
let balls = [];
let scores = [0, 0];
let screen = 'title';            // 'title' | 'kickoff' | 'play' | 'goal' | 'over'
let held = {};                   // which keys are down right now
// =====================================================================
// HOW GOOD IS THE ROBOT?
//
// Three things make a computer player easier to beat, and none of them
// is "make it stupid":
//   react - how often it is allowed to change its mind. A slow reaction
//           means it commits to a decision and can be wrong-footed.
//   err   - how far off it thinks the ball is. Small mistakes, like a
//           person misjudging a bouncing ball.
//   speed - simply how fast it can run.
// Left at full whack it scores about 25 goals a minute, which is no fun
// for anybody.
// =====================================================================
const AI_LEVELS = [
  { name: 'EASY', react: 0.34, err: 110, speed: 0.55, desc: 'slow and clumsy' },
  { name: 'NORMAL', react: 0.15, err: 45, speed: 0.82, desc: 'a decent game' },
  // even HARD gets a whisker of error. Two PERFECT robots mirror each
  // other exactly and pin the ball between them forever - a tiny wobble
  // is the difference between a match and a staring contest.
  { name: 'HARD', react: 0.04, err: 16, speed: 1.0, desc: 'it will destroy you' },
];
let aiLevel = parseInt(localStorage.getItem('boot_ailevel') || '0');
if (!(aiLevel >= 0 && aiLevel < AI_LEVELS.length)) aiLevel = 0;
function aiSkill() { return AI_LEVELS[aiLevel]; }

let ai = [false, false];
try {
  const saved = JSON.parse(localStorage.getItem('boot_ai'));
  if (Array.isArray(saved) && saved.length === 2) ai = saved;
} catch (e) {}
let timer = 0, shake = 0, particles = [], lastGoal = null, touchMode = false;
// =====================================================================
// INJURIES.
//
// Get walloped by a ball and you are marked for the rest of the match:
//   on top of the head -> a BANDAGE
//   straight in the face -> a BLACK EYE
//   round the back -> STITCHES
//
// They live out here rather than on the player, because the players are
// built fresh at every kick off - keep them in there and everyone would
// heal perfectly between goals, which is much less funny.
// =====================================================================
let hurts = [{}, {}];
const HURT_SPEED = 620;          // gentle nudges do not count, only a proper wallop
let uiRects = [];
</script>
<script>
// ---------------------------------------------------------------------
// THE PITCH. Everything is measured off the canvas, so it works on a
// phone in your hand or a telly on the wall.
// ---------------------------------------------------------------------
function pitch() {
  const W = canvas.width, H = canvas.height;
  const hud = Math.min(70, H * 0.12);
  const ground = H * 0.88;
  const goalH = (ground - hud) * GOAL_H;
  return { W, H, hud, ground, goalH, goalTop: ground - goalH, goalDepth: Math.min(46, W * 0.05) };
}

// ---------------------------------------------------------------------
// SOUND, all made of maths
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, len, type, vol, slideTo) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + len);
  g.gain.setValueAtTime(vol === undefined ? 0.08 : vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + len + 0.02);
}
function thump(power) {
  tone(150, 0.14, 'sine', Math.min(0.3, 0.08 + power * 0.0002), 60);
  tone(320, 0.06, 'square', 0.05);
}
function bounceSound(speed) {
  if (speed < 60) return;
  tone(220 + Math.random() * 120, 0.05, 'sine', Math.min(0.12, speed * 0.00012));
}
function goalFanfare() {
  [523, 659, 784, 1047, 1319].forEach((n, i) =>
    setTimeout(() => tone(n, 0.22, 'square', 0.11), i * 100));
}
function whistle() {
  tone(1800, 0.25, 'sine', 0.07, 2300);
  setTimeout(() => tone(1900, 0.3, 'sine', 0.07, 1500), 260);
}

// ---------------------------------------------------------------------
// SETTING UP
// ---------------------------------------------------------------------
function newPlayer(i) {
  const P = pitch();
  const t = TEAMS[i];
  return {
    t, i,
    x: i === 0 ? P.W * 0.28 : P.W * 0.72,
    y: P.ground - PLAYER_R,
    vx: 0, vy: 0,
    onGround: true,
    face: i === 0 ? 1 : -1,        // which way the boot points
    kick: 0,                       // how long the boot has left out
    cool: 0,
    hurt: hurts[i],                // the bandages and bruises so far
    ow: 0,                         // how long the OW! stays up
    buffered: 0,                   // pressed BOOT a bit early? remembered here
    wasKick: false,                // so holding it down does not spam
    flash: 0,                      // lights up when you actually connect
  };
}
function newBall(kind, x, y, towards) {
  const K = BALL_KINDS[kind];
  const scale = ballMode().scale || 1;
  return {
    kind, x, y,
    r: K.r * scale,
    bounce: K.bounce, grav: K.grav, drag: K.drag,
    wobble: K.wobble, spinny: K.spinny,
    vx: (towards || 0) * 90, vy: 0,
    spin: 0, angle: 0,
  };
}
function makeBalls(towards) {
  const P = pitch();
  const list = ballMode().list;
  const total = ballTotal();
  const scale = ballMode().scale || 1;
  let maxR = 0;
  for (const k of list) maxR = Math.max(maxR, BALL_KINDS[k].r * scale);
  // Work out how many fit across before stacking a second row, using the
  // BIGGEST one - eight beach balls need more elbow room than eight peas.
  const needed = maxR * 2.5;
  const cols = Math.max(1, Math.min(total, 5, Math.floor((P.W * 0.8) / needed)));
  const rows = Math.ceil(total / cols);
  const spanW = Math.min(P.W * 0.78, (cols - 1) * Math.max(130, needed));
  const stepX = cols > 1 ? spanW / (cols - 1) : 0;
  const stepY = Math.max(86, needed);
  const out = [];
  for (let i = 0; i < total; i++) {
    const col = i % cols, row = Math.floor(i / cols);
    const x = P.W / 2 + (col - (cols - 1) / 2) * stepX;
    const y = Math.max(P.hud + maxR + 8, P.goalTop - 70 - row * stepY);
    out.push(newBall(list[i % list.length], x, y, towards));
  }
  return out;
}
function kickOff(towards) {
  players = TEAMS.map((t, i) => newPlayer(i));
  balls = makeBalls(towards);
  particles = [];
  timer = 1.6;
  screen = 'kickoff';
  whistle();
}
function newMatch() {
  scores = [0, 0];
  hurts = [{}, {}];                // everyone starts the match in one piece
  lastGoal = null;
  kickOff(0);
}
</script>
<script>
// =====================================================================
// THE PHYSICS.
//
// Run in tiny fixed slices rather than in one big jump per frame. If you
// move everything by a whole frame at once, a fast ball can teleport
// straight through the ground or a goal post between one frame and the
// next. Small steps mean it never gets the chance.
// =====================================================================
const SUB = 1 / 240;

function wantDir(p) {
  if (ai[p.i]) return aiWant(p);
  const k = p.t.keys;
  let dir = 0;
  for (const key in k) {
    if (!held[key]) continue;
    if (k[key] === 'left') dir -= 1;
    if (k[key] === 'right') dir += 1;
  }
  return { dir, jump: pressed(p, 'jump'), kick: pressed(p, 'kick') };
}
function pressed(p, action) {
  for (const key in p.t.keys) if (p.t.keys[key] === action && held[key]) return true;
  return false;
}

function physics(dt) {
  const P = pitch();
  const g = gravity();

  for (const p of players) {
    const want = wantDir(p);
    // running
    p.vx += want.dir * PLAYER_ACCEL * dt;
    if (want.dir !== 0) p.face = want.dir;
    const top = PLAYER_MAX * (ai[p.i] ? aiSkill().speed : 1);
    p.vx = Math.max(-top, Math.min(top, p.vx));
    if (want.dir === 0) p.vx *= p.onGround ? Math.pow(GROUND_DRAG, dt * 60) : Math.pow(AIR_DRAG, dt * 60);
    // jumping
    if (want.jump && p.onGround) { p.vy = JUMP_V; p.onGround = false; tone(420, 0.07, 'square', 0.05, 620); }
    // booting
    p.cool = Math.max(0, p.cool - dt);
    p.kick = Math.max(0, p.kick - dt);
    p.flash = Math.max(0, p.flash - dt);
    p.ow = Math.max(0, p.ow - dt);
    p.buffered = Math.max(0, p.buffered - dt);
    // Asking to boot at ANY moment is remembered for a short while, so
    // pressing early still lands - and holding it down keeps swinging as
    // fast as the boot recovers. That matters for the robot too, which
    // simply asks to kick the whole time the ball is in range.
    if (want.kick) p.buffered = KICK_BUFFER;
    if (p.buffered > 0 && p.cool <= 0) {
      p.buffered = 0;
      p.kick = KICK_TIME;
      p.cool = KICK_COOLDOWN;
      tone(180, 0.06, 'sawtooth', 0.05);
    }
    // falling
    p.vy += g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // the ground, and the walls
    if (p.y > P.ground - PLAYER_R) { p.y = P.ground - PLAYER_R; p.vy = 0; p.onGround = true; }
    if (p.y < P.hud + PLAYER_R) { p.y = P.hud + PLAYER_R; p.vy = Math.max(0, p.vy); }
    if (p.x < PLAYER_R) { p.x = PLAYER_R; p.vx = Math.max(0, p.vx); }
    if (p.x > P.W - PLAYER_R) { p.x = P.W - PLAYER_R; p.vx = Math.min(0, p.vx); }
  }

  // players shove each other about
  const a = players[0], b = players[1];
  const dx = b.x - a.x, dy = b.y - a.y;
  const d = Math.hypot(dx, dy) || 1;
  if (d < PLAYER_R * 2) {
    const push = (PLAYER_R * 2 - d) / 2;
    const nx = dx / d, ny = dy / d;
    a.x -= nx * push; a.y -= ny * push;
    b.x += nx * push; b.y += ny * push;
    a.vx -= nx * 40; b.vx += nx * 40;
    // A SHOVE CAN PUSH SOMEBODY OFF THE PITCH. The wall check happened
    // before this, so without doing it again a hard barge in the corner
    // sends a player straight through the touchline.
    for (const q of players) {
      if (q.x < PLAYER_R) { q.x = PLAYER_R; q.vx = Math.max(0, q.vx); }
      if (q.x > P.W - PLAYER_R) { q.x = P.W - PLAYER_R; q.vx = Math.min(0, q.vx); }
      if (q.y > P.ground - PLAYER_R) { q.y = P.ground - PLAYER_R; q.vy = Math.min(0, q.vy); q.onGround = true; }
      if (q.y < P.hud + PLAYER_R) { q.y = P.hud + PLAYER_R; q.vy = Math.max(0, q.vy); }
    }
  }

  // ---- everything you can kick ----
  for (const b of balls) ballPhysics(b, dt, P, g);

  // ---- players against everything ----
  for (const p of players) {
    for (const b of balls) playerVsBall(p, b);
  }
}

// One thing on the pitch, one step of physics. Each kind brings its own
// weight, bounce and drag, so this same code makes a football bounce
// true and a pizza float about.
function ballPhysics(b, dt, P, g) {
  b.vy += g * b.grav * dt;
  b.vx *= Math.pow(b.drag, dt * 60);
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  b.angle += b.spin * dt;
  b.spin *= Math.pow(0.9, dt * 60);
  if (b.y > P.ground - b.r) {                      // the grass
    b.y = P.ground - b.r;
    if (Math.abs(b.vy) > 30) bounceSound(Math.abs(b.vy));
    b.vy = -b.vy * b.bounce;
    b.vx *= 0.985;
    b.spin = b.vx * b.spinny;
    // a rugby ball does not bounce straight. THAT is the whole joke.
    if (b.wobble && Math.abs(b.vy) > 60) {
      b.vx += (Math.random() - 0.5) * b.wobble;
      b.spin += (Math.random() - 0.5) * 18;
    }
  }
  if (b.y < P.hud + b.r) { b.y = P.hud + b.r; b.vy = Math.abs(b.vy) * b.bounce; }
  const inGoalMouth = b.y > P.goalTop;
  if (b.x < b.r && !inGoalMouth) { b.x = b.r; b.vx = Math.abs(b.vx) * b.bounce; bounceSound(300); }
  if (b.x > P.W - b.r && !inGoalMouth) { b.x = P.W - b.r; b.vx = -Math.abs(b.vx) * b.bounce; bounceSound(300); }
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.3; }
  if (b.x > P.W - b.r) { b.x = P.W - b.r; b.vx = -Math.abs(b.vx) * 0.3; }
}

// Which bit of you did it hit? nx and ny point from you to the ball, so
// they say exactly where it made contact - above you, in front of your
// face, or round the back of your head.
function hurtBy(p, nx, ny) {
  if (ny < -0.5) return 'bandage';                 // came down on top of you
  if (nx * p.face > 0.45) return 'blackEye';       // straight in the face
  if (nx * p.face < -0.45) return 'stitches';      // round the back
  return null;                                     // a glancing one, you got away with it
}
function doHurt(p, nx, ny) {
  const kind = hurtBy(p, nx, ny);
  if (!kind) return;
  p.ow = 0.9;
  if (p.hurt[kind]) return;                        // already got that one
  p.hurt[kind] = true;
  tone(300, 0.16, 'square', 0.09, 120);            // a comedy OW
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
    particles.push({ x: p.x, y: p.y - PLAYER_R, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
                     life: 0.5, color: '#ffe066' });
  }
}

function playerVsBall(p, b) {
  const bx = b.x - p.x, by = b.y - p.y;
  const bd = Math.hypot(bx, by) || 1;
  const reach = PLAYER_R + b.r + (p.kick > 0 ? PLAYER_R * KICK_REACH : 0);
  if (bd > reach) return;
  const nx = bx / bd, ny = by / bd;
  if (p.kick > 0) {
    // THE BOOT. A proper wallop, away from the player and upward.
    b.vx = nx * KICK_POWER + p.face * KICK_POWER * 0.5 + p.vx * 0.4;
    b.vy = ny * KICK_POWER * 0.4 - KICK_LIFT;
    b.spin = p.face * 14;
    p.kick = 0;
    p.flash = 0.22;
    thump(KICK_POWER);
    shake = Math.max(shake, 12);
    for (let i = 0; i < 12; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 240;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                       life: 0.35, color: '#ffd83d' });
    }
  } else {
    // how hard did that hit YOU? measured before we send the ball away
    const wallop = Math.hypot(b.vx - p.vx, b.vy - p.vy);
    if (wallop > HURT_SPEED) doHurt(p, nx, ny);
    // Running into it counts as a hit too - a body check. It has to
    // send it off FASTER than you are running, or you would just
    // trample straight over it and never be able to dribble.
    const overlap = PLAYER_R + b.r - bd;
    if (overlap > 0) { b.x += nx * overlap; b.y += ny * overlap; }
    const hit = 300 + Math.abs(p.vx) * 1.25;
    b.vx = nx * hit + p.vx * 0.6;
    b.vy = Math.min(b.vy, ny * hit - 150);
    b.spin = p.vx * b.spinny;
    bounceSound(hit * 0.4);
  }
}

<script>
// ---------------------------------------------------------------------
// GOALS
// ---------------------------------------------------------------------
function checkGoal() {
  const P = pitch();
  let scorer = -1, scoredWith = null;
  for (const b of balls) {
    if (b.y < P.goalTop) continue;                 // over the bar
    if (b.x < P.goalDepth - b.r * 0.2) { scorer = 1; scoredWith = b; break; }
    if (b.x > P.W - P.goalDepth + b.r * 0.2) { scorer = 0; scoredWith = b; break; }
  }
  if (scorer < 0) return;
  const ball = scoredWith;                         // the one that went in
  scores[scorer]++;
  // was it an own goal? whoever touched it last is not tracked, so we
  // simply say so when the ball goes in the net you were defending
  // THE NET SPITS IT BACK. It has just hit the back of the net, so it
  // fires out the way it came in, spinning, while everyone celebrates.
  const out = scorer === 0 ? -1 : 1;
  ball.vx = out * 1000;
  ball.vy = -720;
  ball.spin = out * 22;
  lastGoal = { team: scorer, kind: ball.kind, at: Date.now(), side: scorer === 0 ? 1 : -1 };
  goalFanfare();
  shake = 24;
  for (let i = 0; i < 60; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 380;
    particles.push({ x: ball.x, y: ball.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                     life: 0.9 + Math.random() * 0.6,
                     color: Math.random() < 0.5 ? TEAMS[scorer].body : '#ffffff' });
  }
  if (scores[scorer] >= WIN_GOALS) {
    screen = 'over';
    timer = 0;
  } else {
    screen = 'goal';
    timer = 1.9;
  }
}

// ---------------------------------------------------------------------
// AI - the same idea as AI_Dude: no magic, just a few simple rules,
// checked in order. Get between the ball and your own goal, then boot it.
// ---------------------------------------------------------------------
function aiWant(p) {
  const S = aiSkill();
  // it only changes its mind every so often, so it can be wrong-footed
  p.aiTimer = (p.aiTimer || 0) - SUB;
  if (p.aiTimer > 0 && p.aiPlan) return p.aiPlan;
  p.aiTimer = S.react;
  p.aiErrX = (Math.random() - 0.5) * 2 * S.err;
  p.aiErrY = (Math.random() - 0.5) * 2 * S.err;
  p.aiPlan = aiThink(p);
  return p.aiPlan;
}
// which thing on the pitch is closest to me?
function nearestBall(p) {
  let best = balls[0], bd = 1e9;
  for (const b of balls) {
    const d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function aiThink(p) {
  const S = aiSkill();
  const P = pitch();
  const ball = nearestBall(p);
  if (!ball) return { dir: 0, jump: false, kick: false };
  // where it THINKS the ball is - not quite where it really is
  const bx = ball.x + (p.aiErrX || 0), by = ball.y + (p.aiErrY || 0);
  const toBall = bx - p.x;
  const dist = Math.hypot(bx - p.x, by - p.y);
  // stand on the goal side of the ball, so a boot sends it the right way
  const standX = bx + (p.i === 0 ? -PLAYER_R * 1.1 : PLAYER_R * 1.1);
  let dir = 0;
  if (Math.abs(standX - p.x) > 12) dir = standX > p.x ? 1 : -1;
  // if the ball has got behind it, hurry back
  const behind = p.i === 0 ? bx < p.x - PLAYER_R : bx > p.x + PLAYER_R;
  if (behind && Math.abs(toBall) > 40) dir = toBall > 0 ? 1 : -1;
  // jump for a high ball that is close
  const jump = p.onGround && dist < PLAYER_R * 4.5 && by < p.y - PLAYER_R * 1.2;
  // boot it when it is in range and on the correct side
  const facingRight = p.i === 0;
  const onGoodSide = facingRight ? bx > p.x - PLAYER_R : bx < p.x + PLAYER_R;
  const kick = dist < PLAYER_R + ball.r + PLAYER_R * KICK_REACH && onGoodSide;
  return { dir, jump, kick };
}

// ---------------------------------------------------------------------
// UPDATING
// ---------------------------------------------------------------------
let acc = 0;
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  for (const pt of particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vy += 900 * dt; pt.life -= dt;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (screen === 'kickoff') {
    timer -= dt;
    if (timer <= 0) screen = 'play';
    return;
  }
  if (screen === 'goal') {
    // The game does NOT freeze while you celebrate. Everything keeps
    // moving, so you get to watch the ball fly back out of the net. We
    // just stop counting goals, or the same one would score twice on
    // its way out.
    timer -= dt;
    acc += Math.min(dt, 0.05);
    let g = 0;
    while (acc >= SUB && g++ < 60) { physics(SUB); acc -= SUB; }
    if (timer <= 0) kickOff(lastGoal ? (lastGoal.team === 0 ? -1 : 1) : 0);
    return;
  }
  if (screen !== 'play') return;

  // fixed slices, so nothing can tunnel through the floor
  acc += Math.min(dt, 0.05);
  let guard = 0;
  while (acc >= SUB && guard++ < 60) {
    physics(SUB);
    acc -= SUB;
  }
  checkGoal();
}

<script>

  const leftX = Math.max(W * 0.3, pill.right + halfLeft + 12);
  TEAMS.forEach((t, i) => {
    const x = i === 0 ? leftX : W - leftX;
    ctx.fillStyle = t.body;
    ctx.font = 'bold ' + nameFont + 'px monospace';
    ctx.fillText(labels[i], x, P.hud * 0.45);
    ctx.font = 'bold ' + scoreFont + 'px monospace';
    ctx.fillText(String(scores[i]), x, P.hud * 0.94);
  });
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = 'bold ' + Math.min(14, W / 40, P.hud * 0.24) + 'px monospace';
  ctx.fillText('FIRST TO ' + WIN_GOALS, W / 2, P.hud * 0.62);

  drawScreens(P);
  if (touchMode && (screen === 'play' || screen === 'kickoff')) drawPads(P);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function drawScreens(P) {
  const { W, H } = P;
  uiRects = [];
  ctx.textAlign = 'center';
  if (screen === 'kickoff') {
    ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, timer) + ')';
    ctx.font = 'bold ' + Math.min(58, W / 11) + 'px monospace';
    ctx.fillText(timer > 0.7 ? 'KICK OFF!' : 'GO!', W / 2, H * 0.42);
  } else if (screen === 'goal') {
    const t = TEAMS[lastGoal.team];
    const pop = 1 + Math.sin(Date.now() / 90) * 0.06;
    ctx.save();
    ctx.translate(W / 2, H * 0.42);
    ctx.scale(pop, pop);
    ctx.fillStyle = t.body;
    ctx.font = 'bold ' + Math.min(72, W / 9) + 'px monospace';
    ctx.fillText('GOAL!', 0, 0);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(26, W / 24) + 'px monospace';
    const what = { football: 'with the FOOTBALL', american: 'with the RUGBY BALL',
                   pizza: 'WITH A PIZZA' }[lastGoal.kind] || '';
    ctx.fillText(t.name + ' SCORES', 0, 42);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = 'bold ' + Math.min(19, W / 32) + 'px monospace';
    ctx.fillText(what, 0, 70);
    ctx.restore();
  } else if (screen === 'over') {
    const w = scores[0] > scores[1] ? 0 : 1;
    ctx.fillStyle = 'rgba(8, 20, 14, 0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = TEAMS[w].body;
    ctx.font = 'bold ' + Math.min(62, W / 10) + 'px monospace';
    ctx.fillText(TEAMS[w].name + ' WINS!', W / 2, H * 0.42);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(34, W / 18) + 'px monospace';
    ctx.fillText(scores[0] + '  -  ' + scores[1], W / 2, H * 0.53);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
    ctx.font = 'bold ' + Math.min(22, W / 26) + 'px monospace';
    ctx.fillText('SPACE  /  TAP  =  PLAY AGAIN', W / 2, H * 0.72);
    ctx.font = Math.min(15, W / 38) + 'px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('ESC  =  back to the settings', W / 2, H * 0.79);
  } else if (screen === 'title') {
    ctx.fillStyle = 'rgba(8, 20, 14, 0.9)';
    ctx.fillRect(0, 0, W, H);
    // ---- LAY THE MENU OUT FROM THE ROOM WE ACTUALLY HAVE ----
    // It used to be pinned to fixed fractions of the height (0.2, 0.36, 0.63,
    // 0.85) which is fine on a tall screen and a pile-up on a short one: on a
    // phone held sideways the title sat under the Arcade pill, the hint line
    // ran through the team names, and the HUMAN buttons landed on top of the
    // dials. Now the space below the pill is divided into four bands that
    // always add up to exactly what's there, and the writing is sized to fit
    // its own band — so nothing can ever land on anything else.
    const top = pillBox().bottom + 8;
    const avail = H - top - 10;
    const headH = avail * 0.24, teamH = avail * 0.36;
    const dialH = avail * 0.24, kickH = avail * 0.16;
    const teamTop = top + headH, dialTop = teamTop + teamH, kickTop = dialTop + dialH;

    ctx.fillStyle = '#ffd83d';
    ctx.font = 'bold ' + Math.min(66, W / 9, headH * 0.46) + 'px monospace';
    ctx.fillText('BOOT BALL', W / 2, top + headH * 0.44);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = Math.min(18, W / 32, headH * 0.16) + 'px monospace';
    ctx.fillText('football, but wrong', W / 2, top + headH * 0.70);
    if (!ai[0] && !ai[1]) {
      ctx.fillStyle = 'rgba(168, 228, 255,' + (0.55 + Math.sin(Date.now() / 400) * 0.35) + ')';
      ctx.font = 'bold ' + Math.min(16, W / 36, headH * 0.15) + 'px monospace';
      // the long version only if there's room for it
      const hint = W < 560 ? 'tap a HUMAN below to make it a ROBOT'
                           : 'ON YOUR OWN?  tap a HUMAN below to make it a ROBOT';
      ctx.fillText(hint, W / 2, top + headH * 0.95);
    }

    TEAMS.forEach((t, i) => {
      const x = i === 0 ? W * 0.27 : W * 0.73;
      ctx.fillStyle = t.body;
      ctx.font = 'bold ' + Math.min(26, W / 24, teamH * 0.21) + 'px monospace';
      ctx.fillText(t.name, x, teamTop + teamH * 0.19);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = 'bold ' + Math.min(14, W / 42, teamH * 0.12) + 'px monospace';
      ctx.fillText(i === 0 ? 'A / D  run' : 'LEFT / RIGHT  run', x, teamTop + teamH * 0.40);
      ctx.fillText(i === 0 ? 'W  jump      S  BOOT' : 'UP  jump    DOWN  BOOT',
                   x, teamTop + teamH * 0.57);
      // human or robot
      const bw = Math.min(W * 0.22, 210), bh = Math.min(30, teamH * 0.26);
      const by = teamTop + teamH * 0.66;
      ctx.fillStyle = ai[i] ? 'rgba(90,200,255,0.16)' : 'rgba(255,255,255,0.06)';
      roundRect(x - bw / 2, by, bw, bh, 8); ctx.fill();
      ctx.strokeStyle = ai[i] ? '#5ac8ff' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      roundRect(x - bw / 2, by, bw, bh, 8); ctx.stroke();
      ctx.fillStyle = ai[i] ? '#a8e4ff' : 'rgba(255,255,255,0.6)';
      ctx.font = 'bold ' + Math.min(14, W / 44, bh * 0.48) + 'px monospace';
      ctx.fillText(ai[i] ? '🤖 ROBOT' : '🧑 HUMAN  (tap)', x, by + bh * 0.68);
      uiRects.push({ x, y: by + bh / 2, w: bw / 2, h: bh, aiToggle: i });
    });

    const dy = dialTop + dialH * 0.5;
    const howMany = ballTotal() + (ballTotal() === 1 ? ' ball' : ' balls');
    if (ai[0] || ai[1]) {
      const gap = W * 0.235;
      drawDial(W * 0.135, dy, W, 'BALLS  (1)', ballMode().name,
               ballMode().desc, '#ffd83d', 'ball', dialH, gap);
      drawDial(W * 0.375, dy, W, 'GRAVITY  (2)', GRAVITIES[gravLevel].name,
               GRAVITIES[gravLevel].desc, '#9ad4ff', 'grav', dialH, gap);
      drawDial(W * 0.625, dy, W, 'HOW MANY  (3)', howMany,
               ballTotal() > 5 ? 'utter chaos' : 'on the pitch at once', '#b6ff7a', 'count', dialH, gap);
      drawDial(W * 0.865, dy, W, 'ROBOT  (4)', AI_LEVELS[aiLevel].name,
               AI_LEVELS[aiLevel].desc, '#a8e4ff', 'skill', dialH, gap);
    } else {
      const gap = W * 0.3;
      drawDial(W * 0.18, dy, W, 'BALLS  (1)', ballMode().name,
               ballMode().desc, '#ffd83d', 'ball', dialH, gap);
      drawDial(W * 0.5, dy, W, 'GRAVITY  (2)', GRAVITIES[gravLevel].name,
               GRAVITIES[gravLevel].desc, '#9ad4ff', 'grav', dialH, gap);
      drawDial(W * 0.82, dy, W, 'HOW MANY  (3)', howMany,
               ballTotal() > 5 ? 'utter chaos' : 'on the pitch at once', '#b6ff7a', 'count', dialH, gap);
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
    ctx.font = 'bold ' + Math.min(24, W / 24, kickH * 0.52) + 'px monospace';
    ctx.fillText('SPACE  /  TAP  =  KICK OFF', W / 2, kickTop + kickH * 0.68);
  }
  ctx.textAlign = 'left';
}
function drawDial(cx, y, W, title, value, desc, color, tag, dh, gap) {
  // dh = how tall a band this dial has been given; gap = how far to the next
  // dial along, so the arrows can never reach into their neighbour
  dh = dh || 70;
  gap = gap || W;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = 'bold ' + Math.min(12, W / 58, dh * 0.17) + 'px monospace';
  ctx.fillText(title, cx, y - dh * 0.24);
  ctx.fillStyle = color;
  ctx.font = 'bold ' + Math.min(18, W / 40, dh * 0.26) + 'px monospace';
  ctx.fillText(value, cx, y + dh * 0.07);
  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.font = Math.min(12, W / 58, dh * 0.17) + 'px monospace';
  ctx.fillText(desc, cx, y + dh * 0.35);
  const r = Math.min(15, W / 56, dh * 0.22);
  const reach = Math.min(W * 0.13, 120, gap * 0.42);
  [[-1, cx - reach], [1, cx + reach]].forEach(([dir, ax]) => {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath(); ctx.arc(ax, y - 2, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = color;
    ctx.font = 'bold ' + r * 1.2 + 'px monospace';
    ctx.fillText(dir < 0 ? '<' : '>', ax, y + 4);
    const hit = { x: ax, y: y - 2, w: r * 1.6, h: r * 1.6 };
    hit[tag] = dir;
    uiRects.push(hit);
  });
}
</script>
<script>
// ---------------------------------------------------------------------
// CONTROLS
// ---------------------------------------------------------------------
let padRects = [];
function drawPads(P) {
  const { W, H } = P;
  const r = Math.min(34, W / 13);
  padRects = [];
  TEAMS.forEach((t, i) => {
    if (ai[i]) return;
    const cx = i === 0 ? r * 2.6 : W - r * 2.6;
    const cy = H - r * 2.2;
    const buttons = [
      ['left', -1.5, 0, '◀'], ['right', 1.5, 0, '▶'],
      ['jump', 0, -1.5, '▲'], ['kick', 0, 1.4, 'BOOT'],
    ];
    buttons.forEach(([act, dx, dy, label]) => {
      const x = cx + dx * r * 1.4, y = cy + dy * r * 1.1;
      ctx.fillStyle = act === 'kick' ? 'rgba(255,216,63,0.18)' : 'rgba(255,255,255,0.07)';
      ctx.strokeStyle = act === 'kick' ? '#ffd83d' : t.body;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r * 0.66, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = act === 'kick' ? '#ffd83d' : t.body;
      ctx.font = 'bold ' + (act === 'kick' ? r * 0.3 : r * 0.55) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(label, x, y + r * 0.18);
      padRects.push({ x, y, r: r * 0.85, team: i, act });
    });
  });
  ctx.textAlign = 'left';
}

function startFromTitle() {
  if (screen === 'title' || screen === 'over') { newMatch(); return true; }
  return false;
}
function cycleBall(step) {
  ballSize = (ballSize + step + BALL_MODES.length) % BALL_MODES.length;
  localStorage.setItem('boot_ball', String(ballSize));
  tone(600, 0.06, 'square', 0.06);
}
function cycleCount(step) {
  ballCountIx = (ballCountIx + step + BALL_COUNTS.length) % BALL_COUNTS.length;
  localStorage.setItem('boot_count', String(ballCountIx));
  tone(500 + ballCountIx * 70, 0.06, 'square', 0.06);
}

function cycleGrav(step) {
  gravLevel = (gravLevel + step + GRAVITIES.length) % GRAVITIES.length;
  localStorage.setItem('boot_grav', String(gravLevel));
  tone(400, 0.08, 'sine', 0.06);
}
function cycleSkill(step) {
  aiLevel = (aiLevel + step + AI_LEVELS.length) % AI_LEVELS.length;
  localStorage.setItem('boot_ailevel', String(aiLevel));
  tone(700 + aiLevel * 120, 0.07, 'square', 0.06);
}

function toggleAI(i) {
  ai[i] = !ai[i];
  localStorage.setItem('boot_ai', JSON.stringify(ai));
  tone(ai[i] ? 900 : 400, 0.08, 'square', 0.07);
}

addEventListener('keydown', e => {
  ensureAudio();
  if (screen === 'title' || screen === 'over') {
    if (e.key === ' ') { startFromTitle(); e.preventDefault(); return; }
    if (e.key === 'Escape') { screen = 'title'; return; }
    if (e.key === '1') { cycleBall(1); return; }
    if (e.key === '2') { cycleGrav(1); return; }
    if (e.key === '3') { cycleCount(1); return; }
    if (e.key === '4') { cycleSkill(1); return; }
    if (e.key.toLowerCase() === 'q') { toggleAI(0); return; }
    if (e.key.toLowerCase() === 'p') { toggleAI(1); return; }
  }
  if (e.key === 'Escape') { screen = 'title'; return; }
  held[e.key] = true;
  held[e.key.toLowerCase()] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
addEventListener('keyup', e => {
  held[e.key] = false;
  held[e.key.toLowerCase()] = false;
});
addEventListener('blur', () => { held = {}; });

// ---- touch ----
const touches = new Map();
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  touchMode = touchMode || e.pointerType === 'touch';
  if (screen === 'title' || screen === 'over') {
    for (const b of uiRects) {
      const hit = b.w
        ? (Math.abs(e.clientX - b.x) < b.w && Math.abs(e.clientY - b.y) < (b.h || b.w))
        : Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r;
      if (!hit) continue;
      if (b.aiToggle !== undefined) toggleAI(b.aiToggle);
      else if (b.ball) cycleBall(b.ball);
      else if (b.grav) cycleGrav(b.grav);
      else if (b.count) cycleCount(b.count);
      else if (b.skill) cycleSkill(b.skill);
      return;
    }
    startFromTitle();
    return;
  }
  for (const b of padRects) {
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r) {
      // press the matching key for that player, so touch and keys share
      // exactly the same path through the game
      const t = TEAMS[b.team];
      for (const key in t.keys) if (t.keys[key] === b.act) held[key] = true;
      touches.set(e.pointerId, { team: b.team, act: b.act });
      return;
    }
  }
});
function releaseTouch(e) {
  const t = touches.get(e.pointerId);
  if (!t) return;
  const team = TEAMS[t.team];
  for (const key in team.keys) if (team.keys[key] === t.act) held[key] = false;
  touches.delete(e.pointerId);
}
canvas.addEventListener('pointerup', releaseTouch);
canvas.addEventListener('pointercancel', releaseTouch);
addEventListener('touchstart', () => { touchMode = true; }, { passive: true });

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
players = TEAMS.map((t, i) => newPlayer(i));
balls = makeBalls(0);
requestAnimationFrame(loop);
</script>
