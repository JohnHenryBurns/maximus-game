     what makes it look right mirrored onto a TV. -->

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;              /* no scrollbars - the game IS the page */
      background: #07060a;
      overscroll-behavior: none;     /* stops the phone pulling to refresh */
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;            /* we handle all the finger stuff ourselves */
      font-family: system-ui, sans-serif;
    }

    /* The canvas is the rectangle we're allowed to draw on.
       Everything you see in the game gets painted onto this one thing. */
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Text that sits ON TOP of the canvas. pointer-events:none means
       your finger goes straight through it to the game underneath. */
    #hud {
      position: fixed;
      top: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #ffd98a;
      font-size: 15px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #000;
      pointer-events: none;
    }

    #back {
      position: fixed;
      top: 10px;
      left: 12px;
      color: #8a8aa8;
      font-size: 14px;
      text-decoration: none;
      padding: 6px 10px;
    }
  </style>


<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
  font-size: 13px !important; font-weight: 600 !important; letter-spacing: 0.3px !important;
  line-height: 1 !important; text-decoration: none !important; text-transform: none !important;
  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;
  background: rgba(40, 22, 44, 0.78) !important;
  color: #fff5e8 !important;
}
a.arcade-pill .ah-arrow { font-size: 14px !important; opacity: 0.9 !important; }
/* the floating version, for games that had nowhere to put it */
a.arcade-pill.arcade-float {
  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;
  z-index: 2147483000 !important;
}

<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

  <canvas id="screen"></canvas>
  <div id="hud">MOUSE look &nbsp;&middot;&nbsp; W/S move &nbsp;&middot;&nbsp; A/D strafe &nbsp;&middot;&nbsp; RIGHT-CLICK swings the wrench</div>

<script>
// ===================================================================
//  BOB THE ROBOT PIRATE  -  a 3D boss fight by Maximus
// ===================================================================
//
//  HOW THE 3D WORKS (the only hard bit - read this once):
//
//  The world has three directions instead of two:
//      x  =  left and right
//      y  =  UP and down
//      z  =  forwards and backwards (away from you)
//
//  The screen is flat. It only has two directions. So for every corner
//  of every box, we have to turn (x, y, z) into just (screen x, screen y).
//
//  The trick is DIVIDING BY DISTANCE. Something 2 steps away gets
//  divided by 2. Something 100 steps away gets divided by 100, so it
//  shrinks to almost nothing. That's why far things look small,
//  and that is genuinely the whole secret of 3D.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx    = canvas.getContext('2d');

  let W = 0, H = 0;     // how wide and tall the screen is, in pixels

  function fitCanvas() {
    W = canvas.width  = Math.floor(window.innerWidth);
    H = canvas.height = Math.floor(window.innerHeight);
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();


// -------------------------------------------------------------------
//  THE CAMERA - your eye in the world
// -------------------------------------------------------------------
//  yaw   = which way it's turned (like spinning on a chair)
//  pitch = how far up or down it's tilted (like nodding)
// -------------------------------------------------------------------

  const cam = { x: 0, y: 5, z: -10, yaw: 0, pitch: -0.16 };


// -------------------------------------------------------------------
//  THE HERO - that's you
// -------------------------------------------------------------------

  const hero = {
    x: 0,          // where you are, left to right
    z: 0,          // where you are, forwards and back
    yaw: 0,        // which way you're facing (left and right)
    pitch: 0,      // how far up or down you're looking. + is up.
    walkSpeed: 16, // steps per second. MAKE THIS BIGGER, it's funny.
    turnSpeed: 2.6,// how fast you spin
    bounce: 0,     // ticks up while walking, to bob your head up and down
    swingTimer: 0, // counts down while the wrench is mid-swing
    swingHit: false,// has this swing already connected with something?

    // ---- HEALTH -----------------------------------------------------
    hearts: 5,     // how many you've got left
    maxHearts: 5,  // how many you start with. Change BOTH to get more.

    // INVINCIBILITY. This is the important one.
    //
    // Getting hit doesn't just cost a heart - it makes you untouchable
    // for a moment. Without this, a mini-Bob standing on your foot would
    // take all five hearts in about a twentieth of a second, because the
    // "is he touching me?" check runs sixty times every second and every
    // single one of them would count. Nearly every game you've ever
    // played does this, and you've probably never noticed it - which is
    // exactly the point.
    invuln: 0
  };


// -------------------------------------------------------------------
//  PROJECT - the most important function in the whole game.
//  Give it a point in the 3D world, it tells you where that point
//  lands on your flat screen.
// -------------------------------------------------------------------

  function project(x, y, z) {

    // Step 1: how far is this point from the camera?
    const dx = x - cam.x;
    const dy = y - cam.y;
    const dz = z - cam.z;

    // Step 2: spin it by the camera's yaw, so "forwards" really means
    // the way the camera is looking.
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const rx = dx * cy - dz * sy;   // how far to the RIGHT of the camera
    let   rz = dx * sy + dz * cy;   // how far IN FRONT of the camera
    let   ry = dy;                  // how far ABOVE the camera

    // Step 3: tilt it by the camera's pitch (looking up or down).
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const fz = rz * cp + ry * sp;
    const fy = ry * cp - rz * sp;

    // Step 4: THE MAGIC LINE. Divide by how far in front it is.
    // Big distance -> tiny number -> tiny on screen.
    const focal = H * 0.9;          // bigger number = more zoomed in
    return {
      x: W / 2 + rx * focal / fz,
      y: H / 2 - fy * focal / fz,   // minus, because screen y grows DOWNWARDS
      depth: fz                     // remember the distance, we need it later
    };
  }


// -------------------------------------------------------------------
//  THE FACE LIST
//  Every flat surface we want to draw this frame goes in here first.
//  Then we sort them furthest-away-first and paint them in that order,
//  so near things cover up far things. Painters do exactly this:
//  sky first, then hills, then the tree in front. It even has a name -
//  the "painter's algorithm".
// -------------------------------------------------------------------

  let faces = [];

  // Take a colour like [200, 60, 60] and make it darker or lighter.
  // Sides of a box get different brightness, which is what makes your
  // brain believe it's a solid object and not a flat blob.
  function shade(rgb, amount) {
    return 'rgb(' + (rgb[0] * amount | 0) + ',' +
                    (rgb[1] * amount | 0) + ',' +
                    (rgb[2] * amount | 0) + ')';
  }

  // Add one flat shape (given its corners in 3D) to the list.
  //
  // "lift" is a cheat. A shape painted flat on the deck is the same
  // distance away as the plank underneath it, so the sorting can't
  // decide which goes on top and they flicker at each other. Lift
  // fibs about the distance - "pretend I'm half a step nearer" - and
  // the shape always wins. Every 3D engine has a trick like this.
  function addFace(points3d, colour, lift) {
    const flat = [];
    let total = 0;

    for (const p of points3d) {
      const s = project(p[0], p[1], p[2]);
      // If any corner is behind the camera the maths goes haywire and
      // the shape smears across the screen. Easiest fix: skip it.
      if (s.depth < 0.4) return;
      flat.push(s);
      total += s.depth;
    }

    faces.push({
      points: flat,
      depth: total / flat.length - (lift || 0),   // average distance, for sorting
      colour: colour
    });
  }


// -------------------------------------------------------------------
//  ADD BOX - everything in this game is made of boxes.
//  You, Bob, the masts, the barrels. All boxes.
// -------------------------------------------------------------------
//  cx, cy, cz = where the middle of the box is
//  w, h, d    = how wide, how tall, how deep
//  rgb        = its colour, like [180, 40, 40]
//  spin       = optional: turn the box on the spot
// -------------------------------------------------------------------

  function addBox(cx, cy, cz, w, h, d, rgb, spin, tilt) {
    spin = spin || 0;      // turning left and right, like shaking your head "no"
    tilt = tilt || 0;      // nodding up and down, like nodding "yes"

    const hw = w / 2, hh = h / 2, hd = d / 2;
    const c  = Math.cos(spin), s  = Math.sin(spin);
    const ct = Math.cos(tilt), st = Math.sin(tilt);

    // The 8 corners of a box, measured from its own middle.
    const local = [
      [-hw, -hh, -hd], [ hw, -hh, -hd], [ hw, -hh,  hd], [-hw, -hh,  hd],
      [-hw,  hh, -hd], [ hw,  hh, -hd], [ hw,  hh,  hd], [-hw,  hh,  hd]
    ];

    // Nod each corner first, THEN turn it, then move it to where the
    // box really lives. The order matters: nod-then-turn is a head
    // looking up. Turn-then-nod is a head falling off sideways.
    const world = local.map(function (p) {
      const ty = p[1] * ct - p[2] * st;
      const tz = p[1] * st + p[2] * ct;
      return [
        cx + p[0] * c + tz * s,
        cy + ty,
        cz - p[0] * s + tz * c
      ];
    });

    // A box has 6 sides. Each one is 4 of those corners.
    // The number on the end is how bright that side is:
    // the top catches the most light, the bottom is in shadow.
    const sides = [
      [[4, 5, 6, 7], 1.00],   // top
      [[0, 4, 5, 1], 0.72],   // front
      [[2, 6, 7, 3], 0.58],   // back
      [[3, 7, 4, 0], 0.86],   // left
      [[1, 5, 6, 2], 0.66],   // right
      [[0, 1, 2, 3], 0.40]    // bottom
    ];

    for (const [idx, light] of sides) {
      addFace([world[idx[0]], world[idx[1]], world[idx[2]], world[idx[3]]],
              shade(rgb, light));
    }
  }


// -------------------------------------------------------------------
//  THE SHIP - a big wooden deck floating on the sea
// -------------------------------------------------------------------

  const DECK = 20;        // the deck goes from -20 to +20. It's big.
  const PLANK = 2.5;      // how wide each wooden plank is
  const WATER_Y = -1.5;   // the height of the sea. The deck floats just above it.

  function drawDeck() {
    // Lay the deck out as a grid of planks. Two slightly different
    // browns, swapped every other plank, so you can see the woodgrain
    // and tell that you're actually moving.
    for (let x = -DECK; x < DECK; x += PLANK) {
      for (let z = -DECK; z < DECK; z += PLANK) {

        // Skip planks that are behind you - no point doing the maths
        // for wood you can't even see. This keeps the game fast.
        const away = Math.hypot(x - cam.x, z - cam.z);
        if (away > 70) continue;

        const stripe = (Math.round(x / PLANK) % 2 === 0);
        const wood = stripe ? [104, 72, 44] : [92, 63, 38];

        addFace([[x, 0, z], [x + PLANK, 0, z],
                 [x + PLANK, 0, z + PLANK], [x, 0, z + PLANK]],
                shade(wood, 1));
      }
    }

    // A railing all the way round so you can't fall in the sea.
    for (let i = -DECK; i <= DECK; i += PLANK) {
      addBox(i, 0.9, -DECK, 0.5, 1.8, 0.5, [70, 48, 30]);
      addBox(i, 0.9,  DECK, 0.5, 1.8, 0.5, [70, 48, 30]);
      addBox(-DECK, 0.9, i, 0.5, 1.8, 0.5, [70, 48, 30]);
      addBox( DECK, 0.9, i, 0.5, 1.8, 0.5, [70, 48, 30]);
    }

    // The hull - four dark walls that go down under the water, so the
    // deck looks like a ship instead of a floating rug.
    addBox(0, -2.5, -DECK, DECK * 2, 4, 1.2, [58, 40, 26]);
    addBox(0, -2.5,  DECK, DECK * 2, 4, 1.2, [58, 40, 26]);
    addBox(-DECK, -2.5, 0, 1.2, 4, DECK * 2, [58, 40, 26]);
    addBox( DECK, -2.5, 0, 1.2, 4, DECK * 2, [58, 40, 26]);

    // Two masts, so it looks like a real pirate ship.
    addBox(-13, 9, -13, 1.4, 18, 1.4, [78, 54, 32]);
    addBox( 13, 9, -13, 1.4, 18, 1.4, [78, 54, 32]);

    // A couple of barrels to bump into.
    addBox(-8, 1.3,  6, 2.4, 2.6, 2.4, [96, 66, 40]);
    addBox( 9, 1.3, -4, 2.4, 2.6, 2.4, [96, 66, 40]);
  }


// -------------------------------------------------------------------
//  THE HERO'S BODY - you, built out of six boxes
// -------------------------------------------------------------------

  // Slide smoothly from one number to another. t = 0 gives you a,
  // t = 1 gives you b, and 0.5 gives you exactly halfway.
  function mix(a, b, t) {
    return a + (b - a) * Math.max(0, Math.min(1, t));
  }

  // Turn a spot measured ON YOU into a spot in the world - same idea as
  // bobBox, just for the little guy.
  function heroPoint(ox, oz) {
    const c = Math.cos(hero.yaw), s = Math.sin(hero.yaw);
    return [hero.x + ox * c + oz * s, hero.z - ox * s + oz * c];
  }

  function drawHero() {
    // BLINKING while you're untouchable.
    //
    // invuln counts down from 1.3 to 0. Multiplying it by 18 makes it
    // race, and the % 1 chops off the whole numbers so what's left just
    // sweeps 0 -> 1 over and over. Draw yourself only during half of
    // each sweep and you flicker. Fast blinking is how every game says
    // "you're hurt, but you're safe for a second".
    if (hero.invuln > 0 && (hero.invuln * 18) % 1 < 0.5) return;

    const y = hero.yaw;

    // While walking, hero.bounce ticks upwards. sin() turns a
    // number that keeps rising into a wave that goes up-down-up-down,
    // which is a really easy way to make anything bounce about.
    //
    // (This used to be called "bob", which shadowed BOB. Two different
    // things with the same name is how you lose an afternoon.)
    const bounce = Math.sin(hero.bounce * 9) * 0.12;
    const swing = Math.sin(hero.bounce * 9) * 0.5;   // arms and legs swinging

    const px = hero.x, pz = hero.z;

    // legs (they swing opposite ways, like real legs)
    addBox(px + Math.cos(y) * 0.35, 0.75 + swing * 0.1, pz - Math.sin(y) * 0.35,
           0.5, 1.5, 0.5, [50, 60, 120], y);
    addBox(px - Math.cos(y) * 0.35, 0.75 - swing * 0.1, pz + Math.sin(y) * 0.35,
           0.5, 1.5, 0.5, [50, 60, 120], y);

    // body
    addBox(px, 2.2 + bounce, pz, 1.4, 1.6, 0.9, [200, 70, 60], y);

    // left arm swings with the walk
    addBox(px - Math.cos(y) * 0.95, 2.3 + bounce - swing * 0.15, pz + Math.sin(y) * 0.95,
           0.42, 1.3, 0.42, [225, 180, 150], y);

    // right arm holds the wrench, so it swings with the WRENCH instead
    const wa = wrenchAngle();
    addBox(px + Math.cos(y) * 0.95, 2.3 + bounce + Math.cos(wa) * 0.35,
           pz - Math.sin(y) * 0.95, 0.42, 1.3, 0.42, [225, 180, 150], y);

    // head
    addBox(px, 3.4 + bounce, pz, 0.95, 0.95, 0.95, [235, 195, 165], y);

    drawWrench(wa, bounce);
  }


// -------------------------------------------------------------------
//  THE WRENCH
// -------------------------------------------------------------------
//  Your one and only weapon. It sits in your right hand, and when you
//  swing it, it goes up over your shoulder and then chops down.
//
//  The whole swing is ONE ANGLE that moves through three stages:
//     rest -> raised up behind you -> chopped down -> back to rest
// -------------------------------------------------------------------

  const SWING_TIME  = 0.42;     // how long one whole swing takes
  const WRENCH_REST = 1.9;      // resting angle: held forward and down

  function wrenchAngle() {
    if (hero.swingTimer <= 0) return WRENCH_REST;

    // p walks from 0 at the start of the swing to 1 at the end.
    const p = 1 - hero.swingTimer / SWING_TIME;

    if (p < 0.30) return mix(WRENCH_REST, -0.4, p / 0.30);       // heave it up
    if (p < 0.55) return mix(-0.4, 2.6, (p - 0.30) / 0.25);      // CHOP
    return mix(2.6, WRENCH_REST, (p - 0.55) / 0.45);             // back to rest
  }

  function drawWrench(a, bounce) {
    // Which way the wrench is pointing, measured on YOU.
    // a = 0 points straight up, a = 1.57 points straight forward.
    const dirY = Math.cos(a), dirZ = -Math.sin(a);

    const handY = 1.95 + bounce;
    const handX = 0.95, handZ = 0.25;

    // Walk out along the wrench and drop a box at each stop.
    // The "tilt" we hand addBox is -a, which leans each box over to
    // match the direction we just worked out.
    function piece(along, w, h, d, rgb, sideways) {
      const lx = handX + (sideways || 0);
      const lz = handZ + dirZ * along;
      const p = heroPoint(lx, lz);
      addBox(p[0], handY + dirY * along, p[1], w, h, d, rgb, hero.yaw, -a);
    }

    piece(0.85, 0.24, 1.7, 0.24, [96, 100, 112]);      // the handle
    piece(1.80, 0.85, 0.55, 0.45, [168, 174, 190]);    // the head
    piece(2.15, 0.24, 0.55, 0.42, [168, 174, 190], -0.3);   // jaw
    piece(2.15, 0.24, 0.55, 0.42, [168, 174, 190],  0.3);   // jaw
  }

  function swingWrench() {
    if (state !== 'fight') return;
    if (hero.swingTimer > 0) return;      // one swing at a time
    hero.swingTimer = SWING_TIME;
    hero.swingHit = false;                // this swing hasn't connected yet
    playNoise(0.18, 900, 3000, 0.12);     // a little whoosh
  }


// ===================================================================
//  BOB THE ROBOT PIRATE
// ===================================================================
//  Bob is about SIX TIMES your height. He is made of 40-odd boxes.
//
//  Everything about him is measured from his FEET, not from the middle
//  of the world. That means when we move his feet upwards, every single
//  bit of him comes along for the ride - which is exactly what we need
//  to make him rise up out of the sea.
// ===================================================================

  const bob = {
    x: 0,
    z: 34,              // out in the sea, past the back railing
    y: -34,             // where his FEET are. He starts DEEP under the sea.
    yaw: 0,             // which way he's turned. 0 = looking at the ship.
    scale: 2.5,         // HOW BIG HE IS. 1 = the size he was built. This is
                        // the single most fun number in the entire file.
    mouth: 0,           // 0 = jaw shut, 1 = jaw hanging wide open
    headPitch: 0,       // 0 = looking at you, 1.1 = craning up at the sky
    sway: 0,            // ticks up forever, used to make him creak about
    armGone: false,     // true once you've torn the hook arm off him
    arm2Gone: false,    // true once the SECOND arm is off as well
    // ---- THE ENDGAME ------------------------------------------------
    // These four go off in order, and each one is a point of no return.
    biteCount: 0,       // how many times he's chomped the deck
    mouthStuck: false,  // true when his jaws are buried in the planks
    headHits: 0,        // wrench swings landed on his stuck head
    headGone: false,    // ...and that's the end of Bob.

    hatched: false,     // true once he's let the little ones out
    chestOpen: 0,       // 0 = chest shut, 1 = doors wide open
    hasCannon: false,   // true once he's fished the cannon up out of the sea.
                        // He never puts it down again, so this only ever
                        // goes from false to true - once.
    activeArm: 1        // which arm is doing the attacking right now.
                        // +1 = his hook arm. -1 = his claw arm. When you
                        // rip the first one off, this flips to -1 and he
                        // just carries on with the other one. Rude.
  };

  // Bob's colours, all in one place so they're easy to fiddle with.
  const IRON   = [122, 126, 138];
  const DARK   = [ 74,  78,  90];
  const RUST   = [146,  88,  52];
  const GOLD   = [206, 164,  62];
  const BLACK  = [ 38,  32,  40];
  const BONE   = [226, 222, 208];
  const SKULL  = [198, 194, 180];   // his face - old iron gone bone-coloured
  const SOCKET = [ 20,  16,  22];   // the black pits his eyes glow out of
  const GLOW   = [255,  70,  48];

  // Put one box on Bob, measured from his feet.
  function bobBox(ox, oy, oz, w, h, d, rgb, tilt) {

    // MAKE HIM BIGGER. Every measurement gets multiplied by his scale -
    // how far out the box sits AND how big the box is. Both have to be
    // multiplied. Scale only the sizes and he turns into a fat man;
    // scale only the positions and he explodes into loose parts.
    const S = bob.scale;
    ox *= S; oy *= S; oz *= S;
    w  *= S; h  *= S; d  *= S;

    const c = Math.cos(bob.yaw), s = Math.sin(bob.yaw);
    const wx = bob.x + ox * c + oz * s;
    const wz = bob.z - ox * s + oz * c;
    let   wy = bob.y + oy;

    // THE UNDERWATER TRICK:
    // We simply don't draw anything below the water line. A box that's
    // half under gets chopped down to just its top half. That's all it
    // takes to make him look like he's rising out of the sea - there's
    // no clever water code at all, we just hide the bits underneath.
    const top = wy + h / 2;
    let bottom = wy - h / 2;
    if (top <= WATER_Y) return;         // completely under - draw nothing
    if (bottom < WATER_Y) {             // sticking half out - shrink it
      bottom = WATER_Y;
      h = top - bottom;
      wy = bottom + h / 2;
    }

    addBox(wx, wy, wz, w, h, d, rgb, bob.yaw, tilt || 0);
  }


// -------------------------------------------------------------------
//  BOB'S NECK JOINT
// -------------------------------------------------------------------
//  Here's the problem: if you just move Bob's head upwards, it comes
//  off. A head doesn't slide - it SWINGS, on a hinge at the neck.
//
//  So for every box in his head we measure how far it is from the neck
//  joint, swing that gap round by the nod angle, and put the box at the
//  new spot. His hat is further from the joint than his teeth are, so
//  the hat travels further. That's what makes it look like one solid
//  head instead of a pile of parts drifting about.
// -------------------------------------------------------------------

  const NECK = 19.3;      // how high above his feet the neck joint is

  // Where does a point in Bob's head end up after he's nodded?
  function headLocal(oy, oz) {
    const p = bob.headPitch;
    const c = Math.cos(p), s = Math.sin(p);
    const gap = oy - NECK;                  // how far above the joint it started
    return {
      y: NECK + gap * c - oz * s,
      z: gap * s + oz * c
    };
  }

  // Same as bobBox, but the box swings with his head.
  function headBox(ox, oy, oz, w, h, d, rgb) {
    const moved = headLocal(oy, oz);
    bobBox(ox, moved.y, moved.z, w, h, d, rgb, bob.headPitch);
  }

  // What yaw would have Bob staring straight at you?
  //
  // The front of Bob - his face - is the local -z side of all his boxes.
  // Spin that by his yaw and it points along ( -sin(yaw), -cos(yaw) ).
  // We want that to point at the hero, so we flip the signs of the gap
  // between them and hand it to atan2, which turns an arrow back into
  // an angle. atan2 is the "which way is that?" function.
  function yawTowardsHero() {
    return Math.atan2(bob.x - hero.x, bob.z - hero.z);
  }

  // Turn one angle towards another WITHOUT spinning the long way round.
  // If he's facing left and you run right, the gap can come out as 350
  // degrees when it's really just -10. These two while loops drag the
  // difference back into the "shortest way round" range.
  function turnTowards(now, target, speed, dt) {
    let gap = target - now;
    while (gap >  Math.PI) gap -= Math.PI * 2;
    while (gap < -Math.PI) gap += Math.PI * 2;
    return now + gap * Math.min(1, speed * dt);
  }

  // ONE function that draws EITHER of Bob's arms.
  //
  // "side" is +1 for the arm on his right, -1 for the arm on his left.
  // Every left-right number gets multiplied by it, so the same code
  // builds a mirror image on the other side. That one little trick is
  // why we don't need two copies of all this.
  //
  // An arm can be in one of three states, so this does three things:
  //   1. TORN OFF  - a sparking stump
  //   2. ACTIVE    - the bendy chain arm that winds up and SMASHES
  //   3. just hanging - a plain arm with a claw on the end
  function drawArm(side, gone, creak) {

    // ---- 1. TORN OFF ------------------------------------------------
    if (gone) {
      bobBox(6.6 * side, 17.0, 0, 3.4, 3.4, 3.4, DARK);         // shoulder ball
      bobBox(6.6 * side, 15.4, 0, 2.6, 1.8, 2.6, [92, 60, 44]); // torn metal

      // Sparks, flickering on and off at random. Math.random() gives a
      // number from 0 to 1, so "< 0.5" means about half the frames.
      if (Math.random() < 0.5) {
        bobBox(6.6 * side + (Math.random() - 0.5) * 2,
               14.4 + Math.random(),
               (Math.random() - 0.5) * 2,
               0.5, 0.5, 0.5, [255, 220, 120]);
      }
      return;          // stump drawn - nothing else to do, so stop here
    }

    // ---- 2. THE ATTACKING ARM ---------------------------------------
    // Only ONE arm attacks at a time. bob.activeArm says which.
    if (side === bob.activeArm) {
      // This arm isn't welded pointing down. It's a CHAIN of blocks
      // marching away from the shoulder in whatever direction we point
      // them. Same code hangs it by his side, winds it over his head,
      // or drives it into the deck.
      bobBox(attack.armX, 17.0, 0, 3.4, 3.4, 3.4, DARK);   // shoulder ball

      // Turn the arm's angle into an arrow. Angle 0 points straight down.
      const armY = -Math.cos(attack.armPitch);
      const armZ = -Math.sin(attack.armPitch);

      const links = 8;
      for (let i = 1; i <= links; i++) {
        const far = (i / links) * attack.armLen;    // how far down the arm
        bobBox(attack.armX, 17.0 + armY * far, armZ * far,
               2.5, 2.5, 2.5, i > links - 2 ? DARK : IRON);
      }

      // The hook itself, stuck on the far end of the chain.
      const tipFar = attack.armLen + 1.4;
      const tipY = 17.0 + armY * tipFar;
      const tipZ = armZ * tipFar;
      bobBox(attack.armX, tipY, tipZ, 1.8, 1.8, 1.8, BONE);
      bobBox(attack.armX + 1.5 * side, tipY + armY * 1.2, tipZ + armZ * 1.2,
             1.3, 2.6, 1.3, BONE);
      return;
    }

    // ---- 3. THE SPARE ARM, just hanging there ------------------------
    // Ends in a grabbing claw. Waiting its turn.
    bobBox(6.6 * side, 17.0, 0, 3.2, 3.2, 3.2, DARK);           // shoulder
    bobBox(6.8 * side, 12.6 + creak, 0, 2.4, 7.0, 2.4, IRON);   // arm
    bobBox(7.4 * side, 8.8 + creak, 0, 1.0, 2.2, 1.0, DARK);    // claw finger
    bobBox(6.2 * side, 8.8 + creak, 0, 1.0, 2.2, 1.0, DARK);    // claw finger
  }

  function drawBob() {
    // A slow creak from side to side so he never looks frozen.
    const creak = Math.sin(bob.sway * 0.8) * 0.25;
    const jaw   = bob.mouth * 1.5;      // how far the jaw hatch drops

    // ---- LEGS -------------------------------------------------------
    // His left leg is a proper metal leg...
    bobBox(-2.6, 4.5, 0, 3.0, 9, 3.0, IRON);
    bobBox(-2.6, 0.6, 0.4, 3.6, 1.2, 4.4, DARK);      // iron boot

    // ...and his right leg is a PEG LEG, because he is a pirate.
    bobBox( 2.6, 6.5, 0, 3.0, 5, 3.0, IRON);          // thigh
    bobBox( 2.6, 2.4, 0, 1.3, 4, 1.3, [92, 64, 40]);  // wooden peg
    bobBox( 2.6, 0.5, 0, 1.9, 0.7, 1.9, [78, 54, 32]);// the foot of the peg

    // ---- BODY -------------------------------------------------------
    bobBox(0, 10.2 + creak * 0.2, 0, 8.0, 2.6, 4.4, DARK);   // hips
    bobBox(0, 14.6, 0, 11.0, 7.2, 5.4, IRON);                // chest
    bobBox(0, 12.4, 0.2, 11.2, 1.0, 5.6, RUST);              // rust stripe

    // Rivets. Little bolts holding him together.
    for (const rx of [-4.2, 0, 4.2]) {
      bobBox(rx, 17.4, -2.8, 0.7, 0.7, 0.7, DARK);
      bobBox(rx, 11.9, -2.8, 0.7, 0.7, 0.7, DARK);
    }

    // A glowing power core in the middle of his chest.
    // This is almost certainly going to be his weak spot later...
    bobBox(0, 14.8, -2.9, 2.4, 2.4, 0.5, GLOW);
    bobBox(0, 14.8, -2.7, 3.4, 3.4, 0.4, GOLD);

    // A gold belt, because pirates.
    bobBox(0, 11.0, -2.5, 8.4, 1.6, 0.5, GOLD);
    bobBox(0, 11.0, -2.7, 2.0, 2.4, 0.4, BLACK);   // buckle

    // ---- ARMS -------------------------------------------------------
    // Both arms are drawn by the SAME function. It just gets told which
    // side it's on: +1 is his hook arm, -1 is his claw arm. One lot of
    // code, two arms - so when he switches arms, everything already
    // works. Writing this twice would have meant fixing it twice.
    drawArm( 1, bob.armGone,  creak);
    drawArm(-1, bob.arm2Gone, creak);

    // ---- THE CHEST HATCH --------------------------------------------
    // Shut, this draws nothing at all and he looks completely normal.
    // Open, two iron doors slide apart and there's a black hole where
    // his insides should be.
    if (bob.chestOpen > 0.01) {
      const o = bob.chestOpen;

      // THE FRONT OF HIS CHEST IS AT z = -2.7. Anything we want to SEE
      // has to sit in front of that - a smaller z. Put this at -2.3 and
      // the hole is inside him, hidden by his own chest, and you'd swear
      // the code was broken when it's really just buried.
      bobBox(0, 14.6, -2.95, 8.2, 5.8, 0.6, [10, 8, 12]);   // the dark inside

      // The doors slide further apart the more "open" he is. At o = 0
      // they sit shut in the middle; at o = 1 they're right out at the
      // edges of his chest. And they're in front of the hole, obviously,
      // or they'd be doors on the inside.
      bobBox(-2.2 - o * 3.2, 14.6, -3.4, 4.2, 5.8, 0.7, IRON);
      bobBox( 2.2 + o * 3.2, 14.6, -3.4, 4.2, 5.8, 0.7, IRON);
    }

    // The cannon, but only once he's actually dredged it up.
    if (bob.hasCannon) drawCannon(attack.cannonUp);

    // ---- HEAD: AN IRON SKULL ----------------------------------------
    // A real skull is wide and round at the top and narrow at the
    // bottom, so we use two boxes: a big cranium and a narrower face.
    bobBox(0, 18.8, 0, 2.6, 1.6, 2.6, DARK);                 // neck (doesn't nod)

    // NO HEAD, NO REST OF THIS FUNCTION.
    //
    // The head happens to be the very last thing we draw on him, so
    // "stop here" is all it takes to remove it - the neck stump above
    // is already drawn and everything below is skipped. Putting the
    // head last wasn't planned for this. It just paid off.
    if (bob.headGone) return;

    headBox(0, 22.6, 0, 6.2, 3.2, 5.0, SKULL);               // cranium
    headBox(0, 20.6, 0.2, 5.0, 1.8, 4.6, SKULL);             // the face part

    // A heavy brow ridge across the top. This is what makes him look
    // ANGRY instead of surprised - it's basically an eyebrow.
    headBox(0, 23.3, -2.5, 6.0, 0.7, 0.6, SKULL);

    // Cheekbones, one either side.
    headBox(-2.5, 21.2, -2.2, 1.1, 1.6, 0.7, SKULL);
    headBox( 2.5, 21.2, -2.2, 1.1, 1.6, 0.7, SKULL);

    // ---- TWO GLOWING RED EYES ---------------------------------------
    // Each eye is three boxes stacked front to back:
    //   1. a pitch-black socket sunk into the skull
    //   2. a dim red halo, so the light looks like it's spilling out
    //   3. the bright red eye itself, poking out at the front
    for (const ex of [-1.6, 1.6]) {
      headBox(ex, 22.3, -2.60, 2.3, 2.3, 0.5, SOCKET);
      headBox(ex, 22.3, -2.78, 1.9, 1.9, 0.4, [150, 30, 25]);
      headBox(ex, 22.3, -2.95, 1.2, 1.2, 0.4, GLOW);
    }

    // A dark triangle of a nose hole.
    headBox(0, 21.4, -2.45, 0.9, 1.0, 0.5, SOCKET);
    headBox(0, 20.9, -2.45, 0.5, 0.6, 0.5, SOCKET);

    // ---- TEETH -------------------------------------------------------
    // Six teeth in the top jaw, with gaps between them. A loop, because
    // typing out six almost-identical lines would be silly.
    for (let i = 0; i < 6; i++) {
      headBox(-2.1 + i * 0.84, 19.9, -2.35, 0.62, 1.2, 0.5, BONE);
    }

    // The blackness inside his mouth. This is the missile tube.
    headBox(0, 19.4, -2.1, 4.4, 1.6, 0.4, BLACK);

    // The bottom jaw. It hinges down when mouth = 1, and it takes its
    // own row of teeth with it. Notice how "- jaw" appears on every
    // line here - that's what makes the whole jaw move as one piece.
    headBox(0, 18.7 - jaw, -1.8 - jaw * 0.5, 4.8, 1.1, 2.6, SKULL);
    for (let i = 0; i < 6; i++) {
      headBox(-2.1 + i * 0.84, 19.5 - jaw, -2.35 - jaw * 0.5, 0.62, 1.1, 0.5, BONE);
    }

    // ---- THE HAT ----------------------------------------------------
    // A tricorn: a flat brim, a lump on top, and three turned-up corners.
    headBox(0, 24.2, 0, 9.0, 0.7, 8.0, BLACK);               // brim
    headBox(0, 25.4, 0, 5.6, 2.2, 5.0, BLACK);               // the crown
    headBox(0, 25.0, -4.0, 6.0, 2.0, 0.8, BLACK);            // front corner
    headBox(-4.4, 25.0, 1.4, 0.8, 2.0, 5.0, BLACK);          // left corner
    headBox( 4.4, 25.0, 1.4, 0.8, 2.0, 5.0, BLACK);          // right corner
    headBox(0, 24.6, -4.3, 6.2, 0.4, 0.4, GOLD);             // gold trim

    // A little skull and crossbones on the front of the hat.
    headBox(0, 25.7, -4.3, 1.4, 1.4, 0.4, BONE);
    headBox(-1.3, 25.2, -4.3, 2.6, 0.4, 0.4, BONE);
    headBox( 1.3, 25.2, -4.3, 2.6, 0.4, 0.4, BONE);
  }


// -------------------------------------------------------------------
//  THE SKY AND THE SEA
//  These are just two big rectangles painted before anything else.
//  The horizon slides up and down when the camera tilts.
// -------------------------------------------------------------------

  function drawBackground() {
    const focal = H * 0.9;
    const horizon = H / 2 + focal * Math.tan(cam.pitch);

    const sky = ctx.createLinearGradient(0, 0, 0, Math.max(horizon, 1));
    sky.addColorStop(0, '#1b2a52');
    sky.addColorStop(1, '#8a6a9a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon);

    const sea = ctx.createLinearGradient(0, horizon, 0, H);
    sea.addColorStop(0, '#2a4468');
    sea.addColorStop(1, '#12203a');
    ctx.fillStyle = sea;
    ctx.fillRect(0, horizon, W, H - horizon);
  }


// ===================================================================
//  SOUND
// ===================================================================
//  Browsers refuse to make noise until you've tapped the page at least
//  once. That's why the game starts on a title screen - the tap that
//  starts the game is also the tap that switches the sound on.
// ===================================================================

  let audio = null;
  let noiseClip = null;

  function startAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();

    // A bucket of random numbers played as sound is STATIC - that
    // shhhhh noise. Squash the high notes out of it and it becomes
    // the sea. Squash the low notes and it becomes an explosion.
    noiseClip = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const data = noiseClip.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }

  function playNoise(seconds, fromHz, toHz, volume) {
    if (!audio) return;
    const src = audio.createBufferSource();
    src.buffer = noiseClip;
    const filter = audio.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(fromHz, audio.currentTime);
    filter.frequency.exponentialRampToValueAtTime(toHz, audio.currentTime + seconds);
    const gain = audio.createGain();
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + seconds);
    src.connect(filter); filter.connect(gain); gain.connect(audio.destination);
    src.start();
    src.stop(audio.currentTime + seconds);
  }

  function playTone(fromHz, toHz, seconds, volume, shape) {
    if (!audio) return;
    const osc = audio.createOscillator();
    osc.type = shape || 'sawtooth';
    osc.frequency.setValueAtTime(fromHz, audio.currentTime);
    osc.frequency.exponentialRampToValueAtTime(toHz, audio.currentTime + seconds);
    const gain = audio.createGain();
    gain.gain.setValueAtTime(volume, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + seconds);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + seconds);
  }

// ===================================================================
//  THE ROCK BAND
// ===================================================================
//  There's no music FILE in this game. Downloading one would break the
//  "works offline, works instantly" rule. So we build a band instead.
//
//  A rock band is really just five machines:
//    GUITAR - buzzy sawtooth waves, squashed until they crunch
//    BASS   - one soft low note per chord
//    KICK   - a sine wave sliding from high to low, very fast
//    SNARE  - a short burst of static with the low end cut off
//    HI-HAT - a VERY short burst of static, only the top end left
//
//  Then something has to tell them all when to play. That's the
//  SEQUENCER at the bottom: it walks through a list of notes, sixteen
//  steps to a bar, and books each sound in slightly before it's due.
// ===================================================================

  let musicGain = null;      // the volume knob for the whole band
  let crunch = null;         // the guitar amp
  let musicOn = false;
  let musicStep = 0;
  let musicNextTime = 0;
  let musicTimer = null;

  const BPM  = 152;
  const STEP = 60 / BPM / 4;      // one sixteenth note, in seconds

  // Notes are MIDI numbers. 40 is a low E, and every +1 is one fret up.
  // null means "no note here" - a rest.
  //
  // THIS IS THE RIFF. Change these numbers and the song changes.
  const E = 40, G = 43, A = 45, B = 47, D = 38, F = 41, C = 48;
  const RIFF = [
    E, null, E, null,  E, null, E, null,  E, null, G, null,  A, null, G, null,
    E, null, E, null,  E, null, E, null,  E, null, A, null,  B, null, A, null,
    D, null, D, null,  D, null, D, null,  D, null, F, null,  G, null, F, null,
    E, null, E, null,  G, null, A, null,  B, null, C, null,  B, A,    G, null
  ];

  // Which steps of each bar the drums hit on.
  const KICK_ON  = [0, 6, 8, 14];
  const SNARE_ON = [4, 12];

  // Turn a MIDI note number into an actual frequency in hertz.
  // Going up 12 notes doubles the number - that's an octave.
  function midiHz(n) {
    return 440 * Math.pow(2, (n - 69) / 12);
  }

  function buildBand() {
    if (crunch) return;

    musicGain = audio.createGain();
    musicGain.gain.value = 0.40;      // sit the band under the sound effects
    musicGain.connect(audio.destination);

    // THE DISTORTION. A clean wave is a smooth curve. Squash the tops
    // and bottoms flat and it buzzes - that's ALL an electric guitar's
    // crunch is. tanh() is a squashing curve: little numbers go through
    // untouched, big ones get flattened.
    const shaper = audio.createWaveShaper();
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * 4.5);
    }
    shaper.curve = curve;

    // Roll the harshest top end off, like a real amp's speaker.
    const tone = audio.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.value = 2500;

    shaper.connect(tone);
    tone.connect(musicGain);
    crunch = shaper;
  }

  // A POWER CHORD: the note, plus the note seven frets up. Two notes.
  // That's the sound of basically every rock song ever written.
  function guitar(note, when, len) {
    const hz = midiHz(note);
    for (const step of [1, 1.4983]) {          // 1.4983 = seven frets up
      for (const detune of [-7, 7]) {          // two slightly-out-of-tune
        const o = audio.createOscillator();    // copies = a fatter sound
        o.type = 'sawtooth';
        o.frequency.value = hz * step;
        o.detune.value = detune;

        const g = audio.createGain();
        g.gain.setValueAtTime(0.0001, when);
        g.gain.exponentialRampToValueAtTime(0.16, when + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, when + len);

        o.connect(g); g.connect(crunch);
        o.start(when); o.stop(when + len + 0.02);
      }
    }
  }

  function bassNote(note, when, len) {
    const o = audio.createOscillator();
    o.type = 'triangle';
    o.frequency.value = midiHz(note - 12);     // one octave down
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.30, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + len);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + len + 0.02);
  }

  // A sine wave falling from 165Hz to 45Hz in a tenth of a second.
  // Your ear doesn't hear a note, it hears a THUMP.
  function kick(when) {
    const o = audio.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(165, when);
    o.frequency.exponentialRampToValueAtTime(45, when + 0.10);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.95, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.19);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when + 0.21);
  }

  // Static with the low end cut away. Cut at 1400Hz for a snare...
  function snare(when) {
    hitOfStatic(when, 1400, 0.48, 0.16);
  }
  // ...and cut way up at 7500Hz, much shorter, for a hi-hat.
  function hat(when) {
    hitOfStatic(when, 7500, 0.13, 0.045);
  }

  function hitOfStatic(when, cutHz, volume, len) {
    const s = audio.createBufferSource();
    s.buffer = noiseClip;
    const f = audio.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = cutHz;
    const g = audio.createGain();
    g.gain.setValueAtTime(volume, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + len);
    s.connect(f); f.connect(g); g.connect(musicGain);
    s.start(when, Math.random());     // start somewhere random in the static
    s.stop(when + len + 0.02);
  }

  // Play everything that happens on one step of the song.
  function playStep(i, when) {
    const note = RIFF[i];
    if (note !== null && note !== undefined) {
      guitar(note, when, STEP * 1.9);
      bassNote(note, when, STEP * 1.9);
    }

    const beat = i % 16;                       // where we are in the bar
    if (KICK_ON.indexOf(beat) >= 0) kick(when);
    if (SNARE_ON.indexOf(beat) >= 0) snare(when);
    if (beat % 2 === 0) hat(when);
  }

  // THE SEQUENCER.
  //
  // We can't just play a note the instant it's due - the game might be
  // busy drawing a frame and the note would land late, and late notes
  // sound TERRIBLE. So instead we run ahead: every 25 milliseconds we
  // look a tenth of a second into the future and BOOK every note due in
  // that window. The sound card plays them at exactly the right moment.
  function musicScheduler() {
    if (!musicOn || !audio) return;
    while (musicNextTime < audio.currentTime + 0.12) {
      playStep(musicStep, musicNextTime);
      musicNextTime += STEP;
      musicStep = (musicStep + 1) % RIFF.length;
    }
  }

  function startMusic() {
    if (!audio || musicOn) return;
    buildBand();
    musicOn = true;
    musicStep = 0;
    musicNextTime = audio.currentTime + 0.06;
    musicTimer = setInterval(musicScheduler, 25);
  }

  function toggleMusic() {
    if (!musicGain) return;
    musicGain.gain.value = musicGain.gain.value > 0 ? 0 : 0.40;
  }


  function soundRise()   { playTone(46, 24, 3.2, 0.22);           playNoise(3.2, 500, 110, 0.30); }
  function soundLaunch() { playTone(160, 1100, 0.7, 0.16, 'square'); playNoise(1.8, 400, 3500, 0.30); }
  function soundBoom()   { playTone(95, 22, 1.4, 0.40, 'sine');   playNoise(2.0, 2400, 60, 0.55); }


// ===================================================================
//  THE MISSILE, THE EXPLOSION, AND THE FOAM
// ===================================================================

  // The missile Bob spits out of his mouth.
  const missile = { alive: false, x: 0, y: 0, z: 0, speed: 0, puffs: [] };

  // The explosion is just a big pile of shards flung in every direction.
  let shards = [];
  let flash = 0;        // how white the screen is right now (1 = totally white)
  let shake = 0;        // how hard the camera is rattling

  function launchMissile() {
    // Working out where his mouth IS turns out to be the fiddly bit,
    // because it moves twice: once when he turns to face you, and again
    // when he cranes his head back. So we run the mouth through exactly
    // the same two steps his boxes go through - nod it at the neck
    // joint, then spin it by his yaw - and fire from wherever it lands.
    // ...and everything has to be multiplied by his scale as well,
    // because his mouth is 2.5 times further from his feet than it
    // used to be. Miss this and the missile fires out of his belly.
    const mouth = headLocal(19.4, -3.0);
    const S = bob.scale;
    missile.alive = true;
    missile.x = bob.x + mouth.z * S * Math.sin(bob.yaw);
    missile.y = bob.y + mouth.y * S;
    missile.z = bob.z + mouth.z * S * Math.cos(bob.yaw);
    missile.speed = 42;
    missile.puffs = [];
    soundLaunch();
  }

  const PUFF_LIFE = 1.6;     // how many seconds a puff of smoke lasts

  function updateMissile(dt) {

    // THE SMOKE GOES FIRST, ON PURPOSE.
    // Smoke doesn't care whether the missile still exists - it drifts
    // and fades away by itself. If we put this below the "is it alive?"
    // check, then the moment the missile blew up this code would stop
    // running and the trail would hang in the sky forever.
    for (const p of missile.puffs) p.age += dt;
    missile.puffs = missile.puffs.filter(function (p) { return p.age < PUFF_LIFE; });

    if (!missile.alive) return;

    missile.y += missile.speed * dt;      // STRAIGHT UP. No steering.

    // Drop a puff of smoke behind it every frame.
    missile.puffs.push({ x: missile.x, y: missile.y - 1.6, z: missile.z, age: 0 });
  }

  function explodeMissile() {
    missile.alive = false;
    shards = [];

    // 70 chunks, each thrown off in a totally random direction.
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2;      // random compass direction
      const up = Math.random() * 2 - 1;           // random up-or-down
      const power = 20 + Math.random() * 55;
      shards.push({
        x: missile.x, y: missile.y, z: missile.z,
        vx: Math.cos(a) * power,
        vy: up * power,
        vz: Math.sin(a) * power,
        size: 1.5 + Math.random() * 5.5,
        life: 1.4 + Math.random() * 1.2,
        colour: [[255, 240, 160], [255, 170, 40], [255, 90, 30], [180, 60, 30]]
                [Math.floor(Math.random() * 4)]
      });
    }

    flash = 1;
    shake = 1;
    soundBoom();

    // THE BAND KICKS IN ON THE EXPLOSION.
    // Not a second before, not a second after. Right on the bang.
    startMusic();
  }

  function updateShards(dt) {
    for (const s of shards) {
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.z += s.vz * dt;
      s.vy -= 26 * dt;        // gravity pulls every chunk back down
      s.life -= dt;
    }
    shards = shards.filter(function (s) { return s.life > 0; });

    // The flash and the shake both fade away on their own.
    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
    if (shake > 0) shake = Math.max(0, shake - dt * 1.6);

    // So do the red hurt glow and your moment of being untouchable.
    // If we forgot this second line you'd be invincible for the rest of
    // the game after one hit - which sounds great until you notice the
    // fight has stopped meaning anything.
    if (hurtFlash > 0)   hurtFlash   = Math.max(0, hurtFlash - dt * 2.0);
    if (hero.invuln > 0) hero.invuln = Math.max(0, hero.invuln - dt);
  }

  function drawMissile() {
    for (const p of missile.puffs) {
      // left is 1 when the puff is brand new and 0 when it's about to go.
      const left = 1 - p.age / PUFF_LIFE;

      // Multiply "getting bigger" by "running out of time". The puff
      // billows outwards and then shrinks away to nothing, instead of
      // vanishing all at once like someone switched it off.
      const size = (2.6 + p.age * 10) * left;
      const grey = 90 + left * 70;

      addBox(p.x, p.y, p.z, size, size, size, [grey, grey, grey + 10]);
    }
    if (!missile.alive) return;
    addBox(missile.x, missile.y, missile.z, 3.0, 8.5, 3.0, [190, 60, 50]);         // body
    addBox(missile.x, missile.y + 5.0, missile.z, 1.7, 3.0, 1.7, [220, 220, 230]); // nose
    addBox(missile.x, missile.y - 5.5, missile.z, 4.0, 4.0, 4.0, [255, 200, 80]);  // flame
  }

  function drawShards() {
    for (const s of shards) {
      addBox(s.x, s.y, s.z, s.size, s.size, s.size, s.colour);
    }
  }

  // White foam churning on the water where Bob is coming up.
  let foam = 0;      // 0 = calm sea, 1 = boiling

  function drawFoam() {
    if (foam <= 0.01) return;
    const ring = 14;
    for (let i = 0; i < ring; i++) {
      const a = (i / ring) * Math.PI * 2;
      // The foam ring has to grow with him too, or it churns away
      // somewhere inside his chest where nobody can see it.
      const wobble = Math.sin(bob.sway * 7 + i) * 1.6;
      const r = (8 + wobble + foam * 3) * bob.scale;
      const fx = bob.x + Math.cos(a) * r;
      const fz = bob.z + Math.sin(a) * r;
      const s = (3.0 + foam * 2) * bob.scale;
      const white = 150 + foam * 90;
      addFace([[fx - s, WATER_Y + 0.1, fz - s], [fx + s, WATER_Y + 0.1, fz - s],
               [fx + s, WATER_Y + 0.1, fz + s], [fx - s, WATER_Y + 0.1, fz + s]],
              'rgb(' + (white | 0) + ',' + (white + 20 | 0) + ',' + (white + 40 | 0) + ')');
    }
  }


// ===================================================================
//  LOOK AT - point the camera straight at something.
//  Handy for a cutscene: "camera, watch Bob's head" is one line.
// ===================================================================

  function lookAt(tx, ty, tz) {
    const dx = tx - cam.x, dy = ty - cam.y, dz = tz - cam.z;
    cam.yaw = Math.atan2(dx, dz);
    cam.pitch = Math.atan2(dy, Math.hypot(dx, dz));
  }

  // Slide a number smoothly towards another number. Used all over the
  // place to stop the camera snapping about like a startled cat.
  function glide(now, target, howFast, dt) {
    return now + (target - now) * Math.min(1, howFast * dt);
  }


// ===================================================================
//  THE CUTSCENE
// ===================================================================
//  The whole scene is one big list of "at THIS many seconds, do THIS".
//  sceneTime just counts upwards, and each bit of the scene checks
//  whether its moment has arrived yet.
// ===================================================================

  let state = 'title';      // 'title', 'cutscene', 'fight', 'squashed', 'won'
  let wonTimer = 0;         // ticks up on the victory screen
  let sceneTime = 0;
  let bigText = '';
  let bigTextFade = 0;
  let launched = false;
  let exploded = false;

  // Bob is 65 units tall now - about SIXTEEN of you stacked up. These
  // are the three heights his feet sit at during the cutscene.
  const BOB_DEEP  = -70;    // completely hidden. Not even his hat shows.
  const BOB_RISEN = -42.5;  // head and shoulders out. Looks big. Isn't.
  const BOB_STAND = -27;    // THE REAL HIM. Water up to his waist.

  function beginCutscene() {
    state = 'cutscene';
    sceneTime = 0;
    launched = false;
    exploded = false;
    bob.y = BOB_DEEP;
    bob.mouth = 0;
    bob.headPitch = 0;
    foam = 0;
    shards = [];
    flash = 0;
    missile.alive = false;
    missile.puffs = [];
    hero.x = 0; hero.z = -6; hero.yaw = 0;

    // Point him at you BEFORE he comes up, so he breaks the surface
    // already staring straight down at the deck. No awkward shuffling.
    bob.yaw = yawTowardsHero();
  }

  function runCutscene(dt) {
    sceneTime += dt;
    const t = sceneTime;

    // ---- 0.0s : a calm, empty sea. Then it starts to bubble. --------
    if (t < 1.0) {
      cam.x = 9; cam.y = 2.0; cam.z = 4;
      lookAt(0, WATER_Y + 2, bob.z);
      foam = t * 0.5;
      bigText = 'THE SEA IS TOO QUIET...';
      bigTextFade = Math.min(1, t * 3);
    }

    // ---- 1.0s : BOB RISES (or so you think) --------------------------
    else if (t < 4.2) {
      if (foam < 0.9) soundRise();     // fires once, the moment he starts
      foam = 1;

      // How far through the rise are we? 0 at the start, 1 at the end.
      const howFar = (t - 1.0) / 3.2;
      // Squaring it makes him start slow and heavy, then heave upwards.
      bob.y = BOB_DEEP + (BOB_RISEN - BOB_DEEP) * (howFar * howFar);

      cam.x = glide(cam.x, 13, 1.2, dt);
      cam.y = glide(cam.y, 3.5, 1.2, dt);
      cam.z = glide(cam.z, -2, 1.2, dt);
      lookAt(bob.x, bob.y + 52, bob.z);        // keep that skull in shot

      bigText = 'BOB THE ROBOT PIRATE';
      bigTextFade = Math.min(1, (t - 1.0) * 2);
    }

    // ---- 4.2s : he settles, dripping, and glares at you --------------
    else if (t < 5.0) {
      bob.y = BOB_RISEN;
      foam = glide(foam, 0.4, 1.5, dt);
      cam.x = glide(cam.x, 8, 1.5, dt);
      cam.y = glide(cam.y, 11, 1.5, dt);
      cam.z = glide(cam.z, 13, 1.5, dt);       // push in close on his head
      lookAt(bob.x, bob.y + 56, bob.z);
      bigTextFade = Math.max(0, bigTextFade - dt * 2);
    }

    // ---- 5.0s : he cranes his head back and the jaw swings open -----
    else if (t < 5.6) {
      bob.y = BOB_RISEN;
      bob.headPitch = glide(bob.headPitch, 1.1, 4, dt);   // look up at the sky
      bob.mouth = glide(bob.mouth, 1, 6, dt);
      lookAt(bob.x, bob.y + 54, bob.z);
      bigText = '';
    }

    // ---- 5.6s : LAUNCH ----------------------------------------------
    else if (t < 7.6) {
      bob.headPitch = 1.1;      // stays craned back, watching it climb
      bob.mouth = 1;
      if (!launched) { launchMissile(); launched = true; }
      // The camera cranes upwards to watch it climb too.
      lookAt(missile.x, missile.y, missile.z);
    }

    // ---- 7.6s : BOOM -------------------------------------------------
    else if (t < 9.4) {
      if (!exploded) { explodeMissile(); exploded = true; }
      bob.mouth = glide(bob.mouth, 0, 3, dt);

      // He admires the fireball for a beat, then lowers his head and
      // looks straight down at YOU. That pause is the whole moment.
      if (t > 8.4) bob.headPitch = glide(bob.headPitch, 0, 2.2, dt);

      // Stare at the fireball for a second, THEN tip the camera back
      // down to Bob. drop goes 0 -> 1, and we slide the aim between the
      // two heights using it.
      const drop = Math.max(0, Math.min(1, (t - 8.4) / 1.0));
      const aimY = missile.y + (bob.y + 52 - missile.y) * drop;
      cam.y = glide(cam.y, 11, 1.5, dt);
      lookAt(bob.x, aimY, bob.z);
      bigText = '';
      bigTextFade = 0;
    }

    // ---- 9.4s : THE REVEAL ------------------------------------------
    // He isn't finished. What came out of the sea was his HEAD.
    // He keeps rising, and the camera has to run backwards to fit him in.
    else if (t < 12.4) {
      if (foam < 0.9) soundRise();
      foam = 1;
      bob.headPitch = 0;

      const howFar = (t - 9.4) / 2.6;
      bob.y = BOB_RISEN + (BOB_STAND - BOB_RISEN) * (howFar * howFar);

      // The camera legs it backwards and upwards to keep him on screen.
      cam.x = glide(cam.x, 22, 1.3, dt);
      cam.y = glide(cam.y, 8, 1.3, dt);
      cam.z = glide(cam.z, -16, 1.3, dt);
      lookAt(bob.x, bob.y + 34, bob.z);        // aim at the middle of him

      bigText = 'THAT WAS JUST HIS HEAD';
      bigTextFade = Math.min(1, (t - 9.8) * 2);
    }

    // ---- 12.4s : swoop back down behind you, and GO ------------------
    else {
      bob.y = BOB_STAND;
      bob.mouth = 0;
      foam = glide(foam, 0.4, 1.2, dt);

      const want = followSpot();
      cam.x = glide(cam.x, want.x, 2.4, dt);
      cam.y = glide(cam.y, want.y, 2.4, dt);
      cam.z = glide(cam.z, want.z, 2.4, dt);
      cam.yaw = glide(cam.yaw, want.yaw, 2.4, dt);
      cam.pitch = glide(cam.pitch, want.pitch, 2.4, dt);

      bigText = 'GET READY';
      bigTextFade = Math.max(0, 1 - (t - 13.2) * 2);

      if (t > 14.0) { state = 'fight'; bigText = ''; }
    }
  }

  // Where the over-the-shoulder camera wants to be.
  //
  // The camera ORBITS you, like it's on the end of a 9-unit pole stuck
  // to your head. Look up and the camera swings DOWN and behind, so it's
  // peering up past you. Look down and it swings up over your shoulder.
  // That swing is the entire reason looking up and down feels right in
  // a third-person game instead of just tilting the picture.
  const CAM_DIST = 9;

  function followSpot() {
    // Which way you're looking, as an arrow in 3D.
    const flat = Math.cos(hero.pitch);         // squashes the arrow when you
                                               // look up, because it's leaning
    const lookX = Math.sin(hero.yaw) * flat;
    const lookY = Math.sin(hero.pitch);
    const lookZ = Math.cos(hero.yaw) * flat;

    // Start at your head and walk BACKWARDS along that arrow.
    let y = 4.2 - lookY * CAM_DIST;

    // ...but never let the camera drop through the deck.
    if (y < 1.8) y = 1.8;

    return {
      x: hero.x - lookX * CAM_DIST,
      y: y,
      z: hero.z - lookZ * CAM_DIST,
      yaw: hero.yaw,
      pitch: hero.pitch
    };
  }


// ===================================================================
//  BOB'S FIRST ATTACK: THE HOOK SLAM
// ===================================================================
//  A thick red line appears across the deck, running straight away
//  from Bob. He winds his hook arm up over his head. Then he drives it
//  down onto the line.
//
//  Stand on the line when it lands and you're jam.
//
//  The whole attack is four steps in a row, and each one just counts
//  a timer down to zero and then hands over to the next:
//
//     wait  ->  warn  ->  slam  ->  recover  ->  wait  -> ...
//
//  This is called a STATE MACHINE, and almost every enemy in every
//  game you have ever played is built out of one.
// ===================================================================

  const LINE_HALF_WIDTH = 4.0;    // how thick the deadly line is
  const ARM_REST_LEN    = 8.4;    // how long his arm is when just hanging

  const attack = {
    phase: 'wait',
    timer: 2.5,

    cx: 0, cz: 0,        // the middle of the red line
    dx: 0, dz: 1,        // the direction the line runs ALONG
    nx: 1, nz: 0,        // sideways from the line - the way you must dodge

    armX: 6.6,           // where his arm is, across his body
    armPitch: 0,         // 0 = hanging down, negative = wound up over his head
    armLen: ARM_REST_LEN,

    aimX: 6.6, aimPitch: 0, aimLen: ARM_REST_LEN,   // where the swing is going
    glow: 0,             // how angry the red line looks right now

    biteX: 0, biteZ: 0,  // the spot on the deck he's about to bite
    jawX: 0, jawZ: 0,    // where his jaws ended up buried in the deck

    recoil: 0,           // kicks to 1 the instant he fires, then falls back
                         // to 0 on its own. That shove-and-settle is most
                         // of why a gun feels like it went off.

    cannonUp: 0,         // 0 = cannon dangling from his hand, 1 = up on his
                         // shoulder like a bazooka. Everything in between
                         // is him lifting it - we slide this number and
                         // the cannon slides with it.

    kind: 'skulls',      // which attack is running
    turn: 2,             // where we are in the list below. Starting at the
                         // LAST one means the hook slam goes first.
    fired: 0,            // how many missiles or skulls have gone so far
    fireTimer: 0,
    thrown: false,       // has THIS swing already let go of its skull?
    armHits: 0           // wrench hits landed on the stuck arm so far
  };

  // Bob takes these in turns, over and over. Want a different order?
  // Shuffle this line. Want him to do the slam twice as often? Put it
  // in twice. The whole fight is choreographed from this one list.
  const ATTACK_ORDER = ['slam', 'missiles', 'skulls', 'stuckslam'];

  // ...but once his arm is off, both hook attacks are gone for good -
  // and he replaces them with the cannon. So ripping the arm off doesn't
  // make the fight easier. It makes it DIFFERENT. That's what a second
  // phase in a boss fight is, and now Bob has one.
  function attackList() {
    return bob.armGone ? ['cannon', 'missiles', 'skulls'] : ATTACK_ORDER;
  }

  const WRENCH_REACH = 8.0;    // how close you must be to whack the hook
  const HITS_TO_RIP  = 3;      // wrench swings needed to tear it loose

  // His arms, lying on the deck, forever. This used to be ONE arm in a
  // single variable - and then he grew a second one you can tear off,
  // and one variable can't hold two arms. A list can hold any number.
  let fallenArms = [];

  let fallenHead = null;       // and eventually, his head

  function soundClang() {
    playTone(900, 300, 0.22, 0.22, 'square');
    playNoise(0.3, 3000, 700, 0.3);
  }
  function soundRip() {
    playTone(420, 40, 1.4, 0.4, 'sawtooth');
    playNoise(1.6, 2600, 90, 0.5);
  }

  function soundWarn()  { playTone(280, 620, 0.28, 0.13, 'square'); }
  function soundWhine() { playTone(160, 900, 0.6, 0.12, 'sawtooth'); }
  function soundSlam()  { playTone(120, 30, 0.9, 0.35, 'sine'); playNoise(1.1, 1600, 90, 0.45); }


  // Work out the arm swing that would land the hook on a spot on the deck.
  function armAimFor(tx, tz) {
    const S = bob.scale;
    const c = Math.cos(bob.yaw), s = Math.sin(bob.yaw);
    const dx = tx - bob.x, dz = tz - bob.z;

    // Turn a spot in the WORLD into a spot on BOB. This is bobBox run
    // backwards: it spins the gap the other way and then un-scales it.
    const ox = (dx * c - dz * s) / S;
    const oz = (dx * s + dz * c) / S;
    const oy = (0.4 - bob.y) / S;         // the deck, measured in Bob-units

    const gy = oy - 17.0;                 // how far below his shoulder
    const gz = oz;

    return {
      // atan2 turns the arrow from his shoulder to the deck back into
      // an angle - the exact angle to swing his arm to.
      pitch: Math.atan2(-gz, -gy),
      // ...and how far it is, is how long the arm has to stretch.
      length: Math.max(ARM_REST_LEN, Math.hypot(gy, gz)),
      x: Math.max(-6.6, Math.min(6.6, ox))    // swing across his body
    };
  }

  function pickAttack() {
    // The line goes through wherever you are RIGHT NOW, running
    // straight away from Bob. So the way out is always SIDEWAYS -
    // which is exactly what the A and D strafe keys are for.
    attack.cx = hero.x;
    attack.cz = hero.z;

    let ax = hero.x - bob.x, az = hero.z - bob.z;
    const len = Math.hypot(ax, az) || 1;
    ax /= len; az /= len;

    attack.dx = ax;  attack.dz = az;       // along the line
    attack.nx = az;  attack.nz = -ax;      // across it - a quarter turn round

    const aim = armAimFor(attack.cx, attack.cz);
    attack.aimPitch = aim.pitch;
    attack.aimLen   = aim.length;
    attack.aimX     = aim.x;
  }

  // Splinters of deck flying everywhere.
  function deckBurst(x, z) {
    for (let i = 0; i < 45; i++) {
      const a = Math.random() * Math.PI * 2;
      const power = 12 + Math.random() * 34;
      shards.push({
        x: x, y: 0.6, z: z,
        vx: Math.cos(a) * power,
        vy: 8 + Math.random() * 18,
        vz: Math.sin(a) * power,
        size: 0.7 + Math.random() * 2.6,
        life: 0.8 + Math.random() * 0.9,
        colour: [[128, 92, 58], [156, 116, 74], [92, 66, 44], [206, 188, 156]]
                [Math.floor(Math.random() * 4)]
      });
    }
  }

  function impact() {
    shake = 1.3;
    soundSlam();
    deckBurst(attack.cx, attack.cz);

    // HOW FAR ARE YOU FROM THE LINE?
    // Not how far along it - that doesn't matter, the line crosses the
    // whole ship. What matters is how far SIDEWAYS you are from it.
    // Multiplying the gap by the line's sideways arrow and adding it up
    // gives exactly that. (Grown-ups call this a "dot product".)
    const offX = hero.x - attack.cx;
    const offZ = hero.z - attack.cz;
    const across = Math.abs(offX * attack.nx + offZ * attack.nz);

    if (across < LINE_HALF_WIDTH + 0.7) hurt();
  }

// ===================================================================
//  BOB'S SECOND ATTACK: THE FIVE-MISSILE BARRAGE
// ===================================================================
//  He cranes back, jaw open, and lobs five missiles onto the deck one
//  after another. Each one paints a bright red dot where it's going to
//  land, and the dot swells and flashes faster as the missile drops.
//
//  THE SNEAKY BIT: each missile aims near wherever you are AT THE
//  MOMENT IT FIRES. They come 0.45 seconds apart. The first lands right
//  on your head and the rest scatter around you - so the deck fills up
//  with craters and you have to keep finding new gaps to stand in.
// ===================================================================

  const BLAST_R   = 6.5;    // how big the red dot is - and the bang
  const BOMB_FLY  = 1.7;    // seconds from his mouth to the deck
  const ARC_HEIGHT = 34;    // how high they lob

  let bombs = [];

  // Choose where one missile should land.
  //
  // We don't just pick a spot - we pick SIXTEEN and keep the roomiest
  // one. Any spot that's already too close to a dot on the deck gets
  // beaten by a spot that isn't. That's why the five craters spread out
  // instead of piling into each other, without ever needing a rule
  // saying "the third one goes here". Guess, score, keep the best.
  function pickBombTarget(isFirst) {
    let bestX = hero.x, bestZ = hero.z, bestGap = -1;

    for (let tries = 0; tries < 16; tries++) {
      let tx, tz;

      if (isFirst && tries === 0) {
        tx = hero.x;  tz = hero.z;      // the FIRST one lands on your head
      } else {
        // The rest scatter around wherever you are now.
        const a = Math.random() * Math.PI * 2;
        const away = 6 + Math.random() * 13;
        tx = hero.x + Math.cos(a) * away;
        tz = hero.z + Math.sin(a) * away;
      }

      // Never off the edge of the ship - a crater in the sea is no fun.
      tx = Math.max(-17, Math.min(17, tx));
      tz = Math.max(-17, Math.min(17, tz));

      // How far is this from the nearest dot already out there?
      let nearest = 999;
      for (const b of bombs) {
        nearest = Math.min(nearest, Math.hypot(tx - b.tx, tz - b.tz));
      }

      if (nearest > bestGap) { bestGap = nearest; bestX = tx; bestZ = tz; }
      if (nearest > BLAST_R * 1.8) break;    // plenty of room. Done.
    }

    return { x: bestX, z: bestZ };
  }

  // Where his MOUTH is in the real world. Same maths as the cutscene
  // missile: nod at the neck joint, spin by his yaw, scale it up.
  function mouthWorld() {
    const mouth = headLocal(19.4, -3.0);
    const S = bob.scale;
    return {
      x: bob.x + mouth.z * S * Math.sin(bob.yaw),
      y: bob.y + mouth.y * S,
      z: bob.z + mouth.z * S * Math.cos(bob.yaw)
    };
  }

  // Fire one missile.
  //
  // "from" is where it starts. Leave it out and it comes out of his
  // MOUTH, exactly like it always did. Hand it the muzzle of the cannon
  // and the very same missile comes out of the CANNON instead.
  //
  // That's the whole change. We didn't write a cannonball - the flying,
  // the arc, the red dot on the deck, the bang, the checking whether it
  // got you, all of that already existed and all of it still works. We
  // just gave the function one new thing it's allowed to be told.
  function fireBomb(isFirst, from) {
    const spot  = pickBombTarget(isFirst);
    const start = from || mouthWorld();      // no "from"? then the mouth.

    bombs.push({
      sx: start.x,
      sy: start.y,
      sz: start.z,
      tx: spot.x,
      tz: spot.z,
      t: 0,
      x: 0, y: 0, z: 0,
      puffs: [],
      puffTimer: 0
    });

    // A missile out of his mouth whines. A missile out of a cannon
    // BOOMS. Same missile, different noise, because of where it came from.
    if (from) soundCannonFire(); else soundWhine();
  }

  function soundCannonFire() {
    playTone(150, 44, 0.55, 0.42, 'square');    // the crack of the powder
    playNoise(0.5, 2200, 260, 0.5);             // and the roar after it
  }

  function updateBombs(dt) {
    for (const b of bombs) {
      b.t += dt;
      const p = Math.min(1, b.t / BOMB_FLY);     // 0 = just fired, 1 = landing

      // Slide in a straight line from his mouth to the target...
      b.x = b.sx + (b.tx - b.sx) * p;
      b.z = b.sz + (b.tz - b.sz) * p;

      // ...and then add a big hump on top. sin() is 0 at the start,
      // 1 in the middle and 0 again at the end - which is EXACTLY the
      // shape of anything you throw. That one line is the whole arc.
      b.y = b.sy + (0.6 - b.sy) * p + Math.sin(p * Math.PI) * ARC_HEIGHT;

      // Smoke, but only every so often instead of every single frame,
      // or five missiles would bury the screen in grey boxes.
      b.puffTimer -= dt;
      for (const q of b.puffs) q.age += dt;
      b.puffs = b.puffs.filter(function (q) { return q.age < 0.55; });
      if (p < 1 && b.puffTimer <= 0) {
        b.puffs.push({ x: b.x, y: b.y, z: b.z, age: 0 });
        b.puffTimer = 0.05;
      }
    }

    // Anything that has arrived goes bang and leaves the list.
    const landed = bombs.filter(function (b) { return b.t >= BOMB_FLY; });
    bombs        = bombs.filter(function (b) { return b.t <  BOMB_FLY; });
    for (const b of landed) bombLanded(b);
  }

  function bombLanded(b) {
    deckBurst(b.tx, b.tz);
    shake = Math.max(shake, 0.9);
    flash = Math.max(flash, 0.3);
    soundBoom();

    // Were you inside the red dot? Straight-line distance, nothing clever.
    if (state === 'fight') {
      const gap = Math.hypot(hero.x - b.tx, hero.z - b.tz);
      if (gap < BLAST_R) hurt('BLASTED!', 'keep moving - the dots follow you');
    }
  }

  function drawBombs() {
    for (const b of bombs) {
      for (const q of b.puffs) {
        const left = 1 - q.age / 0.55;
        const size = (2.4 + q.age * 12) * left;
        const g = 100 + left * 60;
        addBox(q.x, q.y, q.z, size, size, size, [g, g, g + 10]);
      }
      addBox(b.x, b.y, b.z, 2.4, 4.6, 2.4, [190, 60, 50]);
      addBox(b.x, b.y - 3.6, b.z, 3.2, 3.2, 3.2, [255, 200, 80]);
    }
  }

  // The bright red dots painted on the deck.
  function drawBombDots() {
    for (const b of bombs) {
      const close = Math.min(1, b.t / BOMB_FLY);   // 1 means it's about to hit

      const beat = Math.sin(bob.sway * (10 + close * 42));
      const red  = Math.min(255, 120 + close * 110 + beat * 40);
      const rest = 22 + close * 28;

      // A circle is just a shape with enough sides that you can't tell
      // it isn't one. Twenty is plenty.
      addFace(ringOfPoints(b.tx, b.tz, BLAST_R, 0.06),
              'rgb(' + (red | 0) + ',' + (rest | 0) + ',' + (rest | 0) + ')', 0.45);

      // A hot middle that swells as the missile falls, so you can see
      // how long you've got left without looking up.
      addFace(ringOfPoints(b.tx, b.tz, BLAST_R * (0.2 + close * 0.55), 0.07),
              'rgb(255,' + ((80 + close * 120) | 0) + ',55)', 0.5);
    }
  }

  function ringOfPoints(cx, cz, r, y) {
    const points = [];
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2;
      points.push([cx + Math.cos(a) * r, y, cz + Math.sin(a) * r]);
    }
    return points;
  }


// ===================================================================
//  BOB'S THIRD ATTACK: FIVE FLAMING SKULLS
// ===================================================================
//  He winds the hook arm back and hurls burning skulls across the deck,
//  one after another. They fly flat and fast at about chest height, so
//  there's no getting over or under them - you have to sidestep.
//
//  Each one is aimed at where you're standing, give or take a few
//  paces. So they arrive one at a time and each one asks you the same
//  question: LEFT OR RIGHT? Get it wrong and you're toast.
// ===================================================================

  const SKULL_SPEED = 24;      // slow enough to watch one coming and pick a side
  const SKULL_Y     = 2.6;     // chest height
  const SKULL_HIT   = 3.0;     // how close is too close

  let skulls = [];

  // Where is the end of Bob's hook arm, in the real world, if his arm
  // were at this angle? Same three steps as always: walk out along the
  // arm, spin by his yaw, scale it up.
  function armTipWorld(pitch) {
    const S = bob.scale;
    const far = ARM_REST_LEN + 1.4;
    const ox = attack.armX;
    const oy = 17.0 - Math.cos(pitch) * far;
    const oz =      - Math.sin(pitch) * far;

    return {
      x: bob.x + (ox * Math.cos(bob.yaw) + oz * Math.sin(bob.yaw)) * S,
      y: bob.y + oy * S,
      z: bob.z + (-ox * Math.sin(bob.yaw) + oz * Math.cos(bob.yaw)) * S
    };
  }

  function throwSkull() {
    // Spawn it out where his hand is when the arm is flung forward.
    const hand = armTipWorld(1.25);

    // Aim at you, but wide by a few paces so they don't all come down
    // the same line. Some you dodge left, some you dodge right.
    const wide = (Math.random() - 0.5) * 17;
    const aimX = hero.x + wide;
    const aimZ = hero.z;

    // Point it from the hand to that spot, then make it that fast.
    let dx = aimX - hand.x, dz = aimZ - hand.z;
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;

    skulls.push({
      x: hand.x, y: hand.y, z: hand.z,
      vx: dx * SKULL_SPEED,
      vz: dz * SKULL_SPEED,
      // It starts up at his hand and settles to chest height as it flies.
      spin: Math.random() * 6,
      tumble: Math.random() * 6,
      spinRate: 3 + Math.random() * 5,
      fire: [],
      fireTimer: 0,
      age: 0
    });

    soundThrow();
  }

  function soundThrow() {
    playNoise(0.7, 700, 2600, 0.22);
    playTone(240, 90, 0.5, 0.14, 'sawtooth');
  }

  function updateSkulls(dt) {
    for (const s of skulls) {
      s.age += dt;
      s.x += s.vx * dt;
      s.z += s.vz * dt;

      // Drift down from his hand to chest height and then stay there,
      // so it's always a sideways dodge and never a jump.
      s.y = glide(s.y, SKULL_Y, 2.4, dt);

      s.spin   += s.spinRate * dt;
      s.tumble += s.spinRate * 0.7 * dt;

      // Trail of fire. Same every-so-often trick as the missile smoke.
      s.fireTimer -= dt;
      for (const f of s.fire) f.age += dt;
      s.fire = s.fire.filter(function (f) { return f.age < 0.45; });
      if (s.fireTimer <= 0) {
        s.fire.push({ x: s.x, y: s.y, z: s.z, age: 0 });
        s.fireTimer = 0.035;
      }

      // Did it get you?
      //
      // It has to be close AND at your height. They leave his hand up
      // in the air and drop to chest height as they fly, so without the
      // height check a skull sailing over your head would still get you.
      if (state === 'fight' && !s.spent && s.age > 0.15) {
        const gap = Math.hypot(hero.x - s.x, hero.z - s.z);
        const tooHigh = Math.abs(s.y - SKULL_Y) > 2.4;
        if (gap < SKULL_HIT && !tooHigh) { s.spent = true; burned(); }
      }
    }

    // Bin any that have flown off the ship.
    skulls = skulls.filter(function (s) {
      return s.age < 4 && Math.abs(s.x) < 44 && Math.abs(s.z) < 44;
    });
  }

  function drawSkulls() {
    for (const s of skulls) {

      // The flames trailing behind it, fading from white-hot to red.
      for (const f of s.fire) {
        const left = 1 - f.age / 0.45;
        const size = (2.2 + f.age * 5) * left;
        addBox(f.x, f.y, f.z, size, size, size,
               [255, 90 + left * 150, 30 + left * 90]);
      }

      // A flicker of fire wrapped round the skull itself.
      const lick = 3.4 + Math.sin(s.age * 30) * 0.5;
      addBox(s.x, s.y, s.z, lick, lick, lick, [255, 140, 40]);

      // The skull. It tumbles as it flies - spin AND tilt, both ticking
      // up on their own.
      addBox(s.x, s.y, s.z, 2.5, 2.5, 2.5, BONE, s.spin, s.tumble);

      // Two burning eyes. They have to tumble WITH the skull, so we
      // spin their offsets by the same two angles before adding them on.
      for (const side of [-0.62, 0.62]) {
        const e = spinPoint(side, 0.25, -1.35, s.spin, s.tumble);
        addBox(s.x + e[0], s.y + e[1], s.z + e[2], 0.8, 0.8, 0.6, GLOW);
      }

      // ...and a mouthful of teeth.
      const m = spinPoint(0, -0.85, -1.3, s.spin, s.tumble);
      addBox(s.x + m[0], s.y + m[1], s.z + m[2], 1.7, 0.6, 0.5, SOCKET);
    }
  }

  // Spin an offset by a turn and a nod. Exactly what addBox does to
