  // every corner - pulled out so other things can borrow it.
  function spinPoint(ox, oy, oz, spin, tilt) {
    const c = Math.cos(spin), s = Math.sin(spin);
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    const ty = oy * ct - oz * st;
    const tz = oy * st + oz * ct;
    return [ox * c + tz * s, ty, -ox * s + tz * c];
  }

  function burned() {
    flash = Math.max(flash, 0.5);
    shake = Math.max(shake, 0.8);
    soundBoom();
    hurt('BURNED!', 'the skulls fly flat - step out of the way');
  }


// ===================================================================
//  BOB'S FOURTH ATTACK: HE GETS HIS ARM STUCK
// ===================================================================
//  It starts out as exactly the same hook slam. Red line, wind-up,
//  down it comes. Dodge it the same way.
//
//  But this time the hook goes THROUGH the deck and jams there. Bob
//  heaves and heaves and can't get it out - and for about nine seconds
//  the biggest, meanest thing in the game is stuck to the floor.
//
//  Run over and hit it with your wrench three times.
// ===================================================================

  function wrenchTick(dt) {
    if (hero.swingTimer <= 0) return;
    hero.swingTimer -= dt;

    // The wrench only counts as hitting things during the CHOP - not
    // while you're lifting it, and not on the way back up. p is how far
    // through the swing we are, same number wrenchAngle uses.
    const p = 1 - hero.swingTimer / SWING_TIME;
    if (hero.swingHit || p < 0.36 || p > 0.58) return;

    // THE WRENCH NOW HAS TWO THINGS IT CAN HIT, so it has to check both.
    // Mini-Bobs come first, because if one is close enough to whack it's
    // also close enough to get you - so it's the more urgent target.
    for (const m of minis) {
      if (m.leaping) continue;                 // can't hit one mid-jump
      if (Math.hypot(hero.x - m.x, hero.z - m.z) > WRENCH_REACH) continue;

      hero.swingHit = true;      // this swing is used up
      m.hits++;
      m.flash = 1;               // he goes white for a moment
      soundClang();
      shake = Math.max(shake, 0.35);
      sparksAt(m.x, 1.6, m.z);
      if (m.hits >= MINI_HITS) miniDies(m);
      return;                    // ONE swing hits ONE of them. No sweeping.
    }

    // HIS HEAD, jammed in the planks. Three swings and it's over.
    if (attack.phase === 'jawstuck') {
      if (Math.hypot(hero.x - attack.jawX, hero.z - attack.jawZ) > WRENCH_REACH) return;

      hero.swingHit = true;
      bob.headHits++;
      soundClang();
      shake = Math.max(shake, 0.9);
      flash = Math.max(flash, 0.25);
      sparksAt(attack.jawX, 2.6, attack.jawZ);

      if (bob.headHits >= HEAD_HITS) ripHeadOff();
      return;
    }

    if (attack.phase !== 'stuck') return;

    // Are you close enough to the buried hook?
    const gap = Math.hypot(hero.x - attack.cx, hero.z - attack.cz);
    if (gap > WRENCH_REACH) return;

    hero.swingHit = true;         // this swing has done its damage
    attack.armHits++;
    soundClang();
    shake = Math.max(shake, 0.5);
    sparksAt(attack.cx, 1.5, attack.cz);

    if (attack.armHits >= HITS_TO_RIP) ripArmOff();
  }

  function sparksAt(x, y, z) {
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2;
      const power = 6 + Math.random() * 16;
      shards.push({
        x: x, y: y, z: z,
        vx: Math.cos(a) * power,
        vy: 5 + Math.random() * 12,
        vz: Math.sin(a) * power,
        size: 0.35 + Math.random() * 0.9,
        life: 0.4 + Math.random() * 0.5,
        colour: [[255, 240, 170], [255, 200, 80], [255, 150, 50]]
                [Math.floor(Math.random() * 3)]
      });
    }
  }

  function ripArmOff() {
    // Is this the second one? If the first is already gone, it must be.
    const second = bob.armGone;

    if (second) {
      bob.arm2Gone = true;
      bob.hasCannon = false;    // nothing left to hold it with. It's in the sea.
    } else {
      bob.armGone = true;

      // HE SWITCHES ARMS.
      //
      // activeArm was +1 (his hook arm). Now it's -1, and every bit of
      // arm code - the winding up, the throwing, the parking - starts
      // driving his OTHER arm instead. We didn't have to rewrite any of
      // it. That is the entire payoff for drawing both arms with one
      // function: teaching him to swap hands cost us ONE line.
      bob.activeArm = -1;
      attack.armX = armHomeX();      // pop it straight to the other side

      // Wind the turn counter back so the CANNON is the very next thing
      // he does. attackList() is now ['cannon','missiles','skulls'], and
      // 'wait' does turn = (turn + 1) % 3 - so -1 becomes 0, the cannon.
      // You rip his arm off and he answers you immediately.
      attack.turn = -1;
    }

    // Leave the arm lying on the deck where it fell. It stays there for
    // the rest of the fight, which is the whole point - it's a trophy.
    fallenArms.push({ x: attack.cx, z: attack.cz, yaw: Math.random() * 3 });

    flash = Math.max(flash, 0.8);
    shake = 1.5;
    soundRip();
    sparksAt(attack.cx, 2.0, attack.cz);
    deckBurst(attack.cx, attack.cz);

    bigText = second ? 'BOTH ARMS GONE!' : 'HIS ARM CAME OFF!';
    bigTextFade = 1;

    attack.phase = 'recover';
    attack.timer = 2.0;
  }

  // The arms, lying where they landed. Same drawing as before, just
  // wrapped in a loop so it runs once per arm instead of once, ever.
  function drawFallenArms() {
    for (const arm of fallenArms) {
      const a = arm.yaw;
      for (let i = 0; i < 5; i++) {
        addBox(arm.x + Math.sin(a) * i * 2.6, 1.2,
               arm.z + Math.cos(a) * i * 2.6,
               2.6, 2.4, 2.6, i > 3 ? DARK : IRON, a);
      }
      // the hook on the end, bent over
      addBox(arm.x + Math.sin(a) * 14, 1.4, arm.z + Math.cos(a) * 14,
             2.0, 2.0, 2.0, BONE, a);
      addBox(arm.x + Math.sin(a) * 16.5, 2.4, arm.z + Math.cos(a) * 16.5,
             1.4, 3.0, 1.4, BONE, a);
    }
  }

  // His head, face down on the planks where you knocked it. The trophy.
  function drawFallenHead() {
    if (!fallenHead) return;
    const a = fallenHead.yaw;
    const x = fallenHead.x, z = fallenHead.z;

    addBox(x, 3.4, z, 15.5, 8.0, 12.5, SKULL, a);           // the cranium
    addBox(x, 1.6, z - 2.0, 12.5, 4.5, 11.5, SKULL, a);     // the face
    addBox(x, 7.0, z, 22.0, 1.8, 20.0, BLACK, a);           // the hat brim
    addBox(x, 9.0, z, 14.0, 5.5, 12.5, BLACK, a);           // the crown

    // The eyes are OUT. No power, no glow - just two black pits. That
    // one colour change is what says "finished" better than any words.
    for (const ex of [-4.0, 4.0]) {
      addBox(x + Math.cos(a) * ex, 3.6, z - 6.2 + Math.sin(a) * ex,
             5.5, 5.5, 1.2, SOCKET, a);
    }
  }


// ===================================================================
//  BOB'S FIFTH ATTACK: THE CANNON HE PULLS OUT OF THE SEA
// ===================================================================
//  You tore his hook arm off. You won. Except now he reaches his OTHER
//  arm down into the water, feels around on the sea floor, and hauls up
//  a cannon - and puts it on his shoulder like a bazooka.
//
//  Maximus's idea. It is a much better idea than anything I had.
// ===================================================================

  const CANNON_DIVE_LEN = 13.5;    // how far he stretches to reach the bottom

  // HOW BIG THE CANNON IS. 1 was the first try and it was enormous.
  // Everything about the cannon is measured in this, so change this one
  // number and the whole thing grows or shrinks in one piece. Try 1.2
  // if you ever want it silly again.
  const CANNON_SIZE = 0.6;

  const CANNON_SHOTS = 12;         // how many he fires before he's done
  const CANNON_GAP   = 0.42;       // seconds between shots

  // Where his HAND is in the real world, right now.
  //
  // armTipWorld() up above does nearly this, but it always uses his
  // normal arm length. We need the length he's ACTUALLY at, because the
  // whole point of this attack is that the arm stretches way down.
  function handWorld() {
    const S = bob.scale;
    const far = attack.armLen + 1.4;
    const ox = attack.armX;
    const oy = 17.0 - Math.cos(attack.armPitch) * far;
    const oz =      - Math.sin(attack.armPitch) * far;

    return {
      x: bob.x + (ox * Math.cos(bob.yaw) + oz * Math.sin(bob.yaw)) * S,
      y: bob.y + oy * S,
      z: bob.z + (-ox * Math.sin(bob.yaw) + oz * Math.cos(bob.yaw)) * S
    };
  }

  // Water thrown up where his arm goes through the surface.
  //
  // We're not writing a new particle system for this - the deck
  // splinters already fly and fall and fade. Same list, same gravity,
  // just white instead of brown. Reusing what's there beats building
  // another one of the same thing.
  let splashTimer = 0;
  function splashAtHand(dt) {
    splashTimer -= dt;
    if (splashTimer > 0) return;      // not every frame, or it's a blizzard
    splashTimer = 0.045;

    const hand = handWorld();
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2;
      const power = 3 + Math.random() * 15;
      shards.push({
        x: hand.x + Math.cos(a) * 3,
        y: WATER_Y,                    // always born AT the surface
        z: hand.z + Math.sin(a) * 3,
        vx: Math.cos(a) * power,
        vy: 11 + Math.random() * 21,
        vz: Math.sin(a) * power,
        size: 1.0 + Math.random() * 2.4,
        life: 0.5 + Math.random() * 0.6,
        colour: [[236, 246, 252], [198, 224, 240], [166, 202, 228]]
                [Math.floor(Math.random() * 3)]
      });
    }
  }

  function soundHaul() {
    playTone(60, 130, 1.7, 0.4, 'sawtooth');    // a deep metal groan
    playNoise(1.5, 400, 2200, 0.35);            // and a lot of water
  }

  // Draw the cannon.
  //
  // "up" is attack.cannonUp: 0 means dangling from his hand, 1 means
  // parked on his shoulder pointing at you. We work out BOTH spots and
  // then slide between them:
  //
  //     somewhere = start + (finish - start) * up
  //
  // At up = 0 that's the start. At up = 1 it's the finish. At 0.5 it's
  // exactly halfway. That one line is how almost everything in this
  // game moves smoothly, and it works on any pair of numbers.
  function drawCannon(up) {
    // WHERE IT STARTS: hanging off the end of his arm.
    const armY = -Math.cos(attack.armPitch);
    const armZ = -Math.sin(attack.armPitch);
    const tipFar = attack.armLen + 1.4;
    const handX = attack.armX;
    const handY = 17.0 + armY * tipFar;
    const handZ = armZ * tipFar;

    // WHERE IT FINISHES: up on the shoulder of whichever arm is live.
    const shX = 6.6 * bob.activeArm;
    const shY = 19.4;
    const shZ = -1.2;

    // The barrel swings round too. Angle 0 points straight DOWN, the
    // way it hangs when he first drags it out. 1.57 is a quarter turn -
    // that's the barrel level, aimed right down the deck at you.
    const pitch = up * 1.57;
    const by = -Math.cos(pitch);
    const bz = -Math.sin(pitch);

    // RECOIL: shove the whole cannon BACKWARDS along its own barrel.
    // Minus the barrel's direction is backwards down it, whatever way
    // it happens to be pointing - so this works in every pose for free.
    const kick = attack.recoil * 2.2;

    const cx = handX + (shX - handX) * up;
    const cy = handY + (shY - handY) * up - by * kick;
    const cz = handZ + (shZ - handZ) * up - bz * kick;

    // EVERY size and distance below gets multiplied by CANNON_SIZE. So
    // one number at the top of this section shrinks or grows the whole
    // thing at once, and it never comes apart - because the gaps shrink
    // by exactly as much as the blocks do. Same idea as bob.scale.
    const C = CANNON_SIZE;

    // The barrel: a line of blocks marching out from the breech. Same
    // trick as his chain arm, because it's the same problem.
    for (let i = 0; i <= 6; i++) {
      const far = i * 1.55 * C;
      const w = (i === 0 ? 4.2 : 3.1) * C;
      bobBox(cx, cy + by * far, cz + bz * far, w, w, w,
             i === 0 ? DARK : IRON);
    }

    // Two gold bands, because a cannon with bands on looks like a cannon
    // and a cannon without them looks like a pipe.
    bobBox(cx, cy + by * 3.1 * C, cz + bz * 3.1 * C, 3.5 * C, 3.5 * C, 3.5 * C, GOLD);
    bobBox(cx, cy + by * 6.2 * C, cz + bz * 6.2 * C, 3.4 * C, 3.4 * C, 3.4 * C, GOLD);

    // The muzzle - a fat rim with a black hole in it.
    const mFar = 9.6 * C;
    bobBox(cx, cy + by * mFar, cz + bz * mFar, 4.4 * C, 4.4 * C, 4.4 * C, DARK);
    bobBox(cx, cy + by * (mFar + 0.9 * C), cz + bz * (mFar + 0.9 * C),
           2.6 * C, 2.6 * C, 2.6 * C, BLACK);
  }

// ===================================================================
//  THE END OF BOB: HE BITES THE SHIP
// ===================================================================
//  No arms left. So he uses the only thing he has left - his teeth.
//
//  He wades right up to the ship, ducks down until his skull is level
//  with the deck, and BITES at wherever you're standing. Ten times.
//
//  On the eleventh his jaws go through the planks and JAM there, and
//  for the first time in the whole fight his head is down at your
//  level and it isn't going anywhere. Three swings of the wrench.
//
//  Maximus wrote this ending. I only typed it in.
// ===================================================================

  const BITES_TO_STICK = 10;   // ten clean bites, then the eleventh sticks
  const BITE_R         = 7.0;  // how wide his jaws are where they land
  const BOB_BITE_Y     = -40;  // how far he ducks. Puts his jaw on the deck.
  const HEAD_HITS      = 3;    // wrench swings to take his head off

  // HOW FAR BACK HE REARS UP BEFORE HE STRIKES.
  //
  // The first version had him wade over and just stand there with his
  // head next to you for the whole wind-up, and his skull filled half
  // the screen. Maximus spotted it immediately.
  //
  // So now he does what an actual biting thing does: rears back where
  // you can SEE him, then crosses the whole gap in a third of a second.
  // Close up for an instant instead of close up for a second and a half.
  const BITE_STANDOFF  = 19;

  // His jaw hangs this far in front of his body when his head is down.
  // Worked out from his neck joint: at a head pitch of -1.2 his mouth
  // sits 1.179 Bob-units forward, and he's scaled up 2.5 times.
  const JAW_OFFSET     = 2.95;

  function startBite() {
    attack.phase = 'bitewarn';
    attack.timer = 1.4;
    bob.mouthStuck = false;

    // Lock in where he's aiming. ONE pair of numbers does three jobs:
    // it's where the red circle is drawn, it's where we drive his body
    // so his jaw lands, and it's what we measure you against to see if
    // he got you. Three things that must agree, from one source - so
    // they cannot drift apart.
    attack.biteX = hero.x;
    attack.biteZ = hero.z;
  }

  // The red circle under his jaws.
  function drawBiteRing() {
    if (attack.phase !== 'bitewarn' && attack.phase !== 'bitesnap') return;

    // Same attack.biteX / attack.biteZ that his body is driven to and
    // that the hit is measured against. One source of truth.
    const bx = attack.biteX, bz = attack.biteZ;
    const close = attack.phase === 'bitesnap' ? 1
                : 1 - Math.max(0, attack.timer) / 1.4;

    const beat = Math.sin(bob.sway * (9 + close * 40));
    const red  = Math.min(255, 110 + close * 130 + beat * 40);
    const rest = 24 + close * 30;

    addFace(ringOfPoints(bx, bz, BITE_R, 0.06),
            'rgb(' + (red | 0) + ',' + (rest | 0) + ',' + (rest | 0) + ')', 0.45);
    addFace(ringOfPoints(bx, bz, BITE_R * (0.2 + close * 0.6), 0.07),
            'rgb(255,' + ((70 + close * 130) | 0) + ',50)', 0.5);
  }

  function soundChomp() {
    playTone(200, 55, 0.35, 0.42, 'square');    // the clack of the teeth
    playNoise(0.45, 1800, 200, 0.4);
  }

  function soundHeadOff() {
    playTone(520, 30, 2.4, 0.5, 'sawtooth');
    playNoise(2.6, 2800, 60, 0.55);
  }

  function ripHeadOff() {
    bob.headGone = true;

    fallenHead = {
      x: attack.jawX,
      z: attack.jawZ,
      yaw: bob.yaw + (Math.random() - 0.5)
    };

    flash = 1;
    shake = 2.2;
    soundHeadOff();
    sparksAt(attack.jawX, 3.0, attack.jawZ);
    deckBurst(attack.jawX, attack.jawZ);

    // Every last mini goes down with him.
    minis = [];

    state = 'won';
    wonTimer = 0;
    bigText = '';
  }

// ===================================================================
//  BOB'S SIXTH TRICK: THE LITTLE ONES
// ===================================================================
//  Once he has shown you every single attack he's got, and none of it
//  worked, his CHEST SWINGS OPEN and three mini-Bobs leap out onto the
//  deck and come waddling straight at you.
//
//  Three wrench hits each. Let one touch you and you're finished.
//
//  Maximus's idea again. He is on a roll.
// ===================================================================

  const MINI_HITS   = 3;     // wrench swings to flatten one
  const MINI_SPEED  = 9;     // you run at 16, so you CAN outrun them...
  const MINI_TOUCH  = 2.6;   // ...but not forever, and not standing still
  const MINI_LEAP   = 1.5;   // seconds in the air on the way out
  const MINI_HEIGHT = 3.4;   // how tall a little one is

  let minis = [];

  // Which attacks has he actually used? We tick them off as they happen.
  // An object used like this is a checklist: attacksSeen['skulls'] is
  // undefined until the first time he throws skulls, and true after.
  const attacksSeen = {};
  const ALL_ATTACKS = ['slam', 'missiles', 'skulls', 'stuckslam', 'cannon'];

  function seenEverything() {
    // every() asks "is this true for ALL of them?" It stops and says no
    // the moment it finds one he hasn't done yet.
    return ALL_ATTACKS.every(function (k) { return attacksSeen[k]; });
  }

  function spawnMinis() {
    const S = bob.scale;

    for (let i = 0; i < 3; i++) {
      // They start inside his chest and are FLUNG out onto the deck,
      // arcing through the air exactly the way his missiles do. Same
      // maths, third time we've used it.
      const spread = (i - 1) * 9;          // -9, 0, 9 - so they fan out

      minis.push({
        sx: bob.x,
        sy: bob.y + 14.6 * S,              // chest height
        sz: bob.z - 3.0 * S,               // just in front of his chest

        tx: Math.max(-15, Math.min(15, hero.x + spread)),
        tz: Math.max(-15, Math.min(15, hero.z + 6 + i * 2)),

        t: 0,
        leaping: true,
        x: bob.x, y: bob.y + 14.6 * S, z: bob.z,
        yaw: 0,
        step: 0,          // ticks up while walking, to waddle the legs
        hits: 0,
        flash: 0
      });
    }
  }

  function miniDies(m) {
    m.dead = true;
    soundRip();
    shake = Math.max(shake, 0.7);
    sparksAt(m.x, 1.8, m.z);

    // Bits of him everywhere.
    for (let i = 0; i < 30; i++) {
      const a = Math.random() * Math.PI * 2;
      const power = 8 + Math.random() * 22;
      shards.push({
        x: m.x, y: 1.6, z: m.z,
        vx: Math.cos(a) * power,
        vy: 7 + Math.random() * 15,
        vz: Math.sin(a) * power,
        size: 0.5 + Math.random() * 1.3,
        life: 0.6 + Math.random() * 0.7,
        colour: [IRON, DARK, RUST, GOLD][Math.floor(Math.random() * 4)]
      });
    }
  }

  function updateMinis(dt) {
    for (const m of minis) {
      m.flash = Math.max(0, m.flash - dt * 3);

      // ---- still in the air ------------------------------------------
      if (m.leaping) {
        m.t += dt / MINI_LEAP;
        const p = Math.min(1, m.t);

        m.x = m.sx + (m.tx - m.sx) * p;
        m.z = m.sz + (m.tz - m.sz) * p;
        m.y = m.sy + (0 - m.sy) * p + Math.sin(p * Math.PI) * 12;
        m.yaw = Math.atan2(m.tx - m.sx, m.tz - m.sz);
        m.step += dt * 14;               // legs pedalling in mid-air

        if (p >= 1) {
          m.leaping = false;
          m.y = 0;
          shake = Math.max(shake, 0.3);
          deckBurst(m.x, m.z);           // he lands HARD
        }
        continue;
      }

      // ---- landed: walk straight at you ------------------------------
      // Point an arrow from him to you, shrink it to length 1, then
      // step along it. Dividing by the length is what makes him move
      // the same speed whether you're near or miles away.
      let dx = hero.x - m.x, dz = hero.z - m.z;
      const gap = Math.hypot(dx, dz) || 1;
      dx /= gap; dz /= gap;

      m.x += dx * MINI_SPEED * dt;
      m.z += dz * MINI_SPEED * dt;
      m.yaw = Math.atan2(dx, dz);
      m.step += dt * 11;

      if (state === 'fight' && gap < MINI_TOUCH) {
        hurt('THEY GOT YOU!', 'wrench them - do NOT let them crowd you');
      }
    }

    minis = minis.filter(function (m) { return !m.dead; });
  }

  function drawMinis() {
    for (const m of minis) {
      // A little Bob is the big one with almost everything left out.
      // Legs, body, rust stripe, skull, one glowing eye, hat. That's it.
      const wobble = Math.sin(m.step) * 0.55;      // one leg forward...
      const y = m.y;

      // Getting hit makes him flash white. This mixes his real colour
      // towards white by however much flash is left - the same
      // "slide between two things" trick as the cannon.
      const tint = function (c) {
        const f = m.flash;
        return [c[0] + (255 - c[0]) * f,
                c[1] + (255 - c[1]) * f,
                c[2] + (255 - c[2]) * f];
      };

      addBox(m.x, y + 0.5, m.z, 0.62, 1.0, 0.62, tint(DARK), m.yaw);   // legs
      addBox(m.x, y + 0.5 + wobble * 0.3, m.z, 0.62, 1.0, 0.62, tint(DARK), m.yaw);

      addBox(m.x, y + 1.7, m.z, 1.9, 1.5, 1.2, tint(IRON), m.yaw);     // body
      addBox(m.x, y + 1.3, m.z, 2.0, 0.35, 1.3, tint(RUST), m.yaw);    // rust
      addBox(m.x, y + 1.55, m.z - 0.65, 1.5, 0.3, 0.2, tint(GOLD), m.yaw); // belt

      addBox(m.x, y + 2.5, m.z, 1.0, 0.5, 1.0, tint(DARK), m.yaw);     // neck
      addBox(m.x, y + 3.0, m.z, 1.6, 1.3, 1.5, tint(SKULL), m.yaw);    // skull
      addBox(m.x, y + 3.05, m.z - 0.72, 0.5, 0.45, 0.2, SOCKET, m.yaw);// eye pit
      addBox(m.x, y + 3.05, m.z - 0.78, 0.3, 0.28, 0.15, GLOW, m.yaw); // the eye

      addBox(m.x, y + 3.8, m.z, 2.1, 0.42, 1.5, tint(BLACK), m.yaw);   // hat brim
      addBox(m.x, y + 4.05, m.z, 1.2, 0.5, 1.1, tint(BLACK), m.yaw);   // hat top

      // A little pip of light above the ones you've already softened up,
      // so you can tell at a glance which is nearly done.
      for (let h = 0; h < m.hits; h++) {
        addBox(m.x - 0.5 + h * 0.5, y + MINI_HEIGHT + 1.5, m.z,
               0.3, 0.3, 0.3, [255, 210, 90], m.yaw);
      }
    }
  }

  function soundHatch() {
    playTone(90, 200, 1.5, 0.35, 'square');     // heavy hinges
    playNoise(1.2, 300, 1800, 0.3);
  }

  // Where does the muzzle end up in the real world? The cannonballs have
  // to come OUT of it, not out of the middle of Bob.
  function muzzleWorld() {
    const S = bob.scale;
    const up = attack.cannonUp;

    const armY = -Math.cos(attack.armPitch);
    const armZ = -Math.sin(attack.armPitch);
    const tipFar = attack.armLen + 1.4;

    const cx = attack.armX + (6.6 * bob.activeArm - attack.armX) * up;
    const cy = (17.0 + armY * tipFar) + (19.4 - (17.0 + armY * tipFar)) * up;
    const cz = (armZ * tipFar) + (-1.2 - armZ * tipFar) * up;

    const pitch = up * 1.57;
    const mFar = 10.5 * CANNON_SIZE;    // shrink with the rest of it, or the
                                        // shots come out of thin air
    const ox = cx;
    const oy = cy - Math.cos(pitch) * mFar;
    const oz = cz - Math.sin(pitch) * mFar;

    return {
      x: bob.x + (ox * Math.cos(bob.yaw) + oz * Math.sin(bob.yaw)) * S,
      y: bob.y + oy * S,
      z: bob.z + (-ox * Math.sin(bob.yaw) + oz * Math.cos(bob.yaw)) * S
    };
  }


  let squashTimer = 0;

  let squashWord = 'SQUASHED!';
  let squashHint = 'strafe with A and D to get off the line';

  const HURT_INVULN = 1.3;   // seconds of being untouchable after a hit

  let hurtFlash = 0;         // red edge glow, spikes to 1 then fades

  // TAKING A HIT.
  //
  // This used to be called squash() and it meant "you're dead". Now it
  // means "that cost you a heart" - and only the LAST one kills you.
  // It's a new name because it's a new job: a function called squash()
  // that usually doesn't squash you would be a liar.
  function hurt(word, hint) {
    if (state !== 'fight') return;      // no hitting you on the death screen
    if (hero.invuln > 0) return;        // still flickering from the last one

    hero.hearts--;
    hero.invuln = HURT_INVULN;

    // Remember what got you, so the death screen can say so if this
    // turns out to have been the last heart.
    squashWord = word || 'SQUASHED!';
    squashHint = hint || 'strafe with A and D to get off the line';

    if (hero.hearts <= 0) {
      hero.hearts = 0;
      state = 'squashed';
      squashTimer = 2.2;
      return;
    }

    // Still alive. Make it HURT anyway - a hit you don't notice is a
    // hit that feels unfair when the hearts run out later.
    hurtFlash = 1;
    shake = Math.max(shake, 0.8);
    soundHurt();
  }

  function soundHurt() {
    playTone(320, 90, 0.35, 0.3, 'square');
    playNoise(0.35, 1400, 300, 0.3);
  }

  function restartFight() {
    state = 'fight';
    hero.x = 0; hero.z = -6; hero.yaw = 0; hero.pitch = 0;

    hero.hearts = hero.maxHearts;    // full health again
    hero.invuln = 0;
    hurtFlash = 0;

    // If the little ones got you, put them back inside him and let him
    // do the whole chest thing again - otherwise you'd never get
    // another crack at the best bit of the fight.
    if (minis.length > 0 || attack.phase === 'hatch' || attack.phase === 'minis') {
      bob.hatched = false;
    }
    minis = [];

    attack.phase = 'wait';
    attack.timer = 2.5;
    attack.glow = 0;
    attack.armPitch = 0;
    attack.armLen = ARM_REST_LEN;
    attack.armX = armHomeX();
    shards = [];
    bombs = [];        // clear the sky, or you'd get flattened the
    skulls = [];       // instant you stood back up. Very unfair.
    shake = 0;
    bob.headPitch = 0;
    bob.mouth = 0;
  }

  function updateAttack(dt) {
    attack.timer -= dt;

    // Once he owns the cannon it rides on his shoulder ALL the time -
    // while he throws skulls, while he waits, while he does anything
    // else. The only moments it isn't up there are the two seconds he
    // spends hoisting it out of the sea. One rule, written once, in
    // front of everything - so no phase can forget it.
    if (bob.hasCannon && attack.phase !== 'reach' &&
        attack.phase !== 'haul'  && attack.phase !== 'stow') {
      attack.cannonUp = glide(attack.cannonUp, 1, 5, dt);
    }

    // Two things that always drift back to how they were, on their own.
    //
    // The recoil kick springs home fast. The churned-up sea settles a
    // lot slower. Both work the same way: something else SHOVES the
    // number, and this quietly drags it back. Nobody has to remember to
    // switch them off, because they turn themselves off. Without this
    // the sea boils for the rest of the fight after one dunk.
    attack.recoil = glide(attack.recoil, 0, 9, dt);

    // The sea settles back to its normal churn - UNLESS he's leaning
    // over the ship to bite you, in which case the foam would be
    // boiling away on the deck around his neck, which is nonsense.
    const biting = attack.phase === 'bitewarn' || attack.phase === 'bitesnap' ||
                   attack.phase === 'biteup'   || attack.phase === 'jawstuck';
    foam = glide(foam, biting ? 0 : 0.35, biting ? 2 : 0.6, dt);

    // ...and a third. The chest hauls itself shut the moment the two
    // phases that need it open are over. Same idea again: the doors
    // don't need anyone to remember to close them.
    if (attack.phase !== 'hatch' && attack.phase !== 'minis') {
      bob.chestOpen = glide(bob.chestOpen, 0, 2.5, dt);
    }

    if (attack.phase === 'wait') {
      attack.glow = 0;
      restArm(dt, 4);
      if (attack.timer <= 0) {

        // THE ENDGAME LADDER. Each rung is checked before the ordinary
        // attack list, and each one is permanent - so once he's climbed
        // onto a rung he never goes back down to the one below.

        // No arms at all? Then it's teeth from here to the end.
        if (bob.arm2Gone) { startBite(); return; }

        // Little ones all dead? Then he tries the stuck-arm trick again
        // with his LAST arm - and it's the same attack, the same code,
        // just driving the other side. He has no idea he's about to
        // make exactly the same mistake twice.
        if (bob.hatched && minis.length === 0) {
          attack.kind = 'stuckslam';
          pickAttack();
          attack.phase = 'warn';
          attack.timer = 1.7;
          soundWarn();
          return;
        }

        // HAS HE RUN OUT OF IDEAS? If he's shown you all five attacks
        // and you're still standing, he stops attacking and opens up.
        // This can only ever fire once, because hatched never goes back.
        if (!bob.hatched && seenEverything()) {
          bob.hatched = true;
          attack.phase = 'hatch';
          attack.timer = 2.2;
          bigText = 'HIS CHEST IS OPENING';
          bigTextFade = 1;
          soundHatch();
          return;
        }

        // Work down the list and then start again from the top.
        // The % wraps 3 back round to 0 - it's the remainder after
        // dividing, and it's how you make anything go round in a loop.
        const list = attackList();
        attack.turn = (attack.turn + 1) % list.length;
        attack.kind = list[attack.turn];

        attacksSeen[attack.kind] = true;    // tick it off the checklist

        if (attack.kind === 'slam' || attack.kind === 'stuckslam') {
          pickAttack();
          attack.phase = 'warn';
          attack.timer = 1.7;
          soundWarn();
        } else if (attack.kind === 'missiles') {
          attack.phase = 'aim';
          attack.timer = 0.8;
          attack.fired = 0;
          attack.fireTimer = 0;
        } else if (attack.kind === 'cannon') {
          // He only has to go FISHING for it once. Every time after
          // that he's already holding it, so skip straight to the pose.
          attack.phase = bob.hasCannon ? 'shoulder' : 'reach';
          attack.timer = bob.hasCannon ? 0.8 : 1.5;
          attack.fired = 0;
          attack.fireTimer = 0;
        } else {
          attack.phase = 'rear';
          attack.timer = 0.7;
          attack.fired = 0;
          attack.fireTimer = 0;
        }
      }
    }

    // ---- THE BITE: he wades in and lines you up ----------------------
    else if (attack.phase === 'bitewarn') {
      // The circle creeps towards you the whole time he's winding up.
      // Slowly - you run at 16 and it crawls - so running away always
      // works and standing still never does.
      attack.biteX = glide(attack.biteX, hero.x, 1.4, dt);
      attack.biteZ = glide(attack.biteZ, hero.z, 1.4, dt);

      // He rears UP and hangs back, well clear of the camera, lining
      // himself up over the spot. You get to see the whole animal.
      bob.x = glide(bob.x, attack.biteX, 3, dt);
      bob.z = glide(bob.z, attack.biteZ + BITE_STANDOFF, 3, dt);
      bob.y = glide(bob.y, BOB_STAND, 3, dt);

      bob.headPitch = glide(bob.headPitch, -0.35, 4, dt);  // head up, watching
      bob.mouth     = glide(bob.mouth, 1, 5, dt);          // jaws wide
      restArm(dt, 3);

      bigText = 'BITE ' + (bob.biteCount + 1);
      bigTextFade = 1;

      if (attack.timer <= 0) { attack.phase = 'bitesnap'; attack.timer = 0.3; }
    }

    // ---- THE BITE: THE LUNGE ------------------------------------------
    // He crosses nineteen units and drops thirteen in a third of a
    // second. Those glide speeds are enormous on purpose - that's the
    // difference between leaning over and STRIKING.
    else if (attack.phase === 'bitesnap') {
      bob.x = glide(bob.x, attack.biteX, 16, dt);
      bob.z = glide(bob.z, attack.biteZ + JAW_OFFSET, 16, dt);
      bob.y = glide(bob.y, BOB_BITE_Y, 16, dt);

      bob.headPitch = glide(bob.headPitch, -1.2, 18, dt);
      bob.mouth     = glide(bob.mouth, 0, 22, dt);   // snap shut, HARD
      restArm(dt, 3);

      if (attack.timer <= 0) {
        bob.biteCount++;

        // He bit exactly where the circle was. Not nearly - exactly,
        // because both of them read the same two numbers.
        attack.jawX = attack.biteX;
        attack.jawZ = attack.biteZ;

        shake = Math.max(shake, 1.2);
        soundChomp();
        deckBurst(attack.jawX, attack.jawZ);

        // Were you between his teeth?
        if (Math.hypot(hero.x - attack.jawX, hero.z - attack.jawZ) < BITE_R) {
          hurt('CHOMPED!', 'get off the circle - he lands right on it');
        }

        // Ten clean bites. The eleventh is the one that ruins him.
        if (bob.biteCount > BITES_TO_STICK) {
          bob.mouthStuck = true;
          bob.headHits = 0;
          attack.phase = 'jawstuck';
          attack.timer = 999;
          flash = Math.max(flash, 0.6);
        } else {
          attack.phase = 'biteup';
          attack.timer = 0.8;
        }
      }
    }

    // ---- THE BITE: he hauls himself back up ---------------------------
    // And he gets OFF you fast. Sitting on the camera between bites was
    // the whole problem - so the retreat is quicker than the wind-up.
    else if (attack.phase === 'biteup') {
      bob.y = glide(bob.y, BOB_STAND, 5, dt);
      bob.z = glide(bob.z, attack.biteZ + BITE_STANDOFF, 5, dt);

      bob.headPitch = glide(bob.headPitch, -0.35, 5, dt);
      bob.mouth = Math.abs(Math.sin(bob.sway * 12)) * 0.5;   // chewing
      restArm(dt, 3);

      if (attack.timer <= 0) startBite();
    }

    // ---- HIS JAWS ARE STUCK IN THE DECK -------------------------------
    // His head is down at your level and it is going nowhere. This is
    // the shot the whole fight has been building to.
    else if (attack.phase === 'jawstuck') {
      const heave = Math.sin(bob.sway * 8);

      // Pin him. His teeth are IN the planks, so he cannot drift even
      // a little - the head you're swinging at has to stay put.
      bob.x = attack.jawX;
      bob.z = attack.jawZ + JAW_OFFSET;
      bob.y = BOB_BITE_Y;

      bob.headPitch = -1.2 + heave * 0.05;    // straining to pull free
      bob.mouth = 0.15 + Math.abs(heave) * 0.1;
      shake = Math.max(shake, 0.2 + Math.abs(heave) * 0.14);
      restArm(dt, 3);

      if (Math.random() < dt * 2.5) playTone(65, 40, 0.5, 0.18, 'sawtooth');

      const gap = Math.hypot(hero.x - attack.jawX, hero.z - attack.jawZ);
      bigText = (gap > WRENCH_REACH)
        ? 'HIS HEAD! GET TO IT!'
        : 'RIGHT-CLICK! ' + (HEAD_HITS - bob.headHits) + ' TO GO';
      bigTextFade = 1;
    }

    // ---- THE LITTLE ONES: the doors grind open -----------------------
    else if (attack.phase === 'hatch') {
      restArm(dt, 3);
      bob.chestOpen = glide(bob.chestOpen, 1, 3, dt);
      shake = Math.max(shake, 0.22);        // the whole ship judders
      bigText = 'HIS CHEST IS OPENING';
      bigTextFade = 1;

      if (attack.timer <= 0) {
        spawnMinis();
        attack.phase = 'minis';
        attack.timer = 999;      // ends when they're DEAD, not on a clock
      }
    }

    // ---- THE LITTLE ONES: he just watches ----------------------------
    // Bob does nothing at all while they're out. He's had his go. This
    // bit is entirely between you and them.
    else if (attack.phase === 'minis') {
      restArm(dt, 3);

      bigText = minis.length + ' LEFT - RIGHT-CLICK THEM';
      bigTextFade = 1;

      if (minis.length === 0) {
        bigText = 'GOT THEM ALL!';
        bigTextFade = 1;
        attack.phase = 'recover';
        attack.timer = 1.8;
      }
    }

    // ---- CANNON: reach down and feel about on the sea floor ----------
    else if (attack.phase === 'reach') {
      attack.armPitch = glide(attack.armPitch, 0, 5, dt);        // straight down
      attack.armX     = glide(attack.armX, armHomeX(), 5, dt);
      attack.armLen   = glide(attack.armLen, CANNON_DIVE_LEN, 4, dt);
      attack.cannonUp = 0;

      foam = Math.min(1, foam + dt * 1.6);    // the sea churns round him
      splashAtHand(dt);
      bigText = 'WHAT IS HE DOING?';
      bigTextFade = 1;

      if (attack.timer <= 0) {
        bob.hasCannon = true;                 // GOT IT. Never lets go.
        attack.phase = 'haul';
        attack.timer = 1.4;
        bigText = 'HE FOUND A CANNON';
        bigTextFade = 1;
        shake = Math.max(shake, 0.7);
        soundHaul();
      }
    }

    // ---- CANNON: drag it up out of the water -------------------------
    else if (attack.phase === 'haul') {
      attack.armLen   = glide(attack.armLen, ARM_REST_LEN, 3.2, dt);
      attack.cannonUp = 0;                    // still dangling, pointing down
      foam = glide(foam, 0.4, 1.2, dt);

      // Water sheets off it for the first half-second it's clear.
      if (attack.timer > 0.85) splashAtHand(dt);

      if (attack.timer <= 0) { attack.phase = 'shoulder'; attack.timer = 0.9; }
    }

    // ---- CANNON: up onto the shoulder, bazooka style -----------------
    else if (attack.phase === 'shoulder') {
      // Arm folded up and forward, hand under the barrel, holding it
      // steady. These three numbers are the whole pose - if it looks
      // wrong when you run it, THESE are the ones to fiddle with.
      attack.armPitch = glide(attack.armPitch, 1.15, 6, dt);   // forward
      attack.armLen   = glide(attack.armLen, ARM_REST_LEN * 0.55, 6, dt);
      attack.armX     = glide(attack.armX, armHomeX(), 5, dt);

      if (attack.timer <= 0) {
        attack.phase = 'boom';
        attack.timer = 99;          // this phase ends when the SHOTS run
        attack.fired = 0;           // out, not when a clock does
        attack.fireTimer = 0.3;
      }
    }

    // ---- CANNON: twelve shots, one at a time -------------------------
    else if (attack.phase === 'boom') {
      // Hold the bazooka pose steady while he unloads.
      attack.armPitch = glide(attack.armPitch, 1.15, 6, dt);
      attack.armLen   = glide(attack.armLen, ARM_REST_LEN * 0.55, 6, dt);

      bigText = 'INCOMING!';
      bigTextFade = 1;

      attack.fireTimer -= dt;
      if (attack.fired < CANNON_SHOTS && attack.fireTimer <= 0) {
        // THE ONE LINE THAT MATTERS. muzzleWorld() says where the end
        // of the barrel is right now, and handing it to fireBomb makes
        // the missile start THERE instead of in his mouth.
        const m = muzzleWorld();
        fireBomb(attack.fired === 0, m);

        sparksAt(m.x, m.y, m.z);          // muzzle flash
        attack.recoil = 1;                // kick it back
        shake = Math.max(shake, 0.45);

        attack.fired++;
        attack.fireTimer = CANNON_GAP;
      }

      // All twelve gone AND the sky is clear? Then he's finished.
      if (attack.fired >= CANNON_SHOTS && bombs.length === 0) {
        attack.phase = 'stow';
        attack.timer = 2.0;
        bigText = '';
      }
    }

    // ---- CANNON: he drops it back in the sea -------------------------
    // He doesn't keep it. He lobs it back over the side - which means
    // next time round he has to go fishing for it all over again.
    else if (attack.phase === 'stow') {
      attack.cannonUp = glide(attack.cannonUp, 0, 3.5, dt);   // off the shoulder
      attack.armPitch = glide(attack.armPitch, 0, 3, dt);     // arm swings down
      attack.armLen   = glide(attack.armLen, CANNON_DIVE_LEN, 3, dt);

      // Once his hand is under the surface, start throwing water about.
      if (handWorld().y < WATER_Y) { splashAtHand(dt); foam = Math.min(1, foam + dt * 1.4); }

      if (attack.timer <= 0) {
        bob.hasCannon = false;      // gone. He'll have to find it again.
        attack.cannonUp = 0;
        bigText = 'HE DROPPED IT';
        bigTextFade = 1;
        shake = Math.max(shake, 0.6);
        soundHaul();
        attack.phase = 'recover';
        attack.timer = 1.4;
      }
    }

    // ---- FLAMING SKULLS: wind the hook arm right back ----------------
    else if (attack.phase === 'rear') {
      attack.armPitch = glide(attack.armPitch, -1.5, 6, dt);
      attack.armX     = glide(attack.armX, armHomeX(), 4, dt);
      if (attack.timer <= 0) {
        attack.phase = 'hurl';
        attack.fireTimer = 0.45;    // he's already wound up, so sling it
        attack.thrown = false;
      }
    }

    // ---- FLAMING SKULLS: hurl them ONE AT A TIME ---------------------
    // Each skull gets a whole throw to itself. The cycle lasts about a
    // second: haul the arm back over his shoulder, then sling it
    // forward. Then do it all again for the next one.
    else if (attack.phase === 'hurl') {
      attack.fireTimer -= dt;
      attack.armLen = glide(attack.armLen, ARM_REST_LEN, 8, dt);

      if (attack.fireTimer > 0.42) {
        // WIND UP - slow and heavy, hauling it right back.
        attack.armPitch = glide(attack.armPitch, -1.55, 7, dt);
        attack.thrown = false;
      } else {
        // WHIP - fling it forward. 20 is four times as fast as the
        // wind-up, and that difference is the whole feel of a throw.
        attack.armPitch = glide(attack.armPitch, 1.45, 20, dt);

        // THE SKULL LEAVES HIS HAND WHEN THE ARM SWINGS PAST THE FRONT.
        // Not after some number of seconds - we watch the arm and let
        // go at the right moment. Change the swing speed and the throw
        // still looks right, because the release follows the arm.
        if (!attack.thrown && attack.armPitch > 0.85) {
          if (attack.fired < 5) { throwSkull(); attack.fired++; }
          attack.thrown = true;
        }
      }

      if (attack.fireTimer <= 0) {
        if (attack.fired >= 5) {
          attack.phase = 'recover';
          attack.timer = 1.0;
        } else {
          attack.fireTimer = 1.05;      // wind up for the next one
        }
      }
    }

    // ---- MISSILE BARRAGE: crane back and open up ---------------------
    else if (attack.phase === 'aim') {
      bob.headPitch = glide(bob.headPitch, 0.85, 5, dt);
      bob.mouth     = glide(bob.mouth, 1, 6, dt);
      restArm(dt, 4);
      if (attack.timer <= 0) { attack.phase = 'fire'; attack.timer = 2.6; }
    }

    // ---- MISSILE BARRAGE: five of them, one at a time ----------------
    else if (attack.phase === 'fire') {
      bob.headPitch = 0.85;
      bob.mouth = 1;
      restArm(dt, 4);

      attack.fireTimer -= dt;
      if (attack.fired < 5 && attack.fireTimer <= 0) {
        fireBomb(attack.fired === 0);      // is this the first of the five?
        attack.fired++;
        attack.fireTimer = 0.45;
      }

      if (attack.fired >= 5 && attack.timer <= 0) {
        attack.phase = 'recover';
        attack.timer = 1.2;
      }
    }

    else if (attack.phase === 'warn') {
      // glow crawls from 0 to 1 as the moment gets closer.
      attack.glow = 1 - Math.max(0, attack.timer) / 1.7;
      // Wind the hook up over his head. Negative angle = backwards.
      attack.armPitch = glide(attack.armPitch, -1.6, 5, dt);
      attack.armLen   = glide(attack.armLen, ARM_REST_LEN, 5, dt);
      attack.armX     = glide(attack.armX, attack.aimX, 3, dt);
      if (attack.timer <= 0) { attack.phase = 'slam'; attack.timer = 0.16; }
    }

    else if (attack.phase === 'slam') {
      attack.glow = 1;
      // 26 is a BRUTAL glide speed. The arm covers the whole swing in
      // about a sixth of a second, which is why it feels like a whip.
      attack.armPitch = glide(attack.armPitch, attack.aimPitch, 26, dt);
      attack.armLen   = glide(attack.armLen, attack.aimLen, 26, dt);
      attack.armX     = glide(attack.armX, attack.aimX, 26, dt);
      if (attack.timer <= 0) {
        impact();

        // On the FOURTH attack, the hook doesn't come back out.
        if (attack.kind === 'stuckslam') {
          attack.phase = 'stuck';
          attack.timer = 9.0;      // how long you get before he wrenches free
          attack.armHits = 0;
          bigText = 'HIT HIS ARM WITH THE WRENCH!';
          bigTextFade = 1;
        } else {
          attack.phase = 'recover';
          attack.timer = 1.1;
        }
      }
    }

    // ---- STUCK: the hook is buried and he can't pull it out ---------
    else if (attack.phase === 'stuck') {
      // He heaves at it. The arm judders, and so does the whole world.
      const heave = Math.sin(bob.sway * 9);
      attack.armLen = attack.aimLen + heave * 0.35;
      attack.armPitch = attack.aimPitch + heave * 0.04;
      shake = Math.max(shake, 0.18 + Math.abs(heave) * 0.12);
      attack.glow = 0.4 + heave * 0.2;

      // A grunt of effort every so often.
      if (Math.random() < dt * 2.2) playTone(70, 45, 0.5, 0.16, 'sawtooth');

      // Tell you what to do, and change the message once you're close.
      const gap = Math.hypot(hero.x - attack.cx, hero.z - attack.cz);
      bigText = (gap > WRENCH_REACH)
        ? 'RUN TO HIS ARM!'
        : 'RIGHT-CLICK! ' + (HITS_TO_RIP - attack.armHits) + ' TO GO';
      bigTextFade = 1;

      // Ran out of time? He rips it free himself and you missed your shot.
      if (attack.timer <= 0) {
        bigText = 'HE PULLED IT FREE!';
        bigTextFade = 1;
        attack.phase = 'recover';
        attack.timer = 1.2;
        shake = 1.0;
        soundSlam();
      }
    }

    else {  // recover - he heaves the hook back out of the deck
      attack.glow = Math.max(0, attack.glow - dt * 3);
      restArm(dt, 2.6);
      if (attack.timer <= 0) { attack.phase = 'wait'; attack.timer = 1.7; }
    }
  }

  // Where the attacking arm parks when it's not doing anything.
  //
  // His hook arm sits at +6.6 and his claw arm sits at -6.6 - the same
  // distance out, just the other way. So instead of writing the number
  // twice we write it ONCE and multiply by activeArm, which is +1 or -1.
  // Now the arm parks on the correct side no matter which one is live.
  function armHomeX() {
    return 6.6 * bob.activeArm;
  }

  function restArm(dt, speed) {
    attack.armPitch = glide(attack.armPitch, 0, speed, dt);
    attack.armLen   = glide(attack.armLen, ARM_REST_LEN, speed, dt);
    attack.armX     = glide(attack.armX, armHomeX(), speed, dt);
  }

  // Paint the red line onto the deck.
  function drawWarningLine() {
    if (attack.phase !== 'warn' && attack.phase !== 'slam') return;

    // The pulse gets FASTER as well as brighter. A thing flashing
    // quicker is the clearest way a game can shout "hurry up".
    const beat = Math.sin(bob.sway * (9 + attack.glow * 34));
    const red = Math.min(255, 110 + attack.glow * 120 + beat * 45);
    const rest = 26 + attack.glow * 30;
    const colour = 'rgb(' + (red | 0) + ',' + (rest | 0) + ',' + (rest | 0) + ')';

    // Chop the line into chunks so each chunk sorts against the planks
    // around it properly, instead of one huge strip guessing once.
    const chunks = 26, halfLen = 46, hw = LINE_HALF_WIDTH;
    for (let i = 0; i < chunks; i++) {
      const a = -halfLen + (i / chunks) * halfLen * 2;
      const b = -halfLen + ((i + 1) / chunks) * halfLen * 2;
      const ax = attack.cx + attack.dx * a, az = attack.cz + attack.dz * a;
      const bx = attack.cx + attack.dx * b, bz = attack.cz + attack.dz * b;

      addFace([
        [ax + attack.nx * hw, 0.06, az + attack.nz * hw],
        [bx + attack.nx * hw, 0.06, bz + attack.nz * hw],
        [bx - attack.nx * hw, 0.06, bz - attack.nz * hw],
        [ax - attack.nx * hw, 0.06, az - attack.nz * hw]
      ], colour, 0.45);
    }
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const keys = {};
  window.addEventListener('keydown', function (e) {
    keys[e.key.toLowerCase()] = true;
    // Stop the arrow keys from scrolling the page around.
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    pressed();
    if (e.key === ' ') swingWrench();
    if (e.key.toLowerCase() === 'm') toggleMusic();    // M turns the band off
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  // Tapping or clicking the screen counts as a button press too, so
  // this works on a phone as well as with a mouse.
  window.addEventListener('pointerdown', function (e) { pressed(e); });

  // Right-clicking normally pops up the browser's own little menu,
  // which would land right on top of the game. This says "no thanks" -
  // the right button belongs to us now.
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function pressed(e) {
    startAudio();                       // the first tap switches sound on
    grabMouse();                        // ...and hands us the mouse

    // RIGHT MOUSE BUTTON = SWING THE WRENCH.
    // Buttons are numbered: 0 is left, 1 is the wheel, 2 is right.
    // We stop here so a right-click never does anything else.
    if (e && e.button === 2) {
      swingWrench();
      return;
    }

    if (state === 'title') {
      beginCutscene();
    } else if (state === 'cutscene' && sceneTime > 0.6) {
      // Seen it already? Skip it.
      state = 'fight';
      bob.y = BOB_STAND;
      bob.mouth = 0;
      bob.headPitch = 0;
      missile.alive = false;
      missile.puffs = [];
      shards = [];
      flash = 0;
      foam = 0.35;
      bigText = '';
      bigTextFade = 0;
      startMusic();          // skipped the film? You still get the band.
    }
  }

  function held(a, b) {
    return keys[a] || keys[b];
  }


// -------------------------------------------------------------------
//  THE MOUSE
// -------------------------------------------------------------------
//  Normally the mouse pointer stops at the edge of the screen, which
//  would mean you could only ever turn so far. "Pointer lock" hides the
//  pointer and hands us the RAW movement instead - "the mouse moved 12
//  pixels right" - which can go on forever. That's how every shooter
//  in the world does it.
//
//  Press ESC any time to get your normal mouse pointer back.
// -------------------------------------------------------------------

  const MOUSE_SPEED = 0.0026;    // bigger = twitchier aim
  const LOOK_UP_LIMIT   = 0.95;  // how far up you can crane (in radians)
  const LOOK_DOWN_LIMIT = -0.45; // and how far down

  function mouseIsCaptured() {
    return document.pointerLockElement === canvas;
  }

  function grabMouse() {
    if (!mouseIsCaptured() && canvas.requestPointerLock) {
      canvas.requestPointerLock();
    }
  }

  window.addEventListener('mousemove', function (e) {
    if (!mouseIsCaptured()) return;

    // Mouse right = turn right.
    hero.yaw += e.movementX * MOUSE_SPEED;

    // Mouse UP is a NEGATIVE movementY, because screens count downwards.
    // So we subtract, and then pushing the mouse forward looks up.
    hero.pitch -= e.movementY * MOUSE_SPEED;

    // Stop you from looking so far up that you flip over backwards.
    hero.pitch = Math.max(LOOK_DOWN_LIMIT, Math.min(LOOK_UP_LIMIT, hero.pitch));
  });


// ===================================================================
//  PHONE AND TABLET CONTROLS
// ===================================================================
//  No mouse and no keyboard, so we hand out the screen instead:
//
//     LEFT half  - drag your thumb to walk. Wherever you first touch
//                  becomes the middle of the stick, so you never have
//                  to look down and aim for a button.
//     RIGHT half - drag to look around.
//     The button - swing the wrench.
//
//  Every touch gets its own pointerId, which is how we can tell them
//  apart and let you walk and look AT THE SAME TIME with two thumbs.
// ===================================================================

  let touchMode = false;                       // has anyone touched the screen?
  const TOUCH_LOOK = 0.0055;
  const STICK_MAX  = 62;                       // how far the thumb stick moves

  const stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const look  = { id: null, lx: 0, ly: 0 };

  function wrenchButton() {
    const r = Math.min(58, W * 0.11);
    return { x: W - r - 26, y: H - r - 26, r: r };
  }

  window.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;

    if (!touchMode) {
      touchMode = true;
      hudEl.innerHTML = 'LEFT thumb walks &nbsp;&middot;&nbsp; RIGHT thumb looks';
    }

    // The wrench button wins over everything else.
    const b = wrenchButton();
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 14) {
      swingWrench();
      return;
    }

    // Left half of the screen = the walking stick.
    if (e.clientX < W * 0.5 && stick.id === null) {
      stick.id = e.pointerId;
      stick.ox = e.clientX;      // this touch becomes the middle of the stick
      stick.oy = e.clientY;
      stick.x = 0; stick.y = 0;
      return;
    }

    // Right half = looking around.
    if (look.id === null) {
      look.id = e.pointerId;
      look.lx = e.clientX;
      look.ly = e.clientY;
    }
  });

  window.addEventListener('pointermove', function (e) {
    if (e.pointerId === stick.id) {
      let dx = e.clientX - stick.ox;
      let dy = e.clientY - stick.oy;

      // Don't let the stick go further than STICK_MAX from the middle.
      // If it's too far out, squash it back onto the edge of the circle.
      const len = Math.hypot(dx, dy);
      if (len > STICK_MAX) { dx = dx / len * STICK_MAX; dy = dy / len * STICK_MAX; }

      stick.x = dx / STICK_MAX;      // -1 (left) to 1 (right)
      stick.y = dy / STICK_MAX;      // -1 (up)   to 1 (down)
    }

    else if (e.pointerId === look.id) {
      hero.yaw   += (e.clientX - look.lx) * TOUCH_LOOK;
      hero.pitch -= (e.clientY - look.ly) * TOUCH_LOOK;
      hero.pitch = Math.max(LOOK_DOWN_LIMIT, Math.min(LOOK_UP_LIMIT, hero.pitch));
      look.lx = e.clientX;
      look.ly = e.clientY;
    }
  });

  function letGo(e) {
    if (e.pointerId === stick.id) { stick.id = null; stick.x = 0; stick.y = 0; }
    if (e.pointerId === look.id)  { look.id = null; }
  }
  window.addEventListener('pointerup', letGo);
  window.addEventListener('pointercancel', letGo);

  // Draw the stick and the wrench button on top of the game.
  function drawTouchControls() {
    if (!touchMode || state !== 'fight') return;

    // The walking stick, but only while a thumb is actually down.
    if (stick.id !== null) {
      ring(stick.ox, stick.oy, STICK_MAX, 'rgba(255,255,255,0.16)', 3);
      const kx = stick.ox + stick.x * STICK_MAX;
      const ky = stick.oy + stick.y * STICK_MAX;
      ring(kx, ky, 26, 'rgba(255,217,138,0.75)', 4);
    }

    // The wrench button.
    const b = wrenchButton();
    const pressedNow = hero.swingTimer > 0;
    ring(b.x, b.y, b.r, pressedNow ? 'rgba(255,120,60,0.9)'
                                   : 'rgba(255,255,255,0.35)', 4);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = (b.r * 0.9) + 'px system-ui, sans-serif';
    ctx.fillText('🔧', b.x, b.y + b.r * 0.32);
  }

  function ring(x, y, r, colour, width) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = width;
    ctx.strokeStyle = colour;
    ctx.stroke();
  }


// -------------------------------------------------------------------
//  UPDATE - runs about 60 times a second. Moves everything.
//  dt is how many seconds passed since the last frame. Multiplying by
//  dt means the game runs the same speed on a fast or slow computer.
// -------------------------------------------------------------------

  function update(dt) {

    bob.sway += dt;    // keeps Bob creaking gently instead of standing frozen

    // Bob always turns to face you. He does it slowly, because he
    // weighs about four tons - and it means if you sprint round behind
    // him you get a couple of seconds while he's still coming about.
    //
    // BUT: once he's picked his line and started winding up, he's
    // committed. If he kept turning, the arm would swing somewhere
    // other than the line he showed you - and a boss that lies to you
    // is just unfair.
    const committed = (attack.phase === 'warn' || attack.phase === 'slam');
    if (!committed) {
      bob.yaw = turnTowards(bob.yaw, yawTowardsHero(), 1.6, dt);
    }

    // These keep running no matter what's going on, so the missile and
    // the fireball still behave properly during the cutscene.
    updateMissile(dt);
    updateBombs(dt);
    updateSkulls(dt);
    updateMinis(dt);
    updateShards(dt);

    if (state === 'title') {
      // Slow drifting shot of the empty sea while you decide to press start.
      cam.x = 9; cam.y = 2.0; cam.z = 4;
      lookAt(0, WATER_Y + 2, bob.z);
      return;
    }

    if (state === 'cutscene') {
      runCutscene(dt);
      return;
    }

    // YOU WON. Bob stays exactly where he fell, headless, and the camera
    // sits and looks at what you did. Nothing restarts. Nothing counts
    // down. You get to just stand there.
    if (state === 'won') {
      wonTimer += dt;
      bob.sway += dt;
      restArm(dt, 3);

      const want = followSpot();
      cam.x = want.x; cam.y = want.y; cam.z = want.z;
      cam.yaw = want.yaw; cam.pitch = want.pitch;
      return;
    }

    // Squashed. Hold still for a moment, then put you back on your feet.
    if (state === 'squashed') {
      restArm(dt, 3);
      const want = followSpot();
      cam.x = want.x; cam.y = want.y; cam.z = want.z;
      cam.yaw = want.yaw; cam.pitch = want.pitch;
      squashTimer -= dt;
      if (squashTimer <= 0) restartFight();
      return;
    }

    // ---- YOU'RE IN CONTROL NOW --------------------------------------

    // Head back down to eye level and jaw shut, unless an attack is
    // busy overriding these a few lines further down.
    bob.headPitch = glide(bob.headPitch, 0, 3, dt);
    bob.mouth     = glide(bob.mouth, 0, 4, dt);

    // Any message on screen quietly fades unless something keeps
    // shouting it. The stuck-arm phase shouts it every frame.
    bigTextFade = Math.max(0, bigTextFade - dt * 0.5);

    wrenchTick(dt);
    updateAttack(dt);

    // The arrow keys still turn you, so the game still works if you
    // haven't got a mouse. The mouse does it better though.
    if (keys['arrowleft'])  hero.yaw -= hero.turnSpeed * dt;
    if (keys['arrowright']) hero.yaw += hero.turnSpeed * dt;

    // Forwards and backwards
    let step = 0;
    if (held('arrowup',   'w')) step =  1;
    if (held('arrowdown', 's')) step = -1;

    // Sideways. This is called STRAFING - sliding left and right
    // WITHOUT turning, so you can circle round Bob while still staring
    // straight at him. It's how you dodge things in a shooter.
    let side = 0;
    if (keys['a']) side = -1;
    if (keys['d']) side =  1;

    // The thumb stick joins in on top of the keyboard. Up on the screen
    // is forward, and screen y counts DOWNWARDS, so it gets a minus.
    if (stick.id !== null) {
      step += -stick.y;
      side +=  stick.x;
    }
    step = Math.max(-1, Math.min(1, step));
    side = Math.max(-1, Math.min(1, side));

    if (step !== 0 || side !== 0) {
      // "Forwards" as an arrow: sin and cos turn an angle into x and z.
      hero.x += Math.sin(hero.yaw) * hero.walkSpeed * step * dt;
      hero.z += Math.cos(hero.yaw) * hero.walkSpeed * step * dt;

      // "Right" is just "forwards" turned a quarter turn, which swaps
      // the sin and cos over and flips one sign. That's all a quarter
      // turn ever is.
      hero.x += Math.cos(hero.yaw) * hero.walkSpeed * side * dt;
      hero.z -= Math.sin(hero.yaw) * hero.walkSpeed * side * dt;

      hero.bounce += dt;              // only bob while actually moving
    }

    // Don't walk through the railing.
    const edge = DECK - 1.5;
    hero.x = Math.max(-edge, Math.min(edge, hero.x));
    hero.z = Math.max(-edge, Math.min(edge, hero.z));

    // The camera sits behind your shoulder and looks slightly down.
    const want = followSpot();
    cam.x = want.x; cam.y = want.y; cam.z = want.z;
    cam.yaw = want.yaw; cam.pitch = want.pitch;
  }


// -------------------------------------------------------------------
//  DRAW - paint one whole picture
// -------------------------------------------------------------------

  function draw() {

    // When the bomb goes off, rattle the camera about a bit. It's a
    // tiny thing but it's most of why an explosion FEELS big.
    const savedX = cam.x, savedY = cam.y;
    if (shake > 0) {
      cam.x += (Math.random() - 0.5) * shake * 1.2;
      cam.y += (Math.random() - 0.5) * shake * 1.2;
    }

    drawBackground();

    faces = [];        // empty the list, we rebuild it every single frame
    drawDeck();
    drawWarningLine();
    drawBombDots();
    drawBiteRing();
    drawFallenArms();
    drawFallenHead();
    drawFoam();
    drawHero();
    drawBob();
    drawMissile();
    drawBombs();
    drawSkulls();
    drawMinis();
    drawShards();

    // Furthest away gets painted FIRST, so close things end up on top.
    faces.sort(function (a, b) { return b.depth - a.depth; });

    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) {
        ctx.lineTo(f.points[i].x, f.points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }

    cam.x = savedX; cam.y = savedY;    // undo the shake for next frame

    drawOverlay();
  }


// -------------------------------------------------------------------
//  OVERLAY - the flash, the big words, and the title screen.
//  These are painted flat on top, AFTER all the 3D. No maths needed.
// -------------------------------------------------------------------

  const hudEl = document.getElementById('hud');

  // ---- ONE HEART ----------------------------------------------------
  // There's no "heart" shape in canvas. But a heart is really just TWO
  // CIRCLES sitting side by side with a TRIANGLE hanging underneath -
  // and canvas definitely has circles and triangles. Nearly every shape
  // you'll ever want is a couple of shapes you already have.
  function heartPath(x, y, size) {
    const r = size * 0.29;               // how big each top lump is

    ctx.beginPath();
    ctx.arc(x - r, y, r, Math.PI, 0);                    // left lump
    ctx.arc(x + r, y, r, Math.PI, 0);                    // right lump
    ctx.lineTo(x + r * 2, y + r * 0.15);
    ctx.lineTo(x, y + size * 0.66);                      // down to the point
    ctx.lineTo(x - r * 2, y + r * 0.15);
    ctx.closePath();
  }

  function drawHearts() {
    const size = Math.min(W * 0.045, 30);
    const gap  = size * 1.25;
    const left = size * 0.9;
    const top  = size * 0.9;

    for (let i = 0; i < hero.maxHearts; i++) {
      const x = left + i * gap;
      const full = i < hero.hearts;      // is heart number i still filled in?

      // The empty ones don't disappear - they stay as dark outlines. You
      // need to see what you've LOST, not just what you've got left.
      heartPath(x, top, size);
      ctx.fillStyle = full ? '#e8324a' : 'rgba(0,0,0,0.42)';
      ctx.fill();

      ctx.lineWidth = 2;
      ctx.strokeStyle = full ? '#ffd0d8' : 'rgba(255,255,255,0.32)';
      ctx.stroke();
    }
  }

  function drawOverlay() {

    // Only show the controls hint once you're actually in control.
    hudEl.style.opacity = (state === 'fight') ? '1' : '0';

    // ---- YOU WON -----------------------------------------------------
    if (state === 'won') {
      // A warm gold wash that fades UP over two seconds instead of
      // slapping you in the face, so you get a moment to see the wreck
      // before the words arrive.
      const fade = Math.min(1, wonTimer / 2.0);

      ctx.fillStyle = 'rgba(255,190,60,' + (fade * 0.22) + ')';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.12, 88) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,' + fade + ')';
      ctx.fillText('BOB IS DOWN', W / 2 + 5, H * 0.44 + 5);
      ctx.fillStyle = 'rgba(255,224,138,' + fade + ')';
      ctx.fillText('BOB IS DOWN', W / 2, H * 0.44);

      if (wonTimer > 1.4) {
        const late = Math.min(1, (wonTimer - 1.4) / 1.2);
        ctx.font = Math.min(W * 0.038, 22) + 'px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255,240,214,' + late + ')';
        ctx.fillText('both arms, twelve cannonballs, three little ones ' +
                     'and eleven bites', W / 2, H * 0.56);
        ctx.fillText('and you still had ' + hero.hearts +
                     (hero.hearts === 1 ? ' heart left' : ' hearts left'),
                     W / 2, H * 0.62);
      }
      return;
    }

    // ---- SQUASHED ----------------------------------------------------
    if (state === 'squashed') {
      // Red wash over everything, fading as you get back up.
      const strong = Math.min(1, squashTimer / 2.2);
      ctx.fillStyle = 'rgba(150,10,10,' + (strong * 0.7) + ')';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.11, 76) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#000';
      ctx.fillText(squashWord, W / 2 + 4, H * 0.47 + 4);
      ctx.fillStyle = '#ffe08a';
      ctx.fillText(squashWord, W / 2, H * 0.47);

      ctx.font = Math.min(W * 0.035, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd0d0';
      ctx.fillText(squashHint, W / 2, H * 0.58);
      return;      // nothing else gets drawn while you're jam
    }

    // The white flash of the explosion.
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,245,220,' + (flash * 0.85) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // ---- THE RED GLOW WHEN YOU GET HIT -------------------------------
    // Dark round the edges and clear in the middle, so it reads as "ouch"
    // without blinding you at the exact moment you need to dodge.
    if (hurtFlash > 0) {
      const glow = ctx.createRadialGradient(W / 2, H / 2, H * 0.25,
                                            W / 2, H / 2, H * 0.75);
      glow.addColorStop(0, 'rgba(190,20,20,0)');
      glow.addColorStop(1, 'rgba(190,20,20,' + (hurtFlash * 0.85) + ')');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'fight') drawHearts();

    // Cinematic black bars, so it feels like a film and not a game.
    if (state === 'cutscene') {
      const bar = H * 0.09;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, bar);
      ctx.fillRect(0, H - bar, W, bar);
    }

    // ---- THE CROSSHAIR ----------------------------------------------
    // It lives dead in the middle of the screen and never moves. That
    // sounds wrong for something "controlled by the mouse" - but the
    // mouse turns the whole WORLD underneath it. The crosshair stays
    // put and everything else swings around to meet it.
    if (state === 'fight') {
      const mx = W / 2, my = H / 2;
      const gap = 7, arm = 13;

      // Draw it twice: a fat dark version first, then a thin bright one
      // on top. That outline is what stops it vanishing against Bob.
      for (const pass of [{ width: 4.5, colour: 'rgba(0,0,0,0.55)' },
                          { width: 2.0, colour: '#ff5a3c' }]) {
        ctx.lineWidth = pass.width;
        ctx.strokeStyle = pass.colour;
        ctx.beginPath();
        ctx.moveTo(mx - gap - arm, my); ctx.lineTo(mx - gap, my);   // left
        ctx.moveTo(mx + gap, my); ctx.lineTo(mx + gap + arm, my);   // right
        ctx.moveTo(mx, my - gap - arm); ctx.lineTo(mx, my - gap);   // up
        ctx.moveTo(mx, my + gap); ctx.lineTo(mx, my + gap + arm);   // down
        ctx.stroke();
      }

      // A dot in the middle, so you know exactly where "exactly" is.
      ctx.fillStyle = '#ffd98a';
      ctx.fillRect(mx - 1.5, my - 1.5, 3, 3);
    }

    drawTouchControls();

    ctx.textAlign = 'center';

    // If the game hasn't got hold of the mouse, say so. Not on a phone
    // though - there's no mouse to grab.
    if (state === 'fight' && !mouseIsCaptured() && !touchMode) {
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,217,138,0.85)';
      ctx.fillText('click to aim with the mouse', W / 2, H * 0.63);
    }

    // The big words that appear during the cutscene.
    if (bigText && bigTextFade > 0.01) {
      const size = Math.min(W * 0.075, 54);
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      ctx.globalAlpha = bigTextFade;
      ctx.fillStyle = '#000';
      ctx.fillText(bigText, W / 2 + 3, H * 0.72 + 3);
      ctx.fillStyle = '#ffd98a';
      ctx.fillText(bigText, W / 2, H * 0.72);
      ctx.globalAlpha = 1;
    }

    // The title screen.
    if (state === 'title') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      const big = Math.min(W * 0.1, 68);
      ctx.font = 'bold ' + big + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ff6a3c';
      ctx.fillText('BOB', W / 2, H * 0.34);
      ctx.font = 'bold ' + (big * 0.42) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd98a';
      ctx.fillText('THE ROBOT PIRATE', W / 2, H * 0.44);

      ctx.font = (Math.min(W * 0.035, 20)) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#cfcfe4';
      ctx.fillText('press any key  ·  or tap the screen', W / 2, H * 0.62);
      ctx.fillStyle = '#7c7c96';
      ctx.fillText('a game by Maximus', W / 2, H * 0.70);
    }

    // A hint that you're allowed to skip the film.
    if (state === 'cutscene' && sceneTime > 1.2) {
      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(220,220,240,0.5)';
      ctx.fillText('tap to skip', W / 2, H * 0.955);
    }
  }


// -------------------------------------------------------------------
//  THE GAME LOOP - the heartbeat. Update, draw, repeat, forever.
// -------------------------------------------------------------------

  let lastTime = 0;

  function frame(now) {
    // now is measured in milliseconds, so divide by 1000 to get seconds.
    let dt = (now - lastTime) / 1000;
    lastTime = now;

    // If you switch tabs and come back, dt could be HUGE and you'd
    // teleport across the map. Cap it so that can't happen.
    if (!dt || dt > 0.1) dt = 0.016;

    update(dt);
    draw();

    requestAnimationFrame(frame);   // "call me again next frame please"
  }

  requestAnimationFrame(frame);

</script>
</body>
</html>
