<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BEAT THE BOT</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beat the Bot">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #10141c; color: #e6ecf5;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 4px;
    text-align: center; font-size: 13px; color: #6b7a90;
    pointer-events: none;
    /* It fades away the moment you build your first thing - once you know
       how, being told again is just something in the way. */
    transition: opacity 0.6s;
  }
</style>
</head>
<body>

<canvas id="screen"></canvas>
<div id="hud">TAP to build &nbsp;&nbsp; stop the robots reaching the flag at the TOP</div>

<script>
// ===================================================================
//  BEAT THE BOT
//
//  A line of robots is coming. They all want the flag at the top.
//  You have coins. Stop them.
//
//  The whole thing lives or dies on ONE promise: the robots are not
//  pretending. Each one genuinely works out the cheapest way up
//  through whatever you have built. If it goes the long way round,
//  that is because the long way round really was cheaper.
//
//  What they CANNOT do is see the future. A saw pops up and drops
//  back down; a hammer falls when it falls. The robots creep past
//  them and take their chances - and creeping is exactly what gets
//  them caught.
//
//  Which is why the two halves of this game multiply each other. A
//  longer climb is more seconds spent next to your saws.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  THE TOWER
// -------------------------------------------------------------------

  const COLS = 13, ROWS = 15;
  const FLOOR = ROWS - 1;              // the solid ground at the bottom
  const RISE  = 3;                     // a new ledge every 3 rows going up

  // What a robot's legs can do. Everything the brain works out is built
  // on these two numbers.
  const JUMP_UP = 3, JUMP_OVER = 2;

  const START = { c: 1, r: FLOOR - 1 };        // standing on the ground
  const FLAG  = { c: COLS >> 1, r: 1 };        // right at the top

  // What can be in a square.
  const EMPTY = 0, WALL = 1, MUD = 2, PLAT = 3, DOOR = 4, KEY = 5,
        SAW = 6, SMASH = 7;

  // Three colours of door. A door only opens for a key of its colour.
  const LOCKS = [
    { name: 'RED',  col: [226, 96, 78] },
    { name: 'BLUE', col: [92, 152, 240] },
    { name: 'GREEN',col: [143, 224, 122] }
  ];

  const TOOLS = [
    { name: 'WALL',  price: 3, kind: WALL,
      blurb: 'blocks them - but they can land on top' },
    { name: 'MUD',   price: 1, kind: MUD,
      blurb: 'they wade through it - five slow steps' },
    { name: 'DOOR',  price: 5, kind: DOOR,
      blurb: 'locked. you hide its key too' },
    { name: 'SAW',   price: 6, kind: SAW,
      blurb: 'pops up, then drops. slices them' },
    { name: 'HAMMER',price: 4, kind: SMASH,
      blurb: 'slams down. flattens them' }
  ];

  let grid = [];      // what is in each square
  let tint = [];      // which colour, for doors and keys only

  let tool = 0;
  let coins = 26;
  let round = 1;
  let best = 0;       // the most robots you have ever stopped in one wave

  // When you put a door down you are holding its key, and the very next
  // tap puts the key somewhere.
  let holdingKey = -1;

  let state = 'build';        // 'build', 'run', 'done'
  let says = '', saysT = 0;
  function say(w) { says = w; saysT = 3.0; }

  function inside(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
  function at(c, r) { return inside(c, r) ? grid[r][c] : WALL; }

  // What it costs a robot to step into a square.
  //
  // THIS IS THE MOST IMPORTANT LINE IN THE GAME. A saw is not a wall -
  // if it were, they would simply walk round it and nothing would ever
  // get cut. It is a square they creep across. The cost IS the danger:
  // the longer it takes to cross, the likelier the blade is up when
  // they are standing on it.
  // These have to stay SMALL enough that a robot can cross in one safe
  // gap. Crossing time is this number divided by their walking speed -
  // make it bigger than the quiet part of the cycle and the hazard stops
  // being a gamble and becomes certain death.
  function costOf(kind) {
    if (kind === MUD)   return 5;
    if (kind === SAW)   return 3;
    if (kind === SMASH) return 2;
    return 1;
  }

  // Solid things block you AND hold you up. That is one idea, not two -
  // which is why a wall you build is also a ledge you built them.
  function solid(c, r) { const k = at(c, r); return k === WALL || k === PLAT; }

  // Can a robot be in this square, carrying these keys?
  function passable(c, r, keys) {
    if (!inside(c, r)) return false;
    const k = grid[r][c];
    if (k === WALL || k === PLAT) return false;
    if (k === DOOR) return (keys >> tint[r][c]) & 1;   // only with the key
    return true;
  }

  // Can it STAND here? It needs air to stand in and something under its
  // feet. No floating.
  function standable(c, r, keys) {
    return passable(c, r, keys) && solid(c, r + 1);
  }

  function keyBitAt(c, r) {
    return at(c, r) === KEY ? (1 << tint[r][c]) : 0;
  }


// -------------------------------------------------------------------
//  THE HAZARDS
//
//  Both of them run on a clock, not on where the robots are. They do
//  not aim and they do not wait. That is the whole reason some robots
//  in a line get through and some do not: they set off at different
//  moments, so they meet the blade at different points in its spin.
// -------------------------------------------------------------------

  // These four numbers ARE the difficulty, and they were carefully wrong
  // the first time: crossing a saw took 1.43s while the blade was only
  // down for 1.1s, so no robot could ever fit through the gap and every
  // single one died. A hazard nobody can survive is not a gamble, it is
  // a wall. There has to be a way through for the well-timed.
  //
  // The cycles are deliberately not neat fractions of WAVE_GAP either.
  // At 3 seconds and one robot per second, only three of them would ever
  // meet a different part of the spin - and they would die in pairs.
  const SAW_CYCLE = 2.9, SAW_UP    = 0.34;   // a long, obvious threat
  const HAM_CYCLE = 2.1, HAM_DOWN  = 0.16;   // brief, but comes round often

  let clock = 0;

  // Every hazard starts at a different point in its cycle, worked out
  // from where it is. Not random - random would flicker differently
  // every frame. This way the same square always keeps the same rhythm.
  function phaseOf(c, r) { return (((c * 7 + r * 13) % 11) / 11); }

  function sawUp(c, r) {
    return ((clock / SAW_CYCLE + phaseOf(c, r)) % 1) < SAW_UP;
  }
  function hammerDown(c, r) {
    return ((clock / HAM_CYCLE + phaseOf(c, r)) % 1) < HAM_DOWN;
  }
  function deadlyNow(c, r) {
    const k = at(c, r);
    if (k === SAW)   return sawUp(c, r);
    if (k === SMASH) return hammerDown(c, r);
    return false;
  }


// -------------------------------------------------------------------
//  BUILDING THE TOWER ITSELF
// -------------------------------------------------------------------

  function blankGrid() {
    grid = []; tint = [];
    for (let r = 0; r < ROWS; r++) {
      const a = [], b = [];
      for (let c = 0; c < COLS; c++) { a.push(EMPTY); b.push(0); }
      grid.push(a); tint.push(b);
    }
  }

  // The ledges. These are bolted down - nobody can remove them. They
  // are the bones of the tower.
  function layLedges(fallback) {
    for (let c = 0; c < COLS; c++) grid[FLOOR][c] = PLAT;   // the ground

    let floorNo = 0;
    for (let r = FLOOR - RISE; r >= 2; r -= RISE) {
      if (fallback) {
        // A guaranteed staircase, used only if random ledges keep coming
        // out unclimbable. Boring, but it always works.
        const from = floorNo % 2 === 0 ? 0 : 7;
        for (let c = from; c < from + 6; c++) grid[r][c] = PLAT;
      } else {
        const runs = Math.random() < 0.45 ? 2 : 1;
        for (let n = 0; n < runs; n++) {
          const len = 3 + Math.floor(Math.random() * 4);
          const x0  = Math.floor(Math.random() * (COLS - len + 1));
          for (let c = x0; c < x0 + len; c++) grid[r][c] = PLAT;
        }
      }
      floorNo++;
    }

    for (let c = FLAG.c - 1; c <= FLAG.c + 1; c++) {
      if (c >= 0 && c < COLS) grid[FLAG.r + 1][c] = PLAT;
    }
  }

  // Random ledges can come out unclimbable. So we do the honest thing:
  // build one, ASK A ROBOT if it can climb it, and throw it away if it
  // cannot. We never ship a tower we have not checked.
  function newTower() {
    for (let tries = 0; tries < 200; tries++) {
      blankGrid();
      layLedges(false);
      think();
      if (canGetThrough()) return tries;
    }
    blankGrid();
    layLedges(true);
    think();
    return -1;
  }


// -------------------------------------------------------------------
//  THE ROBOTS' BRAIN
//
//  A robot has to know three things at once: which column, which row,
//  and which keys it is carrying. Standing in front of a red door with
//  the red key is a completely different situation from standing there
//  without it - so they have to count as two different places.
//
//  Same algorithm as a satnav, run over "place AND pockets".
// -------------------------------------------------------------------

  const KEYSETS = 1 << LOCKS.length;         // 8 possible pocketfuls
  const NSTATES = COLS * ROWS * KEYSETS;
  function id(c, r, keys) { return (r * COLS + c) * KEYSETS + keys; }

  let dist = null, prevOf = null, viaOf = null;
  let bestCost = Infinity, bestEnd = -1;

  // Everything a robot could do from where it is standing. Each move
  // remembers the squares it passes THROUGH, because that is what it
  // pays for, where it picks keys up, and where it can get sliced.
  function movesFrom(c, r, keys) {
    const out = [];

    // ---- WALK, or WALK OFF THE EDGE AND FALL --------------------------
    for (let d = -1; d <= 1; d += 2) {
      const nc = c + d;
      if (!passable(nc, r, keys)) continue;

      let cost = costOf(at(nc, r));
      let k2 = keys | keyBitAt(nc, r);
      const via = [{ c: nc, r: r }];

      if (standable(nc, r, keys)) {
        out.push({ c: nc, r: r, keys: k2, cost: cost, via: via });
        continue;
      }
      // Nothing under its feet, so down it goes until something stops it.
      let rr = r, ok = true;
      while (!solid(nc, rr + 1)) {
        if (!passable(nc, rr + 1, k2)) { ok = false; break; }
        rr++;
        cost += costOf(at(nc, rr));
        k2 |= keyBitAt(nc, rr);
        via.push({ c: nc, r: rr });
      }
      if (ok) out.push({ c: nc, r: rr, keys: k2, cost: cost, via: via });
    }

    // ---- JUMP ---------------------------------------------------------
    // Straight up, then across. Simple to picture, simple to check, and
    // it means a ledge with no gap beside it cannot be jumped onto - you
    // have to go up through a hole.
    for (let dy = 0; dy <= JUMP_UP; dy++) {
      for (let dx = -JUMP_OVER; dx <= JUMP_OVER; dx++) {
        if (dx === 0 && dy === 0) continue;

        let cost = 0, k2 = keys, ok = true;
        const via = [];

        for (let i = 1; i <= dy; i++) {                 // the way up
          const rr = r - i;
          if (!passable(c, rr, k2)) { ok = false; break; }
          cost += costOf(at(c, rr));
          k2 |= keyBitAt(c, rr);
          via.push({ c: c, r: rr });
        }
        if (!ok) continue;

        const rr = r - dy;
        const step = dx > 0 ? 1 : -1;
        for (let i = 1; i <= Math.abs(dx); i++) {       // the way across
          const cc = c + step * i;
          if (!passable(cc, rr, k2)) { ok = false; break; }
          cost += costOf(at(cc, rr));
          k2 |= keyBitAt(cc, rr);
          via.push({ c: cc, r: rr });
        }
        if (!ok) continue;

        const tc = c + dx;
        if (!standable(tc, rr, k2)) continue;           // nothing to land on
        out.push({ c: tc, r: rr, keys: k2, cost: cost, via: via });
      }
    }

    return out;
  }

  function think() {
    dist   = new Float64Array(NSTATES).fill(Infinity);
    prevOf = new Int32Array(NSTATES).fill(-1);
    viaOf  = new Array(NSTATES).fill(null);
    const settled = new Uint8Array(NSTATES);

    dist[id(START.c, START.r, 0)] = 0;

    // Always deal with the cheapest place-and-pockets we have not dealt
    // with yet. Once it is settled, nothing can ever make it cheaper -
    // that is the guarantee that makes the answer the real answer.
    for (;;) {
      let bs = -1, bv = Infinity;
      for (let s = 0; s < NSTATES; s++) {
        if (!settled[s] && dist[s] < bv) { bv = dist[s]; bs = s; }
      }
      if (bs < 0) break;
      settled[bs] = 1;

      const keys = bs % KEYSETS;
      const cell = (bs - keys) / KEYSETS;
      const c = cell % COLS, r = (cell - c) / COLS;

      const moves = movesFrom(c, r, keys);
      for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        const ns = id(m.c, m.r, m.keys);
        if (bv + m.cost < dist[ns]) {
          dist[ns] = bv + m.cost;
          prevOf[ns] = bs;
          viaOf[ns] = m.via;
        }
      }
    }

    bestCost = Infinity; bestEnd = -1;
    for (let k = 0; k < KEYSETS; k++) {
      const s = id(FLAG.c, FLAG.r, k);
      if (dist[s] < bestCost) { bestCost = dist[s]; bestEnd = s; }
    }
  }

  function canGetThrough() { return bestCost < Infinity; }

  // Can a robot ever actually GET this key? Not "can it stand on that
  // square" - it might swipe the key while flying past mid-jump. So the
  // real question is whether there is any situation it can reach where
  // the key is already in its pocket.
  function canFetch(colour) {
    const bit = 1 << colour;
    for (let s = 0; s < NSTATES; s++) {
      if (dist[s] < Infinity && ((s % KEYSETS) & bit)) return true;
    }
    return false;
  }

  function routeCells() {
    if (bestEnd < 0) return [];
    const chunks = [];
    let s = bestEnd;
    while (s >= 0 && prevOf[s] >= 0) {
      chunks.push(viaOf[s]);
      s = prevOf[s];
    }
    chunks.reverse();
    const out = [{ c: START.c, r: START.r }];
    for (let i = 0; i < chunks.length; i++) {
      for (let j = 0; j < chunks[i].length; j++) out.push(chunks[i][j]);
    }
    return out;
  }


// -------------------------------------------------------------------
//  THE LINE OF ROBOTS
// -------------------------------------------------------------------

  // Seconds between one robot setting off and the next. NOT a round
  // number, and not by accident: it has to divide badly into BOTH hazard
  // cycles or robots meet the blade at the same moment and die in
  // identical groups. At 0.7 the hammer's 2.1s cycle is exactly three
  // gaps and they drop in threes. 0.8 was the best of six tried - all
  // fifteen robots land in a different tenth of both cycles.
  const WAVE_GAP = 0.8;
  let bots = [];
  let route = [];
  let scrap = [];                    // bolts and sparks flying about

  // Ten in the first wave, one more each time, and it stops growing at
  // fifteen. Fifteen robots a second apart is already a queue fourteen
  // seconds long - any more and you spend the round watching.
  const WAVE_MIN = 10, WAVE_MAX = 15;
  function waveSize() { return Math.min(WAVE_MAX, WAVE_MIN + round - 1); }
  function gotThrough() {
    let n = 0;
    for (let i = 0; i < bots.length; i++) if (bots[i].done) n++;
    return n;
  }
  function stopped() {
    let n = 0;
    for (let i = 0; i < bots.length; i++) if (!bots[i].alive) n++;
    return n;
  }

  function go() {
    if (holdingKey >= 0) { say('put the key down first'); return; }
    think();
    if (!canGetThrough()) { say('they cannot get up there at all'); return; }

    route = routeCells();
    bots = [];
    for (let i = 0; i < waveSize(); i++) {
      bots.push({ at: 0, step: 0, c: START.c, r: START.r,
                  x: START.c, y: START.r, keys: 0,
                  alive: true, done: false, wait: i * WAVE_GAP, face: 1 });
    }
    scrap = [];
    clock = 0;
    state = 'run';
    say('here they come - ' + waveSize() + ' of them');
  }

  function burst(x, y) {
    // Bolts, springs and one surprised eyeball.
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 6;
      scrap.push({ x: x, y: y,
                   vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
                   life: 0.9 + Math.random() * 0.5,
                   size: 2 + Math.random() * 3 });
    }
    if (scrap.length > 260) scrap.splice(0, scrap.length - 260);
  }

  function stepRobot(b, dt) {
    if (!b.alive || b.done) return;
    if (b.wait > 0) { b.wait -= dt; return; }

    // It creeps across the nasty squares. Which is the whole problem.
    const here = at(b.c, b.r);
    const slow = costOf(here);
    b.step += dt * (4.2 / slow);

    while (b.step >= 1) {
      b.step -= 1;
      if (b.at >= route.length - 1) { b.done = true; return; }
      b.at++;
      const n = route[b.at];
      if (n.c !== b.c) b.face = n.c > b.c ? 1 : -1;
      b.c = n.c; b.r = n.r;
      b.keys |= keyBitAt(n.c, n.r);
    }

    const a = route[b.at];
    const nx = route[Math.min(b.at + 1, route.length - 1)];
    b.x = a.c + (nx.c - a.c) * b.step;
    b.y = a.r + (nx.r - a.r) * b.step;
  }

  function update(dt) {
    if (saysT > 0) saysT -= dt;

    // Scrap keeps flying even after the round is over.
    for (let i = scrap.length - 1; i >= 0; i--) {
      const p = scrap[i];
      p.life -= dt;
      if (p.life <= 0) { scrap.splice(i, 1); continue; }
      p.x += p.vx * dt * 30; p.y += p.vy * dt * 30;
      p.vy += dt * 34;
    }

    if (state !== 'run') return;
    clock += dt;

    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      stepRobot(b, dt);

      // Was it standing there when the blade came up?
      if (b.alive && !b.done && b.wait <= 0) {
        const cc = Math.round(b.x), rr = Math.round(b.y);
        if (deadlyNow(cc, rr)) {
          b.alive = false;
          const bd = board();
          burst(bd.x + (b.x + 0.5) * bd.s, bd.y + (b.y + 0.5) * bd.s);
        }
      }
    }

    let busy = false;
    for (let i = 0; i < bots.length; i++) if (bots[i].alive && !bots[i].done) busy = true;
    if (!busy) {
      state = 'done';
      const s = stopped();
      if (s > best) best = s;
      say(s === bots.length ? 'NOT ONE OF THEM GOT THROUGH'
        : s === 0           ? 'all ' + bots.length + ' walked straight past'
        : 'you stopped ' + s + ' of ' + bots.length);
    }
  }


// -------------------------------------------------------------------
//  WHERE EVERYTHING IS ON SCREEN
// -------------------------------------------------------------------

  // A phone held sideways has loads of width and almost no height, so
  // the buttons move to a block on the right instead of a row below.
  function wide()   { return W > H * 1.35; }
  function panelW() { return wide() ? Math.min(W * 0.36, 320) : 0; }
  function topBar() { return wide() ? 62 : 96; }

  // Five tools and a GO button will not fit in one row on a phone, so
  // they wrap onto as many rows as they need - and the tower is told
  // how much room that took, instead of us guessing a number.
  function btnCols()  { return wide() ? 2 : 3; }
  function btnRows()  { return Math.ceil((TOOLS.length + 1) / btnCols()); }
  function btnH() {
    if (!wide()) return 52;
    return clamp((H - topBar() - 30 - 8 * (btnRows() - 1)) / btnRows(), 40, 56);
  }
  function boxOf(i) {
    const cols = btnCols(), h = btnH();
    const cx = i % cols, cy = Math.floor(i / cols);
    if (wide()) {
      const w = (panelW() - 24 - 8 * (cols - 1)) / cols;
      return { x: W - panelW() + 8 + cx * (w + 8),
               y: topBar() + 8 + cy * (h + 8), w: w, h: h };
    }
    const w = (W - 40 - 10 * (cols - 1)) / cols;
    const y0 = H - 26 - btnRows() * h - (btnRows() - 1) * 10;
    return { x: 20 + cx * (w + 10), y: y0 + cy * (h + 10), w: w, h: h };
  }
  function toolBox(i) { return boxOf(i); }
  function goBox()    { return boxOf(TOOLS.length); }

  function botBar() {
    return wide() ? 16 : (btnRows() * btnH() + (btnRows() - 1) * 10 + 44);
  }

  function board() {
    // Everything else asks THIS function where things are - so changing
    // the shape here moves the drawing and your finger at the same time,
    // and they can never disagree.
    const s = Math.min((W - panelW() - 40) / COLS,
                       (H - topBar() - botBar()) / ROWS);
    return { s: s,
             x: (W - panelW() - s * COLS) / 2,
             y: topBar() + (H - topBar() - botBar() - s * ROWS) / 2 };
  }

  function cellAt(mx, my) {
    const b = board();
    const c = Math.floor((mx - b.x) / b.s);
    const r = Math.floor((my - b.y) / b.s);
    if (!inside(c, r)) return null;
    return { c: c, r: r };
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  function drawKeyShape(x, y, s, col) {
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.arc(x, y - s * 0.12, s * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - s * 0.045, y - s * 0.02, s * 0.09, s * 0.30);
    ctx.fillRect(x - s * 0.045, y + s * 0.16, s * 0.16, s * 0.06);
    ctx.fillStyle = '#10141c';
    ctx.beginPath();
    ctx.arc(x, y - s * 0.12, s * 0.06, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBlade(x, y, s, spin, out) {
    // A circular blade with teeth. When it is down you only see the
    // slot it lives in, so you know where it will come from.
    ctx.fillStyle = '#0d1017';
    ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.2);
    if (out <= 0) return;

    const cy = y + s * (0.82 - 0.62 * out);
    const rad = s * 0.34 * out;
    ctx.save();
    ctx.translate(x + s / 2, cy);
    ctx.rotate(spin);
    ctx.fillStyle = '#c9d4e6';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(-rad * 0.35, -rad * 0.85);
      ctx.lineTo(0, -rad * 1.35);
      ctx.lineTo(rad * 0.35, -rad * 0.85);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5d6a80';
    ctx.beginPath();
    ctx.arc(0, 0, rad * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHammer(x, y, s, down) {
    // Rail it hangs from.
    ctx.fillStyle = '#2b3242';
    ctx.fillRect(x + s * 0.42, y, s * 0.16, s);

    const top = y + s * (down ? 0.42 : 0.02);
    ctx.fillStyle = down ? '#e8834a' : '#8a94a8';
    ctx.fillRect(x + s * 0.12, top, s * 0.76, s * 0.42);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + s * 0.12, top + s * 0.32, s * 0.76, s * 0.10);
  }

  function drawTower() {
    const b = board();
    const spin = clock * 14;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = b.x + c * b.s, y = b.y + r * b.s;
        const kind = grid[r][c];

        ctx.fillStyle = (r % RISE === (FLOOR % RISE)) ? '#1a2130' : '#151b27';
        ctx.fillRect(x, y, b.s, b.s);
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, b.s - 1, b.s - 1);

        if (kind === PLAT) {
          ctx.fillStyle = '#3c4658';
          ctx.fillRect(x, y, b.s, b.s);
          ctx.fillStyle = '#6f7d94';
          ctx.fillRect(x, y, b.s, Math.max(2, b.s * 0.14));
        }

        if (kind === WALL) {
          ctx.fillStyle = '#96a0b4';
          ctx.fillRect(x + 1, y + 1, b.s - 2, b.s - 2);
          ctx.fillStyle = '#c3ccdd';
          ctx.fillRect(x + 1, y + 1, b.s - 2, Math.max(2, b.s * 0.14));
        }

        if (kind === MUD) {
          ctx.fillStyle = '#6b4a2a';
          ctx.fillRect(x + 1, y + 1, b.s - 2, b.s - 2);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          for (let i = 0; i < 5; i++) {
            const a = i * 1.9 + c + r;
            ctx.beginPath();
            ctx.arc(x + b.s * (0.3 + 0.4 * Math.abs(Math.sin(a))),
                    y + b.s * (0.3 + 0.4 * Math.abs(Math.cos(a * 1.7))),
                    b.s * 0.07, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (kind === SAW) {
          // While you are building it sits half out, so you can see it
          // is there. Once they are running it does its real cycle.
          const out = state === 'build' ? 0.55 : (sawUp(c, r) ? 1 : 0);
          drawBlade(x, y, b.s, spin, out);
        }

        if (kind === SMASH) {
          const down = state === 'build' ? false : hammerDown(c, r);
          drawHammer(x, y, b.s, down);
        }

        if (kind === DOOR) {
          const col = LOCKS[tint[r][c]].col;
          ctx.fillStyle = rgb(col);
          ctx.fillRect(x + b.s * 0.12, y + 1, b.s * 0.76, b.s - 2);
          ctx.fillStyle = 'rgba(0,0,0,0.45)';
          ctx.beginPath();
          ctx.arc(x + b.s * 0.68, y + b.s * 0.5, b.s * 0.09, 0, Math.PI * 2);
          ctx.fill();
        }

        if (kind === KEY) {
          drawKeyShape(x + b.s / 2, y + b.s / 2, b.s, LOCKS[tint[r][c]].col);
        }
      }
    }

    // ---- THE ROUTE ---------------------------------------------------
    // Drawn WHILE you build, so every block shows you what it was worth
    // the instant you put it down.
    const path = state === 'build' ? routeCells() : route;
    if (path.length > 1) {
      ctx.strokeStyle = state === 'build' ? 'rgba(255,215,106,0.7)'
                                          : 'rgba(255,215,106,0.28)';
      ctx.lineWidth = Math.max(2, b.s * 0.11);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        const px = b.x + (path[i].c + 0.5) * b.s;
        const py = b.y + (path[i].r + 0.5) * b.s;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // ---- START AND FLAG ----------------------------------------------
    const sx = b.x + START.c * b.s, sy = b.y + START.r * b.s;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx + 3, sy + 3, b.s - 6, b.s - 6);

    const fx = b.x + FLAG.c * b.s, fy = b.y + FLAG.r * b.s;
    ctx.strokeStyle = '#ffd76a';
    ctx.lineWidth = Math.max(2, b.s * 0.08);
    ctx.beginPath();
    ctx.moveTo(fx + b.s * 0.35, fy + b.s * 0.85);
    ctx.lineTo(fx + b.s * 0.35, fy + b.s * 0.15);
    ctx.stroke();
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath();
    ctx.moveTo(fx + b.s * 0.35, fy + b.s * 0.15);
    ctx.lineTo(fx + b.s * 0.85, fy + b.s * 0.32);
    ctx.lineTo(fx + b.s * 0.35, fy + b.s * 0.48);
    ctx.fill();
  }

  function drawRobot(b, bd) {
    const x = bd.x + (b.x + 0.5) * bd.s;
    const y = bd.y + (b.y + 0.5) * bd.s;
    const s = bd.s * 0.28;
    const bounce = Math.abs(Math.sin(b.step * Math.PI)) * s * 0.25;

    ctx.fillStyle = b.done ? '#8fe07a' : '#dbe4f2';
    ctx.fillRect(x - s, y - s - bounce, s * 2, s * 1.7);
    ctx.fillStyle = '#10141c';
    ctx.fillRect(x - s * 0.55, y - s * 0.55 - bounce, s * 0.38, s * 0.38);
    ctx.fillRect(x + s * 0.17, y - s * 0.55 - bounce, s * 0.38, s * 0.38);
    ctx.fillStyle = '#ffd76a';
    ctx.fillRect(x - s * 0.15, y - s * 1.5 - bounce, s * 0.3, s * 0.45);

    let shown = 0;
    for (let i = 0; i < LOCKS.length; i++) {
      if (!((b.keys >> i) & 1)) continue;
      drawKeyShape(x - s * 0.7 + shown * s * 0.7, y - s * 2.3 - bounce,
                   bd.s * 0.5, LOCKS[i].col);
      shown++;
    }
  }

  function drawWave() {
    const bd = board();
    if (state === 'build') {
      // One waiting robot, so the start square never looks empty.
      drawRobot({ x: START.c, y: START.r, step: 0, keys: 0, done: false }, bd);
    } else {
      for (let i = 0; i < bots.length; i++) {
        const b = bots[i];
        if (!b.alive || b.wait > 0) continue;
        drawRobot(b, bd);
      }
    }
    for (let i = 0; i < scrap.length; i++) {
      const p = scrap[i];
      ctx.fillStyle = 'rgba(200,212,230,' + clamp(p.life, 0, 1) + ')';
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }

  function usedLocks() {
    const seen = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === DOOR && seen.indexOf(tint[r][c]) < 0) seen.push(tint[r][c]);
      }
    }
    return seen;
  }
  function allKeysFetchable() {
    const used = usedLocks();
    for (let i = 0; i < used.length; i++) if (!canFetch(used[i])) return false;
    return true;
  }
  function nextLock() {
    const used = usedLocks();
    for (let i = 0; i < LOCKS.length; i++) if (used.indexOf(i) < 0) return i;
    return -1;
  }

  function drawHud() {
    const line1 = wide() ? 30 : 44, line2 = wide() ? 50 : 68;

    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.042, 34) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText(coins + ' coins', 20, line1);

    ctx.font = Math.min(W * 0.024, 15) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#6b7a90';
    ctx.fillText('round ' + round + (best ? '   -   best ' + best + ' stopped' : ''),
                 22, line2);

    // ---- THE TWO NUMBERS THAT MATTER ---------------------------------
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.034, 26) + 'px system-ui, sans-serif';
    if (state === 'build') {
      ctx.fillStyle = canGetThrough() ? '#8fe07a' : '#e05a4a';
      ctx.fillText(canGetThrough() ? bestCost + ' steps' : 'NO WAY UP', W - 20, line1);
      ctx.font = Math.min(W * 0.022, 14) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#6b7a90';
      ctx.fillText(canGetThrough() ? 'a longer climb is more places to put a saw'
                                   : 'they must be able to reach the flag',
                   W - 20, line2 - 2);
    } else {
      ctx.fillStyle = '#e8834a';
      ctx.fillText(stopped() + ' stopped', W - 20, line1);
      ctx.font = Math.min(W * 0.022, 14) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#6b7a90';
      ctx.fillText(gotThrough() + ' got through, of ' + bots.length, W - 20, line2 - 2);
    }

    // ---- TOOLS -------------------------------------------------------
    for (let i = 0; i < TOOLS.length; i++) {
      const t = TOOLS[i], bx = toolBox(i);
      const on = tool === i && holdingKey < 0;
      const lock = nextLock();
      const can = coins >= t.price && (t.kind !== DOOR || lock >= 0);

      ctx.fillStyle = on ? 'rgba(255,215,106,0.18)' : 'rgba(0,0,0,0.35)';
      ctx.fillRect(bx.x, bx.y, bx.w, bx.h);
      ctx.lineWidth = on ? 3 : 2;
      ctx.strokeStyle = on ? '#ffd76a' : 'rgba(255,255,255,0.18)';
      ctx.strokeRect(bx.x, bx.y, bx.w, bx.h);

      // A little picture of the thing, so you never have to read to know.
      const ix = bx.x + 8, iy = bx.y + bx.h * 0.5 - 11, is = 22;
      if (t.kind === WALL) {
        ctx.fillStyle = '#96a0b4'; ctx.fillRect(ix, iy, is, is);
        ctx.fillStyle = '#c3ccdd'; ctx.fillRect(ix, iy, is, 4);
      } else if (t.kind === MUD) {
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(ix, iy, is, is);
      } else if (t.kind === DOOR) {
        ctx.fillStyle = rgb(lock >= 0 ? LOCKS[lock].col : [90, 100, 118]);
        ctx.fillRect(ix + 2, iy, is - 4, is);
      } else if (t.kind === SAW) {
        drawBlade(ix - 1, iy - is * 0.4, is * 1.4, clock * 14, 1);
      } else {
        drawHammer(ix - 1, iy - is * 0.2, is * 1.3, false);
      }

      // Text stays inside its own button, whatever we write in it. Without
      // this a long blurb spills across the next button and the two of
      // them read as one sentence of nonsense.
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx.x + 2, bx.y + 2, bx.w - 4, bx.h - 4);
      ctx.clip();

      const roomy = bx.w > 165;
      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.021, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = can ? '#e6ecf5' : '#5a6678';
      ctx.fillText(t.name + '  ' + t.price, bx.x + 38, bx.y + (roomy ? 24 : bx.h * 0.6));
      if (roomy) {
        ctx.font = Math.min(W * 0.017, 12) + 'px system-ui, sans-serif';
        ctx.fillStyle = '#6b7a90';
        ctx.fillText(t.blurb, bx.x + 38, bx.y + 42);
      }
      ctx.restore();
    }

    // ---- GO -----------------------------------------------------------
    const g = goBox();
    const ready = state === 'build' && canGetThrough() && holdingKey < 0;
    ctx.fillStyle = ready ? 'rgba(143,224,122,0.2)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.lineWidth = 3;
    ctx.strokeStyle = ready ? '#8fe07a' : 'rgba(255,255,255,0.2)';
    ctx.strokeRect(g.x, g.y, g.w, g.h);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.028, 21) + 'px system-ui, sans-serif';
    ctx.fillStyle = ready ? '#8fe07a' : '#6b7a90';
    ctx.fillText(state === 'build' ? 'SEND THEM' : state === 'run' ? 'CLIMBING' : 'NEXT WAVE',
                 g.x + g.w / 2, g.y + g.h * 0.63);

    // ---- HOLDING A KEY -------------------------------------------------
    if (holdingKey >= 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.028, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = rgb(LOCKS[holdingKey].col);
      ctx.fillText('NOW HIDE THE ' + LOCKS[holdingKey].name + ' KEY',
                   (W - panelW()) / 2, wide() ? topBar() - 14 : 90);
    }

    if (wide() && board().s < 26) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillStyle = '#6b7a90';
      ctx.fillText('turn your phone upright for a much bigger tower',
                   (W - panelW()) / 2, 30);
    }

    if (saysT > 0) {
      ctx.textAlign = 'center';
      const size = wide() ? 15 : Math.min(W * 0.027, 20);
      // Sit it just above the buttons - worked out FROM where the buttons
      // are, not guessed, so it cannot land on top of them when the
      // number of tools changes.
      const y = wide() ? H - 12
                       : boxOf(0).y - 14;
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      ctx.fillStyle = 'rgba(16,20,28,' + clamp(saysT, 0, 1) * 0.85 + ')';
      ctx.fillRect((W - panelW()) / 2 - wid / 2 - 12, y - size, wid + 24, size + 12);
      ctx.fillStyle = 'rgba(230,236,245,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, (W - panelW()) / 2, y);
    }
  }


// -------------------------------------------------------------------
//  BUILDING
// -------------------------------------------------------------------

  function removeLock(colour) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const k = grid[r][c];
        if ((k === DOOR || k === KEY) && tint[r][c] === colour) grid[r][c] = EMPTY;
      }
    }
  }

  function priceOf(kind) {
    for (let i = 0; i < TOOLS.length; i++) if (TOOLS[i].kind === kind) return TOOLS[i].price;
    return 0;
  }

  function place(c, r) {
    if (state !== 'build') return;
    if (!inside(c, r)) return;
    if (c === START.c && r === START.r) { say('that is where they come in'); return; }
    if (c === FLAG.c && r === FLAG.r)   { say('that is the flag'); return; }
    if (grid[r][c] === PLAT) { say('that ledge is bolted down'); return; }

    // ---- PUTTING DOWN THE KEY YOU ARE HOLDING --------------------------
    if (holdingKey >= 0) {
      if (grid[r][c] !== EMPTY) { say('the key needs an empty square'); return; }
      const colour = holdingKey;
      grid[r][c] = KEY; tint[r][c] = colour;
      think();
      // TWO things have to be true. They must still be able to reach the
      // flag - AND they must be able to get this key. A key they can
      // never reach turns your door into a wall you paid extra for.
      if (!canGetThrough() || !canFetch(colour)) {
        grid[r][c] = EMPTY;
        removeLock(colour);
        coins += priceOf(DOOR);
        holdingKey = -1;
        think();
        say(canGetThrough() ? 'they could never reach that key'
                            : 'then they can never get to the flag');
        return;
      }
      holdingKey = -1;
      say('now they have to go and get it first');
      return;
    }

    // ---- TAKING SOMETHING BACK ------------------------------------------
    if (grid[r][c] !== EMPTY) {
      const k = grid[r][c];
      if (k === DOOR || k === KEY) {
        removeLock(tint[r][c]);
        coins += priceOf(DOOR);
      } else {
        grid[r][c] = EMPTY;
        coins += priceOf(k);
      }
      think();
      return;
    }

    const t = TOOLS[tool];
    if (coins < t.price) { say('not enough coins'); return; }

    if (t.kind === DOOR) {
      const colour = nextLock();
      if (colour < 0) { say('three doors is all you get'); return; }
      grid[r][c] = DOOR; tint[r][c] = colour;
      coins -= t.price;
      holdingKey = colour;
      think();
      say('now hide the ' + LOCKS[colour].name + ' key');
      const h1 = document.getElementById('hud');
      if (h1) h1.style.opacity = 0;
      return;
    }

    grid[r][c] = t.kind;
    think();

    // THEY MUST BE ABLE TO REACH THE FLAG, and still reach every key you
    // have hidden. Refused the moment you try, with the block put
    // straight back - so you find out by tapping, not by building a
    // masterpiece and being told at the end.
    if (!canGetThrough() || !allKeysFetchable()) {
      const why = canGetThrough() ? 'now they can never reach a key'
                                  : 'THEY MUST HAVE A WAY UP';
      grid[r][c] = EMPTY;
      think();
      say(why);
      return;
    }

    coins -= t.price;
    const h2 = document.getElementById('hud');
    if (h2) h2.style.opacity = 0;
  }

  function tap(mx, my) {
    // While you are holding a key, the only thing a tap can do is put it
    // down. No half-finished doors.
    if (holdingKey < 0) {
      for (let i = 0; i < TOOLS.length; i++) {
        const b = toolBox(i);
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          tool = i;
          say(TOOLS[i].blurb);            // tapping a tool tells you what it does
          return;
        }
      }
      const g = goBox();
      if (mx >= g.x && mx <= g.x + g.w && my >= g.y && my <= g.y + g.h) {
        if (state === 'build') go();
        else if (state === 'done') {
          round++;
          coins += 12 + round * 2;        // more to spend every wave
          state = 'build';
          bots = []; route = [];
          say('wave ' + round + ' - ' + waveSize() + ' of them this time');
        }
        return;
      }
    }
    const cell = cellAt(mx, my);
    if (cell) place(cell.c, cell.r);
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    // The blades keep spinning while you build, so you can watch their
    // rhythm before you decide where the next one goes.
    if (state !== 'run') clock += dt;

    update(dt);

    ctx.fillStyle = '#10141c';
    ctx.fillRect(0, 0, W, H);

    drawTower();
    drawWave();
    drawHud();

    requestAnimationFrame(frame);
  }

  newTower();
  requestAnimationFrame(frame);

</script>
</body>
</html>
