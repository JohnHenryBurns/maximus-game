<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BEAT THE BOT</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10141c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beat the Bot">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #10141c; color: #e6ecf5;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 4px;
    text-align: center; font-size: 13px; color: #6b7a90;
    pointer-events: none;
    /* It fades away the moment you build your first thing - once you know
       how, being told again is just something in the way. */
    transition: opacity 0.6s;
  }

  /* ---- CORNER NAV PILLS -------------------------------------------------
     The same rounded, blurred treatment the other games use, so tapping
     out to the arcade (or resetting) looks like part of the same machine.
     They sit in their own band across the very top; the tower's own HUD
     (coins, steps) is drawn just below them so nothing overlaps. */
  #back, #reset {
    position: fixed; top: 8px; z-index: 20;
    color: #ffe9c4;
    background: rgba(20, 26, 38, 0.62);
    border: 1px solid rgba(255, 215, 106, 0.35);
    font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 13px; border-radius: 999px;
    text-decoration: none; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
  }
  #back  { left: 10px; }
  #reset { right: 10px; }
  #back:hover, #back:active, #reset:hover, #reset:active {
    transform: scale(1.05);
    border-color: rgba(255, 215, 106, 0.85);
    background: rgba(30, 38, 54, 0.78);
  }

  /* ---- THE RESET CONFIRMATION ------------------------------------------
     Resetting throws your whole tower away, so it asks first. A full-screen
     dimmed backdrop also blocks taps behind it, so you can't accidentally
     build while the question is up. */
  #resetModal {
    position: fixed; inset: 0; z-index: 30;
    display: none;                 /* flipped to flex when shown */
    align-items: center; justify-content: center;
    background: rgba(6, 9, 14, 0.72);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  #resetModal .card {
    width: min(330px, 86vw);
    background: #161d29;
    border: 1px solid rgba(255, 215, 106, 0.3);
    border-radius: 16px;
    padding: 24px 22px;
    text-align: center;
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
  }
  #resetModal h3 { margin: 0 0 10px; font-size: 21px; color: #ffe9c4; letter-spacing: 1px; }
  #resetModal p  { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #9fb0c6; }
  #resetModal .row { display: flex; gap: 10px; }
  #resetModal .btn {
    flex: 1; padding: 13px 10px; border-radius: 11px;
    font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.1s;
  }
  #resetModal .btn:active { transform: scale(0.97); }
  #resetModal .cancel { background: #232c3b; color: #e6ecf5; border-color: rgba(255,255,255,0.14); }
  #resetModal .danger { background: #e05a4a; color: #fff; }

  /* ---- THE WAVE-COMPLETE SUMMARY ---------------------------------------
     Instead of a plain NEXT WAVE button, finishing a wave brings up a card
     that tells you how you did, what you built, what you earned, and what's
     coming - then lets you send the next lot straight from it. */
  #waveModal {
    position: fixed; inset: 0; z-index: 30;
    display: none;                 /* flipped to flex when a wave ends */
    align-items: center; justify-content: center;
    background: rgba(6, 9, 14, 0.72);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  #waveModal .card {
    width: min(360px, 88vw);
    background: #161d29;
    border: 1px solid rgba(255, 215, 106, 0.32);
    border-radius: 16px;
    padding: 22px 22px 20px;
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.55);
  }
  #waveModal h3 { margin: 0; font-size: 15px; color: #9fb0c6; letter-spacing: 2px; text-align: center; }
  #waveModal .big { text-align: center; font-size: 34px; font-weight: 800; margin: 8px 0 2px; }
  #waveModal .sub { text-align: center; font-size: 13px; color: #9fb0c6; margin: 0 0 16px; }
  #waveModal .rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  #waveModal .r { display: flex; align-items: baseline; gap: 10px; font-size: 14px; }
  #waveModal .r .lab {
    color: #6b7a90; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    width: 78px; flex: none; text-align: right;
  }
  #waveModal .r .val { color: #e6ecf5; }
  #waveModal .r .val.gold { color: #ffd76a; font-weight: 700; }
  #waveModal .go {
    width: 100%; padding: 15px; border-radius: 12px;
    font-family: inherit; font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
    cursor: pointer; border: none; background: #8fe07a; color: #10141c;
    transition: transform 0.1s, background 0.12s;
  }
  #waveModal .go:hover  { background: #a6ea94; }
  #waveModal .go:active { transform: scale(0.98); }
  #waveModal .peek {
    display: block; margin: 12px auto 0; background: none; border: none;
    color: #6b7a90; font-family: inherit; font-size: 12px; cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<canvas id="screen"></canvas>
<div id="hud">TAP to build &nbsp;&nbsp; stop the robots reaching the flag at the TOP</div>

<a id="back" href="index.html">&larr; Arcade</a>
<button id="reset">&#8635; Reset</button>

<!-- The reset asks first, because it throws the whole tower away. -->
<div id="resetModal">
  <div class="card">
    <h3>RESET?</h3>
    <p>This clears the whole tower and everything on it, and starts over from round 1.</p>
    <div class="row">
      <button id="resetCancel" class="btn cancel">Keep going</button>
      <button id="resetYes" class="btn danger">Reset</button>
    </div>
  </div>
</div>

<!-- Pops up when a wave finishes: how you did, what you built, what you
     earned, and what's next - with the button to send the next wave. -->
<div id="waveModal">
  <div class="card">
    <h3 id="waveTitle">WAVE CLEARED</h3>
    <div class="big" id="waveBig">0 / 0</div>
    <div class="sub" id="waveSub">robots stopped</div>
    <div class="rows">
      <div class="r"><span class="lab">Built</span><span class="val" id="waveBuilt">-</span></div>
      <div class="r"><span class="lab">Got past</span><span class="val" id="wavePast">-</span></div>
      <div class="r"><span class="lab">Earned</span><span class="val gold" id="waveEarn">-</span></div>
      <div class="r"><span class="lab">Next wave</span><span class="val" id="waveNext">-</span></div>
    </div>
    <button id="waveGo" class="go">Send the next wave &rarr;</button>
    <button id="wavePeek" class="peek">let me look at the tower first</button>
  </div>
</div>

<script>
// ===================================================================
//  BEAT THE BOT
//
//  A line of robots is coming. They all want the flag at the top.
//  You have coins. Stop them.
//
//  The whole thing lives or dies on ONE promise: the robots are not
//  pretending. Each one genuinely works out the cheapest way up
//  through whatever you have built. If it goes the long way round,
//  that is because the long way round really was cheaper.
//
//  What they CANNOT do is see the future. A saw pops up and drops
//  back down; a hammer falls when it falls. The robots creep past
//  them and take their chances - and creeping is exactly what gets
//  them caught.
//
//  Which is why the two halves of this game multiply each other. A
//  longer climb is more seconds spent next to your saws.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  THE TOWER
// -------------------------------------------------------------------

  const COLS = 13, ROWS = 15;
  const FLOOR = ROWS - 1;              // the solid ground at the bottom
  const RISE  = 3;                     // a new ledge every 3 rows going up

  // What a robot's legs can do. Everything the brain works out is built
  // on these two numbers.
  const JUMP_UP = 3, JUMP_OVER = 2;

  const FLAG  = { c: COLS >> 1, r: 1 };        // right at the top

  // SPAWN POINTS. Every level adds another (up to a cap), all of them on
  // the ground and all of them making for the same flag - so higher levels
  // are about routing several streams so they CONVERGE onto your traps.
  // STARTS is rebuilt for the current level whenever a new tower is made.
  const MAX_SPAWNS = 4;
  function spawnCount() { return Math.min(MAX_SPAWNS, level); }
  function makeStarts(n) {
    const r = FLOOR - 1, out = [];
    if (n <= 1) return [{ c: 1, r: r }];
    // spread them evenly across the ground, from near the left wall to
    // near the right, so their paths have to cross the whole tower.
    for (let i = 0; i < n; i++) {
      out.push({ c: Math.round(1 + i * (COLS - 3) / (n - 1)), r: r });
    }
    return out;
  }
  let STARTS = [{ c: 1, r: FLOOR - 1 }];

  // What can be in a square.
  const EMPTY = 0, WALL = 1, MUD = 2, PLAT = 3, DOOR = 4, KEY = 5,
        SAW = 6, SMASH = 7;

  // Three colours of door. A door only opens for a key of its colour.
  const LOCKS = [
    { name: 'RED',  col: [226, 96, 78] },
    { name: 'BLUE', col: [92, 152, 240] },
    { name: 'GREEN',col: [143, 224, 122] }
  ];

  const TOOLS = [
    { name: 'WALL',  price: 3, kind: WALL,
      blurb: 'blocks them - but they can land on top' },
    { name: 'MUD',   price: 1, kind: MUD,
      blurb: 'they wade through it - five slow steps' },
    { name: 'DOOR',  price: 5, kind: DOOR,
      blurb: 'place a door, then hide its key' },
    { name: 'SAW',   price: 6, kind: SAW,
      blurb: 'pops up, then drops. slices them. ⚡powered' },
    { name: 'HAMMER',price: 4, kind: SMASH,
      blurb: 'slams down. flattens them. ⚡powered' }
  ];

  let grid = [];      // what is in each square
  let tint = [];      // which colour, for doors and keys only

  let tool = 0;
  let coins = 26;
  let round = 1;

  // THE LEVEL = which map you're on. You stay on a map, sending wave after
  // wave, until you stop EVERY robot in one wave - a clean sweep. That
  // beats the map, and you move up to a brand-new one. (Later levels will
  // also add more robot spawn points.) So a good saw-line can't just be
  // reused forever: beat a map and you're handed a fresh puzzle.
  let level = 1;
  let lastPerfect = false;   // was the wave just finished a clean sweep?

  // THE POWER SUPPLY. Saws and hammers are POWERED traps - each one you
  // build draws on this. It starts big enough for three, so you can't just
  // sink every coin into saws; past that you have to spend coins GROWING
  // the supply, which competes with buying more traps. Walls, mud and
  // doors need no power at all.
  let powerMax = 3;
  let best = 0;       // the most robots you have ever stopped in one wave

  // When you put a door down you are holding its key, and the very next
  // tap puts the key somewhere.
  let holdingKey = -1;

  let state = 'build';        // 'build', 'run', 'done'
  let says = '', saysT = 0;
  function say(w) { says = w; saysT = 3.0; }

  // When a build is refused, we don't just say why - we SHOW it. A red X
  // flashes on the square you tried (for "no way up" / trapped-key), and
  // the coin counter flashes red when you can't afford something.
  let badCell = null;      // { c, r, t } - a red flash on a square
  let coinFlash = 0;       // seconds left flashing the coins red
  let powerFlash = 0;      // seconds left flashing the power meter red
  function reject(c, r, msg) { badCell = { c: c, r: r, t: 0.85 }; say(msg); }

  // ---- THE BIG WORDS ------------------------------------------------
  // GOOD JOB for roughly half, PERFECT for every last one of them.
  // "Roughly half" has to be an actual number, so it is a band either
  // side of half - change these two and the band moves.
  const HALF_LOW = 0.45, HALF_HIGH = 0.55;
  const GOOD_TIME = 1.0, PERFECT_TIME = 2.6;

  let banner = '', bannerT = 0, bannerFor = 1, bannerGold = false;

  // Kept as its own little function that just answers a question, so it
  // can be checked on its own without running a whole wave.
  function bannerWords(s, n) {
    if (n <= 0) return null;
    if (s === n) return { text: 'PERFECT',  time: PERFECT_TIME, gold: true };
    if (s >= n * HALF_LOW && s <= n * HALF_HIGH)
      return { text: 'GOOD JOB', time: GOOD_TIME, gold: false };
    return null;
  }
  function showBanner(s, n) {
    const b = bannerWords(s, n);
    if (!b) { bannerT = 0; return; }
    banner = b.text; bannerT = b.time; bannerFor = b.time; bannerGold = b.gold;
  }

  function inside(c, r) { return c >= 0 && r >= 0 && c < COLS && r < ROWS; }
  function at(c, r) { return inside(c, r) ? grid[r][c] : WALL; }

  // What it costs a robot to step into a square.
  //
  // THIS IS THE MOST IMPORTANT LINE IN THE GAME. A saw is not a wall -
  // if it were, they would simply walk round it and nothing would ever
  // get cut. It is a square they creep across. The cost IS the danger:
  // the longer it takes to cross, the likelier the blade is up when
  // they are standing on it.
  // These have to stay SMALL enough that a robot can cross in one safe
  // gap. Crossing time is this number divided by their walking speed -
  // make it bigger than the quiet part of the cycle and the hazard stops
  // being a gamble and becomes certain death.
  function costOf(kind) {
    if (kind === MUD)   return 5;
    if (kind === SAW)   return 3;
    if (kind === SMASH) return 2;
    return 1;
  }

  // Solid things block you AND hold you up. That is one idea, not two -
  // which is why a wall you build is also a ledge you built them.
  function solid(c, r) { const k = at(c, r); return k === WALL || k === PLAT; }

  // Can a robot be in this square, carrying these keys?
  function passable(c, r, keys) {
    if (!inside(c, r)) return false;
    const k = grid[r][c];
    if (k === WALL || k === PLAT) return false;
    if (k === DOOR) return (keys >> tint[r][c]) & 1;   // only with the key
    return true;
  }

  // Can it STAND here? It needs air to stand in and something under its
  // feet. No floating.
  function standable(c, r, keys) {
    return passable(c, r, keys) && solid(c, r + 1);
  }

  function keyBitAt(c, r) {
    return at(c, r) === KEY ? (1 << tint[r][c]) : 0;
  }


// -------------------------------------------------------------------
//  THE HAZARDS
//
//  Both of them run on a clock, not on where the robots are. They do
//  not aim and they do not wait. That is the whole reason some robots
//  in a line get through and some do not: they set off at different
//  moments, so they meet the blade at different points in its spin.
// -------------------------------------------------------------------

  // These four numbers ARE the difficulty, and they were carefully wrong
  // the first time: crossing a saw took 1.43s while the blade was only
  // down for 1.1s, so no robot could ever fit through the gap and every
  // single one died. A hazard nobody can survive is not a gamble, it is
  // a wall. There has to be a way through for the well-timed.
  //
  // The cycles are deliberately not neat fractions of WAVE_GAP either.
  // At 3 seconds and one robot per second, only three of them would ever
  // meet a different part of the spin - and they would die in pairs.
  const SAW_CYCLE = 2.9, SAW_UP    = 0.34;   // a long, obvious threat
  const HAM_CYCLE = 2.1, HAM_DOWN  = 0.16;   // brief, but comes round often

  let clock = 0;

  // Every hazard starts at a different point in its cycle, worked out
  // from where it is. Not random - random would flicker differently
  // every frame. This way the same square always keeps the same rhythm.
  function phaseOf(c, r) { return (((c * 7 + r * 13) % 11) / 11); }

  function sawUp(c, r) {
    return ((clock / SAW_CYCLE + phaseOf(c, r)) % 1) < SAW_UP;
  }
  function hammerDown(c, r) {
    return ((clock / HAM_CYCLE + phaseOf(c, r)) % 1) < HAM_DOWN;
  }
  function deadlyNow(c, r) {
    const k = at(c, r);
    if (k === SAW)   return sawUp(c, r);
    if (k === SMASH) return hammerDown(c, r);
    return false;
  }


// -------------------------------------------------------------------
//  BUILDING THE TOWER ITSELF
// -------------------------------------------------------------------

  function blankGrid() {
    grid = []; tint = [];
    for (let r = 0; r < ROWS; r++) {
      const a = [], b = [];
      for (let c = 0; c < COLS; c++) { a.push(EMPTY); b.push(0); }
      grid.push(a); tint.push(b);
    }
  }

  // The ledges. These are bolted down - nobody can remove them. They
  // are the bones of the tower.
  function layLedges(fallback) {
    for (let c = 0; c < COLS; c++) grid[FLOOR][c] = PLAT;   // the ground

    let floorNo = 0;
    for (let r = FLOOR - RISE; r >= 2; r -= RISE) {
      if (fallback) {
        // A guaranteed staircase, used only if random ledges keep coming
        // out unclimbable. Boring, but it always works.
        const from = floorNo % 2 === 0 ? 0 : 7;
        for (let c = from; c < from + 6; c++) grid[r][c] = PLAT;
      } else {
        const runs = Math.random() < 0.45 ? 2 : 1;
        for (let n = 0; n < runs; n++) {
          const len = 3 + Math.floor(Math.random() * 4);
          const x0  = Math.floor(Math.random() * (COLS - len + 1));
          for (let c = x0; c < x0 + len; c++) grid[r][c] = PLAT;
        }
      }
      floorNo++;
    }

    for (let c = FLAG.c - 1; c <= FLAG.c + 1; c++) {
      if (c >= 0 && c < COLS) grid[FLAG.r + 1][c] = PLAT;
    }
  }

  // Random ledges can come out unclimbable. So we do the honest thing:
  // build one, ASK A ROBOT if it can climb it, and throw it away if it
  // cannot. We never ship a tower we have not checked.
  function newTower() {
    // The spawn points are set from the level here, so every fresh tower
    // gets the right number of streams and every path check below is asked
    // about ALL of them.
    STARTS = makeStarts(spawnCount());
    for (let tries = 0; tries < 200; tries++) {
      blankGrid();
      layLedges(false);
      think();
      if (canGetThrough()) return tries;    // every spawn can reach the flag
    }
    blankGrid();
    layLedges(true);                        // the guaranteed staircase works for all
    think();
    return -1;
  }

  // START THE WHOLE GAME OVER. Fresh tower, coins and round back to the
  // beginning, everything you'd placed thrown away. We keep `best` though -
  // your record for most robots stopped is worth hanging on to.
  function resetGame() {
    coins = 26; round = 1; powerMax = 3; level = 1; lastPerfect = false;
    holdingKey = -1; tool = 0;
    badCell = null; coinFlash = 0; powerFlash = 0;
    bots = []; route = [];
    banner = ''; bannerT = 0;
    says = ''; saysT = 0;
    state = 'build';
    newTower();
    say('fresh tower - stop them reaching the flag');
  }

  // Move on to the next wave: pay out the coins, bump the round, and drop
  // back into build mode with the same tower (you keep everything you put
  // down - each wave you just add more).
  function nextWave() {
    round++;
    coins += 12 + round * 2;        // more to spend every wave
    state = 'build';
    bots = []; route = [];
    say('wave ' + round + ' - ' + waveSize() + ' of them this time');
  }

  // Beat a map (a clean sweep) and move up a level: a fresh random tower to
  // solve. You keep your coins and a clean-sweep bonus, so you're better
  // off than you started - but everything you'd built is gone with the old
  // map, so it's a new puzzle every time.
  function nextLevel() {
    level++;
    coins += 20 + level * 5;        // a clean-sweep bonus, on top of a fresh start
    round++;                        // waves keep getting bigger across levels
    state = 'build';
    bots = []; route = [];
    newTower();
    say('LEVEL ' + level + ' - a fresh tower. clean-sweep bonus paid!');
  }

  // Count up everything you've built, so the summary can list it back.
  function countBuilt() {
    const n = { wall: 0, mud: 0, door: 0, saw: 0, smash: 0 };
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const g = grid[r][c];
      if      (g === WALL)  n.wall++;
      else if (g === MUD)   n.mud++;
      else if (g === DOOR)  n.door++;
      else if (g === SAW)   n.saw++;
      else if (g === SMASH) n.smash++;
    }
    return n;
  }

  // Fill in and show the wave-complete card. Everything shown here matches
  // exactly what nextWave() will actually do, so there are no surprises.
  function showWaveComplete() {
    const total = bots.length;
    const s     = stopped();
    const past  = gotThrough();
    // A CLEAN SWEEP (every robot stopped) beats the map and moves you up a
    // level; otherwise it's just the next wave on the same map.
    const perfect = total > 0 && s === total;
    lastPerfect = perfect;

    // What the "continue" button will actually pay, so the card can't lie.
    const earned   = perfect ? 20 + (level + 1) * 5 : 12 + (round + 1) * 2;
    const nextSize = Math.min(WAVE_MAX, WAVE_MIN + round * WAVE_STEP);

    document.getElementById('waveTitle').textContent =
      perfect ? 'LEVEL ' + level + ' CLEARED!' : 'WAVE ' + round + ' CLEARED';

    const bigEl = document.getElementById('waveBig');
    bigEl.textContent = s + ' / ' + total;
    bigEl.style.color = perfect ? '#8fe07a' : s === 0 ? '#e05a4a' : '#ffd76a';
    document.getElementById('waveSub').textContent =
      perfect ? 'CLEAN SWEEP - map beaten!' :
      s === 0 ? 'they all walked straight past' :
                'robots stopped';

    // "what you built" - list the things, skipping any you've none of.
    const b = countBuilt();
    const parts = [];
    if (b.wall)  parts.push(b.wall  + (b.wall  > 1 ? ' walls'   : ' wall'));
    if (b.mud)   parts.push(b.mud   + ' mud');
    if (b.door)  parts.push(b.door  + (b.door  > 1 ? ' doors'   : ' door'));
    if (b.saw)   parts.push(b.saw   + (b.saw   > 1 ? ' saws'    : ' saw'));
    if (b.smash) parts.push(b.smash + (b.smash > 1 ? ' hammers' : ' hammer'));
    document.getElementById('waveBuilt').textContent = parts.length ? parts.join('  ·  ') : 'nothing - brave!';

    document.getElementById('wavePast').textContent =
      past === 0 ? 'none - flawless' : past + ' of ' + total;

    document.getElementById('waveEarn').textContent =
      '+' + earned + ' coins  (you’ll have ' + (coins + earned) + ')';

    // The "next" row and the button change depending on whether you've
    // beaten the map or you're facing another wave on the same one.
    const nextRow = document.getElementById('waveNext');
    const goBtn = document.getElementById('waveGo');
    if (perfect) {
      nextRow.textContent = 'a fresh map - LEVEL ' + (level + 1);
      goBtn.textContent = 'On to level ' + (level + 1) + ' →';
    } else {
      const more = nextSize > total ? '   (' + (nextSize - total) + ' more)' : '';
      nextRow.textContent = nextSize + ' robots' + more;
      goBtn.textContent = 'Send the next wave →';
    }

    document.getElementById('waveModal').style.display = 'flex';
  }
  function hideWaveComplete() { document.getElementById('waveModal').style.display = 'none'; }


// -------------------------------------------------------------------
//  THE ROBOTS' BRAIN
//
//  A robot has to know three things at once: which column, which row,
//  and which keys it is carrying. Standing in front of a red door with
//  the red key is a completely different situation from standing there
//  without it - so they have to count as two different places.
//
//  Same algorithm as a satnav, run over "place AND pockets".
// -------------------------------------------------------------------

  const KEYSETS = 1 << LOCKS.length;         // 8 possible pocketfuls
  const NSTATES = COLS * ROWS * KEYSETS;
  function id(c, r, keys) { return (r * COLS + c) * KEYSETS + keys; }

  // One "brain" per spawn point - the full satnav result from THAT spawn:
  // the cheapest cost to every place-and-pockets, and the cheapest way to
  // the flag. All the questions below (can they get through? which route?
  // is a key reachable?) are just asked of each brain in turn.
  let brains = [];

  // Everything a robot could do from where it is standing. Each move
  // remembers the squares it passes THROUGH, because that is what it
  // pays for, where it picks keys up, and where it can get sliced.
  function movesFrom(c, r, keys) {
    const out = [];

    // ---- WALK, or WALK OFF THE EDGE AND FALL --------------------------
    for (let d = -1; d <= 1; d += 2) {
      const nc = c + d;
      if (!passable(nc, r, keys)) continue;

      let cost = costOf(at(nc, r));
      let k2 = keys | keyBitAt(nc, r);
      const via = [{ c: nc, r: r }];

      if (standable(nc, r, keys)) {
        out.push({ c: nc, r: r, keys: k2, cost: cost, via: via });
        continue;
      }
      // Nothing under its feet, so down it goes until something stops it.
      let rr = r, ok = true;
      while (!solid(nc, rr + 1)) {
        if (!passable(nc, rr + 1, k2)) { ok = false; break; }
        rr++;
        cost += costOf(at(nc, rr));
        k2 |= keyBitAt(nc, rr);
        via.push({ c: nc, r: rr });
      }
      if (ok) out.push({ c: nc, r: rr, keys: k2, cost: cost, via: via });
    }

    // ---- JUMP ---------------------------------------------------------
    // Straight up, then across. Simple to picture, simple to check, and
    // it means a ledge with no gap beside it cannot be jumped onto - you
    // have to go up through a hole.
    for (let dy = 0; dy <= JUMP_UP; dy++) {
      for (let dx = -JUMP_OVER; dx <= JUMP_OVER; dx++) {
        if (dx === 0 && dy === 0) continue;

        let cost = 0, k2 = keys, ok = true;
        const via = [];

        for (let i = 1; i <= dy; i++) {                 // the way up
          const rr = r - i;
          if (!passable(c, rr, k2)) { ok = false; break; }
          cost += costOf(at(c, rr));
          k2 |= keyBitAt(c, rr);
          via.push({ c: c, r: rr });
        }
        if (!ok) continue;

        const rr = r - dy;
        const step = dx > 0 ? 1 : -1;
        for (let i = 1; i <= Math.abs(dx); i++) {       // the way across
          const cc = c + step * i;
          if (!passable(cc, rr, k2)) { ok = false; break; }
          cost += costOf(at(cc, rr));
          k2 |= keyBitAt(cc, rr);
          via.push({ c: cc, r: rr });
        }
        if (!ok) continue;

        const tc = c + dx;
        if (!standable(tc, rr, k2)) continue;           // nothing to land on
        out.push({ c: tc, r: rr, keys: k2, cost: cost, via: via });
      }
    }

    return out;
  }

  // The satnav, run from ONE spawn. Returns that spawn's whole result as
  // its own object, so several spawns never tread on each other's answers.
  //
  // Uses a binary min-heap (a "priority queue") so that with several spawns
  // re-planned on every tap it still stays instant. A heap always hands
  // back the smallest thing in it in one quick step, instead of scanning
  // every state to find the cheapest each time.
  function thinkFrom(start) {
    const dist   = new Float64Array(NSTATES).fill(Infinity);
    const prevOf = new Int32Array(NSTATES).fill(-1);
    const viaOf  = new Array(NSTATES).fill(null);
    const done   = new Uint8Array(NSTATES);

    const heap = [];   // state ids, kept ordered by dist[] via the sifts
    function up(i) {
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (dist[heap[i]] < dist[heap[p]]) { const t = heap[i]; heap[i] = heap[p]; heap[p] = t; i = p; }
        else break;
      }
    }
    function down(i) {
      const n = heap.length;
      for (;;) {
        let m = i; const l = 2 * i + 1, r = l + 1;
        if (l < n && dist[heap[l]] < dist[heap[m]]) m = l;
        if (r < n && dist[heap[r]] < dist[heap[m]]) m = r;
        if (m === i) break;
        const t = heap[i]; heap[i] = heap[m]; heap[m] = t; i = m;
      }
    }

    const s0 = id(start.c, start.r, 0);
    dist[s0] = 0; heap.push(s0);

    while (heap.length) {
      const bs = heap[0];
      const last = heap.pop();
      if (heap.length) { heap[0] = last; down(0); }
      if (done[bs]) continue;              // an old, stale copy - skip it
      done[bs] = 1;
      const bv = dist[bs];

      const keys = bs % KEYSETS;
      const cell = (bs - keys) / KEYSETS;
      const c = cell % COLS, r = (cell - c) / COLS;

      const moves = movesFrom(c, r, keys);
      for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        const ns = id(m.c, m.r, m.keys);
        const nd = bv + m.cost;
        if (nd < dist[ns]) {
          dist[ns] = nd; prevOf[ns] = bs; viaOf[ns] = m.via;
          heap.push(ns); up(heap.length - 1);
        }
      }
    }

    let bestCost = Infinity, bestEnd = -1;
    for (let k = 0; k < KEYSETS; k++) {
      const s = id(FLAG.c, FLAG.r, k);
      if (dist[s] < bestCost) { bestCost = dist[s]; bestEnd = s; }
    }
    return { start: start, dist: dist, prevOf: prevOf, viaOf: viaOf,
             bestCost: bestCost, bestEnd: bestEnd };
  }

  // Re-plan every spawn. Called whenever the tower changes.
  function think() { brains = STARTS.map(thinkFrom); }

  // Every stream must be able to reach the flag, or the tower's a dead end.
  function canGetThrough() {
    return brains.length > 0 && brains.every(function (b) { return b.bestCost < Infinity; });
  }
  // The longest of the streams' climbs - the number shown as "steps".
  function longestSteps() {
    let m = 0;
    for (const b of brains) if (b.bestCost < Infinity && b.bestCost > m) m = b.bestCost;
    return m;
  }

  // Can a robot from ANY spawn ever actually GET this key? (It might swipe
  // it mid-jump, so we ask about reachable pockets, not squares.)
  function canFetch(colour) {
    const bit = 1 << colour;
    for (const b of brains)
      for (let s = 0; s < NSTATES; s++)
        if (b.dist[s] < Infinity && ((s % KEYSETS) & bit)) return true;
    return false;
  }

  // Reconstruct the cheapest route for one spawn (by its index in STARTS).
  function routeCellsFor(i) {
    const b = brains[i];
    if (!b || b.bestEnd < 0) return [];
    const chunks = [];
    let s = b.bestEnd;
    while (s >= 0 && b.prevOf[s] >= 0) { chunks.push(b.viaOf[s]); s = b.prevOf[s]; }
    chunks.reverse();
    const out = [{ c: b.start.c, r: b.start.r }];
    for (let x = 0; x < chunks.length; x++)
      for (let j = 0; j < chunks[x].length; j++) out.push(chunks[x][j]);
    return out;
  }
  function allRoutes() {
    const out = [];
    for (let i = 0; i < brains.length; i++) out.push(routeCellsFor(i));
    return out;
  }


// -------------------------------------------------------------------
//  THE LINE OF ROBOTS
// -------------------------------------------------------------------

  // Four hundred robots leaving one at a time would be five minutes of
  // watching a queue. So the QUEUE always takes the same time to get out
  // of the door - there are just more of them in it, packed tighter.
  //
  // The window is not a round number, and not by accident: divided by
  // the wave size it must land on a gap that divides BADLY into both
  // hazard cycles. If it divides neatly, robots meet the blade at the
  // same point in its spin and die in identical repeating groups.
  const LAUNCH_WINDOW = 13.3;
  function waveGap() {
    return Math.max(0.03, LAUNCH_WINDOW / waveSize());
  }
  let bots = [];
  let route = [];
  let scrap = [];                    // bolts and sparks flying about

  // A hundred in the first wave, fifty more each time, stopping at four
  // hundred. Whether you stop 8 of 10 or 300 of 400 is the same skill -
  // what changes is that a crowd this big makes the SHAPE of your
  // defence visible. You can see the stream thin out at each saw.
  const WAVE_MIN = 100, WAVE_MAX = 400, WAVE_STEP = 50;
  function waveSize() {
    return Math.min(WAVE_MAX, WAVE_MIN + (round - 1) * WAVE_STEP);
  }
  function gotThrough() {
    let n = 0;
    for (let i = 0; i < bots.length; i++) if (bots[i].done) n++;
    return n;
  }
  function stopped() {
    let n = 0;
    for (let i = 0; i < bots.length; i++) if (!bots[i].alive) n++;
    return n;
  }

  // ---- THE POWER SUPPLY ---------------------------------------------
  // Only saws and hammers are powered.
  function isPowered(kind) { return kind === SAW || kind === SMASH; }
  // How much power you're using right now = how many powered traps are up.
  function poweredUsed() {
    let n = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
      if (isPowered(grid[r][c])) n++;
    return n;
  }
  // Each extra unit costs more than the last, so power stays a real choice
  // and you can't buy your way to a wall of saws.
  function powerUpCost() { return 8 + (powerMax - 3) * 6; }
  function upgradePower() {
    const cost = powerUpCost();
    if (coins < cost) { say('need ' + cost + ' coins to grow the power supply'); return; }
    coins -= cost;
    powerMax++;
    say('power supply grown - room for ' + powerMax + ' powered traps now');
  }

  function go() {
    if (holdingKey >= 0) { say('put the key down first'); return; }
    think();
    if (!canGetThrough()) { say('they cannot get up there at all'); return; }

    // One route per spawn. Every robot carries its OWN route, so each stream
    // takes its own cheapest way up - and you get to make them cross.
    const routes = allRoutes();
    bots = [];
    const total = waveSize();
    const n = STARTS.length;
    const gap = waveGap();
    for (let i = 0; i < total; i++) {
      const sp = i % n;                     // deal them out across the spawns
      const st = STARTS[sp];
      bots.push({ spawn: sp, route: routes[sp],
                  at: 0, step: 0, c: st.c, r: st.r,
                  x: st.c, y: st.r, keys: 0,
                  // a small fixed shove each, so a shared square reads as a
                  // crowd instead of one fat robot.
                  jx: (((i * 7) % 9) - 4) * 0.075,
                  jy: (((i * 5) % 7) - 3) * 0.055,
                  alive: true, done: false, wait: Math.floor(i / n) * gap, face: 1 });
    }
    scrap = [];
    clock = 0;
    state = 'run';
    say(n > 1 ? 'here they come - ' + total + ' from ' + n + ' ways in'
              : 'here they come - ' + total + ' of them');
  }

  function burst(x, y) {
    // Bolts, springs and one surprised eyeball. A big wave gets fewer
    // bolts each, or four hundred deaths would bury the screen in
    // confetti and hide the very thing you are trying to watch.
    const bits = bots.length > 60 ? 5 : 14;
    for (let i = 0; i < bits; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 6;
      scrap.push({ x: x, y: y,
                   vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
                   life: 0.9 + Math.random() * 0.5,
                   size: 2 + Math.random() * 3 });
    }
    if (scrap.length > 260) scrap.splice(0, scrap.length - 260);
  }

  function stepRobot(b, dt) {
    if (!b.alive || b.done) return;
    if (b.wait > 0) { b.wait -= dt; return; }

    // It creeps across the nasty squares. Which is the whole problem.
    const here = at(b.c, b.r);
    const slow = costOf(here);
    b.step += dt * (4.2 / slow);

    const rt = b.route;
    while (b.step >= 1) {
      b.step -= 1;
      if (b.at >= rt.length - 1) { b.done = true; return; }
      b.at++;
      const n = rt[b.at];
      if (n.c !== b.c) b.face = n.c > b.c ? 1 : -1;
      b.c = n.c; b.r = n.r;
      b.keys |= keyBitAt(n.c, n.r);
    }

    const a = rt[b.at];
    const nx = rt[Math.min(b.at + 1, rt.length - 1)];
    b.x = a.c + (nx.c - a.c) * b.step;
    b.y = a.r + (nx.r - a.r) * b.step;
  }

  function update(dt) {
    if (saysT > 0) saysT -= dt;
    if (coinFlash > 0) coinFlash -= dt;
    if (powerFlash > 0) powerFlash -= dt;
    if (badCell) { badCell.t -= dt; if (badCell.t <= 0) badCell = null; }
    // Counted down here, above the "are we running?" check, or the words
    // would freeze on screen the moment the wave finished - which is
    // exactly when they appear.
    if (bannerT > 0) bannerT -= dt;

    // Scrap keeps flying even after the round is over.
    for (let i = scrap.length - 1; i >= 0; i--) {
      const p = scrap[i];
      p.life -= dt;
      if (p.life <= 0) { scrap.splice(i, 1); continue; }
      p.x += p.vx * dt * 30; p.y += p.vy * dt * 30;
      p.vy += dt * 34;
    }

    if (state !== 'run') return;
    clock += dt;

    for (let i = 0; i < bots.length; i++) {
      const b = bots[i];
      stepRobot(b, dt);

      // Was it standing there when the blade came up?
      if (b.alive && !b.done && b.wait <= 0) {
        const cc = Math.round(b.x), rr = Math.round(b.y);
        if (deadlyNow(cc, rr)) {
          b.alive = false;
          const bd = board();
          burst(bd.x + (b.x + 0.5) * bd.s, bd.y + (b.y + 0.5) * bd.s);
        }
      }
    }

    let busy = false;
    for (let i = 0; i < bots.length; i++) if (bots[i].alive && !bots[i].done) busy = true;
    if (!busy) {
      state = 'done';
      const s = stopped();
      if (s > best) best = s;
      showBanner(s, bots.length);
      showWaveComplete();          // the summary card takes over from here
    }
  }


// -------------------------------------------------------------------
//  WHERE EVERYTHING IS ON SCREEN
// -------------------------------------------------------------------

  // A phone held sideways has loads of width and almost no height, so
  // the buttons move to a block on the right instead of a row below.
  function wide()   { return W > H * 1.35; }
  function panelW() { return wide() ? Math.min(W * 0.36, 320) : 0; }
  // The header is two tidy tiers, the same in portrait and landscape:
  //   row 1  - the Arcade / Reset nav pills (and the key prompt when hiding
  //            a key)
  //   row 2  - ONE stat bar: coins | power | level | steps
  // topBar() is where the board begins, just under both. Keeping it this
  // compact also hands the tower back a good chunk of height.
  const NAV_H  = 40;     // the nav pill row
  const STAT_H = 42;     // the stat dashboard row
  function topBar() { return NAV_H + STAT_H + 6; }

  // Five tools and a GO button will not fit in one row on a phone, so
  // they wrap onto as many rows as they need - and the tower is told
  // how much room that took, instead of us guessing a number.
  function btnCols()  { return wide() ? 2 : 3; }
  function btnRows()  { return Math.ceil((TOOLS.length + 1) / btnCols()); }
  function btnH() {
    if (!wide()) return 52;
    return clamp((H - topBar() - 30 - 8 * (btnRows() - 1)) / btnRows(), 40, 56);
  }
  function boxOf(i) {
    const cols = btnCols(), h = btnH();
    const cx = i % cols, cy = Math.floor(i / cols);
    if (wide()) {
      const w = (panelW() - 24 - 8 * (cols - 1)) / cols;
      return { x: W - panelW() + 8 + cx * (w + 8),
               y: topBar() + 8 + cy * (h + 8), w: w, h: h };
    }
    const w = (W - 40 - 10 * (cols - 1)) / cols;
    const y0 = H - 26 - btnRows() * h - (btnRows() - 1) * 10;
    return { x: 20 + cx * (w + 10), y: y0 + cy * (h + 10), w: w, h: h };
  }
  function toolBox(i) { return boxOf(i); }
  function goBox()    { return boxOf(TOOLS.length); }

  // The stat bar spans the width (minus the side panel in landscape) and is
  // split into four equal cells. Everything up top reads off these, so
  // there's one row of numbers instead of three scattered ones.
  function statBarRect() {
    return { x: 8, y: NAV_H, w: (W - panelW()) - 16, h: STAT_H - 4 };
  }
  function statCell(i) {                  // i = 0..3
    const b = statBarRect(), cw = b.w / 4;
    return { x: b.x + i * cw, y: b.y, w: cw, h: b.h };
  }
  // The POWER cell is the tappable one - tap it to grow the supply.
  function powerBox() { return statCell(1); }

  // A rounded rectangle path, so the pills and the meter aren't hard boxes.
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function botBar() {
    return wide() ? 16 : (btnRows() * btnH() + (btnRows() - 1) * 10 + 44);
  }

  function board() {
    // Everything else asks THIS function where things are - so changing
    // the shape here moves the drawing and your finger at the same time,
    // and they can never disagree.
    const s = Math.min((W - panelW() - 40) / COLS,
                       (H - topBar() - botBar()) / ROWS);
    return { s: s,
             x: (W - panelW() - s * COLS) / 2,
             y: topBar() + (H - topBar() - botBar() - s * ROWS) / 2 };
  }

  function cellAt(mx, my) {
    const b = board();
    const c = Math.floor((mx - b.x) / b.s);
    const r = Math.floor((my - b.y) / b.s);
    if (!inside(c, r)) return null;
    return { c: c, r: r };
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  function drawKeyShape(x, y, s, col) {
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.arc(x, y - s * 0.12, s * 0.17, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - s * 0.045, y - s * 0.02, s * 0.09, s * 0.30);
    ctx.fillRect(x - s * 0.045, y + s * 0.16, s * 0.16, s * 0.06);
    ctx.fillStyle = '#10141c';
    ctx.beginPath();
    ctx.arc(x, y - s * 0.12, s * 0.06, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBlade(x, y, s, spin, out) {
    // A circular blade with teeth. When it is down you only see the
    // slot it lives in, so you know where it will come from.
    ctx.fillStyle = '#0d1017';
    ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.2);
    if (out <= 0) return;

    const cy = y + s * (0.82 - 0.62 * out);
    const rad = s * 0.34 * out;
    ctx.save();
    ctx.translate(x + s / 2, cy);
    ctx.rotate(spin);
    ctx.fillStyle = '#c9d4e6';
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.beginPath();
      ctx.moveTo(-rad * 0.35, -rad * 0.85);
      ctx.lineTo(0, -rad * 1.35);
      ctx.lineTo(rad * 0.35, -rad * 0.85);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5d6a80';
    ctx.beginPath();
    ctx.arc(0, 0, rad * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHammer(x, y, s, down) {
    // Rail it hangs from.
    ctx.fillStyle = '#2b3242';
    ctx.fillRect(x + s * 0.42, y, s * 0.16, s);

    const top = y + s * (down ? 0.42 : 0.02);
    ctx.fillStyle = down ? '#e8834a' : '#8a94a8';
    ctx.fillRect(x + s * 0.12, top, s * 0.76, s * 0.42);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(x + s * 0.12, top + s * 0.32, s * 0.76, s * 0.10);
  }

  function drawTower() {
    const b = board();
    const spin = clock * 14;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = b.x + c * b.s, y = b.y + r * b.s;
        const kind = grid[r][c];

        ctx.fillStyle = (r % RISE === (FLOOR % RISE)) ? '#1a2130' : '#151b27';
        ctx.fillRect(x, y, b.s, b.s);
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, b.s - 1, b.s - 1);

        if (kind === PLAT) {
          ctx.fillStyle = '#3c4658';
          ctx.fillRect(x, y, b.s, b.s);
          ctx.fillStyle = '#6f7d94';
          ctx.fillRect(x, y, b.s, Math.max(2, b.s * 0.14));
        }

        if (kind === WALL) {
          ctx.fillStyle = '#96a0b4';
          ctx.fillRect(x + 1, y + 1, b.s - 2, b.s - 2);
          ctx.fillStyle = '#c3ccdd';
          ctx.fillRect(x + 1, y + 1, b.s - 2, Math.max(2, b.s * 0.14));
        }

        if (kind === MUD) {
          ctx.fillStyle = '#6b4a2a';
          ctx.fillRect(x + 1, y + 1, b.s - 2, b.s - 2);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          for (let i = 0; i < 5; i++) {
            const a = i * 1.9 + c + r;
            ctx.beginPath();
            ctx.arc(x + b.s * (0.3 + 0.4 * Math.abs(Math.sin(a))),
                    y + b.s * (0.3 + 0.4 * Math.abs(Math.cos(a * 1.7))),
                    b.s * 0.07, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        if (kind === SAW) {
          // While you are building it sits half out, so you can see it
          // is there. Once they are running it does its real cycle.
          const out = state === 'build' ? 0.55 : (sawUp(c, r) ? 1 : 0);
          drawBlade(x, y, b.s, spin, out);
        }

        if (kind === SMASH) {
          const down = state === 'build' ? false : hammerDown(c, r);
          drawHammer(x, y, b.s, down);
        }

        if (kind === DOOR) {
          const col = LOCKS[tint[r][c]].col;
          // the door panel...
          ctx.fillStyle = rgb(col);
          ctx.fillRect(x + b.s * 0.12, y + 1, b.s * 0.76, b.s - 2);
          // ...with a darker frame, so it reads as a DOOR, not a coloured
          // block that happens to match a key.
          ctx.strokeStyle = 'rgba(0,0,0,0.4)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + b.s * 0.12, y + 1, b.s * 0.76, b.s - 2);
          // a proper keyhole - a round hole with a slot under it.
          ctx.fillStyle = 'rgba(0,0,0,0.55)';
          ctx.beginPath();
          ctx.arc(x + b.s * 0.66, y + b.s * 0.44, b.s * 0.1, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(x + b.s * 0.635, y + b.s * 0.44, b.s * 0.05, b.s * 0.18);
        }

        if (kind === KEY) {
          const col = LOCKS[tint[r][c]].col;
          // A soft coloured ring so a hidden key is easy to spot - and its
          // colour tells you at a glance which door it opens.
          ctx.strokeStyle = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',0.55)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 2.5, y + 2.5, b.s - 5, b.s - 5);
          drawKeyShape(x + b.s / 2, y + b.s / 2, b.s, col);
        }
      }
    }

    // ---- THE ROUTES --------------------------------------------------
    // One line per spawn, drawn WHILE you build so every block shows what
    // it was worth the instant you put it down. Where they overlap you can
    // see the streams converge - which is exactly where a saw earns most.
    const paths = allRoutes();
    ctx.lineWidth = Math.max(2, b.s * 0.11);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = state === 'build' ? 'rgba(255,215,106,0.7)'
                                        : 'rgba(255,215,106,0.28)';
    for (let p = 0; p < paths.length; p++) {
      const path = paths[p];
      if (path.length < 2) continue;
      ctx.beginPath();
      for (let i = 0; i < path.length; i++) {
        const px = b.x + (path[i].c + 0.5) * b.s;
        const py = b.y + (path[i].r + 0.5) * b.s;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // ---- STARTS AND FLAG ---------------------------------------------
    // A marked square at each spawn - that's where a stream comes in.
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 2;
    for (let i = 0; i < STARTS.length; i++) {
      const sx = b.x + STARTS[i].c * b.s, sy = b.y + STARTS[i].r * b.s;
      ctx.strokeRect(sx + 3, sy + 3, b.s - 6, b.s - 6);
    }

    const fx = b.x + FLAG.c * b.s, fy = b.y + FLAG.r * b.s;
    ctx.strokeStyle = '#ffd76a';
    ctx.lineWidth = Math.max(2, b.s * 0.08);
    ctx.beginPath();
    ctx.moveTo(fx + b.s * 0.35, fy + b.s * 0.85);
    ctx.lineTo(fx + b.s * 0.35, fy + b.s * 0.15);
    ctx.stroke();
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath();
    ctx.moveTo(fx + b.s * 0.35, fy + b.s * 0.15);
    ctx.lineTo(fx + b.s * 0.85, fy + b.s * 0.32);
    ctx.lineTo(fx + b.s * 0.35, fy + b.s * 0.48);
    ctx.fill();

    // ---- THE "NO" FLASH ----------------------------------------------
    // A red square with an X on the spot you just tried to build, so a
    // refused block tells you exactly WHERE, not just a line of text.
    if (badCell) {
      const a = clamp(badCell.t / 0.85, 0, 1);
      const gx = b.x + badCell.c * b.s, gy = b.y + badCell.r * b.s;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(224,90,74,0.4)';
      ctx.fillRect(gx, gy, b.s, b.s);
      ctx.strokeStyle = '#e05a4a';
      ctx.lineWidth = Math.max(2, b.s * 0.09);
      ctx.lineCap = 'round';
      const m = b.s * 0.26;
      ctx.beginPath();
      ctx.moveTo(gx + m, gy + m); ctx.lineTo(gx + b.s - m, gy + b.s - m);
      ctx.moveTo(gx + b.s - m, gy + m); ctx.lineTo(gx + m, gy + b.s - m);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawRobot(b, bd) {
    const x = bd.x + (b.x + 0.5 + (b.jx || 0)) * bd.s;
    const y = bd.y + (b.y + 0.5 + (b.jy || 0)) * bd.s;
    // Smaller bodies in a big wave, so a crowd is a crowd and not a
    // single blob of overlapping robots.
    const s = bd.s * (bots.length > 60 ? 0.19 : 0.28);
    const bounce = Math.abs(Math.sin(b.step * Math.PI)) * s * 0.25;

    ctx.fillStyle = b.done ? '#8fe07a' : '#dbe4f2';
    ctx.fillRect(x - s, y - s - bounce, s * 2, s * 1.7);
    ctx.fillStyle = '#10141c';
    ctx.fillRect(x - s * 0.55, y - s * 0.55 - bounce, s * 0.38, s * 0.38);
    ctx.fillRect(x + s * 0.17, y - s * 0.55 - bounce, s * 0.38, s * 0.38);
    ctx.fillStyle = '#ffd76a';
    ctx.fillRect(x - s * 0.15, y - s * 1.5 - bounce, s * 0.3, s * 0.45);

    // Keys jingling overhead are lovely with ten robots and unreadable
    // clutter with four hundred, so the crowd carries them out of sight.
    if (bots.length > 60) return;
    let shown = 0;
    for (let i = 0; i < LOCKS.length; i++) {
      if (!((b.keys >> i) & 1)) continue;
      drawKeyShape(x - s * 0.7 + shown * s * 0.7, y - s * 2.3 - bounce,
                   bd.s * 0.5, LOCKS[i].col);
      shown++;
    }
  }

  function drawWave() {
    const bd = board();
    if (state === 'build') {
      // A waiting robot on every spawn square, so each one shows where a
      // stream will come from.
      for (let i = 0; i < STARTS.length; i++)
        drawRobot({ x: STARTS[i].c, y: STARTS[i].r, step: 0, keys: 0, done: false }, bd);
    } else {
      for (let i = 0; i < bots.length; i++) {
        const b = bots[i];
        if (!b.alive || b.wait > 0) continue;
        drawRobot(b, bd);
      }
    }
    for (let i = 0; i < scrap.length; i++) {
      const p = scrap[i];
      ctx.fillStyle = 'rgba(200,212,230,' + clamp(p.life, 0, 1) + ')';
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }

  function usedLocks() {
    const seen = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === DOOR && seen.indexOf(tint[r][c]) < 0) seen.push(tint[r][c]);
      }
    }
    return seen;
  }
  function allKeysFetchable() {
    const used = usedLocks();
    for (let i = 0; i < used.length; i++) if (!canFetch(used[i])) return false;
    return true;
  }
  function nextLock() {
    const used = usedLocks();
    for (let i = 0; i < LOCKS.length; i++) if (used.indexOf(i) < 0) return i;
    return -1;
  }

  // The power supply meter, in the top-centre nav band. The whole pill is
  // a button: tap it to spend coins growing the supply. It glows red when
  // it's full, so you can see at a glance why a saw won't go down.
  // THE STAT BAR - one cohesive dashboard: coins | power | level | steps.
  // Each cell is a small uppercase label with a big value under it. The
  // POWER cell is also a button (tap to grow the supply) and shows its
  // price; it turns red when it's full or when you just hit the ceiling.
  function drawStatBar() {
    const b = statBarRect();
    rrect(b.x, b.y, b.w, b.h, 10);
    ctx.fillStyle = 'rgba(20, 26, 38, 0.5)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1; ctx.stroke();

    // hairline dividers between the four cells
    for (let i = 1; i < 4; i++) {
      const x = b.x + b.w * i / 4;
      ctx.beginPath(); ctx.moveTo(x, b.y + 8); ctx.lineTo(x, b.y + b.h - 8); ctx.stroke();
    }

    const labY = b.y + 15, valY = b.y + b.h - 9;
    const valFont = 'bold ' + Math.min(W * 0.045, 18) + 'px system-ui, sans-serif';
    function label(cx, s) {
      ctx.textAlign = 'center'; ctx.font = '9px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(159,176,198,0.85)'; ctx.fillText(s, cx, labY);
    }
    function value(cx, s, col) {
      ctx.textAlign = 'center'; ctx.font = valFont;
      ctx.fillStyle = col; ctx.fillText(s, cx, valY);
    }

    // 0 - COINS (flashes red when you can't afford a thing)
    let c = statCell(0);
    const coinRed = coinFlash > 0 && Math.sin(coinFlash * 30) > 0;
    label(c.x + c.w / 2, 'COINS');
    value(c.x + c.w / 2, '' + coins, coinRed ? '#e05a4a' : '#ffd76a');

    // 1 - POWER (the tappable one, with its grow-it price)
    c = statCell(1);
    const used = poweredUsed(), full = used >= powerMax, canUp = coins >= powerUpCost();
    const pflash = powerFlash > 0 && Math.sin(powerFlash * 30) > 0;
    rrect(c.x + 3, c.y + 3, c.w - 6, c.h - 6, 7);
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
    if (full || pflash) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = pflash ? '#e05a4a' : 'rgba(224,90,74,0.6)';
      ctx.stroke();
    }
    label(c.x + c.w / 2, 'POWER');
    value(c.x + c.w / 2, '⚡' + used + '/' + powerMax, full ? '#e05a4a' : '#ffd76a');
    ctx.textAlign = 'right'; ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillStyle = canUp ? '#8fe07a' : '#6b7a90';
    ctx.fillText('+' + powerUpCost(), c.x + c.w - 6, labY);

    // 2 - LEVEL and wave
    c = statCell(2);
    label(c.x + c.w / 2, 'LEVEL');
    value(c.x + c.w / 2, level + ' · w' + round, '#e6ecf5');

    // 3 - STEPS while building / STOPPED while they climb
    c = statCell(3);
    if (state === 'build') {
      const ok = canGetThrough();
      label(c.x + c.w / 2, 'STEPS');
      value(c.x + c.w / 2, ok ? '' + longestSteps() : 'NO WAY', ok ? '#8fe07a' : '#e05a4a');
    } else {
      label(c.x + c.w / 2, 'STOPPED');
      value(c.x + c.w / 2, stopped() + '/' + bots.length, '#e8834a');
    }
    ctx.textAlign = 'left';
  }

  // While you're holding a door's key, this shouts about it: a pulsing
  // frame in the key's colour around the whole board, and a banner up top
  // with the key drawn on it - so "you are placing a KEY now" is
  // impossible to miss.
  function drawKeyPrompt() {
    const col = LOCKS[holdingKey].col;
    const pulse = 0.4 + 0.6 * Math.abs(Math.sin(clock * 4));
    const colStr = 'rgba(' + col[0] + ',' + col[1] + ',' + col[2] + ',' + pulse.toFixed(3) + ')';
    const bd = board();

    // frame round the board
    ctx.lineWidth = 4;
    ctx.strokeStyle = colStr;
    ctx.strokeRect(bd.x - 3, bd.y - 3, bd.s * COLS + 6, bd.s * ROWS + 6);

    // banner in the top-centre band
    const txt = 'HIDE THE ' + LOCKS[holdingKey].name + ' KEY';
    ctx.font = 'bold ' + Math.min(W * 0.032, 16) + 'px system-ui, sans-serif';
    const tw = ctx.measureText(txt).width;
    const ph = 32, pw = Math.min(W - 20, tw + 78);
    const cx = (W - panelW()) / 2, px = cx - pw / 2, py = 6, cyy = py + ph / 2;
    rrect(px, py, pw, ph, ph / 2);
    ctx.fillStyle = 'rgba(14, 18, 26, 0.92)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = colStr; ctx.stroke();

    drawKeyShape(px + 24, cyy, 26, col);

    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = rgb(col);
    ctx.fillText(txt, px + 42, cyy);
    ctx.textBaseline = 'alphabetic';
  }

  function drawHud() {
    // The whole top of the screen is now ONE stat bar. When you're hiding a
    // door's key, a prompt takes over the nav band above it.
    drawStatBar();
    if (state === 'build' && holdingKey >= 0) drawKeyPrompt();

    // ---- TOOLS -------------------------------------------------------
    for (let i = 0; i < TOOLS.length; i++) {
      const t = TOOLS[i], bx = toolBox(i);
      const on = tool === i && holdingKey < 0;
      const lock = nextLock();
      const powerOK = !isPowered(t.kind) || poweredUsed() < powerMax;
      const can = coins >= t.price && (t.kind !== DOOR || lock >= 0) && powerOK;

      ctx.fillStyle = on ? 'rgba(255,215,106,0.18)' : 'rgba(0,0,0,0.35)';
      ctx.fillRect(bx.x, bx.y, bx.w, bx.h);
      ctx.lineWidth = on ? 3 : 2;
      ctx.strokeStyle = on ? '#ffd76a' : 'rgba(255,255,255,0.18)';
      ctx.strokeRect(bx.x, bx.y, bx.w, bx.h);

      // A little picture of the thing, so you never have to read to know.
      const ix = bx.x + 8, iy = bx.y + bx.h * 0.5 - 11, is = 22;
      if (t.kind === WALL) {
        ctx.fillStyle = '#96a0b4'; ctx.fillRect(ix, iy, is, is);
        ctx.fillStyle = '#c3ccdd'; ctx.fillRect(ix, iy, is, 4);
      } else if (t.kind === MUD) {
        ctx.fillStyle = '#6b4a2a'; ctx.fillRect(ix, iy, is, is);
      } else if (t.kind === DOOR) {
        ctx.fillStyle = rgb(lock >= 0 ? LOCKS[lock].col : [90, 100, 118]);
        ctx.fillRect(ix + 2, iy, is - 4, is);
      } else if (t.kind === SAW) {
        drawBlade(ix - 1, iy - is * 0.4, is * 1.4, clock * 14, 1);
      } else {
        drawHammer(ix - 1, iy - is * 0.2, is * 1.3, false);
      }

      // Text stays inside its own button, whatever we write in it. Without
      // this a long blurb spills across the next button and the two of
      // them read as one sentence of nonsense.
      ctx.save();
      ctx.beginPath();
      ctx.rect(bx.x + 2, bx.y + 2, bx.w - 4, bx.h - 4);
      ctx.clip();

      const roomy = bx.w > 165;
      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.021, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = can ? '#e6ecf5' : '#5a6678';
      ctx.fillText(t.name + '  ' + t.price, bx.x + 38, bx.y + (roomy ? 24 : bx.h * 0.6));
      if (roomy) {
        ctx.font = Math.min(W * 0.017, 12) + 'px system-ui, sans-serif';
        ctx.fillStyle = '#6b7a90';
        ctx.fillText(t.blurb, bx.x + 38, bx.y + 42);
      }
      ctx.restore();
    }

    // ---- GO -----------------------------------------------------------
    const g = goBox();
    const ready = state === 'build' && canGetThrough() && holdingKey < 0;
    ctx.fillStyle = ready ? 'rgba(143,224,122,0.2)' : 'rgba(0,0,0,0.35)';
    ctx.fillRect(g.x, g.y, g.w, g.h);
    ctx.lineWidth = 3;
    ctx.strokeStyle = ready ? '#8fe07a' : 'rgba(255,255,255,0.2)';
    ctx.strokeRect(g.x, g.y, g.w, g.h);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.028, 21) + 'px system-ui, sans-serif';
    ctx.fillStyle = ready ? '#8fe07a' : '#6b7a90';
    ctx.fillText(state === 'build' ? 'SEND THEM' : state === 'run' ? 'CLIMBING' : 'NEXT WAVE',
                 g.x + g.w / 2, g.y + g.h * 0.63);

    if (wide() && board().s < 26) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.fillStyle = '#6b7a90';
      ctx.fillText('turn your phone upright for a much bigger tower',
                   (W - panelW()) / 2, topBar() + 16);
    }

    // ---- GOOD JOB / PERFECT --------------------------------------------
    if (bannerT > 0) {
      const bd = board();
      const cx = (W - panelW()) / 2;
      const cy = bd.y + ROWS * bd.s * 0.42;
      const age = bannerFor - bannerT;

      // A quick pop as it lands, then it holds, then it fades. All three
      // come from the same one timer.
      const grow = age < 0.16 ? 0.55 + 0.45 * (age / 0.16) : 1;
      const fade = clamp(bannerT / 0.35, 0, 1);

      ctx.save();
      ctx.textAlign = 'center';

      // Pick a size, then MEASURE it and shrink if it would run off the
      // edge. On a sideways phone PERFECT came out 27px wider than the
      // room it had - guessing a size from the screen width is not the
      // same as checking the word actually fits.
      let size = Math.min(W * (bannerGold ? 0.155 : 0.115), bannerGold ? 128 : 92);
      // 52 of that is the dark box drawn behind the words (26 each side),
      // plus a little air. Reserve what is actually painted, not the
      // text alone, or it hangs 6px off the edge.
      const room = (W - panelW()) - 60;
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      const natural = ctx.measureText(banner).width;
      if (natural > room) size *= room / natural;

      size *= grow;
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      const wid = ctx.measureText(banner).width;

      ctx.globalAlpha = fade * 0.82;
      ctx.fillStyle = '#10141c';
      ctx.fillRect(cx - wid / 2 - 26, cy - size * 0.82, wid + 52, size * 1.18);

      ctx.globalAlpha = fade;
      ctx.lineWidth = Math.max(3, size * 0.07);
      ctx.strokeStyle = bannerGold ? '#ffd76a' : '#8fe07a';
      ctx.strokeText(banner, cx, cy);
      ctx.fillStyle = bannerGold ? '#fff3cf' : '#dcf6d2';
      ctx.fillText(banner, cx, cy);
      ctx.restore();
    }

    if (saysT > 0) {
      ctx.textAlign = 'center';
      const size = wide() ? 15 : Math.min(W * 0.027, 20);
      // Sit it just above the buttons - worked out FROM where the buttons
      // are, not guessed, so it cannot land on top of them when the
      // number of tools changes.
      const y = wide() ? H - 12
                       : boxOf(0).y - 14;
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      ctx.fillStyle = 'rgba(16,20,28,' + clamp(saysT, 0, 1) * 0.85 + ')';
      ctx.fillRect((W - panelW()) / 2 - wid / 2 - 12, y - size, wid + 24, size + 12);
      ctx.fillStyle = 'rgba(230,236,245,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, (W - panelW()) / 2, y);
    }
  }


// -------------------------------------------------------------------
//  BUILDING
// -------------------------------------------------------------------

  function removeLock(colour) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const k = grid[r][c];
        if ((k === DOOR || k === KEY) && tint[r][c] === colour) grid[r][c] = EMPTY;
      }
    }
  }

  function priceOf(kind) {
    for (let i = 0; i < TOOLS.length; i++) if (TOOLS[i].kind === kind) return TOOLS[i].price;
    return 0;
  }

  function place(c, r) {
    if (state !== 'build') return;
    if (!inside(c, r)) return;
    if (STARTS.some(function (s) { return s.c === c && s.r === r; })) { say('that is where they come in'); return; }
    if (c === FLAG.c && r === FLAG.r)   { say('that is the flag'); return; }
    if (grid[r][c] === PLAT) { say('that ledge is bolted down'); return; }

    // ---- PUTTING DOWN THE KEY YOU ARE HOLDING --------------------------
    if (holdingKey >= 0) {
      if (grid[r][c] !== EMPTY) { say('the key needs an empty square'); return; }
      const colour = holdingKey;
      grid[r][c] = KEY; tint[r][c] = colour;
      think();
      // TWO things have to be true. They must still be able to reach the
      // flag - AND they must be able to get this key. A key they can
      // never reach turns your door into a wall you paid extra for.
      if (!canGetThrough() || !canFetch(colour)) {
        grid[r][c] = EMPTY;
        removeLock(colour);
        coins += priceOf(DOOR);
        holdingKey = -1;
        think();
        reject(c, r, canGetThrough() ? 'they could never reach that key there'
                                     : 'the key can\'t block the only way up');
        return;
      }
      holdingKey = -1;
      say('now they have to go and get it first');
      return;
    }

    // ---- TAKING SOMETHING BACK ------------------------------------------
    if (grid[r][c] !== EMPTY) {
      const k = grid[r][c];
      if (k === DOOR || k === KEY) {
        removeLock(tint[r][c]);
        coins += priceOf(DOOR);
      } else {
        grid[r][c] = EMPTY;
        coins += priceOf(k);
      }
      think();
      return;
    }

    const t = TOOLS[tool];
    if (coins < t.price) {
      // Say exactly how short you are, and flash the coin counter so it's
      // obvious WHERE to look and WHAT the problem is.
      say(t.name + ' costs ' + t.price + ' - you have ' + coins);
      coinFlash = 1.0;
      return;
    }

    // Powered traps need spare power. If the supply is full, you have to
    // grow it (tap the ⚡ meter up top) before you can build another.
    if (isPowered(t.kind) && poweredUsed() >= powerMax) {
      reject(c, r, 'power supply full - tap the ⚡ up top to grow it');
      powerFlash = 1.0;
      return;
    }

    if (t.kind === DOOR) {
      const colour = nextLock();
      if (colour < 0) { say('three doors is all you get'); return; }
      grid[r][c] = DOOR; tint[r][c] = colour;
      coins -= t.price;
      holdingKey = colour;
      think();
      say('now hide the ' + LOCKS[colour].name + ' key');
      const h1 = document.getElementById('hud');
      if (h1) h1.style.opacity = 0;
      return;
    }

    grid[r][c] = t.kind;
    think();

    // THEY MUST BE ABLE TO REACH THE FLAG, and still reach every key you
    // have hidden. Refused the moment you try, with the block put
    // straight back - so you find out by tapping, not by building a
    // masterpiece and being told at the end.
    if (!canGetThrough() || !allKeysFetchable()) {
      grid[r][c] = EMPTY;
      think();
      reject(c, r, canGetThrough() ? 'that would trap a key they need'
                                   : 'that blocks the only way up');
      return;
    }

    coins -= t.price;
    const h2 = document.getElementById('hud');
    if (h2) h2.style.opacity = 0;
  }

  function tap(mx, my) {
    // While you are holding a key, the only thing a tap can do is put it
    // down. No half-finished doors.
    if (holdingKey < 0) {
      // The power meter up top is a button: tap it to grow the supply.
      if (state === 'build') {
        const pb = powerBox();
        if (mx >= pb.x && mx <= pb.x + pb.w && my >= pb.y && my <= pb.y + pb.h) {
          upgradePower();
          return;
        }
      }
      for (let i = 0; i < TOOLS.length; i++) {
        const b = toolBox(i);
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          tool = i;
          say(TOOLS[i].blurb);            // tapping a tool tells you what it does
          return;
        }
      }
      const g = goBox();
      if (mx >= g.x && mx <= g.x + g.w && my >= g.y && my <= g.y + g.h) {
        if (state === 'build') go();
        // In 'done', the summary card is the way on. Tapping the button
        // just brings it back if you'd closed it for a look at the tower.
        else if (state === 'done') showWaveComplete();
        return;
      }
    }
    const cell = cellAt(mx, my);
    if (cell) place(cell.c, cell.r);
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    // The blades keep spinning while you build, so you can watch their
    // rhythm before you decide where the next one goes.
    if (state !== 'run') clock += dt;

    update(dt);

    ctx.fillStyle = '#10141c';
    ctx.fillRect(0, 0, W, H);

    drawTower();
    drawWave();
    drawHud();

    requestAnimationFrame(frame);
  }

  newTower();
  requestAnimationFrame(frame);


// -------------------------------------------------------------------
//  THE NAV BUTTONS  (the Arcade link is just an <a>; Reset asks first)
// -------------------------------------------------------------------

  const resetModal = document.getElementById('resetModal');
  function showReset() { resetModal.style.display = 'flex'; }
  function hideReset() { resetModal.style.display = 'none'; }

  document.getElementById('reset').addEventListener('click', showReset);
  document.getElementById('resetCancel').addEventListener('click', hideReset);
  document.getElementById('resetYes').addEventListener('click', function () {
    hideReset();
    resetGame();
  });
  // Tapping the dark area around the card, or pressing Escape, both mean
  // "no, never mind" - the same as Keep going.
  resetModal.addEventListener('click', function (e) {
    if (e.target === resetModal) hideReset();
  });

  // ---- the wave-complete card ----
  // "Send the next wave" advances; "let me look" closes it so you can study
  // the tower (the on-canvas NEXT WAVE button brings it back).
  document.getElementById('waveGo').addEventListener('click', function () {
    hideWaveComplete();
    if (lastPerfect) nextLevel();   // clean sweep -> a fresh map
    else             nextWave();    // otherwise -> another wave, same map
  });
  document.getElementById('wavePeek').addEventListener('click', hideWaveComplete);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideReset(); hideWaveComplete(); }
  });

</script>
</body>
</html>
