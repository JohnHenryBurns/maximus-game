    if (!inside(c, r)) return;
    if (STARTS.some(function (s) { return s.c === c && s.r === r; })) { say('that is where they come in'); return; }
    if (c === FLAG.c && r === FLAG.r)   { say('that is the exit'); return; }
    if (grid[r][c] === PLAT) { say('that ledge is bolted down'); return; }

    // ---- PUTTING DOWN THE KEY YOU ARE HOLDING --------------------------
    if (holdingKey >= 0) {
      // CHANGED YOUR MIND? Tap the door you just placed a second time and
      // the whole door-and-key pair is cancelled, with your coins returned.
      if (grid[r][c] === DOOR && tint[r][c] === holdingKey) {
        removeLock(holdingKey);
        coins += priceOf(DOOR);
        holdingKey = -1;
        think();
        say('door taken back - coins returned');
        return;
      }
      if (grid[r][c] !== EMPTY) { say('the key needs an empty square'); return; }
      const colour = holdingKey;
      grid[r][c] = KEY; tint[r][c] = colour;
      holdingKey = -1;
      think();
      // As with walls, you can hide the key somewhere they can't reach yet -
      // maybe you'll open a way to it next. If that leaves no route to the
      // exit, the SEND THEM button just shows NO WAY UP until you fix it.
      if (canGetThrough()) say('now they have to go and get it first');
      else                 say('key hidden - but there\'s no way up right now');
      return;
    }

    // ---- TAKING SOMETHING BACK ------------------------------------------
    if (grid[r][c] !== EMPTY) {
      const k = grid[r][c];
      if (k === DOOR || k === KEY) {
        removeLock(tint[r][c]);
        coins += priceOf(DOOR);
      } else {
        grid[r][c] = EMPTY;
        coins += priceOf(k);
      }
      think();
      return;
    }

    // Nothing picked up (you tapped a tool a second time to put it down),
    // so a tap on the board shouldn't build anything by accident.
    if (tool < 0) { say('pick a tool first, then tap the tower'); return; }

    const t = TOOLS[tool];
    if (coins < t.price) {
      // Say exactly how short you are, and flash the coin counter so it's
      // obvious WHERE to look and WHAT the problem is.
      say(t.name + ' costs ' + t.price + ' - you have ' + coins);
      coinFlash = 1.0;
      return;
    }

    // Powered traps need spare power. If the supply is full, you have to
    // grow it (tap the ⚡ meter up top) before you can build another.
    if (isPowered(t.kind) && poweredUsed() >= powerMax) {
      reject(c, r, 'power supply full - tap the ⚡ up top to grow it');
      powerFlash = 1.0;
      return;
    }

    if (t.kind === DOOR) {
      const colour = nextLock();
      if (colour < 0) { say('three doors is all you get'); return; }
      grid[r][c] = DOOR; tint[r][c] = colour;
      coins -= t.price;
      holdingKey = colour;
      think();
      say('now hide the ' + LOCKS[colour].name + ' key - or tap the door to undo');
      const h1 = document.getElementById('hud');
      if (h1) h1.style.opacity = 0;
      return;
    }

    grid[r][c] = t.kind;
    coins -= t.price;
    think();

    // You're ALLOWED to block the only way up while you build. It's a plan
    // in progress: you might be about to open a new route with the next few
    // walls. The SEND THEM button turns into NO WAY UP whenever there's no
    // path, so you simply can't launch a wave that has nowhere to go - but
    // nothing stops you laying the walls that only make sense together.
    if (!canGetThrough()) say('no way up right now - open a route before you send them');

    const h2 = document.getElementById('hud');
    if (h2) h2.style.opacity = 0;
  }

  function tap(mx, my) {
    // While you are holding a key, the only thing a tap can do is put it
    // down. No half-finished doors.
    if (holdingKey < 0) {
      // The power meter up top is a button: tap it to grow the supply.
      if (state === 'build') {
        const pb = powerBox();
        if (mx >= pb.x && mx <= pb.x + pb.w && my >= pb.y && my <= pb.y + pb.h) {
          upgradePower();
          return;
        }
      }
      for (let i = 0; i < TOOLS.length; i++) {
        const b = toolBox(i);
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          // Tap a tool to pick it up; tap the SAME tool again to put it
          // back down, so nothing is selected and a stray tap won't build.
          if (tool === i) { tool = -1; say('put the ' + TOOLS[i].name + ' away'); }
          else            { tool = i;  say(TOOLS[i].blurb); }
          return;
        }
      }
      const g = goBox();
      if (mx >= g.x && mx <= g.x + g.w && my >= g.y && my <= g.y + g.h) {
        if (state === 'build') go();
        // While they're climbing, the button is RESET - call the robots
        // back so you can change the tower and try the wave again.
        else if (state === 'run') resetRobots();
        // In 'done', the summary card is the way on. Tapping the button
        // just brings it back if you'd closed it for a look at the tower.
        else if (state === 'done') showWaveComplete();
        return;
      }
    }
    const cell = cellAt(mx, my);
    if (cell) place(cell.c, cell.r);
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    // The blades keep spinning while you build, so you can watch their
    // rhythm before you decide where the next one goes.
    if (state !== 'run') clock += dt;

    update(dt);

    ctx.fillStyle = '#10141c';
    ctx.fillRect(0, 0, W, H);

    drawTower();
    drawWave();
    drawHud();

    requestAnimationFrame(frame);
  }

  newTower();
  requestAnimationFrame(frame);


// -------------------------------------------------------------------
//  THE NAV BUTTONS  (the Arcade link is just an <a>; Reset asks first)
// -------------------------------------------------------------------

  // The RESET menu: one button up top opens it, and it offers the two ways
  // to start again - clear just this level, or start a whole new game - plus
  // a way to back out.
  const resetModal = document.getElementById('resetModal');
  function showResetMenu() { resetModal.style.display = 'flex'; }
  function hideResetMenu() { resetModal.style.display = 'none'; }

  document.getElementById('reset').addEventListener('click', showResetMenu);
  document.getElementById('optClear').addEventListener('click', function () {
    hideResetMenu(); resetMap();      // wipe this level's build, keep progress
  });
  document.getElementById('optNew').addEventListener('click', function () {
    hideResetMenu(); resetGame();     // a brand-new game from Level 1
  });
  document.getElementById('optCancel').addEventListener('click', hideResetMenu);
  // Tapping the dark area around the card, or pressing Escape, both mean
  // "never mind" - the same as Cancel.
  resetModal.addEventListener('click', function (e) {
    if (e.target === resetModal) hideResetMenu();
  });

  // ---- the wave-complete card ----
  // "Send the next wave" advances; "let me look" closes it so you can study
  // the tower (the on-canvas NEXT WAVE button brings it back).
  document.getElementById('waveGo').addEventListener('click', function () {
    hideWaveComplete();
    if (lastPerfect) nextLevel();   // clean sweep -> a fresh map
    else             nextWave();    // otherwise -> another wave, same map
  });
  document.getElementById('wavePeek').addEventListener('click', hideWaveComplete);

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { hideResetMenu(); hideWaveComplete(); }
  });

</script>
</body>
</html>
