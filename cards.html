<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MONSTER DUEL</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monster Duel">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #151020; color: #f0e9ff;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
</style>
</head>
<body>

<canvas id="screen"></canvas>

<script>
// ===================================================================
//  MONSTER DUEL
//
//  You and an opponent take turns putting monsters down. Then they
//  fight. Knock the other one's hearts to zero.
//
//  There is ONE rule that everything else hangs off:
//
//      A MONSTER ATTACKS THE MONSTER DIRECTLY OPPOSITE IT.
//      If that space is empty, it hits the PLAYER instead.
//
//  That is why WHERE you put a card matters as much as WHICH card you
//  put down. Line your big hitter up against their empty space and it
//  goes straight for their hearts.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  THE MONSTERS
//
//  hit  = how much damage it does when it attacks
//  life = how much damage it can take before it is scrap
// -------------------------------------------------------------------

  const CARDS = [
    { name: 'FART OGRE',   hit: 4, life: 3, col: [110, 170,  80] },
    { name: 'BOOGER BAT',  hit: 2, life: 5, col: [140, 190,  90] },
    { name: 'SNOT SLUG',   hit: 3, life: 2, col: [ 90, 200, 150] },
    { name: 'ROBO DOG',    hit: 5, life: 1, col: [140, 160, 200] },
    { name: 'BURP TOAD',   hit: 2, life: 4, col: [ 90, 180, 120] },
    { name: 'PANTS DRAGON',hit: 6, life: 2, col: [220, 110,  90] },
    { name: 'EARWAX OWL',  hit: 3, life: 3, col: [210, 170,  90] },
    { name: 'SOCK GOLEM',  hit: 1, life: 7, col: [160, 140, 180] },
    { name: 'TOENAIL TROLL',hit:4, life: 4, col: [180, 150, 110] },
    { name: 'BELCH BEAST', hit: 5, life: 3, col: [200, 120, 160] },
    { name: 'NOSE GOBLIN', hit: 3, life: 1, col: [130, 200, 190] },
    { name: 'BUM BADGER',  hit: 2, life: 6, col: [170, 170, 200] }
  ];

  const SLOTS = 3;            // three spaces each, facing each other
  const START_HEARTS = 20;
  const HAND_MAX = 5;

  let you   = { hearts: START_HEARTS, board: [null, null, null], hand: [] };
  let them  = { hearts: START_HEARTS, board: [null, null, null], hand: [] };

  let picked = -1;            // which card in your hand you have tapped
  let turn = 'you';           // 'you', 'them', 'over'
  let says = '', saysT = 0;
  function say(w) { says = w; saysT = 2.6; }

  // Little bursts when something dies, and floating damage numbers.
  let bits = [], floats = [];

  function newMonster(i) {
    const c = CARDS[i];
    return { i: i, name: c.name, hit: c.hit, life: c.life, max: c.life,
             col: c.col, wobble: 0, justHit: 0 };
  }
  function dealCard() { return newMonster(Math.floor(Math.random() * CARDS.length)); }

  function reset() {
    you  = { hearts: START_HEARTS, board: [null, null, null], hand: [] };
    them = { hearts: START_HEARTS, board: [null, null, null], hand: [] };
    for (let i = 0; i < 4; i++) { you.hand.push(dealCard()); them.hand.push(dealCard()); }
    picked = -1; turn = 'you'; bits = []; floats = [];
    say('tap a monster, then tap a space');
  }


// -------------------------------------------------------------------
//  FIGHTING
// -------------------------------------------------------------------

  function hurt(who, amount, x, y) {
    who.hearts -= amount;
    floats.push({ x: x, y: y, text: '-' + amount, life: 1.1, col: [255, 120, 120] });
  }

  function smash(x, y, col) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 5;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                  life: 0.7 + Math.random() * 0.4, size: 3 + Math.random() * 4, col: col });
    }
  }

  // Everything on ONE side attacks. Each monster looks straight ahead:
  // if somebody is there, it hits them; if not, it hits the player.
  function attackWith(side, foe, mine) {
    for (let s = 0; s < SLOTS; s++) {
      const m = side.board[s];
      if (!m) continue;
      m.wobble = 0.35;

      const target = foe.board[s];
      const p = slotSpot(!mine, s);

      if (target) {
        target.life -= m.hit;
        target.justHit = 0.4;
        floats.push({ x: p.x + p.w / 2, y: p.y + p.h / 2, text: '-' + m.hit,
                      life: 1.0, col: [255, 200, 120] });
        if (target.life <= 0) {
          smash(p.x + p.w / 2, p.y + p.h / 2, target.col);
          foe.board[s] = null;
        }
      } else {
        hurt(foe, m.hit, p.x + p.w / 2, p.y + p.h / 2);
      }
    }
  }

  function checkOver() {
    if (you.hearts <= 0 || them.hearts <= 0) {
      turn = 'over';
      say(them.hearts <= 0 && you.hearts <= 0 ? 'BOTH OF YOU. wow.'
        : them.hearts <= 0 ? 'YOU WIN!' : 'you lost - tap to go again');
      return true;
    }
    return false;
  }

  function drawUpTo(side) {
    while (side.hand.length < HAND_MAX) side.hand.push(dealCard());
  }


// -------------------------------------------------------------------
//  THE OPPONENT'S BRAIN
//
//  It is not pretending either. It looks at EVERY card it could play
//  in EVERY empty space, works out what the board would be worth
//  afterwards, and plays the best one. If it goes for your throat it
//  is because that really was the best move it could find.
// -------------------------------------------------------------------

  function scoreMove(cardIdx, slot) {
    const card = them.hand[cardIdx];
    let score = 0;

    const facing = you.board[slot];

    if (!facing) {
      // Nobody in the way - this thing hits YOU in the hearts. Worth a
      // lot, and worth more if it finishes the job.
      score += card.hit * 3;
      if (card.hit >= you.hearts) score += 100;
    } else {
      // Somebody is there. Killing it outright is much better than
      // scratching it - and a dead monster cannot hit back, which is
      // worth saying out loud because the first version of this docked
      // points for "might die to the answer" even when there was going
      // to BE no answer.
      if (card.hit >= facing.life) {
        score += 8 + facing.hit * 2;
      } else {
        score += card.hit;
        // It survives, so it gets its go. Will mine still be standing?
        if (facing.hit >= card.life) score -= 4;
        else score += 3;
      }
    }

    // A big tough monster is worth having on the table at all.
    score += card.life * 0.5;
    return score;
  }

  function theirTurn() {
    drawUpTo(them);

    // Every card, every empty space. Pick the best. No guessing.
    let bestScore = -Infinity, bestCard = -1, bestSlot = -1;
    for (let c = 0; c < them.hand.length; c++) {
      for (let s = 0; s < SLOTS; s++) {
        if (them.board[s]) continue;
        const sc = scoreMove(c, s);
        if (sc > bestScore) { bestScore = sc; bestCard = c; bestSlot = s; }
      }
    }

    if (bestCard >= 0) {
      them.board[bestSlot] = them.hand[bestCard];
      them.hand.splice(bestCard, 1);
    }

    attackWith(them, you, false);
    if (checkOver()) return;

    turn = 'you';
    drawUpTo(you);
  }


// -------------------------------------------------------------------
//  WHERE EVERYTHING IS
//
//  All the positions come out of these few functions, so the drawing
//  and your finger can never disagree about where a card is.
// -------------------------------------------------------------------

  function cardW() { return Math.min((W - 50) / SLOTS, 150); }
  function cardH() { return cardW() * 1.35; }

  function slotSpot(mine, s) {
    const w = cardW(), h = cardH();
    const gap = 10;
    const totalW = SLOTS * w + (SLOTS - 1) * gap;
    const x = (W - totalW) / 2 + s * (w + gap);
    const midY = H * 0.46;
    const y = mine ? midY + 18 : midY - h - 18;
    return { x: x, y: y, w: w, h: h };
  }

  function handSpot(i, n) {
    const w = Math.min(cardW() * 0.82, (W - 30) / Math.max(1, n) - 6);
    const h = w * 1.35;
    const gap = 6;
    const totalW = n * w + (n - 1) * gap;
    const x = (W - totalW) / 2 + i * (w + gap);
    return { x: x, y: H - h - 54, w: w, h: h };
  }

  // Their hand, face down along the top. You cannot see WHAT they hold,
  // but you can see HOW MUCH - which is most of what you need to know.
  function theirHandSpot(i, n) {
    const w = Math.min(cardW() * 0.5, (W - 30) / Math.max(1, n) - 6);
    const h = w * 1.35;
    const gap = 6;
    const total = n * w + (n - 1) * gap;
    return { x: (W - total) / 2 + i * (w + gap), y: 46, w: w, h: h };
  }

  function endBox() {
    const w = Math.min(W * 0.4, 190);
    return { x: (W - w) / 2, y: H - 46, w: w, h: 38 };
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Every monster gets a face built from its own number, so all twelve
  // look different without anybody having to draw twelve pictures.
  function monsterFace(x, y, w, h, m) {
    const cx = x + w / 2, cy = y + h * 0.46;
    const eyes = 2 + (m.i % 2);
    const r = w * 0.075;
    ctx.fillStyle = '#1b1428';
    for (let e = 0; e < eyes; e++) {
      const ex = cx + (e - (eyes - 1) / 2) * w * 0.22;
      ctx.beginPath();
      ctx.arc(ex, cy - h * 0.05, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#fff';
    for (let e = 0; e < eyes; e++) {
      const ex = cx + (e - (eyes - 1) / 2) * w * 0.22;
      ctx.beginPath();
      ctx.arc(ex - r * 0.3, cy - h * 0.05 - r * 0.3, r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
    // A mouth whose shape comes from the card number too.
    ctx.strokeStyle = '#1b1428';
    ctx.lineWidth = Math.max(2, w * 0.035);
    ctx.beginPath();
    const my = cy + h * 0.12;
    if (m.i % 3 === 0) {            // grin
      ctx.arc(cx, my - w * 0.06, w * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
    } else if (m.i % 3 === 1) {     // straight line
      ctx.moveTo(cx - w * 0.16, my); ctx.lineTo(cx + w * 0.16, my);
    } else {                        // toothy zigzag
      ctx.moveTo(cx - w * 0.18, my);
      for (let t = 0; t < 4; t++) {
        ctx.lineTo(cx - w * 0.18 + (t + 0.5) * w * 0.09, my + (t % 2 ? -1 : 1) * w * 0.05);
      }
      ctx.lineTo(cx + w * 0.18, my);
    }
    ctx.stroke();
  }

  function drawCard(x, y, w, h, m, opts) {
    opts = opts || {};
    ctx.save();
    if (m.wobble > 0) {
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(Math.sin(m.wobble * 40) * 0.06);
      ctx.translate(-(x + w / 2), -(y + h / 2));
    }

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x + 3, y + 4, w, h, w * 0.09); ctx.fill();

    ctx.fillStyle = rgb(m.col);
    roundRect(x, y, w, h, w * 0.09); ctx.fill();

    if (m.justHit > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(m.justHit, 0, 1) * 0.6 + ')';
      roundRect(x, y, w, h, w * 0.09); ctx.fill();
    }

    ctx.lineWidth = opts.picked ? 4 : 2;
    ctx.strokeStyle = opts.picked ? '#ffd76a' : 'rgba(0,0,0,0.35)';
    roundRect(x, y, w, h, w * 0.09); ctx.stroke();

    monsterFace(x, y, w, h, m);

    // Name across the top, shrunk to fit rather than spilling off.
    ctx.textAlign = 'center';
    let fs = w * 0.135;
    ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    const room = w - 8;
    const natural = ctx.measureText(m.name).width;
    if (natural > room) {
      fs *= room / natural;
      ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    }
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillText(m.name, x + w / 2, y + h * 0.145);

    // The two numbers that decide everything.
    const nf = w * 0.24;
    ctx.font = 'bold ' + nf + 'px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#2a1a10';
    ctx.fillText(m.hit, x + w * 0.10, y + h * 0.93);
    ctx.textAlign = 'right';
    ctx.fillStyle = m.life < m.max ? '#7a1520' : '#2a1a10';
    ctx.fillText(m.life, x + w * 0.90, y + h * 0.93);

    ctx.restore();
  }

  function drawEmptySlot(x, y, w, h, glow) {
    ctx.setLineDash([7, 6]);
    ctx.lineWidth = glow ? 3 : 2;
    ctx.strokeStyle = glow ? 'rgba(255,215,106,0.9)' : 'rgba(255,255,255,0.16)';
    roundRect(x, y, w, h, w * 0.09); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawHearts(n, x, y, size, col) {
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
    ctx.fillStyle = col;
    ctx.fillText('♥ ' + Math.max(0, n), x, y);
  }

  function draw() {
    ctx.fillStyle = '#151020';
    ctx.fillRect(0, 0, W, H);

    // The line where the two sides meet.
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(20, H * 0.46); ctx.lineTo(W - 20, H * 0.46);
    ctx.stroke();

    drawHearts(them.hearts, 18, 34, Math.min(W * 0.055, 30), '#ff9ba6');

    for (let i = 0; i < them.hand.length; i++) {
      const p = theirHandSpot(i, them.hand.length);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      roundRect(p.x + 2, p.y + 3, p.w, p.h, p.w * 0.09); ctx.fill();
      ctx.fillStyle = '#2e2444';
      roundRect(p.x, p.y, p.w, p.h, p.w * 0.09); ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#463769';
      roundRect(p.x, p.y, p.w, p.h, p.w * 0.09); ctx.stroke();
      // A pair of eyes peering out of the back, because a blank
      // rectangle is boring and these are monsters.
      ctx.fillStyle = '#5b4a86';
      for (let e = 0; e < 2; e++) {
        ctx.beginPath();
        ctx.arc(p.x + p.w * (0.36 + e * 0.28), p.y + p.h * 0.45, p.w * 0.075, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let s = 0; s < SLOTS; s++) {
      const p = slotSpot(false, s);
      if (them.board[s]) drawCard(p.x, p.y, p.w, p.h, them.board[s]);
      else drawEmptySlot(p.x, p.y, p.w, p.h, false);
    }
    for (let s = 0; s < SLOTS; s++) {
      const p = slotSpot(true, s);
      if (you.board[s]) drawCard(p.x, p.y, p.w, p.h, you.board[s]);
      else drawEmptySlot(p.x, p.y, p.w, p.h, picked >= 0 && turn === 'you');
    }

    // Your hearts, just above your hand.
    drawHearts(you.hearts, 18, H - cardH() * 0.82 - 74, Math.min(W * 0.055, 30), '#9bffb0');

    for (let i = 0; i < you.hand.length; i++) {
      const p = handSpot(i, you.hand.length);
      const lift = picked === i ? -12 : 0;
      drawCard(p.x, p.y + lift, p.w, p.h, you.hand[i], { picked: picked === i });
    }

    const e = endBox();
    const canEnd = turn === 'you';
    ctx.fillStyle = canEnd ? 'rgba(255,215,106,0.16)' : 'rgba(0,0,0,0.3)';
    roundRect(e.x, e.y, e.w, e.h, 10); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = canEnd ? '#ffd76a' : 'rgba(255,255,255,0.18)';
    roundRect(e.x, e.y, e.w, e.h, 10); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.036, 18) + 'px system-ui, sans-serif';
    ctx.fillStyle = canEnd ? '#ffd76a' : '#6b6288';
    ctx.fillText(turn === 'over' ? 'TAP FOR A NEW GAME' : 'FIGHT!',
                 e.x + e.w / 2, e.y + e.h * 0.68);

    for (let i = 0; i < bits.length; i++) {
      const b = bits[i];
      ctx.fillStyle = 'rgba(' + (b.col[0]|0) + ',' + (b.col[1]|0) + ',' + (b.col[2]|0) +
                      ',' + clamp(b.life * 1.4, 0, 1) + ')';
      ctx.fillRect(b.x, b.y, b.size, b.size);
    }
    for (let i = 0; i < floats.length; i++) {
      const f = floats[i];
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.05, 26) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(' + f.col[0] + ',' + f.col[1] + ',' + f.col[2] + ',' +
                      clamp(f.life, 0, 1) + ')';
      ctx.fillText(f.text, f.x, f.y);
    }

    if (saysT > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.04, 21) + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      // Dead centre of the gap between the two rows. Sitting it on the
      // line itself put the box over the bottom of their cards and hid
      // the numbers that matter.
      const y = H * 0.46 + 8;
      ctx.fillStyle = 'rgba(21,16,32,' + clamp(saysT, 0, 1) * 0.9 + ')';
      ctx.fillRect(W / 2 - wid / 2 - 14, y - 24, wid + 28, 32);
      ctx.fillStyle = 'rgba(240,233,255,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, y);
    }
  }


// -------------------------------------------------------------------
//  YOUR GO
// -------------------------------------------------------------------

  function inBox(mx, my, b) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  }

  function tap(mx, my) {
    if (turn === 'over') { reset(); return; }
    if (turn !== 'you') return;

    // Tap a card in your hand to pick it up, tap it again to put it back.
    for (let i = 0; i < you.hand.length; i++) {
      if (inBox(mx, my, handSpot(i, you.hand.length))) {
        picked = (picked === i) ? -1 : i;
        return;
      }
    }

    // Tap one of your spaces to put the picked card there.
    for (let s = 0; s < SLOTS; s++) {
      if (!inBox(mx, my, slotSpot(true, s))) continue;
      if (picked < 0) { say('pick a monster first'); return; }
      if (you.board[s]) { say('something is already standing there'); return; }
      you.board[s] = you.hand[picked];
      you.hand.splice(picked, 1);
      picked = -1;
      say('now tap FIGHT');
      return;
    }

    if (inBox(mx, my, endBox())) {
      picked = -1;
      attackWith(you, them, true);
      if (checkOver()) return;
      turn = 'them';
      say('their go...');
      setTimeout(function () {
        if (turn === 'them') { theirTurn(); }
      }, 700);
    }
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    if (saysT > 0) saysT -= dt;

    for (const side of [you, them]) {
      for (const m of side.board) {
        if (!m) continue;
        if (m.wobble > 0) m.wobble -= dt;
        if (m.justHit > 0) m.justHit -= dt * 2.5;
      }
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt * 40; b.y += b.vy * dt * 40; b.vy += dt * 40;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y -= dt * 34;
    }

    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

</script>
</body>
</html>
