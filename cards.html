<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MONSTER DUEL</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#151020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monster Duel">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #151020; color: #f0e9ff;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
</style>
</head>
<body>

<canvas id="screen"></canvas>

<script>
// ===================================================================
//  MONSTER DUEL
//
//  You can only fight with monsters you actually OWN. New ones come
//  from a card pack, and there is one pack a day.
//
//  The duel itself hangs off ONE rule:
//
//      A MONSTER ATTACKS THE MONSTER DIRECTLY OPPOSITE IT.
//      If that space is empty, it hits the PLAYER instead.
//
//  Your collection lives in this browser, on this device. Nothing is
//  sent anywhere. Clear your browser data and it goes with it.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  THE MONSTERS
//
//  hit  = damage it deals      life = damage it survives
//  find = how often it turns up in a pack. A big number means common,
//         a small number means you will be very pleased to see it.
// -------------------------------------------------------------------

  const CARDS = [
    { name: 'SNOT SLUG',    hit: 3, life: 2, find: 10, col: [ 90, 200, 150] },
    { name: 'NOSE GOBLIN',  hit: 3, life: 1, find: 10, col: [130, 200, 190] },
    { name: 'BURP TOAD',    hit: 2, life: 4, find: 10, col: [ 90, 180, 120] },
    { name: 'BOOGER BAT',   hit: 2, life: 5, find:  9, col: [140, 190,  90] },
    { name: 'BUM BADGER',   hit: 2, life: 6, find:  8, col: [170, 170, 200] },
    { name: 'FART OGRE',    hit: 4, life: 3, find:  5, col: [110, 170,  80] },
    { name: 'EARWAX OWL',   hit: 3, life: 3, find:  5, col: [210, 170,  90] },
    { name: 'ROBO DOG',     hit: 5, life: 1, find:  4, col: [140, 160, 200] },
    { name: 'SOCK GOLEM',   hit: 1, life: 7, find:  4, col: [160, 140, 180] },
    { name: 'TOENAIL TROLL',hit: 4, life: 4, find:  2, col: [180, 150, 110] },
    { name: 'BELCH BEAST',  hit: 5, life: 3, find:  2, col: [200, 120, 160] },
    { name: 'PANTS DRAGON', hit: 6, life: 2, find:  1, col: [220, 110,  90] }
  ];

  // ---- HOW A CARD IS FINISHED ---------------------------------------
  //
  // Every monster can turn up plain, GOLD or DIAMOND - and a shiny one
  // is genuinely BETTER, not just prettier. Gold adds 1 to both its
  // numbers, diamond adds 2. A gold PANTS DRAGON is 7/3 where the plain
  // one is 6/2.
  //
  // This started out purely for show, on the grounds that a pack should
  // not buy you power. But the opponent draws from the same mix of
  // monsters you own, so a bigger collection had stopped making you any
  // stronger at all - it only made you prettier. The bonus is where
  // collecting pays now. Their cards are always plain, so every shiny
  // one you own is an edge you earned.
  const PLAIN = 0, GOLD = 1, DIAMOND = 2;
  const FINISHES = [
    { name: 'plain',   shine: null,      col: null,             bonus: 0 },
    { name: 'GOLD',    shine: 'gold',    col: [255, 214,  92],  bonus: 1 },
    { name: 'DIAMOND', shine: 'diamond', col: [190, 238, 255],  bonus: 2 }
  ];

  // How rare something is, worked out FROM the find numbers rather than
  // typed in twice - so changing a find number can never leave a wrong
  // label behind.
  function rarityOf(i) {
    const f = CARDS[i].find;
    return f >= 8 ? { name: 'common',   stars: 1, col: [150, 145, 175] }
         : f >= 4 ? { name: 'uncommon', stars: 2, col: [120, 200, 255] }
                  : { name: 'RARE',     stars: 3, col: [255, 200,  90] };
  }

  const SLOTS = 3;

  // ---- THE KINGS ----------------------------------------------------
  //
  // Your hearts used to be a number in the corner. Now they are a
  // monster standing behind your line, and the rule is the one it
  // always was, just visible: a monster with nobody opposite walks past
  // and hits the KING. Put something in that space and the monster
  // takes it instead. Twenty damage and the king goes down.
  const KING_LIFE = 20;
  const KINGS = [
    { name: 'KING MAXIMUS',    col: [120, 150, 230] },   // yours
    { name: 'KING ROTTENTOOTH',col: [180,  90, 120] }    // theirs
  ];
  const START_HEARTS = KING_LIFE;
  const HAND_MAX = 5;
  const PACK_SIZE = 5;
  const DAY = 24 * 60 * 60 * 1000;      // how long a day is, in milliseconds


// -------------------------------------------------------------------
//  YOUR COLLECTION - THE BIT THAT SURVIVES CLOSING THE PAGE
// -------------------------------------------------------------------

  const SAVE_KEY = 'maxMonsterDuel';

  let own = [];              // own[finish][i] = how many you have
  let lastPack = 0;          // when you last opened the daily one
  let wins = 0, losses = 0;
  let goldPacks = 0;         // gold packs waiting to be opened
  let winStreak = 0;         // wins counted towards the next one

  // Win three duels and a gold pack is yours. Deliberately NOT another
  // timer - one thing you have to wait a day for is enough, and this
  // way there is always something you can go and earn right now.
  const WINS_PER_GOLD = 3;

  // What a gold pack is made of. Mostly gold, with the odd diamond.
  const DIAMOND_CHANCE = 0.14;

  // Eight monsters to start with, so the game is playable the second you
  // open it. The daily pack makes your collection BETTER - it is not the
  // only way to have one. Waiting a day to play at all would be rubbish.
  const STARTER = [0, 0, 1, 2, 3, 3, 5, 7];

  function blankCollection() {
    own = [];
    for (let f = 0; f < FINISHES.length; f++) {
      const row = [];
      for (let i = 0; i < CARDS.length; i++) row.push(0);
      own.push(row);
    }
  }
  function countOf(i) {
    let n = 0;
    for (let f = 0; f < FINISHES.length; f++) n += own[f][i];
    return n;
  }
  // The best finish you have of this monster, for showing it off.
  function bestFinish(i) {
    for (let f = FINISHES.length - 1; f >= 0; f--) if (own[f][i] > 0) return f;
    return -1;
  }

  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 2, own: own, lastPack: lastPack, wins: wins, losses: losses,
        goldPacks: goldPacks, winStreak: winStreak
      }));
    } catch (e) { /* private browsing, or storage full. Play on anyway. */ }
  }

  function load() {
    blankCollection();
    let data = null;
    try { data = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { data = null; }

    if (!data || !data.own) {
      for (const i of STARTER) own[PLAIN][i]++;
      lastPack = 0;                       // a pack is waiting for you now
      save();
      return 'new';
    }
    // An older save kept a flat list, from before gold cards existed.
    // Those cards are all plain ones - never throw somebody's
    // collection away because the shape of the file changed.
    if (typeof data.own[0] === 'number') {
      for (let i = 0; i < CARDS.length; i++) own[PLAIN][i] = data.own[i] | 0;
    } else {
      for (let f = 0; f < FINISHES.length; f++) {
        for (let i = 0; i < CARDS.length; i++) {
          own[f][i] = (data.own[f] && data.own[f][i]) | 0;
        }
      }
    }
    lastPack = data.lastPack || 0;
    wins = data.wins | 0; losses = data.losses | 0;
    goldPacks = data.goldPacks | 0; winStreak = data.winStreak | 0;

    // If the clock has been wound BACKWARDS the wait could become
    // hundreds of hours. Treat a pack opened "in the future" as opened
    // right now instead of arguing with it.
    if (lastPack > Date.now()) lastPack = Date.now();
    return 'old';
  }

  function totalOwned() {
    let n = 0;
    for (let i = 0; i < CARDS.length; i++) n += countOf(i);
    return n;
  }
  function kindsOwned() {
    let n = 0;
    for (let i = 0; i < CARDS.length; i++) if (countOf(i) > 0) n++;
    return n;
  }

  function msUntilPack() {
    return Math.max(0, lastPack + DAY - Date.now());
  }
  function packReady() { return msUntilPack() <= 0; }

  function countdownText() {
    const ms = msUntilPack();
    const hours = Math.floor(ms / 3600000);
    const mins = Math.floor((ms % 3600000) / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    if (hours > 0) return hours + 'h ' + mins + 'm';
    if (mins > 0)  return mins + 'm ' + secs + 's';
    return secs + 's';
  }

  // Pick a card, with the rare ones genuinely rare. Add up all the find
  // numbers, roll once, and walk along until the roll runs out.
  function randomCardIndex() {
    let total = 0;
    for (let i = 0; i < CARDS.length; i++) total += CARDS[i].find;
    let roll = Math.random() * total;
    for (let i = 0; i < CARDS.length; i++) {
      roll -= CARDS[i].find;
      if (roll <= 0) return i;
    }
    return CARDS.length - 1;
  }

  let packCards = [];        // what you just pulled, for the reveal
  let packWasGold = false;
  let packTitle = 'YOU GOT';
  let revealT = 0;

  // ---- TRADING SPARES -------------------------------------------------
  //
  // Two of the same monster, in the same finish, become one new card in
  // THAT finish. Two gold ones give you a gold one; two plain ones do
  // not, or you could quietly launder ordinary cards into shiny ones and
  // the gold packs would stop meaning anything.
  const TRADE_COST = 2;

  let tradePick = null;      // { i, f } while you are deciding

  // Which pile we would take them from: your plain spares first, so a
  // gold card is never swallowed while you still have ordinary copies.
  function tradeableFinish(i) {
    for (const f of [PLAIN, GOLD, DIAMOND]) if (own[f][i] >= TRADE_COST) return f;
    return -1;
  }

  // What you get back. Something you have never seen if there is one -
  // that makes spares the way you finish a collection.
  // `gave` is the monster you handed over - never hand it straight back.
  // Worked out BEFORE the two copies are taken away, because taking them
  // first could empty that pile and make the card you just traded look
  // like one you had never found. It gave itself back 6 times in 60.
  function tradeReward(f, gave) {
    const missing = [];
    for (let i = 0; i < CARDS.length; i++) {
      if (i !== gave && countOf(i) === 0) missing.push(i);
    }
    if (missing.length) return missing[Math.floor(Math.random() * missing.length)];

    // Nothing left to discover, so anything you do not hold in THIS
    // finish, and failing that just a fresh roll.
    const notInFinish = [];
    for (let i = 0; i < CARDS.length; i++) {
      if (i !== gave && own[f][i] === 0) notInFinish.push(i);
    }
    if (notInFinish.length) return notInFinish[Math.floor(Math.random() * notInFinish.length)];

    let roll = randomCardIndex(), guard = 0;
    while (roll === gave && guard < 60) { roll = randomCardIndex(); guard++; }
    return roll;
  }

  function doTrade() {
    if (!tradePick) return false;
    const i = tradePick.i, f = tradePick.f;
    if (own[f][i] < TRADE_COST) { tradePick = null; return false; }

    const got = tradeReward(f, i);      // decided BEFORE the pair is spent
    own[f][i] -= TRADE_COST;
    own[f][got]++;
    save();

    tradePick = null;
    packCards = [{ i: got, f: f }];
    packWasGold = (f !== PLAIN);
    packTitle = 'TRADED FOR';
    revealT = 0;
    screen = 'pack';
    return true;
  }

  function openPack() {
    if (!packReady()) return false;
    packCards = [];
    for (let i = 0; i < PACK_SIZE; i++) {
      const idx = randomCardIndex();
      packCards.push({ i: idx, f: PLAIN });
      own[PLAIN][idx]++;
    }
    lastPack = Date.now();
    packWasGold = false;
    packTitle = 'YOU GOT';
    save();
    revealT = 0;
    screen = 'pack';
    return true;
  }

  // The same monsters, in gold. Nothing in here is stronger than what
  // the free pack gives you - it is just the shiny version.
  function openGoldPack() {
    if (goldPacks <= 0) return false;
    goldPacks--;
    packCards = [];
    for (let i = 0; i < PACK_SIZE; i++) {
      const idx = randomCardIndex();
      const f = Math.random() < DIAMOND_CHANCE ? DIAMOND : GOLD;
      packCards.push({ i: idx, f: f });
      own[f][idx]++;
    }
    packWasGold = true;
    packTitle = 'GOLD PACK!';
    save();
    revealT = 0;
    screen = 'pack';
    return true;
  }


// -------------------------------------------------------------------
//  A DUEL
// -------------------------------------------------------------------

  let you   = { hearts: START_HEARTS, board: [null, null, null], hand: [], deck: [] };
  let them  = { hearts: START_HEARTS, board: [null, null, null], hand: [], deck: [] };

  let picked = -1;
  let placedThisTurn = 0;
  let yourTurnNo = 1;             // your first go is the generous one
  let theirTurnNo = 0;            // counts up so every third is a big one
  let turn = 'you';

  // How many monsters you may send in this turn.
  function placeAllowance() {
    return yourTurnNo === 1 ? FIRST_TURN_PLACE : PLACE_PER_TURN;
  }
  let says = '', saysT = 0;
  function say(w) { says = w; saysT = 2.6; }

  let screen = 'collection';       // 'collection', 'pack', 'duel'
  let savedT = 0;                  // how long the SAVED tick stays up
  let shineT = 0;                  // ticks along forever, to sweep the shiny cards
  let youHurt = 0, themHurt = 0;   // a king flashes white when he is hit
  let bits = [], floats = [];

  function newMonster(i, f) {
    const c = CARDS[i];
    const fin = f || PLAIN;
    const plus = FINISHES[fin].bonus;      // gold +1, diamond +2
    return { i: i, f: fin, name: c.name,
             hit: c.hit + plus, life: c.life + plus, max: c.life + plus,
             col: c.col, wobble: 0, justHit: 0 };
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // YOUR deck is YOUR collection. Every card in it is one you own - so a
  // pack that gives you a PANTS DRAGON really does put a dragon in your
  // next fight.
  function yourDeck() {
    const d = [];
    for (let f = 0; f < FINISHES.length; f++)
      for (let i = 0; i < CARDS.length; i++)
        for (let n = 0; n < own[f][i]; n++) d.push({ i: i, f: f });
    return shuffle(d);
  }

  // Theirs is the same SIZE as yours, pulled from the same odds. So a
  // bigger collection is not automatically an easier fight - a BETTER
  // one is.
  // Theirs are always plain. The shiny ones are yours.
  //
  // Their deck is drawn from the SAME MIX as your collection, so their
  // monsters are exactly as good as the ones you own. Fill your
  // collection with dragons and you will be fighting dragons.
  //
  // Matching them by some "power" number would have been wrong, and
  // measuring proved it: a collection of nothing but the biggest
  // numbers - all PANTS DRAGONS and BELCH BEASTS, average 8.00 - won
  // only 10 games of 40, worse than a brand new player on 5.88. Six
  // damage is no use on a monster with two life, because it dies, and
  // the hole it leaves is where they walk through and hit YOUR king.
  // So we copy the actual cards, not a score out of ten.
  function theirDeck(size) {
    const pool = [];
    for (let f = 0; f < FINISHES.length; f++)
      for (let i = 0; i < CARDS.length; i++)
        for (let n = 0; n < own[f][i]; n++) pool.push(i);

    const d = [];
    for (let i = 0; i < size; i++) {
      const idx = pool.length ? pool[Math.floor(Math.random() * pool.length)]
                              : randomCardIndex();
      d.push({ i: idx, f: PLAIN });
    }
    return d;
  }

  // EVERY card you own gets into the battle. When the pile runs out, the
  // whole collection is shuffled and comes round again - so a small
  // collection never simply stops.
  //
  // Without this the game was unfair in a way you could measure: with
  // the starting eight cards you ran dry on about turn six of every
  // single game and lost all forty, while the opponent - who can always
  // find another monster - never ran out once in forty.
  function drawFrom(side) {
    let guard = 0;
    while (side.hand.length < HAND_MAX && guard < 200) {
      guard++;
      if (!side.deck.length) {
        side.deck = (side === you) ? yourDeck()
                                   : theirDeck(Math.max(8, totalOwned()));
        if (!side.deck.length) break;      // you own nothing at all
        if (side === you) side.recycled = (side.recycled || 0) + 1;
      }
      const c = side.deck.pop();
      side.hand.push(newMonster(c.i, c.f));
    }
  }

  function startDuel() {
    const mine = yourDeck();
    you  = { hearts: START_HEARTS, board: [null, null, null], hand: [], deck: mine };
    them = { hearts: START_HEARTS, board: [null, null, null], hand: [],
             deck: theirDeck(Math.max(8, mine.length)) };
    for (let i = 0; i < 4; i++) { drawFrom(you); drawFrom(them); }
    refillThem();                    // they are three deep from the off
    picked = -1; placedThisTurn = 0; yourTurnNo = 1; theirTurnNo = 0;
    turn = 'you'; bits = []; floats = [];
    screen = 'duel';
    say('first turn - send in all ' + FIRST_TURN_PLACE + ' of them');
  }

  function hurt(who, amount, x, y) {
    who.hearts -= amount;
    floats.push({ x: x, y: y, text: '-' + amount, life: 1.1, col: [255, 120, 120] });
  }

  function smash(x, y, col) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 5;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                  life: 0.7 + Math.random() * 0.4, size: 3 + Math.random() * 4, col: col });
    }
  }

  // ---- THE CUT SCENE -------------------------------------------------
  //
  // An attack used to happen in a single frame: numbers changed and you
  // had to work out what had hit what. Now each pair gets its moment -
  // the two of them charge at each other, clash, and one of them may
  // not walk away.
  //
  // The plan is worked out FIRST and then acted out, so what you watch
  // is exactly what the rules already decided. The show cannot change
  // the outcome.
  const CHARGE = 0.34, IMPACT = 0.16, REST = 0.34;
  const STEP_TIME = CHARGE + IMPACT + REST;

  let cut = null;        // { steps, i, t, hit, after }
  let shake = 0;

  function planAttacks(side, foe, mine) {
    const steps = [];
    for (let s = 0; s < SLOTS; s++) {
      const m = side.board[s];
      if (!m) continue;
      // Each space fights the space opposite, and nothing else - so all
      // three of these are worked out at once without treading on each
      // other.
      steps.push({ mine: mine, slot: s, attacker: m,
                   target: foe.board[s], foe: foe });
    }
    return steps;
  }

  function doStep(st) {
    const m = st.attacker;
    m.wobble = 0.35;
    if (st.target) {
      // A monster in the way takes the WHOLE hit, and nothing carries on
      // past it. Spare damage is simply lost. The king is only ever
      // touched by something that walked into an empty space.
      st.target.life -= m.hit;
      st.target.justHit = 0.5;
      if (st.target.life <= 0) {
        st.foe.board[st.slot] = null;
        st.died = true;
      }
    } else {
      // Nobody in the way, so it walks past and hits the king himself.
      st.foe.hearts -= m.hit;
      if (st.foe === you) youHurt = 1; else themHurt = 1;
    }
    shake = 0.32;
  }

  function startCut(steps, after) {
    if (!steps.length) { finishCut(after); return; }
    cut = { steps: steps, i: 0, t: 0, hit: false, after: after };
  }

  function finishCut(after) {
    cut = null;
    if (checkOver()) return;
    if (after === 'them') {
      turn = 'them';
      say('their go...');
      setTimeout(function () { if (turn === 'them') theirTurn(); }, 450);
    } else {
      turn = 'you';
      placedThisTurn = 0;             // a fresh monster to send in
      yourTurnNo++;
      drawFrom(you);
    }
  }

  // Impatient? Tapping runs the rest of the fight instantly.
  function skipCut() {
    if (!cut) return;
    if (!cut.hit) doStep(cut.steps[cut.i]);
    for (let i = cut.i + 1; i < cut.steps.length; i++) doStep(cut.steps[i]);
    const after = cut.after;
    cut = null;
    finishCut(after);
  }

  function stepCut(dt) {
    if (!cut) return;
    cut.t += dt;
    if (!cut.hit && cut.t >= CHARGE) {
      cut.hit = true;
      doStep(cut.steps[cut.i]);
    }
    if (cut.t >= STEP_TIME) {
      cut.i++;
      cut.t = 0; cut.hit = false;
      if (cut.i >= cut.steps.length) finishCut(cut.after);
    }
  }

  function checkOver() {
    if (you.hearts <= 0 || them.hearts <= 0) {
      turn = 'over';
      if (them.hearts <= 0 && you.hearts > 0) {
        wins++; winStreak++;
        if (winStreak >= WINS_PER_GOLD) {
          winStreak = 0; goldPacks++;
          say('YOU WIN - AND THAT IS A GOLD PACK!');
        } else {
          say('YOU WIN!  ' + winStreak + '/' + WINS_PER_GOLD + ' towards a gold pack');
        }
      }
      else if (you.hearts <= 0 && them.hearts > 0) { losses++; say('YOUR KING HAS FALLEN'); }
      else say('BOTH OF YOU. wow.');
      save();
      return true;
    }
    return false;
  }


// -------------------------------------------------------------------
//  THE OPPONENT'S BRAIN
//
//  Not pretending. It looks at every card it holds in every empty
//  space, scores the board that would result, and plays the best one.
// -------------------------------------------------------------------

  function scoreMove(cardIdx, slot) {
    const card = them.hand[cardIdx];
    let score = 0;
    const facing = you.board[slot];

    if (!facing) {
      score += card.hit * 3;                      // straight at the hearts
      if (card.hit >= you.hearts) score += 100;   // and that would finish it
    } else {
      // A dead monster cannot hit back - worth saying out loud, because
      // the first version docked points for "might die to the answer"
      // even when there was going to BE no answer.
      if (card.hit >= facing.life) {
        // Killing is still good, but there is no prize for overkill now
        // - anything above what it takes to finish the job is wasted.
        score += 8 + facing.hit * 2;
      } else {
        score += card.hit;
        if (facing.hit >= card.life) score -= 4;
        else score += 3;
      }
    }
    score += card.life * 0.5;
    return score;
  }

  // Which kinds are standing on YOUR line right now. The opponent will
  // not put down a copy of any of them, so you never fight yourself.
  function yourKinds() {
    const seen = [];
    for (const m of you.board) if (m) seen.push(m.i);
    return seen;
  }

  // They march on three deep, and top up ONE space per turn - so if you
  // clear two in a single go, one of the holes is still there when you
  // attack again, and that is how you reach the king. Kill one and they
  // patch it straight back.
  //
  // Their line and the king rule pull against each other: with their
  // line NEVER empty, and the king only reachable through an empty
  // space, their king could not be scratched. Sixty games, sixty
  // losses, twenty life untouched every time. This is the compromise
  // Max picked.
  // You send in TWO a turn, so they patch two - and three on every
  // third turn, which is the half-step that makes it a fight.
  //
  // Sixty games at each setting, with you playing two a turn:
  //     they patch 1.33 -> you win 60 of 60
  //     they patch 1.67 -> you win 60 of 60
  //     they patch 2    -> you win 56 of 60
  //     they patch 2.33 -> you win 33, they win 27   <- this one
  //     they patch 2.5  -> you win 19, they win 41
  //
  // Two a turn does make games far longer - about 40 turns where one a
  // turn was 10 - because both lines stay full and a king is only ever
  // reachable through a gap. Dropping the kings to 12 life would bring
  // that back to 22, but 20 is the number Max set.
  const PLACE_PER_TURN = 2;
  const BIG_REFILL_EVERY = 3;
  function refillThisTurn() {
    return (theirTurnNo % BIG_REFILL_EVERY === 0) ? 3 : 2;
  }

  // THEY start the battle three deep and you start with nothing, which
  // was the one unfairness left. So your first turn is a full line -
  // send in all three - and after that it is one a turn like theirs.
  const FIRST_TURN_PLACE = SLOTS;

  function refillThem(limit) {
    // If YOU have since played a copy of something they already had,
    // theirs walks off and a different one takes its place. Otherwise
    // "never the same as yours" would only be true at the moment they
    // put it down, not while you look at it.
    const mine = yourKinds();
    for (let s = 0; s < SLOTS; s++) {
      if (them.board[s] && mine.indexOf(them.board[s].i) >= 0) them.board[s] = null;
    }

    // Everything left on the table is counted up BEFORE any gap is
    // filled. Doing it as we went along missed anything standing in a
    // later space - so space 0 happily copied space 2.
    const banned = mine.slice();
    for (const m of them.board) if (m) banned.push(m.i);

    let placed = 0;
    for (let s = 0; s < SLOTS; s++) {
      if (them.board[s]) continue;
      if (limit !== undefined && placed >= limit) break;

      let pick = -1, bestScore = -Infinity;
      for (let c = 0; c < them.hand.length; c++) {
        if (banned.indexOf(them.hand[c].i) >= 0) continue;   // no copying you
        const sc = scoreMove(c, s);
        if (sc > bestScore) { bestScore = sc; pick = c; }
      }

      if (pick >= 0) {
        them.board[s] = them.hand[pick];
        them.hand.splice(pick, 1);
      } else {
        // Nothing allowed in hand. They are promised three, so one is
        // found - still never a copy of anything already on the table.
        let idx = randomCardIndex(), guard = 0;
        while (banned.indexOf(idx) >= 0 && guard < 300) { idx = randomCardIndex(); guard++; }
        them.board[s] = newMonster(idx);
      }
      banned.push(them.board[s].i);
      placed++;
    }
  }

  function theirTurn() {
    drawFrom(them);
    theirTurnNo++;
    refillThem(refillThisTurn());
    startCut(planAttacks(them, you, false), 'you');
  }


// -------------------------------------------------------------------
//  WHERE EVERYTHING IS
// -------------------------------------------------------------------

  // The kings get a column of their own down the left, and the three
  // spaces share what is left. Squeezing a king into the gap between
  // your line and your hand made him 36 pixels wide on a small phone
  // and sat him on top of both.
  function kingW() { return Math.min(W * 0.15, 72); }
  function rowLeft() { return 14 + kingW() + 10; }

  function cardW() {
    return Math.min((W - rowLeft() - 14 - (SLOTS - 1) * 10) / SLOTS, 150);
  }
  function cardH() { return cardW() * 1.35; }

  function slotSpot(mine, s) {
    const w = cardW(), h = cardH(), gap = 10;
    const totalW = SLOTS * w + (SLOTS - 1) * gap;
    const x = rowLeft() + (W - 14 - rowLeft() - totalW) / 2 + s * (w + gap);
    const midY = H * 0.46;
    return { x: x, y: mine ? midY + 18 : midY - h - 18, w: w, h: h };
  }

  function handSpot(i, n) {
    const w = Math.min(cardW() * 0.82, (W - 30) / Math.max(1, n) - 6);
    const h = w * 1.35, gap = 6;
    const totalW = n * w + (n - 1) * gap;
    return { x: (W - totalW) / 2 + i * (w + gap), y: H - h - 54, w: w, h: h };
  }

  function theirHandSpot(i, n) {
    const gap = 6;
    const w = Math.min(cardW() * 0.5, (W - 30) / Math.max(1, n) - gap);
    const h = w * 1.35;
    const totalW = n * w + (n - 1) * gap;
    return { x: (W - totalW) / 2 + i * (w + gap), y: 30, w: w, h: h };
  }

  function endBox() {
    const w = Math.min(W * 0.4, 190);
    return { x: (W - w) / 2, y: H - 46, w: w, h: 38 };
  }

  // The king stands behind his line: theirs up in the top corner, yours
  // in the gap between your line and your hand.
  // Each king stands level with his own line, in the left-hand column.
  function kingSpot(mine) {
    const w = kingW(), h = w * 1.35;
    const row = slotSpot(mine, 0);
    return { x: 14, y: row.y + cardH() / 2 - h / 2, w: w, h: h };
  }

  // ---- the collection screen ----
  //
  // The two buttons are pinned to the bottom of the screen, and the grid
  // gets whatever is left. The first version worked the card size out
  // from the screen WIDTH alone and never asked how tall the grid would
  // end up - so on every single screen size the cards ran down
  // underneath the buttons.
  function packBox() {
    const w = Math.min(W - 40, 320);
    return { x: (W - w) / 2, y: H - 178, w: w, h: 50 };
  }
  function goldBox() {
    const w = Math.min(W - 40, 320);
    return { x: (W - w) / 2, y: H - 122, w: w, h: 50 };
  }
  function playBox() {
    const w = Math.min(W - 40, 320);
    return { x: (W - w) / 2, y: H - 60, w: w, h: 50 };
  }

  function gridCols() { return W < 420 ? 3 : W < 700 ? 4 : 6; }

  // A phone on its side has so little height that the heading has to go
  // on a diet, or the cards end up 20px across.
  function tight()    { return H < 470; }
  function tabTop()   { return tight() ? 40 : 82; }
  function tabH()     { return 44; }            // a fingertip, not a hair
  function gridTop()  { return tabTop() + tabH() + 10; }

  // THREE sets of twelve, all the same size - normal, gold and diamond.
  // You look at one at a time, because three full grids will not share a
  // phone screen and shrinking any of them makes it the poor relation
  // instead of a set.
  //
  // The tab you are on IS the finish, so there is nothing to keep in
  // step: setView is a finish everywhere it is used.
  let setView = PLAIN;

  const SET_NAMES = ['NORMAL', 'GOLD', 'DIAMOND'];

  function tabBox(i) {
    const n = FINISHES.length;
    const gap = 8;
    const w = Math.min((W - 32 - gap * (n - 1)) / n, 150), h = tabH();
    const total = n * w + gap * (n - 1);
    return { x: (W - total) / 2 + i * (w + gap), y: tabTop(), w: w, h: h };
  }

  function countIn(f) {
    let n = 0;
    for (let i = 0; i < CARDS.length; i++) n += own[f][i];
    return n;
  }
  function kindsIn(f) {
    let n = 0;
    for (let i = 0; i < CARDS.length; i++) if (own[f][i] > 0) n++;
    return n;
  }

  // Which pile a swap comes from: the one you are looking at, and only
  // that one. No quietly spending your plain copies to feed a gold swap.
  function pileFor(i) {
    return own[setView][i] >= TRADE_COST ? setView : -1;
  }

  function gridGeom() {
    const cols = gridCols();
    const rows = Math.ceil(CARDS.length / cols);
    const top = gridTop();
    const room = (packBox().y - 12) - top;
    // A row is the card (1.35 tall) plus a line of stars underneath.
    const byHeight = (room - (rows - 1) * 10) / rows / 1.56;
    const byWidth  = (W - 30 - (cols - 1) * 8) / cols;
    const w = Math.max(20, Math.min(byWidth, byHeight));
    const h = w * 1.35;
    const gridW = cols * w + (cols - 1) * 8;
    const step = h + w * 0.21 + 6;
    // Sit the grid in the middle of the room it has, rather than jammed
    // against the top with a hole underneath it.
    const spare = Math.max(0, room - (rows * step - 6));
    return { cols: cols, rows: rows, w: w, h: h,
             x0: (W - gridW) / 2, y0: top + spare / 2, step: step };
  }

  function gridSpot(i) {
    const g = gridGeom();
    const cx = i % g.cols, cy = Math.floor(i / g.cols);
    return { x: g.x0 + cx * (g.w + 8), y: g.y0 + cy * g.step, w: g.w, h: g.h };
  }
  function backBox() { return { x: W - 96, y: 8, w: 88, h: 34 }; }

  // The two buttons on the trade panel.
  function tradePanel() {
    const w = Math.min(W - 60, 300), h = Math.min(H - 120, 300);
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
  }
  function tradeYesBox() {
    const p = tradePanel();
    return { x: p.x + 14, y: p.y + p.h - 60, w: (p.w - 40) / 2, h: 46 };
  }
  function tradeNoBox() {
    const p = tradePanel();
    return { x: p.x + p.w / 2 + 6, y: p.y + p.h - 60, w: (p.w - 40) / 2, h: 46 };
  }
  function saveBox() { return { x: W - 104, y: 12, w: 92, h: 44 }; }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  // A gold card really is GOLD, not just gold round the edge. Most of
  // the monster's own colour is swapped for the finish, with a quarter
  // of it left in so a gold slug and a gold dragon are not identical
  // rectangles.
  function bodyColour(m) {
    const f = FINISHES[m.f || PLAIN];
    if (!f.col) return m.col;
    const mix = 0.74;
    return [ m.col[0] * (1 - mix) + f.col[0] * mix,
             m.col[1] * (1 - mix) + f.col[1] * mix,
             m.col[2] * (1 - mix) + f.col[2] * mix ];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }


  // -----------------------------------------------------------------
  //  THE MONSTER PICTURES
  //
  //  Twelve little drawings, one per monster, built out of circles and
  //  boxes. Everything is measured in fractions of the card, so the
  //  same picture works on a 50px card in the collection and a 150px
  //  one in a fight.
  //
  //  The art keeps the monster's OWN colour even on a gold card - the
  //  frame goes gold, the monster does not, which is how a real shiny
  //  card looks.
  // -----------------------------------------------------------------

  function shade(c, f) { return [c[0] * f, c[1] * f, c[2] * f]; }
  function lift(c, f) {
    return [c[0] + (255 - c[0]) * f, c[1] + (255 - c[1]) * f, c[2] + (255 - c[2]) * f];
  }

  function ell(cx, cy, rx, ry, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  function tri(ax, ay, bx, by, cx, cy, col) {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy);
    ctx.closePath(); ctx.fill();
  }
  // Two eyes with pupils - the quickest way to make anything look alive.
  function peepers(cx, cy, r, spread) {
    for (var e = -1; e <= 1; e += 2) {
      ell(cx + e * spread, cy, r, r, '#fff');
      ell(cx + e * spread, cy, r * 0.45, r * 0.45, '#141018');
    }
  }

  function drawMonsterArt(i, cx, cy, s, col) {
    var dark = rgb(shade(col, 0.55));
    var mid  = rgb(shade(col, 0.78));
    var pale = rgb(lift(col, 0.45));

    if (i === 0) {                                    // SNOT SLUG
      ell(cx, cy + s * 0.22, s * 0.52, s * 0.26, mid);
      ell(cx, cy - s * 0.02, s * 0.34, s * 0.30, dark);
      for (var a = -1; a <= 1; a += 2) {
        ctx.strokeStyle = dark; ctx.lineWidth = s * 0.07;
        ctx.beginPath();
        ctx.moveTo(cx + a * s * 0.14, cy - s * 0.24);
        ctx.lineTo(cx + a * s * 0.24, cy - s * 0.5);
        ctx.stroke();
        ell(cx + a * s * 0.24, cy - s * 0.52, s * 0.07, s * 0.07, dark);
      }
      peepers(cx, cy - s * 0.02, s * 0.11, s * 0.14);
      ell(cx + s * 0.42, cy + s * 0.44, s * 0.09, s * 0.12, pale);

    } else if (i === 1) {                             // NOSE GOBLIN
      ell(cx, cy + s * 0.06, s * 0.40, s * 0.42, mid);
      tri(cx - s * 0.44, cy - s * 0.10, cx - s * 0.72, cy - s * 0.46,
          cx - s * 0.20, cy - s * 0.40, dark);
      tri(cx + s * 0.44, cy - s * 0.10, cx + s * 0.72, cy - s * 0.46,
          cx + s * 0.20, cy - s * 0.40, dark);
      peepers(cx, cy - s * 0.08, s * 0.11, s * 0.17);
      ell(cx, cy + s * 0.20, s * 0.16, s * 0.20, dark);

    } else if (i === 2) {                             // BURP TOAD
      ell(cx, cy + s * 0.14, s * 0.56, s * 0.40, mid);
      ctx.fillStyle = dark;
      ctx.beginPath();
      ctx.ellipse(cx, cy + s * 0.24, s * 0.40, s * 0.16, 0, 0, Math.PI);
      ctx.fill();
      peepers(cx, cy - s * 0.20, s * 0.14, s * 0.24);
      ctx.strokeStyle = pale; ctx.lineWidth = s * 0.05;
      ctx.beginPath(); ctx.arc(cx + s * 0.52, cy - s * 0.34, s * 0.13, 0, Math.PI * 2);
      ctx.stroke();

    } else if (i === 3) {                             // BOOGER BAT
      for (var w = -1; w <= 1; w += 2) {
        ctx.fillStyle = mid;
        ctx.beginPath();
        ctx.moveTo(cx + w * s * 0.16, cy);
        ctx.lineTo(cx + w * s * 0.78, cy - s * 0.34);
        ctx.lineTo(cx + w * s * 0.66, cy + s * 0.10);
        ctx.lineTo(cx + w * s * 0.80, cy + s * 0.22);
        ctx.closePath(); ctx.fill();

      ell(cx, cy, s * 0.26, s * 0.30, dark);
      tri(cx - s * 0.22, cy - s * 0.22, cx - s * 0.28, cy - s * 0.52, cx - s * 0.06, cy - s * 0.34, dark);
      tri(cx + s * 0.22, cy - s * 0.22, cx + s * 0.28, cy - s * 0.52, cx + s * 0.06, cy - s * 0.34, dark);
      peepers(cx, cy - s * 0.04, s * 0.09, s * 0.11);

      ell(cx, cy + s * 0.10, s * 0.46, s * 0.42, dark);
      ctx.fillStyle = pale;
      ctx.fillRect(cx - s * 0.09, cy - s * 0.34, s * 0.18, s * 0.62);
      peepers(cx, cy - s * 0.06, s * 0.10, s * 0.22);
      ell(cx, cy + s * 0.24, s * 0.10, s * 0.08, '#141018');
      tri(cx - s * 0.46, cy - s * 0.28, cx - s * 0.30, cy - s * 0.52, cx - s * 0.20, cy - s * 0.24, dark);
      tri(cx + s * 0.46, cy - s * 0.28, cx + s * 0.30, cy - s * 0.52, cx + s * 0.20, cy - s * 0.24, dark);

      ctx.fillStyle = mid;
      ctx.fillRect(cx - s * 0.42, cy - s * 0.30, s * 0.84, s * 0.72);
      ctx.fillStyle = dark;
      ctx.fillRect(cx - s * 0.42, cy + s * 0.24, s * 0.84, s * 0.18);
      peepers(cx, cy - s * 0.08, s * 0.12, s * 0.19);
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - s * 0.20, cy + s * 0.10, s * 0.09, s * 0.14);
      ctx.fillRect(cx + s * 0.11, cy + s * 0.10, s * 0.09, s * 0.14);

    } else if (i === 6) {                             // EARWAX OWL
      ell(cx, cy + s * 0.06, s * 0.46, s * 0.46, mid);
      tri(cx - s * 0.40, cy - s * 0.26, cx - s * 0.34, cy - s * 0.60, cx - s * 0.12, cy - s * 0.34, dark);
      tri(cx + s * 0.40, cy - s * 0.26, cx + s * 0.34, cy - s * 0.60, cx + s * 0.12, cy - s * 0.34, dark);
      ell(cx - s * 0.19, cy - s * 0.04, s * 0.19, s * 0.19, pale);
      ell(cx + s * 0.19, cy - s * 0.04, s * 0.19, s * 0.19, pale);
      peepers(cx, cy - s * 0.04, s * 0.11, s * 0.19);
      tri(cx, cy + s * 0.10, cx - s * 0.09, cy + s * 0.26, cx + s * 0.09, cy + s * 0.26, dark);

    } else if (i === 7) {                             // ROBO DOG
      ctx.fillStyle = mid;
      ctx.fillRect(cx - s * 0.44, cy - s * 0.20, s * 0.88, s * 0.56);
      ctx.fillStyle = dark;
      ctx.fillRect(cx - s * 0.30, cy - s * 0.44, s * 0.60, s * 0.30);
      ctx.strokeStyle = dark; ctx.lineWidth = s * 0.06;
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.44); ctx.lineTo(cx, cy - s * 0.66); ctx.stroke();
      ell(cx, cy - s * 0.70, s * 0.08, s * 0.08, pale);
      peepers(cx, cy - s * 0.02, s * 0.10, s * 0.18);
      ctx.fillStyle = '#141018';
      ctx.fillRect(cx - s * 0.16, cy + s * 0.16, s * 0.32, s * 0.07);

    } else if (i === 8) {                             // SOCK GOLEM
      ctx.fillStyle = mid;
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.30, cy - s * 0.50);
      ctx.lineTo(cx + s * 0.24, cy - s * 0.50);
      ctx.lineTo(cx + s * 0.24, cy + s * 0.18);
      ctx.lineTo(cx + s * 0.62, cy + s * 0.20);
      ctx.lineTo(cx + s * 0.62, cy + s * 0.46);
      ctx.lineTo(cx - s * 0.30, cy + s * 0.46);

      ctx.fillStyle = dark;
      ctx.fillRect(cx - s * 0.30, cy - s * 0.50, s * 0.54, s * 0.14);
      peepers(cx - s * 0.04, cy - s * 0.14, s * 0.10, s * 0.14);
      ctx.fillStyle = pale;
      ctx.fillRect(cx - s * 0.52, cy - s * 0.30, s * 0.05, s * 0.20);
      ctx.fillRect(cx - s * 0.42, cy - s * 0.42, s * 0.05, s * 0.20);

    } else if (i === 9) {                             // TOENAIL TROLL
      ell(cx, cy - s * 0.06, s * 0.42, s * 0.40, mid);
      ctx.fillStyle = dark;
      ctx.fillRect(cx - s * 0.62, cy + s * 0.24, s * 0.52, s * 0.24);
      ctx.fillRect(cx + s * 0.10, cy + s * 0.24, s * 0.52, s * 0.24);
      ctx.fillStyle = pale;
      for (var t = 0; t < 3; t++) {
        ctx.fillRect(cx - s * 0.60 + t * s * 0.16, cy + s * 0.26, s * 0.10, s * 0.09);
        ctx.fillRect(cx + s * 0.12 + t * s * 0.16, cy + s * 0.26, s * 0.10, s * 0.09);
      }
      peepers(cx, cy - s * 0.12, s * 0.11, s * 0.17);
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx - s * 0.10, cy + s * 0.06, s * 0.08, s * 0.12);

    } else if (i === 10) {                            // BELCH BEAST
      ell(cx, cy + s * 0.04, s * 0.50, s * 0.46, mid);
      ctx.fillStyle = '#2a1020';
      ctx.beginPath();
      ctx.ellipse(cx, cy + s * 0.18, s * 0.32, s * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
      for (var t2 = 0; t2 < 4; t2++) {
        tri(cx - s * 0.26 + t2 * s * 0.17, cy - s * 0.06,
            cx - s * 0.18 + t2 * s * 0.17, cy + s * 0.10,
            cx - s * 0.10 + t2 * s * 0.17, cy - s * 0.06, '#fff');

      peepers(cx, cy - s * 0.26, s * 0.10, s * 0.20);
      ctx.strokeStyle = pale; ctx.lineWidth = s * 0.05;
      ctx.beginPath(); ctx.arc(cx + s * 0.52, cy + s * 0.30, s * 0.11, 0, Math.PI * 2); ctx.stroke();

      for (var w2 = -1; w2 <= 1; w2 += 2) {
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.moveTo(cx + w2 * s * 0.18, cy - s * 0.20);
        ctx.lineTo(cx + w2 * s * 0.78, cy - s * 0.52);
        ctx.lineTo(cx + w2 * s * 0.62, cy + s * 0.06);
        ctx.closePath(); ctx.fill();

        tri(cx + k * s * 0.16, cy - s * 0.36, cx + k * s * 0.16 - s * 0.07, cy - s * 0.52,

      ctx.fillRect(cx - s * 0.12, cy + s * 0.06, s * 0.07, s * 0.11);
      ctx.fillRect(cx + s * 0.05, cy + s * 0.06, s * 0.07, s * 0.11);
      ctx.fillStyle = '#3b6fd4';
      ctx.fillRect(cx - s * 0.30, cy + s * 0.24, s * 0.60, s * 0.22);
      ctx.fillStyle = '#2a4fa0';
      ctx.fillRect(cx - s * 0.03, cy + s * 0.34, s * 0.06, s * 0.12);
    }
  }



  // A band of light sweeping across a gold or diamond card. Clipped to
  // the card, so it never leaks over the one next to it. The seed means
  // two cards side by side do not shimmer in lockstep, which would look
  // like one big flashing rectangle instead of two special cards.
  function drawShine(x, y, w, h, kind, seed) {
    const p = ((shineT * 0.4 + seed) % 1.7) - 0.35;
    ctx.save();
    roundRect(x, y, w, h, w * 0.09);
    ctx.clip();

    // A soft light down the card first, so it looks like polished metal
    // rather than flat paint, then the moving band on top.
    const base = ctx.createLinearGradient(x, y, x + w * 0.3, y + h);
    base.addColorStop(0, kind === 'diamond' ? 'rgba(255,255,255,0.30)'
                                            : 'rgba(255,240,170,0.34)');
    base.addColorStop(0.5, 'rgba(0,0,0,0.10)');
    base.addColorStop(1, kind === 'diamond' ? 'rgba(190,235,255,0.30)'
                                            : 'rgba(190,140,40,0.30)');
    ctx.fillStyle = base;
    ctx.fillRect(x, y, w, h);

    const bx = x + p * w * 1.5;
    const g = ctx.createLinearGradient(bx, y, bx + w * 0.5, y + h);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.5, kind === 'diamond' ? 'rgba(240,252,255,0.92)'
                                           : 'rgba(255,252,224,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    if (kind === 'diamond') {
      // Four little sparkles that twinkle at different speeds.
      for (let i = 0; i < 4; i++) {
        const tw = Math.abs(Math.sin(shineT * (1.6 + i * 0.5) + seed * 6 + i));
        const sx = x + w * (0.18 + 0.22 * i);
        const sy = y + h * (0.22 + 0.5 * Math.abs(Math.sin(seed * 9 + i * 2.1)));
        const r = w * 0.06 * tw;
        ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.65 * tw) + ')';
        ctx.beginPath();
        ctx.moveTo(sx, sy - r * 2); ctx.lineTo(sx + r, sy);
        ctx.lineTo(sx, sy + r * 2); ctx.lineTo(sx - r, sy);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawCard(x, y, w, h, m, opts) {
    opts = opts || {};
    ctx.save();
    if (m.wobble > 0) {
      ctx.translate(x + w / 2, y + h / 2);
      ctx.rotate(Math.sin(m.wobble * 40) * 0.06);
      ctx.translate(-(x + w / 2), -(y + h / 2));
    }
    if (opts.faded) ctx.globalAlpha = 0.22;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x + 3, y + 4, w, h, w * 0.09); ctx.fill();
    ctx.fillStyle = rgb(bodyColour(m));
    roundRect(x, y, w, h, w * 0.09); ctx.fill();

    if (m.justHit > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(m.justHit, 0, 1) * 0.6 + ')';
      roundRect(x, y, w, h, w * 0.09); ctx.fill();
    }

    const fin = FINISHES[m.f || PLAIN];
    if (fin.shine && !opts.faded) drawShine(x, y, w, h, fin.shine, m.i * 0.37);

    const rare = rarityOf(m.i);
    ctx.lineWidth = opts.picked ? 4 : (fin.shine ? 4 : rare.stars === 3 ? 3 : 2);
    ctx.strokeStyle = opts.picked ? '#ffd76a'
                    : fin.shine ? rgb(fin.col)
                    : rare.stars === 3 ? rgb(rare.col) : 'rgba(0,0,0,0.35)';
    roundRect(x, y, w, h, w * 0.09); ctx.stroke();

    // ---- THE CARD, TOP TO BOTTOM -------------------------------------
    //  name  ->  HP  ->  picture  ->  attack
    // Life lives at the top and the punch lives at the bottom, so you
    // can read a whole line of monsters by scanning across one edge.

    ctx.textAlign = 'center';
    let fs = w * 0.12;
    ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    const room = w - 8, natural = ctx.measureText(m.name).width;
    if (natural > room) {
      fs *= room / natural;
      ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    }
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillText(m.name, x + w / 2, y + h * 0.12);

    // HP at the top. It goes red once something has taken a bite.
    ctx.font = 'bold ' + w * 0.13 + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText('HP', x + w * 0.30, y + h * 0.265);
    ctx.font = 'bold ' + w * 0.23 + 'px system-ui, sans-serif';
    ctx.fillStyle = m.life < m.max ? '#7a1520' : '#231a10';
    // Never a minus - hit something for more than it had left and it is
    // on nought, not on minus two.
    ctx.fillText(Math.max(0, m.life), x + w * 0.60, y + h * 0.28);

    // The monster itself, in the middle.
    drawMonsterArt(m.i, x + w * 0.5, y + h * 0.56, w * 0.42, m.col);

    // And what it hits for, along the bottom.
    ctx.font = 'bold ' + w * 0.13 + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText('HIT', x + w * 0.29, y + h * 0.945);
    ctx.font = 'bold ' + w * 0.23 + 'px system-ui, sans-serif';
    ctx.fillStyle = '#231a10';
    ctx.fillText(m.hit, x + w * 0.62, y + h * 0.955);

    ctx.restore();
  }

  function drawEmptySlot(x, y, w, h, glow) {
    ctx.setLineDash([7, 6]);
    ctx.lineWidth = glow ? 3 : 2;
    ctx.strokeStyle = glow ? 'rgba(255,215,106,0.9)' : 'rgba(255,255,255,0.16)';
    roundRect(x, y, w, h, w * 0.09); ctx.stroke();
    ctx.setLineDash([]);
  }

  // A king is a card like any other, with a crown on and his life
  // written big - because that number IS your health.
  function drawKing(mine, hurtFlash) {
    const b = kingSpot(mine);
    const k = KINGS[mine ? 0 : 1];
    const life = Math.max(0, mine ? you.hearts : them.hearts);
    const x = b.x, y = b.y, w = b.w, h = b.h;

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    roundRect(x + 3, y + 4, w, h, w * 0.11); ctx.fill();
    ctx.fillStyle = rgb(k.col);
    roundRect(x, y, w, h, w * 0.11); ctx.fill();

    if (hurtFlash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(hurtFlash, 0, 1) * 0.65 + ')';
      roundRect(x, y, w, h, w * 0.11); ctx.fill();
    }

    ctx.lineWidth = 3;
    ctx.strokeStyle = life <= 5 ? '#ff6a6a' : '#ffd76a';
    roundRect(x, y, w, h, w * 0.11); ctx.stroke();

    // Crown.
    ctx.fillStyle = '#ffd76a';
    const cw = w * 0.6, cx = x + w / 2 - cw / 2, cyt = y + h * 0.10;
    ctx.beginPath();
    ctx.moveTo(cx, cyt + cw * 0.28);
    ctx.lineTo(cx, cyt);
    ctx.lineTo(cx + cw * 0.25, cyt + cw * 0.15);
    ctx.lineTo(cx + cw * 0.5, cyt - cw * 0.04);
    ctx.lineTo(cx + cw * 0.75, cyt + cw * 0.15);
    ctx.lineTo(cx + cw, cyt);
    ctx.lineTo(cx + cw, cyt + cw * 0.28);
    ctx.closePath();
    ctx.fill();

    // Face.
    ctx.fillStyle = '#1b1428';
    for (let e = 0; e < 2; e++) {
      ctx.beginPath();
      ctx.arc(x + w * (0.34 + e * 0.32), y + h * 0.46, w * 0.075, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#1b1428';
    ctx.lineWidth = Math.max(2, w * 0.04);
    ctx.beginPath();
    if (life <= 5) {                       // he is not enjoying this
      ctx.arc(x + w / 2, y + h * 0.68, w * 0.16, 1.15 * Math.PI, 1.85 * Math.PI);
    } else {
      ctx.arc(x + w / 2, y + h * 0.58, w * 0.16, 0.15 * Math.PI, 0.85 * Math.PI);
    }
    ctx.stroke();

    // How much of him is left: the number sits ABOVE the bar, not on it.
    const bh = h * 0.10, by = y + h - bh - 4;

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + w * 0.30 + 'px system-ui, sans-serif';
    ctx.fillStyle = '#1b1428';
    ctx.fillText(life, x + w / 2, by - h * 0.06);

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x + 4, by, w - 8, bh);
    ctx.fillStyle = life <= 5 ? '#ff6a6a' : '#8fe07a';
    ctx.fillRect(x + 4, by, (w - 8) * clamp(life / KING_LIFE, 0, 1), bh);

    ctx.font = 'bold ' + Math.max(8, w * 0.13) + 'px system-ui, sans-serif';
    ctx.fillStyle = mine ? '#9bffb0' : '#ff9ba6';
    ctx.fillText(mine ? 'YOUR KING' : 'THEIR KING', x + w / 2, y + h + w * 0.2);
  }

  function drawButton(b, label, on, colOn) {
    ctx.fillStyle = on ? 'rgba(255,215,106,0.16)' : 'rgba(255,255,255,0.05)';
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = on ? (colOn || '#ffd76a') : 'rgba(255,255,255,0.16)';
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.036, 18) + 'px system-ui, sans-serif';
    ctx.fillStyle = on ? (colOn || '#ffd76a') : '#6b6288';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h * 0.63);
  }

  function drawCollection() {
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * (tight() ? 0.04 : 0.06), 32) +
               'px system-ui, sans-serif';
    ctx.fillStyle = '#f0e9ff';
    ctx.fillText('YOUR MONSTERS', 16, tight() ? 26 : 44);

    // Counts and record on ONE line, so the tabs have room underneath.
    if (!tight()) {
      let sub = countIn(setView) + ' ' + (setView === PLAIN ? 'cards' : SET_NAMES[setView]) +
                '  -  ' + kindsIn(setView) + ' of ' + CARDS.length + ' kinds';
      if (wins || losses) sub += '  -  won ' + wins + ', lost ' + losses;
      let fs2 = Math.min(W * 0.032, 16);
      ctx.font = fs2 + 'px system-ui, sans-serif';
      const fits = W - 118, wideNow = ctx.measureText(sub).width;
      if (wideNow > fits) {
        fs2 *= fits / wideNow;
        ctx.font = fs2 + 'px system-ui, sans-serif';
      }
      ctx.fillStyle = '#8a7ea8';
      ctx.fillText(sub, 16, 70);
    }

    for (let i = 0; i < CARDS.length; i++) {
      const p = gridSpot(i);
      // Each set shows only its own finish, so a gold one never stands
      // in for a plain one you have not found.
      const have = own[setView][i];
      const m = newMonster(i, setView);
      drawCard(p.x, p.y, p.w, p.h, m, { faded: have === 0 });

      if (have === 0) {
        // Not found yet - a question mark instead of a monster.
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + p.w * 0.4 + 'px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(240,233,255,0.5)';
        ctx.fillText('?', p.x + p.w / 2, p.y + p.h * 0.62);
      }

      // Rarity stars, and how many you have, on the line UNDER the card.
      // The count used to be a badge in the top corner, which sat right
      // on top of the monster's name.
      const rare = rarityOf(i);
      const fs = p.w * 0.15;
      ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';

      // Stars for how rare it is, then one number per finish you own -
      // white for plain, gold for gold, pale blue for diamond. Zeroes
      // are left out so a card you have one of does not read as "1 0 0".
      const parts = [{ text: '★'.repeat(rare.stars), col: rgb(rare.col) }];
      if (own[setView][i] > 1) {
        parts.push({ text: ' x' + own[setView][i],
                     col: FINISHES[setView].col ? rgb(FINISHES[setView].col) : '#f0e9ff' });
      }

      let lineW = 0;
      for (const q of parts) lineW += ctx.measureText(q.text).width;
      let lx = p.x + p.w / 2 - lineW / 2;
      const ly = p.y + p.h + p.w * 0.16;
      ctx.textAlign = 'left';
      for (const q of parts) {
        ctx.fillStyle = q.col;
        ctx.fillText(q.text, lx, ly);
        lx += ctx.measureText(q.text).width;
      }
    }

    // One tab per finish.
    for (let t = 0; t < FINISHES.length; t++) {
      const b = tabBox(t), on = setView === t;
      const col = FINISHES[t].col || [240, 233, 255];
      ctx.fillStyle = on ? 'rgba(255,215,106,0.16)' : 'rgba(255,255,255,0.04)';
      roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
      ctx.lineWidth = on ? 3 : 2;
      ctx.strokeStyle = on ? rgb(col) : 'rgba(255,255,255,0.14)';
      roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();
      if (on && FINISHES[t].shine) drawShine(b.x, b.y, b.w, b.h, FINISHES[t].shine, 0);

      // The label shrinks to fit - DIAMOND is a long word on a narrow tab.
      ctx.textAlign = 'center';
      let tf = Math.min(W * 0.034, 17);
      ctx.font = 'bold ' + tf + 'px system-ui, sans-serif';
      const roomT = b.w - 10, wideT = ctx.measureText(SET_NAMES[t]).width;
      if (wideT > roomT) {
        tf *= roomT / wideT;
        ctx.font = 'bold ' + tf + 'px system-ui, sans-serif';
      }
      ctx.fillStyle = on ? rgb(col) : '#6b6288';
      ctx.fillText(SET_NAMES[t], b.x + b.w / 2, b.y + b.h * 0.63);

      // A little tally on each tab, so you can see where your cards are
      // without opening every set.
      ctx.font = Math.max(9, tf * 0.66) + 'px system-ui, sans-serif';
      ctx.fillStyle = on ? 'rgba(255,255,255,0.65)' : '#5a5278';
      ctx.fillText(kindsIn(t) + '/' + CARDS.length, b.x + b.w / 2, b.y + b.h * 0.92);
    }

    const pb = packBox();
    if (packReady()) {
      drawButton(pb, 'OPEN TODAY\'S PACK', true, '#8fe07a');
    } else {
      drawButton(pb, 'NEXT PACK IN ' + countdownText(), false);
    }

    // The gold pack. If you have not earned one yet it shows how close
    // you are, so it never just sits there looking locked.
    const gb = goldBox();
    if (goldPacks > 0) {
      drawButton(gb, goldPacks > 1 ? 'OPEN GOLD PACK  (' + goldPacks + ')' : 'OPEN GOLD PACK',
                 true, rgb(FINISHES[GOLD].col));
      drawShine(gb.x, gb.y, gb.w, gb.h, 'gold', 0);
    } else {
      drawButton(gb, 'GOLD PACK: WIN ' + (WINS_PER_GOLD - winStreak) +
                     ' MORE  (' + winStreak + '/' + WINS_PER_GOLD + ')', false);
    }

    drawButton(playBox(), 'FIGHT SOMEBODY', totalOwned() > 0);

    if (tradePick) drawTradePanel();

    // The game already writes everything down the moment it happens, so
    // this button never has work to do. It is here to SHOW you that -
    // "trust me" is not as good as a tick.
    drawButton(saveBox(), savedT > 0 ? 'SAVED ✓' : 'SAVE', true,
               savedT > 0 ? '#8fe07a' : '#8a7ea8');
  }

  function drawTradePanel() {
    const p = tradePanel();
    const m = newMonster(tradePick.i, tradePick.f);

    ctx.fillStyle = 'rgba(8,5,14,0.82)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#221a33';
    roundRect(p.x, p.y, p.w, p.h, 16); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffd76a';
    roundRect(p.x, p.y, p.w, p.h, 16); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.045, 22) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#f0e9ff';
    ctx.fillText('SWAP ' + TRADE_COST + ' FOR 1', p.x + p.w / 2, p.y + 34);

    // The two you would hand over, and what comes back.
    // Side by side with only a whisker of overlap - stacked any closer
    // and the front card hid the back one's numbers.
    const cw = p.w * 0.235, ch = cw * 1.35, my = p.y + 52;
    drawCard(p.x + p.w * 0.045, my, cw, ch, m);
    drawCard(p.x + p.w * 0.285, my, cw, ch, m);

    ctx.font = 'bold ' + Math.min(W * 0.07, 34) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('>', p.x + p.w * 0.60, my + ch * 0.6);

    // A face-down card, because you do not know what you are getting.
    const qx = p.x + p.w * 0.66;
    ctx.fillStyle = '#2e2444';
    roundRect(qx, my, cw, ch, cw * 0.09); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#463769';
    roundRect(qx, my, cw, ch, cw * 0.09); ctx.stroke();
    ctx.font = 'bold ' + cw * 0.5 + 'px system-ui, sans-serif';
    ctx.fillStyle = '#6f5ba0';
    ctx.fillText('?', qx + cw / 2, my + ch * 0.66);

    // Both lines shrink to fit rather than running off the panel.
    const fin = FINISHES[tradePick.f];
    const lines = [
      'you have ' + own[tradePick.f][tradePick.i] + ' ' +
        (fin.shine ? fin.name + ' ' : '') + m.name,
      fin.shine ? 'you get another ' + fin.name + ' card'
                : 'you get one you have not found yet'
    ];
    ctx.fillStyle = '#9a8fc0';
    for (let li = 0; li < lines.length; li++) {
      let ts = Math.min(W * 0.032, 15);
      ctx.font = ts + 'px system-ui, sans-serif';
      const wide = ctx.measureText(lines[li]).width, fits = p.w - 28;
      if (wide > fits) {
        ts *= fits / wide;
        ctx.font = ts + 'px system-ui, sans-serif';
      }
      ctx.fillText(lines[li], p.x + p.w / 2, my + ch + 30 + li * 22);
    }

    drawButton(tradeYesBox(), 'SWAP', true, '#8fe07a');
    drawButton(tradeNoBox(), 'NO', true, '#8a7ea8');
  }

  function drawPackReveal() {
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.07, 40) + 'px system-ui, sans-serif';
    ctx.fillStyle = packWasGold ? rgb(FINISHES[GOLD].col) : '#ffd76a';
    ctx.fillText(packTitle, W / 2, 60);

    const n = packCards.length;
    const w = Math.min((W - 30 - (n - 1) * 6) / n, 120);
    const h = w * 1.35;
    const total = n * w + (n - 1) * 6;
    for (let i = 0; i < n; i++) {
      // One at a time, a fifth of a second apart, so it feels like
      // opening something instead of being handed a list.
      if (revealT < i * 0.22) continue;
      const age = revealT - i * 0.22;
      const pop = clamp(age / 0.18, 0, 1);
      const x = (W - total) / 2 + i * (w + 6);
      const y = H * 0.34;
      const sw = w * (0.6 + 0.4 * pop), sh = h * (0.6 + 0.4 * pop);
      const pc = packCards[i];
      drawCard(x + (w - sw) / 2, y + (h - sh) / 2, sw, sh, newMonster(pc.i, pc.f));

      if (pop >= 1) {
        // Shout about the finish if it has one, otherwise about how rare
        // the monster is. A plain common gets no shouting at all.
        const fin = FINISHES[pc.f];
        const rare = rarityOf(pc.i);
        let label = null, col = null, big = false;
        if (fin.shine) { label = fin.name + '!'; col = rgb(fin.col); big = true; }
        else if (rare.stars === 3) { label = rare.name + '!'; col = rgb(rare.col); }
        if (label) {
          ctx.textAlign = 'center';
          ctx.font = 'bold ' + w * (big ? 0.19 : 0.16) + 'px system-ui, sans-serif';
          ctx.fillStyle = col;
          ctx.fillText(label, x + w / 2, y + h + w * 0.22);
        }
      }
    }

    ctx.textAlign = 'center';
    ctx.font = Math.min(W * 0.034, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8a7ea8';
    ctx.fillText('they are in your collection now - tap to carry on', W / 2, H - 60);
  }

  function drawDuel() {
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(20, H * 0.46); ctx.lineTo(W - 20, H * 0.46);
    ctx.stroke();

    drawKing(false, themHurt);

    for (let i = 0; i < them.hand.length; i++) {
      const p = theirHandSpot(i, them.hand.length);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      roundRect(p.x + 2, p.y + 3, p.w, p.h, p.w * 0.09); ctx.fill();
      ctx.fillStyle = '#2e2444';
      roundRect(p.x, p.y, p.w, p.h, p.w * 0.09); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#463769';
      roundRect(p.x, p.y, p.w, p.h, p.w * 0.09); ctx.stroke();
      ctx.fillStyle = '#5b4a86';
      for (let e = 0; e < 2; e++) {
        ctx.beginPath();
        ctx.arc(p.x + p.w * (0.36 + e * 0.28), p.y + p.h * 0.45, p.w * 0.075, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let s = 0; s < SLOTS; s++) {
      const p = slotSpot(false, s);
      if (them.board[s]) drawCard(p.x, p.y, p.w, p.h, them.board[s]);
      else drawEmptySlot(p.x, p.y, p.w, p.h, false);
    }
    for (let s = 0; s < SLOTS; s++) {
      const p = slotSpot(true, s);
      if (you.board[s]) drawCard(p.x, p.y, p.w, p.h, you.board[s]);
      else drawEmptySlot(p.x, p.y, p.w, p.h,
                         picked >= 0 && turn === 'you' && placedThisTurn < placeAllowance());
    }

    drawKing(true, youHurt);
    ctx.textAlign = 'right';
    ctx.font = Math.min(W * 0.028, 14) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#6b6288';
    ctx.fillText('deck: ' + you.deck.length +
                 (you.recycled ? '  (shuffled x' + you.recycled + ')' : ''),
                 W - 18, kingSpot(true).y + 14);

    for (let i = 0; i < you.hand.length; i++) {
      const p = handSpot(i, you.hand.length);
      drawCard(p.x, p.y + (picked === i ? -12 : 0), p.w, p.h, you.hand[i],
               { picked: picked === i });
    }

    drawButton(endBox(), turn === 'over' ? 'BACK TO YOUR CARDS' : 'FIGHT!',
               turn === 'you' || turn === 'over');
    drawButton(backBox(), 'CARDS', true, '#8a7ea8');
  }

  function drawCutScene() {
    const st = cut.steps[cut.i];
    const t = cut.t;

    // How far along the charge we are: 0 at the start, 1 at the clash,
    // then easing back out again.
    let closeness;
    if (t < CHARGE) closeness = t / CHARGE;
    else if (t < CHARGE + IMPACT) closeness = 1;
    else closeness = 1 - (t - CHARGE - IMPACT) / REST;
    closeness = clamp(closeness, 0, 1);

    ctx.fillStyle = 'rgba(10,7,18,0.86)';
    ctx.fillRect(0, 0, W, H);

    const cw = Math.min(W * 0.34, 190), ch = cw * 1.35;
    const cy = H * 0.44 - ch / 2;
    const restX = W * 0.06, meetGap = cw * 0.16;
    const leftX  = restX + closeness * (W / 2 - cw - meetGap / 2 - restX);
    const rightX = W - restX - cw - closeness * (W / 2 - cw - meetGap / 2 - restX);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.045, 24) + 'px system-ui, sans-serif';
    ctx.fillStyle = st.mine ? '#9bffb0' : '#ff9ba6';
    ctx.fillText(st.mine ? 'YOUR ATTACK' : 'THEIR ATTACK', W / 2, H * 0.16);

    // The attacker, always coming from the left.
    drawCard(leftX, cy, cw, ch, st.attacker);

    if (st.target) {
      drawCard(rightX, cy, cw, ch, st.target);
    } else {
      // Nobody was standing there, so it is charging the king. Draw him
      // properly, at the same size as the monster running at him - this
      // is the moment the whole rule makes sense.
      const k = KINGS[st.mine ? 1 : 0];
      const life = Math.max(0, st.mine ? them.hearts : you.hearts);

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      roundRect(rightX + 4, cy + 5, cw, ch, cw * 0.09); ctx.fill();
      ctx.fillStyle = rgb(k.col);
      roundRect(rightX, cy, cw, ch, cw * 0.09); ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffd76a';
      roundRect(rightX, cy, cw, ch, cw * 0.09); ctx.stroke();

      ctx.fillStyle = '#ffd76a';
      const cwd = cw * 0.5, kx = rightX + cw / 2 - cwd / 2, kyt = cy + ch * 0.12;
      ctx.beginPath();
      ctx.moveTo(kx, kyt + cwd * 0.28);
      ctx.lineTo(kx, kyt);
      ctx.lineTo(kx + cwd * 0.25, kyt + cwd * 0.15);
      ctx.lineTo(kx + cwd * 0.5, kyt - cwd * 0.04);
      ctx.lineTo(kx + cwd * 0.75, kyt + cwd * 0.15);
      ctx.lineTo(kx + cwd, kyt);
      ctx.lineTo(kx + cwd, kyt + cwd * 0.28);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = '#1b1428';
      for (let e = 0; e < 2; e++) {
        ctx.beginPath();
        ctx.arc(rightX + cw * (0.34 + e * 0.32), cy + ch * 0.45, cw * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }
      // Shrink the name until it fits, the same way the monsters do -
      // KING ROTTENTOOTH is a long word for a small card.
      ctx.textAlign = 'center';
      let kf = cw * 0.13;
      ctx.font = 'bold ' + kf + 'px system-ui, sans-serif';
      const nameRoom = cw - 12, nameW = ctx.measureText(k.name).width;
      if (nameW > nameRoom) {
        kf *= nameRoom / nameW;
        ctx.font = 'bold ' + kf + 'px system-ui, sans-serif';
      }
      ctx.fillStyle = '#1b1428';
      ctx.fillText(k.name, rightX + cw / 2, cy + ch * 0.72);
      ctx.font = 'bold ' + cw * 0.3 + 'px system-ui, sans-serif';
      ctx.fillText(life, rightX + cw / 2, cy + ch * 0.94);
    }

    // The clash: a white starburst right where they meet.
    if (t >= CHARGE && t < CHARGE + IMPACT + 0.12) {
      const age = clamp((t - CHARGE) / (IMPACT + 0.12), 0, 1);
      const mx = W / 2, my = cy + ch * 0.5;
      ctx.save();
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = '#fff6d5';
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        const len = cw * (0.25 + age * 0.75);
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(a) * cw * 0.1, my + Math.sin(a) * cw * 0.1);
        ctx.lineTo(mx + Math.cos(a + 0.16) * len, my + Math.sin(a + 0.16) * len);
        ctx.lineTo(mx + Math.cos(a - 0.16) * len, my + Math.sin(a - 0.16) * len);
        ctx.fill();
      }
      ctx.restore();
    }

    // How hard it hit, and whether that was the end of somebody.
    if (t >= CHARGE) {
      const age = t - CHARGE;
      ctx.globalAlpha = clamp(1 - age / (IMPACT + REST), 0, 1);
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.11, 62) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd76a';
      ctx.fillText('-' + st.attacker.hit, W / 2, cy - 14 - age * 30);
      if (st.died) {
        ctx.font = 'bold ' + Math.min(W * 0.06, 32) + 'px system-ui, sans-serif';
        ctx.fillStyle = '#ff8a7a';
        ctx.fillText('SMASHED!', W / 2, cy + ch + 44);
      }
      ctx.globalAlpha = 1;
    }

    // On its own pill, because wherever it lands it might be sitting on
    // a brightly coloured monster.
    ctx.textAlign = 'center';
    const fs = Math.min(W * 0.03, 15);
    ctx.font = fs + 'px system-ui, sans-serif';
    const sy = Math.min(cy + ch + 100, H - 96);
    const sw = ctx.measureText('tap to skip').width;
    ctx.fillStyle = 'rgba(10,7,18,0.8)';
    roundRect(W / 2 - sw / 2 - 12, sy - fs - 2, sw + 24, fs + 12, 9);
    ctx.fill();
    ctx.fillStyle = '#9a8fc0';
    ctx.fillText('tap to skip', W / 2, sy);
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake * 26,
                    (Math.random() - 0.5) * shake * 26);
    }
    ctx.fillStyle = '#151020';
    ctx.fillRect(-40, -40, W + 80, H + 80);

    if (screen === 'collection') drawCollection();
    else if (screen === 'pack')  drawPackReveal();
    else                          drawDuel();

    for (let i = 0; i < bits.length; i++) {
      const b = bits[i];
      ctx.fillStyle = 'rgba(' + (b.col[0]|0) + ',' + (b.col[1]|0) + ',' + (b.col[2]|0) +
                      ',' + clamp(b.life * 1.4, 0, 1) + ')';
      ctx.fillRect(b.x, b.y, b.size, b.size);
    }
    for (let i = 0; i < floats.length; i++) {
      const f = floats[i];
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.05, 26) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(' + f.col[0] + ',' + f.col[1] + ',' + f.col[2] + ',' +
                      clamp(f.life, 0, 1) + ')';
      ctx.fillText(f.text, f.x, f.y);
    }

    if (saysT > 0 && (screen === 'collection' || (screen === 'duel' && !cut))) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.04, 21) + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      const y = H * 0.46 + 8;
      ctx.fillStyle = 'rgba(21,16,32,' + clamp(saysT, 0, 1) * 0.9 + ')';
      ctx.fillRect(W / 2 - wid / 2 - 14, y - 24, wid + 28, 32);
      ctx.fillStyle = 'rgba(240,233,255,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, y);
    }

    // Drawn last and over everything, because it is the thing you are
    // meant to be looking at.
    if (cut && screen === 'duel') drawCutScene();

    ctx.restore();
  }


// -------------------------------------------------------------------
//  TAPPING
// -------------------------------------------------------------------

  function inBox(mx, my, b) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  }

  function tap(mx, my) {
    // While two monsters are going at it, a tap means "get on with it".
    if (cut && screen === 'duel') { skipCut(); return; }

    if (screen === 'pack') {
      if (revealT > 0.4) screen = 'collection';    // let the reveal land first
      return;
    }

    if (screen === 'collection') {
      // The trade panel is on top of everything, so it answers first.
      if (tradePick) {
        if (inBox(mx, my, tradeYesBox())) { doTrade(); return; }
        tradePick = null;              // anywhere else means "no"
        return;
      }
      if (inBox(mx, my, saveBox())) { save(); savedT = 1.8; return; }
      if (inBox(mx, my, packBox()) && packReady()) { openPack(); return; }
      if (inBox(mx, my, goldBox()) && goldPacks > 0) { openGoldPack(); return; }
      if (inBox(mx, my, playBox()) && totalOwned() > 0) { startDuel(); return; }

      for (let t = 0; t < FINISHES.length; t++) {
        if (inBox(mx, my, tabBox(t))) { setView = t; return; }
      }

      // Tap a monster you have spares of to offer a swap. The set you
      // are looking at decides which pile it comes out of - swap in the
      // shiny set and your plain copies are not quietly spent.
      for (let i = 0; i < CARDS.length; i++) {
        if (!inBox(mx, my, gridSpot(i))) continue;
        const f = pileFor(i);
        if (f < 0) {
          say(own[setView][i] ? 'you need ' + TRADE_COST + ' the same to swap'
                              : 'you have not found that one yet');
          return;
        }
        tradePick = { i: i, f: f };
        return;
      }
      return;
    }

    // ---- in a duel ----
    if (inBox(mx, my, backBox())) { screen = 'collection'; return; }

    if (turn === 'over') {
      if (inBox(mx, my, endBox())) screen = 'collection';
      return;
    }
    if (turn !== 'you') return;

    for (let i = 0; i < you.hand.length; i++) {
      if (inBox(mx, my, handSpot(i, you.hand.length))) {
        picked = (picked === i) ? -1 : i;
        return;
      }
    }
    for (let s = 0; s < SLOTS; s++) {
      if (!inBox(mx, my, slotSpot(true, s))) continue;
      if (picked < 0) { say('pick a monster first'); return; }
      if (you.board[s]) { say('something is already standing there'); return; }
      if (placedThisTurn >= placeAllowance()) {
        say('one monster a turn - tap FIGHT'); return;
      }
      you.board[s] = you.hand[picked];
      you.hand.splice(picked, 1);
      picked = -1;
      placedThisTurn++;
      const left = placeAllowance() - placedThisTurn;
      say(left > 0 ? 'send in ' + left + ' more, or tap FIGHT' : 'now tap FIGHT');
      return;
    }
    if (inBox(mx, my, endBox())) {
      picked = -1;
      startCut(planAttacks(you, them, true), 'them');
    }
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    if (saysT > 0) saysT -= dt;
    if (savedT > 0) savedT -= dt;
    if (youHurt > 0) youHurt -= dt * 2.2;
    if (themHurt > 0) themHurt -= dt * 2.2;
    shineT += dt;
    if (shake > 0) shake -= dt * 1.6;
    if (screen === 'pack') revealT += dt;
    if (screen === 'duel') stepCut(dt);

    for (const side of [you, them]) {
      for (const m of side.board) {
        if (!m) continue;
        if (m.wobble > 0) m.wobble -= dt;
        if (m.justHit > 0) m.justHit -= dt * 2.5;
      }
    }
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt * 40; b.y += b.vy * dt * 40; b.vy += dt * 40;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y -= dt * 34;
    }

    draw();
    requestAnimationFrame(frame);
  }

  load();
  requestAnimationFrame(frame);

</script>
</body>
</html>
