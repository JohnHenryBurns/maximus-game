<script>
// =====================================================================
// THE CUTSCENE.
//
// It runs on its own clock and takes the controls off you for a moment.
// An enormous knight in rust-and-crimson stained armour walks in, picks
// up the gold, and walks off with it. That is WHY there is a map to
// fight across - you are going after him.
// =====================================================================
function startCutscene() {
  cut = { t: 0, x: STAGE_W + 240, depth: 0.62, phase: 'in', said: false };
  screen = 'cutscene';
  held = {};
  tone(70, 1.2, 'sawtooth', 0.14, 45);            // one great doom-laden note
}
function updateCutscene(dt) {
  cut.t += dt;
  const stopAt = chest.x + 120;
  const step = () => Math.floor(cut.t * 2.2) !== Math.floor((cut.t - dt) * 2.2);
  if (cut.phase === 'in') {
    cut.x -= 200 * dt;
    if (step()) { tone(58, 0.17, 'sine', 0.13, 38); shake = Math.max(shake, 8); }
    if (cut.x <= stopAt) { cut.x = stopAt; cut.phase = 'grab'; cut.t = 0; }
  } else if (cut.phase === 'grab') {
    if (cut.t > 0.6) {
      chest.taken = true;
      chest.lift = 0;
      if (!cut.said) { cut.said = true; tone(430, 0.5, 'sawtooth', 0.1, 110); }
    }
    if (cut.t > 2.1) { cut.phase = 'out'; cut.t = 0; }
  } else {
    cut.x += 240 * dt;
    if (step()) tone(58, 0.17, 'sine', 0.1, 38);
    if (cut.x > STAGE_W + 280) { resultTimer = 0; screen = 'cleared'; fanfare(); }
  }
  // the camera watches HIM, not you
  const want = cut.x - canvas.width * 0.55;
  camX += (Math.max(0, Math.min(STAGE_W - canvas.width, want)) - camX) * Math.min(1, dt * 3);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  for (const p of particles) { p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}


// =====================================================================
// ONE STEP OF A FIGHT
// =====================================================================
function keyDown(names) { return names.some(k => held[k]); }

function updateFight(dt) {
  const S = stage();
  const K = hero.K;

  // ---- you ----
  if (!hero.dead) {
    let mx = 0, md = 0;
    if (keyDown(['a', 'ArrowLeft'])) mx -= 1;
    if (keyDown(['d', 'ArrowRight'])) mx += 1;
    if (keyDown(['w', 'ArrowUp'])) md -= 1;
    if (keyDown(['s', 'ArrowDown'])) md += 1;
    const busy = hero.attack > 0;
    const spd = busy ? 0.25 : 1;
    hero.x += mx * HERO_SPEED * spd * dt;
    hero.depth += md * DEPTH_SPEED * spd * dt;
    hero.depth = Math.max(0, Math.min(1, hero.depth));
    hero.x = Math.max(30, Math.min(STAGE_W - 30, hero.x));
    if (mx !== 0 && !busy) hero.face = mx;
    if (mx !== 0 || md !== 0) hero.walkT += dt * 9; else hero.walkT = 0;

    // jumping - and coming down like a hammer if this is a slam
    hero.z += hero.vz * dt;
    if (hero.z > 0) hero.vz -= (hero.slam ? SLAM_DOWN : GRAVITY) * dt;
    if (hero.z <= 0) {
      hero.z = 0;
      hero.vz = 0;
      if (hero.slam) slamImpact();                  // the moment it lands
    }

    hero.slamCool = Math.max(0, hero.slamCool - dt);
    hero.attack = Math.max(0, hero.attack - dt);
    hero.cool = Math.max(0, hero.cool - dt);
    hero.magicCool = Math.max(0, hero.magicCool - dt);
    hero.hurt = Math.max(0, hero.hurt - dt);
    hero.comboTimer = Math.max(0, hero.comboTimer - dt);
    if (hero.comboTimer <= 0) hero.combo = 0;

    // the swing lands halfway through, not the moment you press
    if (hero.attack > 0 && !hero.swung && hero.attack < SWING_TIME * 0.62) {
      hero.swung = true;
      const reach = 62 + hero.combo * 6;
      let landed = false;
      for (const f of foes) {
        if (f.dead) continue;
        if ((f.x - hero.x) * hero.face < -12) continue;   // must be in front
        if (!inRange(hero, f, reach)) continue;
        const crit = rollCrit();
        let dmg = 7 + myPower() * 2 + hero.combo * 2 + weaponDamage();
        if (crit) dmg = Math.round(dmg * CRIT_DAMAGE);
        hurtFoe(f, dmg, (14 + hero.combo * 3) * (crit ? 2.2 : 1), hero, crit);
        if (crit) {
          // a critical is loud: gold sparks, a big shake and a ring
          shake = Math.max(shake, 16);
          boom(f.x, f.depth, f.z + 26, '#ffd83d', 22);
          tone(880, 0.09, 'square', 0.11, 300);
          tone(1320, 0.13, 'square', 0.07);
          critFlash = 0.3;
        }
        landed = true;
      }
      if (landed) {
        hero.combo = Math.min(4, hero.combo + 1);
        hero.comboTimer = 1.1;
        shake = Math.max(shake, 5);
      }
    }
  }

  // ---- them ----
  for (const f of foes) {
    if (f.dead) continue;
    f.hurt = Math.max(0, f.hurt - dt);
    f.guardFlash = Math.max(0, f.guardFlash - dt);
    f.frozen = Math.max(0, f.frozen - dt);
    f.bob += dt * 4;
    if (f.burning > 0) {
      f.burning -= dt;
      f.burnTick = (f.burnTick || 0) + dt;
      if (f.burnTick > 0.45) { f.burnTick = 0; hurtFoe(f, 4 + myPower(), 0, null); }
      if (Math.random() < 0.4) {
        particles.push({ x: f.x + (Math.random() - 0.5) * 20, depth: f.depth, z: f.z + 20,
                         vx: 0, vz: 60, life: 0.4, color: '#ff8b1f' });
      }
    }
    if (f.poisoned > 0) {
      f.poisoned -= dt;
      f.poisonTick = (f.poisonTick || 0) + dt;
      if (f.poisonTick > 0.5) { f.poisonTick = 0; hurtFoe(f, 3 + myPower(), 0, null); }
    }
    // IN THE AIR, having been thrown
    if (f.flying) {
      f.x += f.kvx * dt;
      f.z += f.kvz * dt;
      f.kvz -= 1500 * dt;
      f.tumble += f.spinZ * dt;
      f.kvx *= Math.pow(0.35, dt);                  // the air slows it a little
      f.x = Math.max(20, Math.min(STAGE_W - 20, f.x));
      if (f.z <= 0) {
        // LANDED. A puff of dust, a thump, and now it lies there.
        f.z = 0;
        f.flying = false;
        f.tumble = 0;
        f.down = DOWN_TIME;
        f.kvx *= 0.4;                               // it skids a bit on landing
        tone(120, 0.12, 'sine', 0.07, 60);
        shake = Math.max(shake, 5);
        for (let i = 0; i < 7; i++) {
          particles.push({ x: f.x, depth: f.depth, z: 4,
                           vx: (Math.random() - 0.5) * 120, vz: 40 + Math.random() * 60,
                           life: 0.45, color: '#8a8290' });
        }
      }
      continue;                                     // it can do nothing mid-air
    }
    // and skidding along the floor once it is down
    if (f.kvx !== 0) {
      f.x += f.kvx * dt;
      f.kvx *= Math.pow(0.02, dt);                  // friction stops it quickly
      if (Math.abs(f.kvx) < 8) f.kvx = 0;
      f.x = Math.max(20, Math.min(STAGE_W - 20, f.x));
    }
    // FLAT ON ITS BACK. It lies there, then spends a moment climbing
    // back up, and only then can it come at you again.
    if (f.down > 0) {
      f.down -= dt;
      if (f.down <= 0) { f.down = 0; f.rise = RISE_TIME; }
      continue;
    }
    if (f.rise > 0) {
      f.rise -= dt;
      if (f.rise <= 0) {
        f.rise = 0;
        f.awake = true;                             // and it has NOT forgotten you
        if (Math.random() < 0.35) tone(150 + Math.random() * 90, 0.09, 'square', 0.04);
      }
      continue;
    }
    if (f.frozen > 0) continue;                     // frozen solid, cannot act

    f.cool = Math.max(0, f.cool - dt);
    f.attack = Math.max(0, f.attack - dt);
    if (hero.dead) continue;
    const dx = hero.x - f.x, dd = hero.depth - f.depth;
    // WAKING UP. Until you come near they just stand there, so you meet
    // them a few at a time instead of the whole level charging at once.
    if (!f.awake) {
      if (Math.abs(dx) < canvas.width * 0.55) {
        f.awake = true;
        if (Math.random() < 0.3) tone(200 + Math.random() * 180, 0.07, 'square', 0.04);
      } else {
        f.walkT += dt * 1.2;                       // a bored little shuffle
        continue;
      }
    }
    faceToward(f, hero);
    // AN ARCHER FIGHTS BACKWARDS. It wants a gap between you and it:
    // too close and it retreats, too far and it steps up, and when the
    // gap is right it stands still and hauls the bowstring back.
    if (f.E.ranged) {
      const gap = Math.abs(dx);
      f.aim = Math.max(0, (f.aim || 0) - dt);
      if (f.aim > 0) {
        if (!f.loosed && f.aim < 0.08) { f.loosed = true; shootArrow(f); }
        f.walkT += dt * 1.5;
        continue;                                  // it stands still to shoot
      }
      if (gap < KEEP_AWAY) {                       // you are too close - back off
        f.x -= Math.sign(dx) * f.E.speed * 1.15 * dt;
        if (Math.abs(dd) > 0.03) f.depth -= Math.sign(dd) * DEPTH_SPEED * 0.5 * dt;
        f.walkT += dt * 9;
      } else if (gap > BOW_RANGE) {                // too far to bother - close up
        f.x += Math.sign(dx) * f.E.speed * dt;
        if (Math.abs(dd) > 0.03) f.depth += Math.sign(dd) * DEPTH_SPEED * 0.7 * dt;
        f.walkT += dt * 8;
      } else if (f.cool <= 0) {                    // the gap is right: shoot
        f.aim = AIM_TIME;
        f.loosed = false;
        f.cool = BOW_COOL;
      } else {
        if (Math.abs(dd) > 0.05) f.depth += Math.sign(dd) * DEPTH_SPEED * 0.5 * dt;
        f.walkT += dt * 2.5;                       // shuffling, lining you up
      }
      f.depth = Math.max(0, Math.min(1, f.depth));
      f.x = Math.max(20, Math.min(STAGE_W - 20, f.x));
      continue;
    }
    const close = inRange(f, hero, 46 * weaponOf(f).reach);
    if (!close && f.attack <= 0) {
      // walk towards you, along the floor and up or down it
      const sp = f.E.speed * (f.E.boss ? 1 : 1) * dt;
      if (Math.abs(dx) > 34) f.x += Math.sign(dx) * sp;
      if (Math.abs(dd) > 0.03) f.depth += Math.sign(dd) * DEPTH_SPEED * 0.75 * dt;
      f.depth = Math.max(0, Math.min(1, f.depth));
      f.walkT += dt * 8;
      if (f.E.flies) f.z = 40 + Math.sin(f.bob) * 14;
    } else if (close && f.cool <= 0) {
      f.attack = 0.42;
      f.cool = (1.0 + Math.random() * 0.8) * weaponOf(f).cool;
      f.swung = false;
    }
    if (f.attack > 0 && !f.swung && f.attack < 0.2) {
      f.swung = true;
      const W = weaponOf(f);
      if (inRange(f, hero, 52 * W.reach)) hurtHero(Math.round(f.E.power * W.power));
    }
  }
  updateArrows(dt);
  for (const sp of splats) sp.born = Math.min(1, sp.born + dt * 4);
  // the fallen stay lying there for a few seconds before fading away
  for (const f of foes) if (f.dead) {
    f.deadT = (f.deadT || 0) + dt;
    // Once it is all the way under, a tree comes up out of the hole.
    // treePlanted stops it planting a whole forest on the same spot,
    // one tree per frame, for the rest of the level.
    if (f.deathStyle === 'burrow' && !f.treePlanted && f.deadT >= BURROW_TIME) {
      f.treePlanted = true;
      plantTree(f.x, f.depth, f.look ? f.look.size : 1);
      tone(180, 0.5, 'sine', 0.05, 420);
    }
  }
  // saplings pushing up. about a second from soil to tree.
  for (const p of props) if (p.grow !== undefined && p.grow < 1) {
    p.grow = Math.min(1, p.grow + dt / 1.05);
  }
  foes = foes.filter(f => !f.dead || f.deadT < 4.2);

  // heads that have come off, bouncing about
  for (const h of heads) {
    h.life -= dt;
    h.z += h.vz * dt;
    h.x += h.vx * dt;
    h.angle += h.spin * dt;
    h.vz -= 900 * dt;
    if (h.z <= 0) {
      h.z = 0;
      if (Math.abs(h.vz) > 60) {
        h.vz = -h.vz * 0.42;                    // a bounce
        h.vx *= 0.6;
        h.spin *= 0.5;
        oozeBurst(h.x, h.depth, 6, 3);
        addSplat(h.x, h.depth, 0.55);              // it leaves a mark where it bounced
        tone(300, 0.05, 'square', 0.04);
      } else { h.vz = 0; h.vx *= 0.86; h.spin *= 0.7; }
    }
    // it drips as it goes
    if (Math.random() < 0.14) {
      particles.push({ x: h.x, depth: h.depth, z: h.z + 6, vx: 0, vz: -10,
                       life: 0.7, color: '#4f9e22', ooze: true });
    }
  }
  heads = heads.filter(h => h.life > 0);

  // ---- magic that is still going ----
  for (const m of magics) {
    m.life -= dt;
    if (m.type === 'fire') {
      m.x += m.vx * dt;
      for (const f of foes) {
        if (f.dead || m.hits.includes(f)) continue;
        if (Math.abs(f.x - m.x) < 40 && Math.abs(f.depth - m.depth) < 0.2) {
          m.hits.push(f);
          f.burning = 2.4;
          hurtFoe(f, 8 + myPower(), 8, { x: m.x - m.vx });
        }
      }
      if (Math.random() < 0.8) {
        particles.push({ x: m.x, depth: m.depth, z: 10 + Math.random() * 30,
                         vx: -m.vx * 0.15, vz: 40, life: 0.35, color: '#ff8b1f' });
      }
    } else if (m.type === 'poison') {
      m.tick += dt;
      if (m.tick > 0.5) {
        m.tick = 0;
        for (const f of foes) {
          if (f.dead) continue;
          if (Math.abs(f.x - m.x) < 90 && Math.abs(f.depth - m.depth) < 0.3) {
            f.poisoned = 1.2;
            hurtFoe(f, 3 + myPower(), 0, null);
          }
        }
      }
      if (Math.random() < 0.7) {
        particles.push({ x: m.x + (Math.random() - 0.5) * 150, depth: m.depth,
                         z: Math.random() * 40, vx: 0, vz: 20, life: 0.6, color: '#a6ff5c' });
      }
    }
  }
  magics = magics.filter(m => m.life > 0);

  // ---- is the field clear? ----
  const alive = foes.filter(f => !f.dead).length;
  if (!cleared && alive === 0) {
    clearTimer += dt;
    if (clearTimer > 0.8) {
      cleared = true;
      if (!isBeaten(fightLevel.id)) save.beaten.push(fightLevel.id);
      save.xp += gainedXP;
      saveGame();
      // a level with a cutscene plays it before the CLEARED screen
      if (fightLevel.cutscene && chest && !chest.taken) startCutscene();
      else { resultTimer = 0; screen = 'cleared'; fanfare(); }
    }
  }
  // the chest bobs about, waiting
  if (chest) chest.bob += dt * 2.4;

  // ---- the camera follows you, but never past the ends ----
  const want = hero.x - S.W * 0.42;
  camX += (Math.max(0, Math.min(STAGE_W - S.W, want)) - camX) * Math.min(1, dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  if (critFlash > 0) critFlash = Math.max(0, critFlash - dt);
  if (wave) { wave.t -= dt; if (wave.t <= 0) wave = null; }

  for (const p of particles) {
    p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.z += 46 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}
</script>
<script>
// =====================================================================
// DRAWING PEOPLE
// =====================================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// a shadow on the floor, right under whoever it belongs to. This is what
// tells you where somebody really IS when they have jumped.
function drawShadow(sx, floorY, sc, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, floorY, r * sc * 1.05, r * sc * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawKnight(a, sx, sy, sc) {
  const K = a.K, r = 20 * sc;
  const wob = Math.sin(a.walkT) * r * 0.12;
  ctx.save();
  ctx.translate(sx, sy);
  // coming down out of a slam: stretched tall, like a falling hammer
  if (a.slam && a.vz < 0) ctx.scale(0.86, 1.16);
  if (a.hurt > 0 && Math.floor(a.hurt * 22) % 2) ctx.globalAlpha = 0.5;
  // the sword, swung in an arc
  const swing = a.attack > 0 ? (1 - a.attack / SWING_TIME) : 0;
  if (a.slam) {
    // both hands on the hilt, sword raised straight over his head
    ctx.save();
    ctx.translate(0, -r * 1.9);
    ctx.fillStyle = '#d8dde6';
    roundRect(-r * 0.14, -r * 2.0, r * 0.28, r * 2.0, r * 0.1);
    ctx.fill();
    ctx.fillStyle = K.trim;
    roundRect(-r * 0.34, -r * 0.18, r * 0.68, r * 0.26, r * 0.08);
    ctx.fill();
    ctx.restore();
  } else if (a.attack > 0) {
    ctx.save();
    ctx.translate(a.face * r * 0.7, -r * 0.9);
    ctx.rotate(a.face * (-1.1 + swing * 2.4));
    ctx.fillStyle = (shopItem(save.weapon) || {}).blade || '#d8dde6';
    roundRect(-r * 0.12, -r * 1.9, r * 0.24, r * 1.9, r * 0.1);
    ctx.fill();
    ctx.fillStyle = K.trim;
    roundRect(-r * 0.3, -r * 0.16, r * 0.6, r * 0.24, r * 0.08);
    ctx.fill();
    ctx.restore();
  }
  // legs
  ctx.fillStyle = K.dark;
  for (const side of [-1, 1]) {
    const lift = Math.sin(a.walkT + (side > 0 ? Math.PI : 0)) * r * 0.22;
    roundRect(side * r * 0.34 - r * 0.16, -r * 0.5, r * 0.32, r * 0.62 + lift, r * 0.1);
    ctx.fill();
  }
  // body
  ctx.fillStyle = K.body;
  roundRect(-r * 0.55, -r * 1.6 + wob, r * 1.1, r * 1.15, r * 0.28);
  ctx.fill();
  ctx.fillStyle = K.trim;                            // the belt
  ctx.fillRect(-r * 0.55, -r * 0.66 + wob, r * 1.1, r * 0.16);
  // helmet
  ctx.fillStyle = K.body;
  ctx.beginPath();
  ctx.arc(0, -r * 1.95 + wob, r * 0.62, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.62, -r * 1.95 + wob, r * 1.24, r * 0.5);
  ctx.fillStyle = '#1a1220';                          // the visor slit
  ctx.fillRect(-r * 0.42 + a.face * r * 0.08, -r * 1.85 + wob, r * 0.84, r * 0.2);
  ctx.fillStyle = K.trim;                             // the plume
  ctx.beginPath();
  ctx.moveTo(0, -r * 2.55 + wob);
  ctx.lineTo(-a.face * r * 0.5, -r * 2.1 + wob);
  ctx.lineTo(0, -r * 2.15 + wob);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawChest(sx, sy, sc, c) {
  const w = 78 * sc, h = 52 * sc;
  const bob = Math.sin(c.bob) * 3 * sc;
  ctx.save();
  ctx.translate(sx, sy - c.lift * 90 * sc + bob);
  // the pile of gold spilling out of it
  ctx.fillStyle = '#ffd83d';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * w * 0.42, -h * 0.72 + Math.sin(a) * h * 0.18, w * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#8a5a2a';                       // the box
  roundRect(-w / 2, -h, w, h, w * 0.07); ctx.fill();
  ctx.fillStyle = '#6b4420';
  roundRect(-w / 2, -h * 0.42, w, h * 0.42, w * 0.05); ctx.fill();
  ctx.fillStyle = '#c9a227';                       // the bands
  ctx.fillRect(-w / 2, -h * 0.5, w, h * 0.12);
  ctx.fillRect(-w * 0.09, -h, w * 0.18, h);
  ctx.fillStyle = '#ffe07a';                       // the lock
  roundRect(-w * 0.09, -h * 0.55, w * 0.18, h * 0.24, 3); ctx.fill();
  ctx.restore();
  // a glow, so you can see it from across the level
  ctx.fillStyle = 'rgba(255,216,61,0.16)';
  ctx.beginPath();
  ctx.ellipse(sx, sy - c.lift * 90 * sc, w * 0.9, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

// The one who takes the gold. Enormous, dark, and his armour is stained
// rust-red - it is the same trick every villain uses: make him the same
// shape as you but far too big.
function drawBaron(sx, sy, sc, phase, t) {
  const r = 30 * sc;
  const walk = phase === 'grab' ? 0 : t * 7;
  const wob = Math.sin(walk) * r * 0.1;
  ctx.save();
  ctx.translate(sx, sy);
  // legs
  ctx.fillStyle = '#3a2028';
  for (const side of [-1, 1]) {
    const lift = Math.sin(walk + (side > 0 ? Math.PI : 0)) * r * 0.26;
    roundRect(side * r * 0.38 - r * 0.2, -r * 0.6, r * 0.4, r * 0.75 + lift, r * 0.1);
    ctx.fill();
  }
  // body, with the stains
  ctx.fillStyle = '#4a3038';
  roundRect(-r * 0.72, -r * 1.95 + wob, r * 1.44, r * 1.45, r * 0.3); ctx.fill();
  ctx.fillStyle = '#7d1f28';
  ctx.beginPath();
  ctx.ellipse(-r * 0.2, -r * 1.35 + wob, r * 0.34, r * 0.5, 0.4, 0, Math.PI * 2);
  ctx.ellipse(r * 0.34, -r * 1.7 + wob, r * 0.22, r * 0.3, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // SHOULDERS, ARMS AND HANDS. He reaches down for the gold while he is
  // grabbing it and holds it up as he leaves, so the arms have to move.
  const reach = phase === 'grab' ? Math.min(1, t * 1.6) : 0;
  const carry = phase === 'out' ? 1 : 0;
  for (const side of [-1, 1]) {
    const sx2 = side * r * 0.82, sy2 = -r * 1.75 + wob;
    // the upper arm swings down when he reaches, and stays up carrying
    const elbowA = reach * 0.9 - carry * 0.5 + Math.sin(walk + (side > 0 ? Math.PI : 0)) * 0.18;
    const ex2 = sx2 + side * Math.sin(elbowA) * r * 0.62;
    const ey2 = sy2 + Math.cos(elbowA) * r * 0.62;
    ctx.strokeStyle = '#4a3038';
    ctx.lineWidth = r * 0.34;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx2, sy2);
    ctx.lineTo(ex2, ey2);
    ctx.stroke();
    // the forearm, bending in towards the middle when he lifts
    const handA = elbowA + reach * 0.7 - carry * 0.9;
    const hx = ex2 + side * Math.sin(handA) * r * 0.5 - side * carry * r * 0.3;
    const hy2 = ey2 + Math.cos(handA) * r * 0.5;
    ctx.lineWidth = r * 0.28;
    ctx.beginPath();
    ctx.moveTo(ex2, ey2);
    ctx.lineTo(hx, hy2);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // the shoulder plate, over the top of the arm joint
    ctx.fillStyle = '#5a3a44';
    ctx.beginPath();
    ctx.arc(sx2, sy2, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7d1f28';
    ctx.beginPath();
    ctx.arc(sx2 + side * r * 0.1, sy2 - r * 0.1, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // THE HAND: a palm with four fingers and a thumb, spread when
    // reaching and curled shut once he has hold of the chest
    ctx.save();
    ctx.translate(hx, hy2);
    ctx.rotate(side * (handA + 0.2));
    ctx.fillStyle = '#3a2028';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.19, r * 0.23, 0, 0, Math.PI * 2);   // the palm
    ctx.fill();
    const curl = carry ? 1 : (1 - reach);                        // open, then closed
    for (let i = 0; i < 4; i++) {
      const spread = (i - 1.5) * 0.28;
      const len = r * (0.26 - curl * 0.11) * (i === 3 ? 0.82 : 1);
      ctx.strokeStyle = '#3a2028';
      ctx.lineWidth = r * 0.085;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(Math.sin(spread) * r * 0.14, r * 0.16);
      ctx.lineTo(Math.sin(spread) * r * 0.3, r * 0.16 + len);
      ctx.stroke();
    }
    // the thumb, off to one side
    ctx.beginPath();
    ctx.moveTo(-side * r * 0.16, r * 0.02);
    ctx.lineTo(-side * r * 0.3, r * 0.16 - curl * r * 0.06);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }
  // helmet, with a red glow where the eyes are
  ctx.fillStyle = '#3a2028';
  ctx.beginPath();
  ctx.arc(0, -r * 2.4 + wob, r * 0.7, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.7, -r * 2.4 + wob, r * 1.4, r * 0.62);
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(-r * 0.44, -r * 2.28 + wob, r * 0.3, r * 0.16);
  ctx.fillRect(r * 0.14, -r * 2.28 + wob, r * 0.3, r * 0.16);
  ctx.fillStyle = '#7d1f28';                       // a torn plume
  ctx.beginPath();
  ctx.moveTo(0, -r * 3.15 + wob);
  ctx.lineTo(r * 0.6, -r * 2.6 + wob);
  ctx.lineTo(0, -r * 2.65 + wob);
  ctx.closePath(); ctx.fill();
  // an enormous sword, over the shoulder
  ctx.save();
  ctx.translate(-r * 0.95, -r * 1.7 + wob);
  ctx.rotate(-0.5);
  ctx.fillStyle = '#8c9099';
  roundRect(-r * 0.17, -r * 2.5, r * 0.34, r * 2.5, r * 0.06); ctx.fill();
  ctx.fillStyle = '#7d1f28';
  roundRect(-r * 0.14, -r * 2.4, r * 0.1, r * 1.6, r * 0.04); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// SIX-EYED HORNED GOBLINS. A hooded brown cloak with nothing but a
// shadow inside it, six little eyes glowing out of the dark, and a pair
// of horns curving up out of the hood. The eyes blink out of step with
// each other, which is what stops it looking like a printed pattern.
function drawGoblin(f, r, headless) {
  const E = f.E;
  const L = f.look || rollLook();                  // its own colours and shapes
  r = r * L.size;                                  // and its own size
  const wob = Math.sin(f.walkT) * r * 0.09;
  const hy = -r * 1.62 + wob;                      // where the head sits
  // bare green feet under the cloak
  ctx.fillStyle = L.skinDark;
  for (const side of [-1, 1]) {
    const lift = Math.sin(f.walkT + (side > 0 ? Math.PI : 0)) * r * 0.16;
    roundRect(side * r * 0.28 - r * 0.13, -r * 0.24 + lift, r * 0.26, r * 0.26, r * 0.08);
    ctx.fill();
  }
  // the cloak: a bell with a torn hem, worn on the body only
  ctx.fillStyle = L.cloak;
  ctx.beginPath();
  ctx.moveTo(-r * 0.44, hy + r * 0.5);
  ctx.quadraticCurveTo(-r * 0.95, -r * 0.5, -r * 0.86, 0);
  for (let i = 0; i <= 6; i++) {                   // the ragged bottom edge
    const t = i / 6;
    ctx.lineTo(-r * 0.86 + t * r * 1.72, (i % 2 ? r * 0.06 : -r * 0.08));
  }
  ctx.quadraticCurveTo(r * 0.95, -r * 0.5, r * 0.44, hy + r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = L.cloakDark;                     // a shadowed fold down the middle
  ctx.beginPath();
  ctx.moveTo(-r * 0.1, hy + r * 0.55);
  ctx.lineTo(r * 0.1, hy + r * 0.55);
  ctx.lineTo(r * 0.16, 0);
  ctx.lineTo(-r * 0.16, 0);
  ctx.closePath();
  ctx.fill();
  // green arms coming out of the cloak
  ctx.fillStyle = L.skin;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(side * r * 0.62, hy + r * 0.75, r * 0.17, r * 0.3, side * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  if (headless) {
    // the head has gone: a green stump where the neck was, dripping
    ctx.fillStyle = L.skinDark;
    ctx.beginPath();
    ctx.ellipse(0, hy + r * 0.42, r * 0.3, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4f9e22';
    for (let i = 0; i < 3; i++) {
      const dx = (i - 1) * r * 0.18;
      ctx.beginPath();
      ctx.ellipse(dx, hy + r * 0.52 + Math.sin(f.deadT * 3 + i) * r * 0.06,
                  r * 0.07, r * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    return;                                     // no horns, no mask, no eyes
  }
  // SHARP HORNS. Filled shapes that taper to a point rather than a
  // stroked line, because a line has the same width all the way along
  // and can never actually be sharp.
  for (const side of [-1, 1]) {
    // one in three has had a horn snapped off in a fight
    const stub = L.horns === 2 && side === (L.seed > 50 ? 1 : -1);
    const len = stub ? 0.42 : 1;
    // 0 curls outward, 1 goes almost straight up, 2 is the snapped pair
    const out = L.horns === 1 ? 0.62 : 1.02;
    const tipX = L.horns === 1 ? 0.42 : 0.86;
    ctx.fillStyle = '#d8cfb4';
    ctx.beginPath();
    ctx.moveTo(side * r * 0.26, hy - r * 0.16);
    ctx.quadraticCurveTo(side * r * out, hy - r * 0.44 * len,
                         side * r * tipX, hy - r * 1.24 * len);
    ctx.quadraticCurveTo(side * r * tipX, hy - r * 0.5 * len,
                         side * r * 0.5, hy - r * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.moveTo(side * r * 0.42, hy - r * 0.12);
    ctx.quadraticCurveTo(side * r * (out - 0.12), hy - r * 0.5 * len,
                         side * r * tipX, hy - r * 1.24 * len);
    ctx.quadraticCurveTo(side * r * (tipX - 0.06), hy - r * 0.52 * len,
                         side * r * 0.52, hy - r * 0.08);
    ctx.closePath();
    ctx.fill();
    if (stub) {                                    // a ragged snapped end
      ctx.fillStyle = '#a89e84';
      ctx.beginPath();
      ctx.ellipse(side * r * tipX, hy - r * 1.24 * len, r * 0.11, r * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // THE HEAD: green, out in the open, no hood
  ctx.fillStyle = L.skin;
  ctx.beginPath();
  ctx.ellipse(0, hy, r * 0.66, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = L.skinDark;                      // the underside, in shadow
  ctx.beginPath();
  ctx.ellipse(0, hy + r * 0.3, r * 0.55, r * 0.22, 0, 0, Math.PI);
  ctx.fill();
  // THE IRON MASK. A slab of dark metal bolted over the face, with six
  // holes punched in it. No mouth, no ears - just the eyes burning
  // through, which is why they had to be drawn before the mask goes on.
  const ex = f.face * r * 0.05;
  const eyeAt = (row, col) => ({
    x: ex + (col - 1) * r * 0.3,
    y: hy - r * 0.18 + row * r * 0.3,
  });
  // the glow behind the holes, so the light looks like it comes from
  // inside the head rather than being painted on the front
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const p = eyeAt(row, col);
      const blink = Math.sin(f.bob * 1.3 + (row * 3 + col) * 2.1);
      const open = blink > -0.86 ? 1 : 0.1;
      // dark first, so a blinking eye shows the shadow INSIDE the head
      // rather than a green hole through to its skin
      ctx.fillStyle = '#120c06';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.125, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,60,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r * 0.13, r * 0.13 * open, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = L.eyes;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r * 0.085, r * 0.085 * open, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the mask itself, with the eye holes cut out of it
  ctx.save();
  ctx.beginPath();
  ctx.rect(-r, hy - r, r * 2, r * 2);                        // the mask area
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const p = eyeAt(row, col);
      ctx.moveTo(p.x + r * 0.115, p.y);
      ctx.arc(p.x, p.y, r * 0.115, 0, Math.PI * 2, true);    // punched out
    }
  }
  ctx.clip('evenodd');
  ctx.fillStyle = '#4a525a';                                 // dark iron
  if (L.mask === 1) {
    // squared off, like a plate hammered flat
    roundRect(-r * 0.66, hy - r * 0.56, r * 1.32, r * 1.22, r * 0.12);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.ellipse(0, hy + r * 0.04, r * 0.68, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#333a41';                                 // shadowed lower half
  ctx.beginPath();
  ctx.ellipse(0, hy + r * 0.32, r * 0.66, r * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
  if (L.mask === 2) {
    // banded across, rather than ridged down the middle
    ctx.fillStyle = '#5e6870';
    ctx.fillRect(-r * 0.7, hy - r * 0.34, r * 1.4, r * 0.1);
    ctx.fillRect(-r * 0.7, hy + r * 0.14, r * 1.4, r * 0.1);
  } else {
    ctx.fillStyle = '#5e6870';                               // a ridge down the middle
    ctx.fillRect(-r * 0.055, hy - r * 0.58, r * 0.11, r * 1.18);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.09)';                  // a highlight along the top
  ctx.beginPath();
  ctx.ellipse(-r * 0.16, hy - r * 0.3, r * 0.36, r * 0.14, -0.3, 0, Math.PI * 2);
  ctx.fill();
  if (L.cracked) {
    // a split across the iron, from some earlier fight
    ctx.strokeStyle = '#232830';
    ctx.lineWidth = Math.max(1.4, r * 0.055);
    ctx.beginPath();
    ctx.moveTo(-r * 0.62, hy - r * 0.1 + (L.seed % 3) * r * 0.1);
    ctx.lineTo(-r * 0.12, hy + r * 0.16);
    ctx.lineTo(r * 0.2, hy - r * 0.06);
    ctx.lineTo(r * 0.64, hy + r * 0.2);
    ctx.stroke();
  }
  ctx.restore();
  // rivets, right round the rim - not all of them have the same number
  ctx.fillStyle = '#7d868e';
  for (let i = 0; i < L.rivets; i++) {
    const a = (i / L.rivets) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.58, hy + r * 0.04 + Math.sin(a) * r * 0.53, r * 0.045, 0, Math.PI * 2);
    ctx.fill();
  }
  // whatever it is carrying, held out to the side and pointing away so
  // it never swings across its own face
  const sw = f.attack > 0 ? 1 - f.attack / 0.42 : 0;
  ctx.save();
  ctx.translate(f.face * r * 0.72, -r * 0.78 + wob);
  ctx.rotate(f.face * (0.5 + sw * 1.6));
  drawWeapon(f.weapon, r);
  ctx.restore();

  // THE SHIELD, on the arm nearest you. It comes UP when it is guarding
  // and drops out of the way while it swings - so you can see when it is
  // safe to hit, which is the whole point of it.
  if (f.E.shield) {
    const up = guarding(f) ? 1 : 0.25;
    ctx.save();
    ctx.translate(-f.face * r * 0.62, -r * (0.55 + up * 0.5) + wob);
    ctx.rotate(-f.face * (1 - up) * 0.9);
    const shR = r * 0.62;
    ctx.fillStyle = f.guardFlash > 0 ? '#dff0ff' : '#6f7a86';
    ctx.beginPath();
    ctx.moveTo(0, -shR);
    ctx.lineTo(shR * 0.82, -shR * 0.5);
    ctx.lineTo(shR * 0.82, shR * 0.36);
    ctx.lineTo(0, shR);
    ctx.lineTo(-shR * 0.82, shR * 0.36);
    ctx.lineTo(-shR * 0.82, -shR * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3f464e';
    ctx.lineWidth = Math.max(2, r * 0.06);
    ctx.stroke();
    ctx.fillStyle = '#8d959d';                     // the boss in the middle
    ctx.beginPath();
    ctx.arc(0, 0, shR * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a525a';
    ctx.beginPath();
    ctx.arc(0, 0, shR * 0.15, 0, Math.PI * 2);
    ctx.fill();
    if (f.guardFlash > 0) {                        // it rings when struck
      ctx.strokeStyle = 'rgba(207,232,255,' + (f.guardFlash / 0.22) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, shR * (1.1 + (1 - f.guardFlash / 0.22) * 0.7), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// Each weapon draws itself, standing at the handle and pointing up. So
// the goblin only has to say where its hand is and which way it is
// swinging, and this does the rest.
function drawWeapon(kind, r) {
  if (kind === 'axe') {
    // a heavy wooden haft with a big curved iron head
    ctx.fillStyle = '#6b4f26';
    roundRect(-r * 0.07, -r * 0.86, r * 0.14, r * 0.86, r * 0.05);
    ctx.fill();
    ctx.fillStyle = '#9aa3ac';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.86);
    ctx.quadraticCurveTo(r * 0.52, -r * 0.92, r * 0.44, -r * 0.44);
    ctx.lineTo(0, -r * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c8d0d8';                       // the sharpened edge
    ctx.beginPath();
    ctx.moveTo(r * 0.02, -r * 0.86);
    ctx.quadraticCurveTo(r * 0.52, -r * 0.92, r * 0.44, -r * 0.44);
    ctx.quadraticCurveTo(r * 0.4, -r * 0.62, r * 0.05, -r * 0.74);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4a4f55';                       // the binding
    ctx.fillRect(-r * 0.09, -r * 0.6, r * 0.18, r * 0.1);
  } else if (kind === 'sword') {
    // a long thin blade, longest reach of the three
    ctx.fillStyle = '#3a2c1c';                       // the grip
    roundRect(-r * 0.05, -r * 0.22, r * 0.1, r * 0.28, r * 0.04);
    ctx.fill();
    ctx.fillStyle = '#8a6a3a';                       // the crossguard
    roundRect(-r * 0.24, -r * 0.28, r * 0.48, r * 0.09, r * 0.03);
    ctx.fill();
    ctx.fillStyle = '#b9c2cb';                       // the blade
    ctx.beginPath();
    ctx.moveTo(-r * 0.09, -r * 0.28);
    ctx.lineTo(r * 0.09, -r * 0.28);
    ctx.lineTo(r * 0.05, -r * 1.12);
    ctx.lineTo(0, -r * 1.24);                        // the point
    ctx.lineTo(-r * 0.05, -r * 1.12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e2e8ee';                       // a shine down one side
    ctx.beginPath();
    ctx.moveTo(-r * 0.07, -r * 0.3);
    ctx.lineTo(-r * 0.02, -r * 0.3);
    ctx.lineTo(-r * 0.02, -r * 1.1);
    ctx.lineTo(-r * 0.05, -r * 1.06);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffd83d';                       // a little pommel
    ctx.beginPath();
    ctx.arc(0, r * 0.06, r * 0.07, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // the club: a lump of wood with studs hammered into it
    ctx.fillStyle = '#8a6a3a';
    roundRect(-r * 0.08, -r * 0.84, r * 0.16, r * 0.84, r * 0.06);
    ctx.fill();
    ctx.fillStyle = '#6b4f26';
    ctx.beginPath();
    ctx.arc(0, -r * 0.86, r * 0.19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a8aeb4';
    for (let i = 0; i < 4; i++) {
      const a2 = (i / 4) * Math.PI * 2 + 0.5;
      ctx.beginPath();
      ctx.arc(Math.cos(a2) * r * 0.11, -r * 0.86 + Math.sin(a2) * r * 0.11, r * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFoe(f, sx, sy, sc) {
  const E = f.E, r = f.r * sc;
  ctx.save();
  ctx.translate(sx, sy);
  if (f.dead) {
    // THE FALLEN. It tips over onto the ground over a quarter of a
    // second, lies there, then fades out at the end.
    // BURROWING. It pulls its roots in and drags itself under. We clip
    // to everything ABOVE the ground line first, so the half that has
    // gone down is genuinely cut off instead of drawn on the grass.
    if (f.deathStyle === 'burrow') {
      const sink = Math.min(1, f.deadT / BURROW_TIME);
      if (sink >= 1) { ctx.restore(); return; }       // all the way under
      ctx.beginPath();
      ctx.rect(-r * 4, -r * 12, r * 8, r * 12);
      ctx.clip();
      ctx.translate(0, sink * r * 3.2);               // down it goes
      ctx.rotate(Math.sin(f.deadT * 22) * 0.06);      // wriggling as it digs
      drawFoeBody(f, r, false);
      ctx.restore();
      return;
    }
    const tip = Math.min(1, f.deadT / 0.28);
    ctx.rotate((f.fallDir || 1) * tip * Math.PI * 0.5);
    ctx.globalAlpha = f.deadT > 3.4 ? Math.max(0, 1 - (f.deadT - 3.4) / 0.8) : 1;
    // the head is gone on a popped one, so draw the body only
    if (f.deathStyle === 'pop') {
      drawFoeBody(f, r, true);
      ctx.restore();
      return;
    }
  }
  if (f.flying) {
    ctx.rotate(f.tumble || 0);                      // head over heels
  } else if (f.down > 0 || f.rise > 0) {
    // flat on its back, then hauling itself upright again
    const tipped = f.down > 0 ? 1 : (f.rise / RISE_TIME);
    ctx.rotate((f.fallDir || 1) * tipped * Math.PI * 0.46);
    // little puffs of dust while it is on the floor
    if (f.down > 0 && Math.random() < 0.05) {
      particles.push({ x: f.x, depth: f.depth, z: 4, vx: (Math.random() - 0.5) * 30,
                       vz: 24, life: 0.4, color: '#8a8290' });
    }
  }
  if (f.hurt > 0) ctx.globalAlpha = 0.65;
  const wob = Math.sin(f.walkT) * r * 0.1;
  drawFoeBody(f, r, false);
  ctx.globalAlpha = 1;
  // frozen solid: a block of ice over the top
  if (f.frozen > 0) {
    ctx.fillStyle = 'rgba(127, 228, 255, 0.45)';
    roundRect(-r * 0.9, -r * 2.2, r * 1.8, r * 2.3, r * 0.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(220, 250, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
  // a little health bar over anybody who has been hit
  if (!f.dead && f.health < f.maxHealth) {
    const w = r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(sx - w / 2, sy - r * 2.9, w, 5);
    ctx.fillStyle = f.E.boss ? '#ff4d6a' : '#7fdf3f';
    ctx.fillRect(sx - w / 2 + 1, sy - r * 2.9 + 1, (w - 2) * Math.max(0, f.health / f.maxHealth), 3);
  }
}

// The body itself. headless is true when the head has popped off, in
// which case we leave a green stump where the neck was.
// Broken stone and burning floor. Each one draws itself standing at its
// own feet, so the stage code only has to say where it is.
// A puddle of goo. Its wobbly outline comes from its own seed, so the
// same puddle keeps the same shape rather than rippling every frame.
function drawSplat(sp, sc) {
  const r = 18 * sc * sp.size * sp.born;
  ctx.fillStyle = 'rgba(63,140,30,0.75)';
  ctx.beginPath();
  for (let i = 0; i <= 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const wob = 0.72 + (Math.sin(sp.seed + i * 2.7) * 0.5 + 0.5) * 0.55;
    const x = Math.cos(a) * r * 1.35 * wob;
    const y = Math.sin(a) * r * 0.44 * wob;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(127,223,63,0.6)';                // a brighter middle
  ctx.beginPath();
  ctx.ellipse(-r * 0.15, -r * 0.06, r * 0.6, r * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // a couple of drops flung off to one side
  for (let i = 0; i < 3; i++) {
    const a = sp.seed + i * 2.1;
    ctx.fillStyle = 'rgba(63,140,30,0.65)';
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * r * 1.9, Math.sin(a) * r * 0.6,
                r * 0.16, r * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// A knight who did not make it, lying on his back with his sword stuck
// in the floor beside him. He is on YOUR side - that is the point of
// him being there.
//
// His MAGIC is leaking out. A red knight seeps embers, blue seeps
// frost, green seeps poison, orange seeps sparks - each in his own
// colour, pooling on the floor and running out of the cracks in his
// armour. It says the same thing a wound would and looks better doing
// it, because it is the thing that made him a knight draining away.
function drawFallenKnight(p, sc) {
  const K = KNIGHTS[p.knight];
  const r = 17 * sc;
  const t = Date.now() / 1000;
  const GREY = '#8d939c', GREY_DARK = '#5c626b', BLUE = '#2f6ac0', BLUE_DARK = '#1c4380';

  // the pool of magic he has leaked, breathing slowly
  const pulse = 0.82 + Math.sin(t * 1.6 + p.seed) * 0.18;
  ctx.fillStyle = K.magicColor;
  ctx.globalAlpha = 0.2 * pulse;
  ctx.beginPath();
  ctx.ellipse(p.lean * r * 0.3, r * 0.1, r * 2.3 * pulse, r * 0.8 * pulse, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 0.42;
  ctx.beginPath();
  for (let i = 0; i <= 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const wob = 0.7 + (Math.sin(p.seed + i * 2.4) * 0.5 + 0.5) * 0.6;
    ctx.lineTo(p.lean * r * 0.3 + Math.cos(a) * r * 1.5 * wob,
               r * 0.1 + Math.sin(a) * r * 0.5 * wob);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.rotate(p.lean * Math.PI * 0.5);              // lying flat on his back
  // legs, in grey plate
  ctx.fillStyle = GREY_DARK;
  for (const side of [-1, 1]) {
    roundRect(side * r * 0.34 - r * 0.16, -r * 0.5, r * 0.32, r * 0.66, r * 0.1);
    ctx.fill();
  }
  // the breastplate
  ctx.fillStyle = GREY;
  roundRect(-r * 0.55, -r * 1.6, r * 1.1, r * 1.15, r * 0.28);
  ctx.fill();
  ctx.fillStyle = GREY_DARK;                       // the shaded lower half
  roundRect(-r * 0.55, -r * 1.0, r * 1.1, r * 0.55, r * 0.2);
  ctx.fill();
  ctx.fillStyle = '#a9b0b8';                       // a highlight down one edge
  roundRect(-r * 0.55, -r * 1.6, r * 0.26, r * 1.15, r * 0.2);
  ctx.fill();
  ctx.fillStyle = BLUE_DARK;                       // a blue belt to match the helm
  ctx.fillRect(-r * 0.55, -r * 0.72, r * 1.1, r * 0.16);
  // the blue helmet
  ctx.fillStyle = BLUE;
  ctx.beginPath();
  ctx.arc(0, -r * 1.95, r * 0.62, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.62, -r * 1.95, r * 1.24, r * 0.5);
  ctx.fillStyle = BLUE_DARK;
  ctx.fillRect(-r * 0.62, -r * 1.6, r * 1.24, r * 0.16);
  ctx.fillStyle = '#100a14';                       // the visor, dark and shut
  ctx.fillRect(-r * 0.42, -r * 1.85, r * 0.84, r * 0.2);
  ctx.fillStyle = '#4d8ade';                       // a shine on the dome
  ctx.beginPath();
  ctx.ellipse(-r * 0.2, -r * 2.1, r * 0.22, r * 0.1, -0.4, 0, Math.PI * 2);
  ctx.fill();

  // WHAT GOT LEFT IN HIM. Buried in the breastplate, with the plate
  // dented and split around it - it is the armour that took the blow.
  ctx.save();
  ctx.translate(r * 0.1, -r * 1.15);
  ctx.rotate(0.42);
  ctx.fillStyle = '#3f454c';                       // the split in the plate
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, r * 0.1);
  ctx.lineTo(-r * 0.08, -r * 0.14);
  ctx.lineTo(r * 0.3, r * 0.06);
  ctx.lineTo(r * 0.06, r * 0.22);
  ctx.closePath();
  ctx.fill();
  if (p.stuck === 'axe') {
    ctx.fillStyle = '#6b4f26';                     // the haft, sticking up
    roundRect(-r * 0.07, -r * 1.5, r * 0.14, r * 1.5, r * 0.05);
    ctx.fill();
    ctx.fillStyle = '#9aa3ac';                     // the head, half buried
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.5);
    ctx.quadraticCurveTo(r * 0.5, -r * 1.56, r * 0.42, -r * 1.1);
    ctx.lineTo(0, -r * 1.18);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c8d0d8';
    ctx.beginPath();
    ctx.moveTo(r * 0.02, -r * 1.5);
    ctx.quadraticCurveTo(r * 0.5, -r * 1.56, r * 0.42, -r * 1.1);
    ctx.quadraticCurveTo(r * 0.38, -r * 1.28, r * 0.05, -r * 1.38);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = '#b9c2cb';                     // a blade going in
    ctx.beginPath();
    ctx.moveTo(-r * 0.08, r * 0.05);
    ctx.lineTo(r * 0.08, r * 0.05);
    ctx.lineTo(r * 0.05, -r * 1.25);
    ctx.lineTo(-r * 0.05, -r * 1.25);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e2e8ee';
    ctx.fillRect(-r * 0.06, -r * 1.2, r * 0.035, r * 1.16);
    ctx.fillStyle = '#8a6a3a';                     // the crossguard
    roundRect(-r * 0.26, -r * 1.44, r * 0.52, r * 0.1, r * 0.03);
    ctx.fill();
    ctx.fillStyle = '#3a2c1c';                     // the grip
    roundRect(-r * 0.06, -r * 1.72, r * 0.12, r * 0.3, r * 0.04);
    ctx.fill();
    ctx.fillStyle = '#ffd83d';                     // the pommel
    ctx.beginPath();
    ctx.arc(0, -r * 1.78, r * 0.09, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  // his own sword, driven into the floor beside him
  ctx.save();
  ctx.translate(p.lean * r * 1.6, 0);
  ctx.rotate(p.lean * 0.16);
  ctx.fillStyle = '#8a9099';
  roundRect(-r * 0.07, -r * 1.55, r * 0.14, r * 1.55, r * 0.05);
  ctx.fill();
  ctx.fillStyle = BLUE;
  roundRect(-r * 0.3, -r * 1.62, r * 0.6, r * 0.14, r * 0.05);
  ctx.fill();
  ctx.fillStyle = BLUE_DARK;
  ctx.beginPath();
  ctx.arc(0, -r * 1.78, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // magic seeping out of the split in the plate, and a wisp rising
  ctx.fillStyle = K.magicColor;
  for (let i = 0; i < 3; i++) {
    const phase = (t * 0.55 + i * 0.37 + p.seed) % 1;
    ctx.globalAlpha = 0.75 * (1 - phase);
    ctx.beginPath();
    ctx.ellipse(p.lean * r * (0.5 + i * 0.42), -r * 0.9 + phase * r * 0.95,
                r * 0.11, r * 0.17, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.3;
  for (let i = 0; i < 2; i++) {
    const rise = (t * 0.4 + i * 0.5 + p.seed) % 1;
    ctx.beginPath();
    ctx.arc(p.lean * r * 0.2 + Math.sin(rise * 6 + i) * r * 0.3,
            -r * 0.6 - rise * r * 2.2, r * 0.16 * (1 - rise), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawProp(p, sc, t) {
  const r = 16 * sc * p.size;
  if (p.kind === 'fallen') { drawFallenKnight(p, sc); return; }
  if (p.kind === 'fire') {
    // a fire burning on the ground: three tongues of flame, each on its
    // own wobble, so it never looks like a repeating pattern
    const glow = 0.7 + Math.sin(t * 5 + p.seed) * 0.3;
    ctx.fillStyle = 'rgba(255,150,40,' + (0.1 + glow * 0.09) + ')';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.4, r * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a1a12';                          // scorched floor
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * r * 0.5;
      const wob = Math.sin(t * 7 + p.seed + i * 2.1);
      const h = r * (1.5 + wob * 0.35) * (i === 1 ? 1.25 : 1);
      ctx.fillStyle = ['#e0521f', '#f2861f', '#ffbe3d'][i];
      ctx.beginPath();
      ctx.moveTo(off - r * 0.36, 0);
      ctx.quadraticCurveTo(off - r * 0.42 + wob * r * 0.2, -h * 0.55, off + wob * r * 0.18, -h);
      ctx.quadraticCurveTo(off + r * 0.42 + wob * r * 0.2, -h * 0.55, off + r * 0.36, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,170,0.9)';            // the hot middle
    const wob2 = Math.sin(t * 9 + p.seed);
    ctx.beginPath();
    ctx.moveTo(-r * 0.2, 0);
    ctx.quadraticCurveTo(-r * 0.24, -r * 0.6, wob2 * r * 0.1, -r * 0.95);
    ctx.quadraticCurveTo(r * 0.24, -r * 0.6, r * 0.2, 0);
    ctx.closePath();
    ctx.fill();
  } else if (p.kind === 'block') {
    // a single big square block of masonry, knocked off a wall
    ctx.fillStyle = '#6a6070';
    roundRect(-r * 0.8, -r * 1.1, r * 1.6, r * 1.1, r * 0.1);
    ctx.fill();
    ctx.fillStyle = '#7d7386';                          // the lit top face
    roundRect(-r * 0.8, -r * 1.1, r * 1.6, r * 0.3, r * 0.1);
    ctx.fill();
    ctx.fillStyle = '#4e4658';
    ctx.fillRect(-r * 0.8, -r * 0.5, r * 1.6, r * 0.09);
    ctx.fillRect(-r * 0.1, -r * 1.1, r * 0.09, r * 0.6);
  } else if (p.kind === 'tree') {
    // A TWISTED TREE that came up where an earth crawler dug itself in.
    // It grows out of nothing over about a second and overshoots at the
    // end, so it SPRINGS up instead of sliding up like a lift.
    const g = p.grow === undefined ? 1 : p.grow;
    const ease = g >= 1 ? 1 : 1 + 2.2 * Math.pow(g - 1, 3) + 1.2 * Math.pow(g - 1, 2);
    if (ease <= 0.02) return;                           // not out of the soil yet
    ctx.save();
    ctx.scale(ease, ease);
    const h = r * 2.7;
    ctx.fillStyle = '#5b4a2c';                          // soil pushed up round it
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.75, r * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineCap = 'round';
    ctx.strokeStyle = p.bark;
    for (const t of p.roots) {                          // knuckly roots gripping on
      ctx.lineWidth = r * t.thick;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.12);
      ctx.quadraticCurveTo(t.out * r * 0.4, -r * 0.16, t.out * r * 0.75, r * 0.04);
      ctx.stroke();
    }
    // THE LIMBS. Thickest first, so the thin twigs sit on top of the
    // trunk where they join it instead of poking out through the side.
    for (const b of p.limbs) {
      ctx.lineWidth = Math.max(r * 0.035, r * b.thick);
      ctx.strokeStyle = b.depth === 0 ? p.bark : (b.depth > 1 ? '#4a3418' : p.bark);
      ctx.beginPath();
      ctx.moveTo(b.x * h, b.y * h);
      ctx.quadraticCurveTo(b.cx * h, b.cy * h, b.ex * h, b.ey * h);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
    for (const l of p.leaves) {                         // dark clumps first, so
      ctx.fillStyle = l.dark ? '#2f6d24' : '#469932';   // the light ones sit on top
      ctx.beginPath();
      ctx.ellipse(l.x * h, l.y * h, r * l.w, r * l.w * 0.78, l.a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  } else if (p.kind === 'column') {
    // a broken pillar, snapped off near the base
    ctx.fillStyle = '#5a5266';
    roundRect(-r * 0.5, -r * 1.9, r, r * 1.9, r * 0.12);
    ctx.fill();
    ctx.fillStyle = '#6d6478';
    roundRect(-r * 0.5, -r * 1.9, r * 0.35, r * 1.9, r * 0.12);
    ctx.fill();
    ctx.fillStyle = '#3f394a';                          // the jagged snapped top
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 1.9);
    ctx.lineTo(-r * 0.2, -r * 2.1);
    ctx.lineTo(r * 0.1, -r * 1.82);
    ctx.lineTo(r * 0.5, -r * 2.05);
    ctx.lineTo(r * 0.5, -r * 1.78);
    ctx.lineTo(-r * 0.5, -r * 1.7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4e4658';                          // rubble round the foot
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // a heap of broken chunks. The shapes come from the prop's own seed,
    // so the same heap looks the same every frame instead of shimmering.
    for (let i = 0; i < 6; i++) {
      const a = p.seed + i * 2.3;
      const cx = Math.sin(a) * r * 0.9;
      const cy = -Math.abs(Math.cos(a * 1.7)) * r * 0.5;
      const w = r * (0.3 + (Math.sin(a * 3) + 1) * 0.16);
      ctx.fillStyle = i % 2 ? '#5f5769' : '#6f667a';
      ctx.beginPath();
      ctx.moveTo(cx - w, cy);
      ctx.lineTo(cx - w * 0.5, cy - w * 0.9);
      ctx.lineTo(cx + w * 0.7, cy - w * 0.7);
      ctx.lineTo(cx + w, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(30,26,38,0.35)';              // dust on the floor
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.2, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// A head on its own, off its body. It is the same head the goblin
// wears, minus the neck - masks, horns, six eyes and all.
function drawLooseHead(f, r) {
  const E = f.E;
  const L = f.look || rollLook();
  r = r * L.size;
  if (f.kind !== 'goblin') {
    ctx.fillStyle = E.body;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1220';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.06, r * 0.1, 0, Math.PI * 2);
    ctx.arc(r * 0.2, -r * 0.06, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  // the horns
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#d8cfb4';
    ctx.beginPath();
    ctx.moveTo(side * r * 0.26, -r * 0.16);
    ctx.quadraticCurveTo(side * r * 1.02, -r * 0.44, side * r * 0.86, -r * 1.24);
    ctx.quadraticCurveTo(side * r * 0.86, -r * 0.5, side * r * 0.5, -r * 0.06);
    ctx.closePath();
    ctx.fill();
  }
  // the green skull, in whatever green THIS one was
  ctx.fillStyle = L.skin;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.66, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  // the eyes, dark now
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      ctx.fillStyle = '#120c06';
      ctx.beginPath();
      ctx.arc((col - 1) * r * 0.3, -r * 0.18 + row * r * 0.3, r * 0.115, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the mask, still bolted on
  ctx.save();
  ctx.beginPath();
  ctx.rect(-r, -r, r * 2, r * 2);
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const px = (col - 1) * r * 0.3, py = -r * 0.18 + row * r * 0.3;
      ctx.moveTo(px + r * 0.115, py);
      ctx.arc(px, py, r * 0.115, 0, Math.PI * 2, true);
    }
  }
  ctx.clip('evenodd');
  ctx.fillStyle = '#4a525a';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.04, r * 0.68, r * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#5e6870';
  ctx.fillRect(-r * 0.055, -r * 0.58, r * 0.11, r * 1.18);
  ctx.restore();
  // ooze at the neck end
  ctx.fillStyle = '#4f9e22';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.56, r * 0.28, r * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
}

// EARTH CRAWLERS. A boulder that got up and walked off: four green eyes
// glowing out of the stone, and six tree roots underneath doing the
// walking. Every lump and every root is rolled ONCE when it spawns and
// stored on the look, so the rock keeps its shape instead of wriggling
// about while it stands still.
function drawCrawler(f, r, headless) {
  const E = f.E;
  const L = f.look || rollLook();
  const R = L.rock;
  r = r * L.size;
  const wob = Math.sin(f.walkT) * r * 0.05;      // the whole rock rocks along
  const bodyY = -r * 1.0 + wob;                  // middle of the boulder

  // SIX ROOTS, drawn first so the boulder sits down on top of them.
  // They lift one after another round the six, like a caterpillar.
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    const t = R.roots[i];
    const lift = Math.max(0, Math.sin(f.walkT * 1.7 + i * 1.05)) * r * 0.22;
    const sx = t.x * r;                          // where it leaves the rock
    const ex = (t.x + t.out) * r;                // where the toe puts down
    ctx.strokeStyle = i % 2 ? '#4a3418' : '#5c4222';
    ctx.lineWidth = r * t.thick;
    ctx.beginPath();
    ctx.moveTo(sx, bodyY + r * 0.42);
    ctx.quadraticCurveTo(sx + t.bend * r, bodyY + r * 0.95 - lift, ex, -lift);
    ctx.stroke();
    ctx.lineWidth = r * t.thick * 0.52;          // a toe splitting off the end
    ctx.beginPath();
    ctx.moveTo(ex, -lift);
    ctx.lineTo(ex + t.toe * r, -lift + r * 0.03);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';

  // THE BOULDER. A ring of points at wobbly distances from the middle -
  // that is all a lumpy rock is.
  const N = R.lumps.length;
  const rockPath = () => {
    ctx.beginPath();
    // A point every so often round a circle, at wobbly distances - but
    // curved THROUGH the points instead of straight lines between them,
    // or you get a polygon with visible flat sides, not a boulder.
    const pt = (i) => {
      const a = ((i % N) / N) * Math.PI * 2;
      const rad = r * R.lumps[i % N];
      return { x: Math.cos(a) * rad * 1.14, y: bodyY + Math.sin(a) * rad * 0.94 };
    };
    const mid = (i) => {
      const p = pt(i), q = pt(i + 1);
      return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 };
    };
    const m0 = mid(0);
    ctx.moveTo(m0.x, m0.y);
    for (let i = 1; i <= N; i++) {
      const c = pt(i), m = mid(i);
      ctx.quadraticCurveTo(c.x, c.y, m.x, m.y);
    }
    ctx.closePath();
  };
  ctx.fillStyle = E.body;
  rockPath();
  ctx.fill();
  // the underside is in shadow: clip to the rock, then paint the bottom
  ctx.save();
  rockPath();
  ctx.clip();
  // The underside, cut on a slant. A flat rectangle across the middle
  // read like a lid sitting on the rock instead of shadow under it.
  ctx.fillStyle = E.dark;
  ctx.beginPath();
  ctx.moveTo(-r * 1.4, bodyY + r * 0.12);
  ctx.quadraticCurveTo(0, bodyY + r * 0.46, r * 1.4, bodyY + r * 0.06);
  ctx.lineTo(r * 1.4, bodyY + r * 1.6);
  ctx.lineTo(-r * 1.4, bodyY + r * 1.6);
  ctx.closePath();
  ctx.fill();
  // and a lighter cap where the sun hits the top
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.16, bodyY - r * 0.62, r * 0.72, r * 0.38, -0.2, 0, Math.PI * 2);
  ctx.fill();
  // MOSS, because it has been standing in a meadow
  for (const m of R.moss) {
    ctx.fillStyle = m.dark ? '#3f7a2a' : '#5aa838';
    ctx.beginPath();
    ctx.ellipse(Math.cos(m.a) * r * m.d, bodyY + Math.sin(m.a) * r * m.d * 0.8,
                r * m.w, r * m.w * 0.55, m.a, 0, Math.PI * 2);
    ctx.fill();
  }
  // a crack or two across the stone
  ctx.strokeStyle = E.dark;
  ctx.lineWidth = r * 0.028;
  const cy = bodyY + r * (0.42 + R.crack * 0.3);      // low, under the eyes
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, cy);
  ctx.lineTo(-r * 0.2, cy + r * 0.12);
  ctx.lineTo(r * 0.55, cy - r * 0.05);
  ctx.stroke();
  ctx.restore();

  if (headless) return;                          // no eyes on a broken one

  // FOUR EYES glowing out of the stone. Same trick as the goblins: a
  // dark socket first, then a soft glow, then a bright middle - so an
  // eye that blinks shows the dark INSIDE the rock, not a hole through it.
  for (let i = 0; i < 4; i++) {
    const top = i < 2;
    const px = ((i % 2) ? 1 : -1) * r * (0.34 + R.eyeSpread) + (top ? 0 : R.eyeSkew * r);
    const py = bodyY + (top ? -r * 0.26 : r * 0.16);
    const blink = Math.sin(f.bob * 1.2 + i * 2.3);
    const open = blink > -0.88 ? 1 : 0.12;
    ctx.fillStyle = '#0c1408';
    ctx.beginPath();
    ctx.arc(px, py, r * 0.125, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(118,255,86,0.30)';
    ctx.beginPath();
    ctx.ellipse(px, py, r * 0.2, r * 0.2 * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7dff56';
    ctx.beginPath();
    ctx.ellipse(px, py, r * 0.105, r * 0.105 * open, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e6ffd8';
    ctx.beginPath();
    ctx.ellipse(px, py, r * 0.045, r * 0.045 * open, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// A HOODED ARCHER out of the dark wood. You never see a face - the hood
// stays up, and all that is under it is shadow and a pair of eyes. It
// keeps its distance and shoots, which makes it a completely different
// fight from anything that runs at you.
//
// Drawing ORDER matters here: cloak, then hood, then the bow LAST, so
// the bow is held out in front of the figure. Drawn any earlier and the
// hood covers half of it.
function drawArcher(f, r, headless) {
  const L = f.look || rollLook();
  r = r * L.size;
  const C = L.robe, CD = L.robeDark;
  const wob = Math.sin(f.walkT) * r * 0.07;
  const hy = -r * 1.7 + wob;                        // where the hood sits
  const aim = f.aim ? 1 - f.aim / AIM_TIME : 0;     // 0 loose, 1 fully drawn

  // the cloak: a long bell right down to the floor, so it has no legs
  // you can see - it just glides
  ctx.fillStyle = C;
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, hy + r * 0.45);
  ctx.quadraticCurveTo(-r * 1.05, -r * 0.6, -r * 0.9, 0);
  for (let i = 0; i <= 7; i++) {                    // ragged hem, dragging
    const t = i / 7;
    ctx.lineTo(-r * 0.9 + t * r * 1.8, (i % 2 ? r * 0.07 : -r * 0.09));
  }
  ctx.quadraticCurveTo(r * 1.05, -r * 0.6, r * 0.3, hy + r * 0.45);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CD;                               // a shadowed fold down it
  ctx.beginPath();
  ctx.moveTo(-r * 0.08, hy + r * 0.5);
  ctx.quadraticCurveTo(-r * 0.3, -r * 0.5, -r * 0.16, 0);
  ctx.lineTo(r * 0.2, 0);
  ctx.quadraticCurveTo(r * 0.16, -r * 0.5, r * 0.1, hy + r * 0.5);
  ctx.closePath();
  ctx.fill();

  // THE HOOD. It never comes off - not when it is hit, not when it dies.
  ctx.fillStyle = C;
  ctx.beginPath();
  ctx.moveTo(-r * 0.62, hy + r * 0.5);
  ctx.quadraticCurveTo(-r * 0.66, hy - r * 0.5, f.face * r * 0.1, hy - r * 0.62);
  ctx.quadraticCurveTo(r * 0.66, hy - r * 0.5, r * 0.62, hy + r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CD;                               // the peak, flopped forward
  ctx.beginPath();
  ctx.moveTo(f.face * r * 0.1, hy - r * 0.62);
  ctx.quadraticCurveTo(f.face * r * 0.8, hy - r * 0.66, f.face * r * 0.5, hy - r * 0.16);
  ctx.quadraticCurveTo(f.face * r * 0.3, hy - r * 0.4, 0, hy - r * 0.5);
  ctx.closePath();
  ctx.fill();
  // NOTHING UNDER IT. A black opening where a face should be.
  ctx.fillStyle = '#08060c';
  ctx.beginPath();
  ctx.ellipse(f.face * r * 0.08, hy + r * 0.06, r * 0.34, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  if (!headless) {
    // ...except two eyes, burning out of the dark. They brighten as it
    // draws, so you get a warning a moment before it looses.
    const glow = 0.55 + aim * 0.45 + Math.sin(f.bob * 2) * 0.08;
    for (const side of [-1, 1]) {
      ctx.fillStyle = 'rgba(' + L.glowRGB + ',' + (0.3 * glow) + ')';
      ctx.beginPath();
      ctx.arc(f.face * r * 0.08 + side * r * 0.14, hy + r * 0.02, r * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(' + L.glowRGB + ',' + Math.min(1, glow) + ')';
      ctx.beginPath();
      ctx.ellipse(f.face * r * 0.08 + side * r * 0.14, hy + r * 0.02,
                  r * 0.062, r * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // THE BOW, held out in front of everything. It bends further the
  // further back the string is hauled, which is what makes the shot
  // readable - you can see it coming.
  const bx = f.face * r * 0.78, by = hy + r * 1.15;
  const bend = r * (0.16 + aim * 0.2);
  ctx.strokeStyle = '#7a5326';
  ctx.lineWidth = r * 0.11;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx - f.face * bend * 0.2, by - r * 0.8);
  ctx.quadraticCurveTo(bx + f.face * bend * 1.5, by, bx - f.face * bend * 0.2, by + r * 0.8);
  ctx.stroke();
  ctx.strokeStyle = '#e6e0d0';                      // the string, hauled back
  ctx.lineWidth = r * 0.038;
  const pull = -f.face * r * (0.05 + aim * 0.45);
  ctx.beginPath();
  ctx.moveTo(bx - f.face * bend * 0.2, by - r * 0.8);
  ctx.lineTo(bx + pull, by);
  ctx.lineTo(bx - f.face * bend * 0.2, by + r * 0.8);
  ctx.stroke();
  if (f.aim > 0) {                                  // an arrow on the string
    ctx.strokeStyle = '#d8c496';
    ctx.lineWidth = r * 0.06;
    ctx.beginPath();
    ctx.moveTo(bx + pull, by);
    ctx.lineTo(bx + f.face * r * 0.6, by);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.fillStyle = CD;                               // the hand gripping the bow
  ctx.beginPath();
  ctx.ellipse(bx, by, r * 0.15, r * 0.19, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = C;                                // and the sleeve behind it
  ctx.beginPath();
  ctx.ellipse(f.face * r * 0.4, by - r * 0.06, r * 0.28, r * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
}

// AN ARROW in flight. The point has to read as the point at a glance -
// the first version had a blob at each end and looked like a dumbbell,
// so you could not tell which way it was going.
function drawArrow(a, sc) {
  const r = 17 * sc;
  ctx.save();
  ctx.rotate(Math.atan2(a.vdepth * 0.16, a.vx));
  ctx.fillStyle = '#3f4a5c';                        // flights: thin, swept BACK
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(-r * 1.0, 0);
    ctx.lineTo(-r * 0.55, side * r * 0.3);
    ctx.lineTo(-r * 0.34, side * r * 0.24);
    ctx.lineTo(-r * 0.72, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.strokeStyle = '#c9b58a';                      // the shaft
  ctx.lineWidth = r * 0.12;
  ctx.beginPath();
  ctx.moveTo(-r * 0.95, 0);
  ctx.lineTo(r * 0.7, 0);
  ctx.stroke();
  ctx.fillStyle = '#e8eef7';                        // a long bright spike
  ctx.beginPath();
  ctx.moveTo(r * 1.15, 0);
  ctx.lineTo(r * 0.45, -r * 0.155);
  ctx.lineTo(r * 0.55, 0);
  ctx.lineTo(r * 0.45, r * 0.155);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFoeBody(f, r, headless) {
  const E = f.E;
  const wob = Math.sin(f.walkT) * r * 0.1;
  // brutes are goblins, just twice the size and carrying a shield - so
  // they go through exactly the same drawing rather than a copy of it
  if (f.kind === 'goblin' || f.kind === 'brute') {
    drawGoblin(f, r, headless);
  } else if (f.kind === 'archer') {
    drawArcher(f, r, headless);
  } else if (f.kind === 'crawler') {
    drawCrawler(f, r, headless);
  } else if (f.kind === 'bat') {
    const flap = Math.sin(f.bob * 3) * r * 0.5;
    ctx.fillStyle = E.dark;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.4);
      ctx.quadraticCurveTo(side * r * 1.5, -r * 0.6 - flap, side * r * 1.7, -r * 0.1 + flap);
      ctx.quadraticCurveTo(side * r * 1.1, -r * 0.1, 0, -r * 0.1);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = E.body;
    ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 0.62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe94a';
    ctx.beginPath();
    ctx.arc(-r * 0.22, -r * 0.5, r * 0.13, 0, Math.PI * 2);
    ctx.arc(r * 0.22, -r * 0.5, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.kind === 'slime') {
    const squash = 1 + Math.sin(f.bob) * 0.12;
    ctx.fillStyle = E.body;
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.6 / squash, r * 0.95 * squash, r * 0.75 / squash, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.85, r * 0.22, r * 0.15, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#12331f';
    ctx.beginPath();
    ctx.arc(-r * 0.25, -r * 0.65, r * 0.12, 0, Math.PI * 2);
    ctx.arc(r * 0.25, -r * 0.65, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // goblin, soldier and the boss: same build, different sizes
    ctx.fillStyle = E.dark;
    for (const side of [-1, 1]) {
      const lift = Math.sin(f.walkT + (side > 0 ? Math.PI : 0)) * r * 0.2;
      roundRect(side * r * 0.3 - r * 0.14, -r * 0.45, r * 0.28, r * 0.55 + lift, r * 0.1);
      ctx.fill();
    }
    ctx.fillStyle = E.body;
    roundRect(-r * 0.5, -r * 1.45 + wob, r, r * 1.05, r * 0.25);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -r * 1.7 + wob, r * 0.52, 0, Math.PI * 2);
    ctx.fill();
    if (f.E.boss) {                                   // a crown for the baron
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 2.05 + wob);
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(-r * 0.5 + (i + 0.5) * r * 0.33, -r * 2.45 + wob);
        ctx.lineTo(-r * 0.5 + (i + 1) * r * 0.33, -r * 2.05 + wob);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#1a1220';
    ctx.beginPath();
    ctx.arc(-r * 0.2 + f.face * r * 0.06, -r * 1.75 + wob, r * 0.1, 0, Math.PI * 2);
    ctx.arc(r * 0.2 + f.face * r * 0.06, -r * 1.75 + wob, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    // a weapon, held out when swinging
    const sw = f.attack > 0 ? 1 - f.attack / 0.42 : 0;
    ctx.save();
    ctx.translate(f.face * r * 0.6, -r * 0.95 + wob);
    ctx.rotate(f.face * (-0.6 + sw * 1.8));
    ctx.fillStyle = '#b9a06a';
    roundRect(-r * 0.1, -r * 1.2, r * 0.2, r * 1.2, r * 0.08);
    ctx.fill();
    ctx.restore();
  }
}
