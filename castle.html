<canvas id="game"></canvas>
<script>
// =====================================================================
// KNIGHTS OF THE FOUR
//
// Pick a knight, take a name, and fight your way across the map.
//
// THE VIEW is the Castle Crashers one: side on, but the floor has
// DEPTH. Walk up and you go further away and get smaller; walk down and
// you come towards the camera and get bigger. Everything is sorted by
// how far up the floor it stands, so whoever is nearer is drawn on top.
// That one idea turns a flat side view into a stage.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = 'BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// THE FOUR KNIGHTS. Same shape, four very different magics.
// ---------------------------------------------------------------------
const KNIGHTS = [
  { id: 'red', name: 'RED', body: '#e0392b', dark: '#8f1e15', trim: '#ffd06a',
    magic: 'FIRE', magicColor: '#ff8b1f',
    blurb: 'sets them alight - they keep burning', power: 3, health: 100 },
  { id: 'blue', name: 'BLUE', body: '#2f7ad6', dark: '#17457f', trim: '#bfe8ff',
    magic: 'ICE', magicColor: '#7fe4ff',
    blurb: 'freezes them solid so they cannot move', power: 3, health: 105 },
  { id: 'green', name: 'GREEN', body: '#3aa843', dark: '#1d6023', trim: '#c8ff9a',
    magic: 'POISON', magicColor: '#a6ff5c',
    blurb: 'a cloud that eats anything standing in it', power: 2, health: 95 },
  { id: 'orange', name: 'ORANGE', body: '#f0821f', dark: '#a34f08', trim: '#ffe0a8',
    magic: 'LIGHTNING', magicColor: '#ffe94a',
    blurb: 'jumps between them and hits the lot', power: 3, health: 110 },
];

// ---------------------------------------------------------------------
// THE MAP. Each level knows where it sits, and which one must be beaten
// before it opens.
// ---------------------------------------------------------------------
// Everybody is on the level from the moment it starts - no waves. They
// are spread out along it and wait where they stand until you come
// near, so a level is a march you can see coming rather than things
// appearing out of nowhere behind you.
const LEVELS = [
  { id: 0, name: 'THE CASTLE', x: 0.12, y: 0.74, needs: -1, count: 10, enemy: 'goblin',
    scene: 'castle', blurb: 'they have wrecked your hall and want the gold',
    chest: true, cutscene: true, wrecked: true, brutes: 1 },
  { id: 1, name: 'THE MEADOW', x: 0.25, y: 0.55, needs: 0, count: 8, enemy: 'crawler',
    scene: 'grass', blurb: 'out of the gates, after him', brutes: 1 },
  { id: 2, name: 'DARK WOOD', x: 0.37, y: 0.74, needs: 1, count: 10, enemy: 'archer',
    scene: 'wood', blurb: 'something in the trees', brutes: 2, bats: 6, trees: 26 },
  { id: 3, name: 'THE CAVES', x: 0.49, y: 0.5, needs: 2, count: 11, enemy: 'slime',
    scene: 'cave', blurb: 'dripping, and full of slime', brutes: 2 },
  { id: 4, name: 'SNOW PASS', x: 0.61, y: 0.72, needs: 3, count: 12, enemy: 'goblin',
    scene: 'snow', blurb: 'cold, and they are waiting', brutes: 3 },
  { id: 5, name: 'THE KEEP', x: 0.73, y: 0.46, needs: 4, count: 12, enemy: 'knight',
    scene: 'castle', blurb: 'proper soldiers now', brutes: 3 },
  { id: 6, name: 'LAVA GATE', x: 0.84, y: 0.68, needs: 5, count: 14, enemy: 'slime',
    scene: 'lava', blurb: 'hot. very hot.', brutes: 4 },
  { id: 7, name: 'TOP TOWER', x: 0.93, y: 0.3, needs: 6, count: 8, enemy: 'knight',
    scene: 'castle', blurb: 'the one who took the gold', boss: true, brutes: 4 },
];

// ---------------------------------------------------------------------
// WHAT YOU HAVE DONE SO FAR - kept between visits
// ---------------------------------------------------------------------
// =====================================================================
// THE WEAPON SHOP.
//
// It opens once you have taken your castle back. What you are allowed
// to buy depends on how strong YOU are: the 5 damage blades are for
// levels 1 to 10, and the 10 damage ones only unlock at level 10. So
// gold alone is not enough - you have to earn the right to carry it.
// =====================================================================
const SHOP = [
  // ---- 5 damage: levels 1 to 10 ----
  { id: 'iron', name: 'IRON SWORD', dmg: 5, cost: 60, need: 1, blade: '#b9c2cb',
    blurb: 'honest, sharp, does the job' },
  { id: 'oak', name: 'OAK CLUB', dmg: 5, cost: 55, need: 1, blade: '#8a6a3a',
    blurb: 'heavy lump of tree. surprisingly good' },
  { id: 'hatchet', name: 'HATCHET', dmg: 5, cost: 75, need: 3, blade: '#9aa3ac',
    blurb: 'short, mean and quick' },
  { id: 'bronze', name: 'BRONZE BLADE', dmg: 5, cost: 110, need: 5, blade: '#d09b3f',
    blurb: 'older than the castle' },
  // ---- 10 damage: level 10 and up ----
  { id: 'steel', name: 'STEEL LONGSWORD', dmg: 10, cost: 220, need: 10, blade: '#dce4ec',
    blurb: 'a proper knight of the castle' },
  { id: 'warhammer', name: 'WAR HAMMER', dmg: 10, cost: 260, need: 12, blade: '#7d868e',
    blurb: 'flattens things' },
  { id: 'frost', name: 'FROSTBRAND', dmg: 10, cost: 340, need: 15, blade: '#9fe8ff',
    blurb: 'cold to hold' },
  { id: 'gold', name: 'GOLDEN GREATSWORD', dmg: 10, cost: 500, need: 18, blade: '#ffd83d',
    blurb: 'from the chest they stole' },
];
function shopItem(id) { return SHOP.find(w => w.id === id); }
function haveShop() { return isBeaten(0); }
function canBuy(w) { return heroLevel() >= w.need; }
function owned(id) { return save.owned.includes(id); }
function weaponDamage() {
  const w = shopItem(save.weapon);
  return w ? w.dmg : 0;
}

let save = { name: '', knight: 0, beaten: [], xp: 0, gold: 0, owned: [], weapon: null };
try {
  const raw = JSON.parse(localStorage.getItem('castle_save'));
  if (raw && typeof raw === 'object') save = Object.assign(save, raw);
} catch (e) {}
if (!Array.isArray(save.beaten)) save.beaten = [];
if (!Array.isArray(save.owned)) save.owned = [];
if (typeof save.gold !== 'number') save.gold = 0;
if (save.weapon && !shopItem(save.weapon)) save.weapon = null;
function saveGame() { localStorage.setItem('castle_save', JSON.stringify(save)); }
function isBeaten(id) { return save.beaten.includes(id); }
function isOpen(lv) { return lv.needs < 0 || isBeaten(lv.needs); }
function heroLevel() { return 1 + Math.floor(save.xp / 60); }
function maxHealth() { return KNIGHTS[save.knight].health + (heroLevel() - 1) * 12; }
function myPower() { return KNIGHTS[save.knight].power + Math.floor((heroLevel() - 1) * 0.7); }
// CRITICAL HITS. One swing in six lands properly and does more than
// twice the damage. The chance creeps up as you level, so getting
// stronger feels different rather than just being a bigger number.
const CRIT_DAMAGE = 2.4;
function critChance() { return Math.min(0.34, 0.16 + (heroLevel() - 1) * 0.015); }
function rollCrit() { return Math.random() < critChance(); }
function playerName() { return (save.name || '').trim() || 'KNIGHT'; }

let screen = 'title';            // title | select | map | fight | cleared | dead
let held = {}, touchMode = false, uiRects = [], shake = 0;
let particles = [], floaters = [];
let mapPick = 0;
let critFlash = 0;               // a gold ring that snaps out on a critical
</script>
<script>
// =====================================================================
// THE STAGE
//
// The floor is a band across the screen. depth 0 is the BACK of it and
// depth 1 is the FRONT, nearest the camera. Everything standing on the
// floor gets its screen position and its size from its depth, which is
// the whole trick of this view.
// =====================================================================
// =====================================================================
// THE THREE MODES.
//
// They change how many are waiting for you: 20, 25, or 25 plus another
// twenty on top. The LEVEL GETS LONGER to match, so forty-five of them
// is a long march rather than a solid wall you cannot get through - the
// same idea as a bigger board needing more apples in Snake Fight.
// =====================================================================
const MODES = [
  { name: 'EASY',   count: 20, desc: '20 of them' },
  { name: 'NORMAL', count: 25, desc: '25 of them' },
  { name: 'HARD',   count: 45, desc: '25 and TWENTY MORE' },
];
let modeIx = parseInt(localStorage.getItem('castle_mode') || '1');
if (!(modeIx >= 0 && modeIx < MODES.length)) modeIx = 1;
function mode() { return MODES[modeIx]; }
// how many turn up in a level - the boss level keeps its own smaller
// count, because forty-five soldiers AND a boss is not a fight, it is a
// queue
function levelCount(lv) { return lv.boss ? Math.round(mode().count * 0.4) : mode().count; }
// and the level stretches to fit them, so they are never shoulder to
// shoulder however many you asked for
let STAGE_W = 2100;
function stageLengthFor(lv) {
  return Math.round(1500 + levelCount(lv) * 105);
}

function stage() {
  const W = canvas.width, H = canvas.height;
  const hud = Math.min(76, H * 0.13);
  const backY = hud + (H - hud) * 0.42;             // the far edge of the floor
  const frontY = H - (H - hud) * 0.08;              // the near edge
  return { W, H, hud, backY, frontY, floorH: frontY - backY };
}
// how big is something stood at this depth? nearer = bigger
function depthScale(depth) { return 1.15 + depth * 0.62; }
// where does it sit on the screen?
function toScreen(a, S, camX) {
  // Anything missing a number would give NaN here, and canvas draws
  // NOTHING at NaN without complaining - so treat a missing z as zero
  // rather than letting it poison the sum.
  const depth = a.depth || 0;
  const sc = depthScale(depth);
  return {
    x: (a.x || 0) - camX,
    y: S.backY + depth * S.floorH - (a.z || 0),     // z is how high it is off the floor
    sc,
  };
}

// ---------------------------------------------------------------------
// EVERYBODY IN A FIGHT
// ---------------------------------------------------------------------
// What a goblin is carrying. It changes how hard it hits, how far it
// reaches and how long it takes to swing again - so a room of them
// fights differently depending on what they picked up.
const WEAPONS = {
  club:  { name: 'club',  power: 1.0, reach: 1.0, cool: 1.0 },
  axe:   { name: 'axe',   power: 1.6, reach: 0.95, cool: 1.5 },   // heavy and slow
  sword: { name: 'sword', power: 0.85, reach: 1.25, cool: 0.75 }, // quick, long
};
const WEAPON_LIST = ['club', 'axe', 'sword'];

const ENEMY_KINDS = {
  goblin: { name: 'GOBLIN', body: '#6b4a2a', dark: '#3d2916', health: 22, power: 6,
            speed: 78, r: 20, xp: 8, eyes: '#ffe94a',
            skin: '#78b043', skinDark: '#4c7526' },
  bat:    { name: 'BAT', body: '#6a4a8f', dark: '#3c2757', health: 16, power: 5,
            speed: 118, r: 17, xp: 9, flies: true },
  slime:  { name: 'SLIME', body: '#3fbf8f', dark: '#1f6f52', health: 30, power: 7,
            speed: 58, r: 22, xp: 11 },
  // The meadow's own monster: a walking rock. Slow and solid - it soaks
  // up more hits than a goblin but it will never catch you in a footrace.
  crawler:{ name: 'EARTH CRAWLER', body: '#7d7970', dark: '#494740', health: 34, power: 7,
            speed: 52, r: 23, xp: 13 },
  // The dark wood's own. It never closes in - it backs off and shoots,
  // so you have to chase it down or eat the arrows.
  archer: { name: 'HOODED ARCHER', body: '#3b3350', dark: '#221d33', health: 26, power: 8,
            speed: 74, r: 19, xp: 17, ranged: true },
  knight: { name: 'SOLDIER', body: '#9aa4b4', dark: '#4d5666', health: 40, power: 9,
            speed: 84, r: 21, xp: 15 },
  boss:   { name: 'THE BARON', body: '#b02a6a', dark: '#61143a', health: 260, power: 13,
            speed: 66, r: 40, xp: 90, boss: true },
  // TWICE THE SIZE, and carrying a shield. It guards while it is
  // standing there, so hitting the front of it is nearly useless - you
  // have to wait for it to swing, or slam it off its feet.
  brute:  { name: 'BRUTE', body: '#6b4a2a', dark: '#3d2916', health: 85, power: 14,
            speed: 52, r: 33, xp: 34, big: true, shield: true,
            skin: '#78b043', skinDark: '#4c7526', eyes: '#ffe94a' },
};

let hero = null, foes = [], magics = [], camX = 0;
let heads = [];                  // heads that have popped off and gone bouncing
let props = [];                  // rubble, fires and broken stone on the floor
let splats = [];                 // green goo left on the floor where things died
const MAX_SPLATS = 60;           // old ones fade away so this never grows forever
let fightLevel = null, cleared = false, resultTimer = 0, clearTimer = 0;
let chest = null;                // the chest of gold, on levels that have one
let cut = null;                  // a cutscene playing, if there is one
let gainedXP = 0, gainedGold = 0;

function newHero() {
  const K = KNIGHTS[save.knight];
  return {
    kind: 'hero', K,
    x: 140, depth: 0.55, z: 0, vz: 0,
    vx: 0, vdepth: 0,
    face: 1, r: 20,
    health: maxHealth(), maxHealth: maxHealth(),
    attack: 0, cool: 0, combo: 0, comboTimer: 0,
    magic: 0, magicCool: 0, hurt: 0, dead: false,
    slam: false, slamCool: 0,
    walkT: 0,
  };
}
// EVERY ONE OF THEM IS DIFFERENT.
//
// The look is worked out ONCE, when the creature is made, and kept on
// it. Roll these while drawing instead and it would flicker through
// twenty different faces a second - the same reason the broken pillars
// are decided by where they stand.
const SKINS = ['#78b043', '#8cc24e', '#639635', '#86a83c', '#5f8f4a'];
const SKINS_DARK = ['#4c7526', '#5c8231', '#3f6420', '#566e24', '#3d6030'];
const CLOAKS = ['#6b4a2a', '#7d5732', '#5a3d22', '#75513a', '#604428'];
const CLOAKS_DARK = ['#3d2916', '#4a331c', '#33210f', '#452c20', '#372615'];
const EYE_COLOURS = ['#ffe94a', '#ffd12a', '#ffa93d', '#f6ff5c', '#ffbe1f'];
function rollLook() {
  const skin = Math.floor(Math.random() * SKINS.length);
  const cloak = Math.floor(Math.random() * CLOAKS.length);
  return {
    skin: SKINS[skin], skinDark: SKINS_DARK[skin],
    cloak: CLOAKS[cloak], cloakDark: CLOAKS_DARK[cloak],
    eyes: EYE_COLOURS[Math.floor(Math.random() * EYE_COLOURS.length)],
    size: 0.86 + Math.random() * 0.3,              // some are bigger than others
    mask: Math.floor(Math.random() * 3),           // round, squared off, or banded
    horns: Math.floor(Math.random() * 3),          // curved, straight, or one snapped
    cracked: Math.random() < 0.32,                 // a split across the mask
    rivets: 8 + Math.floor(Math.random() * 5),
    seed: Math.random() * 100,
    // HOODED ARCHER colours. Deep and dim - they live in a dark wood.
    robe: ['#3b3350', '#312b46', '#43395c', '#2c3348', '#3a2f42'][Math.floor(Math.random() * 5)],
    robeDark: ['#221d33', '#1b172b', '#291f3a', '#191e2d', '#231b28'][Math.floor(Math.random() * 5)],
    glowRGB: ['255,210,90', '150,240,255', '190,120,255', '120,255,170'][Math.floor(Math.random() * 4)],
    // EARTH CRAWLER parts. Rolled here, once, at spawn - if we rolled
    // these while drawing, the rock would change shape 60 times a second.
    rock: {
      lumps: Array.from({ length: 11 }, () => 0.6 + Math.random() * 0.28),
      roots: Array.from({ length: 6 }, (_, i) => ({
        x: -0.5 + i * 0.2 + (Math.random() - 0.5) * 0.08,
        out: (-0.5 + i * 0.2) * 0.85 + (Math.random() - 0.5) * 0.22,
        bend: (Math.random() - 0.5) * 0.55,
        thick: 0.095 + Math.random() * 0.055,
        toe: (Math.random() < 0.5 ? -1 : 1) * (0.12 + Math.random() * 0.12),
      })),
      moss: Array.from({ length: 4 }, () => ({
        // angle between PI and 2PI is the TOP of the rock on a canvas,
        // because y counts downwards. Moss grows on top, not underneath.
        a: Math.PI + Math.random() * Math.PI, d: 0.3 + Math.random() * 0.42,
        w: 0.07 + Math.random() * 0.09, dark: Math.random() < 0.5,
      })),
      eyeSpread: Math.random() * 0.1,
      eyeSkew: (Math.random() - 0.5) * 0.14,
      crack: -0.1 + Math.random() * 0.5,
    },
  };
}

function newFoe(kind, x, depth) {
  const E = ENEMY_KINDS[kind];
  return {
    kind, E,
    x, depth, z: E.flies ? 42 : 0, vz: 0,
    vx: 0, vdepth: 0, face: -1, r: E.r,
    health: E.health, maxHealth: E.health,
    look: (function () {
      const L = rollLook();
      if (E.big) {                     // bigger than the rest, but not screen-eating
        L.size *= 1.5;
        L.skin = E.skin; L.skinDark = E.skinDark; L.eyes = E.eyes;
      }
      return L;
    })(),
    weapon: WEAPON_LIST[Math.floor(Math.random() * WEAPON_LIST.length)],
    attack: 0, cool: 0.6 + Math.random() * 0.7, hurt: 0, dead: false,
    aim: 0, loosed: false,        // archers only: hauling the string back
    down: 0, kvx: 0, kvz: 0, rise: 0, flying: false, tumble: 0, spinZ: 0, guardFlash: 0,
    // thrown through the air, then flat on the floor, then getting up
    frozen: 0, burning: 0, poisoned: 0, walkT: Math.random() * 6,
    bob: Math.random() * 6,
    awake: false,                  // stands about until you come near
  };
}

// ---------------------------------------------------------------------
// SOUND, made of maths
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, len, type, vol, slideTo) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + len);
  g.gain.setValueAtTime(vol === undefined ? 0.07 : vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + len + 0.02);
}
function hitSound() { tone(220, 0.09, 'square', 0.09, 90); }
function swingSound() { tone(600, 0.05, 'sine', 0.04, 900); }
function popSound() { tone(320, 0.14, 'square', 0.07, 120); }
function fanfare() {
  [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => tone(n, 0.2, 'square', 0.09), i * 110));
}
function sadTune() {
  [400, 340, 280, 200].forEach((n, i) => setTimeout(() => tone(n, 0.3, 'sine', 0.09), i * 160));
}

function boom(x, depth, z, color, count) {
  for (let i = 0; i < (count || 12); i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
    particles.push({ x, depth, z, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp + 60,
                     life: 0.45 + Math.random() * 0.4, color });
  }
}
// A puddle of goo, left on the floor for good. Each one remembers its
// own wobbly shape so it does not shimmer about from frame to frame.
function addSplat(x, depth, size) {
  splats.push({
    x, depth, z: 0,
    size: size || (0.8 + Math.random() * 0.7),
    seed: Math.random() * 100,
    born: 0,
    r: 18,
  });
  // the oldest ones go once there are too many, so a long fight does not
  // slowly bury the whole floor
  if (splats.length > MAX_SPLATS) splats.shift();
}

// Green ooze. Definitely not blood - it is bright, it is bouncy, and it
// belongs to something with six eyes and a metal face.
function oozeBurst(x, depth, z, count) {
  for (let i = 0; i < (count || 10); i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 140;
    particles.push({
      x, depth, z,
      vx: Math.cos(a) * sp, vz: Math.sin(a) * sp + 110,
      life: 0.7 + Math.random() * 0.7,
      color: Math.random() < 0.5 ? '#7fdf3f' : '#4f9e22',
      ooze: true,
    });
  }
}
function floatText(x, depth, z, text, color) {
  floaters.push({ x, depth, z, text, color, life: 0.85 });
}

<script>
// =====================================================================
// FIGHTING
// =====================================================================
const HERO_SPEED = 190;          // left and right
const DEPTH_SPEED = 0.55;        // up and down the floor, per second
const GRAVITY = 1500;
const JUMP_V = 520;
const SWING_TIME = 0.22;
const SWING_COOL = 0.1;
const MAGIC_COOL = 3.2;

function startLevel(lv) {
  fightLevel = lv;
  // Forget any half-finished double tap. Without this, the press that
  // finished the last level counts as the first tap of a new one, and
  // your very first swing here fires an accidental slam.
  lastTap = -99;
  STAGE_W = stageLengthFor(lv);                   // longer levels for more of them
  hero = newHero();
  foes = [];
  magics = [];
  arrows = [];
  particles = [];
  floaters = [];
  wave = null;
  heads = [];
  props = [];
  splats = [];
  chest = null;
  cut = null;
  camX = 0;
  cleared = false;
  gainedXP = 0;
  gainedGold = 0;
  fillLevel(lv);
  screen = 'fight';
}

// How long a crawler takes to dig itself out of sight.
const BURROW_TIME = 0.95;

// ARROWS in the air. Kept in their own list like the magics are, so an
// arrow carries on flying after the archer that loosed it is dead.
let arrows = [];

// Everything the archers do, in one place.
const AIM_TIME = 0.7;        // how long it hauls the bowstring back
const ARROW_SPEED = 620;     // how fast the arrow goes down the level
const KEEP_AWAY = 210;       // it backs off if you get closer than this
const BOW_RANGE = 470;       // and steps up if you are further than this
// FIVE SECONDS between arrows. The 0.7s of aiming happens INSIDE this
// wait, not on top of it, so what you actually get is one arrow every
// five seconds - not one every 5.7.
const BOW_COOL = 5;

// Loose one arrow from an archer towards where you are standing NOW.
// It does not steer after that - walk sideways and it sails past you.
function shootArrow(f) {
  const dx = hero.x - f.x, dd = hero.depth - f.depth;
  const dist = Math.max(1, Math.abs(dx));
  arrows.push({
    x: f.x + f.face * 22, depth: f.depth, z: 34,
    vx: f.face * ARROW_SPEED,
    vdepth: (dd / dist) * ARROW_SPEED * 0.9,
    power: f.E.power, life: 1.6, spent: false,
  });
  tone(340, 0.07, 'triangle', 0.05, 620);
}

function updateArrows(dt) {
  for (const a of arrows) {
    a.x += a.vx * dt;
    a.depth = Math.max(0, Math.min(1, a.depth + a.vdepth * dt));
    a.z -= 26 * dt;                                  // it drops a little as it flies
    a.life -= dt;
    if (a.spent) continue;
    // A hit needs to line up on the floor as well as along the level -
    // an arrow flying past behind you must not count.
    if (!hero.dead && Math.abs(a.x - hero.x) < 26 &&
        Math.abs(a.depth - hero.depth) < 0.13 && Math.abs(a.z - hero.z - 24) < 46) {
      a.spent = true; a.life = 0;
      hurtHero(a.power);
    }
    if (a.x < 10 || a.x > STAGE_W - 10) a.life = 0;
  }
  arrows = arrows.filter(a => a.life > 0);
}

// Grow one twisted limb, and everything that forks off the end of it.
// This calls ITSELF - a branch is just a smaller tree. That is called
// recursion, and it is why the tree comes out gnarled instead of tidy.
//
// It runs ONCE, when the tree is planted, and the shape is kept. If it
// ran while drawing, the tree would rewrite itself 60 times a second.
// Numbers are in multiples of r, so the same tree works at any size.
function growLimb(x, y, angle, len, thick, depth, limbs, leaves) {
  // Each limb kinks twice on the way up. Pick the DIRECTION first and
  // the amount second, so the bend can never come out near zero - a
  // plain (random - 0.5) roll gives you straight limbs now and then,
  // and one ruler-straight branch makes the whole tree look wrong.
  const bend = (Math.random() < 0.5 ? -1 : 1) * (0.26 + Math.random() * 0.5);
  const midA = angle + bend * 0.5;
  const mx = x + Math.cos(midA) * len * 0.55;
  const my = y + Math.sin(midA) * len * 0.55;
  const endA = angle + bend;
  const ex = mx + Math.cos(endA) * len * 0.55;
  const ey = my + Math.sin(endA) * len * 0.55;
  limbs.push({ x, y, cx: mx, cy: my, ex, ey, thick, depth });

  if (depth >= 3 || len < 0.3) {
    // the end of the line: a clump of leaves hangs off this tip
    leaves.push({ x: ex, y: ey, w: 0.34 + Math.random() * 0.3,
                  a: Math.random() * Math.PI, dark: Math.random() < 0.45 });
    return;
  }
  const forks = 2 + (depth < 2 && Math.random() < 0.5 ? 1 : 0);
  for (let i = 0; i < forks; i++) {
    // fan the forks out either side of wherever this limb ended up
    const spread = (i - (forks - 1) / 2) * (0.6 + Math.random() * 0.5);
    growLimb(ex, ey, endA + spread + (Math.random() - 0.5) * 0.35,
             len * (0.58 + Math.random() * 0.24),
             thick * 0.6, depth + 1, limbs, leaves);
  }
  // a bare dead-looking twig now and then, with nothing growing on it
  if (Math.random() < 0.35) {
    const t = { x: mx, y: my,
                cx: mx + Math.cos(endA + 1.5) * len * 0.3,
                cy: my + Math.sin(endA + 1.5) * len * 0.3,
                ex: mx + Math.cos(endA + 2.1) * len * 0.45,
                ey: my + Math.sin(endA + 2.1) * len * 0.45,
                thick: thick * 0.3, depth: depth + 1 };
    limbs.push(t);
  }
}

// A TREE, planted where an earth crawler went down. Everything about
// its shape is rolled here, once, and kept - same rule as the rock it
// came out of. grow: 0 means it has not come up yet.
function plantTree(x, depth, size) {
  const lean = (Math.random() - 0.5) * 1.3;
  const limbs = [], leaves = [];
  // -PI/2 is straight up on a canvas, because y counts downwards
  // 0.82, not 1.15: the forks pile height on top of the trunk, so the
  // finished tree reaches about three times as far as this first limb.
  growLimb(0, 0, -Math.PI / 2 + lean * 0.45, 0.82, 0.3, 0, limbs, leaves);
  props.push({
    kind: 'tree', x, depth, z: 0,
    // keep them a head or two above the knight - big enough to feel like
    // a wood, small enough that a cleared meadow is still a level you can
    // see across
    size: (size || 1) * (0.72 + Math.random() * 0.3),
    seed: Math.random() * 100, r: 16, grow: 0, lean, limbs, leaves,
    bark: Math.random() < 0.5 ? '#4a3418' : '#5c4222',
    // knuckly roots gripping the ground at the bottom
    roots: Array.from({ length: 3 + Math.floor(Math.random() * 3) }, () => ({
      out: (Math.random() - 0.5) * 1.5,
      thick: 0.08 + Math.random() * 0.07,
    })),
  });
}

// The state your hall has been left in. Rubble and fires are laid out
// along the level and stand on the floor like everybody else, so they
// sort by depth and you can walk in front of or behind them.
function litterLevel(lv) {
  props = [];
  // A WOOD NEEDS TREES IN IT. Same trees the crawlers grow, but planted
  // already full grown. They go along the BACK of the level and along
  // the very front lip, so they frame the fight rather than standing in
  // the middle of it where you cannot see past them.
  for (let i = 0; i < (lv.trees || 0); i++) {
    const x = 140 + (i / (lv.trees || 1)) * (STAGE_W - 240) + (Math.random() - 0.5) * 170;
    const front = Math.random() < 0.24;
    const depth = front ? 0.92 + Math.random() * 0.08 : Math.random() * 0.17;
    plantTree(x, depth, 0.95 + Math.random() * 0.85);
    props[props.length - 1].grow = 1;             // already grown, not sprouting
  }
  if (!lv.wrecked) return;
  // a seeded shuffle would be overkill - this only runs once per level
  const drop = (kind, x, depth, size) => props.push({
    kind, x, depth, z: 0, size,
    seed: Math.random() * 100,
    r: 16 * size,
  });
  for (let x = 260; x < STAGE_W - 120; x += 150 + Math.random() * 120) {
    const roll = Math.random();
    const depth = 0.08 + Math.random() * 0.86;
    if (roll < 0.42) drop('rubble', x, depth, 0.7 + Math.random() * 0.8);
    else if (roll < 0.7) drop('fire', x, depth, 0.75 + Math.random() * 0.6);
    else if (roll < 0.86) drop('block', x, depth, 0.8 + Math.random() * 0.7);
    else drop('column', x, depth, 0.9 + Math.random() * 0.5);
  }
  // Three broken pillars, always. Leaving these to the dice meant about
  // one castle in five had no pillars at all, and a great hall with no
  // pillars does not read as a wrecked great hall.
  for (let i = 0; i < 3; i++) {
    drop('column', 420 + i * (STAGE_W - 900) / 2 + Math.random() * 120,
         0.12 + Math.random() * 0.7, 0.9 + Math.random() * 0.5);
  }

  // and a proper heap of it near the gold, where they broke in
  for (let i = 0; i < 5; i++) {
    drop(i % 2 ? 'rubble' : 'fire', STAGE_W - 420 + i * 70, 0.15 + Math.random() * 0.3,
         0.8 + Math.random() * 0.6);
  }
  // KNIGHTS FROM YOUR OWN SIDE. They were holding the hall before you
  // got here, and they did not manage it. Each one lies where it fell
  // with its sword stuck in the floor beside it, and they wear the four
  // colours - so you can see your own lot among them.
  const fallen = 4;
  for (let i = 0; i < fallen; i++) {
    const p = props.length ? null : null;
    props.push({
      kind: 'fallen',
      x: 620 + (i / (fallen - 1)) * (STAGE_W - 1100) + (Math.random() - 0.5) * 160,
      depth: 0.12 + Math.random() * 0.8,
      z: 0,
      size: 1,
      knight: (i + Math.floor(Math.random() * 4)) % 4,
      stuck: Math.random() < 0.5 ? 'axe' : 'sword',   // what got left in him
      lean: Math.random() < 0.5 ? -1 : 1,
      seed: Math.random() * 100,
      r: 18,
    });
  }
}

// Everybody gets put out along the level at the start, spread from one
// end to the other. They wait where they stand until you come near, so
// you meet them a few at a time as you walk.
function fillLevel(lv) {
  litterLevel(lv);
  const count = levelCount(lv);
  const first = 460;                              // room to get going
  const last = STAGE_W - 300;
  // Some of them are BRUTES: twice the size, carrying a shield. They are
  // spaced through the level rather than bunched, so you meet one every
  // so often instead of walking into all of them at once.
  const bigCount = Math.min(count, Math.round((lv.brutes || 0) * (mode().count / 25)));
  const bigAt = new Set();
  for (let i = 0; i < bigCount; i++) {
    bigAt.add(Math.floor(((i + 0.7) / bigCount) * count));
  }
  // And some of them are BATS, spread the same way. A bat never lands,
  // so it flies over the top of the fight and comes at you from a
  // height nothing else does.
  const batCount = Math.min(count - bigCount,
                            Math.round((lv.bats || 0) * (mode().count / 25)));
  const batAt = new Set();
  for (let i = 0; i < batCount; i++) {
    let slot = Math.floor(((i + 0.25) / batCount) * count);
    // never put a bat where a brute already is - one of them would win
    // and the other would just never appear
    while (bigAt.has(slot) || batAt.has(slot)) slot = (slot + 1) % count;
    batAt.add(slot);
  }
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = first + t * (last - first) + (Math.random() - 0.5) * 130;
    const kind = bigAt.has(i) ? 'brute' : batAt.has(i) ? 'bat' : lv.enemy;
    foes.push(newFoe(kind, x, 0.15 + Math.random() * 0.75));
  }
  if (lv.boss) foes.push(newFoe('boss', STAGE_W - 180, 0.55));
  if (lv.chest) {
    chest = { x: STAGE_W - 170, depth: 0.62, z: 0, bob: 0, taken: false, lift: 0 };
  }
}

// two things can hit each other if they are close along the floor AND
// standing at about the same depth. Being further up the floor than
// somebody is exactly how you dodge in this view.
function inRange(a, b, reach) {
  const dx = Math.abs(a.x - b.x);
  const dd = Math.abs(a.depth - b.depth);
  const dz = Math.abs((a.z || 0) - (b.z || 0));
  return dx < reach && dd < 0.16 && dz < 60;
}
function faceToward(a, b) { a.face = b.x > a.x ? 1 : -1; }
// anything without a weapon just swings its fists, so this never breaks
function weaponOf(f) { return WEAPONS[f.weapon] || WEAPONS.club; }

// KNOCKED FLAT. Take a hit and survive it, and you go over backwards,
// slide along the floor, lie there a moment and then get up and come
// straight back. It is what makes hitting something feel solid - you
// can SEE what the blow did rather than just watching a number.
const DOWN_TIME = 0.55;          // how long they lie there
const RISE_TIME = 0.35;          // and how long getting up takes
function knockDown(f, away, force) {
  if (f.E.boss) {                                  // too big to throw
    f.kvx = away * force * 0.25;
    return;
  }
  // THROWN THROUGH THE AIR. It leaves the floor, arcs backwards, and
  // only starts lying there once it lands - so the half second on the
  // ground begins when it hits, not when you hit it.
  f.down = 0;
  f.rise = 0;
  f.flying = true;
  f.kvx = away * force * 1.5;
  f.kvz = 210 + force * 0.35;                      // up as well as back
  f.spinZ = away * (4 + Math.random() * 4);        // tumbling as it goes
  f.tumble = 0;
  f.attack = 0;                                    // whatever it was doing, it is not now
  f.fallDir = -away;
}
// Is its shield up? It guards while it is just standing there, and the
// shield has to come down for it to swing - so there IS a way through,
// you just have to wait for it. Knocked over, it guards nothing.
function guarding(f) {
  if (!f || !f.E) return false;            // nothing there guards nothing
  return !!(f.E.shield && f.attack <= 0 && f.down <= 0 && f.rise <= 0 &&
            !f.flying && f.frozen <= 0);
}
function hurtFoe(f, dmg, knock, from, crit, ignoreShield) {
  if (f.dead) return;
  if (!ignoreShield && guarding(f)) {
    // it takes the blow on the shield: almost nothing gets through, and
    // it does not budge an inch
    f.health -= Math.max(1, Math.round(dmg * 0.15));
    f.hurt = 0.12;
    f.guardFlash = 0.22;
    floatText(f.x, f.depth, f.z + 46, 'BLOCKED', '#9fd8ff');
    tone(900, 0.07, 'square', 0.07, 500);
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({ x: f.x - f.face * 18, depth: f.depth, z: f.z + 34,
                       vx: Math.cos(a) * 90, vz: Math.sin(a) * 90 + 40,
                       life: 0.3, color: '#cfe8ff' });
    }
    return;
  }
  f.health -= dmg;
  f.hurt = 0.18;
  const away = from ? (f.x > from.x ? 1 : -1) : 1;
  floatText(f.x, f.depth, f.z + 40, (crit ? 'CRIT ' : '') + Math.round(dmg),
            crit ? '#ffd83d' : '#fff');
  boom(f.x, f.depth, f.z + 20, f.E.body, crit ? 14 : 6);
  hitSound();
  // a proper blow puts them on the floor; poison and burning just sting
  if (knock > 0 && f.health > 0) knockDown(f, away, 240 + knock * 9 + (crit ? 200 : 0));
  else f.x += knock * away;
  if (f.health <= 0) {
    f.dead = true;
    f.deadT = 0;
    gainedXP += f.E.xp;
    // gold, straight into your purse - you keep it even if you die
    const coins = Math.max(1, Math.round(f.E.xp * 0.7));
    save.gold += coins;
    gainedGold += coins;
    floatText(f.x, f.depth, f.z + 74, '+' + coins + 'g', '#ffd83d');
    // Two ways to go, picked at random: topple over and lie there, or
    // the head comes clean off and bounces away. Roughly one in three.
    // A rock has no neck, so a crawler always crumbles where it stands.
    // A rock has no neck, so a crawler never pops its head off. It digs
    // itself into the ground instead, and something grows back.
    // The hood NEVER comes off, so an archer always topples - it is not
    // allowed to be one of the ones whose head goes bouncing away.
    f.deathStyle = f.kind === 'crawler' ? 'burrow'
                 : f.kind === 'archer' ? 'topple'
                 : (Math.random() < 0.34 ? 'pop' : 'topple');
    f.fallDir = f.face * -1;
    addSplat(f.x, f.depth, f.deathStyle === 'pop' ? 1.3 : 0.9);
    if (f.deathStyle === 'pop') {
      heads.push({
        x: f.x, depth: f.depth, z: 34,
        vx: (from ? (f.x > from.x ? 1 : -1) : 1) * (110 + Math.random() * 130),
        vz: 240 + Math.random() * 120,
        spin: (Math.random() - 0.5) * 16, angle: 0,
        foe: f, life: 4.2,
      });
      oozeBurst(f.x, f.depth, f.z + 34, 16);
      tone(760, 0.09, 'square', 0.09, 190);
    }
    boom(f.x, f.depth, f.z + 20, f.E.body, 14);
    popSound();
    floatText(f.x, f.depth, f.z + 56, '+' + f.E.xp + ' XP', '#ffd83d');
  }
}
function hurtHero(dmg) {
  if (hero.dead || hero.hurt > 0.3) return;         // a moment of mercy after a hit
  hero.health -= dmg;
  hero.hurt = 0.55;
  shake = Math.max(shake, 10);
  boom(hero.x, hero.depth, hero.z + 20, '#ff5a5a', 8);
  tone(180, 0.16, 'sawtooth', 0.1, 70);
  if (hero.health <= 0) {
    hero.health = 0;
    hero.dead = true;
    screen = 'dead';
    resultTimer = 0;
    sadTune();
  }
}

// ---- the four magics ----
function castMagic() {
  if (hero.magicCool > 0 || hero.dead) return;
  hero.magicCool = MAGIC_COOL;
  const K = hero.K;
  tone(500, 0.3, 'sine', 0.09, 1200);
  shake = Math.max(shake, 8);
  if (K.id === 'red') {
    // FIRE: a wave of flame straight ahead that sets them alight
    magics.push({ type: 'fire', x: hero.x, depth: hero.depth, z: 10,
                  vx: hero.face * 420, life: 0.9, hits: [] });
  } else if (K.id === 'blue') {
    // ICE: everything near you freezes where it stands
    for (const f of foes) {
      if (f.dead || Math.abs(f.x - hero.x) > 240) continue;
      f.frozen = 2.6;
      hurtFoe(f, 4 + myPower(), 0, hero);
      boom(f.x, f.depth, f.z + 20, '#7fe4ff', 10);
    }
    magics.push({ type: 'ice', x: hero.x, depth: hero.depth, z: 0, life: 0.5 });
  } else if (K.id === 'green') {
    // POISON: a cloud that sits there eating anything inside it
    magics.push({ type: 'poison', x: hero.x + hero.face * 90, depth: hero.depth, z: 0,
                  life: 4.0, tick: 0 });
  } else {
    // LIGHTNING: jumps to the nearest few and hits them all
    const near = foes.filter(f => !f.dead && Math.abs(f.x - hero.x) < 420)
                     .sort((a, b) => Math.abs(a.x - hero.x) - Math.abs(b.x - hero.x))
                     .slice(0, 4);
    let from = hero;
    for (const f of near) {
      magics.push({ type: 'bolt', x1: from.x, d1: from.depth, z1: from.z + 30,
                    x2: f.x, d2: f.depth, z2: f.z + 30, life: 0.35 });
      hurtFoe(f, 10 + myPower() * 2, 6, from);
      from = f;
    }
    if (!near.length) magics.push({ type: 'bolt', x1: hero.x, d1: hero.depth, z1: hero.z + 30,
                                    x2: hero.x + hero.face * 200, d2: hero.depth, z2: 0, life: 0.3 });
  }
}
