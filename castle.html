<canvas id="game"></canvas>
<script>
// =====================================================================
// KNIGHTS OF THE FOUR
//
// Pick a knight, take a name, and fight your way across the map.
//
// THE VIEW is the Castle Crashers one: side on, but the floor has
// DEPTH. Walk up and you go further away and get smaller; walk down and
// you come towards the camera and get bigger. Everything is sorted by
// how far up the floor it stands, so whoever is nearer is drawn on top.
// That one idea turns a flat side view into a stage.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = 'BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// THE FOUR KNIGHTS. Same shape, four very different magics.
// ---------------------------------------------------------------------
const KNIGHTS = [
  { id: 'red', name: 'RED', body: '#e0392b', dark: '#8f1e15', trim: '#ffd06a',
    magic: 'FIRE', magicColor: '#ff8b1f',
    blurb: 'sets them alight - they keep burning', power: 3, health: 100 },
  { id: 'blue', name: 'BLUE', body: '#2f7ad6', dark: '#17457f', trim: '#bfe8ff',
    magic: 'ICE', magicColor: '#7fe4ff',
    blurb: 'freezes them solid so they cannot move', power: 3, health: 105 },
  { id: 'green', name: 'GREEN', body: '#3aa843', dark: '#1d6023', trim: '#c8ff9a',
    magic: 'POISON', magicColor: '#a6ff5c',
    blurb: 'a cloud that eats anything standing in it', power: 2, health: 95 },
  { id: 'orange', name: 'ORANGE', body: '#f0821f', dark: '#a34f08', trim: '#ffe0a8',
    magic: 'LIGHTNING', magicColor: '#ffe94a',
    blurb: 'jumps between them and hits the lot', power: 3, health: 110 },
];

// ---------------------------------------------------------------------
// THE MAP. Each level knows where it sits, and which one must be beaten
// before it opens.
// ---------------------------------------------------------------------
// Everybody is on the level from the moment it starts - no waves. They
// are spread out along it and wait where they stand until you come
// near, so a level is a march you can see coming rather than things
// appearing out of nowhere behind you.
const LEVELS = [
  { id: 0, name: 'THE CASTLE', x: 0.12, y: 0.74, needs: -1, count: 10, enemy: 'goblin',
    scene: 'castle', blurb: 'they have wrecked your hall and want the gold',
    chest: true, cutscene: true, wrecked: true },
  { id: 1, name: 'THE MEADOW', x: 0.25, y: 0.55, needs: 0, count: 8, enemy: 'goblin',
    scene: 'grass', blurb: 'out of the gates, after him' },
  { id: 2, name: 'DARK WOOD', x: 0.37, y: 0.74, needs: 1, count: 10, enemy: 'bat',
    scene: 'wood', blurb: 'something in the trees' },
  { id: 3, name: 'THE CAVES', x: 0.49, y: 0.5, needs: 2, count: 11, enemy: 'slime',
    scene: 'cave', blurb: 'dripping, and full of slime' },
  { id: 4, name: 'SNOW PASS', x: 0.61, y: 0.72, needs: 3, count: 12, enemy: 'goblin',
    scene: 'snow', blurb: 'cold, and they are waiting' },
  { id: 5, name: 'THE KEEP', x: 0.73, y: 0.46, needs: 4, count: 12, enemy: 'knight',
    scene: 'castle', blurb: 'proper soldiers now' },
  { id: 6, name: 'LAVA GATE', x: 0.84, y: 0.68, needs: 5, count: 14, enemy: 'slime',
    scene: 'lava', blurb: 'hot. very hot.' },
  { id: 7, name: 'TOP TOWER', x: 0.93, y: 0.3, needs: 6, count: 8, enemy: 'knight',
    scene: 'castle', blurb: 'the one who took the gold', boss: true },
];

// ---------------------------------------------------------------------
// WHAT YOU HAVE DONE SO FAR - kept between visits
// ---------------------------------------------------------------------
let save = { name: '', knight: 0, beaten: [], xp: 0 };
try {
  const raw = JSON.parse(localStorage.getItem('castle_save'));
  if (raw && typeof raw === 'object') save = Object.assign(save, raw);
} catch (e) {}
if (!Array.isArray(save.beaten)) save.beaten = [];
function saveGame() { localStorage.setItem('castle_save', JSON.stringify(save)); }
function isBeaten(id) { return save.beaten.includes(id); }
function isOpen(lv) { return lv.needs < 0 || isBeaten(lv.needs); }
function heroLevel() { return 1 + Math.floor(save.xp / 60); }
function maxHealth() { return KNIGHTS[save.knight].health + (heroLevel() - 1) * 12; }
function myPower() { return KNIGHTS[save.knight].power + Math.floor((heroLevel() - 1) * 0.7); }
function playerName() { return (save.name || '').trim() || 'KNIGHT'; }

let screen = 'title';            // title | select | map | fight | cleared | dead
let held = {}, touchMode = false, uiRects = [], shake = 0;
let particles = [], floaters = [];
let mapPick = 0;
</script>
<script>
// =====================================================================
// THE STAGE
//
// The floor is a band across the screen. depth 0 is the BACK of it and
// depth 1 is the FRONT, nearest the camera. Everything standing on the
// floor gets its screen position and its size from its depth, which is
// the whole trick of this view.
// =====================================================================
// =====================================================================
// THE THREE MODES.
//
// They change how many are waiting for you: 20, 25, or 25 plus another
// twenty on top. The LEVEL GETS LONGER to match, so forty-five of them
// is a long march rather than a solid wall you cannot get through - the
// same idea as a bigger board needing more apples in Snake Fight.
// =====================================================================
const MODES = [
  { name: 'EASY',   count: 20, desc: '20 of them' },
  { name: 'NORMAL', count: 25, desc: '25 of them' },
  { name: 'HARD',   count: 45, desc: '25 and TWENTY MORE' },
];
let modeIx = parseInt(localStorage.getItem('castle_mode') || '1');
if (!(modeIx >= 0 && modeIx < MODES.length)) modeIx = 1;
function mode() { return MODES[modeIx]; }
// how many turn up in a level - the boss level keeps its own smaller
// count, because forty-five soldiers AND a boss is not a fight, it is a
// queue
function levelCount(lv) { return lv.boss ? Math.round(mode().count * 0.4) : mode().count; }
// and the level stretches to fit them, so they are never shoulder to
// shoulder however many you asked for
let STAGE_W = 2100;
function stageLengthFor(lv) {
  return Math.round(1500 + levelCount(lv) * 105);
}

function stage() {
  const W = canvas.width, H = canvas.height;
  const hud = Math.min(76, H * 0.13);
  const backY = hud + (H - hud) * 0.42;             // the far edge of the floor
  const frontY = H - (H - hud) * 0.08;              // the near edge
  return { W, H, hud, backY, frontY, floorH: frontY - backY };
}
// how big is something stood at this depth? nearer = bigger
function depthScale(depth) { return 1.15 + depth * 0.62; }
// where does it sit on the screen?
function toScreen(a, S, camX) {
  // Anything missing a number would give NaN here, and canvas draws
  // NOTHING at NaN without complaining - so treat a missing z as zero
  // rather than letting it poison the sum.
  const depth = a.depth || 0;
  const sc = depthScale(depth);
  return {
    x: (a.x || 0) - camX,
    y: S.backY + depth * S.floorH - (a.z || 0),     // z is how high it is off the floor
    sc,
  };
}

// ---------------------------------------------------------------------
// EVERYBODY IN A FIGHT
// ---------------------------------------------------------------------
// What a goblin is carrying. It changes how hard it hits, how far it
// reaches and how long it takes to swing again - so a room of them
// fights differently depending on what they picked up.
const WEAPONS = {
  club:  { name: 'club',  power: 1.0, reach: 1.0, cool: 1.0 },
  axe:   { name: 'axe',   power: 1.6, reach: 0.95, cool: 1.5 },   // heavy and slow
  sword: { name: 'sword', power: 0.85, reach: 1.25, cool: 0.75 }, // quick, long
};
const WEAPON_LIST = ['club', 'axe', 'sword'];

const ENEMY_KINDS = {
  goblin: { name: 'GOBLIN', body: '#6b4a2a', dark: '#3d2916', health: 22, power: 6,
            speed: 78, r: 20, xp: 8, eyes: '#ffe94a',
            skin: '#78b043', skinDark: '#4c7526' },
  bat:    { name: 'BAT', body: '#6a4a8f', dark: '#3c2757', health: 16, power: 5,
            speed: 118, r: 17, xp: 9, flies: true },
  slime:  { name: 'SLIME', body: '#3fbf8f', dark: '#1f6f52', health: 30, power: 7,
            speed: 58, r: 22, xp: 11 },
  knight: { name: 'SOLDIER', body: '#9aa4b4', dark: '#4d5666', health: 40, power: 9,
            speed: 84, r: 21, xp: 15 },
  boss:   { name: 'THE BARON', body: '#b02a6a', dark: '#61143a', health: 260, power: 13,
            speed: 66, r: 40, xp: 90, boss: true },
};

let hero = null, foes = [], magics = [], camX = 0;
let heads = [];                  // heads that have popped off and gone bouncing
let props = [];                  // rubble, fires and broken stone on the floor
let fightLevel = null, cleared = false, resultTimer = 0, clearTimer = 0;
let chest = null;                // the chest of gold, on levels that have one
let cut = null;                  // a cutscene playing, if there is one
let gainedXP = 0;

function newHero() {
  const K = KNIGHTS[save.knight];
  return {
    kind: 'hero', K,
    x: 140, depth: 0.55, z: 0, vz: 0,
    vx: 0, vdepth: 0,
    face: 1, r: 20,
    health: maxHealth(), maxHealth: maxHealth(),
    attack: 0, cool: 0, combo: 0, comboTimer: 0,
    magic: 0, magicCool: 0, hurt: 0, dead: false,
    walkT: 0,
  };
}
function newFoe(kind, x, depth) {
  const E = ENEMY_KINDS[kind];
  return {
    kind, E,
    x, depth, z: E.flies ? 42 : 0, vz: 0,
    vx: 0, vdepth: 0, face: -1, r: E.r,
    health: E.health, maxHealth: E.health,
    weapon: WEAPON_LIST[Math.floor(Math.random() * WEAPON_LIST.length)],
    attack: 0, cool: 0.6 + Math.random() * 0.7, hurt: 0, dead: false,
    frozen: 0, burning: 0, poisoned: 0, walkT: Math.random() * 6,
    bob: Math.random() * 6,
    awake: false,                  // stands about until you come near
  };
}

// ---------------------------------------------------------------------
// SOUND, made of maths
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function tone(freq, len, type, vol, slideTo) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, audio.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, audio.currentTime + len);
  g.gain.setValueAtTime(vol === undefined ? 0.07 : vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + len + 0.02);
}
function hitSound() { tone(220, 0.09, 'square', 0.09, 90); }
function swingSound() { tone(600, 0.05, 'sine', 0.04, 900); }
function popSound() { tone(320, 0.14, 'square', 0.07, 120); }
function fanfare() {
  [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => tone(n, 0.2, 'square', 0.09), i * 110));
}
function sadTune() {
  [400, 340, 280, 200].forEach((n, i) => setTimeout(() => tone(n, 0.3, 'sine', 0.09), i * 160));
}

function boom(x, depth, z, color, count) {
  for (let i = 0; i < (count || 12); i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 170;
    particles.push({ x, depth, z, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp + 60,
                     life: 0.45 + Math.random() * 0.4, color });
  }
}
// Green ooze. Definitely not blood - it is bright, it is bouncy, and it
// belongs to something with six eyes and a metal face.
function oozeBurst(x, depth, z, count) {
  for (let i = 0; i < (count || 10); i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 140;
    particles.push({
      x, depth, z,
      vx: Math.cos(a) * sp, vz: Math.sin(a) * sp + 110,
      life: 0.7 + Math.random() * 0.7,
      color: Math.random() < 0.5 ? '#7fdf3f' : '#4f9e22',
      ooze: true,
    });
  }
}
function floatText(x, depth, z, text, color) {
  floaters.push({ x, depth, z, text, color, life: 0.85 });
}
</script>
<script>
// =====================================================================
// FIGHTING
// =====================================================================
const HERO_SPEED = 190;          // left and right
const DEPTH_SPEED = 0.55;        // up and down the floor, per second
const GRAVITY = 1500;
const JUMP_V = 520;
const SWING_TIME = 0.22;
const SWING_COOL = 0.1;
const MAGIC_COOL = 3.2;

function startLevel(lv) {
  fightLevel = lv;
  STAGE_W = stageLengthFor(lv);                   // longer levels for more of them
  hero = newHero();
  foes = [];
  magics = [];
  particles = [];
  floaters = [];
  heads = [];
  props = [];
  chest = null;
  cut = null;
  camX = 0;
  cleared = false;
  gainedXP = 0;
  fillLevel(lv);
  screen = 'fight';
}

// The state your hall has been left in. Rubble and fires are laid out
// along the level and stand on the floor like everybody else, so they
// sort by depth and you can walk in front of or behind them.
function litterLevel(lv) {
  props = [];
  if (!lv.wrecked) return;
  // a seeded shuffle would be overkill - this only runs once per level
  const drop = (kind, x, depth, size) => props.push({
    kind, x, depth, z: 0, size,
    seed: Math.random() * 100,
    r: 16 * size,
  });
  for (let x = 260; x < STAGE_W - 120; x += 150 + Math.random() * 120) {
    const roll = Math.random();
    const depth = 0.08 + Math.random() * 0.86;
    if (roll < 0.42) drop('rubble', x, depth, 0.7 + Math.random() * 0.8);
    else if (roll < 0.7) drop('fire', x, depth, 0.75 + Math.random() * 0.6);
    else if (roll < 0.86) drop('block', x, depth, 0.8 + Math.random() * 0.7);
    else drop('column', x, depth, 0.9 + Math.random() * 0.5);
  }
  // and a proper heap of it near the gold, where they broke in
  for (let i = 0; i < 5; i++) {
    drop(i % 2 ? 'rubble' : 'fire', STAGE_W - 420 + i * 70, 0.15 + Math.random() * 0.3,
         0.8 + Math.random() * 0.6);
  }
}

// Everybody gets put out along the level at the start, spread from one
// end to the other. They wait where they stand until you come near, so
// you meet them a few at a time as you walk.
function fillLevel(lv) {
  litterLevel(lv);
  const count = levelCount(lv);
  const first = 460;                              // room to get going
  const last = STAGE_W - 300;
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = first + t * (last - first) + (Math.random() - 0.5) * 130;
    foes.push(newFoe(lv.enemy, x, 0.15 + Math.random() * 0.75));
  }
  if (lv.boss) foes.push(newFoe('boss', STAGE_W - 180, 0.55));
  if (lv.chest) {
    chest = { x: STAGE_W - 170, depth: 0.62, z: 0, bob: 0, taken: false, lift: 0 };
  }
}

// two things can hit each other if they are close along the floor AND
// standing at about the same depth. Being further up the floor than
// somebody is exactly how you dodge in this view.
function inRange(a, b, reach) {
  const dx = Math.abs(a.x - b.x);
  const dd = Math.abs(a.depth - b.depth);
  const dz = Math.abs((a.z || 0) - (b.z || 0));
  return dx < reach && dd < 0.16 && dz < 60;
}
function faceToward(a, b) { a.face = b.x > a.x ? 1 : -1; }
// anything without a weapon just swings its fists, so this never breaks
function weaponOf(f) { return WEAPONS[f.weapon] || WEAPONS.club; }

function hurtFoe(f, dmg, knock, from) {
  if (f.dead) return;
  f.health -= dmg;
  f.hurt = 0.18;
  f.x += knock * (from ? (f.x > from.x ? 1 : -1) : 1);
  floatText(f.x, f.depth, f.z + 40, String(Math.round(dmg)), '#fff');
  boom(f.x, f.depth, f.z + 20, f.E.body, 6);
  hitSound();
  if (f.health <= 0) {
    f.dead = true;
    f.deadT = 0;
    gainedXP += f.E.xp;
    // Two ways to go, picked at random: topple over and lie there, or
    // the head comes clean off and bounces away. Roughly one in three.
    f.deathStyle = Math.random() < 0.34 ? 'pop' : 'topple';
    f.fallDir = f.face * -1;
    if (f.deathStyle === 'pop') {
      heads.push({
        x: f.x, depth: f.depth, z: 34,
        vx: (from ? (f.x > from.x ? 1 : -1) : 1) * (110 + Math.random() * 130),
        vz: 240 + Math.random() * 120,
        spin: (Math.random() - 0.5) * 16, angle: 0,
        foe: f, life: 4.2,
      });
      oozeBurst(f.x, f.depth, f.z + 34, 16);
      tone(760, 0.09, 'square', 0.09, 190);
    }
    boom(f.x, f.depth, f.z + 20, f.E.body, 14);
    popSound();
    floatText(f.x, f.depth, f.z + 56, '+' + f.E.xp + ' XP', '#ffd83d');
  }
}
function hurtHero(dmg) {
  if (hero.dead || hero.hurt > 0.3) return;         // a moment of mercy after a hit
  hero.health -= dmg;
  hero.hurt = 0.55;
  shake = Math.max(shake, 10);
  boom(hero.x, hero.depth, hero.z + 20, '#ff5a5a', 8);
  tone(180, 0.16, 'sawtooth', 0.1, 70);
  if (hero.health <= 0) {
    hero.health = 0;
    hero.dead = true;
    screen = 'dead';
    resultTimer = 0;
    sadTune();
  }
}

// ---- the four magics ----
function castMagic() {
  if (hero.magicCool > 0 || hero.dead) return;
  hero.magicCool = MAGIC_COOL;
  const K = hero.K;
  tone(500, 0.3, 'sine', 0.09, 1200);
  shake = Math.max(shake, 8);
  if (K.id === 'red') {
    // FIRE: a wave of flame straight ahead that sets them alight
    magics.push({ type: 'fire', x: hero.x, depth: hero.depth, z: 10,
                  vx: hero.face * 420, life: 0.9, hits: [] });
  } else if (K.id === 'blue') {
    // ICE: everything near you freezes where it stands
    for (const f of foes) {
      if (f.dead || Math.abs(f.x - hero.x) > 240) continue;
      f.frozen = 2.6;
      hurtFoe(f, 4 + myPower(), 0, hero);
      boom(f.x, f.depth, f.z + 20, '#7fe4ff', 10);
    }
    magics.push({ type: 'ice', x: hero.x, depth: hero.depth, z: 0, life: 0.5 });
  } else if (K.id === 'green') {
    // POISON: a cloud that sits there eating anything inside it
    magics.push({ type: 'poison', x: hero.x + hero.face * 90, depth: hero.depth, z: 0,
                  life: 4.0, tick: 0 });
  } else {
    // LIGHTNING: jumps to the nearest few and hits them all
    const near = foes.filter(f => !f.dead && Math.abs(f.x - hero.x) < 420)
                     .sort((a, b) => Math.abs(a.x - hero.x) - Math.abs(b.x - hero.x))
                     .slice(0, 4);
    let from = hero;
    for (const f of near) {
      magics.push({ type: 'bolt', x1: from.x, d1: from.depth, z1: from.z + 30,
                    x2: f.x, d2: f.depth, z2: f.z + 30, life: 0.35 });
      hurtFoe(f, 10 + myPower() * 2, 6, from);
      from = f;
    }
    if (!near.length) magics.push({ type: 'bolt', x1: hero.x, d1: hero.depth, z1: hero.z + 30,
                                    x2: hero.x + hero.face * 200, d2: hero.depth, z2: 0, life: 0.3 });
  }
}
</script>
<script>
// =====================================================================
// THE CUTSCENE.
//
// It runs on its own clock and takes the controls off you for a moment.
// An enormous knight in rust-and-crimson stained armour walks in, picks
// up the gold, and walks off with it. That is WHY there is a map to
// fight across - you are going after him.
// =====================================================================
function startCutscene() {
  cut = { t: 0, x: STAGE_W + 240, depth: 0.62, phase: 'in', said: false };
  screen = 'cutscene';
  held = {};
  tone(70, 1.2, 'sawtooth', 0.14, 45);            // one great doom-laden note
}
function updateCutscene(dt) {
  cut.t += dt;
  const stopAt = chest.x + 120;
  const step = () => Math.floor(cut.t * 2.2) !== Math.floor((cut.t - dt) * 2.2);
  if (cut.phase === 'in') {
    cut.x -= 200 * dt;
    if (step()) { tone(58, 0.17, 'sine', 0.13, 38); shake = Math.max(shake, 8); }
    if (cut.x <= stopAt) { cut.x = stopAt; cut.phase = 'grab'; cut.t = 0; }
  } else if (cut.phase === 'grab') {
    if (cut.t > 0.6) {
      chest.taken = true;
      chest.lift = 0;
      if (!cut.said) { cut.said = true; tone(430, 0.5, 'sawtooth', 0.1, 110); }
    }
    if (cut.t > 2.1) { cut.phase = 'out'; cut.t = 0; }
  } else {
    cut.x += 240 * dt;
    if (step()) tone(58, 0.17, 'sine', 0.1, 38);
    if (cut.x > STAGE_W + 280) { resultTimer = 0; screen = 'cleared'; fanfare(); }
  }
  // the camera watches HIM, not you
  const want = cut.x - canvas.width * 0.55;
  camX += (Math.max(0, Math.min(STAGE_W - canvas.width, want)) - camX) * Math.min(1, dt * 3);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  for (const p of particles) { p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}


// =====================================================================
// ONE STEP OF A FIGHT
// =====================================================================
function keyDown(names) { return names.some(k => held[k]); }

function updateFight(dt) {
  const S = stage();
  const K = hero.K;

  // ---- you ----
  if (!hero.dead) {
    let mx = 0, md = 0;
    if (keyDown(['a', 'ArrowLeft'])) mx -= 1;
    if (keyDown(['d', 'ArrowRight'])) mx += 1;
    if (keyDown(['w', 'ArrowUp'])) md -= 1;
    if (keyDown(['s', 'ArrowDown'])) md += 1;
    const busy = hero.attack > 0;
    const spd = busy ? 0.25 : 1;
    hero.x += mx * HERO_SPEED * spd * dt;
    hero.depth += md * DEPTH_SPEED * spd * dt;
    hero.depth = Math.max(0, Math.min(1, hero.depth));
    hero.x = Math.max(30, Math.min(STAGE_W - 30, hero.x));
    if (mx !== 0 && !busy) hero.face = mx;
    if (mx !== 0 || md !== 0) hero.walkT += dt * 9; else hero.walkT = 0;

    // jumping
    hero.z += hero.vz * dt;
    if (hero.z > 0) hero.vz -= GRAVITY * dt;
    if (hero.z <= 0) { hero.z = 0; hero.vz = 0; }

    hero.attack = Math.max(0, hero.attack - dt);
    hero.cool = Math.max(0, hero.cool - dt);
    hero.magicCool = Math.max(0, hero.magicCool - dt);
    hero.hurt = Math.max(0, hero.hurt - dt);
    hero.comboTimer = Math.max(0, hero.comboTimer - dt);
    if (hero.comboTimer <= 0) hero.combo = 0;

    // the swing lands halfway through, not the moment you press
    if (hero.attack > 0 && !hero.swung && hero.attack < SWING_TIME * 0.62) {
      hero.swung = true;
      const reach = 62 + hero.combo * 6;
      let landed = false;
      for (const f of foes) {
        if (f.dead) continue;
        if ((f.x - hero.x) * hero.face < -12) continue;   // must be in front
        if (!inRange(hero, f, reach)) continue;
        const dmg = 7 + myPower() * 2 + hero.combo * 2;
        hurtFoe(f, dmg, 14 + hero.combo * 3, hero);
        landed = true;
      }
      if (landed) {
        hero.combo = Math.min(4, hero.combo + 1);
        hero.comboTimer = 1.1;
        shake = Math.max(shake, 5);
      }
    }
  }

  // ---- them ----
  for (const f of foes) {
    if (f.dead) continue;
    f.hurt = Math.max(0, f.hurt - dt);
    f.frozen = Math.max(0, f.frozen - dt);
    f.bob += dt * 4;
    if (f.burning > 0) {
      f.burning -= dt;
      f.burnTick = (f.burnTick || 0) + dt;
      if (f.burnTick > 0.45) { f.burnTick = 0; hurtFoe(f, 4 + myPower(), 0, null); }
      if (Math.random() < 0.4) {
        particles.push({ x: f.x + (Math.random() - 0.5) * 20, depth: f.depth, z: f.z + 20,
                         vx: 0, vz: 60, life: 0.4, color: '#ff8b1f' });
      }
    }
    if (f.poisoned > 0) {
      f.poisoned -= dt;
      f.poisonTick = (f.poisonTick || 0) + dt;
      if (f.poisonTick > 0.5) { f.poisonTick = 0; hurtFoe(f, 3 + myPower(), 0, null); }
    }
    if (f.frozen > 0) continue;                     // frozen solid, cannot act

    f.cool = Math.max(0, f.cool - dt);
    f.attack = Math.max(0, f.attack - dt);
    if (hero.dead) continue;
    const dx = hero.x - f.x, dd = hero.depth - f.depth;
    // WAKING UP. Until you come near they just stand there, so you meet
    // them a few at a time instead of the whole level charging at once.
    if (!f.awake) {
      if (Math.abs(dx) < canvas.width * 0.55) {
        f.awake = true;
        if (Math.random() < 0.3) tone(200 + Math.random() * 180, 0.07, 'square', 0.04);
      } else {
        f.walkT += dt * 1.2;                       // a bored little shuffle
        continue;
      }
    }
    faceToward(f, hero);
    const close = inRange(f, hero, 46 * weaponOf(f).reach);
    if (!close && f.attack <= 0) {
      // walk towards you, along the floor and up or down it
      const sp = f.E.speed * (f.E.boss ? 1 : 1) * dt;
      if (Math.abs(dx) > 34) f.x += Math.sign(dx) * sp;
      if (Math.abs(dd) > 0.03) f.depth += Math.sign(dd) * DEPTH_SPEED * 0.75 * dt;
      f.depth = Math.max(0, Math.min(1, f.depth));
      f.walkT += dt * 8;
      if (f.E.flies) f.z = 40 + Math.sin(f.bob) * 14;
    } else if (close && f.cool <= 0) {
      f.attack = 0.42;
      f.cool = (1.0 + Math.random() * 0.8) * weaponOf(f).cool;
      f.swung = false;
    }
    if (f.attack > 0 && !f.swung && f.attack < 0.2) {
      f.swung = true;
      const W = weaponOf(f);
      if (inRange(f, hero, 52 * W.reach)) hurtHero(Math.round(f.E.power * W.power));
    }
  }
  // the fallen stay lying there for a few seconds before fading away
  for (const f of foes) if (f.dead) f.deadT = (f.deadT || 0) + dt;
  foes = foes.filter(f => !f.dead || f.deadT < 4.2);

  // heads that have come off, bouncing about
  for (const h of heads) {
    h.life -= dt;
    h.z += h.vz * dt;
    h.x += h.vx * dt;
    h.angle += h.spin * dt;
    h.vz -= 900 * dt;
    if (h.z <= 0) {
      h.z = 0;
      if (Math.abs(h.vz) > 60) {
        h.vz = -h.vz * 0.42;                    // a bounce
        h.vx *= 0.6;
        h.spin *= 0.5;
        oozeBurst(h.x, h.depth, 6, 3);
        tone(300, 0.05, 'square', 0.04);
      } else { h.vz = 0; h.vx *= 0.86; h.spin *= 0.7; }
    }
    // it drips as it goes
    if (Math.random() < 0.14) {
      particles.push({ x: h.x, depth: h.depth, z: h.z + 6, vx: 0, vz: -10,
                       life: 0.7, color: '#4f9e22', ooze: true });
    }
  }
  heads = heads.filter(h => h.life > 0);

  // ---- magic that is still going ----
  for (const m of magics) {
    m.life -= dt;
    if (m.type === 'fire') {
      m.x += m.vx * dt;
      for (const f of foes) {
        if (f.dead || m.hits.includes(f)) continue;
        if (Math.abs(f.x - m.x) < 40 && Math.abs(f.depth - m.depth) < 0.2) {
          m.hits.push(f);
          f.burning = 2.4;
          hurtFoe(f, 8 + myPower(), 8, { x: m.x - m.vx });
        }
      }
      if (Math.random() < 0.8) {
        particles.push({ x: m.x, depth: m.depth, z: 10 + Math.random() * 30,
                         vx: -m.vx * 0.15, vz: 40, life: 0.35, color: '#ff8b1f' });
      }
    } else if (m.type === 'poison') {
      m.tick += dt;
      if (m.tick > 0.5) {
        m.tick = 0;
        for (const f of foes) {
          if (f.dead) continue;
          if (Math.abs(f.x - m.x) < 90 && Math.abs(f.depth - m.depth) < 0.3) {
            f.poisoned = 1.2;
            hurtFoe(f, 3 + myPower(), 0, null);
          }
        }
      }
      if (Math.random() < 0.7) {
        particles.push({ x: m.x + (Math.random() - 0.5) * 150, depth: m.depth,
                         z: Math.random() * 40, vx: 0, vz: 20, life: 0.6, color: '#a6ff5c' });
      }
    }
  }
  magics = magics.filter(m => m.life > 0);

  // ---- is the field clear? ----
  const alive = foes.filter(f => !f.dead).length;
  if (!cleared && alive === 0) {
    clearTimer += dt;
    if (clearTimer > 0.8) {
      cleared = true;
      if (!isBeaten(fightLevel.id)) save.beaten.push(fightLevel.id);
      save.xp += gainedXP;
      saveGame();
      // a level with a cutscene plays it before the CLEARED screen
      if (fightLevel.cutscene && chest && !chest.taken) startCutscene();
      else { resultTimer = 0; screen = 'cleared'; fanfare(); }
    }
  }
  // the chest bobs about, waiting
  if (chest) chest.bob += dt * 2.4;

  // ---- the camera follows you, but never past the ends ----
  const want = hero.x - S.W * 0.42;
  camX += (Math.max(0, Math.min(STAGE_W - S.W, want)) - camX) * Math.min(1, dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 60);

  for (const p of particles) {
    p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.z += 46 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}
</script>
<script>
// =====================================================================
// DRAWING PEOPLE
// =====================================================================
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// a shadow on the floor, right under whoever it belongs to. This is what
// tells you where somebody really IS when they have jumped.
function drawShadow(sx, floorY, sc, r) {
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(sx, floorY, r * sc * 1.05, r * sc * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawKnight(a, sx, sy, sc) {
  const K = a.K, r = 20 * sc;
  const wob = Math.sin(a.walkT) * r * 0.12;
  ctx.save();
  ctx.translate(sx, sy);
  if (a.hurt > 0 && Math.floor(a.hurt * 22) % 2) ctx.globalAlpha = 0.5;
  // the sword, swung in an arc
  const swing = a.attack > 0 ? (1 - a.attack / SWING_TIME) : 0;
  if (a.attack > 0) {
    ctx.save();
    ctx.translate(a.face * r * 0.7, -r * 0.9);
    ctx.rotate(a.face * (-1.1 + swing * 2.4));
    ctx.fillStyle = '#d8dde6';
    roundRect(-r * 0.12, -r * 1.9, r * 0.24, r * 1.9, r * 0.1);
    ctx.fill();
    ctx.fillStyle = K.trim;
    roundRect(-r * 0.3, -r * 0.16, r * 0.6, r * 0.24, r * 0.08);
    ctx.fill();
    ctx.restore();
  }
  // legs
  ctx.fillStyle = K.dark;
  for (const side of [-1, 1]) {
    const lift = Math.sin(a.walkT + (side > 0 ? Math.PI : 0)) * r * 0.22;
    roundRect(side * r * 0.34 - r * 0.16, -r * 0.5, r * 0.32, r * 0.62 + lift, r * 0.1);
    ctx.fill();
  }
  // body
  ctx.fillStyle = K.body;
  roundRect(-r * 0.55, -r * 1.6 + wob, r * 1.1, r * 1.15, r * 0.28);
  ctx.fill();
  ctx.fillStyle = K.trim;                            // the belt
  ctx.fillRect(-r * 0.55, -r * 0.66 + wob, r * 1.1, r * 0.16);
  // helmet
  ctx.fillStyle = K.body;
  ctx.beginPath();
  ctx.arc(0, -r * 1.95 + wob, r * 0.62, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.62, -r * 1.95 + wob, r * 1.24, r * 0.5);
  ctx.fillStyle = '#1a1220';                          // the visor slit
  ctx.fillRect(-r * 0.42 + a.face * r * 0.08, -r * 1.85 + wob, r * 0.84, r * 0.2);
  ctx.fillStyle = K.trim;                             // the plume
  ctx.beginPath();
  ctx.moveTo(0, -r * 2.55 + wob);
  ctx.lineTo(-a.face * r * 0.5, -r * 2.1 + wob);
  ctx.lineTo(0, -r * 2.15 + wob);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawChest(sx, sy, sc, c) {
  const w = 78 * sc, h = 52 * sc;
  const bob = Math.sin(c.bob) * 3 * sc;
  ctx.save();
  ctx.translate(sx, sy - c.lift * 90 * sc + bob);
  // the pile of gold spilling out of it
  ctx.fillStyle = '#ffd83d';
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * w * 0.42, -h * 0.72 + Math.sin(a) * h * 0.18, w * 0.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#8a5a2a';                       // the box
  roundRect(-w / 2, -h, w, h, w * 0.07); ctx.fill();
  ctx.fillStyle = '#6b4420';
  roundRect(-w / 2, -h * 0.42, w, h * 0.42, w * 0.05); ctx.fill();
  ctx.fillStyle = '#c9a227';                       // the bands
  ctx.fillRect(-w / 2, -h * 0.5, w, h * 0.12);
  ctx.fillRect(-w * 0.09, -h, w * 0.18, h);
  ctx.fillStyle = '#ffe07a';                       // the lock
  roundRect(-w * 0.09, -h * 0.55, w * 0.18, h * 0.24, 3); ctx.fill();
  ctx.restore();
  // a glow, so you can see it from across the level
  ctx.fillStyle = 'rgba(255,216,61,0.16)';
  ctx.beginPath();
  ctx.ellipse(sx, sy - c.lift * 90 * sc, w * 0.9, h * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

// The one who takes the gold. Enormous, dark, and his armour is stained
// rust-red - it is the same trick every villain uses: make him the same
// shape as you but far too big.
function drawBaron(sx, sy, sc, phase, t) {
  const r = 30 * sc;
  const walk = phase === 'grab' ? 0 : t * 7;
  const wob = Math.sin(walk) * r * 0.1;
  ctx.save();
  ctx.translate(sx, sy);
  // legs
  ctx.fillStyle = '#3a2028';
  for (const side of [-1, 1]) {
    const lift = Math.sin(walk + (side > 0 ? Math.PI : 0)) * r * 0.26;
    roundRect(side * r * 0.38 - r * 0.2, -r * 0.6, r * 0.4, r * 0.75 + lift, r * 0.1);
    ctx.fill();
  }
  // body, with the stains
  ctx.fillStyle = '#4a3038';
  roundRect(-r * 0.72, -r * 1.95 + wob, r * 1.44, r * 1.45, r * 0.3); ctx.fill();
  ctx.fillStyle = '#7d1f28';
  ctx.beginPath();
  ctx.ellipse(-r * 0.2, -r * 1.35 + wob, r * 0.34, r * 0.5, 0.4, 0, Math.PI * 2);
  ctx.ellipse(r * 0.34, -r * 1.7 + wob, r * 0.22, r * 0.3, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // SHOULDERS, ARMS AND HANDS. He reaches down for the gold while he is
  // grabbing it and holds it up as he leaves, so the arms have to move.
  const reach = phase === 'grab' ? Math.min(1, t * 1.6) : 0;
  const carry = phase === 'out' ? 1 : 0;
  for (const side of [-1, 1]) {
    const sx2 = side * r * 0.82, sy2 = -r * 1.75 + wob;
    // the upper arm swings down when he reaches, and stays up carrying
    const elbowA = reach * 0.9 - carry * 0.5 + Math.sin(walk + (side > 0 ? Math.PI : 0)) * 0.18;
    const ex2 = sx2 + side * Math.sin(elbowA) * r * 0.62;
    const ey2 = sy2 + Math.cos(elbowA) * r * 0.62;
    ctx.strokeStyle = '#4a3038';
    ctx.lineWidth = r * 0.34;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx2, sy2);
    ctx.lineTo(ex2, ey2);
    ctx.stroke();
    // the forearm, bending in towards the middle when he lifts
    const handA = elbowA + reach * 0.7 - carry * 0.9;
    const hx = ex2 + side * Math.sin(handA) * r * 0.5 - side * carry * r * 0.3;
    const hy2 = ey2 + Math.cos(handA) * r * 0.5;
    ctx.lineWidth = r * 0.28;
    ctx.beginPath();
    ctx.moveTo(ex2, ey2);
    ctx.lineTo(hx, hy2);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // the shoulder plate, over the top of the arm joint
    ctx.fillStyle = '#5a3a44';
    ctx.beginPath();
    ctx.arc(sx2, sy2, r * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7d1f28';
    ctx.beginPath();
    ctx.arc(sx2 + side * r * 0.1, sy2 - r * 0.1, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
    // THE HAND: a palm with four fingers and a thumb, spread when
    // reaching and curled shut once he has hold of the chest
    ctx.save();
    ctx.translate(hx, hy2);
    ctx.rotate(side * (handA + 0.2));
    ctx.fillStyle = '#3a2028';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.19, r * 0.23, 0, 0, Math.PI * 2);   // the palm
    ctx.fill();
    const curl = carry ? 1 : (1 - reach);                        // open, then closed
    for (let i = 0; i < 4; i++) {
      const spread = (i - 1.5) * 0.28;
      const len = r * (0.26 - curl * 0.11) * (i === 3 ? 0.82 : 1);
      ctx.strokeStyle = '#3a2028';
      ctx.lineWidth = r * 0.085;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(Math.sin(spread) * r * 0.14, r * 0.16);
      ctx.lineTo(Math.sin(spread) * r * 0.3, r * 0.16 + len);
      ctx.stroke();
    }
    // the thumb, off to one side
    ctx.beginPath();
    ctx.moveTo(-side * r * 0.16, r * 0.02);
    ctx.lineTo(-side * r * 0.3, r * 0.16 - curl * r * 0.06);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }
  // helmet, with a red glow where the eyes are
  ctx.fillStyle = '#3a2028';
  ctx.beginPath();
  ctx.arc(0, -r * 2.4 + wob, r * 0.7, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-r * 0.7, -r * 2.4 + wob, r * 1.4, r * 0.62);
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(-r * 0.44, -r * 2.28 + wob, r * 0.3, r * 0.16);
  ctx.fillRect(r * 0.14, -r * 2.28 + wob, r * 0.3, r * 0.16);
  ctx.fillStyle = '#7d1f28';                       // a torn plume
  ctx.beginPath();
  ctx.moveTo(0, -r * 3.15 + wob);
  ctx.lineTo(r * 0.6, -r * 2.6 + wob);
  ctx.lineTo(0, -r * 2.65 + wob);
  ctx.closePath(); ctx.fill();
  // an enormous sword, over the shoulder
  ctx.save();
  ctx.translate(-r * 0.95, -r * 1.7 + wob);
  ctx.rotate(-0.5);
  ctx.fillStyle = '#8c9099';
  roundRect(-r * 0.17, -r * 2.5, r * 0.34, r * 2.5, r * 0.06); ctx.fill();
  ctx.fillStyle = '#7d1f28';
  roundRect(-r * 0.14, -r * 2.4, r * 0.1, r * 1.6, r * 0.04); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// SIX-EYED HORNED GOBLINS. A hooded brown cloak with nothing but a
// shadow inside it, six little eyes glowing out of the dark, and a pair
// of horns curving up out of the hood. The eyes blink out of step with
// each other, which is what stops it looking like a printed pattern.
function drawGoblin(f, r, headless) {
  const E = f.E;
  const wob = Math.sin(f.walkT) * r * 0.09;
  const hy = -r * 1.62 + wob;                      // where the head sits
  // bare green feet under the cloak
  ctx.fillStyle = E.skinDark;
  for (const side of [-1, 1]) {
    const lift = Math.sin(f.walkT + (side > 0 ? Math.PI : 0)) * r * 0.16;
    roundRect(side * r * 0.28 - r * 0.13, -r * 0.24 + lift, r * 0.26, r * 0.26, r * 0.08);
    ctx.fill();
  }
  // the cloak: a bell with a torn hem, worn on the body only
  ctx.fillStyle = E.body;
  ctx.beginPath();
  ctx.moveTo(-r * 0.44, hy + r * 0.5);
  ctx.quadraticCurveTo(-r * 0.95, -r * 0.5, -r * 0.86, 0);
  for (let i = 0; i <= 6; i++) {                   // the ragged bottom edge
    const t = i / 6;
    ctx.lineTo(-r * 0.86 + t * r * 1.72, (i % 2 ? r * 0.06 : -r * 0.08));
  }
  ctx.quadraticCurveTo(r * 0.95, -r * 0.5, r * 0.44, hy + r * 0.5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = E.dark;                          // a shadowed fold down the middle
  ctx.beginPath();
  ctx.moveTo(-r * 0.1, hy + r * 0.55);
  ctx.lineTo(r * 0.1, hy + r * 0.55);
  ctx.lineTo(r * 0.16, 0);
  ctx.lineTo(-r * 0.16, 0);
  ctx.closePath();
  ctx.fill();
  // green arms coming out of the cloak
  ctx.fillStyle = E.skin;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(side * r * 0.62, hy + r * 0.75, r * 0.17, r * 0.3, side * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  if (headless) {
    // the head has gone: a green stump where the neck was, dripping
    ctx.fillStyle = E.skinDark;
    ctx.beginPath();
    ctx.ellipse(0, hy + r * 0.42, r * 0.3, r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4f9e22';
    for (let i = 0; i < 3; i++) {
      const dx = (i - 1) * r * 0.18;
      ctx.beginPath();
      ctx.ellipse(dx, hy + r * 0.52 + Math.sin(f.deadT * 3 + i) * r * 0.06,
                  r * 0.07, r * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    return;                                     // no horns, no mask, no eyes
  }
  // SHARP HORNS. Filled shapes that taper to a point rather than a
  // stroked line, because a line has the same width all the way along
  // and can never actually be sharp.
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#d8cfb4';
    ctx.beginPath();
    ctx.moveTo(side * r * 0.26, hy - r * 0.16);              // thick at the skull
    ctx.quadraticCurveTo(side * r * 1.02, hy - r * 0.44,
                         side * r * 0.86, hy - r * 1.24);    // the point
    ctx.quadraticCurveTo(side * r * 0.86, hy - r * 0.5,
                         side * r * 0.5, hy - r * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';                      // a shaded underside
    ctx.beginPath();
    ctx.moveTo(side * r * 0.42, hy - r * 0.12);
    ctx.quadraticCurveTo(side * r * 0.9, hy - r * 0.5,
                         side * r * 0.86, hy - r * 1.24);
    ctx.quadraticCurveTo(side * r * 0.8, hy - r * 0.52,
                         side * r * 0.52, hy - r * 0.08);
    ctx.closePath();
    ctx.fill();
  }
  // THE HEAD: green, out in the open, no hood
  ctx.fillStyle = E.skin;
  ctx.beginPath();
  ctx.ellipse(0, hy, r * 0.66, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = E.skinDark;                      // the underside, in shadow
  ctx.beginPath();
  ctx.ellipse(0, hy + r * 0.3, r * 0.55, r * 0.22, 0, 0, Math.PI);
  ctx.fill();
  // THE IRON MASK. A slab of dark metal bolted over the face, with six
  // holes punched in it. No mouth, no ears - just the eyes burning
  // through, which is why they had to be drawn before the mask goes on.
  const ex = f.face * r * 0.05;
  const eyeAt = (row, col) => ({
    x: ex + (col - 1) * r * 0.3,
    y: hy - r * 0.18 + row * r * 0.3,
  });
  // the glow behind the holes, so the light looks like it comes from
  // inside the head rather than being painted on the front
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const p = eyeAt(row, col);
      const blink = Math.sin(f.bob * 1.3 + (row * 3 + col) * 2.1);
      const open = blink > -0.86 ? 1 : 0.1;
      // dark first, so a blinking eye shows the shadow INSIDE the head
      // rather than a green hole through to its skin
      ctx.fillStyle = '#120c06';
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 0.125, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,220,60,0.35)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r * 0.13, r * 0.13 * open, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = E.eyes;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, r * 0.085, r * 0.085 * open, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the mask itself, with the eye holes cut out of it
  ctx.save();
  ctx.beginPath();
  ctx.rect(-r, hy - r, r * 2, r * 2);                        // the mask area
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const p = eyeAt(row, col);
      ctx.moveTo(p.x + r * 0.115, p.y);
      ctx.arc(p.x, p.y, r * 0.115, 0, Math.PI * 2, true);    // punched out
    }
  }
  ctx.clip('evenodd');
  ctx.fillStyle = '#4a525a';                                 // dark iron
  ctx.beginPath();
  ctx.ellipse(0, hy + r * 0.04, r * 0.68, r * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333a41';                                 // shadowed lower half
  ctx.beginPath();
  ctx.ellipse(0, hy + r * 0.32, r * 0.66, r * 0.36, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#5e6870';                                 // a ridge down the middle
  ctx.fillRect(-r * 0.055, hy - r * 0.58, r * 0.11, r * 1.18);
  ctx.fillStyle = 'rgba(255,255,255,0.09)';                  // a highlight along the top
  ctx.beginPath();
  ctx.ellipse(-r * 0.16, hy - r * 0.3, r * 0.36, r * 0.14, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // rivets, right round the rim
  ctx.fillStyle = '#7d868e';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.58, hy + r * 0.04 + Math.sin(a) * r * 0.53, r * 0.045, 0, Math.PI * 2);
    ctx.fill();
  }
  // whatever it is carrying, held out to the side and pointing away so
  // it never swings across its own face
  const sw = f.attack > 0 ? 1 - f.attack / 0.42 : 0;
  ctx.save();
  ctx.translate(f.face * r * 0.72, -r * 0.78 + wob);
  ctx.rotate(f.face * (0.5 + sw * 1.6));
  drawWeapon(f.weapon, r);
  ctx.restore();
}

// Each weapon draws itself, standing at the handle and pointing up. So
// the goblin only has to say where its hand is and which way it is
// swinging, and this does the rest.
function drawWeapon(kind, r) {
  if (kind === 'axe') {
    // a heavy wooden haft with a big curved iron head
    ctx.fillStyle = '#6b4f26';
    roundRect(-r * 0.07, -r * 0.86, r * 0.14, r * 0.86, r * 0.05);
    ctx.fill();
    ctx.fillStyle = '#9aa3ac';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.86);
    ctx.quadraticCurveTo(r * 0.52, -r * 0.92, r * 0.44, -r * 0.44);
    ctx.lineTo(0, -r * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#c8d0d8';                       // the sharpened edge
    ctx.beginPath();
    ctx.moveTo(r * 0.02, -r * 0.86);
    ctx.quadraticCurveTo(r * 0.52, -r * 0.92, r * 0.44, -r * 0.44);
    ctx.quadraticCurveTo(r * 0.4, -r * 0.62, r * 0.05, -r * 0.74);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4a4f55';                       // the binding
    ctx.fillRect(-r * 0.09, -r * 0.6, r * 0.18, r * 0.1);
  } else if (kind === 'sword') {
    // a long thin blade, longest reach of the three
    ctx.fillStyle = '#3a2c1c';                       // the grip
    roundRect(-r * 0.05, -r * 0.22, r * 0.1, r * 0.28, r * 0.04);
    ctx.fill();
    ctx.fillStyle = '#8a6a3a';                       // the crossguard
    roundRect(-r * 0.24, -r * 0.28, r * 0.48, r * 0.09, r * 0.03);
    ctx.fill();
    ctx.fillStyle = '#b9c2cb';                       // the blade
    ctx.beginPath();
    ctx.moveTo(-r * 0.09, -r * 0.28);
    ctx.lineTo(r * 0.09, -r * 0.28);
    ctx.lineTo(r * 0.05, -r * 1.12);
    ctx.lineTo(0, -r * 1.24);                        // the point
    ctx.lineTo(-r * 0.05, -r * 1.12);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e2e8ee';                       // a shine down one side
    ctx.beginPath();
    ctx.moveTo(-r * 0.07, -r * 0.3);
    ctx.lineTo(-r * 0.02, -r * 0.3);
    ctx.lineTo(-r * 0.02, -r * 1.1);
    ctx.lineTo(-r * 0.05, -r * 1.06);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffd83d';                       // a little pommel
    ctx.beginPath();
    ctx.arc(0, r * 0.06, r * 0.07, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // the club: a lump of wood with studs hammered into it
    ctx.fillStyle = '#8a6a3a';
    roundRect(-r * 0.08, -r * 0.84, r * 0.16, r * 0.84, r * 0.06);
    ctx.fill();
    ctx.fillStyle = '#6b4f26';
    ctx.beginPath();
    ctx.arc(0, -r * 0.86, r * 0.19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a8aeb4';
    for (let i = 0; i < 4; i++) {
      const a2 = (i / 4) * Math.PI * 2 + 0.5;
      ctx.beginPath();
      ctx.arc(Math.cos(a2) * r * 0.11, -r * 0.86 + Math.sin(a2) * r * 0.11, r * 0.045, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFoe(f, sx, sy, sc) {
  const E = f.E, r = f.r * sc;
  ctx.save();
  ctx.translate(sx, sy);
  if (f.dead) {
    // THE FALLEN. It tips over onto the ground over a quarter of a
    // second, lies there, then fades out at the end.
    const tip = Math.min(1, f.deadT / 0.28);
    ctx.rotate((f.fallDir || 1) * tip * Math.PI * 0.5);
    ctx.globalAlpha = f.deadT > 3.4 ? Math.max(0, 1 - (f.deadT - 3.4) / 0.8) : 1;
    // the head is gone on a popped one, so draw the body only
    if (f.deathStyle === 'pop') {
      drawFoeBody(f, r, true);
      ctx.restore();
      return;
    }
  }
  if (f.hurt > 0) ctx.globalAlpha = 0.65;
  const wob = Math.sin(f.walkT) * r * 0.1;
  drawFoeBody(f, r, false);
  ctx.globalAlpha = 1;
  // frozen solid: a block of ice over the top
  if (f.frozen > 0) {
    ctx.fillStyle = 'rgba(127, 228, 255, 0.45)';
    roundRect(-r * 0.9, -r * 2.2, r * 1.8, r * 2.3, r * 0.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(220, 250, 255, 0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
  // a little health bar over anybody who has been hit
  if (!f.dead && f.health < f.maxHealth) {
    const w = r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(sx - w / 2, sy - r * 2.9, w, 5);
    ctx.fillStyle = f.E.boss ? '#ff4d6a' : '#7fdf3f';
    ctx.fillRect(sx - w / 2 + 1, sy - r * 2.9 + 1, (w - 2) * Math.max(0, f.health / f.maxHealth), 3);
  }
}

// The body itself. headless is true when the head has popped off, in
// which case we leave a green stump where the neck was.
// Broken stone and burning floor. Each one draws itself standing at its
// own feet, so the stage code only has to say where it is.
function drawProp(p, sc, t) {
  const r = 16 * sc * p.size;
  if (p.kind === 'fire') {
    // a fire burning on the ground: three tongues of flame, each on its
    // own wobble, so it never looks like a repeating pattern
    const glow = 0.7 + Math.sin(t * 5 + p.seed) * 0.3;
    ctx.fillStyle = 'rgba(255,150,40,' + (0.1 + glow * 0.09) + ')';
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 2.4, r * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a1a12';                          // scorched floor
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.15, r * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * r * 0.5;
      const wob = Math.sin(t * 7 + p.seed + i * 2.1);
      const h = r * (1.5 + wob * 0.35) * (i === 1 ? 1.25 : 1);
      ctx.fillStyle = ['#e0521f', '#f2861f', '#ffbe3d'][i];
      ctx.beginPath();
      ctx.moveTo(off - r * 0.36, 0);
      ctx.quadraticCurveTo(off - r * 0.42 + wob * r * 0.2, -h * 0.55, off + wob * r * 0.18, -h);
      ctx.quadraticCurveTo(off + r * 0.42 + wob * r * 0.2, -h * 0.55, off + r * 0.36, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,240,170,0.9)';            // the hot middle
    const wob2 = Math.sin(t * 9 + p.seed);
    ctx.beginPath();
    ctx.moveTo(-r * 0.2, 0);
    ctx.quadraticCurveTo(-r * 0.24, -r * 0.6, wob2 * r * 0.1, -r * 0.95);
    ctx.quadraticCurveTo(r * 0.24, -r * 0.6, r * 0.2, 0);
    ctx.closePath();
    ctx.fill();
  } else if (p.kind === 'block') {
    // a single big square block of masonry, knocked off a wall
    ctx.fillStyle = '#6a6070';
    roundRect(-r * 0.8, -r * 1.1, r * 1.6, r * 1.1, r * 0.1);
    ctx.fill();
    ctx.fillStyle = '#7d7386';                          // the lit top face
    roundRect(-r * 0.8, -r * 1.1, r * 1.6, r * 0.3, r * 0.1);
    ctx.fill();
    ctx.fillStyle = '#4e4658';
    ctx.fillRect(-r * 0.8, -r * 0.5, r * 1.6, r * 0.09);
    ctx.fillRect(-r * 0.1, -r * 1.1, r * 0.09, r * 0.6);
  } else if (p.kind === 'column') {
    // a broken pillar, snapped off near the base
    ctx.fillStyle = '#5a5266';
    roundRect(-r * 0.5, -r * 1.9, r, r * 1.9, r * 0.12);
    ctx.fill();
    ctx.fillStyle = '#6d6478';
    roundRect(-r * 0.5, -r * 1.9, r * 0.35, r * 1.9, r * 0.12);
    ctx.fill();
    ctx.fillStyle = '#3f394a';                          // the jagged snapped top
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, -r * 1.9);
    ctx.lineTo(-r * 0.2, -r * 2.1);
    ctx.lineTo(r * 0.1, -r * 1.82);
    ctx.lineTo(r * 0.5, -r * 2.05);
    ctx.lineTo(r * 0.5, -r * 1.78);
    ctx.lineTo(-r * 0.5, -r * 1.7);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#4e4658';                          // rubble round the foot
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.95, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // a heap of broken chunks. The shapes come from the prop's own seed,
    // so the same heap looks the same every frame instead of shimmering.
    for (let i = 0; i < 6; i++) {
      const a = p.seed + i * 2.3;
      const cx = Math.sin(a) * r * 0.9;
      const cy = -Math.abs(Math.cos(a * 1.7)) * r * 0.5;
      const w = r * (0.3 + (Math.sin(a * 3) + 1) * 0.16);
      ctx.fillStyle = i % 2 ? '#5f5769' : '#6f667a';
      ctx.beginPath();
      ctx.moveTo(cx - w, cy);
      ctx.lineTo(cx - w * 0.5, cy - w * 0.9);
      ctx.lineTo(cx + w * 0.7, cy - w * 0.7);
      ctx.lineTo(cx + w, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(30,26,38,0.35)';              // dust on the floor
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.2, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// A head on its own, off its body. It is the same head the goblin
// wears, minus the neck - masks, horns, six eyes and all.
function drawLooseHead(f, r) {
  const E = f.E;
  if (f.kind !== 'goblin') {
    ctx.fillStyle = E.body;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1220';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.06, r * 0.1, 0, Math.PI * 2);
    ctx.arc(r * 0.2, -r * 0.06, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  // the horns
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#d8cfb4';
    ctx.beginPath();
    ctx.moveTo(side * r * 0.26, -r * 0.16);
    ctx.quadraticCurveTo(side * r * 1.02, -r * 0.44, side * r * 0.86, -r * 1.24);
    ctx.quadraticCurveTo(side * r * 0.86, -r * 0.5, side * r * 0.5, -r * 0.06);
    ctx.closePath();
    ctx.fill();
  }
  // the green skull
  ctx.fillStyle = E.skin;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.66, r * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  // the eyes, dark now
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      ctx.fillStyle = '#120c06';
      ctx.beginPath();
      ctx.arc((col - 1) * r * 0.3, -r * 0.18 + row * r * 0.3, r * 0.115, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the mask, still bolted on
  ctx.save();
  ctx.beginPath();
  ctx.rect(-r, -r, r * 2, r * 2);
  for (let row = 0; row < 2; row++) {
    for (let col = 0; col < 3; col++) {
      const px = (col - 1) * r * 0.3, py = -r * 0.18 + row * r * 0.3;
      ctx.moveTo(px + r * 0.115, py);
      ctx.arc(px, py, r * 0.115, 0, Math.PI * 2, true);
    }
  }
  ctx.clip('evenodd');
  ctx.fillStyle = '#4a525a';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.04, r * 0.68, r * 0.62, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#5e6870';
  ctx.fillRect(-r * 0.055, -r * 0.58, r * 0.11, r * 1.18);
  ctx.restore();
  // ooze at the neck end
  ctx.fillStyle = '#4f9e22';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.56, r * 0.28, r * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawFoeBody(f, r, headless) {
  const E = f.E;
  const wob = Math.sin(f.walkT) * r * 0.1;
  if (f.kind === 'goblin') {
    drawGoblin(f, r, headless);
  } else if (f.kind === 'bat') {
    const flap = Math.sin(f.bob * 3) * r * 0.5;
    ctx.fillStyle = E.dark;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.4);
      ctx.quadraticCurveTo(side * r * 1.5, -r * 0.6 - flap, side * r * 1.7, -r * 0.1 + flap);
      ctx.quadraticCurveTo(side * r * 1.1, -r * 0.1, 0, -r * 0.1);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = E.body;
    ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 0.62, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe94a';
    ctx.beginPath();
    ctx.arc(-r * 0.22, -r * 0.5, r * 0.13, 0, Math.PI * 2);
    ctx.arc(r * 0.22, -r * 0.5, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.kind === 'slime') {
    const squash = 1 + Math.sin(f.bob) * 0.12;
    ctx.fillStyle = E.body;
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.6 / squash, r * 0.95 * squash, r * 0.75 / squash, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.85, r * 0.22, r * 0.15, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#12331f';
    ctx.beginPath();
    ctx.arc(-r * 0.25, -r * 0.65, r * 0.12, 0, Math.PI * 2);
    ctx.arc(r * 0.25, -r * 0.65, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // goblin, soldier and the boss: same build, different sizes
    ctx.fillStyle = E.dark;
    for (const side of [-1, 1]) {
      const lift = Math.sin(f.walkT + (side > 0 ? Math.PI : 0)) * r * 0.2;
      roundRect(side * r * 0.3 - r * 0.14, -r * 0.45, r * 0.28, r * 0.55 + lift, r * 0.1);
      ctx.fill();
    }
    ctx.fillStyle = E.body;
    roundRect(-r * 0.5, -r * 1.45 + wob, r, r * 1.05, r * 0.25);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -r * 1.7 + wob, r * 0.52, 0, Math.PI * 2);
    ctx.fill();
    if (f.E.boss) {                                   // a crown for the baron
      ctx.fillStyle = '#ffd83d';
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 2.05 + wob);
      for (let i = 0; i < 4; i++) {
        ctx.lineTo(-r * 0.5 + (i + 0.5) * r * 0.33, -r * 2.45 + wob);
        ctx.lineTo(-r * 0.5 + (i + 1) * r * 0.33, -r * 2.05 + wob);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#1a1220';
    ctx.beginPath();
    ctx.arc(-r * 0.2 + f.face * r * 0.06, -r * 1.75 + wob, r * 0.1, 0, Math.PI * 2);
    ctx.arc(r * 0.2 + f.face * r * 0.06, -r * 1.75 + wob, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    // a weapon, held out when swinging
    const sw = f.attack > 0 ? 1 - f.attack / 0.42 : 0;
    ctx.save();
    ctx.translate(f.face * r * 0.6, -r * 0.95 + wob);
    ctx.rotate(f.face * (-0.6 + sw * 1.8));
    ctx.fillStyle = '#b9a06a';
    roundRect(-r * 0.1, -r * 1.2, r * 0.2, r * 1.2, r * 0.08);
    ctx.fill();
    ctx.restore();
  }
}

<script>
// =====================================================================
// DRAWING THE STAGE
// =====================================================================
const SCENES = {
  grass: { sky1: '#6fc3f0', sky2: '#bfe9c8', floor: '#4f9a45', floor2: '#3f7d38', far: '#2f6f4a' },
  wood:  { sky1: '#1f3524', sky2: '#33543a', floor: '#3e6b38', floor2: '#2f5a2c', far: '#16311d' },
  cave:  { sky1: '#161122', sky2: '#2a2140', floor: '#4a4058', floor2: '#3a3246', far: '#0f0b18' },
  snow:  { sky1: '#93b8e0', sky2: '#dbeaf6', floor: '#e6eff7', floor2: '#cfdcea', far: '#a9c2d8' },
  castle:{ sky1: '#2a1c3a', sky2: '#4a3560', floor: '#6a6070', floor2: '#544b5c',
           far: '#241a33', hall: true },
  lava:  { sky1: '#3a0f10', sky2: '#7a2410', floor: '#4a2820', floor2: '#3a1e18', far: '#220a0a' },
};
// The inside of a castle: a stone wall with arches, pillars between
// them and a banner hanging on each pillar. It scrolls with you, so it
// reads as a long hall you are fighting your way down.
function drawHall(S, sc) {
  const h = S.backY;
  ctx.fillStyle = sc.far;
  ctx.fillRect(0, 0, S.W, h);
  const step = 260;
  const start = -((camX * 0.55) % step) - step;
  // which pillars are wrecked is decided by WHERE they are, not by when
  // they get drawn - so the same pillar is broken every time you walk
  // past it instead of flickering between whole and ruined
  const worldOf = x => Math.round((x + camX * 0.55) / step);
  for (let x = start; x < S.W + step; x += step) {
    const id = worldOf(x);
    const wrecked = fightLevel && fightLevel.wrecked;
    const smashed = wrecked && ((id * 2654435761) % 7) < 3;
    // the dark arch
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    const aw = 96, ah = h * 0.44;
    roundRect(x + step / 2 - aw / 2, h - ah, aw, ah, aw * 0.45);
    ctx.fill();
    // the pillar - snapped off partway up if this one has been smashed
    const pillarH = smashed ? h * 0.34 : h * 0.62;
    ctx.fillStyle = sc.floor2;
    ctx.fillRect(x - 26, h - pillarH, 52, pillarH);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(x - 26, h - pillarH, 16, pillarH);
    if (smashed) {
      ctx.fillStyle = '#3f394a';                       // the broken-off top
      ctx.beginPath();
      ctx.moveTo(x - 26, h - pillarH);
      ctx.lineTo(x - 10, h - pillarH - 16);
      ctx.lineTo(x + 6, h - pillarH - 4);
      ctx.lineTo(x + 26, h - pillarH - 20);
      ctx.lineTo(x + 26, h - pillarH + 6);
      ctx.lineTo(x - 26, h - pillarH + 8);
      ctx.closePath();
      ctx.fill();
    } else {
      // the banner, still hanging - but torn along the bottom
      ctx.fillStyle = '#6b1f31';
      ctx.beginPath();
      ctx.moveTo(x - 20, h - h * 0.58);
      ctx.lineTo(x + 20, h - h * 0.58);
      ctx.lineTo(x + 20, h - h * 0.3);
      if (wrecked) {                                   // ragged, burnt edge
        ctx.lineTo(x + 12, h - h * 0.22);
        ctx.lineTo(x + 6, h - h * 0.3);
        ctx.lineTo(x - 4, h - h * 0.2);
        ctx.lineTo(x - 12, h - h * 0.28);
      } else {
        ctx.lineTo(x, h - h * 0.18);
      }
      ctx.lineTo(x - 20, h - h * 0.24);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = wrecked ? '#a88c2a' : '#ffd83d';
      ctx.beginPath();
      ctx.arc(x, h - h * 0.42, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    // a torch. In a wrecked hall most of them have gone out.
    const dark = wrecked && ((id * 40503) % 5) < 3;
    if (!dark) {
      const flick = 0.75 + Math.sin(Date.now() / 90 + x) * 0.25;
      ctx.fillStyle = 'rgba(255,170,60,' + flick * 0.8 + ')';
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 13 * flick, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,232,150,' + flick + ')';
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 6 * flick, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(20,14,10,0.8)';            // a dead, sooty bracket
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the top of the wall
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, S.W, h * 0.12);
}

function drawStage(S, sc) {
  const sky = ctx.createLinearGradient(0, 0, 0, S.backY);
  sky.addColorStop(0, sc.sky1);
  sky.addColorStop(1, sc.sky2);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, S.W, S.backY);
  if (sc.hall) drawHall(S, sc);
  else {
    // a bumpy line of hills in the distance
    ctx.fillStyle = sc.far;
    ctx.beginPath();
    ctx.moveTo(0, S.backY);
    for (let i = 0; i <= 22; i++) {
      const x = (i / 22) * S.W;
      const h = 40 + Math.sin(i * 1.7 + camX * 0.0015) * 26 + Math.sin(i * 0.6) * 18;
      ctx.lineTo(x, S.backY - h);
    }
    ctx.lineTo(S.W, S.backY);
    ctx.closePath();
    ctx.fill();
  }
  // the floor, in bands so the depth reads
  const g = ctx.createLinearGradient(0, S.backY, 0, S.frontY);
  g.addColorStop(0, sc.floor2);
  g.addColorStop(1, sc.floor);
  ctx.fillStyle = g;
  ctx.fillRect(0, S.backY, S.W, S.H - S.backY);
  // stripes running away from you, to sell the depth
  ctx.strokeStyle = 'rgba(0,0,0,0.09)';
  ctx.lineWidth = 2;
  for (let i = -2; i < 26; i++) {
    const wx = (i * 160) - (camX % 160);
    ctx.beginPath();
    ctx.moveTo(wx + 40, S.backY);
    ctx.lineTo(wx - 40, S.frontY);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.moveTo(0, S.backY); ctx.lineTo(S.W, S.backY);
  ctx.stroke();
}

function drawFight() {
  const S = stage();
  const sc = SCENES[fightLevel.scene] || SCENES.grass;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawStage(S, sc);

  // EVERYTHING gets sorted by depth, so whoever is nearer the camera is
  // drawn on top of whoever is further back. This is the whole reason
  // the view reads as a stage and not a flat line.
  const cast = [];
  if (!hero.dead || hero.z > 0) cast.push({ a: hero, hero: true });
  for (const f of foes) cast.push({ a: f, hero: false });
  cast.sort((p, q) => p.a.depth - q.a.depth);

  // magic that sits on the floor goes underneath everyone
  for (const m of magics) {
    if (m.type === 'poison') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 0 }, S, camX);
      ctx.fillStyle = 'rgba(166, 255, 92, ' + Math.min(0.35, m.life * 0.12) + ')';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 95 * p.sc, 34 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.type === 'ice') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 0 }, S, camX);
      ctx.strokeStyle = 'rgba(127,228,255,' + m.life * 1.4 + ')';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, (1 - m.life) * 260, (1 - m.life) * 90, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // rubble and fires stand on the floor like everybody else, so you can
  // walk in front of them or behind them
  for (const p of props) cast.push({ a: p, prop: true });
  // the chest sits on the floor with everybody else, sorted by depth
  if (chest) cast.push({ a: chest, chest: true });
  if (cut) cast.push({ a: { x: cut.x, depth: cut.depth, z: 0, r: 30 }, baron: true });
  cast.sort((p, q) => p.a.depth - q.a.depth);

  for (const c of cast) {
    const a = c.a;
    const p = toScreen(a, S, camX);
    const floorY = S.backY + a.depth * S.floorH;
    if (p.x < -220 || p.x > S.W + 220) continue;
    if (c.prop) {
      const t = Date.now() / 1000;
      ctx.save();
      ctx.translate(p.x, p.y);
      drawProp(a, p.sc, t);
      ctx.restore();
      // a fire throws sparks up into the air
      if (a.kind === 'fire' && Math.random() < 0.09) {
        particles.push({ x: a.x + (Math.random() - 0.5) * 20, depth: a.depth,
                         z: 12 + Math.random() * 20, vx: (Math.random() - 0.5) * 20,
                         vz: 70 + Math.random() * 60, life: 0.7,
                         color: Math.random() < 0.5 ? '#ffbe3d' : '#e0521f' });
      }
      continue;
    }
    if (c.chest) {
      if (chest.taken && cut) continue;            // he is carrying it now
      drawShadow(p.x, floorY, p.sc, 32);
      drawChest(p.x, p.y, p.sc, chest);
      continue;
    }
    if (c.baron) {
      drawShadow(p.x, floorY, p.sc * 1.5, 34);
      drawBaron(p.x, p.y, p.sc, cut.phase, cut.t);
      // the gold, tucked under his arm once he has picked it up
      if (chest && chest.taken) {
        drawChest(p.x - 40 * p.sc, p.y - 52 * p.sc, p.sc * 0.8,
                  { bob: cut.t * 3, lift: 0 });
      }
      continue;
    }
    drawShadow(p.x, floorY, p.sc, a.r);
    if (c.hero) drawKnight(a, p.x, p.y, p.sc);
    else drawFoe(a, p.x, p.y, p.sc);
  }

  // heads that have come off, bouncing about the floor
  for (const h of heads) {
    const p = toScreen(h, S, camX);
    if (p.x < -80 || p.x > S.W + 80) continue;
    const floorY = S.backY + h.depth * S.floorH;
    ctx.globalAlpha = h.life < 0.8 ? h.life / 0.8 : 1;
    drawShadow(p.x, floorY, p.sc * 0.6, 14);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(h.angle);
    drawLooseHead(h.foe, 20 * p.sc);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // fire and lightning go over the top
  for (const m of magics) {
    if (m.type === 'fire') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 20 }, S, camX);
      ctx.fillStyle = 'rgba(255,139,31,0.8)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 44 * p.sc, 34 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,232,120,0.9)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 24 * p.sc, 18 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.type === 'bolt') {
      const a = toScreen({ x: m.x1, depth: m.d1, z: m.z1 }, S, camX);
      const b = toScreen({ x: m.x2, depth: m.d2, z: m.z2 }, S, camX);
      ctx.strokeStyle = 'rgba(255,233,74,' + Math.min(1, m.life * 3) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const steps = 5;
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        ctx.lineTo(a.x + (b.x - a.x) * t + (Math.random() - 0.5) * 26,
                   a.y + (b.y - a.y) * t + (Math.random() - 0.5) * 26);
      }
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  for (const p of particles) {
    const s = toScreen(p, S, camX);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    if (p.ooze) {                                // ooze is round and drippy
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, 4 * s.sc, 5.5 * s.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(s.x - 3 * s.sc, s.y - 3 * s.sc, 6 * s.sc, 6 * s.sc);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) {
    const s = toScreen(f, S, camX);
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.color;
    ctx.font = 'bold ' + Math.round(15 * s.sc) + 'px monospace';
    ctx.fillText(f.text, s.x, s.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  drawFightHUD(S);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

<script>
// =====================================================================
// THE HUD AND THE OTHER SCREENS
// =====================================================================
const nameBox = document.getElementById('nameBox');
nameBox.value = save.name;
nameBox.addEventListener('input', () => {
  save.name = nameBox.value.toUpperCase().slice(0, 12);
  saveGame();
});
nameBox.addEventListener('keydown', e => {
  if (e.key === 'Enter') nameBox.blur();
  e.stopPropagation();                 // typing must never steer or attack
});
function typing() { return document.activeElement === nameBox; }

function drawFightHUD(S) {
  const K = hero.K;
  ctx.fillStyle = 'rgba(10,8,18,0.7)';
  ctx.fillRect(0, 0, S.W, S.hud);
  ctx.textAlign = 'left';
  // start clear of the Arcade pill in the top corner
  const hx = Math.min(150, S.W * 0.17);
  ctx.fillStyle = K.body;
  ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
  ctx.fillText(playerName() + '  Lv' + heroLevel(), hx, S.hud * 0.42);
  // health
  const bw = Math.min(230, S.W * 0.26);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(hx, S.hud * 0.55, bw, 14);
  ctx.fillStyle = hero.health / hero.maxHealth < 0.3 ? '#ff4d4d' : '#5ddf5d';
  ctx.fillRect(hx + 1, S.hud * 0.55 + 1, (bw - 2) * Math.max(0, hero.health / hero.maxHealth), 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hx, S.hud * 0.55, bw, 14);
  // magic, ready or charging
  const mx = hx + bw + 14, mw = Math.min(120, S.W * 0.14);
  const ready = hero.magicCool <= 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, S.hud * 0.55, mw, 14);
  ctx.fillStyle = ready ? K.magicColor : 'rgba(255,255,255,0.25)';
  ctx.fillRect(mx + 1, S.hud * 0.55 + 1, (mw - 2) * (1 - hero.magicCool / MAGIC_COOL), 12);
  ctx.fillStyle = ready ? K.magicColor : 'rgba(255,255,255,0.45)';
  ctx.font = 'bold ' + Math.min(12, S.W / 48) + 'px monospace';
  ctx.fillText(ready ? K.magic + ' READY' : K.magic, mx, S.hud * 0.42);
  // where you are
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(16, S.W / 36) + 'px monospace';
  ctx.fillText(fightLevel.name, S.W - 14, S.hud * 0.42);
  ctx.fillStyle = ['#7fdf3f', '#ffd83d', '#ff5a5a'][modeIx];
  ctx.font = 'bold ' + Math.min(12, S.W / 48) + 'px monospace';
  ctx.fillText(mode().name, S.W - 14, S.hud * 0.2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold ' + Math.min(13, S.W / 44) + 'px monospace';
  const left = foes.filter(f => !f.dead).length;
  ctx.fillText(left ? left + ' of ' + levelCount(fightLevel) + ' left' : 'ALL CLEAR',
               S.W - 14, S.hud * 0.75);
  ctx.textAlign = 'left';
  if (hero.combo > 1) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd83d';
    ctx.font = 'bold ' + Math.min(30, S.W / 20) + 'px monospace';
    ctx.fillText('x' + hero.combo, S.W / 2, S.hud * 0.72);
    ctx.textAlign = 'left';
  }
}

// ---- the title ----
function drawTitle(S) {
  const g = ctx.createLinearGradient(0, 0, 0, S.H);
  g.addColorStop(0, '#1b1030');
  g.addColorStop(1, '#3a1c2a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S.W, S.H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd83d';
  ctx.font = 'bold ' + Math.min(58, S.W / 11) + 'px monospace';
  ctx.fillText('KNIGHTS', S.W / 2, S.H * 0.3);
  ctx.fillStyle = '#fff';
  ctx.fillText('OF THE FOUR', S.W / 2, S.H * 0.3 + Math.min(58, S.W / 11));
  // the four of them standing about
  KNIGHTS.forEach((K, i) => {
    const x = S.W * (0.26 + i * 0.16);
    const y = S.H * 0.68;
    const a = { K, face: 1, walkT: Date.now() / 260 + i, attack: 0, hurt: 0 };
    drawKnight(a, x, y, Math.min(1.5, S.W / 700));
  });
  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText('SPACE  /  TAP  =  BEGIN', S.W / 2, S.H * 0.88);
  if (save.beaten.length) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = Math.min(14, S.W / 42) + 'px monospace';
    ctx.fillText(playerName() + '  -  Lv' + heroLevel() + '  -  ' +
                 save.beaten.length + ' of ' + LEVELS.length + ' beaten', S.W / 2, S.H * 0.94);
  }
  ctx.textAlign = 'left';
}
