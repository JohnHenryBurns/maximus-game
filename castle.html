<script>
// ---- choosing your knight, and your name ----
function drawSelect(S) {
  const g = ctx.createLinearGradient(0, 0, 0, S.H);
  g.addColorStop(0, '#1b1030'); g.addColorStop(1, '#2a1830');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S.W, S.H);
  uiRects = [];
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd83d';
  ctx.font = 'bold ' + Math.min(30, S.W / 22) + 'px monospace';
  ctx.fillText('WHO ARE YOU?', S.W / 2, S.H * 0.13);

  // the name box floats over the canvas, positioned from the same maths
  const bw = Math.min(S.W * 0.5, 340), bh = Math.min(44, S.H * 0.075);
  nameBox.style.display = 'block';
  nameBox.style.left = (S.W / 2 - bw / 2) + 'px';
  nameBox.style.top = (S.H * 0.17) + 'px';
  nameBox.style.width = bw + 'px';
  nameBox.style.height = bh + 'px';
  nameBox.style.fontSize = Math.min(22, bw / 11) + 'px';
  nameBox.style.borderColor = KNIGHTS[save.knight].body;
  nameBox.style.color = KNIGHTS[save.knight].trim;

  const top = S.H * 0.32, cardH = S.H * 0.4;
  KNIGHTS.forEach((K, i) => {
    const cw = Math.min(S.W * 0.22, 210);
    const cx = S.W * (0.5 + (i - 1.5) * 0.23);
    const chosen = save.knight === i;
    ctx.fillStyle = chosen ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    roundRect(cx - cw / 2, top, cw, cardH, 12); ctx.fill();
    ctx.strokeStyle = chosen ? K.trim : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = chosen ? 4 : 2;
    roundRect(cx - cw / 2, top, cw, cardH, 12); ctx.stroke();
    const a = { K, face: 1, walkT: chosen ? Date.now() / 200 : 0, attack: 0, hurt: 0 };
    drawKnight(a, cx, top + cardH * 0.56, Math.min(1.35, cw / 150));
    ctx.fillStyle = K.body;
    ctx.font = 'bold ' + Math.min(20, cw / 9) + 'px monospace';
    ctx.fillText(K.name, cx, top + cardH * 0.72);
    ctx.fillStyle = K.magicColor;
    ctx.font = 'bold ' + Math.min(15, cw / 12) + 'px monospace';
    ctx.fillText(K.magic, cx, top + cardH * 0.83);
    uiRects.push({ x: cx, y: top + cardH / 2, w: cw / 2, h: cardH / 2, knight: i });
  });
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.font = Math.min(15, S.W / 40) + 'px monospace';
  ctx.fillText(KNIGHTS[save.knight].magic + ': ' + KNIGHTS[save.knight].blurb, S.W / 2, S.H * 0.78);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = Math.min(13, S.W / 46) + 'px monospace';
  ctx.fillText('left / right to choose', S.W / 2, S.H * 0.83);
  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText('SPACE  /  TAP HERE  =  TO THE MAP', S.W / 2, S.H * 0.92);
  uiRects.push({ x: S.W / 2, y: S.H * 0.915, w: S.W * 0.35, h: 26, go: true });
  ctx.textAlign = 'left';
}

// ---- the world map ----
function drawMap(S) {
  const g = ctx.createLinearGradient(0, 0, 0, S.H);
  g.addColorStop(0, '#243a52'); g.addColorStop(1, '#3f5a3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S.W, S.H);
  uiRects = [];
  nameBox.style.display = 'none';

  // the paths between levels, drawn first so the pins sit on top
  LEVELS.forEach(lv => {
    if (lv.needs < 0) return;
    const from = LEVELS[lv.needs];
    const open = isOpen(lv);
    ctx.strokeStyle = open ? 'rgba(255,216,61,0.8)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 5;
    ctx.setLineDash(open ? [] : [8, 10]);
    ctx.beginPath();
    ctx.moveTo(from.x * S.W, from.y * S.H);
    ctx.quadraticCurveTo((from.x + lv.x) / 2 * S.W, (from.y + lv.y) / 2 * S.H - 40,
                         lv.x * S.W, lv.y * S.H);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  LEVELS.forEach((lv, i) => {
    const x = lv.x * S.W, y = lv.y * S.H;
    const open = isOpen(lv), done = isBeaten(lv.id);
    const here = mapPick === i;
    const r = Math.min(30, S.W / 30) * (here ? 1.18 : 1);
    ctx.fillStyle = done ? '#5ddf5d' : open ? '#ffd83d' : 'rgba(120,120,140,0.7)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = here ? '#fff' : 'rgba(0,0,0,0.4)';
    ctx.lineWidth = here ? 4 : 2;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1a1220';
    ctx.font = 'bold ' + r * 0.9 + 'px monospace';
    ctx.fillText(done ? '✓' : open ? String(i + 1) : '🔒', x, y + r * 0.32);
    ctx.fillStyle = open ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.font = 'bold ' + Math.min(14, S.W / 44) + 'px monospace';
    ctx.fillText(lv.name, x, y + r + 18);
    uiRects.push({ x, y, w: r * 1.6, h: r * 1.6, mapNode: i });
    ctx.textAlign = 'left';
  });

  // the panel telling you about whichever one you are on
  const lv = LEVELS[mapPick];
  const open = isOpen(lv);
  ctx.fillStyle = 'rgba(10,8,18,0.8)';
  ctx.fillRect(0, S.H - Math.min(112, S.H * 0.2), S.W, Math.min(112, S.H * 0.2));
  const py = S.H - Math.min(112, S.H * 0.2);
  ctx.textAlign = 'left';
  ctx.fillStyle = KNIGHTS[save.knight].body;
  ctx.font = 'bold ' + Math.min(16, S.W / 36) + 'px monospace';
  ctx.fillText(playerName() + '   Lv' + heroLevel() + '   ' + save.xp + ' XP', 16, py + 26);
  ctx.fillStyle = open ? '#ffd83d' : 'rgba(255,255,255,0.5)';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText(lv.name, 16, py + 54);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = Math.min(14, S.W / 44) + 'px monospace';
  ctx.fillText(open ? lv.blurb : 'beat ' + LEVELS[lv.needs].name + ' first', 16, py + 76);
  ctx.textAlign = 'right';
  if (open) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(19, S.W / 30) + 'px monospace';
    ctx.fillText(isBeaten(lv.id) ? 'SPACE / TAP  =  PLAY AGAIN' : 'SPACE / TAP  =  FIGHT',
                 S.W - 16, py + 54);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = Math.min(12, S.W / 50) + 'px monospace';
  ctx.fillText('arrows pick a level   -   C knight   -   M mode', S.W - 16, py + 78);
  ctx.textAlign = 'left';

  // the difficulty, up in the corner where it is out of the way
  const M = mode();
  const mw2 = Math.min(190, S.W * 0.24), mh2 = Math.min(46, S.H * 0.08);
  const mx2 = S.W - mw2 - 14, my2 = 14;
  const col = ['#7fdf3f', '#ffd83d', '#ff5a5a'][modeIx];
  ctx.fillStyle = 'rgba(10,8,18,0.65)';
  roundRect(mx2, my2, mw2, mh2, 8); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  roundRect(mx2, my2, mw2, mh2, 8); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = col;
  ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
  ctx.fillText(M.name, mx2 + mw2 / 2, my2 + mh2 * 0.45);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = Math.min(11, S.W / 54) + 'px monospace';
  ctx.fillText(M.desc + '  -  press M', mx2 + mw2 / 2, my2 + mh2 * 0.78);
  uiRects.push({ x: mx2 + mw2 / 2, y: my2 + mh2 / 2, w: mw2 / 2, h: mh2 / 2, modeBtn: true });
  ctx.textAlign = 'left';
}
</script>
<script>
// The cutscene is just the stage with the controls taken away, plus a
// caption. Reusing drawFight means the world carries on looking exactly
// as it did a second ago, which is what makes it feel like a moment in
// the same place rather than a different screen.
function drawCutscene(S) {
  drawFight();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bandH = Math.min(70, S.H * 0.12);
  ctx.fillStyle = 'rgba(6,4,10,0.92)';
  ctx.fillRect(0, 0, S.W, bandH);
  ctx.fillRect(0, S.H - bandH, S.W, bandH);
  ctx.textAlign = 'center';
  let line = '';
  if (cut.phase === 'in') line = 'something enormous is coming...';
  else if (cut.phase === 'grab') line = 'THE CRIMSON KNIGHT takes the gold';
  else line = 'after him!';
  ctx.fillStyle = cut.phase === 'grab' ? '#ff5a5a' : '#fff';
  ctx.font = 'bold ' + Math.min(26, S.W / 24) + 'px monospace';
  ctx.fillText(line, S.W / 2, S.H - bandH * 0.42);
  ctx.textAlign = 'left';
}

// ---- level cleared, and dying ----
function drawResult(S, won) {
  drawFight();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(8,6,16,0.78)';
  ctx.fillRect(0, 0, S.W, S.H);
  ctx.textAlign = 'center';
  ctx.fillStyle = won ? '#5ddf5d' : '#ff5a5a';
  ctx.font = 'bold ' + Math.min(56, S.W / 12) + 'px monospace';
  ctx.fillText(won ? 'CLEARED!' : 'YOU FELL', S.W / 2, S.H * 0.36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(22, S.W / 28) + 'px monospace';
  ctx.fillText(fightLevel.name, S.W / 2, S.H * 0.45);
  if (won) {
    ctx.fillStyle = '#ffd83d';
    ctx.fillText('+' + gainedXP + ' XP', S.W / 2, S.H * 0.53);
    const next = LEVELS.find(l => l.needs === fightLevel.id);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = Math.min(16, S.W / 36) + 'px monospace';
    ctx.fillText(next ? next.name + ' is now open' : 'you have beaten the lot!', S.W / 2, S.H * 0.61);
    if (fightLevel.cutscene) {
      ctx.fillStyle = '#ff8b7f';
      ctx.fillText('he went that way. go and get it back.', S.W / 2, S.H * 0.67);
    }
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = Math.min(16, S.W / 36) + 'px monospace';
    ctx.fillText('have another go - you keep your XP', S.W / 2, S.H * 0.55);
  }
  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText('SPACE  /  TAP  =  BACK TO THE MAP', S.W / 2, S.H * 0.76);
  ctx.textAlign = 'left';
}

// =====================================================================
// CONTROLS
// =====================================================================
function attack() {
  if (hero.dead || hero.attack > 0 || hero.cool > 0) return;
  hero.attack = SWING_TIME;
  hero.cool = SWING_TIME + SWING_COOL;
  hero.swung = false;
  swingSound();
}
function jump() {
  if (hero.dead || hero.z > 0) return;
  hero.vz = JUMP_V;
  hero.z = 1;
  tone(300, 0.1, 'sine', 0.05, 520);
}
function cycleMode(step) {
  modeIx = (modeIx + step + MODES.length) % MODES.length;
  localStorage.setItem('castle_mode', String(modeIx));
  tone(500 + modeIx * 120, 0.07, 'square', 0.06);
}

function pickMapNode(dir) {
  // step to the next level along, skipping any still locked
  for (let tries = 0; tries < LEVELS.length; tries++) {
    mapPick = (mapPick + dir + LEVELS.length) % LEVELS.length;
    if (isOpen(LEVELS[mapPick])) return;
  }
}
function goFromMap() {
  const lv = LEVELS[mapPick];
  if (!isOpen(lv)) { tone(160, 0.16, 'square', 0.07, 90); return; }
  startLevel(lv);
}
function advance() {
  ensureAudio();
  if (screen === 'title') { screen = 'select'; return; }
  if (screen === 'select') {
    nameBox.blur();
    nameBox.style.display = 'none';
    saveGame();
    // start on the furthest level you have unlocked
    mapPick = 0;
    LEVELS.forEach((l, i) => { if (isOpen(l)) mapPick = i; });
    screen = 'map';
    return;
  }
  if (screen === 'map') { goFromMap(); return; }
  if (screen === 'cutscene') {                     // let people skip it
    chest.taken = true; chest.lift = 1;
    resultTimer = 0; screen = 'cleared'; fanfare();
    return;
  }
  if (screen === 'cleared' || screen === 'dead') { screen = 'map'; return; }
}

addEventListener('keydown', e => {
  if (typing()) return;
  ensureAudio();
  const k = e.key;
  held[k] = true;
  if (k.length === 1) held[k.toLowerCase()] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();

  if (screen === 'select') {
    if (k === 'ArrowLeft') save.knight = (save.knight + 3) % 4;
    if (k === 'ArrowRight') save.knight = (save.knight + 1) % 4;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { saveGame(); tone(600, 0.05, 'square', 0.05); }
    if (k === ' ') advance();
    return;
  }
  if (screen === 'map') {
    if (k === 'ArrowRight' || k === 'ArrowUp') pickMapNode(1);
    if (k === 'ArrowLeft' || k === 'ArrowDown') pickMapNode(-1);
    if (k === ' ') advance();
    if (k.toLowerCase() === 'c') { screen = 'select'; }
    if (k.toLowerCase() === 'm') cycleMode(1);
    return;
  }
  if (screen === 'fight') {
    if (k === ' ' || k.toLowerCase() === 'j') attack();
    if (k.toLowerCase() === 'k') jump();
    if (k.toLowerCase() === 'l') castMagic();
    if (k === 'Escape') screen = 'map';
    return;
  }
  if (k === ' ') advance();
});
addEventListener('keyup', e => {
  held[e.key] = false;
  if (e.key.length === 1) held[e.key.toLowerCase()] = false;
});
addEventListener('blur', () => { held = {}; });
</script>
<script>
// ---- touch: a thumbstick on the left, buttons on the right ----
let padRects = [], stick = null;
function drawPads(S) {
  const r = Math.min(52, S.W / 11);
  const cx = r * 1.7, cy = S.H - r * 1.7;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const kx = stick ? cx + stick.dx * r * 0.5 : cx;
  const ky = stick ? cy + stick.dy * r * 0.5 : cy;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(kx, ky, r * 0.42, 0, Math.PI * 2); ctx.fill();
  padRects = [{ x: cx, y: cy, r: r * 1.5, stick: true }];
  const K = hero ? hero.K : KNIGHTS[save.knight];
  const buttons = [
    { act: 'hit', label: 'HIT', dx: -1.3, dy: 0, color: '#ffd83d' },
    { act: 'jump', label: 'JUMP', dx: -0.35, dy: -1.15, color: '#9ad4ff' },
    { act: 'magic', label: K.magic, dx: 0.55, dy: -0.3, color: K.magicColor },
  ];
  for (const b of buttons) {
    const bx = S.W - r * 2.2 + b.dx * r * 1.25, by = S.H - r * 1.9 + b.dy * r * 1.25;
    const ready = b.act !== 'magic' || (hero && hero.magicCool <= 0);
    ctx.fillStyle = ready ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)';
    ctx.strokeStyle = ready ? b.color : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, r * 0.66, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ready ? b.color : 'rgba(255,255,255,0.3)';
    ctx.font = 'bold ' + r * 0.26 + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, bx, by + r * 0.1);
    padRects.push({ x: bx, y: by, r: r * 0.85, act: b.act });
  }
  ctx.textAlign = 'left';
}
const touches = new Map();
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  touchMode = touchMode || e.pointerType === 'touch';
  if (screen === 'fight') {
    for (const b of padRects) {
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) > b.r) continue;
      if (b.stick) {
        stick = { id: e.pointerId, ox: b.x, oy: b.y, dx: 0, dy: 0 };
        touches.set(e.pointerId, 'stick');
      } else {
        if (b.act === 'hit') attack();
        if (b.act === 'jump') jump();
        if (b.act === 'magic') castMagic();
        touches.set(e.pointerId, b.act);
      }
      return;
    }
    return;
  }
  // menus: tap a card, a map pin, or anywhere to carry on
  for (const b of uiRects) {
    if (Math.abs(e.clientX - b.x) > b.w || Math.abs(e.clientY - b.y) > b.h) continue;
    if (b.knight !== undefined) { save.knight = b.knight; saveGame(); tone(600, 0.05, 'square', 0.05); return; }
    if (b.modeBtn) { cycleMode(1); return; }
    if (b.mapNode !== undefined) {
      if (mapPick === b.mapNode) goFromMap(); else mapPick = b.mapNode;
      return;
    }
    if (b.go) { advance(); return; }
  }
  if (screen !== 'select') advance();
});
canvas.addEventListener('pointermove', e => {
  if (!stick || stick.id !== e.pointerId) return;
  const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
  const d = Math.hypot(dx, dy) || 1;
  const cl = Math.min(1, d / 46);
  stick.dx = dx / d * cl; stick.dy = dy / d * cl;
  // the stick presses the same keys the keyboard does, so both routes
  // run through exactly the same code
  held.a = stick.dx < -0.3; held.d = stick.dx > 0.3;
  held.w = stick.dy < -0.3; held.s = stick.dy > 0.3;
});
function endTouch(e) {
  const t = touches.get(e.pointerId);
  if (t === 'stick') {
    stick = null;
    held.a = held.d = held.w = held.s = false;
  }
  touches.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
addEventListener('touchstart', () => { touchMode = true; }, { passive: true });

// =====================================================================
// THE GAME LOOP
// =====================================================================
function draw() {
  const S = stage();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (screen !== 'select') nameBox.style.display = 'none';
  if (screen === 'title') drawTitle(S);
  else if (screen === 'select') drawSelect(S);
  else if (screen === 'map') drawMap(S);
  else if (screen === 'fight') { drawFight(); if (touchMode) drawPads(S); }
  else if (screen === 'cutscene') drawCutscene(S);
  else if (screen === 'cleared') drawResult(S, true);
  else if (screen === 'dead') drawResult(S, false);
}
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (screen === 'fight') updateFight(dt);
  if (screen === 'cutscene') updateCutscene(dt);
  if (screen === 'cleared' || screen === 'dead') {
    resultTimer += dt;
    for (const p of particles) { p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
