<script>
// =====================================================================
// DRAWING THE STAGE
// =====================================================================
const SCENES = {
  grass: { sky1: '#6fc3f0', sky2: '#bfe9c8', floor: '#4f9a45', floor2: '#3f7d38', far: '#2f6f4a' },
  wood:  { sky1: '#1f3524', sky2: '#33543a', floor: '#3e6b38', floor2: '#2f5a2c', far: '#16311d' },
  cave:  { sky1: '#161122', sky2: '#2a2140', floor: '#4a4058', floor2: '#3a3246', far: '#0f0b18' },
  snow:  { sky1: '#93b8e0', sky2: '#dbeaf6', floor: '#e6eff7', floor2: '#cfdcea', far: '#a9c2d8' },
  castle:{ sky1: '#2a1c3a', sky2: '#4a3560', floor: '#6a6070', floor2: '#544b5c',
           far: '#241a33', hall: true },
  lava:  { sky1: '#3a0f10', sky2: '#7a2410', floor: '#4a2820', floor2: '#3a1e18', far: '#220a0a' },
};
// The inside of a castle: a stone wall with arches, pillars between
// them and a banner hanging on each pillar. It scrolls with you, so it
// reads as a long hall you are fighting your way down.
function drawHall(S, sc) {
  const h = S.backY;
  ctx.fillStyle = sc.far;
  ctx.fillRect(0, 0, S.W, h);
  const step = 260;
  const start = -((camX * 0.55) % step) - step;
  // which pillars are wrecked is decided by WHERE they are, not by when
  // they get drawn - so the same pillar is broken every time you walk
  // past it instead of flickering between whole and ruined
  const worldOf = x => Math.round((x + camX * 0.55) / step);
  for (let x = start; x < S.W + step; x += step) {
    const id = worldOf(x);
    const wrecked = fightLevel && fightLevel.wrecked;
    const smashed = wrecked && ((id * 2654435761) % 7) < 3;
    // the dark arch
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    const aw = 96, ah = h * 0.44;
    roundRect(x + step / 2 - aw / 2, h - ah, aw, ah, aw * 0.45);
    ctx.fill();
    // the pillar - snapped off partway up if this one has been smashed
    const pillarH = smashed ? h * 0.34 : h * 0.62;
    ctx.fillStyle = sc.floor2;
    ctx.fillRect(x - 26, h - pillarH, 52, pillarH);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(x - 26, h - pillarH, 16, pillarH);
    if (smashed) {
      ctx.fillStyle = '#3f394a';                       // the broken-off top
      ctx.beginPath();
      ctx.moveTo(x - 26, h - pillarH);
      ctx.lineTo(x - 10, h - pillarH - 16);
      ctx.lineTo(x + 6, h - pillarH - 4);
      ctx.lineTo(x + 26, h - pillarH - 20);
      ctx.lineTo(x + 26, h - pillarH + 6);
      ctx.lineTo(x - 26, h - pillarH + 8);
      ctx.closePath();
      ctx.fill();
    } else {
      // the banner, still hanging - but torn along the bottom
      ctx.fillStyle = '#6b1f31';
      ctx.beginPath();
      ctx.moveTo(x - 20, h - h * 0.58);
      ctx.lineTo(x + 20, h - h * 0.58);
      ctx.lineTo(x + 20, h - h * 0.3);
      if (wrecked) {                                   // ragged, burnt edge
        ctx.lineTo(x + 12, h - h * 0.22);
        ctx.lineTo(x + 6, h - h * 0.3);
        ctx.lineTo(x - 4, h - h * 0.2);
        ctx.lineTo(x - 12, h - h * 0.28);
      } else {
        ctx.lineTo(x, h - h * 0.18);
      }
      ctx.lineTo(x - 20, h - h * 0.24);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = wrecked ? '#a88c2a' : '#ffd83d';
      ctx.beginPath();
      ctx.arc(x, h - h * 0.42, 9, 0, Math.PI * 2);
      ctx.fill();
    }
    // a torch. In a wrecked hall most of them have gone out.
    const dark = wrecked && ((id * 40503) % 5) < 3;
    if (!dark) {
      const flick = 0.75 + Math.sin(Date.now() / 90 + x) * 0.25;
      ctx.fillStyle = 'rgba(255,170,60,' + flick * 0.8 + ')';
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 13 * flick, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,232,150,' + flick + ')';
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 6 * flick, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(20,14,10,0.8)';            // a dead, sooty bracket
      ctx.beginPath();
      ctx.arc(x + step / 2, h - h * 0.66, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // the top of the wall
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(0, 0, S.W, h * 0.12);
}

function drawStage(S, sc) {
  const sky = ctx.createLinearGradient(0, 0, 0, S.backY);
  sky.addColorStop(0, sc.sky1);
  sky.addColorStop(1, sc.sky2);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, S.W, S.backY);
  if (sc.hall) drawHall(S, sc);
  else {
    // a bumpy line of hills in the distance
    ctx.fillStyle = sc.far;
    ctx.beginPath();
    ctx.moveTo(0, S.backY);
    for (let i = 0; i <= 22; i++) {
      const x = (i / 22) * S.W;
      const h = 40 + Math.sin(i * 1.7 + camX * 0.0015) * 26 + Math.sin(i * 0.6) * 18;
      ctx.lineTo(x, S.backY - h);
    }
    ctx.lineTo(S.W, S.backY);
    ctx.closePath();
    ctx.fill();
  }
  // the floor, in bands so the depth reads
  const g = ctx.createLinearGradient(0, S.backY, 0, S.frontY);
  g.addColorStop(0, sc.floor2);
  g.addColorStop(1, sc.floor);
  ctx.fillStyle = g;
  ctx.fillRect(0, S.backY, S.W, S.H - S.backY);
  // stripes running away from you, to sell the depth
  ctx.strokeStyle = 'rgba(0,0,0,0.09)';
  ctx.lineWidth = 2;
  for (let i = -2; i < 26; i++) {
    const wx = (i * 160) - (camX % 160);
    ctx.beginPath();
    ctx.moveTo(wx + 40, S.backY);
    ctx.lineTo(wx - 40, S.frontY);
    ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath();
  ctx.moveTo(0, S.backY); ctx.lineTo(S.W, S.backY);
  ctx.stroke();
}

function drawFight() {
  const S = stage();
  const sc = SCENES[fightLevel.scene] || SCENES.grass;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawStage(S, sc);

  // EVERYTHING gets sorted by depth, so whoever is nearer the camera is
  // drawn on top of whoever is further back. This is the whole reason
  // the view reads as a stage and not a flat line.
  const cast = [];
  if (!hero.dead || hero.z > 0) cast.push({ a: hero, hero: true });
  for (const f of foes) cast.push({ a: f, hero: false });
  cast.sort((p, q) => p.a.depth - q.a.depth);

  // magic that sits on the floor goes underneath everyone
  for (const m of magics) {
    if (m.type === 'poison') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 0 }, S, camX);
      ctx.fillStyle = 'rgba(166, 255, 92, ' + Math.min(0.35, m.life * 0.12) + ')';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 95 * p.sc, 34 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.type === 'ice') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 0 }, S, camX);
      ctx.strokeStyle = 'rgba(127,228,255,' + m.life * 1.4 + ')';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, (1 - m.life) * 260, (1 - m.life) * 90, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // goo goes on the floor first, flat, so everybody walks over the top
  // of it rather than it sitting on their feet
  for (const sp of splats) {
    const q = toScreen(sp, S, camX);
    if (q.x < -80 || q.x > S.W + 80) continue;
    ctx.save();
    ctx.translate(q.x, S.backY + sp.depth * S.floorH);
    drawSplat(sp, q.sc);
    ctx.restore();
  }
  // rubble and fires stand on the floor like everybody else, so you can
  // walk in front of them or behind them
  for (const p of props) cast.push({ a: p, prop: true });
  // arrows sort by depth too, so one loosed along the back of the level
  // passes behind anyone standing at the front
  for (const a of arrows) cast.push({ a, arrow: true });
  // the chest sits on the floor with everybody else, sorted by depth
  if (chest) cast.push({ a: chest, chest: true });
  if (cut) cast.push({ a: { x: cut.x, depth: cut.depth, z: 0, r: 30 }, baron: true });
  cast.sort((p, q) => p.a.depth - q.a.depth);

  for (const c of cast) {
    const a = c.a;
    const p = toScreen(a, S, camX);
    const floorY = S.backY + a.depth * S.floorH;
    if (p.x < -220 || p.x > S.W + 220) continue;
    if (c.prop) {
      const t = Date.now() / 1000;
      ctx.save();
      ctx.translate(p.x, p.y);
      drawProp(a, p.sc, t);
      ctx.restore();
      // a fire throws sparks up into the air
      if (a.kind === 'fire' && Math.random() < 0.09) {
        particles.push({ x: a.x + (Math.random() - 0.5) * 20, depth: a.depth,
                         z: 12 + Math.random() * 20, vx: (Math.random() - 0.5) * 20,
                         vz: 70 + Math.random() * 60, life: 0.7,
                         color: Math.random() < 0.5 ? '#ffbe3d' : '#e0521f' });
      }
      continue;
    }
    if (c.arrow) {
      ctx.save();
      ctx.translate(p.x, p.y);
      drawArrow(a, p.sc);
      ctx.restore();
      continue;
    }
    if (c.chest) {
      if (chest.taken && cut) continue;            // he is carrying it now
      drawShadow(p.x, floorY, p.sc, 32);
      drawChest(p.x, p.y, p.sc, chest);
      continue;
    }
    if (c.baron) {
      drawShadow(p.x, floorY, p.sc * 1.5, 34);
      drawBaron(p.x, p.y, p.sc, cut.phase, cut.t);
      // the gold, tucked under his arm once he has picked it up
      if (chest && chest.taken) {
        drawChest(p.x - 40 * p.sc, p.y - 52 * p.sc, p.sc * 0.8,
                  { bob: cut.t * 3, lift: 0 });
      }
      continue;
    }
    drawShadow(p.x, floorY, p.sc, a.r);
    if (c.hero) drawKnight(a, p.x, p.y, p.sc);
    else drawFoe(a, p.x, p.y, p.sc);
  }

  // heads that have come off, bouncing about the floor
  for (const h of heads) {
    const p = toScreen(h, S, camX);
    if (p.x < -80 || p.x > S.W + 80) continue;
    const floorY = S.backY + h.depth * S.floorH;
    ctx.globalAlpha = h.life < 0.8 ? h.life / 0.8 : 1;
    drawShadow(p.x, floorY, p.sc * 0.6, 14);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(h.angle);
    drawLooseHead(h.foe, 20 * p.sc);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // fire and lightning go over the top
  for (const m of magics) {
    if (m.type === 'fire') {
      const p = toScreen({ x: m.x, depth: m.depth, z: 20 }, S, camX);
      ctx.fillStyle = 'rgba(255,139,31,0.8)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 44 * p.sc, 34 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,232,120,0.9)';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 24 * p.sc, 18 * p.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (m.type === 'bolt') {
      const a = toScreen({ x: m.x1, depth: m.d1, z: m.z1 }, S, camX);
      const b = toScreen({ x: m.x2, depth: m.d2, z: m.z2 }, S, camX);
      ctx.strokeStyle = 'rgba(255,233,74,' + Math.min(1, m.life * 3) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      const steps = 5;
      for (let i = 1; i < steps; i++) {
        const t = i / steps;
        ctx.lineTo(a.x + (b.x - a.x) * t + (Math.random() - 0.5) * 26,
                   a.y + (b.y - a.y) * t + (Math.random() - 0.5) * 26);
      }
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  for (const p of particles) {
    const s = toScreen(p, S, camX);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    if (p.ooze) {                                // ooze is round and drippy
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, 4 * s.sc, 5.5 * s.sc, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(s.x - 3 * s.sc, s.y - 3 * s.sc, 6 * s.sc, 6 * s.sc);
    }
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floaters) {
    const s = toScreen(f, S, camX);
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.color;
    ctx.font = 'bold ' + Math.round(15 * s.sc) + 'px monospace';
    ctx.fillText(f.text, s.x, s.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  // THE SHOCKWAVE. A ring rushing outwards across the floor from where
  // he landed, drawn at the same size the slam actually reaches - so
  // what you see is exactly what got hit.
  if (wave) {
    const p = toScreen({ x: wave.x, depth: wave.depth, z: 0 }, S, camX);
    const grow = 1 - wave.t / WAVE_TIME;
    const fade = wave.t / WAVE_TIME;
    ctx.strokeStyle = 'rgba(255,216,61,' + fade * 0.85 + ')';
    ctx.lineWidth = 9 * (1 - grow * 0.7);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, SLAM_REACH * grow * p.sc, SLAM_REACH * 0.34 * grow * p.sc,
                0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + fade * 0.6 + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, SLAM_REACH * grow * 0.72 * p.sc,
                SLAM_REACH * 0.24 * grow * p.sc, 0, 0, Math.PI * 2);
    ctx.stroke();
    // cracks running out from the middle
    ctx.strokeStyle = 'rgba(60,50,40,' + fade * 0.5 + ')';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < 6; i++) {
      const a2 = (i / 6) * Math.PI * 2 + wave.x * 0.01;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(a2) * SLAM_REACH * grow * 0.85 * p.sc,
                 p.y + Math.sin(a2) * SLAM_REACH * 0.3 * grow * p.sc);
      ctx.stroke();
    }
  }

  // the flash of a critical, snapping outwards from where you stand
  if (critFlash > 0) {
    const p = toScreen(hero, S, camX);
    const grow = 1 - critFlash / 0.3;
    ctx.strokeStyle = 'rgba(255,216,61,' + (critFlash / 0.3) * 0.8 + ')';
    ctx.lineWidth = 6 * (1 - grow);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y - 20, 40 + grow * 130, 16 + grow * 46, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  drawFightHUD(S);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

<script>
// =====================================================================
// THE HUD AND THE OTHER SCREENS
// =====================================================================
const nameBox = document.getElementById('nameBox');
nameBox.value = save.name;
nameBox.addEventListener('input', () => {

nameBox.addEventListener('keydown', e => {
  if (e.key === 'Enter') nameBox.blur();

function typing() { return document.activeElement === nameBox; }

function drawFightHUD(S) {
  const K = hero.K;
  ctx.fillStyle = 'rgba(10,8,18,0.7)';
  ctx.fillRect(0, 0, S.W, S.hud);
  ctx.textAlign = 'left';
  // start clear of the Arcade pill in the top corner

  ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
  ctx.fillText(playerName() + '  Lv' + heroLevel(), hx, S.hud * 0.42);
  // health
  const bw = Math.min(230, S.W * 0.26);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(hx, S.hud * 0.55, bw, 14);
  ctx.fillStyle = hero.health / hero.maxHealth < 0.3 ? '#ff4d4d' : '#5ddf5d';
  ctx.fillRect(hx + 1, S.hud * 0.55 + 1, (bw - 2) * Math.max(0, hero.health / hero.maxHealth), 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hx, S.hud * 0.55, bw, 14);
  // magic, ready or charging
  const mx = hx + bw + 14, mw = Math.min(120, S.W * 0.14);
  const ready = hero.magicCool <= 0;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx, S.hud * 0.55, mw, 14);
  ctx.fillStyle = ready ? K.magicColor : 'rgba(255,255,255,0.25)';
  ctx.fillRect(mx + 1, S.hud * 0.55 + 1, (mw - 2) * (1 - hero.magicCool / MAGIC_COOL), 12);
  ctx.fillStyle = ready ? K.magicColor : 'rgba(255,255,255,0.45)';
  ctx.font = 'bold ' + Math.min(12, S.W / 48) + 'px monospace';
  ctx.fillText(ready ? K.magic + ' READY' : K.magic, mx, S.hud * 0.42);
  // the slam, once you have earned it
  if (haveCombo()) {
    const sx2 = mx + mw + 14, sw2 = Math.min(110, S.W * 0.13);
    const sready = hero.slamCool <= 0;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx2, S.hud * 0.55, sw2, 14);
    ctx.fillStyle = sready ? '#ffd83d' : 'rgba(255,255,255,0.25)';
    ctx.fillRect(sx2 + 1, S.hud * 0.55 + 1, (sw2 - 2) * (1 - hero.slamCool / SLAM_COOL), 12);
    ctx.fillStyle = sready ? '#ffd83d' : 'rgba(255,255,255,0.45)';
    ctx.font = 'bold ' + Math.min(12, S.W / 48) + 'px monospace';
    ctx.fillText(sready ? 'SLAM - TAP TWICE' : 'SLAM', sx2, S.hud * 0.42);
  }
  // where you are
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(16, S.W / 36) + 'px monospace';
  ctx.fillText(fightLevel.name, S.W - 14, S.hud * 0.42);
  ctx.fillStyle = ['#7fdf3f', '#ffd83d', '#ff5a5a'][modeIx];
  ctx.font = 'bold ' + Math.min(12, S.W / 48) + 'px monospace';
  ctx.fillText(mode().name, S.W - 14, S.hud * 0.2);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold ' + Math.min(13, S.W / 44) + 'px monospace';
  const left = foes.filter(f => !f.dead).length;
  ctx.fillText(left ? left + ' of ' + levelCount(fightLevel) + ' left' : 'ALL CLEAR',
               S.W - 14, S.hud * 0.75);
  ctx.textAlign = 'left';
  if (hero.combo > 1) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd83d';
    ctx.font = 'bold ' + Math.min(30, S.W / 20) + 'px monospace';
    ctx.fillText('x' + hero.combo, S.W / 2, S.hud * 0.72);
    ctx.textAlign = 'left';
  }
}

// ---- the title ----
function drawTitle(S) {

  ctx.textAlign = 'left';
}

// THE SHOP. Two shelves - what you can carry now, and what you will be
// able to carry later. The locked ones are shown rather than hidden, so
// you can see what you are working towards.
function drawShop(S) {
  const g = ctx.createLinearGradient(0, 0, 0, S.H);
  g.addColorStop(0, '#2b1f16'); g.addColorStop(1, '#43301f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S.W, S.H);
  uiRects = [];
  nameBox.style.display = 'none';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd83d';
  ctx.font = 'bold ' + Math.min(34, S.W / 20) + 'px monospace';
  ctx.fillText('THE ARMOURY', S.W / 2, S.H * 0.1);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(18, S.W / 32) + 'px monospace';
  ctx.fillText(save.gold + ' GOLD   -   Lv' + heroLevel(), S.W / 2, S.H * 0.155);

  const cols = 4;
  const cw = Math.min(S.W * 0.21, 220), ch = Math.min(S.H * 0.3, 168);
  SHOP.forEach((w, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const cx = S.W * 0.5 + (col - (cols - 1) / 2) * (cw + S.W * 0.015);
    const cy = S.H * 0.22 + row * (ch + S.H * 0.045);
    const have = owned(w.id), held = save.weapon === w.id;
    const allowed = canBuy(w);
    const afford = save.gold >= w.cost;
    ctx.fillStyle = held ? 'rgba(255,216,61,0.16)'
                  : have ? 'rgba(255,255,255,0.08)'
                  : allowed ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.3)';
    roundRect(cx - cw / 2, cy, cw, ch, 10); ctx.fill();
    ctx.strokeStyle = held ? '#ffd83d' : allowed ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = held ? 4 : 2;
    roundRect(cx - cw / 2, cy, cw, ch, 10); ctx.stroke();

    // the blade itself, drawn in its own colour
    ctx.save();
    ctx.translate(cx, cy + ch * 0.42);
    ctx.globalAlpha = allowed ? 1 : 0.32;
    ctx.fillStyle = w.blade;
    roundRect(-cw * 0.035, -ch * 0.24, cw * 0.07, ch * 0.28, 4); ctx.fill();
    ctx.fillStyle = '#8a6a3a';
    roundRect(-cw * 0.11, ch * 0.03, cw * 0.22, ch * 0.035, 3); ctx.fill();
    ctx.fillStyle = '#3a2c1c';
    roundRect(-cw * 0.03, ch * 0.06, cw * 0.06, ch * 0.09, 3); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.fillStyle = allowed ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.font = 'bold ' + Math.min(14, cw / 13) + 'px monospace';
    ctx.fillText(w.name, cx, cy + ch * 0.62);
    ctx.fillStyle = w.dmg >= 10 ? '#ff8b4d' : '#7fdf3f';
    ctx.font = 'bold ' + Math.min(16, cw / 11) + 'px monospace';
    ctx.fillText('+' + w.dmg + ' DAMAGE', cx, cy + ch * 0.75);
    ctx.font = Math.min(11, cw / 17) + 'px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText(w.blurb, cx, cy + ch * 0.85);
    ctx.font = 'bold ' + Math.min(13, cw / 14) + 'px monospace';
    if (held) { ctx.fillStyle = '#ffd83d'; ctx.fillText('IN YOUR HAND', cx, cy + ch * 0.96); }
    else if (have) { ctx.fillStyle = '#7fdf3f'; ctx.fillText('OWNED - TAP TO HOLD', cx, cy + ch * 0.96); }
    else if (!allowed) { ctx.fillStyle = '#ff6b6b'; ctx.fillText('LOCKED - Lv' + w.need, cx, cy + ch * 0.96); }
    else { ctx.fillStyle = afford ? '#ffd83d' : 'rgba(255,255,255,0.35)';
           ctx.fillText(w.cost + ' GOLD', cx, cy + ch * 0.96); }
    uiRects.push({ x: cx, y: cy + ch / 2, w: cw / 2, h: ch / 2, buy: i });
  });

  ctx.fillStyle = '#ffd83d';
  ctx.font = 'bold ' + Math.min(16, S.W / 36) + 'px monospace';
  ctx.fillText(shopSaid, S.W / 2, S.H * 0.9);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
  ctx.fillText('SPACE  /  TAP HERE  =  BACK TO THE MAP', S.W / 2, S.H * 0.96);
  uiRects.push({ x: S.W / 2, y: S.H * 0.955, w: S.W * 0.4, h: 22, leaveShop: true });
  ctx.textAlign = 'left';
}

// ---- the world map ----
function drawMap(S) {
  const g = ctx.createLinearGradient(0, 0, 0, S.H);
  g.addColorStop(0, '#243a52'); g.addColorStop(1, '#3f5a3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S.W, S.H);
  uiRects = [];
  nameBox.style.display = 'none';

  // the paths between levels, drawn first so the pins sit on top
  LEVELS.forEach(lv => {
    if (lv.needs < 0) return;
    const from = LEVELS[lv.needs];
    const open = isOpen(lv);
    ctx.strokeStyle = open ? 'rgba(255,216,61,0.8)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 5;
    ctx.setLineDash(open ? [] : [8, 10]);
    ctx.beginPath();
    ctx.moveTo(from.x * S.W, from.y * S.H);
    ctx.quadraticCurveTo((from.x + lv.x) / 2 * S.W, (from.y + lv.y) / 2 * S.H - 40,
                         lv.x * S.W, lv.y * S.H);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  LEVELS.forEach((lv, i) => {
    const x = lv.x * S.W, y = lv.y * S.H;
    const open = isOpen(lv), done = isBeaten(lv.id);
    const here = mapPick === i;
    const r = Math.min(30, S.W / 30) * (here ? 1.18 : 1);
    ctx.fillStyle = done ? '#5ddf5d' : open ? '#ffd83d' : 'rgba(120,120,140,0.7)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = here ? '#fff' : 'rgba(0,0,0,0.4)';
    ctx.lineWidth = here ? 4 : 2;
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1a1220';
    ctx.font = 'bold ' + r * 0.9 + 'px monospace';
    ctx.fillText(done ? '✓' : open ? String(i + 1) : '🔒', x, y + r * 0.32);
    ctx.fillStyle = open ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.font = 'bold ' + Math.min(14, S.W / 44) + 'px monospace';
    ctx.fillText(lv.name, x, y + r + 18);
    uiRects.push({ x, y, w: r * 1.6, h: r * 1.6, mapNode: i });
    ctx.textAlign = 'left';
  });

  // the panel telling you about whichever one you are on
  const lv = LEVELS[mapPick];
  const open = isOpen(lv);
  ctx.fillStyle = 'rgba(10,8,18,0.8)';
  ctx.fillRect(0, S.H - Math.min(112, S.H * 0.2), S.W, Math.min(112, S.H * 0.2));
  const py = S.H - Math.min(112, S.H * 0.2);
  ctx.textAlign = 'left';
  ctx.fillStyle = KNIGHTS[save.knight].body;
  ctx.font = 'bold ' + Math.min(16, S.W / 36) + 'px monospace';
  ctx.fillText(playerName() + '   Lv' + heroLevel() + '   ' + save.xp + ' XP', 16, py + 26);
  if (haveShop()) {
    ctx.fillStyle = '#ffd83d';
    ctx.font = 'bold ' + Math.min(14, S.W / 42) + 'px monospace';
    const w = shopItem(save.weapon);
    ctx.fillText(save.gold + ' GOLD' + (w ? '   -   ' + w.name + ' (+' + w.dmg + ')' : ''),
                 16, py + 44);
  }
  ctx.fillStyle = open ? '#ffd83d' : 'rgba(255,255,255,0.5)';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText(lv.name, 16, py + 54);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = Math.min(14, S.W / 44) + 'px monospace';
  ctx.fillText(open ? lv.blurb : 'beat ' + LEVELS[lv.needs].name + ' first', 16, py + 76);
  ctx.textAlign = 'right';
  if (open) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(19, S.W / 30) + 'px monospace';
    ctx.fillText(isBeaten(lv.id) ? 'SPACE / TAP  =  PLAY AGAIN' : 'SPACE / TAP  =  FIGHT',
                 S.W - 16, py + 54);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = Math.min(12, S.W / 50) + 'px monospace';
  ctx.fillText('arrows pick a level   -   C knight   -   M mode', S.W - 16, py + 78);
  ctx.textAlign = 'left';

  // the door to the armoury, once you have earned it
  if (haveShop()) {
    const sw = Math.min(170, S.W * 0.21), sh = Math.min(40, S.H * 0.07);
    const sx = S.W - sw - 14, sy = 14 + Math.min(46, S.H * 0.08) + 10;
    ctx.fillStyle = 'rgba(60,40,16,0.75)';
    roundRect(sx, sy, sw, sh, 8); ctx.fill();
    ctx.strokeStyle = '#ffd83d';
    ctx.lineWidth = 2;
    roundRect(sx, sy, sw, sh, 8); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd83d';
    ctx.font = 'bold ' + Math.min(15, S.W / 38) + 'px monospace';
    ctx.fillText('THE ARMOURY', sx + sw / 2, sy + sh * 0.44);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = Math.min(11, S.W / 54) + 'px monospace';
    ctx.fillText('press B', sx + sw / 2, sy + sh * 0.78);
    uiRects.push({ x: sx + sw / 2, y: sy + sh / 2, w: sw / 2, h: sh / 2, shopBtn: true });
    ctx.textAlign = 'left';
  }

  // START AGAIN. Tucked away, and it asks twice.
  const rw = Math.min(180, S.W * 0.22), rh = Math.min(34, S.H * 0.06);
  const rx = 16, ry = py - rh - 12;
  const armed = wipeArmed > 0;
  ctx.fillStyle = armed ? 'rgba(255,60,60,0.25)' : 'rgba(10,8,18,0.6)';
  roundRect(rx, ry, rw, rh, 8); ctx.fill();
  ctx.strokeStyle = armed ? '#ff5a5a' : 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  roundRect(rx, ry, rw, rh, 8); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = armed ? '#ff8b8b' : 'rgba(255,255,255,0.5)';
  ctx.font = 'bold ' + Math.min(13, S.W / 46) + 'px monospace';
  ctx.fillText(armed ? 'REALLY? TAP AGAIN' : 'START AGAIN  (R)', rx + rw / 2, ry + rh * 0.63);
  uiRects.push({ x: rx + rw / 2, y: ry + rh / 2, w: rw / 2, h: rh / 2, wipe: true });
  ctx.textAlign = 'left';

  // the difficulty, up in the corner where it is out of the way
  const M = mode();
  const mw2 = Math.min(190, S.W * 0.24), mh2 = Math.min(46, S.H * 0.08);
  const mx2 = S.W - mw2 - 14, my2 = 14;
  const col = ['#7fdf3f', '#ffd83d', '#ff5a5a'][modeIx];
  ctx.fillStyle = 'rgba(10,8,18,0.65)';
  roundRect(mx2, my2, mw2, mh2, 8); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  roundRect(mx2, my2, mw2, mh2, 8); ctx.stroke();
  ctx.textAlign = 'center';
  ctx.fillStyle = col;
  ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
  ctx.fillText(M.name, mx2 + mw2 / 2, my2 + mh2 * 0.45);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = Math.min(11, S.W / 54) + 'px monospace';
  ctx.fillText(M.desc + '  -  press M', mx2 + mw2 / 2, my2 + mh2 * 0.78);
  uiRects.push({ x: mx2 + mw2 / 2, y: my2 + mh2 / 2, w: mw2 / 2, h: mh2 / 2, modeBtn: true });
  ctx.textAlign = 'left';
}
</script>
<script>
// The cutscene is just the stage with the controls taken away, plus a
// caption. Reusing drawFight means the world carries on looking exactly
// as it did a second ago, which is what makes it feel like a moment in
// the same place rather than a different screen.
function drawCutscene(S) {
  drawFight();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bandH = Math.min(70, S.H * 0.12);
  ctx.fillStyle = 'rgba(6,4,10,0.92)';
  ctx.fillRect(0, 0, S.W, bandH);
  ctx.fillRect(0, S.H - bandH, S.W, bandH);
  ctx.textAlign = 'center';
  let line = '';
  if (cut.phase === 'in') line = 'something enormous is coming...';
  else if (cut.phase === 'grab') line = 'THE CRIMSON KNIGHT takes the gold';
  else line = 'after him!';
  ctx.fillStyle = cut.phase === 'grab' ? '#ff5a5a' : '#fff';
  ctx.font = 'bold ' + Math.min(26, S.W / 24) + 'px monospace';
  ctx.fillText(line, S.W / 2, S.H - bandH * 0.42);
  ctx.textAlign = 'left';
}

// ---- level cleared, and dying ----
function drawResult(S, won) {
  drawFight();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = 'rgba(8,6,16,0.78)';
  ctx.fillRect(0, 0, S.W, S.H);
  ctx.textAlign = 'center';
  ctx.fillStyle = won ? '#5ddf5d' : '#ff5a5a';
  ctx.font = 'bold ' + Math.min(56, S.W / 12) + 'px monospace';
  ctx.fillText(won ? 'CLEARED!' : 'YOU FELL', S.W / 2, S.H * 0.36);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + Math.min(22, S.W / 28) + 'px monospace';
  ctx.fillText(fightLevel.name, S.W / 2, S.H * 0.45);
  if (won) {
    ctx.fillStyle = '#ffd83d';
    ctx.fillText('+' + gainedXP + ' XP    +' + gainedGold + ' GOLD', S.W / 2, S.H * 0.53);
    const next = LEVELS.find(l => l.needs === fightLevel.id);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = Math.min(16, S.W / 36) + 'px monospace';
    ctx.fillText(next ? next.name + ' is now open' : 'you have beaten the lot!', S.W / 2, S.H * 0.61);
    if (fightLevel.cutscene) {
      ctx.fillStyle = '#ff8b7f';
      ctx.fillText('he went that way. go and get it back.', S.W / 2, S.H * 0.67);
      ctx.fillStyle = '#ffd83d';
      ctx.font = 'bold ' + Math.min(19, S.W / 30) + 'px monospace';
      ctx.fillText('NEW MOVE: tap ATTACK twice fast to SLAM', S.W / 2, S.H * 0.735);
      ctx.fillStyle = '#ffd83d';
      ctx.font = 'bold ' + Math.min(17, S.W / 34) + 'px monospace';
      ctx.fillText('THE ARMOURY IS OPEN - spend your gold on the map', S.W / 2, S.H * 0.79);
    }
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = Math.min(16, S.W / 36) + 'px monospace';
    ctx.fillText('have another go - you keep your XP', S.W / 2, S.H * 0.55);
  }
  ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
  ctx.font = 'bold ' + Math.min(22, S.W / 26) + 'px monospace';
  ctx.fillText('SPACE  /  TAP  =  BACK TO THE MAP', S.W / 2, S.H * 0.76);
  ctx.textAlign = 'left';
}

// =====================================================================
// CONTROLS
// =====================================================================
// =====================================================================
// THE SLAM.
//
// Two taps of the attack button, quickly, and you leap up and come down
// on the floor like a hammer. The shockwave goes out in a ring and
// everything it reaches takes a hit and goes over - whichever side of
// you it was standing on. You earn it by taking your castle back.
// =====================================================================
const DOUBLE_TAP = 0.28;         // how quickly the second tap must come
const SLAM_UP = 700;             // how hard you launch yourself
const SLAM_DOWN = 2600;          // and how fast you come back down
const SLAM_REACH = 132;          // how far the shockwave carries
const SLAM_COOL = 2.4;
const WAVE_TIME = 0.45;
function haveCombo() { return isBeaten(0); }
let lastTap = -99;
let wave = null;                 // the ring going out across the floor

function slamAttack() {
  if (hero.slam || hero.slamCool > 0 || hero.dead) return;
  hero.slam = true;
  hero.slamCool = SLAM_COOL;
  hero.attack = 0;
  hero.vz = SLAM_UP;             // up first
  hero.z = Math.max(hero.z, 1);
  tone(320, 0.2, 'square', 0.07, 700);
}

// the moment it lands
function slamImpact() {
  hero.slam = false;
  wave = { x: hero.x, depth: hero.depth, t: WAVE_TIME };
  shake = Math.max(shake, 22);
  tone(70, 0.35, 'sine', 0.16, 40);
  tone(240, 0.16, 'square', 0.09, 90);
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    particles.push({
      x: hero.x, depth: hero.depth, z: 4,
      vx: Math.cos(a) * (120 + Math.random() * 220),
      vz: 30 + Math.random() * 110,
      life: 0.5 + Math.random() * 0.3, color: '#a29aa8',
    });
  }
  let got = 0;
  for (const f of foes) {
    if (f.dead) continue;
    const dx = Math.abs(f.x - hero.x), dd = Math.abs(f.depth - hero.depth);
    if (dx > SLAM_REACH || dd > 0.34) continue;    // no facing check - it is a ring
    const crit = rollCrit();
    // the closer they were standing, the harder it hits them
    const near = 1 - (dx / SLAM_REACH) * 0.45;
    let dmg = Math.round((12 + myPower() * 3 + weaponDamage()) * near);
    if (crit) dmg = Math.round(dmg * CRIT_DAMAGE);
    hurtFoe(f, dmg, 30, hero, crit, true);         // a slam goes through shields
    got++;
  }
  if (got) floatText(hero.x, hero.depth, 96, got > 1 ? 'SLAM x' + got : 'SLAM!', '#ffd83d');
}

function attack() {
  if (hero.dead) return;
  // two taps in a quarter of a second and you slam instead of swinging
  const now = performance.now() / 1000;
  if (haveCombo() && now - lastTap < DOUBLE_TAP && hero.slamCool <= 0) {
    lastTap = -99;
    slamAttack();
    return;
  }
  lastTap = now;
  if (hero.attack > 0 || hero.cool > 0 || hero.slam) return;
  hero.attack = SWING_TIME;
  hero.cool = SWING_TIME + SWING_COOL;
  hero.swung = false;
  swingSound();
}
function jump() {
  if (hero.dead || hero.z > 0) return;
  hero.vz = JUMP_V;
  hero.z = 1;
  tone(300, 0.1, 'sine', 0.05, 520);
}
// Starting again from nothing. This throws away every level you have
// beaten and every point of XP, so it asks twice - the second tap
// within three seconds is the one that does it.
let wipeArmed = 0;
function wipeSave() {
  if (wipeArmed <= 0) {
    wipeArmed = 3;
    tone(300, 0.12, 'square', 0.07);
    return;
  }
  wipeArmed = 0;
  save.beaten = [];
  save.xp = 0;
  mapPick = 0;
  saveGame();
  sadTune();
}

// One tap buys it if you can afford it and are strong enough. Tapping
// one you already own puts it in your hand instead.
let shopSaid = '';
function tryBuy(w) {
  if (owned(w.id)) {
    save.weapon = save.weapon === w.id ? null : w.id;
    saveGame();
    shopSaid = save.weapon ? 'wielding the ' + w.name : 'put it away';
    tone(700, 0.07, 'square', 0.06);
    return;
  }
  if (!canBuy(w)) {
    shopSaid = 'you must be level ' + w.need + ' to carry that';
    tone(160, 0.16, 'square', 0.06, 90);
    return;
  }
  if (save.gold < w.cost) {
    shopSaid = 'that costs ' + w.cost + 'g - you have ' + save.gold;
    tone(160, 0.16, 'square', 0.06, 90);
    return;
  }
  save.gold -= w.cost;
  save.owned.push(w.id);
  save.weapon = w.id;
  saveGame();
  shopSaid = 'bought the ' + w.name + '!';
  [660, 880, 1100].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'square', 0.08), i * 80));
}

function cycleMode(step) {
  modeIx = (modeIx + step + MODES.length) % MODES.length;
  localStorage.setItem('castle_mode', String(modeIx));
  tone(500 + modeIx * 120, 0.07, 'square', 0.06);
}

function pickMapNode(dir) {
  // step to the next level along, skipping any still locked
  for (let tries = 0; tries < LEVELS.length; tries++) {
    mapPick = (mapPick + dir + LEVELS.length) % LEVELS.length;
    if (isOpen(LEVELS[mapPick])) return;
  }
}
function goFromMap() {
  const lv = LEVELS[mapPick];
  if (!isOpen(lv)) { tone(160, 0.16, 'square', 0.07, 90); return; }
  startLevel(lv);
}
function advance() {
  ensureAudio();
  if (screen === 'title') { screen = 'select'; return; }
  if (screen === 'select') {
    nameBox.blur();
    nameBox.style.display = 'none';
    saveGame();
    // start on the furthest level you have unlocked
    mapPick = 0;
    LEVELS.forEach((l, i) => { if (isOpen(l)) mapPick = i; });
    screen = 'map';
    return;
  }
  if (screen === 'map') { goFromMap(); return; }
  if (screen === 'cutscene') {                     // let people skip it
    chest.taken = true; chest.lift = 1;
    resultTimer = 0; screen = 'cleared'; fanfare();
    return;
  }
  if (screen === 'cleared' || screen === 'dead') { screen = 'map'; return; }
}

addEventListener('keydown', e => {
  if (typing()) return;
  ensureAudio();
  const k = e.key;
  held[k] = true;
  if (k.length === 1) held[k.toLowerCase()] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();

  if (screen === 'select') {
    if (k === 'ArrowLeft') save.knight = (save.knight + 3) % 4;
    if (k === 'ArrowRight') save.knight = (save.knight + 1) % 4;
    if (k === 'ArrowLeft' || k === 'ArrowRight') { saveGame(); tone(600, 0.05, 'square', 0.05); }
    if (k === ' ') advance();
    return;
  }
  if (screen === 'shop') {
    if (k === ' ' || k === 'Escape') { screen = 'map'; shopSaid = ''; }
    return;
  }
  if (screen === 'map') {
    if (k === 'ArrowRight' || k === 'ArrowUp') pickMapNode(1);
    if (k === 'ArrowLeft' || k === 'ArrowDown') pickMapNode(-1);
    if (k === ' ') advance();
    if (k.toLowerCase() === 'c') { screen = 'select'; }
    if (k.toLowerCase() === 'm') cycleMode(1);
    if (k.toLowerCase() === 'r') wipeSave();
    if (k.toLowerCase() === 'b' && haveShop()) { screen = 'shop'; shopSaid = ''; }
    return;
  }
  if (screen === 'fight') {
    if (k === ' ' || k.toLowerCase() === 'j') attack();
    if (k.toLowerCase() === 'k') jump();
    if (k.toLowerCase() === 'l') castMagic();
    if (k === 'Escape') screen = 'map';
    return;
  }
  if (k === ' ') advance();
});
addEventListener('keyup', e => {
  held[e.key] = false;
  if (e.key.length === 1) held[e.key.toLowerCase()] = false;
});
addEventListener('blur', () => { held = {}; });
</script>
<script>
// ---- touch: a thumbstick on the left, buttons on the right ----
let padRects = [], stick = null;
function drawPads(S) {
  const r = Math.min(52, S.W / 11);
  const cx = r * 1.7, cy = S.H - r * 1.7;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  const kx = stick ? cx + stick.dx * r * 0.5 : cx;
  const ky = stick ? cy + stick.dy * r * 0.5 : cy;
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.arc(kx, ky, r * 0.42, 0, Math.PI * 2); ctx.fill();
  padRects = [{ x: cx, y: cy, r: r * 1.5, stick: true }];
  const K = hero ? hero.K : KNIGHTS[save.knight];
  const buttons = [
    { act: 'hit', label: 'HIT', dx: -1.3, dy: 0, color: '#ffd83d' },
    { act: 'jump', label: 'JUMP', dx: -0.35, dy: -1.15, color: '#9ad4ff' },
    { act: 'magic', label: K.magic, dx: 0.55, dy: -0.3, color: K.magicColor },
  ];
  for (const b of buttons) {
    const bx = S.W - r * 2.2 + b.dx * r * 1.25, by = S.H - r * 1.9 + b.dy * r * 1.25;
    const ready = b.act !== 'magic' || (hero && hero.magicCool <= 0);
    ctx.fillStyle = ready ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)';
    ctx.strokeStyle = ready ? b.color : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, r * 0.66, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ready ? b.color : 'rgba(255,255,255,0.3)';
    ctx.font = 'bold ' + r * 0.26 + 'px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, bx, by + r * 0.1);
    padRects.push({ x: bx, y: by, r: r * 0.85, act: b.act });
  }
  ctx.textAlign = 'left';
}
const touches = new Map();
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  touchMode = touchMode || e.pointerType === 'touch';
  if (screen === 'fight') {
    for (const b of padRects) {
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) > b.r) continue;
      if (b.stick) {
        stick = { id: e.pointerId, ox: b.x, oy: b.y, dx: 0, dy: 0 };
        touches.set(e.pointerId, 'stick');
      } else {
        if (b.act === 'hit') attack();
        if (b.act === 'jump') jump();
        if (b.act === 'magic') castMagic();
        touches.set(e.pointerId, b.act);
      }
      return;
    }
    return;
  }
  // menus: tap a card, a map pin, or anywhere to carry on
  for (const b of uiRects) {
    if (Math.abs(e.clientX - b.x) > b.w || Math.abs(e.clientY - b.y) > b.h) continue;
    if (b.knight !== undefined) { save.knight = b.knight; saveGame(); tone(600, 0.05, 'square', 0.05); return; }
    if (b.buy !== undefined) { tryBuy(SHOP[b.buy]); return; }
    if (b.leaveShop) { screen = 'map'; shopSaid = ''; return; }
    if (b.shopBtn) { screen = 'shop'; shopSaid = ''; return; }
    if (b.wipe) { wipeSave(); return; }
    if (b.modeBtn) { cycleMode(1); return; }
    if (b.mapNode !== undefined) {
      if (mapPick === b.mapNode) goFromMap(); else mapPick = b.mapNode;
      return;
    }
    if (b.go) { advance(); return; }
  }
  if (screen !== 'select' && screen !== 'shop') advance();
});
canvas.addEventListener('pointermove', e => {
  if (!stick || stick.id !== e.pointerId) return;
  const dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
  const d = Math.hypot(dx, dy) || 1;
  const cl = Math.min(1, d / 46);
  stick.dx = dx / d * cl; stick.dy = dy / d * cl;
  // the stick presses the same keys the keyboard does, so both routes
  // run through exactly the same code
  held.a = stick.dx < -0.3; held.d = stick.dx > 0.3;
  held.w = stick.dy < -0.3; held.s = stick.dy > 0.3;
});
function endTouch(e) {
  const t = touches.get(e.pointerId);
  if (t === 'stick') {
    stick = null;
    held.a = held.d = held.w = held.s = false;
  }
  touches.delete(e.pointerId);
}
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
addEventListener('touchstart', () => { touchMode = true; }, { passive: true });

// =====================================================================
// THE GAME LOOP
// =====================================================================
function draw() {
  const S = stage();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (screen !== 'select') nameBox.style.display = 'none';
  if (screen === 'title') drawTitle(S);
  else if (screen === 'select') drawSelect(S);
  else if (screen === 'map') drawMap(S);
  else if (screen === 'shop') drawShop(S);
  else if (screen === 'fight') { drawFight(); if (touchMode) drawPads(S); }
  else if (screen === 'cutscene') drawCutscene(S);
  else if (screen === 'cleared') drawResult(S, true);
  else if (screen === 'dead') drawResult(S, false);
}
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (screen === 'fight') updateFight(dt);
  if (screen === 'cutscene') updateCutscene(dt);
  if (wipeArmed > 0 && screen === 'map') wipeArmed = Math.max(0, wipeArmed - dt);
  else if (screen !== 'map') wipeArmed = 0;
  if (screen === 'cleared' || screen === 'dead') {
    resultTimer += dt;
    for (const p of particles) { p.x += p.vx * dt; p.z += p.vz * dt; p.vz -= 340 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
