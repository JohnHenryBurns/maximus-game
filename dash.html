<!DOCTYPE html>
<html>
<head>

<title>CUBE DASH</title>

<!-- ADD TO HOME SCREEN / CAST TO THE TELLY
     This game has its OWN manifest, so "Add to Home Screen" gives it its own
     icon that opens straight into this game - not the arcade menu. display is
     "fullscreen", so it launches with no browser bar at all, which is also
     what makes it look right mirrored onto a TV. -->
<link rel="manifest" href="dash.webmanifest">
<meta name="theme-color" content="#12102a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cube Dash">
<link rel="icon" href="icon-dash.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-dash.svg">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #12102a; }
  canvas { display: block; touch-action: none; }
</style>

<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
  font-size: 13px !important; font-weight: 600 !important; letter-spacing: 0.3px !important;
  line-height: 1 !important; text-decoration: none !important; text-transform: none !important;
  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;
  background: rgba(40, 22, 44, 0.78) !important;
  color: #fff5e8 !important;
}
a.arcade-pill .ah-arrow { font-size: 14px !important; opacity: 0.9 !important; }
/* the floating version, for games that had nowhere to put it */
a.arcade-pill.arcade-float {
  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;
  z-index: 2147483000 !important;
}
</style>

<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<canvas id="game"></canvas>
<script>
// =====================================================================
// CUBE DASH — you are a cube. you cannot stop. you can only JUMP.
// the level is a rhythm: learn it with your eyes, then play it with
// your thumb. every death teaches the next attempt. GO.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

// ---------------------------------------------------------------------
// FITTING ON A PHONE — a phone screen is narrow AND short. these three
// little helpers are the whole trick: measure first, then draw.
// ---------------------------------------------------------------------

// Break a sentence into lines that actually FIT. We measure each word as
// we add it, and the moment the line gets too wide we start a new one.
function wrapText(text, maxW, font) {
  ctx.font = font;
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Draw wrapped text and tell the caller how tall it turned out.
function drawWrapped(text, cx, y, maxW, font, lineH) {
  const lines = wrapText(text, maxW, font);
  ctx.font = font;
  lines.forEach((ln, i) => ctx.fillText(ln, cx, y + i * lineH));
  return lines.length * lineH;
}

// The Arcade pill floats over the top-left corner as a real HTML link, so
// the canvas has no idea it's there. Ask the browser where its bottom edge
// is and start our own HUD below it — otherwise it sits on top of our words.
// (That exact mistake bit us twice already. Measure, don't assume.)
function pillBottom() {
  const el = document.getElementById('back');
  return el ? Math.ceil(el.getBoundingClientRect().bottom) : 38;
}

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// THE MUSIC — a driving beat built from raw math: kick, hat, bassline.
// scheduled a little ahead of time so it never stutters.
// ---------------------------------------------------------------------
let audio = null;
const BPM = 128;
const BEAT = 60 / BPM;
let nextBeat = 0, beatN = 0, lastBeatAt = 0;
function ensureAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    nextBeat = audio.currentTime + 0.1;
  }
}
function kick(t) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + 0.16);
}
function hat(t) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square';
  o.frequency.value = 7000 + Math.random() * 1500;
  g.gain.setValueAtTime(0.025, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + 0.035);
}
const BASSLINE = [0, 0, 3, 0, 5, 3, 0, -2];   // semitones — moody and driving
function bass(t, step) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.value = 55 * Math.pow(2, BASSLINE[step % 8] / 12);
  g.gain.setValueAtTime(0.11, t);
  g.gain.setValueAtTime(0.11, t + BEAT * 0.4);
  g.gain.exponentialRampToValueAtTime(0.001, t + BEAT * 0.55);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + BEAT * 0.6);
}
function tickMusic() {
  if (!audio) return;
  while (nextBeat < audio.currentTime + 0.15) {
    kick(nextBeat);
    hat(nextBeat + BEAT / 2);
    bass(nextBeat, beatN);
    lastBeatAt = nextBeat;
    nextBeat += BEAT;
    beatN++;
  }
}
function deathSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(400, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, audio.currentTime + 0.3);
  g.gain.setValueAtTime(0.2, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.32);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.35);
}
function winJingle() {
  if (!audio) return;
  [523, 659, 784, 1047, 1319, 1568].forEach((n, i) => {
    const t = audio.currentTime + i * 0.09;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'square';
    o.frequency.value = n;
    g.gain.setValueAtTime(0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + 0.3);
  });
}

// ---------------------------------------------------------------------
// THE LEVEL — one long string. every character is one column (40px):
//   _ ground   ^ spike   # block   2/3 stacked blocks   . pit   P pad
// learn it. it isn't going to change. YOU are.
// ---------------------------------------------------------------------
const LEVELS = [
  { name: 'NEON RUNWAY', diff: 1, speed: 340, str:
    '____________________' +
    '^_______^______^_____' +
    '^____^____^___^___' +
    '____^^______^^_____' +
    '___##_____##_____' +
    '__##___22___##____' +
    '____..____..______' +
    '____O_________' +
    '^__..__^^___##__^___' +
    '____P^^^___________' +
    '__##..##..##__' +
    '____P___3______' +
    '^___^___^___^___^__' +
    '_______^^__..___##______' +
    '____________' },
  { name: 'SPIKE FACTORY', diff: 2, speed: 360, str:
    '____________________' +
    '^_____^^_____^___^^____' +
    '__##____^____##____^_____' +
    '_..___..___^^_____' +
    '__##___22____22___##__' +
    '^____^^____^______' +
    '__O_____o_____O______' +
    '___P^^^_____P^^^______' +
    '__##..##..##..##______' +
    '^^___..___^^___##____' +
    '_____P___3____^____' +
    '^___^^___^___^^____' +
    '____________' },
  { name: 'PRIMAL MADNESS', diff: 3, speed: 385, str:
    '____________________' +
    '^^____^^____^^____^^____' +
    '__##____^___22____^____##___' +
    '_.._____..____^^______' +
    '___P^^^___P^^^___P^^^____' +
    '__##..22..##______' +
    '^^__^^____^^__^^_____' +
    '__O___^^____O______' +
    '____....______' +
    '__o____o______' +
    '____P___3____22____' +
    '^^___^^____^^___..___' +
    '____________' },
];

const COL = 40;
let LEVEL = LEVELS[0].str;
let SPEED = LEVELS[0].speed;
let levelIx = 0;
const GROUND_FRAC = 0.72;      // where the floor sits on screen
const CUBE = 34;
const GRAV = 4200;
const VJUMP = -880;
const VPAD = -1400;

function colInfo(i) {
  const ch = LEVEL[i] || '_';
  return {
    spike: ch === '^',
    pit: ch === '.',
    pad: ch === 'P',
    saw: ch === 'O',        // a spinning blade, half-buried in the ground
    airsaw: ch === 'o',     // a blade floating at jump height. stay LOW.
    // towers go from '#' (one block) up through '9' (a proper skyscraper)
    blocks: ch === '#' ? 1 : (ch >= '2' && ch <= '9') ? +ch : 0,
  };
}
const SAW_R = 34, AIRSAW_R = 28, AIRSAW_H = 100;
let LEVEL_LEN = LEVEL.length * COL;

function selectLevel(i) {
  levelIx = i;
  LEVEL = LEVELS[i].str;
  SPEED = LEVELS[i].speed;
  LEVEL_LEN = LEVEL.length * COL;
  best = parseInt(localStorage.getItem('dash_best_' + i) || '0');
  attempts = 1;
  won = false;
  started = false;
  particles = [];
  respawn();
  screen = 'play';
}

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let px = 0, py = 0, vy = 0;    // cube position (world x, y ABOVE ground)
let onGround = true;
let angle = 0;
let attempts = 1;
let best = 0;
let dead = 0;                  // respawn countdown after death
let won = false;
let started = false;
let holdJump = false;
let justPressed = false;   // a fresh tap this frame (for the DOUBLE jump)
let airJumps = 1;
let particles = [];
let camY = 0;
let elapsed = 0;
let screen = 'menu';           // 'menu' | 'play' | 'build' | 'skins'
let uiRects = [];
let cubeSkin = localStorage.getItem('dash_skin') || 'classic';
let unlockNote = '';           // "SKIN UNLOCKED" flash on the win screen
const SKINS = [
  { id: 'classic', name: 'THE CUBE', how: 'the original. undefeated by fashion.',
    unlocked: () => true },
  { id: 'shiny', name: 'SHINY', how: 'beat SPIKE FACTORY (100%)',
    unlocked: () => parseInt(localStorage.getItem('dash_best_1') || '0') >= 100 },
  { id: 'skull', name: 'SKULL', how: 'beat PRIMAL MADNESS (100%)',
    unlocked: () => parseInt(localStorage.getItem('dash_best_2') || '0') >= 100 },
];

// ---- the LEVEL BUILDER's desk ----
let bLevel = localStorage.getItem('dash_custom') || '_'.repeat(80);
let bSpeed = parseInt(localStorage.getItem('dash_custom_speed') || '340');
let bTool = 'spike';
let bCam = 0;
let bCamY = 0;                 // how far UP you're looking (for tall towers)
const keysHeld = {};
let bPaint = false;
let bPanLast = null;
let bResetUntil = 0;
let bCheck = null;             // the robot inspector's latest report
const bPointers = new Map();

function saveBuild() {
  localStorage.setItem('dash_custom', bLevel);
  localStorage.setItem('dash_custom_speed', String(bSpeed));
}

function playCustom() {
  LEVELS[3] = { name: 'YOUR LEVEL', diff: 0, speed: bSpeed,
                str: bLevel + '________' };
  selectLevel(3);
}

// ---------------------------------------------------------------------
// THE ROBOT INSPECTOR — the same robot that certified my levels,
// now living in the page, ready to certify YOURS. it uses the same
// physics numbers as the real game, so its verdict is the truth.
// ---------------------------------------------------------------------
function simulate(str, speed) {
  const L = str + '________';
  const info = i => L[i] || '_';
  const gTop = x => {
    const ch = info(Math.floor(x / COL));
    if (ch === '.') return -999;
    return (ch === '#' ? 1 : (ch >= '2' && ch <= '9') ? +ch : 0) * COL;
  };
  let sx = 0, sy = 0, svy = 0, sOn = true, sAir = 1;
  let sAttempts = 1;
  const deaths = {};
  const lenPx = L.length * COL;
  let frames = 0, maxPct = 0, sWon = false;
  const dt = 1 / 60;
  while (!sWon && frames < 60 * 300) {
    // ---- the robot's trained instincts ----
    let jump = false;
    if (sOn) {
      const c1 = info(Math.floor((sx + 40) / 40));
      if (c1 === '^' || c1 === '.' || c1 === 'O') jump = true;
      for (let d = 1; d <= 2 && !jump; d++) {
        const ch = info(Math.floor((sx + d * 40) / 40));
        const h = ch === '#' ? 1 : (ch >= '2' && ch <= '9') ? +ch : 0;
        if (h * 40 > sy + 2) jump = true;
      }
    }
    if (info(Math.floor(sx / 40)) === 'P' ||
        info(Math.floor((sx + 40) / 40)) === 'P') jump = false;
    for (let d = 0; d <= 2; d++) {
      if (info(Math.floor((sx + d * 40) / 40)) === 'o') jump = false;
    }
    let airJump = false;
    if (!sOn && svy > 0 && sAir > 0 && sy < 30 &&
        info(Math.floor((sx + 30) / 40)) === '.') airJump = true;

    // ---- the game's exact physics, mirrored ----
    let died = false;
    sx += speed * dt;
    const sup = Math.max(gTop(sx - CUBE * 0.35), gTop(sx + CUBE * 0.35));
    if (sOn && jump) { svy = VJUMP; sOn = false; sAir = 1; }
    else if (!sOn && airJump) { svy = VJUMP * 0.92; sAir--; }
    if (!sOn) {
      svy += GRAV * dt;
      sy -= svy * dt;
      if (sy <= sup && svy > 0) {
        if (sup < -100) { if (sy < -60) died = true; }
        else if (sup - sy > 26) died = true;
        else { sy = sup; sOn = true; svy = 0; sAir = 1; }
      }
    } else {
      if (sup < sy - 2) { sOn = false; svy = 0; }
      else if (sup > sy + 2) died = true;
    }
    if (sy < -60) died = true;
    if (!died) {
      const c0 = Math.floor((sx - CUBE * 0.3) / COL);
      const c1 = Math.floor((sx + CUBE * 0.3) / COL);
      for (let c = c0; c <= c1 && !died; c++) {
        if (info(c) === '^' && sy < COL * 0.62) died = true;
        if (info(c) === 'P' && sy < COL * 0.5 && svy >= 0) {
          svy = VPAD; sOn = false; sAir = 1;
        }
      }
      const s0 = Math.floor((sx - 70) / COL);
      const s1 = Math.floor((sx + 70) / COL);
      for (let c = s0; c <= s1 && !died; c++) {
        if (info(c) === 'O' &&
            Math.hypot(sx - (c * COL + COL / 2), (sy + CUBE / 2) - 18) < SAW_R + CUBE * 0.42) died = true;
        if (info(c) === 'o' &&
            Math.hypot(sx - (c * COL + COL / 2), (sy + CUBE / 2) - AIRSAW_H) < AIRSAW_R + CUBE * 0.42) died = true;
      }
    }
    maxPct = Math.max(maxPct, Math.round(sx / (lenPx - 240) * 100));
    if (died) {
      const col = Math.floor(sx / COL);
      deaths[col] = (deaths[col] || 0) + 1;
      sAttempts++;
      if (deaths[col] >= 20) break;      // hopeless — report it
      sx = 0; sy = 0; svy = 0; sOn = true; sAir = 1;
    }
    if (sx >= lenPx - COL * 6) sWon = true;
    frames++;
  }
  let worstCol = -1, worstN = 0;
  for (const [c, n] of Object.entries(deaths)) {
    if (n > worstN) { worstN = n; worstCol = parseInt(c); }
  }
  return { won: sWon, attempts: sAttempts, maxPct: Math.min(100, maxPct), worstCol };
}

function respawn() {
  px = 0; py = 0; vy = 0;
  onGround = true;
  angle = 0;
  dead = 0;
}

// ---------------------------------------------------------------------
// INPUT — one button. that's the entire deal.
// ---------------------------------------------------------------------
function uiAction(id) {
  if (id === 'menu') { screen = 'menu'; return; }
  if (id.startsWith('lv_')) { selectLevel(parseInt(id.slice(3))); return; }
  if (id === 'build') { screen = 'build'; bCheck = null; return; }
  if (id === 'playc') { playCustom(); return; }
  if (id === 'skins') { screen = 'skins'; return; }
  if (id.startsWith('sk_')) {
    const sk = SKINS.find(s => s.id === id.slice(3));
    if (sk && sk.unlocked()) {
      cubeSkin = sk.id;
      localStorage.setItem('dash_skin', cubeSkin);
      winJingle();
    }
    return;
  }
  if (id.startsWith('bt_')) { bTool = id.slice(3); return; }
  if (id === 'btest') { saveBuild(); playCustom(); return; }
  if (id === 'bcheck') {
    saveBuild();
    bCheck = simulate(bLevel, bSpeed);
    if (bCheck.won) winJingle();
    return;
  }
  if (id === 'bspeed') {
    bSpeed = bSpeed === 340 ? 360 : bSpeed === 360 ? 385 : 340;
    saveBuild();
    return;
  }
  if (id === 'blenplus') { bLevel += '_'.repeat(20); saveBuild(); return; }
  if (id === 'blenminus') {
    if (bLevel.length > 60) bLevel = bLevel.slice(0, -20);
    saveBuild();
    return;
  }
  if (id === 'breset') {
    if (performance.now() < bResetUntil) {
      bLevel = '_'.repeat(80);
      bCheck = null;
      saveBuild();
      bResetUntil = 0;
    } else bResetUntil = performance.now() + 3000;
    return;
  }
}

const TOOLCHARS = { spike: '^', pit: '.', pad: 'P',
                    saw: 'O', airsaw: 'o', erase: '_' };
let bLastCol = -1;             // one action per column per stroke
function bSetCol(i) {
  if (i < 0 || i >= bLevel.length || i === bLastCol) return;
  bLastCol = i;
  let ch;
  if (bTool === 'block') {
    // the stacker: every tap on a column raises its tower by one
    const cur = bLevel[i];
    const h = cur === '#' ? 1 : (cur >= '2' && cur <= '9') ? +cur : 0;
    const next = Math.min(9, h + 1);
    ch = next === 1 ? '#' : String(next);
  } else {
    ch = TOOLCHARS[bTool];
    if (ch === undefined) return;
  }
  bLevel = bLevel.slice(0, i) + ch + bLevel.slice(i + 1);
  bCheck = null;                 // the old verdict died with the old level
  saveBuild();
}

addEventListener('pointerdown', e => {
  ensureAudio();
  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) { uiAction(r.id); return; }
  }
  if (screen === 'build') {
    bPointers.set(e.pointerId, e.clientX);
    if (bPointers.size >= 2 || bTool === 'pan' || e.button === 2) {
      bPaint = false;
      bPanLast = { x: e.clientX, y: e.clientY };
      return;
    }
    bPaint = true;
    bLastCol = -1;
    bSetCol(Math.floor((e.clientX + bCam) / COL));
    return;
  }
  if (screen === 'menu' || screen === 'skins') return;
  if (won) { screen = 'menu'; return; }
  started = true;
  holdJump = true;
  justPressed = true;
});
addEventListener('pointermove', e => {
  if (screen !== 'build') return;
  if (bPointers.has(e.pointerId)) bPointers.set(e.pointerId, e.clientX);
  if (bPanLast !== null) {
    bCam -= e.clientX - bPanLast.x;
    bCamY += e.clientY - bPanLast.y;
    bCam = Math.max(0, Math.min(bLevel.length * COL - canvas.width + 100, bCam));
    bCamY = Math.max(0, Math.min(400, bCamY));
    bPanLast = { x: e.clientX, y: e.clientY };
  } else if (bPaint) {
    bSetCol(Math.floor((e.clientX + bCam) / COL));
  }
});
addEventListener('pointerup', e => {
  holdJump = false;
  bPointers.delete(e.pointerId);
  bPaint = false;
  bPanLast = null;
});
addEventListener('wheel', e => {
  if (screen !== 'build') return;
  e.preventDefault();
  bCam += e.deltaY * 0.9 + e.deltaX;
  bCam = Math.max(0, Math.min(bLevel.length * COL - canvas.width + 100, bCam));
}, { passive: false });
addEventListener('contextmenu', e => { if (screen === 'build') e.preventDefault(); });
addEventListener('keydown', e => {
  keysHeld[e.key] = true;
  if (screen === 'menu') {
    const n = parseInt(e.key) - 1;
    if (n >= 0 && n < LEVELS.length) { ensureAudio(); selectLevel(n); }
    return;
  }
  if (e.key === 'Escape') { screen = 'menu'; return; }
  if (screen !== 'play') return;         // arrows steer the BUILDER's eye
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
    ensureAudio();
    if (won) { screen = 'menu'; return; }
    started = true;
    if (!holdJump) justPressed = true;   // key-repeat doesn't count
    holdJump = true;
  }
});
addEventListener('keyup', e => {
  keysHeld[e.key] = false;
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') holdJump = false;
});

// ---------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------
function groundTopAt(x) {
  // the height of whatever you can stand on at world-x (0 = flat ground)
  const info = colInfo(Math.floor(x / COL));
  if (info.pit) return -999;             // nothing to stand on. nothing at all.
  return info.blocks * COL;
}

function die() {
  dead = 0.7;
  attempts++;
  deathSound();
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 380;
    particles.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
                     life: 0.5 + Math.random() * 0.4 });
  }
}

function update(dt) {
  elapsed += dt;
  tickMusic();
  if (screen !== 'play' || won || !started) return;
  if (dead > 0) {
    dead -= dt;
    if (dead <= 0) respawn();
    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    return;
  }

  px += SPEED * dt;

  // what's under (and ahead of) the cube right now?
  const support = Math.max(groundTopAt(px - CUBE * 0.35), groundTopAt(px + CUBE * 0.35));

  // jumping: hold the button and the cube leaps every time it lands.
  // and once per flight, a fresh TAP buys you a second jump in midair.
  if (onGround && holdJump) {
    vy = VJUMP;
    onGround = false;
    airJumps = 1;
  } else if (!onGround && justPressed && airJumps > 0) {
    vy = VJUMP * 0.92;
    airJumps--;
    if (audio) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(500, audio.currentTime);
      o.frequency.exponentialRampToValueAtTime(900, audio.currentTime + 0.1);
      g.gain.setValueAtTime(0.1, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.12);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 0.14);
    }
    for (let i = 0; i < 10; i++) {
      const a = Math.PI + (i / 9) * Math.PI;          // a burst beneath you
      particles.push({ x: px + Math.cos(a) * 14, y: py + Math.sin(a) * 8,
                       vx: Math.cos(a) * 120, vy: Math.sin(a) * 60 - 40,
                       life: 0.3 });
    }
  }
  justPressed = false;

  if (!onGround) {
    vy += GRAV * dt;
    py -= vy * dt;                       // py is height ABOVE the ground line
    angle += (Math.PI / 0.42) * dt;      // one clean flip per jump arc
    if (py <= support && vy > 0) {
      if (support < -100) {
        // there is no floor here. there is only regret.
        if (py < -60) { die(); return; }
      } else if (support - py > 26) {
        // that's not a landing, that's a WALL. geometry wins.
        die();
        return;
      } else {
        py = support;
        onGround = true;
        vy = 0;
        airJumps = 1;                    // feet down: the double jump reloads
        angle = Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
      }
    }
  } else {
    // walked off an edge (or the floor became a pit / rose into a wall)
    if (support < py - 2) {
      onGround = false;
      vy = 0;
    } else if (support > py + 2) {
      die();                             // face, meet block side
      return;
    }
  }
  if (py < -60) { die(); return; }

  // spinning blades: their kill circle reaches past their own column
  const s0 = Math.floor((px - 70) / COL);
  const s1 = Math.floor((px + 70) / COL);
  for (let c = s0; c <= s1; c++) {
    const info = colInfo(c);
    if (info.saw) {
      const d = Math.hypot(px - (c * COL + COL / 2), (py + CUBE / 2) - 18);
      if (d < SAW_R + CUBE * 0.42) { die(); return; }
    }
    if (info.airsaw) {
      const d = Math.hypot(px - (c * COL + COL / 2), (py + CUBE / 2) - AIRSAW_H);
      if (d < AIRSAW_R + CUBE * 0.42) { die(); return; }
    }
  }

  // spikes: the pointy tax on bad timing
  const c0 = Math.floor((px - CUBE * 0.3) / COL);
  const c1 = Math.floor((px + CUBE * 0.3) / COL);
  for (let c = c0; c <= c1; c++) {
    const info = colInfo(c);
    if (info.spike) {
      const spikeBase = 0;
      if (py < spikeBase + COL * 0.62) { die(); return; }
    }
    if (info.pad && py < COL * 0.5 && vy >= 0) {
      vy = VPAD;
      onGround = false;
      if (audio) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(300, audio.currentTime);
        o.frequency.exponentialRampToValueAtTime(900, audio.currentTime + 0.15);
        g.gain.setValueAtTime(0.15, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.18);
        o.connect(g); g.connect(audio.destination);
        o.start(); o.stop(audio.currentTime + 0.2);
      }
    }
  }

  // the trail — proof of speed
  if (Math.random() < 0.6) {
    particles.push({ x: px - CUBE / 2, y: py + Math.random() * CUBE * 0.5,
                     vx: -60 - Math.random() * 60, vy: (Math.random() - 0.5) * 60,
                     life: 0.35 });
  }
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // finish line
  if (px >= LEVEL_LEN - COL * 6) {
    won = true;
    const wasDone = best >= 100;
    best = 100;
    localStorage.setItem('dash_best_' + levelIx, '100');
    unlockNote = '';
    if (!wasDone && levelIx === 1) unlockNote = '✨ SHINY SKIN UNLOCKED!!';
    if (!wasDone && levelIx === 2) unlockNote = '💀 SKULL SKIN UNLOCKED!!';
    winJingle();
  }
  const pct = Math.min(100, Math.round(px / (LEVEL_LEN - COL * 6) * 100));
  if (pct > best) {
    best = pct;
    localStorage.setItem('dash_best_' + levelIx, String(best));
  }

  camY += ((py > 100 ? py - 100 : 0) - camY) * Math.min(1, dt * 6);
}

// ---------------------------------------------------------------------
// DRAWING — neon, glow, and a background that pumps with the beat
// ---------------------------------------------------------------------
// a sawblade that means it: dark disc, whirling teeth, center bolt
function drawSaw(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(elapsed * 9 * (cx % 80 < 40 ? 1 : -1));
  ctx.fillStyle = '#6a7080';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.18) * r * 0.72, Math.sin(a - 0.18) * r * 0.72);
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a + 0.22) * r * 0.72, Math.sin(a + 0.22) * r * 0.72);
    ctx.fill();
  }
  ctx.fillStyle = '#8a92a4';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#4a5060';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c8ccd8';
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMenu(W, H) {
  uiRects = [];
  const beatPulse = audio ? Math.max(0, 1 - (audio.currentTime - lastBeatAt) / BEAT) : 0;
  const hue = (elapsed * 12) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue}, 55%, ${10 + beatPulse * 5}%)`);
  g.addColorStop(1, `hsl(${(hue + 60) % 360}, 60%, ${16 + beatPulse * 6}%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // ---- work out the layout from the room we ACTUALLY have ----
  // Fixed fractions of the height (0.44 and friends) looked fine on a laptop
  // and shoved the buttons off the bottom of a phone held sideways. So:
  // measure the space, then decide how big the cards get.
  const top = pillBottom() + 10;
  const avail = H - top - 14;
  const headH = Math.max(78, Math.min(160, avail * 0.30));   // mascot + title
  const doorH = Math.max(42, Math.min(52, avail * 0.11));
  const gap = Math.max(7, Math.min(16, avail * 0.022));
  // whatever is left over gets shared between the three level cards
  const cardH = Math.max(40, Math.min(74, (avail - headH - doorH - gap * 4) / 3));
  const stackH = headH + cardH * 3 + gap * 4 + doorH;
  const y0 = top + Math.max(0, (avail - stackH) / 2);        // centre the lot

  // the mascot cube, bouncing to the beat, wearing YOUR equipped skin.
  // it gets the top quarter of the header, the title the middle, the
  // little subtitle the bottom — so they never sit on top of each other.
  const cubeR = Math.min(44, headH * 0.30);
  ctx.save();
  ctx.translate(W / 2, y0 + headH * 0.24 - beatPulse * 12);
  ctx.rotate(elapsed * 1.2);
  drawCube(cubeR, hue, false);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${Math.min(52, W / 11, headH * 0.34)}px monospace`;
  ctx.fillText('CUBE DASH', W / 2, y0 + headH * 0.78);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = `${Math.min(15, W / 27)}px monospace`;
  ctx.fillText(W < 460 ? 'pick your level — sound ON' : 'pick your level — sound ON, thumbs ready',
               W / 2, y0 + headH - 4);

  const bw = Math.min(W - 32, 400);
  const x = W / 2 - bw / 2;

  LEVELS.forEach((L, i) => {
    if (i > 2) return;                   // the custom slot has its own door
    const y = y0 + headH + i * (cardH + gap);
    uiRects.push({ x, y, w: bw, h: cardH, id: 'lv_' + i });
    const lb = parseInt(localStorage.getItem('dash_best_' + i) || '0');
    ctx.fillStyle = `hsla(${(hue + 180) % 360}, 60%, 50%, ${0.12 + beatPulse * 0.05})`;
    ctx.fillRect(x, y, bw, cardH);
    ctx.strokeStyle = lb >= 100 ? '#7ddf8f' : `hsl(${(hue + 180) % 360}, 90%, 65%)`;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, bw, cardH);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    // the card can shrink, so the writing inside shrinks with it
    ctx.font = `bold ${Math.min(20, cardH * 0.27, (bw - 130) / 8)}px monospace`;
    ctx.fillText((i + 1) + '. ' + L.name, x + 14, y + cardH * 0.44);
    ctx.fillStyle = L.diff >= 3 ? '#ff5a4a' : '#ffd23f';
    ctx.font = `${Math.min(15, cardH * 0.21)}px monospace`;
    // the final level doesn't get stars. it gets SKULLS.
    ctx.fillText(L.diff >= 3 ? '💀💀💀' : '★'.repeat(L.diff) + '☆'.repeat(3 - L.diff),
                 x + 14, y + cardH * 0.78);
    ctx.textAlign = 'right';
    ctx.fillStyle = lb >= 100 ? '#7ddf8f' : 'rgba(255,255,255,0.65)';
    ctx.font = `bold ${Math.min(17, cardH * 0.23)}px monospace`;
    ctx.fillText(lb >= 100 ? 'DONE ✓' : 'best ' + lb + '%', x + bw - 14, y + cardH * 0.6);
    ctx.textAlign = 'center';
  });

  // three doors: your creation, the workshop, and the wardrobe
  {
    const dy = y0 + headH + 3 * (cardH + gap);
    const third = bw / 3 - 6;
    const doors = [['playc', '▶ YOURS'], ['build', '🔨 BUILD'], ['skins', '👕 SKINS']];
    doors.forEach(([id, label], i) => {
      const dx = x + i * (third + 9);
      uiRects.push({ x: dx, y: dy, w: third, h: doorH, id });
      ctx.strokeStyle = '#ffd23f';
      ctx.lineWidth = 2;
      ctx.strokeRect(dx, dy, third, doorH);
      ctx.fillStyle = '#ffd23f';
      ctx.font = `bold ${Math.min(15, third / 6)}px monospace`;
      ctx.fillText(label, dx + third / 2, dy + doorH / 2 + 5);
    });
  }
}

function drawBuild(W, H) {
  uiRects = [];
  // the arrow keys are your neck: look left, right, and UP your towers
  if (keysHeld['ArrowLeft']) bCam -= 14;
  if (keysHeld['ArrowRight']) bCam += 14;
  if (keysHeld['ArrowUp']) bCamY += 10;
  if (keysHeld['ArrowDown']) bCamY -= 10;
  bCam = Math.max(0, Math.min(bLevel.length * COL - W + 100, bCam));
  bCamY = Math.max(0, Math.min(400, bCamY));

  ctx.fillStyle = '#161226';
  ctx.fillRect(0, 0, W, H);
  const groundY = H * 0.62;

  ctx.save();
  ctx.translate(-bCam, bCamY);
  // column grid + contents
  const c0 = Math.max(0, Math.floor(bCam / COL));
  const c1 = Math.min(bLevel.length - 1, Math.floor((bCam + W) / COL) + 1);
  for (let c = c0; c <= c1; c++) {
    const x = c * COL;
    const ch = bLevel[c];
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, -400);
    ctx.lineTo(x, H);
    ctx.stroke();
    if (ch !== '.') {
      ctx.fillStyle = '#242038';
      ctx.fillRect(x, groundY, COL + 1, H - groundY);
      ctx.fillStyle = 'rgba(125, 211, 255, 0.8)';
      ctx.fillRect(x, groundY - 2, COL + 1, 3);
    }
    const blocks = ch === '#' ? 1 : (ch >= '2' && ch <= '9') ? +ch : 0;
    for (let b = 0; b < blocks; b++) {
      ctx.fillStyle = '#2c2846';
      ctx.fillRect(x + 1, groundY - (b + 1) * COL, COL - 2, COL - 1);
      ctx.strokeStyle = 'rgba(125, 211, 255, 0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 2, groundY - (b + 1) * COL + 1, COL - 4, COL - 3);
    }
    if (ch === '^') {
      ctx.fillStyle = '#ff5a8f';
      ctx.beginPath();
      ctx.moveTo(x + 2, groundY);
      ctx.lineTo(x + COL / 2, groundY - COL * 0.95);
      ctx.lineTo(x + COL - 2, groundY);
      ctx.fill();
    }
    if (ch === 'P') {
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.ellipse(x + COL / 2, groundY - 4, COL * 0.42, 7, 0, Math.PI, 0);
      ctx.fill();
    }
    if (ch === 'O') drawSaw(x + COL / 2, groundY - 18, SAW_R);
    if (ch === 'o') drawSaw(x + COL / 2, groundY - AIRSAW_H, AIRSAW_R);
    // the robot's accusing arrow
    if (bCheck && !bCheck.won && bCheck.worstCol === c) {
      ctx.fillStyle = '#ff5a4a';
      ctx.font = 'bold 26px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('▼', x + COL / 2, groundY - 150 - Math.sin(elapsed * 5) * 8);
      ctx.textAlign = 'left';
    }
  }
  // the finish gate, right where TEST will put it
  ctx.strokeStyle = '#7ddf8f';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo((bLevel.length + 2) * COL, groundY);
  ctx.lineTo((bLevel.length + 2) * COL, groundY - 160);
  ctx.stroke();
  ctx.restore();

  // ---- toolbar (measured, grows to fit) ----
  // On a phone the long labels wrapped the toolbar onto four fat rows and
  // ate the level. So each button knows a short name for a narrow screen.
  const narrow = W < 560;
  const TOOLS = [
    ['bt_spike', '▲ SPIKE'], ['bt_block', narrow ? '□+ BLOCK' : '□+ BLOCK (tap = +1)'],
    ['bt_pit', '⬛ PIT'], ['bt_pad', '● PAD'],
    ['bt_saw', '⚙ SAW'], ['bt_airsaw', narrow ? '⚙ AIR' : '⚙ AIR SAW'],
    ['bt_erase', narrow ? '✖ RUB' : '✖ ERASE'],
    ['bt_pan', '✋ PAN'],
    ['btest', '▶ TEST'], ['bcheck', '🤖 CHECK'],
    ['bspeed', '⚡ ' + bSpeed],
    ['blenplus', '+20'], ['blenminus', '-20'],
    ['menu', 'MENU'],
    ['breset', performance.now() < bResetUntil ? 'REALLY?' : 'RESET'],
  ];
  const btnH = narrow ? 30 : 34;
  const fs = narrow ? 11 : 12;
  const places = [];
  // the Arcade pill floats over the top-left corner, so the toolbar starts
  // underneath it rather than hiding behind it
  let bx = 8, by = pillBottom() + 6;
  for (const [id, label] of TOOLS) {
    const bw = Math.max(narrow ? 46 : 56, label.length * (fs * 0.72) + 16);
    if (bx + bw > W - 8) { bx = 8; by += btnH + 6; }
    places.push({ id, label, x: bx, y: by, w: bw });
    bx += bw + 6;
  }
  const barH = by + btnH + 8;
  ctx.fillStyle = 'rgba(8, 6, 18, 0.85)';
  ctx.fillRect(0, 0, W, barH);
  for (const p of places) {
    uiRects.push({ x: p.x, y: p.y, w: p.w, h: btnH, id: p.id });
    const active = p.id === 'bt_' + bTool;
    const danger = p.id === 'breset' && performance.now() < bResetUntil;
    ctx.fillStyle = danger ? 'rgba(232, 69, 60, 0.35)'
                  : p.id === 'btest' ? 'rgba(125, 223, 143, 0.18)'
                  : p.id === 'bcheck' ? 'rgba(255, 210, 63, 0.15)'
                  : active ? 'rgba(125, 211, 255, 0.25)' : 'rgba(255,255,255,0.06)';
    ctx.fillRect(p.x, p.y, p.w, btnH);
    ctx.strokeStyle = danger ? '#e8453c' : p.id === 'btest' ? '#7ddf8f'
                    : p.id === 'bcheck' ? '#ffd23f'
                    : active ? '#7dd3ff' : '#4a4468';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, btnH);
    ctx.fillStyle = danger ? '#ff9f97' : p.id === 'btest' ? '#7ddf8f'
                  : p.id === 'bcheck' ? '#ffd23f'
                  : active ? '#7dd3ff' : '#b8b4c8';
    ctx.font = `bold ${fs}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(p.label, p.x + p.w / 2, p.y + btnH / 2 + fs * 0.36);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  const hint = narrow
    ? 'tap/drag to place — swipe to pan — ' + bLevel.length + ' columns'
    : 'tap/drag to place — ARROW KEYS look around (up for towers!) — ' +
      'scroll/swipe pans — ' + bLevel.length + ' columns';
  drawWrapped(hint, 10, barH + 16, W - 20, '12px monospace', 15);

  // the inspector's report — wrapped, and sitting on its own dark strip so
  // it stays readable no matter what's drawn behind it
  if (bCheck) {
    const msg = bCheck.won
      ? '🤖 BEATABLE! the robot cleared it (' + bCheck.attempts +
        ' attempt' + (bCheck.attempts === 1 ? '' : 's') + ')'
      : '🤖 the robot DIED every time at the red arrow (reached ' +
        bCheck.maxPct + '%) — fix that spot!';
    const font = `bold ${Math.min(16, W / 26)}px monospace`;
    const lines = wrapText(msg, W - 28, font);
    const boxH = lines.length * 21 + 14;
    ctx.fillStyle = 'rgba(8, 6, 18, 0.85)';
    ctx.fillRect(0, H - boxH - 8, W, boxH + 8);
    ctx.textAlign = 'center';
    ctx.fillStyle = bCheck.won ? '#7ddf8f' : '#ff5a4a';
    ctx.font = font;
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H - boxH + 8 + i * 21));
    ctx.textAlign = 'left';
  }
}

// draws the cube centered at (0,0), sized s, wearing whatever skin is equipped.
// withGlow=false for menu previews (gradients are pricey to spam).
function drawCube(s, hue, withGlow, skinId) {
  const skin = skinId || cubeSkin;
  if (withGlow) {
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, s * 1.4);
    glow.addColorStop(0, skin === 'shiny' ? 'rgba(255, 210, 63, 0.55)' :
                         skin === 'skull' ? 'rgba(255, 60, 30, 0.5)' :
                         `hsla(${(hue + 180) % 360}, 95%, 65%, 0.5)`);
    glow.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-s * 1.4, -s * 1.4, s * 2.8, s * 2.8);
  }
  const u = s / 34;                       // everything scales off the real cube size
  if (skin === 'shiny') {
    // solid gold. blindingly rich. spike factory's trophy.
    ctx.fillStyle = '#e8b820';
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(-s / 2, -s / 2, s, s * 0.45);
    ctx.strokeStyle = '#fff6d0';
    ctx.lineWidth = 3 * u;
    ctx.strokeRect(-s / 2 + 2 * u, -s / 2 + 2 * u, s - 4 * u, s - 4 * u);
    // the glint: a bright diagonal streak that sweeps across forever
    const gp = (elapsed * 1.4) % 2 - 0.5;    // -0.5 → 1.5, then wraps
    ctx.save();
    ctx.beginPath();
    ctx.rect(-s / 2, -s / 2, s, s);
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 5 * u;
    ctx.beginPath();
    ctx.moveTo(-s / 2 + gp * s * 1.6, s / 2 + 6 * u);
    ctx.lineTo(-s / 2 + gp * s * 1.6 + s * 0.5, -s / 2 - 6 * u);
    ctx.stroke();
    ctx.restore();
    // smug rich-cube face
    ctx.fillStyle = '#5a4200';
    ctx.fillRect(-9 * u, -8 * u, 6 * u, 9 * u);
    ctx.fillRect(3 * u, -8 * u, 6 * u, 9 * u);
    ctx.fillRect(-6 * u, 6 * u, 12 * u, 3 * u);
  } else if (skin === 'skull') {
    // bone-white and grinning. primal madness left its mark.
    ctx.fillStyle = '#ede5d0';
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = '#1a1420';
    ctx.lineWidth = 3 * u;
    ctx.strokeRect(-s / 2 + 2 * u, -s / 2 + 2 * u, s - 4 * u, s - 4 * u);
    // hollow eye sockets with little burning coals inside
    ctx.fillStyle = '#1a1420';
    ctx.beginPath();
    ctx.arc(-7 * u, -4 * u, 5.5 * u, 0, Math.PI * 2);
    ctx.arc(7 * u, -4 * u, 5.5 * u, 0, Math.PI * 2);
    ctx.fill();
    const ember = 0.6 + Math.sin(elapsed * 8) * 0.4;
    ctx.fillStyle = `rgba(255, 60, 30, ${ember})`;
    ctx.beginPath();
    ctx.arc(-7 * u, -4 * u, 2 * u, 0, Math.PI * 2);
    ctx.arc(7 * u, -4 * u, 2 * u, 0, Math.PI * 2);
    ctx.fill();
    // nose hole + a proper row of teeth
    ctx.fillStyle = '#1a1420';
    ctx.beginPath();
    ctx.moveTo(0, 1 * u);
    ctx.lineTo(-2.5 * u, 5 * u);
    ctx.lineTo(2.5 * u, 5 * u);
    ctx.fill();
    ctx.fillRect(-9 * u, 8 * u, 18 * u, 2 * u);
    for (let t = -9; t <= 6; t += 3.75) {
      ctx.fillRect(t * u, 8 * u, 1 * u, 6 * u);
    }
  } else {
    // the classic: neon, determined, forever young
    ctx.fillStyle = `hsl(${(hue + 180) % 360}, 90%, 60%)`;
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3 * u;
    ctx.strokeRect(-s / 2 + 2 * u, -s / 2 + 2 * u, s - 4 * u, s - 4 * u);
    ctx.fillStyle = '#12102a';
    ctx.fillRect(-9 * u, -8 * u, 6 * u, 9 * u);
    ctx.fillRect(3 * u, -8 * u, 6 * u, 9 * u);
    ctx.fillRect(-6 * u, 6 * u, 12 * u, 3 * u);
  }
}

function drawSkins(W, H) {
  uiRects = [];
  ctx.fillStyle = '#12102a';
  ctx.fillRect(0, 0, W, H);
  // same idea as the level menu: measure the room, then size the cards
  const top = pillBottom() + 10;
  const avail = H - top - 14;
  const headH = Math.max(52, Math.min(84, avail * 0.16));
  const gap = Math.max(6, Math.min(16, avail * 0.02));
  const backH = 40;
  const cardH = Math.max(56, Math.min(84,
    (avail - headH - backH - gap * (SKINS.length + 1)) / SKINS.length));
  const y00 = top;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd23f';
  ctx.font = `bold ${Math.min(42, W / 10, headH * 0.55)}px monospace`;
  ctx.fillText('SKINS', W / 2, y00 + headH * 0.55);
  ctx.font = `${Math.min(14, W / 29)}px monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(W < 460 ? 'beat levels to earn them' : 'beat levels to earn them — tap to wear',
               W / 2, y00 + headH * 0.55 + 22);

  const cw = Math.min(W - 24, 460);
  const x0 = W / 2 - cw / 2;
  const podium = Math.min(52, cardH * 0.62);       // the spinning model's box
  SKINS.forEach((sk, i) => {
    const y0 = y00 + headH + i * (cardH + gap);
    const open = sk.unlocked();
    const worn = cubeSkin === sk.id;
    if (open) uiRects.push({ x: x0, y: y0, w: cw, h: cardH, id: 'sk_' + sk.id });
    ctx.fillStyle = worn ? 'rgba(255, 210, 63, 0.12)' : 'rgba(255,255,255,0.04)';
    ctx.fillRect(x0, y0, cw, cardH);
    ctx.strokeStyle = worn ? '#ffd23f' : open ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = worn ? 3 : 2;
    ctx.strokeRect(x0, y0, cw, cardH);
    // the model, spinning slowly on its podium
    ctx.save();
    ctx.translate(x0 + 12 + podium / 2, y0 + cardH / 2);
    ctx.rotate(Math.sin(elapsed * 1.2 + i) * 0.25);
    if (open) {
      drawCube(podium * 0.88, (elapsed * 12) % 360, false, sk.id);
    } else {
      const r = podium * 0.44;
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-r, -r, r * 2, r * 2);
      ctx.font = `${Math.round(r)}px monospace`;
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('🔒', 0, r * 0.4);
    }
    ctx.restore();
    // the writing gets whatever room is left AFTER the podium — and it wraps
    const tx = x0 + podium + 24;
    const tw = x0 + cw - 12 - tx;
    ctx.textAlign = 'left';
    ctx.font = `bold ${Math.min(19, tw / 11)}px monospace`;
    ctx.fillStyle = open ? '#fff' : 'rgba(255,255,255,0.35)';
    ctx.fillText(sk.name + (worn ? '  ◀ wearing' : ''), tx, y0 + cardH * 0.4);
    ctx.fillStyle = open ? 'rgba(125, 223, 143, 0.9)' : 'rgba(255,255,255,0.4)';
    drawWrapped(open ? (i === 0 ? sk.how : '✓ earned! ' + sk.how) : '🔒 ' + sk.how,
                tx, y0 + cardH * 0.62, tw, '12px monospace', 15);
    ctx.textAlign = 'center';
  });

  const by = y00 + headH + SKINS.length * (cardH + gap);
  uiRects.push({ x: W / 2 - 70, y: by, w: 140, h: backH, id: 'menu' });
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(W / 2 - 70, by, 140, backH);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('◀ BACK', W / 2, by + 25);
  ctx.textAlign = 'left';
}

function draw() {
  const W = canvas.width, H = canvas.height;
  if (screen === 'menu') { drawMenu(W, H); return; }
  if (screen === 'build') { drawBuild(W, H); return; }
  if (screen === 'skins') { drawSkins(W, H); return; }
  uiRects = [];
  const groundY = H * GROUND_FRAC + camY;
  const beatPulse = audio ? Math.max(0, 1 - (audio.currentTime - lastBeatAt) / BEAT) : 0;

  // the sky: deep neon, breathing with the music
  const hue = (elapsed * 12) % 360;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue}, 55%, ${10 + beatPulse * 5}%)`);
  g.addColorStop(1, `hsl(${(hue + 60) % 360}, 60%, ${16 + beatPulse * 6}%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // parallax deco: floating outline shapes drifting by
  ctx.strokeStyle = `hsla(${(hue + 180) % 360}, 80%, 60%, 0.12)`;
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const sx = ((i * 460 - px * 0.3) % (460 * 8) + 460 * 8) % (460 * 8) - 200;
    const sy = 80 + (i * 97) % Math.max(120, H * 0.4);
    const r = 30 + (i * 37) % 60;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(elapsed * 0.3 + i);
    ctx.strokeRect(-r / 2, -r / 2, r, r);
    ctx.restore();
  }

  const camX = px - W * 0.3;

  // the ground line and everything bolted to it
  ctx.save();
  ctx.translate(-camX, 0);

  // ground fill (skipping the pits)
  const cStart = Math.floor(camX / COL) - 1;
  const cEnd = Math.floor((camX + W) / COL) + 1;
  for (let c = cStart; c <= cEnd; c++) {
    const info = colInfo(c);
    const x = c * COL;
    if (!info.pit) {
      ctx.fillStyle = `hsl(${(hue + 200) % 360}, 45%, ${18 + beatPulse * 4}%)`;
      ctx.fillRect(x, groundY, COL + 1, H - groundY);
      ctx.fillStyle = `hsla(${(hue + 180) % 360}, 90%, 65%, 0.9)`;
      ctx.fillRect(x, groundY - 2, COL + 1, 3);
    }
    // blocks
    for (let b = 0; b < info.blocks; b++) {
      const by = groundY - (b + 1) * COL;
      ctx.fillStyle = `hsl(${(hue + 200) % 360}, 40%, 26%)`;
      ctx.fillRect(x + 1, by, COL - 2, COL - 1);
      ctx.strokeStyle = `hsla(${(hue + 180) % 360}, 90%, 65%, 0.8)`;
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 2, by + 1, COL - 4, COL - 3);
    }
    // spikes
    if (info.spike) {
      ctx.fillStyle = `hsl(${(hue + 330) % 360}, 80%, 60%)`;
      ctx.beginPath();
      ctx.moveTo(x + 2, groundY);
      ctx.lineTo(x + COL / 2, groundY - COL * 0.95);
      ctx.lineTo(x + COL - 2, groundY);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // spinning blades — half-buried, or floating right at jump height
    if (info.saw) drawSaw(x + COL / 2, groundY - 18, SAW_R);
    if (info.airsaw) drawSaw(x + COL / 2, groundY - AIRSAW_H, AIRSAW_R);
    // pads
    if (info.pad) {
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.ellipse(x + COL / 2, groundY - 4, COL * 0.42, 7 + beatPulse * 3, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 210, 63, 0.3)';
      ctx.beginPath();
      ctx.ellipse(x + COL / 2, groundY - 6, COL * 0.5, 12, 0, Math.PI, 0);
      ctx.fill();
    }
  }

  // the finish gate
  const finX = LEVEL_LEN - COL * 6;
  ctx.strokeStyle = '#7ddf8f';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(finX, groundY);
  ctx.lineTo(finX, groundY - 200);
  ctx.stroke();
  ctx.fillStyle = '#7ddf8f';
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 2; j++) {
      if ((i + j) % 2 === 0) ctx.fillRect(finX + j * 14, groundY - 200 + i * 14, 14, 14);
    }
  }

  // the trail — each skin leaves its own kind of footprints
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.fillStyle = cubeSkin === 'shiny' ? '#ffd23f' :
                    cubeSkin === 'skull' ? `hsl(${10 + Math.random() * 25}, 95%, 55%)` :
                    `hsl(${(hue + 180) % 360}, 90%, 70%)`;
    ctx.fillRect(p.x - 3, groundY - p.y - CUBE / 2 - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // THE CUBE
  if (dead <= 0) {
    const cy = groundY - py - CUBE / 2;
    ctx.save();
    ctx.translate(px, cy);
    ctx.rotate(angle);
    drawCube(CUBE, hue, true);
    ctx.restore();
  }
  ctx.restore();

  // ---- HUD ----
  // Row 1 is the Arcade pill (left, drawn by the browser) and MENU (right).
  // Everything of ours starts BELOW both of them, so nothing gets covered.
  const pct = Math.min(100, Math.round(px / (LEVEL_LEN - COL * 6) * 100));

  // the way back — top right, opposite the Arcade pill
  const menuW = 88, menuH = 34, menuY = 10;
  uiRects.push({ x: W - menuW - 12, y: menuY, w: menuW, h: menuH, id: 'menu' });
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(W - menuW - 12, menuY, menuW, menuH);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 13px monospace';
  ctx.fillText('MENU', W - menuW / 2 - 12, menuY + 22);

  const hudY = Math.max(pillBottom(), menuY + menuH) + 8;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(12, hudY, W - 24, 14);
  ctx.fillStyle = '#7ddf8f';
  ctx.fillRect(14, hudY + 2, (W - 28) * pct / 100, 10);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'bold 14px monospace';
  ctx.fillText('attempt ' + attempts, 12, hudY + 32);
  ctx.textAlign = 'right';
  ctx.fillText(pct + '%  ·  best ' + best + '%', W - 12, hudY + 32);
  ctx.textAlign = 'left';
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText(LEVELS[levelIx].name, 12, hudY + 50);
  ctx.textAlign = 'left';

  if (!started) {
    // the two coaching lines, wrapped so they never run off a phone screen
    ctx.textAlign = 'center';
    const maxW = W - 32;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + Math.sin(elapsed * 3) * 0.3})`;
    const bigFont = `bold ${Math.min(30, W / 15)}px monospace`;
    const tall = drawWrapped('tap to JUMP — tap AGAIN in the air to DOUBLE JUMP',
                             W / 2, H * 0.38, maxW, bigFont, Math.min(34, W / 13));
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    drawWrapped('stay LOW under floating blades. you cannot stop. good luck.',
                W / 2, H * 0.38 + tall + 12, maxW, '15px monospace', 20);
  }
  if (won) {
    ctx.fillStyle = 'rgba(10, 8, 26, 0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#7ddf8f';
    ctx.font = `bold ${Math.min(46, W / 12)}px monospace`;
    ctx.fillText('LEVEL COMPLETE!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '17px monospace';
    ctx.fillText('conquered in ' + attempts + ' attempt' + (attempts === 1 ? '' : 's'),
                 W / 2, H / 2 + 20);
    if (unlockNote) {
      const throb = 1 + Math.sin(elapsed * 6) * 0.08;
      ctx.save();
      ctx.translate(W / 2, H / 2 + 62);
      ctx.scale(throb, throb);
      ctx.fillStyle = '#ffd23f';
      ctx.font = `bold ${Math.min(26, W / 22)}px monospace`;
      ctx.fillText(unlockNote, 0, 0);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '14px monospace';
    ctx.fillText('tap for the level menu' + (unlockNote ? ' — check SKINS!' : ''),
                 W / 2, H / 2 + (unlockNote ? 96 : 50));
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.025, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
