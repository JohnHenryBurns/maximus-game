              if (claimed.has(gx + ',' + gy)) continue;      // someone's already on it
              const bx = gx * cs + cs / 2, by = TOPBAR + gy * cs + cs / 2;
              const d2 = Math.hypot(bx - p.x, by - p.y);
              if (d2 < best) { best = d2; found = { gx, gy, x: bx, y: by }; }
            }
          }
          if (found) {
            p.job = found; p.jobT = 0; claimed.add(found.gx + ',' + found.gy);
            p.stand = null;
          }
        }
        if (p.job) {
          // WHICH SIDE DO WE WORK FROM? Stand on the open square to the
          // building's left or right — whichever is free and nearer to us.
          // (If both sides are walled in, above or below will do.)
          if (!p.stand) {
            const sp2 = spanOf(grid[p.job.gy][p.job.gx]);
            const sides = [ { dx: -1, dy: 0 }, { dx: sp2, dy: 0 },
                            { dx: 0, dy: -1 }, { dx: 0, dy: sp2 } ];
            let bestSide = null, bestD = 1e9;
            for (const sd of sides) {
              const cx = p.job.gx + (sd.dx === sp2 ? sp2 : sd.dx === -1 ? -1 : 0);
              const cy = p.job.gy + (sd.dy === sp2 ? sp2 : sd.dy === -1 ? -1 : 0);
              const tx = sd.dx !== 0 ? cx : p.job.gx;
              const ty = sd.dy !== 0 ? cy : p.job.gy;
              if (blocked(tx, ty)) continue;                 // can't stand in a wall
              const wx = tx * cs + cs / 2, wy = TOPBAR + ty * cs + cs / 2;
              const d3 = Math.hypot(wx - p.x, wy - p.y) + (sd.dy !== 0 ? cs * 0.6 : 0);
              if (d3 < bestD) { bestD = d3; bestSide = { x: wx, y: wy }; }
            }
            // nowhere free to stand? just walk up to it and make do
            p.stand = bestSide || { x: p.job.x, y: p.job.y };
          }
          const reach = Math.hypot(p.stand.x - p.x, p.stand.y - p.y);
          if (reach > cs * 0.45) {          // still walking over, toolbox in hand
            p.angle = Math.atan2(p.stand.y - p.y, p.stand.x - p.x);
            p.fixing = false;
          } else {                          // ON SITE — start hammering
            // face the building: hammer on our left or our right to suit
            p.workSide = p.job.x >= p.x ? 1 : -1;
            p.fixing = true;
            p.jobT += dt;
            p.hammer = (p.hammer || 0) + dt * 9;         // swing the hammer
            if (p.jobT >= REPAIR_TIME) {                 // one damage level mended!
              p.jobT = 0;
              damage[p.job.gy][p.job.gx]--;
              repaired++;
              if (damage[p.job.gy][p.job.gx] <= PRISTINE) {
                claimed.delete(p.job.gx + ',' + p.job.gy);
                p.job = null; p.fixing = false; p.stand = null;
              }
            }
          }
        } else {
          p.fixing = false;
          // NOTHING TO REBUILD? Then get the broom out. Find the nearest bit
          // of mess nobody else has claimed and go and sweep it up.
          if (p.mess && (p.mess.gone || p.mess.by !== p)) p.mess = null;
          if (!p.mess) {
            let best = 1e9, found = null;
            for (const L of litter) {
              if (L.gone || (L.by && L.by !== p)) continue;
              const d4 = Math.hypot(L.x - p.x, L.y - p.y);
              if (d4 < best) { best = d4; found = L; }
            }
            if (found) { found.by = p; p.mess = found; p.messT = 0;
                         p.mopping = found.kind === 'puddle'; }   // water needs a MOP
          }
          if (p.mess) {
            const near = Math.hypot(p.mess.x - p.x, p.mess.y - p.y);
            if (near > cs * 0.3) {          // walking over, broom in hand
              p.angle = Math.atan2(p.mess.y - p.y, p.mess.x - p.x);
              p.sweeping = false;
            } else {                        // SWEEP SWEEP SWEEP
              p.sweeping = true;
              p.workSide = p.mess.x >= p.x ? 1 : -1;
              p.messT += dt;
              p.broom = (p.broom || 0) + dt * 7;
              if (p.messT >= CLEAN_TIME) {  // all gone!
                p.mess.gone = true;
                tidied++;
                p.mess = null; p.messT = 0; p.sweeping = false; p.mopping = false;
              }
            }
          } else {
            p.sweeping = false;
            strollAbout(p, dt, cs);         // town's spotless — go for a wander
          }
        }
      } else {
        strollAbout(p, dt, cs);             // cows and dogs are always just wandering
      }
    }

    // COWS. There is no polite way to put this: every so often, a cow leaves
    // a pie behind it, and a person will have to come and scoop it up.
    if (p.kind === 'cow' && !p.sheltering) {
      p.pieTimer = (p.pieTimer || 14 + Math.random() * 20) - dt;
      if (p.pieTimer <= 0) {
        p.pieTimer = 22 + Math.random() * 28;
        dropLitter(p.x, p.y + cs * 0.1, 'pie');
      }
    }
    if (p.fixing || p.sweeping) continue;   // mid-repair or mid-sweep: stand still

    // dogs scamper, cows plod, people are in between
    const pace = p.kind === 'dog' ? 1.35 : p.kind === 'cow' ? 0.6 : 1;
    const speed = (panicking ? 150 : 30) * pace;
    const nx = p.x + Math.cos(p.angle) * speed * dt;
    const ny = p.y + Math.sin(p.angle) * speed * dt;

    // WALLS ARE SOLID. Try each direction on its own so they slide along a
    // wall instead of sticking to it. The one square they ARE allowed into
    // is the shelter they're running for — that's the door.
    const goal = p.shelterTarget;
    const okAt = (x, y) => {
      const gx = Math.floor(x / cs), gy = Math.floor((y - TOPBAR) / cs);
      if (goal && goal.gx === gx && goal.gy === gy) return true;   // their doorway
      return !blocked(gx, gy);
    };
    if (okAt(nx, p.y)) p.x = nx;
    else p.angle = Math.PI - p.angle;              // bounced off a wall sideways
    if (okAt(p.x, ny)) p.y = ny;
    else p.angle = -p.angle;                       // bounced off a wall up/down

    p.x = Math.max(4, Math.min(COLS * cs - 4, p.x));
    p.y = Math.max(TOPBAR + 4, Math.min(TOPBAR + ROWS * cs - 4, p.y));

    // ---- STEPPING IN IT ----
    // a pie underfoot ruins somebody's whole afternoon
    if (p.kind === 'person' && !(p.ick > 0) && elapsed > (p.ickCool || 0)) {
      for (const L of litter) {
        if (L.kind !== 'pie' || L.gone) continue;
        if (Math.hypot(L.x - p.x, L.y - p.y) < 8) {
          L.squish = true;                    // that pie will never be the same
          piesSteppedIn++;
          p.ick = 1.2;                        // the full-body EWWW
          p.ickCool = elapsed + 5;            // one catastrophe per shoe, please
          p.trackT = 2.6;                     // and now they're tracking it around
          if (piesSteppedIn % 3 === 1) {
            setStatus('EWWW — somebody stepped in a cow pie! (' + piesSteppedIn + ' so far)', '#c98a3d');
          }
          break;
        }
      }
    }
    if (p.ick > 0) p.ick -= dt;
    // brown footprints follow the unlucky shoe wherever it goes
    if (p.trackT > 0) {
      p.trackT -= dt;
      p.trackTick = (p.trackTick || 0) - dt;
      if (p.trackTick <= 0) {
        p.trackTick = 0.14;
        footprints.push({ x: p.x + (Math.random() - 0.5) * 4, y: p.y + 3, born: elapsed });
      }
    }

    // did something GET them on the way?
    let hit = false;
    for (const D of disasters) {
      if (D.type === 'tornado' && Math.hypot(D.x - p.x, D.y - p.y) < 45) hit = true;
      if (D.type === 'balls') {
        for (const ball of D.balls) {
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < 26) hit = true;
        }
      }
      if (D.type === 'flood' && p.y > D.waterY + 10) hit = true;
    }
    if (hit && !p.gone) {
      p.gone = true;
      peopleLaunched++;
      launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
        vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
    }
  }
  // anyone launched into the air lets go of the mess they'd claimed
  for (const p of people) if (p.gone && p.mess) p.mess.by = null;
  people = people.filter(p => !p.gone);

  // ---- CARS ON THE ROADS ----
  carTimer -= dt;
  if (carTimer <= 0) {                       // now and then, a new car turns up
    carTimer = 2.5;
    if (cars.length < 14) trySpawnCar();
  }
  for (const car of cars) {
    const gx = Math.floor(car.x / cs), gy = Math.floor((car.y - TOPBAR) / cs);
    const onMap = gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS;
    if (!onMap) { car.gone = true; continue; }        // drove off the map — bye!
    if (grid[gy][gx] !== ROAD) { popCar(car); continue; }   // road vanished under it

    // WHAT'S THE SQUARE IN FRONT?
    const fx = gx + car.dx, fy = gy + car.dy;
    const frontIsRoad = isRoad(fx, fy);
    const frontOffMap = fx < 0 || fy < 0 || fx >= COLS || fy >= ROWS;

    // Reasons to hold still: a red light at the junction ahead, or the
    // back bumper of the car in front.
    let stop = false;
    if (frontIsRoad && roadJunc[fy][fx] && !roadJunc[gy][gx] && !greenFor(car.dx, car.dy)) {
      stop = true;                                    // RED — wait at the line
    }
    if (!stop) {
      for (const o of cars) {                         // don't rear-end anybody
        if (o === car || o.gone) continue;
        const relx = (o.x - car.x) * car.dx + (o.y - car.y) * car.dy;   // how far ahead
        const side = Math.abs((o.x - car.x) * car.dy - (o.y - car.y) * car.dx);
        if (relx > 0 && relx < cs * 0.95 && side < cs * 0.5) { stop = true; break; }
      }
    }

    if (!stop) {
      car.x += car.dx * car.speed * dt;
      car.y += car.dy * car.speed * dt;
    } else {
      // creep up to the stop line and hold there
      const lineX = gx * cs + cs / 2, lineY = TOPBAR + gy * cs + cs / 2;
      if (car.dx > 0) car.x = Math.min(car.x, lineX + cs * 0.3);
      if (car.dx < 0) car.x = Math.max(car.x, lineX - cs * 0.3);
      if (car.dy > 0) car.y = Math.min(car.y, lineY + cs * 0.3);
      if (car.dy < 0) car.y = Math.max(car.y, lineY - cs * 0.3);
    }

    // crossed into a new square? work out where to go next
    const nx2 = Math.floor(car.x / cs), ny2 = Math.floor((car.y - TOPBAR) / cs);
    if (nx2 !== gx || ny2 !== gy) {
      if (nx2 < 0 || ny2 < 0 || nx2 >= COLS || ny2 >= ROWS) { car.gone = true; continue; }
      // FOLLOW YOUR LANE. If the square we've rolled into is part of a bend,
      // the lane itself tells us which way to go — so cars sweep round a
      // two-lane corner in their own lane instead of ploughing straight on.
      if (roadTurn[ny2][nx2]) {
        const ld = laneDir(nx2, ny2);
        if (ld && (ld.dx !== car.dx || ld.dy !== car.dy)) {
          car.x = nx2 * cs + cs / 2; car.y = TOPBAR + ny2 * cs + cs / 2;
          car.dx = ld.dx; car.dy = ld.dy;
          continue;
        }
      }
      // NO DRIVING THE WRONG WAY. If the square we just rolled into is a
      // one-way going the other way, take a legal turn instead — and if
      // there isn't one, this car's journey quietly ends here.
      const into = laneDir(nx2, ny2);
      if (into && (into.dx !== car.dx || into.dy !== car.dy)) {
        const legal = [[car.dy, car.dx], [-car.dy, -car.dx]].filter(([tx, ty]) => {
          if (!isRoad(nx2 + tx, ny2 + ty)) return false;
          const d2 = laneDir(nx2 + tx, ny2 + ty);
          return !d2 || (d2.dx === tx && d2.dy === ty);
        });
        if (legal.length && (into.dx === -car.dx && into.dy === -car.dy)) {
          const t = legal[Math.floor(Math.random() * legal.length)];
          car.x = gx * cs + cs / 2; car.y = TOPBAR + gy * cs + cs / 2;
          car.dx = t[0]; car.dy = t[1];
          continue;
        }
        if (into.dx === -car.dx && into.dy === -car.dy) { car.gone = true; continue; }
      }
      if (roadJunc[ny2][nx2] && Math.random() < 0.4) {
        // at a junction, sometimes turn off — but only onto a road that
        // actually runs the way we'd be going (no driving up a one-way!)
        const options = [[car.dy, car.dx], [-car.dy, -car.dx]].filter(([tx, ty]) => {
          if (!isRoad(nx2 + tx, ny2 + ty)) return false;
          const d2 = laneDir(nx2 + tx, ny2 + ty);
          return !d2 || (d2.dx === tx && d2.dy === ty);
        });
        if (options.length) {
          const t = options[Math.floor(Math.random() * options.length)];
          car.x = nx2 * cs + cs / 2; car.y = TOPBAR + ny2 * cs + cs / 2;
          car.dx = t[0]; car.dy = t[1];
        }
      }
    } else if (!frontIsRoad && !stop) {
      // THE ROAD RUNS OUT AHEAD.
      if (frontOffMap) {
        // it goes right to the edge of the map — drive off and away
      } else {
        // a bend? follow it. Otherwise the car simply slips away rather
        // than doing a U-turn on a one-way street.
        const bends = [[car.dy, car.dx], [-car.dy, -car.dx]].filter(([tx, ty]) => {
          if (!isRoad(gx + tx, gy + ty)) return false;
          const d2 = laneDir(gx + tx, gy + ty);
          return !d2 || (d2.dx === tx && d2.dy === ty);
        });
        const past = (car.x - (gx * cs + cs / 2)) * car.dx +
                     (car.y - (TOPBAR + gy * cs + cs / 2)) * car.dy;
        if (past >= 0) {
          if (bends.length) {
            const t = bends[Math.floor(Math.random() * bends.length)];
            car.x = gx * cs + cs / 2; car.y = TOPBAR + gy * cs + cs / 2;
            car.dx = t[0]; car.dy = t[1];
          } else if (past > cs * 0.35) {
            car.gone = true; continue;     // end of the line — quietly gone
          }
        }
      }
    }
    // did a disaster catch it?
    for (const D of disasters) {
      if (D.type === 'tornado' && Math.hypot(D.x - car.x, D.y - car.y) < 60) popCar(car);
      if (D.type === 'flood' && car.y > D.waterY + 6) popCar(car);
      if (D.type === 'balls') {
        for (const ball of D.balls) if (Math.hypot(ball.x - car.x, ball.y - car.y) < 28) popCar(car);
      }
      if (D.type === 'quake' && Math.random() < dt * 0.25) popCar(car);
    }
  }
  cars = cars.filter(c => !c.gone);
  for (const b of blasts) b.t += dt;            // fireballs bloom then fade
  blasts = blasts.filter(b => b.t < b.life);
  litter = litter.filter(L => !L.gone);         // swept-up mess is gone for good
  footprints = footprints.filter(f => elapsed - f.born < 5);   // tracks fade away

  // airborne folk tumble gracefully out of frame
  for (const f of launchedFolk) {
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vy += 600 * dt;
    f.spin += dt * 12;
    f.life -= dt;
  }
  launchedFolk = launchedFolk.filter(f => f.life > 0);

  // debris tumbles through the air and fades
  for (const d of debris) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 700 * dt;               // gravity brings it all back down
    d.spin += dt * 10;
    d.life -= dt;
  }
  debris = debris.filter(d => d.life > 0);
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function draw() {
  ensureRoads();                 // make sure our road notes match the map
  const shx = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  ctx.save();
  ctx.translate(shx, shy);

  // THE CAMERA. Everything from here until ctx.restore() is drawn through
  // the zoom lens. We clip to the play area first so zoomed-in scenery can
  // never spill up over the toolbar, then slide (pan) and scale (zoom).
  // At zoom 1 with no pan this is exactly the identity — nothing changes.
  ctx.beginPath();
  ctx.rect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);
  ctx.clip();

  // FOG OF WAR — a misty slate fills the whole play area behind everything.
  // The green town gets drawn on top, so fog shows around the town's edges
  // (and a little more as you pan past them). Drawn in SCREEN space, before
  // the camera transform, so it's a steady backdrop the town floats over.
  ctx.fillStyle = '#2b333d';
  ctx.fillRect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);
  for (let i = 0; i < 12; i++) {                 // soft cloud blobs for a foggy look
    const cxF = hash(i * 1.3) * canvas.width;
    const cyF = TOPBAR + hash(i * 2.7) * (canvas.height - TOPBAR);
    const rF = 50 + hash(i * 3.9) * 80;
    ctx.fillStyle = `rgba(210, 220, 235, ${0.04 + hash(i * 5.1) * 0.05})`;
    ctx.beginPath();
    ctx.ellipse(cxF, cyF, rF, rF * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.translate(panX, TOPBAR + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(0, -TOPBAR);

  // the town's grass — ONLY the grid area now (the rest stays fog), with a
  // dark earth border and a bright rim so the town has clear, crisp edges.
  const gw = gridW(), gh = gridH();
  ctx.fillStyle = '#243318';
  ctx.fillRect(-6, TOPBAR - 6, gw + 12, gh + 12);
  ctx.fillStyle = '#4a7c3a';
  ctx.fillRect(0, TOPBAR, gw, gh);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, TOPBAR + 1, gw - 2, gh - 2);

  // meteor craters, scarred into the lawn forever
  for (const c of craters) {
    ctx.fillStyle = 'rgba(30, 22, 14, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(60, 45, 28, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r * 0.55, c.r * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const s = cellSize();

  // faint grid lines so builders can aim
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= COLS; gx++) {
    ctx.beginPath();
    ctx.moveTo(gx * s, TOPBAR);
    ctx.lineTo(gx * s, TOPBAR + ROWS * s);
    ctx.stroke();
  }
  for (let gy = 0; gy <= ROWS; gy++) {
    ctx.beginPath();
    ctx.moveTo(0, TOPBAR + gy * s);
    ctx.lineTo(COLS * s, TOPBAR + gy * s);
    ctx.stroke();
  }

  // the blocks of the town
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const kind = grid[gy][gx];
      if (kind === EMPTY) continue;
      // A big building is drawn ONCE, by its top-left square. The other
      // squares it covers skip their turn.
      const rt = rootAt[gy][gx];
      if (rt && (rt.rx !== gx || rt.ry !== gy)) continue;
      const sp = spanOf(kind);
      const x = gx * s, y = TOPBAR + gy * s;
      const s2 = s * sp;                       // how big this building really is
      // every block gets its own little quirk from its position, so the town
      // looks hand-made instead of stamped out
      const q = hash(gx * 7.3 + gy * 3.1);
      // a soft shadow on the grass under everything that stands up
      // (roads and paths lie flat, so they don't get one)
      if (!isWay(kind)) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
        ctx.beginPath();
        ctx.ellipse(x + s2 * 0.5, y + s2 * 0.94, s2 * 0.36, s2 * 0.06, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (isWay(kind)) {
        drawWay(gx, gy, x, y, s, kind);
      } else if (kind === HOUSE) {
        ctx.fillStyle = ['#c9a06a', '#d9b184', '#c08f5e'][Math.floor(q * 3)];  // walls
        ctx.fillRect(x + s * 0.15, y + s * 0.4, s * 0.7, s * 0.5);
        ctx.fillStyle = '#8fd0ff';                      // a cheerful little window
        ctx.fillRect(x + s * 0.2, y + s * 0.5, s * 0.16, s * 0.14);
        ctx.fillStyle = ['#b5563c', '#a8483f', '#c26a44'][Math.floor(q * 3)];  // roof
        ctx.beginPath();
        ctx.moveTo(x + s * 0.06, y + s * 0.46);
        ctx.lineTo(x + s * 0.5, y + s * 0.06);
        ctx.lineTo(x + s * 0.94, y + s * 0.46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#8c6b4a';                      // chimney
        ctx.fillRect(x + s * 0.68, y + s * 0.14, s * 0.11, s * 0.2);
        ctx.fillStyle = 'rgba(230, 230, 235, 0.6)';     // a curl of smoke
        ctx.beginPath();
        ctx.arc(x + s * (0.735 + Math.sin(elapsed * 1.4 + q * 6) * 0.04),
                y + s * 0.06, s * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5b3b1e';                      // door
        ctx.fillRect(x + s * 0.44, y + s * 0.62, s * 0.16, s * 0.28);
        ctx.fillStyle = '#ffd23f';                      // doorknob
        ctx.fillRect(x + s * 0.57, y + s * 0.74, s * 0.03, s * 0.03);
      } else if (kind === TREE) {
        ctx.fillStyle = '#6d5330';                      // trunk
        ctx.fillRect(x + s * 0.44, y + s * 0.55, s * 0.14, s * 0.35);
        // three overlapping puffs of leaves, swaying in the breeze
        const sway = Math.sin(elapsed * 1.1 + q * 6.28) * s * 0.03;
        ctx.fillStyle = ['#3f8a3f', '#4d9c43', '#357a38'][Math.floor(q * 3)];
        ctx.beginPath(); ctx.arc(x + s * 0.5 + sway, y + s * 0.34, s * 0.28, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + s * 0.32 + sway, y + s * 0.46, s * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + s * 0.68 + sway, y + s * 0.46, s * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';    // sunlight on top
        ctx.beginPath(); ctx.arc(x + s * 0.42 + sway, y + s * 0.26, s * 0.1, 0, Math.PI * 2); ctx.fill();
        if (q > 0.72) {                                 // some trees have apples!
          ctx.fillStyle = '#e8453c';
          ctx.beginPath(); ctx.arc(x + s * 0.62 + sway, y + s * 0.38, s * 0.05, 0, Math.PI * 2); ctx.fill();
        }
      } else if (kind === STONE) {
        ctx.fillStyle = '#8a8d94';                      // a lumpy boulder
        ctx.beginPath();
        ctx.moveTo(x + s * 0.1,  y + s * 0.88);
        ctx.lineTo(x + s * 0.16, y + s * 0.34);
        ctx.lineTo(x + s * 0.44, y + s * 0.14);
        ctx.lineTo(x + s * 0.8,  y + s * 0.26);
        ctx.lineTo(x + s * 0.9,  y + s * 0.88);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#a7aab2';                      // light catching the top
        ctx.beginPath();
        ctx.moveTo(x + s * 0.16, y + s * 0.34);
        ctx.lineTo(x + s * 0.44, y + s * 0.14);
        ctx.lineTo(x + s * 0.8,  y + s * 0.26);
        ctx.lineTo(x + s * 0.6,  y + s * 0.4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(60, 62, 68, 0.55)';       // speckles
        ctx.fillRect(x + s * 0.3, y + s * 0.58, s * 0.09, s * 0.07);
        ctx.fillRect(x + s * 0.62, y + s * 0.68, s * 0.07, s * 0.06);
      } else if (kind === APT) {
        // A PROPER TOWER BLOCK, four squares of it. Drawn against s2 (the
        // whole 2x2 footprint) rather than one square.
        ctx.fillStyle = '#5a6a7a';                      // the tall tower
        ctx.fillRect(x + s2 * 0.1, y + s2 * 0.08, s2 * 0.8, s2 * 0.84);
        ctx.fillStyle = '#4c5a68';                      // a shaded side, for depth
        ctx.fillRect(x + s2 * 0.72, y + s2 * 0.08, s2 * 0.18, s2 * 0.84);
        ctx.fillStyle = '#7a8a9a';                      // roof ledge
        ctx.fillRect(x + s2 * 0.06, y + s2 * 0.08, s2 * 0.88, s2 * 0.07);
        ctx.fillStyle = '#93a3b3';                      // rooftop water tank
        ctx.fillRect(x + s2 * 0.62, y + s2 * 0.005, s2 * 0.13, s2 * 0.075);
        ctx.fillStyle = '#6a7a8a';                      // and a little aerial
        ctx.fillRect(x + s2 * 0.26, y - s2 * 0.03, s2 * 0.02, s2 * 0.11);
        // six floors of windows — a few dark, because some people are out
        for (let wy2 = 0; wy2 < 6; wy2++) {
          for (let wx2 = 0; wx2 < 3; wx2++) {
            const lit = hash(gx * 11 + gy * 5 + wy2 * 3.3 + wx2 * 1.7) > 0.3;
            ctx.fillStyle = lit ? '#ffd23f' : '#33414e';
            ctx.fillRect(x + s2 * (0.17 + wx2 * 0.21), y + s2 * (0.2 + wy2 * 0.115),
                         s2 * 0.13, s2 * 0.075);
          }
        }
        ctx.fillStyle = '#33414e';                      // front doors
        ctx.fillRect(x + s2 * 0.42, y + s2 * 0.8, s2 * 0.16, s2 * 0.12);
        ctx.fillStyle = '#ffd23f';                      // a light over the door
        ctx.fillRect(x + s2 * 0.46, y + s2 * 0.76, s2 * 0.08, s2 * 0.025);
      } else if (kind === SKY) {
        // THE SKYSCRAPER — nine squares of pure downtown. Drawn against
        // s2 (the whole 3x3 footprint), it towers over everything.
        ctx.fillStyle = '#4a7a9a';                      // the glass giant
        ctx.fillRect(x + s2 * 0.14, y + s2 * 0.04, s2 * 0.72, s2 * 0.88);
        ctx.fillStyle = '#3d6884';                      // shaded side
        ctx.fillRect(x + s2 * 0.7, y + s2 * 0.04, s2 * 0.16, s2 * 0.88);
        ctx.fillStyle = '#6a9aba';                      // rooftop ledge
        ctx.fillRect(x + s2 * 0.1, y + s2 * 0.04, s2 * 0.8, s2 * 0.05);
        ctx.fillStyle = '#93a3b3';                      // spire on top
        ctx.fillRect(x + s2 * 0.48, y - s2 * 0.06, s2 * 0.04, s2 * 0.12);
        ctx.fillStyle = '#ff4757';                      // blinking beacon
        if (Math.sin(elapsed * 3 + q * 6) > 0) {
          ctx.fillRect(x + s2 * 0.47, y - s2 * 0.08, s2 * 0.06, s2 * 0.03);
        }
        // eight floors of windows, some lit, some out
        for (let wy2 = 0; wy2 < 8; wy2++) {
          for (let wx2 = 0; wx2 < 4; wx2++) {
            const lit = hash(gx * 13 + gy * 7 + wy2 * 3.1 + wx2 * 1.9) > 0.35;
            ctx.fillStyle = lit ? '#ffd23f' : '#2c4256';
            ctx.fillRect(x + s2 * (0.2 + wx2 * 0.13), y + s2 * (0.12 + wy2 * 0.095),
                         s2 * 0.085, s2 * 0.06);
          }
        }
        ctx.fillStyle = '#2c4256';                      // grand lobby doors
        ctx.fillRect(x + s2 * 0.4, y + s2 * 0.82, s2 * 0.2, s2 * 0.1);
      } else if (kind === TOWER) {
        // THE CASTLE TOWER — four squares of stone, flood-proof and proud
        ctx.fillStyle = '#9aa0a8';                      // the keep
        ctx.fillRect(x + s2 * 0.16, y + s2 * 0.1, s2 * 0.68, s2 * 0.82);
        ctx.fillStyle = '#868c94';                      // shaded edge
        ctx.fillRect(x + s2 * 0.68, y + s2 * 0.1, s2 * 0.16, s2 * 0.82);
        ctx.fillStyle = '#b8bec6';                      // battlements
        for (let b2 = 0; b2 < 4; b2++) {
          ctx.fillRect(x + s2 * (0.14 + b2 * 0.19), y + s2 * 0.02, s2 * 0.13, s2 * 0.12);
        }
        ctx.fillStyle = 'rgba(60, 62, 68, 0.4)';        // stone brick lines
        for (let l2 = 0; l2 < 3; l2++) {
          ctx.fillRect(x + s2 * 0.16, y + s2 * (0.3 + l2 * 0.18), s2 * 0.68, s2 * 0.02);
        }
        ctx.fillStyle = '#5a6068';                      // arrow-slit windows
        ctx.fillRect(x + s2 * 0.34, y + s2 * 0.3, s2 * 0.07, s2 * 0.2);
        ctx.fillRect(x + s2 * 0.58, y + s2 * 0.3, s2 * 0.07, s2 * 0.2);
        ctx.fillStyle = '#5b3b1e';                      // heavy wooden gate
        ctx.beginPath();
        ctx.arc(x + s2 * 0.5, y + s2 * 0.92, s2 * 0.14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(x + s2 * 0.36, y + s2 * 0.92, s2 * 0.28, s2 * 0.001);
      } else if (kind === BUNKER) {
        ctx.fillStyle = '#4a5548';                      // squat armored dome
        ctx.beginPath();
        ctx.arc(x + s * 0.5, y + s * 0.72, s * 0.4, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.2);
        ctx.fillStyle = '#6a7a66';                      // top rim
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.06);
        ctx.fillStyle = 'rgba(255,255,255,0.14)';       // shine on the dome
        ctx.beginPath();
        ctx.ellipse(x + s * 0.36, y + s * 0.52, s * 0.12, s * 0.06, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2c332b';                      // the sealed door
        ctx.fillRect(x + s * 0.4, y + s * 0.6, s * 0.2, s * 0.32);
        ctx.fillStyle = '#8fd0ff';                      // tiny porthole
        ctx.beginPath(); ctx.arc(x + s * 0.5, y + s * 0.68, s * 0.05, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c8d4c4';                      // bolts
        ctx.fillRect(x + s * 0.16, y + s * 0.8, s * 0.05, s * 0.05);
        ctx.fillRect(x + s * 0.79, y + s * 0.8, s * 0.05, s * 0.05);
      }

      // ---- BATTLE SCARS ----
      // Lightly damaged: a couple of cracks and a scorch. Heavily damaged:
      // deep cracks, a bite taken out of the top, and a wisp of smoke.
      const dmg = damage[gy][gx];
      if (dmg > PRISTINE) {
        ctx.strokeStyle = dmg === HEAVY ? 'rgba(20,14,10,0.75)' : 'rgba(30,22,16,0.5)';
        ctx.lineWidth = Math.max(1, s2 * (dmg === HEAVY ? 0.05 : 0.035));
        ctx.beginPath();                                 // a jagged crack
        ctx.moveTo(x + s2 * 0.32, y + s2 * 0.9);
        ctx.lineTo(x + s2 * 0.42, y + s2 * 0.62);
        ctx.lineTo(x + s2 * 0.34, y + s2 * 0.5);
        ctx.stroke();
        if (dmg === HEAVY) {
          ctx.beginPath();                               // a second, worse one
          ctx.moveTo(x + s2 * 0.72, y + s2 * 0.9);
          ctx.lineTo(x + s2 * 0.62, y + s2 * 0.58);
          ctx.lineTo(x + s2 * 0.74, y + s2 * 0.38);
          ctx.stroke();
          ctx.fillStyle = '#4a7c3a';                     // a chunk missing off the top
          ctx.beginPath();
          ctx.moveTo(x + s2 * 0.5, y + s2 * 0.06);
          ctx.lineTo(x + s2 * 0.95, y + s2 * 0.1);
          ctx.lineTo(x + s2 * 0.95, y + s2 * 0.34);
          ctx.closePath(); ctx.fill();
          // a lazy wisp of smoke
          ctx.fillStyle = 'rgba(60, 60, 66, 0.35)';
          ctx.beginPath();
          ctx.arc(x + s2 * (0.7 + Math.sin(elapsed * 1.7 + gx) * 0.06),
                  y + s2 * (0.16 - (elapsed * 0.15 + gy * 0.3) % 0.3),
                  s2 * 0.09, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = dmg === HEAVY ? 'rgba(0,0,0,0.22)' : 'rgba(0,0,0,0.1)';
        ctx.fillRect(x, y, s2, s2);                      // soot over the whole building
      }
    }
  }

  // ---- TRAFFIC LIGHTS at every junction ----
  {
    const ph = lightPhase();
    for (let gy = 0; gy < ROWS; gy++) {
      for (let gx = 0; gx < COLS; gx++) {
        if (!roadJunc[gy][gx]) continue;
        const lx = gx * s + s * 0.86, ly = TOPBAR + gy * s + s * 0.06;
        const bw = s * 0.16, bh = s * 0.3;
        ctx.fillStyle = '#1b1f24';                      // the little light box
        rrect(lx - bw / 2, ly, bw, bh, s * 0.05); ctx.fill();
        // two lamps: the top one is for up/down, the bottom for left/right
        ctx.fillStyle = ph.ns ? '#4ade6a' : '#3a2222';
        ctx.beginPath(); ctx.arc(lx, ly + bh * 0.28, s * 0.045, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = ph.ew ? '#4ade6a' : '#3a2222';
        ctx.beginPath(); ctx.arc(lx, ly + bh * 0.72, s * 0.045, 0, Math.PI * 2); ctx.fill();
        if (!ph.ns && !ph.ew) {                          // the everybody-stop moment
          ctx.fillStyle = '#f2b33d';
          ctx.beginPath(); ctx.arc(lx, ly + bh * 0.5, s * 0.04, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  // ---- CARS, trundling along the roads ----
  for (const car of cars) {
    const u = s / 26;
    const horiz = car.dx !== 0;
    const L = 15 * u, Wd = 9 * u;                 // length and width
    const cw = horiz ? L : Wd, ch = horiz ? Wd : L;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';           // shadow under the car
    ctx.beginPath();
    ctx.ellipse(car.x, car.y + 2 * u, cw * 0.5, ch * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = car.color;                    // the body
    rrect(car.x - cw / 2, car.y - ch / 2, cw, ch, 2.5 * u); ctx.fill();
    ctx.fillStyle = 'rgba(180, 225, 255, 0.85)';  // windscreen, up at the front
    if (horiz) ctx.fillRect(car.x + car.dx * 1.5 * u - 2 * u, car.y - ch / 2 + 1.4 * u, 4 * u, ch - 2.8 * u);
    else       ctx.fillRect(car.x - cw / 2 + 1.4 * u, car.y + car.dy * 1.5 * u - 2 * u, cw - 2.8 * u, 4 * u);
    ctx.fillStyle = '#ffe9a8';                    // headlights
    if (horiz) ctx.fillRect(car.x + car.dx * (L / 2 - 1.4 * u) - 0.7 * u, car.y - ch / 2 + 1 * u, 1.6 * u, ch - 2 * u);
    else       ctx.fillRect(car.x - cw / 2 + 1 * u, car.y + car.dy * (L / 2 - 1.4 * u) - 0.7 * u, cw - 2 * u, 1.6 * u);
  }

  // ---- CAR FIREBALLS: a hot core, a flame ring, then a puff of smoke ----
  for (const b of blasts) {
    const f = b.t / b.life;                      // 0 at the bang, 1 at the end
    const r = b.r * (0.45 + f * 0.85);
    ctx.globalAlpha = 1 - f;
    ctx.fillStyle = '#ff7a1a';                   // orange flame ball
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23f';                   // white-hot centre
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath(); ctx.arc(b.x, b.y, r * 0.24, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = (1 - f) * 0.5;             // smoke curling off the top
    ctx.fillStyle = '#5a5a62';
    ctx.beginPath(); ctx.arc(b.x, b.y - r * 0.8 - f * b.r, r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // A little green progress bar over whatever building is being repaired,
  // so you can see the work happening.
  for (const p of people) {
    if (!p.fixing || !p.job) continue;
    const bs = s * spanOf(grid[p.job.gy][p.job.gx]);   // span the whole building
    const bx2 = p.job.gx * s, by2 = TOPBAR + p.job.gy * s;
    const frac = Math.max(0, Math.min(1, p.jobT / REPAIR_TIME));
    ctx.fillStyle = 'rgba(10, 14, 20, 0.75)';
    ctx.fillRect(bx2 + bs * 0.12, by2 - s * 0.16, bs * 0.76, s * 0.1);
    ctx.fillStyle = '#7ddf8f';
    ctx.fillRect(bx2 + bs * 0.13, by2 - s * 0.15, bs * 0.74 * frac, s * 0.08);
    ctx.fillStyle = '#ffe9a8';                       // a tiny wrench, to say "under repair"
    ctx.font = `bold ${Math.max(7, s * 0.3)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('🔧', bx2 + bs * 0.5, by2 - s * 0.22);
  }

  // ---- STANDING WATER ----
  // Every puddle square goes into ONE path and gets filled in a single go.
  // Squares that touch therefore join up into a single continuous pool with
  // no seams and no double-darkened overlaps.
  {
    const pools = litter.filter(L => L.kind === 'puddle');
    if (pools.length) {
      // Build the pool shape once and FILL it (never stroke it) — stroking
      // would outline every square inside the pool and give the game away.
      // The damp edge is done by filling a slightly bigger copy underneath.
      const poolPath = (grow, r2) => {
        ctx.beginPath();
        for (const L of pools) {
          const cx3 = (L.gx !== undefined ? L.gx * s : L.x - s / 2);
          const cy3 = (L.gy !== undefined ? TOPBAR + L.gy * s : L.y - s / 2);
          const px3 = cx3 - grow, py3 = cy3 - grow, w3 = s + grow * 2;
          ctx.moveTo(px3 + r2, py3);
          ctx.arcTo(px3 + w3, py3, px3 + w3, py3 + w3, r2);
          ctx.arcTo(px3 + w3, py3 + w3, px3, py3 + w3, r2);
          ctx.arcTo(px3, py3 + w3, px3, py3, r2);
          ctx.arcTo(px3, py3, px3 + w3, py3, r2);
          ctx.closePath();
        }
      };
      poolPath(s * 0.16, s * 0.22);                    // wet ground round the edge
      ctx.fillStyle = 'rgba(120, 170, 210, 0.32)';
      ctx.fill();
      poolPath(s * 0.08, s * 0.16);                    // the water itself
      ctx.fillStyle = 'rgba(58, 126, 194, 0.72)';
      ctx.fill();
      // a few shifting glints of light on the surface
      ctx.fillStyle = 'rgba(205, 238, 255, 0.3)';
      for (const L of pools) {
        const wob = Math.sin(elapsed * 1.6 + L.seed) * s * 0.07;
        ctx.beginPath();
        ctx.ellipse(L.x - s * 0.13 + wob, L.y - s * 0.13,
                    s * 0.22, s * 0.07, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ---- THE MESS: rubble left by disasters, and, ahem, cow pies ----
  for (const L of litter) {
    const u = s / 26;
    const h1 = hash(L.seed), h2 = hash(L.seed + 3.1), h3 = hash(L.seed + 7.7);
    if (L.kind !== 'puddle') {                             // a shadow on the grass
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.beginPath();
      ctx.ellipse(L.x, L.y + 1.5 * u, 6 * u, 2.2 * u, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (L.kind === 'puddle') {
      // drawn below, all together, so touching squares merge into one pool
    } else if (L.kind === 'ember') {
      // a chunk of the meteor, still glowing, still smoking
      const glow = 0.45 + Math.sin(elapsed * 3 + L.seed) * 0.2;
      ctx.fillStyle = `rgba(255, 130, 40, ${glow * 0.5})`;
      ctx.beginPath(); ctx.arc(L.x, L.y, 7 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a3232';
      ctx.beginPath();
      ctx.moveTo(L.x - 4.5 * u, L.y + 2 * u); ctx.lineTo(L.x - 3 * u, L.y - 3 * u);
      ctx.lineTo(L.x + 1.5 * u, L.y - 4 * u); ctx.lineTo(L.x + 4.5 * u, L.y + 2 * u);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = `rgba(255, 160, 60, ${glow})`;     // hot cracks in the rock
      ctx.fillRect(L.x - 2 * u, L.y - 1.6 * u, 2.6 * u, 0.9 * u);
      ctx.fillRect(L.x + 0.6 * u, L.y - 0.2 * u, 1.8 * u, 0.8 * u);
      ctx.fillStyle = 'rgba(90, 90, 96, 0.3)';            // a thread of smoke
      ctx.beginPath();
      ctx.arc(L.x + Math.sin(elapsed * 1.3 + L.seed) * 1.6 * u,
              L.y - 6 * u - ((elapsed * 5 + L.seed * 9) % 7) * u, 1.6 * u, 0, Math.PI * 2);
      ctx.fill();
    } else if (L.kind === 'splinter') {
      // torn planks the tornado dropped
      ctx.fillStyle = '#9a7444';
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.translate(L.x + (hash(L.seed + i) - 0.5) * 5 * u,
                      L.y + (hash(L.seed + i * 2.3) - 0.5) * 3 * u);
        ctx.rotate(hash(L.seed + i * 3.7) * Math.PI);
        ctx.fillStyle = ['#9a7444', '#b08a55', '#7d5c33'][i];
        ctx.fillRect(-4 * u, -0.9 * u, 8 * u, 1.8 * u);
        ctx.restore();
      }
    } else if (L.kind === 'slab') {
      // a paving slab heaved up out of the ground by the quake
      ctx.fillStyle = '#6b6a63';
      ctx.beginPath();
      ctx.moveTo(L.x - 6 * u, L.y + 2 * u); ctx.lineTo(L.x - 4 * u, L.y - 3.5 * u);
      ctx.lineTo(L.x + 5 * u, L.y - 2 * u); ctx.lineTo(L.x + 6 * u, L.y + 2.4 * u);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#87867e';
      ctx.beginPath();
      ctx.moveTo(L.x - 4 * u, L.y - 3.5 * u); ctx.lineTo(L.x + 5 * u, L.y - 2 * u);
      ctx.lineTo(L.x + 2 * u, L.y - 0.6 * u); ctx.lineTo(L.x - 3 * u, L.y - 1.8 * u);
      ctx.closePath(); ctx.fill();
    } else if (L.kind === 'ball') {
      // a rubber ball that never popped, just sitting there
      ctx.fillStyle = L.color || '#ff4757';
      ctx.beginPath(); ctx.arc(L.x, L.y - 1 * u, 4.6 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.arc(L.x - 1.5 * u, L.y - 2.5 * u, 1.4 * u, 0, Math.PI * 2); ctx.fill();
    } else if (L.kind === 'pie') {
      // a splat, in three shades of... let's call it brown.
      // a STEPPED-IN pie is wider, flatter, and has seen things.
      const sq = L.squish ? 1 : 0;
      ctx.fillStyle = '#6b4a24';
      ctx.beginPath();
      ctx.ellipse(L.x, L.y, (5.4 + sq * 2.6) * u, (2.9 - sq * 0.7) * u, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7d5a2c';
      ctx.beginPath();
      ctx.ellipse(L.x - 1 * u, L.y - (1.1 - sq * 0.5) * u,
                  (3.6 + sq * 1.6) * u, (2.1 - sq * 0.5) * u, 0, 0, Math.PI * 2);
      ctx.fill();
      if (!L.squish) {
        ctx.fillStyle = '#8d6733';
        ctx.beginPath(); ctx.ellipse(L.x + 0.6 * u, L.y - 2.2 * u, 2.1 * u, 1.4 * u, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        // the guilty BOOT PRINT, pressed right into the middle of it
        ctx.fillStyle = '#4e3518';
        ctx.beginPath();
        ctx.ellipse(L.x + 0.8 * u, L.y - 0.6 * u, 2.6 * u, 1.5 * u, 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5e4120';
        for (let t = 0; t < 3; t++) {
          ctx.fillRect(L.x - 0.6 * u + t * 1.4 * u, L.y - 1.6 * u, 0.8 * u, 0.6 * u);
        }
      }
      // flies, doing laps. a squished pie earns a THIRD, angrier fly.
      ctx.fillStyle = '#22242a';
      for (let f = 0; f < 2 + sq; f++) {
        const a = elapsed * (3.4 + f) + L.seed + f * 2.6;
        ctx.beginPath();
        ctx.arc(L.x + Math.cos(a) * 6 * u, L.y - 4.5 * u + Math.sin(a * 1.7) * 2.4 * u,
                0.7 * u, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // A PROPER HEAP OF WRECKAGE: dust at the bottom, then broken bricks
      // and slabs stacked up, each one lit on top and shaded down the side,
      // with a snapped roof beam poking out of it.
      ctx.fillStyle = 'rgba(120, 110, 96, 0.4)';        // dust spilling round the base
      ctx.beginPath();
      ctx.ellipse(L.x, L.y + 1.2 * u, 8 * u, 3 * u, 0, 0, Math.PI * 2); ctx.fill();

      // a snapped beam sticking out at an angle
      ctx.save();
      ctx.translate(L.x + (h3 - 0.5) * 3 * u, L.y - 1 * u);
      ctx.rotate(-0.5 - h2 * 0.6);
      ctx.fillStyle = '#7d5c33';
      ctx.fillRect(-5 * u, -0.9 * u, 11 * u, 1.8 * u);
      ctx.fillStyle = '#9a7444';
      ctx.fillRect(-5 * u, -0.9 * u, 11 * u, 0.7 * u);
      ctx.restore();

      // the chunks themselves — a little pyramid of rubble
      const chunks = [
        { dx: -4.4, dy:  0.4, w: 4.4, h: 3.0, t: '#a49a8a', f: '#8a8172', s: '#6f675c' },
        { dx:  0.6, dy:  0.8, w: 5.0, h: 2.6, t: '#b3a998', f: '#968c7d', s: '#79705f' },
        { dx: -1.8, dy: -2.4, w: 4.2, h: 2.8, t: '#a89e8d', f: '#8d8374', s: '#6f675c' },
        { dx:  2.2, dy: -3.0, w: 3.2, h: 2.2, t: '#bdb3a1', f: '#9c9283', s: '#7c7364' },
        { dx: -0.6, dy: -5.2, w: 3.0, h: 2.0, t: '#c2b8a6', f: '#a49a89', s: '#847b6c' },
      ];
      chunks.forEach((c, i) => {
        const jx = (hash(L.seed + i * 2.7) - 0.5) * 1.6;
        const x0 = L.x + (c.dx + jx) * u, y0 = L.y + c.dy * u;
        ctx.fillStyle = c.f;                             // the face
        ctx.fillRect(x0, y0 - c.h * u, c.w * u, c.h * u);
        ctx.fillStyle = c.t;                             // sunlight on top
        ctx.fillRect(x0, y0 - c.h * u, c.w * u, 0.9 * u);
        ctx.fillStyle = c.s;                             // shadow down one side
        ctx.fillRect(x0 + (c.w - 0.9) * u, y0 - c.h * u, 0.9 * u, c.h * u);
        if (i % 2 === 0) {                               // mortar line, like a brick
          ctx.fillStyle = 'rgba(90, 84, 74, 0.5)';
          ctx.fillRect(x0 + 0.4 * u, y0 - c.h * 0.45 * u, (c.w - 1.2) * u, 0.5 * u);
        }
      });
    }
  }

  // brown footprints, tracked around by whoever stepped in it
  for (const f of footprints) {
    const age = (elapsed - f.born) / 5;
    ctx.fillStyle = `rgba(107, 74, 36, ${0.55 * (1 - age)})`;
    ctx.beginPath();
    ctx.ellipse(f.x, f.y, 2.2, 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // tiny heads peeking out of every occupied shelter
  const peek = {};
  for (const p of people) {
    if (p.sheltering) {
      const k = p.sheltering.gx + ',' + p.sheltering.gy;
      peek[k] = (peek[k] || 0) + 1;
    }
  }
  for (const k in peek) {
    const parts = k.split(',');
    const px2 = parts[0] * s, py2 = TOPBAR + parts[1] * s;
    for (let i = 0; i < Math.min(3, peek[k]); i++) {
      ctx.fillStyle = '#f2c79b';
      ctx.beginPath();
      ctx.arc(px2 + s * (0.3 + i * 0.2), py2 + s * 0.88, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The critters, bless them (the hiding ones are indoors, unseen).
  // Everyone is drawn relative to `u` — one grid square — so they stay the
  // right size next to the houses however big the squares are.
  //
  // When the sky is calm they're HAPPY: bouncing, smiling, humming little
  // notes. The moment doom is on the way they're TERRIFIED: eyes like
  // dinner plates, arms in the air, wobbling. Everyone pulls a slightly
  // different face, so a crowd doesn't look like clones.
  const doom = disasters.length > 0 || pendings.length > 0;
  const HAPPY_EMOTE = ['♪', '♥', '☺'];
  const PANIC_EMOTE = ['!!', '?!', 'AAA'];

  for (const p of people) {
    if (p.sheltering) continue;
    const u = s / 26;                                // one "unit" scaled to the square
    const step = (p.fixing || p.sweeping) ? 0 : Math.sin(p.walk) * 2 * u;  // planted while working
    const facing = Math.cos(p.angle) < 0 ? -1 : 1;   // which way are they pointed?
    const hop = (p.fixing || p.sweeping) ? 0
              : doom ? Math.abs(Math.sin(p.bob)) * 2.5 * u   // panicked jitter
                     : Math.sin(p.bob) * 1.2 * u;            // happy sway
    const eyeW = doom ? 2.3 * u : 1.1 * u;           // eyes go WIDE when scared

    ctx.save();
    ctx.translate(0, -hop);                          // bounce the whole critter

    if (p.kind === 'knight') {
      ctx.fillStyle = '#3a3f4a';                     // sturdy armored legs
      ctx.fillRect(p.x - 3.4 * u, p.y - 2 * u + step, 2.6 * u, 6 * u - step);
      ctx.fillRect(p.x + 0.8 * u, p.y - 2 * u - step, 2.6 * u, 6 * u + step);
      ctx.fillStyle = '#b8c4d0';                     // shining breastplate
      rrect(p.x - 5 * u, p.y - 12 * u, 10 * u, 10 * u, 2 * u); ctx.fill();
      ctx.fillStyle = '#dde6ee';                     // shoulder shine
      ctx.fillRect(p.x - 5 * u, p.y - 12 * u, 10 * u, 3 * u);
      ctx.fillStyle = '#b8c4d0';                     // helmet
      ctx.beginPath(); ctx.arc(p.x, p.y - 15 * u, 4.5 * u, Math.PI, 0); ctx.fill();
      ctx.fillRect(p.x - 4.5 * u, p.y - 15 * u, 9 * u, 3.2 * u);
      ctx.fillStyle = '#1e2630';                     // visor slit
      ctx.fillRect(p.x - 3 * u, p.y - 14.6 * u, 6 * u, 1.6 * u);
      ctx.fillStyle = '#e8453c';                     // proud red plume
      ctx.fillRect(p.x - 1 * u, p.y - 20.5 * u, 2 * u, 5.5 * u);
      // the sword — at the ready on patrol, THRUSTING mid-clash
      ctx.save();
      ctx.translate(p.x + 5 * u * facing, p.y - 8 * u);
      if (facing === -1) ctx.scale(-1, 1);
      ctx.rotate(p.clash > 0.3 ? -0.9 : p.clash > 0 ? 0.25 : -0.5);
      ctx.fillStyle = '#5b3b1e'; ctx.fillRect(0, -1 * u, 3 * u, 2 * u);
      ctx.fillStyle = '#c9a83c'; ctx.fillRect(3 * u, -2.5 * u, 1.4 * u, 5 * u);
      ctx.fillStyle = '#e8ecf2'; ctx.fillRect(4.4 * u, -1 * u, 8 * u, 2 * u);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(4.4 * u, -1 * u, 8 * u, 0.8 * u);
      ctx.restore();
    } else if (p.kind === 'cow') {
      ctx.fillStyle = '#3b2f2a';                     // stumpy legs
      ctx.fillRect(p.x - 7 * u, p.y - 1 * u + step, 2.4 * u, 6 * u - step);
      ctx.fillRect(p.x + 4.6 * u, p.y - 1 * u - step, 2.4 * u, 6 * u + step);
      ctx.strokeStyle = '#f4f4f2'; ctx.lineWidth = 1.6 * u;   // tail with a tuft
      ctx.beginPath();
      ctx.moveTo(p.x - facing * 9 * u, p.y - 8 * u);
      ctx.lineTo(p.x - facing * 11.5 * u, p.y - 4 * u + Math.sin(p.walk) * 1.5 * u);
      ctx.stroke();
      ctx.fillStyle = '#f4f4f2';                     // big white body
      rrect(p.x - 9 * u, p.y - 10 * u, 18 * u, 10 * u, 4 * u); ctx.fill();
      ctx.fillStyle = '#2f2a28';                     // cow patches
      ctx.beginPath(); ctx.ellipse(p.x - 4 * u, p.y - 7 * u, 3.2 * u, 2.4 * u, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.x + 3 * u, p.y - 4.5 * u, 2.6 * u, 2 * u, 0, 0, Math.PI * 2); ctx.fill();
      const hx = p.x + facing * 9 * u;               // head out front
      ctx.fillStyle = '#f4f4f2';
      rrect(hx - 3.4 * u, p.y - 14 * u, 6.8 * u, 7 * u, 2.5 * u); ctx.fill();
      ctx.fillStyle = '#2f2a28';                     // little horns
      ctx.fillRect(hx - 3 * u, p.y - 15.5 * u, 1.4 * u, 2 * u);
      ctx.fillRect(hx + 1.6 * u, p.y - 15.5 * u, 1.4 * u, 2 * u);
      ctx.fillStyle = '#f0a5b8';                     // pink snout
      rrect(hx - 2.4 * u, p.y - 9.5 * u, 4.8 * u, 3 * u, 1.4 * u); ctx.fill();
      ctx.fillStyle = '#000';                        // eyes
      ctx.beginPath(); ctx.arc(hx - 1.6 * u, p.y - 11.6 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + 1.6 * u, p.y - 11.6 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      if (!doom) {                                   // chewing, always chewing
        ctx.strokeStyle = '#7cb342'; ctx.lineWidth = 1.2 * u;
        ctx.beginPath();
        ctx.moveTo(hx + facing * 2.5 * u, p.y - 8 * u);
        ctx.lineTo(hx + facing * 5 * u, p.y - 9.5 * u + Math.sin(p.walk * 3) * u);
        ctx.stroke();
      }
    } else if (p.kind === 'dog') {
      ctx.fillStyle = '#6b4b2a';                     // little legs
      ctx.fillRect(p.x - 5 * u, p.y - 1 * u + step, 2 * u, 5 * u - step);
      ctx.fillRect(p.x + 3 * u, p.y - 1 * u - step, 2 * u, 5 * u + step);
      ctx.strokeStyle = '#8a5c33'; ctx.lineWidth = 2 * u;    // tail: wags happy, tucks scared
      ctx.beginPath();
      ctx.moveTo(p.x - facing * 6.5 * u, p.y - 7 * u);
      if (doom) ctx.lineTo(p.x - facing * 8 * u, p.y - 2 * u);
      else ctx.lineTo(p.x - facing * 10 * u, p.y - 11 * u + Math.sin(p.walk * 3) * 3 * u);
      ctx.stroke();
      ctx.fillStyle = '#8a5c33';                     // body
      rrect(p.x - 6.5 * u, p.y - 8 * u, 13 * u, 7 * u, 3 * u); ctx.fill();
      const hx = p.x + facing * 7 * u;               // head
      ctx.beginPath(); ctx.arc(hx, p.y - 10.5 * u, 3.8 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5e3d20';                     // floppy ear
      ctx.beginPath();
      ctx.ellipse(hx - facing * 2 * u, p.y - 12.5 * u, 1.7 * u, 3 * u, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b2a18';                     // snout
      ctx.beginPath(); ctx.arc(hx + facing * 3 * u, p.y - 9.6 * u, 1.5 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';                        // eye
      ctx.beginPath(); ctx.arc(hx + facing * 1 * u, p.y - 11.4 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      if (!doom) {                                   // happy lolling tongue
        ctx.fillStyle = '#ff8fa3';
        ctx.fillRect(hx + facing * 2.4 * u, p.y - 8.6 * u, 1.6 * u, 2.6 * u);
      }
    } else {
      ctx.fillStyle = '#333';                        // busy little legs
      ctx.fillRect(p.x - 3 * u, p.y - 2 * u + step, 2 * u, 5 * u - step);
      ctx.fillRect(p.x + 1 * u, p.y - 2 * u - step, 2 * u, 5 * u + step);
      ctx.fillStyle = p.shirt;                       // shirt
      rrect(p.x - 4 * u, p.y - 10 * u, 8 * u, 9 * u, 1.6 * u); ctx.fill();
      // ARMS: straight up in a panic, hammering when fixing, else swinging
      ctx.strokeStyle = '#f2c79b'; ctx.lineWidth = 1.8 * u;
      ctx.beginPath();
      if (doom) {
        ctx.moveTo(p.x - 4 * u, p.y - 9 * u); ctx.lineTo(p.x - 6.5 * u, p.y - 15 * u);
        ctx.moveTo(p.x + 4 * u, p.y - 9 * u); ctx.lineTo(p.x + 6.5 * u, p.y - 15 * u);
      } else if (p.sweeping) {
        // SWEEPING UP. Both hands on the broom, pushing it back and forth
        // over the mess, with little puffs of dust coming off it.
        const k = p.workSide || 1;
        const push = Math.sin(p.broom || 0);            // -1 back, +1 forward
        const hx = p.x + k * (4 + push * 2.5) * u, hy = p.y - 7 * u;
        const bx3 = p.x + k * (10 + push * 3.5) * u, by3 = p.y - 0.5 * u;
        ctx.moveTo(p.x + k * 3 * u, p.y - 9 * u); ctx.lineTo(hx, hy);
        ctx.moveTo(p.x - k * 3 * u, p.y - 9 * u); ctx.lineTo(hx - k * 1.5 * u, hy + 1.5 * u);
        ctx.stroke();
        // a MOP for water, a broom for everything else
        ctx.strokeStyle = p.mopping ? '#b9c4cc' : '#8a6a3a';        // handle
        ctx.lineWidth = 1.3 * u;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(bx3, by3); ctx.stroke();
        ctx.save();
        ctx.translate(bx3, by3);
        ctx.rotate(Math.atan2(by3 - hy, bx3 - hx));
        if (p.mopping) {
          ctx.fillStyle = '#e6e2d6';                                 // stringy mop head
          ctx.beginPath();
          ctx.ellipse(1.5 * u, 0, 2.6 * u, 3.2 * u, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#cfcabb'; ctx.lineWidth = 0.5 * u;
          for (let i = -2; i <= 2; i++) {
            ctx.beginPath();
            ctx.moveTo(0.6 * u, i * 1.1 * u); ctx.lineTo(4 * u, i * 1.4 * u);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = '#d8b45c';                                 // bristles
          ctx.fillRect(0, -2.2 * u, 3.4 * u, 4.4 * u);
        }
        ctx.restore();
        if (push > 0.6) {                        // a puff of dust, or a splash
          ctx.fillStyle = p.mopping ? 'rgba(150, 205, 255, 0.5)'
                                    : 'rgba(210, 200, 180, 0.45)';
          ctx.beginPath();
          ctx.arc(bx3 + k * 3 * u, by3 - 1 * u, 2.2 * u, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.beginPath();                             // (restart path for the stroke below)
      } else if (p.fixing) {
        // Hammer on whichever side the building is — so a worker on the
        // right of a house swings to their LEFT, and vice versa.
        const k = p.workSide || 1;
        const sw = Math.abs(Math.sin(p.hammer || 0));  // the swing, 0=down 1=up
        const hy2 = p.y - 9 * u - sw * 7 * u;
        ctx.moveTo(p.x + k * 4 * u, p.y - 9 * u); ctx.lineTo(p.x + k * 7 * u, hy2);
        ctx.moveTo(p.x - k * 4 * u, p.y - 9 * u); ctx.lineTo(p.x - k * 6 * u, p.y - 6 * u);
        ctx.stroke();
        ctx.strokeStyle = '#6d5330'; ctx.lineWidth = 1.4 * u;   // hammer handle
        ctx.beginPath();
        ctx.moveTo(p.x + k * 7 * u, hy2); ctx.lineTo(p.x + k * 9.5 * u, hy2 - 3 * u);
        ctx.stroke();
        ctx.fillStyle = '#9aa3ad';                              // hammer head
        ctx.fillRect(p.x + k * 8.6 * u - (k < 0 ? 3.4 * u : 0), hy2 - 5 * u, 3.4 * u, 2.4 * u);
        if (sw < 0.15) {                                        // CLANK! sparks
          ctx.fillStyle = '#ffe9a8';
          ctx.font = `bold ${Math.max(7, 8 * u)}px monospace`;
          ctx.textAlign = k > 0 ? 'left' : 'right';
          ctx.fillText('✦', p.x + k * 10 * u, hy2 - 5 * u);
        }
        ctx.beginPath();                             // (restart path for the stroke below)
      } else {
        ctx.moveTo(p.x - 4 * u, p.y - 9 * u); ctx.lineTo(p.x - 6 * u, p.y - 5 * u + step);
        ctx.moveTo(p.x + 4 * u, p.y - 9 * u); ctx.lineTo(p.x + 6 * u, p.y - 5 * u - step);
      }
      ctx.strokeStyle = '#f2c79b'; ctx.lineWidth = 1.8 * u;
      ctx.stroke();
      const hy = p.y - 13.5 * u;                     // head
      ctx.fillStyle = '#f2c79b';
      ctx.beginPath(); ctx.arc(p.x, hy, 3.8 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';                        // eyes
      ctx.beginPath(); ctx.arc(p.x - 1.5 * u, hy - 0.5 * u, eyeW * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + 1.5 * u, hy - 0.5 * u, eyeW * 0.7, 0, Math.PI * 2); ctx.fill();
      if (doom) {                                    // a big round screaming mouth
        ctx.fillStyle = '#7a2230';
        ctx.beginPath(); ctx.ellipse(p.x, hy + 1.8 * u, 1.3 * u, 1.7 * u, 0, 0, Math.PI * 2); ctx.fill();
      } else {                                       // a little smile + rosy cheeks
        ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 0.9 * u;
        ctx.beginPath(); ctx.arc(p.x, hy + 0.6 * u, 1.9 * u, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 140, 140, 0.55)';
        ctx.beginPath(); ctx.arc(p.x - 3 * u, hy + 1 * u, 1 * u, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x + 3 * u, hy + 1 * u, 1 * u, 0, Math.PI * 2); ctx.fill();
      }
    }

    // the little floating emote above their head
    ctx.font = `bold ${Math.max(7, 9 * u)}px monospace`;
    ctx.textAlign = 'center';
    if (doom) {
      ctx.fillStyle = '#ff4757';
      ctx.fillText(PANIC_EMOTE[p.fear], p.x, p.y - 19 * u + Math.sin(p.bob * 2) * u);
    } else if (Math.sin(p.bob * 0.5 + p.mood) > 0.72) {   // only now and then
      ctx.fillStyle = '#ffe9a8';
      ctx.fillText(HAPPY_EMOTE[p.mood], p.x + 5 * u, p.y - 18 * u);
    }
    ctx.restore();
  }

  // ---- THE BAD GUYS — dark clothes, masks, clubs, no manners ----
  for (const b of badGuys) {
    const step = Math.sin(b.walk) * 2.5;
    const facing = Math.cos(b.angle) < 0 ? -1 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';                 // shadow
    ctx.beginPath();
    ctx.ellipse(b.x, b.y + 4, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1e1e26';                         // stompy boots
    ctx.fillRect(b.x - 4.5, b.y - 2 + step, 3, 6 - step);
    ctx.fillRect(b.x + 1.5, b.y - 2 - step, 3, 6 + step);
    ctx.fillStyle = '#2c2c38';                         // dark villain coat
    ctx.fillRect(b.x - 6, b.y - 14, 12, 13);
    ctx.fillStyle = '#f2c79b';                         // head
    ctx.beginPath(); ctx.arc(b.x, b.y - 18, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e1e26';                         // the mask band
    ctx.fillRect(b.x - 5, b.y - 20.5, 10, 4);
    ctx.fillStyle = '#ff4757';                         // mean glowing eyes
    ctx.fillRect(b.x - 3.5 + facing, b.y - 19.5, 2, 2);
    ctx.fillRect(b.x + 1.5 + facing, b.y - 19.5, 2, 2);
    // THE CLUB — raised high on the wind-up, SLAMMED on the swing
    ctx.save();
    ctx.translate(b.x + 6 * facing, b.y - 12);
    if (facing === -1) ctx.scale(-1, 1);
    ctx.rotate(b.swing > 0.4 ? -1.8 : b.swing > 0 ? -0.2 : -0.9 + Math.sin(b.walk) * 0.1);
    ctx.fillStyle = '#5b3b1e';
    ctx.fillRect(0, -2, 12, 3.5);
    ctx.fillStyle = '#6d4a26';
    ctx.beginPath(); ctx.arc(13, -0.2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // the full-body EWWW of somebody who just stepped in it
  for (const p of people) {
    if (!(p.ick > 0) || p.sheltering) continue;
    const wob = Math.sin(elapsed * 24) * 3;
    ctx.fillStyle = '#aef28b';                       // little stink squiggles
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('~', p.x - 6, p.y - 26 + wob * 0.4);
    ctx.fillText('~', p.x + 6, p.y - 28 - wob * 0.4);
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('EW!!', p.x, p.y - 34 + wob * 0.3);
  }

  // folk currently airborne (they're fine. probably.) — same scale as on foot
  for (const f of launchedFolk) {
    const u = s / 26;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.spin);
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.shirt;
    ctx.fillRect(-4 * u, -6 * u, 8 * u, 9 * u);
    ctx.fillStyle = '#f2c79b';
    ctx.beginPath(); ctx.arc(0, -9 * u, 3.5 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // flying debris (the fun part)
  for (const d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.spin);
    ctx.globalAlpha = Math.max(0, d.life / 1.2);
    ctx.fillStyle = d.color;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ---- DRAWING ALL THE DOOM CURRENTLY HAPPENING ----
  for (const D of disasters) {

    if (D.type === 'tornado') {
      // a stack of spinning gray rings, wide up top, narrow at the ground
      for (let ring = 0; ring < 7; ring++) {
        const ry = D.y - ring * 22;
        const rw = 14 + ring * 11 + Math.sin(elapsed * 9 + ring) * 5;
        ctx.fillStyle = `rgba(180, 185, 195, ${0.5 - ring * 0.04})`;
        ctx.beginPath();
        ctx.ellipse(D.x + Math.sin(elapsed * 7 + ring * 1.3) * 7, ry, rw, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (D.type === 'meteors') {
      for (const m of D.meteors) {
        // the fiery trail behind it
        ctx.strokeStyle = 'rgba(255, 159, 67, 0.5)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(m.x + 55, m.y - 130);
        ctx.lineTo(m.x, m.y);
        ctx.stroke();
        // the fireball itself
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath(); ctx.arc(m.x, m.y, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.arc(m.x + 3, m.y - 3, 7, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (D.type === 'quake') {
      // THE GROUND SPLITS APART. Each crack is drawn in layers: a pale ridge
      // of earth shoved up along one side, then the dark gash itself, then a
      // black core so you can see how DEEP it goes. They tear open outward
      // from the epicentre rather than just appearing.
      const g = D.grow || 0;
      const cracks = D.cracks || [];
      const drawCrack = (crack, width, style) => {
        const pts = crack.pts;
        const upto = 1 + g * (pts.length - 1);        // how far it's torn so far
        const whole = Math.floor(upto);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i <= Math.min(whole, pts.length - 1); i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        if (whole < pts.length - 1) {                 // the ragged growing tip
          const f = upto - whole, a = pts[whole], b = pts[whole + 1];
          ctx.lineTo(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f);
        }
        ctx.strokeStyle = style;
        ctx.lineWidth = width * crack.wide;
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';
        ctx.stroke();
      };
      // 1. earth heaped up along the crack, offset a touch so it reads as 3D
      ctx.save();
      ctx.translate(-s * 0.06, -s * 0.09);
      for (const c of cracks) drawCrack(c, s * 0.42, 'rgba(120, 96, 60, 0.55)');
      ctx.restore();
      // 2. the gash
      for (const c of cracks) drawCrack(c, s * 0.34, 'rgba(46, 34, 20, 0.92)');
      // 3. the black depths of it
      for (const c of cracks) drawCrack(c, s * 0.16, 'rgba(6, 4, 2, 0.95)');
      // 4. a hot glint far down, flickering
      ctx.globalAlpha = 0.25 + Math.sin(elapsed * 9) * 0.12;
      for (const c of cracks) drawCrack(c, s * 0.05, '#c25a1e');
      ctx.globalAlpha = 1;

      // dust thrown up along the cracks
      for (const c of cracks) {
        const pts = c.pts;
        for (let i = 0; i < pts.length; i++) {
          if (i / (pts.length - 1) > g) break;
          const puff = (elapsed * 1.4 + i * 0.7 + D.seed) % 1.6;
          if (puff > 1) continue;
          ctx.fillStyle = `rgba(158, 138, 106, ${0.3 * (1 - puff)})`;
          ctx.beginPath();
          ctx.arc(pts[i].x + Math.sin(i * 2.3 + elapsed) * s * 0.12,
                  pts[i].y - puff * s * 0.9,
                  s * (0.14 + puff * 0.3), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // the shockwave rolling out from where it started
      if (g < 1) {
        ctx.strokeStyle = `rgba(220, 200, 160, ${0.35 * (1 - g)})`;
        ctx.lineWidth = s * 0.12;
        ctx.beginPath();
        ctx.arc(D.ex, D.ey, g * gridH() * 0.55, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    if (D.type === 'flood') {
      // the rising water, with a wavy crest — only over the town
      const fw = gridW(), fb = TOPBAR + gridH();
      ctx.fillStyle = 'rgba(60, 130, 200, 0.55)';
      ctx.beginPath();
      ctx.moveTo(0, D.waterY);
      for (let wx2 = 0; wx2 <= fw; wx2 += 30) {
        ctx.lineTo(wx2, D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6);
      }
      ctx.lineTo(fw, fb);
      ctx.lineTo(0, fb);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let wx2 = 0; wx2 <= fw; wx2 += 30) {
        const wy2 = D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6;
        if (wx2 === 0) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
      }
      ctx.stroke();
    }

    if (D.type === 'balls') {
      for (const ball of D.balls) {
        // a little motion trail behind each ball
        ctx.strokeStyle = ball.color + '66';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(ball.x - ball.vx * 0.06, ball.y - ball.vy * 0.06);
        ctx.lineTo(ball.x, ball.y);
        ctx.stroke();
        // the ball itself, with a shiny spot
        ctx.fillStyle = ball.color;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(ball.x - 5, ball.y - 5, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  ctx.restore();   // stop shaking for the buttons — the UI stays calm

  // the top bar background (two rows)
  ctx.fillStyle = '#10161d';
  ctx.fillRect(0, 0, canvas.width, TOPBAR);

  // --- ROW 1: the money chip, just right of the ← Arcade pill ---
  const money = moneyChipRect();
  const flashing = (brokeFlash > 0 && Math.sin(brokeFlash * 30) > 0);
  ctx.fillStyle = '#1c2530';
  rrect(money.x, money.y, money.w, money.h, 8); ctx.fill();
  ctx.strokeStyle = flashing ? '#ff5046' : '#3a4654'; ctx.lineWidth = 2;
  rrect(money.x, money.y, money.w, money.h, 8); ctx.stroke();
  ctx.fillStyle = flashing ? '#ff5046' : '#ffd23f';
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`💰 ${moneys}`, money.x + money.w / 2, money.y + money.h / 2 + 5);

  // --- the FULLSCREEN button, top-right: four little corner brackets ---
  const fb = fullBtnRect();
  ctx.fillStyle = '#1c2530';
  rrect(fb.x, fb.y, fb.w, fb.h, 8); ctx.fill();
  ctx.strokeStyle = '#3a4654'; ctx.lineWidth = 2;
  rrect(fb.x, fb.y, fb.w, fb.h, 8); ctx.stroke();
  ctx.strokeStyle = '#cfe3ff'; ctx.lineWidth = 2;
  const fcx = fb.x + fb.w / 2, fcy = fb.y + fb.h / 2;
  const out = isFullscreen() ? -1 : 1;      // arrows point in when already fullscreen
  for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    const ax = fcx + sx * 8, ay = fcy + sy * 7;
    ctx.beginPath();
    ctx.moveTo(ax - sx * out * 5, ay);
    ctx.lineTo(ax, ay);
    ctx.lineTo(ax, ay - sy * out * 5);
    ctx.stroke();
  }

  // --- ROW 2: the three drop-down buttons: Build, Disasters, People ---
  const palette = {
    build:     { bg: '#24343a', border: '#4f9d6b' },
    disasters: { bg: '#7a1f2b', border: '#ff6b5e' },
    people:    { bg: '#26473b', border: '#7ddf8f' },
    qty:       { bg: '#1d3a4a', border: '#7dd3ff' },
  };
  for (const b of topButtons()) {
    const col = palette[b.key];
    const open = openMenu === b.key;
    ctx.fillStyle = open ? col.border : col.bg;
    rrect(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = col.border; ctx.lineWidth = 2;
    rrect(b.x, b.y, b.w, b.h, 9); ctx.stroke();
    ctx.fillStyle = open ? '#10161d' : '#ffffff';
    ctx.textAlign = 'center';
    // full label if it fits; otherwise shrink, and only drop the word as a
    // last resort on a really tiny screen
    let cap = b.icon + ' ' + b.word + (b.menu ? ' ▾' : '');
    let fs = fitFont(cap, b.w - 14, 16, 11);
    if (ctx.measureText(cap).width > b.w - 14) {
      cap = b.icon + (b.menu ? ' ▾' : '');
      fs = fitFont(cap, b.w - 14, 16, 10);
    }
    ctx.fillText(cap, b.x + b.w / 2, b.y + b.h / 2 + fs * 0.35);
  }

  // --- the open drop-down list, if any ---
  if (openMenu) {
    const costly = openMenu === 'disasters';         // only disasters have a price
    for (const r of menuRects(openMenu)) {
      const canAfford = !costly || moneys >= r.cost * qty;
      const chosen = openMenu === 'build' && selected === r.type;
      ctx.fillStyle = chosen ? '#3d6b30' : canAfford ? '#24343a' : '#2c2126';
      rrect(r.x, r.y, r.w, r.h, 8); ctx.fill();
      ctx.strokeStyle = chosen ? '#7ddf8f' : canAfford ? '#3a4654' : '#5a4a4e';
      ctx.lineWidth = 2;
      rrect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
      ctx.fillStyle = canAfford ? '#ffffff' : '#8a7a7e';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(r.label, r.x + 12, r.y + r.h / 2 + 5);
      if (costly) {                         // disasters show their price on the right
        ctx.textAlign = 'right';
        ctx.fillStyle = canAfford ? '#ffd23f' : '#8a7a7e';
        ctx.fillText(`${r.cost * qty}💰`, r.x + r.w - 12, r.y + r.h / 2 + 5);
      }
    }
  }

  // --- STOP BUILDING, bottom centre, only while you're placing something ---
  const sb = stopBuildRect();
  if (sb) {
    ctx.fillStyle = '#1d3a4a';
    rrect(sb.x, sb.y, sb.w, sb.h, 10); ctx.fill();
    ctx.strokeStyle = '#7dd3ff'; ctx.lineWidth = 2;
    rrect(sb.x, sb.y, sb.w, sb.h, 10); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('✋ Stop Building', sb.x + sb.w / 2, sb.y + sb.h / 2 + 5);
  }

  // --- the STATUS BOX at the bottom: a readable box for the latest news ---
  if ((statusSticky || statusTimer > 0) && statusText) {
    // shrink the text just enough to always fit on a narrow phone
    let fs = 15;
    ctx.font = `bold ${fs}px monospace`;
    let tw = ctx.measureText(statusText).width;
    const maxTextW = canvas.width - 44;
    if (tw > maxTextW) {
      fs = Math.max(10, Math.floor(fs * maxTextW / tw));
      ctx.font = `bold ${fs}px monospace`;
      tw = ctx.measureText(statusText).width;
    }
    const boxW = tw + 30, boxH = 34;
    // sit above the Stop Building button when it's showing, so they never overlap
    const bottom = sb ? sb.y - 8 : canvas.height - 14;
    const bx = (canvas.width - boxW) / 2, by = bottom - boxH;
    ctx.globalAlpha = statusSticky ? 1 : Math.min(1, statusTimer / 0.5);   // news fades, notes stay
    ctx.fillStyle = 'rgba(10, 14, 20, 0.9)';
    rrect(bx, by, boxW, boxH, 10); ctx.fill();
    ctx.strokeStyle = statusColor; ctx.lineWidth = 2;
    rrect(bx, by, boxW, boxH, 10); ctx.stroke();
    ctx.fillStyle = statusColor; ctx.textAlign = 'center';
    ctx.fillText(statusText, canvas.width / 2, by + boxH / 2 + 5);
    ctx.globalAlpha = 1;
  }

  // the destruction scoreboard, tucked top-left under the bar
  // (hidden while a drop-down is open so it can't show through the menu)
  if ((destroyed > 0 || peopleLaunched > 0 || repaired > 0 || carsPopped > 0 || tidied > 0) && !openMenu) {
    ctx.fillStyle = 'rgba(255, 159, 67, 0.9)';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`💥 ${destroyed}  🚀 ${peopleLaunched}  🔧 ${repaired}  🚗 ${carsPopped}  🧹 ${tidied}`,
                 12, TOPBAR + 18);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
