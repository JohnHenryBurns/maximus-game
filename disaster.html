<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Amos's Disaster Builder</title>
<style>
  html, body { margin: 0; background: #1a2530; height: 100%; overflow: hidden; }
  canvas { display: block; }
  /* Back-to-arcade pill, the same look the other games use. */
  #back {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    color: #ffe0c4; background: rgba(24, 14, 28, 0.6);
    border: 1px solid rgba(255, 200, 150, 0.4);
    font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 12px; border-radius: 999px; text-decoration: none; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
  }
  #back:hover, #back:active {
    transform: scale(1.05); border-color: rgba(255, 200, 150, 0.85); background: rgba(40, 22, 44, 0.75);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">&larr; Arcade</a>
<script>
// =====================================================================
// AMOS'S DISASTER BUILDER
//
// Two great joys of being human:
//   1. building a beautiful town
//   2. pressing the button that summons a tornado to eat it
// This game has both.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------
// THE WORLD — a grid of cells, like graph paper. Every cell holds one
// thing: nothing (0), a house (1), a tree (2), or a stone block (3).
// ---------------------------------------------------------------------
const COLS = 44, ROWS = 26;
let cell = 34;                      // pixel size of one grid square
// Room at the top for the toolbar. It's two tiers now (money + THE MACHINE
// on top, the build palette in a full-width row below) so everything fits on
// a phone instead of running off the side.
const TOPBAR = 92;

// ---------------------------------------------------------------------
// THE CAMERA — lets you zoom in to build with detail, then slide around.
//   zoom = 1  ->  the whole town fits on screen (all the way zoomed out)
//   zoom = 4  ->  four times closer, for placing tiny blocks just so
// panX/panY are how far we've slid the zoomed view left/right and up/down.
// At zoom 1 the camera does nothing at all, so the game looks exactly the
// same until you actually pinch or scroll to zoom in.
// ---------------------------------------------------------------------
let zoom = 1;
let panX = 0, panY = 0;
const MAX_ZOOM = 4;

// make the grid: ROWS rows, each row is COLS zeros (all empty land)
const grid = [];
for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0));

const EMPTY = 0, HOUSE = 1, TREE = 2, STONE = 3, APT = 4, BUNKER = 5;

// what's selected in the palette right now
let selected = HOUSE;

// ---------------------------------------------------------------------
// LITTLE PEOPLE — they live in your town. they have no idea.
// ---------------------------------------------------------------------
let people = [];
let launchedFolk = [];     // people currently flying through the air (they're fine)
let peopleLaunched = 0;

function spawnPeople() {
  for (let i = 0; i < 5 && people.length < 40; i++) {
    people.push({
      x: 30 + Math.random() * (canvas.width - 60),
      y: TOPBAR + 30 + Math.random() * (canvas.height - TOPBAR - 90),
      angle: Math.random() * 6.28,
      walk: Math.random() * 6.28,
      shirt: ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#2ecc71', '#e67e22'][Math.floor(Math.random() * 6)],
    });
  }
}

function peopleButtonRect() {
  return { x: canvas.width - 210, y: canvas.height - 64, w: 200, h: 52 };
}

// scoreboard of destruction
let destroyed = 0;

// THE ECONOMY. You start with 30 MONEYS. Disasters cost MONEYS.
// Every block a disaster smashes pays you 1 MONEY. Yes, really.
// Destruction is a business.
let moneys = 30;
let brokeFlash = 0;    // flashes when you try to buy doom you can't afford

// ---------------------------------------------------------------------
// THE DISASTERS — one at a time, chosen from THE MACHINE's menu.
// null means the world is at peace. For now.
// ---------------------------------------------------------------------
let disasters = [];                 // ALL currently-active catastrophes. yes, plural.
let debris = [];                    // flying bits of what used to be a town
let craters = [];                   // meteor scars. they never heal.
let shake = 0;                      // screen trembles while disaster reigns
let elapsed = 0;
let machineOpen = false;            // is the disaster menu showing?

function summonDisaster(type) {
  if (disasters.length >= 8) return;   // even chaos has a fire code
  const item = MACHINE_MENU.find(m => m.type === type);
  if (moneys < item.cost) {            // doom costs MONEYS, friend
    brokeFlash = 1.5;
    return;
  }
  moneys -= item.cost;
  if (type === 'tornado') {
    disasters.push({ type, x: -60, y: TOPBAR + Math.random() * (canvas.height - TOPBAR),
                     life: 12, wobble: Math.random() * 6.28 });
  } else if (type === 'meteors') {
    disasters.push({ type, life: 8, spawnTimer: 0, meteors: [] });
  } else if (type === 'quake') {
    disasters.push({ type, life: 6, seed: Math.random() * 100 });
  } else if (type === 'flood') {
    disasters.push({ type, life: 10, waterY: canvas.height + 50 });
  } else if (type === 'balls') {
    // 10 rubber balls, dropped from above, each with its own direction
    const balls = [];
    const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81',
                    '#eccc68', '#7bed9f', '#70a1ff', '#ff7f50', '#a29bfe'];
    for (let i = 0; i < 10; i++) {
      balls.push({
        x: 60 + Math.random() * (canvas.width - 120),
        y: TOPBAR - 40 - Math.random() * 250,        // starting up in the sky
        vx: (Math.random() < 0.5 ? -1 : 1) * (220 + Math.random() * 220),
        vy: 250 + Math.random() * 200,
        color: colors[i],
      });
    }
    disasters.push({ type, life: 3.8, balls });
  }
}

// one block, smashed: emptied from the grid, launched as flying bits
function smashBlock(gx, gy, bx, by, splash) {
  const kind = grid[gy][gx];
  grid[gy][gx] = EMPTY;
  destroyed++;
  moneys += kind === APT ? 3 : 1;    // apartments pay TRIPLE. big building, big payout.
  for (let i = 0; i < 6; i++) {
    debris.push({
      x: bx, y: by,
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 500 - 100,
      spin: Math.random() * 10,
      life: 1.2,
      color: splash ? '#5da3e0'
           : kind === TREE ? '#3f8a3f' : kind === STONE ? '#8a8d94'
           : kind === APT ? '#5a6a7a' : '#b5563c',
    });
  }
}

// ---------------------------------------------------------------------
// PLACING BLOCKS — turn a screen position into a grid square
// ---------------------------------------------------------------------
function cellSize() {
  // the grid stretches to fit whatever screen we're on
  return Math.min(canvas.width / COLS, (canvas.height - TOPBAR) / ROWS);
}

// The camera slides and scales what we DRAW, so a finger tap on the glass
// isn't the same spot in the town anymore. screenToWorld undoes the camera:
// give it where you touched, it tells you which spot of the town that is.
function screenToWorld(sx, sy) {
  return {
    x: (sx - panX) / zoom,
    y: (sy - TOPBAR - panY) / zoom + TOPBAR,
  };
}

// Keep the view glued to the town: never let a background gap show at the
// edges. The more we're zoomed in, the further we're allowed to slide.
function clampPan() {
  const PW = canvas.width, PH = canvas.height - TOPBAR;
  panX = Math.min(0, Math.max(-(zoom - 1) * PW, panX));
  panY = Math.min(0, Math.max(-(zoom - 1) * PH, panY));
}
// after the window resizes (fitCanvas already ran), tidy the view back onto
// the town so a rotate or resize can't leave a gap at the edge
addEventListener('resize', clampPan);

// Change the zoom while keeping one spot of the town pinned under a finger
// (or the mouse). worldPt is that spot; (sx, sy) is where it should stay on
// screen. This is what makes pinch-zoom feel like you're grabbing the map.
function setCamera(newZoom, worldPt, sx, sy) {
  zoom = Math.min(MAX_ZOOM, Math.max(1, newZoom));
  panX = sx - zoom * worldPt.x;
  panY = sy - TOPBAR - zoom * (worldPt.y - TOPBAR);
  clampPan();
}

function placeAt(px, py) {
  const w = screenToWorld(px, py);  // where in the town did we really touch?
  const s = cellSize();
  const gx = Math.floor(w.x / s);
  const gy = Math.floor((w.y - TOPBAR) / s);
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
  grid[gy][gx] = selected;          // EMPTY works as the eraser
}

// ---------------------------------------------------------------------
// THE BUTTONS along the top (palette + THE MACHINE)
// ---------------------------------------------------------------------
// the build PALETTE (THE MACHINE is its own button, laid out separately)
const buttons = [
  { icon: '🏠', short: 'House',  type: HOUSE },
  { icon: '🏢', short: 'Apt',    type: APT },
  { icon: '🌳', short: 'Tree',   type: TREE },
  { icon: '🪨', short: 'Stone',  type: STONE },
  { icon: '🛡', short: 'Bunker', type: BUNKER },
  { icon: '❌', short: 'Erase',  type: EMPTY },
];

// A narrow phone can't fit big buttons and their text, so the palette buttons
// shrink and drop to just an icon + tiny label when there isn't room.
function paletteRects() {
  const n = buttons.length, gap = 6, pad = 8;
  const w = Math.min(150, (canvas.width - pad * 2 - gap * (n - 1)) / n);
  const total = w * n + gap * (n - 1);
  const startX = (canvas.width - total) / 2;
  const y = 46, h = TOPBAR - y - 6;                 // the lower tier
  const compact = w < 118;                          // no room for the full "🏠 House"
  return buttons.map((b, i) => ({ ...b, x: startX + i * (w + gap), y, w, h, compact }));
}

// THE MACHINE lives in the top tier, top-right. It shrinks on a phone.
function machineBtnRect() {
  const narrow = canvas.width < 620;
  const w = narrow ? 138 : 200;
  return { x: canvas.width - w - 8, y: 8, w, h: 30,
           machine: true, label: narrow ? '🌪 MACHINE' : '🌪 THE MACHINE' };
}

// the machine's dial of doom
const MACHINE_MENU = [
  { label: '🌪 Tornado',      type: 'tornado', cost: 10 },
  { label: '☄ Meteors',       type: 'meteors', cost: 15 },
  { label: '💥 Earthquake',   type: 'quake',   cost: 8 },
  { label: '🌊 Flood',        type: 'flood',   cost: 12 },
  { label: '🔴 Rubber Balls', type: 'balls',   cost: 9 },
];

function machineRects() {
  const rects = [];
  const w = Math.min(220, canvas.width - 16), h = 44;
  for (let i = 0; i < MACHINE_MENU.length; i++) {
    rects.push({ ...MACHINE_MENU[i],
      x: canvas.width - w - 8, y: TOPBAR + 8 + i * (h + 6), w, h });
  }
  return rects;
}

function pressAt(px, py) {
  // if the machine menu is open, its buttons get first dibs
  if (machineOpen) {
    for (const r of machineRects()) {
      if (px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) {
        summonDisaster(r.type);
        return true;
      }
    }
  }
  // the SPAWN PEOPLE button in the bottom-right corner
  const pb = peopleButtonRect();
  if (px > pb.x && px < pb.x + pb.w && py > pb.y && py < pb.y + pb.h) {
    spawnPeople();
    return true;
  }
  if (py > TOPBAR) { machineOpen = false; return false; }   // clicked the world
  // THE MACHINE button opens/closes its menu of doom
  const mb = machineBtnRect();
  if (px > mb.x && px < mb.x + mb.w && py > mb.y && py < mb.y + mb.h) {
    machineOpen = !machineOpen;
    return true;
  }
  // a palette button picks what you paint
  for (const r of paletteRects()) {
    if (px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) {
      selected = r.type; machineOpen = false;
      return true;
    }
  }
  return true;                      // clicked the bar but no button — do nothing
}

// ---------------------------------------------------------------------
// INPUT — mouse and touch both paint blocks while held down
// ---------------------------------------------------------------------
let painting = false;
// Taps on the Arcade link are left alone so the link actually navigates.
function onBackButton(e) { return e.target && e.target.closest && e.target.closest('#back'); }
addEventListener('mousedown', e => {
  if (onBackButton(e)) return;
  if (!pressAt(e.clientX, e.clientY)) { painting = true; placeAt(e.clientX, e.clientY); }
});
addEventListener('mousemove', e => { if (painting) placeAt(e.clientX, e.clientY); });
addEventListener('mouseup', () => { painting = false; });

// MOUSE WHEEL / TRACKPAD ZOOM. Scroll up over the town to zoom in toward
// the pointer, scroll down to zoom back out. We keep the spot under the
// cursor pinned so it feels like leaning in, not jumping.
addEventListener('wheel', e => {
  if (onBackButton(e)) return;
  if (e.clientY <= TOPBAR) return;             // leave the toolbar alone
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  setCamera(zoom * factor, screenToWorld(e.clientX, e.clientY), e.clientX, e.clientY);
}, { passive: false });

// PINCH TO ZOOM. Two fingers on the glass = grab the map: spread apart to
// zoom in, pinch together to zoom out, and slide both fingers to pan. One
// finger still paints blocks like before.
let pinch = null;   // remembers the two-finger gesture between frames, or null

// distance between the two fingers, and the point exactly between them
function twoFinger(e) {
  const a = e.touches[0], b = e.touches[1];
  return {
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2,
  };
}

addEventListener('touchstart', e => {
  if (onBackButton(e)) return;                 // don't preventDefault - let the link work
  e.preventDefault();
  if (e.touches.length >= 2) {                 // two fingers down: start a pinch, don't paint
    painting = false;
    pinch = twoFinger(e);
    return;
  }
  const t = e.changedTouches[0];
  if (!pressAt(t.clientX, t.clientY)) { painting = true; placeAt(t.clientX, t.clientY); }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length >= 2) {        // mid-pinch: zoom + pan together
    const now = twoFinger(e);
    // the town spot under the OLD midpoint should land under the NEW one
    const anchor = screenToWorld(pinch.x, pinch.y);
    setCamera(zoom * (now.dist / pinch.dist), anchor, now.x, now.y);
    pinch = now;
    return;
  }
  const t = e.changedTouches[0];
  if (painting) placeAt(t.clientX, t.clientY);
}, { passive: false });
addEventListener('touchend', e => {
  painting = false;
  if (e.touches.length < 2) pinch = null;      // pinch is over once a finger lifts
});

// number keys pick from the palette too
addEventListener('keydown', e => {
  if (e.key === '1') selected = HOUSE;
  if (e.key === '2') selected = APT;
  if (e.key === '3') selected = TREE;
  if (e.key === '4') selected = STONE;
  if (e.key === '5') selected = BUNKER;
  if (e.key === '6') selected = EMPTY;
  if (e.key.toLowerCase() === 'd') machineOpen = !machineOpen;   // D for DISASTER menu
  if (e.key.toLowerCase() === 'p') spawnPeople();                // P for PEOPLE
  if (e.key === '0') { zoom = 1; panX = 0; panY = 0; }           // 0 zooms back out to the whole town
});

// ---------------------------------------------------------------------
// UPDATE — the tornado wanders and EATS
// ---------------------------------------------------------------------
let lastTime = 0;
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake -= dt;
  if (brokeFlash > 0) brokeFlash -= dt;

  for (const D of disasters) {      // every active disaster does its thing
    D.life -= dt;
    const s = cellSize();

    if (D.type === 'tornado') {
      // tornadoes HUNT HOUSES. Find the nearest one still standing...
      let target = null, best = 999999;
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          const d2 = Math.hypot(bx - D.x, by - D.y);
          if (d2 < best) { best = d2; target = { x: bx, y: by }; }
        }
      }
      D.wobble += dt * 1.7;
      if (target) {
        // ...and weave drunkenly toward its doom
        const ang = Math.atan2(target.y - D.y, target.x - D.x);
        D.x += Math.cos(ang) * 115 * dt + Math.sin(D.wobble) * 45 * dt;
        D.y += Math.sin(ang) * 115 * dt + Math.cos(D.wobble) * 45 * dt;
      } else {
        D.x += 150 * dt;   // no houses left — it spins away, satisfied
      }
      D.y = Math.max(TOPBAR + 40, Math.min(canvas.height - 40, D.y));
      shake = 0.2;
      // it ONLY eats housing (houses AND apartments) — trees and stone
      // just get a wild hairdo
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          if (Math.hypot(bx - D.x, by - D.y) < 70) smashBlock(gx, gy, bx, by);
        }
      }
      if (D.life <= 0 || D.x > canvas.width + 80) D.done = true;
    }

    if (D.type === 'meteors') {
      shake = Math.max(shake, 0.1);
      D.spawnTimer -= dt;
      if (D.spawnTimer <= 0) {
        D.spawnTimer = 0.45;                    // a new fireball every half second
        D.meteors.push({
          x: Math.random() * canvas.width + 120,
          y: TOPBAR - 60,
          ty: TOPBAR + 40 + Math.random() * (ROWS * s - 80),
        });
      }
      for (const m of D.meteors) {
        m.x -= 260 * dt;                        // falling at a slant
        m.y += 620 * dt;
        if (m.y >= m.ty) {
          m.hit = true;
          shake = 0.35;
          craters.push({ x: m.x, y: m.y, r: 26 + Math.random() * 14 });
          // anyone standing OUTSIDE near the impact gets LAUNCHED
          for (const p of people) {
            if (!p.gone && !p.sheltering && Math.hypot(p.x - m.x, p.y - m.y) < 85) {
              p.gone = true;
              peopleLaunched++;
              launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
                vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
            }
          }
          // BOOM — everything near the impact is gone, even stone
          for (let gy = 0; gy < ROWS; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              // bunkers shrug off even a direct meteor hit
              if (grid[gy][gx] === EMPTY || grid[gy][gx] === BUNKER) continue;
              const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
              if (Math.hypot(bx - m.x, by - m.y) < 60) smashBlock(gx, gy, bx, by);
            }
          }
          for (let i = 0; i < 14; i++) {
            debris.push({ x: m.x, y: m.y,
              vx: (Math.random() - 0.5) * 600, vy: -Math.random() * 500,
              spin: Math.random() * 10, life: 0.8,
              color: i % 2 ? '#ff9f43' : '#ffd23f' });
          }
        }
      }
      D.meteors = D.meteors.filter(m => !m.hit);
      if (D.life <= 0 && D.meteors.length === 0) D.done = true;
    }

    if (D.type === 'quake') {
      shake = 0.3;                              // the ground never stops moving
      // blocks randomly crumble — houses are fragile, stone is tough
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY) continue;
          if (kind === BUNKER) continue;             // bunkers do not care
          const fragile = kind === HOUSE ? 0.9
                        : kind === APT ? 0.7         // tall = topply
                        : kind === TREE ? 0.35 : 0.15;
          if (Math.random() < fragile * dt) {
            smashBlock(gx, gy, gx * s + s / 2, TOPBAR + gy * s + s / 2);
          }
        }
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'flood') {
      // the water rises for 4s, holds for 2s, drains for 4s
      const t2 = 10 - D.life;
      let frac;
      if (t2 < 4) frac = t2 / 4;
      else if (t2 < 6) frac = 1;
      else frac = Math.max(0, 1 - (t2 - 6) / 4);
      D.waterY = canvas.height - frac * (canvas.height - TOPBAR) * 0.65;
      // anything underwater washes away... except STONE. stone doesn't care.
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY || kind === STONE || kind === BUNKER) continue;   // waterproof
          const by = TOPBAR + gy * s + s / 2;
          if (by > D.waterY) smashBlock(gx, gy, gx * s + s / 2, by, true);
        }
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'balls') {
      shake = Math.max(shake, 0.08);
      for (const ball of D.balls) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        // BOING — bounce off every edge of the world
        if (ball.x < 16) { ball.x = 16; ball.vx = Math.abs(ball.vx); }
        if (ball.x > canvas.width - 16) { ball.x = canvas.width - 16; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < TOPBAR + 16) { ball.y = TOPBAR + 16; ball.vy = Math.abs(ball.vy); }
        if (ball.y > canvas.height - 16) { ball.y = canvas.height - 16; ball.vy = -Math.abs(ball.vy); }
        // anything a ball touches gets bounced INTO OBLIVION (except bunkers)
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (kind === EMPTY || kind === BUNKER) continue;
            const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
            if (Math.hypot(bx - ball.x, by - ball.y) < 34) smashBlock(gx, gy, bx, by);
          }
        }
      }
      if (D.life <= 0) {
        // time's up — every ball POPS in a burst of its own color
        for (const ball of D.balls) {
          for (let i = 0; i < 8; i++) {
            debris.push({ x: ball.x, y: ball.y,
              vx: (Math.random() - 0.5) * 400, vy: -Math.random() * 350,
              spin: Math.random() * 10, life: 0.6, color: ball.color });
          }
        }
        D.done = true;
      }
    }
  }
  disasters = disasters.filter(D => !D.done);   // sweep up the finished ones

  // ---- THE LITTLE PEOPLE — wandering, panicking, or HIDING ----
  const panicking = disasters.length > 0;
  const cs = cellSize();

  // how many people are inside (or racing toward) each building? MAX 3.
  // a house is not a clown car.
  const occupancy = {};
  for (const p of people) {
    const spot = p.sheltering || p.shelterTarget;
    if (spot) {
      const k = spot.gx + ',' + spot.gy;
      occupancy[k] = (occupancy[k] || 0) + 1;
    }
  }

  for (const p of people) {

    // already hiding inside a building?
    if (p.sheltering) {
      const kind = grid[p.sheltering.gy][p.sheltering.gx];
      if (kind !== HOUSE && kind !== APT && kind !== BUNKER) {
        // their shelter was DESTROYED with them inside it. out they go!
        p.gone = true;
        peopleLaunched++;
        launchedFolk.push({
          x: p.sheltering.gx * cs + cs / 2,
          y: TOPBAR + p.sheltering.gy * cs + cs / 2,
          vx: (Math.random() - 0.5) * 600, vy: -400 - Math.random() * 300,
          spin: 0, life: 1.4, shirt: p.shirt });
      } else if (!panicking) {
        // all clear! everyone shuffles back outside
        p.x = p.sheltering.gx * cs + cs / 2 + (Math.random() - 0.5) * 20;
        p.y = TOPBAR + p.sheltering.gy * cs + cs + 6;
        p.sheltering = null;
      }
      continue;                     // hiding people don't walk around
    }

    p.walk += dt * (panicking ? 16 : 6);

    if (panicking) {
      // RUN FOR SHELTER — find the nearest building with a roof.
      // (Whether it's a GOOD shelter is... not their department.)
      let target = p.shelterTarget;
      if (!target || (grid[target.gy][target.gx] !== HOUSE &&
                      grid[target.gy][target.gx] !== APT &&
                      grid[target.gy][target.gx] !== BUNKER)) {
        target = null;
        let best = 999999;
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (kind !== HOUSE && kind !== APT && kind !== BUNKER) continue;
            if ((occupancy[gx + ',' + gy] || 0) >= 3) continue;   // that one's FULL
            const bx = gx * cs + cs / 2, by = TOPBAR + gy * cs + cs / 2;
            const d2 = Math.hypot(bx - p.x, by - p.y);
            if (d2 < best) { best = d2; target = { gx, gy, x: bx, y: by }; }
          }
        }
        p.shelterTarget = target;
        if (target) {
          // claim a spot so the next runner picks somewhere else
          const k = target.gx + ',' + target.gy;
          occupancy[k] = (occupancy[k] || 0) + 1;
        }
      }
      if (target) {
        if (Math.hypot(target.x - p.x, target.y - p.y) < 12) {
          // one last headcount at the door...
          let inside = 0;
          for (const q of people) {
            if (q.sheltering && q.sheltering.gx === target.gx &&
                q.sheltering.gy === target.gy) inside++;
          }
          if (inside < 3) {
            p.sheltering = { gx: target.gx, gy: target.gy };   // squeezed in!
            p.shelterTarget = null;
            continue;
          }
          p.shelterTarget = null;      // full! no room! run somewhere else!!
        } else {
          p.angle = Math.atan2(target.y - p.y, target.x - p.x) + (Math.random() - 0.5) * 0.3;
        }
      } else {
        p.angle += (Math.random() - 0.5) * dt * 22;   // no shelter?! headless-chicken mode
      }
    } else {
      p.shelterTarget = null;
      if (Math.random() < dt * 0.8) p.angle = Math.random() * 6.28;   // calm amble
    }

    const speed = panicking ? 150 : 30;
    p.x += Math.cos(p.angle) * speed * dt;
    p.y += Math.sin(p.angle) * speed * dt;
    p.x = Math.max(14, Math.min(canvas.width - 14, p.x));
    p.y = Math.max(TOPBAR + 14, Math.min(canvas.height - 14, p.y));

    // did something GET them on the way?
    let hit = false;
    for (const D of disasters) {
      if (D.type === 'tornado' && Math.hypot(D.x - p.x, D.y - p.y) < 45) hit = true;
      if (D.type === 'balls') {
        for (const ball of D.balls) {
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < 26) hit = true;
        }
      }
      if (D.type === 'flood' && p.y > D.waterY + 10) hit = true;
    }
    if (hit && !p.gone) {
      p.gone = true;
      peopleLaunched++;
      launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
        vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
    }
  }
  people = people.filter(p => !p.gone);

  // airborne folk tumble gracefully out of frame
  for (const f of launchedFolk) {
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vy += 600 * dt;
    f.spin += dt * 12;
    f.life -= dt;
  }
  launchedFolk = launchedFolk.filter(f => f.life > 0);

  // debris tumbles through the air and fades
  for (const d of debris) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 700 * dt;               // gravity brings it all back down
    d.spin += dt * 10;
    d.life -= dt;
  }
  debris = debris.filter(d => d.life > 0);
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function draw() {
  const shx = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  ctx.save();
  ctx.translate(shx, shy);

  // THE CAMERA. Everything from here until ctx.restore() is drawn through
  // the zoom lens. We clip to the play area first so zoomed-in scenery can
  // never spill up over the toolbar, then slide (pan) and scale (zoom).
  // At zoom 1 with no pan this is exactly the identity — nothing changes.
  ctx.beginPath();
  ctx.rect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);
  ctx.clip();
  ctx.translate(panX, TOPBAR + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(0, -TOPBAR);

  // grass everywhere
  ctx.fillStyle = '#4a7c3a';
  ctx.fillRect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);

  // meteor craters, scarred into the lawn forever
  for (const c of craters) {
    ctx.fillStyle = 'rgba(30, 22, 14, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(60, 45, 28, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r * 0.55, c.r * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const s = cellSize();

  // faint grid lines so builders can aim
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= COLS; gx++) {
    ctx.beginPath();
    ctx.moveTo(gx * s, TOPBAR);
    ctx.lineTo(gx * s, TOPBAR + ROWS * s);
    ctx.stroke();
  }
  for (let gy = 0; gy <= ROWS; gy++) {
    ctx.beginPath();
    ctx.moveTo(0, TOPBAR + gy * s);
    ctx.lineTo(COLS * s, TOPBAR + gy * s);
    ctx.stroke();
  }

  // the blocks of the town
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const kind = grid[gy][gx];
      if (kind === EMPTY) continue;
      const x = gx * s, y = TOPBAR + gy * s;
      if (kind === HOUSE) {
        ctx.fillStyle = '#c9a06a';                      // walls
        ctx.fillRect(x + s * 0.15, y + s * 0.4, s * 0.7, s * 0.5);
        ctx.fillStyle = '#b5563c';                      // roof
        ctx.beginPath();
        ctx.moveTo(x + s * 0.08, y + s * 0.45);
        ctx.lineTo(x + s * 0.5, y + s * 0.08);
        ctx.lineTo(x + s * 0.92, y + s * 0.45);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#5b3b1e';                      // door
        ctx.fillRect(x + s * 0.42, y + s * 0.62, s * 0.16, s * 0.28);
      } else if (kind === TREE) {
        ctx.fillStyle = '#6d5330';                      // trunk
        ctx.fillRect(x + s * 0.42, y + s * 0.55, s * 0.16, s * 0.35);
        ctx.fillStyle = '#3f8a3f';                      // leaves
        ctx.beginPath();
        ctx.arc(x + s * 0.5, y + s * 0.38, s * 0.32, 0, Math.PI * 2);
        ctx.fill();
      } else if (kind === STONE) {
        ctx.fillStyle = '#8a8d94';
        ctx.fillRect(x + s * 0.08, y + s * 0.12, s * 0.84, s * 0.8);
        ctx.fillStyle = '#a7aab2';
        ctx.fillRect(x + s * 0.08, y + s * 0.12, s * 0.84, s * 0.2);
      } else if (kind === APT) {
        ctx.fillStyle = '#5a6a7a';                      // the tall tower
        ctx.fillRect(x + s * 0.12, y + s * 0.06, s * 0.76, s * 0.86);
        ctx.fillStyle = '#7a8a9a';                      // roof ledge
        ctx.fillRect(x + s * 0.12, y + s * 0.06, s * 0.76, s * 0.1);
        ctx.fillStyle = '#ffd23f';                      // lit windows
        for (let wy2 = 0; wy2 < 3; wy2++) {
          for (let wx2 = 0; wx2 < 2; wx2++) {
            ctx.fillRect(x + s * (0.24 + wx2 * 0.3), y + s * (0.24 + wy2 * 0.22),
                         s * 0.16, s * 0.13);
          }
        }
      } else if (kind === BUNKER) {
        ctx.fillStyle = '#4a5548';                      // squat armored dome
        ctx.beginPath();
        ctx.arc(x + s * 0.5, y + s * 0.72, s * 0.4, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.2);
        ctx.fillStyle = '#6a7a66';                      // top rim
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.06);
        ctx.fillStyle = '#2c332b';                      // the sealed door
        ctx.fillRect(x + s * 0.4, y + s * 0.6, s * 0.2, s * 0.32);
      }
    }
  }

  // tiny heads peeking out of every occupied shelter
  const peek = {};
  for (const p of people) {
    if (p.sheltering) {
      const k = p.sheltering.gx + ',' + p.sheltering.gy;
      peek[k] = (peek[k] || 0) + 1;
    }
  }
  for (const k in peek) {
    const parts = k.split(',');
    const px2 = parts[0] * s, py2 = TOPBAR + parts[1] * s;
    for (let i = 0; i < Math.min(3, peek[k]); i++) {
      ctx.fillStyle = '#f2c79b';
      ctx.beginPath();
      ctx.arc(px2 + s * (0.3 + i * 0.2), py2 + s * 0.88, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // the little people, bless them (the hiding ones are indoors, unseen)
  for (const p of people) {
    if (p.sheltering) continue;
    const step = Math.sin(p.walk) * 2;
    ctx.fillStyle = '#333';                          // busy little legs
    ctx.fillRect(p.x - 3, p.y - 2 + step, 2, 5 - step);
    ctx.fillRect(p.x + 1, p.y - 2 - step, 2, 5 + step);
    ctx.fillStyle = p.shirt;                         // shirt
    ctx.fillRect(p.x - 4, p.y - 10, 8, 9);
    ctx.fillStyle = '#f2c79b';                       // head
    ctx.beginPath(); ctx.arc(p.x, p.y - 13, 3.5, 0, Math.PI * 2); ctx.fill();
    if (disasters.length > 0) {                      // screaming, obviously
      ctx.fillStyle = '#ff4757';
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!!', p.x, p.y - 20);
    }
  }

  // people currently airborne (they're fine. probably.)
  for (const f of launchedFolk) {
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.spin);
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.shirt;
    ctx.fillRect(-4, -6, 8, 9);
    ctx.fillStyle = '#f2c79b';
    ctx.beginPath(); ctx.arc(0, -9, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // flying debris (the fun part)
  for (const d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.spin);
    ctx.globalAlpha = Math.max(0, d.life / 1.2);
    ctx.fillStyle = d.color;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ---- DRAWING ALL THE DOOM CURRENTLY HAPPENING ----
  for (const D of disasters) {

    if (D.type === 'tornado') {
      // a stack of spinning gray rings, wide up top, narrow at the ground
      for (let ring = 0; ring < 7; ring++) {
        const ry = D.y - ring * 22;
        const rw = 14 + ring * 11 + Math.sin(elapsed * 9 + ring) * 5;
        ctx.fillStyle = `rgba(180, 185, 195, ${0.5 - ring * 0.04})`;
        ctx.beginPath();
        ctx.ellipse(D.x + Math.sin(elapsed * 7 + ring * 1.3) * 7, ry, rw, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (D.type === 'meteors') {
      for (const m of D.meteors) {
        // the fiery trail behind it
        ctx.strokeStyle = 'rgba(255, 159, 67, 0.5)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(m.x + 55, m.y - 130);
        ctx.lineTo(m.x, m.y);
        ctx.stroke();
        // the fireball itself
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath(); ctx.arc(m.x, m.y, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.arc(m.x + 3, m.y - 3, 7, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (D.type === 'quake') {
      // jagged cracks tearing across the ground (seeded so they hold still)
      const rnd = n => {
        const v = Math.sin((D.seed + n) * 127.1) * 43758.55;
        return v - Math.floor(v);
      };
      ctx.strokeStyle = 'rgba(20, 14, 8, 0.6)';
      ctx.lineWidth = 4;
      for (let c = 0; c < 6; c++) {
        let cx2 = rnd(c * 3.3) * canvas.width;
        let cy2 = TOPBAR + rnd(c * 7.7) * (canvas.height - TOPBAR) * 0.3;
        ctx.beginPath();
        ctx.moveTo(cx2, cy2);
        for (let seg = 0; seg < 8; seg++) {
          cx2 += (rnd(c * 11 + seg) - 0.5) * 120;
          cy2 += 40 + rnd(c * 13 + seg) * 60;
          ctx.lineTo(cx2, cy2);
        }
        ctx.stroke();
      }
    }

    if (D.type === 'flood') {
      // the rising water, with a wavy crest
      ctx.fillStyle = 'rgba(60, 130, 200, 0.55)';
      ctx.beginPath();
      ctx.moveTo(0, D.waterY);
      for (let wx2 = 0; wx2 <= canvas.width; wx2 += 30) {
        ctx.lineTo(wx2, D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let wx2 = 0; wx2 <= canvas.width; wx2 += 30) {
        const wy2 = D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6;
        if (wx2 === 0) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
      }
      ctx.stroke();
    }

    if (D.type === 'balls') {
      for (const ball of D.balls) {
        // a little motion trail behind each ball
        ctx.strokeStyle = ball.color + '66';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(ball.x - ball.vx * 0.06, ball.y - ball.vy * 0.06);
        ctx.lineTo(ball.x, ball.y);
        ctx.stroke();
        // the ball itself, with a shiny spot
        ctx.fillStyle = ball.color;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(ball.x - 5, ball.y - 5, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  ctx.restore();   // stop shaking for the buttons — the UI stays calm

  // the top bar background (two tiers)
  ctx.fillStyle = '#10161d';
  ctx.fillRect(0, 0, canvas.width, TOPBAR);

  // --- lower tier: the build PALETTE, spread across the full width ---
  for (const r of paletteRects()) {
    const active = selected === r.type;
    ctx.fillStyle = active ? '#3d6b30' : '#26303b';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = active ? '#7ddf8f' : '#3a4654';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    if (r.compact) {                       // tight: icon on top, tiny label under
      ctx.font = '20px monospace';
      ctx.fillText(r.icon, r.x + r.w / 2, r.y + r.h / 2 - 1);
      ctx.font = 'bold 10px monospace';
      ctx.fillText(r.short, r.x + r.w / 2, r.y + r.h - 6);
    } else {                               // roomy: icon and word side by side
      ctx.font = 'bold 15px monospace';
      ctx.fillText(r.icon + ' ' + r.short, r.x + r.w / 2, r.y + r.h / 2 + 6);
    }
  }

  // --- top tier: THE MACHINE button, top-right ---
  const mb = machineBtnRect();
  ctx.fillStyle = '#7a1f2b';
  ctx.fillRect(mb.x, mb.y, mb.w, mb.h);
  ctx.strokeStyle = '#ff6b5e'; ctx.lineWidth = 2;
  ctx.strokeRect(mb.x, mb.y, mb.w, mb.h);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(mb.label, mb.x + mb.w / 2, mb.y + mb.h / 2 + 6);

  // THE MACHINE's menu of doom, when open
  if (machineOpen) {
    for (const r of machineRects()) {
      const canAfford = moneys >= r.cost;
      ctx.fillStyle = canAfford ? '#7a1f2b' : '#2c2126';   // grayed out = too broke
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = canAfford ? '#ff6b5e' : '#5a4a4e';
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = canAfford ? '#ffffff' : '#8a7a7e';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`${r.label} — ${r.cost}💰`, r.x + r.w / 2, r.y + r.h / 2 + 6);
    }
    // left-align the hint to the menu column so it never runs off a phone edge
    const menu0 = machineRects()[0];
    ctx.fillStyle = '#ffb3ab';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('(stack all you can afford)', menu0.x,
                 TOPBAR + 8 + MACHINE_MENU.length * (44 + 6) + 12);
  }

  // THE BANK BALANCE — parked in the top tier just left of THE MACHINE,
  // so you can see exactly what doom you can afford. On a narrow phone we
  // drop the word "MONEYS" so the number never crashes into the button.
  ctx.fillStyle = brokeFlash > 0 && Math.sin(brokeFlash * 30) > 0 ? '#ff5046' : '#ffd23f';
  ctx.font = 'bold 17px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(canvas.width < 620 ? `💰 ${moneys}` : `💰 ${moneys} MONEYS`, mb.x - 12, 29);

  // tried to buy doom you can't afford
  if (brokeFlash > 0) {
    ctx.fillStyle = `rgba(255, 80, 70, ${Math.min(1, brokeFlash)})`;
    ctx.font = 'bold 22px monospace';
    ctx.fillText('NOT ENOUGH MONEYS! (smashed blocks pay 1 each)',
                 canvas.width / 2, TOPBAR + 52);
  }

  // the SPAWN PEOPLE button, bottom-right corner (as ordered by Amos)
  const pb = peopleButtonRect();
  ctx.fillStyle = '#26473b';
  ctx.fillRect(pb.x, pb.y, pb.w, pb.h);
  ctx.strokeStyle = '#7ddf8f';
  ctx.lineWidth = 2;
  ctx.strokeRect(pb.x, pb.y, pb.w, pb.h);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🧍 SPAWN PEOPLE', pb.x + pb.w / 2, pb.y + pb.h / 2 + 6);

  // the destruction scoreboard
  if (destroyed > 0 || peopleLaunched > 0) {
    ctx.fillStyle = '#ff9f43';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`blocks destroyed: ${destroyed}    people launched: ${peopleLaunched}`,
                 canvas.width / 2, TOPBAR + 22);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
