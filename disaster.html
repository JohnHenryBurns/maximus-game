<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Amos's Disaster Builder</title>
<style>
  html, body { margin: 0; background: #1a2530; height: 100%; overflow: hidden; }
  canvas { display: block; }
  /* Back-to-arcade pill, the same look the other games use. */
  #back {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    color: #ffe0c4; background: rgba(24, 14, 28, 0.6);
    border: 1px solid rgba(255, 200, 150, 0.4);
    font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 12px; border-radius: 999px; text-decoration: none; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
  }
  #back:hover, #back:active {
    transform: scale(1.05); border-color: rgba(255, 200, 150, 0.85); background: rgba(40, 22, 44, 0.75);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">&larr; Arcade</a>
<script>
// =====================================================================
// AMOS'S DISASTER BUILDER
//
// Two great joys of being human:
//   1. building a beautiful town
//   2. pressing the button that summons a tornado to eat it
// This game has both.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------
// THE WORLD — a grid of cells, like graph paper. Every cell holds one
// thing: nothing (0), a house (1), a tree (2), or a stone block (3).
//
// The grid is TALL (20 wide, 40 high) — a 1:2 shape that fills a phone held
// upright almost perfectly, so the whole town shows at once with no wasted
// space. Zoom in to build the little details.
// ---------------------------------------------------------------------
const COLS = 20, ROWS = 40;
let cell = 34;                      // pixel size of one grid square
// Room at the top for the toolbar. It's two tiers now (money + THE MACHINE
// on top, the build palette in a full-width row below) so everything fits on
// a phone instead of running off the side.
const TOPBAR = 108;                  // two roomy rows: Arcade+money on top, buttons below

// ---------------------------------------------------------------------
// THE CAMERA — lets you zoom in to build with detail, then slide around.
//   zoom = 1  ->  the whole town fits on screen (all the way zoomed out)
//   zoom = 4  ->  four times closer, for placing tiny blocks just so
// panX/panY are how far we've slid the zoomed view left/right and up/down.
// At zoom 1 the camera does nothing at all, so the game looks exactly the
// same until you actually pinch or scroll to zoom in.
// ---------------------------------------------------------------------
let zoom = 1;
let panX = 0, panY = 0;
const MAX_ZOOM = 4;

// make the grid: ROWS rows, each row is COLS zeros (all empty land)
const grid = [];
for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0));

const EMPTY = 0, HOUSE = 1, TREE = 2, STONE = 3, APT = 4, BUNKER = 5;

// What you're placing right now. Starts as null — the game opens in
// look-around mode, so you can drag and zoom before you build anything.
let selected = null;

// HOW BEATEN-UP EVERY SQUARE IS. Same shape as the grid.
//   0 = pristine, 1 = lightly damaged, 2 = heavily damaged
// A third hit (or an unlucky first one) knocks it down completely.
const PRISTINE = 0, LIGHT = 1, HEAVY = 2, WRECKED = 3;
const damage = [];
for (let y = 0; y < ROWS; y++) damage.push(new Array(COLS).fill(PRISTINE));

// A square that's just been hit is briefly immune, so a tornado sitting on
// top of a house doesn't chew through all three damage levels in one frame.
// You get to SEE each stage.
const hitCool = [];
for (let y = 0; y < ROWS; y++) hitCool.push(new Array(COLS).fill(0));
const HIT_COOLDOWN = 0.55;

// ---------------------------------------------------------------------
// LITTLE PEOPLE (and cows, and dogs) — they live in your town. no idea.
// ---------------------------------------------------------------------
let people = [];
let launchedFolk = [];     // folk currently flying through the air (they're fine)
let peopleLaunched = 0;

// A square you can't walk into: anything built except an OPEN square.
// (Trees and stone block you too — you can't stroll through a boulder.)
function blocked(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return true;   // off the map
  return grid[gy][gx] !== EMPTY;
}
// same question, but in pixels
function blockedAt(x, y) {
  const s = cellSize();
  return blocked(Math.floor(x / s), Math.floor((y - TOPBAR) / s));
}

// find an open square to drop a new critter on (never inside a building)
function freeSpot() {
  const s = cellSize();
  for (let tries = 0; tries < 60; tries++) {
    const gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS);
    if (!blocked(gx, gy)) return { x: gx * s + s / 2, y: TOPBAR + gy * s + s / 2 };
  }
  return null;                     // town completely full — nowhere to stand
}

function spawnCritters(kind) {
  let made = 0;
  for (let i = 0; i < 5 && people.length < 60; i++) {
    const spot = freeSpot();
    if (!spot) break;
    people.push({
      kind,                        // 'person', 'cow' or 'dog'
      x: spot.x, y: spot.y,
      angle: Math.random() * 6.28,
      walk: Math.random() * 6.28,
      // little personality knobs so nobody looks quite the same:
      mood: Math.floor(Math.random() * 3),   // which happy face they pull
      fear: Math.floor(Math.random() * 3),   // which panicked face they pull
      bob: Math.random() * 6.28,             // where they are in their bounce
      shirt: ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#2ecc71', '#e67e22'][Math.floor(Math.random() * 6)],
    });
    made++;
  }
  return made;
}

// scoreboard of destruction (and of putting it all back together)
let destroyed = 0;
let repaired = 0;
const REPAIR_TIME = 3.4;      // seconds of hammering per damage level — slow, so you can watch

// THE ECONOMY. You start with 30 MONEYS. Disasters cost MONEYS.
// Every block a disaster smashes pays you 1 MONEY. Yes, really.
// Destruction is a business.
let moneys = 30;
let brokeFlash = 0;    // flashes when you try to buy doom you can't afford

// ---------------------------------------------------------------------
// THE DISASTERS — one at a time, chosen from THE MACHINE's menu.
// null means the world is at peace. For now.
// ---------------------------------------------------------------------
let disasters = [];                 // ALL currently-active catastrophes. yes, plural.
let debris = [];                    // flying bits of what used to be a town
let craters = [];                   // meteor scars. they never heal.
let shake = 0;                      // screen trembles while disaster reigns
let elapsed = 0;

// Which dropdown is showing right now: 'items', 'disasters', or null (none).
// Only one is ever open at a time.
let openMenu = null;

// Disasters you've PAID for but that haven't struck yet — they count down a
// moment of dread first. This is the "build tension" delay.
let pendings = [];
const TENSION = 1.3;                 // seconds between choosing doom and it landing

// A little message box at the bottom tells you what just happened.
// News (like "Tornado incoming!") fades after a moment; a plain note about
// what you're doing right now ("Now placing House") just stays put until
// something else replaces it.
let statusText = '', statusColor = '#ffffff', statusTimer = 0, statusSticky = false;
function setStatus(text, color, sticky) {
  statusText = text;
  statusColor = color || '#ffffff';
  statusSticky = !!sticky;
  statusTimer = 2.4;                 // how long a fading message lingers
}

// Pick a disaster from the menu: pay for it, close the menu, and start the
// tension countdown. The actual mayhem begins later, in update().
function pickDisaster(item) {
  if (moneys < item.cost) {          // can't afford this one — say so, leave the menu open
    brokeFlash = 1.5;
    setStatus('Not enough MONEYS — smashed blocks pay you back!', '#ff6b5e');
    return;
  }
  moneys -= item.cost;
  openMenu = null;                   // CLOSE the menu before the disaster begins
  selected = null;                   // and stop building — you'll want to watch this
  pendings.push({ type: item.type, label: item.label, timer: TENSION });
  setStatus(item.label + ' incoming…', '#ffb454');
}

// BUZZ THE PHONE. Each disaster gets its own rumble pattern (in milliseconds:
// buzz, pause, buzz, …). Only Android/Chrome phones can actually vibrate —
// on a laptop or an iPhone navigator.vibrate simply isn't there, so we check
// first and wrap it in try/catch so it can never break the game.
const BUZZ = {
  tornado: [120, 40, 120, 40, 200],
  meteors: [40, 30, 40, 30, 40, 30, 120],
  quake:   [450],
  flood:   [200, 80, 300],
  balls:   [30, 50, 30, 50, 30, 50, 30],
};
function buzz(type) {
  try { if (navigator.vibrate) navigator.vibrate(BUZZ[type] || 180); } catch (e) {}
}

// Actually unleash the disaster (called once its tension timer runs out).
// No money changes hands here — that already happened in pickDisaster.
function beginDisaster(type) {
  if (disasters.length >= 8) return;   // even chaos has a fire code
  if (type === 'tornado') {
    disasters.push({ type, x: -60, y: TOPBAR + Math.random() * gridH(),
                     life: 12, wobble: Math.random() * 6.28 });
  } else if (type === 'meteors') {
    disasters.push({ type, life: 8, spawnTimer: 0, meteors: [] });
  } else if (type === 'quake') {
    disasters.push({ type, life: 6, seed: Math.random() * 100 });
  } else if (type === 'flood') {
    disasters.push({ type, life: 10, waterY: TOPBAR + gridH() + 50 });
  } else if (type === 'balls') {
    // 10 rubber balls, dropped from above, each with its own direction
    const balls = [];
    const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81',
                    '#eccc68', '#7bed9f', '#70a1ff', '#ff7f50', '#a29bfe'];
    for (let i = 0; i < 10; i++) {
      balls.push({
        x: 10 + Math.random() * (gridW() - 20),
        y: TOPBAR - 40 - Math.random() * 250,        // starting up in the sky
        vx: (Math.random() < 0.5 ? -1 : 1) * (220 + Math.random() * 220),
        vy: 250 + Math.random() * 200,
        color: colors[i],
      });
    }
    disasters.push({ type, life: 3.8, balls });
  }
}

// SOMETHING HIT A BUILDING. It doesn't just vanish any more — it takes
// damage and gets uglier: pristine -> lightly damaged -> heavily damaged ->
// gone. `force` is how hard the hit was: a big meteor usually flattens a
// house outright, a bouncing ball usually just dents it. Every hit rolls
// the dice, so even a gentle knock can occasionally finish a building off
// and a direct meteor sometimes leaves a wall standing.
function hitBlock(gx, gy, bx, by, force, splash) {
  if (grid[gy][gx] === EMPTY) return;
  if (hitCool[gy][gx] > 0) return;           // still reeling from the last hit
  hitCool[gy][gx] = HIT_COOLDOWN;
  const roll = 1 + Math.floor(Math.random() * (force || 1));   // 1 .. force
  damage[gy][gx] += roll;
  if (damage[gy][gx] >= WRECKED) {
    smashBlock(gx, gy, bx, by, splash);      // that's the end of that
  } else {
    // a puff of bits flies off, but the building is still standing
    for (let i = 0; i < 3; i++) {
      debris.push({
        x: bx, y: by,
        vx: (Math.random() - 0.5) * 260,
        vy: -Math.random() * 240 - 60,
        spin: Math.random() * 10, life: 0.7,
        color: splash ? '#5da3e0' : '#9a8a78',
      });
    }
  }
}

// one block, smashed: emptied from the grid, launched as flying bits
function smashBlock(gx, gy, bx, by, splash) {
  const kind = grid[gy][gx];
  grid[gy][gx] = EMPTY;
  damage[gy][gx] = PRISTINE;         // empty ground isn't "damaged"
  destroyed++;
  moneys += kind === APT ? 3 : 1;    // apartments pay TRIPLE. big building, big payout.
  for (let i = 0; i < 6; i++) {
    debris.push({
      x: bx, y: by,
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 500 - 100,
      spin: Math.random() * 10,
      life: 1.2,
      color: splash ? '#5da3e0'
           : kind === TREE ? '#3f8a3f' : kind === STONE ? '#8a8d94'
           : kind === APT ? '#5a6a7a' : '#b5563c',
    });
  }
}

// ---------------------------------------------------------------------
// PLACING BLOCKS — turn a screen position into a grid square
// ---------------------------------------------------------------------
function cellSize() {
  // the grid stretches to fit whatever screen we're on
  return Math.min(canvas.width / COLS, (canvas.height - TOPBAR) / ROWS);
}
// the town's size in pixels (the grass rectangle). The world outside this is fog.
function gridW() { return COLS * cellSize(); }
function gridH() { return ROWS * cellSize(); }
const FOG_PEEK = 70;                 // how far past the town edge you may pan into the fog

// The camera slides and scales what we DRAW, so a finger tap on the glass
// isn't the same spot in the town anymore. screenToWorld undoes the camera:
// give it where you touched, it tells you which spot of the town that is.
function screenToWorld(sx, sy) {
  return {
    x: (sx - panX) / zoom,
    y: (sy - TOPBAR - panY) / zoom + TOPBAR,
  };
}

// Keep the view sensible: if the whole town fits on screen, center it; if
// it's bigger than the screen (zoomed in), let it slide — but only a little
// way past the town edge, so you can peek into the fog without getting lost
// in it. FOG_PEEK is how far past the edge you're allowed to go.
function clampPan() {
  const PW = canvas.width, PH = canvas.height - TOPBAR;
  const gw = gridW() * zoom, gh = gridH() * zoom;   // town size on screen right now
  panX = gw <= PW ? (PW - gw) / 2
                  : Math.min(FOG_PEEK, Math.max(PW - gw - FOG_PEEK, panX));
  panY = gh <= PH ? (PH - gh) / 2
                  : Math.min(FOG_PEEK, Math.max(PH - gh - FOG_PEEK, panY));
}
// after the window resizes (fitCanvas already ran), tidy the view back onto
// the town so a rotate or resize can't leave a gap at the edge
addEventListener('resize', clampPan);
clampPan();   // center the town on first load

// Change the zoom while keeping one spot of the town pinned under a finger
// (or the mouse). worldPt is that spot; (sx, sy) is where it should stay on
// screen. This is what makes pinch-zoom feel like you're grabbing the map.
function setCamera(newZoom, worldPt, sx, sy) {
  zoom = Math.min(MAX_ZOOM, Math.max(1, newZoom));
  panX = sx - zoom * worldPt.x;
  panY = sy - TOPBAR - zoom * (worldPt.y - TOPBAR);
  clampPan();
}

function placeAt(px, py) {
  if (selected == null) return;     // pan mode — nothing to place
  const w = screenToWorld(px, py);  // where in the town did we really touch?
  const s = cellSize();
  const gx = Math.floor(w.x / s);
  const gy = Math.floor((w.y - TOPBAR) / s);
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
  grid[gy][gx] = selected;          // EMPTY works as the eraser
  damage[gy][gx] = PRISTINE;        // fresh out of the box
}

// slide the whole zoomed view by a screen-pixel delta (used for one-finger pan)
function doPan(dx, dy) { panX += dx; panY += dy; clampPan(); }

// ---------------------------------------------------------------------
// THE TOP BAR — three drop-down buttons and the money.
//   Items ▾      the stuff you build (houses, trees, stone, bunkers…)
//   Disasters ▾  the mayhem you rain down (this is the old MACHINE)
//   People       spawns little citizens (no menu, just a button)
// Each drop-down opens a list below it, like a real menu.
// ---------------------------------------------------------------------

// everything you can BUILD — these fill the Items drop-down
const buttons = [
  { icon: '🏠', short: 'House',  type: HOUSE },
  { icon: '🏢', short: 'Apt',    type: APT },
  { icon: '🌳', short: 'Tree',   type: TREE },
  { icon: '🪨', short: 'Stone',  type: STONE },
  { icon: '🛡', short: 'Bunker', type: BUNKER },
  { icon: '❌', short: 'Erase',  type: EMPTY },
];

// the critters you can drop into town — these fill the People drop-down
const CRITTER_MENU = [
  { label: '🧍 People', kind: 'person' },
  { label: '🐄 Cows',   kind: 'cow' },
  { label: '🐕 Dogs',   kind: 'dog' },
];

// everything you can UNLEASH — these fill the Disaster drop-down
const MACHINE_MENU = [
  { label: '🌪 Tornado',      type: 'tornado', cost: 10 },
  { label: '☄ Meteors',       type: 'meteors', cost: 15 },
  { label: '💥 Earthquake',   type: 'quake',   cost: 8 },
  { label: '🌊 Flood',        type: 'flood',   cost: 12 },
  { label: '🔴 Rubber Balls', type: 'balls',   cost: 9 },
];

// quick point-in-box test, used all over the input code
function inside(px, py, r) { return px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h; }

// builds a rounded-rectangle path (call ctx.fill()/ctx.stroke() after).
// We roll our own so it works even on browsers without ctx.roundRect.
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// a steady pseudo-random 0..1 from a number — same input, same output every
// frame, so things placed with it (like fog clouds) hold still instead of flickering
function hash(n) { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); }

// Pick the biggest font size (up to `size`) that makes `text` fit in `maxW`,
// and set it. Emoji are extra-wide, so words like "🌪 Disasters ▾" used to
// spill outside their button — this stops that on any screen.
function fitFont(text, maxW, size, min) {
  let fs = size;
  ctx.font = `bold ${fs}px monospace`;
  while (fs > (min || 10) && ctx.measureText(text).width > maxW) {
    fs -= 1;
    ctx.font = `bold ${fs}px monospace`;
  }
  return fs;
}

// the emoji of whatever build item is currently picked
function iconFor(type) {
  const b = buttons.find(b => b.type === type);
  return b ? b.icon : '🏠';
}
// what the Build button shows: a hand when you're NOT building (so you're
// free to drag the map), otherwise the icon of the thing you're placing.
function buildIcon() { return selected == null ? '✋' : iconFor(selected); }

// Stop building. There's no "pan mode" to switch on — dragging the map is
// simply what happens whenever you're not placing something.
function stopBuilding() {
  selected = null;
  openMenu = null;
  setStatus('✋ Drag to move the map, pinch to zoom', '#7dd3ff', true);
}

// ROW 1 (top): ← Arcade pill on the left, the gold money chip in the MIDDLE,
// and the fullscreen button on the right.
function moneyChipRect() {
  const narrow = canvas.width < 480;
  const w = narrow ? 104 : 150;
  return { x: (canvas.width - w) / 2, y: 12, w, h: 32, narrow };
}

// The fullscreen toggle, top-right. Real fullscreen hides the phone's
// browser bars, which gives the town a lot more room.
function fullBtnRect() {
  return { x: canvas.width - 46, y: 12, w: 36, h: 32 };
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  try {
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  } catch (e) {}          // some browsers say no. that's fine, carry on.
}

// ROW 2 (below): the three big buttons across the full width, with room to
// breathe — Build, People, then Disasters last (it's the dangerous one).
function topButtons() {
  const gap = 10, pad = 10, y = 58, h = 38;
  const x0 = pad, x1 = canvas.width - pad;
  const w = (x1 - x0 - gap * 2) / 3;
  const defs = [
    { key: 'build',     icon: buildIcon(), word: 'Build',    menu: true },
    { key: 'people',    icon: '🧍',        word: 'People',   menu: true },
    { key: 'disasters', icon: '🌪',        word: 'Disaster', menu: true },
  ];
  return defs.map((d, i) => ({ ...d, x: x0 + i * (w + gap), y, w, h }));
}

// The "Stop Building" button, parked at the BOTTOM CENTRE and shown only
// while you're actually placing something. Tap it and you're back to
// dragging the map around.
function stopBuildRect() {
  if (selected == null) return null;
  const w = 190, h = 40;
  return { x: (canvas.width - w) / 2, y: canvas.height - h - 16, w, h };
}

// The list that drops down under an open button. Kept on-screen at the right edge.
function menuRects(kind) {
  const btn = topButtons().find(b => b.key === kind);
  const items = kind === 'build'
    ? buttons.map(b => ({ label: b.icon + ' ' + b.short, type: b.type, cost: 0 }))
    : kind === 'people'
    ? CRITTER_MENU.map(c => ({ ...c }))
    : MACHINE_MENU.map(m => ({ ...m }));
  // disasters need extra room so the name never crowds its price tag
  const minW = kind === 'disasters' ? 214 : 172;
  const w = Math.max(btn.w, minW), h = 38, gap = 4;
  let x = btn.x;
  if (x + w > canvas.width - 6) x = canvas.width - 6 - w;   // don't run off the right edge
  return items.map((it, i) => ({ ...it, x, y: TOPBAR + 6 + i * (h + gap), w, h }));
}

// tapping a top button: open or close its drop-down
function handleTopButton(b) {
  openMenu = (openMenu === b.key) ? null : b.key;
}

// tapping a row inside an open menu
function chooseFromMenu(kind, r) {
  if (kind === 'build') {
    selected = r.type;
    setStatus('Now placing ' + r.label, '#7ddf8f', true);
    openMenu = null;
  } else if (kind === 'people') {
    const made = spawnCritters(r.kind);
    setStatus(made ? r.label + ' wander in!' : 'No open ground left to stand on!',
              made ? '#7ddf8f' : '#ff6b5e');
    openMenu = null;
    selected = null;                 // stop building so you can watch them arrive
  } else {
    pickDisaster(r);      // pays, closes the menu, and starts the tension countdown
  }
}

function pressAt(px, py) {
  // if a menu is open, it gets first say
  if (openMenu) {
    for (const r of menuRects(openMenu)) {
      if (inside(px, py, r)) { chooseFromMenu(openMenu, r); return true; }
    }
    const tb = topButtons().find(b => inside(px, py, b));
    if (tb) { handleTopButton(tb); return true; }   // let them switch menus
    openMenu = null;                                 // tapped away — just close it
    return true;
  }
  // no menu open: check the top buttons
  const tb = topButtons().find(b => inside(px, py, b));
  if (tb) { handleTopButton(tb); return true; }
  if (inside(px, py, fullBtnRect())) { toggleFullscreen(); return true; }
  // the bottom-centre STOP BUILDING button
  const sb = stopBuildRect();
  if (sb && inside(px, py, sb)) { stopBuilding(); return true; }
  if (py <= TOPBAR) return true;    // tapped an empty part of the bar — do nothing
  return false;                     // tapped the world — paint, or drag the map
}

// ---------------------------------------------------------------------
// INPUT — mouse and touch both paint blocks while held down
// ---------------------------------------------------------------------
let painting = false;               // dragging to paint blocks (an item is selected)
let panning = false;                // dragging to slide the map (pan mode)
let lastDrag = { x: 0, y: 0 };      // where the finger/mouse was last frame, for panning
// Taps on the Arcade link are left alone so the link actually navigates.
function onBackButton(e) { return e.target && e.target.closest && e.target.closest('#back'); }

// after a tap lands in the world, either paint or start a pan, depending on mode
function startWorldDrag(x, y) {
  if (selected == null) { panning = true; lastDrag = { x, y }; }   // pan mode
  else { painting = true; placeAt(x, y); }                          // build mode
}

addEventListener('mousedown', e => {
  if (onBackButton(e)) return;
  if (!pressAt(e.clientX, e.clientY)) startWorldDrag(e.clientX, e.clientY);
});
addEventListener('mousemove', e => {
  if (painting) placeAt(e.clientX, e.clientY);
  else if (panning) { doPan(e.clientX - lastDrag.x, e.clientY - lastDrag.y); lastDrag = { x: e.clientX, y: e.clientY }; }
});
addEventListener('mouseup', () => { painting = false; panning = false; });

// MOUSE WHEEL / TRACKPAD ZOOM. Scroll up over the town to zoom in toward
// the pointer, scroll down to zoom back out. We keep the spot under the
// cursor pinned so it feels like leaning in, not jumping.
addEventListener('wheel', e => {
  if (onBackButton(e)) return;
  if (e.clientY <= TOPBAR) return;             // leave the toolbar alone
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  setCamera(zoom * factor, screenToWorld(e.clientX, e.clientY), e.clientX, e.clientY);
}, { passive: false });

// PINCH TO ZOOM. Two fingers on the glass = grab the map: spread apart to
// zoom in, pinch together to zoom out, and slide both fingers to pan. One
// finger still paints blocks like before.
let pinch = null;   // remembers the two-finger gesture between frames, or null

// distance between the two fingers, and the point exactly between them
function twoFinger(e) {
  const a = e.touches[0], b = e.touches[1];
  return {
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2,
  };
}

addEventListener('touchstart', e => {
  if (onBackButton(e)) return;                 // don't preventDefault - let the link work
  e.preventDefault();
  if (e.touches.length >= 2) {                 // two fingers down: start a pinch, don't paint/pan
    painting = false; panning = false;
    pinch = twoFinger(e);
    return;
  }
  const t = e.changedTouches[0];
  if (!pressAt(t.clientX, t.clientY)) startWorldDrag(t.clientX, t.clientY);
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length >= 2) {        // mid-pinch: zoom + pan together
    const now = twoFinger(e);
    // the town spot under the OLD midpoint should land under the NEW one
    const anchor = screenToWorld(pinch.x, pinch.y);
    setCamera(zoom * (now.dist / pinch.dist), anchor, now.x, now.y);
    pinch = now;
    return;
  }
  const t = e.changedTouches[0];
  if (painting) placeAt(t.clientX, t.clientY);
  else if (panning) { doPan(t.clientX - lastDrag.x, t.clientY - lastDrag.y); lastDrag = { x: t.clientX, y: t.clientY }; }
}, { passive: false });
addEventListener('touchend', e => {
  painting = false; panning = false;
  if (e.touches.length < 2) pinch = null;      // pinch is over once a finger lifts
});

// number keys pick a build item too
const KEY_ITEM = { '1': HOUSE, '2': APT, '3': TREE, '4': STONE, '5': BUNKER, '6': EMPTY };
addEventListener('keydown', e => {
  if (e.key in KEY_ITEM) {
    selected = KEY_ITEM[e.key];
    setStatus('Now placing ' + iconFor(selected), '#7ddf8f', true);
  }
  if (e.key.toLowerCase() === 'd') openMenu = openMenu === 'disasters' ? null : 'disasters';  // D for Disasters menu
  if (e.key.toLowerCase() === 'b') openMenu = openMenu === 'build' ? null : 'build';          // B for Build menu
  if (e.key.toLowerCase() === 'p') { spawnCritters('person'); setStatus('🧍 People wander in!', '#7ddf8f'); }
  if (e.key.toLowerCase() === 'c') { spawnCritters('cow');    setStatus('🐄 Cows wander in!', '#7ddf8f'); }
  if (e.key.toLowerCase() === 'g') { spawnCritters('dog');    setStatus('🐕 Dogs wander in!', '#7ddf8f'); }
  if (e.key === 'Escape') stopBuilding();                        // Esc stops building
  if (e.key === '0') { zoom = 1; panX = 0; panY = 0; }           // 0 zooms back out to the whole town
});

// ---------------------------------------------------------------------
// UPDATE — the tornado wanders and EATS
// ---------------------------------------------------------------------
let lastTime = 0;
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake -= dt;
  if (brokeFlash > 0) brokeFlash -= dt;
  if (statusTimer > 0 && !statusSticky) statusTimer -= dt;

  // let squares recover from their "just been hit" moment
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) if (hitCool[y][x] > 0) hitCool[y][x] -= dt;
  }

  // Disasters you've paid for count down a moment of dread, with the ground
  // rumbling harder the closer they get. When the timer hits zero, they strike.
  if (pendings.length) {
    for (const p of pendings) p.timer -= dt;
    let worst = 0;
    for (const p of pendings) worst = Math.max(worst, 1 - p.timer / TENSION);
    shake = Math.max(shake, 0.05 + worst * 0.25);   // tension you can feel
    for (const p of pendings) {
      if (p.timer <= 0) {
        beginDisaster(p.type);
        setStatus(p.label + '!', '#ff9f43');
        shake = Math.max(shake, 0.5);
        buzz(p.type);                 // rattle the phone (where the browser allows it)
      }
    }
    pendings = pendings.filter(p => p.timer > 0);
  }

  for (const D of disasters) {      // every active disaster does its thing
    D.life -= dt;
    const s = cellSize();

    if (D.type === 'tornado') {
      // tornadoes HUNT HOUSES. Find the nearest one still standing...
      let target = null, best = 999999;
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          const d2 = Math.hypot(bx - D.x, by - D.y);
          if (d2 < best) { best = d2; target = { x: bx, y: by }; }
        }
      }
      D.wobble += dt * 1.7;
      if (target) {
        // ...and weave drunkenly toward its doom
        const ang = Math.atan2(target.y - D.y, target.x - D.x);
        D.x += Math.cos(ang) * 115 * dt + Math.sin(D.wobble) * 45 * dt;
        D.y += Math.sin(ang) * 115 * dt + Math.cos(D.wobble) * 45 * dt;
      } else {
        D.x += 150 * dt;   // no houses left — it spins away, satisfied
      }
      D.y = Math.max(TOPBAR + 40, Math.min(TOPBAR + ROWS * s - 40, D.y));
      shake = 0.2;
      // it ONLY eats housing (houses AND apartments) — trees and stone
      // just get a wild hairdo
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          // a tornado CHEWS — usually takes a house out in one go
          if (Math.hypot(bx - D.x, by - D.y) < 70) hitBlock(gx, gy, bx, by, 3);
        }
      }
      if (D.life <= 0 || D.x > COLS * s + 80) D.done = true;
    }

    if (D.type === 'meteors') {
      shake = Math.max(shake, 0.1);
      D.spawnTimer -= dt;
      if (D.spawnTimer <= 0) {
        D.spawnTimer = 0.45;                    // a new fireball every half second
        // aim each fireball to land ON the town: pick a landing spot, then
        // start it up-and-to-the-right so its slanted fall arrives there
        const lx = Math.random() * (COLS * s);
        const ty = TOPBAR + 40 + Math.random() * (ROWS * s - 80);
        const fall = (ty - (TOPBAR - 60)) / 620;   // seconds it takes to fall
        D.meteors.push({ x: lx + 260 * fall, y: TOPBAR - 60, ty });
      }
      for (const m of D.meteors) {
        m.x -= 260 * dt;                        // falling at a slant
        m.y += 620 * dt;
        if (m.y >= m.ty) {
          m.hit = true;
          shake = 0.35;
          craters.push({ x: m.x, y: m.y, r: 26 + Math.random() * 14 });
          // anyone standing OUTSIDE near the impact gets LAUNCHED
          for (const p of people) {
            if (!p.gone && !p.sheltering && Math.hypot(p.x - m.x, p.y - m.y) < 85) {
              p.gone = true;
              peopleLaunched++;
              launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
                vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
            }
          }
          // BOOM — everything near the impact is gone, even stone
          for (let gy = 0; gy < ROWS; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              // bunkers shrug off even a direct meteor hit
              if (grid[gy][gx] === EMPTY || grid[gy][gx] === BUNKER) continue;
              const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
              // a meteor lands hardest of all
              if (Math.hypot(bx - m.x, by - m.y) < 60) hitBlock(gx, gy, bx, by, 4);
            }
          }
          for (let i = 0; i < 14; i++) {
            debris.push({ x: m.x, y: m.y,
              vx: (Math.random() - 0.5) * 600, vy: -Math.random() * 500,
              spin: Math.random() * 10, life: 0.8,
              color: i % 2 ? '#ff9f43' : '#ffd23f' });
          }
        }
      }
      D.meteors = D.meteors.filter(m => !m.hit);
      if (D.life <= 0 && D.meteors.length === 0) D.done = true;
    }

    if (D.type === 'quake') {
      shake = 0.3;                              // the ground never stops moving
      // blocks randomly crumble — houses are fragile, stone is tough
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY) continue;
          if (kind === BUNKER) continue;             // bunkers do not care
          const fragile = kind === HOUSE ? 0.9
                        : kind === APT ? 0.7         // tall = topply
                        : kind === TREE ? 0.35 : 0.15;
          if (Math.random() < fragile * dt) {
            // a quake rattles things loose a crack at a time
            hitBlock(gx, gy, gx * s + s / 2, TOPBAR + gy * s + s / 2, 2);
          }
        }
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'flood') {
      // the water rises for 4s, holds for 2s, drains for 4s
      const t2 = 10 - D.life;
      let frac;
      if (t2 < 4) frac = t2 / 4;
      else if (t2 < 6) frac = 1;
      else frac = Math.max(0, 1 - (t2 - 6) / 4);
      D.waterY = (TOPBAR + ROWS * s) - frac * (ROWS * s) * 0.72;
      // anything underwater washes away... except STONE. stone doesn't care.
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY || kind === STONE || kind === BUNKER) continue;   // waterproof
          const by = TOPBAR + gy * s + s / 2;
          // underwater: the damp works away at it
          if (by > D.waterY && Math.random() < dt * 2.5)
            hitBlock(gx, gy, gx * s + s / 2, by, 2, true);
        }
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'balls') {
      shake = Math.max(shake, 0.08);
      for (const ball of D.balls) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        // BOING — bounce off every edge of the world
        if (ball.x < 16) { ball.x = 16; ball.vx = Math.abs(ball.vx); }
        if (ball.x > COLS * s - 16) { ball.x = COLS * s - 16; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < TOPBAR + 16) { ball.y = TOPBAR + 16; ball.vy = Math.abs(ball.vy); }
        if (ball.y > TOPBAR + ROWS * s - 16) { ball.y = TOPBAR + ROWS * s - 16; ball.vy = -Math.abs(ball.vy); }
        // anything a ball touches gets bounced INTO OBLIVION (except bunkers)
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (kind === EMPTY || kind === BUNKER) continue;
            const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
            // a rubber ball mostly just DENTS things
            if (Math.hypot(bx - ball.x, by - ball.y) < 34) hitBlock(gx, gy, bx, by, 2);
          }
        }
      }
      if (D.life <= 0) {
        // time's up — every ball POPS in a burst of its own color
        for (const ball of D.balls) {
          for (let i = 0; i < 8; i++) {
            debris.push({ x: ball.x, y: ball.y,
              vx: (Math.random() - 0.5) * 400, vy: -Math.random() * 350,
              spin: Math.random() * 10, life: 0.6, color: ball.color });
          }
        }
        D.done = true;
      }
    }
  }
  disasters = disasters.filter(D => !D.done);   // sweep up the finished ones

  // ---- THE LITTLE PEOPLE — wandering, panicking, HIDING, or REPAIRING ----
  const panicking = disasters.length > 0;
  const cs = cellSize();

  // which broken buildings already have a worker on them (one each, no crowding)
  const claimed = new Set();
  for (const p of people) {
    if (p.job) {
      if (panicking) { p.job = null; p.jobT = 0; p.fixing = false; }   // drop tools and RUN
      else claimed.add(p.job.gx + ',' + p.job.gy);
    }
  }

  // how many people are inside (or racing toward) each building? MAX 3.
  // a house is not a clown car.
  const occupancy = {};
  for (const p of people) {
    const spot = p.sheltering || p.shelterTarget;
    if (spot) {
      const k = spot.gx + ',' + spot.gy;
      occupancy[k] = (occupancy[k] || 0) + 1;
    }
  }

  for (const p of people) {

    // already hiding inside a building?
    if (p.sheltering) {
      const kind = grid[p.sheltering.gy][p.sheltering.gx];
      if (kind !== HOUSE && kind !== APT && kind !== BUNKER) {
        // their shelter was DESTROYED with them inside it. out they go!
        p.gone = true;
        peopleLaunched++;
        launchedFolk.push({
          x: p.sheltering.gx * cs + cs / 2,
          y: TOPBAR + p.sheltering.gy * cs + cs / 2,
          vx: (Math.random() - 0.5) * 600, vy: -400 - Math.random() * 300,
          spin: 0, life: 1.4, shirt: p.shirt });
      } else if (!panicking) {
        // all clear! everyone shuffles back outside
        p.x = p.sheltering.gx * cs + cs / 2 + (Math.random() - 0.5) * 20;
        p.y = TOPBAR + p.sheltering.gy * cs + cs + 6;
        p.sheltering = null;
      }
      continue;                     // hiding people don't walk around
    }

    p.walk += dt * (panicking ? 16 : 6);
    p.bob += dt * (panicking ? 14 : 3.2);      // a happy sway, or a terrified jitter

    if (panicking) {
      // RUN FOR SHELTER — find the nearest building with a roof.
      // (Whether it's a GOOD shelter is... not their department.)
      let target = p.shelterTarget;
      if (!target || (grid[target.gy][target.gx] !== HOUSE &&
                      grid[target.gy][target.gx] !== APT &&
                      grid[target.gy][target.gx] !== BUNKER)) {
        target = null;
        let best = 999999;
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (kind !== HOUSE && kind !== APT && kind !== BUNKER) continue;
            if ((occupancy[gx + ',' + gy] || 0) >= 3) continue;   // that one's FULL
            const bx = gx * cs + cs / 2, by = TOPBAR + gy * cs + cs / 2;
            const d2 = Math.hypot(bx - p.x, by - p.y);
            if (d2 < best) { best = d2; target = { gx, gy, x: bx, y: by }; }
          }
        }
        p.shelterTarget = target;
        if (target) {
          // claim a spot so the next runner picks somewhere else
          const k = target.gx + ',' + target.gy;
          occupancy[k] = (occupancy[k] || 0) + 1;
        }
      }
      if (target) {
        if (Math.hypot(target.x - p.x, target.y - p.y) < 12) {
          // one last headcount at the door...
          let inside = 0;
          for (const q of people) {
            if (q.sheltering && q.sheltering.gx === target.gx &&
                q.sheltering.gy === target.gy) inside++;
          }
          if (inside < 3) {
            p.sheltering = { gx: target.gx, gy: target.gy };   // squeezed in!
            p.shelterTarget = null;
            continue;
          }
          p.shelterTarget = null;      // full! no room! run somewhere else!!
        } else {
          p.angle = Math.atan2(target.y - p.y, target.x - p.x) + (Math.random() - 0.5) * 0.3;
        }
      } else {
        p.angle += (Math.random() - 0.5) * dt * 22;   // no shelter?! headless-chicken mode
      }
    } else {
      // ---- ALL CLEAR: TIME TO FIX THE PLACE UP ----
      // Only people do repairs (cows and dogs are no help at all). One
      // worker per building, and it's slow on purpose so you can watch the
      // building climb back from heavy damage to light to good as new.
      p.shelterTarget = null;
      if (p.kind === 'person') {
        // is the job we picked still a job? (it may have been finished or flattened)
        if (p.job && (grid[p.job.gy][p.job.gx] === EMPTY ||
                      damage[p.job.gy][p.job.gx] === PRISTINE)) {
          p.job = null; p.jobT = 0;
        }
        if (!p.job) {                       // look for the nearest broken thing
          let best = 999999, found = null;
          for (let gy = 0; gy < ROWS; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              if (grid[gy][gx] === EMPTY || damage[gy][gx] === PRISTINE) continue;
              if (claimed.has(gx + ',' + gy)) continue;      // someone's already on it
              const bx = gx * cs + cs / 2, by = TOPBAR + gy * cs + cs / 2;
              const d2 = Math.hypot(bx - p.x, by - p.y);
              if (d2 < best) { best = d2; found = { gx, gy, x: bx, y: by }; }
            }
          }
          if (found) { p.job = found; p.jobT = 0; claimed.add(found.gx + ',' + found.gy); }
        }
        if (p.job) {
          const reach = Math.hypot(p.job.x - p.x, p.job.y - p.y);
          if (reach > cs * 0.75) {          // still walking over, toolbox in hand
            p.angle = Math.atan2(p.job.y - p.y, p.job.x - p.x);
            p.fixing = false;
          } else {                          // ON SITE — start hammering
            p.fixing = true;
            p.jobT += dt;
            p.hammer = (p.hammer || 0) + dt * 9;         // swing the hammer
            if (p.jobT >= REPAIR_TIME) {                 // one damage level mended!
              p.jobT = 0;
              damage[p.job.gy][p.job.gx]--;
              repaired++;
              if (damage[p.job.gy][p.job.gx] <= PRISTINE) {
                claimed.delete(p.job.gx + ',' + p.job.gy);
                p.job = null; p.fixing = false;
              }
            }
          }
        } else {
          p.fixing = false;
          if (Math.random() < dt * 0.8) p.angle = Math.random() * 6.28;   // nothing to do, amble
        }
      } else {
        if (Math.random() < dt * 0.8) p.angle = Math.random() * 6.28;     // calm amble
      }
    }
    if (p.fixing) continue;               // a worker mid-repair stands still

    // dogs scamper, cows plod, people are in between
    const pace = p.kind === 'dog' ? 1.35 : p.kind === 'cow' ? 0.6 : 1;
    const speed = (panicking ? 150 : 30) * pace;
    const nx = p.x + Math.cos(p.angle) * speed * dt;
    const ny = p.y + Math.sin(p.angle) * speed * dt;

    // WALLS ARE SOLID. Try each direction on its own so they slide along a
    // wall instead of sticking to it. The one square they ARE allowed into
    // is the shelter they're running for — that's the door.
    const goal = p.shelterTarget;
    const okAt = (x, y) => {
      const gx = Math.floor(x / cs), gy = Math.floor((y - TOPBAR) / cs);
      if (goal && goal.gx === gx && goal.gy === gy) return true;   // their doorway
      return !blocked(gx, gy);
    };
    if (okAt(nx, p.y)) p.x = nx;
    else p.angle = Math.PI - p.angle;              // bounced off a wall sideways
    if (okAt(p.x, ny)) p.y = ny;
    else p.angle = -p.angle;                       // bounced off a wall up/down

    p.x = Math.max(4, Math.min(COLS * cs - 4, p.x));
    p.y = Math.max(TOPBAR + 4, Math.min(TOPBAR + ROWS * cs - 4, p.y));

    // did something GET them on the way?
    let hit = false;
    for (const D of disasters) {
      if (D.type === 'tornado' && Math.hypot(D.x - p.x, D.y - p.y) < 45) hit = true;
      if (D.type === 'balls') {
        for (const ball of D.balls) {
          if (Math.hypot(ball.x - p.x, ball.y - p.y) < 26) hit = true;
        }
      }
      if (D.type === 'flood' && p.y > D.waterY + 10) hit = true;
    }
    if (hit && !p.gone) {
      p.gone = true;
      peopleLaunched++;
      launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
        vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
    }
  }
  people = people.filter(p => !p.gone);

  // airborne folk tumble gracefully out of frame
  for (const f of launchedFolk) {
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vy += 600 * dt;
    f.spin += dt * 12;
    f.life -= dt;
  }
  launchedFolk = launchedFolk.filter(f => f.life > 0);

  // debris tumbles through the air and fades
  for (const d of debris) {
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 700 * dt;               // gravity brings it all back down
    d.spin += dt * 10;
    d.life -= dt;
  }
  debris = debris.filter(d => d.life > 0);
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function draw() {
  const shx = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 10 : 0;
  ctx.save();
  ctx.translate(shx, shy);

  // THE CAMERA. Everything from here until ctx.restore() is drawn through
  // the zoom lens. We clip to the play area first so zoomed-in scenery can
  // never spill up over the toolbar, then slide (pan) and scale (zoom).
  // At zoom 1 with no pan this is exactly the identity — nothing changes.
  ctx.beginPath();
  ctx.rect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);
  ctx.clip();

  // FOG OF WAR — a misty slate fills the whole play area behind everything.
  // The green town gets drawn on top, so fog shows around the town's edges
  // (and a little more as you pan past them). Drawn in SCREEN space, before
  // the camera transform, so it's a steady backdrop the town floats over.
  ctx.fillStyle = '#2b333d';
  ctx.fillRect(0, TOPBAR, canvas.width, canvas.height - TOPBAR);
  for (let i = 0; i < 12; i++) {                 // soft cloud blobs for a foggy look
    const cxF = hash(i * 1.3) * canvas.width;
    const cyF = TOPBAR + hash(i * 2.7) * (canvas.height - TOPBAR);
    const rF = 50 + hash(i * 3.9) * 80;
    ctx.fillStyle = `rgba(210, 220, 235, ${0.04 + hash(i * 5.1) * 0.05})`;
    ctx.beginPath();
    ctx.ellipse(cxF, cyF, rF, rF * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.translate(panX, TOPBAR + panY);
  ctx.scale(zoom, zoom);
  ctx.translate(0, -TOPBAR);

  // the town's grass — ONLY the grid area now (the rest stays fog), with a
  // dark earth border and a bright rim so the town has clear, crisp edges.
  const gw = gridW(), gh = gridH();
  ctx.fillStyle = '#243318';
  ctx.fillRect(-6, TOPBAR - 6, gw + 12, gh + 12);
  ctx.fillStyle = '#4a7c3a';
  ctx.fillRect(0, TOPBAR, gw, gh);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, TOPBAR + 1, gw - 2, gh - 2);

  // meteor craters, scarred into the lawn forever
  for (const c of craters) {
    ctx.fillStyle = 'rgba(30, 22, 14, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(60, 45, 28, 0.5)';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r * 0.55, c.r * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const s = cellSize();

  // faint grid lines so builders can aim
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= COLS; gx++) {
    ctx.beginPath();
    ctx.moveTo(gx * s, TOPBAR);
    ctx.lineTo(gx * s, TOPBAR + ROWS * s);
    ctx.stroke();
  }
  for (let gy = 0; gy <= ROWS; gy++) {
    ctx.beginPath();
    ctx.moveTo(0, TOPBAR + gy * s);
    ctx.lineTo(COLS * s, TOPBAR + gy * s);
    ctx.stroke();
  }

  // the blocks of the town
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const kind = grid[gy][gx];
      if (kind === EMPTY) continue;
      const x = gx * s, y = TOPBAR + gy * s;
      // every block gets its own little quirk from its position, so the town
      // looks hand-made instead of stamped out
      const q = hash(gx * 7.3 + gy * 3.1);
      // a soft shadow on the grass under everything — makes it all pop
      ctx.fillStyle = 'rgba(0, 0, 0, 0.16)';
      ctx.beginPath();
      ctx.ellipse(x + s * 0.5, y + s * 0.92, s * 0.36, s * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();

      if (kind === HOUSE) {
        ctx.fillStyle = ['#c9a06a', '#d9b184', '#c08f5e'][Math.floor(q * 3)];  // walls
        ctx.fillRect(x + s * 0.15, y + s * 0.4, s * 0.7, s * 0.5);
        ctx.fillStyle = '#8fd0ff';                      // a cheerful little window
        ctx.fillRect(x + s * 0.2, y + s * 0.5, s * 0.16, s * 0.14);
        ctx.fillStyle = ['#b5563c', '#a8483f', '#c26a44'][Math.floor(q * 3)];  // roof
        ctx.beginPath();
        ctx.moveTo(x + s * 0.06, y + s * 0.46);
        ctx.lineTo(x + s * 0.5, y + s * 0.06);
        ctx.lineTo(x + s * 0.94, y + s * 0.46);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#8c6b4a';                      // chimney
        ctx.fillRect(x + s * 0.68, y + s * 0.14, s * 0.11, s * 0.2);
        ctx.fillStyle = 'rgba(230, 230, 235, 0.6)';     // a curl of smoke
        ctx.beginPath();
        ctx.arc(x + s * (0.735 + Math.sin(elapsed * 1.4 + q * 6) * 0.04),
                y + s * 0.06, s * 0.055, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5b3b1e';                      // door
        ctx.fillRect(x + s * 0.44, y + s * 0.62, s * 0.16, s * 0.28);
        ctx.fillStyle = '#ffd23f';                      // doorknob
        ctx.fillRect(x + s * 0.57, y + s * 0.74, s * 0.03, s * 0.03);
      } else if (kind === TREE) {
        ctx.fillStyle = '#6d5330';                      // trunk
        ctx.fillRect(x + s * 0.44, y + s * 0.55, s * 0.14, s * 0.35);
        // three overlapping puffs of leaves, swaying in the breeze
        const sway = Math.sin(elapsed * 1.1 + q * 6.28) * s * 0.03;
        ctx.fillStyle = ['#3f8a3f', '#4d9c43', '#357a38'][Math.floor(q * 3)];
        ctx.beginPath(); ctx.arc(x + s * 0.5 + sway, y + s * 0.34, s * 0.28, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + s * 0.32 + sway, y + s * 0.46, s * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + s * 0.68 + sway, y + s * 0.46, s * 0.19, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';    // sunlight on top
        ctx.beginPath(); ctx.arc(x + s * 0.42 + sway, y + s * 0.26, s * 0.1, 0, Math.PI * 2); ctx.fill();
        if (q > 0.72) {                                 // some trees have apples!
          ctx.fillStyle = '#e8453c';
          ctx.beginPath(); ctx.arc(x + s * 0.62 + sway, y + s * 0.38, s * 0.05, 0, Math.PI * 2); ctx.fill();
        }
      } else if (kind === STONE) {
        ctx.fillStyle = '#8a8d94';                      // a lumpy boulder
        ctx.beginPath();
        ctx.moveTo(x + s * 0.1,  y + s * 0.88);
        ctx.lineTo(x + s * 0.16, y + s * 0.34);
        ctx.lineTo(x + s * 0.44, y + s * 0.14);
        ctx.lineTo(x + s * 0.8,  y + s * 0.26);
        ctx.lineTo(x + s * 0.9,  y + s * 0.88);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#a7aab2';                      // light catching the top
        ctx.beginPath();
        ctx.moveTo(x + s * 0.16, y + s * 0.34);
        ctx.lineTo(x + s * 0.44, y + s * 0.14);
        ctx.lineTo(x + s * 0.8,  y + s * 0.26);
        ctx.lineTo(x + s * 0.6,  y + s * 0.4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(60, 62, 68, 0.55)';       // speckles
        ctx.fillRect(x + s * 0.3, y + s * 0.58, s * 0.09, s * 0.07);
        ctx.fillRect(x + s * 0.62, y + s * 0.68, s * 0.07, s * 0.06);
      } else if (kind === APT) {
        ctx.fillStyle = '#5a6a7a';                      // the tall tower
        ctx.fillRect(x + s * 0.12, y + s * 0.06, s * 0.76, s * 0.86);
        ctx.fillStyle = '#7a8a9a';                      // roof ledge
        ctx.fillRect(x + s * 0.08, y + s * 0.06, s * 0.84, s * 0.1);
        ctx.fillStyle = '#93a3b3';                      // rooftop water tank
        ctx.fillRect(x + s * 0.6, y - s * 0.02, s * 0.14, s * 0.09);
        // windows — a few are dark, because some people are out
        for (let wy2 = 0; wy2 < 3; wy2++) {
          for (let wx2 = 0; wx2 < 2; wx2++) {
            const lit = hash(gx * 11 + gy * 5 + wy2 * 3 + wx2) > 0.28;
            ctx.fillStyle = lit ? '#ffd23f' : '#33414e';
            ctx.fillRect(x + s * (0.24 + wx2 * 0.3), y + s * (0.26 + wy2 * 0.21),
                         s * 0.16, s * 0.13);
          }
        }
        ctx.fillStyle = '#33414e';                      // front door
        ctx.fillRect(x + s * 0.42, y + s * 0.78, s * 0.16, s * 0.14);
      } else if (kind === BUNKER) {
        ctx.fillStyle = '#4a5548';                      // squat armored dome
        ctx.beginPath();
        ctx.arc(x + s * 0.5, y + s * 0.72, s * 0.4, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.2);
        ctx.fillStyle = '#6a7a66';                      // top rim
        ctx.fillRect(x + s * 0.1, y + s * 0.72, s * 0.8, s * 0.06);
        ctx.fillStyle = 'rgba(255,255,255,0.14)';       // shine on the dome
        ctx.beginPath();
        ctx.ellipse(x + s * 0.36, y + s * 0.52, s * 0.12, s * 0.06, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2c332b';                      // the sealed door
        ctx.fillRect(x + s * 0.4, y + s * 0.6, s * 0.2, s * 0.32);
        ctx.fillStyle = '#8fd0ff';                      // tiny porthole
        ctx.beginPath(); ctx.arc(x + s * 0.5, y + s * 0.68, s * 0.05, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#c8d4c4';                      // bolts
        ctx.fillRect(x + s * 0.16, y + s * 0.8, s * 0.05, s * 0.05);
        ctx.fillRect(x + s * 0.79, y + s * 0.8, s * 0.05, s * 0.05);
      }

      // ---- BATTLE SCARS ----
      // Lightly damaged: a couple of cracks and a scorch. Heavily damaged:
      // deep cracks, a bite taken out of the top, and a wisp of smoke.
      const dmg = damage[gy][gx];
      if (dmg > PRISTINE) {
        ctx.strokeStyle = dmg === HEAVY ? 'rgba(20,14,10,0.75)' : 'rgba(30,22,16,0.5)';
        ctx.lineWidth = Math.max(1, s * (dmg === HEAVY ? 0.05 : 0.035));
        ctx.beginPath();                                 // a jagged crack
        ctx.moveTo(x + s * 0.32, y + s * 0.9);
        ctx.lineTo(x + s * 0.42, y + s * 0.62);
        ctx.lineTo(x + s * 0.34, y + s * 0.5);
        ctx.stroke();
        if (dmg === HEAVY) {
          ctx.beginPath();                               // a second, worse one
          ctx.moveTo(x + s * 0.72, y + s * 0.9);
          ctx.lineTo(x + s * 0.62, y + s * 0.58);
          ctx.lineTo(x + s * 0.74, y + s * 0.38);
          ctx.stroke();
          ctx.fillStyle = '#4a7c3a';                     // a chunk missing off the top
          ctx.beginPath();
          ctx.moveTo(x + s * 0.5, y + s * 0.06);
          ctx.lineTo(x + s * 0.95, y + s * 0.1);
          ctx.lineTo(x + s * 0.95, y + s * 0.34);
          ctx.closePath(); ctx.fill();
          // a lazy wisp of smoke
          ctx.fillStyle = 'rgba(60, 60, 66, 0.35)';
          ctx.beginPath();
          ctx.arc(x + s * (0.7 + Math.sin(elapsed * 1.7 + gx) * 0.06),
                  y + s * (0.16 - (elapsed * 0.15 + gy * 0.3) % 0.3),
                  s * 0.09, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = dmg === HEAVY ? 'rgba(0,0,0,0.22)' : 'rgba(0,0,0,0.1)';
        ctx.fillRect(x, y, s, s);                        // soot over the whole square
      }
    }
  }

  // A little green progress bar over whatever building is being repaired,
  // so you can see the work happening.
  for (const p of people) {
    if (!p.fixing || !p.job) continue;
    const bx2 = p.job.gx * s, by2 = TOPBAR + p.job.gy * s;
    const frac = Math.max(0, Math.min(1, p.jobT / REPAIR_TIME));
    ctx.fillStyle = 'rgba(10, 14, 20, 0.75)';
    ctx.fillRect(bx2 + s * 0.12, by2 - s * 0.16, s * 0.76, s * 0.1);
    ctx.fillStyle = '#7ddf8f';
    ctx.fillRect(bx2 + s * 0.13, by2 - s * 0.15, s * 0.74 * frac, s * 0.08);
    ctx.fillStyle = '#ffe9a8';                       // a tiny wrench, to say "under repair"
    ctx.font = `bold ${Math.max(7, s * 0.3)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('🔧', bx2 + s * 0.5, by2 - s * 0.22);
  }

  // tiny heads peeking out of every occupied shelter
  const peek = {};
  for (const p of people) {
    if (p.sheltering) {
      const k = p.sheltering.gx + ',' + p.sheltering.gy;
      peek[k] = (peek[k] || 0) + 1;
    }
  }
  for (const k in peek) {
    const parts = k.split(',');
    const px2 = parts[0] * s, py2 = TOPBAR + parts[1] * s;
    for (let i = 0; i < Math.min(3, peek[k]); i++) {
      ctx.fillStyle = '#f2c79b';
      ctx.beginPath();
      ctx.arc(px2 + s * (0.3 + i * 0.2), py2 + s * 0.88, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // The critters, bless them (the hiding ones are indoors, unseen).
  // Everyone is drawn relative to `u` — one grid square — so they stay the
  // right size next to the houses however big the squares are.
  //
  // When the sky is calm they're HAPPY: bouncing, smiling, humming little
  // notes. The moment doom is on the way they're TERRIFIED: eyes like
  // dinner plates, arms in the air, wobbling. Everyone pulls a slightly
  // different face, so a crowd doesn't look like clones.
  const doom = disasters.length > 0 || pendings.length > 0;
  const HAPPY_EMOTE = ['♪', '♥', '☺'];
  const PANIC_EMOTE = ['!!', '?!', 'AAA'];

  for (const p of people) {
    if (p.sheltering) continue;
    const u = s / 26;                                // one "unit" scaled to the square
    const step = p.fixing ? 0 : Math.sin(p.walk) * 2 * u;   // planted feet while working
    const facing = Math.cos(p.angle) < 0 ? -1 : 1;   // which way are they pointed?
    const hop = p.fixing ? 0
              : doom ? Math.abs(Math.sin(p.bob)) * 2.5 * u   // panicked jitter
                     : Math.sin(p.bob) * 1.2 * u;            // happy sway
    const eyeW = doom ? 2.3 * u : 1.1 * u;           // eyes go WIDE when scared

    ctx.save();
    ctx.translate(0, -hop);                          // bounce the whole critter

    if (p.kind === 'cow') {
      ctx.fillStyle = '#3b2f2a';                     // stumpy legs
      ctx.fillRect(p.x - 7 * u, p.y - 1 * u + step, 2.4 * u, 6 * u - step);
      ctx.fillRect(p.x + 4.6 * u, p.y - 1 * u - step, 2.4 * u, 6 * u + step);
      ctx.strokeStyle = '#f4f4f2'; ctx.lineWidth = 1.6 * u;   // tail with a tuft
      ctx.beginPath();
      ctx.moveTo(p.x - facing * 9 * u, p.y - 8 * u);
      ctx.lineTo(p.x - facing * 11.5 * u, p.y - 4 * u + Math.sin(p.walk) * 1.5 * u);
      ctx.stroke();
      ctx.fillStyle = '#f4f4f2';                     // big white body
      rrect(p.x - 9 * u, p.y - 10 * u, 18 * u, 10 * u, 4 * u); ctx.fill();
      ctx.fillStyle = '#2f2a28';                     // cow patches
      ctx.beginPath(); ctx.ellipse(p.x - 4 * u, p.y - 7 * u, 3.2 * u, 2.4 * u, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(p.x + 3 * u, p.y - 4.5 * u, 2.6 * u, 2 * u, 0, 0, Math.PI * 2); ctx.fill();
      const hx = p.x + facing * 9 * u;               // head out front
      ctx.fillStyle = '#f4f4f2';
      rrect(hx - 3.4 * u, p.y - 14 * u, 6.8 * u, 7 * u, 2.5 * u); ctx.fill();
      ctx.fillStyle = '#2f2a28';                     // little horns
      ctx.fillRect(hx - 3 * u, p.y - 15.5 * u, 1.4 * u, 2 * u);
      ctx.fillRect(hx + 1.6 * u, p.y - 15.5 * u, 1.4 * u, 2 * u);
      ctx.fillStyle = '#f0a5b8';                     // pink snout
      rrect(hx - 2.4 * u, p.y - 9.5 * u, 4.8 * u, 3 * u, 1.4 * u); ctx.fill();
      ctx.fillStyle = '#000';                        // eyes
      ctx.beginPath(); ctx.arc(hx - 1.6 * u, p.y - 11.6 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(hx + 1.6 * u, p.y - 11.6 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      if (!doom) {                                   // chewing, always chewing
        ctx.strokeStyle = '#7cb342'; ctx.lineWidth = 1.2 * u;
        ctx.beginPath();
        ctx.moveTo(hx + facing * 2.5 * u, p.y - 8 * u);
        ctx.lineTo(hx + facing * 5 * u, p.y - 9.5 * u + Math.sin(p.walk * 3) * u);
        ctx.stroke();
      }
    } else if (p.kind === 'dog') {
      ctx.fillStyle = '#6b4b2a';                     // little legs
      ctx.fillRect(p.x - 5 * u, p.y - 1 * u + step, 2 * u, 5 * u - step);
      ctx.fillRect(p.x + 3 * u, p.y - 1 * u - step, 2 * u, 5 * u + step);
      ctx.strokeStyle = '#8a5c33'; ctx.lineWidth = 2 * u;    // tail: wags happy, tucks scared
      ctx.beginPath();
      ctx.moveTo(p.x - facing * 6.5 * u, p.y - 7 * u);
      if (doom) ctx.lineTo(p.x - facing * 8 * u, p.y - 2 * u);
      else ctx.lineTo(p.x - facing * 10 * u, p.y - 11 * u + Math.sin(p.walk * 3) * 3 * u);
      ctx.stroke();
      ctx.fillStyle = '#8a5c33';                     // body
      rrect(p.x - 6.5 * u, p.y - 8 * u, 13 * u, 7 * u, 3 * u); ctx.fill();
      const hx = p.x + facing * 7 * u;               // head
      ctx.beginPath(); ctx.arc(hx, p.y - 10.5 * u, 3.8 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5e3d20';                     // floppy ear
      ctx.beginPath();
      ctx.ellipse(hx - facing * 2 * u, p.y - 12.5 * u, 1.7 * u, 3 * u, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b2a18';                     // snout
      ctx.beginPath(); ctx.arc(hx + facing * 3 * u, p.y - 9.6 * u, 1.5 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';                        // eye
      ctx.beginPath(); ctx.arc(hx + facing * 1 * u, p.y - 11.4 * u, eyeW * 0.8, 0, Math.PI * 2); ctx.fill();
      if (!doom) {                                   // happy lolling tongue
        ctx.fillStyle = '#ff8fa3';
        ctx.fillRect(hx + facing * 2.4 * u, p.y - 8.6 * u, 1.6 * u, 2.6 * u);
      }
    } else {
      ctx.fillStyle = '#333';                        // busy little legs
      ctx.fillRect(p.x - 3 * u, p.y - 2 * u + step, 2 * u, 5 * u - step);
      ctx.fillRect(p.x + 1 * u, p.y - 2 * u - step, 2 * u, 5 * u + step);
      ctx.fillStyle = p.shirt;                       // shirt
      rrect(p.x - 4 * u, p.y - 10 * u, 8 * u, 9 * u, 1.6 * u); ctx.fill();
      // ARMS: straight up in a panic, hammering when fixing, else swinging
      ctx.strokeStyle = '#f2c79b'; ctx.lineWidth = 1.8 * u;
      ctx.beginPath();
      if (doom) {
        ctx.moveTo(p.x - 4 * u, p.y - 9 * u); ctx.lineTo(p.x - 6.5 * u, p.y - 15 * u);
        ctx.moveTo(p.x + 4 * u, p.y - 9 * u); ctx.lineTo(p.x + 6.5 * u, p.y - 15 * u);
      } else if (p.fixing) {
        const sw = Math.abs(Math.sin(p.hammer || 0));  // the swing, 0=down 1=up
        const hy2 = p.y - 9 * u - sw * 7 * u;
        ctx.moveTo(p.x + 4 * u, p.y - 9 * u); ctx.lineTo(p.x + 7 * u, hy2);
        ctx.moveTo(p.x - 4 * u, p.y - 9 * u); ctx.lineTo(p.x - 6 * u, p.y - 6 * u);
        ctx.stroke();
        ctx.strokeStyle = '#6d5330'; ctx.lineWidth = 1.4 * u;   // hammer handle
        ctx.beginPath();
        ctx.moveTo(p.x + 7 * u, hy2); ctx.lineTo(p.x + 9.5 * u, hy2 - 3 * u);
        ctx.stroke();
        ctx.fillStyle = '#9aa3ad';                              // hammer head
        ctx.fillRect(p.x + 8.6 * u, hy2 - 5 * u, 3.4 * u, 2.4 * u);
        if (sw < 0.15) {                                        // CLANK! sparks
          ctx.fillStyle = '#ffe9a8';
          ctx.font = `bold ${Math.max(7, 8 * u)}px monospace`;
          ctx.textAlign = 'left';
          ctx.fillText('✦', p.x + 10 * u, hy2 - 5 * u);
        }
        ctx.beginPath();                             // (restart path for the stroke below)
      } else {
        ctx.moveTo(p.x - 4 * u, p.y - 9 * u); ctx.lineTo(p.x - 6 * u, p.y - 5 * u + step);
        ctx.moveTo(p.x + 4 * u, p.y - 9 * u); ctx.lineTo(p.x + 6 * u, p.y - 5 * u - step);
      }
      ctx.strokeStyle = '#f2c79b'; ctx.lineWidth = 1.8 * u;
      ctx.stroke();
      const hy = p.y - 13.5 * u;                     // head
      ctx.fillStyle = '#f2c79b';
      ctx.beginPath(); ctx.arc(p.x, hy, 3.8 * u, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';                        // eyes
      ctx.beginPath(); ctx.arc(p.x - 1.5 * u, hy - 0.5 * u, eyeW * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + 1.5 * u, hy - 0.5 * u, eyeW * 0.7, 0, Math.PI * 2); ctx.fill();
      if (doom) {                                    // a big round screaming mouth
        ctx.fillStyle = '#7a2230';
        ctx.beginPath(); ctx.ellipse(p.x, hy + 1.8 * u, 1.3 * u, 1.7 * u, 0, 0, Math.PI * 2); ctx.fill();
      } else {                                       // a little smile + rosy cheeks
        ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 0.9 * u;
        ctx.beginPath(); ctx.arc(p.x, hy + 0.6 * u, 1.9 * u, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 140, 140, 0.55)';
        ctx.beginPath(); ctx.arc(p.x - 3 * u, hy + 1 * u, 1 * u, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x + 3 * u, hy + 1 * u, 1 * u, 0, Math.PI * 2); ctx.fill();
      }
    }

    // the little floating emote above their head
    ctx.font = `bold ${Math.max(7, 9 * u)}px monospace`;
    ctx.textAlign = 'center';
    if (doom) {
      ctx.fillStyle = '#ff4757';
      ctx.fillText(PANIC_EMOTE[p.fear], p.x, p.y - 19 * u + Math.sin(p.bob * 2) * u);
    } else if (Math.sin(p.bob * 0.5 + p.mood) > 0.72) {   // only now and then
      ctx.fillStyle = '#ffe9a8';
      ctx.fillText(HAPPY_EMOTE[p.mood], p.x + 5 * u, p.y - 18 * u);
    }
    ctx.restore();
  }

  // folk currently airborne (they're fine. probably.) — same scale as on foot
  for (const f of launchedFolk) {
    const u = s / 26;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.spin);
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = f.shirt;
    ctx.fillRect(-4 * u, -6 * u, 8 * u, 9 * u);
    ctx.fillStyle = '#f2c79b';
    ctx.beginPath(); ctx.arc(0, -9 * u, 3.5 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // flying debris (the fun part)
  for (const d of debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.spin);
    ctx.globalAlpha = Math.max(0, d.life / 1.2);
    ctx.fillStyle = d.color;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // ---- DRAWING ALL THE DOOM CURRENTLY HAPPENING ----
  for (const D of disasters) {

    if (D.type === 'tornado') {
      // a stack of spinning gray rings, wide up top, narrow at the ground
      for (let ring = 0; ring < 7; ring++) {
        const ry = D.y - ring * 22;
        const rw = 14 + ring * 11 + Math.sin(elapsed * 9 + ring) * 5;
        ctx.fillStyle = `rgba(180, 185, 195, ${0.5 - ring * 0.04})`;
        ctx.beginPath();
        ctx.ellipse(D.x + Math.sin(elapsed * 7 + ring * 1.3) * 7, ry, rw, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (D.type === 'meteors') {
      for (const m of D.meteors) {
        // the fiery trail behind it
        ctx.strokeStyle = 'rgba(255, 159, 67, 0.5)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(m.x + 55, m.y - 130);
        ctx.lineTo(m.x, m.y);
        ctx.stroke();
        // the fireball itself
        ctx.fillStyle = '#ff9f43';
        ctx.beginPath(); ctx.arc(m.x, m.y, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath(); ctx.arc(m.x + 3, m.y - 3, 7, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (D.type === 'quake') {
      // jagged cracks tearing across the ground (seeded so they hold still)
      const rnd = n => {
        const v = Math.sin((D.seed + n) * 127.1) * 43758.55;
        return v - Math.floor(v);
      };
      ctx.strokeStyle = 'rgba(20, 14, 8, 0.6)';
      ctx.lineWidth = 4;
      for (let c = 0; c < 6; c++) {
        let cx2 = rnd(c * 3.3) * gridW();
        let cy2 = TOPBAR + rnd(c * 7.7) * gridH() * 0.3;
        ctx.beginPath();
        ctx.moveTo(cx2, cy2);
        for (let seg = 0; seg < 8; seg++) {
          cx2 += (rnd(c * 11 + seg) - 0.5) * 120;
          cy2 += 40 + rnd(c * 13 + seg) * 60;
          ctx.lineTo(cx2, cy2);
        }
        ctx.stroke();
      }
    }

    if (D.type === 'flood') {
      // the rising water, with a wavy crest — only over the town
      const fw = gridW(), fb = TOPBAR + gridH();
      ctx.fillStyle = 'rgba(60, 130, 200, 0.55)';
      ctx.beginPath();
      ctx.moveTo(0, D.waterY);
      for (let wx2 = 0; wx2 <= fw; wx2 += 30) {
        ctx.lineTo(wx2, D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6);
      }
      ctx.lineTo(fw, fb);
      ctx.lineTo(0, fb);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let wx2 = 0; wx2 <= fw; wx2 += 30) {
        const wy2 = D.waterY + Math.sin(elapsed * 3 + wx2 * 0.02) * 6;
        if (wx2 === 0) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
      }
      ctx.stroke();
    }

    if (D.type === 'balls') {
      for (const ball of D.balls) {
        // a little motion trail behind each ball
        ctx.strokeStyle = ball.color + '66';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(ball.x - ball.vx * 0.06, ball.y - ball.vy * 0.06);
        ctx.lineTo(ball.x, ball.y);
        ctx.stroke();
        // the ball itself, with a shiny spot
        ctx.fillStyle = ball.color;
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 15, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(ball.x - 5, ball.y - 5, 4.5, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  ctx.restore();   // stop shaking for the buttons — the UI stays calm

  // the top bar background (two rows)
  ctx.fillStyle = '#10161d';
  ctx.fillRect(0, 0, canvas.width, TOPBAR);

  // --- ROW 1: the money chip, just right of the ← Arcade pill ---
  const money = moneyChipRect();
  const flashing = (brokeFlash > 0 && Math.sin(brokeFlash * 30) > 0);
  ctx.fillStyle = '#1c2530';
  rrect(money.x, money.y, money.w, money.h, 8); ctx.fill();
  ctx.strokeStyle = flashing ? '#ff5046' : '#3a4654'; ctx.lineWidth = 2;
  rrect(money.x, money.y, money.w, money.h, 8); ctx.stroke();
  ctx.fillStyle = flashing ? '#ff5046' : '#ffd23f';
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`💰 ${moneys}`, money.x + money.w / 2, money.y + money.h / 2 + 5);

  // --- the FULLSCREEN button, top-right: four little corner brackets ---
  const fb = fullBtnRect();
  ctx.fillStyle = '#1c2530';
  rrect(fb.x, fb.y, fb.w, fb.h, 8); ctx.fill();
  ctx.strokeStyle = '#3a4654'; ctx.lineWidth = 2;
  rrect(fb.x, fb.y, fb.w, fb.h, 8); ctx.stroke();
  ctx.strokeStyle = '#cfe3ff'; ctx.lineWidth = 2;
  const fcx = fb.x + fb.w / 2, fcy = fb.y + fb.h / 2;
  const out = isFullscreen() ? -1 : 1;      // arrows point in when already fullscreen
  for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    const ax = fcx + sx * 8, ay = fcy + sy * 7;
    ctx.beginPath();
    ctx.moveTo(ax - sx * out * 5, ay);
    ctx.lineTo(ax, ay);
    ctx.lineTo(ax, ay - sy * out * 5);
    ctx.stroke();
  }

  // --- ROW 2: the three drop-down buttons: Build, Disasters, People ---
  const palette = {
    build:     { bg: '#24343a', border: '#4f9d6b' },
    disasters: { bg: '#7a1f2b', border: '#ff6b5e' },
    people:    { bg: '#26473b', border: '#7ddf8f' },
  };
  for (const b of topButtons()) {
    const col = palette[b.key];
    const open = openMenu === b.key;
    ctx.fillStyle = open ? col.border : col.bg;
    rrect(b.x, b.y, b.w, b.h, 9); ctx.fill();
    ctx.strokeStyle = col.border; ctx.lineWidth = 2;
    rrect(b.x, b.y, b.w, b.h, 9); ctx.stroke();
    ctx.fillStyle = open ? '#10161d' : '#ffffff';
    ctx.textAlign = 'center';
    // full label if it fits; otherwise shrink, and only drop the word as a
    // last resort on a really tiny screen
    let cap = b.icon + ' ' + b.word + (b.menu ? ' ▾' : '');
    let fs = fitFont(cap, b.w - 14, 16, 11);
    if (ctx.measureText(cap).width > b.w - 14) {
      cap = b.icon + (b.menu ? ' ▾' : '');
      fs = fitFont(cap, b.w - 14, 16, 10);
    }
    ctx.fillText(cap, b.x + b.w / 2, b.y + b.h / 2 + fs * 0.35);
  }

  // --- the open drop-down list, if any ---
  if (openMenu) {
    const costly = openMenu === 'disasters';         // only disasters have a price
    for (const r of menuRects(openMenu)) {
      const canAfford = !costly || moneys >= r.cost;
      const chosen = openMenu === 'build' && selected === r.type;
      ctx.fillStyle = chosen ? '#3d6b30' : canAfford ? '#24343a' : '#2c2126';
      rrect(r.x, r.y, r.w, r.h, 8); ctx.fill();
      ctx.strokeStyle = chosen ? '#7ddf8f' : canAfford ? '#3a4654' : '#5a4a4e';
      ctx.lineWidth = 2;
      rrect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
      ctx.fillStyle = canAfford ? '#ffffff' : '#8a7a7e';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(r.label, r.x + 12, r.y + r.h / 2 + 5);
      if (costly) {                         // disasters show their price on the right
        ctx.textAlign = 'right';
        ctx.fillStyle = canAfford ? '#ffd23f' : '#8a7a7e';
        ctx.fillText(`${r.cost}💰`, r.x + r.w - 12, r.y + r.h / 2 + 5);
      }
    }
  }

  // --- STOP BUILDING, bottom centre, only while you're placing something ---
  const sb = stopBuildRect();
  if (sb) {
    ctx.fillStyle = '#1d3a4a';
    rrect(sb.x, sb.y, sb.w, sb.h, 10); ctx.fill();
    ctx.strokeStyle = '#7dd3ff'; ctx.lineWidth = 2;
    rrect(sb.x, sb.y, sb.w, sb.h, 10); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('✋ Stop Building', sb.x + sb.w / 2, sb.y + sb.h / 2 + 5);
  }

  // --- the STATUS BOX at the bottom: a readable box for the latest news ---
  if ((statusSticky || statusTimer > 0) && statusText) {
    // shrink the text just enough to always fit on a narrow phone
    let fs = 15;
    ctx.font = `bold ${fs}px monospace`;
    let tw = ctx.measureText(statusText).width;
    const maxTextW = canvas.width - 44;
    if (tw > maxTextW) {
      fs = Math.max(10, Math.floor(fs * maxTextW / tw));
      ctx.font = `bold ${fs}px monospace`;
      tw = ctx.measureText(statusText).width;
    }
    const boxW = tw + 30, boxH = 34;
    // sit above the Stop Building button when it's showing, so they never overlap
    const bottom = sb ? sb.y - 8 : canvas.height - 14;
    const bx = (canvas.width - boxW) / 2, by = bottom - boxH;
    ctx.globalAlpha = statusSticky ? 1 : Math.min(1, statusTimer / 0.5);   // news fades, notes stay
    ctx.fillStyle = 'rgba(10, 14, 20, 0.9)';
    rrect(bx, by, boxW, boxH, 10); ctx.fill();
    ctx.strokeStyle = statusColor; ctx.lineWidth = 2;
    rrect(bx, by, boxW, boxH, 10); ctx.stroke();
    ctx.fillStyle = statusColor; ctx.textAlign = 'center';
    ctx.fillText(statusText, canvas.width / 2, by + boxH / 2 + 5);
    ctx.globalAlpha = 1;
  }

  // the destruction scoreboard, tucked top-left under the bar
  // (hidden while a drop-down is open so it can't show through the menu)
  if ((destroyed > 0 || peopleLaunched > 0 || repaired > 0) && !openMenu) {
    ctx.fillStyle = 'rgba(255, 159, 67, 0.9)';
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`💥 ${destroyed} smashed   🚀 ${peopleLaunched} launched   🔧 ${repaired} fixed`,
                 12, TOPBAR + 18);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
