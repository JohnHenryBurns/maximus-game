<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Amos's Disaster Builder</title>
<style>
  html, body { margin: 0; background: #1a2530; height: 100%; overflow: hidden; }
  canvas { display: block; }
  /* Back-to-arcade pill, the same look the other games use. */
  #back {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    color: #ffe0c4; background: rgba(24, 14, 28, 0.6);
    border: 1px solid rgba(255, 200, 150, 0.4);
    font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 12px; border-radius: 999px; text-decoration: none; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
  }
  #back:hover, #back:active {
    transform: scale(1.05); border-color: rgba(255, 200, 150, 0.85); background: rgba(40, 22, 44, 0.75);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="back" href="index.html">&larr; Arcade</a>
<script>
// =====================================================================
// AMOS'S DISASTER BUILDER
//
// Two great joys of being human:
//   1. building a beautiful town
//   2. pressing the button that summons a tornado to eat it
// This game has both.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fitCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------
// THE WORLD — a grid of cells, like graph paper. Every cell holds one
// thing: nothing (0), a house (1), a tree (2), or a stone block (3).
//
// The grid is TALL (20 wide, 40 high) — a 1:2 shape that fills a phone held
// upright almost perfectly, so the whole town shows at once with no wasted
// space. Zoom in to build the little details.
// ---------------------------------------------------------------------
const COLS = 20, ROWS = 40;
let cell = 34;                      // pixel size of one grid square
// Room at the top for the toolbar. It's two tiers now (money + THE MACHINE
// on top, the build palette in a full-width row below) so everything fits on
// a phone instead of running off the side.
const TOPBAR = 108;                  // two roomy rows: Arcade+money on top, buttons below

// ---------------------------------------------------------------------
// THE CAMERA — lets you zoom in to build with detail, then slide around.
//   zoom = 1  ->  the whole town fits on screen (all the way zoomed out)
//   zoom = 4  ->  four times closer, for placing tiny blocks just so
// panX/panY are how far we've slid the zoomed view left/right and up/down.
// At zoom 1 the camera does nothing at all, so the game looks exactly the
// same until you actually pinch or scroll to zoom in.
// ---------------------------------------------------------------------
let zoom = 1;
let panX = 0, panY = 0;
const MAX_ZOOM = 4;

// make the grid: ROWS rows, each row is COLS zeros (all empty land)
const grid = [];
for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0));

const EMPTY = 0, HOUSE = 1, TREE = 2, STONE = 3, APT = 4, BUNKER = 5;
// Roads and paths are things you BUILD, but you can still walk on them —
// in fact everyone would rather walk on a path than through the grass.
const ROAD = 6, PATH = 7;
function isWay(k) { return k === ROAD || k === PATH; }   // "is this a road or a path?"
// the BIG blocks: a 3x3 skyscraper and a 2x2 castle tower
const SKY = 8, TOWER = 9;
// which blocks can people hide inside? (capacity is 3 per SQUARE, so a
// 2x2 building holds 12 and the mighty skyscraper holds 27!)
function isShelter(k) {
  return k === HOUSE || k === APT || k === BUNKER || k === SKY || k === TOWER;
}
// STACKING: place a shelter on a shelter and it GROWS into the next size up
const UPGRADE = { [HOUSE]: APT, [APT]: SKY, [BUNKER]: TOWER };
let lastUpgradeAt = -9;    // tiny pause between growth spurts, so a drag
                           // doesn't zoom a house to a skyscraper instantly

// What you're placing right now. Starts as null — the game opens in
// look-around mode, so you can drag and zoom before you build anything.
let selected = null;

// HOW BEATEN-UP EVERY SQUARE IS. Same shape as the grid.
//   0 = pristine, 1 = lightly damaged, 2 = heavily damaged
// A third hit (or an unlucky first one) knocks it down completely.
const PRISTINE = 0, LIGHT = 1, HEAVY = 2, WRECKED = 3;
const damage = [];
for (let y = 0; y < ROWS; y++) damage.push(new Array(COLS).fill(PRISTINE));

// A square that's just been hit is briefly immune, so a tornado sitting on
// top of a house doesn't chew through all three damage levels in one frame.
// You get to SEE each stage.
const hitCool = [];
for (let y = 0; y < ROWS; y++) hitCool.push(new Array(COLS).fill(0));
const HIT_COOLDOWN = 0.55;

// ---------------------------------------------------------------------
// BIG BUILDINGS. An apartment block is a proper tower — it takes up FOUR
// squares (2 across, 2 down) instead of one. All four squares hold APT,
// but they all point back to the top-left one, the "root". The root is
// where we draw the tower, keep its damage, and where the repair crew go.
// ---------------------------------------------------------------------
const SPAN = { [APT]: 2, [SKY]: 3, [TOWER]: 2 };   // how many squares wide/tall a kind is
function spanOf(kind) { return SPAN[kind] || 1; }
const rootAt = [];                             // {rx,ry} for every square of a big building
for (let y = 0; y < ROWS; y++) rootAt.push(new Array(COLS).fill(null));

// Where does this square's building really live? (itself, unless it's part
// of something bigger)
function rootOf(gx, gy) {
  const r = rootAt[gy] && rootAt[gy][gx];
  return r ? r : { rx: gx, ry: gy };
}

// Wipe a square — and if it belongs to a big building, take the whole
// building with it, so we never leave half a tower standing.
function clearCell(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
  const r = rootOf(gx, gy);
  const sp = spanOf(grid[r.ry] && grid[r.ry][r.rx]);
  for (let oy = 0; oy < sp; oy++) {
    for (let ox = 0; ox < sp; ox++) {
      const cx = r.rx + ox, cy = r.ry + oy;
      if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) continue;
      grid[cy][cx] = EMPTY;
      damage[cy][cx] = PRISTINE;
      rootAt[cy][cx] = null;
    }
  }
}

// ---------------------------------------------------------------------
// LITTLE PEOPLE (and cows, and dogs) — they live in your town. no idea.
// ---------------------------------------------------------------------
let people = [];
let launchedFolk = [];     // folk currently flying through the air (they're fine)
let peopleLaunched = 0;

// A square you can't walk into: anything built except an OPEN square.
// (Trees and stone block you too — you can't stroll through a boulder.)
function blocked(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return true;   // off the map
  const k = grid[gy][gx];
  return k !== EMPTY && !isWay(k);        // roads and paths are walk-through
}
// is there a road or path on this square?
function wayAt(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return false;
  return isWay(grid[gy][gx]);
}
// same question, but in pixels
function blockedAt(x, y) {
  const s = cellSize();
  return blocked(Math.floor(x / s), Math.floor((y - TOPBAR) / s));
}

// find an open square to drop a new critter on (never inside a building)
function freeSpot() {
  const s = cellSize();
  for (let tries = 0; tries < 60; tries++) {
    const gx = Math.floor(Math.random() * COLS), gy = Math.floor(Math.random() * ROWS);
    if (!blocked(gx, gy)) return { x: gx * s + s / 2, y: TOPBAR + gy * s + s / 2 };
  }
  return null;                     // town completely full — nowhere to stand
}

function spawnCritters(kind) {
  let made = 0;
  // five per press times the amount dial — up to 50 at once at x10.
  // 500 total is where the computer starts sweating, the only ceiling.
  for (let i = 0; i < 5 * qty && people.length < 500; i++) {
    const spot = freeSpot();
    if (!spot) break;
    people.push({
      kind,                        // 'person', 'cow' or 'dog'
      x: spot.x, y: spot.y,
      angle: Math.random() * 6.28,
      walk: Math.random() * 6.28,
      // little personality knobs so nobody looks quite the same:
      mood: Math.floor(Math.random() * 3),   // which happy face they pull
      fear: Math.floor(Math.random() * 3),   // which panicked face they pull
      bob: Math.random() * 6.28,             // where they are in their bounce
      shirt: ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6', '#2ecc71', '#e67e22'][Math.floor(Math.random() * 6)],
    });
    made++;
  }
  return made;
}

// ---------------------------------------------------------------------
// WORKING OUT WHAT THE ROADS ACTUALLY ARE
//
// Whenever you build or break a road we take one look at the whole map and
// write down, for every square:
//   - which neighbours it joins on to
//   - whether it's half of a TWO-LANE road (a twin running alongside it)
//   - if it's a plain one-lane road, WHICH WAY the traffic goes (one-way!)
//   - whether it's a junction, which is where the traffic lights go
// Doing it once and remembering it is much cheaper than working it out
// again for every car, every frame.
// ---------------------------------------------------------------------
let roadsDirty = true;
const roadConn = [];      // {N,S,E,W} — which sides join on
const roadDual = [];      // 'v' / 'h' if this is one lane of a two-lane road
const roadOne  = [];      // {dx,dy} one-way direction, for plain one-lane road
const roadJunc = [];      // true if 3+ roads meet here — needs a traffic light
const roadTurn = [];      // the bend a two-lane road makes, if this square is in one
for (let y = 0; y < ROWS; y++) {
  roadConn.push(new Array(COLS).fill(null));
  roadDual.push(new Array(COLS).fill(null));
  roadOne.push(new Array(COLS).fill(null));
  roadJunc.push(new Array(COLS).fill(false));
  roadTurn.push(new Array(COLS).fill(null));
}

function isRoad(gx, gy) {
  return gx >= 0 && gy >= 0 && gx < COLS && gy < ROWS && grid[gy][gx] === ROAD;
}

function ensureRoads() {
  if (!roadsDirty) return;
  roadsDirty = false;
  // pass 1: who joins on to whom, and which squares are junctions
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      roadDual[gy][gx] = null; roadOne[gy][gx] = null; roadJunc[gy][gx] = false;
      if (!isRoad(gx, gy)) { roadConn[gy][gx] = null; continue; }
      const c = { N: isRoad(gx, gy - 1), S: isRoad(gx, gy + 1),
                  W: isRoad(gx - 1, gy), E: isRoad(gx + 1, gy) };
      c.n = (c.N ? 1 : 0) + (c.S ? 1 : 0) + (c.W ? 1 : 0) + (c.E ? 1 : 0);
      c.runsH = c.W || c.E;                      // goes left/right at all
      c.runsV = c.N || c.S;                      // goes up/down at all
      c.straightH = c.runsH && !c.N && !c.S;     // ONLY left/right — a plain lane
      c.straightV = c.runsV && !c.W && !c.E;     // ONLY up/down
      roadConn[gy][gx] = c;
    }
  }
  // pass 2: TWO-LANE roads. A lane is half of a pair when it runs one way
  // and has exactly ONE road alongside it that runs the same way.
  // (This has to happen BEFORE we look for junctions: a square in a two-lane
  // road touches three others, which would otherwise look like a T-junction.)
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const c = roadConn[gy][gx];
      if (!c) continue;
      const nb = (ox, oy) => roadConn[gy + oy] && roadConn[gy + oy][gx + ox];
      // vertical pair: runs up/down, with a twin to one side (not both)
      if (c.runsV && (c.W !== c.E)) {
        const twin = nb(c.E ? 1 : -1, 0);
        if (twin && twin.runsV) roadDual[gy][gx] = 'v';
      }
      // horizontal pair: runs left/right, with a twin above or below (not both)
      if (!roadDual[gy][gx] && c.runsH && (c.N !== c.S)) {
        const twin = nb(0, c.S ? 1 : -1);
        if (twin && twin.runsH) roadDual[gy][gx] = 'h';
      }
    }
  }
  // pass 2a: CORNERS OF TWO-LANE ROADS. Where a two-lane road turns, four
  // squares form a solid 2x2 block with the road arriving on one side and
  // leaving on another. That's a BEND, not a crossroads — no traffic light,
  // and the lanes sweep round it.
  for (let gy = 0; gy < ROWS; gy++) roadTurn[gy].fill(null);
  for (let by = 0; by < ROWS - 1; by++) {
    for (let bx = 0; bx < COLS - 1; bx++) {
      // is this whole 2x2 solid road?
      if (!(isRoad(bx, by) && isRoad(bx + 1, by) &&
            isRoad(bx, by + 1) && isRoad(bx + 1, by + 1))) continue;
      // which sides does the road carry on out of the block, two squares wide?
      const arms = [];
      if (isRoad(bx, by - 1)     && isRoad(bx + 1, by - 1))     arms.push({ dx: 0, dy: -1 });
      if (isRoad(bx, by + 2)     && isRoad(bx + 1, by + 2))     arms.push({ dx: 0, dy: 1 });
      if (isRoad(bx - 1, by)     && isRoad(bx - 1, by + 1))     arms.push({ dx: -1, dy: 0 });
      if (isRoad(bx + 2, by)     && isRoad(bx + 2, by + 1))     arms.push({ dx: 1, dy: 0 });
      // exactly two arms, at right angles to each other = a corner
      if (arms.length !== 2) continue;
      const [a1, a2] = arms;
      if (a1.dx * a2.dx + a1.dy * a2.dy !== 0) continue;   // opposite, not a corner
      // The INSIDE of the bend is the block square nearest both arms; the
      // OUTSIDE is the one diagonally opposite it.
      const ax = a1.dx !== 0 ? a1 : a2, ay = a1.dy !== 0 ? a1 : a2;
      const ix = bx + (ax.dx > 0 ? 1 : 0), iy = by + (ay.dy > 0 ? 1 : 0);
      const ox = bx + (bx + 1 - ix), oy = by + (by + 1 - iy);
      const turn = { bx, by, arms, ix, iy, ox, oy };
      for (let dy = 0; dy < 2; dy++)
        for (let dx = 0; dx < 2; dx++) roadTurn[by + dy][bx + dx] = turn;
    }
  }
  // pass 2b: JUNCTIONS — where three or more roads genuinely meet. A square
  // that's simply part of a two-lane road, or of its bend, doesn't count.
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const c = roadConn[gy][gx];
      roadJunc[gy][gx] = !!c && c.n >= 3 && !roadDual[gy][gx] && !roadTurn[gy][gx];
    }
  }
  // pass 3: ONE-WAY directions. Every straight one-lane run gets a single
  // direction for its whole length, so cars on it never meet head-on.
  const runDir = (len, seed) => (hash(seed) < 0.5 ? 1 : -1);
  for (let gy = 0; gy < ROWS; gy++) {            // left-to-right runs
    let start = -1;
    for (let gx = 0; gx <= COLS; gx++) {
      const c = gx < COLS ? roadConn[gy][gx] : null;
      const ok = c && c.straightH && !roadDual[gy][gx];
      if (ok && start < 0) start = gx;
      if (!ok && start >= 0) {
        const d = runDir(gx - start, start * 3.7 + gy * 9.1);
        for (let i = start; i < gx; i++) roadOne[gy][i] = { dx: d, dy: 0 };
        start = -1;
      }
    }
  }
  for (let gx = 0; gx < COLS; gx++) {            // top-to-bottom runs
    let start = -1;
    for (let gy = 0; gy <= ROWS; gy++) {
      const c = gy < ROWS ? roadConn[gy][gx] : null;
      const ok = c && c.straightV && !roadDual[gy][gx];
      if (ok && start < 0) start = gy;
      if (!ok && start >= 0) {
        const d = runDir(gy - start, gx * 5.3 + start * 2.9);
        for (let i = start; i < gy; i++) roadOne[i][gx] = { dx: 0, dy: d };
        start = -1;
      }
    }
  }
}

// ---------------------------------------------------------------------
// TRAFFIC LIGHTS. Every junction in town runs off one shared clock:
// up-and-down traffic goes, then everyone stops, then left-and-right goes.
// ---------------------------------------------------------------------
let lightClock = 0;
const LIGHT_CYCLE = [ { ns: true,  ew: false, t: 5 },   // up/down GO
                      { ns: false, ew: false, t: 1.2 }, // everybody stop
                      { ns: false, ew: true,  t: 5 },   // left/right GO
                      { ns: false, ew: false, t: 1.2 } ];
function lightPhase() {
  let t = lightClock % LIGHT_CYCLE.reduce((a, p) => a + p.t, 0);
  for (const p of LIGHT_CYCLE) { if (t < p.t) return p; t -= p.t; }
  return LIGHT_CYCLE[0];
}
// may a car heading (dx,dy) drive into this junction right now?
function greenFor(dx, dy) {
  const p = lightPhase();
  return dy !== 0 ? p.ns : p.ew;
}

// ---------------------------------------------------------------------
// CARS — they appear by themselves on any decent stretch of road and
// trundle along it. Nobody repairs a car: when a disaster catches one it
// simply EXPLODES and is gone.
// ---------------------------------------------------------------------
let cars = [];
let carsPopped = 0;
let carTimer = 0;
const CAR_COLORS = ['#e8453c', '#3aa7e8', '#f5c542', '#8e6ee8', '#3fbf6f', '#ef8a3c'];
const MIN_ROAD_RUN = 4;         // a road needs to be this long before cars bother with it

// Which way should a car on this square be pointed? A one-lane road has a
// one-way direction; on a two-lane road you drive on the right, which means
// the lane you're in decides your direction.
// KEEP RIGHT. On a two-lane road you drive on the side that keeps the edge
// of the road on your right — so on a road running up and down, the left-hand
// lane goes down and the right-hand lane goes up. Ask which headings have
// nothing but grass to their right; on a proper two-lane road exactly one
// does, and that's the way this lane flows. (This also works perfectly well
// on the squares of a bend.)
function keepRight(gx, gy) {
  const out = [];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (!isRoad(gx - dy, gy + dx)) out.push({ dx, dy });   // "right" of (dx,dy)
  }
  return out;
}
// On the outside corner of a bend, two headings can both keep the edge on
// their right — but only one of them has road to drive on to. That's the way
// the lane actually goes.
function laneFrom(gx, gy) {
  let kr = keepRight(gx, gy);
  if (kr.length > 1) {
    const onward = kr.filter(d => isRoad(gx + d.dx, gy + d.dy));
    if (onward.length) kr = onward;
  }
  return kr.length === 1 ? kr[0] : null;
}

function laneDir(gx, gy) {
  const c = roadConn[gy] && roadConn[gy][gx];
  if (!c) return null;

  // A BEND in a two-lane road. Three of its four squares work out fine from
  // the keep-right rule; the square on the INSIDE of the bend is hemmed in by
  // road on all sides, so we give it the one direction that's left: whichever
  // arm the outside of the bend does NOT leave by.
  const t = roadTurn[gy][gx];
  if (t) {
    if (gx === t.ix && gy === t.iy) {
      const outer = keepRight(t.ox, t.oy)
        .find(d => t.arms.some(a => a.dx === d.dx && a.dy === d.dy));
      const other = outer ? t.arms.find(a => a.dx !== outer.dx || a.dy !== outer.dy)
                          : t.arms[0];
      return other ? { dx: other.dx, dy: other.dy } : null;
    }
    const d = laneFrom(gx, gy);
    if (d) return d;
  }

  if (roadDual[gy][gx]) {
    const d = laneFrom(gx, gy);
    if (d) return d;
  }
  return roadOne[gy][gx];        // plain one-lane road: its one-way direction
}

// Find a straight run of road at least MIN_ROAD_RUN long and put a car at
// the START of it, pointed the way that road actually goes.
function trySpawnCar() {
  ensureRoads();
  const spots = [];
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      const dir = laneDir(gx, gy);
      if (!dir) continue;
      // measure how much clear road lies ahead of this square
      let ahead = 0, cx = gx, cy = gy;
      while (ahead < 40 && isRoad(cx + dir.dx, cy + dir.dy)) {
        cx += dir.dx; cy += dir.dy; ahead++;
      }
      // and make sure this really is the START (nothing feeding into it)
      const behind = isRoad(gx - dir.dx, gy - dir.dy);
      if (ahead >= MIN_ROAD_RUN - 1 && !behind) spots.push({ gx, gy, dir });
    }
  }
  if (!spots.length) return;
  const spot = spots[Math.floor(Math.random() * spots.length)];
  const s = cellSize();
  const px = spot.gx * s + s / 2, py = TOPBAR + spot.gy * s + s / 2;
  // don't drop a car on top of one that's already sitting there
  for (const c of cars) if (Math.hypot(c.x - px, c.y - py) < s) return;
  cars.push({
    x: px, y: py,
    dx: spot.dir.dx, dy: spot.dir.dy,
    speed: 34 + Math.random() * 26,
    color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)],
  });
}

// KABOOM. A car caught in a disaster goes up in a FIREBALL and is gone for
// good. The blast stays tight around the car — a hot little ball of flame
// with a few bits pinging off it, rather than confetti across the street.
let blasts = [];
function popCar(car) {
  if (car.gone) return;
  car.gone = true;
  carsPopped++;
  const s = cellSize();
  blasts.push({ x: car.x, y: car.y, t: 0, life: 0.55, r: s * 0.42 });
  scatterRubble(car.x, car.y, 2);     // burnt-out bits left on the road
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 90;
    debris.push({
      x: car.x, y: car.y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,       // a small hop, not a launch
      spin: Math.random() * 10, life: 0.45 + Math.random() * 0.25,
      color: i % 3 === 0 ? '#ff9f43' : i % 3 === 1 ? '#ffd23f' : '#3a3a40',
    });
  }
}

// scoreboard of destruction (and of putting it all back together)
let destroyed = 0;
let repaired = 0;
const REPAIR_TIME = 3.4;      // seconds of hammering per damage level — slow, so you can watch

// ---------------------------------------------------------------------
// MESS. Two kinds, and somebody has to deal with both of them.
//   'rubble' — the broken bits a disaster leaves lying about
//   'pie'    — exactly what you think. Cows are not house-trained.
// A person sweeps one up at a time. It's a nicer job than rebuilding, so
// it's quicker, but the town does get filthy if you keep summoning doom.
// ---------------------------------------------------------------------
let litter = [];
let tidied = 0;
let footprints = [];       // the brown trail of somebody's worst afternoon
let piesSteppedIn = 0;     // the town keeps count. the town never forgets.
const CLEAN_TIME = 1.5;       // seconds of sweeping per piece of mess
const MAX_LITTER = 260;       // stop the whole town turning into a landfill

function dropLitter(x, y, kind) {
  if (litter.length >= MAX_LITTER) return null;
  const L = {
    x, y, kind,
    seed: Math.random() * 100,          // so each one looks a bit different
    born: elapsed,
  };
  litter.push(L);
  return L;
}

// scatter a few piles of rubble around where something just got flattened
function scatterRubble(bx, by, howMany) {
  for (let i = 0; i < howMany; i++) {
    const a = Math.random() * Math.PI * 2, r = Math.random() * cellSize() * 0.45;
    dropLitter(bx + Math.cos(a) * r, by + Math.sin(a) * r, 'rubble');
  }
}

// THE ECONOMY. You start with 30 MONEYS. Disasters cost MONEYS.
// Every block a disaster smashes pays you 1 MONEY. Yes, really.
// Destruction is a business.
let moneys = 30;
let brokeFlash = 0;    // flashes when you try to buy doom you can't afford

// ---------------------------------------------------------------------
// THE DISASTERS — one at a time, chosen from THE MACHINE's menu.
// null means the world is at peace. For now.
// ---------------------------------------------------------------------
let disasters = [];                 // ALL currently-active catastrophes. yes, plural.
let debris = [];                    // flying bits of what used to be a town
let craters = [];                   // meteor scars. they never heal.
let shake = 0;                      // screen trembles while disaster reigns
let elapsed = 0;

// Which dropdown is showing right now: 'items', 'disasters', or null (none).
// Only one is ever open at a time.
let openMenu = null;

// Disasters you've PAID for but that haven't struck yet — they count down a
// moment of dread first. This is the "build tension" delay.
let pendings = [];
const TENSION = 1.3;                 // seconds between choosing doom and it landing

// A little message box at the bottom tells you what just happened.
// News (like "Tornado incoming!") fades after a moment; a plain note about
// what you're doing right now ("Now placing House") just stays put until
// something else replaces it.
let statusText = '', statusColor = '#ffffff', statusTimer = 0, statusSticky = false;
function setStatus(text, color, sticky) {
  statusText = text;
  statusColor = color || '#ffffff';
  statusSticky = !!sticky;
  statusTimer = 2.4;                 // how long a fading message lingers
}

// Pick a disaster from the menu: pay for it, close the menu, and start the
// tension countdown. The actual mayhem begins later, in update().
function pickDisaster(item) {
  const total = item.cost * qty;     // the amount dial multiplies the bill
  if (moneys < total) {              // can't afford this one — say so, leave the menu open
    brokeFlash = 1.5;
    setStatus('Not enough MONEYS — smashed blocks pay you back!', '#ff6b5e');
    return;
  }
  moneys -= total;
  openMenu = null;                   // CLOSE the menu before the disaster begins
  selected = null;                   // and stop building — you'll want to watch this
  // one pending per copy, each arriving a moment after the last (drama)
  for (let i = 0; i < qty; i++) {
    pendings.push({ type: item.type, label: item.label, timer: TENSION + i * 0.6 });
  }
  setStatus(item.label + (qty > 1 ? ' x' + qty : '') + ' incoming…', '#ffb454');
}

// BUZZ THE PHONE. Each disaster gets its own rumble pattern (in milliseconds:
// buzz, pause, buzz, …). Only Android/Chrome phones can actually vibrate —
// on a laptop or an iPhone navigator.vibrate simply isn't there, so we check
// first and wrap it in try/catch so it can never break the game.
const BUZZ = {
  tornado: [120, 40, 120, 40, 200],
  meteors: [40, 30, 40, 30, 40, 30, 120],
  quake:   [450],
  flood:   [200, 80, 300],
  balls:   [30, 50, 30, 50, 30, 50, 30],
  badguys: [80, 60, 80, 60, 80],
};
function buzz(type) {
  try { if (navigator.vibrate) navigator.vibrate(BUZZ[type] || 180); } catch (e) {}
}

// Actually unleash the disaster (called once its tension timer runs out).
// No money changes hands here — that already happened in pickDisaster.
function beginDisaster(type) {
  if (disasters.length >= 12) return;   // even chaos has a fire code
  if (type === 'tornado') {
    disasters.push({ type, x: -60, y: TOPBAR + Math.random() * gridH(),
                     life: 12, wobble: Math.random() * 6.28 });
  } else if (type === 'meteors') {
    disasters.push({ type, life: 8, spawnTimer: 0, meteors: [] });
  } else if (type === 'quake') {
    // THE GROUND TEARS OPEN. We work out the shape of the cracks up front —
    // a few big ones splitting outward from the epicentre, each with a
    // branch or two — then let them RIP open over the first second or so.
    const ex = gridW() * (0.2 + Math.random() * 0.6);
    const ey = TOPBAR + gridH() * (0.2 + Math.random() * 0.6);
    const cracks = [];
    const arms = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < arms; i++) {
      const base = (i / arms) * Math.PI * 2 + Math.random() * 0.7;
      const walk = (sx, sy, ang, steps, wide) => {
        const pts = [{ x: sx, y: sy }];
        let a = ang, px2 = sx, py2 = sy;
        for (let k = 0; k < steps; k++) {
          a += (Math.random() - 0.5) * 0.9;                 // it wanders as it tears
          const step = gridH() * (0.035 + Math.random() * 0.03);
          px2 += Math.cos(a) * step;
          py2 += Math.sin(a) * step;
          pts.push({ x: px2, y: py2 });
        }
        return { pts, wide };
      };
      const main = walk(ex, ey, base, 7 + Math.floor(Math.random() * 4), 1);
      cracks.push(main);
      // a branch splitting off partway along
      if (Math.random() < 0.75) {
        const j = 2 + Math.floor(Math.random() * (main.pts.length - 3));
        const from = main.pts[j];
        cracks.push(walk(from.x, from.y, base + (Math.random() < 0.5 ? 0.9 : -0.9),
                         3 + Math.floor(Math.random() * 3), 0.55));
      }
    }
    disasters.push({ type, life: 6, seed: Math.random() * 100,
                     ex, ey, cracks, grow: 0 });
  } else if (type === 'flood') {
    disasters.push({ type, life: 10, waterY: TOPBAR + gridH() + 50 });
  } else if (type === 'balls') {
    // 10 rubber balls, dropped from above, each with its own direction
    const balls = [];
    const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81',
                    '#eccc68', '#7bed9f', '#70a1ff', '#ff7f50', '#a29bfe'];
    for (let i = 0; i < 10; i++) {
      balls.push({
        x: 10 + Math.random() * (gridW() - 20),
        y: TOPBAR - 40 - Math.random() * 250,        // starting up in the sky
        vx: (Math.random() < 0.5 ? -1 : 1) * (220 + Math.random() * 220),
        vy: 250 + Math.random() * 200,
        color: colors[i],
      });
    }
    disasters.push({ type, life: 3.8, balls });
  } else if (type === 'badguys') {
    // a GANG of four, storming in from the edges of town
    for (let i = 0; i < 4; i++) {
      const side = Math.floor(Math.random() * 4);
      badGuys.push({
        x: side === 0 ? -20 : side === 1 ? gridW() + 20 : Math.random() * gridW(),
        y: side === 2 ? TOPBAR - 20 : side === 3 ? TOPBAR + gridH() + 20
                                    : TOPBAR + Math.random() * gridH(),
        angle: 0,
        walk: Math.random() * 6.28,
        swing: 0,              // club wind-up timer
        life: 18,              // seconds of crime before they flee
        leaving: false,
      });
    }
  }
}

// ---------------------------------------------------------------------
// BAD GUYS — they smash shelters with clubs and bonk anyone they catch.
// The only building they can't dent is a bunker. After their crime spree
// they scatter off the edges of the map.
// ---------------------------------------------------------------------
let badGuys = [];
let badGuysDefeated = 0;   // the knights keep score

// SOMETHING HIT A BUILDING. It doesn't just vanish any more — it takes
// damage and gets uglier: pristine -> lightly damaged -> heavily damaged ->
// gone. `force` is how hard the hit was: a big meteor usually flattens a
// house outright, a bouncing ball usually just dents it. Every hit rolls
// the dice, so even a gentle knock can occasionally finish a building off
// and a direct meteor sometimes leaves a wall standing.
function hitBlock(gx, gy, bx, by, force, splash) {
  if (grid[gy][gx] === EMPTY) return;
  // a hit anywhere on a big building counts against the whole building
  const r = rootOf(gx, gy);
  gx = r.rx; gy = r.ry;
  if (hitCool[gy][gx] > 0) return;           // still reeling from the last hit
  hitCool[gy][gx] = HIT_COOLDOWN;
  const roll = 1 + Math.floor(Math.random() * (force || 1));   // 1 .. force
  damage[gy][gx] += roll;
  if (damage[gy][gx] >= WRECKED) {
    smashBlock(gx, gy, bx, by, splash);      // that's the end of that
  } else {
    // a puff of bits flies off, but the building is still standing
    for (let i = 0; i < 3; i++) {
      debris.push({
        x: bx, y: by,
        vx: (Math.random() - 0.5) * 260,
        vy: -Math.random() * 240 - 60,
        spin: Math.random() * 10, life: 0.7,
        color: splash ? '#5da3e0' : '#9a8a78',
      });
    }
  }
}

// one block, smashed: emptied from the grid, launched as flying bits
function smashBlock(gx, gy, bx, by, splash) {
  const r = rootOf(gx, gy);
  const kind = grid[r.ry][r.rx];
  const sp = spanOf(kind);
  clearCell(r.rx, r.ry);             // takes every square of a big building
  roadsDirty = true;                 // a road may have just been wiped out
  destroyed++;
  // bigger building, bigger payout: skyscraper 8, apartment 3, tower 3
  moneys += kind === SKY ? 8 : kind === APT ? 3 : kind === TOWER ? 3 : 1;
  for (let i = 0; i < 6 * sp; i++) { // a bigger building makes a bigger mess
    debris.push({
      x: bx, y: by,
      vx: (Math.random() - 0.5) * 500,
      vy: -Math.random() * 500 - 100,
      spin: Math.random() * 10,
      life: 1.2,
      color: splash ? '#5da3e0'
           : kind === TREE ? '#3f8a3f' : kind === STONE ? '#8a8d94'
           : kind === APT ? '#5a6a7a' : kind === SKY ? '#4a7a9a'
           : kind === TOWER ? '#9aa0a8' : '#b5563c',
    });
  }
  // ...and once the dust settles, RUBBLE is left lying on the ground for
  // somebody to sweep up. A bigger building leaves a bigger heap.
  scatterRubble(bx, by, sp);          // 1 pile for a house, 3 for a skyscraper
}

// ---------------------------------------------------------------------
// PLACING BLOCKS — turn a screen position into a grid square
// ---------------------------------------------------------------------
function cellSize() {
  // the grid stretches to fit whatever screen we're on
  return Math.min(canvas.width / COLS, (canvas.height - TOPBAR) / ROWS);
}
// the town's size in pixels (the grass rectangle). The world outside this is fog.
function gridW() { return COLS * cellSize(); }
function gridH() { return ROWS * cellSize(); }
const FOG_PEEK = 70;                 // how far past the town edge you may pan into the fog

// The camera slides and scales what we DRAW, so a finger tap on the glass
// isn't the same spot in the town anymore. screenToWorld undoes the camera:
// give it where you touched, it tells you which spot of the town that is.
function screenToWorld(sx, sy) {
  return {
    x: (sx - panX) / zoom,
    y: (sy - TOPBAR - panY) / zoom + TOPBAR,
  };
}

// Keep the view sensible: if the whole town fits on screen, center it; if
// it's bigger than the screen (zoomed in), let it slide — but only a little
// way past the town edge, so you can peek into the fog without getting lost
// in it. FOG_PEEK is how far past the edge you're allowed to go.
function clampPan() {
  const PW = canvas.width, PH = canvas.height - TOPBAR;
  const gw = gridW() * zoom, gh = gridH() * zoom;   // town size on screen right now
  panX = gw <= PW ? (PW - gw) / 2
                  : Math.min(FOG_PEEK, Math.max(PW - gw - FOG_PEEK, panX));
  panY = gh <= PH ? (PH - gh) / 2
                  : Math.min(FOG_PEEK, Math.max(PH - gh - FOG_PEEK, panY));
}
// after the window resizes (fitCanvas already ran), tidy the view back onto
// the town so a rotate or resize can't leave a gap at the edge
addEventListener('resize', clampPan);
clampPan();   // center the town on first load

// Change the zoom while keeping one spot of the town pinned under a finger
// (or the mouse). worldPt is that spot; (sx, sy) is where it should stay on
// screen. This is what makes pinch-zoom feel like you're grabbing the map.
function setCamera(newZoom, worldPt, sx, sy) {
  zoom = Math.min(MAX_ZOOM, Math.max(1, newZoom));
  panX = sx - zoom * worldPt.x;
  panY = sy - TOPBAR - zoom * (worldPt.y - TOPBAR);
  clampPan();
}

function placeAt(px, py) {
  if (selected == null) return;     // pan mode — nothing to place
  const w = screenToWorld(px, py);  // where in the town did we really touch?
  const s = cellSize();
  const gx = Math.floor(w.x / s);
  const gy = Math.floor((w.y - TOPBAR) / s);
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;

  // ---- STACKING SHELTERS ----
  // Placing a shelter ON an existing shelter doesn't replace it — it
  // GROWS: house -> apartment -> skyscraper, bunker -> castle tower.
  // Hold still and it grows one step at a time.
  if (isShelter(selected) && isShelter(grid[gy][gx])) {
    if (elapsed - lastUpgradeAt < 0.4) return;   // one growth spurt at a time
    const r = rootOf(gx, gy);
    const grown = UPGRADE[grid[r.ry][r.rx]];
    if (!grown) {
      setStatus("That one's fully grown — the biggest of its kind!", '#ffb454');
      lastUpgradeAt = elapsed;
      return;
    }
    lastUpgradeAt = elapsed;
    const sp2 = spanOf(grown);
    const rx = Math.min(r.rx, COLS - sp2), ry = Math.min(r.ry, ROWS - sp2);
    if (rx < 0 || ry < 0) return;                // town too small to fit it
    for (let oy = 0; oy < sp2; oy++)
      for (let ox = 0; ox < sp2; ox++) clearCell(rx + ox, ry + oy);
    for (let oy = 0; oy < sp2; oy++) {
      for (let ox = 0; ox < sp2; ox++) {
        grid[ry + oy][rx + ox] = grown;
        damage[ry + oy][rx + ox] = PRISTINE;
        rootAt[ry + oy][rx + ox] = { rx, ry };
      }
    }
    // a golden construction poof — very satisfying
    for (let i = 0; i < 12; i++) {
      debris.push({
        x: rx * s + (s * sp2) / 2, y: TOPBAR + ry * s + (s * sp2) / 2,
        vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 320 - 60,
        spin: Math.random() * 10, life: 0.7, color: '#ffd23f',
      });
    }
    setStatus(grown === APT ? 'It grew into an apartment block!'
            : grown === SKY ? 'IT GREW INTO A SKYSCRAPER!!'
            : 'It grew into a castle tower!', '#7ddf8f');
    roadsDirty = true;
    return;
  }

  const sp = spanOf(selected);
  if (sp > 1) {
    // A BIG BUILDING. Nudge it back on to the map if you aimed at the very
    // edge, clear everything it's about to sit on, then plant all its squares.
    const rx = Math.min(gx, COLS - sp), ry = Math.min(gy, ROWS - sp);
    if (rx < 0 || ry < 0) return;                     // town too small — can't fit
    for (let oy = 0; oy < sp; oy++)
      for (let ox = 0; ox < sp; ox++) clearCell(rx + ox, ry + oy);
    for (let oy = 0; oy < sp; oy++) {
      for (let ox = 0; ox < sp; ox++) {
        grid[ry + oy][rx + ox] = selected;
        damage[ry + oy][rx + ox] = PRISTINE;
        rootAt[ry + oy][rx + ox] = { rx, ry };
      }
    }
  } else {
    clearCell(gx, gy);              // takes a whole big building if you hit one
    grid[gy][gx] = selected;        // EMPTY works as the eraser
    damage[gy][gx] = PRISTINE;      // fresh out of the box
  }
  roadsDirty = true;                // the road map may have changed shape
}

// slide the whole zoomed view by a screen-pixel delta (used for one-finger pan)
function doPan(dx, dy) { panX += dx; panY += dy; clampPan(); }

// ---------------------------------------------------------------------
// THE TOP BAR — three drop-down buttons and the money.
//   Items ▾      the stuff you build (houses, trees, stone, bunkers…)
//   Disasters ▾  the mayhem you rain down (this is the old MACHINE)
//   People       spawns little citizens (no menu, just a button)
// Each drop-down opens a list below it, like a real menu.
// ---------------------------------------------------------------------

// everything you can BUILD — these fill the Items drop-down
const buttons = [
  { icon: '🏠', short: 'House',  type: HOUSE },
  { icon: '🏢', short: 'Apt',    type: APT },
  { icon: '🏙', short: 'Sky',    type: SKY },
  { icon: '🏰', short: 'Tower',  type: TOWER },
  { icon: '🌳', short: 'Tree',   type: TREE },
  { icon: '🪨', short: 'Stone',  type: STONE },
  { icon: '🛡', short: 'Bunker', type: BUNKER },
  { icon: '🛣', short: 'Road',   type: ROAD },
  { icon: '👣', short: 'Path',   type: PATH },
  { icon: '❌', short: 'Erase',  type: EMPTY },
];

// the critters you can drop into town — these fill the People drop-down
const CRITTER_MENU = [
  { label: '🧍 People',  kind: 'person' },
  { label: '🐄 Cows',    kind: 'cow' },
  { label: '🐕 Dogs',    kind: 'dog' },
  { label: '⚔ Knights',  kind: 'knight' },
];

// everything you can UNLEASH — these fill the Disaster drop-down
const MACHINE_MENU = [
  { label: '🌪 Tornado',      type: 'tornado', cost: 10 },
  { label: '☄ Meteors',       type: 'meteors', cost: 15 },
  { label: '💥 Earthquake',   type: 'quake',   cost: 8 },
  { label: '🌊 Flood',        type: 'flood',   cost: 12 },
  { label: '🔴 Rubber Balls', type: 'balls',   cost: 9 },
  { label: '🦹 Bad Guys',     type: 'badguys', cost: 10 },
];

// quick point-in-box test, used all over the input code
function inside(px, py, r) { return px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h; }

// builds a rounded-rectangle path (call ctx.fill()/ctx.stroke() after).
// We roll our own so it works even on browsers without ctx.roundRect.
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// a steady pseudo-random 0..1 from a number — same input, same output every
// frame, so things placed with it (like fog clouds) hold still instead of flickering
function hash(n) { const v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); }

// Pick the biggest font size (up to `size`) that makes `text` fit in `maxW`,
// and set it. Emoji are extra-wide, so words like "🌪 Disasters ▾" used to
// spill outside their button — this stops that on any screen.
function fitFont(text, maxW, size, min) {
  let fs = size;
  ctx.font = `bold ${fs}px monospace`;
  while (fs > (min || 10) && ctx.measureText(text).width > maxW) {
    fs -= 1;
    ctx.font = `bold ${fs}px monospace`;
  }
  return fs;
}

// the emoji of whatever build item is currently picked
function iconFor(type) {
  const b = buttons.find(b => b.type === type);
  return b ? b.icon : '🏠';
}
// what the Build button shows: a hand when you're NOT building (so you're
// free to drag the map), otherwise the icon of the thing you're placing.
function buildIcon() { return selected == null ? '✋' : iconFor(selected); }

// Stop building. There's no "pan mode" to switch on — dragging the map is
// simply what happens whenever you're not placing something.
function stopBuilding() {
  selected = null;
  openMenu = null;
  setStatus('✋ Drag to move the map, pinch to zoom', '#7dd3ff', true);
}

// ROW 1 (top): ← Arcade pill on the left, the gold money chip in the MIDDLE,
// and the fullscreen button on the right.
function moneyChipRect() {
  const narrow = canvas.width < 480;
  const w = narrow ? 104 : 150;
  return { x: (canvas.width - w) / 2, y: 12, w, h: 32, narrow };
}

// The fullscreen toggle, top-right. Real fullscreen hides the phone's
// browser bars, which gives the town a lot more room.
function fullBtnRect() {
  return { x: canvas.width - 46, y: 12, w: 36, h: 32 };
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  try {
    if (isFullscreen()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  } catch (e) {}          // some browsers say no. that's fine, carry on.
}

// THE AMOUNT DIAL — how many of a thing you get per tap. Cycles
// x1 -> x2 -> x5 -> x10 and applies to people AND disasters.
const QTY_STEPS = [1, 2, 5, 10, 100];   // yes, one hundred. Amos insisted.
let qty = 1;

// ROW 2 (below): three big drop-down buttons plus the little amount dial —
// Build, People, Disasters, then xN at the end.
function topButtons() {
  const gap = 10, pad = 10, y = 58, h = 38;
  const qw = 58;                                   // the compact xN dial
  const x0 = pad, x1 = canvas.width - pad;
  const w = (x1 - x0 - gap * 3 - qw) / 3;
  const defs = [
    { key: 'build',     icon: buildIcon(), word: 'Build',    menu: true },
    { key: 'people',    icon: '🧍',        word: 'People',   menu: true },
    { key: 'disasters', icon: '🌪',        word: 'Disaster', menu: true },
  ];
  const out = defs.map((d, i) => ({ ...d, x: x0 + i * (w + gap), y, w, h }));
  out.push({ key: 'qty', icon: '', word: 'x' + qty, menu: false,
             x: x1 - qw, y, w: qw, h });
  return out;
}

// The "Stop Building" button, parked at the BOTTOM CENTRE and shown only
// while you're actually placing something. Tap it and you're back to
// dragging the map around.
function stopBuildRect() {
  if (selected == null) return null;
  const w = 190, h = 40;
  return { x: (canvas.width - w) / 2, y: canvas.height - h - 16, w, h };
}

// The list that drops down under an open button. Kept on-screen at the right edge.
function menuRects(kind) {
  const btn = topButtons().find(b => b.key === kind);
  const items = kind === 'build'
    ? buttons.map(b => ({ label: b.icon + ' ' + b.short, type: b.type, cost: 0 }))
    : kind === 'people'
    ? CRITTER_MENU.map(c => ({ ...c }))
    : MACHINE_MENU.map(m => ({ ...m }));
  // disasters need extra room so the name never crowds its price tag
  const minW = kind === 'disasters' ? 214 : 172;
  const w = Math.max(btn.w, minW), h = 38, gap = 4;
  let x = btn.x;
  if (x + w > canvas.width - 6) x = canvas.width - 6 - w;   // don't run off the right edge
  return items.map((it, i) => ({ ...it, x, y: TOPBAR + 6 + i * (h + gap), w, h }));
}

// tapping a top button: open or close its drop-down — or spin the dial
function handleTopButton(b) {
  if (b.key === 'qty') {
    qty = QTY_STEPS[(QTY_STEPS.indexOf(qty) + 1) % QTY_STEPS.length];
    setStatus('Amount set to x' + qty + ' — everything comes in ' +
              (qty === 1 ? 'ones!' : qty + 's!'), '#7dd3ff');
    return;
  }
  openMenu = (openMenu === b.key) ? null : b.key;
}

// tapping a row inside an open menu
function chooseFromMenu(kind, r) {
  if (kind === 'build') {
    selected = r.type;
    setStatus('Now placing ' + r.label, '#7ddf8f', true);
    openMenu = null;
  } else if (kind === 'people') {
    const made = spawnCritters(r.kind);
    setStatus(made ? r.label + ' wander in!' : 'No open ground left to stand on!',
              made ? '#7ddf8f' : '#ff6b5e');
    openMenu = null;
    selected = null;                 // stop building so you can watch them arrive
  } else {
    pickDisaster(r);      // pays, closes the menu, and starts the tension countdown
  }
}

function pressAt(px, py) {
  // if a menu is open, it gets first say
  if (openMenu) {
    for (const r of menuRects(openMenu)) {
      if (inside(px, py, r)) { chooseFromMenu(openMenu, r); return true; }
    }
    const tb = topButtons().find(b => inside(px, py, b));
    if (tb) { handleTopButton(tb); return true; }   // let them switch menus
    openMenu = null;                                 // tapped away — just close it
    return true;
  }
  // no menu open: check the top buttons
  const tb = topButtons().find(b => inside(px, py, b));
  if (tb) { handleTopButton(tb); return true; }
  if (inside(px, py, fullBtnRect())) { toggleFullscreen(); return true; }
  // the bottom-centre STOP BUILDING button
  const sb = stopBuildRect();
  if (sb && inside(px, py, sb)) { stopBuilding(); return true; }
  if (py <= TOPBAR) return true;    // tapped an empty part of the bar — do nothing
  return false;                     // tapped the world — paint, or drag the map
}

// ---------------------------------------------------------------------
// INPUT — mouse and touch both paint blocks while held down
// ---------------------------------------------------------------------
let painting = false;               // dragging to paint blocks (an item is selected)
let panning = false;                // dragging to slide the map (pan mode)
let lastDrag = { x: 0, y: 0 };      // where the finger/mouse was last frame, for panning
// Taps on the Arcade link are left alone so the link actually navigates.
function onBackButton(e) { return e.target && e.target.closest && e.target.closest('#back'); }

// after a tap lands in the world, either paint or start a pan, depending on mode
function startWorldDrag(x, y) {
  if (selected == null) { panning = true; lastDrag = { x, y }; }   // pan mode
  else { painting = true; placeAt(x, y); }                          // build mode
}

addEventListener('mousedown', e => {
  if (onBackButton(e)) return;
  if (!pressAt(e.clientX, e.clientY)) startWorldDrag(e.clientX, e.clientY);
});
addEventListener('mousemove', e => {
  if (painting) placeAt(e.clientX, e.clientY);
  else if (panning) { doPan(e.clientX - lastDrag.x, e.clientY - lastDrag.y); lastDrag = { x: e.clientX, y: e.clientY }; }
});
addEventListener('mouseup', () => { painting = false; panning = false; });

// MOUSE WHEEL / TRACKPAD ZOOM. Scroll up over the town to zoom in toward
// the pointer, scroll down to zoom back out. We keep the spot under the
// cursor pinned so it feels like leaning in, not jumping.
addEventListener('wheel', e => {
  if (onBackButton(e)) return;
  if (e.clientY <= TOPBAR) return;             // leave the toolbar alone
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  setCamera(zoom * factor, screenToWorld(e.clientX, e.clientY), e.clientX, e.clientY);
}, { passive: false });

// PINCH TO ZOOM. Two fingers on the glass = grab the map: spread apart to
// zoom in, pinch together to zoom out, and slide both fingers to pan. One
// finger still paints blocks like before.
let pinch = null;   // remembers the two-finger gesture between frames, or null

// distance between the two fingers, and the point exactly between them
function twoFinger(e) {
  const a = e.touches[0], b = e.touches[1];
  return {
    dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2,
  };
}

addEventListener('touchstart', e => {
  if (onBackButton(e)) return;                 // don't preventDefault - let the link work
  e.preventDefault();
  if (e.touches.length >= 2) {                 // two fingers down: start a pinch, don't paint/pan
    painting = false; panning = false;
    pinch = twoFinger(e);
    return;
  }
  const t = e.changedTouches[0];
  if (!pressAt(t.clientX, t.clientY)) startWorldDrag(t.clientX, t.clientY);
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  if (pinch && e.touches.length >= 2) {        // mid-pinch: zoom + pan together
    const now = twoFinger(e);
    // the town spot under the OLD midpoint should land under the NEW one
    const anchor = screenToWorld(pinch.x, pinch.y);
    setCamera(zoom * (now.dist / pinch.dist), anchor, now.x, now.y);
    pinch = now;
    return;
  }
  const t = e.changedTouches[0];
  if (painting) placeAt(t.clientX, t.clientY);
  else if (panning) { doPan(t.clientX - lastDrag.x, t.clientY - lastDrag.y); lastDrag = { x: t.clientX, y: t.clientY }; }
}, { passive: false });
addEventListener('touchend', e => {
  painting = false; panning = false;
  if (e.touches.length < 2) pinch = null;      // pinch is over once a finger lifts
});

// number keys pick a build item too
const KEY_ITEM = { '1': HOUSE, '2': APT, '3': TREE, '4': STONE, '5': BUNKER,
                   '6': ROAD, '7': PATH, '8': EMPTY };
addEventListener('keydown', e => {
  if (e.key in KEY_ITEM) {
    selected = KEY_ITEM[e.key];
    setStatus('Now placing ' + iconFor(selected), '#7ddf8f', true);
  }
  if (e.key.toLowerCase() === 'd') openMenu = openMenu === 'disasters' ? null : 'disasters';  // D for Disasters menu
  if (e.key.toLowerCase() === 'b') openMenu = openMenu === 'build' ? null : 'build';          // B for Build menu
  if (e.key.toLowerCase() === 'p') { spawnCritters('person'); setStatus('🧍 People wander in!', '#7ddf8f'); }
  if (e.key.toLowerCase() === 'c') { spawnCritters('cow');    setStatus('🐄 Cows wander in!', '#7ddf8f'); }
  if (e.key.toLowerCase() === 'g') { spawnCritters('dog');    setStatus('🐕 Dogs wander in!', '#7ddf8f'); }
  if (e.key === 'Escape') stopBuilding();                        // Esc stops building
  if (e.key === '0') { zoom = 1; panX = 0; panY = 0; }           // 0 zooms back out to the whole town
});

// ---------------------------------------------------------------------
// DRAWING ROADS AND PATHS
// A road square looks at its four neighbours and draws itself to match, so
// straights, corners, T-junctions and crossroads all join up by themselves.
// And when two road lines run side by side, they merge into one wide
// two-lane road with a dashed line down the middle.
// ---------------------------------------------------------------------
function sameWay(gx, gy, kind) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return false;
  return grid[gy][gx] === kind;
}

function drawWay(gx, gy, x, y, s, kind) {
  const road = kind === ROAD;
  const N = sameWay(gx, gy - 1, kind), S = sameWay(gx, gy + 1, kind);
  const W = sameWay(gx - 1, gy, kind), E = sameWay(gx + 1, gy, kind);
  const wide = road ? 0.78 : 0.5;                 // roads are fat, paths are skinny
  const half = s * wide / 2, mid = s / 2;

  ctx.fillStyle = road ? '#4b4f55' : '#c8b38b';   // tarmac, or trodden dirt
  // the square's own middle patch
  ctx.fillRect(x + mid - half, y + mid - half, half * 2, half * 2);
  // a stub reaching out to each neighbour it connects to
  if (N) ctx.fillRect(x + mid - half, y, half * 2, mid);
  if (S) ctx.fillRect(x + mid - half, y + mid, half * 2, mid + 1);
  if (W) ctx.fillRect(x, y + mid - half, mid, half * 2);
  if (E) ctx.fillRect(x + mid, y + mid - half, mid + 1, half * 2);
  // a lone square with no neighbours at all still shows something
  if (!N && !S && !W && !E) {
    ctx.fillRect(x + mid - half, y + mid - half, half * 2, half * 2);
  }

  if (road) {
    // ONLY a two-lane road gets a centre line — there's nothing to divide on
    // a one-way single lane. The line sits on the edge shared with our twin,
    // and we draw it across the FULL square so it meets the line from the
    // next square along, which is what makes bends and junctions join up.
    const dual = roadDual[gy][gx];
    const turn = roadTurn[gy][gx];
    ctx.strokeStyle = '#f2d24b';
    ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.setLineDash([s * 0.16, s * 0.14]);
    ctx.beginPath();
    if (turn) {
      // ROUND THE BEND. The centre line of a two-lane corner passes through
      // the middle of the 2x2 block and reaches out to each arm — so it
      // makes a tidy L that meets the lines of the straights either side.
      // Drawn once, by the block's top-left square.
      if (gx === turn.bx && gy === turn.by) {
        const mx = (turn.bx + 1) * s, my = TOPBAR + (turn.by + 1) * s;
        for (const a of turn.arms) {
          ctx.moveTo(mx, my);
          ctx.lineTo(mx + a.dx * s, my + a.dy * s);
        }
      }
    } else if (dual === 'v' && isRoad(gx + 1, gy) && roadDual[gy][gx + 1] === 'v') {
      ctx.moveTo(x + s, y); ctx.lineTo(x + s, y + s);       // left lane of the pair
    } else if (dual === 'h' && isRoad(gx, gy + 1) && roadDual[gy + 1][gx] === 'h') {
      ctx.moveTo(x, y + s); ctx.lineTo(x + s, y + s);       // top lane of the pair
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // ONE-WAY ARROWS on a single lane, so you can see which way it flows
    const one = roadOne[gy][gx];
    if (one && !roadJunc[gy][gx]) {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = Math.max(1, s * 0.045);
      ctx.lineCap = 'round';
      const ax = x + mid, ay = y + mid;
      const px2 = one.dx * s * 0.16, py2 = one.dy * s * 0.16;   // point of the arrow
      const wx = one.dy * s * 0.13, wy = one.dx * s * 0.13;     // its two barbs
      ctx.beginPath();
      ctx.moveTo(ax + px2 - px2 * 2 + wx, ay + py2 - py2 * 2 + wy);
      ctx.lineTo(ax + px2, ay + py2);
      ctx.lineTo(ax + px2 - px2 * 2 - wx, ay + py2 - py2 * 2 - wy);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
  } else {
    // paths get little stepping-stone speckles
    ctx.fillStyle = 'rgba(150, 128, 92, 0.55)';
    for (let i = 0; i < 3; i++) {
      const h2 = hash(gx * 5.1 + gy * 2.7 + i);
      ctx.fillRect(x + s * (0.28 + h2 * 0.42), y + s * (0.24 + i * 0.24), s * 0.09, s * 0.07);
    }
  }
}

// A CALM WANDER. Everyone would rather stroll along a road or path than
// wade through the grass — so if they're on one, they mostly follow it; if
// they're near one, they drift toward it. But they still wander off now and
// then, because they're not robots.
const STEP4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function strollAbout(p, dt, cs) {
  const gx = Math.floor(p.x / cs), gy = Math.floor((p.y - TOPBAR) / cs);
  if (wayAt(gx, gy)) {
    // ON a path: keep following it, choosing among the ways out of this square
    if (Math.random() < dt * 1.6) {
      const outs = STEP4.filter(([dx, dy]) => wayAt(gx + dx, gy + dy));
      if (outs.length && Math.random() < 0.85) {          // 85%: stay on the path
        const [dx, dy] = outs[Math.floor(Math.random() * outs.length)];
        p.angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.25;
      } else {
        p.angle = Math.random() * 6.28;                   // 15%: strike out cross-country
      }
    }
    return;
  }
  // OFF the path: every so often, look around for one nearby and head for it
  if (Math.random() < dt * 0.9) {
    let best = null, bestD = 99;
    for (let r = 1; r <= 3 && !best; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (!wayAt(gx + dx, gy + dy)) continue;
          const d2 = Math.abs(dx) + Math.abs(dy);
          if (d2 < bestD) { bestD = d2; best = [dx, dy]; }
        }
      }
    }
    if (best && Math.random() < 0.7) {
      p.angle = Math.atan2(best[1], best[0]) + (Math.random() - 0.5) * 0.4;
    } else {
      p.angle = Math.random() * 6.28;
    }
  }
}

// ---------------------------------------------------------------------
// UPDATE — the tornado wanders and EATS
// ---------------------------------------------------------------------
let lastTime = 0;
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake -= dt;
  if (brokeFlash > 0) brokeFlash -= dt;
  if (statusTimer > 0 && !statusSticky) statusTimer -= dt;
  ensureRoads();                 // keep our notes about the roads up to date
  lightClock += dt;              // and let the traffic lights tick round

  // let squares recover from their "just been hit" moment
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) if (hitCool[y][x] > 0) hitCool[y][x] -= dt;
  }

  // Disasters you've paid for count down a moment of dread, with the ground
  // rumbling harder the closer they get. When the timer hits zero, they strike.
  if (pendings.length) {
    for (const p of pendings) p.timer -= dt;
    let worst = 0;
    for (const p of pendings) worst = Math.max(worst, 1 - p.timer / TENSION);
    shake = Math.max(shake, 0.05 + worst * 0.25);   // tension you can feel
    for (const p of pendings) {
      if (p.timer <= 0) {
        beginDisaster(p.type);
        setStatus(p.label + '!', '#ff9f43');
        shake = Math.max(shake, 0.5);
        buzz(p.type);                 // rattle the phone (where the browser allows it)
      }
    }
    pendings = pendings.filter(p => p.timer > 0);
  }

  for (const D of disasters) {      // every active disaster does its thing
    D.life -= dt;
    const s = cellSize();

    if (D.type === 'tornado') {
      // tornadoes HUNT HOUSES. Find the nearest one still standing...
      let target = null, best = 999999;
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT && grid[gy][gx] !== SKY) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          const d2 = Math.hypot(bx - D.x, by - D.y);
          if (d2 < best) { best = d2; target = { x: bx, y: by }; }
        }
      }
      D.wobble += dt * 1.7;
      if (target) {
        // ...and weave drunkenly toward its doom
        const ang = Math.atan2(target.y - D.y, target.x - D.x);
        D.x += Math.cos(ang) * 115 * dt + Math.sin(D.wobble) * 45 * dt;
        D.y += Math.sin(ang) * 115 * dt + Math.cos(D.wobble) * 45 * dt;
      } else {
        D.x += 150 * dt;   // no houses left — it spins away, satisfied
      }
      D.y = Math.max(TOPBAR + 40, Math.min(TOPBAR + ROWS * s - 40, D.y));
      shake = 0.2;
      // it keeps dropping splintered bits of whatever it just ate
      D.messTimer = (D.messTimer || 0.5) - dt;
      if (D.messTimer <= 0) {
        D.messTimer = 0.45 + Math.random() * 0.5;
        dropLitter(D.x + (Math.random() - 0.5) * 60,
                   D.y + (Math.random() - 0.5) * 40, 'splinter');
      }
      // it ONLY eats housing (houses AND apartments) — trees and stone
      // just get a wild hairdo
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          if (grid[gy][gx] !== HOUSE && grid[gy][gx] !== APT && grid[gy][gx] !== SKY) continue;
          const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
          // a tornado CHEWS — usually takes a house out in one go
          if (Math.hypot(bx - D.x, by - D.y) < 70) hitBlock(gx, gy, bx, by, 3);
        }
      }
      if (D.life <= 0 || D.x > COLS * s + 80) D.done = true;
    }

    if (D.type === 'meteors') {
      shake = Math.max(shake, 0.1);
      D.spawnTimer -= dt;
      if (D.spawnTimer <= 0) {
        D.spawnTimer = 0.45;                    // a new fireball every half second
        // aim each fireball to land ON the town: pick a landing spot, then
        // start it up-and-to-the-right so its slanted fall arrives there
        const lx = Math.random() * (COLS * s);
        const ty = TOPBAR + 40 + Math.random() * (ROWS * s - 80);
        const fall = (ty - (TOPBAR - 60)) / 620;   // seconds it takes to fall
        D.meteors.push({ x: lx + 260 * fall, y: TOPBAR - 60, ty });
      }
      for (const m of D.meteors) {
        m.x -= 260 * dt;                        // falling at a slant
        m.y += 620 * dt;
        if (m.y >= m.ty) {
          m.hit = true;
          shake = 0.35;
          craters.push({ x: m.x, y: m.y, r: 26 + Math.random() * 14 });
          // a lump of the meteor is left sitting in its own crater
          dropLitter(m.x + (Math.random() - 0.5) * 14,
                     m.y + (Math.random() - 0.5) * 10, 'ember');
          // any car parked in the blast is instantly scrap
          for (const car of cars) {
            if (!car.gone && Math.hypot(car.x - m.x, car.y - m.y) < 60) popCar(car);
          }
          // anyone standing OUTSIDE near the impact gets LAUNCHED
          for (const p of people) {
            if (!p.gone && !p.sheltering && Math.hypot(p.x - m.x, p.y - m.y) < 85) {
              p.gone = true;
              peopleLaunched++;
              launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
                vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
            }
          }
          // BOOM — everything near the impact is gone, even stone
          for (let gy = 0; gy < ROWS; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              // bunkers shrug off even a direct meteor hit
              if (grid[gy][gx] === EMPTY || grid[gy][gx] === BUNKER) continue;
              const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
              // a meteor lands hardest of all
              if (Math.hypot(bx - m.x, by - m.y) < 60) hitBlock(gx, gy, bx, by, 4);
            }
          }
          for (let i = 0; i < 14; i++) {
            debris.push({ x: m.x, y: m.y,
              vx: (Math.random() - 0.5) * 600, vy: -Math.random() * 500,
              spin: Math.random() * 10, life: 0.8,
              color: i % 2 ? '#ff9f43' : '#ffd23f' });
          }
        }
      }
      D.meteors = D.meteors.filter(m => !m.hit);
      if (D.life <= 0 && D.meteors.length === 0) D.done = true;
    }

    if (D.type === 'quake') {
      shake = 0.3;                              // the ground never stops moving
      // blocks randomly crumble — houses are fragile, stone is tough
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY) continue;
          if (kind === BUNKER) continue;             // bunkers do not care
          const fragile = kind === SKY ? 1.1         // the tallest fall hardest
                        : kind === HOUSE ? 0.9
                        : kind === APT ? 0.7         // tall = topply
                        : kind === TREE ? 0.35
                        : kind === TOWER ? 0.08      // castle-grade stonework
                        : 0.15;
          if (Math.random() < fragile * dt) {
            // a quake rattles things loose a crack at a time
            hitBlock(gx, gy, gx * s + s / 2, TOPBAR + gy * s + s / 2, 2);
          }
        }
      }
      D.grow = Math.min(1, (D.grow || 0) + dt * 1.1);   // the cracks rip open
      // slabs of ground heave up out of the cracks
      D.messTimer = (D.messTimer || 0.4) - dt;
      if (D.messTimer <= 0) {
        D.messTimer = 0.35 + Math.random() * 0.4;
        dropLitter(10 + Math.random() * (COLS * s - 20),
                   TOPBAR + 10 + Math.random() * (ROWS * s - 20), 'slab');
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'flood') {
      // the water rises for 4s, holds for 2s, drains for 4s
      const t2 = 10 - D.life;
      let frac;
      if (t2 < 4) frac = t2 / 4;
      else if (t2 < 6) frac = 1;
      else frac = Math.max(0, 1 - (t2 - 6) / 4);
      const wasY = D.waterY;
      D.waterY = (TOPBAR + ROWS * s) - frac * (ROWS * s) * 0.72;
      // AS IT DRAINS, the water can't all run away — it's left standing in
      // POOLS. Each pool is a blob of whole squares joined together, so it
      // reads as one big continuous puddle rather than a lot of dots.
      // Somebody is going to have to mop all that up.
      if (t2 > 6 && !D.pooled) {
        D.pooled = true;
        const lowest = Math.floor((TOPBAR + ROWS * s - TOPBAR) / s);   // = ROWS
        const topRow = Math.max(0, Math.floor((wasY - TOPBAR) / s));
        const taken = new Set();
        const pools = 4 + Math.floor(Math.random() * 4);
        for (let n = 0; n < pools; n++) {
          // start each pool somewhere in the ground the water covered
          let cx2 = Math.floor(Math.random() * COLS);
          let cy2 = topRow + Math.floor(Math.random() * Math.max(1, lowest - topRow));
          const blob = [];
          const frontier = [[cx2, cy2]];
          const want = 4 + Math.floor(Math.random() * 9);
          while (frontier.length && blob.length < want) {
            const [px2, py2] = frontier.splice(Math.floor(Math.random() * frontier.length), 1)[0];
            const key = px2 + ',' + py2;
            if (px2 < 0 || py2 < 0 || px2 >= COLS || py2 >= ROWS) continue;
            if (taken.has(key)) continue;
            taken.add(key);
            blob.push([px2, py2]);
            // water spreads to the squares next door
            for (const [ox, oy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
              if (Math.random() < 0.72) frontier.push([px2 + ox, py2 + oy]);
            }
          }
          for (const [px2, py2] of blob) {
            const L = dropLitter(px2 * s + s / 2, TOPBAR + py2 * s + s / 2, 'puddle');
            if (L) { L.gx = px2; L.gy = py2; }
          }
        }
      }
      // anything underwater washes away... except STONE. stone doesn't care.
      for (let gy = 0; gy < ROWS; gy++) {
        for (let gx = 0; gx < COLS; gx++) {
          const kind = grid[gy][gx];
          if (kind === EMPTY || kind === STONE || kind === BUNKER || kind === TOWER) continue;   // waterproof
          const by = TOPBAR + gy * s + s / 2;
          // underwater: the damp works away at it
          if (by > D.waterY && Math.random() < dt * 2.5)
            hitBlock(gx, gy, gx * s + s / 2, by, 2, true);
        }
      }
      if (D.life <= 0) D.done = true;
    }

    if (D.type === 'balls') {
      shake = Math.max(shake, 0.08);
      for (const ball of D.balls) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        // BOING — bounce off every edge of the world
        if (ball.x < 16) { ball.x = 16; ball.vx = Math.abs(ball.vx); }
        if (ball.x > COLS * s - 16) { ball.x = COLS * s - 16; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < TOPBAR + 16) { ball.y = TOPBAR + 16; ball.vy = Math.abs(ball.vy); }
        if (ball.y > TOPBAR + ROWS * s - 16) { ball.y = TOPBAR + ROWS * s - 16; ball.vy = -Math.abs(ball.vy); }
        // anything a ball touches gets bounced INTO OBLIVION (except bunkers)
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (kind === EMPTY || kind === BUNKER) continue;
            const bx = gx * s + s / 2, by = TOPBAR + gy * s + s / 2;
            // a rubber ball mostly just DENTS things
            if (Math.hypot(bx - ball.x, by - ball.y) < 34) hitBlock(gx, gy, bx, by, 2);
          }
        }
      }
      if (D.life <= 0) {
        // time's up — every ball POPS in a burst of its own color
        for (const ball of D.balls) {
          for (let i = 0; i < 8; i++) {
            debris.push({ x: ball.x, y: ball.y,
              vx: (Math.random() - 0.5) * 400, vy: -Math.random() * 350,
              spin: Math.random() * 10, life: 0.6, color: ball.color });
          }
          // about half of them don't pop — they just roll to a stop and stay
          if (Math.random() < 0.5) {
            const L = dropLitter(ball.x, ball.y, 'ball');
            if (L) L.color = ball.color;
          }
        }
        D.done = true;
      }
    }
  }
  disasters = disasters.filter(D => !D.done);   // sweep up the finished ones

  // ---- THE LITTLE PEOPLE — wandering, panicking, HIDING, or REPAIRING ----
  // ---- BAD GUYS on their crime spree ----
  const bs = cellSize();
  for (const b of badGuys) {
    b.walk += dt * 10;
    b.life -= dt;
    if (b.swing > 0) b.swing -= dt;
    if (b.life <= 0) b.leaving = true;

    if (b.leaving) {
      // crime spree over — scatter to the nearest edge and vanish
      const exits = [
        { x: -40, y: b.y }, { x: gridW() + 40, y: b.y },
        { x: b.x, y: TOPBAR - 40 }, { x: b.x, y: TOPBAR + gridH() + 40 },
      ];
      let exit = exits[0], eBest = 999999;
      for (const e of exits) {
        const d2 = Math.hypot(e.x - b.x, e.y - b.y);
        if (d2 < eBest) { eBest = d2; exit = e; }
      }
      b.angle = Math.atan2(exit.y - b.y, exit.x - b.x);
      b.x += Math.cos(b.angle) * 140 * dt;
      b.y += Math.sin(b.angle) * 140 * dt;
      if (b.x < -30 || b.x > gridW() + 30 ||
          b.y < TOPBAR - 30 || b.y > TOPBAR + gridH() + 30) b.gone = true;
      continue;
    }

    // find the nearest smashable shelter (bunkers are club-proof)
    let target = null, best = 999999;
    for (let gy = 0; gy < ROWS; gy++) {
      for (let gx = 0; gx < COLS; gx++) {
        const kind = grid[gy][gx];
        if (!isShelter(kind) || kind === BUNKER) continue;
        const rt = rootAt[gy][gx];
        if (rt && (rt.rx !== gx || rt.ry !== gy)) continue;   // big buildings count once
        const sp = spanOf(kind);
        const bx2 = gx * bs + (bs * sp) / 2, by2 = TOPBAR + gy * bs + (bs * sp) / 2;
        const d2 = Math.hypot(bx2 - b.x, by2 - b.y);
        if (d2 < best) {
          best = d2;
          target = { gx, gy, x: bx2, y: by2, reach: bs * sp * 0.65 };
        }
      }
    }
    // no shelters left to smash? chase the nearest person instead
    let prey = null;
    if (!target) {
      let pBest = 999999;
      for (const p of people) {
        if (p.sheltering || p.gone || p.kind !== 'person') continue;
        const d2 = Math.hypot(p.x - b.x, p.y - b.y);
        if (d2 < pBest) { pBest = d2; prey = p; }
      }
    }
    const goal = target || prey;
    if (goal) {
      const d2 = Math.hypot(goal.x - b.x, goal.y - b.y);
      const reach = target ? target.reach : 20;
      if (d2 > reach) {
        b.angle = Math.atan2(goal.y - b.y, goal.x - b.x) + Math.sin(b.walk) * 0.15;
        b.x += Math.cos(b.angle) * 95 * dt;
        b.y += Math.sin(b.angle) * 95 * dt;
      } else if (target && b.swing <= 0) {
        // WHACK. the damage system does the cracking and the collapsing
        b.swing = 0.8;
        hitBlock(target.gx, target.gy, target.x, target.y, 1);
      }
    } else {
      b.angle += (Math.random() - 0.5) * dt * 6;   // nothing left — mill about smugly
      b.x += Math.cos(b.angle) * 60 * dt;
      b.y += Math.sin(b.angle) * 60 * dt;
    }

    // bonk anyone they catch out in the open
    for (const p of people) {
      if (p.gone || p.sheltering || p.kind !== 'person') continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) < 22) {
        p.gone = true;
        peopleLaunched++;
        launchedFolk.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 600,
          vy: -400 - Math.random() * 300, spin: 0, life: 1.4, shirt: p.shirt });
      }
    }
  }
  badGuys = badGuys.filter(b => !b.gone);

  const panicking = disasters.length > 0 || badGuys.length > 0;
  const cs = cellSize();

  // which broken buildings already have a worker on them (one each, no crowding)
  // when doom arrives, everybody drops the broom and abandons their mess
  if (panicking) {
    for (const L of litter) L.by = null;
    for (const p of people) { p.mess = null; p.messT = 0; p.sweeping = false; p.mopping = false; }
  }
  const claimed = new Set();
  for (const p of people) {
    if (p.job) {
      if (panicking) { p.job = null; p.jobT = 0; p.fixing = false; p.stand = null; }  // drop tools and RUN
      else claimed.add(p.job.gx + ',' + p.job.gy);
    }
  }

  // how many people are inside (or racing toward) each building? MAX 3.
  // a house is not a clown car.
  const occupancy = {};
  for (const p of people) {
    const spot = p.sheltering || p.shelterTarget;
    if (spot) {
      const k = spot.gx + ',' + spot.gy;
      occupancy[k] = (occupancy[k] || 0) + 1;
    }
  }

  for (const p of people) {

    // ---- KNIGHTS don't panic and don't hide. Knights CHARGE. ----
    if (p.kind === 'knight') {
      p.walk += dt * 8;
      p.bob += dt * 5;
      if (p.clash > 0) p.clash -= dt;

      // any bad guys about?
      let foe = null, fBest = 999999;
      for (const b of badGuys) {
        if (b.gone) continue;
        const d2 = Math.hypot(b.x - p.x, b.y - p.y);
        if (d2 < fBest) { fBest = d2; foe = b; }
      }

      let spd = 45;   // patrol pace
      if (foe) {
        if (fBest > 18) {
          // CHARGE — faster than a bandit can run
          p.angle = Math.atan2(foe.y - p.y, foe.x - p.x);
          spd = 170;
        } else {
          spd = 0;
          if (!(p.clash > 0)) {
            // CLANG! a sword blow lands, sparks fly, the bandit staggers
            p.clash = 0.6;
            foe.hp = (foe.hp == null ? 2 : foe.hp) - 1;
            for (let i = 0; i < 6; i++) {
              debris.push({ x: foe.x, y: foe.y - 10,
                vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 260 - 40,
                spin: Math.random() * 10, life: 0.5,
                color: i % 2 ? '#ffd23f' : '#e8ecf2' });
            }
            foe.x += (foe.x - p.x) * 2.5;   // knocked backwards
            foe.y += (foe.y - p.y) * 2.5;
            if (foe.hp <= 0) {
              // DEFEATED — launched off the map like his victims
              foe.gone = true;
              badGuysDefeated++;
              launchedFolk.push({ x: foe.x, y: foe.y,
                vx: (Math.random() - 0.5) * 600, vy: -400 - Math.random() * 300,
                spin: 0, life: 1.4, shirt: '#2c2c38' });
              setStatus('A knight defeated a bad guy! (' + badGuysDefeated + ' total)', '#7ddf8f');
            }
          }
        }
      } else if (Math.random() < dt * 0.6) {
        p.angle = Math.random() * 6.28;      // calm patrol, new heading sometimes
      }

      const nx = p.x + Math.cos(p.angle) * spd * dt;
      const ny = p.y + Math.sin(p.angle) * spd * dt;
      if (!blockedAt(nx, p.y)) p.x = nx;
      if (!blockedAt(p.x, ny)) p.y = ny;
      p.x = Math.max(10, Math.min(gridW() - 10, p.x));
      p.y = Math.max(TOPBAR + 10, Math.min(TOPBAR + gridH() - 10, p.y));
      continue;                              // knights skip the civilian brain
    }

    // already hiding inside a building?
    if (p.sheltering) {
      const kind = grid[p.sheltering.gy][p.sheltering.gx];
      if (!isShelter(kind)) {
        // their shelter was DESTROYED with them inside it. out they go!
        p.gone = true;
        peopleLaunched++;
        launchedFolk.push({
          x: p.sheltering.gx * cs + cs / 2,
          y: TOPBAR + p.sheltering.gy * cs + cs / 2,
          vx: (Math.random() - 0.5) * 600, vy: -400 - Math.random() * 300,
          spin: 0, life: 1.4, shirt: p.shirt });
      } else if (!panicking) {
        // all clear! everyone shuffles back outside
        p.x = p.sheltering.gx * cs + cs / 2 + (Math.random() - 0.5) * 20;
        p.y = TOPBAR + p.sheltering.gy * cs + cs + 6;
        p.sheltering = null;
      }
      continue;                     // hiding people don't walk around
    }

    p.walk += dt * (panicking ? 16 : 6);
    p.bob += dt * (panicking ? 14 : 3.2);      // a happy sway, or a terrified jitter

    if (panicking) {
      // RUN FOR SHELTER — find the nearest building with a roof.
      // (Whether it's a GOOD shelter is... not their department.)
      let target = p.shelterTarget;
      if (!target || !isShelter(grid[target.gy][target.gx])) {
        target = null;
        let best = 999999;
        for (let gy = 0; gy < ROWS; gy++) {
          for (let gx = 0; gx < COLS; gx++) {
            const kind = grid[gy][gx];
            if (!isShelter(kind)) continue;
            if ((occupancy[gx + ',' + gy] || 0) >= 3) continue;   // that one's FULL
            const bx = gx * cs + cs / 2, by = TOPBAR + gy * cs + cs / 2;
            const d2 = Math.hypot(bx - p.x, by - p.y);
            if (d2 < best) { best = d2; target = { gx, gy, x: bx, y: by }; }
          }
        }
        p.shelterTarget = target;
        if (target) {
          // claim a spot so the next runner picks somewhere else
          const k = target.gx + ',' + target.gy;
          occupancy[k] = (occupancy[k] || 0) + 1;
        }
      }
      if (target) {
        if (Math.hypot(target.x - p.x, target.y - p.y) < 12) {
          // one last headcount at the door...
          let inside = 0;
          for (const q of people) {
            if (q.sheltering && q.sheltering.gx === target.gx &&
                q.sheltering.gy === target.gy) inside++;
          }
          if (inside < 3) {
            p.sheltering = { gx: target.gx, gy: target.gy };   // squeezed in!
            p.shelterTarget = null;
            continue;
          }
          p.shelterTarget = null;      // full! no room! run somewhere else!!
        } else {
          p.angle = Math.atan2(target.y - p.y, target.x - p.x) + (Math.random() - 0.5) * 0.3;
        }
      } else {
        p.angle += (Math.random() - 0.5) * dt * 22;   // no shelter?! headless-chicken mode
      }
    } else {
      // ---- ALL CLEAR: TIME TO FIX THE PLACE UP ----
      // Only people do repairs (cows and dogs are no help at all). One
      // worker per building, and it's slow on purpose so you can watch the
      // building climb back from heavy damage to light to good as new.
      p.shelterTarget = null;
      if (p.kind === 'person') {
        // is the job we picked still a job? (it may have been finished or flattened)
        if (p.job && (grid[p.job.gy][p.job.gx] === EMPTY ||
                      damage[p.job.gy][p.job.gx] === PRISTINE)) {
          p.job = null; p.jobT = 0; p.stand = null;
        }
        if (!p.job) {                       // look for the nearest broken thing
          let best = 999999, found = null;
          for (let gy = 0; gy < ROWS; gy++) {
            for (let gx = 0; gx < COLS; gx++) {
              if (grid[gy][gx] === EMPTY || damage[gy][gx] === PRISTINE) continue;
