// THE CUT — somebody chopped a trail of trees right through the middle

const PATH = [
  { x: 150,  y: 1350 }, { x: 380,  y: 1180 }, { x: 520,  y: 1250 },
  { x: 760,  y: 1100 }, { x: 820,  y: 880 },  { x: 660,  y: 700 },
  { x: 760,  y: 520 },  { x: 1000, y: 600 },  { x: 1220, y: 760 },
  { x: 1450, y: 700 },  { x: 1560, y: 900 },  { x: 1750, y: 820 },
  { x: 1850, y: 560 },  { x: 1780, y: 320 },  { x: 1850, y: 180 },

// How far is this spot from the nearest piece of path? (We use this to
// keep trees from growing in the middle of the trail.)
function distToPath(x, y, path = PATH) {
  let best = 999999;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    // find the closest point on this piece of path, then measure to it
    const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
    best = Math.min(best, Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy)));
  }
  return best;
}

// smallest distance to ANY of a list of paths
function distToAnyPath(x, y, paths) {
  let best = 999999;
  for (const p of paths) best = Math.min(best, distToPath(x, y, p));
  return best;
}

// ---------------------------------------------------------------------
// BUILDING THE FOREST — scatter trees around the open world.
// No maze! Just clumps and clearings, like real woods.
// ---------------------------------------------------------------------
function buildForest(lv) {
  trees = [];
  flowers = [];
  pond = { x: 1450, y: 450, rx: 160, ry: 100 };   // a little lake

  // trees EVERYWHERE — a properly thick forest. The only easy way
  // through is the trail of chopped-down trees.
  for (let i = 0; i < 380; i++) {
    const x = 60 + noise(i * 3.17) * (lv.worldW - 120);
    const y = 60 + noise(i * 7.71) * (lv.worldH - 120);
    const nearSpawn = Math.hypot(x - lv.start.x, y - lv.start.y) < 60;   // just a tiny pocket to start in
    const inPond = ((x - pond.x) / (pond.rx + 60)) ** 2 + ((y - pond.y) / (pond.ry + 60)) ** 2 < 1;
    const onPath = distToPath(x, y) < 50;          // the cut is NARROW — trees crowd right up to it
    const nearGate = Math.hypot(x - gate.x, y - gate.y) < 110;
    if (nearSpawn || inPond || onPath || nearGate) continue;
    trees.push({ x, y, size: 0.8 + noise(i * 13.3) * 0.6 });
  }

  // a wall of trees around the edge, so the world has a natural border
  for (let x = 30; x < lv.worldW; x += 70) {
    trees.push({ x: x + noise(x) * 30, y: 25 + noise(x * 2) * 20, size: 1 });
    trees.push({ x: x + noise(x * 3) * 30, y: lv.worldH - 25 - noise(x * 4) * 20, size: 1 });
  }
  for (let y = 30; y < lv.worldH; y += 70) {
    trees.push({ x: 25 + noise(y * 5) * 20, y: y + noise(y * 6) * 30, size: 1 });
    trees.push({ x: lv.worldW - 25 - noise(y * 7) * 20, y: y + noise(y * 8) * 30, size: 1 });
  }

  // flowers are just decoration — you can walk right over them
  for (let i = 0; i < 120; i++) {
    flowers.push({
      x: noise(i * 31.7 + 5) * lv.worldW,
      y: noise(i * 77.1 + 5) * lv.worldH,
      kind: Math.floor(noise(i * 9.9) * 3),        // 0, 1, or 2 = different colors
    });
  }

  // stumps — all that's left of the chopped-down trees. We throw 300
  // darts at the map and only keep the ones that land along the trail.
  stumps = [];
  for (let i = 0; i < 300; i++) {
    const x = 100 + noise(i * 91.7) * (lv.worldW - 200);
    const y = 100 + noise(i * 13.9) * (lv.worldH - 200);
    const d = distToPath(x, y);
    const nearSpawn2 = Math.hypot(x - lv.start.x, y - lv.start.y) < 60;
    if (d > 14 && d < 46 && !nearSpawn2) {
      stumps.push({ x, y, size: 0.7 + noise(i * 3.3) * 0.6 });
    }
  }

  // fireflies! drifting little lights that keep the dark forest alive
  fireflies = [];
  for (let i = 0; i < 60; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,      // so they don't all blink together
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // ZOMBIES — they lurk along the trail ahead, Minecraft Dungeons style.
  // Never near your camp, never blocking the gate. 12 of them. Good luck.
  zombies = [];
  for (let i = 0; i < 200 && zombies.length < 12; i++) {
    const x = noise(i * 61.3 + 2) * lv.worldW;
    const y = noise(i * 37.9 + 2) * lv.worldH;
    const farFromCamp = Math.hypot(x - lv.start.x, y - lv.start.y) > 320;
    const onTrail = distToPath(x, y) < 55;
    const awayFromGate = Math.hypot(x - gate.x, y - gate.y) > 130;
    if (farFromCamp && onTrail && awayFromGate) {
      zombies.push({
        x, y,
        zombie: true,                    // tells the drawing code what this is
        hp: 2,                           // two sword bonks each
        wanderAngle: noise(i) * 6.28,    // which way it shambles when bored
        lastHitSwing: 0,                 // so one swing can't hit it twice
        hurtFlash: 0,                    // flashes white when bonked
      });
    }
  }

  creepers = [];
  skeletons = [];
  torches = [];
  scorches = [];
  tiles = [];
  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();   // suit up (if you've earned it)
}

// ---------------------------------------------------------------------
// BUILDING THE CREEPER TEMPLE — ancient stone, torchlight, lava... and
// the quiet green residents nobody invited.
// ---------------------------------------------------------------------
function buildTemple(lv) {
  // rows of stone pillars, but ancient and ruined — some have fallen,
  // and a wide walkway is kept clear from the entrance to the altar
  trees = [];
  let n = 0;
  for (let gx = 140; gx < lv.worldW - 100; gx += 150) {
    for (let gy = 140; gy < lv.worldH - 100; gy += 150) {
      n++;
      if (noise(n * 7.3) < 0.3) continue;             // this one fell down long ago
      const x = gx + (noise(n * 3.1) - 0.5) * 50;
      const y = gy + (noise(n * 5.7) - 0.5) * 50;
      if (distToPath(x, y, TEMPLE_PATH) < 170) continue;   // clear of the trail AND the wall band
      if (Math.hypot(x - altar.x, y - altar.y) < 140) continue;
      if (Math.hypot(x - lv.start.x, y - lv.start.y) < 110) continue;
      if (((x - 1950) / 220) ** 2 + ((y - 1500) / 170) ** 2 < 1) continue;   // lava zone
      trees.push({ x, y, size: 0.9 + noise(n * 9.1) * 0.4, pillar: true });
    }
  }
  // solid pillar walls around the edge of the temple
  for (let x = 40; x < lv.worldW; x += 60) {
    trees.push({ x, y: 35, size: 1.1, pillar: true });
    trees.push({ x, y: lv.worldH - 35, size: 1.1, pillar: true });
  }
  for (let y = 40; y < lv.worldH; y += 60) {
    trees.push({ x: 35, y, size: 1.1, pillar: true });
    trees.push({ x: lv.worldW - 35, y, size: 1.1, pillar: true });
  }

  // WALLS on both sides of the walkway — we march along the path and
  // drop a sandstone block every few steps, one on each side. "Perpendicular"
  // means "sideways from the direction you're walking" — that's how we
  // know where "each side" even is.
  // We check EVERY spot in the world and ask: "are you 100-140 steps from
  // the trail?" If yes → wall block. That paints a solid band of wall that
  // hugs every bend of the path — no corner gaps to slip through.
  for (let gx = 40; gx < lv.worldW - 40; gx += 34) {
    for (let gy = 40; gy < lv.worldH - 40; gy += 34) {
      const d = distToPath(gx, gy, TEMPLE_PATH);
      if (d < 100 || d > 140) continue;
      if (Math.hypot(gx - altar.x, gy - altar.y) < 165) continue;   // chamber has its own walls
      trees.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,   // tiny wobble so the wall
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,   // doesn't look machine-made
        size: 1, wall: true,
      });
    }
  }
  // seal the corridor BEHIND the entrance too — "back" is never a way out
  for (const sideX of [lv.start.x - 105, lv.start.x + 105]) {
    for (let y = lv.start.y; y < lv.worldH - 40; y += 38) {
      trees.push({ x: sideX, y, size: 1, wall: true });
    }
  }
  // the altar chamber: a ring of wall with exactly ONE doorway, where
  // the path comes in from the south
  for (let ang = 0; ang < Math.PI * 2; ang += 0.28) {
    if (Math.abs(ang - Math.PI / 2) < 0.55) continue;   // the doorway
    const wx = altar.x + Math.cos(ang) * 175;
    const wy = altar.y + Math.sin(ang) * 175;
    if (wx < 60 || wy < 60 || wx > lv.worldW - 60 || wy > lv.worldH - 60) continue;
    if (trees.some(t => t.wall && Math.hypot(t.x - wx, t.y - wy) < 26)) continue;
    trees.push({ x: wx, y: wy, size: 1, wall: true });
  }

  // the SAND-AND-STONE PAVING — scatter little square tiles all along
  // the walkway, some sandy, some gray stone, like an old patchwork road
  tiles = [];
  let tn = 0;
  for (let i = 0; i < TEMPLE_PATH.length - 1; i++) {
    const a = TEMPLE_PATH[i], b = TEMPLE_PATH[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    for (let d = 0; d < segLen; d += 24) {
      tn++;
      const off = (noise(tn * 3.7) - 0.5) * 130;      // scatter across the width
      tiles.push({
        x: a.x + ux * d + (-uy) * off,
        y: a.y + uy * d + ux * off,
        size: 16 + noise(tn * 5.1) * 14,
        sand: noise(tn * 8.3) < 0.55,                 // sandy tile or stone tile?
      });
    }
  }

  pond = { x: 1950, y: 1500, rx: 130, ry: 85, lava: true };   // not water. NOT water.
  stumps = [];
  flowers = [];
  scorches = [];

  // torches flank the walkway — a pair at every bend
  torches = [];
  for (let i = 0; i < TEMPLE_PATH.length - 1; i++) {
    const a = TEMPLE_PATH[i], b = TEMPLE_PATH[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // drifting embers instead of fireflies (same idea, temple colors)
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // CREEPERS. They wait along the walkway. Ssssss.
  creepers = [];
  for (let i = 0; i < 600 && creepers.length < 18; i++) {
    const x = noise(i * 57.1 + 4) * lv.worldW;
    const y = noise(i * 33.7 + 4) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 320) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 70) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 160) continue;
    creepers.push({
      x, y,
      creeper: true,
      hp: 2,
      fuse: 0,                       // when this is ticking, RUN (or bonk it)
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  zombies = [];
  // SAND ZOMBIES — desert-colored and extra tough, patrolling the
  // walkway right out in the open. (They used to hide buried in the
  // sand — flip buried to true to bring the ambushes back!)
  for (let i = 0; i < 500 && zombies.length < 8; i++) {
    const x = noise(i * 43.7 + 6) * lv.worldW;
    const y = noise(i * 29.3 + 6) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 60) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 180) continue;
    zombies.push({
      x, y,
      zombie: true,
      sand: true,           // sandy colors, tougher
      buried: false,        // walking in plain sight — no surprise attacks
      hp: 3,                // three bonks — they're packed with sand
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  // SKELETONS — faster than zombies, and those spears have REACH
  skeletons = [];
  for (let i = 0; i < 500 && skeletons.length < 8; i++) {
    const x = noise(i * 71.9 + 8) * lv.worldW;
    const y = noise(i * 23.1 + 8) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 70) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 180) continue;
    skeletons.push({
      x, y,
      skeleton: true,
      hp: 2,
      facing: 1,
      wanderAngle: noise(i * 1.7) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// BUILDING THE ABANDONED CASTLE — ruined halls, a shredded red carpet,
// broken walls, branching passages... and six-eyed things in the dark.
// ---------------------------------------------------------------------
function buildCastle(lv) {
  trees = [];

  // collapsed towers and rubble scattered beyond the walls (scenery)
  let n = 0;
  for (let gx = 150; gx < lv.worldW - 100; gx += 200) {
    for (let gy = 150; gy < lv.worldH - 100; gy += 200) {
      n++;
      if (noise(n * 4.9) < 0.5) continue;
      const x = gx + (noise(n * 3.3) - 0.5) * 80;
      const y = gy + (noise(n * 6.1) - 0.5) * 80;
      if (distToAnyPath(x, y, CASTLE_PATHS) < 170) continue;
      trees.push({ x, y, size: 0.8 + noise(n * 8.7) * 0.4, pillar: true });
    }
  }

  // the BROKEN castle walls — same wall-band trick as the temple, but
  // painted around ALL the passages at once, and ruined: some blocks
  // stand tall, some are crumbled stubs. (Every block still blocks you —
  // the castle is broken, not escapable.)
  for (let gx = 40; gx < lv.worldW - 40; gx += 34) {
    for (let gy = 40; gy < lv.worldH - 40; gy += 34) {
      const d = distToAnyPath(gx, gy, CASTLE_PATHS);
      if (d < 100 || d > 140) continue;
      trees.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true, castle: true,
        broken: noise(gx * 3.1 + gy * 1.7) < 0.4,   // 4 in 10 blocks are crumbled stubs
      });
    }
  }

  // the torn red carpet — pieces of it, anyway — down the MAIN hall only
  tiles = [];
  const main = CASTLE_PATHS[0];
  let tn = 0;
  for (let i = 0; i < main.length - 1; i++) {
    const a = main[i], b = main[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    for (let d = 0; d < segLen; d += 20) {
      tn++;
      const off = (noise(tn * 3.7) - 0.5) * 56;
      const worn = noise(tn * 9.1) < 0.22;          // holes worn right through
      tiles.push({
        x: a.x + ux * d + (-uy) * off,
        y: a.y + uy * d + ux * off,
        size: 12 + noise(tn * 5.3) * 14,
        color: worn ? '#3f3f45'
             : ['#8a2230', '#6e1a24', '#a02a38'][Math.floor(noise(tn * 7.7) * 3)],
      });
    }
  }

  // torches still burning along the main hall (who keeps lighting them?)
  torches = [];
  for (let i = 0; i < main.length - 1; i++) {
    const a = main[i], b = main[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // spooky purple dust motes drifting in the dark
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  pond = { x: -9999, y: -9999, rx: 1, ry: 1, hidden: true };   // no pool here
  stumps = [];
  flowers = [];
  scorches = [];
  creepers = [];
  skeletons = [];

  // BLACK ZOMBIES — six glowing purple eyes, fast, and they take 3 bonks
  zombies = [];
  for (let i = 0; i < 600 && zombies.length < 14; i++) {
    const x = noise(i * 47.3 + 11) * lv.worldW;
    const y = noise(i * 19.7 + 11) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToAnyPath(x, y, CASTLE_PATHS) > 70) continue;
    if (Math.hypot(x - throne.x, y - throne.y) < 180) continue;
    zombies.push({
      x, y,
      zombie: true,
      black: true,          // shadow-dark, six purple eyes
      hp: 3,
      speed: 95,            // faster than any zombie you've met
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  // GIANT BLACK ZOMBIES — nine eyes, spider legs out of the back, huge.
  // Only three exist, lurking deep in the castle. You'll know.
  let giants = 0;
  for (let i = 0; i < 400 && giants < 3; i++) {
    const x = noise(i * 83.9 + 13) * lv.worldW;
    const y = noise(i * 17.3 + 13) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 700) continue;   // deep in the castle only
    if (distToAnyPath(x, y, CASTLE_PATHS) > 70) continue;
    if (Math.hypot(x - throne.x, y - throne.y) < 220) continue;
    giants++;
    zombies.push({
      x, y,
      zombie: true, black: true, giant: true,
      hp: 6,               // six bonks. three with the Golden Sword.
      speed: 60,           // slow. inevitable.
      wanderAngle: noise(i * 2.3) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// BUILDING THE DUNGEON IN THE SKY — bridges over a storm, every monster
// in the game, and the Storm King waiting at the top.
// ---------------------------------------------------------------------
function buildSky(lv) {
  trees = [];          // no trees, no walls — just bridges and open air
  stumps = [];
  flowers = [];
  scorches = [];
  pond = { x: -9999, y: -9999, rx: 1, ry: 1, hidden: true };

  // stone speckles all over the bridges
  tiles = [];
  let tn = 0;
  for (const wp of SKY_PATHS) {
    for (let i = 0; i < wp.length - 1; i++) {
      const a = wp[i], b = wp[i + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
      for (let d = 0; d < segLen; d += 26) {
        tn++;
        const off = (noise(tn * 3.7) - 0.5) * 130;
        tiles.push({
          x: a.x + ux * d + (-uy) * off,
          y: a.y + uy * d + ux * off,
          size: 14 + noise(tn * 5.3) * 12,
          color: ['#565a63', '#4a4e57', '#5f636c'][Math.floor(noise(tn * 7.7) * 3)],
        });
      }
    }
  }

  // lanterns along the main bridge (magic ones — the rain can't touch them)
  torches = [];
  const mainBridge = SKY_PATHS[0];
  for (let i = 0; i < mainBridge.length - 1; i++) {
    const a = mainBridge[i], b = mainBridge[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // storm sparks crackling in the air
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // ---- EVERY CREATURE IN THE GAME LIVES UP HERE ----
  zombies = [];
  let forestZ = 0, sandZ = 0, blackZ = 0, giantZ = 0;
  for (let i = 0; i < 2000; i++) {
    const x = noise(i * 61.3 + 21) * lv.worldW;
    const y = noise(i * 37.9 + 21) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToAnyPath(x, y, SKY_PATHS) > 70) continue;
    if (Math.hypot(x - arena.x, y - arena.y) < 320) continue;
    // deal out one of each kind in turn until every quota is full
    if (forestZ < 5) {
      forestZ++;
      zombies.push({ x, y, zombie: true, hp: 2,
                     wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
    } else if (sandZ < 5) {
      sandZ++;
      zombies.push({ x, y, zombie: true, sand: true, buried: false, hp: 3,
                     wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
    } else if (blackZ < 6) {
      blackZ++;
      zombies.push({ x, y, zombie: true, black: true, hp: 3, speed: 95,
                     wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
    } else if (giantZ < 2 && Math.hypot(x - lv.start.x, y - lv.start.y) > 700) {
      giantZ++;
      zombies.push({ x, y, zombie: true, black: true, giant: true, hp: 6, speed: 60,
                     wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
    } else if (forestZ + sandZ + blackZ >= 16 && giantZ >= 2) {
      break;
    }
  }

  // THE MULTI-TASKER. It does not wander. It waits. And it watches.
  zombies.push({
    x: arena.x, y: arena.y - 20,
    zombie: true, black: true, giant: true, boss: true,
    hp: 24,              // a proper boss fight
    speed: 78,
    wanderAngle: 0,
    lastHitSwing: 0,
    hurtFlash: 0,
  });

  // skeletons on the bridges
  skeletons = [];
  for (let i = 0; i < 600 && skeletons.length < 7; i++) {
    const x = noise(i * 71.9 + 23) * lv.worldW;
    const y = noise(i * 23.1 + 23) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToAnyPath(x, y, SKY_PATHS) > 70) continue;
    if (Math.hypot(x - arena.x, y - arena.y) < 320) continue;
    skeletons.push({ x, y, skeleton: true, hp: 2, facing: 1,
                     wanderAngle: noise(i * 1.7) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }

  // and creepers. on NARROW BRIDGES. you're welcome.
  creepers = [];
  for (let i = 0; i < 600 && creepers.length < 10; i++) {
    const x = noise(i * 57.1 + 25) * lv.worldW;
    const y = noise(i * 33.7 + 25) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToAnyPath(x, y, SKY_PATHS) > 70) continue;
    if (Math.hypot(x - arena.x, y - arena.y) < 320) continue;
    creepers.push({ x, y, creeper: true, hp: 2, fuse: 0,
                    wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// BUILDING THE DIMENSION OF CHIPPY — a wrong-colored forest full of
// fallen logs, sticky webs, panicking geckos... and one very happy axe.
// ---------------------------------------------------------------------
function buildChippy(lv) {
  // strange purple-leafed trees, spread out with room to wander
  trees = [];
  for (let i = 0; i < 90; i++) {
    const x = 80 + noise(i * 3.17 + 31) * (lv.worldW - 160);
    const y = 80 + noise(i * 7.71 + 31) * (lv.worldH - 160);
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 160) continue;
    if (Math.hypot(x - chippyStump.x, y - chippyStump.y) < 180) continue;
    trees.push({ x, y, size: 0.8 + noise(i * 13.3) * 0.6 });
  }
  // a tree wall around the edges of the dimension
  for (let x = 30; x < lv.worldW; x += 70) {
    trees.push({ x: x + noise(x) * 30, y: 25 + noise(x * 2) * 20, size: 1 });
    trees.push({ x: x + noise(x * 3) * 30, y: lv.worldH - 25 - noise(x * 4) * 20, size: 1 });
  }
  for (let y = 30; y < lv.worldH; y += 70) {
    trees.push({ x: 25 + noise(y * 5) * 20, y: y + noise(y * 6) * 30, size: 1 });
    trees.push({ x: lv.worldW - 25 - noise(y * 7) * 20, y: y + noise(y * 8) * 30, size: 1 });
  }

  // FALLEN LOGS everywhere — someone (something?) has been chopping
  // this whole dimension down for a very long time...
  logs = [];
  for (let i = 0; i < 60; i++) {
    const x = 120 + noise(i * 9.13 + 41) * (lv.worldW - 240);
    const y = 120 + noise(i * 5.77 + 41) * (lv.worldH - 240);
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 170) continue;
    if (Math.hypot(x - chippyStump.x, y - chippyStump.y) < 170) continue;
    logs.push({ x, y, log: true, len: 70 + noise(i * 2.9) * 90 });
  }

  // SPIDER WEBS stretched between the wreckage. Sticky. You'll see.
  webs = [];
  for (let i = 0; i < 30; i++) {
    const x = 150 + noise(i * 11.3 + 51) * (lv.worldW - 300);
    const y = 150 + noise(i * 17.9 + 51) * (lv.worldH - 300);
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 170) continue;
    webs.push({ x, y, r: 45 + noise(i * 3.1) * 35 });
  }

  // GECKOS. So many geckos. They live here and they are THRIVING.
  geckos = [];
  for (let i = 0; i < 22; i++) {
    geckos.push({
      x: 100 + noise(i * 23.3 + 61) * (lv.worldW - 200),
      y: 100 + noise(i * 41.7 + 61) * (lv.worldH - 200),
      angle: noise(i * 7.7) * 6.28,
      speed: 30,
      color: ['#5fbf5f', '#e0a23c', '#4cc3c9', '#c96fb0'][Math.floor(noise(i * 5.5) * 4)],
    });
  }

  // glowing flowers, because dimensions get to have those
  flowers = [];
  for (let i = 0; i < 120; i++) {
    flowers.push({
      x: noise(i * 31.7 + 71) * lv.worldW,
      y: noise(i * 77.1 + 71) * lv.worldH,
      kind: Math.floor(noise(i * 9.9) * 3),
    });
  }

  // pink dimension sparks in the air
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

// BUILDING THE AXE TEMPLE — Revenge of Chippy. Wild axes and giant
// geckos guard the halls; Chippy Jr waits in the chamber at the top.
// ---------------------------------------------------------------------
function buildJr(lv) {
  trees = [];

  // sealed wall band around the corridor (the temple trick, purple now)
  for (let gx = 40; gx < lv.worldW - 40; gx += 34) {
    for (let gy = 40; gy < lv.worldH - 40; gy += 34) {
      const d = distToPath(gx, gy, JR_PATH);
      if (d < 100 || d > 140) continue;
      if (Math.hypot(gx - jrChamber.x, gy - jrChamber.y) < 190) continue;
      trees.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true, jr: true,
      });
    }
  }
  // the boss chamber: a ring with one doorway, where the corridor enters
  for (let ang = 0; ang < Math.PI * 2; ang += 0.26) {
    if (Math.abs(ang - Math.PI / 2) < 0.5) continue;   // the doorway (south)
    const wx = jrChamber.x + Math.cos(ang) * 200;
    const wy = jrChamber.y + Math.sin(ang) * 200;
    if (wx < 60 || wy < 60 || wx > lv.worldW - 60 || wy > lv.worldH - 60) continue;
    trees.push({ x: wx, y: wy, size: 1, wall: true, jr: true });
  }

  // dark stone tiles along the corridor
  tiles = [];
  let tn = 0;
  for (let i = 0; i < JR_PATH.length - 1; i++) {
    const a = JR_PATH[i], b = JR_PATH[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    for (let d = 0; d < segLen; d += 24) {
      tn++;
      const off = (noise(tn * 3.7) - 0.5) * 130;
      tiles.push({
        x: a.x + ux * d + (-uy) * off,
        y: a.y + uy * d + ux * off,
        size: 15 + noise(tn * 5.1) * 13,
        color: ['#453e54', '#3a3448', '#524a63'][Math.floor(noise(tn * 7.7) * 3)],
      });
    }
  }

  // torches along the corridor
  torches = [];
  for (let i = 0; i < JR_PATH.length - 1; i++) {
    const a = JR_PATH[i], b = JR_PATH[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // angry red sparks in the air
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // WILD AXES hover in the halls, spinning quietly... until you're close
  miniAxes = [];
  for (let i = 0; i < 500 && miniAxes.length < 14; i++) {
    const x = noise(i * 61.7 + 33) * lv.worldW;
    const y = noise(i * 27.1 + 33) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, JR_PATH) > 60) continue;
    if (Math.hypot(x - jrChamber.x, y - jrChamber.y) < 260) continue;
    miniAxes.push({ x, y, spin: noise(i) * 6 });
  }

  // GIANT GECKOS patrol the corridor
  giantGeckos = [];
  for (let i = 0; i < 500 && giantGeckos.length < 8; i++) {
    const x = noise(i * 43.9 + 35) * lv.worldW;

    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, JR_PATH) > 60) continue;
    if (Math.hypot(x - jrChamber.x, y - jrChamber.y) < 260) continue;
    giantGeckos.push({
      x, y, hp: 3, hurtFlash: 0, lastHitSwing: 0,
      color: ['#5fbf5f', '#e0a23c', '#4cc3c9'][Math.floor(noise(i * 5.5) * 3)],
    });
  }

  // CHIPPY JR — standing dead still in his chamber, waiting
  chippyJr = {
    x: jrChamber.x, y: jrChamber.y,
    hp: 30,
    active: false,
    teleportTimer: 4,    // counts down to the next VANISH
    geckoTimer: 7,       // counts down to the next summoned gecko
    lastHitSwing: 0,
    hurtFlash: 0,
  };

  pond = { x: -9999, y: -9999, rx: 1, ry: 1, hidden: true };
  stumps = []; flowers = []; scorches = []; logs = []; webs = []; geckos = [];
  zombies = []; skeletons = []; creepers = [];

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;

// ---------------------------------------------------------------------
// BUILDING THE ABYSS — the bottom of everything. Every monster. One
// last boss, stitched together from the worst of them.
// ---------------------------------------------------------------------
function buildAbyss(lv) {
  trees = [];   // no walls down here. the void does the walls' job.

  // a spot somewhere on a middle chunk (never the start or boss chunk)
  function spot(seed) {
    const c = ABYSS_CHUNKS[1 + Math.floor(noise(seed) * 6)];
    const ang = noise(seed * 3.3) * 6.28;
    const rr = noise(seed * 7.7) * (c.r - 60);
    return { x: c.x + Math.cos(ang) * rr, y: c.y + Math.sin(ang) * rr };
  }

  // themed rubble tiles on every chunk
  tiles = [];
  let tn = 0;
  for (const c of ABYSS_CHUNKS) {
    for (let i = 0; i < 30; i++) {
      tn++;
      const ang = noise(tn * 3.3) * 6.28;
      const rr = noise(tn * 7.7) * (c.r - 30);
      const palette = c.theme === 'temple' ? ['#8f7c54', '#71736a']
                    : c.theme === 'castle' ? ['#5d5f66', '#8a2230']
                    : c.theme === 'boss'   ? ['#4c4059', '#3a3345']
                    : ['#33333d', '#2a2a33'];
      tiles.push({
        x: c.x + Math.cos(ang) * rr,
        y: c.y + Math.sin(ang) * rr,
        size: 13 + noise(tn * 5.1) * 13,
        color: palette[Math.floor(noise(tn * 9.3) * 2)],
      });
    }
  }

  // a few torches per chunk, still burning after the fall
  torches = [];
  let tc = 0;
  for (const c of ABYSS_CHUNKS) {
    for (let i = 0; i < 3; i++) {
      tc++;
      const ang = noise(tc * 11.7) * 6.28;
      torches.push({
        x: c.x + Math.cos(ang) * (c.r - 45),
        y: c.y + Math.sin(ang) * (c.r - 45),
        torch: true,
      });
    }
  }

  // void motes
  fireflies = [];
  for (let i = 0; i < 60; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // ---- EVERY CREATURE FROM THE WHOLE SAGA ----
  zombies = [];
  for (let i = 0; i < 3; i++) {
    const p = spot(i * 13.1 + 101);
    zombies.push({ x: p.x, y: p.y, zombie: true, hp: 2,
                   wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 3; i++) {
    const p = spot(i * 17.3 + 111);
    zombies.push({ x: p.x, y: p.y, zombie: true, sand: true, buried: false, hp: 3,
                   wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 3; i++) {
    const p = spot(i * 19.7 + 121);
    zombies.push({ x: p.x, y: p.y, zombie: true, black: true, hp: 3, speed: 95,
                   wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 2; i++) {
    const p = spot(i * 23.9 + 131);
    zombies.push({ x: p.x, y: p.y, zombie: true, black: true, giant: true, hp: 6, speed: 60,
                   wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  skeletons = [];
  for (let i = 0; i < 4; i++) {
    const p = spot(i * 29.3 + 141);
    skeletons.push({ x: p.x, y: p.y, skeleton: true, hp: 2, facing: 1,
                     wanderAngle: noise(i * 1.7) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  creepers = [];
  for (let i = 0; i < 5; i++) {
    const p = spot(i * 31.7 + 151);
    creepers.push({ x: p.x, y: p.y, creeper: true, hp: 2, fuse: 0,
                    wanderAngle: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  angryGeckos = [];
  for (let i = 0; i < 6; i++) {
    const p = spot(i * 37.1 + 161);
    angryGeckos.push({ x: p.x, y: p.y,
      color: ['#3f8a3f', '#b8862e', '#37a0a6'][Math.floor(noise(i * 5.5) * 3)] });
  }
  giantGeckos = [];
  for (let i = 0; i < 3; i++) {
    const p = spot(i * 41.3 + 171);
    giantGeckos.push({ x: p.x, y: p.y, hp: 3, hurtFlash: 0, lastHitSwing: 0,

// ---------------------------------------------------------------------
// THE EXPLORER (you!)
// ---------------------------------------------------------------------
const player = {
  x: 0, y: 0,
  radius: 12,          // how much space your body takes up (for bumping)
  speed: 230,          // pixels per second
  facing: 1,           // 1 = facing right, -1 = facing left
  walkTime: 0,         // for the little walking bounce
  moving: false,
  attackTime: 0,       // counts down while the sword is mid-swing
  swingId: 0,          // which swing number we're on (so one swing = one hit per zombie)
  hp: 5,               // hearts left
  maxHp: 5,
  hurtTimer: 0,        // brief "ouch" shield after a zombie gets you
  deathTimer: 0,       // counting down to respawn when you go down
  armor: 0,            // silver armor points — they take hits before hearts do
};

// ---------------------------------------------------------------------
// THE SWORD SWING — 0.25 seconds of glory. You can't start a new swing
// until the old one finishes (no helicopter-sword cheating).
// ---------------------------------------------------------------------
function swingSword() {
  if (screen === 'playing' && !inventoryOpen && player.attackTime <= 0 && player.deathTimer <= 0) {
    player.attackTime = 0.25;
    player.swingId++;
  }
}

function startLevel(i) {
  current = LEVELS[i];
  logs = []; webs = []; geckos = [];   // only Chippy's dimension refills these
  axeBoss = null; chippyJr = null; geckoMan = null; returnBoss = null; abyssBoss = null;
  miniAxes = []; giantGeckos = []; angryGeckos = []; miniBlobs = [];
  if (current.kind === 'chippy') buildChippy(current);
  else if (current.kind === 'jr') buildJr(current);
  else if (current.kind === 'gecko') buildGecko(current);
  else if (current.kind === 'dungeon') buildDungeon(current);
  else if (current.kind === 'abyss') buildAbyss(current);
  else if (current.kind === 'temple') buildTemple(current);
  else if (current.kind === 'castle') buildCastle(current);
  else if (current.kind === 'sky') buildSky(current);
  else buildForest(current);
  player.x = current.start.x;
  player.y = current.start.y;
  gateArmed = false;
  altarDone = false;
  screen = 'playing';
}

// ---------------------------------------------------------------------
// BUMPING INTO THINGS — is this spot blocked?
// ---------------------------------------------------------------------
// r = how chunky the thing trying to walk is (you, a zombie, whatever)
function blocked(x, y, r = player.radius) {
  // edge of the world
  if (x < 20 || y < 20 || x > current.worldW - 20 || y > current.worldH - 20) return true;
  // in the sky, off the edge of a bridge is open air — nothing to stand on
  if (current.kind === 'sky') {
    if (distToAnyPath(x, y, SKY_PATHS) > 92 &&
        Math.hypot(x - arena.x, y - arena.y) > 250) return true;
  }
  // in the Abyss you can stand on chunks and bridges. That's it. The
  // rest is bottomless black, and bottomless black is not a floor.
  if (current.kind === 'abyss') {
    let safe = distToAnyPath(x, y, ABYSS_PATHS) < 70;
    if (!safe) {
      for (const c of ABYSS_CHUNKS) {
        if (Math.hypot(x - c.x, y - c.y) < c.r - 12) { safe = true; break; }
      }
    }
    if (!safe) return true;
  }
  // the pond (explorers hate wet socks; zombies can't swim either)
  if (((x - pond.x) / (pond.rx + r)) ** 2 +
      ((y - pond.y) / (pond.ry + r)) ** 2 < 1) return true;
  // fallen logs — solid wood, waist high, no climbing over
  for (const l of logs) {
    const nearestX = Math.max(l.x - l.len / 2, Math.min(x, l.x + l.len / 2));
    if (Math.hypot(x - nearestX, y - l.y) < r + 11) return true;
  }
  // tree trunks, stone pillars, and temple walls — each blocks differently
  for (const t of trees) {
    const chunk = t.wall ? 21 : t.pillar ? 18 : 13;
    if (Math.hypot(x - t.x, y - t.y) < r + chunk * t.size) return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// CONTROLS — keyboard
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (screen === 'menu') {
    const n = parseInt(e.key) - 1;
    if (n >= 0 && n < LEVELS.length) {
      if (LEVELS[n].unlocked) startLevel(n);
      else {
        lockedText = lockedMessageFor(n);
        lockedMessageTimer = 2;
      }
    }
  } else if (e.key === 'Escape') {
    if (inventoryOpen) inventoryOpen = false;   // Esc closes the bag first...
    else screen = 'menu';                       // ...and only then quits to the menu
  } else if (e.key === ' ') {
    swingSword();            // spacebar = sword!
  } else if (e.key.toLowerCase() === 'e') {
    inventoryOpen = !inventoryOpen;             // E flips the bag open/closed
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------------------------------------------------------------------
// CONTROLS — touch: put your finger anywhere and drag. Your finger
// becomes an invisible joystick.
// ---------------------------------------------------------------------
let stick = null;
addEventListener('touchstart', e => {
  e.preventDefault();
  if (screen === 'menu') {
    const t = e.changedTouches[0];
    tryPickLevel(t.clientX, t.clientY);
    return;
  }
  for (const t of e.changedTouches) {
    // finger on the bag button? Open/close the inventory.
    if (Math.hypot(t.clientX - (innerWidth - 70), t.clientY - (innerHeight - 165)) < 42) {
      inventoryOpen = !inventoryOpen;
    // finger on the sword button (bottom-right)? Swing!
    // Anywhere else becomes the invisible walking joystick.
    } else if (Math.hypot(t.clientX - (innerWidth - 70), t.clientY - (innerHeight - 70)) < 50) {
      swingSword();
    } else if (!stick) {
      stick = { id: t.identifier, startX: t.clientX, startY: t.clientY, x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) { stick.x = t.clientX; stick.y = t.clientY; }
  }
}, { passive: false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) stick = null;
  }
});
addEventListener('touchcancel', () => { stick = null; });

// ---------------------------------------------------------------------
// UPDATE — runs every frame. dt = seconds since last frame, so the game
// runs the same speed on every computer.
// ---------------------------------------------------------------------
let elapsed = 0;   // a clock that counts up forever — powers all the glowing/pulsing

function update(dt) {
  elapsed += dt;
  if (lockedMessageTimer > 0) lockedMessageTimer -= dt;
  if (screen !== 'playing') return;
  if (inventoryOpen) return;   // bag's open — the whole world holds still
  if (victoryTimer > 0) {
    victoryTimer -= dt;                                   // celebrating! world waits
    // beating the temple or castle sends you back to the menu, mission complete
    if (victoryTimer <= 0 && victoryLevel >= 2) screen = 'menu';
    return;
  }

  if (player.attackTime > 0) player.attackTime -= dt;   // swing winds down

  // figure out which way you're trying to go (-1, 0, or 1 each way)
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (stick) {
    dx = Math.max(-1, Math.min(1, (stick.x - stick.startX) / 50));
    dy = Math.max(-1, Math.min(1, (stick.y - stick.startY) / 50));
  }

  // walking diagonally shouldn't be faster than walking straight,
  // so we shrink the arrow back to length 1 if it's longer
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }

  player.moving = len > 0.1 && player.deathTimer <= 0;   // no walking while down!
  if (player.moving) {
    player.walkTime += dt;
    if (dx > 0.1) player.facing = 1;
    if (dx < -0.1) player.facing = -1;

    // spider webs are STICKY — walking through one is slooooow
    let sticky = 1;
    for (const w of webs) {
      if (Math.hypot(player.x - w.x, player.y - w.y) < w.r) { sticky = 0.45; break; }
    }
    // gecko skin armor makes you scurry — 15% faster, gecko style
    const zoom = hasGeckoArmor ? 1.15 : 1;
    const newX = player.x + dx * player.speed * zoom * sticky * dt;
    const newY = player.y + dy * player.speed * zoom * sticky * dt;
    // try x and y separately so you slide around trees instead of sticking
    if (!blocked(newX, player.y)) player.x = newX;
    if (!blocked(player.x, newY)) player.y = newY;
  }

  // ---- GECKOS — harmless, fast, and extremely dramatic ----
  for (const g of geckos) {
    const d = Math.hypot(player.x - g.x, player.y - g.y);
    if (d < 130) {
      // AAAA A GIANT!! run!!!
      g.angle = Math.atan2(g.y - player.y, g.x - player.x) + (noise(g.x + Math.floor(elapsed)) - 0.5);
      g.speed = 210;
    } else {
      g.speed = Math.max(26, g.speed - 260 * dt);   // calming back down
      g.angle += (noise(Math.floor(elapsed * 2) + g.x) - 0.5) * dt * 6;
    }
    const nx = g.x + Math.cos(g.angle) * g.speed * dt;
    const ny = g.y + Math.sin(g.angle) * g.speed * dt;
    if (!blocked(nx, g.y, 4)) g.x = nx; else g.angle += 2.5;
    if (!blocked(g.x, ny, 4)) g.y = ny;
  }

  // ---- CHIPPY HIMSELF (he was evil the WHOLE TIME) ----
  if (axeBoss) {
    const b = axeBoss;
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - b.x, player.y - b.y);

    // the betrayal: get close to the stump and the nice act ENDS
    if (!b.active && distToYou < 260) b.active = true;

    if (b.active && player.deathTimer <= 0) {
      // he comes at you flipping end-over-end, in lunges — fast, then
      // slow, then fast. learn the rhythm and you can dodge him.
      const lunge = 120 + Math.sin(elapsed * 3) * 90;
      const bdx = (player.x - b.x) / Math.max(1, distToYou);
      const bdy = (player.y - b.y) / Math.max(1, distToYou);
      if (!blocked(b.x + bdx * lunge * dt, b.y, 12)) b.x += bdx * lunge * dt;
      if (!blocked(b.x, b.y + bdy * lunge * dt, 12)) b.y += bdy * lunge * dt;

      // SUMMON: mini axes, two at a time
      b.summonTimer -= dt;
      if (b.summonTimer <= 0) {
        b.summonTimer = 5;
        for (let i = 0; i < 2 && miniAxes.length < 6; i++) {
          miniAxes.push({ x: b.x + (i ? 30 : -30), y: b.y, spin: 0 });
          for (let p = 0; p < 6; p++) {
            particles.push({ x: b.x, y: b.y - 10,
              vx: (noise(p * 3.1 + elapsed) - 0.5) * 200,
              vy: (noise(p * 7.3 + elapsed) - 0.8) * 180,
              life: 0.4, color: '#c8ccd4' });
          }
        }
      }
      // SUMMON: a giant gecko
      b.geckoTimer -= dt;
      if (b.geckoTimer <= 0) {
        b.geckoTimer = 9;
        if (giantGeckos.length < 3) {
          giantGeckos.push({
            x: b.x + (noise(elapsed) - 0.5) * 200,
            y: b.y + (noise(elapsed * 2.2) - 0.5) * 200,
            hp: 3, hurtFlash: 0, lastHitSwing: 0,
            color: ['#5fbf5f', '#e0a23c', '#4cc3c9'][Math.floor(noise(elapsed * 3.3) * 3)],
          });
        }
      }

      // his spinning edge catches you
      if (distToYou < 34 && player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        const push = 60 / Math.max(1, distToYou);
        const nx2 = player.x + (player.x - b.x) * push;
        const ny2 = player.y + (player.y - b.y) * push;
        if (!blocked(nx2, player.y)) player.x = nx2;
        if (!blocked(player.x, ny2)) player.y = ny2;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
    }

    // bonk the axe with your sword. this game is incredible.
    if (b.active && player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        distToYou < 60 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      b.hurtFlash = 0.15;
      const push = 30 / Math.max(1, distToYou);
      if (!blocked(b.x + (b.x - player.x) * push, b.y, 12)) b.x += (b.x - player.x) * push;
      if (!blocked(b.x, b.y + (b.y - player.y) * push, 12)) b.y += (b.y - player.y) * push;

      if (b.hp <= 0) {
        // BEATEN — and he instantly switches sides. classic Chippy.
        for (let i = 0; i < 30; i++) {
          particles.push({ x: b.x, y: b.y - 10,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 320,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 280,
            life: 0.7, color: i % 2 ? '#c8ccd4' : '#8a6b3f' });
        }
        axeBoss = null;
        miniAxes = [];
        giantGeckos = [];
        victoryNew = !hasChippy;
        if (!hasChippy) {
          hasChippy = true;
          localStorage.setItem('explorer_chippy', 'yes');
        }
        victoryLevel = 5;
        victoryTimer = 6;
      }
    }
  }

  // ---- MINI AXES — they fly at you, and splinter when they arrive ----
  miniAxes = miniAxes.filter(m => {
    m.spin += dt * 12;
    const d = Math.hypot(player.x - m.x, player.y - m.y);
    // they only give chase once you're close — until then they just hover
    if (d < 320 && player.deathTimer <= 0) {
      m.x += (player.x - m.x) / Math.max(1, d) * 150 * dt;
      m.y += (player.y - m.y) / Math.max(1, d) * 150 * dt;
    }

    // one swat knocks it out of the air
    if (player.attackTime > 0 && d < 50 && (m.x - player.x) * player.facing > -10) {
      for (let p = 0; p < 6; p++) {
        particles.push({ x: m.x, y: m.y,
          vx: (noise(p * 3.7 + elapsed) - 0.5) * 240,
          vy: (noise(p * 6.1 + elapsed) - 0.8) * 200,
          life: 0.4, color: '#c8ccd4' });
      }
      return false;
    }
    // it reached you — costs a heart, splinters on impact
    if (d < 20 && player.deathTimer <= 0) {
      if (player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
      return false;
    }
    return true;
  });

  // ---- GIANT GECKOS — the little ones' very big, very rude cousins ----
  for (const g of giantGeckos) {
    if (g.hurtFlash > 0) g.hurtFlash -= dt;
    const d = Math.hypot(player.x - g.x, player.y - g.y);
    if (d < 320 && player.deathTimer <= 0) {
      g.x += (player.x - g.x) / Math.max(1, d) * 130 * dt;
      g.y += (player.y - g.y) / Math.max(1, d) * 130 * dt;
    }
    if (player.attackTime > 0 && g.lastHitSwing !== player.swingId &&
        d < 60 && (g.x - player.x) * player.facing > -8) {
      g.lastHitSwing = player.swingId;
      g.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      g.hurtFlash = 0.15;
      if (g.hp <= 0) {
        for (let p = 0; p < 12; p++) {
          particles.push({ x: g.x, y: g.y - 8,
            vx: (noise(p * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(p * 7.7 + elapsed) - 0.9) * 200,
            life: 0.5, color: g.color });
        }
        emeralds.push({ x: g.x, y: g.y, born: elapsed });
      }
    }
    if (d < 30 && g.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;
      else player.hp -= 1;
      player.hurtTimer = 1;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  giantGeckos = giantGeckos.filter(g => g.hp > 0);

  // ---- CHIPPY JR — the son. bigger, darker, and he TELEPORTS ----
  if (chippyJr) {
    const b = chippyJr;
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - b.x, player.y - b.y);

    // step into the chamber and the revenge begins
    if (!b.active && distToYou < 300) b.active = true;

    if (b.active && player.deathTimer <= 0) {
      // lunging flight, like his dad taught him
      const lunge = 110 + Math.sin(elapsed * 3) * 80;
      const bdx = (player.x - b.x) / Math.max(1, distToYou);
      const bdy = (player.y - b.y) / Math.max(1, distToYou);
      if (!blocked(b.x + bdx * lunge * dt, b.y, 14)) b.x += bdx * lunge * dt;
      if (!blocked(b.x, b.y + bdy * lunge * dt, 14)) b.y += bdy * lunge * dt;

      // THE TELEPORT — every 4 seconds he vanishes in a burst of red
      // and reappears somewhere around YOU. Never relax.
      b.teleportTimer -= dt;
      if (b.teleportTimer <= 0) {
        b.teleportTimer = 4;
        for (let p = 0; p < 12; p++) {
          particles.push({ x: b.x, y: b.y - 16,
            vx: (noise(p * 3.1 + elapsed) - 0.5) * 260,
            vy: (noise(p * 7.3 + elapsed) - 0.8) * 220,
            life: 0.5, color: '#e03a2f' });
        }
        for (let attempt = 0; attempt < 10; attempt++) {
          const ang = noise(elapsed * 7.7 + attempt) * 6.28;
          const nx = player.x + Math.cos(ang) * 190;
          const ny = player.y + Math.sin(ang) * 190;
          if (!blocked(nx, ny, 14)) { b.x = nx; b.y = ny; break; }
        }
        for (let p = 0; p < 12; p++) {
          particles.push({ x: b.x, y: b.y - 16,
            vx: (noise(p * 4.7 + elapsed) - 0.5) * 260,
            vy: (noise(p * 9.1 + elapsed) - 0.8) * 220,
            life: 0.5, color: '#e03a2f' });
        }
      }

      // SUMMON — giant geckos answer his call
      b.geckoTimer -= dt;
      if (b.geckoTimer <= 0) {
        b.geckoTimer = 7;
        if (giantGeckos.length < 4) {
          giantGeckos.push({
            x: b.x + (noise(elapsed) - 0.5) * 180,
            y: b.y + (noise(elapsed * 2.2) - 0.5) * 180,
            hp: 3, hurtFlash: 0, lastHitSwing: 0,
            color: ['#5fbf5f', '#e0a23c', '#4cc3c9'][Math.floor(noise(elapsed * 3.3) * 3)],
          });
        }
      }

      // his massive edge catches you
      if (distToYou < 40 && player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        const push = 70 / Math.max(1, distToYou);
        const nx2 = player.x + (player.x - b.x) * push;
        const ny2 = player.y + (player.y - b.y) * push;
        if (!blocked(nx2, player.y)) player.x = nx2;
        if (!blocked(player.x, ny2)) player.y = ny2;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
    }

    // your turn
    if (b.active && player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        distToYou < 70 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      b.hurtFlash = 0.15;

      if (b.hp <= 0) {
        // THE REVENGE IS OVER
        for (let i = 0; i < 36; i++) {
          particles.push({ x: b.x, y: b.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 360,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 320,
            life: 0.8, color: i % 2 ? '#1c1c22' : '#e03a2f' });
        }
        for (let e = 0; e < 6; e++) {
          emeralds.push({ x: b.x + (e - 3) * 15, y: b.y, born: elapsed });
        }
        chippyJr = null;
        victoryNew = true;
        victoryLevel = 6;
        victoryTimer = 6;
        hasBeatJr = true;
        localStorage.setItem('explorer_beat_jr', 'yes');
      }
    }
  }

  // ---- ANGRY GECKOS — small, fast, and DONE with being stepped near ----
  for (const a of angryGeckos) {
    const d = Math.hypot(player.x - a.x, player.y - a.y);
    if (d < 340 && player.deathTimer <= 0) {
      a.x += (player.x - a.x) / Math.max(1, d) * 170 * dt;
      a.y += (player.y - a.y) / Math.max(1, d) * 170 * dt;
    }
    // one swat sends them flying
    if (player.attackTime > 0 && d < 50 && (a.x - player.x) * player.facing > -10) {
      a.dead = true;
      for (let p = 0; p < 6; p++) {
        particles.push({ x: a.x, y: a.y,
          vx: (noise(p * 3.7 + elapsed) - 0.5) * 240,
          vy: (noise(p * 6.1 + elapsed) - 0.8) * 200,
          life: 0.4, color: a.color });
      }
    }
    // the bite!
    if (!a.dead && d < 18 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;
      else player.hp -= 1;
      player.hurtTimer = 1;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  angryGeckos = angryGeckos.filter(a => !a.dead);

  // ---- GECKO MAN — he has an axe and a very good reason ----
  if (geckoMan) {
    const b = geckoMan;
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - b.x, player.y - b.y);

    if (!b.active && distToYou < 300) b.active = true;

    if (b.active && player.deathTimer <= 0) {
      // he stalks you at a steady, confident stomp
      const stalk = 115 + Math.sin(elapsed * 2.4) * 45;
      const bdx = (player.x - b.x) / Math.max(1, distToYou);
      const bdy = (player.y - b.y) / Math.max(1, distToYou);
      if (!blocked(b.x + bdx * stalk * dt, b.y, 14)) b.x += bdx * stalk * dt;
      if (!blocked(b.x, b.y + bdy * stalk * dt, 14)) b.y += bdy * stalk * dt;

      // THROW — he hurls a spinning axe across the chamber
      b.throwTimer -= dt;
      if (b.throwTimer <= 0) {
        b.throwTimer = 5;
        if (miniAxes.length < 4) miniAxes.push({ x: b.x, y: b.y - 20, spin: 0 });
      }
      // SUMMON — the uprising answers
      b.summonTimer -= dt;
      if (b.summonTimer <= 0) {
        b.summonTimer = 6;
        for (let i = 0; i < 2 && angryGeckos.length < 10; i++) {
          angryGeckos.push({
            x: b.x + (noise(elapsed + i) - 0.5) * 160,
            y: b.y + (noise(elapsed * 2.2 + i) - 0.5) * 160,
            color: ['#3f8a3f', '#b8862e', '#37a0a6'][Math.floor(noise(elapsed * 3.3 + i) * 3)],
          });
        }
      }

      // his axe swing catches you
      if (distToYou < 42 && player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        const push = 65 / Math.max(1, distToYou);
        const nx2 = player.x + (player.x - b.x) * push;
        const ny2 = player.y + (player.y - b.y) * push;
        if (!blocked(nx2, player.y)) player.x = nx2;
        if (!blocked(player.x, ny2)) player.y = ny2;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
    }

    // your swing
    if (b.active && player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        distToYou < 70 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      b.hurtFlash = 0.15;

      if (b.hp <= 0) {
        // the rise... has set
        for (let i = 0; i < 36; i++) {
          particles.push({ x: b.x, y: b.y - 20,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 360,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 320,
            life: 0.8, color: i % 2 ? '#3f8a3f' : '#8fce8f' });
        }
        for (let e = 0; e < 6; e++) {
          emeralds.push({ x: b.x + (e - 3) * 15, y: b.y, born: elapsed });
        }
        geckoMan = null;
        victoryNew = !hasGeckoArmor;
        if (!hasGeckoArmor) {
          hasGeckoArmor = true;                  // he drops his scales for you
          localStorage.setItem('explorer_gecko_armor', 'yes');
        }
        player.armor = armorMax();               // suit up in fresh gecko skin
        victoryLevel = 7;
        victoryTimer = 6;
        hasBeatGeckoMan = true;
        localStorage.setItem('explorer_beat_geckoman', 'yes');
      }
    }
  }

  // ---- MINI MULTI-TASKERS — small blobs, big appetite ----
  for (const m of miniBlobs) {
    if (m.hurtFlash > 0) m.hurtFlash -= dt;
    const d = Math.hypot(player.x - m.x, player.y - m.y);
    if (d < 340 && player.deathTimer <= 0) {
      m.x += (player.x - m.x) / Math.max(1, d) * 120 * dt;
      m.y += (player.y - m.y) / Math.max(1, d) * 120 * dt;
    }
    if (player.attackTime > 0 && m.lastHitSwing !== player.swingId &&
        d < 55 && (m.x - player.x) * player.facing > -8) {
      m.lastHitSwing = player.swingId;
      m.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      m.hurtFlash = 0.15;
      if (m.hp <= 0) {
        for (let p = 0; p < 10; p++) {
          particles.push({ x: m.x, y: m.y - 6,
            vx: (noise(p * 3.7 + elapsed) - 0.5) * 240,
            vy: (noise(p * 6.1 + elapsed) - 0.8) * 200,
            life: 0.5, color: p % 2 ? '#1a1a20' : '#b06cff' });
        }
        emeralds.push({ x: m.x, y: m.y, born: elapsed });
      }
    }
    if (m.hp > 0 && d < 22 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;
      else player.hp -= 1;
      player.hurtTimer = 1;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  miniBlobs = miniBlobs.filter(m => m.hp > 0);

  // ---- THE MULTI-TASKER, RETURNED — nine eyes and very bad intentions ----
  if (returnBoss) {
    const b = returnBoss;
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - b.x, player.y - b.y);

    if (!b.active && distToYou < 300) b.active = true;

    if (b.active && player.deathTimer <= 0) {
      // it oozes toward you, tentacles first
      const ooze = 95 + Math.sin(elapsed * 2) * 40;
      const bdx = (player.x - b.x) / Math.max(1, distToYou);
      const bdy = (player.y - b.y) / Math.max(1, distToYou);
      if (!blocked(b.x + bdx * ooze * dt, b.y, 16)) b.x += bdx * ooze * dt;
      if (!blocked(b.x, b.y + bdy * ooze * dt, 16)) b.y += bdy * ooze * dt;

      // THE TELEPORT — it learned from Chippy Jr. purple burst, gone.
      b.teleportTimer -= dt;
      if (b.teleportTimer <= 0) {
        b.teleportTimer = 5;
        for (let p = 0; p < 14; p++) {
          particles.push({ x: b.x, y: b.y - 16,
            vx: (noise(p * 3.1 + elapsed) - 0.5) * 280,
            vy: (noise(p * 7.3 + elapsed) - 0.8) * 240,
            life: 0.5, color: '#b06cff' });
        }
        for (let attempt = 0; attempt < 10; attempt++) {
          const ang = noise(elapsed * 7.7 + attempt) * 6.28;
          const nx = player.x + Math.cos(ang) * 200;
          const ny = player.y + Math.sin(ang) * 200;
          if (!blocked(nx, ny, 16)) { b.x = nx; b.y = ny; break; }
        }
        for (let p = 0; p < 14; p++) {
          particles.push({ x: b.x, y: b.y - 16,
            vx: (noise(p * 4.7 + elapsed) - 0.5) * 280,
            vy: (noise(p * 9.1 + elapsed) - 0.8) * 240,
            life: 0.5, color: '#b06cff' });
        }
      }

      // THE SPAWN — it squeezes off a new mini multi-tasker from its goo
      b.spawnTimer -= dt;
      if (b.spawnTimer <= 0) {
        b.spawnTimer = 7;
        if (miniBlobs.length < 5) {
          miniBlobs.push({
            x: b.x + (noise(elapsed) - 0.5) * 120,
            y: b.y + (noise(elapsed * 2.2) - 0.5) * 120,
            hp: 2, hurtFlash: 0, lastHitSwing: 0,
          });
        }
      }

      // tentacle grab — it reaches FAR, but costs 1 heart (armor first)
      if (distToYou < 65 && player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        const push = 90 / Math.max(1, distToYou);
        const nx2 = player.x + (player.x - b.x) * push;
        const ny2 = player.y + (player.y - b.y) * push;
        if (!blocked(nx2, player.y)) player.x = nx2;
        if (!blocked(player.x, ny2)) player.y = ny2;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
    }

    // your swing — end this. again.
    if (b.active && player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        distToYou < 85 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      b.hurtFlash = 0.15;

      if (b.hp <= 0) {
        // NINE EYES CLOSED
        for (let i = 0; i < 44; i++) {
          particles.push({ x: b.x, y: b.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 400,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 360,
            life: 0.9, color: i % 2 ? '#1a1a20' : '#b06cff' });
        }
        for (let e = 0; e < 10; e++) {
          emeralds.push({ x: b.x + (e - 5) * 14, y: b.y, born: elapsed });
        }
        returnBoss = null;
        victoryNew = true;
        victoryLevel = 8;
        victoryTimer = 6;
        hasBeatReturn = true;
        localStorage.setItem('explorer_beat_return', 'yes');
      }
    }
  }

  // ---- THE LAST BOSS — half goo, half zombie, all summons ----
  if (abyssBoss) {
    const b = abyssBoss;
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - b.x, player.y - b.y);

    if (!b.active && distToYou < 320) b.active = true;

    if (b.active && player.deathTimer <= 0) {
      // it lurches toward you, half oozing, half shambling
      const lurch = 90 + Math.sin(elapsed * 2.6) * 45;
      const bdx = (player.x - b.x) / Math.max(1, distToYou);
      const bdy = (player.y - b.y) / Math.max(1, distToYou);
      if (!blocked(b.x + bdx * lurch * dt, b.y, 16)) b.x += bdx * lurch * dt;
      if (!blocked(b.x, b.y + bdy * lurch * dt, 16)) b.y += bdy * lurch * dt;

      // SUMMON ANYTHING — it reaches into every world it has ever touched
      // and pulls something out. You never know what's next.
      b.summonTimer -= dt;
      if (b.summonTimer <= 0) {
        b.summonTimer = 6;
        const pick = Math.floor(noise(elapsed * 9.9) * 9);
        const sx2 = b.x + (noise(elapsed) - 0.5) * 200;
        const sy2 = b.y + (noise(elapsed * 2.2) - 0.5) * 200;
        for (let p = 0; p < 8; p++) {
          particles.push({ x: sx2, y: sy2 - 8,
            vx: (noise(p * 3.1 + elapsed) - 0.5) * 200,
            vy: (noise(p * 7.3 + elapsed) - 0.8) * 180,
            life: 0.5, color: pick < 3 ? '#4a9e4a' : '#b06cff' });
        }
        if (pick === 0 && zombies.length < 8) {
          zombies.push({ x: sx2, y: sy2, zombie: true, hp: 2,
                         wanderAngle: 0, lastHitSwing: 0, hurtFlash: 0 });
        } else if (pick === 1 && zombies.length < 8) {
          zombies.push({ x: sx2, y: sy2, zombie: true, sand: true, buried: false, hp: 3,
                         wanderAngle: 0, lastHitSwing: 0, hurtFlash: 0 });
        } else if (pick === 2 && zombies.length < 8) {
          zombies.push({ x: sx2, y: sy2, zombie: true, black: true, hp: 3, speed: 95,
                         wanderAngle: 0, lastHitSwing: 0, hurtFlash: 0 });
        } else if (pick === 3 && skeletons.length < 6) {
          skeletons.push({ x: sx2, y: sy2, skeleton: true, hp: 2, facing: 1,
                           wanderAngle: 0, lastHitSwing: 0, hurtFlash: 0 });
        } else if (pick === 4 && creepers.length < 6) {
          creepers.push({ x: sx2, y: sy2, creeper: true, hp: 2, fuse: 0,
                          wanderAngle: 0, lastHitSwing: 0, hurtFlash: 0 });
        } else if (pick === 5 && angryGeckos.length < 8) {
          angryGeckos.push({ x: sx2, y: sy2, color: '#3f8a3f' });
        } else if (pick === 6 && giantGeckos.length < 5) {
          giantGeckos.push({ x: sx2, y: sy2, hp: 3, hurtFlash: 0, lastHitSwing: 0,
                             color: '#5fbf5f' });
        } else if (pick === 7 && miniAxes.length < 5) {
          miniAxes.push({ x: sx2, y: sy2, spin: 0 });
        } else if (miniBlobs.length < 5) {
          miniBlobs.push({ x: sx2, y: sy2, hp: 2, hurtFlash: 0, lastHitSwing: 0 });
        }
      }

      // its grab — 1 heart, as the designer decreed
      if (distToYou < 60 && player.hurtTimer <= 0) {
        if (player.armor > 0) player.armor -= 1;
        else player.hp -= 1;
        player.hurtTimer = 1;
        const push = 85 / Math.max(1, distToYou);
        const nx2 = player.x + (player.x - b.x) * push;
        const ny2 = player.y + (player.y - b.y) * push;
        if (!blocked(nx2, player.y)) player.x = nx2;
        if (!blocked(player.x, ny2)) player.y = ny2;
        if (player.hp <= 0) player.deathTimer = 2.5;
      }
    }

    // the last swings of the whole saga
    if (b.active && player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        distToYou < 85 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      b.hurtFlash = 0.15;

      if (b.hp <= 0) {
        // THE BOTTOM OF EVERYTHING IS BEATEN
        for (let i = 0; i < 50; i++) {
          particles.push({ x: b.x, y: b.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 420,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 380,
            life: 1, color: i % 3 === 0 ? '#4a9e4a' : i % 3 === 1 ? '#1a1a20' : '#b06cff' });
        }
        for (let e = 0; e < 12; e++) {
          emeralds.push({ x: b.x + (e - 6) * 13, y: b.y, born: elapsed });
        }
        abyssBoss = null;
        victoryNew = true;
        victoryLevel = 9;
        victoryTimer = 7;
        hasBeatAbyss = true;
        localStorage.setItem('explorer_beat_abyss', 'yes');
      }
    }
  }

  // ---- ZOMBIES ----
  for (const z of zombies) {
    if (z.hurtFlash > 0) z.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - z.x, player.y - z.y);

    // buried sand zombies do NOTHING until you step close... then AMBUSH
    if (z.buried) {
      if (distToYou < 90) {
        z.buried = false;
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: z.x, y: z.y - 6,
            vx: (noise(i * 4.1 + elapsed) - 0.5) * 260,
            vy: (noise(i * 6.3 + elapsed) - 0.9) * 220,
            life: 0.5,
            color: i % 2 ? '#c2a05a' : '#8f7c54',   // flying sand!
          });
        }
      } else {
        continue;   // still hiding — skip the brain entirely
      }
    }

    // THE ZOMBIE BRAIN (it's a very small brain):
    // If you're close, shamble at you. Otherwise wander around aimlessly.
    let zdx, zdy, zombieSpeed;
    if (distToYou < (z.boss ? 340 : 240) && player.deathTimer <= 0) {
      zdx = (player.x - z.x) / distToYou;      // an arrow pointing at YOU
      zdy = (player.y - z.y) / distToYou;
      zombieSpeed = z.speed || 75;             // black zombies override this — they're QUICK
    } else {
      z.wanderAngle += (noise(Math.floor(elapsed) + z.x) - 0.5) * dt * 4;
      zdx = Math.cos(z.wanderAngle);
      zdy = Math.sin(z.wanderAngle);
      zombieSpeed = 22;
    }
    const zx = z.x + zdx * zombieSpeed * dt;
    const zy = z.y + zdy * zombieSpeed * dt;
    const zr = z.giant ? 16 : 10;            // giants are chunkier
    if (!blocked(zx, z.y, zr)) z.x = zx;
    if (!blocked(z.x, zy, zr)) z.y = zy;

    // Did your sword catch it? Must be mid-swing, in reach, on the side
    // you're FACING (no cheating hits behind your back), and not already
    // hit by this same swing.
    if (player.attackTime > 0 && z.lastHitSwing !== player.swingId &&
        distToYou < (z.boss ? 95 : z.giant ? 68 : 55) && (z.x - player.x) * player.facing > -8) {
      z.lastHitSwing = player.swingId;
      z.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;   // Chippy chops HARD
      z.hurtFlash = 0.15;
      // knock it backwards, away from you
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(z.x + (z.x - player.x) * push, z.y, 10)) z.x += (z.x - player.x) * push;
      if (!blocked(z.x, z.y + (z.y - player.y) * push, 10)) z.y += (z.y - player.y) * push;

      if (z.hp <= 0) {
        // POOF! burst into blocky bits and drop the goods
        const bits = z.giant ? 30 : 14;
        for (let i = 0; i < bits; i++) {
          particles.push({
            x: z.x, y: z.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * (z.giant ? 340 : 240),
            vy: (noise(i * 7.7 + elapsed) - 0.9) * (z.giant ? 300 : 220),
            life: 0.6,
            color: z.black ? (i % 2 ? '#26262e' : '#b06cff')
                 : z.sand  ? (i % 2 ? '#cbb06a' : '#a3854a')
                 : (i % 2 ? '#4a9e4a' : '#2e6e8e'),
          });
        }
        // giants guard a whole pile of treasure; the boss guards a HOARD
        const loot = z.boss ? 8 : z.giant ? 3 : 1;
        for (let e = 0; e < loot; e++) {
          emeralds.push({ x: z.x + (e - loot / 2) * 14, y: z.y, born: elapsed });
        }
        if (z.boss) {
          // THE MULTI-TASKER FALLS — the sky is beaten, forever
          victoryNew = true;
          victoryLevel = 4;
          victoryTimer = 6;
          hasBeatSky = true;
          localStorage.setItem('explorer_beat_sky', 'yes');
          LEVELS[4].unlocked = true;       // the Dimension of Chippy opens...
        }
      }
    }

    // Did it get YOU? (hurtTimer = a moment of safety after each hit,
    // so one zombie can't eat all five hearts in one second)
    if (distToYou < (z.boss ? 70 : z.giant ? 42 : 26) && z.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;   // CLANK — the armor takes it!
      else player.hp -= 1;
      player.hurtTimer = 1;
      // shove you away from it
      const push = 50 / Math.max(1, distToYou);
      const nx = player.x + (player.x - z.x) * push;
      const ny = player.y + (player.y - z.y) * push;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  zombies = zombies.filter(z => z.hp > 0);   // sweep up the defeated

  // ---- CREEPERS (temple only) ----
  for (const c of creepers) {
    if (c.hurtFlash > 0) c.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - c.x, player.y - c.y);

    if (c.fuse > 0) {
      // SSSSSS — it's lit! It stands still, swells up, and counts down.
      c.fuse -= dt;
      if (distToYou > 120) {
        c.fuse = 0;                    // you got away — it fizzles out, annoyed
      } else if (c.fuse <= 0) {
        // ---- BOOM ----
        for (let i = 0; i < 30; i++) {
          particles.push({
            x: c.x, y: c.y - 10,
            vx: (noise(i * 3.7 + elapsed) - 0.5) * 420,
            vy: (noise(i * 8.1 + elapsed) - 0.6) * 380,
            life: 0.7,
            color: ['#ff9f43', '#ffd23f', '#7f8c8d', '#4a9e4a'][i % 4],
          });
        }
        scorches.push({ x: c.x, y: c.y });   // permanent burn mark. rude.
        c.hp = 0;
        c.exploded = true;             // exploded creepers destroy their own loot
        if (distToYou < 100 && player.deathTimer <= 0) {
          // an explosion costs 1 heart — armor takes the hit first
          if (player.armor > 0) player.armor -= 1;
          else player.hp -= 1;
          player.hurtTimer = 1;
          // and it LAUNCHES you
          const push = 130 / Math.max(20, distToYou);
          const nx = player.x + (player.x - c.x) * push;
          const ny = player.y + (player.y - c.y) * push;
          if (!blocked(nx, player.y)) player.x = nx;
          if (!blocked(player.x, ny)) player.y = ny;
          if (player.hp <= 0) player.deathTimer = 2.5;
        }
      }
    } else if (distToYou < 60 && player.deathTimer <= 0) {
      c.fuse = 1.1;                    // uh oh. you have 1.1 seconds.
    } else {
      // same tiny brain as a zombie: chase if close, wander if bored
      let cdx, cdy, creeperSpeed;
      if (distToYou < 230 && player.deathTimer <= 0) {
        cdx = (player.x - c.x) / distToYou;
        cdy = (player.y - c.y) / distToYou;
        creeperSpeed = 85;
      } else {
        c.wanderAngle += (noise(Math.floor(elapsed) + c.x) - 0.5) * dt * 4;
        cdx = Math.cos(c.wanderAngle);
        cdy = Math.sin(c.wanderAngle);
        creeperSpeed = 24;
      }
      const cx2 = c.x + cdx * creeperSpeed * dt;
      const cy2 = c.y + cdy * creeperSpeed * dt;
      if (!blocked(cx2, c.y, 10)) c.x = cx2;
      if (!blocked(c.x, cy2, 10)) c.y = cy2;
    }

    // sword bonk — it also knocks the hiss right out of them
    if (player.attackTime > 0 && c.lastHitSwing !== player.swingId &&
        distToYou < 55 && (c.x - player.x) * player.facing > -8 && c.hp > 0) {
      c.lastHitSwing = player.swingId;
      c.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      c.hurtFlash = 0.15;
      c.fuse = 0;                      // interrupted mid-hiss!
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(c.x + (c.x - player.x) * push, c.y, 10)) c.x += (c.x - player.x) * push;
      if (!blocked(c.x, c.y + (c.y - player.y) * push, 10)) c.y += (c.y - player.y) * push;
      if (c.hp <= 0) {
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: c.x, y: c.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220,
            life: 0.6,
            color: i % 2 ? '#3faf3f' : '#2e8b57',
          });
        }
        // a properly defused creeper drops DOUBLE emeralds
        emeralds.push({ x: c.x - 10, y: c.y, born: elapsed });
        emeralds.push({ x: c.x + 10, y: c.y, born: elapsed });
      }
    }
  }
  creepers = creepers.filter(c => c.hp > 0);

  // ---- SKELETONS (temple only) — quick on their feet, long spears ----
  for (const s of skeletons) {
    if (s.hurtFlash > 0) s.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - s.x, player.y - s.y);

    let sdx, sdy, skelSpeed;
    if (distToYou < 260 && player.deathTimer <= 0) {
      sdx = (player.x - s.x) / distToYou;
      sdy = (player.y - s.y) / distToYou;
      skelSpeed = 95;                     // faster than a zombie!
    } else {
      s.wanderAngle += (noise(Math.floor(elapsed) + s.x) - 0.5) * dt * 4;
      sdx = Math.cos(s.wanderAngle);
      sdy = Math.sin(s.wanderAngle);
      skelSpeed = 26;
    }
    if (sdx > 0.1) s.facing = 1;
    if (sdx < -0.1) s.facing = -1;
    const sx2 = s.x + sdx * skelSpeed * dt;
    const sy2 = s.y + sdy * skelSpeed * dt;
    if (!blocked(sx2, s.y, 10)) s.x = sx2;
    if (!blocked(s.x, sy2, 10)) s.y = sy2;

    // sword bonk
    if (player.attackTime > 0 && s.lastHitSwing !== player.swingId &&
        distToYou < 55 && (s.x - player.x) * player.facing > -8) {
      s.lastHitSwing = player.swingId;
      s.hp -= hasChippy ? 3 : hasGoldSword ? 2 : 1;
      s.hurtFlash = 0.15;
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(s.x + (s.x - player.x) * push, s.y, 10)) s.x += (s.x - player.x) * push;
      if (!blocked(s.x, s.y + (s.y - player.y) * push, 10)) s.y += (s.y - player.y) * push;
      if (s.hp <= 0) {
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: s.x, y: s.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220,
            life: 0.6,
            color: i % 2 ? '#e8e8e2' : '#b8b8b0',   // clattering bones
          });
        }
        emeralds.push({ x: s.x, y: s.y, born: elapsed });
      }
    }

    // the spear pokes from 38 away — further than a zombie's 26 grab!
    if (distToYou < 38 && s.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;
      else player.hp -= 1;
      player.hurtTimer = 1;
      const push = 50 / Math.max(1, distToYou);
      const nx = player.x + (player.x - s.x) * push;
      const ny = player.y + (player.y - s.y) * push;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  skeletons = skeletons.filter(s => s.hp > 0);

  if (player.hurtTimer > 0) player.hurtTimer -= dt;

  // Living armor regrows itself. The infection knits a plate back in
  // ~8 seconds; gecko skin does it in 6 — geckos regrow their TAILS,
  // a few scales are nothing.
  if ((hasInfectedArmor || hasGeckoArmor) && player.armor < armorMax() && player.deathTimer <= 0) {
    armorRegenTimer += dt;
    if (armorRegenTimer >= (hasGeckoArmor ? 6 : 8)) {
      armorRegenTimer = 0;
      player.armor += 1;
    }
  } else {
    armorRegenTimer = 0;
  }

  // down for the count → respawn back at camp
  if (player.deathTimer > 0) {
    player.deathTimer -= dt;
    if (player.deathTimer <= 0) {
      player.x = current.start.x;
      player.y = current.start.y;
      player.hp = player.maxHp;
      player.armor = armorMax();   // fresh armor plates too
      // if Chippy beat you, he goes back to his stump and plays innocent
      if (axeBoss) {
        axeBoss.x = chippyStump.x;
        axeBoss.y = chippyStump.y - 20;
        axeBoss.active = false;
        axeBoss.hp = 20;
        miniAxes = [];
        giantGeckos = [];
      }
      // if Chippy JR beat you, he returns to his chamber, fully healed
      if (chippyJr) {
        chippyJr.x = jrChamber.x;
        chippyJr.y = jrChamber.y;
        chippyJr.active = false;
        chippyJr.hp = 30;
      }
      // Gecko Man too — back to his chamber, ready for round two
      if (geckoMan) {
        geckoMan.x = geckoChamber.x;
        geckoMan.y = geckoChamber.y;
        geckoMan.active = false;
        geckoMan.hp = 32;
      }
      // and the returned Multi-Tasker re-forms in its chamber
      if (returnBoss) {
        returnBoss.x = dgChamber.x;
        returnBoss.y = dgChamber.y;
        returnBoss.active = false;
        returnBoss.hp = 40;
      }
      // the half-and-half horror re-forms on its arena chunk
      if (abyssBoss) {
        abyssBoss.x = ABYSS_CHUNKS[7].x;
        abyssBoss.y = ABYSS_CHUNKS[7].y;
        abyssBoss.active = false;
        abyssBoss.hp = 45;
      }
    }
  }

  // ---- THE GATE (forest only) ----
  if (current.kind === 'forest') {
    const gateDist = Math.hypot(player.x - gate.x, player.y - gate.y);
    // the gate only "arms" once you've been properly away from it, so it
    // can't teleport you again the instant you arrive
    if (gateDist > 100) gateArmed = true;
    if (player.deathTimer <= 0 && gateDist < 55) {
      if (!hasArmor) {
        // first time here = Level 1 complete → PLATE ARMOR!
        hasArmor = true;
        player.armor = armorMax();
        localStorage.setItem('explorer_plate_armor', 'yes');   // remembered forever
        LEVELS[1].unlocked = true;                             // the temple opens
        victoryTimer = 5;
        victoryLevel = 1;
        gateArmed = false;
      } else if (gateArmed) {
        startLevel(1);               // through the gate → THE CREEPER TEMPLE
        return;
      }
    }
  }

  // ---- THE GOAL: the gold altar (temple) or the broken throne (castle) ----
  // Reach it = level beaten, every time. Prizes only come the first time.
  const goal = current.kind === 'temple' ? altar
             : current.kind === 'castle' ? throne
             : current.kind === 'chippy' ? chippyStump
             : null;
  if (goal && !altarDone && player.deathTimer <= 0 &&
      Math.hypot(player.x - goal.x, player.y - goal.y) < 70) {
    altarDone = true;
    if (current.kind === 'temple') {
      victoryNew = !hasGoldSword;
      if (!hasGoldSword) {
        hasGoldSword = true;
