  ctx.fillStyle = '#ff9f43';
  ctx.fillRect(x - 4, y - 34 - flick, 9, 9 + flick);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(x - 2, y - 31 - flick, 5, 6 + flick);
}

// ---------------------------------------------------------------------
// A blocky chestplate (for the victory screen and the inventory)
// ---------------------------------------------------------------------
function drawChestplate(cx, cy, s, kind = 'plate') {
  const gecko = kind === 'gecko';
  const infected = kind === true || kind === 'infected';
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  ctx.fillStyle = gecko ? '#3f8a3f' : infected ? '#3a3345' : '#b8c4d0';
  ctx.fillRect(-12, -10, 24, 20);    // chest
  ctx.fillRect(-16, -10, 4, 8);      // left shoulder
  ctx.fillRect(12, -10, 4, 8);       // right shoulder
  ctx.fillStyle = gecko ? '#8fce8f' : infected ? '#7c5cc9' : '#dde6ee';
  ctx.fillRect(-12, -10, 24, 4);     // shine across the top
  ctx.fillStyle = gecko ? '#2f6a2f' : infected ? '#b06cff' : '#8b98a8';
  ctx.fillRect(-2, -6, 4, 14);       // ridge down the middle
  if (infected) {
    ctx.fillRect(-9, -4, 2, 6);      // extra glowing veins
    ctx.fillRect(6, -2, 2, 6);
  }
  if (gecko) {                       // little scales
    ctx.fillRect(-9, -4, 3, 3);
    ctx.fillRect(6, -2, 3, 3);
    ctx.fillRect(-8, 4, 3, 3);
    ctx.fillRect(5, 5, 3, 3);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
// A blocky pixel heart (two squares on top + a diamond below)
// ---------------------------------------------------------------------
function drawHeart(hx, hy, full, color = '#ff4757') {
  ctx.fillStyle = full ? color : 'rgba(255,255,255,0.25)';
  ctx.fillRect(hx, hy, 8, 8);
  ctx.fillRect(hx + 10, hy, 8, 8);
  ctx.save();
  ctx.translate(hx + 9, hy + 10);
  ctx.rotate(Math.PI / 4);
  ctx.fillRect(-6.4, -6.4, 12.8, 12.8);
  ctx.restore();
}

// ---------------------------------------------------------------------
// THE MENU SCREEN
// ---------------------------------------------------------------------
let cards = [];   // filled in each frame so clicks know where the boxes are

function drawMenu() {
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#0d1030';
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 120; i++) {
    ctx.fillStyle = `rgba(255,255,255,${0.3 + noise(i) * 0.7})`;
    ctx.fillRect(Math.floor(noise(i * 3.3) * W), Math.floor(noise(i * 7.7) * H), 2, 2);
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd23f';
  ctx.font = `bold ${Math.min(60, W / 9)}px monospace`;
  ctx.fillText('THE EXPLORER', W / 2, H * 0.25);
  ctx.fillStyle = '#9fb4ff';
  ctx.font = '18px monospace';
  ctx.fillText('choose your level', W / 2, H * 0.25 + 35);

  // lay out the level cards, centered — however many levels there are
  const count = LEVELS.length;
  const cw = Math.min(210, W / (count + 1.5)), ch = cw * 0.75, gap = cw * 0.15;
  const totalW = cw * count + gap * (count - 1);
  cards = [];
  for (let i = 0; i < LEVELS.length; i++) {
    const cx = W / 2 - totalW / 2 + i * (cw + gap);
    const cy = H * 0.42;
    cards.push({ x: cx, y: cy, w: cw, h: ch });
    const lv = LEVELS[i];

    ctx.fillStyle = lv.unlocked ? '#1d4d2b' : '#20233d';
    ctx.fillRect(cx, cy, cw, ch);
    ctx.strokeStyle = lv.unlocked ? '#7ddf8f' : '#3a3f66';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, cy, cw, ch);

    ctx.fillStyle = lv.unlocked ? '#ffffff' : '#666b99';
    ctx.font = `bold ${ch * 0.25}px monospace`;
    ctx.fillText(String(i + 1), cx + cw / 2, cy + ch * 0.35);
    // long names get a smaller font so they still fit on the card
    ctx.font = `${Math.min(ch * 0.14, (cw * 1.55) / lv.name.length)}px monospace`;
    ctx.fillText(lv.name, cx + cw / 2, cy + ch * 0.62);
    ctx.font = `${ch * 0.11}px monospace`;
    ctx.fillText(lv.unlocked ? `press ${i + 1} or tap`
               : i === 1 ? 'beat Level 1 first'
               : i === 2 ? 'beat Level 2 first'
               : i === 3 ? 'beat Level 3 first'
               : i === 4 ? 'beat Level 4 first'
               : i === 5 ? 'beat Level 5 first'
               : i === 6 ? 'beat Level 6 first'
               : i === 7 ? 'beat Level 7 first'
               : i === 8 ? 'beat Level 8 first'
               : 'locked', cx + cw / 2, cy + ch * 0.85);
  }

  if (lockedMessageTimer > 0) {
    ctx.fillStyle = '#ff9f43';
    ctx.font = '18px monospace';
    ctx.fillText(lockedText, W / 2, H * 0.42 + ch + 45);
  }
}

// the right "no you can't" message for each locked level
function lockedMessageFor(i) {
  if (i === 1) return 'Beat Level 1 to open the Creeper Temple!';
  if (i === 2) return 'Beat Level 2 to reach the Abandoned Castle!';
  if (i === 3) return 'Beat Level 3 to reach the Dungeon in the Sky!';
  if (i === 4) return 'Defeat the Multi-Tasker to reach the Dimension of Chippy!';
  if (i === 5) return 'Defeat Chippy in his dimension first!';
  if (i === 6) return 'Defeat Chippy Jr to witness the Rise of the Geckos!';
  if (i === 7) return 'Defeat Gecko Man first... then IT comes back.';
  if (i === 8) return hasBeatReturn
    ? "The Abyss is still being built — tell me what's down there!"
    : 'Defeat the returned Multi-Tasker to reach the Abyss!';
  return "You haven't invented that level yet!";
}

function tryPickLevel(px, py) {
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    if (px > c.x && px < c.x + c.w && py > c.y && py < c.y + c.h) {
      if (LEVELS[i].unlocked) startLevel(i);
      else {
        lockedText = lockedMessageFor(i);
        lockedMessageTimer = 2;
      }
    }
  }
}

addEventListener('click', e => {
  if (screen === 'menu') tryPickLevel(e.clientX, e.clientY);
  else swingSword();           // clicking anywhere in the game swings too
});

// ---------------------------------------------------------------------
// THE GAME LOOP — update, draw, repeat forever, really fast
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  if (screen === 'menu') drawMenu();
  else drawGame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
