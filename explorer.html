<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Explorer</title>
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
// THE EXPLORER — top-down adventure!
//
// You float above the world like a friendly drone, watching your
// explorer walk around a big open forest. Two tricks make it work:
//
// 1. THE CAMERA: the world is way bigger than the screen. Every frame
//    we figure out where the camera is (following you) and slide the
//    whole drawing over, so you stay near the middle of the screen.
//
// 2. DRAW ORDER: things LOWER on the screen get drawn IN FRONT. That's
//    why you can walk behind a tree and peek out from under its leaves.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// make the canvas fill the whole window, even if the window changes size
function fitCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------
// GAME STATE — which screen are we on? 'menu' or 'playing'
// ---------------------------------------------------------------------
let screen = 'menu';
let current = null;            // the level being played
let lockedMessageTimer = 0;
let lockedText = '';           // what the menu says when you poke a locked level
let inventoryOpen = false;     // is the bag open right now?

// Did you ever beat Level 1? The browser remembers this FOREVER, even
// after you close the game — localStorage is a tiny storage box every
// game gets to keep stuff in between visits.
let hasArmor = localStorage.getItem('explorer_plate_armor') === 'yes';
let hasGoldSword = localStorage.getItem('explorer_gold_sword') === 'yes';
let hasInfectedArmor = localStorage.getItem('explorer_infected_armor') === 'yes';
let armorRegenTimer = 0;       // the infection slowly knitting your armor back

// how many armor points can you have? best armor wins.
function armorMax() {
  return hasInfectedArmor ? 4 : hasArmor ? 3 : 0;
}
let victoryTimer = 0;          // counts down the LEVEL COMPLETE celebration
let victoryLevel = 1;          // which level we're celebrating
let victoryNew = false;        // did this win come with a brand-new prize?
let altarDone = false;         // already beaten the altar THIS visit?
let gateArmed = false;         // you must step AWAY from the gate before it teleports you

// ---------------------------------------------------------------------
// A pocket randomness machine: feed it the same number, get the same
// "random-looking" answer every time. That's how the forest looks
// scattered and wild, but every tree stays in its spot forever.
// ---------------------------------------------------------------------
function noise(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

// ---------------------------------------------------------------------
// THE LEVELS
// ---------------------------------------------------------------------
const LEVELS = [
  {
    name: 'The Dark Forest',
    kind: 'forest',
    unlocked: true,
    grass: '#2c4423',          // gloomy, shadowy grass
    worldW: 2000,              // the world in pixels — much bigger than the screen
    worldH: 1500,
    start: { x: 150, y: 1350 },   // the path begins in the bottom-left corner
  },
  {
    name: 'Creeper Temple',
    kind: 'temple',
    unlocked: false,             // opens when you beat Level 1
    grass: '#43453b',            // ancient stone floor
    worldW: 2600,                // WAY bigger now — a real expedition
    worldH: 2600,
    start: { x: 1300, y: 2500 }, // the temple entrance, at the bottom
  },
  {
    name: 'The Abandoned Castle',
    kind: 'castle',
    unlocked: false,             // opens when you beat Level 2
    grass: '#3a3b40',            // cold ruined stone
    worldW: 2400,
    worldH: 2400,
    start: { x: 1200, y: 2300 }, // the shattered front gates
  },
  { name: 'The Dungeon in the Sky', unlocked: false },   // Level 4 — named by Max, not built yet!
];
// prizes you earned on past visits keep their doors open
LEVELS[1].unlocked = hasArmor;
LEVELS[2].unlocked = hasGoldSword;

// Things that live in the current level (filled in by buildForest)
let trees = [];
let flowers = [];
let pond = null;
let fireflies = [];
let stumps = [];
let zombies = [];
let creepers = [];      // sssssss...
let skeletons = [];     // spear patrol, temple only
let torches = [];       // flickering lights along the temple walkway
let scorches = [];      // burn marks left by creeper explosions
let tiles = [];         // sand + stone paving squares on the temple walkway
let emeralds = [];      // dropped treasure waiting to be grabbed
let particles = [];     // flying bits when a monster goes POOF
let emeraldCount = 0;   // your treasure so far

// ---------------------------------------------------------------------
// THE CUT — somebody chopped a trail of trees right through the middle
// of this forest, from the bottom-left corner to a mysterious gate in
// the top-right. These points trace where the chopping went. The trail
// isn't drawn — it's just the empty space where trees AREN'T.
// ---------------------------------------------------------------------
const PATH = [
  { x: 150,  y: 1350 }, { x: 380,  y: 1180 }, { x: 520,  y: 1250 },
  { x: 760,  y: 1100 }, { x: 820,  y: 880 },  { x: 660,  y: 700 },
  { x: 760,  y: 520 },  { x: 1000, y: 600 },  { x: 1220, y: 760 },
  { x: 1450, y: 700 },  { x: 1560, y: 900 },  { x: 1750, y: 820 },
  { x: 1850, y: 560 },  { x: 1780, y: 320 },  { x: 1850, y: 180 },
];
const gate = { x: 1850, y: 180, r: 34 };   // what's waiting at the end...

// How far is this spot from the nearest piece of path? (We use this to
// keep trees from growing in the middle of the trail.)
function distToPath(x, y, path = PATH) {
  let best = 999999;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    // find the closest point on this piece of path, then measure to it
    const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
    best = Math.min(best, Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy)));
  }
  return best;
}

// ---------------------------------------------------------------------
// THE TEMPLE WALKWAY — the grand route from the entrance up to the
// golden altar at the temple's heart.
// ---------------------------------------------------------------------
const TEMPLE_PATH = [
  { x: 1300, y: 2500 }, { x: 1300, y: 2260 }, { x: 1080, y: 2160 },
  { x: 860,  y: 2220 }, { x: 700,  y: 2100 }, { x: 700,  y: 1900 },
  { x: 900,  y: 1800 }, { x: 1150, y: 1850 }, { x: 1400, y: 1780 },
  { x: 1600, y: 1650 }, { x: 1600, y: 1440 }, { x: 1400, y: 1350 },
  { x: 1150, y: 1400 }, { x: 900,  y: 1330 }, { x: 760,  y: 1180 },
  { x: 860,  y: 1020 }, { x: 1100, y: 980 },  { x: 1350, y: 1030 },
  { x: 1580, y: 960 },  { x: 1700, y: 800 },  { x: 1620, y: 620 },
  { x: 1400, y: 560 },  { x: 1160, y: 600 },  { x: 960,  y: 520 },
  { x: 900,  y: 360 },  { x: 1060, y: 260 },  { x: 1300, y: 220 },
];
const altar = { x: 1300, y: 200 };   // the golden altar. the prize.

// ---------------------------------------------------------------------
// THE CASTLE HALLWAYS — this level BRANCHES. The first path is the main
// hall (with the red carpet); the others are side passages that split
// off and rejoin. Multiple ways through!
// ---------------------------------------------------------------------
const CASTLE_PATHS = [
  [ // the main hall — carpet runs along this one
    { x: 1200, y: 2300 }, { x: 1200, y: 2050 }, { x: 1000, y: 1950 },
    { x: 950,  y: 1750 }, { x: 1100, y: 1600 }, { x: 1350, y: 1650 },
    { x: 1550, y: 1550 }, { x: 1550, y: 1330 }, { x: 1350, y: 1230 },
    { x: 1100, y: 1280 }, { x: 900,  y: 1180 }, { x: 850,  y: 980 },
    { x: 1000, y: 850 },  { x: 1250, y: 900 },  { x: 1450, y: 820 },
    { x: 1500, y: 620 },  { x: 1350, y: 480 },  { x: 1150, y: 520 },
    { x: 1000, y: 420 },  { x: 1050, y: 280 },  { x: 1200, y: 220 },
  ],
  [ // west passage — a long sneaky detour
    { x: 1000, y: 1950 }, { x: 720, y: 1850 }, { x: 620, y: 1560 },
    { x: 700,  y: 1240 }, { x: 850, y: 980 },
  ],
  [ // east passage — loops around the far side
    { x: 1550, y: 1330 }, { x: 1800, y: 1250 }, { x: 1850, y: 950 },
    { x: 1600, y: 750 },  { x: 1500, y: 620 },
  ],
  [ // a short secret cut through the middle
    { x: 1100, y: 1280 }, { x: 1050, y: 1000 }, { x: 1000, y: 850 },
  ],
];
const throne = { x: 1200, y: 200 };   // the broken throne. reach it, win.

// smallest distance to ANY of a list of paths
function distToAnyPath(x, y, paths) {
  let best = 999999;
  for (const p of paths) best = Math.min(best, distToPath(x, y, p));
  return best;
}

// ---------------------------------------------------------------------
// BUILDING THE FOREST — scatter trees around the open world.
// No maze! Just clumps and clearings, like real woods.
// ---------------------------------------------------------------------
function buildForest(lv) {
  trees = [];
  flowers = [];
  pond = { x: 1450, y: 450, rx: 160, ry: 100 };   // a little lake

  // trees EVERYWHERE — a properly thick forest. The only easy way
  // through is the trail of chopped-down trees.
  for (let i = 0; i < 380; i++) {
    const x = 60 + noise(i * 3.17) * (lv.worldW - 120);
    const y = 60 + noise(i * 7.71) * (lv.worldH - 120);
    const nearSpawn = Math.hypot(x - lv.start.x, y - lv.start.y) < 60;   // just a tiny pocket to start in
    const inPond = ((x - pond.x) / (pond.rx + 60)) ** 2 + ((y - pond.y) / (pond.ry + 60)) ** 2 < 1;
    const onPath = distToPath(x, y) < 50;          // the cut is NARROW — trees crowd right up to it
    const nearGate = Math.hypot(x - gate.x, y - gate.y) < 110;
    if (nearSpawn || inPond || onPath || nearGate) continue;
    trees.push({ x, y, size: 0.8 + noise(i * 13.3) * 0.6 });
  }

  // a wall of trees around the edge, so the world has a natural border
  for (let x = 30; x < lv.worldW; x += 70) {
    trees.push({ x: x + noise(x) * 30, y: 25 + noise(x * 2) * 20, size: 1 });
    trees.push({ x: x + noise(x * 3) * 30, y: lv.worldH - 25 - noise(x * 4) * 20, size: 1 });
  }
  for (let y = 30; y < lv.worldH; y += 70) {
    trees.push({ x: 25 + noise(y * 5) * 20, y: y + noise(y * 6) * 30, size: 1 });
    trees.push({ x: lv.worldW - 25 - noise(y * 7) * 20, y: y + noise(y * 8) * 30, size: 1 });
  }

  // flowers are just decoration — you can walk right over them
  for (let i = 0; i < 120; i++) {
    flowers.push({
      x: noise(i * 31.7 + 5) * lv.worldW,
      y: noise(i * 77.1 + 5) * lv.worldH,
      kind: Math.floor(noise(i * 9.9) * 3),        // 0, 1, or 2 = different colors
    });
  }

  // stumps — all that's left of the chopped-down trees. We throw 300
  // darts at the map and only keep the ones that land along the trail.
  stumps = [];
  for (let i = 0; i < 300; i++) {
    const x = 100 + noise(i * 91.7) * (lv.worldW - 200);
    const y = 100 + noise(i * 13.9) * (lv.worldH - 200);
    const d = distToPath(x, y);
    const nearSpawn2 = Math.hypot(x - lv.start.x, y - lv.start.y) < 60;
    if (d > 14 && d < 46 && !nearSpawn2) {
      stumps.push({ x, y, size: 0.7 + noise(i * 3.3) * 0.6 });
    }
  }

  // fireflies! drifting little lights that keep the dark forest alive
  fireflies = [];
  for (let i = 0; i < 60; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,      // so they don't all blink together
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // ZOMBIES — they lurk along the trail ahead, Minecraft Dungeons style.
  // Never near your camp, never blocking the gate. 12 of them. Good luck.
  zombies = [];
  for (let i = 0; i < 200 && zombies.length < 12; i++) {
    const x = noise(i * 61.3 + 2) * lv.worldW;
    const y = noise(i * 37.9 + 2) * lv.worldH;
    const farFromCamp = Math.hypot(x - lv.start.x, y - lv.start.y) > 320;
    const onTrail = distToPath(x, y) < 55;
    const awayFromGate = Math.hypot(x - gate.x, y - gate.y) > 130;
    if (farFromCamp && onTrail && awayFromGate) {
      zombies.push({
        x, y,
        zombie: true,                    // tells the drawing code what this is
        hp: 2,                           // two sword bonks each
        wanderAngle: noise(i) * 6.28,    // which way it shambles when bored
        lastHitSwing: 0,                 // so one swing can't hit it twice
        hurtFlash: 0,                    // flashes white when bonked
      });
    }
  }

  creepers = [];
  skeletons = [];
  torches = [];
  scorches = [];
  tiles = [];
  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();   // suit up (if you've earned it)
}

// ---------------------------------------------------------------------
// BUILDING THE CREEPER TEMPLE — ancient stone, torchlight, lava... and
// the quiet green residents nobody invited.
// ---------------------------------------------------------------------
function buildTemple(lv) {
  // rows of stone pillars, but ancient and ruined — some have fallen,
  // and a wide walkway is kept clear from the entrance to the altar
  trees = [];
  let n = 0;
  for (let gx = 140; gx < lv.worldW - 100; gx += 150) {
    for (let gy = 140; gy < lv.worldH - 100; gy += 150) {
      n++;
      if (noise(n * 7.3) < 0.3) continue;             // this one fell down long ago
      const x = gx + (noise(n * 3.1) - 0.5) * 50;
      const y = gy + (noise(n * 5.7) - 0.5) * 50;
      if (distToPath(x, y, TEMPLE_PATH) < 170) continue;   // clear of the trail AND the wall band
      if (Math.hypot(x - altar.x, y - altar.y) < 140) continue;
      if (Math.hypot(x - lv.start.x, y - lv.start.y) < 110) continue;
      if (((x - 1950) / 220) ** 2 + ((y - 1500) / 170) ** 2 < 1) continue;   // lava zone
      trees.push({ x, y, size: 0.9 + noise(n * 9.1) * 0.4, pillar: true });
    }
  }
  // solid pillar walls around the edge of the temple
  for (let x = 40; x < lv.worldW; x += 60) {
    trees.push({ x, y: 35, size: 1.1, pillar: true });
    trees.push({ x, y: lv.worldH - 35, size: 1.1, pillar: true });
  }
  for (let y = 40; y < lv.worldH; y += 60) {
    trees.push({ x: 35, y, size: 1.1, pillar: true });
    trees.push({ x: lv.worldW - 35, y, size: 1.1, pillar: true });
  }

  // WALLS on both sides of the walkway — we march along the path and
  // drop a sandstone block every few steps, one on each side. "Perpendicular"
  // means "sideways from the direction you're walking" — that's how we
  // know where "each side" even is.
  // We check EVERY spot in the world and ask: "are you 100-140 steps from
  // the trail?" If yes → wall block. That paints a solid band of wall that
  // hugs every bend of the path — no corner gaps to slip through.
  for (let gx = 40; gx < lv.worldW - 40; gx += 34) {
    for (let gy = 40; gy < lv.worldH - 40; gy += 34) {
      const d = distToPath(gx, gy, TEMPLE_PATH);
      if (d < 100 || d > 140) continue;
      if (Math.hypot(gx - altar.x, gy - altar.y) < 165) continue;   // chamber has its own walls
      trees.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,   // tiny wobble so the wall
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,   // doesn't look machine-made
        size: 1, wall: true,
      });
    }
  }
  // seal the corridor BEHIND the entrance too — "back" is never a way out
  for (const sideX of [lv.start.x - 105, lv.start.x + 105]) {
    for (let y = lv.start.y; y < lv.worldH - 40; y += 38) {
      trees.push({ x: sideX, y, size: 1, wall: true });
    }
  }
  // the altar chamber: a ring of wall with exactly ONE doorway, where
  // the path comes in from the south
  for (let ang = 0; ang < Math.PI * 2; ang += 0.28) {
    if (Math.abs(ang - Math.PI / 2) < 0.55) continue;   // the doorway
    const wx = altar.x + Math.cos(ang) * 175;
    const wy = altar.y + Math.sin(ang) * 175;
    if (wx < 60 || wy < 60 || wx > lv.worldW - 60 || wy > lv.worldH - 60) continue;
    if (trees.some(t => t.wall && Math.hypot(t.x - wx, t.y - wy) < 26)) continue;
    trees.push({ x: wx, y: wy, size: 1, wall: true });
  }

  // the SAND-AND-STONE PAVING — scatter little square tiles all along
  // the walkway, some sandy, some gray stone, like an old patchwork road
  tiles = [];
  let tn = 0;
  for (let i = 0; i < TEMPLE_PATH.length - 1; i++) {
    const a = TEMPLE_PATH[i], b = TEMPLE_PATH[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    for (let d = 0; d < segLen; d += 24) {
      tn++;
      const off = (noise(tn * 3.7) - 0.5) * 130;      // scatter across the width
      tiles.push({
        x: a.x + ux * d + (-uy) * off,
        y: a.y + uy * d + ux * off,
        size: 16 + noise(tn * 5.1) * 14,
        sand: noise(tn * 8.3) < 0.55,                 // sandy tile or stone tile?
      });
    }
  }

  pond = { x: 1950, y: 1500, rx: 130, ry: 85, lava: true };   // not water. NOT water.
  stumps = [];
  flowers = [];
  scorches = [];

  // torches flank the walkway — a pair at every bend
  torches = [];
  for (let i = 0; i < TEMPLE_PATH.length - 1; i++) {
    const a = TEMPLE_PATH[i], b = TEMPLE_PATH[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // drifting embers instead of fireflies (same idea, temple colors)
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  // CREEPERS. They wait along the walkway. Ssssss.
  creepers = [];
  for (let i = 0; i < 600 && creepers.length < 18; i++) {
    const x = noise(i * 57.1 + 4) * lv.worldW;
    const y = noise(i * 33.7 + 4) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 320) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 70) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 160) continue;
    creepers.push({
      x, y,
      creeper: true,
      hp: 2,
      fuse: 0,                       // when this is ticking, RUN (or bonk it)
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  zombies = [];
  // SAND ZOMBIES — desert-colored and extra tough, patrolling the
  // walkway right out in the open. (They used to hide buried in the
  // sand — flip buried to true to bring the ambushes back!)
  for (let i = 0; i < 500 && zombies.length < 8; i++) {
    const x = noise(i * 43.7 + 6) * lv.worldW;
    const y = noise(i * 29.3 + 6) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 60) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 180) continue;
    zombies.push({
      x, y,
      zombie: true,
      sand: true,           // sandy colors, tougher
      buried: false,        // walking in plain sight — no surprise attacks
      hp: 3,                // three bonks — they're packed with sand
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  // SKELETONS — faster than zombies, and those spears have REACH
  skeletons = [];
  for (let i = 0; i < 500 && skeletons.length < 8; i++) {
    const x = noise(i * 71.9 + 8) * lv.worldW;
    const y = noise(i * 23.1 + 8) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToPath(x, y, TEMPLE_PATH) > 70) continue;
    if (Math.hypot(x - altar.x, y - altar.y) < 180) continue;
    skeletons.push({
      x, y,
      skeleton: true,
      hp: 2,
      facing: 1,
      wanderAngle: noise(i * 1.7) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// BUILDING THE ABANDONED CASTLE — ruined halls, a shredded red carpet,
// broken walls, branching passages... and six-eyed things in the dark.
// ---------------------------------------------------------------------
function buildCastle(lv) {
  trees = [];

  // collapsed towers and rubble scattered beyond the walls (scenery)
  let n = 0;
  for (let gx = 150; gx < lv.worldW - 100; gx += 200) {
    for (let gy = 150; gy < lv.worldH - 100; gy += 200) {
      n++;
      if (noise(n * 4.9) < 0.5) continue;
      const x = gx + (noise(n * 3.3) - 0.5) * 80;
      const y = gy + (noise(n * 6.1) - 0.5) * 80;
      if (distToAnyPath(x, y, CASTLE_PATHS) < 170) continue;
      trees.push({ x, y, size: 0.8 + noise(n * 8.7) * 0.4, pillar: true });
    }
  }

  // the BROKEN castle walls — same wall-band trick as the temple, but
  // painted around ALL the passages at once, and ruined: some blocks
  // stand tall, some are crumbled stubs. (Every block still blocks you —
  // the castle is broken, not escapable.)
  for (let gx = 40; gx < lv.worldW - 40; gx += 34) {
    for (let gy = 40; gy < lv.worldH - 40; gy += 34) {
      const d = distToAnyPath(gx, gy, CASTLE_PATHS);
      if (d < 100 || d > 140) continue;
      trees.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true, castle: true,
        broken: noise(gx * 3.1 + gy * 1.7) < 0.4,   // 4 in 10 blocks are crumbled stubs
      });
    }
  }

  // the torn red carpet — pieces of it, anyway — down the MAIN hall only
  tiles = [];
  const main = CASTLE_PATHS[0];
  let tn = 0;
  for (let i = 0; i < main.length - 1; i++) {
    const a = main[i], b = main[i + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const ux = (b.x - a.x) / segLen, uy = (b.y - a.y) / segLen;
    for (let d = 0; d < segLen; d += 20) {
      tn++;
      const off = (noise(tn * 3.7) - 0.5) * 56;
      const worn = noise(tn * 9.1) < 0.22;          // holes worn right through
      tiles.push({
        x: a.x + ux * d + (-uy) * off,
        y: a.y + uy * d + ux * off,
        size: 12 + noise(tn * 5.3) * 14,
        color: worn ? '#3f3f45'
             : ['#8a2230', '#6e1a24', '#a02a38'][Math.floor(noise(tn * 7.7) * 3)],
      });
    }
  }

  // torches still burning along the main hall (who keeps lighting them?)
  torches = [];
  for (let i = 0; i < main.length - 1; i++) {
    const a = main[i], b = main[i + 1];
    torches.push({ x: (a.x + b.x) / 2 + 70, y: (a.y + b.y) / 2, torch: true });
    torches.push({ x: (a.x + b.x) / 2 - 70, y: (a.y + b.y) / 2, torch: true });
  }

  // spooky purple dust motes drifting in the dark
  fireflies = [];
  for (let i = 0; i < 50; i++) {
    fireflies.push({
      x: noise(i * 21.3 + 9) * lv.worldW,
      y: noise(i * 47.7 + 9) * lv.worldH,
      phase: noise(i * 5.5) * 6.28,
      speed: 0.5 + noise(i * 2.2),
    });
  }

  pond = { x: -9999, y: -9999, rx: 1, ry: 1, hidden: true };   // no pool here
  stumps = [];
  flowers = [];
  scorches = [];
  creepers = [];
  skeletons = [];

  // BLACK ZOMBIES — six glowing purple eyes, fast, and they take 3 bonks
  zombies = [];
  for (let i = 0; i < 600 && zombies.length < 14; i++) {
    const x = noise(i * 47.3 + 11) * lv.worldW;
    const y = noise(i * 19.7 + 11) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 350) continue;
    if (distToAnyPath(x, y, CASTLE_PATHS) > 70) continue;
    if (Math.hypot(x - throne.x, y - throne.y) < 180) continue;
    zombies.push({
      x, y,
      zombie: true,
      black: true,          // shadow-dark, six purple eyes
      hp: 3,
      speed: 95,            // faster than any zombie you've met
      wanderAngle: noise(i) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  // GIANT BLACK ZOMBIES — nine eyes, spider legs out of the back, huge.
  // Only three exist, lurking deep in the castle. You'll know.
  let giants = 0;
  for (let i = 0; i < 400 && giants < 3; i++) {
    const x = noise(i * 83.9 + 13) * lv.worldW;
    const y = noise(i * 17.3 + 13) * lv.worldH;
    if (Math.hypot(x - lv.start.x, y - lv.start.y) < 700) continue;   // deep in the castle only
    if (distToAnyPath(x, y, CASTLE_PATHS) > 70) continue;
    if (Math.hypot(x - throne.x, y - throne.y) < 220) continue;
    giants++;
    zombies.push({
      x, y,
      zombie: true, black: true, giant: true,
      hp: 6,               // six bonks. three with the Golden Sword.
      speed: 60,           // slow. inevitable.
      wanderAngle: noise(i * 2.3) * 6.28,
      lastHitSwing: 0,
      hurtFlash: 0,
    });
  }

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// THE EXPLORER (you!)
// ---------------------------------------------------------------------
const player = {
  x: 0, y: 0,
  radius: 12,          // how much space your body takes up (for bumping)
  speed: 230,          // pixels per second
  facing: 1,           // 1 = facing right, -1 = facing left
  walkTime: 0,         // for the little walking bounce
  moving: false,
  attackTime: 0,       // counts down while the sword is mid-swing
  swingId: 0,          // which swing number we're on (so one swing = one hit per zombie)
  hp: 5,               // hearts left
  maxHp: 5,
  hurtTimer: 0,        // brief "ouch" shield after a zombie gets you
  deathTimer: 0,       // counting down to respawn when you go down
  armor: 0,            // silver armor points — they take hits before hearts do
};

// ---------------------------------------------------------------------
// THE SWORD SWING — 0.25 seconds of glory. You can't start a new swing
// until the old one finishes (no helicopter-sword cheating).
// ---------------------------------------------------------------------
function swingSword() {
  if (screen === 'playing' && !inventoryOpen && player.attackTime <= 0 && player.deathTimer <= 0) {
    player.attackTime = 0.25;
    player.swingId++;
  }
}

function startLevel(i) {
  current = LEVELS[i];
  if (current.kind === 'temple') buildTemple(current);
  else if (current.kind === 'castle') buildCastle(current);
  else buildForest(current);
  player.x = current.start.x;
  player.y = current.start.y;
  gateArmed = false;
  altarDone = false;
  screen = 'playing';
}

// ---------------------------------------------------------------------
// BUMPING INTO THINGS — is this spot blocked?
// ---------------------------------------------------------------------
// r = how chunky the thing trying to walk is (you, a zombie, whatever)
function blocked(x, y, r = player.radius) {
  // edge of the world
  if (x < 20 || y < 20 || x > current.worldW - 20 || y > current.worldH - 20) return true;
  // the pond (explorers hate wet socks; zombies can't swim either)
  if (((x - pond.x) / (pond.rx + r)) ** 2 +
      ((y - pond.y) / (pond.ry + r)) ** 2 < 1) return true;
  // tree trunks, stone pillars, and temple walls — each blocks differently
  for (const t of trees) {
    const chunk = t.wall ? 21 : t.pillar ? 18 : 13;
    if (Math.hypot(x - t.x, y - t.y) < r + chunk * t.size) return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// CONTROLS — keyboard
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (screen === 'menu') {
    const n = parseInt(e.key) - 1;
    if (n >= 0 && n < LEVELS.length) {
      if (LEVELS[n].unlocked) startLevel(n);
      else {
        lockedText = lockedMessageFor(n);
        lockedMessageTimer = 2;
      }
    }
  } else if (e.key === 'Escape') {
    if (inventoryOpen) inventoryOpen = false;   // Esc closes the bag first...
    else screen = 'menu';                       // ...and only then quits to the menu
  } else if (e.key === ' ') {
    swingSword();            // spacebar = sword!
  } else if (e.key.toLowerCase() === 'e') {
    inventoryOpen = !inventoryOpen;             // E flips the bag open/closed
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ---------------------------------------------------------------------
// CONTROLS — touch: put your finger anywhere and drag. Your finger
// becomes an invisible joystick.
// ---------------------------------------------------------------------
let stick = null;
addEventListener('touchstart', e => {
  e.preventDefault();
  if (screen === 'menu') {
    const t = e.changedTouches[0];
    tryPickLevel(t.clientX, t.clientY);
    return;
  }
  for (const t of e.changedTouches) {
    // finger on the bag button? Open/close the inventory.
    if (Math.hypot(t.clientX - (innerWidth - 70), t.clientY - (innerHeight - 165)) < 42) {
      inventoryOpen = !inventoryOpen;
    // finger on the sword button (bottom-right)? Swing!
    // Anywhere else becomes the invisible walking joystick.
    } else if (Math.hypot(t.clientX - (innerWidth - 70), t.clientY - (innerHeight - 70)) < 50) {
      swingSword();
    } else if (!stick) {
      stick = { id: t.identifier, startX: t.clientX, startY: t.clientY, x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) { stick.x = t.clientX; stick.y = t.clientY; }
  }
}, { passive: false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) stick = null;
  }
});
addEventListener('touchcancel', () => { stick = null; });

// ---------------------------------------------------------------------
// UPDATE — runs every frame. dt = seconds since last frame, so the game
// runs the same speed on every computer.
// ---------------------------------------------------------------------
let elapsed = 0;   // a clock that counts up forever — powers all the glowing/pulsing

function update(dt) {
  elapsed += dt;
  if (lockedMessageTimer > 0) lockedMessageTimer -= dt;
  if (screen !== 'playing') return;
  if (inventoryOpen) return;   // bag's open — the whole world holds still
  if (victoryTimer > 0) {
    victoryTimer -= dt;                                   // celebrating! world waits
    // beating the temple or castle sends you back to the menu, mission complete
    if (victoryTimer <= 0 && victoryLevel >= 2) screen = 'menu';
    return;
  }

  if (player.attackTime > 0) player.attackTime -= dt;   // swing winds down

  // figure out which way you're trying to go (-1, 0, or 1 each way)
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (stick) {
    dx = Math.max(-1, Math.min(1, (stick.x - stick.startX) / 50));
    dy = Math.max(-1, Math.min(1, (stick.y - stick.startY) / 50));
  }

  // walking diagonally shouldn't be faster than walking straight,
  // so we shrink the arrow back to length 1 if it's longer
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }

  player.moving = len > 0.1 && player.deathTimer <= 0;   // no walking while down!
  if (player.moving) {
    player.walkTime += dt;
    if (dx > 0.1) player.facing = 1;
    if (dx < -0.1) player.facing = -1;

    const newX = player.x + dx * player.speed * dt;
    const newY = player.y + dy * player.speed * dt;
    // try x and y separately so you slide around trees instead of sticking
    if (!blocked(newX, player.y)) player.x = newX;
    if (!blocked(player.x, newY)) player.y = newY;
  }

  // ---- ZOMBIES ----
  for (const z of zombies) {
    if (z.hurtFlash > 0) z.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - z.x, player.y - z.y);

    // buried sand zombies do NOTHING until you step close... then AMBUSH
    if (z.buried) {
      if (distToYou < 90) {
        z.buried = false;
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: z.x, y: z.y - 6,
            vx: (noise(i * 4.1 + elapsed) - 0.5) * 260,
            vy: (noise(i * 6.3 + elapsed) - 0.9) * 220,
            life: 0.5,
            color: i % 2 ? '#c2a05a' : '#8f7c54',   // flying sand!
          });
        }
      } else {
        continue;   // still hiding — skip the brain entirely
      }
    }

    // THE ZOMBIE BRAIN (it's a very small brain):
    // If you're close, shamble at you. Otherwise wander around aimlessly.
    let zdx, zdy, zombieSpeed;
    if (distToYou < 240 && player.deathTimer <= 0) {
      zdx = (player.x - z.x) / distToYou;      // an arrow pointing at YOU
      zdy = (player.y - z.y) / distToYou;
      zombieSpeed = z.speed || 75;             // black zombies override this — they're QUICK
    } else {
      z.wanderAngle += (noise(Math.floor(elapsed) + z.x) - 0.5) * dt * 4;
      zdx = Math.cos(z.wanderAngle);
      zdy = Math.sin(z.wanderAngle);
      zombieSpeed = 22;
    }
    const zx = z.x + zdx * zombieSpeed * dt;
    const zy = z.y + zdy * zombieSpeed * dt;
    const zr = z.giant ? 16 : 10;            // giants are chunkier
    if (!blocked(zx, z.y, zr)) z.x = zx;
    if (!blocked(z.x, zy, zr)) z.y = zy;

    // Did your sword catch it? Must be mid-swing, in reach, on the side
    // you're FACING (no cheating hits behind your back), and not already
    // hit by this same swing.
    if (player.attackTime > 0 && z.lastHitSwing !== player.swingId &&
        distToYou < (z.giant ? 68 : 55) && (z.x - player.x) * player.facing > -8) {
      z.lastHitSwing = player.swingId;
      z.hp -= hasGoldSword ? 2 : 1;    // golden sword = one-bonk wonders
      z.hurtFlash = 0.15;
      // knock it backwards, away from you
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(z.x + (z.x - player.x) * push, z.y, 10)) z.x += (z.x - player.x) * push;
      if (!blocked(z.x, z.y + (z.y - player.y) * push, 10)) z.y += (z.y - player.y) * push;

      if (z.hp <= 0) {
        // POOF! burst into blocky bits and drop the goods
        const bits = z.giant ? 30 : 14;
        for (let i = 0; i < bits; i++) {
          particles.push({
            x: z.x, y: z.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * (z.giant ? 340 : 240),
            vy: (noise(i * 7.7 + elapsed) - 0.9) * (z.giant ? 300 : 220),
            life: 0.6,
            color: z.black ? (i % 2 ? '#26262e' : '#b06cff')
                 : z.sand  ? (i % 2 ? '#cbb06a' : '#a3854a')
                 : (i % 2 ? '#4a9e4a' : '#2e6e8e'),
          });
        }
        // giants guard a whole pile of treasure
        const loot = z.giant ? 3 : 1;
        for (let e = 0; e < loot; e++) {
          emeralds.push({ x: z.x + (e - 1) * 14, y: z.y, born: elapsed });
        }
      }
    }

    // Did it get YOU? (hurtTimer = a moment of safety after each hit,
    // so one zombie can't eat all five hearts in one second)
    if (distToYou < (z.giant ? 42 : 26) && z.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;   // CLANK — the armor takes it!
      else player.hp -= 1;
      player.hurtTimer = 1;
      // shove you away from it
      const push = 50 / Math.max(1, distToYou);
      const nx = player.x + (player.x - z.x) * push;
      const ny = player.y + (player.y - z.y) * push;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  zombies = zombies.filter(z => z.hp > 0);   // sweep up the defeated

  // ---- CREEPERS (temple only) ----
  for (const c of creepers) {
    if (c.hurtFlash > 0) c.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - c.x, player.y - c.y);

    if (c.fuse > 0) {
      // SSSSSS — it's lit! It stands still, swells up, and counts down.
      c.fuse -= dt;
      if (distToYou > 120) {
        c.fuse = 0;                    // you got away — it fizzles out, annoyed
      } else if (c.fuse <= 0) {
        // ---- BOOM ----
        for (let i = 0; i < 30; i++) {
          particles.push({
            x: c.x, y: c.y - 10,
            vx: (noise(i * 3.7 + elapsed) - 0.5) * 420,
            vy: (noise(i * 8.1 + elapsed) - 0.6) * 380,
            life: 0.7,
            color: ['#ff9f43', '#ffd23f', '#7f8c8d', '#4a9e4a'][i % 4],
          });
        }
        scorches.push({ x: c.x, y: c.y });   // permanent burn mark. rude.
        c.hp = 0;
        c.exploded = true;             // exploded creepers destroy their own loot
        if (distToYou < 100 && player.deathTimer <= 0) {
          // an explosion costs 1 heart — armor takes the hit first
          if (player.armor > 0) player.armor -= 1;
          else player.hp -= 1;
          player.hurtTimer = 1;
          // and it LAUNCHES you
          const push = 130 / Math.max(20, distToYou);
          const nx = player.x + (player.x - c.x) * push;
          const ny = player.y + (player.y - c.y) * push;
          if (!blocked(nx, player.y)) player.x = nx;
          if (!blocked(player.x, ny)) player.y = ny;
          if (player.hp <= 0) player.deathTimer = 2.5;
        }
      }
    } else if (distToYou < 60 && player.deathTimer <= 0) {
      c.fuse = 1.1;                    // uh oh. you have 1.1 seconds.
    } else {
      // same tiny brain as a zombie: chase if close, wander if bored
      let cdx, cdy, creeperSpeed;
      if (distToYou < 230 && player.deathTimer <= 0) {
        cdx = (player.x - c.x) / distToYou;
        cdy = (player.y - c.y) / distToYou;
        creeperSpeed = 85;
      } else {
        c.wanderAngle += (noise(Math.floor(elapsed) + c.x) - 0.5) * dt * 4;
        cdx = Math.cos(c.wanderAngle);
        cdy = Math.sin(c.wanderAngle);
        creeperSpeed = 24;
      }
      const cx2 = c.x + cdx * creeperSpeed * dt;
      const cy2 = c.y + cdy * creeperSpeed * dt;
      if (!blocked(cx2, c.y, 10)) c.x = cx2;
      if (!blocked(c.x, cy2, 10)) c.y = cy2;
    }

    // sword bonk — it also knocks the hiss right out of them
    if (player.attackTime > 0 && c.lastHitSwing !== player.swingId &&
        distToYou < 55 && (c.x - player.x) * player.facing > -8 && c.hp > 0) {
      c.lastHitSwing = player.swingId;
      c.hp -= hasGoldSword ? 2 : 1;
      c.hurtFlash = 0.15;
      c.fuse = 0;                      // interrupted mid-hiss!
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(c.x + (c.x - player.x) * push, c.y, 10)) c.x += (c.x - player.x) * push;
      if (!blocked(c.x, c.y + (c.y - player.y) * push, 10)) c.y += (c.y - player.y) * push;
      if (c.hp <= 0) {
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: c.x, y: c.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220,
            life: 0.6,
            color: i % 2 ? '#3faf3f' : '#2e8b57',
          });
        }
        // a properly defused creeper drops DOUBLE emeralds
        emeralds.push({ x: c.x - 10, y: c.y, born: elapsed });
        emeralds.push({ x: c.x + 10, y: c.y, born: elapsed });
      }
    }
  }
  creepers = creepers.filter(c => c.hp > 0);

  // ---- SKELETONS (temple only) — quick on their feet, long spears ----
  for (const s of skeletons) {
    if (s.hurtFlash > 0) s.hurtFlash -= dt;
    const distToYou = Math.hypot(player.x - s.x, player.y - s.y);

    let sdx, sdy, skelSpeed;
    if (distToYou < 260 && player.deathTimer <= 0) {
      sdx = (player.x - s.x) / distToYou;
      sdy = (player.y - s.y) / distToYou;
      skelSpeed = 95;                     // faster than a zombie!
    } else {
      s.wanderAngle += (noise(Math.floor(elapsed) + s.x) - 0.5) * dt * 4;
      sdx = Math.cos(s.wanderAngle);
      sdy = Math.sin(s.wanderAngle);
      skelSpeed = 26;
    }
    if (sdx > 0.1) s.facing = 1;
    if (sdx < -0.1) s.facing = -1;
    const sx2 = s.x + sdx * skelSpeed * dt;
    const sy2 = s.y + sdy * skelSpeed * dt;
    if (!blocked(sx2, s.y, 10)) s.x = sx2;
    if (!blocked(s.x, sy2, 10)) s.y = sy2;

    // sword bonk
    if (player.attackTime > 0 && s.lastHitSwing !== player.swingId &&
        distToYou < 55 && (s.x - player.x) * player.facing > -8) {
      s.lastHitSwing = player.swingId;
      s.hp -= hasGoldSword ? 2 : 1;
      s.hurtFlash = 0.15;
      const push = 40 / Math.max(1, distToYou);
      if (!blocked(s.x + (s.x - player.x) * push, s.y, 10)) s.x += (s.x - player.x) * push;
      if (!blocked(s.x, s.y + (s.y - player.y) * push, 10)) s.y += (s.y - player.y) * push;
      if (s.hp <= 0) {
        for (let i = 0; i < 14; i++) {
          particles.push({
            x: s.x, y: s.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220,
            life: 0.6,
            color: i % 2 ? '#e8e8e2' : '#b8b8b0',   // clattering bones
          });
        }
        emeralds.push({ x: s.x, y: s.y, born: elapsed });
      }
    }

    // the spear pokes from 38 away — further than a zombie's 26 grab!
    if (distToYou < 38 && s.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor -= 1;
      else player.hp -= 1;
      player.hurtTimer = 1;
      const push = 50 / Math.max(1, distToYou);
      const nx = player.x + (player.x - s.x) * push;
      const ny = player.y + (player.y - s.y) * push;
      if (!blocked(nx, player.y)) player.x = nx;
      if (!blocked(player.x, ny)) player.y = ny;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  skeletons = skeletons.filter(s => s.hp > 0);

  if (player.hurtTimer > 0) player.hurtTimer -= dt;

  // INFECTED ARMOR regrows itself: lose a plate, and about 8 seconds
  // later the infection has knitted a new one. Ew. Also: awesome.
  if (hasInfectedArmor && player.armor < armorMax() && player.deathTimer <= 0) {
    armorRegenTimer += dt;
    if (armorRegenTimer >= 8) {
      armorRegenTimer = 0;
      player.armor += 1;
    }
  } else {
    armorRegenTimer = 0;
  }

  // down for the count → respawn back at camp
  if (player.deathTimer > 0) {
    player.deathTimer -= dt;
    if (player.deathTimer <= 0) {
      player.x = current.start.x;
      player.y = current.start.y;
      player.hp = player.maxHp;
      player.armor = armorMax();   // fresh armor plates too
    }
  }

  // ---- THE GATE (forest only) ----
  if (current.kind === 'forest') {
    const gateDist = Math.hypot(player.x - gate.x, player.y - gate.y);
    // the gate only "arms" once you've been properly away from it, so it
    // can't teleport you again the instant you arrive
    if (gateDist > 100) gateArmed = true;
    if (player.deathTimer <= 0 && gateDist < 55) {
      if (!hasArmor) {
        // first time here = Level 1 complete → PLATE ARMOR!
        hasArmor = true;
        player.armor = armorMax();
        localStorage.setItem('explorer_plate_armor', 'yes');   // remembered forever
        LEVELS[1].unlocked = true;                             // the temple opens
        victoryTimer = 5;
        victoryLevel = 1;
        gateArmed = false;
      } else if (gateArmed) {
        startLevel(1);               // through the gate → THE CREEPER TEMPLE
        return;
      }
    }
  }

  // ---- THE GOAL: the gold altar (temple) or the broken throne (castle) ----
  // Reach it = level beaten, every time. Prizes only come the first time.
  const goal = current.kind === 'temple' ? altar
             : current.kind === 'castle' ? throne
             : null;
  if (goal && !altarDone && player.deathTimer <= 0 &&
      Math.hypot(player.x - goal.x, player.y - goal.y) < 70) {
    altarDone = true;
    if (current.kind === 'temple') {
      victoryNew = !hasGoldSword;
      if (!hasGoldSword) {
        hasGoldSword = true;
        localStorage.setItem('explorer_gold_sword', 'yes');
        LEVELS[2].unlocked = true;               // the castle opens!
      }
      victoryLevel = 2;
    } else {
      victoryNew = !hasInfectedArmor;
      if (!hasInfectedArmor) {
        hasInfectedArmor = true;
        localStorage.setItem('explorer_infected_armor', 'yes');
      }
      player.armor = armorMax();       // the infection suits up immediately
      victoryLevel = 3;
    }
    victoryTimer = 5;
  }

  // walk near an emerald and it hops into your pocket
  emeralds = emeralds.filter(e => {
    if (Math.hypot(player.x - e.x, player.y - e.y) < 30) {
      emeraldCount++;
      return false;                          // false = remove from the list
    }
    return true;
  });

  // zombie bits fly out, fall down, fade away
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;                        // gravity pulls the bits down
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------------------------------------------------------------------
// THE CAMERA — where should the screen's window into the world be?
// It follows you, but stops at the world's edges (no peeking outside).
// ---------------------------------------------------------------------
function getCamera() {
  const cx = Math.max(0, Math.min(current.worldW - canvas.width,  player.x - canvas.width / 2));
  const cy = Math.max(0, Math.min(current.worldH - canvas.height, player.y - canvas.height / 2));
  return { x: cx, y: cy };
}

// ---------------------------------------------------------------------
// DRAWING THE WORLD
// ---------------------------------------------------------------------
function drawGame() {
  const cam = getCamera();

  // grass everywhere
  ctx.fillStyle = current.grass;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // darker grass patches, so the ground isn't one flat color
  ctx.fillStyle = 'rgba(0, 60, 0, 0.10)';
  for (let i = 0; i < 40; i++) {
    const px = noise(i * 51.3) * current.worldW - cam.x;
    const py = noise(i * 17.9) * current.worldH - cam.y;
    ctx.beginPath();
    ctx.ellipse(px, py, 90, 55, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // tree stumps — the leftovers of whoever chopped this trail. Flat on
  // the ground, so you can walk right over them.
  for (const s of stumps) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    if (sx < -20 || sy < -20 || sx > canvas.width + 20 || sy > canvas.height + 20) continue;
    ctx.fillStyle = '#4a3520';       // bark ring
    ctx.beginPath();
    ctx.ellipse(sx, sy, 11 * s.size, 8 * s.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7d603a';       // pale cut wood on top
    ctx.beginPath();
    ctx.ellipse(sx, sy - 1, 8 * s.size, 5.5 * s.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5e4729';     // one tree ring, for style
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(sx, sy - 1, 4 * s.size, 2.5 * s.size, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // emeralds — spinning, bobbing, begging to be collected
  for (const e of emeralds) {
    const ex = e.x - cam.x;
    const ey = e.y - cam.y + Math.sin((elapsed - e.born) * 4) * 3;   // gentle bob
    if (ex < -20 || ey < -20 || ex > canvas.width + 20 || ey > canvas.height + 20) continue;
    ctx.save();
    ctx.translate(ex, ey - 8);
    ctx.rotate(Math.PI / 4);                 // a square on its corner = a gem
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = '#aaffcc';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-6, -6, 12, 12);
    ctx.restore();
  }

  // the walkway floors: sand base in the temple, cracked stone halls in
  // the castle (every branching passage gets floor), then the tiles/carpet
  if (current.kind === 'temple' || current.kind === 'castle') {
    const walkways = current.kind === 'temple' ? [TEMPLE_PATH] : CASTLE_PATHS;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const wp of walkways) {
      ctx.beginPath();
      ctx.moveTo(wp[0].x - cam.x, wp[0].y - cam.y);
      for (const p of wp) ctx.lineTo(p.x - cam.x, p.y - cam.y);
      ctx.strokeStyle = current.kind === 'temple' ? '#6e6248' : '#46474d';
      ctx.lineWidth = 175;
      ctx.stroke();
    }
    if (current.kind === 'castle') {
      // the long red carpet down the main hall (what's left of it)
      const mainHall = CASTLE_PATHS[0];
      ctx.beginPath();
      ctx.moveTo(mainHall[0].x - cam.x, mainHall[0].y - cam.y);
      for (const p of mainHall) ctx.lineTo(p.x - cam.x, p.y - cam.y);
      ctx.strokeStyle = '#4f1119';
      ctx.lineWidth = 64;
      ctx.stroke();
    }
    for (const t2 of tiles) {
      const tx = t2.x - cam.x, ty = t2.y - cam.y;
      if (tx < -40 || ty < -40 || tx > canvas.width + 40 || ty > canvas.height + 40) continue;
      ctx.fillStyle = t2.color || (t2.sand ? '#8f7c54' : '#71736a');
      ctx.fillRect(tx - t2.size / 2, ty - t2.size / 2, t2.size, t2.size);
    }
  }

  // scorch marks from creeper explosions (they never wash off)
  for (const s of scorches) {
    ctx.fillStyle = 'rgba(20, 15, 10, 0.55)';
    ctx.beginPath();
    ctx.ellipse(s.x - cam.x, s.y - cam.y, 34, 22, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // the pool — cold dark water in the forest... bubbling LAVA in the temple
  if (!pond.hidden) {
  ctx.fillStyle = pond.lava ? '#8a2f0e' : '#1d3a55';
  ctx.beginPath();
  ctx.ellipse(pond.x - cam.x, pond.y - cam.y, pond.rx, pond.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pond.lava ? '#e2641e' : '#28516f';
  ctx.beginPath();
  ctx.ellipse(pond.x - cam.x, pond.y - cam.y, pond.rx * 0.8, pond.ry * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  if (pond.lava) {
    // bright blobs slowly swimming around so the lava looks alive
    ctx.fillStyle = '#ff9f43';
    for (let i = 0; i < 7; i++) {
      const bx = pond.x + Math.sin(elapsed * 0.7 + i * 2.1) * pond.rx * 0.55 - cam.x;
      const by = pond.y + Math.cos(elapsed * 0.5 + i * 1.3) * pond.ry * 0.55 - cam.y;
      ctx.fillRect(bx - 5, by - 4, 10, 8);
    }
  }
  }   // (end of the "is there even a pool here?" check)

  // the golden altar at the temple's heart
  if (current.kind === 'temple') {
    const ax = altar.x - cam.x, ay = altar.y - cam.y;
    ctx.fillStyle = '#6e7069';                     // stone steps
    ctx.fillRect(ax - 44, ay - 6, 88, 18);
    ctx.fillStyle = '#e8b93a';                     // the gold block
    ctx.fillRect(ax - 18, ay - 42, 36, 38);
    ctx.fillStyle = '#ffe38a';                     // shine on top
    ctx.fillRect(ax - 18, ay - 42, 36, 9);
    ctx.fillStyle = '#a8801a';                     // shadow at the base
    ctx.fillRect(ax - 18, ay - 10, 36, 6);
  }

  // the broken throne at the end of the castle's main hall
  if (current.kind === 'castle') {
    const tx = throne.x - cam.x, ty = throne.y - cam.y;
    ctx.fillStyle = '#55565c';                     // the dais it sits on
    ctx.fillRect(tx - 50, ty - 4, 100, 20);
    ctx.fillStyle = '#6e7077';                     // tall stone back...
    ctx.fillRect(tx - 22, ty - 58, 44, 54);
    ctx.fillStyle = current.grass;                 // ...with a chunk smashed off
    ctx.fillRect(tx + 6, ty - 58, 16, 14);
    ctx.fillStyle = '#8a8c93';
    ctx.fillRect(tx - 22, ty - 58, 8, 54);         // edge catching the light
    ctx.fillStyle = '#7a1f2b';                     // the dusty royal cushion
    ctx.fillRect(tx - 16, ty - 22, 32, 12);
    ctx.fillStyle = '#4a4b50';                     // crumbled armrests
    ctx.fillRect(tx - 28, ty - 8, 8, 10);
    ctx.fillRect(tx + 20, ty - 8, 8, 10);
  }

  // flowers (flat on the ground, so they go before trees and you)
  for (const f of flowers) {
    const fx = f.x - cam.x, fy = f.y - cam.y;
    if (fx < -10 || fy < -10 || fx > canvas.width + 10 || fy > canvas.height + 10) continue;
    ctx.fillStyle = ['#ffe066', '#ff8fa3', '#ffffff'][f.kind];
    ctx.fillRect(fx, fy, 4, 4);
    ctx.fillStyle = '#2e5c1e';
    ctx.fillRect(fx + 1, fy + 4, 2, 4);
  }

  // ---- THE DRAW-ORDER TRICK ----
  // Put the trees and YOU in one list, sort it by how far down the world
  // each thing is, then draw top-to-bottom. Lower = drawn later = in front.
  const things = [...trees, ...zombies, ...creepers, ...skeletons, ...torches, player];
  things.sort((a, b) => a.y - b.y);
  for (const thing of things) {
    if (thing === player) drawPlayer(cam);
    else if (thing.zombie) drawZombie(thing, cam);
    else if (thing.skeleton) drawSkeleton(thing, cam);
    else if (thing.creeper) drawCreeper(thing, cam);
    else if (thing.torch) drawTorch(thing, cam);
    else if (thing.wall) drawWall(thing, cam);
    else if (thing.pillar) drawPillar(thing, cam);
    else drawTree(thing, cam);
  }

  // flying zombie bits
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);   // fade out as life runs out
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam.x - 3, p.y - cam.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;                              // back to normal, please

  // ---- NIGHT FALLS ----
  // A see-through dark blanket over the whole screen, with a hole cut
  // around the explorer. Clear near you, pitch dark far away.
  const px = player.x - cam.x, py = player.y - cam.y;
  const night = ctx.createRadialGradient(px, py - 14, 40, px, py - 14, 270);
  night.addColorStop(0, 'rgba(5, 5, 20, 0)');       // clear right at you
  night.addColorStop(0.5, 'rgba(5, 5, 20, 0.45)');  // getting murky...
  night.addColorStop(1, 'rgba(5, 5, 20, 0.88)');    // proper gloom
  ctx.fillStyle = night;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // warm lantern light right around the explorer
  const warm = ctx.createRadialGradient(px, py - 14, 5, px, py - 14, 130);
  warm.addColorStop(0, 'rgba(255, 200, 110, 0.20)');
  warm.addColorStop(1, 'rgba(255, 200, 110, 0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // fireflies — drawn AFTER the darkness because they glow through it
  for (const f of fireflies) {
    const fx = f.x + Math.sin(elapsed * f.speed + f.phase) * 40 - cam.x;
    const fy = f.y + Math.cos(elapsed * f.speed * 0.7 + f.phase * 2) * 26 - cam.y;
    if (fx < -10 || fy < -10 || fx > canvas.width + 10 || fy > canvas.height + 10) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(elapsed * 3 + f.phase * 7);
    // green fireflies in the forest, orange embers in the temple,
    // eerie purple dust in the castle
    const glowA = current.kind === 'temple' ? '255, 150, 70'
                : current.kind === 'castle' ? '190, 140, 255'
                : '190, 255, 130';
    const glowB = current.kind === 'temple' ? '255, 210, 140'
                : current.kind === 'castle' ? '220, 190, 255'
                : '220, 255, 170';
    ctx.fillStyle = `rgba(${glowA}, ${0.15 + 0.25 * twinkle})`;
    ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(${glowB}, ${0.4 + 0.5 * twinkle})`;
    ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI * 2); ctx.fill();
  }

  // zombie eyes glow faintly through the dark... consider yourself warned
  // (buried sand zombies don't glow. that's what makes them scary.)
  for (const z of zombies) {
    if (z.buried) continue;
    const zx = z.x - cam.x, zy = z.y - cam.y;
    if (zx < -20 || zy < -20 || zx > canvas.width + 20 || zy > canvas.height + 20) continue;
    if (z.giant) {
      // a 3x3 grid of purple lights drifting toward you in the dark.
      // when you see NINE eyes... that's a giant.
      ctx.fillStyle = 'rgba(176, 108, 255, 0.85)';
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          ctx.fillRect(zx - 8 + col * 7, zy - 47 + row * 7, 3, 3);
        }
      }
    } else if (z.black) {
      // six purple pinpricks floating in the dark. good luck sleeping.
      ctx.fillStyle = 'rgba(176, 108, 255, 0.75)';
      for (let e = 0; e < 3; e++) {
        ctx.fillRect(zx - 5 + e * 4, zy - 27, 2, 2);
        ctx.fillRect(zx - 5 + e * 4, zy - 23, 2, 2);
      }
    } else {
      ctx.fillStyle = 'rgba(150, 255, 150, 0.5)';
      ctx.fillRect(zx - 5, zy - 26, 3, 3);
      ctx.fillRect(zx + 2, zy - 26, 3, 3);
    }
  }

  if (current.kind === 'forest') {
    // the gate at the end of the trail — its glow cuts through the gloom
    const gx = gate.x - cam.x, gy = gate.y - cam.y;
    const pulse = 1 + 0.08 * Math.sin(elapsed * 2.5);
    const glow = ctx.createRadialGradient(gx, gy, 4, gx, gy, 100);
    glow.addColorStop(0, 'rgba(120, 210, 255, 0.4)');
    glow.addColorStop(1, 'rgba(120, 210, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(gx - 110, gy - 110, 220, 220);
    ctx.strokeStyle = '#7fd4ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(gx, gy, gate.r * pulse, 0, Math.PI * 2);
    ctx.stroke();

    // stand close to the gate and it talks to you
    if (Math.hypot(player.x - gate.x, player.y - gate.y) < 90) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#aee3ff';
      ctx.font = '18px monospace';
      if (hasArmor) {
        ctx.fillText('The gate hums, wide awake now...', canvas.width / 2, 60);
        ctx.fillText('Walk through → THE CREEPER TEMPLE', canvas.width / 2, 85);
      } else {
        ctx.fillText('A mysterious gate hums softly...', canvas.width / 2, 60);
      }
    }
  }

  // torchlight pushes back the dark along the walkway (temple AND castle)
  for (const t of torches) {
    const tx = t.x - cam.x, ty = t.y - cam.y - 28;
    if (tx < -120 || ty < -120 || tx > canvas.width + 120 || ty > canvas.height + 120) continue;
    const tg = ctx.createRadialGradient(tx, ty, 3, tx, ty, 95);
    tg.addColorStop(0, 'rgba(255, 170, 80, 0.30)');
    tg.addColorStop(1, 'rgba(255, 170, 80, 0)');
    ctx.fillStyle = tg;
    ctx.fillRect(tx - 95, ty - 95, 190, 190);
  }

  if (current.kind === 'temple') {
    // the lava glows from below
    const lx = pond.x - cam.x, ly = pond.y - cam.y;
    const lg = ctx.createRadialGradient(lx, ly, 10, lx, ly, pond.rx * 1.7);
    lg.addColorStop(0, 'rgba(255, 120, 40, 0.30)');
    lg.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(lx - pond.rx * 1.7, ly - pond.rx * 1.7, pond.rx * 3.4, pond.rx * 3.4);
    // and the altar shines gold
    const ax = altar.x - cam.x, ay = altar.y - cam.y - 20;
    const ag = ctx.createRadialGradient(ax, ay, 5, ax, ay, 130);
    ag.addColorStop(0, 'rgba(255, 215, 90, 0.35)');
    ag.addColorStop(1, 'rgba(255, 215, 90, 0)');
    ctx.fillStyle = ag;
    ctx.fillRect(ax - 130, ay - 130, 260, 260);
  }

  if (current.kind === 'castle') {
    // a cold purple shimmer hangs over the broken throne
    const thx = throne.x - cam.x, thy = throne.y - cam.y - 25;
    const thg = ctx.createRadialGradient(thx, thy, 5, thx, thy, 130);
    thg.addColorStop(0, 'rgba(190, 140, 255, 0.28)');
    thg.addColorStop(1, 'rgba(190, 140, 255, 0)');
    ctx.fillStyle = thg;
    ctx.fillRect(thx - 130, thy - 130, 260, 260);
  }

  // sword button, only on touch screens (phones/tablets)
  if (navigator.maxTouchPoints > 0) {
    const bx = canvas.width - 70, by = canvas.height - 70;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(bx, by, 42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⚔', bx, by + 10);
  }

  // ---- HUD (the stuff glued to the screen, not the world) ----
  // hearts, top-left
  for (let i = 0; i < player.maxHp; i++) {
    drawHeart(14 + i * 26, 14, i < player.hp);
  }
  // armor points line up after the hearts — silver plate, or glowing
  // purple once the infection has it
  for (let i = 0; i < armorMax(); i++) {
    drawHeart(22 + (player.maxHp + i) * 26, 14, i < player.armor,
              hasInfectedArmor ? '#a86cf0' : '#b8c4d0');
  }
  // emerald counter under the hearts
  ctx.save();
  ctx.translate(24, 52);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.fillStyle = '#bfffdd';
  ctx.font = '18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('x ' + emeraldCount, 40, 58);

  // red flash right when a zombie gets you
  if (player.hurtTimer > 0.7) {
    ctx.fillStyle = `rgba(255, 40, 40, ${(player.hurtTimer - 0.7) * 0.8})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // down! the respawn screen
  if (player.deathTimer > 0) {
    ctx.fillStyle = 'rgba(40, 0, 0, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdddd';
    ctx.font = 'bold 34px monospace';
    ctx.fillText(current.kind === 'temple' ? 'The temple got you!'
               : current.kind === 'castle' ? 'The castle got you!'
               : 'The zombies got you!',
                 canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '18px monospace';
    ctx.fillText('Respawning at camp...', canvas.width / 2, canvas.height / 2 + 24);
  }

  // bag button, only on touch screens
  if (navigator.maxTouchPoints > 0) {
    const bx = canvas.width - 70, by = canvas.height - 165;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎒', bx, by + 9);
  }

  // little helper text
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Space = sword   E = bag   Esc = levels', canvas.width - 10, canvas.height - 12);

  // ---- LEVEL COMPLETE! the golden celebration ----
  if (victoryTimer > 0) {
    ctx.fillStyle = 'rgba(10, 25, 12, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 40px monospace';
    ctx.fillText(`LEVEL ${victoryLevel} COMPLETE!`, canvas.width / 2, canvas.height / 2 - 60);
    if (victoryLevel === 3) {
      drawChestplate(canvas.width / 2, canvas.height / 2 + 4, 2.4, true);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(victoryNew ? 'You found: INFECTED ARMOR' : 'CASTLE CONQUERED!',
                   canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#d8c2ff';
      ctx.font = '16px monospace';
      ctx.fillText(victoryNew ? 'Four armor points — and the infection REGROWS them on its own'
                              : 'The Infected Armor is already yours!',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 1) {
      drawChestplate(canvas.width / 2, canvas.height / 2 + 4, 2.4);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('You found: PLATE ARMOR', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#bfd4e8';
      ctx.font = '16px monospace';
      ctx.fillText('3 armor points — they take the hits before your hearts do',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else {
      // the golden sword, displayed big and proud
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 4);
      ctx.rotate(-Math.PI / 4);
      ctx.scale(2.4, 2.4);
      ctx.fillStyle = '#5b3b1e'; ctx.fillRect(-14, -2, 7, 4);
      ctx.fillStyle = '#c9a83c'; ctx.fillRect(-8, -5, 3, 10);
      ctx.fillStyle = '#f2c94c'; ctx.fillRect(-5, -2, 17, 4);
      ctx.fillStyle = '#fff3b8'; ctx.fillRect(-5, -2, 17, 1.5);
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(victoryNew ? 'You found: THE GOLDEN SWORD' : 'TEMPLE CONQUERED!',
                   canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#bfd4e8';
      ctx.font = '16px monospace';
      ctx.fillText(victoryNew ? 'One bonk and monsters go POOF'
                              : 'The Golden Sword is already yours — back to the menu!',
                   canvas.width / 2, canvas.height / 2 + 90);
    }
  }

  // the bag goes on top of everything
  if (inventoryOpen) drawInventory();
}

// ---------------------------------------------------------------------
// THE INVENTORY — a grid of slots, Minecraft style. Most are empty for
// now... which is really a to-do list for future treasure.
// ---------------------------------------------------------------------
function drawInventory() {
  const W = canvas.width, H = canvas.height;

  // dim the world behind the bag
  ctx.fillStyle = 'rgba(8, 8, 22, 0.75)';
  ctx.fillRect(0, 0, W, H);

  // the panel
  const pw = Math.min(460, W - 30), ph = 300;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.fillStyle = '#23283e';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#5a6390';
  ctx.lineWidth = 3;
  ctx.strokeRect(px, py, pw, ph);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('INVENTORY', W / 2, py + 38);

  // a 4x2 grid of slots
  const cols = 4, rows = 2, slot = Math.min(78, (pw - 60) / cols), gap = 12;
  const gridW = cols * slot + (cols - 1) * gap;
  const startX = W / 2 - gridW / 2, startY = py + 62;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const sx = startX + c * (slot + gap), sy = startY + r * (slot + gap);
      ctx.fillStyle = '#161a2b';
      ctx.fillRect(sx, sy, slot, slot);
      ctx.strokeStyle = '#3a4162';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, sy, slot, slot);
    }
  }

  // SLOT 1: the trusty sword (drawn big and tilted, like it's on display)
  ctx.save();
  ctx.translate(startX + slot / 2, startY + slot / 2);
  ctx.rotate(-Math.PI / 4);
  ctx.scale(1.8, 1.8);
  ctx.fillStyle = '#5b3b1e'; ctx.fillRect(-14, -2, 7, 4);     // handle
  ctx.fillStyle = '#c9a83c'; ctx.fillRect(-8, -5, 3, 10);     // crossguard
  ctx.fillStyle = hasGoldSword ? '#f2c94c' : '#dbe4ee'; ctx.fillRect(-5, -2, 17, 4);     // blade
  ctx.fillStyle = hasGoldSword ? '#fff3b8' : '#ffffff'; ctx.fillRect(-5, -2, 17, 1.5);   // shiny edge
  ctx.restore();
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '13px monospace';
  ctx.fillText(hasGoldSword ? 'Golden Sword' : 'Sword', startX + slot / 2, startY + slot + 16);

  // SLOT 2: emeralds, with how many you've got
  const ex = startX + slot + gap + slot / 2, ey = startY + slot / 2;
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(-11, -11, 22, 22);
  ctx.strokeStyle = '#aaffcc';
  ctx.lineWidth = 2;
  ctx.strokeRect(-11, -11, 22, 22);
  ctx.restore();
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '13px monospace';
  ctx.fillText('Emeralds x ' + emeraldCount, ex, startY + slot + 16);

  // SLOT 3: your armor — plate, or the infected upgrade
  if (hasArmor || hasInfectedArmor) {
    const ax = startX + 2 * (slot + gap) + slot / 2;
    drawChestplate(ax, startY + slot / 2, 1.6, hasInfectedArmor);
    ctx.fillStyle = '#cdd6f4';
    ctx.font = '13px monospace';
    ctx.fillText(hasInfectedArmor ? 'Infected Armor' : 'Plate Armor', ax, startY + slot + 16);
  }

  ctx.fillStyle = '#8890b8';
  ctx.font = '14px monospace';
  ctx.fillText('(the empty slots are waiting for future treasure...)', W / 2, py + ph - 40);
  ctx.fillText('E to close', W / 2, py + ph - 18);
}

function drawTree(t, cam) {
  const x = t.x - cam.x, y = t.y - cam.y;
  if (x < -60 || y < -80 || x > canvas.width + 60 || y > canvas.height + 80) return;

  // shadow on the grass
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.beginPath();
  ctx.ellipse(x + 6, y + 5, 24 * t.size, 10 * t.size, 0, 0, Math.PI * 2);
  ctx.fill();

  // trunk
  ctx.fillStyle = '#3f2a15';
  ctx.fillRect(x - 5 * t.size, y - 18 * t.size, 10 * t.size, 20 * t.size);

  // blocky leaf top — every tree gets its own shade of gloomy green
  const g = 55 + noise(t.x * 0.13 + t.y) * 35;
  ctx.fillStyle = `rgb(22, ${Math.floor(g)}, 30)`;
  ctx.fillRect(x - 24 * t.size, y - 58 * t.size, 48 * t.size, 44 * t.size);
  // a faint square of moonlight on the leaves
  ctx.fillStyle = 'rgba(200,220,255,0.10)';
  ctx.fillRect(x - 18 * t.size, y - 52 * t.size, 16 * t.size, 12 * t.size);
}

function drawPlayer(cam) {
  const x = player.x - cam.x, y = player.y - cam.y;
  // a tiny hop while walking — this one line is the whole "walk animation"
  const bob = player.moving ? Math.abs(Math.sin(player.walkTime * 10)) * 4 : 0;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // body — regular shirt, gleaming plate armor... or the INFECTED armor,
  // dark and veined with purple glow
  ctx.fillStyle = hasInfectedArmor ? '#3a3345' : hasArmor ? '#b8c4d0' : '#c98a3d';
  ctx.fillRect(x - 8, y - 14 - bob, 16, 16);
  if (hasInfectedArmor) {
    ctx.fillStyle = '#7c5cc9';                 // glowing shoulder plate
    ctx.fillRect(x - 8, y - 14 - bob, 16, 3);
    ctx.fillStyle = '#b06cff';                 // the infection's veins
    ctx.fillRect(x - 1, y - 11 - bob, 3, 12);
    ctx.fillRect(x - 6, y - 8 - bob, 2, 5);
    ctx.fillRect(x + 4, y - 6 - bob, 2, 5);
  } else if (hasArmor) {
    ctx.fillStyle = '#dde6ee';                 // shine across the shoulders
    ctx.fillRect(x - 8, y - 14 - bob, 16, 3);
    ctx.fillStyle = '#8b98a8';                 // ridge down the middle
    ctx.fillRect(x - 1, y - 11 - bob, 3, 12);
  }

  // square head
  ctx.fillStyle = '#f2c79b';
  ctx.fillRect(x - 7, y - 30 - bob, 14, 14);

  // explorer hat: flat brim + flat top
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(x - 11, y - 30 - bob, 22, 4);
  ctx.fillRect(x - 7, y - 36 - bob, 14, 7);

  // a square eye on whichever side you're facing
  ctx.fillStyle = '#222';
  ctx.fillRect(x + 3 * player.facing, y - 25 - bob, 3, 3);

  // ---- THE SWORD ----
  // progress goes 0 -> 1 during a swing. The blade sweeps a big arc.
  const swinging = player.attackTime > 0;
  const progress = swinging ? 1 - player.attackTime / 0.25 : 0;

  ctx.save();                                    // remember normal drawing
  ctx.translate(x + 9 * player.facing, y - 8 - bob);  // move pen to your hand
  if (player.facing === -1) ctx.scale(-1, 1);    // facing left? mirror everything
  // resting angle points the blade down; swinging sweeps it up-and-over
  ctx.rotate(swinging ? (-1.3 + 2.6 * progress) : 1.0);

  ctx.fillStyle = '#5b3b1e'; ctx.fillRect(0, -2, 7, 4);      // handle
  ctx.fillStyle = '#c9a83c'; ctx.fillRect(6, -5, 3, 10);     // crossguard
  ctx.fillStyle = hasGoldSword ? '#f2c94c' : '#dbe4ee'; ctx.fillRect(9, -2, 17, 4);     // blade
  ctx.fillStyle = hasGoldSword ? '#fff3b8' : '#ffffff'; ctx.fillRect(9, -2, 17, 1.5);   // shiny edge

  // the whoosh trail, fading out as the swing finishes
  if (swinging) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - progress)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 26, -1.3, -1.3 + 2.6 * progress);
    ctx.stroke();
  }
  ctx.restore();                                 // put the pen back to normal
}

// ---------------------------------------------------------------------
// A ZOMBIE — blocky green head, ragged shirt, grabby little arms
// ---------------------------------------------------------------------
function drawZombie(z, cam) {
  const x = z.x - cam.x, y = z.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;

  // a buried sand zombie is just... a suspicious lump in the walkway
  if (z.buried) {
    const breathe = Math.sin(elapsed * 2 + z.x) * 1.5;   // it's ever so slightly moving
    ctx.fillStyle = '#8f7c54';
    ctx.beginPath();
    ctx.ellipse(x, y, 15, 7 + breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a3854a';
    ctx.beginPath();
    ctx.ellipse(x - 2, y - 2, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  // ---- THE GIANT: nine eyes, spider legs, zero manners ----
  if (z.giant) {
    const stomp = Math.abs(Math.sin(elapsed * 4 + z.x)) * 4;   // heavy stomps
    const flash = z.hurtFlash > 0;

    // spider legs FIRST, so they come out from BEHIND the body
    ctx.strokeStyle = '#141418';
    ctx.lineWidth = 3;
    for (let leg = 0; leg < 4; leg++) {
      for (const side of [-1, 1]) {
        const wiggle = Math.sin(elapsed * 6 + leg * 1.7 + z.x) * 4;   // skitter skitter
        const spread = 14 + leg * 9;
        ctx.beginPath();
        ctx.moveTo(x + 6 * side, y - 38 - stomp);                   // out of the back
        ctx.lineTo(x + spread * side, y - 52 - leg * 3 + wiggle);   // up to the knee
        ctx.lineTo(x + (spread + 12) * side, y - 20 + wiggle);      // down to a point
        ctx.stroke();
      }
    }

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 10, 20, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = flash ? '#ffffff' : '#26262e';   // huge ragged body
    ctx.fillRect(x - 14, y - 26 - stomp, 28, 30);
    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';   // big square head
    ctx.fillRect(x - 12, y - 52 - stomp, 24, 26);

    // NINE glowing purple eyes — three rows of three
    ctx.fillStyle = '#b06cff';
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        ctx.fillRect(x - 8 + col * 7, y - 47 + row * 7 - stomp, 3, 3);
      }
    }

    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';   // massive grabby arms
    ctx.fillRect(x - 20, y - 22 - stomp, 6, 16);
    ctx.fillRect(x + 14, y - 22 - stomp, 6, 16);
    return;
  }

  const stomp = Math.abs(Math.sin(elapsed * 6 + z.x)) * 3;   // shamble-bounce

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 11, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // when bonked, the whole zombie flashes white for a blink
  const flash = z.hurtFlash > 0;
  // black zombies are shadow-dark; sand zombies wear desert colors;
  // forest zombies keep the classics
  const shirt = z.black ? '#26262e' : z.sand ? '#a3854a' : '#2e6e8e';
  const skin  = z.black ? '#1c1c22' : z.sand ? '#cbb06a' : '#4a9e4a';

  ctx.fillStyle = flash ? '#ffffff' : shirt;       // ragged shirt
  ctx.fillRect(x - 8, y - 14 - stomp, 16, 16);
  ctx.fillStyle = flash ? '#ffffff' : skin;        // square head
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  if (z.black) {
    // SIX glowing purple eyes, two rows of three
    ctx.fillStyle = '#b06cff';
    for (let e = 0; e < 3; e++) {
      ctx.fillRect(x - 5 + e * 4, y - 27 - stomp, 2, 2);
      ctx.fillRect(x - 5 + e * 4, y - 23 - stomp, 2, 2);
    }
  } else {
    ctx.fillStyle = z.sand ? '#4a3b1c' : '#1c3b1c';  // those eyes...
    ctx.fillRect(x - 5, y - 25 - stomp, 3, 3);
    ctx.fillRect(x + 2, y - 25 - stomp, 3, 3);
  }
  ctx.fillStyle = flash ? '#ffffff' : skin;        // grabby arms, reaching for YOU
  ctx.fillRect(x - 12, y - 12 - stomp, 4, 9);
  ctx.fillRect(x + 8, y - 12 - stomp, 4, 9);
}

// ---------------------------------------------------------------------
// A SKELETON — bones, spear, bad intentions
// ---------------------------------------------------------------------
function drawSkeleton(s, cam) {
  const x = s.x - cam.x, y = s.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;
  const stomp = Math.abs(Math.sin(elapsed * 8 + s.x)) * 3;   // quick rattly steps

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // skeletons are already white, so they flash RED when bonked
  const bone = s.hurtFlash > 0 ? '#ff9a9a' : '#e8e8e2';

  ctx.fillStyle = bone;                            // ribcage body
  ctx.fillRect(x - 6, y - 14 - stomp, 12, 16);
  ctx.fillStyle = s.hurtFlash > 0 ? '#e07a7a' : '#b0b0a8';
  ctx.fillRect(x - 6, y - 10 - stomp, 12, 2);      // rib lines
  ctx.fillRect(x - 6, y - 5 - stomp, 12, 2);
  ctx.fillStyle = bone;                            // skull
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  ctx.fillStyle = '#222';                          // hollow eye sockets
  ctx.fillRect(x - 5, y - 25 - stomp, 4, 4);
  ctx.fillRect(x + 1, y - 25 - stomp, 4, 4);

  // THE SPEAR — a long shaft with a gray point, held out front
  ctx.save();
  ctx.translate(x + 8 * s.facing, y - 12 - stomp);
  if (s.facing === -1) ctx.scale(-1, 1);
  ctx.rotate(-0.35);                               // tilted, ready to poke
  ctx.fillStyle = '#8a6b3f';
  ctx.fillRect(-6, -1.5, 30, 3);                   // wooden shaft
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(24, -3, 8, 6);                      // the pointy end
  ctx.restore();
}

// ---------------------------------------------------------------------
// A CREEPER — that face. THAT face. It flashes and swells when lit.
// ---------------------------------------------------------------------
function drawCreeper(c, cam) {
  const x = c.x - cam.x, y = c.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;

  const lit = c.fuse > 0;
  // swell = it puffs up bigger and bigger as the fuse burns down
  const swell = lit ? 1 + (1.1 - c.fuse) * 0.25 : 1;
  const flash = c.hurtFlash > 0 || (lit && Math.floor(elapsed * 12) % 2 === 0);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 11 * swell, 5 * swell, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? '#ffffff' : '#3faf3f';
  ctx.fillRect(x - 8 * swell, y - 16 * swell, 16 * swell, 18 * swell);  // body
  ctx.fillRect(x - 8 * swell, y - 33 * swell, 16 * swell, 16 * swell);  // head
  ctx.fillRect(x - 9 * swell, y - 2, 7, 5);                             // stubby feet
  ctx.fillRect(x + 2 * swell, y - 2, 7, 5);

  // the famous frown
  ctx.fillStyle = '#143814';
  ctx.fillRect(x - 6 * swell, y - 29 * swell, 4, 4);   // eyes
  ctx.fillRect(x + 2 * swell, y - 29 * swell, 4, 4);
  ctx.fillRect(x - 3 * swell, y - 24 * swell, 6, 4);   // nose-mouth
  ctx.fillRect(x - 5 * swell, y - 21 * swell, 4, 5);   // frown corners
  ctx.fillRect(x + 1 * swell, y - 21 * swell, 4, 5);
}

// ---------------------------------------------------------------------
// A STONE PILLAR — ancient, mossy, very in-the-way
// ---------------------------------------------------------------------
function drawPillar(p, cam) {
  const x = p.x - cam.x, y = p.y - cam.y;
  if (x < -60 || y < -100 || x > canvas.width + 60 || y > canvas.height + 100) return;
  const s = p.size;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 5, y + 5, 20 * s, 8 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#565851'; ctx.fillRect(x - 17 * s, y - 8 * s, 34 * s, 12 * s);   // base
  ctx.fillStyle = '#75776e'; ctx.fillRect(x - 13 * s, y - 62 * s, 26 * s, 58 * s);  // shaft
  ctx.fillStyle = '#8b8d83'; ctx.fillRect(x - 13 * s, y - 62 * s, 8 * s, 58 * s);   // lit edge
  // moss patches — noise() means each pillar keeps its own moss forever
  ctx.fillStyle = '#3f6a34';
  if (noise(p.x * 1.7) > 0.4) ctx.fillRect(x - 13 * s, y - 30 * s, 10 * s, 12 * s);
  if (noise(p.y * 2.3) > 0.5) ctx.fillRect(x + 2 * s, y - 52 * s, 9 * s, 10 * s);
  ctx.fillStyle = '#63655c'; ctx.fillRect(x - 17 * s, y - 70 * s, 34 * s, 10 * s);  // cap
}
