        localStorage.setItem('explorer_gold_sword', 'yes');
        LEVELS[2].unlocked = true;               // the castle opens!
      }
      victoryLevel = 2;
    } else if (current.kind === 'castle') {
      victoryNew = !hasInfectedArmor;
      if (!hasInfectedArmor) {
        hasInfectedArmor = true;
        localStorage.setItem('explorer_infected_armor', 'yes');
        LEVELS[3].unlocked = true;       // the sky opens
      }
      player.armor = armorMax();       // the infection suits up immediately
      victoryLevel = 3;
    } else {
      // you found Chippy's stump — and Chippy has decided he likes you
      victoryNew = !hasChippy;
      if (!hasChippy) {
        hasChippy = true;
        localStorage.setItem('explorer_chippy', 'yes');
      }
      victoryLevel = 5;
    }
    victoryTimer = 5;
  }

  // walk near an emerald and it hops into your pocket
  emeralds = emeralds.filter(e => {
    if (Math.hypot(player.x - e.x, player.y - e.y) < 30) {
      emeraldCount++;
      return false;                          // false = remove from the list
    }
    return true;
  });

  // zombie bits fly out, fall down, fade away
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;                        // gravity pulls the bits down
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

// ---------------------------------------------------------------------
// THE CAMERA — where should the screen's window into the world be?
// It follows you, but stops at the world's edges (no peeking outside).
// ---------------------------------------------------------------------
function getCamera() {
  const cx = Math.max(0, Math.min(current.worldW - canvas.width,  player.x - canvas.width / 2));
  const cy = Math.max(0, Math.min(current.worldH - canvas.height, player.y - canvas.height / 2));
  return { x: cx, y: cy };
}

// ---------------------------------------------------------------------
// DRAWING THE WORLD
// ---------------------------------------------------------------------
function drawGame() {
  const cam = getCamera();

  // grass everywhere
  ctx.fillStyle = current.grass;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (current.kind === 'sky') {
    // storm clouds drifting far BELOW the bridges. They scroll slower
    // than the ground when you walk — that trick is called PARALLAX,
    // and it's what makes your brain believe in the height.
    ctx.fillStyle = 'rgba(9, 10, 16, 0.6)';
    for (let i = 0; i < 14; i++) {
      const drift = elapsed * (6 + noise(i) * 12);
      const cxp = ((noise(i * 9.1) * (current.worldW + 800) + drift) % (current.worldW + 800)) - 400 - cam.x * 0.6;
      const cyp = noise(i * 4.3) * current.worldH - cam.y * 0.6;
      ctx.beginPath();
      ctx.ellipse(cxp, cyp, 180 + noise(i * 2.2) * 120, 60 + noise(i * 5.5) * 40, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // darker grass patches, so the ground isn't one flat color
    ctx.fillStyle = 'rgba(0, 60, 0, 0.10)';
    for (let i = 0; i < 40; i++) {
      const px = noise(i * 51.3) * current.worldW - cam.x;
      const py = noise(i * 17.9) * current.worldH - cam.y;
      ctx.beginPath();
      ctx.ellipse(px, py, 90, 55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // tree stumps — the leftovers of whoever chopped this trail. Flat on
  // the ground, so you can walk right over them.
  for (const s of stumps) {
    const sx = s.x - cam.x, sy = s.y - cam.y;
    if (sx < -20 || sy < -20 || sx > canvas.width + 20 || sy > canvas.height + 20) continue;
    ctx.fillStyle = '#4a3520';       // bark ring
    ctx.beginPath();
    ctx.ellipse(sx, sy, 11 * s.size, 8 * s.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#7d603a';       // pale cut wood on top
    ctx.beginPath();
    ctx.ellipse(sx, sy - 1, 8 * s.size, 5.5 * s.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5e4729';     // one tree ring, for style
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(sx, sy - 1, 4 * s.size, 2.5 * s.size, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // emeralds — spinning, bobbing, begging to be collected
  for (const e of emeralds) {
    const ex = e.x - cam.x;
    const ey = e.y - cam.y + Math.sin((elapsed - e.born) * 4) * 3;   // gentle bob
    if (ex < -20 || ey < -20 || ex > canvas.width + 20 || ey > canvas.height + 20) continue;
    ctx.save();
    ctx.translate(ex, ey - 8);
    ctx.rotate(Math.PI / 4);                 // a square on its corner = a gem
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = '#aaffcc';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-6, -6, 12, 12);
    ctx.restore();
  }

  // THE ABYSS — floating chunks of old worlds over bottomless black
  if (current.kind === 'abyss') {
    // faint void motes drifting far below (parallax = they feel deep)
    ctx.fillStyle = 'rgba(90, 70, 140, 0.3)';
    for (let i = 0; i < 40; i++) {
      const vx2 = ((noise(i * 9.1) * (current.worldW + 600) + elapsed * (4 + noise(i) * 8)) % (current.worldW + 600)) - 300 - cam.x * 0.5;
      const vy2 = noise(i * 4.3) * current.worldH - cam.y * 0.5;
      ctx.fillRect(vx2, vy2, 3, 3);
    }
    // stone bridges between the chunks
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#33333d';
    ctx.lineWidth = 130;
    for (const wp of ABYSS_PATHS) {
      ctx.beginPath();
      ctx.moveTo(wp[0].x - cam.x, wp[0].y - cam.y);
      ctx.lineTo(wp[1].x - cam.x, wp[1].y - cam.y);
      ctx.stroke();
    }
    // the chunks — each still wearing the colors of the world it broke off
    for (const c of ABYSS_CHUNKS) {
      const cx2 = c.x - cam.x, cy2 = c.y - cam.y;
      if (cx2 < -c.r - 60 || cy2 < -c.r - 60 ||
          cx2 > canvas.width + c.r + 60 || cy2 > canvas.height + c.r + 60) continue;
      ctx.fillStyle = c.theme === 'temple' ? '#6e6248'
                    : c.theme === 'castle' ? '#46474d'
                    : c.theme === 'boss'   ? '#2e2836'
                    : '#33333d';
      ctx.beginPath(); ctx.arc(cx2, cy2, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx2, cy2, c.r - 10, 0, Math.PI * 2); ctx.stroke();
    }
    // rubble tiles on the chunks
    for (const t2 of tiles) {
      const tx = t2.x - cam.x, ty = t2.y - cam.y;
      if (tx < -40 || ty < -40 || tx > canvas.width + 40 || ty > canvas.height + 40) continue;
      ctx.fillStyle = t2.color;
      ctx.fillRect(tx - t2.size / 2, ty - t2.size / 2, t2.size, t2.size);
    }
  }

  // the walkway floors: sand base in the temple, cracked stone halls in
  // the castle (every branching passage gets floor), then the tiles/carpet
  if (current.kind === 'temple' || current.kind === 'castle' ||
      current.kind === 'sky' || current.kind === 'jr' ||
      current.kind === 'gecko' || current.kind === 'dungeon') {
    const walkways = current.kind === 'temple' ? [TEMPLE_PATH]
                   : current.kind === 'castle' ? CASTLE_PATHS
                   : current.kind === 'jr'     ? [JR_PATH]
                   : current.kind === 'gecko'  ? [GECKO_PATH]
                   : current.kind === 'dungeon' ? [DUNGEON_PATH]
                   : SKY_PATHS;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const wp of walkways) {
      ctx.beginPath();
      ctx.moveTo(wp[0].x - cam.x, wp[0].y - cam.y);
      for (const p of wp) ctx.lineTo(p.x - cam.x, p.y - cam.y);
      ctx.strokeStyle = current.kind === 'temple' ? '#6e6248'
                      : current.kind === 'castle' ? '#46474d'
                      : current.kind === 'jr'     ? '#3d3649'
                      : current.kind === 'gecko'  ? '#2f4634'
                      : current.kind === 'dungeon' ? '#33333d'
                      : '#4e5259';
      ctx.lineWidth = 175;
      ctx.stroke();
    }
    if (current.kind === 'dungeon') {
      // the final chamber floor
      const jx = dgChamber.x - cam.x, jy = dgChamber.y - cam.y;
      ctx.fillStyle = '#33333d';
      ctx.beginPath(); ctx.arc(jx, jy, 195, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#4a4a58';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(jx, jy, 170, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(jx, jy, 90, 0, Math.PI * 2); ctx.stroke();
    }
    if (current.kind === 'gecko') {
      // the gecko boss chamber floor
      const jx = geckoChamber.x - cam.x, jy = geckoChamber.y - cam.y;
      ctx.fillStyle = '#2f4634';
      ctx.beginPath(); ctx.arc(jx, jy, 195, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#476a50';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(jx, jy, 170, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(jx, jy, 90, 0, Math.PI * 2); ctx.stroke();
    }
    if (current.kind === 'jr') {
      // the boss chamber floor
      const jx = jrChamber.x - cam.x, jy = jrChamber.y - cam.y;
      ctx.fillStyle = '#3d3649';
      ctx.beginPath(); ctx.arc(jx, jy, 195, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#524a63';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(jx, jy, 170, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(jx, jy, 90, 0, Math.PI * 2); ctx.stroke();
    }
    if (current.kind === 'sky') {
      // the round boss arena at the top of the world
      const ax = arena.x - cam.x, ay = arena.y - cam.y;
      ctx.fillStyle = '#4e5259';
      ctx.beginPath(); ctx.arc(ax, ay, 250, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5f636c';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(ax, ay, 230, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(ax, ay, 120, 0, Math.PI * 2); ctx.stroke();
    }
    if (current.kind === 'castle') {
      // the long red carpet down the main hall (what's left of it)
      const mainHall = CASTLE_PATHS[0];
      ctx.beginPath();
      ctx.moveTo(mainHall[0].x - cam.x, mainHall[0].y - cam.y);
      for (const p of mainHall) ctx.lineTo(p.x - cam.x, p.y - cam.y);
      ctx.strokeStyle = '#4f1119';
      ctx.lineWidth = 64;
      ctx.stroke();
    }
    for (const t2 of tiles) {
      const tx = t2.x - cam.x, ty = t2.y - cam.y;
      if (tx < -40 || ty < -40 || tx > canvas.width + 40 || ty > canvas.height + 40) continue;
      ctx.fillStyle = t2.color || (t2.sand ? '#8f7c54' : '#71736a');
      ctx.fillRect(tx - t2.size / 2, ty - t2.size / 2, t2.size, t2.size);
    }
  }

  // scorch marks from creeper explosions (they never wash off)
  for (const s of scorches) {
    ctx.fillStyle = 'rgba(20, 15, 10, 0.55)';
    ctx.beginPath();
    ctx.ellipse(s.x - cam.x, s.y - cam.y, 34, 22, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // the pool — cold dark water in the forest... bubbling LAVA in the temple
  if (!pond.hidden) {
  ctx.fillStyle = pond.lava ? '#8a2f0e' : '#1d3a55';
  ctx.beginPath();
  ctx.ellipse(pond.x - cam.x, pond.y - cam.y, pond.rx, pond.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pond.lava ? '#e2641e' : '#28516f';
  ctx.beginPath();
  ctx.ellipse(pond.x - cam.x, pond.y - cam.y, pond.rx * 0.8, pond.ry * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();
  if (pond.lava) {
    // bright blobs slowly swimming around so the lava looks alive
    ctx.fillStyle = '#ff9f43';
    for (let i = 0; i < 7; i++) {
      const bx = pond.x + Math.sin(elapsed * 0.7 + i * 2.1) * pond.rx * 0.55 - cam.x;
      const by = pond.y + Math.cos(elapsed * 0.5 + i * 1.3) * pond.ry * 0.55 - cam.y;
      ctx.fillRect(bx - 5, by - 4, 10, 8);
    }
  }
  }   // (end of the "is there even a pool here?" check)

  // the golden altar at the temple's heart
  if (current.kind === 'temple') {
    const ax = altar.x - cam.x, ay = altar.y - cam.y;
    ctx.fillStyle = '#6e7069';                     // stone steps
    ctx.fillRect(ax - 44, ay - 6, 88, 18);
    ctx.fillStyle = '#e8b93a';                     // the gold block
    ctx.fillRect(ax - 18, ay - 42, 36, 38);
    ctx.fillStyle = '#ffe38a';                     // shine on top
    ctx.fillRect(ax - 18, ay - 42, 36, 9);
    ctx.fillStyle = '#a8801a';                     // shadow at the base
    ctx.fillRect(ax - 18, ay - 10, 36, 6);
  }

  // the broken throne at the end of the castle's main hall
  if (current.kind === 'castle') {
    const tx = throne.x - cam.x, ty = throne.y - cam.y;
    ctx.fillStyle = '#55565c';                     // the dais it sits on
    ctx.fillRect(tx - 50, ty - 4, 100, 20);
    ctx.fillStyle = '#6e7077';                     // tall stone back...
    ctx.fillRect(tx - 22, ty - 58, 44, 54);
    ctx.fillStyle = current.grass;                 // ...with a chunk smashed off
    ctx.fillRect(tx + 6, ty - 58, 16, 14);
    ctx.fillStyle = '#8a8c93';
    ctx.fillRect(tx - 22, ty - 58, 8, 54);         // edge catching the light
    ctx.fillStyle = '#7a1f2b';                     // the dusty royal cushion
    ctx.fillRect(tx - 16, ty - 22, 32, 12);
    ctx.fillStyle = '#4a4b50';                     // crumbled armrests
    ctx.fillRect(tx - 28, ty - 8, 8, 10);
    ctx.fillRect(tx + 20, ty - 8, 8, 10);
  }

  // flowers (flat on the ground, so they go before trees and you)
  for (const f of flowers) {
    const fx = f.x - cam.x, fy = f.y - cam.y;
    if (fx < -10 || fy < -10 || fx > canvas.width + 10 || fy > canvas.height + 10) continue;
    ctx.fillStyle = ['#ffe066', '#ff8fa3', '#ffffff'][f.kind];
    ctx.fillRect(fx, fy, 4, 4);
    ctx.fillStyle = '#2e5c1e';
    ctx.fillRect(fx + 1, fy + 4, 2, 4);
  }

  // spider webs — flat on the ground, glinting faintly
  for (const w of webs) {
    const wx = w.x - cam.x, wy = w.y - cam.y;
    if (wx < -80 || wy < -80 || wx > canvas.width + 80 || wy > canvas.height + 80) continue;
    ctx.strokeStyle = 'rgba(240, 240, 255, 0.28)';
    ctx.lineWidth = 1;
    for (let ring = 1; ring <= 3; ring++) {
      ctx.beginPath();
      ctx.arc(wx, wy, w.r * ring / 3, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.beginPath();
    for (let s2 = 0; s2 < 6; s2++) {
      const ang = s2 / 6 * Math.PI * 2;
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(ang) * w.r, wy + Math.sin(ang) * w.r);
    }
    ctx.stroke();
  }

  // geckos!! scurrying around having the best day of their lives
  for (const g of geckos) {
    const gx2 = g.x - cam.x, gy2 = g.y - cam.y;
    if (gx2 < -20 || gy2 < -20 || gx2 > canvas.width + 20 || gy2 > canvas.height + 20) continue;
    const flip = Math.cos(g.angle) < 0 ? -1 : 1;
    ctx.fillStyle = g.color;
    ctx.fillRect(gx2 - 5, gy2 - 2, 10, 5);              // body
    ctx.fillRect(gx2 + 5 * flip, gy2 - 3, 4, 4);        // head
    ctx.fillRect(gx2 - 8 * flip, gy2 - 1, 4, 2);        // tail
    ctx.fillStyle = '#222';
    ctx.fillRect(gx2 + 6.5 * flip, gy2 - 2, 1.5, 1.5);  // one alert eye
  }

  // CHIPPY'S STUMP — the great glowing stump, with the man himself in it
  if (current.kind === 'chippy') {
    const sx = chippyStump.x - cam.x, sy = chippyStump.y - cam.y;
    ctx.fillStyle = '#4a3520';
    ctx.beginPath(); ctx.ellipse(sx, sy, 44, 30, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a6b3f';
    ctx.beginPath(); ctx.ellipse(sx, sy - 4, 36, 23, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6d5330';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(sx, sy - 4, 20, 12, 0, 0, Math.PI * 2); ctx.stroke();

    // Chippy, wiggling "happily" in his stump. Seems so nice. SEEMS.
    if (axeBoss && !axeBoss.active) {
    ctx.save();
    ctx.translate(sx, sy - 26);
    ctx.rotate(-0.2 + Math.sin(elapsed * 2) * 0.08);
    ctx.scale(1.5, 1.5);
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(-2, -4, 4, 22);     // handle, standing up
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(-11, -12, 18, 9);   // axe head
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(-11, -12, 18, 3);   // the sharp bit
    ctx.fillStyle = '#ffffff';                                  // his eyes!
    ctx.fillRect(-8, -8, 3, 3); ctx.fillRect(1, -8, 3, 3);
    ctx.fillStyle = '#222';
    ctx.fillRect(-7, -7, 1.5, 1.5); ctx.fillRect(2, -7, 1.5, 1.5);
    ctx.restore();
    }
  }

  // ---- THE DRAW-ORDER TRICK ----
  // Put the trees and YOU in one list, sort it by how far down the world
  // each thing is, then draw top-to-bottom. Lower = drawn later = in front.
  const things = [...trees, ...zombies, ...creepers, ...skeletons, ...torches, ...logs, player];
  things.sort((a, b) => a.y - b.y);
  for (const thing of things) {
    if (thing === player) drawPlayer(cam);
    else if (thing.zombie) drawZombie(thing, cam);
    else if (thing.skeleton) drawSkeleton(thing, cam);
    else if (thing.creeper) drawCreeper(thing, cam);
    else if (thing.torch) drawTorch(thing, cam);
    else if (thing.log) drawLog(thing, cam);
    else if (thing.wall) drawWall(thing, cam);
    else if (thing.pillar) drawPillar(thing, cam);
    else drawTree(thing, cam);
  }

  // CHIPPY mid-battle — a big flipping axe with RED eyes
  if (axeBoss && axeBoss.active) {
    const b = axeBoss;
    const bx = b.x - cam.x, by = b.y - cam.y;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(bx, by + 14, 20, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(bx, by - 14);
    ctx.rotate(elapsed * 7);                     // flipping end over end
    ctx.scale(2.1, 2.1);
    const bFlash = b.hurtFlash > 0;
    ctx.fillStyle = bFlash ? '#ffffff' : '#8a6b3f'; ctx.fillRect(-2, -11, 4, 22);   // handle
    ctx.fillStyle = bFlash ? '#ffffff' : '#c8ccd4'; ctx.fillRect(-11, -12, 18, 9);  // head
    ctx.fillStyle = bFlash ? '#ffffff' : '#e8ecf2'; ctx.fillRect(-11, -12, 18, 3);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-8, -8, 3, 3); ctx.fillRect(1, -8, 3, 3);
    ctx.fillStyle = '#d43a2f';                   // RED eyes. he LIED to us.
    ctx.fillRect(-7.5, -7.5, 2, 2); ctx.fillRect(1.5, -7.5, 2, 2);
    ctx.restore();
  }

  // mini multi-taskers — small wobbling blobs with one hungry eye each
  for (const m of miniBlobs) {
    const mx = m.x - cam.x, my = m.y - cam.y;
    if (mx < -40 || my < -40 || mx > canvas.width + 40 || my > canvas.height + 40) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(mx, my + 10, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = m.hurtFlash > 0 ? '#ffffff' : '#1a1a20';
    ctx.beginPath();
    for (let k = 0; k <= 12; k++) {
      const ang = (k / 12) * Math.PI * 2;
      const r = 14 + Math.sin(elapsed * 4 + k * 2.1 + m.x) * 2.5;
      const px2 = mx + Math.cos(ang) * r;
      const py2 = my + Math.sin(ang) * r * 0.85;
      if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();
    // its one eye, watching you specifically
    const lk = Math.hypot(player.x - m.x, player.y - m.y) || 1;
    const ex2 = (player.x - m.x) / lk * 2.5, ey2 = (player.y - m.y) / lk * 2.5;
    ctx.fillStyle = '#f4f0e8';
    ctx.beginPath(); ctx.arc(mx, my - 2, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b06cff';
    ctx.beginPath(); ctx.arc(mx + ex2, my - 2 + ey2, 3.5, 0, Math.PI * 2); ctx.fill();
  }

  // THE MULTI-TASKER, RETURNED — tentacles, teeth, and nine eyes
  if (returnBoss) {
    const b = returnBoss;
    const bx = b.x - cam.x, by = b.y - cam.y;
    const rFlash = b.hurtFlash > 0;
    const wob = elapsed * 2.2;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(bx, by + 40, 66, 18, 0, 0, Math.PI * 2); ctx.fill();

    // SEVEN black tentacles, writhing out from underneath
    ctx.strokeStyle = rFlash ? '#ffffff' : '#0e0e14';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let t = 0; t < 7; t++) {
      const baseAng = (t / 7) * Math.PI * 2 + Math.sin(wob + t) * 0.15;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(baseAng) * 30, by + Math.sin(baseAng) * 24);
      let tx2 = bx + Math.cos(baseAng) * 30, ty2 = by + Math.sin(baseAng) * 24;
      for (let seg = 1; seg <= 3; seg++) {
        tx2 += Math.cos(baseAng + Math.sin(wob * 1.6 + t + seg) * 0.5) * 26;
        ty2 += Math.sin(baseAng + Math.cos(wob * 1.4 + t + seg) * 0.5) * 22;
        ctx.lineTo(tx2, ty2);
      }
      ctx.stroke();
    }

    // the blob, bigger than ever, edges rippling
    ctx.fillStyle = rFlash ? '#ffffff' : '#1a1a20';
    ctx.beginPath();
    for (let k = 0; k <= 22; k++) {
      const ang = (k / 22) * Math.PI * 2;
      const r = 56 + Math.sin(wob * 1.4 + k * 1.9) * 7;
      const px2 = bx + Math.cos(ang) * r;
      const py2 = by + Math.sin(ang) * r * 0.85;
      if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();

    // NINE eyes in a 3x3 grid, every pupil tracking you
    const lk = Math.hypot(player.x - b.x, player.y - b.y) || 1;
    const ex2 = (player.x - b.x) / lk * 2.5, ey2 = (player.y - b.y) / lk * 2.5;
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        const ox = bx - 24 + col * 24, oy = by - 34 + row * 14;
        ctx.fillStyle = '#f4f0e8';
        ctx.beginPath(); ctx.arc(ox, oy, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#b06cff';
        ctx.beginPath(); ctx.arc(ox + ex2, oy + ey2, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // THE MOUTH — wide, dark, and full of sharp teeth
    ctx.fillStyle = '#0a0a0e';
    ctx.beginPath();
    ctx.ellipse(bx, by + 18, 30, 12 + Math.sin(wob * 2) * 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4f0e8';
    for (let tt = 0; tt < 6; tt++) {                     // top teeth point down
      const tx3 = bx - 25 + tt * 10;
      ctx.beginPath();
      ctx.moveTo(tx3, by + 10); ctx.lineTo(tx3 + 8, by + 10); ctx.lineTo(tx3 + 4, by + 18);
      ctx.closePath(); ctx.fill();
    }
    for (let tt = 0; tt < 5; tt++) {                     // bottom teeth point up
      const tx3 = bx - 20 + tt * 10;
      ctx.beginPath();
      ctx.moveTo(tx3, by + 27); ctx.lineTo(tx3 + 8, by + 27); ctx.lineTo(tx3 + 4, by + 19);
      ctx.closePath(); ctx.fill();
    }
  }

  // THE LAST BOSS — stitched down the middle: goo on one side, rot on the other
  if (abyssBoss) {
    const b = abyssBoss;
    const bx = b.x - cam.x, by = b.y - cam.y;
    const aFlash = b.hurtFlash > 0;
    const wob = elapsed * 2.2;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(bx, by + 40, 66, 18, 0, 0, Math.PI * 2); ctx.fill();

    // tentacles on the LEFT (the Multi-Tasker half)
    ctx.strokeStyle = aFlash ? '#ffffff' : '#0e0e14';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    for (let t = 0; t < 4; t++) {
      const baseAng = Math.PI * 0.6 + t * 0.55 + Math.sin(wob + t) * 0.12;
      ctx.beginPath();
      let tx2 = bx + Math.cos(baseAng) * 30, ty2 = by + Math.sin(baseAng) * 24;
      ctx.moveTo(tx2, ty2);
      for (let seg = 1; seg <= 3; seg++) {
        tx2 += Math.cos(baseAng + Math.sin(wob * 1.6 + t + seg) * 0.5) * 26;
        ty2 += Math.sin(baseAng + Math.cos(wob * 1.4 + t + seg) * 0.5) * 22;
        ctx.lineTo(tx2, ty2);
      }
      ctx.stroke();
    }
    // grabby zombie arms on the RIGHT (the zombie half)
    ctx.fillStyle = aFlash ? '#ffffff' : '#4a9e4a';
    ctx.fillRect(bx + 44, by - 20 + Math.sin(wob * 2) * 4, 22, 8);
    ctx.fillRect(bx + 40, by + 4 + Math.cos(wob * 2) * 4, 24, 8);

    // the blob body, drawn TWICE with a clip: left half goo, right half rot
    const blobPath = () => {
      ctx.beginPath();
      for (let k = 0; k <= 22; k++) {
        const ang = (k / 22) * Math.PI * 2;
        const r = 54 + Math.sin(wob * 1.4 + k * 1.9) * 6;
        const px2 = bx + Math.cos(ang) * r;
        const py2 = by + Math.sin(ang) * r * 0.85;
        if (k === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
      }
      ctx.closePath();
    };
    ctx.save();
    ctx.beginPath(); ctx.rect(bx - 70, by - 70, 70, 140); ctx.clip();
    blobPath();
    ctx.fillStyle = aFlash ? '#ffffff' : '#1a1a20';   // the goo half
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(bx, by - 70, 70, 140); ctx.clip();
    blobPath();
    ctx.fillStyle = aFlash ? '#ffffff' : '#3a5a3a';   // the zombie half
    ctx.fill();
    ctx.restore();
    // the stitched seam down the middle
    ctx.strokeStyle = '#0a0a0e';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let s2 = 0; s2 <= 6; s2++) {
      const sy2 = by - 45 + s2 * 15;
      const sx2 = bx + (s2 % 2 ? 4 : -4);
      if (s2 === 0) ctx.moveTo(sx2, sy2); else ctx.lineTo(sx2, sy2);
    }
    ctx.stroke();

    // LEFT: one big purple eye, tracking you. RIGHT: two square zombie eyes.
    const lk = Math.hypot(player.x - b.x, player.y - b.y) || 1;
    const ex2 = (player.x - b.x) / lk * 3, ey2 = (player.y - b.y) / lk * 3;
    ctx.fillStyle = '#f4f0e8';
    ctx.beginPath(); ctx.arc(bx - 26, by - 16, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b06cff';
    ctx.beginPath(); ctx.arc(bx - 26 + ex2, by - 16 + ey2, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1c3b1c';
    ctx.fillRect(bx + 14, by - 22, 6, 6);
    ctx.fillRect(bx + 30, by - 22, 6, 6);

    // one shared mouth of teeth, spanning both halves
    ctx.fillStyle = '#0a0a0e';
    ctx.beginPath();
    ctx.ellipse(bx, by + 16, 28, 11 + Math.sin(wob * 2) * 3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4f0e8';
    for (let tt = 0; tt < 6; tt++) {
      const tx3 = bx - 23 + tt * 9;
      ctx.beginPath();
      ctx.moveTo(tx3, by + 9); ctx.lineTo(tx3 + 7, by + 9); ctx.lineTo(tx3 + 3.5, by + 16);
      ctx.closePath(); ctx.fill();
    }
  }

  // the angry gecko swarm — small, fast, and coming right at you
  for (const a of angryGeckos) {
    const ax2 = a.x - cam.x, ay2 = a.y - cam.y;
    if (ax2 < -20 || ay2 < -20 || ax2 > canvas.width + 20 || ay2 > canvas.height + 20) continue;
    const flip = player.x < a.x ? -1 : 1;
    const scurry = Math.abs(Math.sin(elapsed * 14 + a.x)) * 2;   // furious little legs
    ctx.fillStyle = a.color;
    ctx.fillRect(ax2 - 5, ay2 - 2 - scurry, 10, 5);
    ctx.fillRect(ax2 + 5 * flip, ay2 - 3 - scurry, 4, 4);
    ctx.fillRect(ax2 - 8 * flip, ay2 - 1 - scurry, 4, 2);
    ctx.fillStyle = '#e03a2f';                                   // angry red eye
    ctx.fillRect(ax2 + 6.5 * flip, ay2 - 2 - scurry, 1.5, 1.5);
  }

  // GECKO MAN — upright, horned, armed, and righteous
  if (geckoMan) {
    const b = geckoMan;
    const bx = b.x - cam.x, by = b.y - cam.y;
    const stomp = b.active ? Math.abs(Math.sin(elapsed * 7)) * 4 : 0;
    const flip = player.x < b.x ? -1 : 1;
    const gFlash = b.hurtFlash > 0;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(bx, by + 10, 24, 9, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = gFlash ? '#ffffff' : '#3f8a3f';
    ctx.fillRect(bx - 30 * flip, by - 12 - stomp, 18, 7);   // tail
    ctx.fillRect(bx - 12, by - 34 - stomp, 24, 36);         // upright body
    ctx.fillStyle = gFlash ? '#ffffff' : '#8fce8f';
    ctx.fillRect(bx - 7, by - 26 - stomp, 14, 24);          // pale belly
    ctx.fillStyle = gFlash ? '#ffffff' : '#3f8a3f';
    ctx.fillRect(bx - 11, by - 52 - stomp, 22, 18);         // head
    ctx.fillRect(bx + 8 * flip, by - 47 - stomp, 10, 9);    // snout
    ctx.fillStyle = '#2a2118';                              // THE HORNS
    ctx.fillRect(bx - 10, by - 60 - stomp, 5, 9);
    ctx.fillRect(bx + 5, by - 60 - stomp, 5, 9);
    ctx.fillStyle = '#e03a2f';                              // red eyes
    ctx.fillRect(bx - 6 + 3 * flip, by - 48 - stomp, 4, 4);
    ctx.fillRect(bx + 2 + 3 * flip, by - 48 - stomp, 4, 4);
    ctx.fillStyle = gFlash ? '#ffffff' : '#2f6a2f';         // stompy legs
    ctx.fillRect(bx - 10, by - 2 - stomp, 7, 8 + stomp);
    ctx.fillRect(bx + 3, by - 2 - stomp, 7, 8 + stomp);

    // HIS AXE — swinging with menace once the fight is on
    ctx.save();
    ctx.translate(bx + 16 * flip, by - 24 - stomp);
    if (flip === -1) ctx.scale(-1, 1);
    ctx.rotate(b.active ? Math.sin(elapsed * 6) * 0.8 : 0.5);
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(0, -3, 26, 5);
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(22, -12, 9, 20);
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(29, -12, 3, 20);
    ctx.restore();
  }

  // CHIPPY JR — a giant black axe with burning red eyes
  if (chippyJr) {
    const b = chippyJr;
    const bx = b.x - cam.x, by = b.y - cam.y;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(bx, by + 20, 30, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(bx, by - 24);
    // standing perfectly still before the fight; flipping furiously during it
    ctx.rotate(b.active ? elapsed * 6 : Math.sin(elapsed * 1.5) * 0.05);
    ctx.scale(2.9, 2.9);
    const jFlash = b.hurtFlash > 0;
    ctx.fillStyle = jFlash ? '#ffffff' : '#2a2118'; ctx.fillRect(-2, -11, 4, 22);   // black handle
    ctx.fillStyle = jFlash ? '#ffffff' : '#1c1c22'; ctx.fillRect(-11, -12, 18, 9);  // black head
    ctx.fillStyle = jFlash ? '#ffffff' : '#3a3a44'; ctx.fillRect(-11, -12, 18, 3);  // dark edge
    ctx.fillStyle = '#e03a2f';                       // the burning red eyes
    ctx.fillRect(-8, -8, 3, 3); ctx.fillRect(1, -8, 3, 3);
    ctx.fillStyle = '#7a120c';
    ctx.fillRect(-7, -7, 1.5, 1.5); ctx.fillRect(2, -7, 1.5, 1.5);
    ctx.restore();
  }

  // mini axes, spinning through the air after you
  for (const m of miniAxes) {
    const mx = m.x - cam.x, my = m.y - cam.y;
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(m.spin);
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(-1.5, -8, 3, 16);
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(-8, -9, 13, 6);
    ctx.restore();
  }

  // giant geckos — same little guys, way less little, way less friendly
  for (const g of giantGeckos) {
    const gx2 = g.x - cam.x, gy2 = g.y - cam.y;
    if (gx2 < -80 || gy2 < -80 || gx2 > canvas.width + 80 || gy2 > canvas.height + 80) continue;
    const flip = player.x < g.x ? -1 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(gx2, gy2 + 10, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = g.hurtFlash > 0 ? '#ffffff' : g.color;
    ctx.fillRect(gx2 - 16, gy2 - 8, 32, 16);              // big body
    ctx.fillRect(gx2 + 16 * flip - 6, gy2 - 11, 13, 13);  // big head
    ctx.fillRect(gx2 - 26 * flip, gy2 - 4, 13, 6);        // big tail
    ctx.fillStyle = '#222';
    ctx.fillRect(gx2 + 20 * flip, gy2 - 8, 4, 4);         // big hungry eye
  }

  // flying zombie bits
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);   // fade out as life runs out
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - cam.x - 3, p.y - cam.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;                              // back to normal, please

  // ---- NIGHT FALLS ----
  // A see-through dark blanket over the whole screen, with a hole cut
  // around the explorer. Clear near you, pitch dark far away.
  const px = player.x - cam.x, py = player.y - cam.y;
  const night = ctx.createRadialGradient(px, py - 14, 40, px, py - 14, 270);
  night.addColorStop(0, 'rgba(5, 5, 20, 0)');       // clear right at you
  night.addColorStop(0.5, 'rgba(5, 5, 20, 0.45)');  // getting murky...
  night.addColorStop(1, 'rgba(5, 5, 20, 0.88)');    // proper gloom
  ctx.fillStyle = night;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // warm lantern light right around the explorer
  const warm = ctx.createRadialGradient(px, py - 14, 5, px, py - 14, 130);
  warm.addColorStop(0, 'rgba(255, 200, 110, 0.20)');
  warm.addColorStop(1, 'rgba(255, 200, 110, 0)');
  ctx.fillStyle = warm;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // fireflies — drawn AFTER the darkness because they glow through it
  for (const f of fireflies) {
    const fx = f.x + Math.sin(elapsed * f.speed + f.phase) * 40 - cam.x;
    const fy = f.y + Math.cos(elapsed * f.speed * 0.7 + f.phase * 2) * 26 - cam.y;
    if (fx < -10 || fy < -10 || fx > canvas.width + 10 || fy > canvas.height + 10) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(elapsed * 3 + f.phase * 7);
    // green fireflies in the forest, orange embers in the temple,
    // eerie purple dust in the castle
    const glowA = current.kind === 'temple' ? '255, 150, 70'
                : current.kind === 'castle' ? '190, 140, 255'
                : current.kind === 'sky'    ? '170, 200, 255'
                : current.kind === 'chippy' ? '255, 150, 220'
                : current.kind === 'jr'     ? '255, 110, 100'
                : current.kind === 'dungeon' ? '150, 150, 255'
                : current.kind === 'abyss'  ? '190, 160, 255'
                : '190, 255, 130';
    const glowB = current.kind === 'temple' ? '255, 210, 140'
                : current.kind === 'castle' ? '220, 190, 255'
                : current.kind === 'sky'    ? '225, 240, 255'
                : current.kind === 'chippy' ? '255, 215, 245'
                : current.kind === 'jr'     ? '255, 190, 185'
                : current.kind === 'dungeon' ? '210, 210, 255'
                : current.kind === 'abyss'  ? '235, 225, 255'
                : '220, 255, 170';
    ctx.fillStyle = `rgba(${glowA}, ${0.15 + 0.25 * twinkle})`;
    ctx.beginPath(); ctx.arc(fx, fy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(${glowB}, ${0.4 + 0.5 * twinkle})`;
    ctx.beginPath(); ctx.arc(fx, fy, 2, 0, Math.PI * 2); ctx.fill();
  }

  // zombie eyes glow faintly through the dark... consider yourself warned
  // (buried sand zombies don't glow. that's what makes them scary.)
  for (const z of zombies) {
    if (z.buried) continue;
    const zx = z.x - cam.x, zy = z.y - cam.y;
    if (zx < -20 || zy < -20 || zx > canvas.width + 20 || zy > canvas.height + 20) continue;
    if (z.boss) {
      // ONE giant purple eye, glowing through the storm. it sees you.
      ctx.fillStyle = 'rgba(176, 108, 255, 0.9)';
      ctx.beginPath(); ctx.arc(zx, zy - 2, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(176, 108, 255, 0.35)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(zx, zy - 2, 14, 0, Math.PI * 2); ctx.stroke();
    } else if (z.giant) {
      // a 3x3 grid of purple lights drifting toward you in the dark.
      // when you see NINE eyes... that's a giant.
      ctx.fillStyle = 'rgba(176, 108, 255, 0.85)';
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          ctx.fillRect(zx - 8 + col * 7, zy - 47 + row * 7, 3, 3);
        }
      }
    } else if (z.black) {
      // six purple pinpricks floating in the dark. good luck sleeping.
      ctx.fillStyle = 'rgba(176, 108, 255, 0.75)';
      for (let e = 0; e < 3; e++) {
        ctx.fillRect(zx - 5 + e * 4, zy - 27, 2, 2);
        ctx.fillRect(zx - 5 + e * 4, zy - 23, 2, 2);
      }
    } else {
      ctx.fillStyle = 'rgba(150, 255, 150, 0.5)';
      ctx.fillRect(zx - 5, zy - 26, 3, 3);
      ctx.fillRect(zx + 2, zy - 26, 3, 3);
    }
  }

  if (current.kind === 'forest') {
    // the gate at the end of the trail — its glow cuts through the gloom
    const gx = gate.x - cam.x, gy = gate.y - cam.y;
    const pulse = 1 + 0.08 * Math.sin(elapsed * 2.5);
    const glow = ctx.createRadialGradient(gx, gy, 4, gx, gy, 100);
    glow.addColorStop(0, 'rgba(120, 210, 255, 0.4)');
    glow.addColorStop(1, 'rgba(120, 210, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(gx - 110, gy - 110, 220, 220);
    ctx.strokeStyle = '#7fd4ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(gx, gy, gate.r * pulse, 0, Math.PI * 2);
    ctx.stroke();

    // stand close to the gate and it talks to you
    if (Math.hypot(player.x - gate.x, player.y - gate.y) < 90) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#aee3ff';
      ctx.font = '18px monospace';
      if (hasArmor) {
        ctx.fillText('The gate hums, wide awake now...', canvas.width / 2, 60);
        ctx.fillText('Walk through → THE CREEPER TEMPLE', canvas.width / 2, 85);
      } else {
        ctx.fillText('A mysterious gate hums softly...', canvas.width / 2, 60);
      }
    }
  }

  // torchlight pushes back the dark along the walkway (temple AND castle)
  for (const t of torches) {
    const tx = t.x - cam.x, ty = t.y - cam.y - 28;
    if (tx < -120 || ty < -120 || tx > canvas.width + 120 || ty > canvas.height + 120) continue;
    const tg = ctx.createRadialGradient(tx, ty, 3, tx, ty, 95);
    tg.addColorStop(0, 'rgba(255, 170, 80, 0.30)');
    tg.addColorStop(1, 'rgba(255, 170, 80, 0)');
    ctx.fillStyle = tg;
    ctx.fillRect(tx - 95, ty - 95, 190, 190);
  }

  if (current.kind === 'temple') {
    // the lava glows from below
    const lx = pond.x - cam.x, ly = pond.y - cam.y;
    const lg = ctx.createRadialGradient(lx, ly, 10, lx, ly, pond.rx * 1.7);
    lg.addColorStop(0, 'rgba(255, 120, 40, 0.30)');
    lg.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(lx - pond.rx * 1.7, ly - pond.rx * 1.7, pond.rx * 3.4, pond.rx * 3.4);
    // and the altar shines gold
    const ax = altar.x - cam.x, ay = altar.y - cam.y - 20;
    const ag = ctx.createRadialGradient(ax, ay, 5, ax, ay, 130);
    ag.addColorStop(0, 'rgba(255, 215, 90, 0.35)');
    ag.addColorStop(1, 'rgba(255, 215, 90, 0)');
    ctx.fillStyle = ag;
    ctx.fillRect(ax - 130, ay - 130, 260, 260);
  }

  if (current.kind === 'chippy') {
    // Chippy's stump glows warm and friendly through the strange night
    const sx = chippyStump.x - cam.x, sy = chippyStump.y - cam.y - 20;
    const sg = ctx.createRadialGradient(sx, sy, 5, sx, sy, 140);
    sg.addColorStop(0, 'rgba(255, 230, 130, 0.35)');
    sg.addColorStop(1, 'rgba(255, 230, 130, 0)');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 140, sy - 140, 280, 280);
  }

  if (current.kind === 'castle') {
    // a cold purple shimmer hangs over the broken throne
    const thx = throne.x - cam.x, thy = throne.y - cam.y - 25;
    const thg = ctx.createRadialGradient(thx, thy, 5, thx, thy, 130);
    thg.addColorStop(0, 'rgba(190, 140, 255, 0.28)');
    thg.addColorStop(1, 'rgba(190, 140, 255, 0)');
    ctx.fillStyle = thg;
    ctx.fillRect(thx - 130, thy - 130, 260, 260);
  }

  // sword button, only on touch screens (phones/tablets)
  if (navigator.maxTouchPoints > 0) {
    const bx = canvas.width - 70, by = canvas.height - 70;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(bx, by, 42, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = '28px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⚔', bx, by + 10);
  }

  if (current.kind === 'sky') {
    // RAIN — sheets of it slashing down the screen
    ctx.strokeStyle = 'rgba(180, 200, 255, 0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 140; i++) {
      const speed = 700 + noise(i) * 400;
      const ry = (noise(i * 3.3) * 3000 + elapsed * speed) % (canvas.height + 60) - 30;
      const rx = (noise(i * 7.7) * canvas.width + ry * 0.3) % canvas.width;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx + 5, ry + 16);
    }
    ctx.stroke();

    // LIGHTNING — a double-flash every 7 seconds, and during the flash
    // you can see the actual BOLTS tearing down the sky
    const cycle = elapsed % 7;
    if (cycle < 0.12 || (cycle > 0.22 && cycle < 0.30)) {
      ctx.fillStyle = 'rgba(230, 240, 255, 0.30)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // each storm cycle gets its own bolt shapes (same seed = same bolt
      // for the whole flash, so it doesn't wiggle like spaghetti)
      const storm = Math.floor(elapsed / 7);
      for (let b = 0; b < 2; b++) {
        let bx = noise(storm * 13.7 + b * 5.1) * canvas.width;
        let by = -10;
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.25)';   // the wide glow
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        for (let seg = 0; seg < 9; seg++) {
          bx += (noise(storm * 3.1 + b * 7.7 + seg) - 0.5) * 90;
          by += 50 + noise(storm + b + seg * 2.2) * 60;
          ctx.lineTo(bx, by);
        }
        ctx.stroke();
        ctx.strokeStyle = '#eaf2ff';                     // the bright core
        ctx.lineWidth = 3;
        ctx.stroke();                                    // same bolt, drawn again
      }
    }

    // BOSS BAR — appears when the Storm King has noticed you
    const boss = zombies.find(z => z.boss);
    if (boss && Math.hypot(player.x - boss.x, player.y - boss.y) < 520) {
      const bw = Math.min(500, canvas.width - 80);
      const bx = canvas.width / 2 - bw / 2, by = 30;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#d8c2ff';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('THE MULTI-TASKER', canvas.width / 2, by - 8);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx, by, bw, 14);
      ctx.fillStyle = '#b06cff';
      ctx.fillRect(bx + 2, by + 2, (bw - 4) * (boss.hp / 24), 10);
      ctx.strokeStyle = '#d8c2ff';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, 14);
    }
  }

  // BOSS BAR for the last boss
  if (current.kind === 'abyss' && abyssBoss && abyssBoss.active) {
    const bw = Math.min(500, canvas.width - 80);
    const bx = canvas.width / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cfe8cf';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('THE ZOMBIE MULTI-TASKER', canvas.width / 2, by - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 14);
    // half purple, half zombie green — like its owner
    const fill = (bw - 4) * (abyssBoss.hp / 45);
    ctx.fillStyle = '#b06cff';
    ctx.fillRect(bx + 2, by + 2, fill / 2, 10);
    ctx.fillStyle = '#4a9e4a';
    ctx.fillRect(bx + 2 + fill / 2, by + 2, fill / 2, 10);
    ctx.strokeStyle = '#cfe8cf';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 14);
  }

  // BOSS BAR for the returned Multi-Tasker
  if (current.kind === 'dungeon' && returnBoss && returnBoss.active) {
    const bw = Math.min(500, canvas.width - 80);
    const bx = canvas.width / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d8c2ff';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('THE MULTI-TASKER, RETURNED', canvas.width / 2, by - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = '#b06cff';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * (returnBoss.hp / 40), 10);
    ctx.strokeStyle = '#d8c2ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 14);
  }

  // BOSS BAR for Gecko Man
  if (current.kind === 'gecko' && geckoMan && geckoMan.active) {
    const bw = Math.min(500, canvas.width - 80);
    const bx = canvas.width / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#b8e8b8';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('GECKO MAN', canvas.width / 2, by - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = '#3f8a3f';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * (geckoMan.hp / 32), 10);
    ctx.strokeStyle = '#b8e8b8';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 14);
  }

  // BOSS BAR for Chippy Jr
  if (current.kind === 'jr' && chippyJr && chippyJr.active) {
    const bw = Math.min(500, canvas.width - 80);
    const bx = canvas.width / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffb3ab';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('CHIPPY JR', canvas.width / 2, by - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = '#e03a2f';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * (chippyJr.hp / 30), 10);
    ctx.strokeStyle = '#ffb3ab';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 14);
  }

  // BOSS BAR for Chippy, once the nice act drops
  if (current.kind === 'chippy' && axeBoss && axeBoss.active) {
    const bw = Math.min(500, canvas.width - 80);
    const bx = canvas.width / 2 - bw / 2, by = 30;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd8c2';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('CHIPPY, THE LIVING AXE', canvas.width / 2, by - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 14);
    ctx.fillStyle = '#e05545';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * (axeBoss.hp / 20), 10);
    ctx.strokeStyle = '#ffd8c2';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 14);
  }

  // ---- HUD (the stuff glued to the screen, not the world) ----
  // hearts, top-left
  for (let i = 0; i < player.maxHp; i++) {
    drawHeart(14 + i * 26, 14, i < player.hp);
  }
  // armor points line up after the hearts — silver plate, or glowing
  // purple once the infection has it
  for (let i = 0; i < armorMax(); i++) {
    drawHeart(22 + (player.maxHp + i) * 26, 14, i < player.armor,
              hasGeckoArmor ? '#5fbf5f' : hasInfectedArmor ? '#a86cf0' : '#b8c4d0');
  }
  // emerald counter under the hearts
  ctx.save();
  ctx.translate(24, 52);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.fillStyle = '#bfffdd';
  ctx.font = '18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('x ' + emeraldCount, 40, 58);

  // red flash right when a zombie gets you
  if (player.hurtTimer > 0.7) {
    ctx.fillStyle = `rgba(255, 40, 40, ${(player.hurtTimer - 0.7) * 0.8})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // down! the respawn screen
  if (player.deathTimer > 0) {
    ctx.fillStyle = 'rgba(40, 0, 0, 0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffdddd';
    ctx.font = 'bold 34px monospace';
    ctx.fillText(current.kind === 'temple' ? 'The temple got you!'
               : current.kind === 'castle' ? 'The castle got you!'
               : current.kind === 'sky'    ? 'The storm got you!'
               : current.kind === 'chippy' ? 'Chippy got you! (He was evil the WHOLE time!)'
               : current.kind === 'jr'     ? 'Chippy Jr got his revenge!'
               : current.kind === 'gecko'  ? 'The geckos rose. You fell!'
               : current.kind === 'dungeon' ? 'The Multi-Tasker multi-tasked you!'
               : current.kind === 'abyss'  ? 'The Abyss swallowed you!'
               : 'The zombies got you!',
                 canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '18px monospace';
    ctx.fillText('Respawning at camp...', canvas.width / 2, canvas.height / 2 + 24);
  }

  // bag button, only on touch screens
  if (navigator.maxTouchPoints > 0) {
    const bx = canvas.width - 70, by = canvas.height - 165;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 34, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '26px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🎒', bx, by + 9);
  }

  // little helper text
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Space = sword   E = bag   Esc = levels', canvas.width - 10, canvas.height - 12);

  // ---- LEVEL COMPLETE! the golden celebration ----
  if (victoryTimer > 0) {
    ctx.fillStyle = 'rgba(10, 25, 12, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 40px monospace';
    ctx.fillText(`LEVEL ${victoryLevel} COMPLETE!`, canvas.width / 2, canvas.height / 2 - 60);
    if (victoryLevel === 9) {
      // the half-and-half eye, finally closed
      ctx.fillStyle = '#b06cff';
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2 + 4, 22, Math.PI / 2, Math.PI * 1.5);
      ctx.fill();
      ctx.fillStyle = '#4a9e4a';
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2 + 4, 22, Math.PI * 1.5, Math.PI / 2);
      ctx.fill();
      ctx.strokeStyle = '#f4f0e8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 - 12, canvas.height / 2 + 4);
      ctx.lineTo(canvas.width / 2 + 12, canvas.height / 2 + 4);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px monospace';
      ctx.fillText('THE ABYSS IS CONQUERED!', canvas.width / 2, canvas.height / 2 + 66);
      ctx.fillStyle = '#e0d4ff';
      ctx.font = '16px monospace';
      ctx.fillText('You reached the bottom of everything... and beat what lives there.',
                   canvas.width / 2, canvas.height / 2 + 94);
      ctx.fillText('THE END............ ?', canvas.width / 2, canvas.height / 2 + 120);
    } else if (victoryLevel === 8) {
      // nine eyes, all closed
      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const ox = canvas.width / 2 - 26 + col * 26;
          const oy = canvas.height / 2 - 10 + row * 16;
          ctx.fillStyle = '#f4f0e8';
          ctx.beginPath(); ctx.arc(ox, oy, 8, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#555';                    // closed-eye line
          ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(ox - 5, oy); ctx.lineTo(ox + 5, oy); ctx.stroke();
        }
      }
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('THE MULTI-TASKER IS DEFEATED... AGAIN!', canvas.width / 2, canvas.height / 2 + 72);
      ctx.fillStyle = '#d8c2ff';
      ctx.font = '16px monospace';
      ctx.fillText('Nine eyes closed forever. Probably. Maybe.',
                   canvas.width / 2, canvas.height / 2 + 100);
    } else if (victoryLevel === 7 && victoryNew) {
      // his scales, now YOUR armor
      drawChestplate(canvas.width / 2, canvas.height / 2 + 4, 2.4, 'gecko');
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('You found: GECKO SKIN ARMOR', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#b8e8b8';
      ctx.font = '16px monospace';
      ctx.fillText('5 points, regrows like a gecko tail — and you RUN faster',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 7) {
      // Gecko Man's horned silhouette, head bowed
      const vx = canvas.width / 2, vy = canvas.height / 2 + 8;
      ctx.fillStyle = '#3f8a3f';
      ctx.fillRect(vx - 16, vy - 14, 32, 26);          // head, bowed
      ctx.fillRect(vx - 4, vy + 8, 8, 12);
      ctx.fillStyle = '#2a2118';
      ctx.fillRect(vx - 15, vy - 25, 7, 12);           // the horns
      ctx.fillRect(vx + 8, vy - 25, 7, 12);
      ctx.fillStyle = '#555';                          // eyes dimmed
      ctx.fillRect(vx - 9, vy - 6, 5, 5);
      ctx.fillRect(vx + 4, vy - 6, 5, 5);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('GECKO MAN IS DEFEATED!', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#b8e8b8';
      ctx.font = '16px monospace';
      ctx.fillText('The rise is over... but the geckos will remember this.',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 6) {
      // Chippy Jr, defeated — drawn one last time, eyes out
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 4);
      ctx.rotate(Math.PI / 5);                     // toppled over
      ctx.scale(2.4, 2.4);
      ctx.fillStyle = '#2a2118'; ctx.fillRect(-2, -11, 4, 22);
      ctx.fillStyle = '#1c1c22'; ctx.fillRect(-11, -12, 18, 9);
      ctx.fillStyle = '#3a3a44'; ctx.fillRect(-11, -12, 18, 3);
      ctx.fillStyle = '#555';                      // eyes gone dark
      ctx.fillRect(-8, -8, 3, 3); ctx.fillRect(1, -8, 3, 3);
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('CHIPPY JR IS DEFEATED!', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#ffb3ab';
      ctx.font = '16px monospace';
      ctx.fillText('The revenge is over. Like father, like son — beaten by YOU.',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 5) {
      // Chippy himself, big and proud
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 4);
      ctx.rotate(-Math.PI / 4);
      ctx.scale(2.6, 2.6);
      ctx.fillStyle = '#8a6b3f'; ctx.fillRect(-14, -2, 24, 4);
      ctx.fillStyle = '#c8ccd4'; ctx.fillRect(6, -11, 9, 18);
      ctx.fillStyle = '#e8ecf2'; ctx.fillRect(13, -11, 3, 18);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(7.5, -8, 3, 3); ctx.fillRect(7.5, 1, 3, 3);
      ctx.fillStyle = '#222'; ctx.fillRect(8.5, -7, 1.5, 1.5); ctx.fillRect(8.5, 2, 1.5, 1.5);
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(victoryNew ? 'CHIPPY SURRENDERS... AND JOINS YOU!' : 'CHIPPY DEFEATED AGAIN!',
                   canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#bfffe0';
      ctx.font = '16px monospace';
      ctx.fillText(victoryNew ? 'Beaten fair and square — now he chops for YOU.'
                              : 'He is still your axe. He is still a little salty about it.',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 4) {
      // its giant eye — closed forever. your trophy.
      ctx.fillStyle = '#f4f0e8';
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2 + 2, 24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b06cff';
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2 + 2, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2 + 2, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('THE MULTI-TASKER IS DEFEATED!', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#d8c2ff';
      ctx.font = '16px monospace';
      ctx.fillText('You beat every level of THE EXPLORER. What a run.',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 3) {
      drawChestplate(canvas.width / 2, canvas.height / 2 + 4, 2.4, true);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(victoryNew ? 'You found: INFECTED ARMOR' : 'CASTLE CONQUERED!',
                   canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#d8c2ff';
      ctx.font = '16px monospace';
      ctx.fillText(victoryNew ? 'Four armor points — and the infection REGROWS them on its own'
                              : 'The Infected Armor is already yours!',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else if (victoryLevel === 1) {
      drawChestplate(canvas.width / 2, canvas.height / 2 + 4, 2.4);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('You found: PLATE ARMOR', canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#bfd4e8';
      ctx.font = '16px monospace';
      ctx.fillText('3 armor points — they take the hits before your hearts do',
                   canvas.width / 2, canvas.height / 2 + 90);
    } else {
      // the golden sword, displayed big and proud
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 4);
      ctx.rotate(-Math.PI / 4);
      ctx.scale(2.4, 2.4);
      ctx.fillStyle = '#5b3b1e'; ctx.fillRect(-14, -2, 7, 4);
      ctx.fillStyle = '#c9a83c'; ctx.fillRect(-8, -5, 3, 10);
      ctx.fillStyle = '#f2c94c'; ctx.fillRect(-5, -2, 17, 4);
      ctx.fillStyle = '#fff3b8'; ctx.fillRect(-5, -2, 17, 1.5);
      ctx.restore();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px monospace';
      ctx.fillText(victoryNew ? 'You found: THE GOLDEN SWORD' : 'TEMPLE CONQUERED!',
                   canvas.width / 2, canvas.height / 2 + 62);
      ctx.fillStyle = '#bfd4e8';
      ctx.font = '16px monospace';
      ctx.fillText(victoryNew ? 'One bonk and monsters go POOF'
                              : 'The Golden Sword is already yours — back to the menu!',
                   canvas.width / 2, canvas.height / 2 + 90);
    }
  }

  // the bag goes on top of everything
  if (inventoryOpen) drawInventory();
}

// ---------------------------------------------------------------------
// THE INVENTORY — a grid of slots, Minecraft style. Most are empty for
// now... which is really a to-do list for future treasure.
// ---------------------------------------------------------------------
function drawInventory() {
  const W = canvas.width, H = canvas.height;

  // dim the world behind the bag
  ctx.fillStyle = 'rgba(8, 8, 22, 0.75)';
  ctx.fillRect(0, 0, W, H);

  // the panel
  const pw = Math.min(460, W - 30), ph = 300;
  const px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  ctx.fillStyle = '#23283e';
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#5a6390';
  ctx.lineWidth = 3;
  ctx.strokeRect(px, py, pw, ph);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('INVENTORY', W / 2, py + 38);

  // a 4x2 grid of slots
  const cols = 4, rows = 2, slot = Math.min(78, (pw - 60) / cols), gap = 12;
  const gridW = cols * slot + (cols - 1) * gap;
  const startX = W / 2 - gridW / 2, startY = py + 62;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const sx = startX + c * (slot + gap), sy = startY + r * (slot + gap);
      ctx.fillStyle = '#161a2b';
      ctx.fillRect(sx, sy, slot, slot);
      ctx.strokeStyle = '#3a4162';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx, sy, slot, slot);
    }
  }

  // SLOT 1: the trusty sword (drawn big and tilted, like it's on display)
  ctx.save();
  ctx.translate(startX + slot / 2, startY + slot / 2);
  ctx.rotate(-Math.PI / 4);
  ctx.scale(1.8, 1.8);
  ctx.fillStyle = '#5b3b1e'; ctx.fillRect(-14, -2, 7, 4);     // handle
  ctx.fillStyle = '#c9a83c'; ctx.fillRect(-8, -5, 3, 10);     // crossguard
  ctx.fillStyle = hasGoldSword ? '#f2c94c' : '#dbe4ee'; ctx.fillRect(-5, -2, 17, 4);     // blade
  ctx.fillStyle = hasGoldSword ? '#fff3b8' : '#ffffff'; ctx.fillRect(-5, -2, 17, 1.5);   // shiny edge
  ctx.restore();
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '13px monospace';
  ctx.fillText(hasGoldSword ? 'Golden Sword' : 'Sword', startX + slot / 2, startY + slot + 16);

  // SLOT 2: emeralds, with how many you've got
  const ex = startX + slot + gap + slot / 2, ey = startY + slot / 2;
  ctx.save();
  ctx.translate(ex, ey);
  ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(-11, -11, 22, 22);
  ctx.strokeStyle = '#aaffcc';
  ctx.lineWidth = 2;
  ctx.strokeRect(-11, -11, 22, 22);
  ctx.restore();
  ctx.fillStyle = '#cdd6f4';
  ctx.font = '13px monospace';
  ctx.fillText('Emeralds x ' + emeraldCount, ex, startY + slot + 16);

  // SLOT 3: your armor — plate, infected, or gecko skin
  if (hasArmor || hasInfectedArmor || hasGeckoArmor) {
    const ax = startX + 2 * (slot + gap) + slot / 2;
    drawChestplate(ax, startY + slot / 2, 1.6,
                   hasGeckoArmor ? 'gecko' : hasInfectedArmor ? 'infected' : 'plate');
    ctx.fillStyle = '#cdd6f4';
    ctx.font = '13px monospace';
    ctx.fillText(hasGeckoArmor ? 'Gecko Skin Armor'
               : hasInfectedArmor ? 'Infected Armor' : 'Plate Armor', ax, startY + slot + 16);
  }

  // SLOT 4: CHIPPY! (he insisted on a corner slot with a view)
  if (hasChippy) {
    const cx4 = startX + 3 * (slot + gap) + slot / 2;
    ctx.save();
    ctx.translate(cx4, startY + slot / 2);
    ctx.rotate(-Math.PI / 4);
    ctx.scale(1.5, 1.5);
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(-14, -2, 24, 4);
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(6, -11, 9, 18);
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(13, -11, 3, 18);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(7.5, -8, 3, 3); ctx.fillRect(7.5, 1, 3, 3);
    ctx.fillStyle = '#222'; ctx.fillRect(8.5, -7, 1.5, 1.5); ctx.fillRect(8.5, 2, 1.5, 1.5);
    ctx.restore();
    ctx.fillStyle = '#cdd6f4';
    ctx.font = '13px monospace';
    ctx.fillText('Chippy', cx4, startY + slot + 16);
  }

  ctx.fillStyle = '#8890b8';
  ctx.font = '14px monospace';
  ctx.fillText('(the empty slots are waiting for future treasure...)', W / 2, py + ph - 40);
  ctx.fillText('E to close', W / 2, py + ph - 18);
}

function drawTree(t, cam) {
  const x = t.x - cam.x, y = t.y - cam.y;
  if (x < -60 || y < -80 || x > canvas.width + 60 || y > canvas.height + 80) return;

  // shadow on the grass
  ctx.fillStyle = 'rgba(0,0,0,0.20)';
  ctx.beginPath();
  ctx.ellipse(x + 6, y + 5, 24 * t.size, 10 * t.size, 0, 0, Math.PI * 2);
  ctx.fill();

  // trunk
  ctx.fillStyle = '#3f2a15';
  ctx.fillRect(x - 5 * t.size, y - 18 * t.size, 10 * t.size, 20 * t.size);

  // blocky leaf top — gloomy green in the forest, but in Chippy's
  // dimension the trees grow PURPLE. dimension rules.
  const g = 55 + noise(t.x * 0.13 + t.y) * 35;
  ctx.fillStyle = current.kind === 'chippy'
    ? `rgb(${Math.floor(g + 35)}, 40, ${Math.floor(g + 65)})`
    : `rgb(22, ${Math.floor(g)}, 30)`;
  ctx.fillRect(x - 24 * t.size, y - 58 * t.size, 48 * t.size, 44 * t.size);
  // a faint square of moonlight on the leaves
  ctx.fillStyle = 'rgba(200,220,255,0.10)';
  ctx.fillRect(x - 18 * t.size, y - 52 * t.size, 16 * t.size, 12 * t.size);
}

function drawPlayer(cam) {
  const x = player.x - cam.x, y = player.y - cam.y;
  // a tiny hop while walking — this one line is the whole "walk animation"
  const bob = player.moving ? Math.abs(Math.sin(player.walkTime * 10)) * 4 : 0;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // body — regular shirt, plate armor, infected armor... or GECKO SKIN,
  // green and scaly with a tiny tail (yes, really)
  ctx.fillStyle = hasGeckoArmor ? '#3f8a3f'
                : hasInfectedArmor ? '#3a3345'
                : hasArmor ? '#b8c4d0' : '#c98a3d';
  ctx.fillRect(x - 8, y - 14 - bob, 16, 16);
  if (hasGeckoArmor) {
    ctx.fillStyle = '#8fce8f';                 // pale gecko belly stripe
    ctx.fillRect(x - 3, y - 14 - bob, 6, 16);
    ctx.fillStyle = '#2f6a2f';                 // scales
    ctx.fillRect(x - 7, y - 11 - bob, 2, 2);
    ctx.fillRect(x + 5, y - 8 - bob, 2, 2);
    ctx.fillRect(x - 6, y - 4 - bob, 2, 2);
    ctx.fillStyle = '#3f8a3f';                 // the tiny tail
    ctx.fillRect(x - 13 * player.facing - 3, y - 4 - bob, 7, 3);
  } else if (hasInfectedArmor) {
    ctx.fillStyle = '#7c5cc9';                 // glowing shoulder plate
    ctx.fillRect(x - 8, y - 14 - bob, 16, 3);
    ctx.fillStyle = '#b06cff';                 // the infection's veins
    ctx.fillRect(x - 1, y - 11 - bob, 3, 12);
    ctx.fillRect(x - 6, y - 8 - bob, 2, 5);
    ctx.fillRect(x + 4, y - 6 - bob, 2, 5);
  } else if (hasArmor) {
    ctx.fillStyle = '#dde6ee';                 // shine across the shoulders
    ctx.fillRect(x - 8, y - 14 - bob, 16, 3);
    ctx.fillStyle = '#8b98a8';                 // ridge down the middle
    ctx.fillRect(x - 1, y - 11 - bob, 3, 12);
  }

  // square head
  ctx.fillStyle = '#f2c79b';
  ctx.fillRect(x - 7, y - 30 - bob, 14, 14);

  // explorer hat: flat brim + flat top
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(x - 11, y - 30 - bob, 22, 4);
  ctx.fillRect(x - 7, y - 36 - bob, 14, 7);

  // a square eye on whichever side you're facing
  ctx.fillStyle = '#222';
  ctx.fillRect(x + 3 * player.facing, y - 25 - bob, 3, 3);

  // ---- THE SWORD ----
  // progress goes 0 -> 1 during a swing. The blade sweeps a big arc.
  const swinging = player.attackTime > 0;
  const progress = swinging ? 1 - player.attackTime / 0.25 : 0;

  ctx.save();                                    // remember normal drawing
  ctx.translate(x + 9 * player.facing, y - 8 - bob);  // move pen to your hand
  if (player.facing === -1) ctx.scale(-1, 1);    // facing left? mirror everything
  // resting angle points the blade down; swinging sweeps it up-and-over
  ctx.rotate(swinging ? (-1.3 + 2.6 * progress) : 1.0);

  if (hasChippy) {
    // CHIPPY — a living axe, and he's THRILLED to be swung
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(0, -2, 20, 4);     // long handle
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(16, -11, 9, 18);   // axe head
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(23, -11, 3, 18);   // the sharp bit
    ctx.fillStyle = '#ffffff';                                 // his eyes!
    ctx.fillRect(17.5, -8, 3, 3); ctx.fillRect(17.5, 1, 3, 3);
    ctx.fillStyle = '#222';
    ctx.fillRect(18.5, -7, 1.5, 1.5); ctx.fillRect(18.5, 2, 1.5, 1.5);
  } else {
    ctx.fillStyle = '#5b3b1e'; ctx.fillRect(0, -2, 7, 4);      // handle
    ctx.fillStyle = '#c9a83c'; ctx.fillRect(6, -5, 3, 10);     // crossguard
    ctx.fillStyle = hasGoldSword ? '#f2c94c' : '#dbe4ee'; ctx.fillRect(9, -2, 17, 4);     // blade
    ctx.fillStyle = hasGoldSword ? '#fff3b8' : '#ffffff'; ctx.fillRect(9, -2, 17, 1.5);   // shiny edge
  }

  // the whoosh trail, fading out as the swing finishes
  if (swinging) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - progress)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 26, -1.3, -1.3 + 2.6 * progress);
    ctx.stroke();
  }
  ctx.restore();                                 // put the pen back to normal
}

// ---------------------------------------------------------------------
// A ZOMBIE — blocky green head, ragged shirt, grabby little arms
// ---------------------------------------------------------------------
function drawZombie(z, cam) {
  const x = z.x - cam.x, y = z.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;

  // a buried sand zombie is just... a suspicious lump in the walkway
  if (z.buried) {
    const breathe = Math.sin(elapsed * 2 + z.x) * 1.5;   // it's ever so slightly moving
    ctx.fillStyle = '#8f7c54';
    ctx.beginPath();
    ctx.ellipse(x, y, 15, 7 + breathe, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a3854a';
    ctx.beginPath();
    ctx.ellipse(x - 2, y - 2, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  // ---- THE MULTI-TASKER: a giant blob, one huge eye, 16 arms ----
  if (z.boss) {
    const flash = z.hurtFlash > 0;
    const wob = elapsed * 2.5;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + 34, 60, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    // 16 ARMS first, so they reach out from UNDER the blob. Every third
    // arm is a zombie arm or a skeleton arm — parts of everyone it's
    // ever absorbed. It multi-tasks.
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2 + Math.sin(wob + a) * 0.1;
      const reach = 46 + Math.sin(elapsed * 4 + a * 2.3) * 8;   // grasping in and out
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.fillStyle = flash ? '#ffffff'
                    : a % 3 === 0 ? '#4a9e4a'      // a stolen zombie arm
                    : a % 3 === 1 ? '#e8e8e2'      // a stolen skeleton arm
                    : '#26262e';                   // its own goo arm
      ctx.fillRect(30, -3, reach - 24, 6);
      ctx.fillRect(reach + 4, -5, 8, 10);          // the grabby hand
      ctx.restore();
    }

    // THE BLOB — a ring of points whose radius ripples, so the edge wobbles
    ctx.fillStyle = flash ? '#ffffff' : '#1a1a20';
    ctx.beginPath();
    for (let k = 0; k <= 20; k++) {
      const ang = (k / 20) * Math.PI * 2;
      const r = 48 + Math.sin(wob * 1.4 + k * 1.9) * 6;
      const px2 = x + Math.cos(ang) * r;
      const py2 = y + Math.sin(ang) * r * 0.85;
      if (k === 0) ctx.moveTo(px2, py2);
      else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();

    // absorbed PARTS poking out of the goo
    ctx.fillStyle = '#e8e8e2';                     // a skull, half sunk
    ctx.fillRect(x - 38, y - 18 + Math.sin(wob) * 3, 12, 12);
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 36, y - 14 + Math.sin(wob) * 3, 3, 3);
    ctx.fillRect(x - 31, y - 14 + Math.sin(wob) * 3, 3, 3);
    ctx.fillStyle = '#4a9e4a';                     // a zombie head, still frowning
    ctx.fillRect(x + 26, y - 24 + Math.cos(wob) * 3, 13, 13);
    ctx.fillStyle = '#1c3b1c';
    ctx.fillRect(x + 29, y - 20 + Math.cos(wob) * 3, 3, 3);
    ctx.fillRect(x + 34, y - 20 + Math.cos(wob) * 3, 3, 3);
    ctx.fillStyle = '#e8e8e2';                     // one bony leg going nowhere
    ctx.fillRect(x - 6, y + 26, 5, 14);

    // THE EYE — one giant eye in the middle... and it WATCHES you.
    // The pupil slides toward wherever the player is standing.
    const look = Math.hypot(player.x - z.x, player.y - z.y) || 1;
    const lx = (player.x - z.x) / look * 5;
    const ly = (player.y - z.y) / look * 5;
    ctx.fillStyle = '#f4f0e8';
    ctx.beginPath(); ctx.arc(x, y - 2, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b06cff';
    ctx.beginPath(); ctx.arc(x + lx, y - 2 + ly, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(x + lx, y - 2 + ly, 4.5, 0, Math.PI * 2); ctx.fill();
    return;
  }

  // ---- THE GIANT: nine eyes, spider legs, zero manners ----
  if (z.giant) {
    const stomp = Math.abs(Math.sin(elapsed * 4 + z.x)) * 4;   // heavy stomps
    const flash = z.hurtFlash > 0;

    // spider legs FIRST, so they come out from BEHIND the body
    ctx.strokeStyle = '#141418';
    ctx.lineWidth = 3;
    for (let leg = 0; leg < 4; leg++) {
      for (const side of [-1, 1]) {
        const wiggle = Math.sin(elapsed * 6 + leg * 1.7 + z.x) * 4;   // skitter skitter
        const spread = 14 + leg * 9;
        ctx.beginPath();
        ctx.moveTo(x + 6 * side, y - 38 - stomp);                   // out of the back
        ctx.lineTo(x + spread * side, y - 52 - leg * 3 + wiggle);   // up to the knee
        ctx.lineTo(x + (spread + 12) * side, y - 20 + wiggle);      // down to a point
        ctx.stroke();
      }
    }

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y + 10, 20, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = flash ? '#ffffff' : '#26262e';   // huge ragged body
    ctx.fillRect(x - 14, y - 26 - stomp, 28, 30);
    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';   // big square head
    ctx.fillRect(x - 12, y - 52 - stomp, 24, 26);

    // NINE glowing purple eyes — three rows of three
    ctx.fillStyle = '#b06cff';
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        ctx.fillRect(x - 8 + col * 7, y - 47 + row * 7 - stomp, 3, 3);
      }
    }

    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';   // massive grabby arms
    ctx.fillRect(x - 20, y - 22 - stomp, 6, 16);
    ctx.fillRect(x + 14, y - 22 - stomp, 6, 16);
    return;
  }

  const stomp = Math.abs(Math.sin(elapsed * 6 + z.x)) * 3;   // shamble-bounce

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 11, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // when bonked, the whole zombie flashes white for a blink
  const flash = z.hurtFlash > 0;
  // black zombies are shadow-dark; sand zombies wear desert colors;
  // forest zombies keep the classics
  const shirt = z.black ? '#26262e' : z.sand ? '#a3854a' : '#2e6e8e';
  const skin  = z.black ? '#1c1c22' : z.sand ? '#cbb06a' : '#4a9e4a';

  ctx.fillStyle = flash ? '#ffffff' : shirt;       // ragged shirt
  ctx.fillRect(x - 8, y - 14 - stomp, 16, 16);
  ctx.fillStyle = flash ? '#ffffff' : skin;        // square head
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  if (z.black) {
    // SIX glowing purple eyes, two rows of three
    ctx.fillStyle = '#b06cff';
    for (let e = 0; e < 3; e++) {
      ctx.fillRect(x - 5 + e * 4, y - 27 - stomp, 2, 2);
      ctx.fillRect(x - 5 + e * 4, y - 23 - stomp, 2, 2);
    }
  } else {
    ctx.fillStyle = z.sand ? '#4a3b1c' : '#1c3b1c';  // those eyes...
    ctx.fillRect(x - 5, y - 25 - stomp, 3, 3);
    ctx.fillRect(x + 2, y - 25 - stomp, 3, 3);
  }
  ctx.fillStyle = flash ? '#ffffff' : skin;        // grabby arms, reaching for YOU
  ctx.fillRect(x - 12, y - 12 - stomp, 4, 9);
  ctx.fillRect(x + 8, y - 12 - stomp, 4, 9);
}

// ---------------------------------------------------------------------
// A SKELETON — bones, spear, bad intentions
// ---------------------------------------------------------------------
function drawSkeleton(s, cam) {
  const x = s.x - cam.x, y = s.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;
  const stomp = Math.abs(Math.sin(elapsed * 8 + s.x)) * 3;   // quick rattly steps

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 10, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // skeletons are already white, so they flash RED when bonked
  const bone = s.hurtFlash > 0 ? '#ff9a9a' : '#e8e8e2';

  ctx.fillStyle = bone;                            // ribcage body
  ctx.fillRect(x - 6, y - 14 - stomp, 12, 16);
  ctx.fillStyle = s.hurtFlash > 0 ? '#e07a7a' : '#b0b0a8';
  ctx.fillRect(x - 6, y - 10 - stomp, 12, 2);      // rib lines
  ctx.fillRect(x - 6, y - 5 - stomp, 12, 2);
  ctx.fillStyle = bone;                            // skull
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  ctx.fillStyle = '#222';                          // hollow eye sockets
  ctx.fillRect(x - 5, y - 25 - stomp, 4, 4);
  ctx.fillRect(x + 1, y - 25 - stomp, 4, 4);

  // THE SPEAR — a long shaft with a gray point, held out front
  ctx.save();
  ctx.translate(x + 8 * s.facing, y - 12 - stomp);
  if (s.facing === -1) ctx.scale(-1, 1);
  ctx.rotate(-0.35);                               // tilted, ready to poke
  ctx.fillStyle = '#8a6b3f';
  ctx.fillRect(-6, -1.5, 30, 3);                   // wooden shaft
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(24, -3, 8, 6);                      // the pointy end
  ctx.restore();
}

// ---------------------------------------------------------------------
// A CREEPER — that face. THAT face. It flashes and swells when lit.
// ---------------------------------------------------------------------
function drawCreeper(c, cam) {
  const x = c.x - cam.x, y = c.y - cam.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;

  const lit = c.fuse > 0;
  // swell = it puffs up bigger and bigger as the fuse burns down
  const swell = lit ? 1 + (1.1 - c.fuse) * 0.25 : 1;
  const flash = c.hurtFlash > 0 || (lit && Math.floor(elapsed * 12) % 2 === 0);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 11 * swell, 5 * swell, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? '#ffffff' : '#3faf3f';
  ctx.fillRect(x - 8 * swell, y - 16 * swell, 16 * swell, 18 * swell);  // body
  ctx.fillRect(x - 8 * swell, y - 33 * swell, 16 * swell, 16 * swell);  // head
  ctx.fillRect(x - 9 * swell, y - 2, 7, 5);                             // stubby feet
  ctx.fillRect(x + 2 * swell, y - 2, 7, 5);

  // the famous frown
  ctx.fillStyle = '#143814';
  ctx.fillRect(x - 6 * swell, y - 29 * swell, 4, 4);   // eyes
  ctx.fillRect(x + 2 * swell, y - 29 * swell, 4, 4);
  ctx.fillRect(x - 3 * swell, y - 24 * swell, 6, 4);   // nose-mouth
  ctx.fillRect(x - 5 * swell, y - 21 * swell, 4, 5);   // frown corners
  ctx.fillRect(x + 1 * swell, y - 21 * swell, 4, 5);
}

// ---------------------------------------------------------------------
// A STONE PILLAR — ancient, mossy, very in-the-way
// ---------------------------------------------------------------------
function drawPillar(p, cam) {
  const x = p.x - cam.x, y = p.y - cam.y;
  if (x < -60 || y < -100 || x > canvas.width + 60 || y > canvas.height + 100) return;
  const s = p.size;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 5, y + 5, 20 * s, 8 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#565851'; ctx.fillRect(x - 17 * s, y - 8 * s, 34 * s, 12 * s);   // base
  ctx.fillStyle = '#75776e'; ctx.fillRect(x - 13 * s, y - 62 * s, 26 * s, 58 * s);  // shaft
  ctx.fillStyle = '#8b8d83'; ctx.fillRect(x - 13 * s, y - 62 * s, 8 * s, 58 * s);   // lit edge
  // moss patches — noise() means each pillar keeps its own moss forever
  ctx.fillStyle = '#3f6a34';
  if (noise(p.x * 1.7) > 0.4) ctx.fillRect(x - 13 * s, y - 30 * s, 10 * s, 12 * s);
  if (noise(p.y * 2.3) > 0.5) ctx.fillRect(x + 2 * s, y - 52 * s, 9 * s, 10 * s);
  ctx.fillStyle = '#63655c'; ctx.fillRect(x - 17 * s, y - 70 * s, 34 * s, 10 * s);  // cap
}

// ---------------------------------------------------------------------
// A FALLEN LOG — chopped long ago, lying where it fell
// ---------------------------------------------------------------------
function drawLog(l, cam) {
  const x = l.x - cam.x, y = l.y - cam.y;
  if (x < -l.len || y < -60 || x > canvas.width + l.len || y > canvas.height + 60) return;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 4, y + 6, l.len / 2 + 8, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#5a4126';                       // the log itself
  ctx.fillRect(x - l.len / 2, y - 22, l.len, 22);
  ctx.fillStyle = '#6d5330';                       // bark stripes
  for (let s2 = 0; s2 < l.len - 8; s2 += 18) {
    ctx.fillRect(x - l.len / 2 + s2, y - 22, 8, 22);
  }
  ctx.fillStyle = '#8a6b3f';                       // the pale cut end
  ctx.beginPath();
  ctx.ellipse(x + l.len / 2, y - 11, 7, 11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#6d5330';                     // one tree ring
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(x + l.len / 2, y - 11, 3.5, 5.5, 0, 0, Math.PI * 2);
  ctx.stroke();
}

// ---------------------------------------------------------------------
// A WALL BLOCK — big sandstone bricks lining the walkway
// ---------------------------------------------------------------------
function drawWall(w, cam) {
  const x = w.x - cam.x, y = w.y - cam.y;
  if (x < -60 || y < -90 || x > canvas.width + 60 || y > canvas.height + 90) return;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + 5, y + 5, 23, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // sandstone temple, gray castle, purple Jr temple, mossy gecko temple,
  // near-black dungeon
  const base = w.dg ? '#17171d' : w.gt ? '#22331f' : w.jr ? '#332c40' : w.castle ? '#4a4b50' : '#6d6250';
  const face = w.dg ? '#2a2a33' : w.gt ? '#3c5442' : w.jr ? '#453e54' : w.castle ? '#5d5f66' : '#8a7c5e';
  const top  = w.dg ? '#40404d' : w.gt ? '#527a5c' : w.jr ? '#5d5470' : w.castle ? '#787a82' : '#9c8e6e';

  if (w.broken) {
    // a crumbled stub — smashed down to knee height, jagged on top
    ctx.fillStyle = base; ctx.fillRect(x - 22, y - 8, 44, 12);
    ctx.fillStyle = face; ctx.fillRect(x - 22, y - 26, 44, 20);
    ctx.fillStyle = top;  ctx.fillRect(x - 22, y - 26, 14, 5);
    ctx.fillStyle = face; ctx.fillRect(x + 2, y - 34, 12, 10);    // one taller jag
    ctx.fillStyle = top;  ctx.fillRect(x + 2, y - 34, 12, 4);
    return;
  }

  ctx.fillStyle = base; ctx.fillRect(x - 22, y - 10, 44, 14);   // base
  ctx.fillStyle = face; ctx.fillRect(x - 22, y - 52, 44, 44);   // the wall itself
  ctx.fillStyle = top;  ctx.fillRect(x - 22, y - 52, 44, 10);   // top edge
  // brick cracks — noise() gives each block its own crack pattern
  ctx.fillStyle = 'rgba(40, 32, 20, 0.35)';
  ctx.fillRect(x - 22, y - 31, 44, 2);
  ctx.fillRect(x - 4 + noise(w.x) * 8, y - 52, 2, 21);
  ctx.fillRect(x - 14 + noise(w.y) * 8, y - 29, 2, 19);
}

// ---------------------------------------------------------------------
// A TORCH — a stick with a flickering flame on top
// ---------------------------------------------------------------------
function drawTorch(t, cam) {
  const x = t.x - cam.x, y = t.y - cam.y;
  if (x < -30 || y < -50 || x > canvas.width + 30 || y > canvas.height + 50) return;
  ctx.fillStyle = '#5b3b1e';
  ctx.fillRect(x - 2, y - 26, 5, 26);
  const flick = noise(Math.floor(elapsed * 8) + t.x) * 3;   // flame wobble
