// ---------------------------------------------------------------------
// SOUND — for the thing that roars. Deeper down here. Much deeper.
// ---------------------------------------------------------------------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx && window.AudioContext) audioCtx = new AudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function deepRoar() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const g1 = audioCtx.createOscillator();
  const g2 = audioCtx.createOscillator();
  const muffle = audioCtx.createBiquadFilter();
  const vol = audioCtx.createGain();
  g1.type = 'sawtooth';
  g1.frequency.setValueAtTime(55, t);
  g1.frequency.exponentialRampToValueAtTime(16, t + 4.2);
  g2.type = 'square';
  g2.frequency.setValueAtTime(38, t);
  g2.frequency.exponentialRampToValueAtTime(13, t + 4.2);
  muffle.type = 'lowpass';
  muffle.frequency.value = 180;
  vol.gain.setValueAtTime(0.0001, t);
  vol.gain.exponentialRampToValueAtTime(0.5, t + 0.25);
  vol.gain.exponentialRampToValueAtTime(0.35, t + 2.8);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + 5);
  g1.connect(muffle); g2.connect(muffle);
  muffle.connect(vol); vol.connect(audioCtx.destination);
  g1.start(t); g2.start(t);
  g1.stop(t + 5.2); g2.stop(t + 5.2);
}

// a pocket randomness machine — same number in, same "random" out
function noise(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

const T4_PATH = [

  { x: 780,  y: 1540 }, { x: 760,  y: 1320 }, { x: 960,  y: 1200 },
  { x: 1200, y: 1260 }, { x: 1380, y: 1150 }, { x: 1360, y: 930 },

function distToAnyPath(x, y, paths) {
  let best = 999999;
  for (const p of paths) best = Math.min(best, distToPath(x, y, p));
  return best;
}

function distToPath(x, y, path) {
  let best = 999999;
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
    best = Math.min(best, Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy)));
  }
  return best;
}

// terrain — rebuilt fresh by each level's builder
let rocks = [];       // stalagmites (and, in the temple, wall blocks)
let crystals = [];    // the glowing lanterns of the deep
let mushrooms = [];   // tiny glowing floor stars

function blocked(x, y, r) {
  r = r || 12;
  if (x < 20 || y < 20 || x > worldW - 20 || y > worldH - 20) return true;
  for (const t of rocks) {
    const chunk = t.wall ? 20 : 14 * t.size;
    if (Math.hypot(x - t.x, y - t.y) < r + chunk) return true;
  }
  for (const c of crystals) {
    if (Math.hypot(x - c.x, y - c.y) < r + 10 * c.size) return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// THE EXPLORER — same hero, deeper hole
// ---------------------------------------------------------------------
const player = {
  x: START.x, y: START.y,
  radius: 12,
  speed: 230 * (hasGeckoArmor ? 1.15 : 1),   // gecko scales still make you quick
  facing: 1,
  walkTime: 0,
  moving: false,
  attackTime: 0,
  swingId: 0,
  hp: 5, maxHp: 5,
  armor: armorMax(),

};
let armorRegen = 0;

// ---------------------------------------------------------------------
// THE LOCALS — two creatures no explorer has ever met before
// ---------------------------------------------------------------------
// CAVE BATS: they fly (rocks mean nothing to them), swoop fast, pop in
// one hit. ROCK CRAWLERS: armored beetles of living stone. Slow. Tough.
let bats = [];
let crawlers = [];
let zombies = [];       // all three kinds, plus the nine-eyed giants
let skeletons = [];
let creepers = [];
let emeralds = [];
let particles = [];
let emeraldCount = 0;

// a random spot in the cavern, away from the start, the Door, and rocks
function wildSpot(seed) {
  for (let tries = 0; tries < 40; tries++) {
    const x = 100 + noise(seed * 13.7 + tries * 3.1) * (worldW - 200);
    const y = 100 + noise(seed * 29.3 + tries * 7.7) * (worldH - 200);
    if (Math.hypot(x - START.x, y - START.y) < 380) continue;
    if (Math.hypot(x - DOOR.x, y - DOOR.y) < 320) continue;
    if (blocked(x, y, 12)) continue;
    return { x, y };
  }
  return null;
}

// a random spot along the temple corridor, for level 2's population
function pathSpot(seed) {
  for (let tries = 0; tries < 60; tries++) {
    const x = noise(seed * 17.9 + tries * 3.3) * worldW;
    const y = noise(seed * 31.1 + tries * 7.1) * worldH;
    if (distToPath(x, y, T2_PATH) > 65) continue;
    if (Math.hypot(x - START.x, y - START.y) < 350) continue;
    if (Math.hypot(x - T2_CHAMBER.x, y - T2_CHAMBER.y) < 280) continue;
    if (blocked(x, y, 12)) continue;
    return { x, y };
  }
  return null;
}

// fill the cavern fresh — called every time you enter the level
function buildCavern() {
  worldW = 2400; worldH = 2400;
  START = { x: 1200, y: 2150 };

  // stalagmites — the cave's version of trees
  rocks = [];
  for (let i = 0; i < 120; i++) {
    const x = 80 + noise(i * 3.17) * (worldW - 160);
    const y = 80 + noise(i * 7.71) * (worldH - 160);
    if (Math.hypot(x - START.x, y - START.y) < 170) continue;
    if (Math.hypot(x - DOOR.x, y - DOOR.y) < 260) continue;
    rocks.push({ x, y, size: 0.7 + noise(i * 13.3) * 0.8 });
  }
  for (let x = 30; x < worldW; x += 60) {
    rocks.push({ x: x + noise(x) * 25, y: 25, size: 1.1 });
    rocks.push({ x: x + noise(x * 3) * 25, y: worldH - 25, size: 1.1 });
  }
  for (let y = 30; y < worldH; y += 60) {
    rocks.push({ x: 25, y: y + noise(y * 5) * 25, size: 1.1 });
    rocks.push({ x: worldW - 25, y: y + noise(y * 7) * 25, size: 1.1 });
  }
  crystals = [];
  for (let i = 0; i < 40; i++) {
    crystals.push({
      x: 120 + noise(i * 21.3 + 5) * (worldW - 240),
      y: 120 + noise(i * 47.7 + 5) * (worldH - 240),
      size: 0.7 + noise(i * 5.5) * 0.8,
      hue: noise(i * 9.9) < 0.7 ? 'cyan' : 'violet',
    });
  }
  mushrooms = [];
  for (let i = 0; i < 150; i++) {
    mushrooms.push({ x: noise(i * 31.7 + 9) * worldW,
                     y: noise(i * 77.1 + 9) * worldH, glow: noise(i * 3.3) });
  }

  bats = [];
  for (let i = 0; i < 500 && bats.length < 12; i++) {
    const x = noise(i * 61.3 + 11) * WORLD_W;
    const y = noise(i * 37.9 + 11) * WORLD_H;
    if (Math.hypot(x - START.x, y - START.y) < 350) continue;
    if (Math.hypot(x - DOOR.x, y - DOOR.y) < 300) continue;
    bats.push({ x, y, hp: 1, wander: noise(i) * 6.28, flap: noise(i * 2) * 6.28,
                lastHitSwing: 0, hurtFlash: 0 });
  }
  crawlers = [];
  for (let i = 0; i < 500 && crawlers.length < 8; i++) {
    const x = noise(i * 43.9 + 13) * WORLD_W;
    const y = noise(i * 29.3 + 13) * WORLD_H;
    if (Math.hypot(x - START.x, y - START.y) < 350) continue;
    if (Math.hypot(x - DOOR.x, y - DOOR.y) < 300) continue;
    if (blocked(x, y, 10)) continue;
    crawlers.push({ x, y, hp: 3, wander: noise(i * 1.7) * 6.28,
                    lastHitSwing: 0, hurtFlash: 0 });
  }
  // ---- EVERY CREATURE FROM THE WHOLE SAGA fell down here too ----
  zombies = [];
  for (let i = 0; i < 3; i++) {
    const p = wildSpot(i + 101);
    if (p) zombies.push({ x: p.x, y: p.y, hp: 2, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 3; i++) {
    const p = wildSpot(i + 111);
    if (p) zombies.push({ x: p.x, y: p.y, sand: true, hp: 3, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 3; i++) {
    const p = wildSpot(i + 121);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, hp: 3, speed: 95,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  for (let i = 0; i < 2; i++) {
    const p = wildSpot(i + 131);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, giant: true, hp: 6, speed: 60,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  skeletons = [];
  for (let i = 0; i < 4; i++) {
    const p = wildSpot(i + 141);
    if (p) skeletons.push({ x: p.x, y: p.y, hp: 2, facing: 1,
                            wander: noise(i * 1.7) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }
  creepers = [];
  for (let i = 0; i < 5; i++) {
    const p = wildSpot(i + 151);
    if (p) creepers.push({ x: p.x, y: p.y, hp: 2, fuse: 0,
                           wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 });
  }

  boss = null;                       // no sixteen-eyed anything in level 1
  sleeper = null;
  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.x = START.x;
  player.y = START.y;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

function startLevel(i) {
  if (!LEVELS2[i] || !LEVELS2[i].unlocked) {
    lockedText = i === 1 ? 'Beat Abyssal Madness first — find the Door!'
               : i === 2 ? 'Defeat the Abyssal Multi-Tasker first!'
               : i === 3 ? 'Defeat the Thing behind the Door first!'
               : "You haven't invented that level yet!";
    lockedTimer = 2;
    return;
  }
  currentLevel = i;
  if (i === 3) buildEscape();
  else if (i === 2) buildFinale();
  else if (i === 1) buildTemple2();
  else buildCavern();
  roarTimer = 8;
  doorDone = false;
  doorBanner = 0;
  bossBanner = 0;
  screen = 'playing';
}

// ---------------------------------------------------------------------
// LEVEL 2: GOING INSANE — the temple behind the Door. A corridor that
// winds and winds and WINDS, walled in abyssal stone, lit by crystals,
// with every creature waiting... and sixteen eyes at the end of it.
// ---------------------------------------------------------------------
let boss = null;          // THE ABYSSAL MULTI-TASKER (level 2)
let bossBanner = 0;

// LEVEL 3's sleeper — the thing at the end of the abyss
let sleeper = null;
let glitchTimer = 0;      // while > 0, reality is having a bad moment
let glitchWait = 8;       // seconds until reality's next bad moment
let hasEnd = localStorage.getItem('explorer2_end') === 'yes';

function buildTemple2() {
  worldW = 3000; worldH = 3000;
  START = { x: T2_PATH[0].x, y: T2_PATH[0].y - 40 };

  // the walls: a sealed band of abyssal stone hugging every bend
  rocks = [];
  for (let gx = 40; gx < worldW - 40; gx += 34) {
    for (let gy = 40; gy < worldH - 40; gy += 34) {
      const d = distToPath(gx, gy, T2_PATH);
      if (d < 100 || d > 140) continue;
      if (Math.hypot(gx - T2_CHAMBER.x, gy - T2_CHAMBER.y) < 195) continue;
      rocks.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true,
      });
    }
  }
  // the boss chamber: a ring of stone with one doorway, facing the path
  for (let ang = 0; ang < Math.PI * 2; ang += 0.26) {
    if (Math.abs(ang - Math.PI / 2) < 0.5) continue;
    const wx = T2_CHAMBER.x + Math.cos(ang) * 205;
    const wy = T2_CHAMBER.y + Math.sin(ang) * 205;
    if (wx < 60 || wy < 60 || wx > worldW - 60 || wy > worldH - 60) continue;
    rocks.push({ x: wx, y: wy, size: 1, wall: true });
  }
  // stalagmite scenery out beyond the walls
  for (let i = 0; i < 90; i++) {
    const x = 80 + noise(i * 3.17 + 55) * (worldW - 160);
    const y = 80 + noise(i * 7.71 + 55) * (worldH - 160);
    if (distToPath(x, y, T2_PATH) < 170) continue;
    if (Math.hypot(x - T2_CHAMBER.x, y - T2_CHAMBER.y) < 260) continue;
    rocks.push({ x, y, size: 0.7 + noise(i * 13.3) * 0.8 });
  }

  // crystals line the corridor like torches — the only light down here
  crystals = [];
  for (let i = 0; i < T2_PATH.length - 1; i += 2) {
    const a = T2_PATH[i], b = T2_PATH[i + 1];
    crystals.push({ x: (a.x + b.x) / 2 + 62, y: (a.y + b.y) / 2,
                    size: 0.8 + noise(i * 5.5) * 0.4,
                    hue: noise(i * 9.9) < 0.6 ? 'violet' : 'cyan' });
    crystals.push({ x: (a.x + b.x) / 2 - 62, y: (a.y + b.y) / 2,
                    size: 0.8 + noise(i * 7.7) * 0.4,
                    hue: noise(i * 3.3) < 0.6 ? 'cyan' : 'violet' });
  }
  // and a crown of crystals around the boss chamber
  for (let ang = 0.9; ang < Math.PI * 2 - 0.3; ang += 0.9) {
    crystals.push({ x: T2_CHAMBER.x + Math.cos(ang) * 150,
                    y: T2_CHAMBER.y + Math.sin(ang) * 150,
                    size: 1.1, hue: 'violet' });
  }

  // glowing floor stars, scattered along the corridor
  mushrooms = [];
  for (let i = 0; i < 400; i++) {
    const x = noise(i * 31.7 + 19) * worldW;
    const y = noise(i * 77.1 + 19) * worldH;
    if (distToPath(x, y, T2_PATH) > 90) continue;
    mushrooms.push({ x, y, glow: noise(i * 3.3) });
  }

  // ---- EVERY CREATURE, and lots of them — it's a long way down ----
  bats = []; crawlers = []; zombies = []; skeletons = []; creepers = [];
  for (let i = 0; i < 14; i++) { const p = pathSpot(i + 201);
    if (p) bats.push({ x: p.x, y: p.y, hp: 1, wander: noise(i) * 6.28,
                       flap: noise(i * 2) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 10; i++) { const p = pathSpot(i + 211);
    if (p) crawlers.push({ x: p.x, y: p.y, hp: 3, wander: noise(i * 1.7) * 6.28,
                           lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = pathSpot(i + 221);
    if (p) zombies.push({ x: p.x, y: p.y, hp: 2, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = pathSpot(i + 231);
    if (p) zombies.push({ x: p.x, y: p.y, sand: true, hp: 3, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = pathSpot(i + 241);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, hp: 3, speed: 95,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 3; i++) { const p = pathSpot(i + 251);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, giant: true, hp: 6, speed: 60,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 6; i++) { const p = pathSpot(i + 261);
    if (p) skeletons.push({ x: p.x, y: p.y, hp: 2, facing: 1,
                            wander: noise(i * 1.7) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 8; i++) { const p = pathSpot(i + 271);
    if (p) creepers.push({ x: p.x, y: p.y, hp: 2, fuse: 0,
                           wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }

  // THE ABYSSAL MULTI-TASKER — sixteen eyes, and every one on you
  boss = {
    x: T2_CHAMBER.x, y: T2_CHAMBER.y,
    hp: 50, active: false,
    teleportTimer: 4.5, summonTimer: 7,
    lastHitSwing: 0, hurtFlash: 0,
  };
  sleeper = null;

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.x = START.x;
  player.y = START.y;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// spots along the finale's passage network
function t3Spot(seed) {
  for (let tries = 0; tries < 60; tries++) {
    const x = noise(seed * 19.3 + tries * 3.7) * worldW;
    const y = noise(seed * 37.7 + tries * 7.3) * worldH;
    if (distToAnyPath(x, y, T3_PATHS) > 65) continue;
    if (Math.hypot(x - START.x, y - START.y) < 350) continue;
    if (Math.hypot(x - T3_CHAMBER.x, y - T3_CHAMBER.y) < 300) continue;
    if (blocked(x, y, 12)) continue;
    return { x, y };
  }
  return null;
}

// ---------------------------------------------------------------------
// BUILD THE FINALE — Behind the Door...
// ---------------------------------------------------------------------
function buildFinale() {
  worldW = 3000; worldH = 3000;
  START = { x: T3_PATHS[0][0].x, y: T3_PATHS[0][0].y - 40 };

  // walls hug every winding passage — the whole network is sealed
  rocks = [];
  for (let gx = 40; gx < worldW - 40; gx += 34) {
    for (let gy = 40; gy < worldH - 40; gy += 34) {
      const d = distToAnyPath(gx, gy, T3_PATHS);
      if (d < 100 || d > 140) continue;
      if (Math.hypot(gx - T3_CHAMBER.x, gy - T3_CHAMBER.y) < 200) continue;
      rocks.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true,
      });
    }
  }
  // its chamber: one ring, one doorway
  for (let ang = 0; ang < Math.PI * 2; ang += 0.26) {
    if (Math.abs(ang - Math.PI / 2) < 0.5) continue;
    const wx = T3_CHAMBER.x + Math.cos(ang) * 210;
    const wy = T3_CHAMBER.y + Math.sin(ang) * 210;
    if (wx < 60 || wy < 60 || wx > worldW - 60 || wy > worldH - 60) continue;
    rocks.push({ x: wx, y: wy, size: 1, wall: true });
  }

  // crystals light the passages — and near ITS chamber, they turn RED
  crystals = [];
  for (const path of T3_PATHS) {
    for (let i = 0; i < path.length - 1; i += 2) {
      const a = path[i], b = path[i + 1];
      const nearIt = Math.hypot(a.x - T3_CHAMBER.x, a.y - T3_CHAMBER.y) < 700;
      crystals.push({ x: (a.x + b.x) / 2 + 62, y: (a.y + b.y) / 2,
                      size: 0.8 + noise(i * 5.5) * 0.4,
                      hue: nearIt ? 'red' : noise(i * 9.9) < 0.6 ? 'violet' : 'cyan' });
      crystals.push({ x: (a.x + b.x) / 2 - 62, y: (a.y + b.y) / 2,
                      size: 0.8 + noise(i * 7.7) * 0.4,
                      hue: nearIt ? 'red' : noise(i * 3.3) < 0.6 ? 'cyan' : 'violet' });
    }
  }

  mushrooms = [];
  for (let i = 0; i < 500; i++) {
    const x = noise(i * 31.7 + 29) * worldW;
    const y = noise(i * 77.1 + 29) * worldH;
    if (distToAnyPath(x, y, T3_PATHS) > 90) continue;
    mushrooms.push({ x, y, glow: noise(i * 3.3) });
  }

  // ---- EVERY CREATURE, EVERYWHERE ----
  bats = []; crawlers = []; zombies = []; skeletons = []; creepers = [];
  for (let i = 0; i < 12; i++) { const p = t3Spot(i + 301);
    if (p) bats.push({ x: p.x, y: p.y, hp: 1, wander: noise(i) * 6.28,
                       flap: noise(i * 2) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 8; i++) { const p = t3Spot(i + 311);
    if (p) crawlers.push({ x: p.x, y: p.y, hp: 3, wander: noise(i * 1.7) * 6.28,
                           lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = t3Spot(i + 321);
    if (p) zombies.push({ x: p.x, y: p.y, hp: 2, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = t3Spot(i + 331);
    if (p) zombies.push({ x: p.x, y: p.y, sand: true, hp: 3, wander: noise(i) * 6.28,
                          lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 4; i++) { const p = t3Spot(i + 341);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, hp: 3, speed: 95,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 3; i++) { const p = t3Spot(i + 351);
    if (p) zombies.push({ x: p.x, y: p.y, black: true, giant: true, hp: 6, speed: 60,
                          wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 6; i++) { const p = t3Spot(i + 361);
    if (p) skeletons.push({ x: p.x, y: p.y, hp: 2, facing: 1,
                            wander: noise(i * 1.7) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }
  for (let i = 0; i < 8; i++) { const p = t3Spot(i + 371);
    if (p) creepers.push({ x: p.x, y: p.y, hp: 2, fuse: 0,
                           wander: noise(i) * 6.28, lastHitSwing: 0, hurtFlash: 0 }); }

  // AND THE THING ITSELF — asleep in its chamber, snoring the roars
  // that have echoed through two whole games
  sleeper = {
    x: T3_CHAMBER.x, y: T3_CHAMBER.y,
    hp: 60, state: 'asleep',        // 'asleep' -> 'waking' -> 'awake'
    wakeHits: 0, wakeTimer: 0,
    blinkTimer: 3, summonTimer: 8,
    lastHitSwing: 0, hurtFlash: 0,
  };
  boss = null;
  glitchTimer = 0;
  glitchWait = 8;

  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.x = START.x;
  player.y = START.y;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// BUILD THE ESCAPE — up, up, UP, and don't look down
// ---------------------------------------------------------------------
function buildEscape() {
  worldW = 2000; worldH = 3600;
  START = { x: T4_PATH[0].x, y: T4_PATH[0].y - 30 };

  // walls seal the climb — one way up, no shortcuts
  rocks = [];
  for (let gx = 40; gx < worldW - 40; gx += 34) {
    for (let gy = 40; gy < worldH - 40; gy += 34) {
      const d = distToPath(gx, gy, T4_PATH);
      if (d < 100 || d > 140) continue;
      rocks.push({
        x: gx + (noise(gx * 1.3 + gy) - 0.5) * 8,
        y: gy + (noise(gy * 2.7 + gx) - 0.5) * 8,
        size: 1, wall: true,
      });
    }
  }

  // crystals flicker along the climb — the deep is dying, so are they
  crystals = [];
  for (let i = 0; i < T4_PATH.length - 1; i += 2) {
    const a = T4_PATH[i], b = T4_PATH[i + 1];
    crystals.push({ x: (a.x + b.x) / 2 + 62, y: (a.y + b.y) / 2,
                    size: 0.7 + noise(i * 5.5) * 0.4,
                    hue: noise(i * 9.9) < 0.5 ? 'cyan' : 'violet' });
    crystals.push({ x: (a.x + b.x) / 2 - 62, y: (a.y + b.y) / 2,
                    size: 0.7 + noise(i * 7.7) * 0.4,
                    hue: noise(i * 3.3) < 0.5 ? 'violet' : 'cyan' });
  }

  mushrooms = [];
  for (let i = 0; i < 300; i++) {
    const x = noise(i * 31.7 + 39) * worldW;
    const y = noise(i * 77.1 + 39) * worldH;
    if (distToPath(x, y, T4_PATH) > 90) continue;
    mushrooms.push({ x, y, glow: noise(i * 3.3) });
  }

  // only a few monsters — everything smart is ALSO running for its life.
  // the ones that stayed are the stubborn ones.
  bats = []; crawlers = []; zombies = []; skeletons = []; creepers = [];
  for (let i = 0; i < 6; i++) {
    for (let tries = 0; tries < 40; tries++) {
      const x = noise((i + 401) * 17.9 + tries * 3.3) * worldW;
      const y = noise((i + 401) * 31.1 + tries * 7.1) * worldH;
      if (distToPath(x, y, T4_PATH) > 60) continue;
      if (Math.hypot(x - START.x, y - START.y) < 400) continue;
      if (y < 500) continue;
      if (blocked(x, y, 12)) continue;
      if (i < 3) crawlers.push({ x, y, hp: 3, wander: noise(i) * 6.28,
                                 lastHitSwing: 0, hurtFlash: 0 });
      else creepers.push({ x, y, hp: 2, fuse: 0, wander: noise(i) * 6.28,
                           lastHitSwing: 0, hurtFlash: 0 });
      break;
    }
  }

  // THE COLLAPSE — it starts below you, and it does not stop
  collapse = { y: worldH + 250, speed: 85 };

  boss = null;
  sleeper = null;
  glitchTimer = 0;
  emeralds = [];
  particles = [];
  emeraldCount = 0;
  player.x = START.x;
  player.y = START.y;
  player.hp = player.maxHp;
  player.armor = armorMax();
}

// ---------------------------------------------------------------------
// THE ROAR — it found you. it's counting the minutes.
// ---------------------------------------------------------------------
let roarTimer = 8;         // the cave says hello early
let roarShake = 0;
let doorBanner = 0;        // the level-complete celebration timer
let doorDone = false;      // reached the Door THIS run?
let elapsed = 0;

// ---------------------------------------------------------------------
// CONTROLS — keyboard + touch, same as the first adventure
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.key.toLowerCase()] = true;
  if (screen === 'menu') {
    const n = parseInt(e.key) - 1;
    if (n >= 0 && n < LEVELS2.length) startLevel(n);
  } else if (e.key === 'Escape') {
    screen = 'menu';
  } else if (e.key === ' ') {
    swing();
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('click', e => {
  ensureAudio();
  if (screen === 'menu') {
    for (let i = 0; i < menuCards.length; i++) {
      const r = menuCards[i];
      if (e.clientX > r.x && e.clientX < r.x + r.w &&
          e.clientY > r.y && e.clientY < r.y + r.h) { startLevel(i); return; }
    }
  } else {
    swing();
  }
});

let stick = null;
addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (screen === 'menu') {
    const t = e.changedTouches[0];
    for (let i = 0; i < menuCards.length; i++) {
      const r = menuCards[i];
      if (t.clientX > r.x && t.clientX < r.x + r.w &&
          t.clientY > r.y && t.clientY < r.y + r.h) { startLevel(i); return; }
    }
    return;
  }
  for (const t of e.changedTouches) {
    if (Math.hypot(t.clientX - (innerWidth - 70), t.clientY - (innerHeight - 70)) < 50) {
      swing();
    } else if (!stick) {
      stick = { id: t.identifier, sx: t.clientX, sy: t.clientY, x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) { stick.x = t.clientX; stick.y = t.clientY; }
  }
}, { passive: false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (stick && t.identifier === stick.id) stick = null;
});

function swing() {
  if (player.attackTime <= 0 && player.deathTimer <= 0) {
    player.attackTime = 0.25;
    player.swingId++;
  }
}

// ---------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------
function update(dt) {
  elapsed += dt;
  if (player.attackTime > 0) player.attackTime -= dt;
  if (player.hurtTimer > 0) player.hurtTimer -= dt;
  if (roarShake > 0) roarShake -= dt;
  if (doorBanner > 0) {
    doorBanner -= dt;
    if (doorBanner <= 0) screen = 'menu';   // level beaten — back to the cards
  }

  // THE ROAR — every so often, from the north. always from the north.
  roarTimer -= dt;
  if (roarTimer <= 0) {
    roarTimer = 20 + noise(elapsed * 3.7) * 15;
    roarShake = 3.5;
    deepRoar();
  }

  // living armor still regrows itself down here
  if ((hasInfectedArmor || hasGeckoArmor) && player.armor < armorMax() && player.deathTimer <= 0) {
    armorRegen += dt;
    if (armorRegen >= (hasGeckoArmor ? 6 : 8)) { armorRegen = 0; player.armor++; }
  } else armorRegen = 0;

  // ---- MOVEMENT ----
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (stick) {
    dx = Math.max(-1, Math.min(1, (stick.x - stick.sx) / 50));
    dy = Math.max(-1, Math.min(1, (stick.y - stick.sy) / 50));
  }
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  player.moving = len > 0.1 && player.deathTimer <= 0;
  if (player.moving) {
    player.walkTime += dt;
    if (dx > 0.1) player.facing = 1;
    if (dx < -0.1) player.facing = -1;
    const nx = player.x + dx * player.speed * dt;
    const ny = player.y + dy * player.speed * dt;
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;
  }

  // ---- BATS — rocks mean nothing to a thing with wings ----
  for (const b of bats) {
    if (b.hurtFlash > 0) b.hurtFlash -= dt;
    b.flap += dt * 14;
    const d = Math.hypot(player.x - b.x, player.y - b.y);
    if (d < 260 && player.deathTimer <= 0) {
      b.x += (player.x - b.x) / d * 150 * dt;      // straight through the rocks
      b.y += (player.y - b.y) / d * 150 * dt;
    } else {
      b.wander += (noise(Math.floor(elapsed) + b.x) - 0.5) * dt * 5;
      b.x += Math.cos(b.wander) * 60 * dt;
      b.y += Math.sin(b.wander) * 60 * dt;
      b.x = Math.max(30, Math.min(worldW - 30, b.x));
      b.y = Math.max(30, Math.min(worldH - 30, b.y));
    }
    if (player.attackTime > 0 && b.lastHitSwing !== player.swingId &&
        d < 55 && (b.x - player.x) * player.facing > -8) {
      b.lastHitSwing = player.swingId;
      b.hp -= swordDamage();
      if (b.hp <= 0) {
        for (let i = 0; i < 8; i++) {
          particles.push({ x: b.x, y: b.y, vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 200, life: 0.5, color: '#4a4458' });
        }
        if (noise(b.x + elapsed) < 0.5) emeralds.push({ x: b.x, y: b.y, born: elapsed });
      }
    }
    if (d < 22 && b.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor--;
      else player.hp--;
      player.hurtTimer = 1;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  bats = bats.filter(b => b.hp > 0);

  // ---- ROCK CRAWLERS — slow, armored, inevitable ----
  for (const c of crawlers) {
    if (c.hurtFlash > 0) c.hurtFlash -= dt;
    const d = Math.hypot(player.x - c.x, player.y - c.y);
    let cdx, cdy, spd;
    if (d < 240 && player.deathTimer <= 0) {
      cdx = (player.x - c.x) / d; cdy = (player.y - c.y) / d; spd = 55;
    } else {
      c.wander += (noise(Math.floor(elapsed) + c.x) - 0.5) * dt * 4;
      cdx = Math.cos(c.wander); cdy = Math.sin(c.wander); spd = 20;
    }
    const nx = c.x + cdx * spd * dt, ny = c.y + cdy * spd * dt;
    if (!blocked(nx, c.y, 10)) c.x = nx;
    if (!blocked(c.x, ny, 10)) c.y = ny;

    if (player.attackTime > 0 && c.lastHitSwing !== player.swingId &&
        d < 55 && (c.x - player.x) * player.facing > -8) {
      c.lastHitSwing = player.swingId;
      c.hp -= swordDamage();
      c.hurtFlash = 0.15;
      const push = 30 / Math.max(1, d);
      if (!blocked(c.x + (c.x - player.x) * push, c.y, 10)) c.x += (c.x - player.x) * push;
      if (!blocked(c.x, c.y + (c.y - player.y) * push, 10)) c.y += (c.y - player.y) * push;
      if (c.hp <= 0) {
        for (let i = 0; i < 10; i++) {
          particles.push({ x: c.x, y: c.y - 8, vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220, life: 0.6,
            color: i % 2 ? '#6a6a72' : '#8a8a92' });
        }
        emeralds.push({ x: c.x - 8, y: c.y, born: elapsed });
        emeralds.push({ x: c.x + 8, y: c.y, born: elapsed });
      }
    }
    if (d < 26 && c.hp > 0 && player.hurtTimer <= 0 && player.deathTimer <= 0) {
      if (player.armor > 0) player.armor--;
      else player.hp--;
      player.hurtTimer = 1;
      if (player.hp <= 0) player.deathTimer = 2.5;
    }
  }
  crawlers = crawlers.filter(c => c.hp > 0);

  // one shared helper for "a monster touched you"
  function hurtPlayer(fromX, fromY, push) {
    if (player.hurtTimer > 0 || player.deathTimer > 0) return;
    if (player.armor > 0) player.armor--;
    else player.hp--;
    player.hurtTimer = 1;
    const d = Math.max(1, Math.hypot(player.x - fromX, player.y - fromY));
    const nx = player.x + (player.x - fromX) / d * (push || 40);
    const ny = player.y + (player.y - fromY) / d * (push || 40);
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;
    if (player.hp <= 0) player.deathTimer = 2.5;
  }

  // ---- ZOMBIES of every kind, giants included ----
  for (const z of zombies) {
    if (z.hurtFlash > 0) z.hurtFlash -= dt;
    const d = Math.hypot(player.x - z.x, player.y - z.y);
    let zdx, zdy, spd;
    if (d < 240 && player.deathTimer <= 0) {
      zdx = (player.x - z.x) / d; zdy = (player.y - z.y) / d;
      spd = z.speed || 75;
    } else {
      z.wander += (noise(Math.floor(elapsed) + z.x) - 0.5) * dt * 4;
      zdx = Math.cos(z.wander); zdy = Math.sin(z.wander); spd = 22;
    }
    const zr = z.giant ? 16 : 10;
    const nx = z.x + zdx * spd * dt, ny = z.y + zdy * spd * dt;
    if (!blocked(nx, z.y, zr)) z.x = nx;
    if (!blocked(z.x, ny, zr)) z.y = ny;

    if (player.attackTime > 0 && z.lastHitSwing !== player.swingId &&
        d < (z.giant ? 68 : 55) && (z.x - player.x) * player.facing > -8) {
      z.lastHitSwing = player.swingId;
      z.hp -= swordDamage();
      z.hurtFlash = 0.15;
      const push = 40 / Math.max(1, d);
      if (!blocked(z.x + (z.x - player.x) * push, z.y, zr)) z.x += (z.x - player.x) * push;
      if (!blocked(z.x, z.y + (z.y - player.y) * push, zr)) z.y += (z.y - player.y) * push;
      if (z.hp <= 0) {
        const bits = z.giant ? 26 : 12;
        for (let i = 0; i < bits; i++) {
          particles.push({ x: z.x, y: z.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 280,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 240, life: 0.6,
            color: z.black ? (i % 2 ? '#26262e' : '#b06cff')
                 : z.sand  ? (i % 2 ? '#cbb06a' : '#a3854a')
                 : (i % 2 ? '#4a9e4a' : '#2e6e8e') });
        }
        const loot = z.giant ? 3 : 1;
        for (let e = 0; e < loot; e++) emeralds.push({ x: z.x + (e - 1) * 14, y: z.y, born: elapsed });
      }
    }
    if (d < (z.giant ? 42 : 26) && z.hp > 0) hurtPlayer(z.x, z.y, 50);
  }
  zombies = zombies.filter(z => z.hp > 0);

  // ---- SKELETONS — quick, with that long spear reach ----
  for (const s of skeletons) {
    if (s.hurtFlash > 0) s.hurtFlash -= dt;
    const d = Math.hypot(player.x - s.x, player.y - s.y);
    let sdx, sdy, spd;
    if (d < 260 && player.deathTimer <= 0) {
      sdx = (player.x - s.x) / d; sdy = (player.y - s.y) / d; spd = 95;
    } else {
      s.wander += (noise(Math.floor(elapsed) + s.x) - 0.5) * dt * 4;
      sdx = Math.cos(s.wander); sdy = Math.sin(s.wander); spd = 26;
    }
    if (sdx > 0.1) s.facing = 1;
    if (sdx < -0.1) s.facing = -1;
    const nx = s.x + sdx * spd * dt, ny = s.y + sdy * spd * dt;
    if (!blocked(nx, s.y, 10)) s.x = nx;
    if (!blocked(s.x, ny, 10)) s.y = ny;

    if (player.attackTime > 0 && s.lastHitSwing !== player.swingId &&
        d < 55 && (s.x - player.x) * player.facing > -8) {
      s.lastHitSwing = player.swingId;
      s.hp -= swordDamage();
      s.hurtFlash = 0.15;
      if (s.hp <= 0) {
        for (let i = 0; i < 12; i++) {
          particles.push({ x: s.x, y: s.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220, life: 0.6,
            color: i % 2 ? '#e8e8e2' : '#b8b8b0' });
        }
        emeralds.push({ x: s.x, y: s.y, born: elapsed });
      }
    }
    if (d < 38 && s.hp > 0) hurtPlayer(s.x, s.y, 50);   // the spear pokes FAR
  }
  skeletons = skeletons.filter(s => s.hp > 0);

  // ---- CREEPERS — hissing in the dark is SO much worse ----
  for (const cr of creepers) {
    if (cr.hurtFlash > 0) cr.hurtFlash -= dt;
    const d = Math.hypot(player.x - cr.x, player.y - cr.y);
    if (cr.fuse > 0) {
      cr.fuse -= dt;
      if (d > 120) cr.fuse = 0;
      else if (cr.fuse <= 0) {
        for (let i = 0; i < 26; i++) {
          particles.push({ x: cr.x, y: cr.y - 10,
            vx: (noise(i * 3.7 + elapsed) - 0.5) * 400,
            vy: (noise(i * 8.1 + elapsed) - 0.6) * 360, life: 0.7,
            color: ['#ff9f43', '#ffd23f', '#7f8c8d', '#4a9e4a'][i % 4] });
        }
        cr.hp = 0;
        if (d < 100) hurtPlayer(cr.x, cr.y, 120);
      }
    } else if (d < 60 && player.deathTimer <= 0) {
      cr.fuse = 1.1;
    } else {
      let cdx, cdy, spd;
      if (d < 230 && player.deathTimer <= 0) {
        cdx = (player.x - cr.x) / d; cdy = (player.y - cr.y) / d; spd = 85;
      } else {
        cr.wander += (noise(Math.floor(elapsed) + cr.x) - 0.5) * dt * 4;
        cdx = Math.cos(cr.wander); cdy = Math.sin(cr.wander); spd = 24;
      }
      const nx = cr.x + cdx * spd * dt, ny = cr.y + cdy * spd * dt;
      if (!blocked(nx, cr.y, 10)) cr.x = nx;
      if (!blocked(cr.x, ny, 10)) cr.y = ny;
    }
    if (player.attackTime > 0 && cr.lastHitSwing !== player.swingId &&
        d < 55 && (cr.x - player.x) * player.facing > -8 && cr.hp > 0) {
      cr.lastHitSwing = player.swingId;
      cr.hp -= swordDamage();
      cr.hurtFlash = 0.15;
      cr.fuse = 0;                              // bonked mid-hiss!
      if (cr.hp <= 0) {
        for (let i = 0; i < 12; i++) {
          particles.push({ x: cr.x, y: cr.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 220, life: 0.6,
            color: i % 2 ? '#3faf3f' : '#2e8b57' });
        }
        emeralds.push({ x: cr.x - 10, y: cr.y, born: elapsed });
        emeralds.push({ x: cr.x + 10, y: cr.y, born: elapsed });
      }
    }
  }
  creepers = creepers.filter(cr => cr.hp > 0);

  // ---- THE ABYSSAL MULTI-TASKER — sixteen eyes, three summons, zero mercy ----
  if (boss) {
    const B = boss;
    if (B.hurtFlash > 0) B.hurtFlash -= dt;
    const d = Math.hypot(player.x - B.x, player.y - B.y);
    if (!B.active && d < 320) B.active = true;

    if (B.active && player.deathTimer <= 0) {
      // it oozes toward you, unhurried. it has sixteen eyes. it can wait.
      const spd = 85 + Math.sin(elapsed * 2) * 35;
      const bdx = (player.x - B.x) / Math.max(1, d);
      const bdy = (player.y - B.y) / Math.max(1, d);
      if (!blocked(B.x + bdx * spd * dt, B.y, 16)) B.x += bdx * spd * dt;
      if (!blocked(B.x, B.y + bdy * spd * dt, 16)) B.y += bdy * spd * dt;

      // TELEPORT — a burst of violet, and it's somewhere else. near you.
      B.teleportTimer -= dt;
      if (B.teleportTimer <= 0) {
        B.teleportTimer = 4.5;
        for (let p = 0; p < 14; p++) {
          particles.push({ x: B.x, y: B.y - 16,
            vx: (noise(p * 3.1 + elapsed) - 0.5) * 280,
            vy: (noise(p * 7.3 + elapsed) - 0.8) * 240, life: 0.5, color: '#b06cff' });
        }
        for (let attempt = 0; attempt < 10; attempt++) {
          const ang = noise(elapsed * 7.7 + attempt) * 6.28;
          const nx = player.x + Math.cos(ang) * 200;
          const ny = player.y + Math.sin(ang) * 200;
          if (!blocked(nx, ny, 16)) { B.x = nx; B.y = ny; break; }
        }
        for (let p = 0; p < 14; p++) {
          particles.push({ x: B.x, y: B.y - 16,
            vx: (noise(p * 4.7 + elapsed) - 0.5) * 280,
            vy: (noise(p * 9.1 + elapsed) - 0.8) * 240, life: 0.5, color: '#b06cff' });
        }
      }

      // SUMMON — THREE creatures at once. it multi-tasks. it's in the name.
      B.summonTimer -= dt;
      if (B.summonTimer <= 0) {
        B.summonTimer = 7;
        for (let s = 0; s < 3; s++) {
          const pick = Math.floor(noise(elapsed * 9.9 + s * 3.7) * 7);
          const sx = B.x + (noise(elapsed + s) - 0.5) * 200;
          const sy = B.y + (noise(elapsed * 2.2 + s) - 0.5) * 200;
          if (pick === 0 && bats.length < 18) {
            bats.push({ x: sx, y: sy, hp: 1, wander: 0, flap: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (pick === 1 && crawlers.length < 12) {
            crawlers.push({ x: sx, y: sy, hp: 3, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (pick === 2 && zombies.length < 18) {
            zombies.push({ x: sx, y: sy, hp: 2, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (pick === 3 && zombies.length < 18) {
            zombies.push({ x: sx, y: sy, sand: true, hp: 3, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (pick === 4 && zombies.length < 18) {
            zombies.push({ x: sx, y: sy, black: true, hp: 3, speed: 95, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (pick === 5 && skeletons.length < 10) {
            skeletons.push({ x: sx, y: sy, hp: 2, facing: 1, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          } else if (creepers.length < 10) {
            creepers.push({ x: sx, y: sy, hp: 2, fuse: 0, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
          }
        }
      }

      // its reach — one heart, armor first, and a big shove
      if (d < 62) hurtPlayer(B.x, B.y, 90);
    }

    // your swings against the sixteen-eyed dark
    if (B.active && player.attackTime > 0 && B.lastHitSwing !== player.swingId &&
        d < 85 && (B.x - player.x) * player.facing > -8) {
      B.lastHitSwing = player.swingId;
      B.hp -= swordDamage();
      B.hurtFlash = 0.15;
      if (B.hp <= 0) {
        for (let i = 0; i < 46; i++) {
          particles.push({ x: B.x, y: B.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 420,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 380, life: 0.9,
            color: i % 3 === 0 ? '#1a1a20' : i % 3 === 1 ? '#b06cff' : '#ff4757' });
        }
        for (let e = 0; e < 12; e++) {
          emeralds.push({ x: B.x + (e - 6) * 13, y: B.y, born: elapsed });
        }
        boss = null;
        bossBanner = 8;
        hasBeatInsane = true;
        localStorage.setItem('explorer2_insane', 'yes');
        LEVELS2[2].unlocked = true;          // Behind the Door... opens
      }
    }
  }
  if (bossBanner > 0) {
    bossBanner -= dt;
    if (bossBanner <= 0) screen = 'menu';   // GOING INSANE: beaten
  }

  // ---- REALITY GLITCHES (level 3) — the closer to IT, the worse ----
  if (currentLevel === 2) {
    if (glitchTimer > 0) glitchTimer -= dt;
    glitchWait -= dt;
    if (glitchWait <= 0) {
      const fighting = sleeper && sleeper.state === 'awake';
      glitchWait = fighting ? 3 + noise(elapsed * 5.1) * 3
                            : 6 + noise(elapsed * 5.1) * 8;
      glitchTimer = 1;                       // one full second of static
    }
  }

  // ---- THE THING AT THE END OF THE ABYSS ----
  if (sleeper) {
    const S = sleeper;
    if (S.hurtFlash > 0) S.hurtFlash -= dt;
    const d = Math.hypot(player.x - S.x, player.y - S.y);

    if (S.state === 'asleep') {
      // it sleeps. it snores. it has always been snoring.
      // hitting it — ON PURPOSE — is the only way to wake it.
      if (player.attackTime > 0 && S.lastHitSwing !== player.swingId &&
          d < 85 && (S.x - player.x) * player.facing > -8) {
        S.lastHitSwing = player.swingId;
        S.wakeHits++;
        S.hurtFlash = 0.2;
        glitchTimer = 0.6;                   // reality flinches with every hit
        roarShake = 1.2;
        if (S.wakeHits >= 5) {
          S.state = 'waking';
          S.wakeTimer = 2.4;
          glitchTimer = 2.4;                 // reality has a full breakdown
          roarShake = 4;
          deepRoar();
        }
      }
    } else if (S.state === 'waking') {
      S.wakeTimer -= dt;
      if (S.wakeTimer <= 0) S.state = 'awake';
    } else {
      // AWAKE. and it remembers every single snore you interrupted.
      if (player.deathTimer <= 0) {
        const spd = 95 + Math.sin(elapsed * 2.4) * 40;
        const sdx = (player.x - S.x) / Math.max(1, d);
        const sdy = (player.y - S.y) / Math.max(1, d);
        if (!blocked(S.x + sdx * spd * dt, S.y, 16)) S.x += sdx * spd * dt;
        if (!blocked(S.x, S.y + sdy * spd * dt, 16)) S.y += sdy * spd * dt;

        // GLITCH-BLINK: it doesn't teleport. it just... stops being
        // where it was, in a burst of static.
        S.blinkTimer -= dt;
        if (S.blinkTimer <= 0) {
          S.blinkTimer = 3;
          glitchTimer = Math.max(glitchTimer, 0.4);
          for (let attempt = 0; attempt < 10; attempt++) {
            const ang = noise(elapsed * 7.7 + attempt) * 6.28;
            const nx = player.x + Math.cos(ang) * 170;
            const ny = player.y + Math.sin(ang) * 170;
            if (!blocked(nx, ny, 16)) { S.x = nx; S.y = ny; break; }
          }
        }

        // and it still multi-tasks: two summons at a time
        S.summonTimer -= dt;
        if (S.summonTimer <= 0) {
          S.summonTimer = 8;
          for (let s = 0; s < 2; s++) {
            const pick = Math.floor(noise(elapsed * 9.9 + s * 3.7) * 7);
            const sx = S.x + (noise(elapsed + s) - 0.5) * 180;
            const sy = S.y + (noise(elapsed * 2.2 + s) - 0.5) * 180;
            if (pick === 0 && bats.length < 18) {
              bats.push({ x: sx, y: sy, hp: 1, wander: 0, flap: 0, lastHitSwing: 0, hurtFlash: 0 });
            } else if (pick === 1 && crawlers.length < 12) {
              crawlers.push({ x: sx, y: sy, hp: 3, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
            } else if (pick <= 3 && zombies.length < 18) {
              zombies.push({ x: sx, y: sy, black: pick === 3, hp: pick === 3 ? 3 : 2,
                             speed: pick === 3 ? 95 : undefined,
                             wander: 0, lastHitSwing: 0, hurtFlash: 0 });
            } else if (pick === 4 && skeletons.length < 10) {
              skeletons.push({ x: sx, y: sy, hp: 2, facing: 1, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
            } else if (creepers.length < 10) {
              creepers.push({ x: sx, y: sy, hp: 2, fuse: 0, wander: 0, lastHitSwing: 0, hurtFlash: 0 });
            }
          }
        }

        if (d < 60) hurtPlayer(S.x, S.y, 90);
      }

      // the last swings of two whole games
      if (player.attackTime > 0 && S.lastHitSwing !== player.swingId &&
          d < 85 && (S.x - player.x) * player.facing > -8) {
        S.lastHitSwing = player.swingId;
        S.hp -= swordDamage();
        S.hurtFlash = 0.15;
        if (S.hp <= 0) {
          for (let i = 0; i < 60; i++) {
            particles.push({ x: S.x, y: S.y - 14,
              vx: (noise(i * 3.3 + elapsed) - 0.5) * 460,
              vy: (noise(i * 7.7 + elapsed) - 0.9) * 420, life: 1,
              color: i % 3 === 0 ? '#1a1a20' : i % 3 === 1 ? '#ff4757' : '#ffffff' });
          }
          for (let e = 0; e < 16; e++) {
            emeralds.push({ x: S.x + (e - 8) * 12, y: S.y, born: elapsed });
          }
          sleeper = null;
          bossBanner = 12;
          glitchTimer = 3;
          hasEnd = true;
          localStorage.setItem('explorer2_end', 'yes');
          LEVELS2[3].unlocked = true;        // now RUN.
        }
      }
    }
  }

  // ---- THE COLLAPSE — the abyss is coming apart behind you ----
  if (currentLevel === 3 && collapse) {
    collapse.y -= collapse.speed * dt;             // rising. always rising.
    // rumble harder the closer it gets
    const gap = player.y < collapse.y ? collapse.y - player.y : 0;
    if (gap < 600) roarShake = Math.max(roarShake, 0.5 + (1 - gap / 600));
    // debris rains along the collapse line
    for (let i = 0; i < 3; i++) {
      particles.push({
        x: Math.random() * worldW,
        y: collapse.y - 30 - Math.random() * 80,
        vx: (Math.random() - 0.5) * 120,
        vy: 100 + Math.random() * 200,
        life: 0.8,
        color: Math.random() < 0.5 ? '#3d3050' : '#ff4757',
      });
    }
    // caught by the collapse = swallowed. start the climb over.
    if (player.y > collapse.y - 16 && player.deathTimer <= 0) {
      player.hp = 0;
      player.deathTimer = 2.5;
    }
    // THE SURFACE — you made it OUT
    if (player.y < 260 && bossBanner <= 0 && player.deathTimer <= 0) {
      bossBanner = 12;
      localStorage.setItem('explorer2_escape', 'yes');
      collapse = null;                             // the deep goes quiet behind you
    }
  }

  // respawn back at the drop point
  if (player.deathTimer > 0) {
    player.deathTimer -= dt;
    if (player.deathTimer <= 0) {
      player.x = START.x; player.y = START.y;
      player.hp = player.maxHp;
      player.armor = armorMax();
      // the thing goes back to sleep. it can wait. it's very good at waiting.
      if (sleeper) {
        sleeper.x = T3_CHAMBER.x; sleeper.y = T3_CHAMBER.y;
        sleeper.state = 'asleep'; sleeper.wakeHits = 0; sleeper.hp = 60;
      }
      if (boss) {
        boss.x = T2_CHAMBER.x; boss.y = T2_CHAMBER.y;
        boss.active = false; boss.hp = 50;
      }
      // the collapse resets too — a fresh chance to outrun it
      if (currentLevel === 3) collapse = { y: worldH + 250, speed: 85 };
    }
  }

  // emeralds hop into your pocket
  emeralds = emeralds.filter(e => {
    if (Math.hypot(player.x - e.x, player.y - e.y) < 30) { emeraldCount++; return false; }
    return true;
  });

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // ---- THE DOOR — reach it and Abyssal Madness is BEATEN ----
  if (currentLevel === 0 && !doorDone && player.deathTimer <= 0 &&
      Math.hypot(player.x - DOOR.x, player.y - DOOR.y) < 150) {
    doorDone = true;
    foundDoor = true;
    localStorage.setItem('explorer2_door', 'yes');   // remembered forever
    LEVELS2[1].unlocked = true;                      // GOING INSANE opens
    doorBanner = 8;
  }
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function cam() {
  let cx = Math.max(0, Math.min(worldW - canvas.width,  player.x - canvas.width / 2));
  let cy = Math.max(0, Math.min(worldH - canvas.height, player.y - canvas.height / 2));
  if (roarShake > 0) {
    const tr = Math.min(1, roarShake);
    cx += (noise(elapsed * 47.1) - 0.5) * 18 * tr;
    cy += (noise(elapsed * 61.7) - 0.5) * 18 * tr;
  }
  return { x: cx, y: cy };
}

function draw() {
  const c = cam();

  // cave floor — deep, dark stone
  ctx.fillStyle = '#17161f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // levels 2, 3 and 4: ancient paved passage floors
  if (currentLevel >= 1) {
    const walkways = currentLevel === 1 ? [T2_PATH]
                   : currentLevel === 2 ? T3_PATHS
                   : [T4_PATH];
    const chamber = currentLevel === 1 ? T2_CHAMBER
                  : currentLevel === 2 ? T3_CHAMBER
                  : null;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const wp of walkways) {
      ctx.beginPath();
      ctx.moveTo(wp[0].x - c.x, wp[0].y - c.y);
      for (const p of wp) ctx.lineTo(p.x - c.x, p.y - c.y);
      ctx.strokeStyle = currentLevel === 2 ? '#241620' : '#221a2e';
      ctx.lineWidth = 175;
      ctx.stroke();
    }
    // the boss chamber floor, and rings worn into the stone
    if (chamber) {
      const chx = chamber.x - c.x, chy = chamber.y - c.y;
      ctx.fillStyle = currentLevel === 2 ? '#241620' : '#221a2e';
      ctx.beginPath(); ctx.arc(chx, chy, 200, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = currentLevel === 2 ? '#3d2030' : '#322645';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(chx, chy, 170, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(chx, chy, 90, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // glowing mushrooms, scattered like tiny stars on the floor
  for (const m of mushrooms) {
    const mx = m.x - c.x, my = m.y - c.y;
    if (mx < -10 || my < -10 || mx > canvas.width + 10 || my > canvas.height + 10) continue;
    const tw = 0.5 + Math.sin(elapsed * 2 + m.glow * 20) * 0.5;
    ctx.fillStyle = `rgba(110, 230, 200, ${0.25 + tw * 0.4})`;
    ctx.fillRect(mx, my, 3, 3);
  }

  // everything that stands up, sorted so nearer things draw in front
  const things = [];
  for (const r of rocks) things.push({ y: r.y, kind: 'rock', it: r });
  for (const cr of crystals) things.push({ y: cr.y, kind: 'crystal', it: cr });
  for (const cw of crawlers) things.push({ y: cw.y, kind: 'crawler', it: cw });
  for (const z of zombies) things.push({ y: z.y, kind: 'zombie', it: z });
  for (const s of skeletons) things.push({ y: s.y, kind: 'skeleton', it: s });
  for (const cp of creepers) things.push({ y: cp.y, kind: 'creeper', it: cp });
  things.push({ y: player.y, kind: 'player' });
  things.sort((a, b) => a.y - b.y);

  for (const th of things) {
    if (th.kind === 'rock') drawRock(th.it, c);
    else if (th.kind === 'crystal') drawCrystal(th.it, c);
    else if (th.kind === 'crawler') drawCrawler(th.it, c);
    else if (th.kind === 'zombie') drawZombie(th.it, c);
    else if (th.kind === 'skeleton') drawSkeleton(th.it, c);
    else if (th.kind === 'creeper') drawCreeper(th.it, c);
    else drawPlayer(c);
  }

  // bats fly over everything
  for (const b of bats) drawBat(b, c);

  // emeralds
  for (const e of emeralds) {
    const ex = e.x - c.x, ey = e.y - c.y + Math.sin((elapsed - e.born) * 4) * 3;
    if (ex < -20 || ey < -20 || ex > canvas.width + 20 || ey > canvas.height + 20) continue;
    ctx.save();
    ctx.translate(ex, ey - 8);
    ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#2ecc71';
    ctx.fillRect(-6, -6, 12, 12);
    ctx.strokeStyle = '#aaffcc'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-6, -6, 12, 12);
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - c.x - 3, p.y - c.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // THE DOOR — colossal, sealed, and glowing angrily (level 1 only)
  if (currentLevel === 0) drawDoor(c);

  // THE ABYSSAL MULTI-TASKER, in all its sixteen-eyed glory (level 2)
  if (boss) drawBoss(c);

  // THE THING AT THE END OF THE ABYSS (level 3) — sleeping, or not
  if (sleeper) drawSleeper(c);

  // THE COLLAPSE (level 4) — everything below this line is ENDING
  if (currentLevel === 3 && collapse) {
    const cy2 = collapse.y - c.y;
    if (cy2 < canvas.height + 100) {
      const grad = ctx.createLinearGradient(0, cy2 - 60, 0, cy2 + 200);
      grad.addColorStop(0, 'rgba(20, 8, 16, 0)');
      grad.addColorStop(0.3, 'rgba(20, 8, 16, 0.9)');
      grad.addColorStop(1, 'rgba(5, 2, 6, 1)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, cy2 - 60, canvas.width, canvas.height - cy2 + 160);
      // the jagged, churning edge of the end of the world
      ctx.fillStyle = '#0a040c';
      ctx.beginPath();
      ctx.moveTo(0, cy2 + 40);
      for (let x = 0; x <= canvas.width; x += 40) {
        ctx.lineTo(x, cy2 + Math.sin(x * 0.05 + elapsed * 9) * 22
                        + noise(Math.floor(x / 40) + Math.floor(elapsed * 7)) * 24);
      }
      ctx.lineTo(canvas.width, canvas.height);
      ctx.lineTo(0, canvas.height);
      ctx.closePath();
      ctx.fill();
      // red cracks flickering along the collapse line
      ctx.strokeStyle = `rgba(255, 70, 40, ${0.5 + Math.sin(elapsed * 11) * 0.3})`;
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x <= canvas.width; x += 60) {
        const yy = cy2 + Math.sin(x * 0.05 + elapsed * 9) * 22;
        ctx.moveTo(x, yy);
        ctx.lineTo(x + 20 - noise(x + Math.floor(elapsed * 5)) * 40, yy + 30);
      }
      ctx.stroke();
    }
  }

  // ---- THE DARK — heavier than any night above ----
  const px = player.x - c.x, py = player.y - c.y;
  const night = ctx.createRadialGradient(px, py - 14, 35, px, py - 14, 230);
  night.addColorStop(0, 'rgba(2, 2, 8, 0)');
  night.addColorStop(0.5, 'rgba(2, 2, 8, 0.55)');
  night.addColorStop(1, 'rgba(2, 2, 8, 0.93)');
  ctx.fillStyle = night;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // crystal glow cuts through the dark
  for (const cr of crystals) {
    const gx = cr.x - c.x, gy = cr.y - c.y - 14;
    if (gx < -150 || gy < -150 || gx > canvas.width + 150 || gy > canvas.height + 150) continue;
    const col = cr.hue === 'cyan' ? '110, 220, 240'
              : cr.hue === 'red' ? '255, 90, 60' : '180, 130, 255';
    const g = ctx.createRadialGradient(gx, gy, 4, gx, gy, 90 * cr.size);
    g.addColorStop(0, `rgba(${col}, 0.30)`);
    g.addColorStop(1, `rgba(${col}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(gx - 90 * cr.size, gy - 90 * cr.size, 180 * cr.size, 180 * cr.size);
  }
  // monster eyes glow through the deep dark — count them before you commit
  for (const z of zombies) {
    const zx = z.x - c.x, zy = z.y - c.y;
    if (zx < -20 || zy < -20 || zx > canvas.width + 20 || zy > canvas.height + 20) continue;
    if (z.giant) {
      ctx.fillStyle = 'rgba(176, 108, 255, 0.85)';
      for (let row = 0; row < 3; row++)
        for (let col = 0; col < 3; col++)
          ctx.fillRect(zx - 8 + col * 7, zy - 47 + row * 7, 3, 3);
    } else if (z.black) {
      ctx.fillStyle = 'rgba(176, 108, 255, 0.75)';
      for (let e = 0; e < 3; e++) {
        ctx.fillRect(zx - 5 + e * 4, zy - 27, 2, 2);
        ctx.fillRect(zx - 5 + e * 4, zy - 23, 2, 2);
      }
    } else {
      ctx.fillStyle = 'rgba(150, 255, 150, 0.5)';
      ctx.fillRect(zx - 5, zy - 26, 3, 3);
      ctx.fillRect(zx + 2, zy - 26, 3, 3);
    }
  }
  // bat eyes and crawler eyes glint too — the dark is FULL of eyes
  ctx.fillStyle = 'rgba(255, 210, 63, 0.7)';
  for (const b of bats) {
    ctx.fillRect(b.x - c.x - 3, b.y - c.y - 2, 2, 2);
    ctx.fillRect(b.x - c.x + 1, b.y - c.y - 2, 2, 2);
  }
  ctx.fillStyle = 'rgba(255, 159, 67, 0.7)';
  for (const cw of crawlers) {
    ctx.fillRect(cw.x - c.x - 5, cw.y - c.y - 6, 3, 3);
    ctx.fillRect(cw.x - c.x + 2, cw.y - c.y - 6, 3, 3);
  }

  // and the door's cracks burn through everything (level 1)
  if (currentLevel === 0) {
    const dxp = DOOR.x - c.x, dyp = DOOR.y - c.y;
    const dg = ctx.createRadialGradient(dxp, dyp, 10, dxp, dyp, 260);
    dg.addColorStop(0, 'rgba(255, 70, 40, 0.30)');
    dg.addColorStop(1, 'rgba(255, 70, 40, 0)');
    ctx.fillStyle = dg;
    ctx.fillRect(dxp - 260, dyp - 260, 520, 520);
  }

  // sixteen eyes, glowing through the dark, all pointed at you (level 2)
  if (boss) {
    const bx = boss.x - c.x, by = boss.y - c.y;
    ctx.fillStyle = 'rgba(176, 108, 255, 0.9)';
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        ctx.fillRect(bx - 27 + col * 17, by - 42 + row * 13, 4, 4);
      }
    }
  }
  // and when IT is awake, two red suns burn through everything (level 3)
  if (sleeper && sleeper.state === 'awake') {
    const sx = sleeper.x - c.x, sy = sleeper.y - c.y;
    for (const side of [-1, 1]) {
      const g = ctx.createRadialGradient(sx + side * 22, sy - 16, 3, sx + side * 22, sy - 16, 60);
      g.addColorStop(0, 'rgba(255, 46, 31, 0.6)');
      g.addColorStop(1, 'rgba(255, 46, 31, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(sx + side * 22 - 60, sy - 76, 120, 120);
    }
  }

  // DAYLIGHT (level 4) — the higher you climb, the more the world above
  // reaches down to meet you. you'd almost forgotten what it looks like.
  if (currentLevel === 3) {
    const sunAmt = Math.max(0, 1 - (player.y - 300) / 1400);
    if (sunAmt > 0) {
      const sun = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
      sun.addColorStop(0, `rgba(255, 240, 200, ${0.55 * sunAmt})`);
      sun.addColorStop(1, 'rgba(255, 240, 200, 0)');
      ctx.fillStyle = sun;
      ctx.fillRect(0, 0, canvas.width, canvas.height * 0.6);
    }
  }

  drawHUD();

  // ---- THE GLITCH — for one second, reality forgets how to draw itself.
  // We slice the finished screen into strips and shove them sideways,
  // ghost the whole picture, and sprinkle static over everything. ----
  if (glitchTimer > 0 && currentLevel === 2) {
    const strength = Math.min(1, glitchTimer * 2);
    for (let i = 0; i < 10; i++) {
      const sy = Math.random() * canvas.height;
      const h = 8 + Math.random() * 34;
      const off = (Math.random() - 0.5) * 46 * strength;
      ctx.drawImage(canvas, 0, sy, canvas.width, h, off, sy, canvas.width, h);
    }
    ctx.globalAlpha = 0.15 * strength;
    ctx.drawImage(canvas, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 8);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 140 * strength; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.25)' : 'rgba(255,60,60,0.2)';
      ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height,
                   2 + Math.random() * 4, 2 + Math.random() * 3);
    }
  }
}

function drawRock(r, c) {
  const x = r.x - c.x, y = r.y - c.y;
  if (x < -60 || y < -90 || x > canvas.width + 60 || y > canvas.height + 90) return;
  const s = r.size;
  // temple wall blocks: carved abyssal stone with faint red veins
  if (r.wall) {
    ctx.fillStyle = '#1c1524';
    ctx.fillRect(x - 22, y - 10, 44, 14);
    ctx.fillStyle = '#2b2136';
    ctx.fillRect(x - 22, y - 52, 44, 44);
    ctx.fillStyle = '#3d3050';
    ctx.fillRect(x - 22, y - 52, 44, 10);
    ctx.fillStyle = 'rgba(255, 70, 40, 0.18)';       // something seeps through
    ctx.fillRect(x - 4 + noise(r.x) * 8, y - 52, 2, 21);
    ctx.fillRect(x - 14 + noise(r.y) * 8, y - 29, 2, 19);
    return;
  }
  ctx.fillStyle = '#26242f';
  ctx.beginPath();
  ctx.moveTo(x - 15 * s, y + 5);
  ctx.lineTo(x - 8 * s, y - 46 * s);
  ctx.lineTo(x, y - 60 * s);
  ctx.lineTo(x + 9 * s, y - 42 * s);
  ctx.lineTo(x + 15 * s, y + 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#332f3d';                       // one lit edge
  ctx.beginPath();
  ctx.moveTo(x - 8 * s, y - 46 * s);
  ctx.lineTo(x, y - 60 * s);
  ctx.lineTo(x + 2 * s, y - 40 * s);
  ctx.closePath(); ctx.fill();
}

function drawCrystal(cr, c) {
  const x = cr.x - c.x, y = cr.y - c.y;
  if (x < -60 || y < -90 || x > canvas.width + 60 || y > canvas.height + 90) return;
  const s = cr.size;
  const main = cr.hue === 'cyan' ? '#6edcf0' : cr.hue === 'red' ? '#ff5f4a' : '#b482ff';
  const lite = cr.hue === 'cyan' ? '#c8f4fa' : cr.hue === 'red' ? '#ffb0a0' : '#dcc8ff';
  ctx.fillStyle = main;
  ctx.beginPath();
  ctx.moveTo(x - 10 * s, y);
  ctx.lineTo(x - 5 * s, y - 34 * s);
  ctx.lineTo(x, y - 44 * s);
  ctx.lineTo(x + 6 * s, y - 30 * s);
  ctx.lineTo(x + 10 * s, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = lite;
  ctx.beginPath();
  ctx.moveTo(x - 5 * s, y - 34 * s);
  ctx.lineTo(x, y - 44 * s);
  ctx.lineTo(x + 1 * s, y - 26 * s);
  ctx.closePath(); ctx.fill();
}

function drawBat(b, c) {
  const x = b.x - c.x, y = b.y - c.y;
  if (x < -30 || y < -30 || x > canvas.width + 30 || y > canvas.height + 30) return;
  const w = Math.sin(b.flap) * 8;
  ctx.fillStyle = '#4a4458';
  ctx.beginPath(); ctx.ellipse(x, y, 6, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();                                 // wings, mid-beat
  ctx.moveTo(x - 3, y);
  ctx.quadraticCurveTo(x - 14, y - 6 + w, x - 18, y + 2 + w);
  ctx.quadraticCurveTo(x - 10, y + 2, x - 3, y + 3);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 3, y);
  ctx.quadraticCurveTo(x + 14, y - 6 + w, x + 18, y + 2 + w);
  ctx.quadraticCurveTo(x + 10, y + 2, x + 3, y + 3);
  ctx.fill();
  ctx.fillStyle = '#ffd23f';                       // tiny glowing eyes
  ctx.fillRect(x - 3, y - 2, 2, 2);
  ctx.fillRect(x + 1, y - 2, 2, 2);
}

function drawCrawler(cw, c) {
  const x = cw.x - c.x, y = cw.y - c.y;
  if (x < -40 || y < -40 || x > canvas.width + 40 || y > canvas.height + 40) return;
  const flash = cw.hurtFlash > 0;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : '#55525f';   // armored stone shell
  ctx.beginPath(); ctx.ellipse(x, y - 4, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : '#6a6775';   // shell plates
  ctx.beginPath(); ctx.ellipse(x - 4, y - 7, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 5, y - 5, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a2832';                       // little stone legs
  const step = Math.sin(elapsed * 10 + cw.x) * 2;
  ctx.fillRect(x - 12, y + 2 + step, 3, 5);
  ctx.fillRect(x - 4, y + 4 - step, 3, 5);
  ctx.fillRect(x + 4, y + 4 + step, 3, 5);
  ctx.fillRect(x + 10, y + 2 - step, 3, 5);
  ctx.fillStyle = '#ff9f43';                       // two smouldering eyes
  ctx.fillRect(x - 5, y - 6, 3, 3);
  ctx.fillRect(x + 2, y - 6, 3, 3);
}

function drawZombie(z, c) {
  const x = z.x - c.x, y = z.y - c.y;
  if (x < -60 || y < -80 || x > canvas.width + 60 || y > canvas.height + 80) return;
  const flash = z.hurtFlash > 0;

  // the GIANT: nine eyes and spider legs, right at home down here
  if (z.giant) {
    const stomp = Math.abs(Math.sin(elapsed * 4 + z.x)) * 4;
    ctx.strokeStyle = '#141418';
    ctx.lineWidth = 3;
    for (let leg = 0; leg < 4; leg++) {
      for (const side of [-1, 1]) {
        const wiggle = Math.sin(elapsed * 6 + leg * 1.7 + z.x) * 4;
        const spread = 14 + leg * 9;
        ctx.beginPath();
        ctx.moveTo(x + 6 * side, y - 38 - stomp);
        ctx.lineTo(x + spread * side, y - 52 - leg * 3 + wiggle);
        ctx.lineTo(x + (spread + 12) * side, y - 20 + wiggle);
        ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(x, y + 10, 20, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : '#26262e';
    ctx.fillRect(x - 14, y - 26 - stomp, 28, 30);
    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';
    ctx.fillRect(x - 12, y - 52 - stomp, 24, 26);
    ctx.fillStyle = '#b06cff';
    for (let row = 0; row < 3; row++)
      for (let col = 0; col < 3; col++)
        ctx.fillRect(x - 8 + col * 7, y - 47 + row * 7 - stomp, 3, 3);
    ctx.fillStyle = flash ? '#ffffff' : '#1c1c22';
    ctx.fillRect(x - 20, y - 22 - stomp, 6, 16);
    ctx.fillRect(x + 14, y - 22 - stomp, 6, 16);
    return;
  }

  const stomp = Math.abs(Math.sin(elapsed * 6 + z.x)) * 3;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
  const shirt = z.black ? '#26262e' : z.sand ? '#a3854a' : '#2e6e8e';
  const skin  = z.black ? '#1c1c22' : z.sand ? '#cbb06a' : '#4a9e4a';
  ctx.fillStyle = flash ? '#ffffff' : shirt;
  ctx.fillRect(x - 8, y - 14 - stomp, 16, 16);
  ctx.fillStyle = flash ? '#ffffff' : skin;
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  if (z.black) {
    ctx.fillStyle = '#b06cff';
    for (let e = 0; e < 3; e++) {
      ctx.fillRect(x - 5 + e * 4, y - 27 - stomp, 2, 2);
      ctx.fillRect(x - 5 + e * 4, y - 23 - stomp, 2, 2);
    }
  } else {
    ctx.fillStyle = z.sand ? '#4a3b1c' : '#1c3b1c';
    ctx.fillRect(x - 5, y - 25 - stomp, 3, 3);
    ctx.fillRect(x + 2, y - 25 - stomp, 3, 3);
  }
  ctx.fillStyle = flash ? '#ffffff' : skin;
  ctx.fillRect(x - 12, y - 12 - stomp, 4, 9);
  ctx.fillRect(x + 8, y - 12 - stomp, 4, 9);
}

function drawSkeleton(s, c) {
  const x = s.x - c.x, y = s.y - c.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;
  const stomp = Math.abs(Math.sin(elapsed * 8 + s.x)) * 3;
  const bone = s.hurtFlash > 0 ? '#ff9a9a' : '#e8e8e2';
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = bone;
  ctx.fillRect(x - 6, y - 14 - stomp, 12, 16);
  ctx.fillStyle = s.hurtFlash > 0 ? '#e07a7a' : '#b0b0a8';
  ctx.fillRect(x - 6, y - 10 - stomp, 12, 2);
  ctx.fillRect(x - 6, y - 5 - stomp, 12, 2);
  ctx.fillStyle = bone;
  ctx.fillRect(x - 7, y - 30 - stomp, 14, 14);
  ctx.fillStyle = '#222';
  ctx.fillRect(x - 5, y - 25 - stomp, 4, 4);
  ctx.fillRect(x + 1, y - 25 - stomp, 4, 4);
  ctx.save();
  ctx.translate(x + 8 * s.facing, y - 12 - stomp);
  if (s.facing === -1) ctx.scale(-1, 1);
  ctx.rotate(-0.35);
  ctx.fillStyle = '#8a6b3f';
  ctx.fillRect(-6, -1.5, 30, 3);
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(24, -3, 8, 6);
  ctx.restore();
}

function drawCreeper(cr, c) {
  const x = cr.x - c.x, y = cr.y - c.y;
  if (x < -40 || y < -60 || x > canvas.width + 40 || y > canvas.height + 60) return;
  const lit = cr.fuse > 0;
  const swell = lit ? 1 + (1.1 - cr.fuse) * 0.25 : 1;
  const flash = cr.hurtFlash > 0 || (lit && Math.floor(elapsed * 12) % 2 === 0);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 11 * swell, 5 * swell, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = flash ? '#ffffff' : '#3faf3f';
  ctx.fillRect(x - 8 * swell, y - 16 * swell, 16 * swell, 18 * swell);
  ctx.fillRect(x - 8 * swell, y - 33 * swell, 16 * swell, 16 * swell);
  ctx.fillRect(x - 9 * swell, y - 2, 7, 5);
  ctx.fillRect(x + 2 * swell, y - 2, 7, 5);
  ctx.fillStyle = '#143814';
  ctx.fillRect(x - 6 * swell, y - 29 * swell, 4, 4);
  ctx.fillRect(x + 2 * swell, y - 29 * swell, 4, 4);
  ctx.fillRect(x - 3 * swell, y - 24 * swell, 6, 4);
  ctx.fillRect(x - 5 * swell, y - 21 * swell, 4, 5);
  ctx.fillRect(x + 1 * swell, y - 21 * swell, 4, 5);
}

function drawPlayer(c) {
  const x = player.x - c.x, y = player.y - c.y;
  const bob = player.moving ? Math.abs(Math.sin(player.walkTime * 10)) * 4 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  // your armor came with you — gecko scales, infection, plate, or shirt
  ctx.fillStyle = hasGeckoArmor ? '#3f8a3f'
                : hasInfectedArmor ? '#3a3345'
                : hasArmor ? '#b8c4d0' : '#c98a3d';
  ctx.fillRect(x - 8, y - 14 - bob, 16, 16);
  if (hasGeckoArmor) {
    ctx.fillStyle = '#8fce8f';
    ctx.fillRect(x - 3, y - 14 - bob, 6, 16);
    ctx.fillStyle = '#3f8a3f';                     // the tiny tail, still going
    ctx.fillRect(x - 13 * player.facing - 3, y - 4 - bob, 7, 3);
  } else if (hasInfectedArmor) {
    ctx.fillStyle = '#b06cff';
    ctx.fillRect(x - 1, y - 11 - bob, 3, 12);
  }

  ctx.fillStyle = '#f2c79b';                       // square head
  ctx.fillRect(x - 7, y - 30 - bob, 14, 14);
  ctx.fillStyle = '#7a5230';                       // the hat survived the fall
  ctx.fillRect(x - 11, y - 30 - bob, 22, 4);
  ctx.fillRect(x - 7, y - 36 - bob, 14, 7);
  ctx.fillStyle = '#222';
  ctx.fillRect(x + 3 * player.facing, y - 25 - bob, 3, 3);

  // your weapon — Chippy if you earned him, sword otherwise
  const swinging = player.attackTime > 0;
  const progress = swinging ? 1 - player.attackTime / 0.25 : 0;
  ctx.save();
  ctx.translate(x + 9 * player.facing, y - 8 - bob);
  if (player.facing === -1) ctx.scale(-1, 1);
  ctx.rotate(swinging ? (-1.3 + 2.6 * progress) : 1.0);
  if (hasChippy) {
    ctx.fillStyle = '#8a6b3f'; ctx.fillRect(0, -2, 20, 4);
    ctx.fillStyle = '#c8ccd4'; ctx.fillRect(16, -11, 9, 18);
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(23, -11, 3, 18);
    ctx.fillStyle = '#ffffff';                     // his eyes! he's thrilled!
    ctx.fillRect(17.5, -8, 3, 3); ctx.fillRect(17.5, 1, 3, 3);
    ctx.fillStyle = '#222';
    ctx.fillRect(18.5, -7, 1.5, 1.5); ctx.fillRect(18.5, 2, 1.5, 1.5);
  } else {
    ctx.fillStyle = '#5b3b1e'; ctx.fillRect(0, -2, 7, 4);
    ctx.fillStyle = '#c9a83c'; ctx.fillRect(6, -5, 3, 10);
    ctx.fillStyle = hasGoldSword ? '#f2c94c' : '#dbe4ee'; ctx.fillRect(9, -2, 17, 4);
    ctx.fillStyle = hasGoldSword ? '#fff3b8' : '#ffffff'; ctx.fillRect(9, -2, 17, 1.5);
  }
  if (swinging) {
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - progress)})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 26, -1.3, -1.3 + 2.6 * progress);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBoss(c) {
  const B = boss;
  const bx = B.x - c.x, by = B.y - c.y;
  if (bx < -160 || by < -160 || bx > canvas.width + 160 || by > canvas.height + 160) return;
  const flash = B.hurtFlash > 0;
  const wob = elapsed * 2.2;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(bx, by + 42, 66, 18, 0, 0, Math.PI * 2); ctx.fill();

  // six tentacles of abyssal dark, writhing out from underneath
  ctx.strokeStyle = flash ? '#ffffff' : '#0e0a14';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  for (let t = 0; t < 6; t++) {
    const baseAng = (t / 6) * Math.PI * 2 + Math.sin(wob + t) * 0.14;
    ctx.beginPath();
    let tx = bx + Math.cos(baseAng) * 30, ty = by + Math.sin(baseAng) * 24;
    ctx.moveTo(tx, ty);
    for (let seg = 1; seg <= 3; seg++) {
      tx += Math.cos(baseAng + Math.sin(wob * 1.6 + t + seg) * 0.5) * 26;
      ty += Math.sin(baseAng + Math.cos(wob * 1.4 + t + seg) * 0.5) * 22;
      ctx.lineTo(tx, ty);
    }
    ctx.stroke();
  }

  // the blob — near-black, edges rippling, veined with abyss-red
  ctx.fillStyle = flash ? '#ffffff' : '#191221';
  ctx.beginPath();
  for (let k = 0; k <= 22; k++) {
    const ang = (k / 22) * Math.PI * 2;
    const r = 56 + Math.sin(wob * 1.4 + k * 1.9) * 7;
    const px = bx + Math.cos(ang) * r;
    const py = by + Math.sin(ang) * r * 0.85;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 70, 40, 0.35)';       // red veins across the goo
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx - 40, by + 10);
  ctx.lineTo(bx - 15, by - 5);
  ctx.lineTo(bx - 25, by - 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(bx + 42, by + 2);
  ctx.lineTo(bx + 18, by - 12);
  ctx.stroke();

  // SIXTEEN EYES — a 4x4 grid, every pupil tracking you
  const lk = Math.hypot(player.x - B.x, player.y - B.y) || 1;
  const ex = (player.x - B.x) / lk * 2, ey = (player.y - B.y) / lk * 2;
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 4; col++) {
      const ox = bx - 27 + col * 17, oy = by - 40 + row * 13;
      ctx.fillStyle = '#f4f0e8';
      ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b06cff';
      ctx.beginPath(); ctx.arc(ox + ex, oy + ey, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  // the mouth — wide and toothy, beneath all those eyes
  ctx.fillStyle = '#0a0710';
  ctx.beginPath();
  ctx.ellipse(bx, by + 22, 26, 9 + Math.sin(wob * 2) * 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f4f0e8';
  for (let tt = 0; tt < 5; tt++) {
    const tx = bx - 20 + tt * 9;
    ctx.beginPath();
    ctx.moveTo(tx, by + 16); ctx.lineTo(tx + 7, by + 16); ctx.lineTo(tx + 3.5, by + 23);
    ctx.closePath(); ctx.fill();
  }
}

// THE THING — a vast glitchy multi-tasker. Its whole body jitters like a
// broken TV signal, because it is older than the rules of this place.
function drawSleeper(c) {
  const S = sleeper;
  // the fuzz: its body never draws in quite the same place twice
  const jx = (Math.random() - 0.5) * (S.state === 'awake' ? 6 : 2);
  const jy = (Math.random() - 0.5) * (S.state === 'awake' ? 6 : 2);
  const bx = S.x - c.x + jx, by = S.y - c.y + jy;
  if (bx < -200 || by < -200 || bx > canvas.width + 200 || by > canvas.height + 200) return;
  const flash = S.hurtFlash > 0;
  const wob = elapsed * (S.state === 'asleep' ? 0.9 : 2.4);
  const breathe = S.state === 'asleep' ? Math.sin(elapsed * 0.9) * 5 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(bx, by + 50, 80, 20, 0, 0, Math.PI * 2); ctx.fill();

  // eight arms — folded and still in sleep, GRASPING when awake
  ctx.strokeStyle = flash ? '#ffffff' : '#0c0a12';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  for (let t = 0; t < 8; t++) {
    const baseAng = (t / 8) * Math.PI * 2 + (S.state === 'awake' ? Math.sin(wob + t) * 0.2 : 0);
    const reach = S.state === 'awake' ? 3 : 1.6;
    ctx.beginPath();
    let tx = bx + Math.cos(baseAng) * 36, ty = by + Math.sin(baseAng) * 28;
    ctx.moveTo(tx, ty);
    for (let seg = 1; seg <= reach; seg++) {
      tx += Math.cos(baseAng + Math.sin(wob * 1.6 + t + seg) * 0.4) * 26;
      ty += Math.sin(baseAng + Math.cos(wob * 1.4 + t + seg) * 0.4) * 22;
      ctx.lineTo(tx, ty);
    }
    ctx.stroke();
  }

  // the huge body — near-black, breathing in sleep, seething awake
  ctx.fillStyle = flash ? '#ffffff' : '#100c16';
  ctx.beginPath();
  for (let k = 0; k <= 24; k++) {
    const ang = (k / 24) * Math.PI * 2;
    const r = 66 + breathe + Math.sin(wob * 1.4 + k * 1.9) * 6;
    const px = bx + Math.cos(ang) * r;
    const py = by + Math.sin(ang) * r * 0.82;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();

  // static patches crawl across its skin — parts of it don't quite exist
  for (let i = 0; i < (S.state === 'awake' ? 8 : 3); i++) {
    ctx.fillStyle = `rgba(255, 255, 255, ${0.06 + Math.random() * 0.1})`;
    ctx.fillRect(bx - 50 + Math.random() * 100, by - 40 + Math.random() * 80,
                 8 + Math.random() * 22, 3 + Math.random() * 5);
  }

  if (S.state === 'asleep') {
    // eyes CLOSED — two long lids, dreaming. do not disturb. (disturb it.)
    ctx.strokeStyle = '#3d2030';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(bx - 34, by - 18); ctx.lineTo(bx - 8, by - 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx + 8, by - 14); ctx.lineTo(bx + 34, by - 18); ctx.stroke();
    // Zzz drifting up with every snore
    ctx.fillStyle = 'rgba(180, 180, 220, 0.6)';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    const zr = (elapsed * 0.6) % 1;
    ctx.fillText('Z', bx + 50 + zr * 20, by - 60 - zr * 40);
    ctx.fillText('z', bx + 66 + zr * 14, by - 84 - zr * 30);
  } else {
    // AWAKE. two huge red eyes... and smaller ones that flicker in and
    // out of existence around them, like the idea of eyes.
    const lk = Math.hypot(player.x - S.x, player.y - S.y) || 1;
    const ex = (player.x - S.x) / lk * 3, ey = (player.y - S.y) / lk * 3;
    for (const side of [-1, 1]) {
      ctx.fillStyle = '#ff2e1f';
      ctx.beginPath(); ctx.arc(bx + side * 22, by - 16, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a0c06';
      ctx.beginPath(); ctx.arc(bx + side * 22 + ex, by - 16 + ey, 5, 0, Math.PI * 2); ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      if (Math.random() < 0.5) continue;         // flickering ghost-eyes
      ctx.fillStyle = 'rgba(255, 46, 31, 0.6)';
      ctx.beginPath();
      ctx.arc(bx - 45 + noise(i * 7.7 + Math.floor(elapsed * 6)) * 90,
              by - 40 + noise(i * 3.3 + Math.floor(elapsed * 6)) * 40,
              3, 0, Math.PI * 2);
      ctx.fill();
    }
    // the mouth, which has been roaring for two games
    ctx.fillStyle = '#070409';
    ctx.beginPath();
    ctx.ellipse(bx, by + 22, 30, 11 + Math.sin(wob * 2) * 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4f0e8';
    for (let tt = 0; tt < 6; tt++) {
      const tx = bx - 24 + tt * 9;
      ctx.beginPath();
      ctx.moveTo(tx, by + 15); ctx.lineTo(tx + 7, by + 15); ctx.lineTo(tx + 3.5, by + 23);
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawDoor(c) {
  const x = DOOR.x - c.x, y = DOOR.y - c.y;
  if (x < -300 || y < -300 || x > canvas.width + 300 || y > canvas.height + 300) return;
  // the frame: two colossal carved pillars
  ctx.fillStyle = '#2e2a38';
  ctx.fillRect(x - 150, y - 160, 40, 200);
  ctx.fillRect(x + 110, y - 160, 40, 200);
  ctx.fillRect(x - 160, y - 190, 320, 40);
  // the door itself: black slabs
  ctx.fillStyle = '#14121c';
  ctx.fillRect(x - 110, y - 150, 220, 190);
  // the cracks — something bright and angry lives behind them
  const pulse = 0.6 + Math.sin(elapsed * 2.2) * 0.4;
  ctx.strokeStyle = `rgba(255, 80, 40, ${pulse})`;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x - 40, y - 150);
  ctx.lineTo(x - 20, y - 90);
  ctx.lineTo(x - 45, y - 40);
  ctx.lineTo(x - 25, y + 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 55, y - 150);
  ctx.lineTo(x + 30, y - 70);
  ctx.lineTo(x + 60, y + 10);
  ctx.stroke();
  // FOUR colossal claw marks. bigger than you. much bigger.
  ctx.strokeStyle = '#0a0910';
  ctx.lineWidth = 9;
  for (let k = 0; k < 4; k++) {
    ctx.beginPath();
    ctx.moveTo(x - 70 + k * 45, y - 130);
    ctx.lineTo(x - 95 + k * 45, y + 20);
    ctx.stroke();
  }
}

function drawHUD() {
  // hearts + armor
  for (let i = 0; i < player.maxHp; i++) drawHeart(14 + i * 26, 14, i < player.hp, '#ff4757');
  for (let i = 0; i < armorMax(); i++) {
    drawHeart(22 + (player.maxHp + i) * 26, 14, i < player.armor,
              hasGeckoArmor ? '#5fbf5f' : hasInfectedArmor ? '#a86cf0' : '#b8c4d0');
  }
  // emeralds
  ctx.save();
  ctx.translate(24, 52); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = '#2ecc71'; ctx.fillRect(-6, -6, 12, 12);
  ctx.restore();
  ctx.fillStyle = '#bfffdd';
  ctx.font = '18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('x ' + emeraldCount, 40, 58);

  // your carried-over legend, listed proudly
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '12px monospace';
  const gear = [];
  if (hasChippy) gear.push('Chippy');
  else if (hasGoldSword) gear.push('Golden Sword');
  if (hasGeckoArmor) gear.push('Gecko Skin Armor');
  else if (hasInfectedArmor) gear.push('Infected Armor');
  else if (hasArmor) gear.push('Plate Armor');
  ctx.fillText(gear.length ? 'gear from Explorer 1: ' + gear.join(', ')
                           : 'no Explorer 1 gear found — a fresh start!', 14, 82);

  // sword button for touch screens
  if (navigator.maxTouchPoints > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
