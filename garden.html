<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grow a Garden</title>

<!-- ADD TO HOME SCREEN / CAST TO THE TELLY
     This game has its OWN manifest, so "Add to Home Screen" gives it its own
     icon that opens straight into this game - not the arcade menu. display is
     "fullscreen", so it launches with no browser bar at all, which is also
     what makes it look right mirrored onto a TV. -->
<link rel="manifest" href="garden.webmanifest">
<meta name="theme-color" content="#2e4a2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grow A Garden">
<link rel="icon" href="icon-garden.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-garden.svg">

<style>
  html, body { margin: 0; background: #2e4a2a; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>

<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
  font-size: 13px !important; font-weight: 600 !important; letter-spacing: 0.3px !important;
  line-height: 1 !important; text-decoration: none !important; text-transform: none !important;
  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;
  background: rgba(40, 22, 44, 0.78) !important;
  color: #fff5e8 !important;
}
a.arcade-pill .ah-arrow { font-size: 14px !important; opacity: 0.9 !important; }
/* the floating version, for games that had nowhere to put it */
a.arcade-pill.arcade-float {
  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;
  z-index: 2147483000 !important;
}
</style>
</head>
<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<canvas id="game"></canvas>
<script>
// =====================================================================
// GROW A GARDEN
//
// Plant seeds. Wait. Harvest. Sell. Buy better seeds. Repeat forever.
// The sneaky-best part: plants grow by REAL clock time, so your garden
// keeps growing even while the game is closed. Come back after dinner
// and your pumpkins kept working the whole time.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// if ANYTHING crashes, shout it on screen so we can read it together
window.onerror = function (msg, src, line) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#7a1f2b;' +
    'color:#fff;font:bold 16px monospace;padding:14px;border:3px solid #ff6b5e;z-index:99';
  div.textContent = '💥 BUG FOUND! Line ' + line + ': ' + msg;
  document.body.appendChild(div);
};

// THE TOP OF THE SCREEN, in two rows.
//   row 1 (HEADER): the arcade pill - the way back, same as every other game
//   row 2 (the rest of TOPBAR): this garden's own controls
// HEADER is MEASURED from where the pill actually landed rather than guessed,
// because a phone with a notch pushes it down and a guess would overlap.
let HEADER = 46;
let TOPBAR = HEADER + 64;
function measureHeader() {
  const pill = document.getElementById('back');
  HEADER = pill ? Math.ceil(pill.getBoundingClientRect().bottom) + 8 : 46;
  TOPBAR = HEADER + 64;
}

function fitCanvas() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  measureHeader();
}
fitCanvas();
addEventListener('resize', fitCanvas);

// ---------------------------------------------------------------------
// THE CROPS — everything plantable lives in this one table.
// Want a new crop? Add one line here and it's in the shop.
//   cost   = what the seed costs in the shop
//   sell   = what a harvest pays you (always more than cost — that's farming)
//   grow   = seconds from seed to harvest-ready
// ---------------------------------------------------------------------
const CROPS = {
  carrot:    { name: 'Carrot',    icon: '🥕', cost: 5,  sell: 9,   grow: 30 },
  sunflower: { name: 'Sunflower', icon: '🌻', cost: 12, sell: 22,  grow: 90 },
  pumpkin:   { name: 'Pumpkin',   icon: '🎃', cost: 25, sell: 50,  grow: 240 },
  // ---- the FANTASY aisle: seeds that don't exist. except here. ----
  huckle:    { name: 'Spicy Huckleberry', icon: '🌶', cost: 40, sell: 88,  grow: 180 },
  flame:     { name: 'Flame Sprout',      icon: '🔥', cost: 60, sell: 135, grow: 300 },
};

// ---------------------------------------------------------------------
// THE GARDEN — a grid of soil plots. Each plot is either empty (null)
// or growing something: { type, at (when planted), watered }
// Growth is measured with Date.now() — the REAL clock — which is the
// whole trick behind offline growing.
// ---------------------------------------------------------------------
const PLOT_COLS = 8, PLOT_ROWS = 5;
let plots = [];
for (let i = 0; i < PLOT_COLS * PLOT_ROWS; i++) plots.push(null);

let coins = 20;
let ownCan = false;          // bought the watering can yet?
let ownScare = false;        // bought the scarecrow yet?
let crow = null;             // the menace itself (null = clear skies)
let crowTimer = 25;          // seconds until the next visit
let selected = 'carrot';     // what tool/seed is in your hand
let shopOpen = false;
let sparkles = [];           // little celebration bits
let statusText = 'Welcome! Open the SHOP, buy seeds, tap a plot to plant.';
let statusTimer = 6;
let elapsed = 0;

// how grown is this plot, from 0 (just planted) to 1 (ready)?
function growthOf(plot) {
  if (!plot) return 0;
  const secs = (Date.now() - plot.at) / 1000;
  const speed = plot.watered ? 2 : 1;          // watered = twice as fast
  return Math.min(1, (secs * speed) / CROPS[plot.type].grow);
}

// ---------------------------------------------------------------------
// SAVING — the garden writes itself into the browser's storage box
// after every action, and reads itself back when the game opens.
// ---------------------------------------------------------------------
function save() {
  localStorage.setItem('garden_save', JSON.stringify({ coins, ownCan, ownScare, plots }));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('garden_save'));
    if (d) { coins = d.coins; ownCan = d.ownCan; ownScare = !!d.ownScare; plots = d.plots; }
  } catch (e) {}                                // bad save? start fresh, no drama
}
load();

function setStatus(t) { statusText = t; statusTimer = 3.5; }

// ---------------------------------------------------------------------
// LAYOUT — where the plots sit on screen (recomputed so any screen works)
// ---------------------------------------------------------------------
function plotSize() {
  const w = (canvas.width - 40) / PLOT_COLS;
  const h = (canvas.height - TOPBAR - 90) / PLOT_ROWS;
  return Math.min(w, h, 110);
}
function plotRect(i) {
  const s = plotSize();
  const gw = PLOT_COLS * s, gh = PLOT_ROWS * s;
  const ox = (canvas.width - gw) / 2;
  const oy = TOPBAR + (canvas.height - TOPBAR - 70 - gh) / 2;
  return { x: ox + (i % PLOT_COLS) * s, y: oy + Math.floor(i / PLOT_COLS) * s, s };
}

// ---------------------------------------------------------------------
// THE SHOP — seeds, and gear at the bottom
// ---------------------------------------------------------------------
function shopItems() {
  const items = Object.keys(CROPS).map(k => ({
    kind: 'seed', key: k,
    label: `${CROPS[k].icon} ${CROPS[k].name} seed`,
    info: `sells for ${CROPS[k].sell}c · ${CROPS[k].grow}s to grow`,
    cost: CROPS[k].cost,
  }));
  items.push({
    kind: 'gear', key: 'can',
    label: '🚿 Watering Can',
    info: ownCan ? 'OWNED — just tap growing plants to water!' : 'water makes plants grow 2x faster',
    cost: ownCan ? 0 : 30,
  });
  items.push({
    kind: 'gear', key: 'scare',
    label: '🎃 Scarecrow',
    info: ownScare ? 'OWNED — standing guard by your garden' : 'crows visit less and flee before they can eat',
    cost: ownScare ? 0 : 80,
  });
  return items;
}
function shopRects() {
  const items = shopItems();
  const w = Math.min(430, canvas.width - 30), h = 62, gap = 8;
  const x = (canvas.width - w) / 2;
  const y0 = TOPBAR + 40;
  return items.map((it, i) => ({ ...it, x, y: y0 + i * (h + gap), w, h }));
}

function buyOrPick(item) {
  if (item.kind === 'seed') {
    selected = item.key;                        // seeds: just pick them —
    shopOpen = false;                           // you pay when you PLANT
    setStatus(`${CROPS[item.key].icon} seed in hand — tap a plot to plant (${item.cost}c each)`);
  } else if (item.key === 'can') {
    if (ownCan) {
      selected = 'can';
      shopOpen = false;
      setStatus('🚿 Watering can in hand — tap a growing plant!');
    } else if (coins >= 30) {
      coins -= 30;
      ownCan = true;
      shopOpen = false;
      setStatus('You bought the watering can! Now tapping any growing plant waters it.');
      save();
    } else {
      setStatus("Not enough coins for the can yet — keep farming!");
    }
  } else if (item.key === 'scare') {
    if (ownScare) {
      setStatus('🎃 Your scarecrow is already on duty. Crows hate him.');
      shopOpen = false;
    } else if (coins >= 80) {
      coins -= 80;
      ownScare = true;
      shopOpen = false;
      setStatus('🎃 Scarecrow planted! Crows will think twice now.');
      save();
    } else {
      setStatus('The scarecrow costs 80c — a few more harvests!');
    }
  }
}

// ---------------------------------------------------------------------
// TAPPING THE GARDEN — plant, water, or harvest, depending
// ---------------------------------------------------------------------
function tapPlot(i) {
  const plot = plots[i];
  const r = plotRect(i);

  if (plot && growthOf(plot) >= 1) {
    // HARVEST! the whole point of everything
    const crop = CROPS[plot.type];
    coins += crop.sell;
    plots[i] = null;
    for (let k = 0; k < 12; k++) {
      sparkles.push({
        x: r.x + r.s / 2, y: r.y + r.s / 2,
        vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 260 - 40,
        life: 0.8, color: k % 2 ? '#ffd23f' : '#aef28b',
      });
    }
    setStatus(`${crop.icon} Harvested! +${crop.sell} coins`);
    save();
    return;
  }

  // own the watering can? then clicking ANY growing plant waters it —
  // no need to put your seeds away. The can lives in your back pocket.
  if (plot && ownCan && !plot.watered) {
    // WATER — the plant keeps the progress it has, then grows 2x from here
    const done = growthOf(plot) * CROPS[plot.type].grow;   // seconds "already grown"
    plot.watered = true;
    plot.at = Date.now() - done * 500;                     // re-aim the clock at 2x speed
    for (let k = 0; k < 8; k++) {
      sparkles.push({
        x: r.x + r.s / 2, y: r.y + r.s * 0.3,
        vx: (Math.random() - 0.5) * 120, vy: Math.random() * 120 + 30,
        life: 0.6, color: '#7dd3ff',
      });
    }
    setStatus('💧 Watered! Growing twice as fast now.');
    save();
    return;
  }

  // clicked a growing plant but can't water it? SAY SO — silence is confusing
  if (plot) {
    if (!ownCan) {
      setStatus("It's growing! Buy the 🚿 Watering Can (30c) to make plants grow faster.");
    } else if (plot.watered) {
      setStatus('💧 Already watered — growing double-speed. Patience, farmer!');
    }
    return;
  }

  if (!plot && CROPS[selected]) {
    // PLANT a seed (this is where you pay for it)
    const crop = CROPS[selected];
    if (coins < crop.cost) {
      setStatus(`Need ${crop.cost}c for a ${crop.name} seed — harvest something first!`);
      return;
    }
    coins -= crop.cost;
    plots[i] = { type: selected, at: Date.now(), watered: false };
    setStatus(`${crop.icon} planted! Ready in ${crop.grow} seconds${ownCan ? ' (or water it!)' : ''}`);
    save();
  }
}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
function shopBtnRect() { return { x: canvas.width - 130, y: HEADER + 12, w: 118, h: 40 }; }
// the DRAG ME button, right next to the shop: press, hold, drag, drop!
function dragBtnRect() { return { x: canvas.width - 262, y: HEADER + 12, w: 124, h: 40 }; }
let dragItem = null;               // what's floating under your finger right now
let dragPos = { x: 0, y: 0 };
function inside(px, py, r) { return px > r.x && px < r.x + r.w && py > r.y && py < r.y + (r.h || r.s); }

function press(px, py) {
  if (shopOpen) {
    for (const r of shopRects()) {
      if (inside(px, py, r)) { buyOrPick(r); return; }
    }
    shopOpen = false;                            // tapped away — close the shop
    return;
  }
  if (inside(px, py, shopBtnRect())) { shopOpen = true; return; }
  // clicked the crow?! SHOO!!
  if (crow && crow.state !== 'flee' && Math.hypot(px - crow.x, py - crow.y) < 42) {
    crow.state = 'flee';
    setStatus('You shooed the crow away!! 🐦💨');
    return;
  }
  for (let i = 0; i < plots.length; i++) {
    if (inside(px, py, plotRect(i))) { tapPlot(i); return; }
  }
}

// which plot is under this point? (-1 for none)
function plotAt(px, py) {
  for (let i = 0; i < plots.length; i++) {
    if (inside(px, py, plotRect(i))) return i;
  }
  return -1;
}

// LEFT CLICK plants (and harvests, and waters). Hold it down and DRAG
// to sweep across a whole row — every plot you pass over gets a tap.
let dragging = false;
let lastPlot = -1;

addEventListener('mousedown', e => {
  if (e.button !== 0) return;          // left button only — the planting hand
  if (!shopOpen && inside(e.clientX, e.clientY, dragBtnRect())) {
    dragItem = selected;               // picked up off the button — now carry it!
    dragPos = { x: e.clientX, y: e.clientY };
    return;
  }
  dragging = true;
  lastPlot = -1;
  press(e.clientX, e.clientY);
  const i = plotAt(e.clientX, e.clientY);
  if (i >= 0) lastPlot = i;            // remember it so the drag doesn't double-tap
});
addEventListener('mousemove', e => {
  if (dragItem) { dragPos = { x: e.clientX, y: e.clientY }; return; }
  if (!dragging || shopOpen) return;
  const i = plotAt(e.clientX, e.clientY);
  if (i >= 0 && i !== lastPlot) { lastPlot = i; tapPlot(i); }
});
addEventListener('mouseup', e => {
  if (dragItem) {                      // release = drop it into the slot below
    const i = plotAt(e.clientX, e.clientY);
    if (i >= 0) tapPlot(i);
    dragItem = null;
  }
  dragging = false;
  lastPlot = -1;
});
addEventListener('contextmenu', e => e.preventDefault());   // right-click stays out of it

// fingers get the same drag-to-plant powers
addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (!shopOpen && inside(t.clientX, t.clientY, dragBtnRect())) {
    dragItem = selected;
    dragPos = { x: t.clientX, y: t.clientY };
    return;
  }
  dragging = true;
  lastPlot = -1;
  press(t.clientX, t.clientY);
  const i = plotAt(t.clientX, t.clientY);
  if (i >= 0) lastPlot = i;
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (dragItem) { dragPos = { x: t.clientX, y: t.clientY }; return; }
  if (!dragging || shopOpen) return;
  const i = plotAt(t.clientX, t.clientY);
  if (i >= 0 && i !== lastPlot) { lastPlot = i; tapPlot(i); }
}, { passive: false });
addEventListener('touchend', e => {
  if (dragItem) {
    const t = e.changedTouches[0];
    const i = plotAt(t.clientX, t.clientY);
    if (i >= 0) tapPlot(i);
    dragItem = null;
  }
  dragging = false;
  lastPlot = -1;
});

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function drawPlant(plot, r) {
  const g = growthOf(plot);                      // 0 (seed) .. 1 (ready)
  const cx = r.x + r.s / 2, base = r.y + r.s * 0.78;
  const crop = CROPS[plot.type];

  if (g < 0.15) {
    // freshly planted: a little mound with a hopeful sprout
    ctx.fillStyle = '#4a3520';
    ctx.beginPath(); ctx.ellipse(cx, base, r.s * 0.14, r.s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(cx - 1, base - r.s * 0.1, 2, r.s * 0.1);
  } else if (plot.type === 'carrot') {
    // feathery green top, and the carrot peeks out when it's ready
    const h = r.s * (0.12 + g * 0.25);
    ctx.strokeStyle = '#5da03c'; ctx.lineWidth = 2;
    for (let f = -1; f <= 1; f++) {
      ctx.beginPath();
      ctx.moveTo(cx, base);
      ctx.quadraticCurveTo(cx + f * r.s * 0.08, base - h * 0.6, cx + f * r.s * 0.14, base - h);
      ctx.stroke();
    }
    if (g >= 1) {
      ctx.fillStyle = '#ff8f2b';
      ctx.beginPath();
      ctx.moveTo(cx - r.s * 0.07, base);
      ctx.lineTo(cx + r.s * 0.07, base);
      ctx.lineTo(cx, base + r.s * 0.16);
      ctx.closePath(); ctx.fill();
    }
  } else if (plot.type === 'sunflower') {
    // the stem climbs, then the big happy head opens
    const h = r.s * (0.15 + g * 0.42);
    ctx.strokeStyle = '#4f8a34'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx, base - h); ctx.stroke();
    ctx.fillStyle = '#5da03c';                   // two leaves
    ctx.beginPath(); ctx.ellipse(cx - r.s * 0.08, base - h * 0.45, r.s * 0.08, r.s * 0.035, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + r.s * 0.08, base - h * 0.6, r.s * 0.08, r.s * 0.035, 0.5, 0, Math.PI * 2); ctx.fill();
    if (g > 0.55) {
      const head = r.s * 0.07 + (g - 0.55) * r.s * 0.25;
      ctx.fillStyle = '#ffd23f';                 // petals
      for (let p = 0; p < 10; p++) {
        const a = p / 10 * Math.PI * 2 + elapsed * 0.15;
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(a) * head, base - h + Math.sin(a) * head,
                    head * 0.5, head * 0.24, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#6d4a26';                 // the middle
      ctx.beginPath(); ctx.arc(cx, base - h, head * 0.55, 0, Math.PI * 2); ctx.fill();
    }
  } else if (plot.type === 'flame') {
    // a plant whose leaves are little FLAMES. do not touch. do not sniff.
    const h = r.s * (0.12 + g * 0.35);
    const flick = Math.sin(elapsed * 8 + cx) * 0.2;
    ctx.strokeStyle = '#5a3a2a'; ctx.lineWidth = 3;    // charcoal stem
    ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx, base - h); ctx.stroke();
    for (let f = 0; f < 2 + Math.floor(g * 3); f++) {  // flame-leaves flicker
      const fy = base - h * (0.3 + f * 0.22);
      const side = f % 2 ? 1 : -1;
      const fs = r.s * (0.06 + g * 0.06);
      ctx.fillStyle = '#ff8f2b';
      ctx.beginPath();
      ctx.moveTo(cx + side * 2, fy);
      ctx.quadraticCurveTo(cx + side * fs * 2, fy - fs * (1.5 + flick),
                           cx + side * fs * 1.2, fy - fs * 2.4);
      ctx.quadraticCurveTo(cx + side * fs * 0.4, fy - fs * 1.2, cx + side * 2, fy);
      ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.ellipse(cx + side * fs, fy - fs, fs * 0.4, fs * 0.7, side * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    if (g >= 1) {
      // the FLAME BLOOM — a fire flower with a white-hot heart
      const fh = base - h;
      const blaze = r.s * (0.16 + Math.sin(elapsed * 6) * 0.02);
      ctx.fillStyle = '#ff6b2b';
      ctx.beginPath();
      ctx.moveTo(cx - blaze * 0.8, fh);
      ctx.quadraticCurveTo(cx - blaze, fh - blaze * 1.4, cx, fh - blaze * 2);
      ctx.quadraticCurveTo(cx + blaze, fh - blaze * 1.4, cx + blaze * 0.8, fh);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.ellipse(cx, fh - blaze * 0.7, blaze * 0.45, blaze * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff6e0';
      ctx.beginPath(); ctx.ellipse(cx, fh - blaze * 0.5, blaze * 0.2, blaze * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      for (let e = 0; e < 3; e++) {                    // embers rising
        const ea = (elapsed * 1.4 + e * 2.1) % 2;
        ctx.fillStyle = `rgba(255, 160, 60, ${1 - ea / 2})`;
        ctx.fillRect(cx + Math.sin(elapsed * 3 + e * 4) * blaze,
                     fh - blaze * 1.6 - ea * r.s * 0.2, 3, 3);
      }
    }
  } else if (plot.type === 'huckle') {
    // a bush of huckleberries so spicy they GLOW
    const bs = r.s * (0.08 + g * 0.2);
    ctx.fillStyle = '#3f7a34';
    ctx.beginPath(); ctx.arc(cx, base - bs * 0.6, bs, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - bs * 0.8, base - bs * 0.3, bs * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + bs * 0.8, base - bs * 0.3, bs * 0.7, 0, Math.PI * 2); ctx.fill();
    if (g > 0.4) {
      // the berries arrive... and then they start to SMOULDER
      const n = Math.floor((g - 0.4) / 0.6 * 6) + 1;
      for (let b = 0; b < n; b++) {
        const bx = cx + Math.sin(b * 2.7) * bs * 1.1;
        const by = base - bs * 0.5 - Math.cos(b * 1.9) * bs * 0.5;
        if (g >= 1) {                                  // ripe = glowing like coals
          const hot = 0.5 + Math.sin(elapsed * 6 + b) * 0.5;
          ctx.fillStyle = `rgba(255, 80, 40, ${0.35 * hot})`;
          ctx.beginPath(); ctx.arc(bx, by, r.s * 0.06, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = g >= 1 ? '#e8453c' : '#8a3a5a';
        ctx.beginPath(); ctx.arc(bx, by, r.s * 0.032, 0, Math.PI * 2); ctx.fill();
      }
      if (g >= 1) {
        // spicy heat squiggles, rising off the bush
        ctx.strokeStyle = 'rgba(255, 120, 60, 0.5)';
        ctx.lineWidth = 1.5;
        for (let q = 0; q < 2; q++) {
          const qx = cx + (q ? bs * 0.6 : -bs * 0.6);
          ctx.beginPath();
          ctx.moveTo(qx, base - bs * 1.6);
          ctx.quadraticCurveTo(qx + Math.sin(elapsed * 5 + q * 3) * 4, base - bs * 2,
                               qx, base - bs * 2.4);
          ctx.stroke();
        }
      }
    }
  } else if (plot.type === 'pumpkin') {
    // a creeping vine, then the pumpkin swells up big and proud
    ctx.strokeStyle = '#4f8a34'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - r.s * 0.2, base);
    ctx.quadraticCurveTo(cx, base - r.s * 0.16 * g, cx + r.s * 0.2 * g, base);
    ctx.stroke();
    if (g > 0.3) {
      const pr = r.s * 0.06 + (g - 0.3) * r.s * 0.3;
      ctx.fillStyle = g >= 1 ? '#ff8f2b' : '#7cb342';   // green until ripe!
      ctx.beginPath(); ctx.ellipse(cx, base - pr * 0.4, pr, pr * 0.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, base - pr * 1.1); ctx.lineTo(cx, base + pr * 0.35); ctx.stroke();
      ctx.fillStyle = '#4f8a34';
      ctx.fillRect(cx - 1.5, base - pr * 1.35, 3, pr * 0.3);
    }
  }
}

function draw(dt) {
  // ---- THE CROW'S TINY EVIL BRAIN ----
  if (!crow) {
    crowTimer -= dt;
    if (crowTimer <= 0) {
      // scarecrow owners get visited half as often
      crowTimer = (35 + Math.random() * 35) * (ownScare ? 2 : 1);
      const targets = [];
      for (let i = 0; i < plots.length; i++) if (plots[i]) targets.push(i);
      if (targets.length) {
        const t = targets[Math.floor(Math.random() * targets.length)];
        const r = plotRect(t);
        crow = {
          state: 'fly', target: t,
          x: Math.random() < 0.5 ? -40 : canvas.width + 40,
          y: TOPBAR + 30 + Math.random() * 100,
          tx: r.x + r.s / 2, ty: r.y + r.s * 0.55,
          peck: 0, eat: 0, flap: 0,
        };
        setStatus('🐦 A crow is coming for your garden!! CLICK IT!');
      }
    }
  } else {
    crow.flap += dt * 12;
    if (crow.state === 'fly') {
      const d = Math.hypot(crow.tx - crow.x, crow.ty - crow.y);
      if (d < 6) crow.state = 'peck';
      else {
        crow.x += (crow.tx - crow.x) / d * 260 * dt;
        crow.y += (crow.ty - crow.y) / d * 260 * dt;
      }
      if (!plots[crow.target]) crow.state = 'flee';   // target gone mid-flight
    } else if (crow.state === 'peck') {
      crow.eat += dt;
      crow.peck += dt * 8;
      if (ownScare && crow.eat > 2.5) {
        crow.state = 'flee';                     // the pumpkin face strikes fear
        setStatus('🎃 The scarecrow spooked the crow away!');
      } else if (!plots[crow.target]) {
        crow.state = 'flee';                     // you harvested it first — HA
      } else if (crow.eat >= 6) {
        const eaten = CROPS[plots[crow.target].type];
        plots[crow.target] = null;
        save();
        setStatus('🐦 The crow ATE your ' + eaten.name + '!! So rude.');
        for (let k = 0; k < 10; k++) {
          sparkles.push({ x: crow.x, y: crow.y,
            vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 200,
            life: 0.7, color: k % 2 ? '#2a2a30' : '#4a7c3a' });
        }
        crow.state = 'flee';
      }
    } else if (crow.state === 'flee') {
      crow.x += (crow.x < canvas.width / 2 ? -1 : 1) * 380 * dt;
      crow.y -= 140 * dt;
      if (crow.x < -60 || crow.x > canvas.width + 60) crow = null;
    }
  }

  // lawn
  ctx.fillStyle = '#568a3f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // the scarecrow, standing guard beside the garden (once you own it)
  if (ownScare) {
    const r0 = plotRect(0);
    const sx = r0.x - 42, sy = r0.y + 14;
    ctx.strokeStyle = '#6d5330'; ctx.lineWidth = 4;    // pole and arms
    ctx.beginPath(); ctx.moveTo(sx, sy + 52); ctx.lineTo(sx, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx - 17, sy + 14); ctx.lineTo(sx + 17, sy + 14); ctx.stroke();
    ctx.fillStyle = '#c9a83c';                         // straw hands
    ctx.fillRect(sx - 21, sy + 11, 6, 7); ctx.fillRect(sx + 15, sy + 11, 6, 7);
    ctx.fillStyle = '#ff8f2b';                         // the pumpkin head
    ctx.beginPath(); ctx.ellipse(sx, sy - 6, 12, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a3520';                         // spooky face
    ctx.fillRect(sx - 6, sy - 10, 3.5, 3.5); ctx.fillRect(sx + 2.5, sy - 10, 3.5, 3.5);
    ctx.fillRect(sx - 4.5, sy - 3, 9, 2.5);
  }

  // the plots
  for (let i = 0; i < plots.length; i++) {
    const r = plotRect(i);
    const plot = plots[i];
    ctx.fillStyle = plot && plot.watered ? '#4a3520' : '#6b4a2e';   // wet soil is darker
    ctx.fillRect(r.x + 3, r.y + 3, r.s - 6, r.s - 6);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 3, r.y + 3, r.s - 6, r.s - 6);

    if (plot) {
      drawPlant(plot, r);
      const g = growthOf(plot);
      if (g >= 1) {
        // READY — golden sparkle ring so you can't miss it
        const tw = 0.5 + Math.sin(elapsed * 5 + i) * 0.5;
        ctx.strokeStyle = `rgba(255, 210, 63, ${0.4 + tw * 0.5})`;
        ctx.lineWidth = 3;
        ctx.strokeRect(r.x + 5, r.y + 5, r.s - 10, r.s - 10);
      } else {
        // a tiny green progress bar along the bottom
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(r.x + 8, r.y + r.s - 12, r.s - 16, 5);
        ctx.fillStyle = plot.watered ? '#7dd3ff' : '#aef28b';
        ctx.fillRect(r.x + 8, r.y + r.s - 12, (r.s - 16) * g, 5);
      }
    }
  }

  // sparkles
  for (const sp of sparkles) {
    sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    sp.vy += 500 * dt; sp.life -= dt;
    ctx.globalAlpha = Math.max(0, sp.life);
    ctx.fillStyle = sp.color;
    ctx.fillRect(sp.x - 3, sp.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;
  sparkles = sparkles.filter(sp => sp.life > 0);

  // ---- THE CROW ITSELF ----
  if (crow) {
    const flapW = Math.sin(crow.flap) * (crow.state === 'peck' ? 2 : 8);
    const peckDip = crow.state === 'peck' ? Math.max(0, Math.sin(crow.peck)) * 6 : 0;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(crow.x, crow.y + 14, 12, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#23242c';                         // glossy black body
    ctx.beginPath(); ctx.ellipse(crow.x, crow.y, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    // wings — big beats in flight, tucked-in twitches while eating
    ctx.beginPath(); ctx.ellipse(crow.x - 6, crow.y - 4, 9, 4 + flapW * 0.4, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(crow.x + 6, crow.y - 4, 9, 4 + flapW * 0.4, 0.6, 0, Math.PI * 2); ctx.fill();
    // head dips with every peck
    ctx.beginPath(); ctx.arc(crow.x + 8, crow.y - 6 + peckDip, 5.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff9f43';                         // the beak
    ctx.beginPath();
    ctx.moveTo(crow.x + 12, crow.y - 6 + peckDip);
    ctx.lineTo(crow.x + 19, crow.y - 4 + peckDip);
    ctx.lineTo(crow.x + 12, crow.y - 2 + peckDip);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';                            // one beady, guilty eye
    ctx.beginPath(); ctx.arc(crow.x + 9, crow.y - 7 + peckDip, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(crow.x + 9.5, crow.y - 7 + peckDip, 0.8, 0, Math.PI * 2); ctx.fill();
    // the danger ring while it's eating — CLICK IT!!
    if (crow.state === 'peck') {
      ctx.strokeStyle = `rgba(255, 80, 60, ${0.5 + Math.sin(elapsed * 8) * 0.4})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(crow.x, crow.y, 24, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#ff6b5e';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('CLICK ME!', crow.x, crow.y - 28);
    }
  }

  // top bar
  ctx.fillStyle = '#1d3020';
  ctx.fillRect(0, 0, canvas.width, TOPBAR);
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 22px monospace';
  ctx.textAlign = 'left';
  // On a phone there isn't room for the long labels before the buttons start,
  // so the coin count goes short and the "holding" line steps aside - the drag
  // button already shows what you're carrying.
  const roomy = canvas.width >= 560;
  ctx.fillText(roomy ? `🪙 ${coins} coins` : `🪙 ${coins}`, 16, HEADER + 40);
  const sel = CROPS[selected];
  if (roomy) {
    ctx.fillStyle = '#cfe8cf';
    ctx.font = '15px monospace';
    ctx.fillText('holding: ' + (sel ? sel.icon + ' ' + sel.name + ' seed' : '🚿 watering can'),
                 190, HEADER + 38);
  }
  const sb = shopBtnRect();
  ctx.fillStyle = '#7a5a1f';
  ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;
  ctx.strokeRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 17px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🛒 SHOP', sb.x + sb.w / 2, sb.y + 26);

  // the DRAG ME button — hold it, carry the seed, drop it in a slot
  const db = dragBtnRect();
  ctx.fillStyle = dragItem ? '#3d6b30' : '#2c4a2e';
  ctx.fillRect(db.x, db.y, db.w, db.h);
  ctx.strokeStyle = '#7ddf8f'; ctx.lineWidth = 2;
  ctx.strokeRect(db.x, db.y, db.w, db.h);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 13px monospace';
  ctx.fillText((CROPS[selected] ? CROPS[selected].icon : '🚿') + ' drag me!',
               db.x + db.w / 2, db.y + 26);

  // the seed floating under your finger, mid-drag
  if (dragItem) {
    const over = plotAt(dragPos.x, dragPos.y);
    if (over >= 0) {                   // light up the slot it would land in
      const r = plotRect(over);
      ctx.strokeStyle = '#aef28b';
      ctx.lineWidth = 4;
      ctx.strokeRect(r.x + 3, r.y + 3, r.s - 6, r.s - 6);
    }
    ctx.font = '42px monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.85;
    ctx.fillText(CROPS[dragItem] ? CROPS[dragItem].icon : '🚿',
                 dragPos.x, dragPos.y + 14);
    ctx.globalAlpha = 1;
  }

  // status line at the bottom
  if (statusTimer > 0) {
    statusTimer -= dt;
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, statusTimer)})`;
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(statusText, canvas.width / 2, canvas.height - 24);
  }

  // the shop overlay
  if (shopOpen) {
    ctx.fillStyle = 'rgba(10, 18, 10, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('🛒 THE GARDEN SHOP', canvas.width / 2, TOPBAR + 20);
    for (const r of shopRects()) {
      const afford = r.cost === 0 || coins >= (r.kind === 'seed' ? CROPS[r.key].cost : r.cost);
      ctx.fillStyle = afford ? '#2c4a2e' : '#2c2c26';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = afford ? '#7ddf8f' : '#5a5a4e';
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = afford ? '#ffffff' : '#8a8a7e';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(r.label, r.x + 12, r.y + 26);
      ctx.font = '12px monospace';
      ctx.fillStyle = '#b8d4b8';
      ctx.fillText(r.info, r.x + 12, r.y + 48);
      if (r.cost > 0) {
        ctx.textAlign = 'right';
        ctx.fillStyle = afford ? '#ffd23f' : '#8a8a7e';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(r.cost + 'c', r.x + r.w - 12, r.y + 32);
      }
    }
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  elapsed += dt;
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
