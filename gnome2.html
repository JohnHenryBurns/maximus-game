  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0,    "#1a0a1e");
  sky.addColorStop(0.55, "#3a1209");
  sky.addColorStop(1,    "#7a2405");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // A colour wash that gets stronger the higher you climb, so each stage
  // FEELS different - the sky bruises from purple to green to red as you
  // go up. It's only a thin veil over the real sky, so you can still see
  // the lava glow underneath.
  const bands = ["#1a0a2a", "#3a0a5a", "#0a3a2a", "#5a0a2a", "#2a2a5a"];
  const band = bands[stage % bands.length];
  ctx.globalAlpha = Math.min(0.4, stage * 0.03);
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // screenY() turns a world position into a screen position.
  // This one tiny function is what makes the camera work.
  const screenY = wy => wy - cameraY;

  drawPole(screenY);
  for (const p of platforms) drawLedge(p, screenY);
  for (const p of powerups) drawPowerup(p, screenY);
  for (const m of monsters) drawMonster(m, screenY);
  if (boss) drawBoss(screenY);
  for (const b of bullets) drawBullet(b, screenY);
  for (const s of bossShots) drawBossShot(s, screenY);
  for (const f of fireballs) drawFireball(f, screenY);
  if (!dead) drawGnome(screenY);
  drawLava(screenY);

  // A cold blue frost creeps in from the edges while the lava's frozen,
  // so you can SEE that the freeze is on (and feel it running out).
  if (powerTimers.freeze > 0) {
    const frost = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
    frost.addColorStop(0, "rgba(150,230,255,0)");
    frost.addColorStop(1, "rgba(150,230,255,0.28)");
    ctx.fillStyle = frost;
    ctx.fillRect(0, 0, W, H);
  }

  // PSYCHEDELIC MODE. Two tricks stacked:
  //   1. A CSS hue-rotate on the whole canvas, spinning the colours round
  //      and round, so everything shimmers through the rainbow.
  //   2. The strip-warp below, which makes the whole game world ripple.
  // We warp the WORLD (drawn above) but leave the buttons and HUD (drawn
  // below) crisp, so you can still read your score and hit the controls
  // while everything else goes wooOOoo.
  if (powerTimers.psych > 0) {
    const hue = (performance.now() / 12) % 360;
    canvas.style.filter = "hue-rotate(" + hue + "deg) saturate(1.9) contrast(1.1)";
    applyPsychWarp();
  } else if (canvas.style.filter) {
    canvas.style.filter = "";     // snap back to normal the moment it ends
  }

  drawBossBar();
  drawHud();
  drawBanner();
  drawItemPopups();
  drawButtons();
}

// Ripple the finished picture. Copy it to the spare canvas, then paint it
// back one thin horizontal strip at a time, each nudged sideways by a sine
// wave. Strips that don't line up any more = a lovely wobbly heat-haze.
function applyPsychWarp() {
  if (warpCanvas.width !== W) { warpCanvas.width = W; warpCanvas.height = H; }
  const t = performance.now() / 200;

  warpCtx.clearRect(0, 0, W, H);
  warpCtx.drawImage(canvas, 0, 0);

  // A dark backdrop so the shifted strips don't leave see-through gaps.
  ctx.fillStyle = "#0a0014";
  ctx.fillRect(0, 0, W, H);

  const strip = 6;
  const amp = 14 * (0.6 + 0.4 * Math.sin(t * 0.7));
  for (let y = 0; y < H; y += strip) {
    const dx = Math.sin(y / 26 + t) * amp;
    ctx.drawImage(warpCanvas, 0, y, W, strip, dx, y, W, strip);
  }
}

// The three thumb buttons. They light up while a finger is on them -
// which matters more than it sounds. Without that you can never tell
// whether the game missed your press or your thumb simply slipped off
// the edge, and those two problems get fixed in completely different ways.
function drawButtons() {
  if (!usingTouch) return;

  // save() and restore() are a bookmark. Canvas settings STICK - change
  // textBaseline here and the HEIGHT counter up top quietly moves next
  // frame, in a completely different function, for no visible reason.
  // save() now, restore() at the end, and nothing leaks out.
  ctx.save();

  const pressed = new Set(fingers.values());

  for (const b of BUTTONS) {
    const on = pressed.has(b.name);

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = on ? "rgba(255, 190, 120, 0.42)"
                       : "rgba(20, 12, 10, 0.34)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = on ? "rgba(255, 220, 170, 0.95)"
                         : "rgba(255, 210, 160, 0.42)";
    ctx.stroke();

    ctx.fillStyle = on ? "#fff4e0" : "rgba(255, 226, 190, 0.72)";
    ctx.font = (b.name === "jump" ? "bold 22px" : "30px") + " system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(b.label, b.x, b.y + 1);
  }

  ctx.restore();
}

function drawPole(screenY) {
  // The great stone pole, going from the lava up past the top of the screen.
  //
  // THE BIG BUG FIX. Version 1 wrote `const top = screenY(-100000)`, which
  // means "start the pole at world-height -100000". That's a fixed spot.
  // It worked fine... right up until you actually climbed past it, at
  // about 5000m. Once the camera went higher than that, the top of the
  // pole slid down into view and there was nothing but sky above it - the
  // whole tower looked like it had vanished.
  //
  // The pole is supposed to go up FOREVER, so it should always be drawn
  // from the top of the SCREEN, not from some number we picked once and
  // hoped was big enough. `-10` is just off the top edge. Now it can never
  // run out, no matter how ridiculously high you get.
  const top = -10;
  const bottom = screenY(lavaY) + 40;

  const stone = ctx.createLinearGradient(POLE_LEFT, 0, POLE_RIGHT, 0);
  stone.addColorStop(0,    "#3c3a44");
  stone.addColorStop(0.35, "#6a6676");
  stone.addColorStop(1,    "#2e2c36");
  ctx.fillStyle = stone;
  ctx.fillRect(POLE_LEFT, top, POLE_WIDTH, bottom - top);

  // Brick lines, so you can SEE that it's sinking. Without these the
  // pole looks like it's standing still even though it isn't.
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 2;
  const firstBrick = Math.floor(cameraY / 46) * 46;
  for (let wy = firstBrick; wy < cameraY + H; wy += 46) {
    const sy = screenY(wy);
    ctx.beginPath();
    ctx.moveTo(POLE_LEFT, sy);
    ctx.lineTo(POLE_RIGHT, sy);
    ctx.stroke();
  }
}

function drawLedge(p, screenY) {
  const sy = screenY(p.y);
  if (sy < -40 || sy > H + 40) return;   // off screen? don't bother drawing.

  // HOW CLOSE IS IT TO GOING? 0 = untouched, 1 = about to give way.
  // Everything below reads from this one number.
  let strain = 0;
  if (!p.safe && CRUMBLE_TIME > WOBBLE_WARNING) {
    strain = (p.stood - (CRUMBLE_TIME - WOBBLE_WARNING)) / WOBBLE_WARNING;
    if (strain < 0) strain = 0;
    if (strain > 1) strain = 1;
  }

  // Shake, harder the closer it gets. Math.sin with the frame count
  // makes it buzz back and forth; multiplying by strain means an
  // untouched ledge sits perfectly still.
  const shake = strain === 0 ? 0
              : Math.sin(shakeClock * 1.4) * 3.2 * strain;

  const x = p.x + shake;

  ctx.save();
  if (p.falling) {
    // Fading out as it drops. Once it's see-through it's obviously not
    // something you can land on any more.
    ctx.globalAlpha = Math.max(0, 1 - p.vy / 26);
  } else if (p.fadeIn > 0) {
    // Fading back IN. Appearing instantly would look like a glitch;
    // half a second of shimmer reads as "it rebuilt itself".
    ctx.globalAlpha = 1 - p.fadeIn / 14;
  }

  // THE BOSS ARENA FLOOR gets its own gold-lit look (while it's still
  // solid), so it reads as "stand here and fight the boss" rather than a
  // normal ledge that's about to crumble. Once it's falling it drops the
  // special treatment and tumbles away grey, like any other ledge.
  if (p.arena && !p.falling) {
    const pulse = 0.5 + 0.5 * Math.sin(shakeClock * 0.12);
    ctx.fillStyle = "#7a5a2a";
    ctx.fillRect(x, sy, p.w, 14);
    ctx.fillStyle = "#3a2c14";
    ctx.fillRect(x, sy + 10, p.w, 6);       // shadow under the lip
    ctx.fillStyle = "rgba(255, 214, 130, " + (0.55 + pulse * 0.4) + ")";
    ctx.fillRect(x, sy, p.w, 3);            // a glowing top edge that breathes
    ctx.restore();
    return;
  }

  // Redden as it strains. Mixing from grey towards a hot orange, so it
  // looks like the lava is already getting to it.
  const r = Math.round(139 + strain * 90);
  const g = Math.round(132 - strain * 62);
  const b = Math.round(150 - strain * 110);

  ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
  ctx.fillRect(x, sy, p.w, 12);
  ctx.fillStyle = "#565062";
  ctx.fillRect(x, sy + 8, p.w, 8);       // shadow under the lip
  ctx.fillStyle = strain > 0.5 ? "#ffd08a" : "#b9b2c4";
  ctx.fillRect(x, sy, p.w, 3);           // bright top edge

  // Cracks, once it's really struggling.
  if (strain > 0.35 && !p.falling) {
    ctx.strokeStyle = "rgba(20,10,14,0.75)";
    ctx.lineWidth = 1.6;
    for (let i = 1; i < 4; i++) {
      const cx = x + (p.w * i) / 4;
      ctx.beginPath();
      ctx.moveTo(cx, sy);
      ctx.lineTo(cx + 4 - i * 2, sy + 12);
      ctx.stroke();
    }
  }

  ctx.restore();
}

// A bullet: a short bright streak rather than a dot. Drawing it stretched
// out along the way it's travelling is an old trick - your eye reads the
// smear as speed, and a round dot at this size just looks like a crumb.
function drawBullet(b, screenY) {
  const sy = screenY(b.y);
  if (sy < -20 || sy > H + 20) return;

  // The streak points back along the way it's travelling. It used to
  // just go flat sideways, which was fine when bullets only ever flew
  // sideways - now an aimed shot would have had a streak pointing
  // somewhere it had never been.
  // A big cannon round is fatter, longer, and a hotter colour, so you can
  // tell at a glance the BIG SHOT upgrade is running. A pierce shot gets a
  // cool green tint. Both at once? Green wins the colour, big wins the size.
  const big = b.big;
  const tail = big ? 20 : 13;
  const width = big ? 6 : 3;
  const dotR = big ? 5 : 2.4;
  const streakColor = b.pierce ? "#9affc0" : "#ffe08a";
  const coreColor = b.pierce ? "#e8fff0" : "#fffbe8";

  const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy) || 1;
  const tailX = b.x - (b.vx / speed) * tail;
  const tailY = sy - (b.vy / speed) * tail;

  ctx.strokeStyle = streakColor;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(b.x, sy);
  ctx.lineTo(tailX, tailY);
  ctx.stroke();

  ctx.fillStyle = coreColor;
  ctx.beginPath();
  ctx.arc(b.x, sy, dotR, 0, Math.PI * 2);
  ctx.fill();
}

// A FIREBALL, and the warning that comes before it.
function drawFireball(f, screenY) {
  // ---- the warning ----
  if (f.warn > 0) {
    // Flash faster and faster as it's about to go. The gap between
    // flashes IS the countdown - you can feel how long you've got
    // without anybody printing a number on the screen.
    const urgency = 1 - f.warn / FIREBALL_WARN;
    const blink = Math.sin(shakeClock * (0.25 + urgency * 0.5));
    if (blink < 0) return;

    ctx.save();
    ctx.globalAlpha = 0.55 + urgency * 0.45;

    // A downward arrow at the top of the screen, over the column it's
    // about to come down.
    ctx.fillStyle = "#ff7a2a";
    ctx.beginPath();
    ctx.moveTo(f.x, 74);
    ctx.lineTo(f.x - 17, 40);
    ctx.lineTo(f.x + 17, 40);
    ctx.closePath();
    ctx.fill();

    // And a faint smear of light straight down the danger column, so
    // it's obvious WHERE and not just THAT.
    const col = ctx.createLinearGradient(0, 74, 0, H);
    col.addColorStop(0, "rgba(255, 110, 30, 0.24)");
    col.addColorStop(1, "rgba(255, 110, 30, 0)");
    ctx.fillStyle = col;
    ctx.fillRect(f.x - 22, 74, 44, H);

    ctx.restore();
    return;
  }

  // ---- the fireball itself ----
  const sy = screenY(f.y);
  if (sy < -120 || sy > H + 60) return;

  // A tail of fading blobs trailing up behind it. Drawing the same
  // shape a few times, smaller and fainter each time, is the cheapest
  // convincing trail there is - no particles to keep track of.
  for (let i = 6; i >= 1; i--) {
    ctx.globalAlpha = 0.1 + (6 - i) * 0.055;
    ctx.fillStyle = i > 3 ? "#8f2708" : "#ff8c1a";
    ctx.beginPath();
    ctx.arc(f.x + Math.sin(f.spin + i) * 3, sy - i * 15, 15 - i * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const glow = ctx.createRadialGradient(f.x, sy, 3, f.x, sy, 40);
  glow.addColorStop(0, "rgba(255, 220, 120, 0.85)");
  glow.addColorStop(0.4, "rgba(255, 110, 20, 0.5)");
  glow.addColorStop(1, "rgba(255, 90, 0, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(f.x - 42, sy - 42, 84, 84);

  ctx.fillStyle = "#ff6a1a";
  ctx.beginPath();
  ctx.arc(f.x, sy, 15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffe08a";
  ctx.beginPath();
  ctx.arc(f.x - 3, sy - 3, 7.5, 0, Math.PI * 2);
  ctx.fill();
}

// A LAVA MONSTER. A wobbling blob of molten rock with a furious face.
// Nothing here is a picture from a file - it's all circles and triangles,
// same as everything else in this game.
function drawMonster(m, screenY) {
  const sy = screenY(m.y);
  if (sy < -60 || sy > H + 60) return;

  // Flashes white for a few frames when shot, so a hit that DOESN'T kill
  // still obviously landed. Without this, shooting something with 2
  // health feels like the first shot missed.
  const flashing = shakeClock < m.hurtUntil;

  // The body squashes and stretches as it moves. Two sine waves running
  // at different speeds, so it never quite repeats and looks alive.
  const squash = 1 + Math.sin(m.wobble) * 0.16;
  const stretch = 1 - Math.sin(m.wobble) * 0.12;

  const cy = sy - 14;

  // A hot glow around it, painted first so everything else sits on top.
  const glow = ctx.createRadialGradient(m.x, cy, 4, m.x, cy, 34);
  glow.addColorStop(0, "rgba(255, 150, 40, 0.55)");
  glow.addColorStop(1, "rgba(255, 90, 0, 0)");
  ctx.fillStyle = glow;
  ctx.fillRect(m.x - 36, cy - 36, 72, 72);

  // WINGS. Drawn before the body so they sit behind it, and flapping by
  // squashing them flat and back again - the same squash-and-stretch as
  // the body, just used on a different shape.
  if (m.flying) {
    const beat = Math.abs(Math.sin(m.flap));      // 0 = flat out, 1 = up high
    ctx.fillStyle = flashing ? "#ffffff" : "rgba(60, 18, 8, 0.92)";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(m.x + side * 8, cy - 2);
      ctx.lineTo(m.x + side * 30, cy - 6 - beat * 15);
      ctx.lineTo(m.x + side * 24, cy + 8 - beat * 5);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(m.x, cy);
  ctx.scale(stretch, squash);

  ctx.fillStyle = flashing ? "#ffffff" : "#ff6a1a";
  ctx.beginPath();
  ctx.arc(0, 0, 17, 0, Math.PI * 2);
  ctx.fill();

  // Cooler crust on top, molten underneath.
  ctx.fillStyle = flashing ? "#ffffff" : "#8f2708";
  ctx.beginPath();
  ctx.arc(0, -6, 12, Math.PI, Math.PI * 2);
  ctx.fill();

  // Drippy blobs hanging off the bottom.
  ctx.fillStyle = flashing ? "#ffffff" : "#ff9c2e";
  for (const off of [-9, 0, 9]) {
    ctx.beginPath();
    ctx.arc(off, 13 + Math.sin(m.wobble + off) * 2, 4.2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Angry eyes. Two triangles pointing inwards - that's the whole face,
  // and it's enough. Eyebrows down and in reads as "cross" every time.
  if (!flashing) {
    ctx.fillStyle = "#2a0a02";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * 3, -4);
      ctx.lineTo(side * 11, -7);
      ctx.lineTo(side * 10, 1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#ffd166";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * 7.5, -3, 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawGnome(screenY) {
  const sy = screenY(gnome.y);
  const x = gnome.x;

  // MEGA MUSHROOM: scale the whole gnome up. We scale around his feet
  // (the origin after translate), so he grows UPWARD off the ledge instead
  // of sinking into it. A gentle throb in the last second warns you it's
  // about to wear off.
  const big = powerTimers.big > 0;
  let bigScale = 1;
  if (big) {
    bigScale = BIG_SCALE;
    if (powerTimers.big < 60) bigScale = 1 + (BIG_SCALE - 1) * (powerTimers.big / 60);
  }

  ctx.save();
  ctx.translate(x, sy);
  ctx.scale(gnome.facing * bigScale, bigScale);   // flip + mushroom size in one go

  // boots
  ctx.fillStyle = "#4a2c14";
  ctx.fillRect(-10, -7, 8, 7);
  ctx.fillRect(2, -7, 8, 7);

  // blue tunic
  ctx.fillStyle = "#2f5fb0";
  ctx.fillRect(-11, -22, 22, 15);

  // face
  ctx.fillStyle = "#f0c39a";
  ctx.fillRect(-8, -28, 16, 8);

  // eye
  ctx.fillStyle = "#111";
  ctx.fillRect(2, -26, 3, 3);

  // big white beard
  ctx.fillStyle = "#eeeef4";
  ctx.beginPath();
  ctx.moveTo(-8, -22);
  ctx.lineTo(8, -22);
  ctx.lineTo(0, -8);
  ctx.closePath();
  ctx.fill();

  // the important part: a giant red pointy hat
  ctx.fillStyle = "#c0281f";
  ctx.beginPath();
  ctx.moveTo(-12, -28);
  ctx.lineTo(12, -28);
  ctx.lineTo(4, -50);
  ctx.closePath();
  ctx.fill();

  // THE PISTOL. Drawn after the hat so it sits in front of him.
  // Because we already flipped the whole gnome with ctx.scale further up,
  // this only ever has to be drawn pointing RIGHT. Turning round is
  // handled once, for everything, instead of once per body part.
  const kick = gnome.recoil * 0.9;      // shoved back while it fires
  ctx.fillStyle = "#3a3f4a";
  ctx.fillRect(6 - kick, -22, 15, 5);   // barrel
  ctx.fillRect(6 - kick, -20, 6, 8);    // grip
  ctx.fillStyle = "#8b93a3";
  ctx.fillRect(6 - kick, -22, 15, 2);   // a shine along the top

  // Muzzle flash, only in the frames just after firing.
  if (gnome.recoil > 2) {
    ctx.fillStyle = "#ffe08a";
    ctx.beginPath();
    ctx.arc(22 - kick, -19.5, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  // THE SHIELD BUBBLE. Drawn after the restore, in plain screen
  // coordinates, so the gnome flipping left and right doesn't flip the
  // bubble too. It shimmers while you're briefly untouchable (just after
  // it saved you) and sits steady while it's ready to take a hit.
  if (shield || invuln > 0) {
    ctx.save();
    ctx.globalAlpha = invuln > 0 ? 0.35 + 0.3 * Math.sin(shakeClock * 0.6) : 0.55;
    ctx.strokeStyle = "#b7ffcf";
    ctx.lineWidth = 3;
    ctx.beginPath();
    // Grow the bubble with the mushroom so it still wraps a giant gnome.
    ctx.arc(x, sy - 16 * bigScale, 26 * bigScale, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = "rgba(150,255,200,0.12)";
    ctx.fill();
    ctx.restore();
  }
}

function drawLava(screenY) {
  const sy = screenY(lavaY);
  if (sy > H) return;

  const glow = ctx.createLinearGradient(0, sy - 30, 0, sy + 90);
  glow.addColorStop(0,   "#ffb703");
  glow.addColorStop(0.3, "#ff6a00");
  glow.addColorStop(1,   "#8a1502");
  ctx.fillStyle = glow;
  ctx.fillRect(0, sy, W, H - sy + 10);

  // One clock for everything down here. performance.now() is the number
  // of milliseconds since the page opened, so dividing it turns it into a
  // slow, smooth number we can feed into sin() and into the bubbles.
  const t = performance.now() / 380;

  // --- BUBBLES ---
  // Blobs of molten rock that rise up through the lava, swell as they
  // climb, and POP at the surface. There's no list of bubbles kept
  // anywhere - each one is worked out fresh every frame from its number
  // `i` and the clock, so they cost nothing to remember. Same bubble,
  // same path, every loop - your eye just reads it as "it's bubbling".
  const BUBBLES = 16;
  for (let i = 0; i < BUBBLES; i++) {
    // A steady sideways spot for this bubble, with a tiny sway so it
    // isn't a dead straight line. The * 53.3 just scatters them across
    // the width instead of bunching them up.
    const bx = (i * 53.3) % W + Math.sin(t * 0.6 + i) * 5;

    // rise is a number that climbs from 0 up to 1 and then snaps back to
    // 0, over and over - that's one full journey from deep down up to the
    // surface. The `% 1` is what makes it loop. Adding i * 0.13 means they
    // don't all rise together like a lift; they're all at different points.
    const rise = (t * 0.16 + i * 0.13) % 1;

    // 0 = down in the depths, 1 = right at the surface.
    const by = sy + 46 - rise * 46;

    // They start tiny and puff up as they near the top, then the last
    // bit of the journey they're "popping", so we fade them out.
    const grow = 1.4 + rise * 3.2;
    const alpha = rise < 0.82 ? 0.55 : 0.55 * (1 - (rise - 0.82) / 0.18);

    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = "#ffd98a";
    ctx.beginPath();
    ctx.arc(bx, by, grow, 0, Math.PI * 2);
    ctx.fill();

    // Right as it reaches the top, draw a quick empty ring - the splash
    // of the bubble bursting.
    if (rise > 0.9) {
      ctx.globalAlpha = (1 - rise) / 0.1 * 0.6;
      ctx.strokeStyle = "#fff0c0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bx, sy + 2, grow + (rise - 0.9) * 40, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // --- THE SURFACE ---
  // A wobbly top edge. Two sine waves added together instead of one, at
  // different speeds and sizes, so the surface looks choppy and churny
  // rather than like a tidy skateboard ramp.
  ctx.fillStyle = "#ffd166";
  ctx.beginPath();
  ctx.moveTo(0, sy + 8);
  for (let x = 0; x <= W; x += 8) {
    const wave = Math.sin(x / 34 + t) * 6 + Math.sin(x / 15 - t * 1.7) * 3;
    ctx.lineTo(x, sy + wave);
  }
  ctx.lineTo(W, sy + 20);
  ctx.lineTo(0, sy + 20);
  ctx.fill();

  // A bright hot line skimming along the very top of that wave, so the
  // surface glows like it's white-hot where it meets the air.
  ctx.strokeStyle = "rgba(255, 245, 200, 0.8)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) {
    const wave = Math.sin(x / 34 + t) * 6 + Math.sin(x / 15 - t * 1.7) * 3;
    if (x === 0) ctx.moveTo(x, sy + wave);
    else ctx.lineTo(x, sy + wave);
  }
  ctx.stroke();
}

// A FLOATING GOODY. A glowing ring with an emoji in the middle, bobbing
// up and down. The glow is the same radial-gradient trick as the monster
// and fireball glows - paint a soft coloured circle first, everything
// else on top.
function drawPowerup(p, screenY) {
  const sy = screenY(p.y) + Math.sin(p.bob) * 4;
  if (sy < -30 || sy > H + 30) return;

  ctx.save();
  const glow = ctx.createRadialGradient(p.x, sy, 2, p.x, sy, 22);
  glow.addColorStop(0, p.color);
  glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = glow;
  ctx.fillRect(p.x - 24, sy - 24, 48, 48);
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.arc(p.x, sy, 14, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(20,12,10,0.6)";
  ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = p.color;
  ctx.stroke();

  ctx.font = "17px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(p.emoji, p.x, sy + 1);
  ctx.restore();
}

// A THING THE BOSS THREW. A brown tumbling rock, or a molten fireball -
// told apart by its `kind`, same as everything else in this game.
function drawBossShot(s, screenY) {
  const sy = screenY(s.y);
  if (sy < -30 || sy > H + 30) return;

  ctx.save();
  if (s.kind === "rock") {
    ctx.translate(s.x, sy);
    ctx.rotate(s.spin);
    ctx.fillStyle = "#6a5545";
    ctx.beginPath();
    ctx.arc(0, 0, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#4a3a2e";
    ctx.beginPath();
    ctx.arc(-4, -3, s.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (s.kind === "web") {
    // A pale sticky glob with a little cross of threads across it.
    ctx.fillStyle = "#d8d8e8";
    ctx.beginPath();
    ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(90,90,110,0.8)";
    ctx.lineWidth = 1.5;
    for (const a of [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4]) {
      ctx.beginPath();
      ctx.moveTo(s.x - Math.cos(a) * s.r, sy - Math.sin(a) * s.r);
      ctx.lineTo(s.x + Math.cos(a) * s.r, sy + Math.sin(a) * s.r);
      ctx.stroke();
    }
  } else if (s.kind === "ecto") {
    // A wobbly purple ghost-blob with a soft glow.
    const glow = ctx.createRadialGradient(s.x, sy, 2, s.x, sy, s.r + 8);
    glow.addColorStop(0, "rgba(200,140,255,0.9)");
    glow.addColorStop(1, "rgba(120,40,200,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(s.x - s.r - 8, sy - s.r - 8, (s.r + 8) * 2, (s.r + 8) * 2);
    ctx.fillStyle = "#b06aff";
    ctx.beginPath();
    ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const glow = ctx.createRadialGradient(s.x, sy, 2, s.x, sy, s.r + 8);
    glow.addColorStop(0, "rgba(255,224,138,0.9)");
    glow.addColorStop(1, "rgba(255,90,0,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(s.x - s.r - 8, sy - s.r - 8, (s.r + 8) * 2, (s.r + 8) * 2);
    ctx.fillStyle = "#ff6a1a";
    ctx.beginPath();
    ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// THE BOSS. One function, three looks, chosen by boss.type. While it's
// dying it puffs up and fades. The flash-white-when-hit trick is exactly
// the same one the little monsters use.
function drawBoss(screenY) {
  const sy = screenY(boss.y);
  const flashing = shakeClock < boss.hurtUntil;

  ctx.save();
  ctx.translate(boss.x, sy);

  // Dying: swell up and fade out over the 60 frames of boss.dying.
  if (boss.dying > 0) {
    const k = boss.dying / 60;
    ctx.globalAlpha = 1 - k;
    ctx.scale(1 + k * 0.8, 1 + k * 0.8);
  }

  if (boss.type === "golem") {
    // A big lump of dark rock with glowing lava cracks and angry eyes.
    ctx.fillStyle = flashing ? "#ffffff" : "#4a3d34";
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = flashing ? "#ffffff" : "#ff6a1a";
    ctx.lineWidth = 3;
    for (const a of [-0.6, 0.2, 1.1]) {
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
      ctx.lineTo(Math.cos(a) * 34, Math.sin(a) * 34);
      ctx.stroke();
    }
    if (!flashing) {
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(-12, -6, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -6, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2a0a02";
      ctx.beginPath(); ctx.arc(-12, -6, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -6, 2, 0, Math.PI * 2); ctx.fill();
    }

  } else if (boss.type === "dragon") {
    // A winged body facing the way it's flying. Wings flap using the same
    // sine-wave beat the flying monsters use.
    ctx.scale(boss.dir, 1);
    const beat = Math.abs(Math.sin(boss.t * 0.2));
    ctx.fillStyle = flashing ? "#ffffff" : "#3a1a3a";
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(side * 40, -20 - beat * 14);
      ctx.lineTo(side * 30, 8);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = flashing ? "#ffffff" : "#6a2a5a";
    ctx.beginPath();
    ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    // head and snout, poking forward
    ctx.beginPath();
    ctx.arc(24, -6, 12, 0, Math.PI * 2);
    ctx.fill();
    if (!flashing) {
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(28, -9, 3, 0, Math.PI * 2); ctx.fill();
    }

  } else if (boss.type === "blob") {
    // The Blob King: a wobbly green jelly wearing a crown.
    const squash = 1 + Math.sin(boss.t * 0.12) * 0.12;
    ctx.scale(1 / squash, squash);
    ctx.fillStyle = flashing ? "#ffffff" : "#5ac06a";
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = flashing ? "#ffffff" : "#3f9e4f";
    ctx.beginPath();
    ctx.arc(0, 8, 22, 0, Math.PI, false);
    ctx.fill();
    if (!flashing) {
      ctx.fillStyle = "#123";
      ctx.beginPath(); ctx.arc(-11, -4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(11, -4, 4, 0, Math.PI * 2); ctx.fill();
      // a little gold crown
      ctx.fillStyle = "#ffd24a";
      ctx.beginPath();
      ctx.moveTo(-18, -30);
      ctx.lineTo(-18, -44); ctx.lineTo(-9, -34);
      ctx.lineTo(0, -46);   ctx.lineTo(9, -34);
      ctx.lineTo(18, -44);  ctx.lineTo(18, -30);
      ctx.closePath();
      ctx.fill();
    }

  } else if (boss.type === "skull") {
    // A giant bone-white skull with a crown of flickering flames.
    if (!flashing) {
      for (let i = 0; i < 7; i++) {
        const fx = -30 + i * 10;
        const fh = 14 + Math.sin(boss.t * 0.3 + i) * 8;
        ctx.fillStyle = i % 2 ? "#ff9a2a" : "#ffd166";
        ctx.beginPath();
        ctx.moveTo(fx - 5, -26);
        ctx.lineTo(fx, -26 - fh);
        ctx.lineTo(fx + 5, -26);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.fillStyle = flashing ? "#ffffff" : "#efeadd";
    ctx.beginPath();
    ctx.arc(0, -4, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-18, 10, 36, 20);        // the jaw
    if (!flashing) {
      ctx.fillStyle = "#1a1410";
      ctx.beginPath(); ctx.arc(-13, -6, 8, 0, Math.PI * 2); ctx.fill();   // eye sockets
      ctx.beginPath(); ctx.arc(13, -6, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 2); ctx.lineTo(-5, 12); ctx.lineTo(5, 12);            // nose
      ctx.closePath(); ctx.fill();
      // two glowing pinprick eyes deep in the sockets
      ctx.fillStyle = "#ff6a1a";
      ctx.beginPath(); ctx.arc(-13, -6, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(13, -6, 3, 0, Math.PI * 2); ctx.fill();
      // teeth
      ctx.fillStyle = "#1a1410";
      for (let tx = -14; tx <= 12; tx += 8) ctx.fillRect(tx, 10, 3, 18);
    }

  } else if (boss.type === "spider") {
    // A fat dark body with eight scuttling legs and a cluster of red eyes.
    ctx.strokeStyle = flashing ? "#ffffff" : "#241a24";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    const wig = Math.sin(boss.t * 0.3) * 6;
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const ky = -12 + i * 9;
        ctx.beginPath();
        ctx.moveTo(0, ky);
        ctx.lineTo(side * 26, ky - 6 + wig);
        ctx.lineTo(side * 40, ky + 10 - wig);
        ctx.stroke();
      }
    }
    ctx.fillStyle = flashing ? "#ffffff" : "#2e2230";
    ctx.beginPath(); ctx.arc(0, 6, 24, 0, Math.PI * 2); ctx.fill();   // abdomen
    ctx.beginPath(); ctx.arc(0, -16, 15, 0, Math.PI * 2); ctx.fill(); // head
    if (!flashing) {
      ctx.fillStyle = "#ff3b3b";
      for (const ex of [-8, -3, 3, 8]) {
        ctx.beginPath(); ctx.arc(ex, -18, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    }

  } else { // ghost
    // A pale, see-through wavy sheet with a hollow moaning face.
    ctx.globalAlpha *= 0.82;
    ctx.fillStyle = flashing ? "#ffffff" : "#dfe6ff";
    ctx.beginPath();
    ctx.arc(0, -6, 28, Math.PI, 0, false);          // rounded head
    // a wavy hem along the bottom
    const hem = -6 + 34;
    ctx.lineTo(28, hem);
    for (let i = 0; i <= 6; i++) {
      const wx = 28 - i * (56 / 6);
      const wy = hem + (i % 2 === 0 ? 0 : 10) + Math.sin(boss.t * 0.2 + i) * 3;
      ctx.lineTo(wx, wy);
    }
    ctx.lineTo(-28, -6);
    ctx.closePath();
    ctx.fill();
    if (!flashing) {
      ctx.fillStyle = "#3a2a5a";
      ctx.beginPath(); ctx.arc(-10, -8, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(10, -8, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 6, 5, 8, 0, 0, Math.PI * 2); ctx.fill();  // wailing mouth
    }
  }

  ctx.restore();
}

// The boss's health bar, pinned across the top of the screen so it's
// always readable no matter where the boss has wandered to.
function drawBossBar() {
  if (!boss || boss.dying > 0) return;
  const barW = W - 60, x = 30, y = 92;
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(x - 2, y - 2, barW + 4, 16);
  ctx.fillStyle = "#3a1010";
  ctx.fillRect(x, y, barW, 12);
  const frac = Math.max(0, boss.hp) / boss.maxHp;
  ctx.fillStyle = "#ff4a4a";
  ctx.fillRect(x, y, barW * frac, 12);
  ctx.fillStyle = "#ffe9c4";
  ctx.font = "bold 13px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(BOSS_NAMES[boss.type], W / 2, y - 5);
  ctx.textAlign = "left";
}

// The big words in the middle - stage changes, boss names, victories.
// They fade out over their last few frames so they don't just blink off.
function drawBanner() {
  if (!banner) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, banner.timer / 22);
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffd27a";
  ctx.font = "bold 40px system-ui, sans-serif";
  ctx.fillText(banner.text, W / 2, H * 0.32);
  if (banner.sub) {
    ctx.fillStyle = "#ffe9c4";
    ctx.font = "18px system-ui, sans-serif";
    ctx.fillText(banner.sub, W / 2, H * 0.32 + 30);
  }
  ctx.restore();
}

// The row of active power-ups down the left side, under the height. Each
// TIMED one gets an emoji and a little draining bar so you can see it
// running out. Underneath, a mini "bag" shows the items you're HOLDING -
// the ones with no timer, that wait until you use them (shield, double
// jump). Coins aren't shown here; they've got their own counter up top.
function drawPowerHud() {
  const rows = [
    { t: powerTimers.rapid,   max: RAPID_TIME,   e: "🔫" },
    { t: powerTimers.spread,  max: SPREAD_TIME,  e: "🌟" },
    { t: powerTimers.freeze,  max: FREEZE_TIME,  e: "❄️" },
    { t: powerTimers.rockets, max: ROCKET_TIME,  e: "🚀" },
    { t: powerTimers.big,     max: BIG_TIME,     e: "🍄" },
    { t: powerTimers.pierce,  max: PIERCE_TIME,  e: "🏹" },
    { t: powerTimers.bigshot, max: BIGSHOT_TIME, e: "💥" },
    { t: powerTimers.psych,   max: PSYCH_TIME,   e: "🌀" },
  ];
  let py = 60;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (const r of rows) {
    if (r.t <= 0) continue;
    ctx.font = "15px system-ui, sans-serif";
    ctx.fillStyle = "#ffe9c4";
    ctx.fillText(r.e, 16, py);
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    ctx.fillRect(40, py - 4, 46, 7);
    ctx.fillStyle = "#8fd0ff";
    ctx.fillRect(40, py - 4, 46 * (r.t / r.max), 7);
    py += 18;
  }

  // --- the mini INVENTORY of held items ---
  const bag = [];
  if (shield) bag.push({ e: "🛡️", n: "" });
  if (doubleJumps > 0) bag.push({ e: "⏫", n: doubleJumps > 1 ? "x" + doubleJumps : "" });

  if (bag.length) {
    py += 4;
    ctx.font = "10px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,233,196,0.6)";
    ctx.fillText("BAG", 16, py);
    py += 14;
    let bx = 16;
    for (const it of bag) {
      // a little slot box so it reads as "inventory", not "active effect"
      ctx.fillStyle = "rgba(20,12,10,0.5)";
      ctx.fillRect(bx, py - 12, 26, 24);
      ctx.strokeStyle = "rgba(255,214,130,0.5)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(bx, py - 12, 26, 24);
      ctx.font = "15px system-ui, sans-serif";
      ctx.fillStyle = "#ffe9c4";
      ctx.fillText(it.e, bx + 4, py);
      if (it.n) {
        ctx.font = "bold 10px system-ui, sans-serif";
        ctx.fillStyle = "#ffd27a";
        ctx.fillText(it.n, bx + 15, py + 8);
      }
      bx += 32;
    }
  }
  ctx.textBaseline = "alphabetic";
}

// THE "YOU GOT X" NOTES. A little stack near the middle that fades away,
// so you learn what each new goody does the first time you grab one.
function drawItemPopups() {
  if (!itemPopups.length) return;
  ctx.save();
  ctx.textBaseline = "middle";
  const boxW = 300, boxH = 40;
  let py = H * 0.60;
  for (const pop of itemPopups) {
    const a = Math.min(1, pop.timer / 30);      // fade over the last half-second
    ctx.globalAlpha = a;
    const x0 = W / 2 - boxW / 2;
    ctx.fillStyle = "rgba(18,10,20,0.82)";
    ctx.fillRect(x0, py - boxH / 2, boxW, boxH);
    ctx.strokeStyle = "rgba(255,214,130,0.7)";
    ctx.lineWidth = 2;
    ctx.strokeRect(x0, py - boxH / 2, boxW, boxH);

    ctx.textAlign = "center";
    ctx.font = "22px system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(pop.emoji, x0 + 26, py);

    ctx.textAlign = "left";
    ctx.font = "bold 15px system-ui, sans-serif";
    ctx.fillStyle = "#ffd27a";
    ctx.fillText(pop.title, x0 + 50, py - 8);
    ctx.font = "12px system-ui, sans-serif";
    ctx.fillStyle = "#e8e0d0";
    ctx.fillText(pop.desc, x0 + 50, py + 9);

    py += boxH + 6;
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawHud() {
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#ffe9c4";
  ctx.font = "bold 26px system-ui, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("HEIGHT " + best + "m", 16, 40);

  // STAGE, centred up top, so you always know how deep in it you are.
  ctx.textAlign = "center";
  ctx.font = "bold 15px system-ui, sans-serif";
  ctx.fillStyle = "#ffd27a";
  ctx.fillText("STAGE " + stage, W / 2, 26);

  ctx.textAlign = "right";
  ctx.fillStyle = "#ffb27a";
  ctx.font = "bold 26px system-ui, sans-serif";
  ctx.fillText("☠ " + kills, W - 16, 40);
  // coins, tucked just under the kill count
  ctx.fillStyle = "#ffd24a";
  ctx.font = "bold 18px system-ui, sans-serif";
  ctx.fillText("💰 " + coins, W - 16, 62);

  // A little stack of the power-ups you've got running right now, each
  // with a bar that drains as it runs out.
  drawPowerHud();

  ctx.textAlign = "left";
  ctx.fillStyle = "#ffe9c4";

  // A hint, but only until you've actually climbed something. The moment
  // you're 3m up you've clearly worked it out, and a permanent hint is
  // just clutter sitting on top of the game forever.
  if (best < 3 && !dead && !usingTouch) {
    ctx.textAlign = "center";
    ctx.font = "17px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255, 233, 196, 0.72)";
    ctx.fillText("A / D  or  ← →  to run", W / 2, H - 118);
    ctx.fillText("SPACE to jump", W / 2, H - 94);
    ctx.fillText("X or CLICK to shoot", W / 2, H - 88);
    ctx.fillText("M turns the gnome off", W / 2, H - 64);
    ctx.fillStyle = "rgba(183, 255, 207, 0.8)";
    ctx.fillText("grab the glowing goodies!", W / 2, H - 40);
    ctx.textAlign = "left";
  }

  if (dead) {
    ctx.fillStyle = "rgba(0,0,0,0.66)";
    ctx.fillRect(0, H / 2 - 120, W, 230);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ff8f4a";
    ctx.font = "bold 44px system-ui, sans-serif";
    ctx.fillText("COOKED", W / 2, H / 2 - 60);

    ctx.fillStyle = "#ffe9c4";
    ctx.font = "bold 30px system-ui, sans-serif";
    ctx.fillText("You climbed " + best + "m", W / 2, H / 2 - 6);
    ctx.font = "20px system-ui, sans-serif";
    ctx.fillText(kills + " monsters down · reached stage " + stage, W / 2, H / 2 + 22);
    ctx.fillStyle = "#ffd24a";
    ctx.fillText("💰 " + coins + " collected", W / 2, H / 2 + 46);

    if (deadTimer > 40) {
      ctx.font = "20px system-ui, sans-serif";
      ctx.fillStyle = "#c9c2b4";
      ctx.fillText("Tap or press any key to try again", W / 2, H / 2 + 76);
    }
  }
}


// --- 7. THE GAME LOOP --------------------------------------------------
//     update, draw, update, draw... about 60 times a second, forever.

function loop() {
  shakeClock++;
  update();
  draw();
  requestAnimationFrame(loop);
}

// --- 8. THE START SCREEN -----------------------------------------------

function startLevel(name) {
  // Clicking this button is the "you touched something" the browser has
  // been waiting for, so it's where the sound gets switched on.
  startAudio();

  applyLevel(name);    // 1. swap the numbers
  newGame();           // 2. THEN build the pole, using them
  started = true;
  document.getElementById("startScreen").style.display = "none";
}

// One button per entry in LEVELS. Add a fourth up there and a fourth
// button turns up here on its own.
for (const name of Object.keys(LEVELS)) {
  const d = LEVELS[name];
  const btn = document.createElement("button");
  btn.className = "lvl lvl-" + name;
  btn.innerHTML = "<b>" + d.label + "</b><span>" + d.blurb + "</span>";
  btn.onclick = () => startLevel(name);
  document.getElementById("levelButtons").appendChild(btn);
}

document.getElementById("again").onclick = () => {
  started = false;
  document.getElementById("startScreen").style.display = "flex";
};

// Build a pole so there's something behind the start screen to look at,
// then start the loop. update() refuses to do anything until you've
// picked, so nothing sinks and nothing moves while you're reading.
newGame();
loop();

</script>
