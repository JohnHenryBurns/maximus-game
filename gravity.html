<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<canvas id="game"></canvas>
<script>
// =====================================================================
// GRAVITY LAB — a physics playground. Spawn little people. Plant
// bombs. Lay spikes. Stack crates. Grab ANYTHING and fling it.
// And when things are just getting settled... TURN OFF GRAVITY.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

// ---------------------------------------------------------------------
// FITTING ON A PHONE — measure first, draw second.
// ---------------------------------------------------------------------

// Break a sentence into lines that FIT: add words one at a time, and start
// a new line the moment the line gets too wide.
function wrapText(text, maxW, font) {
  ctx.font = font;
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// The Arcade pill is a real HTML link floating over the top-left corner, so
// the canvas can't see it. Ask the browser where it actually is, and put our
// own buttons somewhere else — it used to sit right on top of PERSON.
function pillBox() {
  const el = document.getElementById('back');
  if (!el) return { right: 109, bottom: 38 };
  const r = el.getBoundingClientRect();
  return { right: Math.ceil(r.right), bottom: Math.ceil(r.bottom) };
}

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// THE WORLD IS BIGGER THAN THE WINDOW — a camera looks into it, and
// the scroll wheel zooms it out until the whole lab fits your eye
// ---------------------------------------------------------------------
// The lab got a lot bigger — over twice the room to build in. Pinch out to
// see it all, or two fingers to walk around it.
const WORLD_W = 4200, WORLD_H = 3800;
// A solid wall all the way round, thick enough to see, that things BOUNCE off.
const WALL = 30;
const cam = { x: 0, y: 0, zoom: 1 };
let camReady = false;

function clampCam() {
  const vw = canvas.width / cam.zoom, vh = canvas.height / cam.zoom;
  cam.x = vw >= WORLD_W ? (WORLD_W - vw) / 2
        : Math.max(0, Math.min(WORLD_W - vw, cam.x));
  cam.y = vh >= WORLD_H ? (WORLD_H - vh) / 2
        : Math.max(0, Math.min(WORLD_H - vh, cam.y));
}
function screenToWorld(sx, sy) {
  return { x: cam.x + sx / cam.zoom, y: cam.y + sy / cam.zoom };
}
const ZOOM_MAX = 2.4;

// How far back you're allowed to pull. It used to be a flat 0.3, which on a
// 4200-wide lab only ever showed you a corner. Instead of picking another
// magic number, work it out: you can zoom out until the WHOLE lab is on
// screen with a little margin, and no further — because past that you'd just
// be shrinking the lab into the middle of an empty screen.
function minZoom() {
  return Math.min(0.3, Math.max(0.05,
    Math.min(canvas.width / (WORLD_W * 1.06), canvas.height / (WORLD_H * 1.06))));
}

// Zoom so that the point under your finger/cursor stays exactly where it is.
// That's the whole trick to zoom feeling right instead of feeling drunk.
function zoomAt(sx, sy, factor) {
  const before = screenToWorld(sx, sy);
  cam.zoom = Math.max(minZoom(), Math.min(ZOOM_MAX, cam.zoom * factor));
  cam.x = before.x - sx / cam.zoom;
  cam.y = before.y - sy / cam.zoom;
  clampCam();
}

addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 0.88 : 1.14);
}, { passive: false });

// ---- PINCH TO ZOOM, TWO FINGERS TO PAN --------------------------------
// ONE finger is playing: place, grab, fling, erase.
// TWO fingers is looking: pinch to zoom, slide to pan.
// Keeping them separate means we never have to ask "did you mean to zoom
// or did you mean to drop a bomb?" — the number of fingers already said.
const pointers = new Map();          // every finger currently on the glass
let gesture = null;                  // the two-finger zoom/pan in progress

function pinchInfo() {
  const pts = [...pointers.values()];
  const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
  return { dist: Math.max(1, Math.hypot(dx, dy)),
           mx: (pts[0].x + pts[1].x) / 2, my: (pts[0].y + pts[1].y) / 2 };
}
function startGesture() {
  const p = pinchInfo();
  gesture = { dist: p.dist, mx: p.mx, my: p.my };
}
function moveGesture() {
  const p = pinchInfo();
  // the pinch: how much wider or narrower did the two fingers get?
  zoomAt(gesture.mx, gesture.my, p.dist / gesture.dist);
  // the slide: drag the whole world along with the midpoint
  cam.x -= (p.mx - gesture.mx) / cam.zoom;
  cam.y -= (p.my - gesture.my) / cam.zoom;
  clampCam();
  gesture = { dist: p.dist, mx: p.mx, my: p.my };
}

// ---------------------------------------------------------------------
// SOUND
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.1, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
function boomSound() {
  beep(60, 0.4, 'sawtooth', 0.3);
  beep(120, 0.2, 'square', 0.2);
  setTimeout(() => beep(45, 0.3, 'triangle', 0.2), 60);
}
function boingSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(500, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(150, audio.currentTime + 0.2);
  g.gain.setValueAtTime(0.15, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.22);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.25);
}
function owSound() { beep(600 + Math.random() * 300, 0.1, 'square', 0.08); }
function slurpSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(700, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, audio.currentTime + 0.3);
  g.gain.setValueAtTime(0.15, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.32);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.35);
}
function burpSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  const lfo = audio.createOscillator(), lg = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(90, audio.currentTime);
  o.frequency.linearRampToValueAtTime(55, audio.currentTime + 0.35);
  lfo.type = 'square'; lfo.frequency.value = 22;
  lg.gain.value = 0.05;
  lfo.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(0.16, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.4);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.45);
  lfo.start(); lfo.stop(audio.currentTime + 0.45);
}
function popSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(900, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(200, audio.currentTime + 0.18);
  g.gain.setValueAtTime(0.18, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.2);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.22);
}
function tickSound() { beep(1000, 0.03, 'square', 0.05); }
function whooshSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(200, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(700, audio.currentTime + 0.5);
  g.gain.setValueAtTime(0.1, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.55);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.6);
}

// ---------------------------------------------------------------------
// THE WORLD — bodies bounce inside the screen box
// ---------------------------------------------------------------------
let bodies = [];        // everything that moves
let spikes = [];        // static pointy strips
let particles = [];
let floatTexts = [];    // POP! and friends, drifting upward
let holes = [];         // black holes. yes, plural. good luck.
let burps = [];         // swallowed bombs, waiting to come back up
let grabbedHole = null;
let launchers = [];     // bomb fountains: ten per second, forever
let grabbedLauncher = null;
let suns = [];          // dying stars. eight seconds to supernova.
let remnants = [];      // a blown-up star's core, collapsing into a hole
let grabbedSun = null;
let flashT = 0;         // the supernova whiteout
let gravityOn = true;
let timeOn = true;      // ...until somebody freezes it
let tentaclesOn = false; // the holes' grabby arms — OFF to start with, so
                         // you can watch things orbit without being fished out
let shake = 0;
let elapsed = 0;
let grabbed = null;
let pointer = { x: 0, y: 0 };

const GRAV = 1500;

// ---------------------------------------------------------------------
// THE WELL — what a black hole actually does to everything near it
// ---------------------------------------------------------------------
// The old version faked it: it shoved PEOPLE sideways at a made-up speed
// so they looked like they were circling. Everything else just got dragged
// in a straight line. This is the real thing instead.
//
// Real gravity gets weaker with the SQUARE of the distance. Twice as far
// away means FOUR times weaker. That one rule is what makes orbits
// possible: close in you whip round fast, far out you drift round slowly.
const HOLE_GM = 8.0e7;      // how heavy the hole is
const HOLE_SOFT = 80;       // stops the sum blowing up to infinity at the centre

// A spinning black hole drags spacetime around with it, so anything falling
// straight in gets swept sideways instead of just plunging. That's what
// turns a boring drop into a spiral.
//
// The catch: it must only act on the speed heading INWARD. The first version
// shoved everything sideways all the time, which braked half the orbits into
// the hole in under a second and flung the other half clean across the room,
// depending on which way round they happened to be going. Something already
// circling nicely has no inward speed, so now it's left alone.
const HOLE_SPIN = 1.6;

// A real orbit would go round for ever. This is the tiny bit of drag that
// makes it DECAY — as if the room were full of very thin treacle. A little
// speed bleeds off each lap, the circle tightens, and tightens, and then
// it isn't a circle any more.
const HOLE_DRAG = 0.16;

function holeFieldAt(x, y, vx, vy) {
  let ax = 0, ay = 0, strength = 0;
  for (const h of holes) {
    const dx = h.x - x, dy = h.y - y;
    const d2 = dx * dx + dy * dy + HOLE_SOFT * HOLE_SOFT;
    const d = Math.sqrt(d2);
    const a = HOLE_GM * h.size / d2;          // <- the inverse square
    const nx = dx / d, ny = dy / d;           // the direction of "inward"
    ax += nx * a;
    ay += ny * a;
    // how fast is this thing heading straight at the hole right now?
    const inward = (vx || 0) * nx + (vy || 0) * ny;
    if (inward > 0) {
      const sw = inward * HOLE_SPIN * (h.spin || 1) * (a / (a + 500));
      ax += -ny * sw;                         // sideways, in the spin's direction
      ay += nx * sw;
    }
    strength += a;
  }
  return { ax, ay, strength };
}
const FLOOR_H = 36;

function floorY() { return WORLD_H - FLOOR_H; }

const SKINS = ['#ffcc99', '#c68642', '#8d5524', '#f0cf9f'];
const SHIRTS = ['#e8453c', '#3a9ad9', '#7ddf8f', '#ffd23f', '#b482ff', '#ff9f43'];

function addPerson(x, y) {
  bodies.push({
    type: 'person', x, y, vx: 0, vy: 0, r: 16,
    angle: 0, angVel: 0,
    walkDir: Math.random() < 0.5 ? -1 : 1,
    dizzy: 0, blink: 0,
    skin: SKINS[Math.floor(Math.random() * SKINS.length)],
    shirt: SHIRTS[Math.floor(Math.random() * SHIRTS.length)],
  });
}
function addCrate(x, y) {
  bodies.push({ type: 'crate', x, y, vx: 0, vy: 0, r: 22, angle: 0, angVel: 0 });
}
function addBomb(x, y) {
  bodies.push({ type: 'bomb', x, y, vx: 0, vy: 0, r: 14, angle: 0, angVel: 0,
                fuse: 3, tickT: 0 });
}
function addMutant(x, y) {
  bodies.push({ type: 'mutant', x, y, vx: 0, vy: 0, r: 14, angle: 0, angVel: 0,
                fuse: 3, tickT: 0 });
}
function mutateSound() {
  if (!audio) return;
  for (const det of [0, 7]) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(180 + det * 10, audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(700 + det * 40, audio.currentTime + 0.35);
    g.gain.setValueAtTime(0.09, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.4);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.45);
  }
}
// the mutant blast: nobody pops. everybody gets... MORE.
function mutantExplode(bx, by) {
  mutateSound();
  shake = Math.max(shake, 0.25);
  for (let i = 0; i < 34; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 320;
    particles.push({
      x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.5,
      color: ['#7ddf5f', '#4faf3f', '#b4ff8f', '#2a7a2a'][i % 4],
    });
  }
  for (const b of bodies) {
    const d = Math.hypot(b.x - bx, b.y - by);
    if (d > 210) continue;
    if (b.type === 'person') {
      b.limbs = Math.min(10, (b.limbs || 0) + 2 + Math.floor(Math.random() * 2));
      b.dizzy = 1.5;
      b.vx += (b.x - bx) * 2;
      b.vy -= 120;
      floatTexts.push({ x: b.x, y: b.y - 30, t: 1, text: 'MUTATE!' });
    }
  }
}
function addSpike(x, y) {
  spikes.push({ x: Math.round(x / 46) * 46, y: Math.round(y / 46) * 46 });
}
function addHole(x, y, size) {
  // spin: which way this one winds spacetime. Half go clockwise.
  holes.push({ x, y, vx: 0, vy: 0, swirl: Math.random() * 7, size: size || 1,
               tents: [], tentT: 1.5, spin: Math.random() < 0.5 ? -1 : 1 });
  if (holes.length > 3) holes.shift();     // three black holes is plenty. THREE.
}
function addSun(x, y) {
  suns.push({ x, y, vx: 0, vy: 0, t: 0, rumbleT: 0, mass: 1 });
  if (suns.length > 2) supernova(suns.shift());   // crowding a sun ENDS it
}
function supernovaSound() {
  boomSound();
  setTimeout(() => { beep(40, 0.6, 'sawtooth', 0.3); beep(90, 0.4, 'square', 0.2); }, 80);
  setTimeout(() => beep(30, 0.5, 'triangle', 0.25), 200);
}
function supernova(sun) {
  supernovaSound();
  shake = 0.9;
  flashT = 0.5;
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 150 + Math.random() * 900;
    particles.push({
      x: sun.x, y: sun.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.9,
      color: ['#ffffff', '#ffd23f', '#ff9f43', '#ff5a3c'][i % 4],
    });
  }
  for (const b of bodies) {
    const dx = b.x - sun.x, dy = b.y - sun.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > 560) continue;
    if (b.type === 'person' && d < 380) { popPerson(b); continue; }
    const force = (1 - d / 560) * 2300;
    b.vx += (dx / d) * force;
    b.vy += (dy / d) * force;
    b.angVel += (Math.random() - 0.5) * 16;
    if (b.type === 'person') { b.dizzy = 3; owSound(); }
    if (b.type === 'bomb' && b.fuse > 0.2) b.fuse = 0.2;
  }
  floatTexts.push({ x: sun.x, y: sun.y - 60, t: 1.4, text: 'SUPERNOVA!!' });
  // What's left of a great star is a black hole — but NOT in the same instant.
  // The hole used to appear inside its own explosion, so you never actually
  // saw the supernova. First the star blows itself apart. THEN the core that's
  // left over falls in on itself. Then, and only then, the hole.
  remnants.push({ x: sun.x, y: sun.y, vx: sun.vx * 0.3, vy: sun.vy * 0.3, t: 0, size: 1.4 });
}

// the collapsing core of a dead star: bright, shrinking, about to become
// something you can't look at
const COLLAPSE_TIME = 1.5;
function updateRemnants(dt) {
  for (const r of remnants) {
    r.t += dt;
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.vx *= 1 - 0.9 * dt;
    r.vy *= 1 - 0.9 * dt;
    // the last half second, it rings like something under too much pressure
    if (r.t > COLLAPSE_TIME - 0.5 && !r.warned) {
      r.warned = true;
      beep(1200, 0.35, 'sine', 0.06);
      shake = Math.max(shake, 0.2);
    }
    if (r.t >= COLLAPSE_TIME) {
      r.done = true;
      addHole(r.x, r.y, r.size);
      shake = Math.max(shake, 0.6);
      flashT = Math.max(flashT, 0.18);
      slurpSound();
      setTimeout(() => beep(34, 0.8, 'sine', 0.3), 40);
      floatTexts.push({ x: r.x, y: r.y - 70, t: 1.5, text: 'COLLAPSE!' });
    }
  }
  remnants = remnants.filter(r => !r.done);
}

// ---------------------------------------------------------------------
// THE ACCRETION DISC
// ---------------------------------------------------------------------
// Stuff falling into a black hole doesn't drop straight down the plughole —
// it piles up into a spinning ring first, and that ring gets so hot from
// rubbing against itself that it GLOWS. That glow is the only reason anybody
// can find a black hole at all: the hole itself is invisible, but its dinner
// is the brightest thing for light years.
//
// Two real details worth knowing, both drawn here:
//  - the inside of the ring goes round MUCH faster than the outside, so the
//    disc is always shearing itself apart (that's the rubbing that heats it)
//  - the side coming toward you looks brighter than the side going away.
//    Light does that when its source is moving fast. It's why photos of real
//    black holes are lopsided.
function drawAccretionDisc(h) {
  const S = h.size || 1;
  const spin = h.spin || 1;
  const horizon = 28 * S;
  const inner = horizon * 1.10;
  const outer = horizon * 3.7;

  // the body of the disc: white-hot at the inside edge, cooling outward
  const g = ctx.createRadialGradient(h.x, h.y, inner, h.x, h.y, outer);
  g.addColorStop(0, 'rgba(255, 252, 232, 0.92)');
  g.addColorStop(0.13, 'rgba(255, 214, 132, 0.50)');
  g.addColorStop(0.40, 'rgba(255, 140, 52, 0.22)');
  g.addColorStop(0.72, 'rgba(220, 78, 26, 0.09)');
  g.addColorStop(1, 'rgba(160, 50, 20, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(h.x, h.y, outer, 0, Math.PI * 2);
  ctx.arc(h.x, h.y, inner, 0, Math.PI * 2, true);    // punch out the middle
  ctx.fill();

  // the shear: streaks of matter, the inner ones whipping round far faster
  ctx.lineCap = 'round';
  for (let i = 0; i < 18; i++) {
    const f = (i * 0.6180339) % 1;                   // spread them evenly-ish
    const r = inner + (outer - inner) * f;
    // Kepler's rule: go as r to the power of minus three halves
    const omega = spin * 3.1 * Math.pow(inner / r, 1.5);
    const a0 = elapsed * omega + i * 2.4;
    const heat = 1 - f;                              // inner = hotter = whiter
    ctx.strokeStyle = `rgba(255, ${Math.round(170 + heat * 82)}, ${Math.round(50 + heat * 160)}, ${0.14 + heat * 0.55})`;
    ctx.lineWidth = (0.9 + heat * 3.2) * S;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, a0, a0 + 0.7 + heat * 0.9);
    ctx.stroke();
  }

  // the lopsided bit: whichever side is racing toward us gets brighter
  const dop = ctx.createLinearGradient(h.x - outer, h.y, h.x + outer, h.y);
  if (spin > 0) {
    dop.addColorStop(0, 'rgba(255, 248, 225, 0.34)');
    dop.addColorStop(0.62, 'rgba(255, 248, 225, 0)');
  } else {
    dop.addColorStop(0.38, 'rgba(255, 248, 225, 0)');
    dop.addColorStop(1, 'rgba(255, 248, 225, 0.34)');
  }
  ctx.fillStyle = dop;
  ctx.beginPath();
  ctx.arc(h.x, h.y, outer * 0.86, 0, Math.PI * 2);
  ctx.arc(h.x, h.y, inner, 0, Math.PI * 2, true);
  ctx.fill();
}

function drawRemnants() {
  for (const r of remnants) {
    const k = Math.min(1, r.t / COLLAPSE_TIME);
    // the core shrinks from a big bright ball down to a hard white point
    const rad = 62 * (1 - k) + 7;
    const glow = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, rad * 3.4);
    glow.addColorStop(0, `rgba(255, 255, 255, ${0.95 - k * 0.1})`);
    glow.addColorStop(0.28, `rgba(255, 226, 140, ${0.7 - k * 0.3})`);
    glow.addColorStop(1, 'rgba(255, 140, 40, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(r.x, r.y, rad * 3.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(r.x, r.y, rad, 0, Math.PI * 2);
    ctx.fill();
    // a ring of the star's own outer layers, falling back in
    const ringR = 240 * (1 - k) + 12;
    ctx.strokeStyle = `rgba(255, 190, 90, ${0.55 * (1 - k)})`;
    ctx.lineWidth = 3 + 9 * (1 - k);
    ctx.beginPath();
    ctx.arc(r.x, r.y, ringR, 0, Math.PI * 2);
    ctx.stroke();
  }
}
// ---------------------------------------------------------------------
// THE HEAVY THINGS PULL ON EACH OTHER
// ---------------------------------------------------------------------
// Black holes and suns used to sit exactly where you put them, politely
// ignoring one another, which is not what enormous masses do. Now every one
// of them pulls on every other one — same inverse-square rule the bodies
// follow — so two holes will find each other across the lab and fall
// together, and a sun will drift into a hole's arms and be eaten.
const BIG_G = 1.5e7;        // how hard the heavy things pull on each other
const BIG_SOFT = 90;        // softening, so a near-miss doesn't fire them into space
const BIG_MAX_V = 620;      // nothing gets flung faster than this

function heavyList() {
  const out = [];
  for (const h of holes) out.push({ o: h, mass: 1.1 * h.size, kind: 'hole' });
  for (const s of suns) out.push({ o: s, mass: 1.7, kind: 'sun' });
  return out;
}

function updateHeavies(dt) {
  const list = heavyList();
  // ---- pull ----
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const A = list[i], B = list[j];
      const dx = B.o.x - A.o.x, dy = B.o.y - A.o.y;
      const d2 = dx * dx + dy * dy + BIG_SOFT * BIG_SOFT;
      const d = Math.sqrt(d2);
      const nx = dx / d, ny = dy / d;
      // each one feels the OTHER one's mass. Heavier partner, harder tug.
      const aA = BIG_G * B.mass / d2, aB = BIG_G * A.mass / d2;
      A.o.vx += nx * aA * dt; A.o.vy += ny * aA * dt;
      B.o.vx -= nx * aB * dt; B.o.vy -= ny * aB * dt;
    }
  }
  // ---- move ----
  for (const it of list) {
    const o = it.o;
    const held = (o === grabbedHole || o === grabbedSun);
    if (held) {
      // dragging one gives it real speed, so letting go THROWS it
      o.vx = (pointer.x - o.x) / Math.max(dt, 0.001) * 0.35;
      o.vy = (pointer.y - o.y) / Math.max(dt, 0.001) * 0.35;
      o.x = pointer.x; o.y = pointer.y;
    } else {
      const sp = Math.hypot(o.vx, o.vy);
      if (sp > BIG_MAX_V) { o.vx *= BIG_MAX_V / sp; o.vy *= BIG_MAX_V / sp; }
      o.vx *= 1 - 0.25 * dt;              // a whisper of drag so they settle
      o.vy *= 1 - 0.25 * dt;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
    }
    // the wall holds even these — they bounce off it like everything else
    const pad = WALL + 40 * (it.kind === 'hole' ? (o.size || 1) : 1.2);
    if (o.x < pad) { o.x = pad; o.vx = Math.abs(o.vx) * 0.6; }
    if (o.x > WORLD_W - pad) { o.x = WORLD_W - pad; o.vx = -Math.abs(o.vx) * 0.6; }
    if (o.y < pad) { o.y = pad; o.vy = Math.abs(o.vy) * 0.6; }
    if (o.y > WORLD_H - pad) { o.y = WORLD_H - pad; o.vy = -Math.abs(o.vy) * 0.6; }
  }
  // ---- and what happens when they actually meet ----
  resolveHeavyCollisions();
}

function resolveHeavyCollisions() {
  // TWO HOLES MEET: they merge into one bigger one. This really happens —
  // it's what shakes the whole universe hard enough for us to hear it.
  for (let i = 0; i < holes.length; i++) {
    for (let j = i + 1; j < holes.length; j++) {
      const a = holes[i], b = holes[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) > 26 * (a.size + b.size)) continue;
      const big = a.size >= b.size ? a : b, small = big === a ? b : a;
      const ma = big.size, mb = small.size;
      big.x = (big.x * ma + small.x * mb) / (ma + mb);
      big.y = (big.y * ma + small.y * mb) / (ma + mb);
      big.vx = (big.vx * ma + small.vx * mb) / (ma + mb);   // momentum keeps
      big.vy = (big.vy * ma + small.vy * mb) / (ma + mb);
      big.size = ma + mb * 0.85;
      big.fed = 2.2; big.fedColor = '#c8a4ff';
      big.tentMax = Math.max(big.tentMax || 2, small.tentMax || 2);
      holes.splice(holes.indexOf(small), 1);
      shake = Math.max(shake, 0.8);
      flashT = Math.max(flashT, 0.25);
      boomSound();
      setTimeout(() => beep(38, 0.7, 'sine', 0.28), 60);
      floatTexts.push({ x: big.x, y: big.y - 70 * big.size, t: 1.6, text: 'MERGED!' });
      for (let k = 0; k < 40; k++) {
        const ang = Math.random() * Math.PI * 2, sp = 200 + Math.random() * 500;
        particles.push({ x: big.x, y: big.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                         life: 0.4 + Math.random() * 0.5, color: '#b48cff' });
      }
      return;                                   // one merger a frame is plenty
    }
  }
  suns = suns.filter(s => !s.gone);
}

// ---------------------------------------------------------------------
// A HOLE DRINKING A STAR
// ---------------------------------------------------------------------
// A black hole doesn't gulp a star down in one bite — it can't. What really
// happens is that it peels the star apart from the outside, a layer at a
// time, and the stolen gas spirals in along a bright stream. The star sits
// there shrinking for ages while the hole gets fatter. It's the slowest,
// meanest robbery in the universe, and it's much better to watch than a
// SLURP and a puff of smoke.
let siphons = [];              // the live streams, rebuilt every frame

function updateSiphons(dt) {
  siphons = [];
  for (const s of suns) s.grip = 0;        // nobody's stealing from you yet
  for (const h of holes) {
    for (const s of suns) {
      if (s.gone) continue;
      const dx = h.x - s.x, dy = h.y - s.y;
      const d = Math.hypot(dx, dy) || 1;
      const reach = 300 + 120 * h.size;     // a bigger hole reaches further
      if (d > reach) continue;
      // closer = faster. It's a gentle trickle at the edge of its reach and
      // a torrent when they're nearly touching.
      const grip = Math.min(1, (1 - d / reach) * 1.6);
      // Slow on purpose. A full star takes the best part of ten seconds to
      // drink, because the point is to WATCH it happen.
      const stolen = 0.12 * grip * dt;
      s.mass = (s.mass === undefined ? 1 : s.mass) - stolen;
      h.size += stolen * 0.8;               // not all of it makes it in
      h.fed = Math.max(h.fed || 0, 0.25);
      h.fedColor = '#ffb64a';
      s.grip = Math.max(s.grip, grip);
      siphons.push({ h, s, grip });
      if (s.mass <= 0.12) {
        // the last of the star goes down. no supernova — there's nothing
        // left to explode; it's already inside.
        s.gone = true;
        h.size += 0.25;
        h.fed = 2.4;
        shake = Math.max(shake, 0.6);
        flashT = Math.max(flashT, 0.25);
        slurpSound();
        floatTexts.push({ x: h.x, y: h.y - 70 * h.size, t: 1.8, text: 'STAR DRAINED!' });
        for (let k = 0; k < 50; k++) {
          const ang = Math.random() * Math.PI * 2, sp = 120 + Math.random() * 380;
          particles.push({ x: s.x, y: s.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                           life: 0.3 + Math.random() * 0.6,
                           color: ['#ffd23f', '#ff9f43', '#ffffff'][k % 3] });
        }
      }
    }
  }
  suns = suns.filter(s => !s.gone);
}

// the stolen gas, drawn as a bright ribbon curving from star to hole
function drawSiphons() {
  for (const { h, s, grip } of siphons) {
    const dx = h.x - s.x, dy = h.y - s.y;
    const d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;
    // the stream doesn't go straight in — it swings round the way the hole
    // spins, which is why real ones look like a ribbon and not a pipe
    const bowX = -ny * d * 0.28 * (h.spin || 1);
    const bowY = nx * d * 0.28 * (h.spin || 1);
    const mid = { x: s.x + dx * 0.5 + bowX, y: s.y + dy * 0.5 + bowY };
    for (const pass of [[13 * grip, 'rgba(255, 150, 50, 0.20)'],
                        [6 * grip, 'rgba(255, 205, 110, 0.45)'],
                        [2.2 * grip, 'rgba(255, 250, 225, 0.85)']]) {
      ctx.strokeStyle = pass[1];
      ctx.lineWidth = pass[0];
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(s.x + nx * 20, s.y + ny * 20);
      ctx.quadraticCurveTo(mid.x, mid.y, h.x, h.y);
      ctx.stroke();
    }
    // blobs of gas travelling along it, so you can see which way it's flowing
    for (let i = 0; i < 5; i++) {
      const t = ((elapsed * 0.75 + i * 0.2) % 1);
      const u = 1 - t;
      const bx = u * u * (s.x + nx * 20) + 2 * u * t * mid.x + t * t * h.x;
      const by = u * u * (s.y + ny * 20) + 2 * u * t * mid.y + t * t * h.y;
      ctx.fillStyle = `rgba(255, 245, 210, ${0.9 * grip * (1 - t * 0.5)})`;
      ctx.beginPath();
      ctx.arc(bx, by, (4.5 - t * 2) * grip + 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function slitherSound() {
  beep(280, 0.1, 'sawtooth', 0.06);
  setTimeout(() => beep(180, 0.15, 'sawtooth', 0.06), 80);
}
function addLauncher(x, y) {
  launchers.push({ x, y, cd: 0, recoil: 0 });
  if (launchers.length > 3) launchers.shift();
}

// people don't get hurt in this lab. they POP — like a balloon full
// of confetti — and you simply spawn some more. that's showbiz.
function popPerson(b) {
  if (b.gone) return;
  b.gone = true;
  popSound();
  const colors = [b.shirt, b.skin, '#ffd23f', '#7ddf8f', '#b482ff', '#ffffff'];
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 380;
    particles.push({
      x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
      life: 0.5 + Math.random() * 0.7,
      color: colors[i % colors.length],
    });
  }
  floatTexts.push({ x: b.x, y: b.y - 20, t: 1, text: 'POP!' });
}

// ---------------------------------------------------------------------
// THE EXPLOSION — the whole point of bombs
// ---------------------------------------------------------------------
function explode(bx, by) {
  boomSound();
  shake = 0.5;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 100 + Math.random() * 500;
    particles.push({
      x: bx, y: by, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.5,
      color: ['#ffd23f', '#ff9f43', '#e8453c', '#ffffff'][i % 4],
    });
  }
  for (const b of bodies) {
    const dx = b.x - bx, dy = b.y - by;
    const d = Math.hypot(dx, dy) || 1;
    if (d > 240) continue;
    // close to the blast: people POP. farther out: they just FLY.
    if (b.type === 'person' && d < 150) { popPerson(b); continue; }
    const force = (1 - d / 240) * 1300;
    b.vx += (dx / d) * force;
    b.vy += (dy / d) * force - (gravityOn ? 250 * (1 - d / 240) : 0);
    b.angVel += (Math.random() - 0.5) * 14;
    if (b.type === 'person') { b.dizzy = 3; owSound(); }
    if (b.type === 'bomb' && b.fuse > 0.25) b.fuse = 0.25;   // chain reaction!!
  }
}

// ---------------------------------------------------------------------
// UPDATE — the laws of physics (while they're switched on)
// ---------------------------------------------------------------------
function update(dt) {
  elapsed += dt;
  if (shake > 0) shake -= dt;

  // ---- FROZEN TIME: the world holds its breath. only YOUR hand
  // still works — grab frozen things and rearrange the moment. ----
  if (!timeOn) {
    if (grabbed) {
      grabbed.vx = (pointer.x - grabbed.x) * 14;
      grabbed.vy = (pointer.y - grabbed.y) * 14;
      grabbed.x += grabbed.vx * dt;
      grabbed.y += grabbed.vy * dt;
    }
    return;
  }

  for (const b of bodies) {
    // every black hole in the room pulls on this thing
    const field = holes.length ? holeFieldAt(b.x, b.y, b.vx, b.vy) : null;
    // the grabbed body chases the finger like it's magnetized
    if (b === grabbed) {
      b.vx = (pointer.x - b.x) * 14;
      b.vy = (pointer.y - b.y) * 14;
    } else {
      if (field) {
        b.vx += field.ax * dt;
        b.vy += field.ay * dt;
        const drag = Math.min(0.85, field.strength / 2400) * HOLE_DRAG;
        b.vx -= b.vx * drag * dt;
        b.vy -= b.vy * drag * dt;
      }
      if (gravityOn) {
        // Close to a hole the lab's own gravity stops mattering. You aren't
        // falling DOWN any more — you're falling AROUND. Without this the
        // floor wins every argument and nothing ever gets to orbit: it just
        // sags out of its circle and lands. Squared, so the hole takes over
        // decisively inside its own patch and lets go quickly outside it.
        b.vy += GRAV * (field ? 1 / (1 + (field.strength / 150) ** 2) : 1) * dt;
      } else {
        // zero-g: the tiniest drift, so nothing ever quite sits still
        b.vx += Math.sin(elapsed * 0.7 + b.x * 0.01) * 6 * dt;
        b.vy += Math.cos(elapsed * 0.9 + b.y * 0.01) * 6 * dt;
      }
    }
    // anything properly caught in a well is tumbling, and people get dizzy
    if (field && field.strength > 140 && b !== grabbed) {
      b.angVel += (field.ax * -b.vy + field.ay * b.vx) * 0.000012;
      if (b.type === 'person') b.dizzy = Math.max(b.dizzy, 0.3);
    }

    // people walk when they're grounded, flail when they're not
    if (b.type === 'person') {
      if (b.dizzy > 0) b.dizzy -= dt;
      const grounded = gravityOn && b.y + b.r * 2 >= floorY() - 2 && Math.abs(b.vy) < 30;
      if (grounded && b.dizzy <= 0 && b !== grabbed) {
        // more legs = more speed. that's just biology.
        b.vx = b.walkDir * (42 + (b.limbs || 0) * 7);
        if (Math.random() < 0.005) b.walkDir *= -1;
        b.angle *= 0.8;                // stand up straight, citizen
        b.angVel = 0;
      } else if (!gravityOn) {
        b.angVel += (Math.random() - 0.5) * 0.5;   // zero-g flailing
      }
      b.blink -= dt;
      if (b.blink < -3) b.blink = 0.15;
    }

    // bombs tick down. and then they don't.
    // (launcher bombs tick silently — 30 tickers at once is a headache)
    if (b.type === 'bomb' || b.type === 'mutant') {
      b.fuse -= dt;
      if (!b.quiet) {
        b.tickT -= dt;
        if (b.tickT <= 0) { b.tickT = Math.max(0.12, b.fuse / 6); tickSound(); }
      }
      if (b.fuse <= 0) {
        b.gone = true;
        if (b.type === 'mutant') mutantExplode(b.x, b.y);
        else explode(b.x, b.y);
      }
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.angle += b.angVel * dt;
    b.angVel *= 0.99;
    if (!gravityOn) { b.vx *= 0.999; b.vy *= 0.999; }

    // the walls and floor and ceiling of the lab
    const R = b.r;
    if (b.y + R * (b.type === 'person' ? 2 : 1) > floorY()) {
      b.y = floorY() - R * (b.type === 'person' ? 2 : 1);
      if (b.vy > 40) {
        b.vy *= -0.58;                   // the floor is springy now too
        b.angVel += b.vx * 0.01;
      } else b.vy = 0;
      b.vx *= 0.92;                    // floor friction
    }
    // BOUNCE is how springy the walls are. 0 would be a beanbag, 1 would be a
    // superball that never loses any height. 0.72 is a good rubber ball.
    const BOUNCE = 0.72;
    if (b.y - R < WALL) { b.y = WALL + R; b.vy = Math.abs(b.vy) * BOUNCE; b.angVel += b.vx * 0.01; }
    if (b.x - R < WALL) {
      b.x = WALL + R; b.vx = Math.abs(b.vx) * BOUNCE; b.angVel -= b.vy * 0.01;
      if (b.type === 'person') b.walkDir = 1;
    }
    if (b.x + R > WORLD_W - WALL) {
      b.x = WORLD_W - WALL - R; b.vx = -Math.abs(b.vx) * BOUNCE; b.angVel += b.vy * 0.01;
      if (b.type === 'person') b.walkDir = -1;
    }

    // bodies gently shoulder each other out of the way
    for (const o of bodies) {
      if (o === b || o.gone) continue;
      const dx = o.x - b.x, dy = o.y - b.y;
      const d = Math.hypot(dx, dy);
      const min = b.r + o.r;
      if (d > 0 && d < min) {
        const push = (min - d) / 2;
        const nx = dx / d, ny = dy / d;
        b.x -= nx * push; b.y -= ny * push;
        o.x += nx * push; o.y += ny * push;
        const dvx = o.vx - b.vx, dvy = o.vy - b.vy;
        const rel = dvx * nx + dvy * ny;
        if (rel < 0) {
          b.vx += nx * rel * 0.5; b.vy += ny * rel * 0.5;
          o.vx -= nx * rel * 0.5; o.vy -= ny * rel * 0.5;
        }
      }
    }

    // spikes: pointy. crates boing off them. bombs wake up. people POP.
    for (const s of spikes) {
      if (b.x > s.x - 6 && b.x < s.x + 52 &&
          b.y + b.r * (b.type === 'person' ? 2 : 1) > s.y - 30 && b.y < s.y + 46 &&
          b.vy > 40) {
        if (b.type === 'person') { popPerson(b); break; }
        b.vy = -Math.abs(b.vy) * 0.9 - 250;
        b.vx += (Math.random() - 0.5) * 200;
        b.angVel += (Math.random() - 0.5) * 10;
        boingSound();
        if (b.type === 'bomb' || b.type === 'mutant') b.fuse = Math.min(b.fuse, 0.4);
      }
    }
  }
  bodies = bodies.filter(b => !b.gone);

  // ---- BOMB LAUNCHERS: ten per second. forever. as ordered. ----
  for (const L of launchers) {
    if (L === grabbedLauncher) { L.x = pointer.x; L.y = pointer.y; }
    if (L.recoil > 0) L.recoil -= dt;
    L.cd -= dt;
    // (the lab refuses to hold more than ~240 objects — even chaos
    // has a fire marshal)
    if (L.cd <= 0 && bodies.length < 240) {
      L.cd = 0.1;
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const sp = 350 + Math.random() * 350;
      bodies.push({ type: 'bomb', x: L.x, y: L.y - 24,
                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                    r: 14, angle: 0, angVel: (Math.random() - 0.5) * 8,
                    fuse: 1.4 + Math.random() * 0.8, tickT: 99, quiet: true });
      L.recoil = 0.08;
      beep(150 + Math.random() * 70, 0.04, 'square', 0.035);
    }
  }

  updateHeavies(dt);
  updateSiphons(dt);
  updateRemnants(dt);

  // ---- DYING SUNS: burn gold, swell red, then... goodnight. ----
  for (const sun of suns) {
    // A star being robbed isn't running down its own clock — it's being
    // taken apart from the outside. Its countdown all but stops while a
    // hole has hold of it, so it gets drained rather than racing to explode.
    sun.t += dt * (1 - (sun.grip || 0) * 0.85);
    // a sun is heavy: a gentle pull on everything, warmer than a hole's
    for (const b of bodies) {
      if (b === grabbed) continue;
      const dx = sun.x - b.x, dy = sun.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      const pull = Math.min(700, 30000 / Math.max(d, 40) + 80);
      b.vx += (dx / d) * pull * dt;
      b.vy += (dy / d) * pull * dt;
    }
    // the last three seconds rumble, so nobody can say they weren't warned
    if (sun.t > 5) {
      sun.rumbleT -= dt;
      if (sun.rumbleT <= 0) {
        sun.rumbleT = 0.4;
        beep(50, 0.25, 'sawtooth', 0.08);
        shake = Math.max(shake, 0.12);
      }
    }
    if (sun.t >= 8) { sun.gone = true; supernova(sun); }
  }
  suns = suns.filter(s => !s.gone);
  if (flashT > 0) flashT -= dt;

  // ---- BLACK HOLES: they pull. they swallow. sometimes they burp. ----
  for (const h of holes) {
    // Black holes grow by EATING, and only by eating. They used to also swell
    // just from existing, which meant a hole left alone in the corner quietly
    // got three times stronger while you weren't looking — and since size is
    // a straight multiplier on the pull, orbits got shorter the longer you
    // played. Now the one you place is the one you get, until you feed it.
    // The pull itself now lives with the rest of the physics, up in the
    // body loop — see holeFieldAt. All that's left here is the eating.
    for (const b of bodies) {
      if (b === grabbed) continue;
      const dx = h.x - b.x, dy = h.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < 28 * h.size) {
        // down the hatch — and the hole gets a little bigger for it
        b.gone = true;
        h.size += 0.08;
        h.fed = 1.3;                       // debris to fling about for a moment
        h.fedColor = b.shirt || (b.type === 'crate' ? '#c98a4a' : '#ffd23f');
        slurpSound();
        floatTexts.push({ x: h.x, y: h.y - 34 * h.size, t: 1, text: 'SLURP!' });
        if (b.type === 'bomb') burps.push({ hole: h, t: 0.6 });
        if (b.type === 'mutant') {
          // a hole that eats mutant goo grows... an extra tentacle slot
          h.tentMax = Math.min(6, (h.tentMax || 2) + 1);
          floatTexts.push({ x: h.x, y: h.y - 60 * h.size, t: 1.3, text: 'MUTATED!' });
          mutateSound();
        }
      }
    }

    // ---- THE TENTACLES: they reach out, latch on, and REEL IN ----
    h.tentT -= dt;
    if (tentaclesOn && h.tentT <= 0 && h.tents.length < (h.tentMax || 2)) {
      h.tentT = 2.4;
      let prey = null, preyD = 460 * h.size;
      for (const b of bodies) {
        if (b.type !== 'person' || b.tentacled || b === grabbed || b.gone) continue;
        const d = Math.hypot(b.x - h.x, b.y - h.y);
        if (d > 60 && d < preyD) { prey = b; preyD = d; }
      }
      if (prey) {
        prey.tentacled = true;
        h.tents.push({ target: prey, prog: 0, phase: 'reach' });
        slitherSound();
      }
    }
    for (const t of h.tents) {
      const b = t.target;
      // let go if the prey is gone, or the player wrestled it free
      if (!b || b.gone || b === grabbed || !bodies.includes(b)) {
        if (b) b.tentacled = false;
        t.dead = true;
        continue;
      }
      if (t.phase === 'reach') {
        t.prog += dt * 2.4;                // the tip whips outward
        if (t.prog >= 1) { t.prog = 1; t.phase = 'drag'; }
      } else {
        // hauled in, kicking, at tentacle speed
        const dx = h.x - b.x, dy = h.y - b.y;
        const d = Math.hypot(dx, dy) || 1;
        b.vx = (dx / d) * 270;
        b.vy = (dy / d) * 270;
        b.dizzy = Math.max(b.dizzy, 0.3);
        b.orbitDir = 0;
      }
    }
    h.tents = h.tents.filter(t => !t.dead);
    // confetti and smoke spiral in too — it sells the whole thing
    for (const p of particles) {
      const dx = h.x - p.x, dy = h.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      const pull = Math.min(1800, 60000 / Math.max(d, 30) + 150);
      p.vx += (dx / d) * pull * dt + (-dy / d) * pull * 0.5 * dt;   // with a swirl
      p.vy += (dy / d) * pull * dt + (dx / d) * pull * 0.5 * dt;
      if (d < 16) p.life = 0;
    }
    // Debris from whatever it just ate, whirling round before it goes down.
    // This used to spray out non-stop whether the hole had eaten anything or
    // not — a permanent shower of confetti with nothing feeding it. Now it
    // only appears when there's actually something to be debris FROM, and it
    // comes out the colour of the meal.
    if (h.fed > 0) {
      h.fed -= dt;
      if (Math.random() < 0.55) {
        const a = Math.random() * Math.PI * 2;
        const r = (70 + Math.random() * 50) * (h.size || 1);
        particles.push({
          x: h.x + Math.cos(a) * r, y: h.y + Math.sin(a) * r,
          vx: -Math.sin(a) * 140 * (h.spin || 1), vy: Math.cos(a) * 140 * (h.spin || 1),
          life: 0.9, color: Math.random() < 0.5 ? (h.fedColor || '#ffd23f')
                                                : ['#ffd23f', '#ffffff'][Math.random() < 0.5 ? 0 : 1],
        });
      }
    }
  }
  // swallowed bombs come back up as a BURP
  for (const bu of burps) {
    bu.t -= dt;
    if (bu.t <= 0) {
      burpSound();
      shake = Math.max(shake, 0.3);
      floatTexts.push({ x: bu.hole.x, y: bu.hole.y - 40, t: 1.2, text: 'BURP.' });
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
          x: bu.hole.x, y: bu.hole.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
          life: 0.5, color: i % 2 ? '#b482ff' : '#ffd23f',
        });
      }
    }
  }
  burps = burps.filter(b => b.t > 0);
  bodies = bodies.filter(b => !b.gone);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (gravityOn) p.vy += 600 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floatTexts) { f.y -= 50 * dt; f.t -= dt; }
  floatTexts = floatTexts.filter(f => f.t > 0);
}

// ---------------------------------------------------------------------
// INPUT — toolbar buttons, placing, GRABBING, and erasing
// ---------------------------------------------------------------------
let tool = 'person';
let uiRects = [];
let erasing = false;
let openMenu = null;        // 'build' | 'act' | null — which dropdown is down
let pendingPlace = null;    // a tap waiting to see if it becomes a pinch

// remove whatever's under the eraser, one thing per tap
function eraseAt(x, y) {
  const puff = (px2, py2) => {
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({ x: px2, y: py2, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 40,
                       life: 0.35, color: '#8a8fa0' });
    }
    beep(500, 0.05, 'sine', 0.07);
  };
  for (let i = launchers.length - 1; i >= 0; i--) {
    if (Math.hypot(launchers[i].x - x, launchers[i].y - y) < 44) {
      puff(launchers[i].x, launchers[i].y);
      launchers.splice(i, 1);
      return true;
    }
  }
  for (let i = suns.length - 1; i >= 0; i--) {
    if (Math.hypot(suns[i].x - x, suns[i].y - y) < 60) {
      puff(suns[i].x, suns[i].y);
      suns.splice(i, 1);          // erased suns just... don't. no boom.
      return true;
    }
  }
  for (let i = holes.length - 1; i >= 0; i--) {
    if (Math.hypot(holes[i].x - x, holes[i].y - y) < 44 * (holes[i].size || 1)) {
      puff(holes[i].x, holes[i].y);
      for (const t of holes[i].tents || []) {
        if (t.target) t.target.tentacled = false;   // freed by the eraser
      }
      holes.splice(i, 1);
      return true;
    }
  }
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (Math.hypot(b.x - x, b.y - y) < b.r + 20) {
      puff(b.x, b.y);
      bodies.splice(i, 1);
      return true;
    }
  }
  for (let i = spikes.length - 1; i >= 0; i--) {
    const s = spikes[i];
    if (x > s.x - 8 && x < s.x + 54 && y > s.y - 12 && y < s.y + 54) {
      puff(s.x + 23, s.y + 23);
      spikes.splice(i, 1);
      return true;
    }
  }
  return false;
}

// everything a single finger might have started, so a second finger can
// cleanly cancel it and take over as a pinch
function cancelTouchAction() {
  grabbed = null; grabbedHole = null; grabbedLauncher = null; grabbedSun = null;
  erasing = false;
  pendingPlace = null;
}

addEventListener('pointerdown', e => {
  ensureAudio();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    // a second finger landed — that's a pinch, not a bomb. Undo whatever
    // the first finger was in the middle of doing.
    cancelTouchAction();
    startGesture();
    return;
  }
  if (pointers.size > 2) return;

  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) {
      if (r.id === 'menu_build' || r.id === 'menu_act') {
        const which = r.id === 'menu_build' ? 'build' : 'act';
        openMenu = openMenu === which ? null : which;   // tap again to close
        beep(660, 0.04, 'sine', 0.05);
        return;
      }
      if (r.id !== 'nothing') openMenu = null;          // a choice closes the menu
      if (r.id === 'gravity') {
        gravityOn = !gravityOn;
        whooshSound();
        if (!gravityOn) {
          // a little send-off so everything visibly lifts
          for (const b of bodies) b.vy -= 60 + Math.random() * 80;
        }
      } else if (r.id === 'tent') {
        tentaclesOn = !tentaclesOn;
        if (!tentaclesOn) {
          // every tentacle lets go, everywhere, right now
          for (const h of holes) {
            for (const t of h.tents || []) {
              if (t.target) t.target.tentacled = false;
            }
            h.tents = [];
          }
          beep(220, 0.15, 'sine', 0.1);
        } else beep(440, 0.15, 'sine', 0.1);
      } else if (r.id === 'time') {
        timeOn = !timeOn;
        if (timeOn) {
          beep(300, 0.1, 'sine', 0.1);
          setTimeout(() => beep(600, 0.15, 'sine', 0.1), 90);
        } else {
          beep(600, 0.1, 'sine', 0.1);
          setTimeout(() => beep(300, 0.25, 'sine', 0.1), 90);
        }
      } else if (r.id === 'clear') {
        bodies = []; spikes = []; particles = []; holes = []; burps = [];
        launchers = []; suns = []; remnants = []; siphons = [];
      } else tool = r.id;
      return;
    }
  }
  // tapping the world with a menu open just closes the menu
  if (openMenu) { openMenu = null; return; }

  const w = screenToWorld(e.clientX, e.clientY);
  pointer = w;
  // the eraser takes priority over grabbing — tap or sweep to remove
  if (tool === 'erase') {
    erasing = true;
    eraseAt(w.x, w.y);
    return;
  }
  // black holes can be grabbed and walked like a very dangerous dog
  for (const h of holes) {
    if (Math.hypot(h.x - w.x, h.y - w.y) < 44 * (h.size || 1)) {
      grabbedHole = h;
      return;
    }
  }
  // launchers reposition the same way — a bomb hose you can aim
  for (const L of launchers) {
    if (Math.hypot(L.x - w.x, L.y - w.y) < 44) {
      grabbedLauncher = L;
      return;
    }
  }
  // dying suns can be carried too. carefully. they're on a timer.
  for (const s of suns) {
    if (Math.hypot(s.x - w.x, s.y - w.y) < 60) {
      grabbedSun = s;
      return;
    }
  }
  // grab the nearest body if one is close enough...
  let best = null, bestD = 48;
  for (const b of bodies) {
    const d = Math.hypot(b.x - w.x, b.y - w.y);
    if (d < bestD + b.r) { best = b; bestD = d; }
  }
  if (best) { grabbed = best; return; }
  // ...otherwise remember WHERE you tapped, and place it when you lift off.
  // Waiting for the lift is what lets a second finger cancel it — otherwise
  // the first finger of every pinch would drop something.
  pendingPlace = { x: w.x, y: w.y, sx: e.clientX, sy: e.clientY, moved: false };
});

function placeAt(x, y) {
  if (tool === 'person') addPerson(x, y);
  else if (tool === 'crate') addCrate(x, y);
  else if (tool === 'bomb') addBomb(x, y);
  else if (tool === 'mutant') addMutant(x, y);
  else if (tool === 'spike') addSpike(x - 23, y);
  else if (tool === 'hole') addHole(x, y);
  else if (tool === 'launcher') addLauncher(x, y);
  else if (tool === 'sun') addSun(x, y);
}

addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2) { if (gesture) moveGesture(); return; }
  pointer = screenToWorld(e.clientX, e.clientY);
  if (erasing) eraseAt(pointer.x, pointer.y);
  // a real drag isn't a tap, so it shouldn't leave anything behind
  if (pendingPlace && Math.hypot(e.clientX - pendingPlace.sx, e.clientY - pendingPlace.sy) > 12) {
    pendingPlace.moved = true;
  }
});
function endPointer(e, placeIfTapped) {
  if (e) pointers.delete(e.pointerId);
  if (pointers.size < 2) gesture = null;
  if (placeIfTapped && pendingPlace && !pendingPlace.moved && pointers.size === 0) {
    placeAt(pendingPlace.x, pendingPlace.y);
  }
  pendingPlace = null;
  grabbed = null; grabbedHole = null; grabbedLauncher = null; grabbedSun = null;
  erasing = false;
}
addEventListener('pointerup', e => endPointer(e, true));
addEventListener('pointercancel', e => endPointer(e, false));

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function drawPerson(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  // mutant limbs first, so they wave from BEHIND the body — each one
  // sprouts at a golden-angle spot and wiggles on its own beat
  if (b.limbs) {
    ctx.strokeStyle = b.skin;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let i = 0; i < b.limbs; i++) {
      const a = i * 2.39996 + 0.7;
      const wig = Math.sin(elapsed * 6 + i * 1.7) * 0.5;
      const L = 16 + (i % 3) * 5;
      const bx2 = Math.cos(a + wig) * L;
      const by2 = 8 + Math.sin(a + wig) * L;
      ctx.beginPath();
      ctx.moveTo(0, 8);
      ctx.quadraticCurveTo(bx2 * 0.5, 8 + (by2 - 8) * 0.5 - 6, bx2, by2);
      ctx.stroke();
      ctx.fillStyle = b.skin;                  // a tiny hand on each
      ctx.beginPath();
      ctx.arc(bx2, by2, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // body
  ctx.fillStyle = b.shirt;
  ctx.fillRect(-9, -2, 18, 22);
  ctx.fillStyle = '#3a4050';                   // little legs
  ctx.fillRect(-8, 20, 6, 10);
  ctx.fillRect(2, 20, 6, 10);
  // head
  ctx.fillStyle = b.skin;
  ctx.beginPath();
  ctx.arc(0, -12, 11, 0, Math.PI * 2);
  ctx.fill();
  // face: eyes (X-eyes while dizzy), tiny mouth
  if (b.dizzy > 0) {
    ctx.strokeStyle = '#101418';
    ctx.lineWidth = 1.6;
    for (const ex of [-4, 4]) {
      ctx.beginPath();
      ctx.moveTo(ex - 2, -16); ctx.lineTo(ex + 2, -12);
      ctx.moveTo(ex + 2, -16); ctx.lineTo(ex - 2, -12);
      ctx.stroke();
    }
    // dizzy stars orbiting the head
    for (let i = 0; i < 3; i++) {
      const a = elapsed * 5 + i * 2.1;
      ctx.fillStyle = '#ffd23f';
      ctx.font = '10px monospace';
      ctx.fillText('★', Math.cos(a) * 16 - 4, -18 + Math.sin(a) * 7);
    }
  } else {
    ctx.fillStyle = '#101418';
    if (b.blink > 0) {
      ctx.fillRect(-6, -14, 5, 1.5);
      ctx.fillRect(1, -14, 5, 1.5);
    } else {
      ctx.fillRect(-5, -16, 3, 4);
      ctx.fillRect(2, -16, 3, 4);
    }
    ctx.fillRect(-2, -8, 4, 1.5);
  }
  ctx.restore();
}

function drawCrate(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  ctx.fillStyle = '#a8763e';
  ctx.fillRect(-b.r, -b.r, b.r * 2, b.r * 2);
  ctx.strokeStyle = '#7a5228';
  ctx.lineWidth = 3;
  ctx.strokeRect(-b.r, -b.r, b.r * 2, b.r * 2);
  ctx.beginPath();
  ctx.moveTo(-b.r, -b.r); ctx.lineTo(b.r, b.r);
  ctx.moveTo(b.r, -b.r); ctx.lineTo(-b.r, b.r);
  ctx.stroke();
  ctx.restore();
}

function drawBomb(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.angle);
  const mutant = b.type === 'mutant';
  const panic = b.fuse < 1 && Math.floor(elapsed * 10) % 2;
  ctx.fillStyle = panic ? (mutant ? '#b4ff8f' : '#e8453c')
                        : (mutant ? '#3f8f3f' : '#22262e');
  ctx.beginPath();
  ctx.arc(0, 0, b.r, 0, Math.PI * 2);
  ctx.fill();
  if (mutant) {
    // goo bubbles crawling up the glass
    ctx.fillStyle = 'rgba(180, 255, 143, 0.8)';
    for (let i = 0; i < 3; i++) {
      const bt = (elapsed * 0.8 + i * 0.33) % 1;
      ctx.beginPath();
      ctx.arc(-5 + i * 5, 6 - bt * 14, 2 + i * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.strokeStyle = '#101418';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = '#8a8378';                   // the cap
  ctx.fillRect(-4, -b.r - 5, 8, 6);
  ctx.strokeStyle = '#c8a06a';                 // the fuse, burning down
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, -b.r - 5);
  ctx.quadraticCurveTo(8, -b.r - 12, 12, -b.r - 8);
  ctx.stroke();
  ctx.fillStyle = '#ffd23f';                   // the spark
  ctx.beginPath();
  ctx.arc(12 + Math.random() * 3, -b.r - 8, 3 + Math.random() * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// how much spacetime bends at (x, y): every hole (and sun) drags the
// grid toward itself — strong up close, gentle far away. this is the
// classic "rubber sheet" picture of gravity, drawn live.
function warpOffset(x, y) {
  let ox = 0, oy = 0;
  for (const h of holes) {
    const dx = h.x - x, dy = h.y - y;
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2) || 1;
    const S = h.size || 1;
    // A much deeper, much wider dent than before — about six times the pull
    // at arm's length, and it still shows a screen away. You should be able
    // to SEE the funnel, not squint for it.
    const m = Math.min(120 * S, 4000000 * S / (d2 + 26000));
    ox += (dx / d) * m;
    oy += (dy / d) * m;
    // ...and a TWIST, because the hole is spinning. The sheet gets wound
    // around it, not just sucked in. This is what makes it look alive.
    const tw = Math.min(46 * S, 1200000 * S / (d2 + 34000)) * (h.spin || 1);
    ox += (-dy / d) * tw;
    oy += (dx / d) * tw;
  }
  for (const s of suns) {
    const dx = s.x - x, dy = s.y - y;
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2) || 1;
    const m = Math.min(34, 420000 / (d2 + 12000));
    ox += (dx / d) * m;
    oy += (dy / d) * m;
  }
  return [ox, oy];
}

function drawWarpedGrid() {
  const bend = holes.length || suns.length;
  // Everything here is measured in SCREEN pixels and converted back, so the
  // grid looks the same however far in or out you are — and, just as
  // importantly, we never do work that lands on a fraction of a pixel.
  //
  // The squares get bigger (in world terms) as you pull back, so they stay
  // about 22 screen pixels apart instead of collapsing into a grey mush.
  const step = 60 * Math.max(1, Math.ceil(22 / (60 * cam.zoom)));
  // How finely each curve is sampled: fine up close to a hole, coarse when
  // you've pulled right back and the wiggles would be sub-pixel anyway.
  const seg = bend ? Math.max(5, Math.min(step, 9 / cam.zoom)) : step;
  const vw = canvas.width / cam.zoom, vh = canvas.height / cam.zoom;
  const x0 = Math.max(0, Math.floor((cam.x - 60) / step) * step);
  const x1 = Math.min(WORLD_W, cam.x + vw + 60);
  const y0 = Math.max(0, Math.floor((cam.y - 60) / step) * step);
  const y1 = Math.min(WORLD_H, cam.y + vh + 60);

  // A flat lab is one cheap path and we're done.
  if (!bend) {
    ctx.strokeStyle = 'rgba(140, 170, 255, 0.11)';
    ctx.lineWidth = 1 / cam.zoom;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += step) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += step) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    return;
  }

  // Bent: each little piece of line is sorted into one of four brightness
  // buckets by how hard IT is being pulled, so the strain glows exactly where
  // spacetime is actually stretched instead of lighting the whole line.
  // Sorting first means four stroke calls instead of a thousand.
  // Twelve brightness levels instead of four. The gradient was stepping in
  // visible bands where the hole bends the grid hardest; three times as many
  // levels smooths that out, and it still costs only one stroke call each.
  const LEVELS = 12;
  const paths = [];
  for (let i = 0; i < LEVELS; i++) paths.push(new Path2D());

  // NOTHING GETS OUT. The event horizon is the point of no return — not even
  // light comes back from inside it. So the grid doesn't get drawn in there
  // at all, and it fades away as it approaches: the funnel drains into a
  // genuinely black hole instead of a bright swirl.
  const escaping = (x, y) => {
    let dim = 1;
    for (const h of holes) {
      const horizon = 28 * (h.size || 1);
      const k = Math.hypot(h.x - x, h.y - y) / horizon;   // in horizon-radii
      if (k <= 1) return 0;                               // inside. gone.
      // fade out over roughly two horizon-radii — tight enough that the
      // bright, badly-stretched ring further out survives
      dim = Math.min(dim, Math.min(1, (k - 1) / 2.2));
    }
    return dim;
  };

  // Each point is shared by the two segments either side of it, so its warp
  // and its dimming are worked out ONCE and carried forward — it used to
  // measure the same point three times over.
  const addSeg = (ax, ay, aw, ad, bx, by, bw, bd) => {
    const dim = Math.min(ad, bd);
    if (dim <= 0.02) return;
    // smoothstep: eases in and out instead of ramping dead straight, which is
    // what stops you seeing where one level becomes the next
    const raw = Math.min(1, Math.max(aw, bw) / 85) * dim;
    const eased = raw * raw * (3 - 2 * raw);
    const k = Math.min(LEVELS - 1, Math.floor(eased * LEVELS));
    paths[k].moveTo(ax, ay);
    paths[k].lineTo(bx, by);
  };

  const walk = (fixed, from, to, vertical) => {
    let px = 0, py = 0, pw = 0, pd = 0, first = true;
    for (let t = from; t <= to; t += seg) {
      const gx = vertical ? fixed : t, gy = vertical ? t : fixed;
      const [ox, oy] = warpOffset(gx, gy);
      const x = gx + ox, y = gy + oy;
      const w = Math.hypot(ox, oy);
      const d = escaping(x, y);
      if (!first) addSeg(px, py, pw, pd, x, y, w, d);
      px = x; py = y; pw = w; pd = d; first = false;
    }
  };
  for (let x = x0; x <= x1; x += step) walk(x, y0, y1, true);
  for (let y = y0; y <= y1; y += step) walk(y, x0, x1, false);
  for (let i = 0; i < LEVELS; i++) {
    const t = i / (LEVELS - 1);
    // a cool blue-white, not neon purple — the stressed lines get paler and
    // thicker rather than more lurid
    ctx.strokeStyle = `rgba(${Math.round(140 + t * 80)}, ${Math.round(175 + t * 35)}, 255, ${0.09 + t * 0.34})`;
    ctx.lineWidth = (0.9 + t * 1.7) / cam.zoom;
    ctx.stroke(paths[i]);
  }
  ctx.lineWidth = 1;
}

function draw() {
  const W = canvas.width, H = canvas.height;
  if (!camReady) {
    // Start looking at the middle of the lab floor. The old sum came out at
    // 0.24 zoom on a phone, which made every person about four pixels tall —
    // technically the whole lab, practically a screen of dust. Never go below
    // 0.5 now, and pinch out if you want the wide view.
    cam.zoom = Math.max(0.5, Math.min(1, W / WORLD_W * 1.6));
    cam.x = (WORLD_W - W / cam.zoom) / 2;
    cam.y = WORLD_H - H / cam.zoom;
    clampCam();
    camReady = true;
  }
  // the void outside the lab walls
  ctx.fillStyle = '#07080d';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.scale(cam.zoom, cam.zoom);
  const shx = shake > 0 ? (Math.random() - 0.5) * 18 * shake : 0;
  const shy = shake > 0 ? (Math.random() - 0.5) * 14 * shake : 0;
  ctx.translate(-cam.x + shx, -cam.y + shy);

  // the lab: dark walls, grid lines, glowing floor strip
  ctx.fillStyle = gravityOn ? '#12141c' : '#0e1626';   // zero-g tints the room
  ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  drawWarpedGrid();                        // spacetime, doing its thing
  ctx.fillStyle = '#3b4460';
  ctx.fillRect(0, floorY(), WORLD_W, FLOOR_H + 20);
  ctx.fillStyle = gravityOn ? '#4a5a78' : '#7a5aff';
  ctx.fillRect(0, floorY(), WORLD_W, 5);

  // THE WALL — a solid rim right round the lab, with a bright lip on the
  // inside so you can see exactly what you're going to bounce off.
  ctx.fillStyle = '#3b4460';
  ctx.fillRect(0, 0, WORLD_W, WALL);                       // ceiling
  ctx.fillRect(0, 0, WALL, WORLD_H);                       // left
  ctx.fillRect(WORLD_W - WALL, 0, WALL, WORLD_H);          // right
  const lip = gravityOn ? '#8ea6d8' : '#b49aff';
  ctx.fillStyle = lip;
  ctx.fillRect(0, WALL - 5, WORLD_W, 5);
  ctx.fillRect(WALL - 5, 0, 5, WORLD_H);
  ctx.fillRect(WORLD_W - WALL, 0, 5, WORLD_H);
  // rivets, so it looks built rather than painted on
  ctx.fillStyle = 'rgba(255,255,255,0.20)';
  for (let x = WALL + 60; x < WORLD_W - WALL; x += 120) {
    ctx.fillRect(x, WALL / 2 - 3, 6, 6);
  }
  for (let y = WALL + 60; y < WORLD_H - WALL; y += 120) {
    ctx.fillRect(WALL / 2 - 3, y, 6, 6);
    ctx.fillRect(WORLD_W - WALL / 2 - 3, y, 6, 6);
  }

  // Gas being stolen from a star, drawn BEFORE the holes so the black
  // disc covers where the stream ends — it should vanish into the hole,
  // not paint a bright line across it.
  drawSiphons();

  // black holes: a dark heart, a glowing swirl, tentacles, appetite —
  // and they've been GROWING while you weren't watching
  for (const h of holes) {
    h.swirl = (h.swirl || 0) + 0.05;
    const S = h.size || 1;
    // the tentacles first, so they come from BEHIND the dark heart
    for (const t of h.tents || []) {
      const b = t.target;
      if (!b) continue;
      const p = t.phase === 'reach' ? t.prog : 1;
      const tipX = h.x + (b.x - h.x) * p;
      const tipY = h.y + (b.y - h.y) * p;
      for (const pass of [[9 * S, '#3a2560'], [5 * S, '#5a3a8f']]) {
        ctx.strokeStyle = pass[1];
        ctx.lineWidth = pass[0];
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i <= 8; i++) {
          const f = i / 8;
          const wob = Math.sin(elapsed * 9 + i * 1.4 + h.x) * 11 * S * (1 - f) * f * 4;
          const nx = -(tipY - h.y), ny = (tipX - h.x);
          const nl = Math.hypot(nx, ny) || 1;
          const px2 = h.x + (tipX - h.x) * f + (nx / nl) * wob;
          const py2 = h.y + (tipY - h.y) * f + (ny / nl) * wob;
          if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.stroke();
      }
      ctx.fillStyle = '#7a5aba';                 // the gripping tip
      ctx.beginPath();
      ctx.arc(tipX, tipY, 6 * S, 0, Math.PI * 2);
      ctx.fill();
    }
    // a faint violet halo, so it still belongs in this lab
    const g = ctx.createRadialGradient(h.x, h.y, 4, h.x, h.y, 110 * S);
    g.addColorStop(0, 'rgba(180, 130, 255, 0.30)');
    g.addColorStop(0.5, 'rgba(90, 60, 160, 0.14)');
    g.addColorStop(1, 'rgba(90, 60, 160, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(h.x - 110 * S, h.y - 110 * S, 220 * S, 220 * S);

    drawAccretionDisc(h);

    // THE EVENT HORIZON. Drawn at exactly the radius that eats things, so
    // what you can see is what will actually get you. (It used to be drawn
    // at 20·size while the swallowing happened at 28·size — the black circle
    // was a lie by eight pixels.)
    const horizon = 28 * S;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(h.x, h.y, horizon, 0, Math.PI * 2);
    ctx.fill();
    // the photon ring: light that got caught circling and never left. This is
    // the bright hoop in the real photographs of black holes.
    ctx.strokeStyle = `rgba(255, 235, 190, ${0.75 + Math.sin(elapsed * 3 + h.x) * 0.12})`;
    ctx.lineWidth = 2.4 * S;
    ctx.beginPath();
    ctx.arc(h.x, h.y, horizon * 1.04, 0, Math.PI * 2);
    ctx.stroke();
  }

  // dying suns: gold in their youth, swollen and red at the end
  for (const s of suns) {
    const p = Math.min(1, s.t / 8);              // 0 = newborn, 1 = goodbye
    const swell = p < 0.6 ? 1 : 1 + (p - 0.6) * 2.2;   // the red giant phase
    // a star being robbed visibly shrinks — that's the mass leaving
    const mass = s.mass === undefined ? 1 : s.mass;
    const R = (34 * swell + Math.sin(elapsed * (4 + p * 14)) * 3 * p) *
              (0.34 + 0.66 * Math.max(0, mass));
    const cr = 255;
    const cg = Math.floor(210 - p * 150);
    const cb = Math.floor(80 - p * 60);
    const g = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, R * 2.6);
    g.addColorStop(0, `rgba(${cr}, ${cg + 30}, ${cb + 60}, 0.9)`);
    g.addColorStop(0.4, `rgba(${cr}, ${cg}, ${cb}, 0.35)`);
    g.addColorStop(1, `rgba(${cr}, ${cg}, ${cb}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(s.x - R * 2.6, s.y - R * 2.6, R * 5.2, R * 5.2);
    // corona rays, spinning slow and stately
    ctx.strokeStyle = `rgba(${cr}, ${cg}, ${cb}, 0.5)`;
    ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      const a = elapsed * 0.7 + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(s.x + Math.cos(a) * R * 1.1, s.y + Math.sin(a) * R * 1.1);
      ctx.lineTo(s.x + Math.cos(a) * R * (1.4 + Math.sin(elapsed * 3 + i) * 0.15),
                 s.y + Math.sin(a) * R * (1.4 + Math.sin(elapsed * 3 + i) * 0.15));
      ctx.stroke();
    }
    ctx.fillStyle = `rgb(${cr}, ${cg}, ${cb})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 255, 220, ${0.8 - p * 0.5})`;   // the bright heart
    ctx.beginPath();
    ctx.arc(s.x - R * 0.2, s.y - R * 0.2, R * 0.45, 0, Math.PI * 2);
    ctx.fill();
    if (s.t > 5) {
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255, 120, 90, ${0.6 + Math.sin(elapsed * 10) * 0.4})`;
      ctx.font = 'bold 13px monospace';
      ctx.fillText((8 - s.t).toFixed(1), s.x, s.y - R - 12);
      ctx.textAlign = 'left';
    }
  }

  drawRemnants();      // the collapsing cores, on their way to being holes

  // bomb launchers: a stout little mortar with a wobbling aim
  for (const L of launchers) {
    ctx.save();
    ctx.translate(L.x, L.y);
    ctx.fillStyle = '#3a4050';                    // the base
    ctx.beginPath();
    ctx.moveTo(-22, 12); ctx.lineTo(22, 12); ctx.lineTo(14, -4); ctx.lineTo(-14, -4);
    ctx.fill();
    const wob = Math.sin(elapsed * 5 + L.x) * 0.12;
    ctx.rotate(wob);
    ctx.fillStyle = '#22262e';                    // the barrel
    const kick = L.recoil > 0 ? 5 : 0;
    ctx.fillRect(-8, -34 + kick, 16, 34);
    ctx.fillStyle = '#e8453c';
    ctx.fillRect(-8, -34 + kick, 16, 6);
    ctx.restore();
  }

  // spikes
  for (const s of spikes) {
    ctx.fillStyle = '#8a8378';
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const sx = s.x + 4 + i * 14;
      ctx.moveTo(sx, s.y + 46);
      ctx.lineTo(sx + 7, s.y + 10);
      ctx.lineTo(sx + 14, s.y + 46);
    }
    ctx.fill();
    ctx.fillStyle = '#d8d2c8';
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(s.x + 4 + i * 14 + 5, s.y + 10, 4, 8);
    }
  }

  for (const b of bodies) {
    if (b.type === 'person') drawPerson(b);
    else if (b.type === 'crate') drawCrate(b);
    else drawBomb(b);
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 7, 7);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const f of floatTexts) {
    ctx.globalAlpha = Math.min(1, f.t * 1.5);
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  ctx.restore();

  // the supernova whiteout — for half a second, there is only light
  if (flashT > 0) {
    ctx.fillStyle = `rgba(255, 250, 235, ${Math.min(0.9, flashT * 2)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // frozen time washes the whole lab in pale ice-light
  if (!timeOn) {
    ctx.fillStyle = 'rgba(150, 210, 255, 0.08)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(90, 200, 255, ${0.3 + Math.sin(elapsed * 3) * 0.15})`;
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    // this banner ran 151px off the side of a phone, so it wraps now
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(180, 228, 255, ${0.5 + Math.sin(elapsed * 3) * 0.2})`;
    const font = `bold ${Math.min(17, W / 32)}px monospace`;
    const lines = wrapText('❄ TIME IS FROZEN — arrange the moment, then let it go ❄',
                           W - 24, font);
    ctx.font = font;
    lines.forEach((ln, i) => ctx.fillText(ln, W / 2, H - 54 - (lines.length - 1 - i) * 22));
    ctx.textAlign = 'left';
  }

  // ---- toolbar ----
  // Thirteen buttons in a row filled five rows and a quarter of a phone
  // screen, and the Arcade pill sat right on top of the first one. So now
  // there are two: what you're BUILDING, and what you're DOING. Each opens
  // a dropdown. The build button wears the tool you've got picked, so you
  // can always see what a tap is going to drop.
  uiRects = [];
  const BUILD = [
    ['person', '🧍 PERSON'], ['crate', '📦 CRATE'], ['bomb', '💣 BOMB'],
    ['mutant', '🧪 MUTANT'], ['spike', '⚠ SPIKE'], ['hole', '🕳 HOLE'],
    ['launcher', '💥 LAUNCHER'], ['sun', '☀ SUN'], ['erase', '🧽 ERASE'],
  ];
  const ACTIONS = [
    ['gravity', gravityOn ? '🌍 GRAVITY: ON' : '🚀 GRAVITY: OFF'],
    ['time', timeOn ? '⏱ TIME: ON' : '❄ TIME: FROZEN'],
    ['tent', tentaclesOn ? '🐙 TENTACLES: ON' : '🐙 TENTACLES: OFF'],
    ['clear', '✖ CLEAR EVERYTHING'],
  ];

  const pill = pillBox();
  const barTop = 8;
  const barBtnH = 40;
  // the two buttons share whatever room is left beside the Arcade pill; if
  // that's too cramped they drop onto their own line underneath it
  let rowY = barTop;
  let left = pill.right + 8;
  if (W - left - 12 < 200) { rowY = pill.bottom + 8; left = 10; }
  const gap = 8;
  const btnW = Math.min(200, (W - left - 12 - gap) / 2);
  // the menu is called ITEMS, and wears the emoji of whatever you've got
  // picked so you can still see what a tap is going to drop
  const currentLabel = 'ITEMS ' + (BUILD.find(t => t[0] === tool) || BUILD[0])[1].split(' ')[0];

  const drawBtn = (x, y, w, h, label, id, on, colors) => {
    uiRects.push({ x, y, w, h, id });
    ctx.fillStyle = colors ? colors.fill : (on ? 'rgba(255, 210, 63, 0.25)' : 'rgba(255,255,255,0.07)');
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = colors ? colors.line : (on ? '#ffd23f' : '#5a5450');
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = colors ? colors.text : (on ? '#ffd23f' : '#c8c0b8');
    // shrink the writing until it fits the button rather than spilling out
    let fs = 14;
    ctx.font = `bold ${fs}px monospace`;
    while (ctx.measureText(label).width > w - 12 && fs > 9) {
      fs -= 1;
      ctx.font = `bold ${fs}px monospace`;
    }
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h / 2 + fs * 0.36);
    ctx.textAlign = 'left';
  };

  ctx.fillStyle = 'rgba(8, 10, 14, 0.75)';
  ctx.fillRect(0, 0, W, rowY + barBtnH + 8);
  drawBtn(left, rowY, btnW, barBtnH, currentLabel + '  ▾', 'menu_build', openMenu === 'build');
  drawBtn(left + btnW + gap, rowY, btnW, barBtnH, '⚙ ACTIONS  ▾', 'menu_act', openMenu === 'act');

  const barH = rowY + barBtnH + 8;

  // ---- the hint line ----
  // It ran 159px off the side of a phone, so it's shorter when there's less
  // room and it wraps if it still doesn't fit.
  const hint = W < 560
    ? 'tap to place — drag to FLING — pinch to zoom, two fingers to pan'
    : 'tap to place — drag to FLING — pinch or scroll to zoom, two fingers to pan — the grid IS spacetime';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  const hintLines = wrapText(hint, W - 20, '12px monospace');
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  hintLines.forEach((ln, i) => ctx.fillText(ln, 10, barH + 16 + i * 15));

  // ---- the dropdown itself ----
  if (openMenu) {
    const items = openMenu === 'build' ? BUILD : ACTIONS;
    const mx = openMenu === 'build' ? left : left + btnW + gap;
    const mw = Math.max(btnW, 190);
    const my = rowY + barBtnH + 4;
    // the rows squeeze up if the screen is short — a phone held sideways
    // couldn't fit all nine builds at full height
    const itemH = Math.max(30, Math.min(42, (H - my - 14) / items.length));
    // keep the panel on screen even when the button is near the right edge
    const px2 = Math.max(8, Math.min(mx, W - mw - 8));
    ctx.fillStyle = 'rgba(8, 10, 14, 0.94)';
    ctx.fillRect(px2, my, mw, items.length * itemH + 8);
    ctx.strokeStyle = '#5a5450';
    ctx.lineWidth = 2;
    ctx.strokeRect(px2, my, mw, items.length * itemH + 8);
    items.forEach(([id, label], i) => {
      const iy = my + 4 + i * itemH;
      const on = tool === id;
      const colors =
        id === 'gravity' ? (gravityOn ? { fill: 'rgba(125, 223, 143, 0.15)', line: '#7ddf8f', text: '#7ddf8f' }
                                      : { fill: 'rgba(122, 90, 255, 0.3)', line: '#9a7aff', text: '#c8b4ff' })
      : id === 'time'    ? (timeOn ? { fill: 'rgba(125, 223, 143, 0.15)', line: '#7ddf8f', text: '#7ddf8f' }
                                   : { fill: 'rgba(90, 200, 255, 0.3)', line: '#5ac8ff', text: '#b4e4ff' })
      : id === 'tent'    ? (tentaclesOn ? { fill: 'rgba(180, 130, 255, 0.2)', line: '#b482ff', text: '#c8a4ff' }
                                        : { fill: 'rgba(255,255,255,0.05)', line: '#5a5450', text: '#8a8478' })
      : id === 'clear'   ? { fill: 'rgba(232, 69, 60, 0.18)', line: '#e8453c', text: '#ff9f97' }
      : null;
      drawBtn(px2 + 4, iy, mw - 8, itemH - 4, label, id, on, colors);
    });
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.03, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// a little welcome committee, so the lab is never empty
setTimeout(() => {
  for (let i = 0; i < 4; i++) addPerson(WORLD_W / 2 - 240 + i * 120, WORLD_H - 400);
  addCrate(WORLD_W / 2 + 200, WORLD_H - 500);
  addCrate(WORLD_W / 2 + 260, WORLD_H - 560);
}, 300);
</script>
</body>
</html>
