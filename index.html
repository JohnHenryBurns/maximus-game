        // starts over in every map square and tiles across the floor.
        const tx = ((mapX * TEX_SIZE) | 0) & (TEX_SIZE - 1);
        const ty = ((mapY * TEX_SIZE) | 0) & (TEX_SIZE - 1);
        const dot = (ty << 7) + tx;

        if (doFloor) {
          const floorColour = shadeTable[floorShade + dot];
          frame32[floorRow + x]     = floorColour;
          frame32[floorRow + x + 1] = floorColour;
        }
        if (doCeil) {
          const ceilColour = shadeTable[ceilShade + dot];
          frame32[ceilRow + x]     = ceilColour;
          frame32[ceilRow + x + 1] = ceilColour;
        }

        mapX += stepX * 2;
        mapY += stepY * 2;
      }
    }

    // Slap the finished floor and ceiling down in one move.
    ctx.putImageData(frame, 0, 0);


    // ---- WALLS, one skinny stripe at a time ------------------------
    for (let screenX = 0; screenX < W; screenX += COLUMN_W) {
      // Slide along that ruler: -1 is the far left of our view,
      // 0 is dead ahead, +1 is the far right.
      const cameraX = 2 * screenX / W - 1;

      // The direction this one laser flies off in.
      let rayX = dirX + planeX * cameraX;
      let rayY = dirY + planeY * cameraX;

      // Squash it down to exactly one unit long, so counting steps
      // really does tell us the distance.
      const rayLen = Math.sqrt(rayX * rayX + rayY * rayY);
      rayX /= rayLen;
      rayY /= rayLen;

      const hit = castRay(rayX, rayY);

      // FISHEYE FIX. Without this the walls bulge out at you like you're
      // looking through a peephole, because lasers off to the side travel
      // further just by being off to the side. We want the STRAIGHT-AHEAD
      // distance, so we lean the measurement back toward straight ahead.
      // Delete this and walk around sometime - it's very funny.
      let dist = hit.dist * (rayX * dirX + rayY * dirY);

      // Never let the distance hit zero. Dividing by zero makes the
      // computer hand back Infinity, and Infinity draws nothing at all.
      if (dist < 0.05) dist = 0.05;

      // Jot this wall's distance down for every pixel column it covers.
      // The chests and webs will read these numbers in a moment to work
      // out whether they're in front of this wall or hidden behind it.
      for (let i = 0; i < COLUMN_W; i++) zBuffer[screenX + i] = dist;

      // THE WHOLE TRICK, RIGHT HERE:
      // close wall (small dist) -> big number -> tall stripe
      // far wall   (big dist)   -> small number -> short stripe
      const wallH = H / dist;
      // Centred on the HORIZON, not on the middle of the screen. Leave
      // this as (H - wallH) / 2 and the walls stay put while the floor
      // slides away from them - which looks completely broken, and is
      // worth doing once just to see.
      const top = horizon - wallH / 2;

      // How lit is it? 1 = right in your face, 0 = swallowed by the dark.
      let light = 1 - dist / TORCH_RANGE;
      if (light < 0) light = 0;

      // Walls facing different directions catch the light differently.
      // Without this, corners vanish and the cave looks like flat soup.
      // We figure out which way the wall faces by checking whether we
      // stopped closer to a left-right grid line or an up-down one.
      const fx = hit.x - Math.floor(hit.x);
      const fy = hit.y - Math.floor(hit.y);
      const facingSideways = Math.min(fx, 1 - fx) < Math.min(fy, 1 - fy);
      if (facingSideways) light *= 0.65;

      // WHERE along the block did the laser land? 0 means the far left
      // edge of that stone, 1 means the far right edge. If the wall
      // runs up-and-down we measure across it using y, otherwise x.
      const wallX = facingSideways ? fy : fx;

      // Grab the matching 1-pixel-wide sliver of our stone wallpaper and
      // stretch it to fill this whole stripe, top to bottom. Do that 400
      // times across the screen and the stone wraps around the cavern.
      const texX = Math.floor(wallX * TEX_SIZE);
      ctx.drawImage(stoneTexture, texX, 0, 1, TEX_SIZE,
                                  screenX, top, COLUMN_W, wallH);

      // Now throw darkness on top. The further away the stone is, the
      // more black we paint over it - until it's gone completely.
      // Painting shadow ON TOP is much easier than trying to work out
      // what colour every single dot of the stone should have been.
      ctx.fillStyle = 'rgba(0,0,0,' + (1 - light) + ')';
      ctx.fillRect(screenX, top, COLUMN_W, wallH);
    }


    // ---- CHESTS AND COBWEBS ----------------------------------------
    // Draw the FAR ones first, so nearer ones paint over the top of them.
    // It's called the painter's algorithm, for the obvious reason: you
    // paint the sky before you paint the tree standing in front of it.
    for (const thing of sprites) {
      const dx = thing.x - state.x;
      const dy = thing.y - state.y;
      thing.range = dx * dx + dy * dy;
    }
    sprites.sort((a, b) => b.range - a.range);

    // This number un-does our camera, turning "where it is on the map"
    // into "where it is compared to me, right now, facing this way".
    const invDet = 1 / (planeX * dirY - dirX * planeY);

    // THE CAMERA. Hand it any spot in the cavern - side to side, forward
    // and back, and how far below your eyes it sits - and it hands back
    // the exact dot on your screen where that spot appears. The 3D chests
    // are built entirely out of asking this thing about corners.
    const cam = {
      project: function (wx, wy, wz) {
        const offX = wx - state.x;
        const offY = wy - state.y;
        const depth = invDet * (planeX * offY - planeY * offX);
        if (depth <= 0.05) return null;    // behind us; no answer exists
        const across = invDet * (dirY * offX - dirX * offY);
        return {
          sx: (W / 2) * (1 + across / depth),
          sy: horizon + (wz * H / depth),
          depth: depth,
        };
      },
    };

    for (const thing of sprites) {
      const offX = thing.x - state.x;
      const offY = thing.y - state.y;

      // acrossness: how far left or right of straight-ahead it sits.
      // depth:      how far in FRONT of us it is.
      const acrossness = invDet * (dirY * offX - dirX * offY);
      const depth      = invDet * (planeX * offY - planeY * offX);

      // Behind us, or practically inside our own head. Skip it.
      if (depth <= 0.2) continue;

      // Chests are real boxes now, so they get built a completely
      // different way. Webs carry on being flat pictures.
      if (thing.kind === 'chest') {
        drawChest(thing, cam, depth);
        continue;
      }

      // Cobwebs and dropped loot are both flat pictures, but they come
      // from different places and sit at different heights, so work out
      // which picture and where it hangs before drawing either.
      let shades, scale, vOffset;

      if (thing.kind === 'loot') {
        shades = ITEMS[thing.item].shades;
        scale = 0.34;
        // Just above the floor, bobbing gently. Every dropped thing gets
        // its own starting point in the bob (that's thing.bob), so they
        // don't all rise and fall in step like one machine.
        const float = Math.sin(state.frame * 0.05 + thing.bob) * 0.030;
        vOffset = 0.5 - scale / 2 - 0.05 + float;
      } else {
        const kind = SPRITE_KINDS[thing.kind];
        shades = kind.shades;
        scale = kind.scale;
        vOffset = kind.vOffset;
      }

      // Same rule as everything else: the further off, the smaller.
      const size = (H / depth) * scale;

      // Where the middle of it lands across the screen.
      const middleX = (W / 2) * (1 + acrossness / depth);
      const leftEdge = middleX - size / 2;

      // How far down the screen it sits. Chests sink to the floor,
      // webs ride up to the ceiling - and the further away they are,
      // the closer to the horizon they drift.
      const topY = horizon - size / 2 + (vOffset * H / depth);

      // Torchlight, same as everything else.
      let light = 1 - depth / TORCH_RANGE;
      if (light < 0) light = 0;
      const picture = shades[(light * (SPRITE_SHADES - 1)) | 0];

      // Ask the picture how big it is rather than assuming. Cobwebs are
      // 64 dots across, item pictures are 48, and this same loop draws
      // both now.
      const picW = picture.width;
      const picH = picture.height;

      // Now paint it one column at a time, checking the wall distances
      // as we go. This is the bit that lets a chest hide behind a corner.
      for (let x = Math.floor(leftEdge); x < leftEdge + size; x++) {
        if (x < 0 || x >= W) continue;
        if (depth >= zBuffer[x]) continue;   // a wall is in the way

        const texX = (((x - leftEdge) / size) * picW) | 0;
        if (texX < 0 || texX >= picW) continue;

        ctx.drawImage(picture, texX, 0, 1, picH, x, topY, 1, size);
      }
    }


    // Your arm goes over the cavern, but under the menus and crosshair.
    drawHand();


    // ---- THE BIT ON TOP OF EVERYTHING ------------------------------
    // Drawn last, so it sits over the cavern instead of behind it.
    // Order matters in drawing: last one painted wins.

    // On a phone you're already playing the moment you touch the screen -
    // there's no mouse to capture, so there's nothing to ask for.
    const playing = mouseIsCaptured() || touchMode;

    if (!playing) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, halfH - 34, W, 68);
      ctx.fillStyle = '#e8d9b0';
      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CLICK OR TOUCH TO PLAY', W / 2, halfH + 9);
    } else {
      // Crosshair - a tiny plus sign so you always know where dead
      // ahead is. Two thin rectangles, that's all a crosshair is.
      ctx.fillStyle = 'rgba(255, 232, 186, 0.45)';
      // DEAD CENTRE OF THE SCREEN, always - not on the horizon.
      //
      // There are two different "straight aheads" now and it's worth
      // knowing the difference. The HORIZON is where eye-level lands.
      // The MIDDLE OF THE SCREEN is where you're actually looking. Before
      // you could tilt your view they were the same spot, so it never
      // came up. Now they're not.
      //
      // Your aim goes with your eyes. Put it on the horizon instead and
      // looking down sends the crosshair UP toward the ceiling while
      // you're staring at the floor, which is exactly backwards.
      ctx.fillRect(W / 2 - 7, halfH, 14, 2);
      ctx.fillRect(W / 2, halfH - 7, 2, 14);
    }

    // "Press E" - but only when there's actually a chest to open. A hint
    // that's always on screen stops being a hint and becomes wallpaper.
    // On a phone the OPEN button lights up instead, so we don't need to
    // tell you to press a key you haven't got.
    if (mouseIsCaptured() && !touchMode && chestInReach()) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(W / 2 - 110, halfH + 46, 220, 32);
      ctx.fillStyle = '#ffe9a8';
      ctx.font = 'bold 17px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Press E to open', W / 2, halfH + 68);
    }

    // Whatever just happened, said out loud for a couple of seconds.
    if (state.frame < state.messageUntil) {
      // Fade it out over the last half second instead of snapping off.
      const left = state.messageUntil - state.frame;
      const fade = left < 30 ? left / 30 : 1;
      ctx.fillStyle = 'rgba(255, 240, 205, ' + fade + ')';
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(state.message, W / 2, 62);
    }

    // Thumb controls, then your pockets, over the top of everything.
    if (touchMode) drawTouchControls();
    drawInventory();
  }


  // --- 8. THE GAME LOOP -----------------------------------------------
  //     update, draw, update, draw, update, draw...
  //     ...about 60 times a second, forever.

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // And... go.
  loop();

  </script>
</body>
