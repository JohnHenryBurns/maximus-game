<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>A FART IN A CAVE</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #171310; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
// A FART IN A CAVE — a 2D side-scroller. You are a small green fart,
// deep underground, and you want OUT. Run right. Toot over the pits.
// Bounce on the SNIFFERS (walking noses that want to sniff you up).
// Eat the beans (fuel). Reach the shaft of daylight and be FREE.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND — boops and bings, cooked from pure math
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.1, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
// THE FART SOUND — a low sawtooth sliding downward, with a fast
// wobble on the volume. That wobble is the secret: it's the flutter.
function fart(len, base) {
  if (!audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  const lfo = audio.createOscillator(), lg = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base * 0.55, t + len);
  lfo.type = 'square';
  lfo.frequency.value = 26;
  lg.gain.value = 0.06;
  lfo.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(0.13, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + len + 0.05);
  lfo.start(t); lfo.stop(t + len + 0.05);
}
function jumpSound() { fart(0.22, 120 + Math.random() * 40); }
function coinSound() { beep(700, 0.06, 'square', 0.08); setTimeout(() => beep(1100, 0.15, 'square', 0.08), 50); }
function stompSound() { beep(520, 0.08, 'triangle', 0.15); setTimeout(() => beep(290, 0.14, 'triangle', 0.15), 60); }  // HONK
function splatSound() { beep(220, 0.08, 'sine', 0.18); setTimeout(() => beep(80, 0.18, 'sine', 0.2), 40); }            // SPLAT
function boingSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(650, audio.currentTime + 0.18);
  g.gain.setValueAtTime(0.16, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.3);
}
function hurtSound() { fart(0.7, 90); }               // the long, sad pffffft
function winSound() { [110, 145, 185, 235, 300].forEach((n, i) => setTimeout(() => fart(0.3, n), i * 200)); }

// ---------------------------------------------------------------------
// THE LEVEL — built from solid blocks. x, y, w, h are in world pixels.
// The ground has GAPS in it — that's what the jumping is for.
// ---------------------------------------------------------------------
const TILE = 46;                    // one block is this many pixels
const STORY_W = 6400;
const FLOOR = 640;                  // where the story level's ground sits

// ground pieces (the gaps between them are pits!)
const STORY_SOLIDS = [
  { x: 0,    y: FLOOR, w: 1200, h: 200 },
  { x: 1340, y: FLOOR, w: 800,  h: 200 },
  { x: 2280, y: FLOOR, w: 620,  h: 200 },
  { x: 3080, y: FLOOR, w: 1000, h: 200 },
  { x: 4260, y: FLOOR, w: 700,  h: 200 },
  { x: 5100, y: FLOOR, w: 1300, h: 200 },
  // floating platforms — brick shelves in the sky
  { x: 500,  y: FLOOR - 150, w: 3 * TILE, h: 40 },
  { x: 800,  y: FLOOR - 260, w: 3 * TILE, h: 40 },
  { x: 1450, y: FLOOR - 170, w: 4 * TILE, h: 40 },
  { x: 1800, y: FLOOR - 300, w: 3 * TILE, h: 40 },
  { x: 2400, y: FLOOR - 180, w: 3 * TILE, h: 40 },
  { x: 2650, y: FLOOR - 320, w: 3 * TILE, h: 40 },
  { x: 3300, y: FLOOR - 160, w: 4 * TILE, h: 40 },
  { x: 3700, y: FLOOR - 280, w: 3 * TILE, h: 40 },
  { x: 4400, y: FLOOR - 170, w: 3 * TILE, h: 40 },
  { x: 4700, y: FLOOR - 300, w: 4 * TILE, h: 40 },
  { x: 5400, y: FLOOR - 180, w: 3 * TILE, h: 40 },
  // stair blocks near the end, like the classic finale
  { x: 5750, y: FLOOR - TILE, w: TILE * 4, h: TILE },
  { x: 5796, y: FLOOR - TILE * 2, w: TILE * 3, h: TILE * 2 },
  { x: 5842, y: FLOOR - TILE * 3, w: TILE * 2, h: TILE * 3 },
];

// coins float where jumping is worth it
const COIN_SPOTS = [
  [570, FLOOR - 210], [640, FLOOR - 210],
  [870, FLOOR - 320], [940, FLOOR - 320],
  [1270, FLOOR - 120],                      // over the first pit!
  [1520, FLOOR - 230], [1590, FLOOR - 230],
  [1870, FLOOR - 360],
  [2210, FLOOR - 130],                      // over the second pit
  [2470, FLOOR - 240], [2720, FLOOR - 380],
  [2990, FLOOR - 140],                      // over the third pit
  [3380, FLOOR - 220], [3450, FLOOR - 220],
  [3770, FLOOR - 340],
  [4170, FLOOR - 130],                      // over the fourth pit
  [4470, FLOOR - 230],
  [4790, FLOOR - 360], [4860, FLOOR - 360],
  [5030, FLOOR - 130],                      // the last pit
  [5470, FLOOR - 240],
];

// walking baddies: [startX, leftEdge, rightEdge] of their patrol
const BADDIE_SPOTS = [
  [700, 480, 1150],
  [1600, 1360, 2100],
  [2500, 2300, 2860],
  [3400, 3100, 4040],
  [3800, 3100, 4040],
  [4500, 4280, 4920],
  [5300, 5120, 5700],
];

// FLYING TURDS patrol the air on tiny wings — mostly over the pits,
// exactly where you'd rather they weren't
const TURD_SPOTS = [
  [1210, FLOOR - 160],
  [2600, FLOOR - 360],
  [2870, FLOOR - 180],
  [4900, FLOOR - 200],
];

// ---------------------------------------------------------------------
// LEVELS — the game can play the STORY level, or YOUR level from the
// builder. These variables hold whichever level is loaded right now.
// ---------------------------------------------------------------------
let solids = [];
let specCoins = [];     // where beans belong (so restarting re-places them)
let specBaddies = [];   // where sniffers wake up
let specSpikes = [];    // where the pointy bits live
let specPlatforms = []; // where the gliding platforms run
let specTurds = [];     // where the flying turds take wing
let specCrumbles = [];  // where the untrustworthy blocks wait
let specBouncers = [];  // where the springy mushrooms grow, and where they aim
let spikes = [];
let platforms = [];
let turds = [];
let crumbles = [];
let bouncers = [];
let FLAG = { x: 6100, y: FLOOR };
let startPos = { x: 100, y: FLOOR - 60 };
let worldW = STORY_W;
let levelBottom = FLOOR + 200;   // below this + a bit = you fell in a pit
let playingCustom = false;

function loadStory() {
  playingCustom = false;
  solids = STORY_SOLIDS.map(s => ({ ...s, lid: s.y === FLOOR }));
  specCoins = COIN_SPOTS.map(c => ({ x: c[0], y: c[1] }));
  specBaddies = BADDIE_SPOTS.map(b => ({ x: b[0], y: FLOOR - 40 }));
  specSpikes = [];
  specPlatforms = [];
  specCrumbles = [];
  specBouncers = [];
  specTurds = TURD_SPOTS.map(t => ({ x: t[0], y: t[1] }));
  FLAG = { x: 6100, y: FLOOR };
  startPos = { x: 100, y: FLOOR - 60 };
  worldW = STORY_W;
  levelBottom = FLOOR + 200;
  resetLevel();
}

// ---------------------------------------------------------------------
// THE LEVEL BUILDER's notebook — everything you've placed, kept as
// grid cells ("cx,cy" strings). Saved to the browser automatically.
// ---------------------------------------------------------------------
let edit = {
  tiles: new Set(),
  beans: [],
  sniffers: [],
  spikes: [],
  turds: [],
  crumbles: [],         // blocks that shake, then fall away under your feet
  platforms: [],        // each one: { a: [cx, cy], b: [cx, cy] } — it glides a→b→a
  bouncers: [],         // { a: pad cell, b: where it flings you }
  start: [2, 12],
  exit: [16, 12],
};
// a fresh builder starts with a strip of ground so it's instantly playable
for (let i = 0; i < 19; i++) edit.tiles.add(i + ',13');

function saveCustom() {
  localStorage.setItem('fartcave_custom', JSON.stringify({
    tiles: [...edit.tiles], beans: edit.beans, sniffers: edit.sniffers,
    spikes: edit.spikes, turds: edit.turds, crumbles: edit.crumbles,
    platforms: edit.platforms, bouncers: edit.bouncers,
    start: edit.start, exit: edit.exit,
  }));
}
try {
  const saved = JSON.parse(localStorage.getItem('fartcave_custom'));
  if (saved && saved.tiles) {
    edit = { tiles: new Set(saved.tiles), beans: saved.beans || [],
             sniffers: saved.sniffers || [], spikes: saved.spikes || [],
             turds: saved.turds || [], crumbles: saved.crumbles || [],
             platforms: saved.platforms || [], bouncers: saved.bouncers || [],
             start: saved.start || [2, 12], exit: saved.exit || [16, 12] };
  }
} catch (err) { /* a broken save just means a fresh start */ }

function loadCustomLevel() {
  playingCustom = true;
  solids = [];
  let maxX = 900, maxBottom = 0;
  for (const key of edit.tiles) {
    const [cx, cy] = key.split(',').map(Number);
    const lid = !edit.tiles.has(cx + ',' + (cy - 1));
    solids.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE, lid });
    maxX = Math.max(maxX, cx * TILE + TILE);
    maxBottom = Math.max(maxBottom, cy * TILE + TILE);
  }
  specCoins = edit.beans.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + TILE / 2, y: cy * TILE + TILE / 2 };
  });
  specBaddies = edit.sniffers.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + 3, y: cy * TILE + TILE - 40 };
  });
  specSpikes = edit.spikes.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + 4, y: cy * TILE + TILE * 0.45, w: TILE - 8, h: TILE * 0.55 };
  });
  specPlatforms = edit.platforms.map(p => ({
    ax: p.a[0] * TILE, ay: p.a[1] * TILE,
    bx: p.b[0] * TILE, by: p.b[1] * TILE,
  }));
  specTurds = edit.turds.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + 3, y: cy * TILE + 6 };
  });
  specCrumbles = edit.crumbles.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE, y: cy * TILE };
  });
  specBouncers = edit.bouncers.map(b => ({
    x: b.a[0] * TILE + 3, y: b.a[1] * TILE + 26,
    tx: b.b[0] * TILE + TILE / 2, ty: b.b[1] * TILE + TILE / 2,
  }));
  FLAG = { x: edit.exit[0] * TILE + TILE / 2, y: (edit.exit[1] + 1) * TILE };
  startPos = { x: edit.start[0] * TILE + 6, y: edit.start[1] * TILE - 8 };
  worldW = Math.max(maxX + 300, 2000);
  levelBottom = maxBottom || 800;
  resetLevel();
}

// ---------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------
const player = {
  x: 100, y: FLOOR - 60, w: 34, h: 52,
  vx: 0, vy: 0,
  onGround: false,
  facing: 1,
  coyote: 0,        // grace time to jump just after leaving a ledge
  buffer: 0,        // grace time when jump is pressed just before landing
  invuln: 0,        // safety seconds after getting hurt
  walk: 0,
};
let coins = [];
let baddies = [];
let puffs = [];         // the toot-trail
let puffTimer = 0;
let hearts = 3;
let coinCount = 0;
let won = false;
let elapsed = 0;
let camX = 0;

let lastSafe = { x: 100, y: FLOOR - 60 };   // last solid ground you stood on

function resetLevel() {
  player.x = startPos.x; player.y = startPos.y;
  player.vx = 0; player.vy = 0;
  player.invuln = 0;
  hearts = 3;
  coinCount = 0;
  won = false;
  lastSafe = { x: startPos.x, y: startPos.y };
  coins = specCoins.map(c => ({ x: c.x, y: c.y, taken: false }));
  baddies = specBaddies.map(b => ({
    x: b.x, y: b.y, w: 40, h: 40, dir: 1, squish: 0,
  }));
  spikes = specSpikes.map(s => ({ ...s }));
  platforms = specPlatforms.map(p => ({
    ...p, x: p.ax, y: p.ay, w: TILE * 2, h: 16, t: 0, dir: 1, dx: 0, dy: 0,
  }));
  turds = specTurds.map(t => ({
    x: t.x, y: t.y, w: 40, h: 32, baseY: t.y,
    minX: t.x - 150, maxX: t.x + 150 + 40,
    dir: 1, phase: t.x * 0.1, squish: 0,
  }));
  crumbles = specCrumbles.map(c => ({
    x: c.x, y: c.y, ox: c.x, oy: c.y, w: TILE, h: TILE,
    crumble: true, shake: 0, falling: false, vy: 0, gone: false, respawn: 0,
  }));
  bouncers = specBouncers.map(b => ({
    x: b.x, y: b.y, w: 40, h: 20, tx: b.tx, ty: b.ty, anim: 0,
  }));
  player.ride = null;
  player.boostVx = 0;
}
loadStory();

// ---------------------------------------------------------------------
// INPUT — keyboard for computers, touch buttons for phones
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.key.toLowerCase()] = true;
  if (won && e.key === ' ') resetLevel();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// three big touch zones: ◀ ▶ on the left, JUMP on the right
let touchLeft = false, touchRight = false, touchJump = false;
function readTouches(e) {
  touchLeft = touchRight = touchJump = false;
  if (mode === 'build') return;         // fingers are for building now
  for (const t of e.touches) {
    if (t.clientY < 74) continue;       // the button bar isn't a control
    if (t.clientX > canvas.width * 0.55) touchJump = true;
    else if (t.clientX < canvas.width * 0.28) touchLeft = true;
    else touchRight = true;
  }
}
addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (won) { resetLevel(); return; }
  readTouches(e);
}, { passive: false });
addEventListener('touchmove', e => { e.preventDefault(); readTouches(e); }, { passive: false });
addEventListener('touchend', e => { e.preventDefault(); readTouches(e); }, { passive: false });

function heldLeft()  { return keys['arrowleft'] || keys['a'] || touchLeft; }
function heldRight() { return keys['arrowright'] || keys['d'] || touchRight; }
function heldJump()  { return keys[' '] || keys['arrowup'] || keys['w'] || touchJump; }

// ---------------------------------------------------------------------
// THE BUILDER's controls — pick a tool, then tap/drag on the world.
// Buttons (uiRects) are drawn each frame and clicked here.
// ---------------------------------------------------------------------
let tool = 'ground';
let editCamX = 0, editCamY = 260;
let painting = false;
let panLast = null;
let hoverPt = null;
let uiRects = [];

let pendingPlat = null;   // a platform waiting for its second tap

function uiAction(id) {
  pendingPlat = null;
  if (id === 'build') {
    mode = 'build';
    editCamX = edit.start[0] * TILE - canvas.width / 2;
    editCamY = edit.start[1] * TILE - canvas.height / 2;
  } else if (id === 'test') {
    saveCustom();
    loadCustomLevel();
    mode = 'play';
  } else if (id === 'story') {
    loadStory();
    mode = 'play';
  } else tool = id;
}

function applyTool(sx, sy) {
  if (sy < 96) return;                  // don't paint underneath the buttons
  const cx = Math.floor((sx + editCamX) / TILE);
  const cy = Math.floor((sy + editCamY) / TILE);
  const key = cx + ',' + cy;
  if (tool === 'ground') {
    edit.tiles.add(key);
    edit.beans = edit.beans.filter(k => k !== key);
    edit.sniffers = edit.sniffers.filter(k => k !== key);
    edit.spikes = edit.spikes.filter(k => k !== key);
    edit.turds = edit.turds.filter(k => k !== key);
    edit.crumbles = edit.crumbles.filter(k => k !== key);
  } else if (tool === 'bean') {
    if (!edit.tiles.has(key) && !edit.beans.includes(key)) edit.beans.push(key);
  } else if (tool === 'nose') {
    if (!edit.tiles.has(key) && !edit.sniffers.includes(key)) edit.sniffers.push(key);
  } else if (tool === 'spike') {
    if (!edit.tiles.has(key) && !edit.spikes.includes(key)) edit.spikes.push(key);
  } else if (tool === 'turd') {
    if (!edit.tiles.has(key) && !edit.turds.includes(key)) edit.turds.push(key);
  } else if (tool === 'crumble') {
    if (!edit.tiles.has(key) && !edit.crumbles.includes(key)) edit.crumbles.push(key);
  } else if (tool === 'plat') {
    // two taps: first sets where it starts, second sets where it glides to
    if (!pendingPlat) pendingPlat = [cx, cy];
    else {
      edit.platforms.push({ a: pendingPlat, b: [cx, cy] });
      pendingPlat = null;
    }
  } else if (tool === 'bounce') {
    // two taps: first plants the mushroom, second aims the fling
    if (!pendingPlat) pendingPlat = [cx, cy];
    else {
      edit.bouncers.push({ a: pendingPlat, b: [cx, cy] });
      pendingPlat = null;
    }
  } else if (tool === 'start') edit.start = [cx, cy];
  else if (tool === 'exit') edit.exit = [cx, cy];
  else if (tool === 'erase') {
    edit.tiles.delete(key);
    edit.beans = edit.beans.filter(k => k !== key);
    edit.sniffers = edit.sniffers.filter(k => k !== key);
    edit.spikes = edit.spikes.filter(k => k !== key);
    edit.turds = edit.turds.filter(k => k !== key);
    edit.crumbles = edit.crumbles.filter(k => k !== key);
    edit.platforms = edit.platforms.filter(p =>
      !(p.a[0] === cx && p.a[1] === cy) && !(p.b[0] === cx && p.b[1] === cy));
    edit.bouncers = edit.bouncers.filter(p =>
      !(p.a[0] === cx && p.a[1] === cy) && !(p.b[0] === cx && p.b[1] === cy));
  }
  saveCustom();                         // every change is saved instantly
}

// every finger/mouse currently touching the screen, by id — because
// TWO fingers swiping means "move the view", not "paint twice"
const pointers = new Map();
function pointerMid() {
  let mx = 0, my = 0;
  for (const p of pointers.values()) { mx += p.x; my += p.y; }
  return { x: mx / pointers.size, y: my / pointers.size };
}

addEventListener('pointerdown', e => {
  ensureAudio();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) { uiAction(r.id); return; }
  }
  if (mode !== 'build') {
    if (won) resetLevel();              // a mouse-click restart, too
    return;
  }
  if (pointers.size >= 2) {
    // a second finger landed: stop painting, start swiping the view
    painting = false;
    panLast = pointerMid();
    return;
  }
  if (tool === 'pan' || e.button === 2) {
    panLast = { x: e.clientX, y: e.clientY };
    return;
  }
  painting = true;
  applyTool(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode !== 'build') return;
  hoverPt = { x: e.clientX, y: e.clientY };
  if (pointers.size >= 2) {
    // two-finger swipe: the view follows the midpoint of your fingers
    const mid = pointerMid();
    if (panLast) {
      editCamX -= mid.x - panLast.x;
      editCamY -= mid.y - panLast.y;
    }
    panLast = mid;
    return;
  }
  if (panLast) {
    editCamX -= e.clientX - panLast.x;
    editCamY -= e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
  } else if (painting) applyTool(e.clientX, e.clientY);
});
function dropPointer(e) {
  pointers.delete(e.pointerId);
  painting = false;
  panLast = null;
}
addEventListener('pointerup', dropPointer);
addEventListener('pointercancel', dropPointer);
// right-click drag is a pan, not a browser menu
addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------
// PHYSICS — the invisible rules that make jumping feel GOOD
// ---------------------------------------------------------------------
const GRAVITY = 2300;
const RUN_SPEED = 290;
const JUMP_POWER = 860;

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

let mode = 'play';      // 'play' or 'build'
let jumpWasHeld = false;
function update(dt) {
  elapsed += dt;
  if (won || mode === 'build') return;

  // ---- running (plus any leftover fling from a bouncy mushroom) ----
  const want = (heldRight() ? 1 : 0) - (heldLeft() ? 1 : 0);
  player.vx = want * RUN_SPEED + (player.boostVx || 0);
  if (want !== 0) { player.facing = want; player.walk += dt; }

  // ---- jumping, with two secret kindnesses: ----
  // coyote time (you can jump a split second AFTER walking off a ledge)
  // and jump buffering (pressing jump a split second EARLY still works)
  player.coyote = player.onGround ? 0.1 : player.coyote - dt;
  const jumpPressed = heldJump() && !jumpWasHeld;
  jumpWasHeld = heldJump();
  player.buffer = jumpPressed ? 0.12 : player.buffer - dt;
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP_POWER;
    player.coyote = 0;
    player.buffer = 0;
    jumpSound();
    // every jump is powered by a proud little toot
    for (let i = 0; i < 8; i++) {
      puffs.push({ x: player.x + player.w / 2 + (Math.random() - 0.5) * 20,
                   y: player.y + player.h,
                   vx: (Math.random() - 0.5) * 80, vy: 40 + Math.random() * 60,
                   r: 6 + Math.random() * 6, life: 1 });
    }
  }
  // letting go of jump early cuts the jump short — that's how you
  // do small hops AND big leaps with one button
  if (!heldJump() && player.vy < -300) player.vy = -300;

  // ---- moving platforms glide along their invisible rails ----
  for (const p of platforms) {
    const len = Math.hypot(p.bx - p.ax, p.by - p.ay) || 1;
    p.t += p.dir * (75 / len) * dt;
    if (p.t > 1) { p.t = 1; p.dir = -1; }
    if (p.t < 0) { p.t = 0; p.dir = 1; }
    const nx = p.ax + (p.bx - p.ax) * p.t;
    const ny = p.ay + (p.by - p.ay) * p.t;
    p.dx = nx - p.x; p.dy = ny - p.y;
    p.x = nx; p.y = ny;
  }
  // if you were standing on one, it carries you with it
  if (player.ride) {
    player.x += player.ride.dx;
    player.y += player.ride.dy;
  }
  player.ride = null;

  // ---- crumbling blocks: shake... shake... GONE. then they regrow ----
  for (const c of crumbles) {
    if (c.shake > 0) {
      c.shake -= dt;
      if (c.shake <= 0) { c.falling = true; beep(90, 0.2, 'triangle', 0.15); }
    } else if (c.falling) {
      c.vy += GRAVITY * dt;
      c.y += c.vy * dt;
      if (c.y > levelBottom + 400) { c.falling = false; c.gone = true; c.respawn = 3; }
    } else if (c.gone) {
      c.respawn -= dt;
      // don't regrow inside the player — that would be rude
      if (c.respawn <= 0 &&
          !overlaps(player, { x: c.ox, y: c.oy, w: c.w, h: c.h })) {
        c.gone = false;
        c.x = c.ox; c.y = c.oy; c.vy = 0;
      }
    }
  }

  // ---- gravity, then collide with the world one axis at a time ----
  let colliders = solids;
  if (platforms.length || crumbles.length) {
    colliders = solids.concat(platforms);
    for (const c of crumbles) if (!c.falling && !c.gone) colliders.push(c);
  }
  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  for (const s of colliders) {
    if (!overlaps(player, s)) continue;
    if (player.vx > 0) player.x = s.x - player.w;
    else if (player.vx < 0) player.x = s.x + s.w;
  }
  player.x = Math.max(0, Math.min(worldW - player.w, player.x));

  player.y += player.vy * dt;
  player.onGround = false;
  for (const s of colliders) {
    if (!overlaps(player, s)) continue;
    if (player.vy > 0) {
      player.y = s.y - player.h; player.vy = 0; player.onGround = true;
      if (s.dx !== undefined) player.ride = s;   // platforms remember their rider
      if (s.crumble && s.shake <= 0 && !s.falling) {
        s.shake = 0.7;                           // the countdown begins
        beep(150, 0.07, 'square', 0.1);
      }
    } else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
  }
  // touching down anywhere ends a mushroom-fling
  if (player.onGround) player.boostVx = 0;

  // ---- bouncy mushrooms: land on one and it FLINGS you where the
  // builder aimed. The math figures out the exact arc to get there. ----
  for (const b of bouncers) {
    if (b.anim > 0) b.anim -= dt;
    if (player.vy < -10 || !overlaps(player, b)) continue;
    const x0 = player.x + player.w / 2, y0 = b.y;
    // rise high enough to clear the target, plus a bit of style
    const rise = Math.max(0, y0 - b.ty) + 130;
    const vy = -Math.sqrt(2 * GRAVITY * rise);
    const t1 = -vy / GRAVITY;                        // time going up
    const drop = rise + (b.ty - y0);                 // fall after the top
    const t2 = Math.sqrt(2 * Math.max(10, drop) / GRAVITY);
    const T = Math.max(0.25, t1 + t2);               // whole flight time
    player.vy = vy;
    player.boostVx = (b.tx - x0) / T;
    player.y = b.y - player.h;
    b.anim = 0.3;
    boingSound();
  }

  // remember the last spot of REAL ground for coming back after a fall —
  // a moving platform doesn't count (it wanders over pits), and neither
  // does a crumbling block (it is, by definition, not to be trusted)
  let onCrumble = false;
  for (const c of crumbles) {
    if (!c.falling && !c.gone && c.shake > 0 &&
        Math.abs(player.y + player.h - c.y) < 4 &&
        player.x + player.w > c.x && player.x < c.x + c.w) onCrumble = true;
  }
  if (player.onGround && !player.ride && !onCrumble) {
    lastSafe = { x: player.x, y: player.y - 10 };
  }

  // ---- spikes are pointy. do not touch the pointy. ----
  if (player.invuln <= 0) {
    for (const sp of spikes) {
      if (overlaps(player, sp)) { player.vy = -500; hurt(false); break; }
    }
  }

  // ---- falling into a pit ----
  if (player.y > levelBottom + 400) hurt(true);

  if (player.invuln > 0) player.invuln -= dt;

  // a gentle puff-trail while scooting along the ground
  puffTimer -= dt;
  if (player.onGround && player.vx !== 0 && puffTimer <= 0) {
    puffTimer = 0.12;
    puffs.push({ x: player.x + player.w / 2 - player.facing * 14,
                 y: player.y + player.h - 8,
                 vx: -player.facing * 30, vy: -10 - Math.random() * 20,
                 r: 4 + Math.random() * 4, life: 0.8 });
  }
  for (const p of puffs) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy -= 30 * dt;                     // puffs drift upward. obviously.
    p.life -= dt * 1.4;
  }
  puffs = puffs.filter(p => p.life > 0);

  // ---- coins ----
  for (const c of coins) {
    if (c.taken) continue;
    if (Math.abs(player.x + player.w / 2 - c.x) < 34 &&
        Math.abs(player.y + player.h / 2 - c.y) < 40) {
      c.taken = true;
      coinCount++;
      coinSound();
    }
  }

  // ---- baddies ----
  for (const b of baddies) {
    if (b.squish > 0) { b.squish -= dt; continue; }
    b.x += b.dir * 70 * dt;
    // a sniffer turns around at walls and at the edge of a cliff —
    // it pokes one toe ahead and checks: is there floor under it?
    const aheadX = b.dir > 0 ? b.x + b.w + 2 : b.x - 2;
    let wall = false, floorAhead = false;
    for (const s of solids) {
      if (aheadX > s.x && aheadX < s.x + s.w) {
        if (b.y + b.h > s.y && b.y < s.y + s.h) wall = true;
        if (Math.abs(s.y - (b.y + b.h)) < 8) floorAhead = true;
      }
    }
    if (wall || !floorAhead) { b.dir *= -1; b.x += b.dir * 2; }
    if (!overlaps(player, b)) continue;
    if (player.vy > 150 && player.y + player.h < b.y + b.h * 0.7) {
      // STOMP! squish it and bounce off
      b.squish = 9999;
      player.vy = -JUMP_POWER * 0.55;
      stompSound();
    } else if (player.invuln <= 0) hurt(false);
  }

  // ---- flying turds, patrolling the air on tiny proud wings ----
  for (const b of turds) {
    if (b.squish > 0) { b.squish -= dt; continue; }
    b.x += b.dir * 90 * dt;
    b.y = b.baseY + Math.sin(elapsed * 3 + b.phase) * 22;
    if (b.x < b.minX) { b.x = b.minX; b.dir = 1; }
    if (b.x + b.w > b.maxX) { b.x = b.maxX - b.w; b.dir = -1; }
    // turn at walls too, so they don't fly through your architecture
    const aheadX = b.dir > 0 ? b.x + b.w + 2 : b.x - 2;
    for (const s of solids) {
      if (aheadX > s.x && aheadX < s.x + s.w &&
          b.y + b.h > s.y && b.y < s.y + s.h) { b.dir *= -1; break; }
    }
    if (!overlaps(player, b)) continue;
    if (player.vy > 150 && player.y + player.h < b.y + b.h * 0.7) {
      b.squish = 9999;
      player.vy = -JUMP_POWER * 0.55;
      splatSound();
    } else if (player.invuln <= 0) hurt(false);
  }

  // ---- the flag ----
  if (Math.abs(player.x - FLAG.x) < 40 && player.y > FLAG.y - 300) {
    won = true;
    winSound();
  }

  // ---- camera follows, but never shows past the edges ----
  camX = Math.max(0, Math.min(Math.max(0, worldW - canvas.width),
                              player.x - canvas.width * 0.38));
}

function hurt(fell) {
  hearts--;
  hurtSound();
  if (hearts <= 0) { resetLevel(); return; }
  if (fell) {
    // put you back on the last solid ground you stood on
    player.x = lastSafe.x;
    player.y = lastSafe.y;
    player.vy = 0;
  }
  player.invuln = 1.5;
}

// ---------------------------------------------------------------------
// DRAWING — bright cartoon world, blocky and cheerful
// ---------------------------------------------------------------------
function draw() {
  if (mode === 'build') { drawEditor(); return; }
  const W = canvas.width, H = canvas.height;
  uiRects = [];

  // deep-cave gloom, lighter near the floor where the crystals glow
  const cave = ctx.createLinearGradient(0, 0, 0, H);
  cave.addColorStop(0, '#0f0b09');
  cave.addColorStop(1, '#2b2119');
  ctx.fillStyle = cave;
  ctx.fillRect(0, 0, W, H);

  // faraway rock humps slide slower than the world — that's "parallax",
  // and it's what makes flat drawings feel deep.
  // (the +span %span dance keeps them wrapping around forever)
  ctx.fillStyle = '#211a15';
  const hillSpan = 700 * 10;
  for (let i = 0; i < 12; i++) {
    const hx = ((i * 700 - camX * 0.3) % hillSpan + hillSpan) % hillSpan - 200;
    ctx.beginPath();
    ctx.arc(hx, H - 8, 120 + (i % 3) * 40, Math.PI, 0);
    ctx.fill();
  }
  // stalactites hang from the cave roof, drifting at their own pace
  ctx.fillStyle = '#241d18';
  const stalSpan = 160 * 30;
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 160 - camX * 0.45) % stalSpan + stalSpan) % stalSpan - 80;
    const len = 40 + ((i * 37) % 70);
    ctx.beginPath();
    ctx.moveTo(sx - 22, 0);
    ctx.lineTo(sx + 22, 0);
    ctx.lineTo(sx, len);
    ctx.fill();
  }
  // glowing crystals stud the walls — the cave's night-lights
  const crysSpan = 500 * 12;
  for (let i = 0; i < 12; i++) {
    const cxx = ((i * 500 + 200 - camX * 0.55) % crysSpan + crysSpan) % crysSpan - 100;
    const cy = H * 0.25 + ((i * 53) % 100) / 100 * H * 0.4;
    const col = ['125, 211, 255', '180, 130, 255', '125, 223, 143'][i % 3];
    const g = ctx.createRadialGradient(cxx, cy, 2, cxx, cy, 60);
    g.addColorStop(0, `rgba(${col}, 0.5)`);
    g.addColorStop(1, `rgba(${col}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(cxx - 60, cy - 60, 120, 120);
    ctx.fillStyle = `rgba(${col}, 0.9)`;
    ctx.beginPath();
    ctx.moveTo(cxx, cy - 10); ctx.lineTo(cxx + 7, cy);
    ctx.lineTo(cxx, cy + 10); ctx.lineTo(cxx - 7, cy);
    ctx.fill();
  }

  ctx.save();
  // the camera keeps the level floor at the bottom of any screen,
  // but rises with you if you climb a tall home-made tower
  const camY = Math.min(levelBottom - H, player.y - H * 0.35);
  ctx.translate(-camX, -camY);

  // solid blocks: grassy tops on ground, bricks in the sky
  for (const s of solids) {
    if (s.x + s.w < camX - 50 || s.x > camX + W + 50) continue;
    if (s.y === FLOOR) {
      ctx.fillStyle = '#3d362f';                       // cave rock
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#4f7a4a';                       // glowing moss lid
      ctx.fillRect(s.x, s.y, s.w, 14);
      ctx.fillStyle = 'rgba(160, 255, 150, 0.25)';     // the moss's shine
      ctx.fillRect(s.x, s.y, s.w, 4);
    } else {
      ctx.fillStyle = '#544b42';                       // stone shelf
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      for (let bx = s.x; bx < s.x + s.w; bx += TILE) {
        ctx.strokeRect(bx, s.y, Math.min(TILE, s.x + s.w - bx), s.h);
      }
    }
  }

  // spikes — the pointy furniture of ambitious builders
  for (const sp of spikes) {
    drawSpikeCell(sp.x - 4, sp.y - TILE * 0.45);
  }
  // crumbling blocks: intact, shaking nervously, or tumbling away
  for (const c of crumbles) {
    if (c.gone) continue;
    if (c.falling) ctx.globalAlpha = 0.7;
    drawCrumbleCell(c.x, c.y, c.shake > 0);
    ctx.globalAlpha = 1;
  }
  // bouncy mushrooms, ready to fling
  for (const b of bouncers) {
    drawBouncePad(b.x, b.y, b.anim);
  }
  // gliding platforms, each with a faint dotted rail showing its path
  for (const p of platforms) {
    ctx.strokeStyle = 'rgba(125, 211, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(p.ax + TILE, p.ay + 8);
    ctx.lineTo(p.bx + TILE, p.by + 8);
    ctx.stroke();
    ctx.setLineDash([]);
    drawPlatformSlab(p.x, p.y);
  }

  // beans — fart fuel, gently bobbing where jumping is worth it
  for (const c of coins) {
    if (c.taken) continue;
    const bob = Math.sin(elapsed * 3 + c.x) * 4;
    ctx.fillStyle = '#b5651d';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + bob, 12, 8, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#d98c3f';                          // the bean's shine
    ctx.beginPath();
    ctx.ellipse(c.x - 3, c.y + bob - 3, 4, 2.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // THE SNIFFERS — walking noses that want to sniff you right up.
  // bounce on one and it honks.
  for (const b of baddies) {
    if (b.squish > 0) continue;
    const sniff = 1 + Math.sin(elapsed * 6 + b.x) * 0.06;   // sniffing pulse
    ctx.fillStyle = '#e8a4a4';
    ctx.beginPath();                                    // the nose itself
    ctx.moveTo(b.x + 4, b.y + b.h - 8);
    ctx.lineTo(b.x + b.w / 2, b.y + 2 - 6 * (sniff - 1) * 10);
    ctx.lineTo(b.x + b.w - 4, b.y + b.h - 8);
    ctx.quadraticCurveTo(b.x + b.w / 2, b.y + b.h + 6, b.x + 4, b.y + b.h - 8);
    ctx.fill();
    ctx.fillStyle = '#7a3a3a';                          // nostrils, hunting you
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2 - 8 + b.dir * 3, b.y + b.h - 14, 4, 6 * sniff, 0, 0, Math.PI * 2);
    ctx.ellipse(b.x + b.w / 2 + 8 + b.dir * 3, b.y + b.h - 14, 4, 6 * sniff, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a2a2a';                          // sneaky little feet
    ctx.fillRect(b.x + 4, b.y + b.h - 4, 10, 4);
    ctx.fillRect(b.x + b.w - 14, b.y + b.h - 4, 10, 4);
  }

  // the flying turds, in all their winged glory
  for (const b of turds) {
    if (b.squish > 0) continue;
    drawTurd(b.x, b.y, elapsed + b.phase);
  }

  // the way out — a crack of DAYLIGHT in the cave wall
  const shine = 0.7 + Math.sin(elapsed * 2) * 0.2;
  const day = ctx.createLinearGradient(FLAG.x - 40, 0, FLAG.x + 60, 0);
  day.addColorStop(0, 'rgba(255, 250, 200, 0)');
  day.addColorStop(0.5, `rgba(255, 250, 200, ${0.35 * shine})`);
  day.addColorStop(1, 'rgba(255, 250, 200, 0)');
  ctx.fillStyle = day;
  ctx.fillRect(FLAG.x - 40, FLAG.y - 400, 100, 400);
  ctx.fillStyle = `rgba(255, 252, 230, ${shine})`;      // the crack itself
  ctx.beginPath();
  ctx.moveTo(FLAG.x, FLAG.y);
  ctx.lineTo(FLAG.x + 14, FLAG.y - 150);
  ctx.lineTo(FLAG.x + 4, FLAG.y - 290);
  ctx.lineTo(FLAG.x + 34, FLAG.y - 160);
  ctx.lineTo(FLAG.x + 22, FLAG.y);
  ctx.fill();

  // the toot-trail puffs, fading as they rise
  for (const p of puffs) {
    ctx.fillStyle = `rgba(150, 230, 120, ${p.life * 0.4})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (2 - p.life), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- THE HERO — a small green fart with big dreams ----
  if (player.invuln <= 0 || Math.floor(elapsed * 10) % 2 === 0) {
    const px = player.x + player.w / 2, py = player.y + player.h / 2;
    // the cloud: overlapping blobs that each wobble on their own beat
    const blobs = [[0, -8, 17], [13, 2, 13], [-13, 2, 13], [0, 8, 15], [7, -12, 10], [-8, -13, 9]];
    ctx.fillStyle = 'rgba(140, 220, 110, 0.92)';
    ctx.beginPath();
    for (const [ox, oy, r] of blobs) {
      const wob = r * (1 + Math.sin(elapsed * 6 + ox + oy) * 0.1);
      ctx.moveTo(px + ox + wob, py + oy);
      ctx.arc(px + ox, py + oy, wob, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(190, 245, 160, 0.8)';         // lighter core
    ctx.beginPath();
    ctx.arc(px, py - 2, 10, 0, Math.PI * 2);
    ctx.fill();
    // stink lines rising proudly off the top
    ctx.strokeStyle = 'rgba(170, 230, 140, 0.5)';
    ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(px + i * 9, py - 22);
      ctx.quadraticCurveTo(px + i * 9 + Math.sin(elapsed * 5 + i) * 5, py - 32,
                           px + i * 9, py - 42);
      ctx.stroke();
    }
    // the cheeky face
    const look = player.facing * 4;
    ctx.fillStyle = '#183a10';
    ctx.beginPath();
    ctx.arc(px - 6 + look, py - 6, 3.2, 0, Math.PI * 2);
    ctx.arc(px + 6 + look, py - 6, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#183a10';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(px + look, py + 3, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  ctx.restore();

  // the cave is DARK — the fart glows, and lights his own way.
  const hx = player.x + player.w / 2 - camX;
  const hy = player.y + player.h / 2 - camY;
  const dark = ctx.createRadialGradient(hx, hy, 90, hx, hy, Math.max(W, H) * 0.65);
  dark.addColorStop(0, 'rgba(8, 5, 3, 0)');
  dark.addColorStop(1, 'rgba(8, 5, 3, 0.62)');
  ctx.fillStyle = dark;
  ctx.fillRect(0, 0, W, H);

  // ---- HUD ----
  ctx.textAlign = 'left';
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 4;
  const hud = '❤'.repeat(hearts) + '   beans: ' + coinCount +
              (playingCustom ? '   (your level!)' : '');
  ctx.strokeText(hud, 16, 36);
  ctx.fillText(hud, 16, 36);

  // the door to the level builder, always one tap away
  uiRects.push({ x: W - 122, y: 10, w: 110, h: 40, id: 'build' });
  ctx.fillStyle = 'rgba(255, 210, 63, 0.15)';
  ctx.fillRect(W - 122, 10, 110, 40);
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 2;
  ctx.strokeRect(W - 122, 10, 110, 40);
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('🔨 BUILD', W - 112, 36);

  // touch controls, only drawn where fingers go
  if ('ontouchstart' in window) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('◀', W * 0.08, H - 40);
    ctx.fillText('▶', W * 0.36, H - 40);
    ctx.textAlign = 'right';
    ctx.fillText('⤴ JUMP', W - 30, H - 40);
    ctx.textAlign = 'left';
  }

  if (won) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = `bold ${Math.min(54, W / 12)}px monospace`;
    ctx.fillText('YOU ESCAPED THE CAVE!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText(playingCustom ? 'YOUR level. YOUR victory. Nice building.'
                               : 'the fart is FREE. smell ya later, cave.', W / 2, H / 2 + 24);
    ctx.fillText('beans: ' + coinCount + ' / ' + Math.max(1, specCoins.length) +
                 '  —  space or tap to play again', W / 2, H / 2 + 56);
  }
}

// ---------------------------------------------------------------------
// THE BUILDER SCREEN — a grid, your placed pieces, and a toolbar.
// Tap a tool, then tap (or drag) on the world to place things.
// ---------------------------------------------------------------------
const TOOLS = [
  ['ground', 'GROUND'], ['bean', 'BEAN'], ['nose', 'NOSE'],
  ['turd', 'TURD'], ['spike', 'SPIKE'], ['crumble', 'CRUMBLE'],
  ['plat', 'PLATFORM'], ['bounce', 'BOUNCY'],
  ['start', 'START'], ['exit', 'EXIT'], ['erase', 'ERASE'], ['pan', 'PAN'],
];

// spikes look the same in the builder and in the game — draw them once
function drawSpikeCell(x, y) {
  ctx.fillStyle = '#8a8378';
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const sx = x + 4 + i * 13;
    ctx.moveTo(sx, y + TILE);
    ctx.lineTo(sx + 6.5, y + TILE * 0.2);
    ctx.lineTo(sx + 13, y + TILE);
  }
  ctx.fill();
  ctx.fillStyle = '#d8d2c8';                          // gleaming tips
  for (let i = 0; i < 3; i++) {
    const sx = x + 4 + i * 13;
    ctx.fillRect(sx + 4.5, y + TILE * 0.2, 4, 8);
  }
}

// a flying turd: the classic three-tier swirl, plus tiny flapping
// wings, because dignity was never an option
function drawTurd(x, y, flap) {
  const cx = x + 20;
  // the wings — two white ovals beating fast
  const beat = Math.sin(flap * 30) * 0.5 + 0.6;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.ellipse(cx - 20, y + 8, 12, 6 * beat, -0.5, 0, Math.PI * 2);
  ctx.ellipse(cx + 20, y + 8, 12, 6 * beat, 0.5, 0, Math.PI * 2);
  ctx.fill();
  // the swirl: wide, medium, curl
  ctx.fillStyle = '#7a4a21';
  ctx.beginPath();
  ctx.ellipse(cx, y + 24, 19, 9, 0, 0, Math.PI * 2);
  ctx.ellipse(cx, y + 14, 14, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + 2, y + 5, 9, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#8f5a2b';                           // the proud tip
  ctx.beginPath();
  ctx.ellipse(cx + 6, y - 1, 4, 3, 0.6, 0, Math.PI * 2);
  ctx.fill();
  // cheerful menacing eyes
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx - 6, y + 13, 4, 0, Math.PI * 2);
  ctx.arc(cx + 6, y + 13, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(cx - 5, y + 14, 1.8, 0, Math.PI * 2);
  ctx.arc(cx + 7, y + 14, 1.8, 0, Math.PI * 2);
  ctx.fill();
}

// a bouncy mushroom: springy teal cap, glowing spots, endless optimism
function drawBouncePad(x, y, anim) {
  const squash = anim > 0 ? 1 - anim * 1.6 : 1;      // squishes when boinged
  const cx = x + 20;
  ctx.fillStyle = '#c9b896';                          // the stem
  ctx.fillRect(cx - 6, y + 8, 12, 12);
  ctx.fillStyle = '#3fb8af';                          // the springy cap
  ctx.beginPath();
  ctx.ellipse(cx, y + 8, 22, 14 * Math.max(0.4, squash), 0, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = 'rgba(200, 255, 250, 0.9)';         // glowing spots
  ctx.beginPath();
  ctx.arc(cx - 9, y + 2, 3, 0, Math.PI * 2);
  ctx.arc(cx + 7, y - 1, 2.5, 0, Math.PI * 2);
  ctx.arc(cx + 1, y + 4, 2, 0, Math.PI * 2);
  ctx.fill();
}

// a crumbling block: pale, cracked, clearly having a hard time
function drawCrumbleCell(x, y, wobble) {
  const jx = wobble ? (Math.random() - 0.5) * 4 : 0;
  const jy = wobble ? (Math.random() - 0.5) * 4 : 0;
  ctx.fillStyle = '#6a6055';
  ctx.fillRect(x + jx, y + jy, TILE, TILE);
  ctx.strokeStyle = 'rgba(30, 24, 18, 0.7)';         // the worrying cracks
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + jx + 8, y + jy + 4);
  ctx.lineTo(x + jx + 20, y + jy + 20);
  ctx.lineTo(x + jx + 12, y + jy + 40);
  ctx.moveTo(x + jx + 34, y + jy + 6);
  ctx.lineTo(x + jx + 26, y + jy + 26);
  ctx.lineTo(x + jx + 38, y + jy + 42);
  ctx.stroke();
}

// a gliding platform: a mossy slab with faintly glowing crystal ends
function drawPlatformSlab(x, y) {
  ctx.fillStyle = '#544b42';
  ctx.fillRect(x, y, TILE * 2, 16);
  ctx.fillStyle = '#4f7a4a';
  ctx.fillRect(x, y, TILE * 2, 5);
  ctx.fillStyle = 'rgba(125, 211, 255, 0.8)';
  ctx.fillRect(x, y, 5, 16);
  ctx.fillRect(x + TILE * 2 - 5, y, 5, 16);
}

function drawEditor() {
  const W = canvas.width, H = canvas.height;
  uiRects = [];

  // arrow keys pan too, for keyboard builders
  if (keys['arrowleft'] || keys['a']) editCamX -= 10;
  if (keys['arrowright'] || keys['d']) editCamX += 10;
  if (keys['arrowup'] || keys['w']) editCamY -= 10;
  if (keys['arrowdown'] || keys['s']) editCamY += 10;

  ctx.fillStyle = '#1d1712';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-editCamX, -editCamY);

  // the grid — faint lines showing every placeable cell
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
  ctx.lineWidth = 1;
  const gx0 = Math.floor(editCamX / TILE) * TILE;
  const gy0 = Math.floor(editCamY / TILE) * TILE;
  for (let gx = gx0; gx < editCamX + W + TILE; gx += TILE) {
    ctx.beginPath(); ctx.moveTo(gx, editCamY); ctx.lineTo(gx, editCamY + H); ctx.stroke();
  }
  for (let gy = gy0; gy < editCamY + H + TILE; gy += TILE) {
    ctx.beginPath(); ctx.moveTo(editCamX, gy); ctx.lineTo(editCamX + W, gy); ctx.stroke();
  }

  // everything you've placed so far
  for (const key of edit.tiles) {
    const [cx, cy] = key.split(',').map(Number);
    const x = cx * TILE, y = cy * TILE;
    if (x < editCamX - TILE || x > editCamX + W || y < editCamY - TILE || y > editCamY + H) continue;
    ctx.fillStyle = '#3d362f';
    ctx.fillRect(x, y, TILE, TILE);
    if (!edit.tiles.has(cx + ',' + (cy - 1))) {
      ctx.fillStyle = '#4f7a4a';
      ctx.fillRect(x, y, TILE, 12);
    }
  }
  for (const key of edit.beans) {
    const [cx, cy] = key.split(',').map(Number);
    ctx.fillStyle = '#b5651d';
    ctx.beginPath();
    ctx.ellipse(cx * TILE + TILE / 2, cy * TILE + TILE / 2, 12, 8, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const key of edit.sniffers) {
    const [cx, cy] = key.split(',').map(Number);
    const x = cx * TILE + 3, y = cy * TILE + TILE - 40;
    ctx.fillStyle = '#e8a4a4';
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 32);
    ctx.lineTo(x + 20, y + 2);
    ctx.lineTo(x + 36, y + 32);
    ctx.quadraticCurveTo(x + 20, y + 46, x + 4, y + 32);
    ctx.fill();
  }
  for (const key of edit.spikes) {
    const [cx, cy] = key.split(',').map(Number);
    drawSpikeCell(cx * TILE, cy * TILE);
  }
  for (const key of edit.turds) {
    const [cx, cy] = key.split(',').map(Number);
    drawTurd(cx * TILE + 3, cy * TILE + 6, 0.02);
  }
  for (const key of edit.crumbles) {
    const [cx, cy] = key.split(',').map(Number);
    drawCrumbleCell(cx * TILE, cy * TILE, false);
  }
  for (const b of edit.bouncers) {
    drawBouncePad(b.a[0] * TILE + 3, b.a[1] * TILE + 26, 0);
    // the golden aim-line: this is where it flings you
    ctx.strokeStyle = 'rgba(255, 210, 63, 0.5)';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(b.a[0] * TILE + TILE / 2, b.a[1] * TILE + 26);
    ctx.lineTo(b.b[0] * TILE + TILE / 2, b.b[1] * TILE + TILE / 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(b.b[0] * TILE + TILE / 2, b.b[1] * TILE + TILE / 2, 14, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const p of edit.platforms) {
    ctx.strokeStyle = 'rgba(125, 211, 255, 0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(p.a[0] * TILE + TILE, p.a[1] * TILE + 8);
    ctx.lineTo(p.b[0] * TILE + TILE, p.b[1] * TILE + 8);
    ctx.stroke();
    ctx.setLineDash([]);
    drawPlatformSlab(p.a[0] * TILE, p.a[1] * TILE);
    ctx.globalAlpha = 0.35;                          // the ghost of where it goes
    drawPlatformSlab(p.b[0] * TILE, p.b[1] * TILE);
    ctx.globalAlpha = 1;
  }
  // a platform (or mushroom) waiting for its second tap
  if (pendingPlat) {
    if (tool === 'bounce') drawBouncePad(pendingPlat[0] * TILE + 3, pendingPlat[1] * TILE + 26, 0);
    else drawPlatformSlab(pendingPlat[0] * TILE, pendingPlat[1] * TILE);
    if (hoverPt) {
      ctx.strokeStyle = 'rgba(255, 210, 63, 0.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 8]);
      ctx.beginPath();
      ctx.moveTo(pendingPlat[0] * TILE + TILE, pendingPlat[1] * TILE + 8);
      ctx.lineTo(hoverPt.x + editCamX, hoverPt.y + editCamY);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // the start marker: a little ghost of the hero himself
  const stx = edit.start[0] * TILE + TILE / 2, sty = edit.start[1] * TILE + TILE / 2;
  ctx.fillStyle = 'rgba(140, 220, 110, 0.75)';
  ctx.beginPath(); ctx.arc(stx, sty, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#183a10';
  ctx.beginPath();
  ctx.arc(stx - 5, sty - 3, 2.5, 0, Math.PI * 2);
  ctx.arc(stx + 5, sty - 3, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // the exit marker: the crack of daylight
  const exx = edit.exit[0] * TILE + TILE / 2, exy = (edit.exit[1] + 1) * TILE;
  ctx.fillStyle = 'rgba(255, 252, 230, 0.9)';
  ctx.beginPath();
  ctx.moveTo(exx - 8, exy); ctx.lineTo(exx, exy - 80);
  ctx.lineTo(exx + 8, exy); ctx.fill();

  // a ghost square under your pointer, so you can aim
  if (hoverPt && hoverPt.y > 96 && tool !== 'pan') {
    const hcx = Math.floor((hoverPt.x + editCamX) / TILE);
    const hcy = Math.floor((hoverPt.y + editCamY) / TILE);
    ctx.strokeStyle = 'rgba(255, 210, 63, 0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(hcx * TILE, hcy * TILE, TILE, TILE);
  }
  ctx.restore();

  // ---- the toolbar ----
  ctx.fillStyle = 'rgba(10, 7, 5, 0.85)';
  ctx.fillRect(0, 0, W, 96);
  let bx = 8, by = 8;
  const all = TOOLS.concat([['test', '▶ TEST'], ['story', 'STORY']]);
  for (const [id, label] of all) {
    const bw = Math.max(64, label.length * 11 + 20);
    if (bx + bw > W - 8) { bx = 8; by += 42; }
    uiRects.push({ x: bx, y: by, w: bw, h: 38, id });
    const active = tool === id;
    ctx.fillStyle = id === 'test' ? 'rgba(125, 223, 143, 0.2)'
                  : active ? 'rgba(255, 210, 63, 0.25)' : 'rgba(255, 255, 255, 0.07)';
    ctx.fillRect(bx, by, bw, 38);
    ctx.strokeStyle = id === 'test' ? '#7ddf8f' : active ? '#ffd23f' : '#5a5450';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, 38);
    ctx.fillStyle = id === 'test' ? '#7ddf8f' : active ? '#ffd23f' : '#c8c0b8';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, bx + bw / 2, by + 25);
    bx += bw + 8;
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '13px monospace';
  ctx.fillText(tool === 'plat'
    ? (pendingPlat ? 'now tap where it should glide TO — the platform will ride back and forth forever'
                   : 'tap once where the platform STARTS...')
    : tool === 'bounce'
    ? (pendingPlat ? 'now tap where it should FLING you — any distance, any direction'
                   : 'tap once to plant the bouncy mushroom...')
    : 'tap or drag to place — swipe with TWO fingers (or right-drag, or arrow keys) to look around — everything saves itself',
               10, by + 60 > 90 ? by + 52 : 88);
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.03, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
