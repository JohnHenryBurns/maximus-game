<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>A FART IN A CAVE</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #171310; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
// A FART IN A CAVE — a 2D side-scroller. You are a small green fart,
// deep underground, and you want OUT. Run right. Toot over the pits.
// Bounce on the SNIFFERS (walking noses that want to sniff you up).
// Eat the beans (fuel). Reach the shaft of daylight and be FREE.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND — boops and bings, cooked from pure math
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.1, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
// THE FART SOUND — a low sawtooth sliding downward, with a fast
// wobble on the volume. That wobble is the secret: it's the flutter.
function fart(len, base) {
  if (!audio) return;
  const t = audio.currentTime;
  const o = audio.createOscillator(), g = audio.createGain();
  const lfo = audio.createOscillator(), lg = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base * 0.55, t + len);
  lfo.type = 'square';
  lfo.frequency.value = 26;
  lg.gain.value = 0.06;
  lfo.connect(lg); lg.connect(g.gain);
  g.gain.setValueAtTime(0.13, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(g); g.connect(audio.destination);
  o.start(t); o.stop(t + len + 0.05);
  lfo.start(t); lfo.stop(t + len + 0.05);
}
function jumpSound() { fart(0.22, 120 + Math.random() * 40); }
function coinSound() { beep(700, 0.06, 'square', 0.08); setTimeout(() => beep(1100, 0.15, 'square', 0.08), 50); }
function stompSound() { beep(520, 0.08, 'triangle', 0.15); setTimeout(() => beep(290, 0.14, 'triangle', 0.15), 60); }  // HONK
function hurtSound() { fart(0.7, 90); }               // the long, sad pffffft
function winSound() { [110, 145, 185, 235, 300].forEach((n, i) => setTimeout(() => fart(0.3, n), i * 200)); }

// ---------------------------------------------------------------------
// THE LEVEL — built from solid blocks. x, y, w, h are in world pixels.
// The ground has GAPS in it — that's what the jumping is for.
// ---------------------------------------------------------------------
const TILE = 46;                    // one block is this many pixels
const WORLD_W = 6400;
const FLOOR = 640;                  // where the main ground level sits

// ground pieces (the gaps between them are pits!)
const solids = [
  { x: 0,    y: FLOOR, w: 1200, h: 200 },
  { x: 1340, y: FLOOR, w: 800,  h: 200 },
  { x: 2280, y: FLOOR, w: 620,  h: 200 },
  { x: 3080, y: FLOOR, w: 1000, h: 200 },
  { x: 4260, y: FLOOR, w: 700,  h: 200 },
  { x: 5100, y: FLOOR, w: 1300, h: 200 },
  // floating platforms — brick shelves in the sky
  { x: 500,  y: FLOOR - 150, w: 3 * TILE, h: 40 },
  { x: 800,  y: FLOOR - 260, w: 3 * TILE, h: 40 },
  { x: 1450, y: FLOOR - 170, w: 4 * TILE, h: 40 },
  { x: 1800, y: FLOOR - 300, w: 3 * TILE, h: 40 },
  { x: 2400, y: FLOOR - 180, w: 3 * TILE, h: 40 },
  { x: 2650, y: FLOOR - 320, w: 3 * TILE, h: 40 },
  { x: 3300, y: FLOOR - 160, w: 4 * TILE, h: 40 },
  { x: 3700, y: FLOOR - 280, w: 3 * TILE, h: 40 },
  { x: 4400, y: FLOOR - 170, w: 3 * TILE, h: 40 },
  { x: 4700, y: FLOOR - 300, w: 4 * TILE, h: 40 },
  { x: 5400, y: FLOOR - 180, w: 3 * TILE, h: 40 },
  // stair blocks near the end, like the classic finale
  { x: 5750, y: FLOOR - TILE, w: TILE * 4, h: TILE },
  { x: 5796, y: FLOOR - TILE * 2, w: TILE * 3, h: TILE * 2 },
  { x: 5842, y: FLOOR - TILE * 3, w: TILE * 2, h: TILE * 3 },
];

// coins float where jumping is worth it
const COIN_SPOTS = [
  [570, FLOOR - 210], [640, FLOOR - 210],
  [870, FLOOR - 320], [940, FLOOR - 320],
  [1270, FLOOR - 120],                      // over the first pit!
  [1520, FLOOR - 230], [1590, FLOOR - 230],
  [1870, FLOOR - 360],
  [2210, FLOOR - 130],                      // over the second pit
  [2470, FLOOR - 240], [2720, FLOOR - 380],
  [2990, FLOOR - 140],                      // over the third pit
  [3380, FLOOR - 220], [3450, FLOOR - 220],
  [3770, FLOOR - 340],
  [4170, FLOOR - 130],                      // over the fourth pit
  [4470, FLOOR - 230],
  [4790, FLOOR - 360], [4860, FLOOR - 360],
  [5030, FLOOR - 130],                      // the last pit
  [5470, FLOOR - 240],
];

// walking baddies: [startX, leftEdge, rightEdge] of their patrol
const BADDIE_SPOTS = [
  [700, 480, 1150],
  [1600, 1360, 2100],
  [2500, 2300, 2860],
  [3400, 3100, 4040],
  [3800, 3100, 4040],
  [4500, 4280, 4920],
  [5300, 5120, 5700],
];

const FLAG = { x: 6100, y: FLOOR };

// ---------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------
const player = {
  x: 100, y: FLOOR - 60, w: 34, h: 52,
  vx: 0, vy: 0,
  onGround: false,
  facing: 1,
  coyote: 0,        // grace time to jump just after leaving a ledge
  buffer: 0,        // grace time when jump is pressed just before landing
  invuln: 0,        // safety seconds after getting hurt
  walk: 0,
};
let coins = [];
let baddies = [];
let puffs = [];         // the toot-trail
let puffTimer = 0;
let hearts = 3;
let coinCount = 0;
let won = false;
let elapsed = 0;
let camX = 0;

function resetLevel() {
  player.x = 100; player.y = FLOOR - 60;
  player.vx = 0; player.vy = 0;
  player.invuln = 0;
  hearts = 3;
  coinCount = 0;
  won = false;
  coins = COIN_SPOTS.map(c => ({ x: c[0], y: c[1], taken: false }));
  baddies = BADDIE_SPOTS.map(b => ({
    x: b[0], y: FLOOR - 40, w: 40, h: 40,
    min: b[1], max: b[2], dir: 1, squish: 0,
  }));
}
resetLevel();

// ---------------------------------------------------------------------
// INPUT — keyboard for computers, touch buttons for phones
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.key.toLowerCase()] = true;
  if (won && e.key === ' ') resetLevel();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// three big touch zones: ◀ ▶ on the left, JUMP on the right
let touchLeft = false, touchRight = false, touchJump = false;
function readTouches(e) {
  touchLeft = touchRight = touchJump = false;
  for (const t of e.touches) {
    if (t.clientX > canvas.width * 0.55) touchJump = true;
    else if (t.clientX < canvas.width * 0.28) touchLeft = true;
    else touchRight = true;
  }
}
addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (won) { resetLevel(); return; }
  readTouches(e);
}, { passive: false });
addEventListener('touchmove', e => { e.preventDefault(); readTouches(e); }, { passive: false });
addEventListener('touchend', e => { e.preventDefault(); readTouches(e); }, { passive: false });

function heldLeft()  { return keys['arrowleft'] || keys['a'] || touchLeft; }
function heldRight() { return keys['arrowright'] || keys['d'] || touchRight; }
function heldJump()  { return keys[' '] || keys['arrowup'] || keys['w'] || touchJump; }

// ---------------------------------------------------------------------
// PHYSICS — the invisible rules that make jumping feel GOOD
// ---------------------------------------------------------------------
const GRAVITY = 2300;
const RUN_SPEED = 290;
const JUMP_POWER = 860;

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

let jumpWasHeld = false;
function update(dt) {
  elapsed += dt;
  if (won) return;

  // ---- running ----
  const want = (heldRight() ? 1 : 0) - (heldLeft() ? 1 : 0);
  player.vx = want * RUN_SPEED;
  if (want !== 0) { player.facing = want; player.walk += dt; }

  // ---- jumping, with two secret kindnesses: ----
  // coyote time (you can jump a split second AFTER walking off a ledge)
  // and jump buffering (pressing jump a split second EARLY still works)
  player.coyote = player.onGround ? 0.1 : player.coyote - dt;
  const jumpPressed = heldJump() && !jumpWasHeld;
  jumpWasHeld = heldJump();
  player.buffer = jumpPressed ? 0.12 : player.buffer - dt;
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -JUMP_POWER;
    player.coyote = 0;
    player.buffer = 0;
    jumpSound();
    // every jump is powered by a proud little toot
    for (let i = 0; i < 8; i++) {
      puffs.push({ x: player.x + player.w / 2 + (Math.random() - 0.5) * 20,
                   y: player.y + player.h,
                   vx: (Math.random() - 0.5) * 80, vy: 40 + Math.random() * 60,
                   r: 6 + Math.random() * 6, life: 1 });
    }
  }
  // letting go of jump early cuts the jump short — that's how you
  // do small hops AND big leaps with one button
  if (!heldJump() && player.vy < -300) player.vy = -300;

  // ---- gravity, then collide with the world one axis at a time ----
  player.vy += GRAVITY * dt;
  player.x += player.vx * dt;
  for (const s of solids) {
    if (!overlaps(player, s)) continue;
    if (player.vx > 0) player.x = s.x - player.w;
    else if (player.vx < 0) player.x = s.x + s.w;
  }
  player.x = Math.max(0, Math.min(WORLD_W - player.w, player.x));

  player.y += player.vy * dt;
  player.onGround = false;
  for (const s of solids) {
    if (!overlaps(player, s)) continue;
    if (player.vy > 0) { player.y = s.y - player.h; player.vy = 0; player.onGround = true; }
    else if (player.vy < 0) { player.y = s.y + s.h; player.vy = 0; }
  }

  // ---- falling into a pit ----
  if (player.y > FLOOR + 500) hurt(true);

  if (player.invuln > 0) player.invuln -= dt;

  // a gentle puff-trail while scooting along the ground
  puffTimer -= dt;
  if (player.onGround && player.vx !== 0 && puffTimer <= 0) {
    puffTimer = 0.12;
    puffs.push({ x: player.x + player.w / 2 - player.facing * 14,
                 y: player.y + player.h - 8,
                 vx: -player.facing * 30, vy: -10 - Math.random() * 20,
                 r: 4 + Math.random() * 4, life: 0.8 });
  }
  for (const p of puffs) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy -= 30 * dt;                     // puffs drift upward. obviously.
    p.life -= dt * 1.4;
  }
  puffs = puffs.filter(p => p.life > 0);

  // ---- coins ----
  for (const c of coins) {
    if (c.taken) continue;
    if (Math.abs(player.x + player.w / 2 - c.x) < 34 &&
        Math.abs(player.y + player.h / 2 - c.y) < 40) {
      c.taken = true;
      coinCount++;
      coinSound();
    }
  }

  // ---- baddies ----
  for (const b of baddies) {
    if (b.squish > 0) { b.squish -= dt; continue; }
    b.x += b.dir * 70 * dt;
    if (b.x < b.min) { b.x = b.min; b.dir = 1; }
    if (b.x > b.max - b.w) { b.x = b.max - b.w; b.dir = -1; }
    if (!overlaps(player, b)) continue;
    if (player.vy > 150 && player.y + player.h < b.y + b.h * 0.7) {
      // STOMP! squish it and bounce off
      b.squish = 9999;
      player.vy = -JUMP_POWER * 0.55;
      stompSound();
    } else if (player.invuln <= 0) hurt(false);
  }

  // ---- the flag ----
  if (Math.abs(player.x - FLAG.x) < 40 && player.y > FLAG.y - 300) {
    won = true;
    winSound();
  }

  // ---- camera follows, but never shows past the edges ----
  camX = Math.max(0, Math.min(WORLD_W - canvas.width,
                              player.x - canvas.width * 0.38));
}

function hurt(fell) {
  hearts--;
  hurtSound();
  if (hearts <= 0) { resetLevel(); return; }
  if (fell) {
    // put you back on the nearest ground piece to the left
    let best = solids[0];
    for (const s of solids) {
      if (s.y === FLOOR && s.x < player.x && s.x > best.x) best = s;
    }
    player.x = best.x + 60;
    player.y = FLOOR - 80;
    player.vy = 0;
  }
  player.invuln = 1.5;
}

// ---------------------------------------------------------------------
// DRAWING — bright cartoon world, blocky and cheerful
// ---------------------------------------------------------------------
function draw() {
  const W = canvas.width, H = canvas.height;

  // deep-cave gloom, lighter near the floor where the crystals glow
  const cave = ctx.createLinearGradient(0, 0, 0, H);
  cave.addColorStop(0, '#0f0b09');
  cave.addColorStop(1, '#2b2119');
  ctx.fillStyle = cave;
  ctx.fillRect(0, 0, W, H);

  // faraway rock humps slide slower than the world — that's "parallax",
  // and it's what makes flat drawings feel deep.
  // (the +span %span dance keeps them wrapping around forever)
  ctx.fillStyle = '#211a15';
  const hillSpan = 700 * 10;
  for (let i = 0; i < 12; i++) {
    const hx = ((i * 700 - camX * 0.3) % hillSpan + hillSpan) % hillSpan - 200;
    ctx.beginPath();
    ctx.arc(hx, H - 8, 120 + (i % 3) * 40, Math.PI, 0);
    ctx.fill();
  }
  // stalactites hang from the cave roof, drifting at their own pace
  ctx.fillStyle = '#241d18';
  const stalSpan = 160 * 30;
  for (let i = 0; i < 30; i++) {
    const sx = ((i * 160 - camX * 0.45) % stalSpan + stalSpan) % stalSpan - 80;
    const len = 40 + ((i * 37) % 70);
    ctx.beginPath();
    ctx.moveTo(sx - 22, 0);
    ctx.lineTo(sx + 22, 0);
    ctx.lineTo(sx, len);
    ctx.fill();
  }
  // glowing crystals stud the walls — the cave's night-lights
  const crysSpan = 500 * 12;
  for (let i = 0; i < 12; i++) {
    const cxx = ((i * 500 + 200 - camX * 0.55) % crysSpan + crysSpan) % crysSpan - 100;
    const cy = H * 0.25 + ((i * 53) % 100) / 100 * H * 0.4;
    const col = ['125, 211, 255', '180, 130, 255', '125, 223, 143'][i % 3];
    const g = ctx.createRadialGradient(cxx, cy, 2, cxx, cy, 60);
    g.addColorStop(0, `rgba(${col}, 0.5)`);
    g.addColorStop(1, `rgba(${col}, 0)`);
    ctx.fillStyle = g;
    ctx.fillRect(cxx - 60, cy - 60, 120, 120);
    ctx.fillStyle = `rgba(${col}, 0.9)`;
    ctx.beginPath();
    ctx.moveTo(cxx, cy - 10); ctx.lineTo(cxx + 7, cy);
    ctx.lineTo(cxx, cy + 10); ctx.lineTo(cxx - 7, cy);
    ctx.fill();
  }

  ctx.save();
  // the vertical camera pins the ground to the bottom of ANY screen
  const camY = FLOOR + 200 - H;
  ctx.translate(-camX, -camY);

  // solid blocks: grassy tops on ground, bricks in the sky
  for (const s of solids) {
    if (s.x + s.w < camX - 50 || s.x > camX + W + 50) continue;
    if (s.y === FLOOR) {
      ctx.fillStyle = '#3d362f';                       // cave rock
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#4f7a4a';                       // glowing moss lid
      ctx.fillRect(s.x, s.y, s.w, 14);
      ctx.fillStyle = 'rgba(160, 255, 150, 0.25)';     // the moss's shine
      ctx.fillRect(s.x, s.y, s.w, 4);
    } else {
      ctx.fillStyle = '#544b42';                       // stone shelf
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      for (let bx = s.x; bx < s.x + s.w; bx += TILE) {
        ctx.strokeRect(bx, s.y, Math.min(TILE, s.x + s.w - bx), s.h);
      }
    }
  }

  // beans — fart fuel, gently bobbing where jumping is worth it
  for (const c of coins) {
    if (c.taken) continue;
    const bob = Math.sin(elapsed * 3 + c.x) * 4;
    ctx.fillStyle = '#b5651d';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + bob, 12, 8, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#d98c3f';                          // the bean's shine
    ctx.beginPath();
    ctx.ellipse(c.x - 3, c.y + bob - 3, 4, 2.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // THE SNIFFERS — walking noses that want to sniff you right up.
  // bounce on one and it honks.
  for (const b of baddies) {
    if (b.squish > 0) continue;
    const sniff = 1 + Math.sin(elapsed * 6 + b.x) * 0.06;   // sniffing pulse
    ctx.fillStyle = '#e8a4a4';
    ctx.beginPath();                                    // the nose itself
    ctx.moveTo(b.x + 4, b.y + b.h - 8);
    ctx.lineTo(b.x + b.w / 2, b.y + 2 - 6 * (sniff - 1) * 10);
    ctx.lineTo(b.x + b.w - 4, b.y + b.h - 8);
    ctx.quadraticCurveTo(b.x + b.w / 2, b.y + b.h + 6, b.x + 4, b.y + b.h - 8);
    ctx.fill();
    ctx.fillStyle = '#7a3a3a';                          // nostrils, hunting you
    ctx.beginPath();
    ctx.ellipse(b.x + b.w / 2 - 8 + b.dir * 3, b.y + b.h - 14, 4, 6 * sniff, 0, 0, Math.PI * 2);
    ctx.ellipse(b.x + b.w / 2 + 8 + b.dir * 3, b.y + b.h - 14, 4, 6 * sniff, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a2a2a';                          // sneaky little feet
    ctx.fillRect(b.x + 4, b.y + b.h - 4, 10, 4);
    ctx.fillRect(b.x + b.w - 14, b.y + b.h - 4, 10, 4);
  }

  // the way out — a crack of DAYLIGHT in the cave wall
  const shine = 0.7 + Math.sin(elapsed * 2) * 0.2;
  const day = ctx.createLinearGradient(FLAG.x - 40, 0, FLAG.x + 60, 0);
  day.addColorStop(0, 'rgba(255, 250, 200, 0)');
  day.addColorStop(0.5, `rgba(255, 250, 200, ${0.35 * shine})`);
  day.addColorStop(1, 'rgba(255, 250, 200, 0)');
  ctx.fillStyle = day;
  ctx.fillRect(FLAG.x - 40, FLAG.y - 400, 100, 400);
  ctx.fillStyle = `rgba(255, 252, 230, ${shine})`;      // the crack itself
  ctx.beginPath();
  ctx.moveTo(FLAG.x, FLAG.y);
  ctx.lineTo(FLAG.x + 14, FLAG.y - 150);
  ctx.lineTo(FLAG.x + 4, FLAG.y - 290);
  ctx.lineTo(FLAG.x + 34, FLAG.y - 160);
  ctx.lineTo(FLAG.x + 22, FLAG.y);
  ctx.fill();

  // the toot-trail puffs, fading as they rise
  for (const p of puffs) {
    ctx.fillStyle = `rgba(150, 230, 120, ${p.life * 0.4})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (2 - p.life), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- THE HERO — a small green fart with big dreams ----
  if (player.invuln <= 0 || Math.floor(elapsed * 10) % 2 === 0) {
    const px = player.x + player.w / 2, py = player.y + player.h / 2;
    // the cloud: overlapping blobs that each wobble on their own beat
    const blobs = [[0, -8, 17], [13, 2, 13], [-13, 2, 13], [0, 8, 15], [7, -12, 10], [-8, -13, 9]];
    ctx.fillStyle = 'rgba(140, 220, 110, 0.92)';
    ctx.beginPath();
    for (const [ox, oy, r] of blobs) {
      const wob = r * (1 + Math.sin(elapsed * 6 + ox + oy) * 0.1);
      ctx.moveTo(px + ox + wob, py + oy);
      ctx.arc(px + ox, py + oy, wob, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.fillStyle = 'rgba(190, 245, 160, 0.8)';         // lighter core
    ctx.beginPath();
    ctx.arc(px, py - 2, 10, 0, Math.PI * 2);
    ctx.fill();
    // stink lines rising proudly off the top
    ctx.strokeStyle = 'rgba(170, 230, 140, 0.5)';
    ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(px + i * 9, py - 22);
      ctx.quadraticCurveTo(px + i * 9 + Math.sin(elapsed * 5 + i) * 5, py - 32,
                           px + i * 9, py - 42);
      ctx.stroke();
    }
    // the cheeky face
    const look = player.facing * 4;
    ctx.fillStyle = '#183a10';
    ctx.beginPath();
    ctx.arc(px - 6 + look, py - 6, 3.2, 0, Math.PI * 2);
    ctx.arc(px + 6 + look, py - 6, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#183a10';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(px + look, py + 3, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  }

  ctx.restore();

  // the cave is DARK — the fart glows, and lights his own way.
  const hx = player.x + player.w / 2 - camX;
  const hy = player.y + player.h / 2 - camY;
  const dark = ctx.createRadialGradient(hx, hy, 90, hx, hy, Math.max(W, H) * 0.65);
  dark.addColorStop(0, 'rgba(8, 5, 3, 0)');
  dark.addColorStop(1, 'rgba(8, 5, 3, 0.62)');
  ctx.fillStyle = dark;
  ctx.fillRect(0, 0, W, H);

  // ---- HUD ----
  ctx.textAlign = 'left';
  ctx.font = 'bold 22px monospace';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 4;
  const hud = '❤'.repeat(hearts) + '   beans: ' + coinCount;
  ctx.strokeText(hud, 16, 36);
  ctx.fillText(hud, 16, 36);

  // touch controls, only drawn where fingers go
  if ('ontouchstart' in window) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('◀', W * 0.08, H - 40);
    ctx.fillText('▶', W * 0.36, H - 40);
    ctx.textAlign = 'right';
    ctx.fillText('⤴ JUMP', W - 30, H - 40);
    ctx.textAlign = 'left';
  }

  if (won) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = `bold ${Math.min(54, W / 12)}px monospace`;
    ctx.fillText('YOU ESCAPED THE CAVE!', W / 2, H / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('the fart is FREE. smell ya later, cave.', W / 2, H / 2 + 24);
    ctx.fillText('beans: ' + coinCount + ' / ' + COIN_SPOTS.length +
                 '  —  space or tap to play again', W / 2, H / 2 + 56);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.03, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
