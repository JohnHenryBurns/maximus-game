<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE DARK MAZE</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
//  THE DARK MAZE  —  a spooky black-and-white FIRST-PERSON maze by Max
//  (the name is just a placeholder — Max gets to pick the real one!)
// =====================================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Make the canvas match the screen size (and fix it if the window changes).
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---------------------------------------------------------------------
//  KNOBS — numbers you can change to make the game feel different!
// ---------------------------------------------------------------------
const mazeSize       = 10;   // how many rooms across and down
const walkSpeed      = 2.2;  // squares per second
const turnSpeed      = 2.4;  // how fast you spin around
const flashlightSize = 2.5;  // how many squares away your flashlight reaches
const flashlightPower = 0.45; // how bright it is: 1 = new batteries, 0 = dead
const mouseSensitivity = 0.003; // how much you turn when you move the mouse
const musicVolume    = 1;    // 0 = silent, 10 = LOUD

// ---------------------------------------------------------------------
//  BUILDING THE MAZE
//  The maze is a grid of squares. 1 = wall, 0 = floor, 2 = EXIT DOOR.
//  We start with ALL walls, then a "digger" wanders around knocking
//  walls down. It never digs into a room it already visited, so every
//  maze is different but there's always exactly one way through.
// ---------------------------------------------------------------------
const gridSize = mazeSize * 2 + 1;   // rooms + the walls between them
const maze = [];
for (let row = 0; row < gridSize; row++) {
  maze.push(new Array(gridSize).fill(1));   // a whole row of walls
}

function digMaze(roomX, roomY) {
  maze[roomY * 2 + 1][roomX * 2 + 1] = 0;   // dig out this room
  // The four directions, shuffled so the maze is random:
  const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  directions.sort(() => Math.random() - 0.5);
  for (const [dx, dy] of directions) {
    const nextX = roomX + dx, nextY = roomY + dy;
    const insideMaze = nextX >= 0 && nextY >= 0 && nextX < mazeSize && nextY < mazeSize;
    if (insideMaze && maze[nextY * 2 + 1][nextX * 2 + 1] === 1) {
      maze[roomY * 2 + 1 + dy][roomX * 2 + 1 + dx] = 0;  // knock down the wall between
      digMaze(nextX, nextY);                              // keep digging from there
    }
  }
}
digMaze(0, 0);

// The exit door is in the outside wall next to the bottom-right room —
// as far from the start as possible.
maze[gridSize - 2][gridSize - 1] = 2;

// ---------------------------------------------------------------------
//  🏹 COUNTING STEPS TO THE EXIT (so the arrows know where to point)
//  Start at the exit room = 0 steps. Its neighbors = 1 step. THEIR
//  neighbors = 2 steps... spreading out like water. When we're done,
//  every square knows how far it is from the exit.
// ---------------------------------------------------------------------
const stepsToExit = maze.map(row => row.map(() => Infinity));
const toVisit = [[gridSize - 2, gridSize - 2]];     // [x, y] of the exit room
stepsToExit[gridSize - 2][gridSize - 2] = 0;
while (toVisit.length > 0) {
  const [x, y] = toVisit.shift();
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = x + dx, ny = y + dy;
    if (maze[ny][nx] === 0 && stepsToExit[ny][nx] === Infinity) {
      stepsToExit[ny][nx] = stepsToExit[y][x] + 1;
      toVisit.push([nx, ny]);
    }
  }
}

// From this floor square, which way gets you closer to the exit?
function wayToExit(x, y) {
  if (x === gridSize - 2 && y === gridSize - 2) return [1, 0];  // the door is right there →
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    if (stepsToExit[y + dy][x + dx] < stepsToExit[y][x]) return [dx, dy];
  }
  return [0, 0];
}

// ---------------------------------------------------------------------
//  THE PLAYER — now it's YOU, looking through your own eyes!
//  x and y say where you're standing. "angle" says which way you face.
// ---------------------------------------------------------------------
const player = { x: 1.5, y: 1.5, angle: 0 };
// Start facing an open hallway instead of staring at a wall:
if (maze[2][1] === 0) player.angle = Math.PI / 2;
let escaped = false;
let started = false;
let walkTime = 0;   // used to bob your view up and down as you walk

// ---------------------------------------------------------------------
//  🎁 THE JACK-IN-THE-BOX
//  He waits near the spawn point, in the room just ahead of you.
//  (Not TOO close, or he's so near your face you can't see his shape!)
//  state can be: "floor" (sitting in the maze), "held" (in your hands),
//  "popped" (OUT OF THE BOX!!), "eaten" (uh oh),
//  or "dud" (he didn't pop... the box is back on the floor, shut).
// ---------------------------------------------------------------------

// 🎲 How likely he is to pop out when the song gets to "POP".
// 1/3 = 1 in 3. Try 1/2 for a coin flip, or 1 for EVERY time!
const popChance = 1 / 3;
const jackRoomX = maze[2][1] === 0 ? 1 : 3;   // the room 2 squares in front of you
const jackRoomY = maze[2][1] === 0 ? 3 : 1;
const jack = {
  x: jackRoomX + 0.5, y: jackRoomY + 0.5,
  state: "floor",
  notesWound: 0,     // how far into the song you've cranked
  windTimer: 0,      // counts up while you crank, until it's time for the next note
  crankAngle: 0,     // how far the crank handle has turned
  popTime: 0,        // WHEN he popped (so we can animate the spring)
};

function nearJack() {
  return Math.hypot(jack.x - player.x, jack.y - player.y) < 1.1;
}

// Press E (or the ✋ button) near the box to pick it up.
function grabPress() {
  startGame();
  if (jack.state === "floor" && nearJack()) {
    jack.state = "held";
    bgMusic.gain.setTargetAtTime(0, audio.currentTime, 0.4);  // the music fades away...
  }
}

// What's at this spot? (1 = wall, 0 = floor, 2 = exit)
function whatIsAt(x, y) {
  const col = Math.floor(x), row = Math.floor(y);
  if (row < 0 || col < 0 || row >= gridSize || col >= gridSize) return 1;
  return maze[row][col];
}

// ---------------------------------------------------------------------
//  CONTROLS
//  Keyboard: W / ↑ = walk forward, S / ↓ = back, A D / ← → = turn
//  Touch: put your thumb down and slide it. Up = forward, sideways = turn.
// ---------------------------------------------------------------------
const keysDown = {};
window.addEventListener("keydown", e => {
  keysDown[e.key.toLowerCase()] = true;
  startGame();
  if (e.key.toLowerCase() === "e") grabPress();
  if (e.key.toLowerCase() === "r") tryAgain();
});

// After you get eaten, start over with a brand-new maze (by reloading the page).
function tryAgain() {
  if (jack.state === "eaten" && jack.burped) location.reload();
}
window.addEventListener("keyup",   e => { keysDown[e.key.toLowerCase()] = false; });

const thumb = { active: false, id: null, startX: 0, startY: 0, x: 0, y: 0 };
// The ✋ / 🔄 button for phones. (Where it is gets worked out in draw.)
const grabButton = { x: 0, y: 0, radius: 44, showing: false, touchId: null };
let usingTouch = false;

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  startGame();
  usingTouch = true;
  tryAgain();   // (only does something if you've been eaten)
  for (const t of e.changedTouches) {
    const onButton = grabButton.showing &&
      Math.hypot(t.clientX - grabButton.x, t.clientY - grabButton.y) < grabButton.radius;
    if (onButton) {
      grabButton.touchId = t.identifier;   // this finger is pressing the button
      grabPress();
    } else if (!thumb.active) {
      thumb.active = true; thumb.id = t.identifier;   // this finger is walking
      thumb.startX = thumb.x = t.clientX;
      thumb.startY = thumb.y = t.clientY;
    }
  }
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === thumb.id) { thumb.x = t.clientX; thumb.y = t.clientY; }
  }
}, { passive: false });
function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === thumb.id) thumb.active = false;
    if (t.identifier === grabButton.touchId) grabButton.touchId = null;
  }
}
canvas.addEventListener("touchend", endTouch);
canvas.addEventListener("touchcancel", endTouch);
// 🖱️ MOUSE LOOK. Click the game and the browser "locks" the mouse to it
// (the pointer disappears). Press Esc to get it back.
let lookUpDown = 0;   // how far you're looking up (+) or down (-), in pixels
canvas.addEventListener("mousedown", () => {
  startGame();
  if (canvas.requestPointerLock) canvas.requestPointerLock();
});
document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;   // only when locked
  // movementX = how far the mouse slid sideways since last time.
  player.angle += e.movementX * mouseSensitivity;
  // movementY = how far it slid up or down. We don't let you look TOO far,
  // or you'd be staring straight at the floor.
  const maxLook = canvas.height * 0.35;
  lookUpDown = Math.max(-maxLook, Math.min(maxLook, lookUpDown - e.movementY));
});

// Returns how much to walk (-1 back … 1 forward) and turn (-1 left … 1 right).
function getControls() {
  let walk = 0, turn = 0;
  if (keysDown["arrowup"]    || keysDown["w"]) walk += 1;
  if (keysDown["arrowdown"]  || keysDown["s"]) walk -= 1;
  if (keysDown["arrowleft"]  || keysDown["a"]) turn -= 1;
  if (keysDown["arrowright"] || keysDown["d"]) turn += 1;
  if (thumb.active) {
    const dx = thumb.x - thumb.startX, dy = thumb.y - thumb.startY;
    const clamp = n => Math.max(-1, Math.min(1, n));
    if (Math.abs(dy) > 12) walk = clamp(-dy / 60);
    if (Math.abs(dx) > 12) turn = clamp(dx / 60);
  }
  return { walk, turn };
}

// ---------------------------------------------------------------------
//  THE CREEPY MUSIC BOX 🎵
//  "Pop Goes the Weasel" — the classic jack-in-the-box song.
//  We play it SLOW and a tiny bit out of tune. That's what makes it creepy.
//  Each note is [which note, how long]. Notes are piano-key numbers.
// ---------------------------------------------------------------------
const C = 60, D = 62, E = 64, F = 65, G = 67, A = 69;
const song = [
  [C,2],[C,1],[D,2],[D,1], [E,1],[G,1],[E,1],[C,3],
  [C,2],[C,1],[D,2],[D,1], [E,3],[C,3],
  [C,2],[C,1],[D,2],[D,1], [E,1],[G,1],[E,1],[C,3],
  [A,3],[D,2],[F,1],        [E,3],[C,3],
];
let audio = null;
let musicOut = null;   // every note goes here first, then through the distortion

// 🎸 THE DISTORTION PEDAL. A "wave shaper" bends the sound wave.
// Squashing the loud parts flat makes the sound crunchy and broken.
// Bigger crunch number = more distorted.
function makeDistortion(crunch) {
  const shaper = audio.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) {
    const x = (i / curve.length) * 2 - 1;          // goes from -1 to 1
    curve[i] = Math.tanh(x * crunch);               // squash it!
  }
  shaper.curve = curve;
  return shaper;
}

function setUpSpeakers() {
  audio = new (window.AudioContext || window.webkitAudioContext)();
  musicOut = audio.createGain();
  const distortion = makeDistortion(30);
  // A "low-pass filter" cuts off the high sounds, so it's muffled,
  // like it's playing from inside a closet...
  const muffle = audio.createBiquadFilter();
  muffle.type = "lowpass";
  muffle.frequency.value = 1800;
  const volume = audio.createGain();
  // Turn the 0-to-10 knob into the tiny number the speakers want.
  // (Distortion makes things LOUD, so even 10 is only 0.35.)
  volume.gain.value = musicVolume * 0.035;
  musicOut.connect(distortion).connect(muffle).connect(volume).connect(audio.destination);

  // The background song goes through its own volume knob, so we can
  // fade it to silence when you pick up the jack-in-the-box. 🤫
  bgMusic = audio.createGain();
  bgMusic.connect(musicOut);

  // The box in your HANDS gets its own speaker: clear and close,
  // no distortion. It sounds like it's right in front of you.
  windOut = audio.createGain();
  windOut.gain.value = 0.5;
  windOut.connect(audio.destination);
}
let bgMusic = null, windOut = null;

// 💥 BOING! A sound that zooms up in pitch, then wobbles. That's the "POP".
function playBoing() {
  const now = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(120, now);
  osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);  // zoom up!
  // wobble wobble wobble...
  for (let i = 0; i < 8; i++) {
    osc.frequency.linearRampToValueAtTime(i % 2 ? 500 : 300, now + 0.2 + i * 0.07);
  }
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
  osc.connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 1);
}

// 🦁 THE ROAR: "RRRRAAAAAAAAAAHHHH!!!"
// Built like a real voice: a low buzzy sound (like your vocal cords),
// then filters that shape it into the vowel "AAAH" (like your mouth does).
function playScream() {
  const now = audio.currentTime;
  const roarLength = 1.6;

  // The "vocal cords": two low buzzy sounds, a tiny bit apart, so it's THICK.
  const voice = audio.createGain();
  for (const detune of [0, 7]) {
    const osc = audio.createOscillator();
    osc.type = "sawtooth";
    osc.detune.value = detune * 10;
    osc.frequency.setValueAtTime(100, now);                 // rrrr... (low)
    osc.frequency.linearRampToValueAtTime(170, now + 0.4);  // AAAA... (rising up)
    osc.frequency.linearRampToValueAtTime(200, now + 1.2);
    osc.frequency.linearRampToValueAtTime(130, now + roarLength);  // ...hhh (dropping off)
    osc.connect(voice);
    osc.start(now);
    osc.stop(now + roarLength);
  }

  // "RRRR": the sound flutters on and off really fast, like rolling your R.
  const flutter = audio.createGain();
  flutter.gain.value = 0.6;
  const flutterWiggle = audio.createOscillator();
  flutterWiggle.type = "square";
  flutterWiggle.frequency.value = 32;
  const flutterAmount = audio.createGain();
  flutterAmount.gain.setValueAtTime(0.4, now);                  // lots of RRRR at the start
  flutterAmount.gain.linearRampToValueAtTime(0.08, now + 0.5);  // then mostly AAAA
  flutterWiggle.connect(flutterAmount).connect(flutter.gain);
  flutterWiggle.start(now);
  flutterWiggle.stop(now + roarLength);

  // Make it raspy and rough (our distortion pedal again!)
  const rasp = makeDistortion(3);

  // "AAAA": two filters at the special pitches that make an "ah" sound.
  const ahSound = audio.createGain();
  for (const [pitch, loudness] of [[750, 1], [1150, 0.7]]) {
    const filter = audio.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = pitch;
    filter.Q.value = 4;
    const level = audio.createGain();
    level.gain.value = loudness;
    rasp.connect(filter).connect(level).connect(ahSound);
  }

  // Get loud fast, hold it, then fade out.
  const volume = audio.createGain();
  volume.gain.setValueAtTime(0.001, now);
  volume.gain.exponentialRampToValueAtTime(0.5, now + 0.1);
  volume.gain.setValueAtTime(0.5, now + 1.1);
  volume.gain.exponentialRampToValueAtTime(0.001, now + roarLength);

  voice.connect(flutter).connect(rasp);
  ahSound.connect(volume).connect(audio.destination);

  // "HHHH": a breathy hiss at the end.
  playNoise(now + 1.0, 0.6, 1200, 0.08);
}

// Noise = totally random wiggles. Through a filter it can sound like a hiss,
// a crunch, or a CHOMP, depending on the "pitch" we let through.
function playNoise(when, length, pitch, loudness) {
  const samples = Math.floor(audio.sampleRate * length);
  const buffer = audio.createBuffer(1, samples, audio.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < samples; i++) data[i] = Math.random() * 2 - 1;
  const source = audio.createBufferSource();
  source.buffer = buffer;
  const filter = audio.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = pitch;
  const gain = audio.createGain();
  gain.gain.setValueAtTime(loudness, when);
  gain.gain.exponentialRampToValueAtTime(0.001, when + length);
  source.connect(filter).connect(gain).connect(audio.destination);
  source.start(when);
}

// 📦 Clunk. The sound of nothing happening. (Phew.)
function playClunk() {
  const now = audio.currentTime;
  playNoise(now, 0.12, 180, 0.5);
  const thud = audio.createOscillator();
  const gain = audio.createGain();
  thud.frequency.setValueAtTime(110, now);
  thud.frequency.exponentialRampToValueAtTime(50, now + 0.2);
  gain.gain.setValueAtTime(0.4, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
  thud.connect(gain).connect(audio.destination);
  thud.start(now);
  thud.stop(now + 0.3);
}

// 🦷 CHOMP! Two quick crunchy bites.
function playChomp() {
  const now = audio.currentTime;
  playNoise(now, 0.15, 300, 0.6);
  playNoise(now + 0.18, 0.2, 200, 0.6);
}

// 😂 BUUURP. A low buzzy sound that wobbles. (Excuse me!)
function playBurp() {
  const now = audio.currentTime;
  const osc = audio.createOscillator();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(95, now);
  for (let i = 1; i <= 10; i++) {
    osc.frequency.linearRampToValueAtTime(i % 2 ? 70 : 100, now + i * 0.07);
  }
  const muffle = audio.createBiquadFilter();
  muffle.type = "lowpass";
  muffle.frequency.value = 600;
  const gain = audio.createGain();
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.setValueAtTime(0.5, now + 0.5);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
  osc.connect(muffle).connect(gain).connect(audio.destination);
  osc.start(now);
  osc.stop(now + 0.85);
}

// "output" = which speaker to play through. Normally the background music.
function playMusicBoxNote(note, when, output = bgMusic) {
  // Turn a piano-key number into a frequency (how fast the sound wiggles).
  const wobble = (Math.random() - 0.5) * 0.3;          // a little out of tune...
  const freq = 440 * Math.pow(2, (note + 12 + wobble - 69) / 12);
  // A music box "ding" = a pure tone + a quieter higher tone, fading out fast.
  for (const [mult, volume] of [[1, 0.25], [4, 0.06]]) {
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.value = freq * mult;
    // 〰️ The warble: the note sags DOWN in pitch as it plays, like a
    // music box whose spring is running out.
    osc.frequency.setValueAtTime(freq * mult, when);
    osc.frequency.linearRampToValueAtTime(freq * mult * 0.97, when + 1.8);
    gain.gain.setValueAtTime(volume, when);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + 1.8);
    osc.connect(gain).connect(output);
    osc.start(when);
    osc.stop(when + 1.9);
  }
}

function playSongOnce() {
  const beat = 0.8;                 // seconds per beat — bigger = slower & creepier
  let time = audio.currentTime + 0.1;
  for (const [note, length] of song) {
    playMusicBoxNote(note, time);
    time += length * beat;
  }
  const songLength = time - audio.currentTime;
  setTimeout(playSongOnce, (songLength + 1.5) * 1000);  // a creepy pause, then again
}

function startGame() {
  if (started) return;
  started = true;
  // Browsers only allow sound after you press or tap something.
  setUpSpeakers();
  playSongOnce();
}

// ---------------------------------------------------------------------
//  UPDATE — move things. Runs every frame.
// ---------------------------------------------------------------------
// ⏱️ THE JUMP-SCARE TIMELINE (seconds after he pops out)
const screamTime = 1.2;   // 🦁 he ROARS and lunges at you
const chompTime  = 2.9;   // 🦷 CHOMP (the roar is long, so this comes a bit later)
const burpTime   = 3.6;   // 😂 BUUURP

function update(seconds) {
  // After he pops, you're frozen in fear... and the timeline plays out.
  if (jack.state === "popped" || jack.state === "eaten") {
    const t = (performance.now() - jack.popTime) / 1000;
    if (t > screamTime && !jack.screamed) { jack.screamed = true; playScream(); }
    if (t > chompTime && !jack.chomped)   { jack.chomped = true; jack.state = "eaten"; playChomp(); }
    if (t > burpTime && !jack.burped)     { jack.burped = true; playBurp(); }
    return;
  }
  if (!started || escaped) return;
  const { walk, turn } = getControls();

  player.angle += turn * turnSpeed * seconds;

  // Which way is "forward"? cos and sin turn an angle into an x and y step.
  const stepX = Math.cos(player.angle) * walk * walkSpeed * seconds;
  const stepY = Math.sin(player.angle) * walk * walkSpeed * seconds;

  // Look a little bit ahead (0.25 squares) so your nose doesn't go into the wall.
  const bodySize = 0.25 * Math.sign(walk);
  const aheadX = whatIsAt(player.x + stepX + Math.cos(player.angle) * bodySize, player.y);
  const aheadY = whatIsAt(player.x, player.y + stepY + Math.sin(player.angle) * bodySize);

  if (aheadX === 2 || aheadY === 2) escaped = true;   // you walked into the EXIT!
  if (aheadX === 0) player.x += stepX;                // slide along walls
  if (aheadY === 0) player.y += stepY;

  if (walk !== 0) walkTime += seconds;

  // 🔄 WINDING THE JACK-IN-THE-BOX (hold E, or hold the button)
  const winding = keysDown["e"] || grabButton.touchId !== null;
  if (jack.state === "held" && winding) {
    jack.crankAngle += seconds * 7;
    jack.windTimer += seconds;
    const [note, length] = song[jack.notesWound];
    // Wait as long as this note lasts in the song, then play the next one.
    if (jack.windTimer >= length * 0.25) {
      jack.windTimer = 0;
      // The "POP" is the high A note. Roll the dice... does he pop out?
      if (note === A && Math.random() < popChance) {
        jack.state = "popped";            // 💥 YES. Uh oh.
        jack.popTime = performance.now();
        playBoing();
      } else if (note === A) {
        // 😮‍💨 ...no. Clunk. Nothing happens. You put the box down.
        jack.state = "dud";
        jack.dudTime = performance.now();
        playClunk();
        bgMusic.gain.setTargetAtTime(1, audio.currentTime, 1.5);  // the creepy music comes back
        // Set it on the floor just in front of you (if that's not inside a wall).
        const dropX = player.x + Math.cos(player.angle) * 0.6;
        const dropY = player.y + Math.sin(player.angle) * 0.6;
        const floorThere = whatIsAt(dropX, dropY) === 0;
        jack.x = floorThere ? dropX : player.x;
        jack.y = floorThere ? dropY : player.y;
      } else {
        playMusicBoxNote(note, audio.currentTime, windOut);
        jack.notesWound++;
      }
    }
  }
}

// ---------------------------------------------------------------------
//  RAYCASTING — the trick that makes it look 3D!
//  For every thin column of the screen, we shoot an invisible ray out
//  from your eyes and walk it forward until it hits a wall.
//  Close wall = draw it TALL. Far wall = draw it SHORT.
// ---------------------------------------------------------------------
const fieldOfView = 0.66;   // how wide you can see (bigger = more fish-eye)
const columnWidth = 2;      // draw every 2 pixels — faster, and looks old-school

function castRay(rayAngleX, rayAngleY) {
  // Which square are we in, and which way is the ray going?
  let col = Math.floor(player.x), row = Math.floor(player.y);
  const stepCol = rayAngleX < 0 ? -1 : 1;
  const stepRow = rayAngleY < 0 ? -1 : 1;
  // How far the ray travels to cross one whole square, sideways or up/down:
  const crossX = Math.abs(1 / rayAngleX), crossY = Math.abs(1 / rayAngleY);
  let nextX = (rayAngleX < 0 ? player.x - col : col + 1 - player.x) * crossX;
  let nextY = (rayAngleY < 0 ? player.y - row : row + 1 - player.y) * crossY;
  let hitSide = 0;
  // Hop from square to square until we bump into something.
  for (let hops = 0; hops < 64; hops++) {
    if (nextX < nextY) { nextX += crossX; col += stepCol; hitSide = 0; }
    else               { nextY += crossY; row += stepRow; hitSide = 1; }
    const thing = whatIsAt(col + 0.5, row + 0.5);
    if (thing !== 0) {
      const distance = hitSide === 0 ? nextX - crossX : nextY - crossY;
      // Where on the wall did we hit? (0 = left edge, 1 = right edge)
      let spot = hitSide === 0 ? player.y + distance * rayAngleY : player.x + distance * rayAngleX;
      spot -= Math.floor(spot);
      // The floor square the ray was in just before it hit the wall:
      const floorX = hitSide === 0 ? col - stepCol : col;
      const floorY = hitSide === 1 ? row - stepRow : row;
      return { distance, thing, hitSide, spot, floorX, floorY, wallX: col, wallY: row };
    }
  }
  return { distance: 99, thing: 1, hitSide: 0, spot: 0, floorX: 1, floorY: 1, wallX: 0, wallY: 0 };
}

// 🎲 A "pretend random" number between 0 and 1. Give it the same input and
// you ALWAYS get the same answer, so the arrows don't flicker every frame.
function fakeRandom(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

// 🖋️ Is there a messy ink arrow on this bit of wall?
// Returns a list of ink blobs, each one [top, bottom], measured from
// 0 = top of the wall to 1 = bottom of the wall. Or null for no ink.
function arrowOnWall(ray) {
  if (ray.thing !== 1) return null;
  const [dx, dy] = wayToExit(ray.floorX, ray.floorY);
  // hitSide 0 = a wall that runs up/down, so the arrow must point up/down (dy).
  // hitSide 1 = a wall that runs sideways, so the arrow must point sideways (dx).
  const along = ray.hitSide === 0 ? dy : dx;
  if (along === 0) return null;            // the exit way isn't along this wall

  // Roll the dice for THIS wall. Only about 1 in 10 walls gets an arrow.
  const wallNumber = ray.wallX * 31 + ray.wallY * 17 + ray.floorX * 7 + ray.floorY * 3;
  const roll = fakeRandom(wallNumber);
  if (roll > 0.1) return null;

  // Flip the arrow around if it points the other way.
  const u = along > 0 ? ray.spot : 1 - ray.spot;
  if (u < 0.15 || u > 0.82) return null;

  // Shaky hand: the line wobbles up and down, and slants a bit.
  const middle = 0.47 + Math.sin(u * 9 + roll * 50) * 0.025 + (u - 0.5) * (roll - 0.12) * 0.3;
  // Chop the wall into little strips so each strip gets its own messiness.
  const strip = Math.floor(u * 50) + wallNumber * 100;
  const shaky = 0.6 + fakeRandom(strip) * 0.8;     // thicker here, thinner there
  const blobs = [];

  // The stick of the arrow.
  const stickThick = 0.022 * shaky;
  blobs.push([middle - stickThick, middle + stickThick]);

  // The head: two scratchy strokes, like a ">" shape.
  if (u > 0.58) {
    const spread = (0.82 - u) * 0.75;
    const strokeThick = 0.02 * shaky;
    blobs.push([middle - spread - strokeThick, middle - spread + strokeThick]);
    blobs.push([middle + spread - strokeThick, middle + spread + strokeThick]);
  }

  // 💧 Ink drips! Some strips have ink running down below the line.
  if (fakeRandom(strip + 0.5) > 0.82) {
    const dripLength = 0.05 + fakeRandom(strip + 0.7) * 0.25;
    blobs.push([middle, middle + stickThick + dripLength]);
  }
  return blobs;
}

// ---------------------------------------------------------------------
//  🎁 DRAWING THE JACK-IN-THE-BOX
// ---------------------------------------------------------------------
const BLUE = [30, 79, 216], RED = [216, 30, 30], YELLOW = "#f2d21b";

// Turn a color + an amount of light (0 = black, 1 = full) into a color the canvas understands.
function paint(rgb, light) {
  return `rgb(${Math.floor(rgb[0] * light)},${Math.floor(rgb[1] * light)},${Math.floor(rgb[2] * light)})`;
}

// 📦 THE 3D BOX
// Every spot on the box has 3 numbers, from 0 to 1:
//   x = left → right,   y = front → back,   z = bottom → top
// "project" is a function that turns those 3 numbers into a spot on the
// SCREEN. Different projects = different cameras (the maze, or your hands).

// Fill in a flat shape that goes through some 3D points, like connect-the-dots.
function fillShape(project, points, color) {
  const onScreen = points.map(p => project(p[0], p[1], p[2]));
  if (onScreen.some(spot => spot === null)) return;   // too close to your eyes to draw
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(onScreen[0][0], onScreen[0][1]);
  for (const spot of onScreen.slice(1)) ctx.lineTo(spot[0], spot[1]);
  ctx.closePath();
  ctx.fill();
}

// One side of the box: red border, blue middle, red diamond.
// corner = where the side starts. across and up = which way its edges go.
function drawBoxSide(project, corner, across, up, light) {
  // A spot on this side: "a" of the way across, "b" of the way up.
  const spot = (a, b) => [0, 1, 2].map(i => corner[i] + across[i] * a + up[i] * b);
  fillShape(project, [spot(0, 0), spot(1, 0), spot(1, 1), spot(0, 1)], paint(RED, light));
  fillShape(project, [spot(.1, .1), spot(.9, .1), spot(.9, .9), spot(.1, .9)], paint(BLUE, light));
  fillShape(project, [spot(.5, .22), spot(.78, .5), spot(.5, .78), spot(.22, .5)], paint(RED, light));
}

// The crank sticks out of the right side and goes round and round.
function drawCrank(project, crank, light, thickness) {
  const axleStart = project(1, 0.5, 0.5), axleEnd = project(1.2, 0.5, 0.5);
  const handle = project(1.2, 0.5 + Math.cos(crank) * 0.22, 0.5 + Math.sin(crank) * 0.22);
  if (!axleStart || !axleEnd || !handle) return;
  ctx.strokeStyle = paint(RED, light);
  ctx.lineWidth = thickness;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(axleStart[0], axleStart[1]);
  ctx.lineTo(axleEnd[0], axleEnd[1]);
  ctx.lineTo(handle[0], handle[1]);
  ctx.stroke();
  ctx.fillStyle = paint(BLUE, light);
  ctx.beginPath();
  ctx.arc(handle[0], handle[1], thickness * 1.1, 0, Math.PI * 2);
  ctx.fill();
}

// Draw the whole box. "isFacingYou" answers: does this side point at the camera?
// We only draw sides that face you. (The back of a box is hidden anyway!)
function drawBox3D(project, isFacingYou, light, crank, lidOpen, thickness) {
  const sides = [
    { corner: [0, 0, 0], across: [1, 0, 0],  out: [0, -1, 0], shade: 0.85 },  // front
    { corner: [1, 1, 0], across: [-1, 0, 0], out: [0, 1, 0],  shade: 0.85 },  // back
    { corner: [0, 1, 0], across: [0, -1, 0], out: [-1, 0, 0], shade: 0.65 },  // left
    { corner: [1, 0, 0], across: [0, 1, 0],  out: [1, 0, 0],  shade: 0.65 },  // right
  ];
  const crankSideShowing = isFacingYou([1, 0, 0]);
  if (!crankSideShowing) drawCrank(project, crank, light * 0.6, thickness);  // behind the box
  for (const side of sides) {
    if (isFacingYou(side.out)) drawBoxSide(project, side.corner, side.across, [0, 0, 1], light * side.shade);
  }
  if (lidOpen) {
    // A dark hole on top (that's where HE came out)...
    fillShape(project, [[0, 0, 1], [1, 0, 1], [1, 1, 1], [0, 1, 1]], "#111");
    // ...and the lid flipped open on its hinge at the back.
    const lidY = 1 - Math.cos(2.0), lidZ = 1 + Math.sin(2.0);
    fillShape(project, [[0, 1, 1], [1, 1, 1], [1, lidY, lidZ], [0, lidY, lidZ]], paint(RED, light * 0.9));
  } else {
    // The closed lid: red, with a darker red square in the middle.
    fillShape(project, [[0, 0, 1], [1, 0, 1], [1, 1, 1], [0, 1, 1]], paint(RED, light));
    fillShape(project, [[.15, .15, 1], [.85, .15, 1], [.85, .85, 1], [.15, .85, 1]], paint(RED, light * 0.75));
  }
  if (crankSideShowing) drawCrank(project, crank, light, thickness);
}

// HIM. 😱 A yellow creature: round head, long wobbly neck, SHARP teeth.
// mouthOpen = how wide the mouth is: 1 = grinning, 2 = SCREAMING
function drawCreature(c, neckBottomX, neckBottomY, headX, headY, size, mouthOpen = 1) {
  // The long neck: a thick yellow bendy line.
  c.strokeStyle = "#8a7400";
  c.lineWidth = size * 0.18;
  c.lineCap = "round";
  c.beginPath();
  c.moveTo(neckBottomX, neckBottomY);
  c.quadraticCurveTo(neckBottomX, (neckBottomY + headY) / 2, headX, headY);
  c.stroke();
  c.strokeStyle = YELLOW;
  c.lineWidth = size * 0.13;
  c.stroke();

  // The round head.
  const r = size * 0.5;
  c.fillStyle = YELLOW;
  c.strokeStyle = "#8a7400";
  c.lineWidth = size * 0.04;
  c.beginPath();
  c.arc(headX, headY, r, 0, Math.PI * 2);
  c.fill();
  c.stroke();

  // No eyes. Just a smooth, blank face. (How does he know where you are...?)

  // The mouth: a big black grin...
  const mouthLeft = headX - r * 0.7, mouthWidth = r * 1.4;
  const mouthTop = headY + r * 0.15, mouthHeight = r * 0.5 * mouthOpen;
  c.fillStyle = "#000";
  c.beginPath();
  c.ellipse(headX, mouthTop + mouthHeight / 2, mouthWidth / 2, mouthHeight / 2, 0, 0, Math.PI * 2);
  c.fill();
  // ...full of VERY SHARP teeth. Top row points down, bottom row points up.
  c.fillStyle = "#fff";
  const teeth = 7, toothWidth = mouthWidth * 0.8 / teeth;
  for (let i = 0; i < teeth; i++) {
    const tx = mouthLeft + mouthWidth * 0.1 + i * toothWidth;
    c.beginPath();                                   // top tooth
    c.moveTo(tx, mouthTop + mouthHeight * 0.15);
    c.lineTo(tx + toothWidth, mouthTop + mouthHeight * 0.15);
    c.lineTo(tx + toothWidth / 2, mouthTop + mouthHeight * 0.55);
    c.fill();
    c.beginPath();                                   // bottom tooth
    c.moveTo(tx, mouthTop + mouthHeight * 0.85);
    c.lineTo(tx + toothWidth, mouthTop + mouthHeight * 0.85);
    c.lineTo(tx + toothWidth / 2, mouthTop + mouthHeight * 0.45);
    c.fill();
  }
}

// The box in your hands (and HIM, if he's popped).
function drawHeldJack(w, h, now) {
  const size = Math.min(w, h) * 0.3;          // how big HE is
  const boxSize = Math.min(w, h) * 0.26;      // how big the box is
  const bob = Math.sin(walkTime * 9) * 8;
  const boxLeft = w * 0.6 - boxSize * 0.7;
  const boxBottom = h + boxSize * 0.15 + bob;

  // The "camera" for the box in your hands: looking at it from a bit
  // above and to the left, so you see the front, the top AND the right side.
  const handProject = (x, y, z) => [
    boxLeft + x * boxSize + y * boxSize * 0.45,
    boxBottom - z * boxSize - y * boxSize * 0.35,
  ];
  const handFacing = out => out[0] > 0 || out[1] < 0;   // right side and front
  const lidOpen = jack.state !== "held";
  const drawTheBox = () =>
    drawBox3D(handProject, handFacing, 1, jack.crankAngle, lidOpen, boxSize * 0.06);

  if (jack.state !== "popped") { drawTheBox(); return; }

  const t = (now - jack.popTime) / 1000;     // seconds since he popped
  const [neckX, neckY] = handProject(0.5, 0.5, 0.9);   // he comes out of the middle of the top
  // SPRING! Shoots up, overshoots, and bounces... boing boing boing.
  const springy = 1 - Math.exp(-t * 4) * Math.cos(t * 16);
  const neckLength = Math.min(neckY - h * 0.28, size * 2.2) * springy;
  const sway = Math.sin(t * 2.3) * size * 0.3 * Math.min(1, t);
  let headX = neckX + sway, headY = neckY - neckLength;
  let headSize = size, mouthOpen = 1;

  // 🦁 ROAR + LUNGE: the mouth opens wide, he shakes, and he zooms at
  // your face. "lunge" goes from 0 (just started) to 1 (CHOMP!).
  if (t > screamTime) {
    const lunge = Math.min(1, (t - screamTime) / (chompTime - screamTime));
    const zoom = lunge * lunge * lunge;     // starts slow... then FAST
    const shake = size * 0.12;
    mouthOpen = 1 + Math.min(1, (t - screamTime) * 4) * 1.3;
    headSize = size * (1 + zoom * 9);
    headX += (w / 2 - headX) * zoom + (Math.random() - 0.5) * shake;
    headY += (h / 2 - headSize * 0.3 - headY) * zoom + (Math.random() - 0.5) * shake;
    // When he's lunging, his head is in FRONT of the box, so draw the box first.
    drawTheBox();
    drawCreature(ctx, neckX, neckY, headX, headY, headSize, mouthOpen);
    return;
  }
  // He comes up OUT of the hole in the top, so draw the box first, then him.
  drawTheBox();
  drawCreature(ctx, neckX, neckY, headX, headY, headSize, mouthOpen);
  // "POP!" flashes on screen for the first second.
  if (t < 1) {
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${Math.floor(size * 0.6)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.fillText("POP!", w * 0.3, h * 0.35);
  }
}

// ---------------------------------------------------------------------
//  DRAW — paint the picture. Runs every frame.
// ---------------------------------------------------------------------
function draw(now) {
  const w = canvas.width, h = canvas.height;
  // Your view bobs up and down a little while you walk, like real footsteps.
  // Looking up moves the horizon DOWN the screen (so you see more ceiling).
  const horizon = h / 2 + lookUpDown + Math.sin(walkTime * 9) * 6;

  // Ceiling and floor: black, with the floor getting a tiny bit gray close to you.
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  const floor = ctx.createLinearGradient(0, horizon, 0, h);
  floor.addColorStop(0, "#000");
  floor.addColorStop(1, "#1a1a1a");   // dim floor, for a dim flashlight
  ctx.fillStyle = floor;
  ctx.fillRect(0, horizon, w, h - horizon);

  // Which way you're looking, and the "screen" sideways from that.
  const lookX = Math.cos(player.angle), lookY = Math.sin(player.angle);
  const sideX = -lookY * fieldOfView, sideY = lookX * fieldOfView;

  // The flashlight flickers a tiny bit...
  const flicker = Math.random() < 0.03 ? 0.6 : 1;
  const lightReach = flashlightSize * flicker;

  const wallDistances = [];   // how far the wall is in each column (for the box)
  for (let x = 0; x < w; x += columnWidth) {
    const screenSpot = (2 * x) / w - 1;      // -1 = left edge, 1 = right edge
    const ray = castRay(lookX + sideX * screenSpot, lookY + sideY * screenSpot);
    wallDistances.push(ray.distance);
    const wallHeight = h / ray.distance;

    // Brightness: close = bright, far = black. That's the flashlight!
    let brightness = Math.max(0, 1 - ray.distance / lightReach);
    if (ray.hitSide === 1) brightness *= 0.75;    // one side darker = looks 3D

    let shade;
    if (ray.thing === 2) {
      // THE EXIT DOOR: bright white, with a dark doorway in the middle.
      const inDoorway = ray.spot > 0.25 && ray.spot < 0.75;
      shade = inDoorway ? 40 : 255;
      brightness = Math.max(brightness, 0.35);   // the exit glows a little
    } else {
      // Plain wall: gray, with dark cracks between the stone blocks.
      const crack = ray.spot < 0.04 || ray.spot > 0.96 || Math.abs(ray.spot - 0.5) < 0.02;
      shade = crack ? 90 : 190;
    }
    brightness *= flashlightPower;
    const gray = Math.floor(shade * brightness);
    const wallTop = horizon - wallHeight / 2;
    ctx.fillStyle = `rgb(${gray},${gray},${gray})`;
    ctx.fillRect(x, wallTop, columnWidth, wallHeight);

    // 🖋️ Paint the ink arrow on top (almost black, like old ink).
    const inkBlobs = arrowOnWall(ray);
    if (inkBlobs) {
      const ink = Math.floor(gray * 0.15);
      ctx.fillStyle = `rgb(${ink},${ink},${ink})`;
      for (const [top, bottom] of inkBlobs) {
        ctx.fillRect(x, wallTop + top * wallHeight, columnWidth, (bottom - top) * wallHeight);
      }
    }
  }

  // 📦 The 3D box sitting in the maze.
  if (jack.state === "floor" || jack.state === "dud") {
    const boxSizeInWorld = 0.35;   // 0.35 of a square wide (walls are 1 tall)
    // The box sits a bit crooked, so you see TWO sides and it looks like a cube.
    const boxTurn = 0.7;           // how much it's turned (0 = straight)
    const turnCos = Math.cos(boxTurn), turnSin = Math.sin(boxTurn);
    // The "camera" for the maze: turns a spot on the box into a spot on the screen.
    // Same trick as the walls: far away = closer to the middle and smaller.
    const flip = 1 / (sideX * lookY - lookX * sideY);
    const mazeProject = (x, y, z) => {
      // How far this spot is from the middle of the box...
      const offsetX = (x - 0.5) * boxSizeInWorld, offsetY = (y - 0.5) * boxSizeInWorld;
      // ...then turned crooked (cos and sin are the "turning" math).
      const worldX = jack.x + offsetX * turnCos - offsetY * turnSin;
      const worldY = jack.y + offsetX * turnSin + offsetY * turnCos;
      const height = z * boxSizeInWorld;
      const dx = worldX - player.x, dy = worldY - player.y;
      const across = flip * (lookY * dx - lookX * dy);   // how far to the side
      const ahead = flip * (-sideY * dx + sideX * dy);   // how far in front
      if (ahead < 0.05) return null;                     // behind you, or in your face
      return [(w / 2) * (1 + across / ahead), horizon + (0.5 - height) * h / ahead];
    };
    // A side faces you if it points toward where you're standing.
    // (We turn the side's direction crooked too, to match the box.)
    const mazeFacing = out => {
      const outX = out[0] * turnCos - out[1] * turnSin;
      const outY = out[0] * turnSin + out[1] * turnCos;
      return outX * (player.x - jack.x) + outY * (player.y - jack.y) > boxSizeInWorld / 2;
    };

    const centerAhead = flip * (-sideY * (jack.x - player.x) + sideX * (jack.y - player.y));
    if (centerAhead > 0.1) {
      // Darken it with the flashlight, just like the walls.
      // (He never gets TOTALLY dark. You can always just barely see him...)
      const light = Math.max(0.5, 1 - centerAhead / lightReach) * Math.min(1, flashlightPower * 1.6);
      // Walls in front of the box should hide it, so only let it draw in
      // the columns where the box is closer than the wall. (That's a "clip".)
      ctx.save();
      ctx.beginPath();
      wallDistances.forEach((wallDistance, col) => {
        if (centerAhead < wallDistance) ctx.rect(col * columnWidth, 0, columnWidth + 0.5, h);
      });
      ctx.clip();
      drawBox3D(mazeProject, mazeFacing, light, 0, false, h / centerAhead * 0.02);
      ctx.restore();
    }
  }

  // ✋ The box in your hands (and maybe... HIM).
  if (jack.state !== "floor" && jack.state !== "dud") drawHeldJack(w, h, now);

  // 🔦 The flashlight circle: the edges of the screen fade to black.
  const edge = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.2 * flicker,
                                        w / 2, h / 2, Math.max(w, h) * 0.6);
  edge.addColorStop(0, "rgba(0,0,0,0)");
  edge.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = edge;
  ctx.fillRect(0, 0, w, h);

  // Old-movie film grain: little random specks.
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  for (let i = 0; i < 60; i++) ctx.fillRect(Math.random() * w, Math.random() * h, 2, 2);

  // Words on the screen.
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 28px Georgia, serif";
  if (!started) {
    ctx.fillText("THE DARK MAZE", w / 2, h / 2 - 60);
    ctx.font = "18px Georgia, serif";
    ctx.fillText("click to begin...", w / 2, h / 2 + 60);
    ctx.font = "14px Georgia, serif";
    ctx.fillText("mouse = look   ·   W A S D = move   ·   Esc = get your mouse back", w / 2, h / 2 + 90);
  } else if (escaped) {
    ctx.fillText("YOU ESCAPED!", w / 2, h / 2);
  }

  // 🦷 EATEN! Everything goes black... you're inside him now.
  if (jack.state === "eaten") {
    const t = (now - jack.popTime) / 1000;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, w, h);
    // No words. Just darkness... and the sounds. 😶
    // A little while after the burp, a small hint shows how to start over.
    if (t > burpTime + 1.5) {
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.textAlign = "center";
      ctx.font = "16px Georgia, serif";
      ctx.fillText(usingTouch ? "tap to try again" : "press R to try again", w / 2, h - 40);
    }
    return;   // nothing else to draw. it's dark in here.
  }

  // Little hints at the bottom of the screen.
  ctx.font = "18px Georgia, serif";
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  const canGrab = jack.state === "floor" && nearJack();
  if (jack.state === "dud" && now - jack.dudTime < 4000) {
    ctx.fillText("...nothing happened. phew.", w / 2, h - 30);
  } else if (started && canGrab) {
    ctx.fillText(usingTouch ? "tap ✋ to pick it up" : "press E to pick it up", w / 2, h - 30);
  } else if (jack.state === "held") {
    ctx.fillText(usingTouch ? "hold 🔄 to wind it..." : "hold E to wind it...", w / 2, h - 30);
  }

  // 📱 The grab / wind button (only for touch screens).
  grabButton.showing = usingTouch && (canGrab || jack.state === "held");
  if (grabButton.showing) {
    grabButton.x = w - 70;
    grabButton.y = h * 0.5;
    ctx.fillStyle = grabButton.touchId !== null ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.15)";
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(grabButton.x, grabButton.y, grabButton.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.font = "34px sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText(jack.state === "held" ? "🔄" : "✋", grabButton.x, grabButton.y + 12);
  }
}

// ---------------------------------------------------------------------
//  THE GAME LOOP — update, draw, repeat, about 60 times a second.
// ---------------------------------------------------------------------
let lastTime = performance.now();
function gameLoop(now) {
  const seconds = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(seconds);
  draw(now);
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
