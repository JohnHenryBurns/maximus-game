<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PAPER WARS</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8e0c8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
// PAPER WARS — claim the paper. All of it.
// You own a patch of color. Venture out and you leave a TRAIL —
// loop back home and everything you enclosed becomes yours.
// But while you're out, your trail is your throat: if anyone
// touches it (including YOU), you're gone. The others play by the
// same rules. Their trails are waiting.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
function claimSound(size) {
  const n = Math.min(5, 1 + Math.floor(size / 40));
  for (let i = 0; i < n; i++) {
    setTimeout(() => beep(520 + i * 110, 0.12, 'square', 0.07), i * 70);
  }
}
function deathSound() { [300, 220, 150, 90].forEach((n, i) => setTimeout(() => beep(n, 0.18, 'sawtooth', 0.1), i * 100)); }
function killSound() { beep(880, 0.08, 'square', 0.1); setTimeout(() => beep(590, 0.15, 'square', 0.1), 70); }
function towerSound() { [392, 523, 659, 784].forEach((n, i) => setTimeout(() => beep(n, 0.14, 'square', 0.09), i * 80)); }
function miniPopSound() { beep(700, 0.06, 'sine', 0.08); }

// ---------------------------------------------------------------------
// THE PAPER — a big grid; every cell remembers who owns it,
// and whose trail is drawn on it right now
// ---------------------------------------------------------------------
const GW = 90, GH = 60, CELL = 22;
const own = new Uint8Array(GW * GH);     // 0 = blank paper, else player id
const trail = new Uint8Array(GW * GH);   // same, for wet ink trails
const idx = (x, y) => y * GW + x;

const PLAYERS = [
  { id: 1, name: 'YOU',     color: '#3a9ad9', dark: '#2a6a9f', isYou: true },
  { id: 2, name: 'Chippy',  color: '#e8453c', dark: '#a83028' },
  { id: 3, name: 'Gerald',  color: '#ff9f43', dark: '#c8742a' },
  { id: 4, name: 'Kevin',   color: '#5fbf6f', dark: '#3f8a4c' },
  { id: 5, name: 'Barry',   color: '#a878e8', dark: '#7a52b0' },
];

let ents = [];
let towers = [];        // circle one into your land: it joins you
let minis = [];         // ...and sends out three tiny helpers
let elapsed = 0;
let screen = 'menu';    // 'menu' | 'skins' | 'play'

// ---- lifetime record: kills, best coverage, and your WARDROBE ----
let psave = { kills: 0, best: 0, skin: 'block' };
try {
  const s = JSON.parse(localStorage.getItem('paper_save'));
  if (s) psave = Object.assign(psave, s);
} catch (err) {}
function persistP() { localStorage.setItem('paper_save', JSON.stringify(psave)); }

const SKINS = [
  { id: 'block', name: 'THE BLOCK', how: 'the original. a classic.',
    unlocked: () => true },
  { id: 'toilet', name: 'THE TOILET', how: 'destroy 3 rivals',
    unlocked: () => psave.kills >= 3,
    progress: () => Math.min(psave.kills, 3) + '/3 rivals destroyed' },
  { id: 'donut', name: 'SHINY DONUT', how: 'cover 10.5% of the map',
    unlocked: () => psave.best >= 10.5,
    progress: () => 'best so far: ' + psave.best.toFixed(1) + '% / 10.5%' },
];
let camX = 0, camY = 0;
let gameOver = false;
let bestPct = 0;
let milestone = 0;          // the next % worth celebrating
let banner = '', bannerT = 0;

function makeEnt(p, cx, cy) {
  return {
    p, x: cx + 0.5, y: cy + 0.5, dx: 1, dy: 0,
    nextDx: 1, nextDy: 0,
    angle: 0,               // you steer by ANGLE now — real curves
    keyAngle: null,
    lastCell: idx(cx, cy),
    myTrail: [],
    out: false,
    alive: true,
    respawnT: 0,
    // bot brains
    plan: [], home: null,
  };
}

function stampSquare(id, cx, cy, r) {
  for (let y = cy - r; y <= cy + r; y++) {
    for (let x = cx - r; x <= cx + r; x++) {
      if (x >= 0 && y >= 0 && x < GW && y < GH) own[idx(x, y)] = id;
    }
  }
}

function resetGame() {
  own.fill(0);
  trail.fill(0);
  ents = [];
  const spots = [[GW >> 1, GH >> 1], [10, 8], [GW - 11, 8], [10, GH - 9], [GW - 11, GH - 9]];
  PLAYERS.forEach((p, i) => {
    const [cx, cy] = spots[i];
    stampSquare(p.id, cx, cy, 2);
    ents.push(makeEnt(p, cx, cy));
  });
  gameOver = false;
  milestone = 25;
  banner = 'steer with your MOUSE (or finger, or arrows)';
  bannerT = 5;
  minis = [];
  towers = [[30, 15], [60, 15], [14, 30], [76, 30], [30, 45], [60, 45]]
    .map(([x, y]) => ({ x, y, claimedBy: 0 }));
}
resetGame();

// three tiny copies of the tower's new owner march out to help
function spawnMinis(ownerId, tx, ty) {
  const dirs = [[1, 0], [-1, 0], [0, 1]];
  for (let i = 0; i < 3; i++) {
    if (minis.filter(m => m.ownerId === ownerId).length >= 9) break;
    minis.push({
      ownerId, x: tx + 0.5, y: ty + 0.5,
      dx: dirs[i][0], dy: dirs[i][1],
      life: 18, lastCell: -1,
    });
  }
}

// ---------------------------------------------------------------------
// INPUT — arrows / WASD, or swipe anywhere on a phone
// ---------------------------------------------------------------------
addEventListener('keydown', e => {
  ensureAudio();
  const you = ents[0];
  if (screen === 'menu' && e.key === ' ') { resetGame(); screen = 'play'; return; }
  if (gameOver && e.key === ' ') { screen = 'menu'; return; }
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') you.keyAngle = Math.PI;
  if (k === 'arrowright' || k === 'd') you.keyAngle = 0;
  if (k === 'arrowup' || k === 'w') you.keyAngle = -Math.PI / 2;
  if (k === 'arrowdown' || k === 's') you.keyAngle = Math.PI / 2;
});
// the head CHASES the mouse — hover on desktop, drag on phones
let mouseX = null, mouseY = null, mouseAt = -99;
let uiRects = [];
addEventListener('pointerdown', e => {
  ensureAudio();
  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) { uiAction(r.id); return; }
  }
  if (screen !== 'play') return;
  if (gameOver) { screen = 'menu'; return; }
  mouseX = e.clientX; mouseY = e.clientY; mouseAt = elapsed;
});

function uiAction(id) {
  if (id === 'play') { resetGame(); screen = 'play'; return; }
  if (id === 'skins') { screen = 'skins'; return; }
  if (id === 'back') { screen = 'menu'; return; }
  if (id.startsWith('skin_')) {
    const sk = SKINS.find(s => s.id === id.slice(5));
    if (sk && sk.unlocked()) {
      psave.skin = sk.id;
      persistP();
      beep(700, 0.1, 'square', 0.08);
    } else beep(160, 0.15, 'square', 0.08);
  }
}
addEventListener('pointermove', e => {
  mouseX = e.clientX; mouseY = e.clientY; mouseAt = elapsed;
});

// every frame: swing your heading smoothly toward the cursor. the
// turn rate is the secret — it's what makes your path a CIRCLE
// instead of a corner. turning circle ≈ 2 cells.
const TURN_RATE = 4.2;      // radians per second
function steerSmooth(you, dt) {
  let tgt = null;
  if (mouseX !== null && elapsed - mouseAt <= 3) {
    const wx = (mouseX + camX) / CELL, wy = (mouseY + camY) / CELL;
    if (Math.hypot(wx - you.x, wy - you.y) > 0.7) {
      tgt = Math.atan2(wy - you.y, wx - you.x);
    }
  } else if (you.keyAngle !== null) tgt = you.keyAngle;
  if (tgt !== null) {
    let da = ((tgt - you.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    const maxTurn = TURN_RATE * dt;
    you.angle += Math.max(-maxTurn, Math.min(maxTurn, da));
  }
  you.dx = Math.cos(you.angle);
  you.dy = Math.sin(you.angle);
}

// ---------------------------------------------------------------------
// THE RULES OF PAPER
// ---------------------------------------------------------------------
function pctOwned(id) {
  let n = 0;
  for (let i = 0; i < own.length; i++) if (own[i] === id) n++;
  return n / own.length * 100;
}

// coming home: your trail plus everything it enclosed becomes yours.
// trick: flood-fill from the OUTSIDE — whatever the flood can't reach
// is surrounded, and surrounded means CAPTURED.
function capture(ent) {
  const id = ent.p.id;
  for (const c of ent.myTrail) own[c] = id;
  const reach = new Uint8Array(GW * GH);
  const q = [];
  for (let x = 0; x < GW; x++) {
    for (const y of [0, GH - 1]) {
      if (own[idx(x, y)] !== id && !reach[idx(x, y)]) { reach[idx(x, y)] = 1; q.push(idx(x, y)); }
    }
  }
  for (let y = 0; y < GH; y++) {
    for (const x of [0, GW - 1]) {
      if (own[idx(x, y)] !== id && !reach[idx(x, y)]) { reach[idx(x, y)] = 1; q.push(idx(x, y)); }
    }
  }
  while (q.length) {
    const c = q.pop();
    const cx = c % GW, cy = (c / GW) | 0;
    for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const n = idx(nx, ny);
      if (!reach[n] && own[n] !== id) { reach[n] = 1; q.push(n); }
    }
  }
  let gained = 0;
  for (let i = 0; i < own.length; i++) {
    if (!reach[i] && own[i] !== id) { own[i] = id; gained++; }
  }
  gained += ent.myTrail.length;
  for (const c of ent.myTrail) trail[c] = 0;
  ent.myTrail = [];
  ent.out = false;
  if (ent.p.isYou) claimSound(gained);
  return gained;
}

function kill(ent, byYou) {
  if (byYou && !ent.p.isYou) {
    psave.kills++;
    persistP();
    if (psave.kills === 3) {
      setBanner('🚽 THE TOILET SKIN IS UNLOCKED!!');
      towerSound();
    }
  }
  ent.alive = false;
  ent.respawnT = 3;
  for (const c of ent.myTrail) trail[c] = 0;
  ent.myTrail = [];
  for (let i = 0; i < own.length; i++) if (own[i] === ent.p.id) own[i] = 0;
  minis = minis.filter(m => m.ownerId !== ent.p.id);   // minis mourn instantly
  if (ent.p.isYou) {
    gameOver = true;
    deathSound();
  } else if (byYou) killSound();
}

// one entity arrives at a fresh cell — the heart of the whole game
function enterCell(ent, cx, cy) {
  const c = idx(cx, cy);
  // touching ANY wet trail pops its owner — even your own. the ONLY
  // mercy: the last few cells you inked yourself, because a smooth
  // curve brushes its own fresh paint without truly crossing it.
  if (trail[c]) {
    const grazingOwnFreshInk =
      trail[c] === ent.p.id && ent.myTrail.slice(-3).includes(c);
    if (!grazingOwnFreshInk) {
      const victim = ents.find(o => o.alive && o.p.id === trail[c]);
      if (victim) kill(victim, ent.p.isYou && victim !== ent);
      if (victim === ent) return;            // you popped yourself. rough.
    } else return;                           // grazed it. breathe. drive on.
  }
  if (!ent.alive) return;
  if (own[c] === ent.p.id) {
    if (ent.out) {
      const gained = capture(ent);
      if (ent.p.isYou && gained > 3) {
        setBanner('+' + gained + ' squares!');
      }
    }
  } else {
    ent.out = true;
    ent.myTrail.push(c);
    trail[c] = ent.p.id;
  }
}

function setBanner(t) { banner = t; bannerT = 2; }

// ---------------------------------------------------------------------
// BOT BRAINS — go out, draw a rectangle, come home. mostly survive.
// ---------------------------------------------------------------------
function botThink(ent) {
  const cx = Math.floor(ent.x), cy = Math.floor(ent.y);
  if (!ent.plan.length) {
    if (!ent.out) {
      // plan a sortie: a rectangle loop out into the wild
      const w = 4 + Math.floor(Math.random() * 9);
      const h = 3 + Math.floor(Math.random() * 8);
      const dirH = Math.random() < 0.5 ? -1 : 1;
      const dirV = Math.random() < 0.5 ? -1 : 1;
      ent.plan = [
        { dx: dirH, dy: 0, n: w },
        { dx: 0, dy: dirV, n: h },
        { dx: -dirH, dy: 0, n: w },
        { dx: 0, dy: -dirV, n: h + 2 },      // overshoot home a touch
      ];
    } else {
      ent.plan = [{ dx: -Math.sign(ent.dx) || 1, dy: 0, n: 3 }];
    }
  }
  const step = ent.plan[0];
  // safety: don't steer off the paper — bend along the wall instead
  let dx = step.dx, dy = step.dy;
  if (cx + dx < 1 && dx < 0) { dx = 0; dy = cy > GH / 2 ? -1 : 1; ent.plan = []; }
  if (cx + dx > GW - 2 && dx > 0) { dx = 0; dy = cy > GH / 2 ? -1 : 1; ent.plan = []; }
  if (cy + dy < 1 && dy < 0) { dy = 0; dx = cx > GW / 2 ? -1 : 1; ent.plan = []; }
  if (cy + dy > GH - 2 && dy > 0) { dy = 0; dx = cx > GW / 2 ? -1 : 1; ent.plan = []; }
  // safety: never step on your own wet ink
  const n = idx(cx + dx, cy + dy);
  if (trail[n] === ent.p.id) {
    const alt = [[dy, dx], [-dy, -dx]].find(([ax, ay]) =>
      trail[idx(cx + ax, cy + ay)] !== ent.p.id &&
      cx + ax > 0 && cx + ax < GW - 1 && cy + ay > 0 && cy + ay < GH - 1);
    if (alt) { dx = alt[0]; dy = alt[1]; ent.plan = []; }
  }
  ent.nextDx = dx;
  ent.nextDy = dy;
  if (ent.plan.length && --ent.plan[0].n <= 0) ent.plan.shift();
}

// ---------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------
const SPEED = 7.5;          // cells per second — everyone's equal here
function update(dt) {
  elapsed += dt;
  if (bannerT > 0) bannerT -= dt;
  if (gameOver) return;

  for (const ent of ents) {
    if (!ent.alive) {
      ent.respawnT -= dt;
      if (ent.respawnT <= 0 && !ent.p.isYou) {
        // a bot returns, humbly, somewhere random-ish and empty-ish
        const cx = 6 + Math.floor(Math.random() * (GW - 12));
        const cy = 6 + Math.floor(Math.random() * (GH - 12));
        stampSquare(ent.p.id, cx, cy, 2);
        Object.assign(ent, makeEnt(ent.p, cx, cy));
      }
      continue;
    }
    if (ent.p.isYou) steerSmooth(ent, dt);    // you: silky angle steering
    ent.x += ent.dx * SPEED * dt;
    ent.y += ent.dy * SPEED * dt;
    // the paper's edge gently turns you instead of squishing you flat
    if (ent.p.isYou) {
      if ((ent.x <= 0.6 && ent.dx < 0) || (ent.x >= GW - 0.6 && ent.dx > 0)) {
        ent.angle = Math.PI - ent.angle;
      }
      if ((ent.y <= 0.6 && ent.dy < 0) || (ent.y >= GH - 0.6 && ent.dy > 0)) {
        ent.angle = -ent.angle;
      }
    }
    ent.x = Math.max(0.5, Math.min(GW - 0.5, ent.x));
    ent.y = Math.max(0.5, Math.min(GH - 0.5, ent.y));
    const cx = Math.floor(ent.x), cy = Math.floor(ent.y);
    const c = idx(cx, cy);
    if (c !== ent.lastCell) {
      ent.lastCell = c;
      enterCell(ent, cx, cy);
      if (!ent.alive) continue;
      // bots still turn at cell boundaries, square and steady
      if (!ent.p.isYou) {
        botThink(ent);
        if ((ent.nextDx !== ent.dx || ent.nextDy !== ent.dy)) {
          ent.dx = ent.nextDx;
          ent.dy = ent.nextDy;
          ent.x = cx + 0.5;
          ent.y = cy + 0.5;
        }
      }
    }
  }

  // ---- towers change hands with the land they stand on ----
  for (const t of towers) {
    const o = own[idx(t.x, t.y)];
    if (o && o !== t.claimedBy) {
      t.claimedBy = o;
      spawnMinis(o, t.x, t.y);
      if (o === 1) {
        setBanner('TOWER CAPTURED — 3 mini-yous deployed!!');
        towerSound();
      }
    }
  }

  // ---- the minis: tiny, loyal, hungry for squares ----
  for (const m of minis) {
    m.life -= dt;
    m.x += m.dx * 6 * dt;
    m.y += m.dy * 6 * dt;
    m.x = Math.max(0.5, Math.min(GW - 0.5, m.x));
    m.y = Math.max(0.5, Math.min(GH - 0.5, m.y));
    const cx = Math.floor(m.x), cy = Math.floor(m.y);
    const c = idx(cx, cy);
    if (c !== m.lastCell) {
      m.lastCell = c;
      // a mini paints every square it crosses (but never touches ink)
      if (own[c] !== m.ownerId && !trail[c]) own[c] = m.ownerId;
      // steering: hunt for squares that aren't ours yet
      const options = [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .filter(([dx, dy]) => !(dx === -m.dx && dy === -m.dy))
        .filter(([dx, dy]) => cx + dx > 0 && cx + dx < GW - 1 &&
                              cy + dy > 0 && cy + dy < GH - 1);
      const tasty = options.filter(([dx, dy]) => own[idx(cx + dx, cy + dy)] !== m.ownerId);
      const pool = tasty.length && Math.random() < 0.8 ? tasty : options;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (pick && (Math.random() < 0.4 || own[idx(cx + m.dx, cy + m.dy)] === m.ownerId)) {
        m.dx = pick[0]; m.dy = pick[1];
        m.x = cx + 0.5; m.y = cy + 0.5;
      }
    }
    // an enemy head squishes a mini on contact
    for (const ent of ents) {
      if (!ent.alive || ent.p.id === m.ownerId) continue;
      if (Math.hypot(ent.x - m.x, ent.y - m.y) < 0.9) {
        m.life = 0;
        miniPopSound();
      }
    }
  }
  minis = minis.filter(m => m.life > 0);

  // milestones deserve a little noise
  const pct = pctOwned(1);
  bestPct = Math.max(bestPct, pct);
  if (pct > psave.best) {
    const hadDonut = psave.best >= 10.5;
    psave.best = pct;
    persistP();
    if (!hadDonut && pct >= 10.5) {
      setBanner('🍩 THE SHINY DONUT SKIN IS UNLOCKED!!');
      towerSound();
    }
  }
  if (pct >= milestone) {
    setBanner(milestone + '% OF THE PAPER IS YOURS!');
    claimSound(200);
    milestone += 25;
  }

  const you = ents[0];
  camX = you.x * CELL - canvas.width / 2;
  camY = you.y * CELL - canvas.height / 2;
  camX = Math.max(-80, Math.min(GW * CELL - canvas.width + 80, camX));
  camY = Math.max(-80, Math.min(GH * CELL - canvas.height + 80, camY));
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#d8d0b8';               // the desk under the paper
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-camX, -camY);

  // the paper itself
  ctx.fillStyle = '#f2ecd8';
  ctx.fillRect(0, 0, GW * CELL, GH * CELL);

  // visible cell range only — the paper is big
  const x0 = Math.max(0, Math.floor(camX / CELL));
  const y0 = Math.max(0, Math.floor(camY / CELL));
  const x1 = Math.min(GW, Math.ceil((camX + W) / CELL));
  const y1 = Math.min(GH, Math.ceil((camY + H) / CELL));

  for (let y = y0; y < y1; y++) {
    for (let x = x0; x < x1; x++) {
      const c = idx(x, y);
      if (own[c]) {
        const p = PLAYERS[own[c] - 1];
        ctx.fillStyle = p.color;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
      if (trail[c]) {
        const p = PLAYERS[trail[c] - 1];
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = p.color;
        ctx.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);
        ctx.globalAlpha = 1;
      }
    }
  }
  // faint grid, like real graph paper
  ctx.strokeStyle = 'rgba(120, 110, 80, 0.1)';
  ctx.lineWidth = 1;
  for (let x = x0; x <= x1; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, y0 * CELL); ctx.lineTo(x * CELL, y1 * CELL); ctx.stroke();
  }
  for (let y = y0; y <= y1; y++) {
    ctx.beginPath(); ctx.moveTo(x0 * CELL, y * CELL); ctx.lineTo(x1 * CELL, y * CELL); ctx.stroke();
  }

  // the towers: stone turrets flying the flag of whoever holds them
  for (const t of towers) {
    const px = t.x * CELL + CELL / 2, py = t.y * CELL + CELL / 2;
    ctx.fillStyle = '#9a9284';
    ctx.fillRect(px - 9, py - 8, 18, 18);
    ctx.fillStyle = '#7a7264';                       // crenellations
    for (let i = -1; i <= 1; i++) ctx.fillRect(px - 9 + (i + 1) * 6.5 - 1.5, py - 13, 5, 6);
    ctx.fillStyle = '#5a5244';                       // the little door
    ctx.fillRect(px - 3, py + 2, 6, 8);
    // the flag
    ctx.strokeStyle = '#5a5244';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py - 13);
    ctx.lineTo(px, py - 24);
    ctx.stroke();
    ctx.fillStyle = t.claimedBy ? PLAYERS[t.claimedBy - 1].color : '#c8c0a8';
    ctx.beginPath();
    ctx.moveTo(px, py - 24);
    ctx.lineTo(px + 11 + Math.sin(elapsed * 4 + t.x) * 2, py - 20);
    ctx.lineTo(px, py - 16);
    ctx.fill();
  }

  // the minis: half-pint clones — wearing the boss's skin, naturally
  for (const m of minis) {
    const p = PLAYERS[m.ownerId - 1];
    const fade = Math.min(1, m.life / 2);            // they fade near the end
    ctx.globalAlpha = fade;
    drawHead(m.x * CELL, m.y * CELL, 0.55,
             m.ownerId === 1 ? psave.skin : 'block', m.dx, m.dy, p);
    ctx.globalAlpha = 1;
  }

  // the heads, dressed in whatever they've earned
  for (const ent of ents) {
    if (!ent.alive) continue;
    const px = ent.x * CELL, py = ent.y * CELL;
    drawHead(px, py, 1, ent.p.isYou ? psave.skin : 'block', ent.dx, ent.dy, ent.p);
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(40, 36, 24, 0.75)';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(ent.p.name, px, py - CELL * 0.95);
  }
  ctx.restore();

  drawHud(W, H);
}

// one head, any size, any outfit
function drawHead(px, py, sc, skin, dx, dy, p) {
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(sc, sc);
  const ex = dx * 3, ey = dy * 3;
  if (skin === 'toilet') {
    ctx.fillStyle = '#e8e8f0';                     // the tank
    ctx.beginPath();
    ctx.roundRect(-12, -14, 24, 12, 3);
    ctx.fill();
    ctx.fillStyle = '#ffffff';                     // the bowl
    ctx.beginPath();
    ctx.ellipse(0, 6, 13, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#b8b8c8';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#d8ecf8';                     // the water. don't ask.
    ctx.beginPath();
    ctx.ellipse(0, 6, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c8c8d8';                     // flush handle
    ctx.fillRect(7, -12, 4, 3);
    ctx.fillStyle = '#1a1a22';                     // eyes on the tank
    ctx.beginPath();
    ctx.arc(-5 + ex, -8 + ey, 2, 0, Math.PI * 2);
    ctx.arc(5 + ex, -8 + ey, 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (skin === 'donut') {
    ctx.fillStyle = '#c8955a';                     // the dough
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f078a8';                     // the icing
    ctx.beginPath();
    ctx.arc(0, 0, 14, Math.PI, Math.PI * 2.35);
    ctx.arc(0, 0, 8, Math.PI * 2.2, Math.PI, true);
    ctx.fill();
    ctx.fillStyle = '#f2ecd8';                     // the hole
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    // sprinkles
    const sprinkleCols = ['#fff', '#ffd23f', '#7ddf8f', '#3a9ad9'];
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI * 0.9 + i * 0.35;
      ctx.strokeStyle = sprinkleCols[i % 4];
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
      ctx.lineTo(Math.cos(a) * 10 + 3, Math.sin(a) * 10 + 1);
      ctx.stroke();
    }
    // the SHINE — it's not a shiny donut without the glint
    const ga = elapsed * 3;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + Math.sin(ga * 2) * 0.3})`;
    ctx.beginPath();
    ctx.arc(Math.cos(ga) * 9, Math.sin(ga) * 9, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a22';                     // eyes on the icing
    ctx.beginPath();
    ctx.arc(-5 + ex, -7 + ey, 2, 0, Math.PI * 2);
    ctx.arc(4 + ex, -8 + ey, 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = p.dark;
    ctx.beginPath();
    ctx.roundRect(-CELL * 0.6, -CELL * 0.6, CELL * 1.2, CELL * 1.2, 6);
    ctx.fill();
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.roundRect(-CELL * 0.48, -CELL * 0.48, CELL * 0.96, CELL * 0.96, 5);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-5 + ex, -2 + ey, 4, 0, Math.PI * 2);
    ctx.arc(5 + ex, -2 + ey, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a22';
    ctx.beginPath();
    ctx.arc(-5 + ex * 1.6, -2 + ey * 1.6, 2, 0, Math.PI * 2);
    ctx.arc(5 + ex * 1.6, -2 + ey * 1.6, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawMenu(W, H) {
  uiRects = [];
  ctx.fillStyle = '#f2ecd8';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120, 110, 80, 0.12)';
  for (let x = 0; x < W; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += CELL) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a3428';
  ctx.font = `bold ${Math.min(56, W / 11)}px monospace`;
  ctx.fillText('PAPER WARS', W / 2, H * 0.24);
  ctx.font = '15px monospace';
  ctx.fillStyle = '#7a7260';
  ctx.fillText('rivals destroyed: ' + psave.kills + '   —   best coverage: ' +
               psave.best.toFixed(1) + '%', W / 2, H * 0.24 + 34);
  // your current look, admiring itself
  drawHead(W / 2, H * 0.4, 1.6, psave.skin, Math.sin(elapsed * 1.5), 0, PLAYERS[0]);
  const bw = Math.min(W - 60, 300), bh = 62;
  for (const [i, [id, label, col]] of [['play', '▶ PLAY', '#3a9ad9'], ['skins', '👕 SKINS', '#e8953c']].entries()) {
    const y = H * 0.52 + i * 80;
    uiRects.push({ x: W / 2 - bw / 2, y, w: bw, h: bh, id });
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(W / 2 - bw / 2, y, bw, bh);
    ctx.strokeStyle = col;
    ctx.lineWidth = 3;
    ctx.strokeRect(W / 2 - bw / 2, y, bw, bh);
    ctx.fillStyle = col;
    ctx.font = 'bold 24px monospace';
    ctx.fillText(label, W / 2, y + 40);
  }
}

function drawSkins(W, H) {
  uiRects = [];
  ctx.fillStyle = '#f2ecd8';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a3428';
  ctx.font = `bold ${Math.min(40, W / 14)}px monospace`;
  ctx.fillText('👕 SKINS', W / 2, 56);
  SKINS.forEach((sk, i) => {
    const cw = Math.min(W - 40, 460), x = W / 2 - cw / 2, y = 90 + i * 110;
    const un = sk.unlocked();
    const worn = psave.skin === sk.id;
    uiRects.push({ x, y, w: cw, h: 96, id: 'skin_' + sk.id });
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x, y, cw, 96);
    ctx.strokeStyle = worn ? '#3a9ad9' : un ? '#7a9a5a' : '#b8b098';
    ctx.lineWidth = worn ? 4 : 2;
    ctx.strokeRect(x, y, cw, 96);
    ctx.save();
    if (!un) ctx.globalAlpha = 0.35;
    drawHead(x + 52, y + 48, 1.5, sk.id, 1, 0, PLAYERS[0]);
    ctx.restore();
    ctx.textAlign = 'left';
    ctx.fillStyle = un ? '#3a3428' : '#9a9280';
    ctx.font = 'bold 19px monospace';
    ctx.fillText(sk.name + (worn ? '  ✓ wearing it' : ''), x + 104, y + 38);
    ctx.font = '13px monospace';
    ctx.fillStyle = '#7a7260';
    ctx.fillText(un ? sk.how : '🔒 ' + sk.how + (sk.progress ? '  (' + sk.progress() + ')' : ''),
                 x + 104, y + 64);
    ctx.textAlign = 'center';
  });
  const y = 90 + SKINS.length * 110 + 8;
  uiRects.push({ x: W / 2 - 100, y, w: 200, h: 50, id: 'back' });
  ctx.strokeStyle = '#3a9ad9';
  ctx.lineWidth = 3;
  ctx.strokeRect(W / 2 - 100, y, 200, 50);
  ctx.fillStyle = '#3a9ad9';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('← BACK', W / 2, y + 33);
}

function drawHud(W, H) {
  uiRects = [];
  // your share of the world, front and center
  const pct = pctOwned(1);
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(40, 36, 24, 0.85)';
  ctx.font = `bold ${Math.min(34, W / 16)}px monospace`;
  ctx.fillText(pct.toFixed(1) + '%', 16, 44);
  ctx.font = '13px monospace';
  ctx.fillText('best: ' + bestPct.toFixed(1) + '%', 16, 64);

  // the leaderboard
  const board = PLAYERS.map(p => ({ p, pct: pctOwned(p.id) }))
    .sort((a, b) => b.pct - a.pct);
  ctx.textAlign = 'right';
  ctx.font = 'bold 14px monospace';
  board.forEach((row, i) => {
    ctx.fillStyle = row.p.color;
    ctx.fillRect(W - 150, 20 + i * 24, 14, 14);
    ctx.fillStyle = 'rgba(40, 36, 24, 0.85)';
    ctx.fillText(row.p.name + '  ' + row.pct.toFixed(1) + '%', W - 20, 32 + i * 24);
  });
  ctx.textAlign = 'center';

  if (bannerT > 0) {
    ctx.fillStyle = `rgba(40, 36, 24, ${Math.min(1, bannerT)})`;
    ctx.font = `bold ${Math.min(26, W / 20)}px monospace`;
    ctx.fillText(banner, W / 2, H * 0.18);
  }

  const you = ents[0];
  if (you.out && !gameOver) {
    ctx.fillStyle = `rgba(200, 60, 40, ${0.5 + Math.sin(elapsed * 5) * 0.3})`;
    ctx.font = 'bold 14px monospace';
    ctx.fillText('your trail is EXPOSED — get home!', W / 2, H - 30);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(30, 26, 18, 0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f2ecd8';
    ctx.font = `bold ${Math.min(44, W / 14)}px monospace`;
    ctx.fillText('CUT!', W / 2, H / 2 - 40);
    ctx.font = '18px monospace';
    ctx.fillText('you held ' + bestPct.toFixed(1) + '% of the paper at your best', W / 2, H / 2 + 4);
    ctx.fillStyle = 'rgba(242, 236, 216, 0.7)';
    ctx.font = '15px monospace';
    ctx.fillText('tap or space to try again', W / 2, H / 2 + 40);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.04, (time - lastTime) / 1000);
  lastTime = time;
  elapsed += screen === 'play' ? 0 : dt;   // menus keep their sparkle moving
  if (screen === 'menu') drawMenu(canvas.width, canvas.height);
  else if (screen === 'skins') drawSkins(canvas.width, canvas.height);
  else { update(dt); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
