  // you can't walk off it. It sinks through the hole in the floor, the
  // screen fades to black, and then you're DOWN BELOW.
  if (elevator && elevator.riding) {
    elevator.drop -= ELEVATOR_SPEED * dt;
    player.y = elevator.drop;
    player.vx = player.vy = player.vz = 0;
    blackout = Math.min(1, -elevator.drop / 4);
    if (elevator.drop < -4.5) {
      loadLevel(levelIndex + 1);
      elevatorDing();
      say('*DING* ...where ARE we?', 3);
    }
    return;
  }
  // Step onto the elevator and it starts going down.
  if (elevator && player.onGround &&
      Math.abs(player.x - elevator.x) < 0.85 && Math.abs(player.z - elevator.z) < 0.85) {
    elevator.riding = true;
    player.x = elevator.x; player.z = elevator.z;   // stand in the middle
    elevatorHum();
    say('Going down...', 2);
  }

  // SAWS: slide side to side (sin goes smoothly back and forth between
  // -1 and 1, forever), and spin. Touch one and... OUCH.
  for (const s of saws) {
    s.x = s.middle + Math.sin(now * s.speed) * s.slide;
    s.spin += dt * 12;
    const touching =
      Math.abs(player.x - s.x) < s.radius + BODY_RADIUS - 0.1 &&   // side to side
      Math.abs(player.z - s.z) < BODY_RADIUS + 0.1 &&              // front to back
      player.y < s.y + s.radius && player.y + BODY_HEIGHT > s.y - s.radius;   // up and down
    if (touching) {
      ouch();
      falls++;
      flash = 0.7; flashColor = '255, 60, 60';
      say('BZZZZZRRRT! 🪚 The saw got you!', 2);
      respawn();
      break;
    }
  }

  // SPIKES! If your feet are on a spiky square, OUCH.
  for (const s of spikeCells) {
    const floorY = s.y || 0;
    if (player.y < floorY + 0.5 && player.y > floorY - 0.3 &&
        player.x > s.minX - 0.1 && player.x < s.maxX + 0.1 &&
        player.z > s.minZ - 0.1 && player.z < s.maxZ + 0.1) {
      ouch();
      falls++;
      flash = 0.7; flashColor = '255, 60, 60';
      say('OUCH! 🦔 Spiky spiky spiky!', 2);
      respawn();
      break;
    }
  }

  // Which way are you pushing? forward/back and left/right, each -1 to 1.
  let forward = 0, strafe = 0;
  if (keys.KeyW || keys.ArrowUp)    forward += 1;
  if (keys.KeyS || keys.ArrowDown)  forward -= 1;
  if (keys.KeyD || keys.ArrowRight) strafe += 1;
  if (keys.KeyA || keys.ArrowLeft)  strafe -= 1;
  if (stick.active) { forward -= stick.dy; strafe += stick.dx; }
  const push = Math.hypot(forward, strafe);
  if (push > 1) { forward /= push; strafe /= push; }  // no running faster diagonally!

  // Turn "forward" and "right" into real world directions, using which
  // way you're facing. sin and cos are maths for "which way is that angle".
  const fx = Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  const rx = Math.cos(player.yaw), rz = Math.sin(player.yaw);
  player.vx = (fx * forward + rx * strafe) * RUN_SPEED;
  player.vz = (fz * forward + rz * strafe) * RUN_SPEED;

  // The clock starts the moment you move.
  if (!timerRunning && !finished && push > 0) timerRunning = true;
  if (timerRunning) timeTaken += dt;

  // JUMP. "Coyote time": you can still jump for a tenth of a second after
  // running off an edge, like a cartoon coyote who hasn't looked down yet.
  // It makes jumps feel fair.
  if (player.onGround) player.lastOnGround = now;
  const wantJump = keys.Space || touchJump;
  if (wantJump && now - player.lastOnGround < 0.1 && player.vy <= 0) {
    player.vy = JUMP_POWER;
    player.lastOnGround = -1;
  }

  // GRAVITY pulls your speed downward a little bit every tick.
  player.vy -= GRAVITY * dt;

  moveX(player.vx * dt);
  moveZ(player.vz * dt);
  moveY(player.vy * dt);

  if (player.y < FALL_LIMIT) {
    falls++;
    respawn();
    say('AAAAAAAAH! Back to the start.', 2);
  }
  if (touchedLava) {
    touchedLava = false;
    falls++;
    respawn();
    say('SIZZLE! 🔥 Your shoes melted.', 2);
  }

  // WALKED INTO THE CRACK? You're right up against its wall, and lined
  // up with the crack (not off to one side of it).
  if (crackExit && !finished && Math.abs(player.x) < crackExit.halfWidth) {
    const againstWall = crackExit.facing > 0
      ? player.z - BODY_RADIUS < crackExit.z + 0.05    // the far wall
      : player.z + BODY_RADIUS > crackExit.z - 0.05;   // the wall behind the start
    if (againstWall) {
      flash = 1; flashColor = '170, 60, 255';   // purple
      win();
    }
  }
  flash = Math.max(0, flash - dt * 0.4);   // the flash fades away

  if (puzzle) checkButtons();

  // Finished a level? After a little pause, on to the next one.
  if (nextLevelAt && now >= nextLevelAt) {
    nextLevelAt = 0;
    loadLevel(levelIndex + 1);
  }
}

// ---------------------------------------------------------------------
//  DRAWING.
// ---------------------------------------------------------------------
const NEAR = 0.05;   // anything closer than this to your eyes gets cut off

// Move a world point so it's measured from your eyes, facing your way.
// After this, z means "how far in front of you" and x means "how far right".
function toCamera(p) {
  const dx = p[0] - player.x, dy = p[1] - (player.y + EYE_HEIGHT), dz = p[2] - player.z;
  const cy0 = Math.cos(player.yaw), sy0 = Math.sin(player.yaw);
  const x = dx * cy0 + dz * sy0;          // right
  const z0 = dx * sy0 - dz * cy0;         // forward
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const y = dy * cp - z0 * sp;            // up (after tilting your head)
  const z = z0 * cp + dy * sp;            // forward (after tilting your head)
  return [x, y, z];
}

// Chop off the part of a shape that's behind your eyes. If we didn't,
// things behind you would get drawn upside down in front of you. Spooky.
function clipNear(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const aIn = a[2] > NEAR, bIn = b[2] > NEAR;
    if (aIn) out.push(a);
    if (aIn !== bIn) {
      const t = (NEAR - a[2]) / (b[2] - a[2]);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
    }
  }
  return out;
}

function draw() {
  const focal = H * 0.8;   // bigger number = more zoomed in

  const level = LEVELS[levelIndex];
  const FOG = fogOverride || level.fogColor;
  const time = performance.now() / 1000;

  ctx.save();
  // SHAKY? Move the world (translate), tilt it (rotate), and zoom in a
  // bit (scale) so the shaking doesn't show the edges of the world.
  if (puncher) {
    const shake = screenShake();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2 + shake.x, H / 2 + shake.y);
    ctx.rotate(shake.tilt);
    ctx.scale(1.15, 1.15);
    ctx.translate(-W / 2, -H / 2);
  }

  if (level.sky) {
    // The sky, with a hazy glow at the horizon. Where's the horizon?
    // It moves up and down the screen when you look down and up.
    const horizon = H / 2 + Math.tan(player.pitch) * focal;
    const sky = ctx.createLinearGradient(0, horizon - H, 0, horizon + H);
    const colors = level.skyColors || ['#3a6fc0', '#b8d4f0', '#2a3550'];
    sky.addColorStop(0, colors[0]);
    sky.addColorStop(0.5, colors[1]);
    sky.addColorStop(1, colors[2]);
    ctx.fillStyle = sky;
  } else {
    // Inside a tunnel there's no sky. Just the dark, far away.
    ctx.fillStyle = 'rgb(' + FOG.join(',') + ')';
  }
  ctx.fillRect(0, 0, W, H);

  // Work out every face we can see, and how far away it is.
  const eye = [player.x, player.y + EYE_HEIGHT, player.z];
  const visible = [];
  for (const f of faces) {
    // MOVING THINGS. The elevator's pieces get moved down by however far
    // it has dropped, and the truck's pieces get lifted UP by however
    // high the truck is. We work this out FIRST, because everything
    // below needs to know where the face really is right now.
    // Saws spin and slide, so ask where their corners are right now.
    // Growing wall cracks get bigger every frame, so work out their corners too.
    if (f.wallCrack) {
      f.corners = wallCrackCorners(f);
      f.mid = [f.wallCrack.x, f.wallCrack.y, f.wallCrack.z];
    }
    // GHOSTS that are glitching flicker (sometimes we just don't draw
    // them), and jump about sideways.
    let jumpX = 0, ghostGlitch = false;
    if (f.ghost && ghostGlitching(f.ghost, time)) {
      if (Math.random() < 0.45) continue;
      ghostGlitch = true;
      jumpX = (Math.random() - 0.5) * 0.8;
    }

    if (f.saw) {
      f.corners = sawCorners(f);
      f.mid = [f.saw.x, f.saw.y, f.saw.z];
    }

    let lift = 0, shift = 0;
    if (f.elevator && elevator) lift = elevator.drop;
    if (f.truck && truck) { lift = truck.y; shift = truck.ahead; }
    // Floating things bob gently up and down.
    if (f.bob) lift = Math.sin(time * f.bob.speed + f.bob.phase) * f.bob.amp;

    // BACKFACE CULLING: if a face is pointing away from you, you can't
    // see it anyway (it's the back of something), so don't bother.
    const n = f.normal, c = f.corners[0];
    if (n[0] * (eye[0] - c[0]) + n[1] * (eye[1] - (c[1] + lift)) + n[2] * (eye[2] - (c[2] + shift)) <= 0) continue;

    // Too far away to see through the fog? Skip it. This keeps the game
    // fast, because the tunnel has thousands of bricks and tiles.
    const m = f.mid;
    const dist = Math.hypot(m[0] - eye[0], m[1] + lift - eye[1], m[2] + shift - eye[2]);
    // (Glowing things shine through the fog, so never skip those.)
    if (dist > level.fogDistance + 2 && !f.glow) continue;

    const corners = (lift || shift || jumpX)
      ? f.corners.map(function (c) { return [c[0] + jumpX, c[1] + lift, c[2] + shift]; })
      : f.corners;
    const pts = clipNear(corners.map(toCamera));
    if (pts.length < 3) continue;   // it was all behind you
    // Things with a "layer" get painted last, on top, in layer order.
    // We do that by pretending they're super close.
    let paintOrder = f.layer ? -f.layer : dist;
    // Growing wall cracks are different: they only need to beat the bricks
    // RIGHT BEHIND them, not everything. So we pretend they're just a bit
    // closer (2 steps) than they really are. Then a truck in front of one
    // still covers it up, like it should.
    if (f.wallCrack) paintOrder = dist - 2 - f.layer * 0.01;
    // Same for the exit cracks, but 3 steps (some walls have bigger bricks).
    else if (f.glow) paintOrder = dist - 3 - f.layer * 0.01;
    visible.push({ pts: pts, face: f, dist: dist, paintOrder: paintOrder, ghostGlitch: ghostGlitch });
  }

  // YOUR SHADOW. It goes in the list too, so it gets painted in the right
  // order. We pretend it's a bit closer than it is, so it always lands ON
  // TOP of the floor tiles it's lying on.
  const shadow = playerShadow();
  if (shadow) {
    const pts = clipNear(shadow.corners.map(toCamera));
    if (pts.length >= 3) {
      const d = Math.hypot(player.x - eye[0], shadow.y - eye[1], player.z - eye[2]);
      visible.push({ pts: pts, shadow: shadow, paintOrder: d - 1 });
    }
  }

  // THE PAINTER'S ALGORITHM: farthest first, nearest last.
  visible.sort(function (a, b) { return b.paintOrder - a.paintOrder; });

  for (const v of visible) {
    // The shadow is just a see-through dark shape. Paint it and move on.
    if (v.shadow) {
      ctx.beginPath();
      v.pts.forEach(function (p, i) {
        const sx = W / 2 + (p[0] / p[2]) * focal, sy = H / 2 - (p[1] / p[2]) * focal;
        if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      });
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 0, 0, ' + v.shadow.darkness + ')';
      ctx.fill();
      continue;
    }

    const f = v.face;
    let color = f.color;

    // LAVA BUBBLES. The green part of the colour goes up and down over
    // time, so the lava flickers between deep red and bright orange.
    // Each square starts at a different spot in the wobble, so they don't
    // all flash together.
    if (f.lava) {
      const wobble = Math.sin(time * 3 + f.mid[0] * 2.1 + f.mid[2] * 1.7);
      color = [255, 80 + wobble * 50, wobble > 0.8 ? 40 : 0];
    }

    // BUTTONS that you've pushed the right way light up: their colour
    // gets mixed halfway to white, so they look like they're glowing.
    // A glitching ghost flashes pink or blue.
    if (v.ghostGlitch) {
      const GLITCH_COLORS = [[255, 0, 255], [0, 255, 255], color];
      color = GLITCH_COLORS[Math.floor(Math.random() * GLITCH_COLORS.length)];
    }

    if (f.button && f.button.lit) {
      color = color.map(function (c) { return c + (255 - c) * 0.55; });
    }

    // FOG: far things fade toward the fog colour. It makes distances
    // easier to judge, which matters a LOT when you're about to jump.
    // Lava glows, so it fades much less.
    let fog = Math.min(1, v.dist / level.fogDistance);
    if (f.lava) fog *= 0.4;
    if (f.glow) fog = 0;   // the crack is SO bright, fog can't hide it

    // THE CRACK PULSES: brighter, dimmer, brighter, like it's breathing.
    let pulse = 1;
    if (f.glow) {
      pulse = 0.75 + 0.25 * Math.sin(time * 4);
      color = color.map(function (c) { return c * (0.7 + 0.3 * pulse); });
    }
    const mix = function (c) {
      return 'rgb(' + c.map(function (val, i) {
        return Math.round(val + (FOG[i] - val) * fog);
      }).join(',') + ')';
    };
    const col = mix(color);

    ctx.beginPath();
    for (let i = 0; i < v.pts.length; i++) {
      const p = v.pts[i];
      // THE 3D SQUASH: divide by how far away it is. Far = small.
      const sx = W / 2 + (p[0] / p[2]) * focal;
      const sy = H / 2 - (p[1] / p[2]) * focal;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fillStyle = col;
    if (f.glow) {
      // A blurry purple "shadow" that's actually light. That's the glow.
      ctx.shadowColor = 'rgb(190, 80, 255)';
      // (The growing cracks skip the blur: it's slow to draw, and there can
      // be 100 of them. Their see-through halo is glowy enough.)
      ctx.shadowBlur = f.wallCrack ? 0 : 40 * pulse;
      // The outer halo is see-through, so the bricks show behind it.
      ctx.globalAlpha = f.glow === 'halo' ? 0.3 * pulse : 1;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      continue;   // no outline on glowing things
    }
    ctx.fill();
    // An outline. For bricks it's the grey cement between them. For
    // everything else it's the same colour, which hides tiny cracks.
    ctx.strokeStyle = f.edge ? mix(f.edge) : col;
    ctx.lineWidth = f.edge ? 1.5 : 1;
    ctx.stroke();

    if (f.text && v.pts.length === 4) paintWords(f.text, v.pts, focal, f.textColor);
  }
  ctx.restore();

  // WHOOSH: when you go through the crack, the whole screen flashes purple.
  if (flash > 0) {
    ctx.fillStyle = 'rgba(' + flashColor + ', ' + flash + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // Going down in the elevator: everything fades to black.
  if (blackout > 0) {
    ctx.fillStyle = 'rgba(0, 0, 0, ' + blackout + ')';
    ctx.fillRect(0, 0, W, H);
  }
  // A broken screen glitches.
  drawGlitch();
  // BLINDING PURPLE LIGHT, from the explosion.
  if (blindingLight > 0) {
    ctx.fillStyle = 'rgba(235, 200, 255, ' + Math.min(1, blindingLight) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawHud();
}

// ---------------------------------------------------------------------
//  YOUR SHADOW. Imagine the sun is straight overhead. Your shadow lands
//  on whatever is right underneath you: the highest block top that's
//  below your feet. It's a dark circle, and the higher you jump, the
//  fainter and bigger it gets. In mid-air it shows where you'll LAND.
// ---------------------------------------------------------------------
const SHADOW_SIZE = 0.35;      // how big your shadow is when you're standing
const SHADOW_DARKNESS = 0.45;  // 0 = invisible, 1 = totally black

function playerShadow() {
  if (!started) return null;
  // Find the block right under you with the highest top.
  let ground = null;
  for (const b of blocks) {
    if (player.x < b.minX || player.x > b.maxX || player.z < b.minZ || player.z > b.maxZ) continue;
    if (b.maxY > player.y + 0.01) continue;              // that's above you, not below
    if (!ground || b.maxY > ground.maxY) ground = b;
  }
  if (!ground) return null;                              // nothing under you. Gulp.

  const height = player.y - ground.maxY;                 // how far up you are
  const darkness = SHADOW_DARKNESS * Math.max(0, 1 - height / 6);
  if (darkness <= 0.01) return null;
  const radius = SHADOW_SIZE * (1 + height * 0.15);
  const y = ground.maxY + 0.01;                          // a hair above the floor
  // Is there floor at this height at a spot? (Room floors are made of lots
  // of little blocks side by side, so we check ALL of them, not just one.)
  const floorAt = function (x, z) {
    return blocks.some(function (b) {
      return Math.abs(b.maxY - ground.maxY) < 0.001 &&
             x >= b.minX && x <= b.maxX && z >= b.minZ && z <= b.maxZ;
    });
  };
  // A circle made of 16 points. If a point would hang off the edge into
  // thin air, we pull it back in toward you until it's on the floor again.
  const corners = [];
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI * 2 / 16;
    let r = radius;
    let step = radius / 2;
    if (!floorAt(player.x + Math.cos(a) * r, player.z + Math.sin(a) * r)) {
      // Halve the gap each time: too far? come in. On the floor? go out.
      // Six goes gets it really close to the edge.
      r = radius / 2;
      for (let k = 0; k < 6; k++) {
        step /= 2;
        r += floorAt(player.x + Math.cos(a) * r, player.z + Math.sin(a) * r) ? step : -step;
      }
    }
    corners.push([player.x + Math.cos(a) * r, y, player.z + Math.sin(a) * r]);
  }
  return { corners: corners, y: y, darkness: darkness };
}

// PAINTING WORDS ON A WALL. We have the sign's four corners on the screen.
// transform STRETCHES and TILTS everything we draw after it, so we
// stretch a pretend flat 500x130 box to fit exactly onto the sign.
// Then we just write the words in the box, and they land on the sign,
// squashed and tilted the right way for 3D.
function paintWords(lines, pts, focal, textColor) {
  const screen = pts.map(function (p) {
    return { x: W / 2 + (p[0] / p[2]) * focal, y: H / 2 - (p[1] / p[2]) * focal };
  });
  const bottomLeft = screen[0], topRight = screen[2], topLeft = screen[3];
  const BOX_W = 500, BOX_H = 130;
  ctx.save();
  ctx.transform(
    (topRight.x - topLeft.x) / BOX_W, (topRight.y - topLeft.y) / BOX_W,
    (bottomLeft.x - topLeft.x) / BOX_H, (bottomLeft.y - topLeft.y) / BOX_H,
    topLeft.x, topLeft.y);
  ctx.fillStyle = textColor || '#2a1608';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach(function (line, i) {
    // Long words get a smaller size, so they always fit on the sign.
    let size = 52;
    ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
    const wide = ctx.measureText(line).width;
    if (wide > BOX_W * 0.92) size = Math.floor(size * BOX_W * 0.92 / wide);
    ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
    ctx.fillText(line, BOX_W / 2, BOX_H * (i + 1) / (lines.length + 1));
  });
  ctx.restore();
}

let voiceReport = '';   // what the voice report in the corner says

function drawHud() {
  if (voiceReport) {
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'left';
    const w = ctx.measureText(voiceReport).width;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(8, H - 34, w + 16, 26);
    ctx.fillStyle = '#ffe680';
    ctx.fillText(voiceReport, 16, H - 16);
  }

  // A little dot in the middle so you know where you're looking.
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 3, 0, Math.PI * 2); ctx.fill();

  // The clock and the fall counter, top right.
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 190, 10, 180, 62);
  ctx.fillStyle = '#fff';
  ctx.fillText('⏱ ' + timeTaken.toFixed(2), W - 22, 36);
  ctx.fillText('💀 falls: ' + falls, W - 22, 64);

  // Big messages in the middle.
  const now = performance.now() / 1000;
  if (now < messageUntil) {
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.06) + 'px system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000';
    ctx.fillStyle = finished ? '#ffd23f' : '#fff';
    // WORD WRAP: add words to a line until it's too wide for the screen,
    // then start a new line. Like typing in a box that's not very wide.
    const lines = [];
    let line = '';
    for (const word of message.split(' ')) {
      const tryLine = line ? line + ' ' + word : word;
      if (ctx.measureText(tryLine).width > W * 0.9 && line) {
        lines.push(line);
        line = word;
      } else {
        line = tryLine;
      }
    }
    lines.push(line);
    const lineHeight = Math.min(W, H) * 0.075;
    lines.forEach(function (l, i) {
      ctx.strokeText(l, W / 2, H * 0.3 + i * lineHeight);
      ctx.fillText(l, W / 2, H * 0.3 + i * lineHeight);
    });
  }

  // "PRESS E" when you're standing next to a button.
  if (nearButton && started) {
    const name = nearButton.color.toUpperCase();
    const hint = touchUsed ? 'Tap PUSH to push the ' + name + ' button'
                           : 'Press E to push the ' + name + ' button';
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.04) + 'px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#000';
    ctx.strokeText(hint, W / 2, H * 0.68);
    ctx.fillStyle = 'rgb(' + BUTTON_COLORS[nearButton.color].map(function (c) {
      return Math.round(c + (255 - c) * 0.35);   // a bit lighter, so it's easy to read
    }).join(',') + ')';
    ctx.fillText(hint, W / 2, H * 0.68);
  }

  // Phone controls: only drawn once a finger has touched the screen.
  if (touchUsed) {
    const b = jumpButton();
    ctx.fillStyle = touchJump ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(b.r * 0.45) + 'px system-ui, sans-serif';
    ctx.fillText('JUMP', b.x, b.y + b.r * 0.16);
    // PUSH: only there when you're next to a button.
    if (nearButton) {
      const p = pushTouchButton();
      ctx.fillStyle = 'rgba(255, 210, 60, 0.45)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(p.r * 0.45) + 'px system-ui, sans-serif';
      ctx.fillText('PUSH', p.x, p.y + p.r * 0.16);
    }
    // VOICE: a small pill at the top middle.
    const vb = voiceTouchButton();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(vb.x - vb.w / 2, vb.y - vb.h / 2, vb.w, vb.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText('🔊 VOICE', vb.x, vb.y + 5);
    if (stick.active) {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_RADIUS, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(stick.ox + stick.dx * STICK_RADIUS, stick.oy + stick.dy * STICK_RADIUS, 24, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawRobotSubtitles();
  drawPunchArms();
  drawGhostArms();
  drawCracks();

  // The menu, until you pick something.
  if (!started) drawMenu();
}

// ---------------------------------------------------------------------
//  ROBOT ARM SUBTITLES.
//  When the voice talks, a row of robot arms swings down from a metal
//  rail at the top of the screen. Each arm grabs a metal letter, swings
//  it into place, and lets go with a CLANK. Letter by letter, the arms
//  build the words. When the voice stops, the letters drop and clatter
//  away, and the arms go back up.
// ---------------------------------------------------------------------
const robo = {
  active: false,
  pieces: [],      // every metal letter
  arms: [],        // every robot arm
  fontSize: 0,
  startedAt: 0,    // when the arms started coming down
  allPlacedAt: 0,  // when the last letter got put in place (0 = not yet)
  dropAt: 0,       // when the letters started falling (0 = not yet)
  reach: 0,        // how long each arm bone is
};

// How many seconds each part of an arm's job takes. Smaller = faster arms.
const ARM_FETCH_TIME = 0.15;   // reaching up to grab a new letter
const ARM_CARRY_TIME = 0.25;   // swinging the letter to its spot
const ARM_SLIDE_TIME = 0.4;    // the arms sliding down at the start

function startRobotSubtitles(text) {
  robo.active = true;
  robo.pieces = [];
  robo.arms = [];
  robo.allPlacedAt = 0;
  robo.dropAt = 0;
  robo.startedAt = performance.now() / 1000;

  // 1. WORK OUT WHERE EVERY LETTER GOES.
  //    Word-wrap the text into lines, then measure each letter's spot.
  const fs = Math.round(Math.min(W, H) * 0.06);
  robo.fontSize = fs;
  ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const tryLine = line ? line + ' ' + word : word;
    if (ctx.measureText(tryLine).width > W * 0.85 && line) { lines.push(line); line = word; }
    else line = tryLine;
  }
  lines.push(line);

  const top = Math.max(110, H * 0.2);   // low enough to give the arms room to swing
  lines.forEach(function (l, row) {
    const lineWidth = ctx.measureText(l).width;
    const left = W / 2 - lineWidth / 2;
    const y = top + row * fs * 1.25;
    for (let i = 0; i < l.length; i++) {
      if (l[i] === ' ') continue;   // nobody needs a metal space
      // How far along the line is this letter? Measure everything before it.
      const x = left + ctx.measureText(l.slice(0, i)).width;
      const w = ctx.measureText(l[i]).width;
      robo.pieces.push({ letter: l[i], x: x + w / 2, y: y,
                         placed: false, fallSpeed: 0, spin: 0, angle: 0 });
    }
  });

  // 2. MAKE THE ARMS. Wider screens get more arms.
  //    FAIR SHARES: line all the letters up from left to right, then cut
  //    the line into equal chunks, one chunk per arm. That way no arm has
  //    to do way more work than the others. Each arm hangs right above
  //    the middle of its own chunk.
  const count = Math.max(3, Math.min(7, Math.round(W / 190)));
  const leftToRight = robo.pieces.slice().sort(function (a, b) { return a.x - b.x; });
  const share = Math.ceil(leftToRight.length / count);
  for (let i = 0; i < count; i++) {
    const chunk = leftToRight.slice(i * share, (i + 1) * share);
    if (!chunk.length) continue;
    // Do the letters in reading order: top line first, then left to right.
    chunk.sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });
    const middle = chunk.reduce(function (sum, p) { return sum + p.x; }, 0) / chunk.length;
    robo.arms.push({ baseX: middle, jobs: chunk, state: 'home',
                     t: 0, from: null, claw: null, holding: null });
  }

  // 3. HOW LONG DO THE ARM BONES NEED TO BE? Long enough that every arm
  //    can reach its farthest letter, with a bit to spare.
  let farthest = 100;
  robo.pieces.forEach(function (p) {
    for (const arm of robo.arms) {
      if (arm.jobs.indexOf(p) === -1) continue;
      farthest = Math.max(farthest, Math.hypot(p.x - arm.baseX, p.y - fs * 0.55));
    }
  });
  robo.reach = farthest * 0.6;   // two bones of 0.6 each = 1.2x the reach needed

  robo.arms.forEach(function (arm) {
    arm.claw = restSpot(arm);
    arm.state = arm.jobs.length ? 'fetch' : 'home';
    arm.from = restSpot(arm);
  });
}

// Where the shoulder of an arm is. It slides down from above the screen
// at the start, and back up at the end.
function shoulder(arm) {
  const now = performance.now() / 1000;
  let hidden = 1 - smooth((now - robo.startedAt) / ARM_SLIDE_TIME);
  if (robo.dropAt) hidden = smooth((now - robo.dropAt) / 1.2);
  return { x: arm.baseX, y: 10 - hidden * (robo.reach * 2 + 60) };
}
// Where an arm waits, and grabs new letters from: just below its shoulder.
function restSpot(arm) {
  const s = shoulder(arm);
  return { x: s.x + robo.reach * 0.3, y: s.y + robo.reach * 0.5 };
}
// Where the claw goes to put a letter down: just above the letter's middle.
function dropSpot(piece) {
  return { x: piece.x, y: piece.y - robo.fontSize * 0.55 };
}

// SMOOTH turns a straight 0-to-1 into a gentle one: slow start, fast
// middle, slow finish. It's what makes the arms look like machines and
// not like teleporting robots.
function smooth(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}
function between(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function updateRobotSubtitles(dt) {
  if (!robo.active) return;
  const now = performance.now() / 1000;

  for (const arm of robo.arms) {
    if (arm.state === 'fetch') {
      // Reaching back up to grab the next letter.
      arm.t += dt / ARM_FETCH_TIME;
      arm.claw = between(arm.from, restSpot(arm), smooth(arm.t));
      if (arm.t >= 1) {
        arm.holding = arm.jobs.shift();
        arm.state = 'carry'; arm.t = 0;
      }
    } else if (arm.state === 'carry') {
      // Swinging the letter over to its spot.
      arm.t += dt / ARM_CARRY_TIME;
      arm.claw = between(restSpot(arm), dropSpot(arm.holding), smooth(arm.t));
      if (arm.t >= 1) {
        arm.holding.placed = true;   // let go!
        arm.holding = null;
        clank();
        arm.from = arm.claw; arm.t = 0;
        arm.state = arm.jobs.length ? 'fetch' : 'goinghome';
      }
    } else if (arm.state === 'goinghome') {
      arm.t += dt / ARM_FETCH_TIME;
      arm.claw = between(arm.from, restSpot(arm), smooth(arm.t));
      if (arm.t >= 1) arm.state = 'home';
    } else {
      arm.claw = restSpot(arm);   // waiting (and sliding up or down with the rail)
    }
  }

  // Are all the letters in place?
  const allPlaced = robo.pieces.every(function (p) { return p.placed; });
  if (allPlaced && !robo.allPlacedAt) robo.allPlacedAt = now;

  // Once the voice has finished talking (and you've had a moment to
  // read it), the letters DROP. Each one gets a little random spin.
  const stillTalking = window.speechSynthesis && window.speechSynthesis.speaking;
  if (robo.allPlacedAt && !robo.dropAt && !stillTalking && now > robo.allPlacedAt + 1.5) {
    robo.dropAt = now;
    robo.pieces.forEach(function (p) {
      p.fallSpeed = -Math.random() * 150;   // a little hop first
      p.spin = (Math.random() - 0.5) * 8;
    });
  }
  if (robo.dropAt) {
    robo.pieces.forEach(function (p) {
      p.fallSpeed += 1800 * dt;   // gravity, in pixels per second per second
      p.y += p.fallSpeed * dt;
      p.angle += p.spin * dt;
    });
    if (now > robo.dropAt + 1.5) {
      robo.active = false;   // all gone
      // More lines for the voice to say? Start the next one.
      // Otherwise, anything waiting to be shown? Show it now.
      if (robo.nextLines && robo.nextLines.length) {
        speakLines(robo.nextLines);
      } else if (robo.thenSay) {
        say(robo.thenSay, 3); robo.thenSay = '';
      }
    }
  }
}

// One metal letter. The colour fades from bright silver to dark steel
// and back again, top to bottom. That's what makes it look like shiny metal.
function drawMetalLetter(letter, x, y, angle) {
  const fs = robo.fontSize;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const shine = ctx.createLinearGradient(0, -fs * 0.5, 0, fs * 0.5);
  shine.addColorStop(0, '#f6f8fa');
  shine.addColorStop(0.45, '#9aa3ad');
  shine.addColorStop(0.55, '#d8dde2');
  shine.addColorStop(1, '#5c646d');
  ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#24282c';
  ctx.strokeText(letter, 0, 0);
  ctx.fillStyle = shine;
  ctx.fillText(letter, 0, 0);
  ctx.restore();
}

// One robot arm. The tricky part is the ELBOW: we know where the shoulder
// is, and where we want the claw to be, but where does the elbow go?
// This is called INVERSE KINEMATICS. Two bones of the same length make a
// triangle with the line from shoulder to claw, and a bit of triangle
// maths (the "law of cosines") tells us the angle to bend at.
function drawArm(arm) {
  const letter = arm.holding ? arm.holding.letter : null;
  drawArmAt(shoulder(arm), arm.claw, robo.reach, letter, !!arm.holding);
}

// Draws any robot arm: from shoulder s, reaching for claw spot c, with
// bones this long. It can carry a metal letter, and its claw can be shut.
// elbowSide: which way the elbow sticks out (-1 or 1). Leave it out for -1.
function drawArmAt(s, c, bone, letter, clawShut, elbowSide) {
  elbowSide = elbowSide || -1;
  let dx = c.x - s.x, dy = c.y - s.y;
  let d = Math.hypot(dx, dy);
  d = Math.max(1, Math.min(d, bone * 2 - 0.5));   // can't reach farther than both bones
  const pointing = Math.atan2(dy, dx);
  const bend = Math.acos(Math.min(1, d / (2 * bone)));
  const elbow = { x: s.x + Math.cos(pointing + elbowSide * bend) * bone,
                  y: s.y + Math.sin(pointing + elbowSide * bend) * bone };
  const hand = { x: s.x + Math.cos(pointing) * d, y: s.y + Math.sin(pointing) * d };

  ctx.lineCap = 'round';
  // The two bones: a dark steel tube with a lighter stripe down it.
  [[s, elbow, 14], [elbow, hand, 11]].forEach(function (b) {
    ctx.strokeStyle = '#3d434a'; ctx.lineWidth = b[2];
    ctx.beginPath(); ctx.moveTo(b[0].x, b[0].y); ctx.lineTo(b[1].x, b[1].y); ctx.stroke();
    ctx.strokeStyle = '#8b949e'; ctx.lineWidth = b[2] * 0.35;
    ctx.beginPath(); ctx.moveTo(b[0].x, b[0].y); ctx.lineTo(b[1].x, b[1].y); ctx.stroke();
  });

  // The letter it's carrying, hanging below the claw.
  if (letter) drawMetalLetter(letter, hand.x, hand.y + robo.fontSize * 0.55, 0);

  // The claw: two pincers. Wide open when empty, squeezed shut when holding.
  const open = clawShut ? 0.25 : 0.7;
  ctx.strokeStyle = '#2b3036'; ctx.lineWidth = 4;
  [-1, 1].forEach(function (side) {
    const a = Math.PI / 2 + side * open;
    ctx.beginPath();
    ctx.moveTo(hand.x, hand.y);
    ctx.lineTo(hand.x + Math.cos(a) * 18, hand.y + Math.sin(a) * 18);
    ctx.stroke();
  });

  // Orange joints with a bolt in the middle.
  [s, elbow, hand].forEach(function (j, i) {
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.arc(j.x, j.y, i === 2 ? 6 : 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d2a10';
    ctx.beginPath(); ctx.arc(j.x, j.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

// ---------------------------------------------------------------------
//  THE PUNCHING ROBOTS. Two robot arms with big metal FISTS come down,
//  wind up, and PUNCH the screen. Every punch leaves a shattered-glass
//  crack where it hit, and makes the screen GLITCH. The cracks stay, and
//  the screen keeps glitching now and then, for the whole level.
//  Here's the timetable, in seconds:
//     0.0 - 0.8         the arms slide down
//     1.0, 1.7, 2.4...  PUNCH! (left, right, left, right...)
//     then              they slide back up (the damage stays)
// ---------------------------------------------------------------------
const PUNCHES = 8;           // how many times they punch the screen
const GLITCH_EVERY = 1;      // about how many seconds between glitches, after the punching
const SHAKE_POWER = 75;      // how VIOLENTLY the world shakes. 0 = not at all. 100 = chaos.
const PUNCH_JOLT = 45;       // the extra big jolt every time a fist lands
let puncher = null;          // null = no punching on this level
const PUNCH_SLIDE = 0.8, PUNCH_FIRST = 1.0, PUNCH_GAP = 0.7;

// alreadyBroken: true means skip the robots. The screen is ALREADY
// smashed when you get there.
function startPunching(alreadyBroken) {
  const punches = [];
  for (let i = 0; i < PUNCHES; i++) {
    const left = i % 2 === 0;   // left arm, right arm, left arm...
    punches.push({
      at: PUNCH_FIRST + i * PUNCH_GAP,
      arm: left ? 0 : 1,
      // Where it hits, as a fraction of the screen (0 = left/top, 1 = right/bottom).
      fx: left ? 0.15 + Math.random() * 0.3 : 0.55 + Math.random() * 0.3,
      fy: 0.25 + Math.random() * 0.45,
      landed: false,
    });
  }
  puncher = { start: performance.now() / 1000, punches: punches, cracks: [],
              glitchUntil: 0, nextGlitch: 0 };
  if (alreadyBroken) {
    // Pretend the punching happened ages ago: the arms are long gone,
    // and every punch has already left its crack.
    puncher.start -= 100;
    punches.forEach(function (p) { p.landed = true; makeCrack(p.fx * W, p.fy * H); });
  }
}

// When the last punch is done, plus a moment to admire the damage.
function punchingOver() {
  return PUNCH_FIRST + (PUNCHES - 1) * PUNCH_GAP + 0.6;
}

// SMASH! Make a crack where the fist landed. A crack is a bunch of
// wiggly lines shooting out from the middle (like spokes on a bike wheel),
// plus a couple of rings joining them up. That's how real glass breaks.
function makeCrack(cx, cy) {
  const spokes = [];
  const count = 8 + Math.floor(Math.random() * 5);
  for (let i = 0; i < count; i++) {
    const angle = i * Math.PI * 2 / count + Math.random() * 0.4;
    const length = 60 + Math.random() * 220;
    const line = [[cx, cy]];
    const STEPS = 5;
    for (let s = 1; s <= STEPS; s++) {
      const r = length * s / STEPS;
      const wiggle = (Math.random() - 0.5) * 16;   // cracks are never straight
      line.push([cx + Math.cos(angle) * r - Math.sin(angle) * wiggle,
                 cy + Math.sin(angle) * r + Math.cos(angle) * wiggle]);
    }
    spokes.push({ angle: angle, length: length, line: line });
  }
  // Rings: little lines joining each spoke to the next one, round in a circle.
  const rings = [];
  [22, 50].forEach(function (r) {
    for (let i = 0; i < spokes.length; i++) {
      const a = spokes[i], b = spokes[(i + 1) % spokes.length];
      if (a.length < r || b.length < r) continue;
      rings.push([[cx + Math.cos(a.angle) * r, cy + Math.sin(a.angle) * r],
                  [cx + Math.cos(b.angle) * r * 1.1, cy + Math.sin(b.angle) * r * 1.1]]);
    }
  });
  // Remember the screen size, in case the window changes size later.
  puncher.cracks.push({ w: W, h: H, cx: cx, cy: cy,
                        lines: spokes.map(function (s) { return s.line; }).concat(rings) });
}

function updatePunching(now) {
  if (!puncher) return;
  const t = now - puncher.start;
  for (const p of puncher.punches) {
    // The fist lands 0.1 seconds after the punch starts.
    if (!p.landed && t > p.at + 0.1) {
      p.landed = true;
      makeCrack(p.fx * W, p.fy * H);
      smash();
      flash = 0.35; flashColor = '255, 255, 255';
      puncher.glitchUntil = now + 0.45;
      if (p === puncher.punches[0]) say('HEY! STOP PUNCHING MY SCREEN!', 2);
    }
  }
  // After the punching: a glitch every few seconds, for a random short time.
  if (t > punchingOver() && now > puncher.nextGlitch) {
    puncher.glitchUntil = now + 0.15 + Math.random() * 0.25;
    puncher.nextGlitch = now + GLITCH_EVERY * (0.5 + Math.random());
    glitchSound();
  }
}

// GLITCHING. We grab strips of the picture that's already on the screen,
// and paste them back slid sideways. Then add a few coloured bars. It
// looks like the screen is broken and confused.
function drawGlitch() {
  if (!puncher) return;
  const now = performance.now() / 1000;
  if (now > puncher.glitchUntil) return;
  for (let i = 0; i < 7; i++) {
    const y = Math.random() * H;
    const h = 4 + Math.random() * 40;
    const slide = (Math.random() - 0.5) * 80;
    ctx.drawImage(canvas, 0, y, W, h, slide, y, W, h);   // copy a strip, slid sideways
  }
  const BARS = ['rgba(255, 0, 255, 0.25)', 'rgba(0, 255, 255, 0.25)', 'rgba(0, 255, 0, 0.2)'];
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = BARS[i];
    ctx.fillRect(0, Math.random() * H, W, 2 + Math.random() * 10);
  }
}

// THE SHAKE. How far is the world knocked about right now?
// Wobbly sin waves at different speeds, plus a bit of pure randomness
// for that violent rattle. Right after a punch lands there's an extra
// big JOLT that dies away quickly. (exp makes it fade fast, then slow.)
function screenShake() {
  if (!puncher) return { x: 0, y: 0, tilt: 0 };
  const t = performance.now() / 1000 - puncher.start;
  let power = t > PUNCH_FIRST ? SHAKE_POWER : 0;
  for (const p of puncher.punches) {
    if (p.landed) power += PUNCH_JOLT * Math.exp(-(t - p.at - 0.1) * 6);
  }
  const rattle = function () { return Math.random() - 0.5; };
  return {
    x: power * (Math.sin(t * 41) + Math.sin(t * 67 + 1) + rattle()) / 2.5,
    y: power * (Math.sin(t * 53 + 2) + Math.sin(t * 79) + rattle()) / 2.5,
    tilt: power * Math.sin(t * 29) / 500,
  };
}

// The cracks, drawn on top of EVERYTHING, because they're in the glass.
function drawCracks() {
  if (!puncher) return;
  ctx.lineCap = 'round';
  for (const c of puncher.cracks) {
    const sx = W / c.w, sy = H / c.h;   // stretch, if the window changed size
    // A little white starburst where the fist hit.
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath(); ctx.arc(c.cx * sx, c.cy * sy, 12, 0, Math.PI * 2); ctx.fill();
    // Each line twice: a dark shadow, then a bright white crack on top.
    [['rgba(0, 0, 0, 0.5)', 3], ['rgba(255, 255, 255, 0.85)', 1.3]].forEach(function (pen) {
      ctx.strokeStyle = pen[0]; ctx.lineWidth = pen[1];
      for (const line of c.lines) {
        ctx.beginPath();
        line.forEach(function (p, i) {
          if (i === 0) ctx.moveTo(p[0] * sx, p[1] * sy); else ctx.lineTo(p[0] * sx, p[1] * sy);
        });
        ctx.stroke();
      }
    });
  }
}

// The arms, with FISTS. Each arm waits, pulls back, punches, and pulls
// away again, every time it's that arm's turn.
function drawPunchArms() {
  if (!puncher) return;
  const t = performance.now() / 1000 - puncher.start;
  const leaveAt = punchingOver();
  if (t > leaveAt + PUNCH_SLIDE) return;   // the arms have gone home
  const bone = H * 0.45;

  let hidden = 1 - smooth(t / PUNCH_SLIDE);
  if (t > leaveAt) hidden = smooth((t - leaveAt) / PUNCH_SLIDE);
  const shoulderY = 10 - hidden * (bone * 2 + 60);

  // The rail with the danger stripes.
  ctx.fillStyle = '#2b3036';
  ctx.fillRect(0, shoulderY - 14, W, 12);
  ctx.fillStyle = '#ffcc00';
  for (let x = -20; x < W; x += 28) {
    ctx.beginPath();
    ctx.moveTo(x, shoulderY - 2); ctx.lineTo(x + 12, shoulderY - 2);
    ctx.lineTo(x + 20, shoulderY - 14); ctx.lineTo(x + 8, shoulderY - 14);
    ctx.fill();
  }

  [0.3, 0.7].forEach(function (where, armNumber) {
    const s = { x: W * where, y: shoulderY };
    const rest = { x: s.x, y: s.y + 90 };
    let hand = rest, fistSize = 18;
    for (const p of puncher.punches) {
      if (p.arm !== armNumber) continue;
      const d = t - p.at;
      const target = { x: p.fx * W, y: p.fy * H };
      const windUp = { x: rest.x, y: rest.y - 40 };
      if (d > -0.3 && d < 0) {                      // pull back...
        hand = between(rest, windUp, smooth((d + 0.3) / 0.3));
      } else if (d >= 0 && d < 0.1) {               // ...PUNCH!
        hand = between(windUp, target, d / 0.1);
        fistSize = 18 + 22 * (d / 0.1);              // it gets bigger: it's coming AT you
      } else if (d >= 0.1 && d < 0.2) {             // smash
        hand = target; fistSize = 40;
      } else if (d >= 0.2 && d < 0.5) {             // and pull away again
        hand = between(target, rest, smooth((d - 0.2) / 0.3));
        fistSize = 40 - 22 * smooth((d - 0.2) / 0.3);
      }
    }
    drawArmAt(s, hand, bone, null, true, where < 0.5 ? 1 : -1);
    drawFist(hand, fistSize);
  });
}

// A big metal fist: a rounded block with four knuckles on the front.
function drawFist(p, size) {
  ctx.fillStyle = '#6d757e';
  ctx.strokeStyle = '#2b3036'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9aa3ad';
  for (let k = 0; k < 4; k++) {
    const kx = p.x - size * 0.6 + k * size * 0.4;
    ctx.beginPath(); ctx.arc(kx, p.y + size * 0.35, size * 0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function drawRobotSubtitles() {
  if (!robo.active) return;

  // The rail along the top that the arms hang from.
  const railY = shoulder(robo.arms[0]).y;
  if (railY > -20) {
    ctx.fillStyle = '#2b3036';
    ctx.fillRect(0, railY - 14, W, 12);
    ctx.fillStyle = '#ffcc00';   // yellow and black DANGER stripes
    for (let x = -20; x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, railY - 2); ctx.lineTo(x + 12, railY - 2);
      ctx.lineTo(x + 20, railY - 14); ctx.lineTo(x + 8, railY - 14);
      ctx.fill();
    }
  }

  // Letters already put in place (or falling away).
  robo.pieces.forEach(function (p) {
    if (p.placed) drawMetalLetter(p.letter, p.x, p.y, p.angle);
  });
  robo.arms.forEach(drawArm);
}

// CLANK! A tiny metal sound, made from scratch. A short buzzy note that
// dies away really fast sounds a lot like metal hitting metal.
let audio = null;
function unlockAudio() {
  // Browsers only let a page make sounds after you've clicked or tapped,
  // so we set up the sound machine the moment you start the game.
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
// A handy sound-maker: one note that starts at one pitch and slides to
// another, then fades out. Almost every sound effect below is made with it.
//   type: 'sine' is smooth, 'square' is buzzy, 'sawtooth' is harsh
function beep(startPitch, endPitch, seconds, type, loudness) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const vol = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(startPitch, t);
  osc.frequency.exponentialRampToValueAtTime(endPitch, t + seconds);
  vol.gain.setValueAtTime(loudness, t);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
  osc.connect(vol); vol.connect(audio.destination);
  osc.start(t); osc.stop(t + seconds + 0.05);
}
// ZAP: a harsh sound sliding from high to low, really fast. Three at once
// at slightly different pitches makes it crackle.
function zap() {
  beep(1800, 60, 0.5, 'sawtooth', 0.12);
  beep(1700, 80, 0.45, 'square', 0.08);
  beep(2400, 100, 0.3, 'sawtooth', 0.06);
}
// DING: each right button goes a bit higher, like climbing a ladder.
function ding(step) {
  const pitch = 660 * Math.pow(1.25, step);
  beep(pitch, pitch, 0.4, 'sine', 0.15);
  beep(pitch * 2, pitch * 2, 0.25, 'sine', 0.05);
}
// BZZZT: a low, ugly buzz. The "nope" sound.
function buzz() {
  beep(110, 100, 0.45, 'square', 0.1);
  beep(116, 105, 0.45, 'sawtooth', 0.06);
}
// RUMBLE: really low notes that wobble, for the wall cracking open.
// DING-DONG: the elevator bell. Two notes, high then low.
function elevatorDing() {
  beep(1046, 1046, 0.6, 'sine', 0.14);
  setTimeout(function () { beep(784, 784, 0.9, 'sine', 0.14); }, 250);
}
// HMMMMM: the elevator motor, a low steady hum while you go down.
function elevatorHum() {
  beep(65, 55, 3.2, 'sawtooth', 0.06);
  beep(130, 110, 3.2, 'sine', 0.05);
}
// OUCH: a quick "boing" down, like a cartoon getting poked.
// WHEEEEEOOOOO: the cartoon falling-thing whistle, high sliding down to low.
function whistle() {
  beep(2200, 500, 0.9, 'sine', 0.1);
}
// CRASH + HONK HONK: a big low smash, then the truck's horn, twice.
function crash() {
  beep(120, 30, 0.6, 'sawtooth', 0.2);
  beep(90, 25, 0.7, 'square', 0.15);
  setTimeout(function () { beep(415, 415, 0.25, 'square', 0.08); beep(330, 330, 0.25, 'square', 0.08); }, 450);
  setTimeout(function () { beep(415, 415, 0.4, 'square', 0.08); beep(330, 330, 0.4, 'square', 0.08); }, 800);
}

// SMASH: a heavy THUD, then lots of tiny tinkly bits of glass.
function smash() {
  beep(160, 40, 0.35, 'sine', 0.25);
  beep(90, 30, 0.3, 'square', 0.1);
  for (let i = 0; i < 6; i++) {
    const pitch = 2000 + Math.random() * 3000;
    setTimeout(function () { beep(pitch, pitch * 0.8, 0.06, 'triangle', 0.05); }, 40 + i * 35);
  }
}
// BZZT-BRRP: random little electronic noises, for a glitching screen.
function glitchSound() {
  for (let i = 0; i < 3; i++) {
    const pitch = 200 + Math.random() * 1300;
    setTimeout(function () { beep(pitch, pitch * (0.5 + Math.random()), 0.07, 'square', 0.035); }, i * 60);
  }
}

function ouch() {
  beep(700, 180, 0.35, 'square', 0.08);
  beep(350, 90, 0.4, 'sine', 0.12);
}

// BA-BUM: a heartbeat. Two deep thumps close together.
function heartbeat() {
  beep(70, 40, 0.16, 'sine', 0.45);
  beep(110, 60, 0.12, 'triangle', 0.12);
  setTimeout(function () { beep(62, 38, 0.2, 'sine', 0.38); beep(100, 55, 0.14, 'triangle', 0.1); }, 150);
}
// BOOM: the biggest sound in the game.
function boom() {
  beep(90, 18, 2.5, 'sawtooth', 0.3);
  beep(60, 20, 3, 'square', 0.18);
  beep(3500, 150, 1.5, 'triangle', 0.08);
  beep(900, 60, 1.8, 'sawtooth', 0.08);
  rumble();
}

function rumble() {
  beep(70, 35, 1.4, 'sawtooth', 0.15);
  beep(55, 30, 1.6, 'square', 0.08);
  beep(400, 2000, 0.9, 'sine', 0.04);   // and a spooky rising whistle
}

function clank() {
  if (!audio) return;
  const t = audio.currentTime;
  [[700 + Math.random() * 300, 'square', 0.05], [2600 + Math.random() * 600, 'triangle', 0.04]]
    .forEach(function (n) {
      const osc = audio.createOscillator();
      const vol = audio.createGain();
      osc.type = n[1];
      osc.frequency.value = n[0];
      vol.gain.setValueAtTime(n[2], t);
      vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(vol); vol.connect(audio.destination);
      osc.start(t); osc.stop(t + 0.1);
    });
}

// ---------------------------------------------------------------------
//  THE MENU. Three big boxes: NEW GAME, CONTINUE, and LEVELS.
//  Your progress is saved in "localStorage" (the browser's little
//  notebook for this website), so CONTINUE still works tomorrow.
// ---------------------------------------------------------------------
const ALL_LEVELS_UNLOCKED = false;   // true = every level is open in the LEVELS list

let menuPage = 'main';    // 'main' (the 3 boxes) or 'levels' (the list of levels)
let menuButtons = [];     // the boxes on screen right now, so we know what you clicked
let mouseX = -1, mouseY = -1;   // where the mouse is, to light up the box under it

// Reading and writing the notebook. "try" means: if the browser won't
// let us (some private windows don't), just carry on without saving.
function loadSave(name) {
  try { const v = localStorage.getItem(name); return v === null ? -1 : Number(v); }
  catch (e) { return -1; }
}
function writeSave(name, value) {
  try { localStorage.setItem(name, String(value)); } catch (e) {}
}
function savedLevel()   { return loadSave('parkourLevel'); }   // where you were (-1 = never played)
function highestLevel() { return loadSave('parkourBest'); }    // the furthest you've got

// Called every time a level loads, to remember where you are.
function rememberProgress(index) {
  if (!started) return;   // just looking at the menu doesn't count
  writeSave('parkourLevel', index);
  if (index > highestLevel()) writeSave('parkourBest', index);
}

function isUnlocked(index) {
  return ALL_LEVELS_UNLOCKED || index <= Math.max(0, highestLevel());
}

// Leave the menu and start playing level number "index".
function playFrom(index) {
  started = true;
  menuPage = 'main';
  falls = 0;
  unlockAudio();
  loadLevel(index);
  if (!touchUsed) lockMouse();
}

// Lock the mouse for looking around. Right after you press Esc, some
// browsers say "not yet!" for a second. That's OK: we ignore the
// complaint, and clicking the game again locks it.
function lockMouse() {
  if (!canvas.requestPointerLock) return;
  try {
    const asked = canvas.requestPointerLock();
    if (asked && asked.catch) asked.catch(function () {});
  } catch (e) {}
}

// M or Esc: back to the menu.
function openMenu() {
  started = false;
  menuPage = 'main';
  if (document.exitPointerLock) document.exitPointerLock();
}

// Somebody clicked or tapped at (x, y) while the menu is showing.
function menuClick(x, y) {
  for (const b of menuButtons) {
    if (b.disabled) continue;
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      clank();
      b.action();
      return;
    }
  }
}

// One box. It glows when the mouse is over it, and goes grey if you
// can't press it yet.
function drawMenuButton(b) {
  const hover = !b.disabled && mouseX >= b.x && mouseX <= b.x + b.w && mouseY >= b.y && mouseY <= b.y + b.h;
  ctx.fillStyle = b.disabled ? 'rgba(60, 60, 60, 0.8)'
                : hover ? 'rgba(255, 255, 255, 0.95)' : 'rgba(20, 20, 24, 0.85)';
  ctx.strokeStyle = b.disabled ? '#666' : (b.color || '#ffffff');
  ctx.lineWidth = 4;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = b.disabled ? '#999' : hover ? '#111' : '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold ' + b.fontSize + 'px system-ui, sans-serif';
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + b.fontSize * 0.35);
}

function drawMenu() {
  // Darken the game behind the menu.
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  const small = Math.min(W, H);
  ctx.font = 'bold ' + Math.round(small * 0.09) + 'px system-ui, sans-serif';
  ctx.fillText("MAX'S PARKOUR", W / 2, H * 0.17);

  menuButtons = [];
  const boxW = Math.min(380, W * 0.8);
  const left = (W - boxW) / 2;

  if (menuPage === 'main') {
    // THE THREE BOXES.
    const boxH = Math.max(52, small * 0.1), gap = boxH * 0.3;
    const top = H * 0.26;
    const saved = savedLevel();
    const fontSize = Math.round(boxH * 0.42);
    menuButtons.push({ label: 'NEW GAME', color: '#5dff7a', x: left, y: top, w: boxW, h: boxH,
                       fontSize: fontSize, action: function () { playFrom(0); } });
    menuButtons.push({ label: saved >= 0 ? 'CONTINUE: LEVEL ' + levelNumber(saved) : 'CONTINUE',
                       color: '#ffd23f', x: left, y: top + boxH + gap, w: boxW, h: boxH,
                       fontSize: fontSize, disabled: saved < 0,
                       action: function () { playFrom(saved); } });
    menuButtons.push({ label: 'LEVELS', color: '#b07cff', x: left, y: top + 2 * (boxH + gap), w: boxW, h: boxH,
                       fontSize: fontSize, action: function () { menuPage = 'levels'; } });

    ctx.fillStyle = '#ddd';
    ctx.font = Math.round(small * 0.03) + 'px system-ui, sans-serif';
    const y = top + 3 * (boxH + gap) + small * 0.03;
    ctx.fillText('WASD to run · mouse to look · SPACE to jump · R to restart', W / 2, y);
    ctx.fillText('E to push buttons · V to change the voice · Esc or M for this menu', W / 2, y + small * 0.045);
  } else {
    // THE LEVELS LIST. One box per level. Locked ones are grey.
    const boxH = Math.max(36, Math.min(54, (H * 0.68) / (LEVELS.length + 1) - 8)), gap = 8;
    const fontSize = Math.round(boxH * 0.4);
    const top = H * 0.22;
    LEVELS.forEach(function (level, i) {
      const open = isUnlocked(i);
      menuButtons.push({ label: open ? level.name : '🔒 ' + level.name.split(':')[0],
                         x: left - 40, y: top + i * (boxH + gap), w: boxW + 80, h: boxH,
                         fontSize: fontSize, disabled: !open,
                         action: function () { playFrom(i); } });
    });
    menuButtons.push({ label: '← BACK', x: left, y: top + LEVELS.length * (boxH + gap) + 6,
                       w: boxW, h: boxH, fontSize: fontSize,
                       action: function () { menuPage = 'main'; } });
  }
  menuButtons.forEach(drawMenuButton);
}

// "LEVEL 3: DOWN BELOW" -> "3". The number is the bit after the word LEVEL.
function levelNumber(index) {
  const match = LEVELS[index].name.match(/LEVEL (\d+)/);
  return match ? match[1] : String(index + 1);
}

// ---------------------------------------------------------------------
//  THE GAME LOOP: update, draw, repeat, about 60 times a second.
// ---------------------------------------------------------------------
let last = performance.now();
function loop(t) {
  // Cap dt so a hiccup (like switching tabs) can't fling you through a block.
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt, t / 1000);
  updateRobotSubtitles(dt);
  draw();
  requestAnimationFrame(loop);
}
loadLevel(0);
requestAnimationFrame(loop);
</script>
</body>
