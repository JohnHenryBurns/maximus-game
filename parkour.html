<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no stops a double-tap zooming the page in the middle of a jump. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Max's Parkour</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* The same "back to the arcade" pill every game has, in the same corner. */
    a.arcade-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #ffffff; text-decoration: none;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 7px 13px; border-radius: 999px;
      position: fixed; z-index: 10;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
<a id="back" class="arcade-pill" href="index.html"><span>&larr;</span>Arcade</a>
<canvas id="game"></canvas>

<script>
/* The game grabs every touch, which would swallow a tap on the Arcade pill.
   So the pill handles its own taps first and stops them going any further. */
(function () {
  var pill = document.getElementById('back');
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

<script>
// =====================================================================
//  MAX'S PARKOUR
//
//  Cursed Cavern used a trick called RAYCASTING, which is brilliant for
//  flat mazes but can't do jumping UP onto things. Parkour is ALL jumping
//  up onto things. So this game does real 3D, by hand:
//
//    1. The world is a list of BLOCKS (boxes).
//    2. Every frame, each corner of each block is moved so it's measured
//       from your eyes instead of from the middle of the world.
//    3. Then it's squashed flat onto the screen: things far away get
//       squashed closer to the middle. That's what makes it look 3D.
//    4. We paint the farthest bits first and the nearest bits last, so
//       near things cover far things. Painters do the same with a
//       background and then the trees on top. It's called the
//       PAINTER'S ALGORITHM.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
//  THE NUMBERS THAT DECIDE HOW YOU MOVE.
//  Try changing these! What do you think happens if JUMP_POWER is 15?
// ---------------------------------------------------------------------
const RUN_SPEED   = 6;    // blocks per second
const JUMP_POWER  = 9;    // how fast you shoot upward when you jump
const GRAVITY     = 25;   // how hard the world pulls you back down
const EYE_HEIGHT  = 1.6;  // your eyes are this far above your feet
const BODY_HEIGHT = 1.8;  // you're this tall, so you bonk your head on things
const BODY_RADIUS = 0.3;  // how wide you are (from the middle to the edge)
const FALL_LIMIT  = -20;  // fall below this and you're sent back to the start

// ---------------------------------------------------------------------
//  TILE SIZE. How big each checkerboard square is, in blocks.
//  It used to be 1. Now it's 0.5, so four little tiles fit where one
//  big one used to be. Try 0.25 for tiny ones!
// ---------------------------------------------------------------------
const TILE = 0.5;

const WHITE = [235, 235, 235], BLACK = [20, 20, 24];
const GOLD = [255, 200, 40], DARK_GOLD = [90, 60, 0];
const STONE = [120, 125, 140];
const LAVA = [255, 90, 0];
const LAVA_Y = -0.4;      // lava sits this far down below the floor
const THICKNESS = 0.6;    // how thick each floating block is

// ---------------------------------------------------------------------
//  LEVEL 1: THE LAVA TUNNEL.
//  This is a MAP. Each line is one step of the tunnel, and the first line
//  is where you start. Each letter is one square of floor:
//
//     .  = floor     L  = LAVA!     F  = the gold finish
//
//  You can redesign the whole level just by typing letters here.
//  Keep every line exactly 4 letters long, so the tunnel stays straight.
// ---------------------------------------------------------------------
const TUNNEL_MAP = [
  '....',
  '....',
  '....',
  '....',
  'LL..',   // a little pool. go around it!
  '....',
  '....',
  '..LL',
  '....',
  '....',
  'LLLL',   // no way round this one. JUMP.
  '....',
  '....',
  '.LL.',
  '.LL.',
  '....',
  '....',
  'L..L',
  'L..L',
  'L..L',
  '....',
  '....',
  'LLLL',   // a two-step jump
  'LLLL',
  '....',
  '....',
  'LLLL',
  'LL.L',   // one tiny stepping stone in the middle of the lava
  'LLLL',
  '....',
  '....',
  '....',
  '....',   // ...and at the very end: the glowing purple crack!
];
const TUNNEL_HEIGHT = 4;  // how high the ceiling is

// THE CRACK. A jagged split in the end wall, glowing purple. It's a list
// of corner points [across, up]: up the left side, then back down the
// right side. Zigzagging in and out is what makes it look cracked.
const CRACK_SHAPE = [
  [-0.35, 0], [-0.5, 0.5], [-0.25, 0.9], [-0.55, 1.4], [-0.3, 1.9],
  [-0.45, 2.4], [-0.15, 2.9], [0, 3.3],
  [0.2, 2.8], [0.4, 2.3], [0.15, 1.8], [0.5, 1.3], [0.3, 0.8],
  [0.55, 0.4], [0.35, 0],
];

// ---------------------------------------------------------------------
//  LEVEL 2: THE SKY COURSE (the very first level we made).
//  Each line is one block: [left edge, front edge, width, depth, top height].
//  Forward is the minus direction, so the course goes to bigger minus
//  numbers the further you get.
// ---------------------------------------------------------------------
const SKY_COURSE = [
  [-3,   -3, 6, 6, 0],    // the start pad
  [-1,   -7, 2, 2, 0],    // first easy hop
  [-1,  -12, 2, 2, 0.5],  // a bigger gap, and a bit higher
  [ 2,  -15, 2, 2, 1],    // off to the right
  [-1,  -19, 2, 2, 1.5],
  [ 0,  -28, 1, 7, 1.5],  // the skinny beam. don't wobble.
  [-1,  -31, 3, 2, 2],    // stairs up...
  [-1,  -34, 3, 2, 3],
  [ 2,  -37, 1, 1, 3],    // tiny one-tile hops
  [ 0,  -40, 1, 1, 3],
  [-2,  -43, 1, 1, 3.5],
  [ 0,  -46, 1, 1, 4],
  [-2,  -54, 4, 5, 4, 'finish'],  // the GOLD finish pad
];

// The list of levels, in order. Each one says what it's called, where you
// start, what colour the far-away fog is, and which function builds it.
const LEVELS = [
  { name: 'LEVEL 1: THE LAVA TUNNEL', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildTunnel },
  { name: 'LEVEL 2: THE PUZZLE ROOM', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildPuzzleRoom,
    // What the mysterious voice says when you arrive, one line at a time.
    // Change them to anything! Add more lines if you want!
    voice: [
      'Hello. Welcome to the game. I see you have beat the first level.',
      'Ah, puzzles. My favorite.',
    ] },
  { name: 'LEVEL 3: THE RAINBOW ROOM', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildRainbowRoom },
  // You don't walk to this one. The ELEVATOR brings you here.
  { name: 'LEVEL 3: DOWN BELOW', start: { x: 0, y: 0, z: -1 },
    fogColor: [40, 30, 35], fogDistance: 35, sky: false, build: buildSpikeRoom },
  { name: 'LEVEL 4: THE LONG HALLWAY', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildHallway },
  { name: 'LEVEL 5: THE VOLCANO', start: { x: 0, y: 0, z: 1.5 },
    fogColor: [60, 20, 12], fogDistance: 45, build: buildVolcano, sky: false,
    punch: true },   // the robot arms PUNCH the screen!
  { name: 'LEVEL 6: THE GLITCH HALLWAY', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [35, 15, 45], fogDistance: 40, sky: false, build: buildGlitchHall,
    broken: true,       // the screen starts out already cracked and shaking
    glitchHall: true }, // things appear, glitch, and vanish
  { name: 'LEVEL 7: THE BREAK', start: { x: 0, y: 0, z: -6 },
    fogColor: [70, 45, 35], fogDistance: 45, sky: false, build: buildBreakRoom,
    theBreak: true },   // an empty room... for now
  { name: 'LEVEL 8: THE SKY COURSE (BONUS!)', start: { x: 0, y: 0, z: 1.5 },
    fogColor: [120, 170, 230], fogDistance: 70, sky: true, build: buildSkyCourse },
];

// ---------------------------------------------------------------------
//  LEVEL 2: THE PUZZLE ROOM.
//  A room with three buttons, and a sign that tells you which one to
//  push first. The sign is LYING. The red button zaps you.
//
//  PUZZLE_ANSWER is the secret right order. Change it to make your own
//  puzzle! (Don't put 'red' in it... or do. It's your game.)
// ---------------------------------------------------------------------
const PUZZLE_ANSWER = ['green', 'blue'];
const SIGN_WORDS = ['PUSH THE RED', 'BUTTON FIRST'];
const PUZZLE_ROOM_MAP = [
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
];
const BUTTON_COLORS = {
  red:    [230, 30, 30],
  orange: [255, 140, 20],
  yellow: [250, 220, 30],
  green:  [40, 200, 60],
  blue:   [40, 90, 240],
  indigo: [75, 40, 170],
  violet: [170, 70, 220],
};
let puzzle = null;   // the buttons, and what kind of puzzle it is. Rooms without buttons: null.

// ---------------------------------------------------------------------
//  LEVEL 3: THE RAINBOW ROOM, and what's DOWN BELOW it.
//  One button for every colour of the rainbow. The sign says pick any
//  colour. It doesn't matter which: an ELEVATOR always appears behind you.
// ---------------------------------------------------------------------
const RAINBOW = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];
const RAINBOW_SIGN = ['PICK ANY', 'COLOR'];
const RAINBOW_ROOM_MAP = [
  '............',
  '............',
  '............',
  '............',
  '............',
  '............',
  '............',
  '............',
  '............',
  '............',
];

// The room at the bottom of the elevator.  S = SPIKES!  Don't touch them.
const SPIKE_ROOM_MAP = [
  '......',   // the elevator lands here
  '......',
  '......',
  '......',
  'SSS...',   // go around these
  '......',
  '......',
  '...SSS',
  '......',
  '......',
  'SSSSSS',   // no way round. JUMP!
  '......',
  '......',
  '.SSSS.',
  '......',
  'S.SS.S',
  '......',
  '......',
  'SSSSSS',   // a big double jump
  'SSSSSS',
  '......',
  '......',
  '......',   // the way out is in the wall at the end
];
let spikeCells = [];   // every square that has spikes on it

// ---------------------------------------------------------------------
//  LEVEL 4: THE LONG HALLWAY.
//  Long. Straight. Boring. Except for the yellow line halfway along.
//  Whatever you do, DON'T step on the yellow line.
// ---------------------------------------------------------------------
const HALLWAY_LENGTH = 40;      // how many steps long the hallway is
const HALLWAY_WIDTH = 4;
const HALLWAY_HEIGHT = 9;       // a really high ceiling. (Why so high? You'll see.)
// The map is made by repeating the same row, HALLWAY_LENGTH times.
const HALLWAY_MAP = Array(HALLWAY_LENGTH).fill('.'.repeat(HALLWAY_WIDTH));
let yellowLine = null;   // where the line is (only the hallway has one)

// ---------------------------------------------------------------------
//  LEVEL 5: THE VOLCANO. A big parkour course over a lake of lava.
//  Each line is one thing. There are three kinds:
//    ['block',  left, front, width, depth, top]  - something to stand on
//    ['spikes', left, front, width, depth, top]  - spikes on top of a block
//    ['saw',    middle, z, how far it slides, how fast, top]  - a spinning saw!
//  Forward is the minus direction, like always.
// ---------------------------------------------------------------------
const VOLCANO_COURSE = [
  ['block',  -3,  -3, 6, 6, 0],     // the start
  ['block',  -1,  -8, 2, 3, 0],
  ['block',  -2, -15, 4, 5, 0.5],
  ['spikes', -2, -13, 3, 1, 0.5],   // spikes! there's a gap on the right
  ['block',  -1, -20, 2, 3, 1],
  ['block',  -3, -28, 6, 6, 1],
  ['saw',     0, -25, 2.2, 1.6, 1], // a saw sliding side to side. time it!
  ['block',   1, -32, 1, 2, 1.5],   // little hops
  ['block',  -1, -35, 1, 1, 2],
  ['block',   1, -38, 1, 1, 2.5],
  ['block',  -2, -46, 4, 6, 2.5],
  ['spikes', -2, -42, 4, 1, 2.5],   // a whole row of spikes. JUMP!
  ['saw',     0, -44.5, 1.6, 2.2, 2.5],
  ['block',  -1, -51, 2, 3, 3],
  ['block',  -3, -60, 6, 7, 3],
  ['spikes', -3, -54, 2, 1, 3],
  ['saw',     0, -55.5, 2.2, 1.8, 3], // TWO saws
  ['saw',     0, -58, 2.2, 2.6, 3],
  ['block',  -2, -68, 4, 6, 3],     // the end, with the way out in a wall
];
const LAVA_LAKE_Y = -4;   // how far down the lava lake is
const VOLCANO_HALF_WIDTH = 6;   // the walls are this far out to each side
const VOLCANO_CEILING = 10;     // how high the ceiling is
let saws = [];            // the spinning saws (only the volcano has them)
let truck = null;        // the falling truck (null = no truck... yet)

// These get filled in when a level loads.
let blocks = [];   // the solid boxes you can stand on and bump into
let faces = [];    // the flat shapes we paint on the screen
let levelIndex = 0;

// ---------------------------------------------------------------------
//  FACES. A face is one flat shape we paint: a list of corners, a colour,
//  and which way it points (its "normal"). "extra" can add things like
//  a mortar colour for bricks, or lava: true to make it glow.
// ---------------------------------------------------------------------
function addFace(corners, color, normal, extra) {
  // The middle of the face. We use it to decide what's nearer.
  let cx = 0, cy = 0, cz = 0;
  corners.forEach(function (c) { cx += c[0]; cy += c[1]; cz += c[2]; });
  const n = corners.length;
  const face = { corners: corners, color: color, normal: normal,
                 mid: [cx / n, cy / n, cz / n] };
  if (extra) Object.assign(face, extra);
  faces.push(face);
}

// A checkerboard floor, from x0 to x1 and z0 to z1, at height y.
// To pick a tile's colour, count which tile it is across and which tile
// it is forward, and add them up. Even = one colour, odd = the other.
function addCheckerboard(x0, x1, z0, z1, y, finish) {
  for (let x = x0; x < x1 - 0.001; x += TILE) {
    for (let z = z0; z < z1 - 0.001; z += TILE) {
      const count = Math.round(x / TILE) + Math.round(z / TILE);
      const even = ((count % 2) + 2) % 2 === 0;
      let color;
      if (finish) color = even ? GOLD : DARK_GOLD;
      else        color = even ? WHITE : BLACK;
      addFace([[x, y, z], [x + TILE, y, z], [x + TILE, y, z + TILE], [x, y, z + TILE]],
              color, [0, 1, 0]);
    }
  }
}

// A wall of white bricks. Bricks are 1 long and half a block tall, and
// every other row is shifted along by half a brick. That's how real
// brick walls are built, so they don't have one long crack down them.
//   start:   one bottom corner of the wall
//   along:   which way the wall runs, like [0, 0, -1]
//   length:  how long it is
//   normal:  which way the wall faces
//   style:   (you can leave this out) { color, long, tall, mortar } to make
//            bricks a different colour or size. Leave it out for white bricks.
function addBrickWall(start, along, length, yBottom, yTop, normal, style) {
  style = style || {};
  const BRICK_LONG = style.long || 1, BRICK_TALL = style.tall || 0.5;
  const MORTAR = style.mortar || [150, 140, 130];   // the cement between bricks
  const at = function (u, y) {
    return [start[0] + along[0] * u, y, start[2] + along[2] * u];
  };
  let row = 0;
  for (let y = yBottom; y < yTop - 0.001; y += BRICK_TALL, row++) {
    const shift = (row % 2) * (BRICK_LONG / 2);
    for (let u = -shift; u < length; u += BRICK_LONG) {
      const u0 = Math.max(0, u), u1 = Math.min(length, u + BRICK_LONG);
      const y1 = Math.min(yTop, y + BRICK_TALL);
      // Every brick is a slightly different shade, so it looks real.
      let color;
      if (style.color) {
        const k = 0.85 + Math.random() * 0.3;
        color = style.color.map(function (c) { return c * k; });
      } else {
        const tint = 215 + Math.floor(Math.random() * 30);
        color = [tint, tint - 4, tint - 10];
      }
      addFace([at(u0, y), at(u1, y), at(u1, y1), at(u0, y1)], color, normal, { edge: MORTAR });
    }
  }
}

function buildTunnel() {
  buildRoom(TUNNEL_MAP);
  addCrack(-TUNNEL_MAP.length, 1);   // the way out: in the wall at the far end
}

// Builds a closed-in room from a map: floor, lava, white brick walls and
// a ceiling. The tunnel and the puzzle room are both made with this.
// That's the good thing about a FUNCTION: write it once, use it lots.
// height is how high the ceiling is. Leave it out for the normal height.
function buildRoom(map, height) {
  const rows = map.length;
  const width = map[0].length;
  const left = -width / 2, right = width / 2;
  const back = 0, front = -rows;   // the room runs from z=0 to z=-rows
  const top = height || TUNNEL_HEIGHT;   // "||" means "or, if there isn't one..."

  // What letter is at this spot on the map? Outside the map counts as wall.
  function letterAt(row, col) {
    if (row < 0 || row >= rows || col < 0 || col >= width) return '#';
    return map[row][col];
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < width; col++) {
      const letter = letterAt(row, col);
      const x0 = left + col, x1 = x0 + 1;
      const z1 = -row, z0 = z1 - 1;    // row 0 is nearest the start

      if (letter === 'L') {
        // LAVA: a block sunk down below the floor, that glows and burns.
        blocks.push({ minX: x0, maxX: x1, minZ: z0, maxZ: z1,
                      minY: LAVA_Y - 1, maxY: LAVA_Y, lava: true });
        addFace([[x0, LAVA_Y, z0], [x1, LAVA_Y, z0], [x1, LAVA_Y, z1], [x0, LAVA_Y, z1]],
                LAVA, [0, 1, 0], { lava: true });
        continue;
      }

      // FLOOR (or the gold finish).
      const finish = letter === 'F';
      blocks.push({ minX: x0, maxX: x1, minZ: z0, maxZ: z1,
                    minY: -THICKNESS, maxY: 0, finish: finish });
      addCheckerboard(x0, x1, z0, z1, 0, finish);

      // SPIKES on this square?
      if (letter === 'S') {
        addSpikes(x0, z0);
        spikeCells.push({ minX: x0, maxX: x1, minZ: z0, maxZ: z1 });
      }

      // If there's lava next door, this square of floor has an edge you
      // can see down into the pool. Paint that edge as dark rock.
      const ROCK = [70, 55, 50];
      if (letterAt(row, col - 1) === 'L')
        addFace([[x0, LAVA_Y, z0], [x0, LAVA_Y, z1], [x0, 0, z1], [x0, 0, z0]], ROCK, [-1, 0, 0]);
      if (letterAt(row, col + 1) === 'L')
        addFace([[x1, LAVA_Y, z0], [x1, LAVA_Y, z1], [x1, 0, z1], [x1, 0, z0]], ROCK, [1, 0, 0]);
      if (letterAt(row - 1, col) === 'L')
        addFace([[x0, LAVA_Y, z1], [x1, LAVA_Y, z1], [x1, 0, z1], [x0, 0, z1]], ROCK, [0, 0, 1]);
      if (letterAt(row + 1, col) === 'L')
        addFace([[x0, LAVA_Y, z0], [x1, LAVA_Y, z0], [x1, 0, z0], [x0, 0, z0]], ROCK, [0, 0, -1]);
    }
  }

  // THE WALLS, CEILING AND ENDS. Big solid boxes so you can't escape...
  blocks.push({ minX: left - 1, maxX: left, minY: -2, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: right, maxX: right + 1, minY: -2, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: top, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: -2, maxY: top, minZ: back, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: -2, maxY: top, minZ: front - 1, maxZ: front });

  // ...and white bricks painted on the insides of them.
  addBrickWall([left, 0, back], [0, 0, -1], rows, LAVA_Y, top, [1, 0, 0]);    // left wall
  addBrickWall([right, 0, back], [0, 0, -1], rows, LAVA_Y, top, [-1, 0, 0]);  // right wall
  addBrickWall([left, 0, back], [1, 0, 0], width, LAVA_Y, top, [0, 0, -1]);   // wall behind you
  addBrickWall([left, 0, front], [1, 0, 0], width, LAVA_Y, top, [0, 0, 1]);   // wall at the end

  // The ceiling: plain grey stone panels.
  for (let z = front; z < back; z++) {
    for (let x = left; x < right; x++) {
      const shade = 95 + (((x + z) % 2 + 2) % 2 === 0 ? 0 : 8);
      addFace([[x, top, z], [x + 1, top, z], [x + 1, top, z + 1], [x, top, z + 1]],
              [shade, shade - 5, shade - 10], [0, -1, 0]);
    }
  }
}

// THE GLOWING PURPLE CRACK, the way out of a room. We paint it three
// times: a big faint glow around it, the purple crack, and a bright
// white-hot middle. "layer" tells the painter to do these LAST, on top
// of the bricks, in that order.
//   wallZ:  where the wall is
//   facing: 1 if the wall faces you as you walk forward (the far wall),
//          -1 if it's the wall behind where you started
// floorY is how high the floor is in front of it (0 if you leave it out).
function addCrack(wallZ, facing, floorY) {
  floorY = floorY || 0;
  const crackZ = wallZ + 0.02 * facing;   // a hair in front of the wall
  const crackCorners = function (stretchX, stretchY) {
    return CRACK_SHAPE.map(function (p) {
      const y = 1.6 + (p[1] - 1.6) * stretchY;          // stretch around the middle
      return [p[0] * stretchX, floorY + Math.max(0.02, y), crackZ];  // but never below the floor
    });
  };
  const normal = [0, 0, facing];
  addFace(crackCorners(2.2, 1.25), [170, 60, 255], normal, { glow: 'halo', layer: 1 });
  addFace(crackCorners(1, 1),      [170, 60, 255], normal, { glow: 'crack', layer: 2 });
  addFace(crackCorners(0.3, 0.85), [250, 220, 255], normal, { glow: 'core', layer: 3 });
  crackExit = { z: wallZ, facing: facing, halfWidth: 0.45 };
}

// A plain box with all six sides, for things like button stands.
// "extra" gets stuck onto every face (that's how buttons know they're buttons).
function addBox(x0, x1, y0, y1, z0, z1, color, extra) {
  const shade = function (k) { return color.map(function (v) { return v * k; }); };
  addFace([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], shade(1),    [0, 1, 0], extra);
  addFace([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], shade(0.8),  [0, 0, 1], extra);
  addFace([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], shade(0.8),  [0, 0, -1], extra);
  addFace([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], shade(0.65), [1, 0, 0], extra);
  addFace([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], shade(0.65), [-1, 0, 0], extra);
}

function buildPuzzleRoom() {
  buildRoom(PUZZLE_ROOM_MAP);
  const front = -PUZZLE_ROOM_MAP.length;

  // THE THREE BUTTONS, each on a grey stand near the far wall.
  // Red first, like the sign says. Hmm.
  puzzle = { kind: 'liar', buttons: [], progress: 0, solved: false };
  addButton('red', -3, front + 2);
  addButton('blue', 0, front + 2);
  addButton('green', 3, front + 2);
  addSign(front, SIGN_WORDS);
}

// One button on a grey stand. The stand is solid, so you bump into it.
function addButton(color, x, z) {
  const button = { color: color, x: x, z: z, lit: false };
  puzzle.buttons.push(button);
  blocks.push({ minX: x - 0.3, maxX: x + 0.3, minY: 0, maxY: 1, minZ: z - 0.3, maxZ: z + 0.3 });
  addBox(x - 0.3, x + 0.3, 0, 1, z - 0.3, z + 0.3, [90, 90, 100]);
  // The big button on top.
  addBox(x - 0.2, x + 0.2, 1, 1.15, z - 0.2, z + 0.2, BUTTON_COLORS[color], { button: button });
}

// THE SIGN. A wooden board on the far wall, with words painted on it.
// The corners go: bottom-left, bottom-right, top-right, top-left.
function addSign(front, words) {
  const signZ = front + 0.03;
  addFace([[-2.5, 2.2, signZ], [2.5, 2.2, signZ], [2.5, 3.5, signZ], [-2.5, 3.5, signZ]],
          [160, 110, 60], [0, 0, 1], { edge: [80, 50, 20], text: words, layer: 0.5 });
}

function buildRainbowRoom() {
  buildRoom(RAINBOW_ROOM_MAP);
  const front = -RAINBOW_ROOM_MAP.length;
  puzzle = { kind: 'rainbow', buttons: [] };
  // Seven buttons in a row, 1.4 apart, with the middle one (green) in the middle.
  RAINBOW.forEach(function (color, i) {
    addButton(color, (i - 3) * 1.4, front + 2);
  });
  addSign(front, RAINBOW_SIGN);
}

function buildHallway() {
  buildRoom(HALLWAY_MAP, HALLWAY_HEIGHT);
  addCrack(-HALLWAY_LENGTH, 1);   // the way out, at the very end

  // THE YELLOW LINE, halfway along. We take away one row of floor tiles
  // and put bright yellow ones there instead.
  const z1 = -Math.round(HALLWAY_LENGTH / 2), z0 = z1 - 0.5;
  const half = HALLWAY_WIDTH / 2;
  faces = faces.filter(function (f) {
    const inRow = f.normal[1] === 1 && f.mid[1] === 0 && f.mid[2] > z0 && f.mid[2] < z1;
    return !inRow;
  });
  for (let x = -half; x < half; x += 0.5) {
    addFace([[x, 0, z0], [x + 0.5, 0, z0], [x + 0.5, 0, z1], [x, 0, z1]],
            [255, 215, 0], [0, 1, 0]);
  }
  yellowLine = { z0: z0, z1: z1 };
}

// ---------------------------------------------------------------------
//  THE TRUCK. A big red truck with a yellow cab and black wheels, made
//  of boxes. It's built lying on the ground, then we lift it up into the
//  air by changing truck.y, and let GRAVITY do the rest.
// ---------------------------------------------------------------------
function dropTruck() {
  // It's built right on top of where you are. But while it falls, it
  // SWOOPS toward you from up ahead (truck.ahead), so you see it coming.
  addTruckFaces(0, player.z, { truck: true });
  truck = { y: HALLWAY_HEIGHT - 2.5, speed: 0, squashedAt: 0, ahead: -TRUCK_SWOOP };
  whistle();
  say('Uh oh...', 1.2);
}

// Builds a truck out of boxes, sitting on the ground at (cx, cz).
// T gets stuck onto every piece, to say what this truck is for.
function addTruckFaces(cx, cz, T) {
  const RED = [210, 40, 40], CAB = [240, 190, 30], BLACK = [25, 25, 25], GLASS = [150, 210, 255];
  // The big red box on the back.
  addBox(cx - 1.8, cx + 0.6, 0.5, 2.3, cz - 0.9, cz + 0.9, RED, T);
  // The cab, where the driver sits.
  addBox(cx + 0.6, cx + 1.8, 0.5, 1.8, cz - 0.85, cz + 0.85, CAB, T);
  // The windscreen on the front of the cab.
  addBox(cx + 1.8, cx + 1.83, 1.1, 1.65, cz - 0.7, cz + 0.7, GLASS, T);
  // Four wheels.
  [[-1.2, -1], [-1.2, 1], [1.2, -1], [1.2, 1]].forEach(function (w) {
    const wx = cx + w[0], wz = cz + w[1] * 0.85;
    addBox(wx - 0.3, wx + 0.3, 0, 0.6, wz - 0.15, wz + 0.15, BLACK, T);
  });
  // The UNDERNEATH. addBox doesn't paint bottoms (you normally never see
  // them), but you're about to get a really good look at this one.
  addFace([[cx - 1.8, 0.5, cz - 0.9], [cx + 1.8, 0.5, cz - 0.9],
           [cx + 1.8, 0.5, cz + 0.9], [cx - 1.8, 0.5, cz + 0.9]], [110, 30, 30], [0, -1, 0], T);
}

function removeTruck() {
  faces = faces.filter(function (f) { return !f.truck; });
  truck = null;
}

// ---------------------------------------------------------------------
//  LEVEL 6: THE GLITCH HALLWAY. The game is breaking. Purple cracks grow
//  in the walls. Trucks, buttons and robot arms from the other levels
//  pop up out of nowhere, glitch, and vanish. And the screen is already
//  cracked and shaking. Just... keep walking.
// ---------------------------------------------------------------------
const GLITCH_HALL_LENGTH = 50;
const GLITCH_HALL_MAP = Array(GLITCH_HALL_LENGTH).fill('....');
const GHOST_EVERY = 0.3;      // about how many seconds between ghosts appearing
const WALL_CRACK_COUNT = 12;  // how many purple cracks grow in the walls
let ghosts = [];              // the things that appear and glitch away
let wallCracks = [];          // the growing purple cracks
let nextGhostAt = 0;

function buildGlitchHall() {
  buildRoom(GLITCH_HALL_MAP, 5);
  addCrack(-GLITCH_HALL_LENGTH, 1);   // the real way out, at the end

  // THE GROWING CRACKS. Each one starts as nothing, and grows. They take
  // turns starting, so new ones keep appearing as you go.
  const now = performance.now() / 1000;
  wallCracks = [];
  for (let i = 0; i < WALL_CRACK_COUNT; i++) {
    const side = i % 2 === 0 ? -1 : 1;    // left wall, right wall, left...
    const c = {
      side: side,
      x: side * 2 - side * 0.02,          // just in front of the wall
      y: 1.4 + Math.random() * 1.6,
      z: -3 - i * (GLITCH_HALL_LENGTH - 6) / WALL_CRACK_COUNT - Math.random() * 2,
      born: now + i * 1.2,                // when it starts growing
      growTime: 6 + Math.random() * 6,    // how long it takes to get big
      biggest: 0.4 + Math.random() * 0.8, // how big it gets
    };
    wallCracks.push(c);
    // Like the exit crack: a faint glow, the crack, and a bright middle.
    const normal = [-side, 0, 0];         // it faces into the hallway
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [170, 60, 255], normal,
            { wallCrack: c, stretch: [2.2, 1.25], glow: 'halo', layer: 1 });
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [170, 60, 255], normal,
            { wallCrack: c, stretch: [1, 1], glow: 'crack', layer: 2 });
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [250, 220, 255], normal,
            { wallCrack: c, stretch: [0.3, 0.85], glow: 'core', layer: 3 });
  }
  nextGhostAt = now + 1.5;
}

// Where are a growing crack's corners RIGHT NOW? Same zigzag shape as the
// exit crack, but turned to lie flat on a side wall, and scaled by how
// much it has grown so far.
function wallCrackCorners(f) {
  const c = f.wallCrack;
  const now = performance.now() / 1000;
  const size = c.biggest * smooth((now - c.born) / c.growTime);
  // Cracks that can be on ANY surface (walls, floor, ceiling) come with
  // their own directions: u is "wide", v is "tall".
  if (c.u) {
    return CRACK_SHAPE.map(function (p) {
      const across = p[0] * size * f.stretch[0];
      const up = (p[1] - 1.6) * size * f.stretch[1] * 0.5;
      return [c.x + c.u[0] * across + c.v[0] * up,
              c.y + c.u[1] * across + c.v[1] * up,
              c.z + c.u[2] * across + c.v[2] * up];
    });
  }
  return CRACK_SHAPE.map(function (p) {
    return [c.x,
            c.y + (p[1] - 1.6) * size * f.stretch[1] * 0.5,
            c.z + p[0] * size * f.stretch[0]];
  });
}

// THE GHOSTS. Every so often, something from another level appears
// somewhere ahead of you. It stays solid for a moment, then GLITCHES
// (flickers, jumps about, goes pink and blue) and disappears.
function updateGlitchHall(now) {
  // Time for a new one? (But never more than 4 at once.)
  if (now > nextGhostAt && ghosts.length < 4) {
    nextGhostAt = now + GHOST_EVERY * (0.5 + Math.random());
    const kinds = ['truck', 'button', 'arms'];
    const g = {
      kind: kinds[Math.floor(Math.random() * kinds.length)],
      born: now,
      solidUntil: now + 1 + Math.random(),   // then it starts glitching...
    };
    g.goneAt = g.solidUntil + 0.6;           // ...and then it's gone
    // Somewhere ahead of you, but still inside the hallway.
    const z = Math.max(-GLITCH_HALL_LENGTH + 2, player.z - 4 - Math.random() * 10);
    if (g.kind === 'truck') {
      addTruckFaces(0, z, { ghost: g });
    } else if (g.kind === 'button') {
      const x = (Math.random() - 0.5) * 2.4;
      const color = RAINBOW[Math.floor(Math.random() * RAINBOW.length)];
      addBox(x - 0.3, x + 0.3, 0, 1, z - 0.3, z + 0.3, [90, 90, 100], { ghost: g });
      addBox(x - 0.2, x + 0.2, 1, 1.15, z - 0.2, z + 0.2, BUTTON_COLORS[color], { ghost: g });
    } else {
      // Robot arms are drawn flat on the screen, so they just need a spot.
      g.shoulderX = W * (0.15 + Math.random() * 0.7);
      g.reachX = W * (0.2 + Math.random() * 0.6);
      g.reachY = H * (0.3 + Math.random() * 0.4);
    }
    ghosts.push(g);
    glitchSound();
    if (puncher) puncher.glitchUntil = now + 0.2;   // the screen glitches too
  }
  // Clear away the ones that are finished.
  for (const g of ghosts.slice()) {
    if (now > g.goneAt) {
      faces = faces.filter(function (f) { return f.ghost !== g; });
      ghosts.splice(ghosts.indexOf(g), 1);
    }
  }
}

// Is this ghost glitching right now? (Just appeared, or about to vanish.)
function ghostGlitching(g, now) {
  return now < g.born + 0.25 || now > g.solidUntil;
}

// The ghost robot arms, reaching down from the top of the screen.
function drawGhostArms() {
  const now = performance.now() / 1000;
  for (const g of ghosts) {
    if (g.kind !== 'arms') continue;
    let jumpX = 0;
    if (ghostGlitching(g, now)) {
      if (Math.random() < 0.45) continue;           // flicker!
      jumpX = (Math.random() - 0.5) * 60;           // jump about!
    }
    const sway = Math.sin(now * 3 + g.born) * 30;
    const s = { x: g.shoulderX + jumpX, y: -10 };
    const claw = { x: g.reachX + sway + jumpX, y: g.reachY };
    drawArmAt(s, claw, H * 0.4, null, false, g.shoulderX < W / 2 ? 1 : -1);
  }
}

// ---------------------------------------------------------------------
//  LEVEL 7: THE BREAK.
//  An empty room. Nothing happens. Then cracks start to grow EVERYWHERE,
//  your heart starts pounding, faster and faster... until the whole room
//  explodes in blinding purple light. When you can see again, the room is
//  gone. You're floating in space, with broken pieces of the other arcade
//  games drifting all around you, and tiny platforms leading to the crack.
//
//  The timetable, in seconds after you arrive:
//     0 - 3     nothing. an empty room. (suspicious)
//     3 - 15    cracks grow everywhere, your heart beats faster and faster
//     15        BOOM
// ---------------------------------------------------------------------
const BREAK_ROOM_MAP = Array(12).fill('............');
const BREAK_CRACKS = 100;         // how many cracks grow in the room
const BREAK_CRACKS_START = 3;     // when the first crack appears
const BREAK_BOOM_AT = 15;         // when the room explodes
let theBreak = null;              // what's happening in this level so far
let respawnPoint = null;          // where you go back to if you fall (null = the level start)
let fogOverride = null;           // a different fog colour, after the explosion
let blindingLight = 0;            // the purple light of the explosion (1 = can't see a thing)

// THE FLOATING PLATFORMS, after the explosion. Same as the sky course:
// [left edge, front edge, width, depth, top height].
const BREAK_PLATFORMS = [
  [-1.5,  -7.5, 3, 3, 0],     // where you land after the explosion
  [-0.5, -10,   1, 1, 0.3],
  [ 1.5, -13,   1, 1, 0.8],
  [-1,   -16,   1, 1, 1.2],
  [-3,   -19,   1, 1, 1.0],
  [-1,   -22,   1, 1, 1.6],
  [ 1.5, -25,   1, 1, 2.2],
  [ 3,   -28,   1, 1, 2.0],
  [ 1,   -31,   1, 1, 2.6],
  [-1,   -34,   1, 1, 3.0],
  [-2,   -40,   4, 4, 3.2],     // the last one, with the crack
];

function buildBreakRoom() {
  buildRoom(BREAK_ROOM_MAP, 6);
  const now = performance.now() / 1000;
  theBreak = { start: now, exploded: false, nextBeat: now + BREAK_CRACKS_START,
               said: {} };
  respawnPoint = null;
  fogOverride = null;
  blindingLight = 0;

  // THE CRACKS. 40 of them, on the walls, the floor and the ceiling.
  // More and more start growing as time goes on: the first few slowly,
  // then loads all at once at the end.
  wallCracks = [];
  const half = 6, front = -12, back = 0, top = 6;
  for (let i = 0; i < BREAK_CRACKS; i++) {
    const surface = ['left', 'right', 'front', 'back', 'floor', 'ceiling'][i % 6];
    const c = { biggest: 0.6 + Math.random() * 1.2, growTime: 2 + Math.random() * 3 };
    // "Math.pow(..., 0.6)" bunches the start times up towards the end, so
    // it starts slow and then goes CRAZY.
    c.born = now + BREAK_CRACKS_START +
             (BREAK_BOOM_AT - BREAK_CRACKS_START - 1.5) * Math.pow(i / BREAK_CRACKS, 0.6);
    const along = Math.random(), up = Math.random();
    // Every crack needs a middle (x, y, z), a direction to be wide in (u),
    // a direction to be tall in (v), and the way it faces (normal).
    if (surface === 'left' || surface === 'right') {
      const s = surface === 'left' ? -1 : 1;
      Object.assign(c, { x: s * half - s * 0.02, y: 1 + up * 4, z: front + 1 + along * 10,
                         u: [0, 0, 1], v: [0, 1, 0], normal: [-s, 0, 0] });
    } else if (surface === 'front' || surface === 'back') {
      const s = surface === 'front' ? 1 : -1;
      const z = surface === 'front' ? front + 0.02 : back - 0.02;
      Object.assign(c, { x: -5 + along * 10, y: 1 + up * 4, z: z,
                         u: [1, 0, 0], v: [0, 1, 0], normal: [0, 0, s] });
    } else {
      const s = surface === 'floor' ? 1 : -1;
      const y = surface === 'floor' ? 0.02 : top - 0.02;
      Object.assign(c, { x: -5 + along * 10, y: y, z: front + 1 + up * 10,
                         u: [1, 0, 0], v: [0, 0, 1], normal: [0, s, 0] });
    }
    wallCracks.push(c);
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [170, 60, 255], c.normal,
            { wallCrack: c, stretch: [2.2, 1.25], glow: 'halo', layer: 1 });
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [170, 60, 255], c.normal,
            { wallCrack: c, stretch: [1, 1], glow: 'crack', layer: 2 });
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [250, 220, 255], c.normal,
            { wallCrack: c, stretch: [0.3, 0.85], glow: 'core', layer: 3 });
  }
}

// Every tick on this level: heartbeats, messages, and the BIG moment.
function updateBreak(now) {
  if (!theBreak) return;
  const t = now - theBreak.start;
  const once = function (key, fn) { if (!theBreak.said[key]) { theBreak.said[key] = true; fn(); } };

  if (!theBreak.exploded) {
    if (t > BREAK_CRACKS_START) once('a', function () { say('...what was that?', 2.5); });
    if (t > 8) once('b', function () { say('The cracks are SPREADING!', 2.5); });
    if (t > 12) once('c', function () { say("IT'S GOING TO BLOW!", 2.5); });
    // The light leaks through the cracks, brighter and brighter, in the
    // last two seconds.
    blindingLight = Math.max(0, (t - (BREAK_BOOM_AT - 2)) / 2) * 0.9;
    if (t > BREAK_BOOM_AT) explode(now);
  } else {
    // After the boom, the blinding light slowly fades away.
    blindingLight = Math.max(0, blindingLight - (1 / 60) / 3);
    if (t > BREAK_BOOM_AT + 3) once('d', function () { say('Where... am I?', 3); });
    if (t > BREAK_BOOM_AT + 7) once('e', function () { say('Get to the crack.', 3); });
  }

  // YOUR HEARTBEAT. Before the boom it speeds up from 60 beats a minute
  // to 170. After it, it stays fast and nervous.
  if (t > BREAK_CRACKS_START && now > theBreak.nextBeat) {
    let bpm = 95;
    if (!theBreak.exploded) {
      const progress = (t - BREAK_CRACKS_START) / (BREAK_BOOM_AT - BREAK_CRACKS_START);
      bpm = 60 + 110 * progress;
    }
    theBreak.nextBeat = now + 60 / bpm;   // a minute has 60 seconds
    heartbeat();
    // The screen edges throb purple, with every beat.
    if (flash < 0.15) { flash = 0.15; flashColor = '120, 20, 160'; }
  }
}

// BOOM. Throw the whole room away and build the floating world instead.
// The blinding light covers it up while we swap them, so it looks like
// the room really exploded.
function explode(now) {
  theBreak.exploded = true;
  boom();
  blindingLight = 1;
  faces = [];
  blocks = [];
  wallCracks = [];
  fogOverride = [25, 8, 40];   // deep purple space

  BREAK_PLATFORMS.forEach(function (p) { addFloatingBlock(p[0], p[1], p[2], p[3], p[4], false); });
  // The way out: a little brick wall on the last platform, with the crack.
  const last = BREAK_PLATFORMS[BREAK_PLATFORMS.length - 1];
  const wallZ = last[1], floorY = last[4];
  blocks.push({ minX: -2, maxX: 2, minY: floorY, maxY: floorY + 4, minZ: wallZ - 0.5, maxZ: wallZ });
  addBrickWall([-2, 0, wallZ], [1, 0, 0], 4, floorY, floorY + 4, [0, 0, 1]);
  addCrack(wallZ, 1, floorY);

  addArcadeFragments();

  // You land on the first platform.
  respawnPoint = { x: 0, y: 0, z: -6 };
  player.x = 0; player.y = 0; player.z = -6;
  player.vx = player.vy = player.vz = 0;
}

// ---------------------------------------------------------------------
//  FRAGMENTS OF THE OTHER GAMES, floating in space, bobbing up and down.
//  Each piece gets a "bob" so it floats: a speed, a starting point in
//  the wobble (phase), and how far it goes up and down (amp).
// ---------------------------------------------------------------------
function addArcadeFragments() {
  const bob = function () {
    return { bob: { speed: 0.6 + Math.random() * 0.6, phase: Math.random() * 6, amp: 0.3 + Math.random() * 0.4 } };
  };

  // MAX'S PIZZA: a giant slice, crust at the top, point at the bottom.
  let B = bob();
  const PIZZA = [250, 200, 70], PEPPERONI = [190, 40, 30], CRUST = [200, 130, 50];
  [1, -1].forEach(function (side) {
    addFace([[-8.5, 4, -12], [-5.5, 4, -12], [-7, 0, -12]], PIZZA, [0, 0, side], B);
  });
  addBox(-8.6, -5.4, 4, 4.4, -12.1, -11.9, CRUST, B);
  [[-7.6, 3.2], [-6.5, 2.9], [-7, 1.9]].forEach(function (p) {
    addBox(p[0] - 0.25, p[0] + 0.25, p[1] - 0.25, p[1] + 0.25, -11.88, -11.85, PEPPERONI, B);
  });

  addArcadeCard(-7, 4.8, -12, '🍕', "MAX'S PIZZA", B);

  // DEFEND THE TOOTH: a giant tooth with two roots.
  B = bob();
  addBox(5, 7, 0, 1.6, -16, -14, [245, 245, 235], B);
  addBox(5.2, 5.8, -1.4, 0, -15.5, -14.5, [235, 230, 215], B);
  addBox(6.2, 6.8, -1.4, 0, -15.5, -14.5, [235, 230, 215], B);

  addArcadeCard(6, 1.9, -13.9, '🦷', 'DEFEND THE TOOTH', B);

  // SNAKE FIGHT: a wiggly green snake made of blocks.
  B = bob();
  for (let i = 0; i < 9; i++) {
    const x = -7 + Math.sin(i * 0.8) * 1.2, z = -18 - i * 0.9;
    addBox(x - 0.4, x + 0.4, 4, 4.8, z - 0.4, z + 0.4, i === 0 ? [30, 160, 60] : [60, 200, 90], B);
  }

  addArcadeCard(-7, 5.2, -17.4, '🐍', 'SNAKE FIGHT', B);

  // BOOT BALL: a black-and-white football.
  B = bob();
  addSphere(6, 5, -22, 1.4, [240, 240, 240], [30, 30, 30], B);

  addArcadeCard(6, 6.6, -22, '⚽', 'BOOT BALL', B);

  // KNIGHTS OF THE FOUR: a castle tower with battlements on top.
  B = bob();
  addBox(-9, -7, -5, 2, -31, -29, [150, 150, 160], B);
  [[-9, -31], [-7.5, -31], [-9, -29.5], [-7.5, -29.5]].forEach(function (p) {
    addBox(p[0], p[0] + 0.5, 2, 2.6, p[1], p[1] + 0.5, [150, 150, 160], B);
  });

  addArcadeCard(-8, 3, -28.9, '🏰', 'KNIGHTS OF THE FOUR', B);

  // THE LOST SHIP: a red rocket with a pointy nose and fins.
  B = bob();
  addBox(6.5, 7.5, -1, 3, -33.5, -32.5, [220, 50, 50], B);
  addPyramid(7, 3, -33, 0.5, 1.4, [240, 240, 240], B);
  addBox(6, 6.5, -1, 0, -33.2, -32.8, [60, 60, 200], B);
  addBox(7.5, 8, -1, 0, -33.2, -32.8, [60, 60, 200], B);

  addArcadeCard(7, 4.6, -32.4, '🚀', 'THE LOST SHIP', B);

  // DICE QUEST: a big white dice.
  B = bob();
  addBox(-6, -4.5, 6, 7.5, -37, -35.5, [250, 250, 250], B);
  addBox(-5.4, -5.1, 7.5, 7.52, -36.4, -36.1, [20, 20, 20], B);   // one dot on top

  addArcadeCard(-5.25, 7.8, -35.4, '🎲', 'DICE QUEST', B);

  // CURSED CAVERN: a big black spider with eight legs.
  B = bob();
  addSphere(4, -2, -39, 0.8, [25, 25, 30], [60, 20, 20], B);
  for (let i = 0; i < 4; i++) {
    const z = -39.9 + i * 0.6;
    addBox(2, 3.4, -2.4, -2.2, z, z + 0.12, [20, 20, 20], B);
    addBox(4.6, 6, -2.4, -2.2, z, z + 0.12, [20, 20, 20], B);
  }

  addArcadeCard(4, -1, -38.8, '🕷️', 'CURSED CAVERN', B);

  // MONSTER DUEL: a giant playing card.
  B = bob();
  addBox(-5.5, -4, 0, 2.2, -43, -42.9, [200, 30, 40], B);
  addBox(-5.3, -4.2, 0.2, 2, -42.89, -42.88, [250, 245, 235], B);

  addArcadeCard(-4.75, 2.4, -42.8, '🃏', 'MONSTER DUEL', B);

  // A FART IN A CAVE: a big green cloud. Phew.
  B = bob();

  addSphere(-2.9, 7.4, -14.2, 0.9, [150, 210, 90], [130, 190, 70], B);
  addSphere(-4.9, 7.5, -13.8, 0.8, [130, 190, 70], [150, 210, 90], B);

}

// AN ARCADE CARD: a little dark card with a gold border, just like the
// ones on the Arcade menu, with the game's emoji and its real name. It
// floats along with its piece (B), so you know which game it came from.
function addArcadeCard(x, y, z, emoji, name, B) {
  const extra = Object.assign({ edge: [255, 199, 92], text: [emoji, name], textColor: '#ffe9b8' }, B);
  addFace([[x - 1.6, y, z], [x + 1.6, y, z], [x + 1.6, y + 1.1, z], [x - 1.6, y + 1.1, z]],
          [24, 20, 32], [0, 0, 1], extra);
}

// A ball made of little 4-sided patches, like a globe: rings going round
// (longitude) and rings going up (latitude). Two colours, chequered.
function addSphere(cx, cy, cz, r, colorA, colorB, extra) {
  const ROUND = 10, UP = 6;
  for (let i = 0; i < UP; i++) {
    const a0 = -Math.PI / 2 + Math.PI * i / UP, a1 = -Math.PI / 2 + Math.PI * (i + 1) / UP;
    for (let j = 0; j < ROUND; j++) {
      const b0 = Math.PI * 2 * j / ROUND, b1 = Math.PI * 2 * (j + 1) / ROUND;
      const at = function (a, b) {
        return [cx + Math.cos(a) * Math.cos(b) * r, cy + Math.sin(a) * r, cz + Math.cos(a) * Math.sin(b) * r];
      };
      const am = (a0 + a1) / 2, bm = (b0 + b1) / 2;
      const normal = [Math.cos(am) * Math.cos(bm), Math.sin(am), Math.cos(am) * Math.sin(bm)];
      addFace([at(a0, b0), at(a0, b1), at(a1, b1), at(a1, b0)],
              (i + j) % 2 === 0 ? colorA : colorB, normal, extra);
    }
  }
}

// A pyramid sitting on (cx, y, cz): a square base, and a point on top.
function addPyramid(cx, y, cz, halfWidth, height, color, extra) {
  const a = cx - halfWidth, b = cx + halfWidth, c = cz - halfWidth, d = cz + halfWidth;
  const tip = [cx, y + height, cz];
  addFace([[a, y, d], [b, y, d], tip], color, [0, 0.4, 1], extra);
  addFace([[b, y, c], [a, y, c], tip], color.map(function (v) { return v * 0.7; }), [0, 0.4, -1], extra);
  addFace([[b, y, d], [b, y, c], tip], color.map(function (v) { return v * 0.85; }), [1, 0.4, 0], extra);
  addFace([[a, y, c], [a, y, d], tip], color.map(function (v) { return v * 0.6; }), [-1, 0.4, 0], extra);
}

function buildSpikeRoom() {
  buildRoom(SPIKE_ROOM_MAP);
  addElevator(0, -1, false);                // the elevator you arrived in
  addCrack(-SPIKE_ROOM_MAP.length, 1);      // the way out, in the far wall
}

// FOUR SPIKES on one square of floor. Each spike is a PYRAMID: four
// triangles leaning in to meet at a sharp point at the top.
// y is how high the floor under them is (0 if you leave it out).
function addSpikes(x0, z0, y) {
  y = y || 0;
  const SPIKE_HEIGHT = 0.6;
  const METAL = [190, 195, 210];
  for (let sx = 0; sx < 2; sx++) {
    for (let sz = 0; sz < 2; sz++) {
      const a = x0 + sx * 0.5, b = a + 0.5;      // left and right of the base
      const c = z0 + sz * 0.5, d = c + 0.5;      // front and back of the base
      const tip = [a + 0.25, y + SPIKE_HEIGHT, c + 0.25];
      // Each triangle leans outward a bit, so its "normal" points out
      // and a little bit up. The shading makes the spike look 3D.
      addFace([[a, y, d], [b, y, d], tip], METAL.map(function (v) { return v * 0.85; }), [0, 0.4, 1]);
      addFace([[b, y, c], [a, y, c], tip], METAL.map(function (v) { return v * 0.6; }),  [0, 0.4, -1]);
      addFace([[b, y, d], [b, y, c], tip], METAL.map(function (v) { return v * 1.0; }),  [1, 0.4, 0]);
      addFace([[a, y, c], [a, y, d], tip], METAL.map(function (v) { return v * 0.7; }),  [-1, 0.4, 0]);
    }
  }
}

// ---------------------------------------------------------------------
//  THE ELEVATOR. A 2x2 metal platform with yellow and black danger
//  stripes round the edge, and a post at each corner.
//  We take away the floor tiles underneath it, so when it goes DOWN,
//  there's a real hole in the floor.
//    moving: true if this elevator is going to take you somewhere.
// ---------------------------------------------------------------------
let elevator = null;
function addElevator(cx, cz, moving) {
  const x0 = cx - 1, x1 = cx + 1, z0 = cz - 1, z1 = cz + 1;
  const insidePlatform = function (f) {
    return f.normal[1] === 1 && f.mid[1] === 0 &&
           f.mid[0] > x0 && f.mid[0] < x1 && f.mid[2] > z0 && f.mid[2] < z1;
  };
  // Hide the floor tiles under the platform (and keep them, in case the
  // elevator moves somewhere else and we need to put them back).
  const hidden = faces.filter(insidePlatform);
  faces = faces.filter(function (f) { return !insidePlatform(f); });

  const extra = moving ? { elevator: true } : null;
  const YELLOW = [250, 200, 20], DARK = [30, 30, 30], STEEL = [150, 155, 165];
  for (let x = x0; x < x1 - 0.01; x += 0.5) {
    for (let z = z0; z < z1 - 0.01; z += 0.5) {
      const edge = x === x0 || z === z0 || x + 0.5 >= x1 - 0.01 || z + 0.5 >= z1 - 0.01;
      const stripe = (Math.round(x * 2) + Math.round(z * 2)) % 2 === 0;
      const color = edge ? (stripe ? YELLOW : DARK) : STEEL;
      addFace([[x, 0.01, z], [x + 0.5, 0.01, z], [x + 0.5, 0.01, z + 0.5], [x, 0.01, z + 0.5]],
              color, [0, 1, 0], extra);
    }
  }
  // Four posts, one at each corner.
  [[x0, z0], [x1 - 0.12, z0], [x0, z1 - 0.12], [x1 - 0.12, z1 - 0.12]].forEach(function (p) {
    addBox(p[0], p[0] + 0.12, 0, 3, p[1], p[1] + 0.12, YELLOW, extra);
  });
  if (moving) {
    elevator = { x: cx, z: cz, drop: 0, riding: false, hiddenTiles: hidden };
  }
}

// Take the elevator away again, and put the floor back where it was.
function removeElevator() {
  if (!elevator) return;
  faces = faces.filter(function (f) { return !f.elevator; });
  faces = faces.concat(elevator.hiddenTiles);
  elevator = null;
}

function buildVolcano() {
  saws = [];
  VOLCANO_COURSE.forEach(function (line) {
    const kind = line[0];
    if (kind === 'block') {
      addFloatingBlock(line[1], line[2], line[3], line[4], line[5], false);
    } else if (kind === 'spikes') {
      // One patch of spikes on every 1x1 square in the area.
      for (let x = line[1]; x < line[1] + line[3]; x++) {
        for (let z = line[2]; z < line[2] + line[4]; z++) {
          addSpikes(x, z, line[5]);
          spikeCells.push({ minX: x, maxX: x + 1, minZ: z, maxZ: z + 1, y: line[5] });
        }
      }
    } else if (kind === 'saw') {
      addSaw(line[1], line[2], line[3], line[4], line[5]);
    }
  });

  // THE WALLS: a giant room made of white bricks, all the
  // way round, with a ceiling on top. No way out... except one.
  const L = -VOLCANO_HALF_WIDTH, R = VOLCANO_HALF_WIDTH;
  const BACK = 4, FRONT = VOLCANO_COURSE[VOLCANO_COURSE.length - 1][2];
  const BOTTOM = LAVA_LAKE_Y, TOP = VOLCANO_CEILING;
  blocks.push({ minX: L - 1, maxX: L, minY: BOTTOM - 2, maxY: TOP + 1, minZ: FRONT - 1, maxZ: BACK + 1 });
  blocks.push({ minX: R, maxX: R + 1, minY: BOTTOM - 2, maxY: TOP + 1, minZ: FRONT - 1, maxZ: BACK + 1 });
  blocks.push({ minX: L, maxX: R, minY: TOP, maxY: TOP + 1, minZ: FRONT - 1, maxZ: BACK + 1 });
  blocks.push({ minX: L, maxX: R, minY: BOTTOM - 2, maxY: TOP, minZ: BACK, maxZ: BACK + 1 });
  blocks.push({ minX: L, maxX: R, minY: BOTTOM - 2, maxY: TOP, minZ: FRONT - 1, maxZ: FRONT });
  // Big white bricks (2 long, 1 tall), so there aren't SO many to draw.
  // (Want dark volcano rock instead? Add  color: [75, 45, 40]  in here.)
  const ROCK = { long: 2, tall: 1 };
  const depth = BACK - FRONT, width = R - L;
  addBrickWall([L, 0, BACK], [0, 0, -1], depth, BOTTOM, TOP, [1, 0, 0], ROCK);    // left
  addBrickWall([R, 0, BACK], [0, 0, -1], depth, BOTTOM, TOP, [-1, 0, 0], ROCK);   // right
  addBrickWall([L, 0, BACK], [1, 0, 0], width, BOTTOM, TOP, [0, 0, -1], ROCK);    // behind you
  addBrickWall([L, 0, FRONT], [1, 0, 0], width, BOTTOM, TOP, [0, 0, 1], ROCK);    // the end
  for (let z = FRONT; z < BACK; z += 2) {          // the ceiling
    for (let x = L; x < R; x += 2) {
      addFace([[x, TOP, z], [x + 2, TOP, z], [x + 2, TOP, z + 2], [x, TOP, z + 2]],
              [95, 90, 85], [0, -1, 0]);
    }
  }

  // THE LAVA LAKE, way down below. Big 2x2 squares of lava, glowing.
  // And one giant invisible block of lava, so falling in counts.
  for (let x = L; x < R; x += 2) {
    for (let z = FRONT; z < BACK; z += 2) {
      addFace([[x, LAVA_LAKE_Y, z], [x + 2, LAVA_LAKE_Y, z], [x + 2, LAVA_LAKE_Y, z + 2], [x, LAVA_LAKE_Y, z + 2]],
              LAVA, [0, 1, 0], { lava: true });
    }
  }
  blocks.push({ minX: -40, maxX: 40, minZ: -120, maxZ: 40,
                minY: LAVA_LAKE_Y - 2, maxY: LAVA_LAKE_Y, lava: true });

  // THE WAY OUT: the purple crack, in the end wall, just above the last block.
  addCrack(FRONT, 1, VOLCANO_COURSE[VOLCANO_COURSE.length - 1][5]);
}

// A SAW: a spinning blade standing up on its edge, sliding side to side.
// Its corners change every frame (it spins and moves!), so instead of
// fixed corners, each saw face remembers which saw it belongs to, and the
// drawing code asks sawCorners() where the corners are RIGHT NOW.
function addSaw(middle, z, slide, speed, top) {
  const saw = { middle: middle, x: middle, y: top + 0.55, z: z, slide: slide,
                speed: speed, spin: 0, radius: 0.7 };
  saws.push(saw);
  // A blade and a hub, on both sides (so you can see it from either side).
  [1, -1].forEach(function (side) {
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [205, 210, 220], [0, 0, side],
            { saw: saw, side: side, part: 'blade' });
    addFace([[0, 0, 0], [0, 0, 0], [0, 0, 0]], [200, 40, 40], [0, 0, side],
            { saw: saw, side: side, part: 'hub' });
  });
}

// Where are a saw's corners right now? The blade is a circle of TEETH:
// points that go out to the full size, then in a bit, then out, then in.
// Turning all of them by "spin" makes it look like it's spinning.
function sawCorners(f) {
  const s = f.saw;
  const z = s.z + f.side * (f.part === 'hub' ? 0.04 : 0.02);
  const points = [];
  if (f.part === 'blade') {
    const TEETH = 14;
    for (let i = 0; i < TEETH * 2; i++) {
      const angle = s.spin + i * Math.PI / TEETH;
      const r = i % 2 === 0 ? s.radius : s.radius * 0.8;
      points.push([s.x + Math.cos(angle) * r, s.y + Math.sin(angle) * r, z]);
    }
  } else {
    for (let i = 0; i < 8; i++) {
      const angle = s.spin + i * Math.PI / 4;
      points.push([s.x + Math.cos(angle) * 0.22, s.y + Math.sin(angle) * 0.22, z]);
    }
  }
  return points;
}

function buildSkyCourse() {
  SKY_COURSE.forEach(function (line) {
    addFloatingBlock(line[0], line[1], line[2], line[3], line[4], line[5] === 'finish');
  });
}

// One floating block with a checkerboard top and stone sides.
function addFloatingBlock(left, front, width, depth, top, finish) {
    const b = {
      minX: left, maxX: left + width,
      minZ: front, maxZ: front + depth,
      maxY: top, minY: top - THICKNESS,
      finish: finish,
    };
    blocks.push(b);
    addCheckerboard(b.minX, b.maxX, b.minZ, b.maxZ, b.maxY, b.finish);

    // The four sides and the bottom. Each side gets a slightly different
    // shade, which fools your eyes into seeing a solid 3D block.
    const shade = function (k) { return STONE.map(function (v) { return v * k; }); };
    const x0 = b.minX, x1 = b.maxX, y0 = b.minY, y1 = b.maxY, z0 = b.minZ, z1 = b.maxZ;
    addFace([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], shade(0.8),  [0, 0, 1]);
    addFace([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], shade(0.8),  [0, 0, -1]);
    addFace([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], shade(0.6),  [1, 0, 0]);
    addFace([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], shade(0.6),  [-1, 0, 0]);
    addFace([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], shade(0.35), [0, -1, 0]);
}

// ---------------------------------------------------------------------
//  YOU.
// ---------------------------------------------------------------------
const player = {
  x: 0, y: 0, z: 0,                    // where your FEET are
  vx: 0, vy: 0, vz: 0,                 // how fast you're moving each way
  yaw: 0,                              // turning left and right
  pitch: 0,                            // looking up and down
  onGround: false,
  lastOnGround: 0,                     // when your feet last touched a block
};

let started = false;   // have you clicked/tapped to start yet?
let timerRunning = false, timeTaken = 0;
let finished = false;
let falls = 0;
let message = '', messageUntil = 0;
let touchUsed = false; // have we seen a finger? then show the phone buttons

function say(text, seconds) {
  message = text;
  messageUntil = performance.now() / 1000 + seconds;
}

// Back to the start of whatever level you're on.
function respawn() {
  const start = respawnPoint || LEVELS[levelIndex].start;
  player.x = start.x; player.y = start.y; player.z = start.z;
  player.vx = player.vy = player.vz = 0;
  player.yaw = 0; player.pitch = 0;
  timerRunning = false; timeTaken = 0; finished = false;
}

// Throw away the old level and build a new one.
function loadLevel(index) {
  levelIndex = index;
  rememberProgress(index);   // save where you are, for CONTINUE
  blocks = [];
  faces = [];
  crackExit = null;    // no crack unless build() makes one
  puzzle = null;       // no puzzle unless build() makes one
  nearButton = null;
  spikeCells = [];     // no spikes unless build() makes some
  yellowLine = null;   // no line unless build() makes one
  saws = [];           // no saws unless build() makes some
  puncher = null;      // no broken screen, unless this level says otherwise
  ghosts = [];         // no ghosts, unless this is the glitch hallway
  wallCracks = [];
  theBreak = null;     // nothing exploding, unless this is the break room
  respawnPoint = null;
  fogOverride = null;
  blindingLight = 0;
  truck = null;
  elevator = null;     // no elevator unless a button makes one
  blackout = 0;
  LEVELS[index].build();
  respawn();
  if (LEVELS[index].punch) startPunching();
  if (LEVELS[index].broken) startPunching(true);
  if (!started) return;   // still on the menu: no announcements yet
  if (LEVELS[index].voice) {
    // The voice talks first. The level's name waits until the robot
    // arms are finished, so the two don't land on top of each other.
    speakLines(LEVELS[index].voice);
    robo.thenSay = LEVELS[index].name;
  } else {
    say(LEVELS[index].name, 3);
  }
}

// Say several lines, one after another. Say the first one now, and keep
// the rest in a queue for when the robot arms finish building it.
function speakLines(lines) {
  speak(lines[0]);
  robo.nextLines = lines.slice(1);
}

// THE VOICE. Browsers come with built-in talking voices, called
// "speech synthesis". You give it words, and it reads them out loud.
//
// Every computer has DIFFERENT voices. Some are old and sound like
// robots. Newer ones, called "Natural" voices, sound like real people.
// So here's a list of favourites, best first. The game goes down the
// list and uses the first one this computer has.
//   - "Christopher" and "Guy" are deep, human-sounding voices in Edge.
//   - "Google" voices are in Chrome.
//   - "Daniel", "Premium" and "Enhanced" ones are on iPhones and iPads.
//   - "Mark" and "David" are the older Windows voices, if nothing else.
// Want a different voice? Move a name to the top of the list!
// THE ACCENT. Voices have a language code: 'en-AU' is Australian English,
// 'en-GB' is British, 'en-US' is American, 'en-IE' is Irish, 'en-IN' is
// Indian, 'en-NZ' is New Zealand. The game looks for this accent FIRST.
// Want a different accent? Change the code!
const VOICE_ACCENT = 'en-AU';

const VOICE_FAVOURITES = [
  'Natasha',                      // Australian woman (Edge) - a REALLY Aussie accent
  'William',                      // Australian man (Edge) - but he's a "Multilingual"
                                  // voice, and can sound quite American
  'Lee',                          // Australian man (iPhone/iPad)
  'Karen',                        // Australian woman (iPhone/iPad)
  'Christopher Online (Natural)',
  'Guy Online (Natural)',
  'Natural',
  'Google UK English Male',
  'Google US English',
  'Daniel',
  'Premium',
  'Enhanced',
  'Mark',
  'David',
];

// Every English voice this computer has. "Multilingual" ones can switch
// language all by themselves, so we leave those out, EXCEPT ones with our
// accent (Edge's Australian man, William, is a multilingual one).
// Some browsers write 'en_AU' with a line instead of a dash, so we fix that.
function accentOf(v) { return v.lang.replace('_', '-'); }
function englishVoices() {
  if (!window.speechSynthesis) return [];
  return window.speechSynthesis.getVoices().filter(function (v) {
    if (v.lang.indexOf('en') !== 0) return false;
    return v.name.indexOf('Multilingual') === -1 || accentOf(v) === VOICE_ACCENT;
  });
}

// YOUR VOICE PICK. Press V to try the next voice. The game remembers the
// one you picked (in "localStorage", a little notebook the browser keeps
// for each website), so it's still your pick next time you play.
// (It's saved as 'parkourVoiceAussie'. Giving it a new name made the game
// forget any old pick, so everyone starts with the Australian voice.)
let chosenVoiceName = '';
try { chosenVoiceName = localStorage.getItem('parkourVoiceAussie') || ''; } catch (e) {}

function pickVoice() {
  const english = englishVoices();
  // Did you pick one with V? Use that.
  const chosen = english.find(function (v) { return v.name === chosenVoiceName; });
  if (chosen) return chosen;
  // Otherwise: voices with our accent first, then all the others. Then
  // go down the favourites list in each.
  const withAccent = english.filter(function (v) { return accentOf(v) === VOICE_ACCENT; });
  for (const group of [withAccent, english]) {
    for (const favourite of VOICE_FAVOURITES) {
      const found = group.find(function (v) { return v.name.indexOf(favourite) !== -1; });
      if (found) return found;
    }
    if (group.length) return group[0];   // no favourites? any voice in the group.
  }
  return undefined;
}

// V: switch to the next English voice, and say something so you can hear it.
function nextVoice() {
  const english = englishVoices();
  if (!english.length) { say('This browser has no English voices 😢', 3); return; }
  const now = pickVoice();
  const next = english[(english.indexOf(now) + 1) % english.length];
  chosenVoiceName = next.name;
  try { localStorage.setItem('parkourVoiceAussie', next.name); } catch (e) {}
  // Voice names are long, like "Microsoft Mark - English (United States)".
  // Just show the short bit before the dash.
  say('🔊 Voice ' + (english.indexOf(next) + 1) + ' of ' + english.length + ': ' +
      next.name.split(' - ')[0], 3);
  sayOutLoud('Hello. Is this voice better?');
}

// The list of voices loads a moment after the page does, so we ask for
// it now. By the time you reach level 2 it's definitely ready.
if (window.speechSynthesis) window.speechSynthesis.getVoices();

// SPEAK = robot-arm subtitles + saying it out loud.
function speak(words) {
  // The robot arms build the words on screen, like subtitles.
  startRobotSubtitles(words);
  sayOutLoud(words);
}

// pitch is how high or low the voice is (1 is normal), and rate is how
// fast it talks (1 is normal). Squashing the pitch WAY down is what made
// it sound like a robot before. Real people sound best close to 1.
function sayOutLoud(words) {
  if (!window.speechSynthesis) return;   // some browsers can't talk. that's OK.

  const talk = function () {
    const voice = new SpeechSynthesisUtterance(words);
    // ENGLISH, PLEASE. Telling the browser the language means it can't
    // accidentally grab a voice from some other country.
    voice.lang = 'en-US';
    const best = pickVoice();
    if (best) { voice.voice = best; voice.lang = best.lang; }
    voice.pitch = 1;
    voice.rate = 0.9;

    // THE VOICE REPORT, in the bottom-left corner. It's like a detective's
    // notebook: which voice did we ask for, and did it actually talk?
    const shortName = best ? best.name.split(' - ')[0].replace('Microsoft ', '') : 'browser default';
    voiceReport = '🔊 ' + shortName + ' (' + voice.lang + ') · ' +
                  englishVoices().length + ' voices · waiting...';
    let voiceStarted = false;
    voice.onstart = function () {
      voiceStarted = true;
      voiceReport = voiceReport.replace('waiting...', 'TALKING ✓');
    };
    voice.onerror = function (e) {
      if (e.error !== 'interrupted') voiceReport = voiceReport.replace('waiting...', 'ERROR: ' + e.error);
    };

    // Stop anything it was already saying, then wait a tiny moment before
    // talking. Some browsers get muddled if you say "stop" and "go" at the
    // exact same instant, and then they never talk at all.
    window.speechSynthesis.cancel();
    setTimeout(function () {
      window.speechSynthesis.resume();     // in case it got stuck on "pause"
      window.speechSynthesis.speak(voice);
    }, 150);

    // THE STUCK-CHECKER. If the voice still hasn't started after 4 seconds,
    // the browser's talking machine is jammed. Clear it out and try once more.
    setTimeout(function () {
      if (voiceStarted || voice.__retried) return;
      voice.__retried = true;
      voiceReport = voiceReport.replace('waiting...', 'STUCK, trying again...');
      window.speechSynthesis.cancel();
      setTimeout(function () { window.speechSynthesis.speak(voice); }, 150);
      setTimeout(function () {
        if (!voiceStarted) voiceReport = voiceReport.replace('STUCK, trying again...',
          'STILL STUCK: close ALL Edge windows and open the game again');
      }, 5000);
    }, 4000);
  };

  // Is the list of voices ready yet? If not, wait for it (but not
  // forever: after one second, just talk with whatever's there).
  if (window.speechSynthesis.getVoices().length) {
    talk();
  } else {
    let done = false;
    const once = function () { if (!done) { done = true; talk(); } };
    window.speechSynthesis.addEventListener('voiceschanged', once);
    setTimeout(once, 1000);
  }
}

let crackExit = null;  // where the crack is, so we know when you walk into it
let flash = 0;               // how bright the screen flash is (1 = full, 0 = gone)
let flashColor = '170, 60, 255';   // what colour it flashes (red, green, blue)
let blackout = 0;            // how dark the screen is going (for the elevator ride)
const ELEVATOR_SPEED = 1.5;  // how fast the elevator goes down, in blocks per second
const TRUCK_GRAVITY = 18;    // how hard trucks fall. Bigger = faster truck!
const TRUCK_SWOOP = 4;       // how far ahead of you the truck starts its fall
const FOOT_SIZE = 0.15;      // how far your feet reach out from your middle

let nextLevelAt = 0;   // when to move on to the next level (0 = not yet)

// ---------------------------------------------------------------------
//  KEYBOARD AND MOUSE.
// ---------------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR') respawn();
  // e.repeat is true when you HOLD a key down and it repeats by itself.
  // We only want one push per press, so we ignore the repeats.
  if (e.code === 'KeyE' && !e.repeat) interact();
  if (e.code === 'KeyV' && !e.repeat) nextVoice();
  if (e.code === 'KeyM' && !e.repeat && started) openMenu();
  if (e.code === 'Escape' && started) openMenu();
});

// ESC. When your mouse is locked for looking around, the browser keeps
// the Esc key for itself: it uses it to give you your mouse back. So we
// can't always hear Esc. Instead we listen for the mouse being GIVEN
// BACK. If that happens in the middle of the game, open the title screen.
document.addEventListener('pointerlockchange', function () {
  if (document.pointerLockElement !== canvas && started) openMenu();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });

canvas.addEventListener('click', function (e) {
  // On the menu? Then a click means "press that box".
  if (!started) { menuClick(e.clientX, e.clientY); return; }
  unlockAudio();
  // POINTER LOCK hides the mouse and lets you turn forever without
  // the arrow hitting the edge of the screen. Press Esc to get it back.
  lockMouse();
});
document.addEventListener('mousemove', function (e) {
  mouseX = e.clientX; mouseY = e.clientY;   // for lighting up menu boxes
  if (document.pointerLockElement !== canvas) return;
  turn(e.movementX * 0.0025, e.movementY * 0.0025);
});

function turn(dx, dy) {
  player.yaw += dx;
  player.pitch -= dy;
  // Don't let you look so far up or down that you flip upside down.
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
}

// ---------------------------------------------------------------------
//  TOUCH CONTROLS, for phones and tablets.
//    Left half of the screen:  a thumb stick for running.
//    Right half:               drag to look around.
//    The big round button:     JUMP.
//  Each finger gets a "role" the moment it touches down, and keeps it
//  until it lifts, so two thumbs can do two jobs at once.
// ---------------------------------------------------------------------
const roles = {};
const stick = { active: false, ox: 0, oy: 0, dx: 0, dy: 0 };
const STICK_RADIUS = 60;
let touchJump = false;

function jumpButton() {
  const r = Math.max(38, Math.min(W, H) * 0.09);
  return { x: W - r - 30, y: H - r - 40, r: r };
}
// The PUSH button sits just above JUMP, and only shows up when you're
// next to something you can push.
function pushTouchButton() {
  const j = jumpButton();
  return { x: j.x, y: j.y - j.r * 2.6, r: j.r * 0.8 };
}
function inPushButton(x, y) {
  if (!nearButton) return false;
  const b = pushTouchButton();
  return Math.hypot(x - b.x, y - b.y) < b.r * 1.2;
}
// The little VOICE button at the top middle, for phones (no V key there).
function voiceTouchButton() {
  return { x: W / 2, y: 30, w: 110, h: 34 };
}
function inVoiceButton(x, y) {
  const b = voiceTouchButton();
  return Math.abs(x - b.x) < b.w / 2 + 8 && Math.abs(y - b.y) < b.h / 2 + 8;
}
function inJumpButton(x, y) {
  const b = jumpButton();
  return Math.hypot(x - b.x, y - b.y) < b.r * 1.3;  // a bit bigger than it looks, for thumbs
}

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  touchUsed = true;
  // On the menu? Then a tap means "press that box".
  if (!started) {
    const t = e.changedTouches[0];
    menuClick(t.clientX, t.clientY);
    return;
  }
  unlockAudio();
  for (const t of e.changedTouches) {
    if (inPushButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'push' };
      interact();
    } else if (inVoiceButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'voice' };
      nextVoice();
    } else if (inJumpButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'jump' };
      touchJump = true;
    } else if (t.clientX < W / 2) {
      roles[t.identifier] = { kind: 'stick' };
      stick.active = true; stick.ox = t.clientX; stick.oy = t.clientY;
      stick.dx = 0; stick.dy = 0;
    } else {
      roles[t.identifier] = { kind: 'look', lx: t.clientX, ly: t.clientY };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const role = roles[t.identifier];
    if (!role) continue;
    if (role.kind === 'stick') {
      let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
      const len = Math.hypot(dx, dy);
      if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
      stick.dx = dx / STICK_RADIUS; stick.dy = dy / STICK_RADIUS;
    } else if (role.kind === 'look') {
      turn((t.clientX - role.lx) * 0.006, (t.clientY - role.ly) * 0.006);
      role.lx = t.clientX; role.ly = t.clientY;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const role = roles[t.identifier];
    if (!role) continue;
    if (role.kind === 'stick') { stick.active = false; stick.dx = stick.dy = 0; }
    if (role.kind === 'jump') touchJump = false;
    delete roles[t.identifier];
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ---------------------------------------------------------------------
//  BUMPING INTO BLOCKS.
//  Does your body (a tall thin box) overlap this block? Two boxes overlap
//  only if they overlap side-to-side AND up-and-down AND front-to-back.
// ---------------------------------------------------------------------
function overlaps(b) {
  const e = 0.001;  // a tiny gap, so standing ON a block doesn't count as being IN it
  return player.x + BODY_RADIUS > b.minX + e && player.x - BODY_RADIUS < b.maxX - e &&
         player.z + BODY_RADIUS > b.minZ + e && player.z - BODY_RADIUS < b.maxZ - e &&
         player.y + BODY_HEIGHT > b.minY + e && player.y < b.maxY - e;
}

// We move one direction at a time (x, then z, then up/down). If that move
// pushed you into a block, we slide you back out the way you came.
// Doing it one direction at a time is what lets you slide along walls.
function moveX(amount) {
  player.x += amount;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    player.x = amount > 0 ? b.minX - BODY_RADIUS : b.maxX + BODY_RADIUS;
  }
}
function moveZ(amount) {
  player.z += amount;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    player.z = amount > 0 ? b.minZ - BODY_RADIUS : b.maxZ + BODY_RADIUS;
  }
}
let touchedLava = false;
function moveY(amount) {
  player.y += amount;
  player.onGround = false;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    if (amount < 0) {             // falling: land on top of it
      player.y = b.maxY;
      player.onGround = true;
      if (b.lava) touchedLava = true;
      if (b.finish && !finished) win();
    } else {                      // going up: bonk your head
      player.y = b.minY - BODY_HEIGHT;
    }
    player.vy = 0;
  }
}

// ---------------------------------------------------------------------
//  THE BUTTONS. Walk into a button's stand to push it.
// ---------------------------------------------------------------------
// Which button are you standing next to? (null = none.) The screen shows
// "Press E" whenever there is one.
let nearButton = null;
function checkButtons() {
  // The rainbow buttons are close together, so pick the NEAREST one.
  nearButton = null;
  let nearest = 1.1;   // anything farther than this doesn't count
  for (const b of puzzle.buttons) {
    const d = Math.hypot(player.x - b.x, player.z - b.z);
    if (d < nearest) { nearest = d; nearButton = b; }
  }
}

// E (or the PUSH button on a phone): push whatever you're next to.
function interact() {
  if (puzzle && nearButton) pushButton(nearButton);
}

function pushButton(b) {
  if (puzzle.kind === 'rainbow') { pushRainbowButton(b); return; }
  if (b.color === 'red') {
    // THE SIGN LIED. ZAP!
    zap();
    flash = 1; flashColor = '255, 240, 120';   // a bright yellow-white zap
    falls++;
    say('ZAAAAP! ⚡ The sign LIED!', 2.5);
    respawn();
    if (!puzzle.solved) resetPuzzle();
    return;
  }
  if (puzzle.solved || b.lit) return;

  const rightOne = PUZZLE_ANSWER[puzzle.progress];
  if (b.color === rightOne) {
    b.lit = true;
    puzzle.progress++;
    ding(puzzle.progress);
    if (puzzle.progress === PUZZLE_ANSWER.length) {
      // SOLVED! A crack opens... in the wall behind where you started.
      puzzle.solved = true;
      addCrack(0, -1);
      rumble();
      flash = 0.6; flashColor = '170, 60, 255';
      say('Something just CRACKED behind you...', 3.5);
    } else {
      say('*click*', 1);
    }
  } else {
    buzz();
    say('BZZZT! Wrong order. Try again.', 2);
    resetPuzzle();
  }
}

// THE RAINBOW BUTTONS. Pick any colour you like. It makes no difference
// at all: an elevator ALWAYS appears right behind you. (Push another one
// and it jumps to be behind you again.)
function pushRainbowButton(b) {
  if (elevator && elevator.riding) return;
  puzzle.buttons.forEach(function (other) { other.lit = false; });
  b.lit = true;

  // "Behind you" is the opposite way to where you're looking. Forward is
  // (sin, -cos) of your turn angle, so behind is (-sin, +cos).
  const AWAY = 2.6;
  let ex = player.x - Math.sin(player.yaw) * AWAY;
  let ez = player.z + Math.cos(player.yaw) * AWAY;
  // Keep it inside the room, and away from the buttons.
  const halfWidth = RAINBOW_ROOM_MAP[0].length / 2;
  const depth = RAINBOW_ROOM_MAP.length;
  ex = Math.max(-halfWidth + 1.2, Math.min(halfWidth - 1.2, ex));
  ez = Math.max(-depth + 4, Math.min(-1.2, ez));
  // SNAP it to the tile grid (like Minecraft blocks snapping into place),
  // so its edges line up exactly with the floor tiles. Otherwise there'd be
  // a thin crack between the elevator and the floor.
  ex = Math.round(ex * 2) / 2;
  ez = Math.round(ez * 2) / 2;

  removeElevator();
  addElevator(ex, ez, true);
  elevatorDing();
  say(b.color.toUpperCase() + '! Good choice. *DING* ...an elevator appeared behind you.', 3.5);
}

function resetPuzzle() {
  puzzle.progress = 0;
  puzzle.buttons.forEach(function (b) { b.lit = false; });
}

function win() {
  finished = true;
  timerRunning = false;
  const lastLevel = levelIndex === LEVELS.length - 1;
  if (lastLevel) {
    say('YOU BEAT THE WHOLE GAME! ' + timeTaken.toFixed(2) + ' seconds', 8);
  } else {
    const how = crackExit ? 'WHOOOSH! Through the crack! ' : 'LEVEL ' + (levelIndex + 1) + ' DONE! ';
    say(how + timeTaken.toFixed(2) + ' seconds', 3);
    nextLevelAt = performance.now() / 1000 + 3;   // move on in 3 seconds
  }
}

// ---------------------------------------------------------------------
//  UPDATE: everything that happens in one tick of time.
//  dt is how many seconds passed since the last tick (usually about 0.016).
// ---------------------------------------------------------------------
function update(dt, now) {
  if (!started) return;
  updatePunching(now);
  if (LEVELS[levelIndex].glitchHall) updateGlitchHall(now);
  if (LEVELS[levelIndex].theBreak) updateBreak(now);

  // THE TRUCK IS COMING. You're frozen to the spot, and your head tilts
  // up so you can watch it fall. (You can't look away. Sorry.)
  if (truck) {
    player.vx = player.vz = 0;
    player.yaw += (0 - player.yaw) * Math.min(1, dt * 5);          // face down the hallway
    player.pitch += (0.6 - player.pitch) * Math.min(1, dt * 5);   // and look up, smoothly
    if (!truck.squashedAt) {
      truck.speed += TRUCK_GRAVITY * dt;
      truck.y -= truck.speed * dt;
      // The lower it gets, the closer it swoops. At head height: right on you.
      const start = HALLWAY_HEIGHT - 2.5;
      truck.ahead = -TRUCK_SWOOP * Math.max(0, (truck.y - BODY_HEIGHT) / (start - BODY_HEIGHT));
      // Has the bottom of the truck reached the top of your head?
      if (truck.y <= BODY_HEIGHT) {
        truck.y = BODY_HEIGHT;
        truck.squashedAt = now;
        crash();
        blackout = 1;
        falls++;
        say('SQUASH! 🚚 HONK HONK! A truck fell on you.', 2.5);
      }
    } else if (now - truck.squashedAt > 1.8) {
      // Back to the start, nice and flat. Well, not flat. You're fine.
      removeTruck();
      blackout = 0;
      respawn();
    }
    return;
  }

  // STEPPED ON THE YELLOW LINE? Your feet are on the floor, and touching it.
  if (yellowLine && player.onGround && player.y < 0.05 &&
      player.z - FOOT_SIZE < yellowLine.z1 && player.z + FOOT_SIZE > yellowLine.z0) {
    dropTruck();
    return;
  }

  // RIDING THE ELEVATOR. While it goes down, you can look around, but
