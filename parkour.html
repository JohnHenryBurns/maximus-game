<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no stops a double-tap zooming the page in the middle of a jump. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Max's Parkour</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* The same "back to the arcade" pill every game has, in the same corner. */
    a.arcade-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #ffffff; text-decoration: none;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 7px 13px; border-radius: 999px;
      position: fixed; z-index: 10;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
<a id="back" class="arcade-pill" href="index.html"><span>&larr;</span>Arcade</a>
<canvas id="game"></canvas>

<script>
/* The game grabs every touch, which would swallow a tap on the Arcade pill.
   So the pill handles its own taps first and stops them going any further. */
(function () {
  var pill = document.getElementById('back');
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

<script>
// =====================================================================
//  MAX'S PARKOUR
//
//  Cursed Cavern used a trick called RAYCASTING, which is brilliant for
//  flat mazes but can't do jumping UP onto things. Parkour is ALL jumping
//  up onto things. So this game does real 3D, by hand:
//
//    1. The world is a list of BLOCKS (boxes).
//    2. Every frame, each corner of each block is moved so it's measured
//       from your eyes instead of from the middle of the world.
//    3. Then it's squashed flat onto the screen: things far away get
//       squashed closer to the middle. That's what makes it look 3D.
//    4. We paint the farthest bits first and the nearest bits last, so
//       near things cover far things. Painters do the same with a
//       background and then the trees on top. It's called the
//       PAINTER'S ALGORITHM.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
//  THE NUMBERS THAT DECIDE HOW YOU MOVE.
//  Try changing these! What do you think happens if JUMP_POWER is 15?
// ---------------------------------------------------------------------
const RUN_SPEED   = 6;    // blocks per second
const JUMP_POWER  = 9;    // how fast you shoot upward when you jump
const GRAVITY     = 25;   // how hard the world pulls you back down
const EYE_HEIGHT  = 1.6;  // your eyes are this far above your feet
const BODY_HEIGHT = 1.8;  // you're this tall, so you bonk your head on things
const BODY_RADIUS = 0.3;  // how wide you are (from the middle to the edge)
const FALL_LIMIT  = -20;  // fall below this and you're sent back to the start

// ---------------------------------------------------------------------
//  TILE SIZE. How big each checkerboard square is, in blocks.
//  It used to be 1. Now it's 0.5, so four little tiles fit where one
//  big one used to be. Try 0.25 for tiny ones!
// ---------------------------------------------------------------------
const TILE = 0.5;

const WHITE = [235, 235, 235], BLACK = [20, 20, 24];
const GOLD = [255, 200, 40], DARK_GOLD = [90, 60, 0];
const STONE = [120, 125, 140];
const LAVA = [255, 90, 0];
const LAVA_Y = -0.4;      // lava sits this far down below the floor
const THICKNESS = 0.6;    // how thick each floating block is

// ---------------------------------------------------------------------
//  LEVEL 1: THE LAVA TUNNEL.
//  This is a MAP. Each line is one step of the tunnel, and the first line
//  is where you start. Each letter is one square of floor:
//
//     .  = floor     L  = LAVA!     F  = the gold finish
//
//  You can redesign the whole level just by typing letters here.
//  Keep every line exactly 4 letters long, so the tunnel stays straight.
// ---------------------------------------------------------------------
const TUNNEL_MAP = [
  '....',
  '....',
  '....',
  '....',
  'LL..',   // a little pool. go around it!
  '....',
  '....',
  '..LL',
  '....',
  '....',
  'LLLL',   // no way round this one. JUMP.
  '....',
  '....',
  '.LL.',
  '.LL.',
  '....',
  '....',
  'L..L',
  'L..L',
  'L..L',
  '....',
  '....',
  'LLLL',   // a two-step jump
  'LLLL',
  '....',
  '....',
  'LLLL',
  'LL.L',   // one tiny stepping stone in the middle of the lava
  'LLLL',
  '....',
  '....',
  '....',
  '....',   // ...and at the very end: the glowing purple crack!
];
const TUNNEL_HEIGHT = 4;  // how high the ceiling is

// THE CRACK. A jagged split in the end wall, glowing purple. It's a list
// of corner points [across, up]: up the left side, then back down the
// right side. Zigzagging in and out is what makes it look cracked.
const CRACK_SHAPE = [
  [-0.35, 0], [-0.5, 0.5], [-0.25, 0.9], [-0.55, 1.4], [-0.3, 1.9],
  [-0.45, 2.4], [-0.15, 2.9], [0, 3.3],
  [0.2, 2.8], [0.4, 2.3], [0.15, 1.8], [0.5, 1.3], [0.3, 0.8],
  [0.55, 0.4], [0.35, 0],
];

// ---------------------------------------------------------------------
//  LEVEL 2: THE SKY COURSE (the very first level we made).
//  Each line is one block: [left edge, front edge, width, depth, top height].
//  Forward is the minus direction, so the course goes to bigger minus
//  numbers the further you get.
// ---------------------------------------------------------------------
const SKY_COURSE = [
  [-3,   -3, 6, 6, 0],    // the start pad
  [-1,   -7, 2, 2, 0],    // first easy hop
  [-1,  -12, 2, 2, 0.5],  // a bigger gap, and a bit higher
  [ 2,  -15, 2, 2, 1],    // off to the right
  [-1,  -19, 2, 2, 1.5],
  [ 0,  -28, 1, 7, 1.5],  // the skinny beam. don't wobble.
  [-1,  -31, 3, 2, 2],    // stairs up...
  [-1,  -34, 3, 2, 3],
  [ 2,  -37, 1, 1, 3],    // tiny one-tile hops
  [ 0,  -40, 1, 1, 3],
  [-2,  -43, 1, 1, 3.5],
  [ 0,  -46, 1, 1, 4],
  [-2,  -54, 4, 5, 4, 'finish'],  // the GOLD finish pad
];

// The list of levels, in order. Each one says what it's called, where you
// start, what colour the far-away fog is, and which function builds it.
const LEVELS = [
  { name: 'LEVEL 1: THE LAVA TUNNEL', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildTunnel },
  { name: 'LEVEL 2: THE PUZZLE ROOM', start: { x: 0, y: 0, z: -1.5 },
    fogColor: [70, 45, 35], fogDistance: 40, sky: false, build: buildPuzzleRoom,
    // What the mysterious voice says when you arrive, one line at a time.
    // Change them to anything! Add more lines if you want!
    voice: [
      'Hello. Welcome to the game. I see you have beat the first level.',
      'Ah, puzzles. My favorite.',
    ] },
  { name: 'LEVEL 3: THE SKY COURSE', start: { x: 0, y: 0, z: 1.5 },
    fogColor: [120, 170, 230], fogDistance: 70, sky: true, build: buildSkyCourse },
];

// ---------------------------------------------------------------------
//  LEVEL 2: THE PUZZLE ROOM.
//  A room with three buttons, and a sign that tells you which one to
//  push first. The sign is LYING. The red button zaps you.
//
//  PUZZLE_ANSWER is the secret right order. Change it to make your own
//  puzzle! (Don't put 'red' in it... or do. It's your game.)
// ---------------------------------------------------------------------
const PUZZLE_ANSWER = ['green', 'blue'];
const SIGN_WORDS = ['PUSH THE RED', 'BUTTON FIRST'];
const PUZZLE_ROOM_MAP = [
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
  '..........',
];
const BUTTON_COLORS = {
  red:   [230, 30, 30],
  blue:  [40, 90, 240],
  green: [40, 200, 60],
};
let puzzle = null;   // the buttons and how far you've got. Only level 2 has one.

// These get filled in when a level loads.
let blocks = [];   // the solid boxes you can stand on and bump into
let faces = [];    // the flat shapes we paint on the screen
let levelIndex = 0;

// ---------------------------------------------------------------------
//  FACES. A face is one flat shape we paint: a list of corners, a colour,
//  and which way it points (its "normal"). "extra" can add things like
//  a mortar colour for bricks, or lava: true to make it glow.
// ---------------------------------------------------------------------
function addFace(corners, color, normal, extra) {
  // The middle of the face. We use it to decide what's nearer.
  let cx = 0, cy = 0, cz = 0;
  corners.forEach(function (c) { cx += c[0]; cy += c[1]; cz += c[2]; });
  const n = corners.length;
  const face = { corners: corners, color: color, normal: normal,
                 mid: [cx / n, cy / n, cz / n] };
  if (extra) Object.assign(face, extra);
  faces.push(face);
}

// A checkerboard floor, from x0 to x1 and z0 to z1, at height y.
// To pick a tile's colour, count which tile it is across and which tile
// it is forward, and add them up. Even = one colour, odd = the other.
function addCheckerboard(x0, x1, z0, z1, y, finish) {
  for (let x = x0; x < x1 - 0.001; x += TILE) {
    for (let z = z0; z < z1 - 0.001; z += TILE) {
      const count = Math.round(x / TILE) + Math.round(z / TILE);
      const even = ((count % 2) + 2) % 2 === 0;
      let color;
      if (finish) color = even ? GOLD : DARK_GOLD;
      else        color = even ? WHITE : BLACK;
      addFace([[x, y, z], [x + TILE, y, z], [x + TILE, y, z + TILE], [x, y, z + TILE]],
              color, [0, 1, 0]);
    }
  }
}

// A wall of white bricks. Bricks are 1 long and half a block tall, and
// every other row is shifted along by half a brick. That's how real
// brick walls are built, so they don't have one long crack down them.
//   start:   one bottom corner of the wall
//   along:   which way the wall runs, like [0, 0, -1]
//   length:  how long it is
//   normal:  which way the wall faces
function addBrickWall(start, along, length, yBottom, yTop, normal) {
  const BRICK_LONG = 1, BRICK_TALL = 0.5;
  const MORTAR = [150, 140, 130];   // the grey cement between bricks
  const at = function (u, y) {
    return [start[0] + along[0] * u, y, start[2] + along[2] * u];
  };
  let row = 0;
  for (let y = yBottom; y < yTop - 0.001; y += BRICK_TALL, row++) {
    const shift = (row % 2) * (BRICK_LONG / 2);
    for (let u = -shift; u < length; u += BRICK_LONG) {
      const u0 = Math.max(0, u), u1 = Math.min(length, u + BRICK_LONG);
      const y1 = Math.min(yTop, y + BRICK_TALL);
      // Every brick is a slightly different white, so it looks real.
      const tint = 215 + Math.floor(Math.random() * 30);
      addFace([at(u0, y), at(u1, y), at(u1, y1), at(u0, y1)],
              [tint, tint - 4, tint - 10], normal, { edge: MORTAR });
    }
  }
}

function buildTunnel() {
  buildRoom(TUNNEL_MAP);
  addCrack(-TUNNEL_MAP.length, 1);   // the way out: in the wall at the far end
}

// Builds a closed-in room from a map: floor, lava, white brick walls and
// a ceiling. The tunnel and the puzzle room are both made with this.
// That's the good thing about a FUNCTION: write it once, use it lots.
function buildRoom(map) {
  const rows = map.length;
  const width = map[0].length;
  const left = -width / 2, right = width / 2;
  const back = 0, front = -rows;   // the room runs from z=0 to z=-rows
  const top = TUNNEL_HEIGHT;

  // What letter is at this spot on the map? Outside the map counts as wall.
  function letterAt(row, col) {
    if (row < 0 || row >= rows || col < 0 || col >= width) return '#';
    return map[row][col];
  }

  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < width; col++) {
      const letter = letterAt(row, col);
      const x0 = left + col, x1 = x0 + 1;
      const z1 = -row, z0 = z1 - 1;    // row 0 is nearest the start

      if (letter === 'L') {
        // LAVA: a block sunk down below the floor, that glows and burns.
        blocks.push({ minX: x0, maxX: x1, minZ: z0, maxZ: z1,
                      minY: LAVA_Y - 1, maxY: LAVA_Y, lava: true });
        addFace([[x0, LAVA_Y, z0], [x1, LAVA_Y, z0], [x1, LAVA_Y, z1], [x0, LAVA_Y, z1]],
                LAVA, [0, 1, 0], { lava: true });
        continue;
      }

      // FLOOR (or the gold finish).
      const finish = letter === 'F';
      blocks.push({ minX: x0, maxX: x1, minZ: z0, maxZ: z1,
                    minY: -THICKNESS, maxY: 0, finish: finish });
      addCheckerboard(x0, x1, z0, z1, 0, finish);

      // If there's lava next door, this square of floor has an edge you
      // can see down into the pool. Paint that edge as dark rock.
      const ROCK = [70, 55, 50];
      if (letterAt(row, col - 1) === 'L')
        addFace([[x0, LAVA_Y, z0], [x0, LAVA_Y, z1], [x0, 0, z1], [x0, 0, z0]], ROCK, [-1, 0, 0]);
      if (letterAt(row, col + 1) === 'L')
        addFace([[x1, LAVA_Y, z0], [x1, LAVA_Y, z1], [x1, 0, z1], [x1, 0, z0]], ROCK, [1, 0, 0]);
      if (letterAt(row - 1, col) === 'L')
        addFace([[x0, LAVA_Y, z1], [x1, LAVA_Y, z1], [x1, 0, z1], [x0, 0, z1]], ROCK, [0, 0, 1]);
      if (letterAt(row + 1, col) === 'L')
        addFace([[x0, LAVA_Y, z0], [x1, LAVA_Y, z0], [x1, 0, z0], [x0, 0, z0]], ROCK, [0, 0, -1]);
    }
  }

  // THE WALLS, CEILING AND ENDS. Big solid boxes so you can't escape...
  blocks.push({ minX: left - 1, maxX: left, minY: -2, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: right, maxX: right + 1, minY: -2, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: top, maxY: top + 1, minZ: front - 1, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: -2, maxY: top, minZ: back, maxZ: back + 1 });
  blocks.push({ minX: left, maxX: right, minY: -2, maxY: top, minZ: front - 1, maxZ: front });

  // ...and white bricks painted on the insides of them.
  addBrickWall([left, 0, back], [0, 0, -1], rows, LAVA_Y, top, [1, 0, 0]);    // left wall
  addBrickWall([right, 0, back], [0, 0, -1], rows, LAVA_Y, top, [-1, 0, 0]);  // right wall
  addBrickWall([left, 0, back], [1, 0, 0], width, LAVA_Y, top, [0, 0, -1]);   // wall behind you
  addBrickWall([left, 0, front], [1, 0, 0], width, LAVA_Y, top, [0, 0, 1]);   // wall at the end

  // The ceiling: plain grey stone panels.
  for (let z = front; z < back; z++) {
    for (let x = left; x < right; x++) {
      const shade = 95 + (((x + z) % 2 + 2) % 2 === 0 ? 0 : 8);
      addFace([[x, top, z], [x + 1, top, z], [x + 1, top, z + 1], [x, top, z + 1]],
              [shade, shade - 5, shade - 10], [0, -1, 0]);
    }
  }
}

// THE GLOWING PURPLE CRACK, the way out of a room. We paint it three
// times: a big faint glow around it, the purple crack, and a bright
// white-hot middle. "layer" tells the painter to do these LAST, on top
// of the bricks, in that order.
//   wallZ:  where the wall is
//   facing: 1 if the wall faces you as you walk forward (the far wall),
//          -1 if it's the wall behind where you started
function addCrack(wallZ, facing) {
  const crackZ = wallZ + 0.02 * facing;   // a hair in front of the wall
  const crackCorners = function (stretchX, stretchY) {
    return CRACK_SHAPE.map(function (p) {
      const y = 1.6 + (p[1] - 1.6) * stretchY;          // stretch around the middle
      return [p[0] * stretchX, Math.max(0.02, y), crackZ];  // but never below the floor
    });
  };
  const normal = [0, 0, facing];
  addFace(crackCorners(2.2, 1.25), [170, 60, 255], normal, { glow: 'halo', layer: 1 });
  addFace(crackCorners(1, 1),      [170, 60, 255], normal, { glow: 'crack', layer: 2 });
  addFace(crackCorners(0.3, 0.85), [250, 220, 255], normal, { glow: 'core', layer: 3 });
  crackExit = { z: wallZ, facing: facing, halfWidth: 0.45 };
}

// A plain box with all six sides, for things like button stands.
// "extra" gets stuck onto every face (that's how buttons know they're buttons).
function addBox(x0, x1, y0, y1, z0, z1, color, extra) {
  const shade = function (k) { return color.map(function (v) { return v * k; }); };
  addFace([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], shade(1),    [0, 1, 0], extra);
  addFace([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], shade(0.8),  [0, 0, 1], extra);
  addFace([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], shade(0.8),  [0, 0, -1], extra);
  addFace([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], shade(0.65), [1, 0, 0], extra);
  addFace([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], shade(0.65), [-1, 0, 0], extra);
}

function buildPuzzleRoom() {
  buildRoom(PUZZLE_ROOM_MAP);
  const front = -PUZZLE_ROOM_MAP.length;

  // THE THREE BUTTONS, each on a grey stand near the far wall.
  // Red first, like the sign says. Hmm.
  puzzle = { buttons: [], progress: 0, solved: false };
  [['red', -3], ['blue', 0], ['green', 3]].forEach(function (b) {
    const color = b[0], x = b[1], z = front + 2;
    const button = { color: color, x: x, z: z, lit: false, touching: false };
    puzzle.buttons.push(button);
    // The stand: solid, so you bump into it.
    blocks.push({ minX: x - 0.3, maxX: x + 0.3, minY: 0, maxY: 1, minZ: z - 0.3, maxZ: z + 0.3 });
    addBox(x - 0.3, x + 0.3, 0, 1, z - 0.3, z + 0.3, [90, 90, 100]);
    // The big round(ish) button on top.
    addBox(x - 0.2, x + 0.2, 1, 1.15, z - 0.2, z + 0.2, BUTTON_COLORS[color], { button: button });
  });

  // THE SIGN. A wooden board on the far wall, with words painted on it.
  // The corners go: bottom-left, bottom-right, top-right, top-left.
  const signZ = front + 0.03;
  addFace([[-2.5, 2.2, signZ], [2.5, 2.2, signZ], [2.5, 3.5, signZ], [-2.5, 3.5, signZ]],
          [160, 110, 60], [0, 0, 1], { edge: [80, 50, 20], text: SIGN_WORDS, layer: 0.5 });
}

function buildSkyCourse() {
  SKY_COURSE.forEach(function (line) {
    const b = {
      minX: line[0], maxX: line[0] + line[2],
      minZ: line[1], maxZ: line[1] + line[3],
      maxY: line[4], minY: line[4] - THICKNESS,
      finish: line[5] === 'finish',
    };
    blocks.push(b);
    addCheckerboard(b.minX, b.maxX, b.minZ, b.maxZ, b.maxY, b.finish);

    // The four sides and the bottom. Each side gets a slightly different
    // shade, which fools your eyes into seeing a solid 3D block.
    const shade = function (k) { return STONE.map(function (v) { return v * k; }); };
    const x0 = b.minX, x1 = b.maxX, y0 = b.minY, y1 = b.maxY, z0 = b.minZ, z1 = b.maxZ;
    addFace([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], shade(0.8),  [0, 0, 1]);
    addFace([[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0]], shade(0.8),  [0, 0, -1]);
    addFace([[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1]], shade(0.6),  [1, 0, 0]);
    addFace([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], shade(0.6),  [-1, 0, 0]);
    addFace([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], shade(0.35), [0, -1, 0]);
  });
}

// ---------------------------------------------------------------------
//  YOU.
// ---------------------------------------------------------------------
const player = {
  x: 0, y: 0, z: 0,                    // where your FEET are
  vx: 0, vy: 0, vz: 0,                 // how fast you're moving each way
  yaw: 0,                              // turning left and right
  pitch: 0,                            // looking up and down
  onGround: false,
  lastOnGround: 0,                     // when your feet last touched a block
};

let started = false;   // have you clicked/tapped to start yet?
let timerRunning = false, timeTaken = 0;
let finished = false;
let falls = 0;
let message = '', messageUntil = 0;
let touchUsed = false; // have we seen a finger? then show the phone buttons

function say(text, seconds) {
  message = text;
  messageUntil = performance.now() / 1000 + seconds;
}

// Back to the start of whatever level you're on.
function respawn() {
  const start = LEVELS[levelIndex].start;
  player.x = start.x; player.y = start.y; player.z = start.z;
  player.vx = player.vy = player.vz = 0;
  player.yaw = 0; player.pitch = 0;
  timerRunning = false; timeTaken = 0; finished = false;
}

// Throw away the old level and build a new one.
function loadLevel(index) {
  levelIndex = index;
  blocks = [];
  faces = [];
  crackExit = null;    // no crack unless build() makes one
  puzzle = null;       // no puzzle unless build() makes one
  LEVELS[index].build();
  respawn();
  if (LEVELS[index].voice) {
    // The voice talks first. The level's name waits until the robot
    // arms are finished, so the two don't land on top of each other.
    speakLines(LEVELS[index].voice);
    robo.thenSay = LEVELS[index].name;
  } else {
    say(LEVELS[index].name, 3);
  }
}

// Say several lines, one after another. Say the first one now, and keep
// the rest in a queue for when the robot arms finish building it.
function speakLines(lines) {
  speak(lines[0]);
  robo.nextLines = lines.slice(1);
}

// THE VOICE. Browsers come with built-in talking voices, called
// "speech synthesis". You give it words, and it reads them out loud.
//
// Every computer has DIFFERENT voices. Some are old and sound like
// robots. Newer ones, called "Natural" voices, sound like real people.
// So here's a list of favourites, best first. The game goes down the
// list and uses the first one this computer has.
//   - "Christopher" and "Guy" are deep, human-sounding voices in Edge.
//   - "Google" voices are in Chrome.
//   - "Daniel", "Premium" and "Enhanced" ones are on iPhones and iPads.
//   - "Mark" and "David" are the older Windows voices, if nothing else.
// Want a different voice? Move a name to the top of the list!
const VOICE_FAVOURITES = [
  'Christopher Online (Natural)',
  'Guy Online (Natural)',
  'Natural',
  'Google UK English Male',
  'Google US English',
  'Daniel',
  'Premium',
  'Enhanced',
  'Mark',
  'David',
];

// Every English voice this computer has. "Multilingual" ones can switch
// language all by themselves, so we leave those out.
function englishVoices() {
  if (!window.speechSynthesis) return [];
  return window.speechSynthesis.getVoices().filter(function (v) {
    return v.lang.indexOf('en') === 0 && v.name.indexOf('Multilingual') === -1;
  });
}

// YOUR VOICE PICK. Press V to try the next voice. The game remembers the
// one you picked (in "localStorage", a little notebook the browser keeps
// for each website), so it's still your pick next time you play.
let chosenVoiceName = '';
try { chosenVoiceName = localStorage.getItem('parkourVoice') || ''; } catch (e) {}

function pickVoice() {
  const english = englishVoices();
  // Did you pick one with V? Use that.
  const chosen = english.find(function (v) { return v.name === chosenVoiceName; });
  if (chosen) return chosen;
  // Otherwise go down the favourites list.
  for (const favourite of VOICE_FAVOURITES) {
    const found = english.find(function (v) { return v.name.indexOf(favourite) !== -1; });
    if (found) return found;
  }
  return english[0];   // none of our favourites? use any English voice.
}

// V: switch to the next English voice, and say something so you can hear it.
function nextVoice() {
  const english = englishVoices();
  if (!english.length) { say('This browser has no English voices 😢', 3); return; }
  const now = pickVoice();
  const next = english[(english.indexOf(now) + 1) % english.length];
  chosenVoiceName = next.name;
  try { localStorage.setItem('parkourVoice', next.name); } catch (e) {}
  // Voice names are long, like "Microsoft Mark - English (United States)".
  // Just show the short bit before the dash.
  say('🔊 Voice ' + (english.indexOf(next) + 1) + ' of ' + english.length + ': ' +
      next.name.split(' - ')[0], 3);
  sayOutLoud('Hello. Is this voice better?');
}

// The list of voices loads a moment after the page does, so we ask for
// it now. By the time you reach level 2 it's definitely ready.
if (window.speechSynthesis) window.speechSynthesis.getVoices();

// SPEAK = robot-arm subtitles + saying it out loud.
function speak(words) {
  // The robot arms build the words on screen, like subtitles.
  startRobotSubtitles(words);
  sayOutLoud(words);
}

// pitch is how high or low the voice is (1 is normal), and rate is how
// fast it talks (1 is normal). Squashing the pitch WAY down is what made
// it sound like a robot before. Real people sound best close to 1.
function sayOutLoud(words) {
  if (!window.speechSynthesis) return;   // some browsers can't talk. that's OK.

  const talk = function () {
    const voice = new SpeechSynthesisUtterance(words);
    // ENGLISH, PLEASE. Telling the browser the language means it can't
    // accidentally grab a voice from some other country.
    voice.lang = 'en-US';
    const best = pickVoice();
    if (best) { voice.voice = best; voice.lang = best.lang; }
    voice.pitch = 1;
    voice.rate = 0.9;
    window.speechSynthesis.cancel();       // stop anything it was already saying
    window.speechSynthesis.speak(voice);
  };

  // Is the list of voices ready yet? If not, wait for it (but not
  // forever: after one second, just talk with whatever's there).
  if (window.speechSynthesis.getVoices().length) {
    talk();
  } else {
    let done = false;
    const once = function () { if (!done) { done = true; talk(); } };
    window.speechSynthesis.addEventListener('voiceschanged', once);
    setTimeout(once, 1000);
  }
}

let crackExit = null;  // where the crack is, so we know when you walk into it
let flash = 0;               // how bright the screen flash is (1 = full, 0 = gone)
let flashColor = '170, 60, 255';   // what colour it flashes (red, green, blue)

let nextLevelAt = 0;   // when to move on to the next level (0 = not yet)

// ---------------------------------------------------------------------
//  KEYBOARD AND MOUSE.
// ---------------------------------------------------------------------
const keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR') respawn();
  // e.repeat is true when you HOLD a key down and it repeats by itself.
  // We only want one push per press, so we ignore the repeats.
  if (e.code === 'KeyE' && !e.repeat) interact();
  if (e.code === 'KeyV' && !e.repeat) nextVoice();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });

canvas.addEventListener('click', function () {
  started = true;
  unlockAudio();
  // POINTER LOCK hides the mouse and lets you turn forever without
  // the arrow hitting the edge of the screen. Press Esc to get it back.
  if (canvas.requestPointerLock) canvas.requestPointerLock();
});
document.addEventListener('mousemove', function (e) {
  if (document.pointerLockElement !== canvas) return;
  turn(e.movementX * 0.0025, e.movementY * 0.0025);
});

function turn(dx, dy) {
  player.yaw += dx;
  player.pitch -= dy;
  // Don't let you look so far up or down that you flip upside down.
  player.pitch = Math.max(-1.4, Math.min(1.4, player.pitch));
}

// ---------------------------------------------------------------------
//  TOUCH CONTROLS, for phones and tablets.
//    Left half of the screen:  a thumb stick for running.
//    Right half:               drag to look around.
//    The big round button:     JUMP.
//  Each finger gets a "role" the moment it touches down, and keeps it
//  until it lifts, so two thumbs can do two jobs at once.
// ---------------------------------------------------------------------
const roles = {};
const stick = { active: false, ox: 0, oy: 0, dx: 0, dy: 0 };
const STICK_RADIUS = 60;
let touchJump = false;

function jumpButton() {
  const r = Math.max(38, Math.min(W, H) * 0.09);
  return { x: W - r - 30, y: H - r - 40, r: r };
}
// The PUSH button sits just above JUMP, and only shows up when you're
// next to something you can push.
function pushTouchButton() {
  const j = jumpButton();
  return { x: j.x, y: j.y - j.r * 2.6, r: j.r * 0.8 };
}
function inPushButton(x, y) {
  if (!nearButton) return false;
  const b = pushTouchButton();
  return Math.hypot(x - b.x, y - b.y) < b.r * 1.2;
}
// The little VOICE button at the top middle, for phones (no V key there).
function voiceTouchButton() {
  return { x: W / 2, y: 30, w: 110, h: 34 };
}
function inVoiceButton(x, y) {
  const b = voiceTouchButton();
  return Math.abs(x - b.x) < b.w / 2 + 8 && Math.abs(y - b.y) < b.h / 2 + 8;
}
function inJumpButton(x, y) {
  const b = jumpButton();
  return Math.hypot(x - b.x, y - b.y) < b.r * 1.3;  // a bit bigger than it looks, for thumbs
}

canvas.addEventListener('touchstart', function (e) {
  e.preventDefault();
  started = true;
  unlockAudio();
  touchUsed = true;
  for (const t of e.changedTouches) {
    if (inPushButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'push' };
      interact();
    } else if (inVoiceButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'voice' };
      nextVoice();
    } else if (inJumpButton(t.clientX, t.clientY)) {
      roles[t.identifier] = { kind: 'jump' };
      touchJump = true;
    } else if (t.clientX < W / 2) {
      roles[t.identifier] = { kind: 'stick' };
      stick.active = true; stick.ox = t.clientX; stick.oy = t.clientY;
      stick.dx = 0; stick.dy = 0;
    } else {
      roles[t.identifier] = { kind: 'look', lx: t.clientX, ly: t.clientY };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', function (e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const role = roles[t.identifier];
    if (!role) continue;
    if (role.kind === 'stick') {
      let dx = t.clientX - stick.ox, dy = t.clientY - stick.oy;
      const len = Math.hypot(dx, dy);
      if (len > STICK_RADIUS) { dx *= STICK_RADIUS / len; dy *= STICK_RADIUS / len; }
      stick.dx = dx / STICK_RADIUS; stick.dy = dy / STICK_RADIUS;
    } else if (role.kind === 'look') {
      turn((t.clientX - role.lx) * 0.006, (t.clientY - role.ly) * 0.006);
      role.lx = t.clientX; role.ly = t.clientY;
    }
  }
}, { passive: false });

function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const role = roles[t.identifier];
    if (!role) continue;
    if (role.kind === 'stick') { stick.active = false; stick.dx = stick.dy = 0; }
    if (role.kind === 'jump') touchJump = false;
    delete roles[t.identifier];
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ---------------------------------------------------------------------
//  BUMPING INTO BLOCKS.
//  Does your body (a tall thin box) overlap this block? Two boxes overlap
//  only if they overlap side-to-side AND up-and-down AND front-to-back.
// ---------------------------------------------------------------------
function overlaps(b) {
  const e = 0.001;  // a tiny gap, so standing ON a block doesn't count as being IN it
  return player.x + BODY_RADIUS > b.minX + e && player.x - BODY_RADIUS < b.maxX - e &&
         player.z + BODY_RADIUS > b.minZ + e && player.z - BODY_RADIUS < b.maxZ - e &&
         player.y + BODY_HEIGHT > b.minY + e && player.y < b.maxY - e;
}

// We move one direction at a time (x, then z, then up/down). If that move
// pushed you into a block, we slide you back out the way you came.
// Doing it one direction at a time is what lets you slide along walls.
function moveX(amount) {
  player.x += amount;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    player.x = amount > 0 ? b.minX - BODY_RADIUS : b.maxX + BODY_RADIUS;
  }
}
function moveZ(amount) {
  player.z += amount;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    player.z = amount > 0 ? b.minZ - BODY_RADIUS : b.maxZ + BODY_RADIUS;
  }
}
let touchedLava = false;
function moveY(amount) {
  player.y += amount;
  player.onGround = false;
  for (const b of blocks) {
    if (!overlaps(b)) continue;
    if (amount < 0) {             // falling: land on top of it
      player.y = b.maxY;
      player.onGround = true;
      if (b.lava) touchedLava = true;
      if (b.finish && !finished) win();
    } else {                      // going up: bonk your head
      player.y = b.minY - BODY_HEIGHT;
    }
    player.vy = 0;
  }
}

// ---------------------------------------------------------------------
//  THE BUTTONS. Walk into a button's stand to push it.
// ---------------------------------------------------------------------
// Which button are you standing next to? (null = none.) The screen shows
// "Press E" whenever there is one.
let nearButton = null;
function checkButtons() {
  nearButton = null;
  for (const b of puzzle.buttons) {
    if (Math.hypot(player.x - b.x, player.z - b.z) < 1.1) nearButton = b;
  }
}

// E (or the PUSH button on a phone): push whatever you're next to.
function interact() {
  if (puzzle && nearButton) pushButton(nearButton);
}

function pushButton(b) {
  if (b.color === 'red') {
    // THE SIGN LIED. ZAP!
    zap();
    flash = 1; flashColor = '255, 240, 120';   // a bright yellow-white zap
    falls++;
    say('ZAAAAP! ⚡ The sign LIED!', 2.5);
    respawn();
    if (!puzzle.solved) resetPuzzle();
    return;
  }
  if (puzzle.solved || b.lit) return;

  const rightOne = PUZZLE_ANSWER[puzzle.progress];
  if (b.color === rightOne) {
    b.lit = true;
    puzzle.progress++;
    ding(puzzle.progress);
    if (puzzle.progress === PUZZLE_ANSWER.length) {
      // SOLVED! A crack opens... in the wall behind where you started.
      puzzle.solved = true;
      addCrack(0, -1);
      rumble();
      flash = 0.6; flashColor = '170, 60, 255';
      say('Something just CRACKED behind you...', 3.5);
    } else {
      say('*click*', 1);
    }
  } else {
    buzz();
    say('BZZZT! Wrong order. Try again.', 2);
    resetPuzzle();
  }
}

function resetPuzzle() {
  puzzle.progress = 0;
  puzzle.buttons.forEach(function (b) { b.lit = false; });
}

function win() {
  finished = true;
  timerRunning = false;
  const lastLevel = levelIndex === LEVELS.length - 1;
  if (lastLevel) {
    say('YOU BEAT THE WHOLE GAME! ' + timeTaken.toFixed(2) + ' seconds', 8);
  } else {
    const how = crackExit ? 'WHOOOSH! Through the crack! ' : 'LEVEL ' + (levelIndex + 1) + ' DONE! ';
    say(how + timeTaken.toFixed(2) + ' seconds', 3);
    nextLevelAt = performance.now() / 1000 + 3;   // move on in 3 seconds
  }
}

// ---------------------------------------------------------------------
//  UPDATE: everything that happens in one tick of time.
//  dt is how many seconds passed since the last tick (usually about 0.016).
// ---------------------------------------------------------------------
function update(dt, now) {
  if (!started) return;

  // Which way are you pushing? forward/back and left/right, each -1 to 1.
  let forward = 0, strafe = 0;
  if (keys.KeyW || keys.ArrowUp)    forward += 1;
  if (keys.KeyS || keys.ArrowDown)  forward -= 1;
  if (keys.KeyD || keys.ArrowRight) strafe += 1;
  if (keys.KeyA || keys.ArrowLeft)  strafe -= 1;
  if (stick.active) { forward -= stick.dy; strafe += stick.dx; }
  const push = Math.hypot(forward, strafe);
  if (push > 1) { forward /= push; strafe /= push; }  // no running faster diagonally!

  // Turn "forward" and "right" into real world directions, using which
  // way you're facing. sin and cos are maths for "which way is that angle".
  const fx = Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  const rx = Math.cos(player.yaw), rz = Math.sin(player.yaw);
  player.vx = (fx * forward + rx * strafe) * RUN_SPEED;
  player.vz = (fz * forward + rz * strafe) * RUN_SPEED;

  // The clock starts the moment you move.
  if (!timerRunning && !finished && push > 0) timerRunning = true;
  if (timerRunning) timeTaken += dt;

  // JUMP. "Coyote time": you can still jump for a tenth of a second after
  // running off an edge, like a cartoon coyote who hasn't looked down yet.
  // It makes jumps feel fair.
  if (player.onGround) player.lastOnGround = now;
  const wantJump = keys.Space || touchJump;
  if (wantJump && now - player.lastOnGround < 0.1 && player.vy <= 0) {
    player.vy = JUMP_POWER;
    player.lastOnGround = -1;
  }

  // GRAVITY pulls your speed downward a little bit every tick.
  player.vy -= GRAVITY * dt;

  moveX(player.vx * dt);
  moveZ(player.vz * dt);
  moveY(player.vy * dt);

  if (player.y < FALL_LIMIT) {
    falls++;
    respawn();
    say('AAAAAAAAH! Back to the start.', 2);
  }
  if (touchedLava) {
    touchedLava = false;
    falls++;
    respawn();
    say('SIZZLE! 🔥 Your shoes melted.', 2);
  }

  // WALKED INTO THE CRACK? You're right up against its wall, and lined
  // up with the crack (not off to one side of it).
  if (crackExit && !finished && Math.abs(player.x) < crackExit.halfWidth) {
    const againstWall = crackExit.facing > 0
      ? player.z - BODY_RADIUS < crackExit.z + 0.05    // the far wall
      : player.z + BODY_RADIUS > crackExit.z - 0.05;   // the wall behind the start
    if (againstWall) {
      flash = 1; flashColor = '170, 60, 255';   // purple
      win();
    }
  }
  flash = Math.max(0, flash - dt * 0.4);   // the flash fades away

  if (puzzle) checkButtons();

  // Finished a level? After a little pause, on to the next one.
  if (nextLevelAt && now >= nextLevelAt) {
    nextLevelAt = 0;
    loadLevel(levelIndex + 1);
  }
}

// ---------------------------------------------------------------------
//  DRAWING.
// ---------------------------------------------------------------------
const NEAR = 0.05;   // anything closer than this to your eyes gets cut off

// Move a world point so it's measured from your eyes, facing your way.
// After this, z means "how far in front of you" and x means "how far right".
function toCamera(p) {
  const dx = p[0] - player.x, dy = p[1] - (player.y + EYE_HEIGHT), dz = p[2] - player.z;
  const cy0 = Math.cos(player.yaw), sy0 = Math.sin(player.yaw);
  const x = dx * cy0 + dz * sy0;          // right
  const z0 = dx * sy0 - dz * cy0;         // forward
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const y = dy * cp - z0 * sp;            // up (after tilting your head)
  const z = z0 * cp + dy * sp;            // forward (after tilting your head)
  return [x, y, z];
}

// Chop off the part of a shape that's behind your eyes. If we didn't,
// things behind you would get drawn upside down in front of you. Spooky.
function clipNear(pts) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const aIn = a[2] > NEAR, bIn = b[2] > NEAR;
    if (aIn) out.push(a);
    if (aIn !== bIn) {
      const t = (NEAR - a[2]) / (b[2] - a[2]);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
    }
  }
  return out;
}

function draw() {
  const focal = H * 0.8;   // bigger number = more zoomed in

  const level = LEVELS[levelIndex];
  const FOG = level.fogColor;
  const time = performance.now() / 1000;

  if (level.sky) {
    // The sky, with a hazy glow at the horizon. Where's the horizon?
    // It moves up and down the screen when you look down and up.
    const horizon = H / 2 + Math.tan(player.pitch) * focal;
    const sky = ctx.createLinearGradient(0, horizon - H, 0, horizon + H);
    sky.addColorStop(0, '#3a6fc0');
    sky.addColorStop(0.5, '#b8d4f0');
    sky.addColorStop(1, '#2a3550');
    ctx.fillStyle = sky;
  } else {
    // Inside a tunnel there's no sky. Just the dark, far away.
    ctx.fillStyle = 'rgb(' + FOG.join(',') + ')';
  }
  ctx.fillRect(0, 0, W, H);

  // Work out every face we can see, and how far away it is.
  const eye = [player.x, player.y + EYE_HEIGHT, player.z];
  const visible = [];
  for (const f of faces) {
    // BACKFACE CULLING: if a face is pointing away from you, you can't
    // see it anyway (it's the back of something), so don't bother.
    const n = f.normal, c = f.corners[0];
    if (n[0] * (eye[0] - c[0]) + n[1] * (eye[1] - c[1]) + n[2] * (eye[2] - c[2]) <= 0) continue;

    // Too far away to see through the fog? Skip it. This keeps the game
    // fast, because the tunnel has thousands of bricks and tiles.
    const m = f.mid;
    const dist = Math.hypot(m[0] - eye[0], m[1] - eye[1], m[2] - eye[2]);
    // (Glowing things shine through the fog, so never skip those.)
    if (dist > level.fogDistance + 2 && !f.glow) continue;

    const pts = clipNear(f.corners.map(toCamera));
    if (pts.length < 3) continue;   // it was all behind you
    // Things with a "layer" get painted last, on top, in layer order.
    // We do that by pretending they're super close.
    const paintOrder = f.layer ? -f.layer : dist;
    visible.push({ pts: pts, face: f, dist: dist, paintOrder: paintOrder });
  }

  // THE PAINTER'S ALGORITHM: farthest first, nearest last.
  visible.sort(function (a, b) { return b.paintOrder - a.paintOrder; });

  for (const v of visible) {
    const f = v.face;
    let color = f.color;

    // LAVA BUBBLES. The green part of the colour goes up and down over
    // time, so the lava flickers between deep red and bright orange.
    // Each square starts at a different spot in the wobble, so they don't
    // all flash together.
    if (f.lava) {
      const wobble = Math.sin(time * 3 + f.mid[0] * 2.1 + f.mid[2] * 1.7);
      color = [255, 80 + wobble * 50, wobble > 0.8 ? 40 : 0];
    }

    // BUTTONS that you've pushed the right way light up: their colour
    // gets mixed halfway to white, so they look like they're glowing.
    if (f.button && f.button.lit) {
      color = color.map(function (c) { return c + (255 - c) * 0.55; });
    }

    // FOG: far things fade toward the fog colour. It makes distances
    // easier to judge, which matters a LOT when you're about to jump.
    // Lava glows, so it fades much less.
    let fog = Math.min(1, v.dist / level.fogDistance);
    if (f.lava) fog *= 0.4;
    if (f.glow) fog = 0;   // the crack is SO bright, fog can't hide it

    // THE CRACK PULSES: brighter, dimmer, brighter, like it's breathing.
    let pulse = 1;
    if (f.glow) {
      pulse = 0.75 + 0.25 * Math.sin(time * 4);
      color = color.map(function (c) { return c * (0.7 + 0.3 * pulse); });
    }
    const mix = function (c) {
      return 'rgb(' + c.map(function (val, i) {
        return Math.round(val + (FOG[i] - val) * fog);
      }).join(',') + ')';
    };
    const col = mix(color);

    ctx.beginPath();
    for (let i = 0; i < v.pts.length; i++) {
      const p = v.pts[i];
      // THE 3D SQUASH: divide by how far away it is. Far = small.
      const sx = W / 2 + (p[0] / p[2]) * focal;
      const sy = H / 2 - (p[1] / p[2]) * focal;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fillStyle = col;
    if (f.glow) {
      // A blurry purple "shadow" that's actually light. That's the glow.
      ctx.shadowColor = 'rgb(190, 80, 255)';
      ctx.shadowBlur = 40 * pulse;
      // The outer halo is see-through, so the bricks show behind it.
      ctx.globalAlpha = f.glow === 'halo' ? 0.3 * pulse : 1;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      continue;   // no outline on glowing things
    }
    ctx.fill();
    // An outline. For bricks it's the grey cement between them. For
    // everything else it's the same colour, which hides tiny cracks.
    ctx.strokeStyle = f.edge ? mix(f.edge) : col;
    ctx.lineWidth = f.edge ? 1.5 : 1;
    ctx.stroke();

    if (f.text && v.pts.length === 4) paintWords(f.text, v.pts, focal);
  }

  // WHOOSH: when you go through the crack, the whole screen flashes purple.
  if (flash > 0) {
    ctx.fillStyle = 'rgba(' + flashColor + ', ' + flash + ')';
    ctx.fillRect(0, 0, W, H);
  }

  drawHud();
}

// PAINTING WORDS ON A WALL. We have the sign's four corners on the screen.
// setTransform STRETCHES and TILTS everything we draw after it, so we
// stretch a pretend flat 500x130 box to fit exactly onto the sign.
// Then we just write the words in the box, and they land on the sign,
// squashed and tilted the right way for 3D.
function paintWords(lines, pts, focal) {
  const screen = pts.map(function (p) {
    return { x: W / 2 + (p[0] / p[2]) * focal, y: H / 2 - (p[1] / p[2]) * focal };
  });
  const bottomLeft = screen[0], topRight = screen[2], topLeft = screen[3];
  const BOX_W = 500, BOX_H = 130;
  ctx.save();
  ctx.setTransform(
    (topRight.x - topLeft.x) / BOX_W, (topRight.y - topLeft.y) / BOX_W,
    (bottomLeft.x - topLeft.x) / BOX_H, (bottomLeft.y - topLeft.y) / BOX_H,
    topLeft.x, topLeft.y);
  ctx.fillStyle = '#2a1608';
  ctx.font = 'bold 52px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  lines.forEach(function (line, i) {
    ctx.fillText(line, BOX_W / 2, BOX_H * (i + 1) / (lines.length + 1));
  });
  ctx.restore();
}

function drawHud() {
  // A little dot in the middle so you know where you're looking.
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 3, 0, Math.PI * 2); ctx.fill();

  // The clock and the fall counter, top right.
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(W - 190, 10, 180, 62);
  ctx.fillStyle = '#fff';
  ctx.fillText('⏱ ' + timeTaken.toFixed(2), W - 22, 36);
  ctx.fillText('💀 falls: ' + falls, W - 22, 64);

  // Big messages in the middle.
  const now = performance.now() / 1000;
  if (now < messageUntil) {
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.06) + 'px system-ui, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = '#000';
    ctx.fillStyle = finished ? '#ffd23f' : '#fff';
    // WORD WRAP: add words to a line until it's too wide for the screen,
    // then start a new line. Like typing in a box that's not very wide.
    const lines = [];
    let line = '';
    for (const word of message.split(' ')) {
      const tryLine = line ? line + ' ' + word : word;
      if (ctx.measureText(tryLine).width > W * 0.9 && line) {
        lines.push(line);
        line = word;
      } else {
        line = tryLine;
      }
    }
    lines.push(line);
    const lineHeight = Math.min(W, H) * 0.075;
    lines.forEach(function (l, i) {
      ctx.strokeText(l, W / 2, H * 0.3 + i * lineHeight);
      ctx.fillText(l, W / 2, H * 0.3 + i * lineHeight);
    });
  }

  // "PRESS E" when you're standing next to a button.
  if (nearButton && started) {
    const name = nearButton.color.toUpperCase();
    const hint = touchUsed ? 'Tap PUSH to push the ' + name + ' button'
                           : 'Press E to push the ' + name + ' button';
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.04) + 'px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = '#000';
    ctx.strokeText(hint, W / 2, H * 0.68);
    ctx.fillStyle = 'rgb(' + BUTTON_COLORS[nearButton.color].map(function (c) {
      return Math.round(c + (255 - c) * 0.35);   // a bit lighter, so it's easy to read
    }).join(',') + ')';
    ctx.fillText(hint, W / 2, H * 0.68);
  }

  // Phone controls: only drawn once a finger has touched the screen.
  if (touchUsed) {
    const b = jumpButton();
    ctx.fillStyle = touchJump ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.2)';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(b.r * 0.45) + 'px system-ui, sans-serif';
    ctx.fillText('JUMP', b.x, b.y + b.r * 0.16);
    // PUSH: only there when you're next to a button.
    if (nearButton) {
      const p = pushTouchButton();
      ctx.fillStyle = 'rgba(255, 210, 60, 0.45)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold ' + Math.round(p.r * 0.45) + 'px system-ui, sans-serif';
      ctx.fillText('PUSH', p.x, p.y + p.r * 0.16);
    }
    // VOICE: a small pill at the top middle.
    const vb = voiceTouchButton();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(vb.x - vb.w / 2, vb.y - vb.h / 2, vb.w, vb.h);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText('🔊 VOICE', vb.x, vb.y + 5);
    if (stick.active) {
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_RADIUS, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(stick.ox + stick.dx * STICK_RADIUS, stick.oy + stick.dy * STICK_RADIUS, 24, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  drawRobotSubtitles();

  // The title screen, until you click or tap.
  if (!started) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.round(Math.min(W, H) * 0.1) + 'px system-ui, sans-serif';
    ctx.fillText("MAX'S PARKOUR", W / 2, H * 0.4);
    ctx.font = Math.round(Math.min(W, H) * 0.035) + 'px system-ui, sans-serif';
    ctx.fillText('Click or tap to start', W / 2, H * 0.52);
    ctx.fillText('WASD to run · mouse to look · SPACE to jump · R to restart', W / 2, H * 0.6);
    ctx.fillText('E to push buttons · V to change the voice', W / 2, H * 0.66);
  }
}

// ---------------------------------------------------------------------
//  ROBOT ARM SUBTITLES.
//  When the voice talks, a row of robot arms swings down from a metal
//  rail at the top of the screen. Each arm grabs a metal letter, swings
//  it into place, and lets go with a CLANK. Letter by letter, the arms
//  build the words. When the voice stops, the letters drop and clatter
//  away, and the arms go back up.
// ---------------------------------------------------------------------
const robo = {
  active: false,
  pieces: [],      // every metal letter
  arms: [],        // every robot arm
  fontSize: 0,
  startedAt: 0,    // when the arms started coming down
  allPlacedAt: 0,  // when the last letter got put in place (0 = not yet)
  dropAt: 0,       // when the letters started falling (0 = not yet)
  reach: 0,        // how long each arm bone is
};

// How many seconds each part of an arm's job takes. Smaller = faster arms.
const ARM_FETCH_TIME = 0.15;   // reaching up to grab a new letter
const ARM_CARRY_TIME = 0.25;   // swinging the letter to its spot
const ARM_SLIDE_TIME = 0.4;    // the arms sliding down at the start

function startRobotSubtitles(text) {
  robo.active = true;
  robo.pieces = [];
  robo.arms = [];
  robo.allPlacedAt = 0;
  robo.dropAt = 0;
  robo.startedAt = performance.now() / 1000;

  // 1. WORK OUT WHERE EVERY LETTER GOES.
  //    Word-wrap the text into lines, then measure each letter's spot.
  const fs = Math.round(Math.min(W, H) * 0.06);
  robo.fontSize = fs;
  ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    const tryLine = line ? line + ' ' + word : word;
    if (ctx.measureText(tryLine).width > W * 0.85 && line) { lines.push(line); line = word; }
    else line = tryLine;
  }
  lines.push(line);

  const top = Math.max(110, H * 0.2);   // low enough to give the arms room to swing
  lines.forEach(function (l, row) {
    const lineWidth = ctx.measureText(l).width;
    const left = W / 2 - lineWidth / 2;
    const y = top + row * fs * 1.25;
    for (let i = 0; i < l.length; i++) {
      if (l[i] === ' ') continue;   // nobody needs a metal space
      // How far along the line is this letter? Measure everything before it.
      const x = left + ctx.measureText(l.slice(0, i)).width;
      const w = ctx.measureText(l[i]).width;
      robo.pieces.push({ letter: l[i], x: x + w / 2, y: y,
                         placed: false, fallSpeed: 0, spin: 0, angle: 0 });
    }
  });

  // 2. MAKE THE ARMS. Wider screens get more arms.
  //    FAIR SHARES: line all the letters up from left to right, then cut
  //    the line into equal chunks, one chunk per arm. That way no arm has
  //    to do way more work than the others. Each arm hangs right above
  //    the middle of its own chunk.
  const count = Math.max(3, Math.min(7, Math.round(W / 190)));
  const leftToRight = robo.pieces.slice().sort(function (a, b) { return a.x - b.x; });
  const share = Math.ceil(leftToRight.length / count);
  for (let i = 0; i < count; i++) {
    const chunk = leftToRight.slice(i * share, (i + 1) * share);
    if (!chunk.length) continue;
    // Do the letters in reading order: top line first, then left to right.
    chunk.sort(function (a, b) { return (a.y - b.y) || (a.x - b.x); });
    const middle = chunk.reduce(function (sum, p) { return sum + p.x; }, 0) / chunk.length;
    robo.arms.push({ baseX: middle, jobs: chunk, state: 'home',
                     t: 0, from: null, claw: null, holding: null });
  }

  // 3. HOW LONG DO THE ARM BONES NEED TO BE? Long enough that every arm
  //    can reach its farthest letter, with a bit to spare.
  let farthest = 100;
  robo.pieces.forEach(function (p) {
    for (const arm of robo.arms) {
      if (arm.jobs.indexOf(p) === -1) continue;
      farthest = Math.max(farthest, Math.hypot(p.x - arm.baseX, p.y - fs * 0.55));
    }
  });
  robo.reach = farthest * 0.6;   // two bones of 0.6 each = 1.2x the reach needed

  robo.arms.forEach(function (arm) {
    arm.claw = restSpot(arm);
    arm.state = arm.jobs.length ? 'fetch' : 'home';
    arm.from = restSpot(arm);
  });
}

// Where the shoulder of an arm is. It slides down from above the screen
// at the start, and back up at the end.
function shoulder(arm) {
  const now = performance.now() / 1000;
  let hidden = 1 - smooth((now - robo.startedAt) / ARM_SLIDE_TIME);
  if (robo.dropAt) hidden = smooth((now - robo.dropAt) / 1.2);
  return { x: arm.baseX, y: 10 - hidden * (robo.reach * 2 + 60) };
}
// Where an arm waits, and grabs new letters from: just below its shoulder.
function restSpot(arm) {
  const s = shoulder(arm);
  return { x: s.x + robo.reach * 0.3, y: s.y + robo.reach * 0.5 };
}
// Where the claw goes to put a letter down: just above the letter's middle.
function dropSpot(piece) {
  return { x: piece.x, y: piece.y - robo.fontSize * 0.55 };
}

// SMOOTH turns a straight 0-to-1 into a gentle one: slow start, fast
// middle, slow finish. It's what makes the arms look like machines and
// not like teleporting robots.
function smooth(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}
function between(a, b, t) {
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function updateRobotSubtitles(dt) {
  if (!robo.active) return;
  const now = performance.now() / 1000;

  for (const arm of robo.arms) {
    if (arm.state === 'fetch') {
      // Reaching back up to grab the next letter.
      arm.t += dt / ARM_FETCH_TIME;
      arm.claw = between(arm.from, restSpot(arm), smooth(arm.t));
      if (arm.t >= 1) {
        arm.holding = arm.jobs.shift();
        arm.state = 'carry'; arm.t = 0;
      }
    } else if (arm.state === 'carry') {
      // Swinging the letter over to its spot.
      arm.t += dt / ARM_CARRY_TIME;
      arm.claw = between(restSpot(arm), dropSpot(arm.holding), smooth(arm.t));
      if (arm.t >= 1) {
        arm.holding.placed = true;   // let go!
        arm.holding = null;
        clank();
        arm.from = arm.claw; arm.t = 0;
        arm.state = arm.jobs.length ? 'fetch' : 'goinghome';
      }
    } else if (arm.state === 'goinghome') {
      arm.t += dt / ARM_FETCH_TIME;
      arm.claw = between(arm.from, restSpot(arm), smooth(arm.t));
      if (arm.t >= 1) arm.state = 'home';
    } else {
      arm.claw = restSpot(arm);   // waiting (and sliding up or down with the rail)
    }
  }

  // Are all the letters in place?
  const allPlaced = robo.pieces.every(function (p) { return p.placed; });
  if (allPlaced && !robo.allPlacedAt) robo.allPlacedAt = now;

  // Once the voice has finished talking (and you've had a moment to
  // read it), the letters DROP. Each one gets a little random spin.
  const stillTalking = window.speechSynthesis && window.speechSynthesis.speaking;
  if (robo.allPlacedAt && !robo.dropAt && !stillTalking && now > robo.allPlacedAt + 1.5) {
    robo.dropAt = now;
    robo.pieces.forEach(function (p) {
      p.fallSpeed = -Math.random() * 150;   // a little hop first
      p.spin = (Math.random() - 0.5) * 8;
    });
  }
  if (robo.dropAt) {
    robo.pieces.forEach(function (p) {
      p.fallSpeed += 1800 * dt;   // gravity, in pixels per second per second
      p.y += p.fallSpeed * dt;
      p.angle += p.spin * dt;
    });
    if (now > robo.dropAt + 1.5) {
      robo.active = false;   // all gone
      // More lines for the voice to say? Start the next one.
      // Otherwise, anything waiting to be shown? Show it now.
      if (robo.nextLines && robo.nextLines.length) {
        speakLines(robo.nextLines);
      } else if (robo.thenSay) {
        say(robo.thenSay, 3); robo.thenSay = '';
      }
    }
  }
}

// One metal letter. The colour fades from bright silver to dark steel
// and back again, top to bottom. That's what makes it look like shiny metal.
function drawMetalLetter(letter, x, y, angle) {
  const fs = robo.fontSize;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const shine = ctx.createLinearGradient(0, -fs * 0.5, 0, fs * 0.5);
  shine.addColorStop(0, '#f6f8fa');
  shine.addColorStop(0.45, '#9aa3ad');
  shine.addColorStop(0.55, '#d8dde2');
  shine.addColorStop(1, '#5c646d');
  ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#24282c';
  ctx.strokeText(letter, 0, 0);
  ctx.fillStyle = shine;
  ctx.fillText(letter, 0, 0);
  ctx.restore();
}

// One robot arm. The tricky part is the ELBOW: we know where the shoulder
// is, and where we want the claw to be, but where does the elbow go?
// This is called INVERSE KINEMATICS. Two bones of the same length make a
// triangle with the line from shoulder to claw, and a bit of triangle
// maths (the "law of cosines") tells us the angle to bend at.
function drawArm(arm) {
  const s = shoulder(arm);
  const c = arm.claw;
  const bone = robo.reach;
  let dx = c.x - s.x, dy = c.y - s.y;
  let d = Math.hypot(dx, dy);
  d = Math.max(1, Math.min(d, bone * 2 - 0.5));   // can't reach farther than both bones
  const pointing = Math.atan2(dy, dx);
  const bend = Math.acos(Math.min(1, d / (2 * bone)));
  const elbow = { x: s.x + Math.cos(pointing - bend) * bone,
                  y: s.y + Math.sin(pointing - bend) * bone };
  const hand = { x: s.x + Math.cos(pointing) * d, y: s.y + Math.sin(pointing) * d };

  ctx.lineCap = 'round';
  // The two bones: a dark steel tube with a lighter stripe down it.
  [[s, elbow, 14], [elbow, hand, 11]].forEach(function (b) {
    ctx.strokeStyle = '#3d434a'; ctx.lineWidth = b[2];
    ctx.beginPath(); ctx.moveTo(b[0].x, b[0].y); ctx.lineTo(b[1].x, b[1].y); ctx.stroke();
    ctx.strokeStyle = '#8b949e'; ctx.lineWidth = b[2] * 0.35;
    ctx.beginPath(); ctx.moveTo(b[0].x, b[0].y); ctx.lineTo(b[1].x, b[1].y); ctx.stroke();
  });

  // The letter it's carrying, hanging below the claw.
  if (arm.holding) drawMetalLetter(arm.holding.letter, hand.x, hand.y + robo.fontSize * 0.55, 0);

  // The claw: two pincers. Wide open when empty, squeezed shut when holding.
  const open = arm.holding ? 0.25 : 0.7;
  ctx.strokeStyle = '#2b3036'; ctx.lineWidth = 4;
  [-1, 1].forEach(function (side) {
    const a = Math.PI / 2 + side * open;
    ctx.beginPath();
    ctx.moveTo(hand.x, hand.y);
    ctx.lineTo(hand.x + Math.cos(a) * 18, hand.y + Math.sin(a) * 18);
    ctx.stroke();
  });

  // Orange joints with a bolt in the middle.
  [s, elbow, hand].forEach(function (j, i) {
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath(); ctx.arc(j.x, j.y, i === 2 ? 6 : 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d2a10';
    ctx.beginPath(); ctx.arc(j.x, j.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

function drawRobotSubtitles() {
  if (!robo.active) return;

  // The rail along the top that the arms hang from.
  const railY = shoulder(robo.arms[0]).y;
  if (railY > -20) {
    ctx.fillStyle = '#2b3036';
    ctx.fillRect(0, railY - 14, W, 12);
    ctx.fillStyle = '#ffcc00';   // yellow and black DANGER stripes
    for (let x = -20; x < W; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, railY - 2); ctx.lineTo(x + 12, railY - 2);
      ctx.lineTo(x + 20, railY - 14); ctx.lineTo(x + 8, railY - 14);
      ctx.fill();
    }
  }

  // Letters already put in place (or falling away).
  robo.pieces.forEach(function (p) {
    if (p.placed) drawMetalLetter(p.letter, p.x, p.y, p.angle);
  });
  robo.arms.forEach(drawArm);
}

// CLANK! A tiny metal sound, made from scratch. A short buzzy note that
// dies away really fast sounds a lot like metal hitting metal.
let audio = null;
function unlockAudio() {
  // Browsers only let a page make sounds after you've clicked or tapped,
  // so we set up the sound machine the moment you start the game.
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
// A handy sound-maker: one note that starts at one pitch and slides to
// another, then fades out. Almost every sound effect below is made with it.
//   type: 'sine' is smooth, 'square' is buzzy, 'sawtooth' is harsh
function beep(startPitch, endPitch, seconds, type, loudness) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const vol = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(startPitch, t);
  osc.frequency.exponentialRampToValueAtTime(endPitch, t + seconds);
  vol.gain.setValueAtTime(loudness, t);
  vol.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
  osc.connect(vol); vol.connect(audio.destination);
  osc.start(t); osc.stop(t + seconds + 0.05);
}
// ZAP: a harsh sound sliding from high to low, really fast. Three at once
// at slightly different pitches makes it crackle.
function zap() {
  beep(1800, 60, 0.5, 'sawtooth', 0.12);
  beep(1700, 80, 0.45, 'square', 0.08);
  beep(2400, 100, 0.3, 'sawtooth', 0.06);
}
// DING: each right button goes a bit higher, like climbing a ladder.
function ding(step) {
  const pitch = 660 * Math.pow(1.25, step);
  beep(pitch, pitch, 0.4, 'sine', 0.15);
  beep(pitch * 2, pitch * 2, 0.25, 'sine', 0.05);
}
// BZZZT: a low, ugly buzz. The "nope" sound.
function buzz() {
  beep(110, 100, 0.45, 'square', 0.1);
  beep(116, 105, 0.45, 'sawtooth', 0.06);
}
// RUMBLE: really low notes that wobble, for the wall cracking open.
function rumble() {
  beep(70, 35, 1.4, 'sawtooth', 0.15);
  beep(55, 30, 1.6, 'square', 0.08);
  beep(400, 2000, 0.9, 'sine', 0.04);   // and a spooky rising whistle
}

function clank() {
  if (!audio) return;
  const t = audio.currentTime;
  [[700 + Math.random() * 300, 'square', 0.05], [2600 + Math.random() * 600, 'triangle', 0.04]]
    .forEach(function (n) {
      const osc = audio.createOscillator();
      const vol = audio.createGain();
      osc.type = n[1];
      osc.frequency.value = n[0];
      vol.gain.setValueAtTime(n[2], t);
      vol.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      osc.connect(vol); vol.connect(audio.destination);
      osc.start(t); osc.stop(t + 0.1);
    });
}

// ---------------------------------------------------------------------
//  THE GAME LOOP: update, draw, repeat, about 60 times a second.
// ---------------------------------------------------------------------
let last = performance.now();
function loop(t) {
  // Cap dt so a hiccup (like switching tabs) can't fling you through a block.
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt, t / 1000);
  updateRobotSubtitles(dt);
  draw();
  requestAnimationFrame(loop);
}
loadLevel(0);
requestAnimationFrame(loop);
</script>
