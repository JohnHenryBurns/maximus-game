<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;

  color: #ffe0c4 !important;

  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {

<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<canvas id="game"></canvas>
<script>
// =====================================================================
// PULL THE PINS — the water wants to reach the beaker.
// the pins are all that's stopping it. some pins are the solution.
// some pins are a TRAP. pull in the wrong order, and only some of
// your water makes it... the rest finds the void, or the lava.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.08, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
function pinSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(700, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(1400, audio.currentTime + 0.12);
  g.gain.setValueAtTime(0.09, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.15);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.18);
}
function sizzle() { beep(180 + Math.random() * 120, 0.08, 'sawtooth', 0.05); }
function dropBlip() { beep(400 + Math.random() * 300, 0.04, 'sine', 0.04); }
function winSound() { [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => beep(n, 0.2, 'square', 0.09), i * 110)); }
function failSound() { [300, 220, 150].forEach((n, i) => setTimeout(() => beep(n, 0.25, 'sine', 0.1), i * 140)); }

// ---------------------------------------------------------------------
// THE LEVELS — designed in a 420 x 720 space, scaled to any screen.
// walls hold. pins hold until pulled. lava is forever hungry.
// every level's beaker cup is built from its own walls.
// ---------------------------------------------------------------------
function beakerWalls() {
  return [[150, 620, 150, 700], [270, 620, 270, 700], [150, 700, 270, 700]];
}
const BEAKER = { x: 154, y: 590, w: 112, h: 106 };

const LEVELS = [
  { name: 'first glug', need: 0.7,
    walls: [[168, 50, 168, 160], [252, 50, 252, 160], ...beakerWalls()],
    pins: [[158, 165, 262, 165]],
    lava: [],
    water: [[172, 60, 76, 80]] },

  { name: 'mind the gaps', need: 0.45,
    walls: [[78, 50, 78, 160], [162, 50, 162, 160],
            [60, 300, 140, 309], [180, 313, 240, 320], [280, 324, 360, 333],
            [360, 260, 360, 333],
            ...beakerWalls()],
    pins: [[70, 165, 170, 165],        // A: the water's floor
           [136, 306, 184, 314],       // B: covers the VOID gap. leave it.
           [236, 318, 284, 326]],      // C: covers the beaker gap. pull FIRST.
    lava: [],
    water: [[82, 60, 76, 80]] },

  { name: 'left is life', need: 0.35,
    walls: [[168, 50, 168, 140], [252, 50, 252, 140],
            [210, 190, 120, 290], [210, 190, 300, 290],   // the splitter
            [60, 310, 150, 370], [210, 305, 195, 370],    // left funnel
            [360, 310, 270, 370], [210, 305, 225, 370],   // right funnel
            ...beakerWalls()],
    pins: [[158, 145, 262, 145],       // A: the water's floor
           [146, 374, 199, 374],       // L: the good drain
           [221, 374, 274, 374]],      // R: the drain over the LAVA. DON'T.
    lava: [[247, 480, 30]],
    water: [[172, 55, 76, 75]] },

  { name: 'middle first', need: 0.55,
    walls: [[48, 50, 48, 140], [132, 50, 132, 140],
            [288, 50, 288, 140], [372, 50, 372, 140],
            [60, 300, 196, 356], [360, 300, 224, 356],
            ...beakerWalls()],
    pins: [[40, 145, 140, 145],        // A: left water
           [280, 145, 380, 145],       // B: right water
           [192, 354, 228, 358]],      // C: the drain. FIRST. trust me.
    lava: [],
    water: [[52, 58, 72, 72], [292, 58, 72, 72]] },

  { name: 'one good pin', need: 0.65,
    walls: [[48, 50, 48, 150], [148, 50, 148, 150],
            [268, 50, 268, 150], [368, 50, 368, 150],
            [40, 260, 200, 330], [380, 260, 240, 330],
            [200, 330, 200, 380], [240, 330, 240, 380],
            ...beakerWalls()],
    pins: [[40, 155, 156, 155],        // A: the water. the only friend.
           [260, 155, 376, 155],       // X: the LAVA. absolutely not.
           [196, 378, 244, 382]],      // Y: under both... choose wisely
    lava: [[318, 100, 40]],
    water: [[52, 58, 88, 88]] },

  { name: 'the long way down', need: 0.5,
    walls: [[48, 40, 48, 130], [140, 40, 140, 130],
            [60, 230, 260, 280], [300, 230, 300, 290],
            [360, 350, 150, 425], [60, 370, 105, 425],
            [60, 545, 170, 570],
            ...beakerWalls()],
    pins: [[40, 135, 148, 135],        // A: release the water
           [256, 284, 304, 284],       // B: the slot off shelf one
           [101, 429, 154, 429],       // C: the funnel neck below
           [168, 566, 178, 622]],      // D: the final gate
    lava: [[350, 500, 30]],
    water: [[54, 48, 80, 76]] },
];

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
let save = { done: {} };
try {
  const s = JSON.parse(localStorage.getItem('pins_save'));
  if (s) save = Object.assign(save, s);
} catch (err) {}
function persist() { localStorage.setItem('pins_save', JSON.stringify(save)); }

let levelIx = 0;
let walls = [], pins = [], lava = [], drops = [];
let totalDrops = 0;
let anyPulled = false;
let calmT = 0;
let result = null;         // null | 'win' | 'fail'
let particles = [];
let elapsed = 0;
let uiRects = [];
let blipT = 0;

const DROP_R = 6;
const GRAV = 900;

// two little pre-drawn sprites, stamped once per drop per frame:
// a fuzzy halo (the mergy part) and a denser core (the wet part)
function makeWaterSprite(inner, mid, edgeAlpha) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  g.addColorStop(0, inner);
  g.addColorStop(0.55, mid);
  g.addColorStop(1, 'rgba(74, 168, 232, 0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  return c;
}
const softSprite = makeWaterSprite('rgba(130, 200, 245, 0.30)', 'rgba(105, 185, 238, 0.22)');
const coreSprite = makeWaterSprite('rgba(195, 232, 252, 0.30)', 'rgba(140, 205, 245, 0.18)');

function loadLevel(ix) {
  levelIx = ix;
  const L = LEVELS[ix];
  walls = L.walls.map(w => ({ x1: w[0], y1: w[1], x2: w[2], y2: w[3] }));
  pins = L.pins.map(p => ({ x1: p[0], y1: p[1], x2: p[2], y2: p[3],
                            pulled: false, anim: 0 }));
  lava = L.lava.map(l => ({ x: l[0], y: l[1], r: l[2] }));
  drops = [];
  for (const [wx, wy, ww, wh] of L.water) {
    for (let y = wy; y < wy + wh; y += DROP_R * 1.9) {
      for (let x = wx; x < wx + ww; x += DROP_R * 1.9) {
        drops.push({ x: x + (Math.random() - 0.5) * 6, y: y + (Math.random() - 0.5) * 6,
                     vx: 0, vy: 0, inBeaker: false });
      }
    }
  }
  totalDrops = drops.length;
  anyPulled = false;
  calmT = 0;
  result = null;
  particles = [];
}
loadLevel(0);

// ---------------------------------------------------------------------
// INPUT — tap a pin. that's the whole game. choose well.
// ---------------------------------------------------------------------
let view = { s: 1, ox: 0, oy: 0 };
function toWorld(sx, sy) { return { x: (sx - view.ox) / view.s, y: (sy - view.oy) / view.s }; }

addEventListener('pointerdown', e => {
  ensureAudio();
  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) { uiAction(r.id); return; }
  }
  if (result === 'win') return;          // the NEXT LEVEL button handles this
  if (result === 'fail') { loadLevel(levelIx); return; }
  const w = toWorld(e.clientX, e.clientY);
  for (const p of pins) {
    if (p.pulled) continue;
    const d = segDist(w.x, w.y, p);
    if (d < 26) {
      p.pulled = true;
      anyPulled = true;
      pinSound();
      return;
    }
  }
});

function uiAction(id) {
  if (id === 'reset') { loadLevel(levelIx); return; }
  if (id === 'next') {
    loadLevel(levelIx + 1 < LEVELS.length ? levelIx + 1 : 0);
    return;
  }
  if (id.startsWith('lv_')) {
    const ix = parseInt(id.slice(3));
    if (ix === 0 || save.done[ix - 1]) loadLevel(ix);
    else beep(160, 0.15, 'square', 0.08);
  }
}

// ---------------------------------------------------------------------
// PHYSICS — little round drops vs walls, pins, lava, and each other
// ---------------------------------------------------------------------
function segDist(px, py, s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - s.x1) * dx + (py - s.y1) * dy) / len2));
  return Math.hypot(px - (s.x1 + t * dx), py - (s.y1 + t * dy));
}
function segPush(drop, s, R) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((drop.x - s.x1) * dx + (drop.y - s.y1) * dy) / len2));
  const cx = s.x1 + t * dx, cy = s.y1 + t * dy;
  let nx = drop.x - cx, ny = drop.y - cy;
  const d = Math.hypot(nx, ny);
  if (d >= R || d === 0) return;
  nx /= d; ny /= d;
  drop.x = cx + nx * R;
  drop.y = cy + ny * R;
  drop.contact = true;
  const vn = drop.vx * nx + drop.vy * ny;
  if (vn < 0) {
    drop.vx -= vn * nx * 1.25;          // a little bounce
    drop.vy -= vn * ny * 1.25;
    drop.vx *= 0.94;                    // and a little friction
    drop.vy *= 0.94;
  }
}

function update(dt) {
  elapsed += dt;
  if (blipT > 0) blipT -= dt;
  // victory holds the stage until YOU press the button
  if (result === 'win') return;
  for (const p of pins) {
    if (p.pulled && p.anim < 1) p.anim = Math.min(1, p.anim + dt * 3);
  }

  // physics runs in TWO half-steps: smaller moves can't tunnel
  // through thin walls, and piles stay calm instead of exploding
  let maxSpeed = 0;
  for (let step = 0; step < 2; step++) {
    const sdt = dt / 2;
    for (const drop of drops) {
      drop.contact = false;            // are we touching anything this step?
      drop.vy += GRAV * sdt;
      // terminal velocity: real water doesn't fall like a meteor
      drop.vy = Math.min(drop.vy, 520);
      drop.vx = Math.max(-520, Math.min(520, drop.vx));
      drop.x += drop.vx * sdt;
      drop.y += drop.vy * sdt;

      for (const s of walls) segPush(drop, s, DROP_R + 5);
      for (const p of pins) {
        if (!p.pulled) segPush(drop, p, DROP_R + 5);
      }
      // drop-vs-drop: water takes up space, politely — and crucially,
      // bumping into a neighbor SLOWS YOU DOWN (this is what keeps a
      // pile of water calm instead of secretly building up speed)
      for (const o of drops) {
        if (o === drop) continue;
        const dx = o.x - drop.x, dy = o.y - drop.y;
        const d = Math.hypot(dx, dy);
        const min = DROP_R * 1.7;
        if (d > 0 && d < min) {
          const push = (min - d) / 2;
          const nx = dx / d, ny = dy / d;
          drop.x -= nx * push; drop.y -= ny * push;
          o.x += nx * push; o.y += ny * push;
          const rel = (o.vx - drop.vx) * nx + (o.vy - drop.vy) * ny;
          if (rel < 0) {
            drop.vx += nx * rel * 0.45; drop.vy += ny * rel * 0.45;
            o.vx -= nx * rel * 0.45; o.vy -= ny * rel * 0.45;
          }
          drop.contact = true;
          o.contact = true;
        }
      }
      // water that's RESTING on something calms down; water in
      // free-fall falls at full, honest speed
      if (drop.contact && Math.abs(drop.vx) + Math.abs(drop.vy) < 110) {
        drop.vx *= 0.9;
        drop.vy *= 0.9;
      }
      // lava: one touch and a drop is steam
      for (const l of lava) {
        if (Math.hypot(drop.x - l.x, drop.y - l.y) < l.r + DROP_R) {
          drop.dead = true;
          sizzle();
          for (let i = 0; i < 3; i++) {
            particles.push({ x: drop.x, y: drop.y,
                             vx: (Math.random() - 0.5) * 40, vy: -40 - Math.random() * 50,
                             life: 0.6, color: '245, 245, 245' });
          }
        }
      }
      // off the bottom of the world: gone
      if (drop.y > 760) drop.dead = true;
    }
    drops = drops.filter(d => !d.dead);
  }
  for (const drop of drops) {
    drop.inBeaker = drop.x > BEAKER.x && drop.x < BEAKER.x + BEAKER.w &&
                    drop.y > BEAKER.y && drop.y < BEAKER.y + BEAKER.h;
    const sp = Math.hypot(drop.vx, drop.vy);
    maxSpeed = Math.max(maxSpeed, sp);
    if (sp > 250 && drop.vy > 0 && blipT <= 0) { blipT = 0.15; dropBlip(); }
  }

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // the verdict rules:
  //  WIN  — the beaker crosses the line (held a moment, not a splash)
  //  FAIL — only when it's truly over: all pins pulled and settled,
  //         or too much water is already lost to ever reach the goal.
  //  otherwise the level WAITS — you might still have a plan.
  if (anyPulled && !result) {
    if (maxSpeed < 60) calmT += dt;
    else calmT = 0;
    const frac = drops.filter(d => d.inBeaker).length / totalDrops;
    const need = LEVELS[levelIx].need;
    if (frac >= need && calmT > 0.5) {
      result = 'win';
      save.done[levelIx] = Math.max(save.done[levelIx] || 0, Math.round(frac * 100));
      persist();
      winSound();
    } else if (calmT > 1.6) {
      const allPulled = pins.every(p => p.pulled);
      const bestPossible = drops.length / totalDrops;   // if EVERY survivor got in
      if (bestPossible < need || (allPulled && frac < need)) {
        result = 'fail';
        failSound();
      }
    }
  }
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function draw() {
  const W = canvas.width, H = canvas.height;
  view.s = Math.min(W / 420, (H - 60) / 720);
  view.ox = (W - 420 * view.s) / 2;
  view.oy = 56 + ((H - 60) - 720 * view.s) / 2;

  ctx.fillStyle = '#141820';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(view.ox, view.oy);
  ctx.scale(view.s, view.s);

  // the beaker's welcoming glow, and the fill line to beat
  const L = LEVELS[levelIx];
  ctx.fillStyle = 'rgba(90, 180, 255, 0.07)';
  ctx.fillRect(BEAKER.x, BEAKER.y, BEAKER.w, BEAKER.h);
  const needY = BEAKER.y + BEAKER.h - BEAKER.h * L.need;
  ctx.strokeStyle = 'rgba(125, 223, 143, 0.6)';
  ctx.setLineDash([6, 5]);
  ctx.beginPath();
  ctx.moveTo(BEAKER.x - 6, needY);
  ctx.lineTo(BEAKER.x + BEAKER.w + 6, needY);
  ctx.stroke();
  ctx.setLineDash([]);

  // lava first, bubbling away underneath everything
  for (const l of lava) {
    const g = ctx.createRadialGradient(l.x, l.y, 3, l.x, l.y, l.r + 8);
    g.addColorStop(0, '#ffd23f');
    g.addColorStop(0.5, '#ff7a2a');
    g.addColorStop(1, '#c8351e');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(l.x, l.y, l.r + Math.sin(elapsed * 3 + l.x) * 2, 0, Math.PI * 2);
    ctx.fill();
    if (Math.random() < 0.15) {
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.arc(l.x + (Math.random() - 0.5) * l.r * 1.5,
              l.y - Math.random() * l.r, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // the water — CLEAR, glassy, and truly liquid: soft translucent
  // halos merge into one body, and moving drops STRETCH along their
  // direction of travel, so a pour becomes a sleek falling stream
  for (const d of drops) {
    const sp = Math.hypot(d.vx, d.vy);
    if (sp > 90) {
      const stretch = 1 + Math.min(1.1, sp / 380);
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(Math.atan2(d.vy, d.vx));
      ctx.drawImage(softSprite, -19 * stretch, -19 / stretch,
                    38 * stretch, 38 / stretch);
      ctx.restore();
    } else {
      ctx.drawImage(softSprite, d.x - 19, d.y - 19, 38, 38);
    }
  }
  for (const d of drops) {
    ctx.drawImage(coreSprite, d.x - 12, d.y - 12, 24, 24);
  }
  // glints of light on the surface — clearer water catches MORE light
  ctx.fillStyle = 'rgba(235, 250, 255, 0.5)';
  for (let i = 0; i < drops.length; i += 4) {
    const d = drops[i];
    ctx.beginPath();
    ctx.arc(d.x - 2, d.y - 3, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // steam
  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color}, ${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // the walls: sturdy, dependable, not going anywhere
  ctx.strokeStyle = '#4a5468';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  for (const s of walls) {
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }

  // the pins: golden, tempting, each with a ring handle
  for (const p of pins) {
    const slide = p.anim;
    const dx = p.x2 - p.x1, dy = p.y2 - p.y1;
    const len = Math.hypot(dx, dy) || 1;
    const ox = (dx / len) * slide * (len + 60);
    const oy = (dy / len) * slide * (len + 60);
    ctx.globalAlpha = 1 - slide * 0.8;
    ctx.strokeStyle = '#d8b04a';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(p.x1 + ox, p.y1 + oy);
    ctx.lineTo(p.x2 + ox, p.y2 + oy);
    ctx.stroke();
    // the ring, at the pull end
    ctx.strokeStyle = '#e8cc7a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(p.x2 + ox + (dx / len) * 12, p.y2 + oy + (dy / len) * 12, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ---- HUD ----
  uiRects = [];
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfe4ff';
  ctx.font = 'bold 17px monospace';
  ctx.fillText('LEVEL ' + (levelIx + 1) + ' — ' + L.name, 14, 30);
  const frac = totalDrops ? drops.filter(d => d.inBeaker).length / totalDrops : 0;
  ctx.fillStyle = frac >= L.need ? '#7ddf8f' : '#8aa4c8';
  ctx.font = '14px monospace';
  ctx.fillText('delivered: ' + Math.round(frac * 100) + '%  (need ' +
               Math.round(L.need * 100) + '%)', 14, 52);

  // reset button
  uiRects.push({ x: W - 110, y: 12, w: 96, h: 36, id: 'reset' });
  ctx.strokeStyle = '#5a7a9a';
  ctx.lineWidth = 2;
  ctx.strokeRect(W - 110, 12, 96, 36);
  ctx.fillStyle = '#cfe4ff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('↻ RESET', W - 62, 35);

  // level dots
  LEVELS.forEach((lv, i) => {
    const x = W / 2 - LEVELS.length * 16 + i * 32;
    uiRects.push({ x: x - 10, y: H - 40, w: 20, h: 20, id: 'lv_' + i });
    const open = i === 0 || save.done[i - 1];
    ctx.fillStyle = i === levelIx ? '#4aa8e8' : save.done[i] ? '#7ddf8f'
                  : open ? '#5a6478' : '#2a3040';
    ctx.beginPath();
    ctx.arc(x, H - 30, 8, 0, Math.PI * 2);
    ctx.fill();
  });

  if (result) {
    ctx.fillStyle = 'rgba(10, 14, 22, 0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    if (result === 'win') {
      ctx.fillStyle = '#7ddf8f';
      ctx.font = `bold ${Math.min(42, W / 14)}px monospace`;
      ctx.fillText('GLUG! ' + Math.round(frac * 100) + '% DELIVERED', W / 2, H / 2 - 40);
      // THE BUTTON — big, green, and impossible to miss
      const bw = Math.min(W - 60, 280), bh = 60;
      const bx = W / 2 - bw / 2, by = H / 2 + 4;
      uiRects.push({ x: bx, y: by, w: bw, h: bh, id: 'next' });
      const throb = 1 + Math.sin(elapsed * 3) * 0.03;
      ctx.save();
      ctx.translate(W / 2, by + bh / 2);
      ctx.scale(throb, throb);
      ctx.fillStyle = 'rgba(125, 223, 143, 0.2)';
      ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
      ctx.strokeStyle = '#7ddf8f';
      ctx.lineWidth = 3;
      ctx.strokeRect(-bw / 2, -bh / 2, bw, bh);
      ctx.fillStyle = '#7ddf8f';
      ctx.font = 'bold 24px monospace';
      ctx.fillText(levelIx + 1 < LEVELS.length ? 'NEXT LEVEL ▶' : 'PLAY AGAIN ↻', 0, 9);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ff9f43';
      ctx.font = `bold ${Math.min(38, W / 15)}px monospace`;
      ctx.fillText('only ' + Math.round(frac * 100) + '% made it...', W / 2, H / 2 - 20);
      ctx.fillStyle = '#cfe4ff';
      ctx.font = '16px monospace';
      ctx.fillText('the rest is... elsewhere. tap to try again', W / 2, H / 2 + 20);
    }
  } else if (!anyPulled) {
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(232, 204, 122, ${0.6 + Math.sin(elapsed * 2) * 0.25})`;
    ctx.font = 'bold 15px monospace';
    ctx.fillText('tap a golden pin to pull it — order MATTERS', W / 2, H - 60);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.02, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
