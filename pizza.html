  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;

}

  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;

}

<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

<canvas id="screen"></canvas>
<div id="hud">W A S D or ARROWS to walk &nbsp;&nbsp; E to use what you're stood at</div>

<script>
// ===================================================================
//  MAX'S PIZZA
//
//  Nothing here is trying to kill you. With no danger, what pulls you
//  forward is THE NEXT UPGRADE - you keep going because you're forty
//  coins off a better oven.
//
//  And a pizza starts as WHEAT IN A FIELD. You walk out, cut it, carry
//  it back, grind it into dough, and the pizza travels in your hands
//  the whole way to the window. The walking IS the game.
//
//  Same box painter as the cavern, the wasteland and the rig: build a
//  list of flat faces, sort them furthest-away-first, fill them in that
//  order, and 3D falls out of nothing but coloured shapes.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  LOOKING DOWN ON HIM
// -------------------------------------------------------------------
//
//  The camera sits high up and behind, tilted steeply down, and it
//  FOLLOWS him. It never turns, though - north stays at the top of the
//  screen whichever way he's facing. A top-down view that spins with
//  the player is the fastest way to get somebody hopelessly lost.

  const cam = { x: 0, y: 0, z: 0, pitch: -0.95 };
  const CAM_UP = 86, CAM_BACK = 62;

  function focal() { return Math.min(H, W) * 0.98; }

  function project(x, y, z) {
    const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const fz = dz * cp + dy * sp;
    const fy = dy * cp - dz * sp;
    if (fz < 1) return null;
    const f = focal() / fz;
    return { x: W / 2 + dx * f, y: H / 2 - fy * f, depth: fz };
  }


// -------------------------------------------------------------------
//  BOXES
// -------------------------------------------------------------------

  let faces = [];

  function shade(rgb, amount) {
    return [clamp(rgb[0] * amount, 0, 255),
            clamp(rgb[1] * amount, 0, 255),
            clamp(rgb[2] * amount, 0, 255)];
  }
  function rgbText(c) {
    return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  }

  function addBox(cx, cy, cz, w, h, d, rgb, spin) {
    spin = spin || 0;
    const co = Math.cos(spin), si = Math.sin(spin);
    const hw = w / 2, hh = h / 2, hd = d / 2;

    const pts = [];
    for (const sx of [-1, 1])
      for (const sy of [-1, 1])
        for (const sz of [-1, 1]) {
          const lx = sx * hw, lz = sz * hd;
          pts.push(project(cx + lx * co + lz * si, cy + sy * hh,
                           cz - lx * si + lz * co));
        }
    for (const p of pts) if (!p) return;

    const sides = [
      { pts: [2, 3, 7, 6], light: 1.18 },   // top - brightest, we're above it
      { pts: [0, 1, 5, 4], light: 0.55 },
      { pts: [0, 2, 6, 4], light: 0.92 },
      { pts: [1, 3, 7, 5], light: 0.72 },
      { pts: [0, 1, 3, 2], light: 0.80 },
      { pts: [4, 5, 7, 6], light: 0.86 }
    ];

    for (const s of sides) {
      const p = s.pts.map(function (i) { return pts[i]; });
      let depth = 0;
      for (const q of p) depth += q.depth;
      faces.push({ points: p, depth: depth / 4, colour: rgbText(shade(rgb, s.light)) });
    }
  }

  function paint() {
    faces.sort(function (a, b) { return b.depth - a.depth; });
    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) ctx.lineTo(f.points[i].x, f.points[i].y);
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }
  }


// -------------------------------------------------------------------
//  WHAT GOES ON A PIZZA
// -------------------------------------------------------------------

  const TOPPINGS = [
    { key: 'pepperoni', name: 'PEPPERONI',  colour: [178, 52, 44],   lumps: 9,  size: 1.0 },
    { key: 'bogeys',    name: 'BOGEYS',     colour: [126, 190, 84],  lumps: 7,  size: 1.3 },
    { key: 'beans',     name: 'BAKED BEANS',colour: [214, 118, 44],  lumps: 14, size: 0.7 },
    { key: 'worms',     name: 'GUMMY WORMS',colour: [232, 96, 150],  lumps: 6,  size: 1.6 },
    { key: 'sprouts',   name: 'SPROUTS',    colour: [72, 128, 56],   lumps: 8,  size: 1.1 },
    { key: 'marsh',     name: 'MARSHMALLOWS', colour: [246, 226, 232], lumps: 6, size: 1.5 },
    { key: 'fish',      name: 'FISH FINGERS', colour: [222, 162, 74], lumps: 5, size: 1.8 },
    { key: 'jelly',     name: 'JELLY BEANS',colour: [150, 92, 210],  lumps: 12, size: 0.8 }
  ];

  function toppingByKey(k) {
    return TOPPINGS.find(function (t) { return t.key === k; });
  }


// -------------------------------------------------------------------
//  THE SHOP AND THE FIELD
// -------------------------------------------------------------------
//
//  Everything you can use knows ONE position, and the drawing, the
//  label and the "are you stood at it?" test all read it from here.
//  Write a position out twice and one day you nudge one copy, and then
//  there's an invisible button in an empty bit of floor.

  const REACH = 13;          // how close you have to stand to use a thing

  const SPOTS = [
    { id: 'mill',   name: 'MILL',        x:   0, z:  12, colour: [150, 122, 88] },

    { id: 'sauce',  name: 'SAUCE',       x: -40, z:  34, colour: [176, 46, 38] },
    { id: 'cheese', name: 'CHEESE',      x: -40, z:  56, colour: [240, 206, 96] },
    { id: 'top0',   name: 'PEPPERONI',   x: -40, z:  78, colour: TOPPINGS[0].colour, top: 0 },
    { id: 'top1',   name: 'BOGEYS',      x: -40, z: 100, colour: TOPPINGS[1].colour, top: 1 },
    { id: 'top2',   name: 'BAKED BEANS', x: -40, z: 122, colour: TOPPINGS[2].colour, top: 2 },

    { id: 'top3',   name: 'GUMMY WORMS', x:  40, z:  34, colour: TOPPINGS[3].colour, top: 3 },
    { id: 'top4',   name: 'SPROUTS',     x:  40, z:  56, colour: TOPPINGS[4].colour, top: 4 },
    { id: 'top5',   name: 'MARSHMALLOWS',x:  40, z:  78, colour: TOPPINGS[5].colour, top: 5 },
    { id: 'top6',   name: 'FISH FINGERS',x:  40, z: 100, colour: TOPPINGS[6].colour, top: 6 },
    { id: 'top7',   name: 'JELLY BEANS', x:  40, z: 122, colour: TOPPINGS[7].colour, top: 7 },

    { id: 'oven',   name: 'OVEN',        x:  40, z: 152, colour: [96, 92, 88], big: true },
    { id: 'bin',    name: 'BIN',         x: -40, z: 152, colour: [70, 74, 78] },
    { id: 'window', name: 'SERVE',       x:   0, z: 178, colour: [150, 128, 96], big: true }
  ];

  function spotById(id) { return SPOTS.find(function (s) { return s.id === id; }); }

  // ---- THE WHEAT FIELD -----------------------------------------------
  // Outside the door, to the north. Every stalk is its own little thing
  // that gets cut and grows back, so the field empties as you work it
  // and fills in again while you're inside making the pizza.
  const FIELD = { x: 0, z: -78, w: 130, d: 76 };
  const WHEAT_REGROW = 11;     // seconds for one stalk to come back
  const CUT_TIME = 0.55;       // how long one swing takes
  const CARRY_MAX = 9;         // three doughs' worth carried by hand

  // HOW MUCH WHEAT YOU CAN HAVE AT ONCE.
  //
  // There used to be TWO piles: yours, and a separate hopper the
  // harvester filled. Which meant you could buy a machine, watch it
  // work all day, and still have to go and cut your own wheat - the
  // two piles never met. Now there is one pile. You fill it, the
  // machine fills it, and you both take from it.
  //
  // The harvester brings a silo with it, so buying one doesn't just
  // gather faster, it gives you somewhere to put the lot.
  function stockMax() { return CARRY_MAX + upgrades.harvester.bought * 20; }

  // HOW WIDE THE SWING IS.
  //
  // A scythe doesn't pick one stalk at a time - it SWEEPS. The first
  // version cut a single stalk per swing, which meant three separate
  // stands-still-holding-E for one lump of dough, and that is exactly
  // as boring as it sounds. Now one swing takes everything inside this
  // circle, and a better scythe makes the circle wider as well as the
  // swing quicker.
  // The stalks stand about ten apart, so a circle this wide catches
  // two or three of them - a swing you can feel, not one that empties
  // your arms' worth in a single tap. Fifteen caught SEVEN, which
  // filled you up in one go and deleted the job entirely.
  function cutReach() { return 9 + upgrades.scythe.bought * 3; }

  let wheatStalks = [];
  function plantField() {
    wheatStalks = [];
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 13; c++) {
        wheatStalks.push({
          x: FIELD.x - FIELD.w / 2 + 8 + c * (FIELD.w - 16) / 12,
          z: FIELD.z - FIELD.d / 2 + 8 + r * (FIELD.d - 16) / 6,
          ready: true, back: 0
        });
      }
    }
  }
  plantField();


// -------------------------------------------------------------------
//  THE PLAYER
// -------------------------------------------------------------------

  const WALK = 46;

  const player = {
    x: 0, z: -4, yaw: 0,
    step: 0,                  // legs swinging
    carryWheat: 0,
    pizza: null,              // the pizza in his hands, if any
    cutting: 0                // how far through cutting a stalk
  };

  function newPizza() {
    return { sauce: false, cheese: false, tops: [], bakeT: 0, state: 'raw' };
  }


// -------------------------------------------------------------------
//  THE GAME
// -------------------------------------------------------------------

  const BAKE_PERFECT = 6.0;
  const BURN_AFTER   = 5.0;
  const WHEAT_PER_DOUGH = 3;

  let money = 0, served = 0, burnt = 0, clock = 0;
  let ovenPizza = null;        // the pizza IN the oven, if any
  let order = null, orderWait = 3;
  let says = '', saysT = 0;
  let swingFlash = 0;    // the arc that flashes when he swings
  function say(words) { says = words; saysT = 3.0; }

  const upgrades = {
    oven:   { name: 'HOTTER OVEN',   cost: 60,  bought: 0, max: 3,
              blurb: 'bakes faster, burns slower' },
    boots:  { name: 'FASTER BOOTS',  cost: 50,  bought: 0, max: 3,
              blurb: 'you walk quicker' },
    scythe: { name: 'BETTER SCYTHE', cost: 55,  bought: 0, max: 3,
              blurb: 'cut wheat faster' },
    boxes:  { name: 'FANCY BOXES',   cost: 80,  bought: 0, max: 3,
              blurb: 'every pizza sells for more' },

    // ---- THE FACTORY ------------------------------------------------
    // Each one buys you out of one step of the job, in the order you do
    // it. Buy all four and the shop runs itself and you can just watch.
    harvester: { name: 'HARVESTER',   cost: 150, bought: 0, max: 3,
                 blurb: 'a machine that cuts wheat for you' },
    millbot:   { name: 'MILL ROBOT',  cost: 260, bought: 0, max: 3,
                 blurb: 'feeds the wheat in and makes the dough' },
    topper:    { name: 'TOPPER ARM',  cost: 420, bought: 0, max: 3,
                 blurb: 'puts the order on the pizza by itself' },
    chefbot:   { name: 'CHEF ROBOT',  cost: 650, bought: 0, max: 3,
                 blurb: 'bakes it and serves the customer' }
  };

  // THE PRODUCTION LINE. The robots work on their OWN pizza, never the
  // one in your hands - otherwise the topper would put pineapple on
  // something you were halfway through carrying.
  const auto = {
    line: null,       // the pizza the robots are building
    ownOven: false,   // is the thing in the oven THEIRS or yours?
    tCut: 0, tMill: 0, tTop: 0, tChef: 0,
    botX: 0, botZ: -78,      // where the harvester has trundled to
    madeByRobots: 0
  };


  function bakeSpeed()  { return 1 + upgrades.oven.bought * 0.45; }
  function burnSlow()   { return 1 + upgrades.oven.bought * 0.5; }
  function walkSpeed()  { return WALK * (1 + upgrades.boots.bought * 0.28); }
  function cutSpeed()   { return 1 + upgrades.scythe.bought * 0.7; }
  function priceBoost() { return 1 + upgrades.boxes.bought * 0.35; }

  function costOf(u) { return Math.round(u.cost * Math.pow(1.8, u.bought)); }

  function makeOrder() {
    const most = served < 3 ? 1 : served < 8 ? 2 : 3;
    const howMany = 1 + Math.floor(Math.random() * most);
    const want = [], pool = TOPPINGS.slice();
    for (let i = 0; i < howMany && pool.length; i++) {
      const pick = Math.floor(Math.random() * pool.length);
      want.push(pool[pick].key);
      pool.splice(pick, 1);
    }
    order = { want: want, waited: 0 };
  }

  function priceOf(p) {
    if (!order || !p) return 0;
    if (p.state === 'burnt') return 0;
    let right = 0;
    for (const k of order.want) if (p.tops.indexOf(k) >= 0) right++;
    const extra = p.tops.length - right;
    let coins = 12 + right * 7 - extra * 2;
    if (!p.sauce)  coins -= 5;
    if (!p.cheese) coins -= 5;
    if (p.state !== 'baked') coins = Math.round(coins * 0.35);
    return Math.max(1, Math.round(coins * priceBoost()));
  }


// -------------------------------------------------------------------
//  USING WHAT YOU'RE STOOD AT
// -------------------------------------------------------------------

  // WHAT IS HE NEXT TO? Worked out fresh every frame, and both the
  // "press E" and the prompt on screen read the answer - so the hint
  // never promises something the key won't do.
  let nearSpot = null, inField = false;

  function lookAround() {
    nearSpot = null;
    let best = REACH;
    for (const s of SPOTS) {
      const d = Math.hypot(player.x - s.x, player.z - s.z);
      if (d < best) { best = d; nearSpot = s; }
    }
    inField = Math.abs(player.x - FIELD.x) < FIELD.w / 2 + 6 &&
              Math.abs(player.z - FIELD.z) < FIELD.d / 2 + 6;
  }

  // The nearest stalk still standing, if you're close enough to cut it.
  function nearestStalk() {
    let best = null, bestD = cutReach();
    for (const s of wheatStalks) {
      if (!s.ready) continue;
      const d = Math.hypot(player.x - s.x, player.z - s.z);
      if (d < bestD) { bestD = d; best = s; }
    }
    return best;
  }

  // WHAT WOULD E DO RIGHT NOW? One answer, used by the key AND by the
  // words on screen. If they worked it out separately they'd disagree
  // the first time either changed.
  function whatEDoes() {
    if (inField && nearestStalk() && player.carryWheat < stockMax()) {
      return { do: 'cut', text: 'CUT THE WHEAT' };
    }
    if (!nearSpot) return null;
    const s = nearSpot;

    if (s.id === 'mill') {
      if (player.pizza) return { do: 'no', text: 'your hands are full' };
      if (player.carryWheat < WHEAT_PER_DOUGH) {
        return { do: 'no', text: 'need ' + WHEAT_PER_DOUGH + ' wheat  -  you have ' +
                                 player.carryWheat };
      }
      return { do: 'mill', text: 'GRIND WHEAT INTO DOUGH' };
    }

    if (s.id === 'bin') {
      if (!player.pizza) return { do: 'no', text: 'nothing to throw away' };
      return { do: 'bin', text: 'THROW IT AWAY' };
    }

    if (s.id === 'oven') {
      if (player.pizza && !ovenPizza) {
        if (!player.pizza.cheese) return { do: 'no', text: 'put something on it first' };
        return { do: 'in', text: 'PUT IT IN THE OVEN' };
      }
      if (!player.pizza && ovenPizza) return { do: 'out', text: 'TAKE IT OUT' };
      if (player.pizza && ovenPizza) return { do: 'no', text: 'the oven is busy' };
      return { do: 'no', text: 'the oven is empty' };
    }

    if (s.id === 'window') {
      if (!player.pizza) return { do: 'no', text: 'fetch a pizza first' };
      if (!order) return { do: 'no', text: 'nobody is waiting' };
      if (player.pizza.state === 'raw') return { do: 'no', text: 'that dough is RAW' };
      return { do: 'sell', text: 'SELL IT  -  ' + priceOf(player.pizza) + ' coins' };
    }

    // A bin of something that goes on a pizza.
    if (!player.pizza) return { do: 'no', text: 'you need dough first' };
    if (player.pizza.state !== 'raw') return { do: 'no', text: 'too late, it is cooked' };

    if (s.id === 'sauce') {
      if (player.pizza.sauce) return { do: 'no', text: 'it has sauce already' };
      return { do: 'add', text: 'ADD SAUCE' };
    }
    if (s.id === 'cheese') {
      if (!player.pizza.sauce) return { do: 'no', text: 'sauce goes on before cheese' };
      if (player.pizza.cheese) return { do: 'no', text: 'it has cheese already' };
      return { do: 'add', text: 'ADD CHEESE' };
    }
    if (s.top !== undefined) {
      if (!player.pizza.cheese) return { do: 'no', text: 'cheese goes on before toppings' };
      const t = TOPPINGS[s.top];
      if (player.pizza.tops.indexOf(t.key) >= 0) {
        return { do: 'no', text: 'already got ' + t.name.toLowerCase() };
      }
      return { do: 'add', text: 'ADD ' + t.name };
    }
    return null;
  }

  function pressE() {
    const act = whatEDoes();
    if (!act) return;
    if (act.do === 'no') { say(act.text); return; }

    if (act.do === 'cut') {
      // Cutting takes a moment - held down, not tapped. The bar under
      // his feet fills up.
      player.cutting = Math.max(player.cutting, 0.0001);
      return;
    }

    if (act.do === 'mill') {
      player.carryWheat -= WHEAT_PER_DOUGH;
      player.pizza = newPizza();
      say('dough made');
      return;
    }

    if (act.do === 'bin') { player.pizza = null; say('binned it'); return; }

    if (act.do === 'in') {
      ovenPizza = player.pizza;
      ovenPizza.state = 'baking';
      ovenPizza.bakeT = 0;
      player.pizza = null;
      say('in the oven');
      return;
    }

    if (act.do === 'out') {
      player.pizza = ovenPizza;
      ovenPizza = null;
      say(player.pizza.state === 'burnt' ? 'burnt...' : 'out and cooked');
      return;
    }

    if (act.do === 'sell') {
      const coins = priceOf(player.pizza);
      money += coins;
      served++;
      if (player.pizza.state === 'burnt') { burnt++; say('burnt. they paid nothing'); }
      else say('sold for ' + coins);
      player.pizza = null;
      order = null;
      orderWait = 4 + Math.random() * 4;
      return;
    }

    if (act.do === 'add') {
      const s = nearSpot;
      if (s.id === 'sauce')  { player.pizza.sauce = true;  say('sauce on'); }
      else if (s.id === 'cheese') { player.pizza.cheese = true; say('cheese on'); }
      else {
        const t = TOPPINGS[s.top];
        player.pizza.tops.push(t.key);
        say(t.name.toLowerCase() + ' on');
      }
    }
  }

  // -------------------------------------------------------------------
  //  THE ROBOTS
  // -------------------------------------------------------------------
  //
  //  Each one only ever does its own step, and only when the step in
  //  front of it is free. That's what stops them treading on each other:
  //  the mill robot won't make dough while a pizza is already on the
  //  line, and the chef robot won't use the oven while YOUR pizza is in
  //  it. Everything waits its turn instead of everything fighting.

  function updateRobots(dt) {
    // ---- THE HARVESTER: cuts wheat into the hopper -------------------
    if (upgrades.harvester.bought > 0) {
      auto.tCut -= dt;

      // It trundles towards whatever is still standing, so you can see
      // it working rather than it just conjuring wheat out of nothing.
      let target = null, bd = 1e9;
      for (const st of wheatStalks) {
        if (!st.ready) continue;
        const d = Math.hypot(st.x - auto.botX, st.z - auto.botZ);
        if (d < bd) { bd = d; target = st; }
      }
      if (target) {
        const dx = target.x - auto.botX, dz = target.z - auto.botZ;
        const L = Math.hypot(dx, dz) || 1;
        const sp = 26 + upgrades.harvester.bought * 10;
        auto.botX += dx / L * Math.min(L, sp * dt);
        auto.botZ += dz / L * Math.min(L, sp * dt);

        // STRAIGHT INTO YOUR STOCK. Whatever it cuts is yours, ready to
        // use at the mill yourself - not squirrelled away in a pile only
        // the robot can reach.
        if (auto.tCut <= 0 && bd < 9 && player.carryWheat < stockMax()) {
          auto.tCut = 1.6 / upgrades.harvester.bought;
          target.ready = false;
          target.back = WHEAT_REGROW;
          player.carryWheat++;
        }
      }
    }

    // ---- THE MILL ROBOT: hopper wheat becomes dough ------------------
    if (upgrades.millbot.bought > 0 && !auto.line && player.carryWheat >= WHEAT_PER_DOUGH) {
      auto.tMill -= dt;
      if (auto.tMill <= 0) {
        auto.tMill = 3.0 / upgrades.millbot.bought;
        player.carryWheat -= WHEAT_PER_DOUGH;
        auto.line = newPizza();
      }
    }

    // ---- THE TOPPER ARM: sauce, cheese, then the order ---------------
    // It waits for an order before it starts on toppings, because
    // otherwise it has no idea what the customer wants and would just
    // guess. Sauce and cheese go on regardless - they always do.
    if (upgrades.topper.bought > 0 && auto.line && auto.line.state === 'raw'
        && !auto.line.done) {
      auto.tTop -= dt;
      if (auto.tTop <= 0) {
        const p = auto.line;
        auto.tTop = 1.3 / upgrades.topper.bought;
        if (!p.sauce)       p.sauce = true;
        else if (!p.cheese) p.cheese = true;
        else if (order) {
          const next = order.want.find(function (k) { return p.tops.indexOf(k) < 0; });
          if (next) p.tops.push(next);
          else p.done = true;
        }
      }
    }

    // ---- THE CHEF ROBOT: the oven and the window ---------------------
    if (upgrades.chefbot.bought > 0) {
      auto.tChef -= dt;
      if (auto.tChef <= 0) {
        auto.tChef = 1.4 / upgrades.chefbot.bought;

        // Something cooked and burning? Out it comes, whoever put it in.
        if (auto.ownOven && ovenPizza &&
            (ovenPizza.state === 'baked' || ovenPizza.state === 'burnt')) {
          const done = ovenPizza;
          ovenPizza = null;
          auto.ownOven = false;
          if (done.state === 'burnt') { burnt++; }
          else if (order) {
            money += priceOf(done);
            served++;
            auto.madeByRobots++;
            order = null;
            orderWait = 4 + Math.random() * 4;
          }
        }
        // A finished pizza and a free oven? In it goes. It will NOT
        // touch the oven while your own pizza is in there.
        else if (auto.line && auto.line.done && !ovenPizza) {
          ovenPizza = auto.line;
          ovenPizza.state = 'baking';
          ovenPizza.bakeT = 0;
          auto.line = null;
          auto.ownOven = true;
        }
      }
    }
  }

  function buy(key) {
    const u = upgrades[key];
    if (!u || u.bought >= u.max) { say('as good as it gets'); return; }
    const cost = costOf(u);
    if (money < cost) { say('need ' + cost + ' coins, you have ' + money); return; }
    money -= cost;
    u.bought++;
    say(u.name + ' bought!');
  }


// -------------------------------------------------------------------
//  THE CLOCK
// -------------------------------------------------------------------

  const keys = {};
  let shopOpen = false;

  function update(dt) {
    clock += dt;
    if (saysT > 0) saysT -= dt;
    if (swingFlash > 0) swingFlash -= dt * 2.6;

    if (!shopOpen) {
      // ---- WALKING --------------------------------------------------
      // North is up the screen and it stays there, so LEFT always means
      // left. In a top-down game that never turns, that's the whole
      // reason it feels easy to steer.
      let mx = 0, mz = 0;
      if (keys['a'] || keys['arrowleft'])  mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
      if (keys['w'] || keys['arrowup'])    mz += 1;
      if (keys['s'] || keys['arrowdown'])  mz -= 1;

      // THE THUMB STICK pushes the SAME two directions the keys do, so
      // there is only ever one walking rule to get right. Up the screen
      // is north, which is why dy is subtracted.
      if (stick.on && stick.push > 0.08) {
        mx += stick.dx / STICK_MAX;
        mz += -stick.dy / STICK_MAX;
      }

      const len = Math.hypot(mx, mz);
      if (len > 0) {
        // Divide by the length, or walking diagonally would be 1.4
        // times faster than walking straight - a bug in a LOT of games.
        mx /= len; mz /= len;
        player.x += mx * walkSpeed() * dt;
        player.z += mz * walkSpeed() * dt;
        player.yaw = Math.atan2(mx, mz);
        player.step += dt * 9;

        // Moving cancels a cut. You can't stroll off mid-swing.
        player.cutting = 0;
      }

      // Fences, near enough - the shop and the field are one long strip
      // and there's no reason to wander off the edge of the world.
      player.x = clamp(player.x, -58, 58);
      player.z = clamp(player.z, -124, 196);

      lookAround();

      // ---- CUTTING ----------------------------------------------------
      if (player.cutting > 0) {
        if (keys['e']) {
          player.cutting += dt * cutSpeed();
          if (player.cutting >= CUT_TIME) {
            player.cutting = 0;

            // THE WHOLE SWATHE. Every standing stalk inside the swing,
            // not just the closest one - and it stops at what you can
            // actually carry, so nothing is cut and wasted.
            let took = 0;
            const reach = cutReach();
            for (const st of wheatStalks) {
              if (!st.ready) continue;
              if (player.carryWheat + took >= stockMax()) break;
              if (Math.hypot(player.x - st.x, player.z - st.z) > reach) continue;
              st.ready = false;
              st.back = WHEAT_REGROW;
              took++;
            }
            player.carryWheat += took;
            swingFlash = 1;
            say(took > 1 ? 'cut ' + took + ' at once!  wheat ' + player.carryWheat +
                           ' / ' + stockMax()
                         : 'wheat: ' + player.carryWheat + ' / ' + stockMax());
          }
        } else {
          player.cutting = 0;      // let go and you stop cutting
        }
      }
    }

    // ---- THE FIELD GROWS BACK ----------------------------------------
    for (const s of wheatStalks) {
      if (s.ready) continue;
      s.back -= dt;
      if (s.back <= 0) s.ready = true;
    }

    // ---- THE OVEN ------------------------------------------------------
    if (ovenPizza) {
      ovenPizza.bakeT += dt * bakeSpeed();
      const ruinAt = BAKE_PERFECT + BURN_AFTER * burnSlow();
      if (ovenPizza.bakeT >= ruinAt) {
        if (ovenPizza.state !== 'burnt') say('SOMETHING IS BURNING');
        ovenPizza.state = 'burnt';
      } else if (ovenPizza.bakeT >= BAKE_PERFECT) {
        ovenPizza.state = 'baked';
      }
    }

    updateRobots(dt);

    // ---- CUSTOMERS -------------------------------------------------
    if (!order) {
      orderWait -= dt;
      if (orderWait <= 0) makeOrder();
    } else {
      order.waited += dt;      // they wait for ever. nobody storms off.
    }

    // ---- THE CAMERA ---------------------------------------------------
    // It lags a little, which stops the whole world twitching every
    // time he changes direction.
    const k = Math.min(1, dt * 6);
    cam.x += (player.x - cam.x) * k;
    cam.z += (player.z - CAM_BACK - cam.z) * k;
    cam.y = CAM_UP;
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  const GRASS  = [86, 116, 62];
  const DIRT   = [128, 104, 74];
  const FLOOR  = [176, 160, 138];
  const WALL   = [92, 66, 54];
  const WOOD   = [126, 88, 58];
  const STEEL  = [128, 132, 136];
  const WHEATC = [214, 178, 84];

  function drawGround() {
    // Only the tiles near him - drawing the whole world every frame
    // would be hundreds of boxes nobody can see.
    const TILE = 26;
    const cx = Math.round(player.x / TILE), cz = Math.round(player.z / TILE);
    for (let gx = cx - 4; gx <= cx + 4; gx++) {
      for (let gz = cz - 3; gz <= cz + 5; gz++) {
        const wx = gx * TILE, wz = gz * TILE;
        const inShop = Math.abs(wx) <= 62 && wz >= -6 && wz <= 200;
        const base = inShop ? FLOOR : GRASS;
        // A checker, so you can see yourself moving. Without it a flat
        // colour makes walking feel like standing still.
        const tint = ((gx + gz) % 2 === 0) ? 1 : 0.92;
        addBox(wx, -1, wz, TILE, 2, TILE, shade(base, tint));
      }
    }

    // The path from the door out to the field.
    for (let i = 0; i < 5; i++) addBox(0, 0.2, -12 - i * 14, 22, 1.6, 12, DIRT);
  }

  function drawShop() {
    // Walls down both sides, with a gap at the front you walk in
    // through. Low, so they never hide him.
    for (let z = 0; z <= 200; z += 22) {
      addBox(-64, 7, z, 6, 16, 22, WALL);
      addBox( 64, 7, z, 6, 16, 22, WALL);
    }
    addBox(0, 7, 202, 134, 16, 6, WALL);
    for (const s of [-1, 1]) addBox(s * 45, 7, -6, 44, 16, 6, WALL);
  }

  function drawSpots() {
    for (const s of SPOTS) {
      if (s.id === 'oven')   { drawOven(s);   continue; }
      if (s.id === 'window') { drawWindow(s); continue; }
      if (s.id === 'bin')    { addBox(s.x, 6, s.z, 13, 12, 13, shade(STEEL, 0.5)); continue; }
      if (s.id === 'mill')   { drawMill(s);   continue; }

      // An ingredient tub with the stuff heaped in it.
      addBox(s.x, 5, s.z, 17, 10, 17, WOOD);
      addBox(s.x, 10.4, s.z, 15, 2.4, 15, s.colour);
    }
  }

  function drawMill(s) {
    addBox(s.x, 7, s.z, 22, 14, 22, shade(WOOD, 0.85));
    addBox(s.x, 15, s.z, 16, 3, 16, shade(STEEL, 0.8));
    // A wheel that turns when you've got enough wheat to grind - the
    // only moving part in the shop, so your eye goes straight to it.
    const spin = (player.carryWheat >= WHEAT_PER_DOUGH) ? clock * 2.2 : 0;
    addBox(s.x, 18, s.z, 20, 2, 5, shade(WOOD, 1.1), spin);
    addBox(s.x, 18, s.z, 5, 2, 20, shade(WOOD, 1.1), spin);
  }

  function drawOven(s) {
    addBox(s.x, 11, s.z, 30, 24, 26, shade(STEEL, 0.75));
    addBox(s.x, 10, s.z - 13.5, 20, 14, 1.5, [38, 32, 28]);
    if (ovenPizza) {
      const hot = ovenPizza.state === 'burnt' ? [90, 40, 30]
                : ovenPizza.state === 'baked' ? [255, 190, 80] : [230, 120, 50];
      addBox(s.x, 9, s.z - 14.2, 17, 10, 1.0, hot);
    }
    addBox(s.x, 26, s.z, 10, 6, 10, shade(STEEL, 0.6));
  }

  function drawWindow(s) {
    addBox(s.x, 8, s.z, 46, 18, 8, shade(WOOD, 0.8));
    addBox(s.x, 12, s.z + 1, 34, 12, 4, [28, 24, 22]);
    if (order) {
      const bob = Math.sin(clock * 2) * 0.6;
      addBox(s.x, 14 + bob, s.z + 9, 13, 12, 8, [78, 96, 128]);
      addBox(s.x, 23 + bob, s.z + 9, 8, 8, 8, [206, 168, 132]);
    }
  }

  function drawField() {
    // The soil, then a stalk everywhere one is standing.
    addBox(FIELD.x, -0.4, FIELD.z, FIELD.w, 2, FIELD.d, shade(DIRT, 0.9));
    for (const s of wheatStalks) {
      if (!s.ready) {
        addBox(s.x, 0.8, s.z, 3, 1.2, 3, shade(DIRT, 0.75));   // stubble
        continue;
      }
      const sway = Math.sin(clock * 1.6 + s.x * 0.1) * 0.5;
      addBox(s.x + sway, 5, s.z, 2.2, 10, 2.2, shade(WHEATC, 0.8));
      addBox(s.x + sway * 1.6, 11, s.z, 4.4, 4, 4.4, WHEATC);
    }
  }

  // ---- A PIZZA, wherever it happens to be ----------------------------
  function drawPizzaAt(p, x, y, z, size) {
    const cook = p.state === 'burnt' ? 0.3
               : p.state === 'baked' ? 0.85
               : p.state === 'baking' ? 0.94 : 1;
    const r = size;
    addBox(x, y, z, r, 1.2, r, shade([226, 192, 138], cook));
    if (p.sauce)  addBox(x, y + 0.9, z, r * 0.88, 0.7, r * 0.88, shade([170, 44, 36], cook));
    if (p.cheese) addBox(x, y + 1.5, z, r * 0.84, 0.7, r * 0.84, shade([238, 206, 110], cook));

    for (let ti = 0; ti < p.tops.length; ti++) {
      const t = toppingByKey(p.tops[ti]);
      if (!t) continue;
      for (let i = 0; i < t.lumps; i++) {
        // A fixed spiral, NOT Math.random() - random here would make
        // every lump jump to a new spot sixty times a second.
        const a = i * 2.39996 + ti * 1.1;
        const rr = r * 0.08 + (i / t.lumps) * r * 0.34;
        // Each topping has its own lump size, so a marshmallow is a
        // fat pillow and a baked bean is a speck. Same code, and the
        // pizza still tells you what's on it from across the room.
        const lump = r * 0.11 * (t.size || 1);
        addBox(x + Math.cos(a) * rr, y + 2.1, z + Math.sin(a) * rr,
               lump, 0.6, lump, shade(t.colour, cook));
      }
    }
  }

  // ---- THE ROBOTS YOU BOUGHT -------------------------------------------
  //
  // Each one stands at the step it does, so what you paid for is a thing
  // you can point at. A robot you can't see isn't worth 650 coins.

  function drawRobot(x, z, body, busy, lift) {
    const bob = busy ? Math.sin(clock * 7 + x) * 0.9 : Math.sin(clock * 1.4 + x) * 0.25;
    const y = (lift || 0) + bob;
    addBox(x, y + 4, z, 8, 8, 8, body);                       // body
    addBox(x, y + 10.5, z, 6, 5, 6, shade(body, 0.75));       // head
    // The eye goes green while it's working and dim when it's waiting -
    // so you can tell at a glance which robot is stuck.
    addBox(x, y + 10.8, z - 3.2, 3.4, 1.6, 0.6,
           busy ? [140, 250, 140] : [90, 100, 96]);
    addBox(x, y + 14.2, z, 0.8, 3, 0.8, shade(body, 0.6));    // antenna
    addBox(x, y + 16, z, 2, 2, 2, busy ? [255, 220, 120] : [80, 80, 84]);
    for (const sgn of [-1, 1]) addBox(x + sgn * 5.4, y + 4, z, 2.4, 6, 2.4, shade(body, 0.7));
  }

  function drawRobots() {
    // ---- THE HARVESTER out in the field --------------------------------
    if (upgrades.harvester.bought > 0) {
      const x = auto.botX, z = auto.botZ;
      addBox(x, 3, z, 16, 6, 20, [172, 128, 60]);              // hopper body
      addBox(x, 7.5, z - 2, 13, 3, 12, [120, 88, 44]);
      addBox(x, 2.4, z - 11, 18, 4, 4, shade(STEEL, 0.9));     // the cutting bar
      for (const sgn of [-1, 1]) addBox(x + sgn * 8.6, 2.6, z + 6, 3, 5, 5, [42, 40, 38]);
      // A spinning reel at the front, so it looks like it's doing it.
      addBox(x, 6, z - 10, 16, 2, 4, [214, 178, 84], clock * 5);
      addBox(x, 6, z - 10, 4, 2, 16, [214, 178, 84], clock * 5);
    }

    // ---- THE MILL ROBOT ------------------------------------------------
    if (upgrades.millbot.bought > 0) {
      const m = spotById('mill');
      drawRobot(m.x + 20, m.z, [96, 132, 178],
                player.carryWheat >= WHEAT_PER_DOUGH && !auto.line);
      // Your wheat, stacked by the mill - the bigger the stack, the
      // further ahead the harvester is running.
      const heap = Math.min(10, player.carryWheat);
      for (let i = 0; i < heap; i++) {
        addBox(m.x - 19 + (i % 5) * 3.4, 2 + Math.floor(i / 5) * 3, m.z - 4 + (i % 3) * 3,
               3, 3, 3, WHEATC);
      }
    }

    // ---- THE TOPPER ARM ------------------------------------------------
    if (upgrades.topper.bought > 0) {
      const tx = 0, tz = 96;
      addBox(tx, 4, tz, 26, 8, 22, shade(STEEL, 0.6));         // the bench
      for (const sgn of [-1, 1]) addBox(tx + sgn * 11, 14, tz, 3, 14, 3, shade(STEEL, 0.8));
      addBox(tx, 21, tz, 25, 3, 3, shade(STEEL, 0.9));         // the gantry
      // The arm slides side to side while it's working.
      const busy = auto.line && auto.line.state === 'raw' && !auto.line.done;
      const slide = busy ? Math.sin(clock * 4) * 7 : 0;
      addBox(tx + slide, 16, tz, 3, 8, 3, [214, 132, 72]);
      addBox(tx + slide, 12, tz, 5, 2, 5, [240, 170, 90]);

      // THE PIZZA ON THE LINE. You can watch it being built.
      if (auto.line) drawPizzaAt(auto.line, tx, 9, tz, 15);
    }

    // ---- THE CHEF ROBOT ------------------------------------------------
    if (upgrades.chefbot.bought > 0) {
      const ov = spotById('oven');
      drawRobot(ov.x - 22, ov.z - 6, [190, 96, 96],
                !!(auto.line && auto.line.done) || auto.ownOven);
    }
  }

  // ---- THE LITTLE CHARACTER -------------------------------------------
  function drawPlayer() {
    const co = Math.cos(player.yaw), si = Math.sin(player.yaw);
    function bit(ox, oy, oz, w, h, d, rgb) {
      addBox(player.x + ox * co + oz * si, oy, player.z - ox * si + oz * co,
             w, h, d, rgb, player.yaw);
    }

    const swing = Math.sin(player.step) * 2.2;
    bit(-2.2, 3, swing * 0.4, 3.4, 6, 3.4, [58, 62, 82]);       // legs
    bit( 2.2, 3, -swing * 0.4, 3.4, 6, 3.4, [58, 62, 82]);
    bit(0, 9.4, 0, 9, 7, 6, [226, 232, 236]);                    // white apron top
    bit(0, 9.0, -3.2, 7, 6, 0.8, [214, 96, 74]);                 // a red neckerchief
    bit(0, 14.6, 0, 5.4, 4.6, 5.4, [216, 176, 140]);             // head
    bit(0, 18.2, 0, 7.4, 2.6, 7.4, [244, 244, 246]);             // CHEF'S HAT
    bit(0, 20.2, 0, 6.0, 2.2, 6.0, [244, 244, 246]);

    // Arms out in front when he's carrying something, down when he isn't.
    const holding = player.pizza || player.carryWheat > 0;
    for (const s of [-1, 1]) {
      bit(s * 5.6, holding ? 11 : 9.5, holding ? -3 : 0,
          2.4, holding ? 2.4 : 6, holding ? 6 : 2.4, [216, 176, 140]);
    }

    // ---- WHAT'S IN HIS HANDS -------------------------------------------
    if (player.pizza) {
      drawPizzaAt(player.pizza, player.x - si * 6, 13.4, player.z - co * 6, 13);
    } else if (player.carryWheat > 0) {
      // An armful is an armful however big the stock is - drawing sixty
      // stalks in his hands would bury him.
      const inHands = Math.min(player.carryWheat, 6);
      for (let i = 0; i < inHands; i++) {
        const a = i * 1.1;
        bit(Math.cos(a) * 1.8, 13.4 + i * 0.5, -6 + Math.sin(a) * 1.4,
            2, 7, 2, WHEATC);
      }
    }

    // THE SWEEP. A ring of little marks showing exactly how far the
    // swing reaches, so the scythe upgrade is something you can SEE
    // rather than a number you have to trust.
    if (player.cutting > 0 || swingFlash > 0) {
      const r = cutReach();
      const bright = swingFlash > 0 ? 1 : 0.45;
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        addBox(player.x + Math.cos(a) * r, 1.2, player.z + Math.sin(a) * r,
               2.6, 0.8, 2.6, shade([255, 226, 120], bright));
      }
    }

    // A cutting bar under his feet while he's swinging.
    if (player.cutting > 0) {
      const t = clamp(player.cutting / CUT_TIME, 0, 1);
      addBox(player.x - 7 + t * 7, 1.6, player.z + 9, t * 14, 1, 3, [255, 226, 120]);
    }
  }


// -------------------------------------------------------------------
//  THE WRITING ON TOP
// -------------------------------------------------------------------

  const SHOP_KEYS = ['oven', 'boots', 'scythe', 'boxes',
                     'harvester', 'millbot', 'topper', 'chefbot'];

  function shopTab() {
    const w = Math.min(W * 0.16, 150), h = 40;
    return { x: W - w - 16, y: 16, w: w, h: h };
  }
  // TWO COLUMNS. Eight of these stacked in one column is 540 pixels of
  // list, which runs straight off the bottom of a laptop screen - and a
  // button you cannot see is a button you cannot buy.
  function shopBox(i) {
    const cols = W > 640 ? 2 : 1;
    const w = cols === 2 ? Math.min(W * 0.44, 400) : Math.min(W * 0.8, 420);
    const h = 54, gap = 9;
    const col = cols === 2 ? i % 2 : 0;
    const row = cols === 2 ? Math.floor(i / 2) : i;
    const totalW = cols * w + (cols - 1) * 18;
    return { x: W / 2 - totalW / 2 + col * (w + 18),
             y: H * 0.2 + row * (h + gap), w: w, h: h };
  }

  function drawHud() {
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.05, 42) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText(money + ' coins', 20, 50);

    ctx.font = Math.min(W * 0.024, 15) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#a08c78';
    ctx.fillText(served + ' sold' + (burnt ? '   -   ' + burnt + ' burnt' : '') +
                 '   -   wheat ' + player.carryWheat + '/' + stockMax() +
                 (auto.madeByRobots ? '   -   robots made ' + auto.madeByRobots : ''),
                 22, 74);

    // ---- THE ORDER ---------------------------------------------------
    if (order) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.028, 19) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffe9c8';
      ctx.fillText('ORDER', W / 2, 34);

      const n = order.want.length, size = 30, gap = 10;
      let bx = W / 2 - (n * size + (n - 1) * gap) / 2;
      for (const k of order.want) {
        const t = toppingByKey(k);
        ctx.fillStyle = rgbText(t.colour);
        ctx.fillRect(bx, 46, size, size);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.strokeRect(bx, 46, size, size);
        const got = player.pizza && player.pizza.tops.indexOf(k) >= 0;
        if (got) {
          ctx.strokeStyle = '#8fe07a'; ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(bx + 6, 46 + 16); ctx.lineTo(bx + 12, 46 + 23);
          ctx.lineTo(bx + 24, 46 + 8); ctx.stroke();
        }
        bx += size + gap;
      }
    }

    // ---- THE OVEN BAR ------------------------------------------------
    if (ovenPizza) {
      const bw = Math.min(W * 0.3, 300), bx2 = W / 2 - bw / 2, by = H - 92;
      const full = BAKE_PERFECT + BURN_AFTER * burnSlow();
      const t = clamp(ovenPizza.bakeT / full, 0, 1);
      const perfect = BAKE_PERFECT / full;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(bx2, by, bw, 15);
      ctx.fillStyle = 'rgba(120,200,110,0.35)';
      ctx.fillRect(bx2 + bw * perfect, by, bw * (1 - perfect), 15);
      ctx.fillStyle = ovenPizza.state === 'burnt' ? '#d64a3c'
                    : ovenPizza.state === 'baked' ? '#8fe07a' : '#e0a83c';
      ctx.fillRect(bx2, by, bw * t, 15);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.024, 16) + 'px system-ui, sans-serif';
      ctx.fillText(ovenPizza.state === 'burnt' ? 'BURNT'
                 : ovenPizza.state === 'baked' ? 'COOKED - GO AND GET IT'
                 : 'BAKING', W / 2, by - 7);
    }

    // ---- THE SHOP TAB ------------------------------------------------
    const tab = shopTab();
    let can = false;
    for (const k of SHOP_KEYS) {
      const u = upgrades[k];
      if (u.bought < u.max && money >= costOf(u)) can = true;
    }
    ctx.fillStyle = can ? 'rgba(255,215,106,0.22)' : 'rgba(0,0,0,0.4)';
    ctx.fillRect(tab.x, tab.y, tab.w, tab.h);
    ctx.lineWidth = 2;
    ctx.strokeStyle = can ? '#ffd76a' : 'rgba(255,255,255,0.2)';
    ctx.strokeRect(tab.x, tab.y, tab.w, tab.h);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.026, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = can ? '#ffd76a' : '#a08c78';
    ctx.fillText(shopOpen ? 'CLOSE' : 'SHOP', tab.x + tab.w / 2, tab.y + 26);

    if (shopOpen) { drawShopPanel(); return; }

    // ---- WHAT E WOULD DO ---------------------------------------------
    const act = whatEDoes();
    if (act) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.032, 21) + 'px system-ui, sans-serif';
      ctx.fillStyle = act.do === 'no' ? '#c8a488' : '#8fe07a';
      ctx.fillText(act.do === 'no' ? act.text : 'E  -  ' + act.text, W / 2, H - 118);
    }

    if (saysT > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.03, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,233,200,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, H - 146);
    }
  }

  function drawShopPanel() {
    ctx.fillStyle = 'rgba(12,8,6,0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.04, 30) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('SHOP  -  ' + money + ' coins', W / 2, H * 0.15);

    for (let i = 0; i < SHOP_KEYS.length; i++) {
      const u = upgrades[SHOP_KEYS[i]], b = shopBox(i);
      const maxed = u.bought >= u.max, cost = costOf(u), can = !maxed && money >= cost;

      ctx.fillStyle = can ? 'rgba(255,215,106,0.16)' : 'rgba(0,0,0,0.35)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = can ? '#ffd76a' : 'rgba(255,255,255,0.16)';
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.024, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = maxed ? '#8fe07a' : can ? '#ffe9c8' : '#8a7a68';
      ctx.fillText(u.name, b.x + 10, b.y + 22);
      ctx.font = Math.min(W * 0.02, 13) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a08c78';
      ctx.fillText(u.blurb, b.x + 10, b.y + 40);

      ctx.textAlign = 'right';
      ctx.font = 'bold ' + Math.min(W * 0.022, 14) + 'px system-ui, sans-serif';
      ctx.fillStyle = maxed ? '#8fe07a' : can ? '#ffd76a' : '#8a7a68';
      ctx.fillText(maxed ? 'MAXED' : cost + ' coins', b.x + b.w - 10, b.y + 42);

      for (let p = 0; p < u.max; p++) {
        ctx.fillStyle = p < u.bought ? '#8fe07a' : 'rgba(255,255,255,0.18)';
        ctx.fillRect(b.x + b.w - 12 - (u.max - p) * 11, b.y + 10, 8, 8);
      }
    }

    ctx.textAlign = 'center';
    ctx.font = Math.min(W * 0.022, 14) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#a08c78';
    ctx.fillText('tap anywhere else to get back to work', W / 2, H * 0.86);
  }

  // Labels floating over each spot, from the SAME position the box uses.
  function drawLabels() {
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.017, 12) + 'px system-ui, sans-serif';
    for (const s of SPOTS) {
      const p = project(s.x, s.big ? 30 : 20, s.z);
      if (!p || p.x < -40 || p.x > W + 40 || p.y < 0 || p.y > H) continue;
      const near = nearSpot === s;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(s.name, p.x + 1, p.y + 1);
      ctx.fillStyle = near ? '#8fe07a' : 'rgba(255,233,200,0.75)';
      ctx.fillText(s.name, p.x, p.y);
    }

    const fp = project(FIELD.x, 16, FIELD.z);
    if (fp && fp.y > 0 && fp.y < H) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText('WHEAT FIELD', fp.x + 1, fp.y + 1);
      ctx.fillStyle = inField ? '#8fe07a' : 'rgba(255,233,200,0.75)';
      ctx.fillText('WHEAT FIELD', fp.x, fp.y);
    }
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === 'e' && !keys['e'] && !shopOpen) { keys['e'] = true; pressE(); return; }
    keys[k] = true;
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  // -------------------------------------------------------------------
  //  TOUCH
  // -------------------------------------------------------------------
  //
  //  This game is WALKING, and a phone has no W A S D - so without a
  //  stick it isn't merely awkward on a phone, it's unplayable. Drag
  //  anywhere on the left to walk; the USE button on the right does
  //  whatever E does.
  //
  //  Every finger gets a ROLE, remembered by its identifier. The stick
  //  has to know where it started, so it can't be worked out fresh from
  //  wherever the finger happens to be now - and two fingers down at
  //  once (walking while pressing USE) must not tread on each other.

  const STICK_MAX = 52;          // pixels from the origin for full speed
  const stick = { on: false, ox: 0, oy: 0, dx: 0, dy: 0, push: 0 };
  const roles = {};              // touch identifier -> what that finger is doing
  let touchMode = false;         // has a finger ever touched this? then show the pads

  function useBtn() {
    const r = Math.min(W, H) * 0.11;
    return { x: W - r - 26, y: H - r - 26, r: r };
  }

  function nearBtn(mx, my, b) {
    return Math.hypot(mx - b.x, my - b.y) < b.r * 1.35;
  }

  function inBox(mx, my, b) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  }

  function tap(mx, my) {
    if (inBox(mx, my, shopTab())) { shopOpen = !shopOpen; return; }
    if (shopOpen) {
      for (let i = 0; i < SHOP_KEYS.length; i++) {
        if (inBox(mx, my, shopBox(i))) { buy(SHOP_KEYS[i]); return; }
      }
      shopOpen = false;
      return;
    }
    // Tapping anywhere in the world does whatever E would do, so a
    // phone gets the same game a keyboard does.
    keys['e'] = true;
    pressE();
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup',   function () { keys['e'] = false; });

  function readTouches(e) {
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;

      if (e.type === 'touchstart') {
        // The shop first - it sits on top of everything.
        if (inBox(x, y, shopTab())) { shopOpen = !shopOpen; continue; }
        if (shopOpen) {
          let took = false;
          for (let i = 0; i < SHOP_KEYS.length; i++) {
            if (inBox(x, y, shopBox(i))) { buy(SHOP_KEYS[i]); took = true; }
          }
          if (!took) shopOpen = false;
          continue;
        }

        if (nearBtn(x, y, useBtn())) {
          roles[t.identifier] = 'use';
          keys['e'] = true;
          pressE();
        } else {
          // Anywhere else is the stick, and it starts where you put your
          // thumb down rather than in a fixed corner - so it's always
          // under your thumb whatever size the phone is.
          roles[t.identifier] = 'move';
          stick.on = true;
          stick.ox = x; stick.oy = y;
          stick.dx = 0; stick.dy = 0; stick.push = 0;
        }
      } else if (e.type === 'touchmove') {
        if (roles[t.identifier] !== 'move') continue;
        let dx = x - stick.ox, dy = y - stick.oy;
        const len = Math.hypot(dx, dy);
        if (len > STICK_MAX) { dx *= STICK_MAX / len; dy *= STICK_MAX / len; }
        stick.dx = dx; stick.dy = dy;
        stick.push = Math.min(1, len / STICK_MAX);
      } else {
        // Lifted. Only clear the thing THIS finger was doing.
        if (roles[t.identifier] === 'move') {
          stick.on = false; stick.push = 0; stick.dx = 0; stick.dy = 0;
        }
        if (roles[t.identifier] === 'use') keys['e'] = false;
        delete roles[t.identifier];
      }
    }
  }

  // The help line has to tell the truth about the controls you're
  // actually using. It says keyboard until a finger touches the screen,
  // and then it says touch.
  function setHelpLine() {
    const el = document.getElementById('hud');
    if (el) el.innerHTML = touchMode ? HELP_TOUCH : HELP_KEYS;
  }

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (!touchMode) { touchMode = true; setHelpLine(); }
    readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault(); readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault(); readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchcancel', function (e) { readTouches(e); }, { passive: false });


// -------------------------------------------------------------------
//  DRAWING THE PADS
// -------------------------------------------------------------------

  function drawPads() {
    if (!touchMode || shopOpen) return;

    // The USE button. Green when it would actually do something, so you
    // can see whether you're stood at anything without reading a word.
    const b = useBtn();
    const act = whatEDoes();
    const live = act && act.do !== 'no';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = keys['e'] ? 'rgba(143,224,122,0.4)'
                  : live ? 'rgba(143,224,122,0.2)' : 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = live ? '#8fe07a' : 'rgba(255,255,255,0.3)';
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(b.r * 0.42) + 'px system-ui, sans-serif';
    ctx.fillStyle = live ? '#8fe07a' : '#a08c78';
    ctx.fillText('USE', b.x, b.y + b.r * 0.15);

    // The stick, only while a thumb is on it.
    if (!stick.on) return;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.arc(stick.ox + stick.dx, stick.oy + stick.dy, STICK_MAX * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,215,106,0.5)';
    ctx.fill();
  }


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  const HELP_KEYS  = 'W A S D or ARROWS to walk &nbsp;&nbsp; E uses whatever you stand at';
  const HELP_TOUCH = 'DRAG to walk &nbsp;&nbsp; USE for whatever you stand at';

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    update(dt);

    ctx.fillStyle = '#14100e';
    ctx.fillRect(0, 0, W, H);

    faces = [];
    drawGround();
    drawField();
    drawShop();
    drawSpots();
    drawRobots();
    drawPlayer();
    paint();

    drawLabels();
    drawHud();
    drawPads();

    requestAnimationFrame(frame);
  }

  cam.x = player.x; cam.z = player.z - CAM_BACK; cam.y = CAM_UP;
  lookAround();
  makeOrder();
  requestAnimationFrame(frame);

</script>
</body>
</html>
