<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DICE QUEST</title>
<style>
  /* fill the whole window, no scrollbars, no white edges */
  html, body { margin: 0; padding: 0; overflow: hidden; background: #14101c; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// =====================================================================
// DICE QUEST — a roleplaying game where the d20 decides EVERYTHING,
// and the STORY ITSELF is rolled up fresh every playthrough.
//
// Real Dungeon Masters do this with "random tables": lists of quest
// bits, where you roll dice to pick one from each list and smoosh
// them together into tonight's adventure. That's exactly what this
// file does. Who needs help, what got stolen, who took it, and what
// stands in your way — all different, every single time.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

// if anything breaks, show the error in red instead of a frozen screen
window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND — tiny sound effects made from pure math, no files needed
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function clack(when, pitch) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square';
  o.frequency.value = pitch;
  g.gain.setValueAtTime(0.12, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.06);
  o.connect(g); g.connect(audio.destination);
  o.start(when); o.stop(when + 0.07);
}
function fanfare() {
  if (!audio) return;
  [523, 659, 784, 1047].forEach((n, i) => clack(audio.currentTime + i * 0.09, n));
}
function sadTrombone() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(300, audio.currentTime);
  o.frequency.linearRampToValueAtTime(150, audio.currentTime + 0.7);
  g.gain.setValueAtTime(0.15, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.8);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.85);
}

// ---------------------------------------------------------------------
// THE RANDOM TABLES — the ingredients every quest is cooked from.
// Add a line to any list and the game instantly knows new stories.
// ---------------------------------------------------------------------
const GIVERS = [

const ITEMS = [

  'the ROYAL UNDERPANTS (the lucky pair)',
  'the GREAT CHEESE WHEEL of the kingdom',
  'the MAGIC SPATULA of Flipping',

  'the ENCHANTED WHOOPEE CUSHION',

const VILLAINS = [

    lair: ['A glittering cave yawns in Dragon Mountain.',
           'And there, snoring on a pile of treasure,',

// every obstacle offers three attempts; failing is ALWAYS funny and

// ---------------------------------------------------------------------
// THE QUEST BUILDER — rolls on every table and stitches the story
// ---------------------------------------------------------------------
let SCENES = {};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuest() {
  const giver = pick(GIVERS);
  const item = pick(ITEMS);
  const villain = pick(VILLAINS);
  const obstacles = shuffle(OBSTACLES).slice(0, 2);   // two per journey
  SCENES = {};

  SCENES.start = {
    text: ['You are SIR TAPALOT, bravest knight around.',
           giver.name + ' ' + giver.doing + '.',
           '',
           villain.name.toUpperCase() + ' has stolen',
           item + '!',
           '',
           '"Bring it back," you are begged. "Before lunch."'],
    choices: [
      { label: 'Ride your horse toward trouble', dc: 8, success: 'ride_ok', fail: 'ride_no' },
      { label: 'Walk. Heroically. It is very far.', dc: 0, go: 'walk' },
    ],
  };
  SCENES.ride_ok = {
    text: ['Your horse, Sir Clompsalot, feels FAST today.',
           'You thunder across the kingdom like a legend.',
           'Peasants cheer. A goose salutes you.'],
    choices: [{ label: 'Onward!', dc: 0, go: 'ob0' }],
  };
  SCENES.ride_no = {
    text: ['Sir Clompsalot takes two steps, then stops',
           'to eat a daisy. You fly over his head...',
           '',
           '...and land in a pig trough. SPLOOSH.',
           'The pigs are delighted. You smell incredible.',
           'One pig follows you now. He believes in you.'],
    choices: [{ label: 'Squelch onward', dc: 0, go: 'ob0' }],
  };
  SCENES.walk = {
    text: ['You walk. And walk. AND WALK.',
           'Your armor squeaks the entire way.',
           'Your feet feel like two angry potatoes.',
           '',
           'But heroes walk. Everyone knows that.'],
    choices: [{ label: 'Limp bravely onward', dc: 0, go: 'ob0' }],
  };

  // the two randomly-drawn obstacles, wired up in a row
  obstacles.forEach((ob, i) => {
    const here = 'ob' + i;
    const next = i === 0 ? 'ob1' : 'lair';
    SCENES[here] = {
      text: ob.title,
      choices: ob.choices.map((ch, j) => (
        { label: ch.label, dc: ch.dc,
          success: here + '_ok' + j, fail: here + '_no' + j }
      )),
    };
    ob.choices.forEach((ch, j) => {
      SCENES[here + '_ok' + j] = { text: ch.ok,
        choices: [{ label: 'Onward!', dc: 0, go: next }] };
      SCENES[here + '_no' + j] = { text: ch.no,
        choices: [{ label: 'Onward anyway!', dc: 0, go: next }] };
    });
  });

  // the villain's lair: three classic approaches
  SCENES.lair = {
    text: villain.lair,
    choices: [
      { label: 'Tiptoe in and grab it', dc: 14, success: 'grab_ok', fail: 'chase' },
      { label: 'Knock and ask POLITELY', dc: 10, success: 'ask_ok', fail: 'chase' },
      { label: 'Yell "FREE SNACKS, THAT WAY!!"', dc: 12, success: 'trick_ok', fail: 'chase' },
    ],
  };
  SCENES.grab_ok = {
    text: ['You move like a shadow in polished armor.',
           'One breath... two... GOT IT.',
           'You are out before anyone even snorts.'],
    choices: [{ label: 'Carry it home in triumph', dc: 0, go: 'home' }],
  };
  SCENES.ask_ok = {
    text: ['You knock. You explain. You say "please."',
           '',
           villain.soft,
           '',
           'And just like that, the prize is yours.',
           'Politeness: the rarest of knightly weapons.'],
    choices: [{ label: 'Say thank you and head home', dc: 0, go: 'home' }],
  };
  SCENES.trick_ok = {
    text: ['"FREE SNACKS, THAT WAY!!" you bellow,',
           'pointing at absolutely nothing.',
           '',
           'It works. It always works.',
           'You grab the prize and scoot.'],
    choices: [{ label: 'Scoot faster', dc: 0, go: 'home' }],
  };
  SCENES.chase = {
    text: ['You are SPOTTED.',
           villain.roar + ' — and the chase is ON,',
           'all the way back down the road you came.',
           '',
           'RUN, SIR TAPALOT. RUN.'],
    choices: [{ label: 'RUN with the prize!', dc: 8, success: 'run_ok', fail: 'run_no' }],
  };
  SCENES.run_ok = {
    text: ['You are faster. You were BORN for this.',
           'You leap, roll, and vanish over the hill',
           'with the prize held high.',
           '',
           'Far behind you: grumpy, defeated noises.'],
    choices: [{ label: 'Jog home victorious', dc: 0, go: 'home' }],
  };
  SCENES.run_no = {
    text: ['You are caught in three heartbeats...',
           'and then set down, surprisingly gently.',
           '',
           villain.soft,
           '',
           'You promise to visit every Tuesday.',
           'The deal is struck. You keep the prize.'],
    choices: [{ label: 'Shake on it and head home', dc: 0, go: 'home' }],
  };
  SCENES.home = {
    text: ['You return before lunch, prize held high.',
           giver.reward,
           '',
           'Somewhere out there, a new troublemaker',
           'is already eyeing something shiny...',
           '',
           'THE END... until the dice roll again.'],
    choices: [{ label: 'ROLL UP A NEW QUEST', dc: 0, go: 'NEW' }],
  };
}

// ---------------------------------------------------------------------
// GAME STATE — where we are and what the die is doing
// ---------------------------------------------------------------------
let sceneId = 'start';
let mode = 'scene';     // 'scene' = reading & choosing, 'rolling' = die
                        // tumbling, 'result' = showing success/failure
let pending = null;
let rolling = 0;
let face = 20;
let result = 0;
let resultGlow = 0;
let wobble = 0;
let success = false;
let buttons = [];
let elapsed = 0;

buildQuest();           // roll up the very first adventure

function startRoll(choice) {
  pending = choice;
  mode = 'rolling';
  rolling = 1.1;
  result = 0;
  if (audio) for (let i = 0; i < 6; i++) {
    clack(audio.currentTime + i * 0.15, 700 + Math.random() * 500);
  }
}

function goTo(id) {
  if (id === 'NEW') { buildQuest(); sceneId = 'start'; }
  else sceneId = id;
  mode = 'scene';
  if (audio) clack(audio.currentTime, 500);
}

// ---------------------------------------------------------------------
// INPUT — one tap does everything, phone or mouse
// ---------------------------------------------------------------------
addEventListener('pointerdown', e => {
  ensureAudio();
  if (mode === 'scene') {
    for (const b of buttons) {
      if (e.clientX > b.x && e.clientX < b.x + b.w &&
          e.clientY > b.y && e.clientY < b.y + b.h) {
        if (b.choice.dc > 0) startRoll(b.choice);
        else goTo(b.choice.go);
        return;
      }
    }
  } else if (mode === 'result') {
    goTo(success ? pending.success : pending.fail);
  }
});

// ---------------------------------------------------------------------
// UPDATE — only the die needs updating; stories hold still
// ---------------------------------------------------------------------
function update(dt) {
  elapsed += dt;
  if (resultGlow > 0) resultGlow -= dt;
  if (mode === 'rolling' && rolling > 0) {
    rolling -= dt;
    wobble = Math.sin(elapsed * 40) * 0.4 * rolling;
    if (Math.random() < rolling * 0.9 + 0.15) {
      face = 1 + Math.floor(Math.random() * 20);
    }
    if (rolling <= 0) {
      // THE MOMENT OF TRUTH — one fair roll of a twenty-sided die
      face = 1 + Math.floor(Math.random() * 20);
      result = face;
      resultGlow = 1.6;
      wobble = 0;
      // the oldest rule: nat 20 always wins, nat 1 always loses
      success = result === 20 ? true
              : result === 1 ? false
              : result >= pending.dc;
      mode = 'result';
      if (success) fanfare(); else sadTrombone();
    }
  }
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function drawDie(cx, cy, size) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wobble);
  // a d20 seen from the front: a hexagon with a triangle of facets
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const x = Math.cos(a) * size, y = Math.sin(a) * size;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  const body = ctx.createLinearGradient(-size, -size, size, size);
  body.addColorStop(0, result === 20 && resultGlow > 0 ? '#8a6d1a' : '#3b2a5e');
  body.addColorStop(1, result === 20 && resultGlow > 0 ? '#4a3a0e' : '#1d1435');
  ctx.fillStyle = body;
  ctx.fill();
  ctx.strokeStyle = '#9b7bd8';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * (Math.PI * 2 / 3);
    const x = Math.cos(a) * size * 0.62, y = Math.sin(a) * size * 0.62;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = 'rgba(155, 123, 216, 0.55)';
  ctx.lineWidth = 2;
  ctx.stroke();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
    ctx.strokeStyle = 'rgba(155, 123, 216, 0.18)';
    ctx.stroke();
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = rolling > 0 ? '#c9b8ef'
                : result === 20 ? '#ffd23f'
                : result === 1 ? '#ff6b5e' : '#ffffff';
  ctx.font = `bold ${size * 0.62}px Georgia, serif`;
  ctx.fillText(face, 0, size * 0.04);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  const W = canvas.width, H = canvas.height;
  const cx = W / 2;
  const fs = Math.max(13, Math.min(18, W / 30));   // story letters shrink on phones

  // a candle-lit table: dark purple night with a warm pool of light
  ctx.fillStyle = '#14101c';
  ctx.fillRect(0, 0, W, H);
  const pool = ctx.createRadialGradient(cx, H / 2, 40, cx, H / 2, Math.max(W, H) * 0.6);
  pool.addColorStop(0, 'rgba(255, 190, 110, 0.12)');
  pool.addColorStop(1, 'rgba(255, 190, 110, 0)');
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#c9a15a';
  ctx.font = `bold ${Math.min(30, W / 16)}px Georgia, serif`;
  ctx.fillText('DICE QUEST', cx, 44);

  buttons = [];
  if (mode === 'scene') {
    // ---- the story so far ----
    const scene = SCENES[sceneId];
    ctx.fillStyle = '#e8dcc0';
    ctx.font = `${fs}px Georgia, serif`;
    let y = Math.max(90, H * 0.13);
    for (const line of scene.text) {
      ctx.fillText(line, cx, y);
      y += fs * 1.55;
    }
    // ---- the choices, stacked as parchment buttons ----
    const bw = Math.min(W - 30, 560), bh = Math.max(46, fs * 3);
    let by = H - 24 - scene.choices.length * (bh + 12);
    for (const choice of scene.choices) {
      const bx = cx - bw / 2;
      buttons.push({ x: bx, y: by, w: bw, h: bh, choice });
      ctx.fillStyle = choice.dc > 0 ? '#2a2040' : '#252031';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = choice.dc > 0 ? '#9b7bd8' : '#5a5470';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
      ctx.fillStyle = '#e8dcc0';
      ctx.font = `${fs}px Georgia, serif`;
      ctx.textAlign = 'left';
      ctx.fillText(choice.label, bx + 16, by + bh / 2 + fs * 0.35);
      if (choice.dc > 0) {
        // the little dice-badge that says how hard this attempt is
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffd23f';
        ctx.font = `bold ${fs * 0.9}px Georgia, serif`;
        ctx.fillText('roll ' + choice.dc + '+', bx + bw - 14, by + bh / 2 + fs * 0.3);
      }
      ctx.textAlign = 'center';
      by += bh + 12;
    }
  } else {
    // ---- the die holds the whole screen while fate decides ----
    const size = Math.min(W, H) * 0.17;
    if (resultGlow > 0) {
      const col = result === 20 ? '255, 210, 63'
                : success ? '125, 223, 143'
                : '232, 69, 60';
      const g = ctx.createRadialGradient(cx, H / 2, 20, cx, H / 2, 340);
      g.addColorStop(0, `rgba(${col}, ${0.25 * resultGlow})`);
      g.addColorStop(1, `rgba(${col}, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.fillStyle = '#9b8db8';
    ctx.font = `${fs}px Georgia, serif`;
    ctx.fillText(pending.label, cx, H * 0.22);
    ctx.fillStyle = '#ffd23f';
    ctx.font = `bold ${fs * 1.2}px Georgia, serif`;
    ctx.fillText('need ' + pending.dc + ' or higher', cx, H * 0.22 + fs * 2);

    drawDie(cx, H / 2, size);

    if (mode === 'result') {
      ctx.font = `bold ${Math.min(36, W / 14)}px Georgia, serif`;
      if (result === 20) {
        ctx.fillStyle = '#ffd23f';
        ctx.fillText('NATURAL 20!! CRITICAL!', cx, H / 2 + size * 1.8);
      } else if (result === 1) {
        ctx.fillStyle = '#ff6b5e';
        ctx.fillText('NATURAL 1... oh no.', cx, H / 2 + size * 1.8);
      } else if (success) {
        ctx.fillStyle = '#7ddf8f';
        ctx.fillText('SUCCESS!', cx, H / 2 + size * 1.8);
      } else {
        ctx.fillStyle = '#ff6b5e';
        ctx.fillText('FAILED...', cx, H / 2 + size * 1.8);
      }
      ctx.fillStyle = 'rgba(201, 161, 90, 0.75)';
      ctx.font = `${fs}px Georgia, serif`;
      ctx.fillText('tap to see what happens', cx, H / 2 + size * 1.8 + fs * 2.2);
    }
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP — update, draw, repeat forever
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
