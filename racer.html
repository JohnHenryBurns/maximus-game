<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MAX'S RACER</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #10131c; overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 10px;
    text-align: center; color: #cfd6e6; font-size: 14px;
    pointer-events: none; text-shadow: 0 2px 6px #000;
    transition: opacity .4s;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud">W / UP = go &nbsp;&nbsp; S / DOWN = brake &nbsp;&nbsp; A D / LEFT RIGHT = steer</div>

<script>
// ===================================================================
//  MAX'S RACER
// ===================================================================
//  First person. You're in the seat. There is no car on screen because
//  you ARE the car - all you see is your dashboard and the road coming
//  at you very fast.
//
//  The 3D maths in here is the SAME maths you wrote for Bob. project(),
//  addFace(), the face list, the painter's sort - all of it came
//  straight across from boss.html and worked first time. That's what
//  building an engine gets you: the second game is much faster than
//  the first.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;

  function fitScreen() {
    // Match the canvas to the window, allowing for retina screens so
    // everything stays sharp instead of going fuzzy.
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fitScreen);


// -------------------------------------------------------------------
//  THE TRACK - and this is the best bit
// -------------------------------------------------------------------
//  The whole track is ONE FUNCTION. Give it a distance down the road
//  and it tells you how far sideways the road has wandered by then.
//
//  Two sine waves added together: one long lazy one and one tighter
//  one. Adding waves of different sizes is how you get something that
//  feels designed instead of repetitive - and it never ends, because
//  sin() never runs out.
//
//  CHANGE THESE NUMBERS. Bigger multipliers = wider swings. Bigger
//  numbers next to z = tighter, twistier corners. This one line is the
//  entire course, so it's the most fun line in the file.
// -------------------------------------------------------------------

  function roadX(z) {
    return Math.sin(z * 0.0042) * 46 +
           Math.sin(z * 0.0131) * 15;
  }

  const ROAD_HALF = 12;     // half the width of the tarmac
  const SEG       = 7;      // how long one slab of road is
  const VIEW      = 95;     // how many slabs ahead you can see


// -------------------------------------------------------------------
//  SHORTCUTS
// -------------------------------------------------------------------
//  A shortcut is a straight dirt line that leaves the road, cuts
//  across the inside of a bend, and rejoins it further on.
//
//  We don't place them by hand. Both ends sit ON the road - we just
//  ask roadX() where the road is at the start and at the end, and run
//  a straight line between. Straight beats curved every time, so it's
//  automatically a shortcut, on every corner, forever.
//
//  The dirt is slower than tarmac. That's the deal: shorter, but less
//  grip. Change SHORT_SPEED to 105 if you'd rather they were free.
// -------------------------------------------------------------------

  const SHORT_EVERY = 748;   // one shortcut per bend
  const SHORT_START = 114;   // where the first one begins
  const SHORT_LEN   = 520;   // how long each one is
  const SHORT_HALF  = 7;     // half the width of the dirt
  const SHORT_SPEED = 88;    // top speed on dirt (tarmac is 105)

  // Where does shortcut number n start and end?
  function shortcutEnds(n) {
    const z0 = SHORT_START + n * SHORT_EVERY;
    const z1 = z0 + SHORT_LEN;
    return { z0: z0, z1: z1, x0: roadX(z0), x1: roadX(z1) };
  }

  // Where is shortcut n, sideways, at this distance down the track?
  // Straight line, so it's the same slide-between-two-things sum that
  // moved Bob's cannon onto his shoulder.
  function shortcutX(s, z) {
    const p = (z - s.z0) / (s.z1 - s.z0);
    return s.x0 + (s.x1 - s.x0) * p;
  }

  // Are you on a shortcut right now? Returns which one, or null.
  function shortcutUnder(x, z) {
    const n = Math.floor((z - SHORT_START) / SHORT_EVERY);
    for (const which of [n, n + 1]) {       // check this one and the next
      if (which < 0) continue;
      const s = shortcutEnds(which);
      if (z < s.z0 || z > s.z1) continue;
      if (Math.abs(x - shortcutX(s, z)) < SHORT_HALF) return s;
    }
    return null;
  }


// -------------------------------------------------------------------
//  RAMPS
// -------------------------------------------------------------------
//  A wedge sitting in the middle of the road. Drive up it and you get
//  thrown into the sky. It's narrower than the road on purpose, so
//  hitting one is always your choice.
// -------------------------------------------------------------------

  const RAMP_EVERY = 340;    // one every this many units of road
  const RAMP_LEN   = 26;     // how long the slope is
  const RAMP_H     = 5.5;    // how high the lip is
  const RAMP_HALF  = 5;      // half the width

  // HOW HIGH IS THE GROUND at this exact spot?
  //
  // Almost everywhere the answer is 0. On a ramp it's however far up
  // the slope you are. That one number is all the jumping needs -
  // drive along, follow the ground, and when the ground suddenly
  // isn't there any more, you're flying.
  function groundHeightAt(x, z) {
    const n = Math.round(z / RAMP_EVERY);
    if (n < 1) return 0;                    // no ramp right on the start line
    const rz = n * RAMP_EVERY;              // where this ramp starts

    const along = z - rz;
    if (along < 0 || along > RAMP_LEN) return 0;     // not on it lengthways
    if (Math.abs(x - roadX(rz)) > RAMP_HALF) return 0;  // not on it sideways

    return RAMP_H * (along / RAMP_LEN);     // partway up the slope
  }


// -------------------------------------------------------------------
//  THE CAR - that's you
// -------------------------------------------------------------------

  const car = {
    x: 0,          // where you are, left to right
    z: 0,          // how far down the track you've got
    yaw: 0,        // which way you're pointing. 0 = straight down the road.
    speed: 0,      // how fast you're actually going

    steer: 0,      // which way the wheel is turned right now, -1 to 1.
                   // This is NOT the same as which key you're holding -
                   // the wheel takes a moment to turn, and a moment to
                   // come back. That delay is most of what makes driving
                   // feel like driving instead of like sliding a box.

    onRoad: true,
    surface: 'road',   // 'road', 'dirt' or 'grass'

    // ---- LEAVING THE GROUND ----------------------------------------
    y: 0,              // how high off the ground you are
    vy: 0,             // how fast you're going UP. Gravity eats this.
    airborne: false,
    climb: 0,          // how fast the ground was lifting you a moment
                       // ago. THIS is what you launch with - the ramp
                       // doesn't throw you, it just stops being there
                       // while you're still going up.

    airTime: 0,        // how long this jump has lasted
    bestAir: 0         // your longest ever
  };

  const TOP_SPEED   = 105;   // how fast you can go on tarmac
  const GRASS_SPEED = 32;    // ...and how fast the grass lets you go
  const ACCEL       = 34;    // how hard you pull away
  const BRAKE       = 90;    // how hard the brakes bite
  const DRAG        = 9;     // slowing down when you touch nothing
  // HOW HARD THE SKY DROPS YOU.
  //
  // Real gravity is about 10. This is 34, because a racing game at
  // real gravity feels like driving on the moon. Games lie about
  // physics constantly - what matters is how it FEELS, not whether a
  // scientist would agree. Set it to 10 and try it, it's very funny.
  const GRAVITY     = 34;

  let shake = 0;             // rattles the camera on the grass


// -------------------------------------------------------------------
//  PROJECT - the most important function in the whole game.
//  Give it a point in the 3D world, it tells you where that point
//  lands on your flat screen. This is Bob's, word for word.
// -------------------------------------------------------------------

  const cam = { x: 0, y: 3.1, z: 0, yaw: 0, pitch: -0.055 };

  function project(x, y, z) {
    const dx = x - cam.x;
    const dy = y - cam.y;
    const dz = z - cam.z;

    // Spin it by the camera's yaw, so "forwards" really means the way
    // the camera is looking.
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const rx = dx * cy - dz * sy;   // how far to the RIGHT of the camera
    const rz = dx * sy + dz * cy;   // how far IN FRONT of the camera
    const ry = dy;                  // how far ABOVE the camera

    // Tilt it by the camera's pitch (looking up or down).
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const fz = rz * cp + ry * sp;
    const fy = ry * cp - rz * sp;

    // THE MAGIC LINE. Divide by how far in front it is.
    return {
      x: W / 2 + rx * focal() / fz,
      y: H / 2 - fy * focal() / fz,
      depth: fz
    };
  }

  function focal() { return H * 0.9; }


// -------------------------------------------------------------------
//  THE FACE LIST - furthest away gets painted first, so near things
//  cover far things. The painter's algorithm, same as Bob.
// -------------------------------------------------------------------

  let faces = [];

  function addFace(points3d, colour, lift) {
    const flat = [];
    let total = 0;

    for (const p of points3d) {
      const s = project(p[0], p[1], p[2]);
      // Any corner behind the camera and the maths goes haywire, so skip.
      if (s.depth < 0.4) return;
      flat.push(s);
      total += s.depth;
    }

    faces.push({
      points: flat,
      depth: total / flat.length - (lift || 0),
      colour: colour
    });
  }

  function shade(rgb, amount) {
    return 'rgb(' + (rgb[0] * amount | 0) + ',' +
                    (rgb[1] * amount | 0) + ',' +
                    (rgb[2] * amount | 0) + ')';
  }

  // A box, for the posts down the side of the track.
  function addBox(cx, cy, cz, w, h, d, rgb) {
    const hw = w / 2, hh = h / 2, hd = d / 2;

    const c = [
      [cx - hw, cy - hh, cz - hd], [cx + hw, cy - hh, cz - hd],
      [cx + hw, cy - hh, cz + hd], [cx - hw, cy - hh, cz + hd],
      [cx - hw, cy + hh, cz - hd], [cx + hw, cy + hh, cz - hd],
      [cx + hw, cy + hh, cz + hd], [cx - hw, cy + hh, cz + hd]
    ];

    // Each side gets its own brightness. That difference is the whole
    // reason your brain sees a solid object and not a flat blob.
    addFace([c[4], c[5], c[6], c[7]], shade(rgb, 1.15));   // top
    addFace([c[0], c[1], c[5], c[4]], shade(rgb, 0.80));   // back
    addFace([c[3], c[2], c[6], c[7]], shade(rgb, 1.00));   // front
    addFace([c[0], c[3], c[7], c[4]], shade(rgb, 0.66));   // left
    addFace([c[1], c[2], c[6], c[5]], shade(rgb, 0.90));   // right
  }


// -------------------------------------------------------------------
//  COLOURS - all in one place so they're easy to fiddle with
// -------------------------------------------------------------------

  const TARMAC_A = [58, 60, 68];
  const TARMAC_B = [50, 52, 60];
  const GRASS_A  = [58, 122, 62];
  const GRASS_B  = [50, 108, 55];
  const RUMBLE_A = [214, 62, 58];
  const RUMBLE_B = [238, 238, 238];
  const STRIPE   = '#eef0f4';
  const POST     = [230, 232, 238];
  const DIRT_A   = [150, 116, 74];
  const DIRT_B   = [136, 104, 66];
  const RAMP_C   = [226, 142, 44];
  const RAMP_LIP = [250, 214, 96];


// -------------------------------------------------------------------
//  DRAWING THE ROAD
// -------------------------------------------------------------------
//  We don't store a track anywhere. We work out, every single frame,
//  which slabs are in front of you right now and build just those.
//  The road doesn't exist until you can see it - which is why it can
//  go on forever without using up any memory at all.
// -------------------------------------------------------------------

  function drawRoad() {
    const first = Math.floor(car.z / SEG) - 2;

    for (let i = VIEW; i >= 0; i--) {
      const n  = first + i;             // which slab number this is
      const z0 = n * SEG;
      const z1 = z0 + SEG;

      const x0 = roadX(z0);
      const x1 = roadX(z1);

      // Every other slab is a slightly different shade. Nothing else in
      // this game does as much work for as little code - those bands
      // flying underneath you ARE the feeling of speed.
      const flip = (n % 2 === 0);

      // The grass, stretching away either side.
      addFace([[x0 - 400, -0.02, z0], [x0 + 400, -0.02, z0],
               [x1 + 400, -0.02, z1], [x1 - 400, -0.02, z1]],
              shade(flip ? GRASS_A : GRASS_B, 1));

      // The red and white kerb down each edge.
      const rum = flip ? RUMBLE_A : RUMBLE_B;
      addFace([[x0 - ROAD_HALF - 3.4, 0, z0], [x0 - ROAD_HALF, 0, z0],
               [x1 - ROAD_HALF, 0, z1], [x1 - ROAD_HALF - 3.4, 0, z1]],
              shade(rum, 1), 0.1);
      addFace([[x0 + ROAD_HALF, 0, z0], [x0 + ROAD_HALF + 3.4, 0, z0],
               [x1 + ROAD_HALF + 3.4, 0, z1], [x1 + ROAD_HALF, 0, z1]],
              shade(rum, 1), 0.1);

      // The tarmac itself.
      addFace([[x0 - ROAD_HALF, 0, z0], [x0 + ROAD_HALF, 0, z0],
               [x1 + ROAD_HALF, 0, z1], [x1 - ROAD_HALF, 0, z1]],
              shade(flip ? TARMAC_A : TARMAC_B, 1), 0.05);

      // Dashed white line down the middle. Every fourth slab, so it
      // comes out as dash-gap-gap-gap instead of a solid stripe.
      if (n % 4 === 0) {
        addFace([[x0 - 0.7, 0, z0], [x0 + 0.7, 0, z0],
                 [x1 + 0.7, 0, z1], [x1 - 0.7, 0, z1]],
                STRIPE, 0.2);
      }

      // A post every eighth slab, on both sides. Something standing UP
      // is what tells you how fast you're going - flat things sliding
      // past never look as quick as tall things whipping by.
      if (n % 8 === 0) {
        addBox(x0 - ROAD_HALF - 6, 1.7, z0, 0.7, 3.4, 0.7, POST);
        addBox(x0 + ROAD_HALF + 6, 1.7, z0, 0.7, 3.4, 0.7, POST);
      }
    }
  }


// -------------------------------------------------------------------
//  DRAWING THE SHORTCUTS
// -------------------------------------------------------------------
//  Chopped into slabs like the road is, for two reasons: the light and
//  dark bands give you the same rush of speed, and one enormous flat
//  shape would sort badly against the grass and flicker.
// -------------------------------------------------------------------

  function drawShortcuts() {
    const from = Math.floor((car.z - SHORT_LEN - SHORT_START) / SHORT_EVERY);
    const to   = Math.floor((car.z + VIEW * SEG - SHORT_START) / SHORT_EVERY);

    for (let n = Math.max(0, from); n <= to; n++) {
      const s = shortcutEnds(n);

      for (let z0 = s.z0; z0 < s.z1; z0 += SEG) {
        const z1 = Math.min(z0 + SEG, s.z1);
        if (z1 < car.z - SEG * 2) continue;          // already behind you

        const x0 = shortcutX(s, z0);
        const x1 = shortcutX(s, z1);
        const flip = (Math.floor(z0 / SEG) % 2 === 0);

        addFace([[x0 - SHORT_HALF, 0, z0], [x0 + SHORT_HALF, 0, z0],
                 [x1 + SHORT_HALF, 0, z1], [x1 - SHORT_HALF, 0, z1]],
                shade(flip ? DIRT_A : DIRT_B, 1), 0.08);
      }

      // A marker post at each end, so you can spot the turning.
      addBox(s.x0, 1.4, s.z0, 0.6, 2.8, 0.6, [240, 190, 60]);
      addBox(s.x1, 1.4, s.z1, 0.6, 2.8, 0.6, [240, 190, 60]);
    }
  }


// -------------------------------------------------------------------
//  DRAWING THE RAMPS
// -------------------------------------------------------------------

  function drawRamps() {
    const from = Math.round(car.z / RAMP_EVERY) - 1;
    const to   = Math.round((car.z + VIEW * SEG) / RAMP_EVERY);

    for (let n = Math.max(1, from); n <= to; n++) {
      const rz = n * RAMP_EVERY;
      const rx = roadX(rz);

      const zA = rz, zB = rz + RAMP_LEN;
      const xL = rx - RAMP_HALF, xR = rx + RAMP_HALF;

      // The slope you drive up.
      addFace([[xL, 0, zA], [xR, 0, zA], [xR, RAMP_H, zB], [xL, RAMP_H, zB]],
              shade(RAMP_C, 1.12), 0.3);

      // The sheer drop at the far end. This is the bit that stops
      // being under you.
      addFace([[xL, 0, zB], [xR, 0, zB], [xR, RAMP_H, zB], [xL, RAMP_H, zB]],
              shade(RAMP_C, 0.62), 0.3);

      // The two triangular sides. addFace takes any shape, not just
      // four-cornered ones - three corners is perfectly fine.
      addFace([[xL, 0, zA], [xL, 0, zB], [xL, RAMP_H, zB]], shade(RAMP_C, 0.75), 0.3);
      addFace([[xR, 0, zA], [xR, 0, zB], [xR, RAMP_H, zB]], shade(RAMP_C, 0.92), 0.3);

      // A bright lip along the top edge, so you can see it coming from
      // a long way off and decide whether you want it.
      addFace([[xL, RAMP_H, zB - 1.6], [xR, RAMP_H, zB - 1.6],
               [xR, RAMP_H, zB], [xL, RAMP_H, zB]],
              shade(RAMP_LIP, 1), 0.45);
    }
  }


// -------------------------------------------------------------------
//  THE SKY - two flat rectangles, no maths, painted before everything
// -------------------------------------------------------------------

  function drawSky() {
    // Where is the horizon? If you tilt the camera down, the horizon
    // slides UP the screen - so it has to move with the pitch or the
    // sky and the ground come apart.
    const horizon = H / 2 + focal() * Math.tan(cam.pitch);

    const sky = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
    sky.addColorStop(0, '#1d3f78');
    sky.addColorStop(1, '#8fc0e8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon);

    ctx.fillStyle = '#3c7a44';
    ctx.fillRect(0, horizon, W, H - horizon);
  }


// -------------------------------------------------------------------
//  THE DASHBOARD - the only bit of "your car" you ever see
// -------------------------------------------------------------------

  function drawDash() {
    const dashTop = H * 0.74;

    // The dash itself.
    ctx.fillStyle = '#171a24';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, dashTop + H * 0.06);
    ctx.quadraticCurveTo(W / 2, dashTop - H * 0.05, W, dashTop + H * 0.06);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // ---- THE STEERING WHEEL ----------------------------------------
    // It leans the way you're steering. This is the single cheapest
    // thing in the whole file and it does more for "I am driving this"
    // than anything else on screen.
    const wx = W / 2, wy = H * 1.02, r = Math.min(W * 0.26, H * 0.34);
    const tilt = car.steer * 0.5;

    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(tilt);

    ctx.lineWidth = Math.max(8, r * 0.11);
    ctx.strokeStyle = '#2b2f3d';
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI * 1.12, Math.PI * 1.88);
    ctx.stroke();

    ctx.strokeStyle = '#454b60';
    ctx.lineWidth = Math.max(5, r * 0.07);
    ctx.beginPath();
    ctx.moveTo(-r * 0.72, -r * 0.30);
    ctx.lineTo(0, -r * 0.06);
    ctx.lineTo(r * 0.72, -r * 0.30);
    ctx.stroke();

    ctx.restore();

    // ---- THE SPEEDO -------------------------------------------------
    const mph = Math.round(car.speed);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.11, 70) + 'px system-ui, sans-serif';
    ctx.fillStyle = car.airborne ? '#8ce0ff'
                  : car.onRoad   ? '#ffe08a'
                  :                '#ff8a6a';
    ctx.fillText(mph, W / 2, dashTop + H * 0.10);

    ctx.font = Math.min(W * 0.026, 15) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8c94aa';
    ctx.fillText('MPH', W / 2, dashTop + H * 0.135);

    // How far you've driven.
    ctx.textAlign = 'left';
    ctx.font = Math.min(W * 0.03, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8c94aa';
    ctx.fillText((car.z / 100).toFixed(1) + ' km', W * 0.05, dashTop + H * 0.115);

    // Your longest jump, kept forever.
    if (car.bestAir > 0.15) {
      ctx.fillStyle = '#8c94aa';
      ctx.fillText('best air ' + car.bestAir.toFixed(2) + 's',
                   W * 0.05, dashTop + H * 0.135);
    }

    // Shout at you about the surface, because the speedo dropping is
    // easy to miss when you're busy panicking.
    ctx.textAlign = 'right';
    if (car.airborne) {
      ctx.fillStyle = '#8ce0ff';
      ctx.fillText('AIRBORNE  ' + car.airTime.toFixed(2) + 's',
                   W * 0.95, dashTop + H * 0.115);
    } else if (car.surface === 'dirt') {
      ctx.fillStyle = '#e0b070';
      ctx.fillText('SHORTCUT', W * 0.95, dashTop + H * 0.115);
    } else if (car.surface === 'grass') {
      ctx.fillStyle = '#ff8a6a';
      ctx.fillText('OFF TRACK', W * 0.95, dashTop + H * 0.115);
    }
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const keys = {};
  window.addEventListener('keydown', function (e) {
    keys[e.key.toLowerCase()] = true;
    // Stop the arrow keys scrolling the page out from under you.
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  function held(a, b) { return keys[a] || keys[b]; }


// -------------------------------------------------------------------
//  DRIVING
// -------------------------------------------------------------------

  function update(dt) {

    // ---- WHAT ARE YOU STANDING ON? ---------------------------------
    // Compare where you are with where the road is at your distance.
    // Then, if you're not on tarmac, ask the shortcuts the same
    // question. It's why having the track as a function pays off - we
    // never search anything, we just ASK.
    const centre = roadX(car.z);

    if (Math.abs(car.x - centre) < ROAD_HALF)      car.surface = 'road';
    else if (shortcutUnder(car.x, car.z))          car.surface = 'dirt';
    else                                           car.surface = 'grass';

    car.onRoad = (car.surface !== 'grass');

    // IN THE AIR, THE GROUND CAN'T SLOW YOU DOWN. That's the whole
    // reward for taking a ramp - for a second and a bit you can sail
    // straight over grass at full speed.
    const limit = car.airborne ? TOP_SPEED
                : car.surface === 'road'  ? TOP_SPEED
                : car.surface === 'dirt'  ? SHORT_SPEED
                :                           GRASS_SPEED;

    // ---- THE PEDALS -------------------------------------------------
    if (held('w', 'arrowup')) {
      car.speed += ACCEL * dt;
    } else if (held('s', 'arrowdown')) {
      car.speed -= BRAKE * dt;
    } else {
      car.speed -= DRAG * dt;      // let go and you coast to a stop
    }

    // The grass doesn't stop you dead - it drags you down to ITS limit.
    if (car.speed > limit) car.speed -= (car.speed - limit) * 2.6 * dt;

    car.speed = Math.max(0, Math.min(TOP_SPEED, car.speed));

    // ---- THE WHEEL --------------------------------------------------
    // Holding left doesn't snap the wheel to full lock - it winds
    // TOWARDS full lock, and letting go winds it back. Try setting both
    // of those speeds to 99 and drive: it feels like a bar of soap.
    let want = 0;
    if (held('a', 'arrowleft'))  want -= 1;
    if (held('d', 'arrowright')) want += 1;

    const windSpeed = (want === 0) ? 6 : 4;
    car.steer += (want - car.steer) * Math.min(1, windSpeed * dt);

    // ---- TURNING ----------------------------------------------------
    // Multiplying by speed is the important part. Standing still you
    // can't turn at all, which is exactly right - a car turns because
    // it's MOVING, not because the wheel is round.
    car.yaw += car.steer * 1.5 * (car.speed / TOP_SPEED) * dt;

    // ---- GO -----------------------------------------------------------
    car.x += Math.sin(car.yaw) * car.speed * dt;
    car.z += Math.cos(car.yaw) * car.speed * dt;

    // ---- UP AND DOWN --------------------------------------------------
    // The ramp never throws you. Read that again, because it's the
    // whole trick: all a ramp does is BE higher. You follow the ground
    // up it, gaining height fast - and then at the lip the ground
    // vanishes while you're still rising, and you carry on rising.
    // That's a jump. Real ones work exactly the same way.
    const ground = groundHeightAt(car.x, car.z);

    if (car.airborne) {
      car.vy -= GRAVITY * dt;
      car.y  += car.vy * dt;
      car.airTime += dt;

      if (car.y <= ground) {           // BANG. Back on the deck.
        car.y = ground;
        car.vy = 0;
        car.airborne = false;
        car.climb = 0;
        shake = Math.min(1, shake + 0.55);
        if (car.airTime > car.bestAir) car.bestAir = car.airTime;
        car.airTime = 0;
      }
    } else {
      // How fast is the ground lifting us right now?
      const climb = (ground - car.y) / dt;

      if (climb < -1) {
        // It just fell away underneath us. Take off - with the speed we
        // were climbing at a moment ago, not with anything the ramp
        // "gave" us. There is no such thing.
        car.airborne = true;
        car.vy = car.climb;
        car.airTime = 0;
      } else {
        car.y = ground;
        car.climb = Math.max(0, climb);
      }
    }

    // Rattle the camera when you're bouncing over grass, harder the
    // faster you're going. Not in mid-air though - up there it's calm.
    const rough = !car.onRoad && !car.airborne;
    shake = rough ? Math.min(1, shake + dt * 4) * (car.speed / TOP_SPEED)
                  : Math.max(0, shake - dt * 5);

    // ---- THE CAMERA GOES WHERE YOU GO -------------------------------
    cam.x = car.x;
    cam.z = car.z;
    cam.y = 3.1 + car.y;      // ...including upwards. You SEE the jump.
    cam.yaw = car.yaw;

    // Lean the view a touch into the corner. Tiny effect, and you will
    // absolutely feel it if you delete it.
    cam.yaw += car.steer * 0.03;
  }


// -------------------------------------------------------------------
//  DRAW EVERYTHING
// -------------------------------------------------------------------

  function draw() {
    const savedY = cam.y;
    if (shake > 0) {
      cam.y += (Math.random() - 0.5) * shake * 0.9;
    }

    drawSky();

    faces = [];
    drawRoad();
    drawShortcuts();
    drawRamps();

    // Furthest away gets painted FIRST, so close things end up on top.
    faces.sort(function (a, b) { return b.depth - a.depth; });

    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) {
        ctx.lineTo(f.points[i].x, f.points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }

    cam.y = savedY;

    drawDash();
  }


// -------------------------------------------------------------------
//  THE GAME LOOP - update, draw, do it again. Sixty times a second.
// -------------------------------------------------------------------

  let last = 0;

  function loop(now) {
    // dt is how long the last frame took, in seconds. Everything moves
    // by speed * dt, so the game runs at the same pace on a fast
    // computer and a slow one.
    //
    // It is never allowed to be ZERO. The jump code divides by dt to
    // work out how fast the ground is lifting you, and dividing by
    // zero gives NaN - "not a number" - which then spreads into your
    // height, your speed, your position, and the car quietly vanishes
    // from the universe with no error message at all.
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000 || 0.016));
    last = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  fitScreen();
  requestAnimationFrame(loop);

</script>
</body>
</html>
