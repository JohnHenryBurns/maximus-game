  // WHERE THEY COME FROM.
  //
  // These used to be 70 and 130 - both INSIDE the fog, which ends at
  // 168. So things blinked into existence in plain sight, a hundred
  // paces away, out of nothing. Now they start past the fog entirely,
  // where nothing is drawn at all, and the first you know about one is
  // a shape walking out of the haze towards you.
  //
  // Nothing about them changed. They were always walking at you from a
  // distance. They were just starting that walk somewhere you could
  // watch them appear.
  const SPAWN_MIN = 176;
  const SPAWN_MAX = 240;

  // A ceiling, so a long game can't bury the frame rate. It's high
  // because a horde alone can be a hundred.
  const MAX_ENEMIES = 150;

  let spawnTimer = 1.5;

  // Returns true if one actually turned up. It won't when the field is
  // full, and callers that care - like the horde - need to be told
  // rather than left assuming.
  function spawnEnemy(atDistance, atAngle, forceKind) {
    if (enemies.length >= MAX_ENEMIES) return false;

    // MOSTLY IN FRONT OF YOU, so you get to see them coming out of the
    // fog - but not always, or you could pick one direction and camp
    // there forever.
    const a = (atAngle !== undefined) ? atAngle
      : (Math.random() < 0.7)
        ? player.yaw + (Math.random() - 0.5) * 2.6   // roughly where you look
        : Math.random() * Math.PI * 2;               // anywhere at all

    const d = atDistance || (SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN));

    // Shooters get commoner the longer you last. At the start it's
    // almost all crowd monsters; after two minutes, half and half.
    // WHICH monsters depends on the planet - every world fills the
    // same three jobs with its own locals.
    //
    // Zombie marines are NOT in this mix - Maximus ruled they only
    // march in with hordes, like officers leading the crowd. spawnHorde
    // asks for them by name.
    const local = PLANETS[planetIx].kinds;
    const robotChance = Math.min(0.5, clock / 240);
    const kind = forceKind ||
                 (Math.random() < robotChance ? local.ranged : local.melee);
    const k = KINDS[kind];

    enemies.push({
      kind: kind, k: k,
      // SIN FOR X, COS FOR Z - the same way round as everything else
      // that has a direction in this game. It was cos/sin, which is
      // ninety degrees out, and that never showed up while the angle
      // was completely random. The moment it got aimed at where you're
      // LOOKING, it started aiming ninety degrees to your right instead.
      x: player.x + Math.sin(a) * d,
      z: player.z + Math.cos(a) * d,
      yaw: 0,
      hp: k.hp,
      step: Math.random() * 6,      // so they aren't all in lockstep
      hitFlash: 0,
      cool: Math.random() * 2
    });

    return true;
  }

// -------------------------------------------------------------------
//  HORDES
// -------------------------------------------------------------------
//  Every so often, forty-five to a hundred of them come over the
//  horizon at once, all from the same direction, in a wide ragged line.
//
//  They start beyond the fog like everything else - but a horde is
//  drawn out there anyway, as a crowd of dark specks on the skyline.
//  That is the whole point of a horde: you're supposed to see it coming
//  and have to decide what to do about it long before it arrives.
//
//  What you should do about it is run for a settlement.
// -------------------------------------------------------------------

  const HORDE_MIN   = 45;
  const HORDE_MAX   = 100;
  // HOW OFTEN THEY COME. Maximus wanted them relentless, so these went
  // from 55 and 95 down to 18 and 30.
  //
  // Thirty seconds between hordes, and a zombie takes about twenty-four
  // to walk in from beyond the fog - so one lot is still arriving as the
  // next lot sets off. There is never a moment when nothing is coming.
  const HORDE_FIRST = 18;    // seconds before the first one
  const HORDE_EVERY = 30;    // and roughly this long between them

  let hordeTimer = HORDE_FIRST;
  let hordeWarn   = 0;       // how long the warning stays on screen
  let hordeSize   = 0;
  let hordeGiants = 0;
  let hordeBoss   = false;   // did THIS horde bring the big one?

  // CLEAR OUT SOME STRAGGLERS SO A HORDE CAN ACTUALLY ARRIVE.
  //
  // Found by simulating three minutes of play: hordes came at 30, 60,
  // 90, 120... and the sizes went 73, 53, 0, 0, 0, 0. After two hordes
  // the game was pinned at the 150 cap and every horde after that
  // delivered nothing at all. "Really often" would quietly have meant
  // "twice, then never again", with the game still cheerfully sounding
  // the horn.
  //
  // So we make room - but ONLY by removing ones that are past the fog,
  // furthest first. Nobody can watch a zombie wink out at 300 paces in
  // thick haze. Deleting one you were looking at would be a cheat you'd
  // notice; deleting one nobody can see is just housekeeping.
  function makeRoomFor(n) {
    const need = (enemies.length + n) - MAX_ENEMIES;
    if (need <= 0) return;

    const far = enemies
      .filter(function (e) {
        return !e.dead &&
               Math.hypot(e.x - player.x, e.z - player.z) > FOG_FAR;
      })
      .sort(function (a, b) {
        return Math.hypot(b.x - player.x, b.z - player.z) -
               Math.hypot(a.x - player.x, a.z - player.z);
      });

    const drop = Math.min(need, far.length);
    for (let i = 0; i < drop; i++) far[i].gone = true;

    if (drop > 0) enemies = enemies.filter(function (e) { return !e.gone; });
  }

  function spawnHorde() {
    const want = HORDE_MIN + Math.floor(Math.random() * (HORDE_MAX - HORDE_MIN + 1));

    // ONE direction for the whole crowd - that's what makes it a horde
    // and not just a busy afternoon. Slightly off from where you're
    // looking, so you have to spot it.
    const from = player.yaw + (Math.random() - 0.5) * 2.2;

    makeRoomFor(want);

    const before = enemies.length;

    for (let i = 0; i < want; i++) {
      // A wide, shallow band: spread far more across than deep, so it
      // reads as a LINE coming over a ridge rather than a blob.
      const across = (Math.random() - 0.5) * 1.15;
      const deep   = 215 + Math.random() * 85;
      spawnEnemy(deep, from + across, PLANETS[planetIx].kinds.melee);
    }

    // ---- AND SOMETHING BIG AT THE FRONT -----------------------------
    // Most hordes bring one or two giants, walking in with the crowd.
    // At the front, not wandering about on their own - a giant on its
    // own is a nuisance, a giant with ninety zombies behind it is a
    // problem you have to solve.
    //
    // And after four minutes, one horde in four brings the ZOMBIE BOSS
    // instead. A thousand hits, walking at you with the crowd around
    // his knees. The warning text changes when it's him - if it says
    // "something terrible", believe it.
    hordeGiants = 0;
    hordeBoss = false;
    if (clock > 240 && Math.random() < 0.25) {
      hordeBoss = spawnEnemy(205 + Math.random() * 20,
                             from + (Math.random() - 0.5) * 0.3,
                             'zombieBoss');
    } else if (Math.random() < 0.7) {
      const big = 1 + (Math.random() < 0.35 ? 1 : 0);
      for (let i = 0; i < big; i++) {
        if (spawnEnemy(198 + Math.random() * 30,
                       from + (Math.random() - 0.5) * 0.5,
                       PLANETS[planetIx].kinds.big)) {
          hordeGiants++;
        }
      }
    }

    // ---- AND, LATE ON, THE CORRUPTED SQUAD --------------------------
    // After two and a half minutes, half of all hordes march in with
    // two or three zombie marines at the front. A wall of shamblers is
    // a problem for your trigger finger; a wall of shamblers with
    // armoured riflemen in it is a problem for your BRAIN.
    if (clock > 150 && Math.random() < 0.5) {
      const dead = 2 + (Math.random() < 0.4 ? 1 : 0);
      for (let i = 0; i < dead; i++) {
        spawnEnemy(205 + Math.random() * 25,
                   from + (Math.random() - 0.5) * 0.7, 'zombieMarine');
      }
    }

    // HOW MANY ACTUALLY TURNED UP, not how many we asked for. With
    // hordes this frequent the 150 cap gets hit constantly, and
    // spawnEnemy quietly declines once it's full. Announcing "90 of
    // them" while twelve walked over the hill would be the screen
    // telling you something that isn't true.
    hordeSize = enemies.length - before;

    if (hordeSize > 0) {
      hordeWarn = 5;
      playHorde();
    }
  }

  function playHorde() {
    tone(90, 55, 2.6, 0.32, 'sawtooth');
    tone(136, 82, 2.4, 0.20, 'square');
    noise(2.2, 700, 120, 0.22);
  }

  function updateEnemies(dt) {
    // Work out ONCE, up front, who is close enough to matter. Every
    // enemy also remembers how far away it is, because the drawing
    // wants the same number and working it out twice is just work.
    const nearby = [];
    for (const e of enemies) {
      if (e.dead) continue;
      e.away = Math.hypot(player.x - e.x, player.z - e.z);
      if (e.away < 90) nearby.push(e);
    }

    for (const e of enemies) {
      // Already dead? Then he doesn't get to keep walking and biting
      // just because we haven't swept him off the list yet.
      if (e.dead) continue;

      e.hitFlash = Math.max(0, e.hitFlash - dt * 4);

      const dx = player.x - e.x, dz = player.z - e.z;
      const gap = e.away || 1;

      e.yaw = Math.atan2(dx, dz);           // always facing you

      // ---- WALK AT YOU --------------------------------------------
      // Stop at arm's length instead of climbing inside you.
      if (gap > e.k.reach) {
        e.x += (dx / gap) * e.k.speed * dt;
        e.z += (dz / gap) * e.k.speed * dt;
        e.step += dt * (e.k.speed * 0.55);
      }

      // ---- THEY CAN'T WALK THROUGH TOWERS EITHER ------------------
      // No clever route-finding - if he ends up inside something, we
      // shove him back out along the line from its middle. He's still
      // aiming at you every frame, so he shuffles round the edge on
      // his own. Looks like he's going round it. Close enough.
      const wall = blockedAt(e.x, e.z, e.k.radius);
      if (wall) {
        const wx = e.x - wall.x, wz = e.z - wall.z;
        const wg = Math.hypot(wx, wz) || 1;
        const want = wall.solid + e.k.radius;
        e.x = wall.x + (wx / wg) * want;
        e.z = wall.z + (wz / wg) * want;
      }

      // ---- PUSH EACH OTHER APART ----------------------------------
      // Without this they stack into one thick zombie and you can't
      // tell how many you're actually fighting.
      //
      // ONLY THE CLOSE ONES. This compares every enemy against every
      // other, which is fine for twenty and is 22,500 sums a frame for
      // a hundred and fifty. Out past 90 paces they're a few pixels
      // tall in the fog and nobody alive can tell whether two of them
      // are overlapping, so we simply don't ask.
      if (gap < 90) {
        for (const o of nearby) {
          if (o === e) continue;
          const ox = e.x - o.x, oz = e.z - o.z;
          const og = Math.hypot(ox, oz);
          const want = e.k.radius + o.k.radius;
          if (og < want && og > 0.01) {
            // Multiplied by how shovable THIS one is. A zombie bounces
            // off a giant; a giant walks through a crowd of zombies
            // barely noticing. Same line of code, one extra number.
            const push = (want - og) * 0.5 * e.k.shove;
            e.x += (ox / og) * push;
            e.z += (oz / og) * push;
          }
        }
      }

      e.cool -= dt;

      // ---- HURT YOU -----------------------------------------------
      // A ranged thing with a bite (the boss) uses teeth when you're
      // inside its reach and the gun the rest of the time. Robots
      // have bite 0, so nothing changes for them.
      const inReach = gap <= e.k.reach + 0.6;
      if (e.k.ranged && !(inReach && e.k.bite > 0)) {
        if (gap < 90 && e.cool <= 0) {
          e.cool = e.k.fireEvery;
          fireBolt(e);
        }
      } else if (inReach && e.cool <= 0) {
        e.cool = e.k.biteEvery;
        hurtPlayer(e.k.bite);
      }
    }
  }

  function fireBolt(e) {
    const dx = player.x - e.x, dz = player.z - e.z;
    const aim = Math.atan2(dx, dz);

    // Most things fire ONE bolt. A shotgun fires a FAN: the middle
    // pellet flies straight at you and the rest spread half a radian
    // wide. Stand close and all six hit; keep your distance and most
    // of the fan sails past. The spread IS the weapon.
    const n = e.k.pellets || 1;
    for (let i = 0; i < n; i++) {
      const a = aim + (n > 1 ? (i / (n - 1) - 0.5) * 0.5 : 0);
      bolts.push({
        x: e.x, y: e.k.boltY || e.k.height * 0.62, z: e.z,
        vx: Math.sin(a) * e.k.bolt,
        vz: Math.cos(a) * e.k.bolt,
        hurt: e.k.boltHurt,
        col: e.k.boltColour,      // zombie marines shoot RED. Robots
        life: 3.5                 // leave this empty and get the old blue.
      });
    }

    if (n > 1) {
      // A shotgun does not go "zap". A shotgun goes BOOM.
      noise(0.35, 600, 70, 0.4);
      tone(95, 45, 0.45, 0.3, 'sawtooth');
    } else {
      playZap();
    }
  }

  function updateBolts(dt) {
    for (const b of bolts) {
      b.x += b.vx * dt;
      b.z += b.vz * dt;
      b.life -= dt;

      // ---- DID IT HIT A WALL? -----------------------------------------
      // Solid things now know how HIGH they are, and that matters: a
      // bolt flying at head height should be stopped by a settlement
      // wall and should sail straight over a burnt-out car. Without the
      // height check every wreck in the wasteland becomes a force field.
      const wall = blockedAt(b.x, b.z, 0.4);
      if (wall && b.y < wall.tall) {
        b.life = 0;
        sparkBolt(b);
        continue;                 // it's gone - it can't also hit you
      }

      if (Math.hypot(b.x - player.x, b.z - player.z) < 2.2) {
        b.life = 0;
        hurtPlayer(b.hurt);
      }
    }
    bolts = bolts.filter(function (b) { return b.life > 0; });
  }

  // A bolt splashing off something solid. Reusing the gib system again -
  // it's just bits flying, and bits flying is bits flying.
  function sparkBolt(b) {
    burst(b.x, b.y, b.z, [[150, 230, 255], [90, 190, 240], [230, 250, 255]],
          8, 7);
    tone(720, 200, 0.09, 0.10, 'square');
  }

  function drawBolts() {
    for (const b of bolts) {
      groundY = terrainAt(b.x, b.z);
      if (b.col) {
        addBox(b.x, b.y, b.z, 0.9, 0.9, 0.9, [255, 200, 160]);
        addBox(b.x, b.y, b.z, 1.5, 0.4, 1.5, b.col);
      } else {
        addBox(b.x, b.y, b.z, 0.9, 0.9, 0.9, [140, 230, 255]);
        addBox(b.x, b.y, b.z, 1.5, 0.4, 1.5, [80, 180, 240]);
      }
    }
    groundY = 0;
  }

  // ---- DRAWING ONE OF THEM ------------------------------------------
  // Both kinds are drawn by the SAME function. It reads the sizes and
  // colours out of e.k, so a zombie and a robot are the same shape put
  // together from different numbers - which is why adding a third kind
  // needs no drawing code at all.
  const HORDE_SEE = 340;     // how far a horde is visible on the skyline

  function drawEnemy(e) {
    groundY = terrainAt(e.x, e.z);
    const k = e.k;
    const s = e.yaw;
    const co = Math.cos(s), si = Math.sin(s);

    const away = e.away !== undefined
      ? e.away : Math.hypot(player.x - e.x, player.z - e.z);

    // ---- HOW MUCH OF HIM IS WORTH DRAWING? --------------------------
    // A full enemy is thirteen boxes, which is sixty-five flat shapes.
    // A hundred of those is six and a half thousand, and the game would
    // crawl. So the further off he is, the less of him gets built.
    //
    // At two hundred paces he's a few pixels tall. Nobody has ever been
    // able to count a distant zombie's legs.

    // BEYOND THE FOG: one dark speck, so a horde shows on the horizon.
    // This is the only reason you get to see one coming.
    if (away > FOG_FAR) {
      if (away > HORDE_SEE) return;

      seeFar = true;
      fogResist = 0.35;      // mostly swallowed - a shape, not a zombie

      // Grown a little with distance so it stays a visible speck.
      const w = 1.6 + away * 0.006;
      addBox(e.x, k.height * 0.45, e.z, w, k.height * 0.75, w,
             shade(k.body, 0.6), s);

      fogResist = 0;
      seeFar = false;
      return;
    }

    // HOW BIG IS HE ON SCREEN, not how far away is he.
    //
    // A giant is three times a zombie's height, so at ninety paces he
    // still fills as much screen as a zombie at thirty. Judging detail
    // by raw distance would strip a giant down to three boxes while he
    // was still looming over you. Dividing by his height fixes that in
    // one line, for every kind, including any we add later.
    const lod = away / (k.height / 5.4);

    // FAR: body and head. Three boxes instead of thirteen.
    if (lod > 78) {
      addBox(e.x, k.height * 0.30, e.z, 2.2, k.height * 0.6, 1.5, k.limb, s);
      addBox(e.x, k.height * 0.68, e.z, 3.0 * (k.wide || 1), k.height * 0.3,
             1.9 * (k.wide || 1), k.body, s);
      addBox(e.x, k.height * 0.88, e.z, 1.9, 1.8, 1.8, k.head, s);
      return;
    }

    // MIDDLE DISTANCE: legs that swing, a body, a head, and the eyes.
    // No arms, no rust stripe, no belt. Six boxes.
    //
    // This tier exists because of a measurement: a hundred of them at
    // full detail came to 4,535 shapes in one frame. Most of a horde
    // sits in this band, so most of a horde now costs half as much.
    if (lod > 34) {
      const sw = Math.sin(e.step) * 1.1;
      addBox(e.x - 0.9 * co, k.height * 0.20, e.z + 0.9 * si,
             1.1, k.height * 0.42, 1.1, k.limb, s);
      addBox(e.x + 0.9 * co, k.height * 0.20, e.z - 0.9 * si,
             1.1, k.height * 0.42, 1.1, k.limb, s);
      addBox(e.x, k.height * 0.58 + sw * 0.05, e.z,
             3.0 * (k.wide || 1), k.height * 0.36,
             1.9 * (k.wide || 1), k.body, s);
      addBox(e.x, k.height * 0.86, e.z, 1.9, 1.8, 1.8, k.head, s);
      if (k.helmet) {
        // Even at half detail the boss keeps his helmet - horns are
        // the whole point of him, and they'd pop in weirdly otherwise.
        addBox(e.x, k.height * 0.94, e.z, 2.3, 1.3, 2.3, [72, 66, 62], s);
        addBox(e.x - 1.6 * co, k.height * 1.0, e.z + 1.6 * si,
               0.6, 1.6, 0.6, [222, 210, 184], s);
        addBox(e.x + 1.6 * co, k.height * 1.0, e.z - 1.6 * si,
               0.6, 1.6, 0.6, [222, 210, 184], s);
      }
      if (k.visor) {
        // One glowing strip instead of two eyes.
        addBox(e.x - 0.95 * si, k.height * 0.88, e.z - 0.95 * co,
               1.2, 0.34, 0.16, k.eye, s);
      } else {
        addBox(e.x - 0.5 * co - 0.95 * si, k.height * 0.88,
               e.z + 0.5 * si - 0.95 * co, 0.42, 0.34, 0.16, k.eye, s);
        addBox(e.x + 0.5 * co - 0.95 * si, k.height * 0.88,
               e.z - 0.5 * si - 0.95 * co, 0.42, 0.34, 0.16, k.eye, s);
      }
      return;
    }

    // Hit flash: mix the colour towards white by however much is left.
    function lit(rgb) {
      const f = e.hitFlash;
      return [rgb[0] + (255 - rgb[0]) * f,
              rgb[1] + (255 - rgb[1]) * f,
              rgb[2] + (255 - rgb[2]) * f];
    }

    function part(ox, oy, oz, w, h, d, rgb) {
      addBox(e.x + ox * co + oz * si, oy, e.z - ox * si + oz * co,
             w, h, d, lit(rgb), s);
    }

    const swing = Math.sin(e.step) * 1.1;
    const sway  = Math.sin(e.step * 0.5) * (k.ranged ? 0.05 : 0.3);
    const h = k.height;

    // legs
    part(-0.9, h * 0.20, swing * 0.5, 1.1, h * 0.42, 1.1, k.limb);
    part( 0.9, h * 0.20, -swing * 0.5, 1.1, h * 0.42, 1.1, k.limb);

    // body
    // "wide" fattens the torso - the boss is 1.8 of everyone else.
    part(sway * 0.4, h * 0.58, 0, 3.0 * (k.wide || 1), h * 0.36,
         1.9 * (k.wide || 1), k.body);

    // arms - a zombie holds them out in front, a robot lets them hang.
    // armLen stretches them: the boss's reach further than anyone's.
    const AL = k.armLen || 3.4;
    if (k.ranged && !k.shotgun) {
      part(-2.0, h * 0.56, 0.2, 0.9, h * 0.30, 0.9, k.limb);
      part( 2.0, h * 0.56, -0.2, 0.9, h * 0.30, 0.9, k.limb);
      part( 2.0, h * 0.50, -1.6, 1.2, 1.2, 2.6, k.body);      // the gun
    } else {
      part(-1.8, h * 0.62, 0.3 - AL / 2 + swing * 0.3, 0.9, 0.9, AL, k.limb);
      part( 1.8, h * 0.62, 0.3 - AL / 2 - swing * 0.3, 0.9, 0.9, AL, k.limb);
    }

    // FOUR-ARMED? A second pair, lower down and swinging the other
    // way, so all four are never in step. That out-of-step-ness is
    // most of what makes it read as "too many arms" instead of
    // "thick arms".
    if (k.arms4) {
      part(-1.9, h * 0.46, 0.4 - AL / 2 - swing * 0.3, 0.9, 0.9, AL * 0.94, k.limb);
      part( 1.9, h * 0.46, 0.4 - AL / 2 + swing * 0.3, 0.9, 0.9, AL * 0.94, k.limb);
    }

    // THE GIANT SHOTGUN. Two fat barrels and a wooden stock, carried
    // in the lower pair of hands, pointing at whatever he's facing -
    // which is you.
    if (k.shotgun) {
      const gz = 0.3 - AL;
      part(-0.65, h * 0.46, gz - 1.4, 1.1, 1.1, 7.0, [52, 48, 44]);
      part( 0.65, h * 0.46, gz - 1.4, 1.1, 1.1, 7.0, [52, 48, 44]);
      part( 0,    h * 0.46, gz + 3.2, 1.7, 1.7, 2.6, [96, 66, 42]);
    }

    // head
    part(sway, h * 0.86, 0, 1.9, 1.8, 1.8, k.head);

    // THE HORNED HELMET. A dark metal box over the head, a brim, and
    // a horn each side built from two stacked boxes - fat base, thin
    // tip, tip shoved further out. Boxes can't lean sideways, but two
    // boxes stepped outwards LOOK like a lean, and that's enough.
    if (k.helmet) {
      const iron = [72, 66, 62], bone = [222, 210, 184];
      part(sway, h * 0.94, 0, 2.3, 1.3, 2.3, iron);              // the dome
      part(sway, h * 0.87, 0, 2.7, 0.4, 2.7, iron);              // the brim
      for (const hx of [-1, 1]) {
        part(sway + hx * 1.5, h * 0.97, 0, 0.8, 1.2, 0.8, bone); // horn base
        part(sway + hx * 2.0, h * 1.04, 0, 0.5, 1.3, 0.5, bone); // horn tip
      }
    }

    // eyes - not lit(), because a glowing eye shouldn't wash out white
    if (k.visor) {
      // A single red visor strip. The whole difference between "dead
      // guy" and "dead SOLDIER" is this one box.
      addBox(e.x + (-0.95 * si), h * 0.88, e.z + (-0.95 * co),
             1.2, 0.34, 0.16, k.eye, s);
    } else {
      for (const ex of [-0.5, 0.5]) {
        addBox(e.x + (ex * co) + (-0.95 * si), h * 0.88,
               e.z - (ex * si) + (-0.95 * co),
               0.42, 0.34, 0.16, k.eye, s);
      }
    }
  }


// -------------------------------------------------------------------
//  BITS FLYING OFF
// -------------------------------------------------------------------

  function burst(x, y, z, colours, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const p = power * (0.4 + Math.random());
      gibs.push({
        x: x, y: y, z: z,
        vx: Math.cos(a) * p,
        vy: 6 + Math.random() * 16,
        vz: Math.sin(a) * p,
        size: 0.35 + Math.random() * 1.1,
        life: 0.6 + Math.random() * 0.8,
        spin: Math.random() * 6,
        colour: colours[Math.floor(Math.random() * colours.length)]
      });
    }
  }

  function updateGibs(dt) {
    for (const g of gibs) {
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      g.z += g.vz * dt;
      g.vy -= 34 * dt;
      g.spin += dt * 5;
      g.life -= dt;
      if (g.y < 0.2) { g.y = 0.2; g.vy = 0; g.vx *= 0.7; g.vz *= 0.7; }
    }
    gibs = gibs.filter(function (g) { return g.life > 0; });
  }

  function drawGibs() {
    for (const g of gibs) {
      groundY = terrainAt(g.x, g.z);
      addBox(g.x, g.y, g.z, g.size, g.size, g.size, g.colour, g.spin);
    }
    groundY = 0;
  }


// -------------------------------------------------------------------
//  SHOOTING
// -------------------------------------------------------------------
//  There is no bullet. Nothing flies through the air. The instant you
//  pull the trigger we ask "what is the crosshair pointing at?" and
//  whatever's nearest takes the hit.
//
//  That's called a HITSCAN, and it's how nearly every gun in nearly
//  every shooter works. It feels right because a real bullet arrives
//  faster than you could ever notice.
// -------------------------------------------------------------------

  function shoot() {
    if (state !== 'play' || player.cool > 0) return;
    // The marine rifle cycles half again as fast as the scrap gun.
    player.cool = player.marineRifle ? 0.10 : GUN_COOL;

    flash = 1;
    shake = Math.max(shake, 0.16);
    playShot();

    // An arrow pointing exactly where the crosshair is.
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);

    let best = null, bestAlong = Infinity;

    for (const e of enemies) {
      if (e.dead) continue;            // no shooting a corpse

      const dx = e.x - player.x, dz = e.z - player.z;

      // HOW FAR IN FRONT is he? (dot product again - the same sum that
      // worked out whether you rammed the other car head-on.)
      const along = dx * fx + dz * fz;
      if (along <= 0 || along > GUN_RANGE) continue;    // behind, or too far

      // HOW FAR OFF THE LINE is he? Miss by more than his width and it
      // sails past him. The 1.3 is deliberate generosity - a hitbox
      // slightly bigger than the thing you can see feels fair, and one
      // slightly smaller feels broken, even though both are "wrong".
      const across = Math.abs(dx * fz - dz * fx);
      if (across > e.k.radius * 1.3) continue;

      // And are you aiming at roughly the right HEIGHT? Both of you
      // measured from your own patch of ground - a zombie on a cliff
      // above you really is UP.
      const rise = (terrainAt(e.x, e.z) + e.k.height * 0.6) -
                   (player.feetY + EYE_H);
      if (Math.abs(Math.atan2(rise, along) - player.pitch) > GUN_AIM) continue;

      // Nearest one wins - you can't shoot through the front zombie.
      if (along < bestAlong) { bestAlong = along; best = e; }
    }

    if (best) hitEnemy(best);
  }

  function hitEnemy(e) {
    e.hp -= player.gunDamage;
    e.hitFlash = 1;

    // Knocked back a step. Small, but it's what makes the gun feel like
    // it's actually connecting with something.
    const dx = e.x - player.x, dz = e.z - player.z;
    const g = Math.hypot(dx, dz) || 1;
    e.x += (dx / g) * e.k.knock;
    e.z += (dz / g) * e.k.knock;

    burst(e.x, e.k.height * 0.6, e.z, e.k.gib, 9, 8);

    if (e.hp <= 0) killEnemy(e);
    else playHit();
  }

  // Does this kill count towards the job you took? A job that asks
  // for zombies is happy with anything doing the zombie JOB on this
  // planet - that's what the "role" on each kind is for.
  function questCredit(e) {
    if (!quest) return;
    if (quest.kind !== 'any' && quest.kind !== e.kind &&
        quest.kind !== e.k.role) return;

    quest.count++;
    if (quest.count >= quest.target) finishQuest();
  }

  function finishQuest() {
    if (quest.reward === 'heal') {
      player.maxHealth += 10;
      player.health = player.maxHealth;
    } else if (quest.reward === 'health') {
      player.maxHealth += 30;
      player.health = Math.min(player.maxHealth, player.health + 30);
    } else if (quest.reward === 'gun') {
      player.gunDamage += 1;
    }

    questWord = 'JOB DONE  -  ' + REWARD_TEXT[quest.reward];
    questFlash = 6;

    // The quest object you're carrying IS the one nailed to that
    // settlement's board - not a copy of it. So marking it done marks
    // the board, and because the board lives on the cached prop, it
    // stays done however far you wander.
    quest.done = true;
    quest.readyAt = clock + QUEST_REGEN;    // back up in a minute
    quest = null;

    tone(520, 900, 0.5, 0.2, 'sine');
    tone(700, 1200, 0.5, 0.14, 'triangle');
  }

  function killEnemy(e) {
    e.dead = true;
    player.kills++;
    player.scrap += e.k.scrap;
    questCredit(e);
    burst(e.x, e.k.height * 0.5, e.z, e.k.gib, 34, 20);
    playKill();
  }

  function hurtPlayer(amount) {
    if (state !== 'play') return;

    // Marine armour halves EVERYTHING - bites, bolts, all of it. One
    // line, right at the front door where all the damage comes in.
    if (player.marineArmour) amount *= 0.5;

    player.health -= amount;
    player.hurtFlash = 1;
    shake = Math.max(shake, 0.5);
    playOw();

    if (player.health <= 0) {
      player.health = 0;
      state = 'dead';
      deadTimer = 0;
    }
  }


// -------------------------------------------------------------------
//  SPACE MARINES
// -------------------------------------------------------------------
//  There are marines in orbit, and a working radio tower can ask them
//  for help. Ask, and a drop pod falls out of the sky and SLAMS into
//  the dirt, and one marine climbs out.
//
//  He doesn't work for you yet. He stands by his pod until you walk up
//  and recruit him - then he's in your squad: he follows you around
//  the wasteland and shoots what you're being chased by.
//
//  Maximus designed all of this. One marine per pod, allies not
//  enemies, recruited not automatic.
// -------------------------------------------------------------------

  const MARINE = {
    height: 4.8,       // taller and much wider than a wasteland local
    radius: 2.0,
    range: 80,         // how far his rifle reaches
    fireEvery: 0.45,   // seconds between shots
    hurt: 3,           // damage per shot - three zombies a second, ish
    follow: 14         // how far away his personal spot is - Maximus
                       // said 9 was too crowded
  };

  // The squad's leash. Inside NEAR of his spot a marine STOPS - he
  // doesn't shuffle after your every step, and if you stand still, so
  // does he. Past FAR he jogs to catch up. And he'll never chase an
  // enemy further than LEASH from you - he's your squad, not a stray.
  const MARINE_NEAR  = 12;
  const MARINE_FAR   = 24;
  const MARINE_LEASH = 48;

  const MARINE_MAX  = 12;    // a full ARMY. Maximus kept asking for more
                             // and honestly, who wouldn't
  const POD_COOL    = 45;    // seconds before a tower can call again
  const POD_FALL    = 170;   // paces per second, straight down
  const POD_START_Y = 340;   // where the fall begins - about a 2s drop

  const ARMOUR      = [64, 78, 94];      // steel blue plate
  const ARMOUR_DARK = [46, 56, 70];
  const VISOR       = [255, 150, 40];    // the glowing orange eye slit

  let pods    = [];   // pods falling or sitting where they landed
  let marines = [];   // every marine, waiting or in the squad

  function squadSize() {
    let n = 0;
    for (const m of marines) if (m.state === 'squad') n++;
    return n;
  }

  // ---- CALLING ONE DOWN ---------------------------------------------
  // The pod aims for open dirt NEAR the tower, never on top of you -
  // being landed on by ten tons of pod would be a rude way to lose.
  // ---- CALLING A KILL RIG IN --------------------------------------
  //
  // The tower can reach the settlements, and the settlements are the
  // ones with a kill rig. So: get on the radio, and one comes.
  //
  // It's a much longer wait than a drop pod, because a kill rig is a
  // much bigger favour to ask.
  const KILL_CALL_COOL = 210;    // three and a half minutes per tower

  function canCallKillRig(tower) {
    if (!tower) return false;
    if (clock < (tower.killReadyAt || 0)) return false;
    // Still only ever one on the map. Calling a second would just be
    // traffic, and it would quietly do nothing, which is worse.
    return !others.some(function (q) { return q.side === 'kill'; });
  }

  function callKillRig(tower) {
    if (!canCallKillRig(tower)) return;
    tower.killReadyAt = clock + KILL_CALL_COOL;

    // It arrives out of the fog and comes to you - far enough away that
    // you SEE it coming, which is most of the point of one.
    const a = Math.random() * Math.PI * 2;
    const d = 260 + Math.random() * 80;
    const k = makeOther('kill',
      player.x + Math.sin(a) * d, player.z + Math.cos(a) * d, a + Math.PI);
    k.speed = TOP_SPEED * KILL_TOP;      // already rolling when it appears
    others.push(k);

    questWord = 'KILL RIG INBOUND  -  it is on its way to you';
    questFlash = 4;
    tone(180, 320, 0.5, 0.2, 'square');
    setTimeout(function () { tone(320, 180, 0.7, 0.18, 'square'); }, 260);
  }

  function summonPod(tower) {
    tower.podReadyAt = clock + POD_COOL;

    let px = tower.x + 14, pz = tower.z;
    for (let tries = 0; tries < 8; tries++) {
      const a = Math.random() * Math.PI * 2;
      const d = 12 + Math.random() * 8;
      const tx = tower.x + Math.sin(a) * d;
      const tz = tower.z + Math.cos(a) * d;
      if (Math.hypot(tx - player.x, tz - player.z) < 9) continue;  // not on you
      if (blockedAt(tx, tz, 3)) continue;                          // not in a wall
      px = tx; pz = tz;
      break;
    }

    pods.push({ x: px, z: pz, y: POD_START_Y, landed: false,
                spin: Math.random() * Math.PI * 2 });

    // Old landed pods past the fog get swept away, so a long game
    // doesn't slowly fill the map with empty tins.
    if (pods.length > 10) {
      pods = pods.filter(function (p) {
        return !p.landed ||
               Math.hypot(p.x - player.x, p.z - player.z) < FOG_FAR ||
               pods.indexOf(p) >= pods.length - 10;
      });
    }

    questWord = 'DROP POD INBOUND  -  watch the sky';
    questFlash = 4;
    playPodCall();
  }

  function updatePods(dt) {
    for (const p of pods) {
      if (p.landed) continue;

      p.y -= POD_FALL * dt;

      // A little fire streaming off it on the way down.
      burst(p.x, p.y - 2, p.z,
            [[255, 180, 60], [255, 120, 40], [120, 110, 100]], 2, 4);

      if (p.y <= 3.1) {
        p.y = 3.1;
        p.landed = true;

        // THE SLAM. Dust everywhere, the screen kicks, and the closer
        // you're standing the harder it kicks.
        const away = Math.hypot(p.x - player.x, p.z - player.z);
        shake = Math.max(shake, Math.max(0.4, 1.4 - away / 120));
        burst(p.x, 1, p.z,
              [GROUND_TAN, [150, 122, 88], [110, 96, 76]], 30, 16);
        playPodSlam();

        // And out he climbs.
        const a = Math.random() * Math.PI * 2;
        marines.push({
          x: p.x + Math.sin(a) * 4.5,
          z: p.z + Math.cos(a) * 4.5,
          yaw: 0, step: 0, cool: 0, flash: 0,
          state: 'wait'
        });
      }
    }
  }

  // ---- RECRUITING ---------------------------------------------------
  function recruitMarine(m) {
    if (squadSize() >= MARINE_MAX) return;
    m.state = 'squad';
    m.seed = Math.random();   // picks his personal spot around you
    m.moving = false;
    questWord = 'MARINE RECRUITED  -  ' + squadSize() + ' of ' + MARINE_MAX;
    questFlash = 4;
    playRecruit();
  }

  // ---- THE SQUAD, EVERY FRAME ---------------------------------------
  function updateMarines(dt) {
    for (const m of marines) {
      m.flash = Math.max(0, m.flash - dt * 9);
      m.cool -= dt;

      if (m.state === 'wait') {
        // Standing by his pod. He turns to watch you if you're close -
        // a little thing, but it makes him feel awake.
        const d = Math.hypot(player.x - m.x, player.z - m.z);
        if (d < 40) m.yaw = Math.atan2(player.x - m.x, player.z - m.z);
        continue;
      }

      const toYou = Math.hypot(player.x - m.x, player.z - m.z);

      // ---- WHO'S HE FIGHTING? -----------------------------------
      // Nearest live enemy in rifle range. Same hunt the guards do.
      let best = null, bestD = MARINE.range;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - m.x, e.z - m.z);
        if (d < bestD) { bestD = d; best = e; }
      }

      // ---- WHERE SHOULD HE STAND? -------------------------------
      // His own spot AROUND you, picked from his seed - not a slot
      // glued to your back. The spot doesn't care which way you're
      // FACING, so turning your head doesn't send the squad
      // scurrying. Only actually walking away does.
      const offA = (m.seed || 0) * Math.PI * 2;
      const offR = MARINE.follow * (0.7 + (m.seed || 0) * 0.6);
      const dx = player.x + Math.sin(offA) * offR - m.x;
      const dz = player.z + Math.cos(offA) * offR - m.z;
      const gap = Math.hypot(dx, dz);

      // The leash, with slack in it. Past FAR he starts jogging, but
      // he doesn't STOP jogging until he's inside NEAR - so he
      // arrives and stands easy, instead of hovering on the line
      // taking one fussy step every time you shift your feet.
      if (!m.moving && gap > MARINE_FAR) m.moving = true;
      if (m.moving && gap < MARINE_NEAR) m.moving = false;

      let mvx = 0, mvz = 0, speed = 0;

      if (m.moving) {
        // Catching up. Faster the further behind he is.
        speed = clamp(gap * 2.2, 10, 46);
        mvx = dx / gap; mvz = dz / gap;

      } else if (best) {
        // ---- COMBAT FOOTWORK ----------------------------------
        // Not chasing, so he fights with his feet as well as his
        // rifle: too close and he backs off, firing the whole way;
        // barely in range and he pushes forward to engage - but
        // never further from you than the leash allows. In between
        // he plants his boots and holds the line.
        const ex = best.x - m.x, ez = best.z - m.z;
        if (bestD < 10 && toYou < MARINE_FAR) {
          speed = 18;
          mvx = -ex / bestD; mvz = -ez / bestD;      // give ground
        } else if (bestD > MARINE.range * 0.8 && toYou < MARINE_LEASH) {
          speed = 13;
          mvx = ex / bestD; mvz = ez / bestD;        // press forward
        }
      }

      if (speed > 0) {
        m.x += mvx * speed * dt;
        m.z += mvz * speed * dt;
        m.step += dt * speed * 0.55;
        m.yaw = Math.atan2(mvx, mvz);
      }
      // No speed means no movement AND no walking animation - if you
      // stand still, the whole squad stands still. That was the bug
      // Maximus called out: a marine should hold a position, not
      // orbit you like a nervous moon.

      // Walls stop marines the same way they stop everything else.
      const wall = blockedAt(m.x, m.z, MARINE.radius);
      if (wall) {
        const wx = m.x - wall.x, wz = m.z - wall.z;
        const wg = Math.hypot(wx, wz) || 1;
        const want = wall.solid + MARINE.radius;
        m.x = wall.x + (wx / wg) * want;
        m.z = wall.z + (wz / wg) * want;
      }

      // And they don't stand inside each other.
      for (const o of marines) {
        if (o === m || o.state !== 'squad') continue;
        const ox = m.x - o.x, oz = m.z - o.z;
        const og = Math.hypot(ox, oz);
        if (og < MARINE.radius * 2 && og > 0.01) {
          const push = (MARINE.radius * 2 - og) * 0.5;
          m.x += (ox / og) * push;
          m.z += (oz / og) * push;
        }
      }

      // ---- SHOOT WHAT'S COMING ----------------------------------
      if (!best) continue;

      m.yaw = Math.atan2(best.x - m.x, best.z - m.z);   // face the target

      if (m.cool > 0) continue;
      m.cool = MARINE.fireEvery;
      m.flash = 1;

      tracers.push({
        x1: m.x, y1: MARINE.height * 0.6, z1: m.z,
        x2: best.x, y2: best.k.height * 0.6, z2: best.z,
        life: 0.07
      });

      best.hp -= MARINE.hurt;
      best.hitFlash = 1;
      burst(best.x, best.k.height * 0.6, best.z, best.k.gib, 4, 6);

      // Unlike the settlement guards, a squad kill IS your kill - it
      // counts for scrap, the counter, and the job you're on. You
      // found the tower, you called the pod, you recruited him. He's
      // working for you.
      if (best.hp <= 0 && !best.dead) killEnemy(best);
    }
  }

  // ---- DRAWING A POD ------------------------------------------------
  // A fat metal seed with fins, scorched from the fall. While it's
  // falling it gets fogResist, because a thing on fire in the sky
  // should be visible from anywhere.
  function drawPod(p) {
    const away = Math.hypot(p.x - player.x, p.z - player.z);
    if (p.landed && away > FOG_FAR) return;
    groundY = terrainAt(p.x, p.z);

    if (!p.landed) fogResist = 0.7;

    addBox(p.x, p.y - 1.2, p.z, 4.6, 3.4, 4.6, [58, 54, 52], p.spin);       // base
    addBox(p.x, p.y + 1.0, p.z, 3.6, 2.2, 3.6, [88, 82, 78], p.spin);       // middle
    addBox(p.x, p.y + 2.6, p.z, 2.2, 1.6, 2.2, [122, 70, 46], p.spin);      // nose
    for (let f = 0; f < 4; f++) {                                            // fins
      const fa = p.spin + f * Math.PI / 2;
      addBox(p.x + Math.sin(fa) * 2.6, p.y - 1.4, p.z + Math.cos(fa) * 2.6,
             0.4, 2.6, 1.6, ARMOUR_DARK, fa);
    }

    if (!p.landed) {
      // The flame under a falling pod.
      addBox(p.x, p.y - 3.4, p.z, 3.0, 2.4, 3.0, [255, 170, 60], p.spin);
      addBox(p.x, p.y - 4.6, p.z, 1.8, 1.8, 1.8, [255, 236, 150], p.spin);
      fogResist = 0;
    }
  }

  // ---- DRAWING A MARINE ---------------------------------------------
  // Big shoulders, orange visor, rifle. Built from boxes like everyone
  // else, just MORE of them, because armour is bulk.
  function drawMarine(m) {
    const away = Math.hypot(m.x - player.x, m.z - player.z);
    if (away > FOG_FAR) return;

    // Normally a marine stands on the ground, so the floor under him IS
    // the terrain. But the ones riding a kill rig are stood on a deck
    // nine feet up and moving, so they hand in their own floor. One
    // marine, drawn one way, wherever his boots happen to be - rather
    // than a second copy of all this that would drift out of step the
    // first time the armour changed colour.
    groundY = (m.baseY !== undefined) ? m.baseY : terrainAt(m.x, m.z);

    const co = Math.cos(m.yaw), si = Math.sin(m.yaw);
    const h = MARINE.height;

    function bit(ox, oy, oz, w, hh, d, rgb) {
      addBox(m.x + ox * co + oz * si, oy, m.z - ox * si + oz * co,
             w, hh, d, rgb, m.yaw);
    }

    // Far away: three boxes, same trick as the enemies.
    if (away > 90) {
      bit(0, h * 0.3, 0, 2.4, h * 0.6, 1.8, ARMOUR_DARK);
      bit(0, h * 0.68, 0, 3.2, h * 0.3, 2.0, ARMOUR);
      bit(0, h * 0.9, 0, 1.6, 1.4, 1.6, ARMOUR_DARK);
      return;
    }

    const swing = Math.sin(m.step) * 0.9;

    bit(-0.8, h * 0.21, swing * 0.4, 1.0, h * 0.42, 1.0, ARMOUR_DARK);   // legs
    bit( 0.8, h * 0.21, -swing * 0.4, 1.0, h * 0.42, 1.0, ARMOUR_DARK);
    bit(0, h * 0.58, 0, 3.0, h * 0.34, 2.0, ARMOUR);                     // chest
    bit(-1.9, h * 0.72, 0, 1.3, 1.2, 1.4, ARMOUR);                       // pauldrons
    bit( 1.9, h * 0.72, 0, 1.3, 1.2, 1.4, ARMOUR);
    bit(0, h * 0.62, 1.2, 2.0, h * 0.24, 0.8, ARMOUR_DARK);              // backpack
    bit(0, h * 0.9, 0, 1.5, 1.4, 1.5, ARMOUR_DARK);                      // helmet
    bit(0, h * 0.9, -0.78, 1.1, 0.34, 0.12, VISOR);                      // the visor

    bit(0.9, h * 0.62, -1.3, 0.4, 0.4, 2.8, [40, 42, 46]);               // rifle
    if (m.flash > 0.1) {
      bit(0.9, h * 0.62, -2.9, m.flash, m.flash, m.flash, [255, 232, 150]);
    }

    // A waiting marine gets a little bouncing "!" of light over his
    // head - the wasteland version of a video game quest marker.
    if (m.state === 'wait') {
      const bob = Math.sin(clock * 3) * 0.4;
      fogResist = 0.6;
      addBox(m.x, h + 1.6 + bob, m.z, 0.5, 1.0, 0.5, VISOR);
      addBox(m.x, h + 0.7 + bob, m.z, 0.5, 0.45, 0.5, VISOR);
      fogResist = 0;
    }
  }

  function playPodCall() {
    tone(880, 880, 0.07, 0.14, 'square');
    tone(1180, 1180, 0.07, 0.12, 'square');
    tone(660, 90, 1.6, 0.16, 'sawtooth');
  }

  function playPodSlam() {
    noise(0.6, 400, 40, 0.5);
    tone(80, 24, 0.8, 0.4, 'sawtooth');
  }

  function playRecruit() {
    tone(440, 660, 0.16, 0.18, 'triangle');
    tone(660, 990, 0.2, 0.14, 'triangle');
  }

// -------------------------------------------------------------------
//  MARINE FORTS
// -------------------------------------------------------------------
//  Scrap settlements are welded junk. A marine fort is the opposite:
//  straight steel walls, everything square, orange stripes painted on.
//  The marines built it; they build like they fight - tidily.
//
//  Inside is the armoury. A rifle rack and an armour stand, and if
//  you've got the scrap, what's on them is yours:
//    - MARINE RIFLE:  your gun fires faster AND hits harder
//    - MARINE ARMOUR: everything that hurts you hurts HALF as much
// -------------------------------------------------------------------

  const GEAR_COST = { rifle: 60, armour: 90 };

  // The wall: a square ring of steel panels with a gate gap in the
  // front side. Same shape of answer as bunkerPosts - a list of solid
  // lumps for blockedAt - plus which SIDE each panel is on, so the
  // drawing knows which way to turn it.
  function fortParts(f) {
    const S = f.half;
    const n = Math.round(S * 2 / 4.4);   // panels per side
    const co = Math.cos(f.spin), si = Math.sin(f.spin);
    const out = [];

    for (let side = 0; side < 4; side++) {
      for (let i = 0; i < n; i++) {
        // The gate: the middle of the front wall stays open.
        if (side === 0 && i >= n * 0.33 && i <= n * 0.62) continue;

        const t = -S + ((i + 0.5) / n) * S * 2;
        let lx, lz;
        if      (side === 0) { lx = t;  lz = -S; }
        else if (side === 1) { lx = t;  lz = S;  }
        else if (side === 2) { lx = -S; lz = t;  }
        else                 { lx = S;  lz = t;  }

        out.push({
          x: f.x + lx * co + lz * si,
          z: f.z - lx * si + lz * co,
          r: 2.3, side: side, lx: lx, lz: lz
        });
      }
    }
    return out;
  }

  // Where the two shopping spots stand inside the walls.
  function fortStations(f) {
    const co = Math.cos(f.spin), si = Math.sin(f.spin);
    function w(lx, lz) {
      return { x: f.x + lx * co + lz * si, z: f.z - lx * si + lz * co };
    }
    return { rifle:  w(-f.half * 0.45, f.half * 0.3),
             armour: w( f.half * 0.45, f.half * 0.3) };
  }

  function drawFort(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    const away = Math.hypot(p.x - player.x, p.z - player.z);
    const near = away < 88;

    // The wall panels - uniform height, because soldiers built them.
    // Compare drawBunker, where every panel is a different bit of junk.
    for (const q of p.parts) {
      const flat = (q.side < 2);      // front/back panels lie along x
      addBox(q.x, 3.1, q.z, flat ? 4.6 : 1.2, 6.2, flat ? 1.2 : 4.6,
             ARMOUR_DARK, p.spin);
      // The orange stripe along the top of every panel.
      addBox(q.x, 6.0, q.z, flat ? 4.6 : 0.8, 0.5, flat ? 0.8 : 4.6,
             VISOR, p.spin);
    }

    // Corner pylons, taller than the wall, with a lamp each.
    for (const c of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const lx = c[0] * p.half, lz = c[1] * p.half;
      const wx = p.x + lx * co + lz * si, wz = p.z - lx * si + lz * co;
      addBox(wx, 4.5, wz, 2.6, 9, 2.6, METAL, p.spin);
      addBox(wx, 9.4, wz, 1.2, 0.9, 1.2, [170, 200, 240], p.spin);
    }

    // The beacon mast: a cool blue-white light, nothing like the amber
    // settlements or the red radios. Three kinds of light, three
    // different promises.
    const pulse = 0.55 + Math.sin(clock * 2.6 + p.gx) * 0.45;
    addBox(p.x, 7, p.z, 0.7, 14, 0.7, METAL);
    fogResist = 0.9;
    addBox(p.x, 14.6, p.z, 1.5, 1.5, 1.5,
           [150 + 60 * pulse, 190 + 50 * pulse, 255]);
    fogResist = 0;

    if (!near) return;

    // ---- THE ARMOURY, when you're close enough to shop --------------
    const st = fortStations(p);

    // The rifle rack: a stand with three rifles leaning in it.
    addBox(st.rifle.x, 0.6, st.rifle.z, 3.4, 1.2, 1.2, [40, 36, 34], p.spin);
    for (let i = -1; i <= 1; i++) {
      addBox(st.rifle.x + i * co, 2.0, st.rifle.z - i * si,
             0.35, 2.8, 0.35, [46, 50, 56], p.spin + 0.1 * i);
      addBox(st.rifle.x + i * co, 3.2, st.rifle.z - i * si,
             0.3, 0.3, 0.3, VISOR, p.spin);
    }

    // The armour stand: a headless marine shape on a post, waiting for
    // somebody your size.
    addBox(st.armour.x, 1.1, st.armour.z, 0.5, 2.2, 0.5, [40, 36, 34], p.spin);
    addBox(st.armour.x, 2.6, st.armour.z, 2.6, 1.6, 1.6, ARMOUR, p.spin);
    addBox(st.armour.x - 1.6 * co, 3.2, st.armour.z + 1.6 * si,
           1.0, 0.9, 1.1, ARMOUR, p.spin);
    addBox(st.armour.x + 1.6 * co, 3.2, st.armour.z - 1.6 * si,
           1.0, 0.9, 1.1, ARMOUR, p.spin);
    addBox(st.armour.x, 3.9, st.armour.z, 1.3, 1.1, 1.3, ARMOUR_DARK, p.spin);
    addBox(st.armour.x - 0.66 * si, 3.9, st.armour.z - 0.66 * co,
           0.9, 0.3, 0.1, VISOR, p.spin);
  }

  // ---- BUYING -------------------------------------------------------
  function buyGear() {
    if (!atGear || player.scrap < atGear.cost) return;
    player.scrap -= atGear.cost;

    if (atGear.kind === 'rifle') {
      player.marineRifle = true;
      player.gunDamage += 3;
      questWord = 'MARINE RIFLE  -  faster, harder, meaner';
    } else {
      player.marineArmour = true;
      questWord = 'MARINE ARMOUR  -  everything hurts half as much';
    }
    questFlash = 5;
    atGear = null;
    playGear();
  }

  function playGear() {
    tone(170, 80, 0.28, 0.3, 'square');       // the heavy CLUNK
    tone(520, 880, 0.3, 0.14, 'triangle');    // and the shine on top
  }


// -------------------------------------------------------------------
//  SPACE
// -------------------------------------------------------------------
//  Maximus's biggest idea yet: find a landing pad, board the dropship,
//  and LAUNCH. Up there it's a different game - stars streaming past,
//  aliens weaving in, meteorites tumbling at your windscreen, and twin
//  blasters to deal with both. Fly home when your pockets are full.
//
//  The trick that makes this cheap: the ship never moves. You sit at
//  (0,0,0) forever and the UNIVERSE streams past you - the same trick
//  the wasteland uses for spawning, turned up to eleven. "Flying
//  forward" is just every star sliding backward.
// -------------------------------------------------------------------

  const SHIP_SPEED   = 70;     // how fast the stars stream past
  const BLASTER_COOL = 0.13;
  const BLASTER_HURT = 2;

  let space = null;            // null on the ground. A whole world aloft.

  // ---- THE PLANETS --------------------------------------------------
  // Six wastelands. Each one is the SAME game rules on a different
  // world: its own seed (so the maths builds different everything) and
  // its own weather. Every planet still has settlements, radio towers,
  // forts and pads - so wherever you land, you can always fly on.
  // Each planet names its monsters: who fills the crowd, who shoots,
  // and who's the big one at the front of a horde. spawnEnemy and
  // spawnHorde read these instead of hard-coding zombie/robot/giant.
  const PLANETS = [
    { name: 'THE RUST',    seed: 0,
      skyTop: '#3a2214', skyLow: '#c9955a',
      fog: [178, 136, 88],  ground: [186, 156, 112], orb: [220, 150, 80],
      kinds: { melee: 'zombie', ranged: 'robot', big: 'giant' },
      // FLAT. Maximus tried it with hills, then with cliffs and no
      // slopes, and has now ruled against the lot. The Rust is a
      // pancake again.
      //
      // The terrain code stays exactly where it is - terrainAt starts
      // with "if this planet has no hills, the answer is zero", so
      // switching this one word turns all of it off and costs nothing.
      // Deleting it would only mean writing it again if he changes his
      // mind, and he is allowed to change his mind.
      hills: false },
    { name: 'ASHFALL',     seed: 1,
      skyTop: '#17171d', skyLow: '#8e8e96',
      fog: [138, 138, 146], ground: [118, 118, 126], orb: [170, 170, 180],
      kinds: { melee: 'ashWraith', ranged: 'ashSpitter', big: 'ashGiant' } },
    { name: 'THE ROT',     seed: 2,
      skyTop: '#0f2010', skyLow: '#71994f',
      fog: [112, 148, 92],  ground: [112, 140, 90],  orb: [120, 210, 90],
      kinds: { melee: 'rotCrawler', ranged: 'sporeSpitter', big: 'rotGiant' } },
    { name: 'BLOODMOON',   seed: 3,
      skyTop: '#2a0a0a', skyLow: '#b0503c',
      fog: [162, 92, 70],   ground: [152, 102, 80],  orb: [235, 80, 60],
      kinds: { melee: 'bloodFiend', ranged: 'bloodSpitter', big: 'bloodGiant' } },
    { name: 'FROSTBITE',   seed: 4,
      skyTop: '#16202e', skyLow: '#9fc0d8',
      fog: [172, 196, 214], ground: [182, 200, 214], orb: [150, 210, 250],
      kinds: { melee: 'frostShambler', ranged: 'frostSpitter', big: 'frostGolem' },
      icy: true },   // towers and wrecks stand as giant icicles here
    { name: 'VIOLET DEEP', seed: 5,
      skyTop: '#1d1030', skyLow: '#8a6ab0',
      fog: [142, 112, 168], ground: [132, 112, 150], orb: [190, 120, 255],
      kinds: { melee: 'voidWalker', ranged: 'voidFloater', big: 'voidGiant' },
      shrooms: true }   // towers and wrecks grow as giant mushrooms here
  ];

  let planetIx = 0;

  // ---- ACTUALLY GOING THERE -----------------------------------------
  // Changing planet = changing the seed and the weather, then throwing
  // away everything the old world had built. The prop cache is the big
  // one: it remembers every answer the maths ever gave, and every one
  // of those answers is now about the WRONG PLANET.
  function travelTo(ix) {
    planetIx = ix;
    const pl = PLANETS[ix];
    PLANET_SEED = pl.seed;
    SKY_TOP = pl.skyTop; SKY_LOW = pl.skyLow;
    FOG = pl.fog; GROUND_TAN = pl.ground;
    propCache.clear();

    // The old planet keeps its monsters; you can't bring a horde in
    // your luggage. Your SQUAD, though, rode with you in the ship.
    enemies = []; bolts = []; gibs = []; tracers = []; pods = [];
    marines = marines.filter(function (m) { return m.state === 'squad'; });
    for (let i = 0; i < marines.length; i++) {
      const a = (i / Math.max(1, marines.length)) * Math.PI * 2;
      marines[i].x = player.x + Math.sin(a) * 10;
      marines[i].z = player.z + Math.cos(a) * 10;
    }

    atBoard = null; atRadio = null; nearRecruit = null;
    atGear = null; atPad = null;
    spawnTimer = 2.5;
    hordeTimer = HORDE_FIRST;
    hordeWarn = 0;

    pushOutOfWalls();     // don't materialise inside a building
    seedTheField();
  }

  // ---- THE SHIP ON ITS PAD ------------------------------------------
  function drawPad(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);

    function part(lx, y, lz, w, h, d, rgb) {
      addBox(p.x + lx * co + lz * si, y, p.z - lx * si + lz * co,
             w, h, d, rgb, p.spin);
    }

    // The pad: a wide slab with a skirt, scorched by launches.
    part(0, 0.5, 0, 30, 1.0, 30, [92, 94, 100]);
    part(0, 0.15, 0, 34, 0.3, 34, [66, 68, 74]);

    // Blinking green edge lights, running in a chase pattern.
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const on = Math.sin(clock * 4 - i * 0.8) > 0;
      part(Math.cos(a) * 14, 1.3, Math.sin(a) * 14, 0.9, 0.7, 0.9,
           on ? [110, 255, 140] : [30, 80, 45]);
    }

    // THE DROPSHIP. Nose towards spin, engines aft, wings out wide
    // with a blaster pod on each tip - the same two blasters you'll
    // be firing a minute from now.
    part(0, 4.2, 0, 5.2, 3.6, 13, ARMOUR);                   // body
    part(0, 2.4, 0, 4.2, 1.4, 10, ARMOUR_DARK);              // belly
    part(0, 4.0, -8.2, 3.4, 2.6, 3.6, ARMOUR_DARK);          // nose
    part(0, 4.9, -7.4, 2.6, 1.2, 1.6, [150, 205, 235]);      // cockpit glass
    part(0, 7.6, 5.0, 0.8, 3.6, 3.6, ARMOUR);                // tail fin
    part(0, 5.6, -2.0, 5.3, 0.5, 5.0, VISOR);                // orange stripe
    for (const side of [-1, 1]) {
      part(side * 5.6, 3.7, 1.0, 6.6, 0.7, 4.6, ARMOUR);     // wing
      part(side * 8.4, 3.4, -0.4, 0.9, 0.9, 3.6, [48, 52, 58]); // blaster pod
      part(side * 2.0, 3.1, 6.9, 2.2, 2.2, 2.6, METAL);      // engine
      part(side * 2.0, 3.1, 8.3, 1.4, 1.4, 0.5, VISOR);      // engine glow
      part(side * 3.0, 1.1, -3.6, 0.7, 2.2, 0.7, [40, 42, 46]); // legs
      part(side * 3.0, 1.1, 4.0, 0.7, 2.2, 0.7, [40, 42, 46]);
    }

    // The beacon: a fat, BRIGHT green lamp on the tail, and a beam of
    // green light standing straight up out of it. Even when a tower or
    // a dune hides the whole pad, the beam gives it away - which is
    // exactly what a beacon is for.
    const pulse = 0.55 + Math.sin(clock * 3.4 + p.gx) * 0.45;
    fogResist = 0.95;
    part(0, 9.9, 5.0, 2.0, 2.0, 2.0, [120 + 100 * pulse, 255, 150 + 60 * pulse]);
    fogResist = 0.45;
    part(0, 25, 5.0, 0.9, 28, 0.9, [90, 230, 115]);
    fogResist = 0;
  }

  // ---- LIFT-OFF -----------------------------------------------------
  function launchShip() {
    state = 'space';
    space = {
      t: 0, hull: 100, kills: 0, earned: 0,
      cool: 0, spawnT: 0, side: 1, flash: 0,
      stars: [], rocks: [], foes: [], foeBolts: [], shots: [], sparks: [],
      planets: [], menu: true, course: null
    };
    for (let i = 0; i < 130; i++) space.stars.push(randomStar(true));

    // The OTHER planets take up stations around your bit of sky - none
    // dead ahead, so you always have to turn and hunt for the one you
    // want. Each is a fixed direction; aim there and fly and the
    // distance counts down.
    let station = 0;
    const others = [];
    for (let i = 0; i < PLANETS.length; i++) if (i !== planetIx) others.push(i);
    for (const ix of others) {
      const a = player.yaw + ((station + 0.5) / others.length) * Math.PI * 2;
      const b = (hash(ix * 77) - 0.5) * 0.5;      // a little above or below
      space.planets.push({
        ix: ix,
        dx: Math.sin(a) * Math.cos(b), dy: Math.sin(b), dz: Math.cos(a) * Math.cos(b),
        dist: 400
      });
      station++;
    }

    shake = 1.4;
    playLaunch();
  }

  function randomStar(anywhere) {
    // A random direction, a random distance. "anywhere" fills the sky
    // at launch; afterwards new stars appear far off so you never see
    // one pop in.
    const a = Math.random() * Math.PI * 2;
    const b = (Math.random() - 0.5) * Math.PI;
    const d = anywhere ? 70 + Math.random() * 320 : 300 + Math.random() * 90;
    return { x: Math.sin(a) * Math.cos(b) * d,
             y: Math.sin(b) * d,
             z: Math.cos(a) * Math.cos(b) * d };
  }

  // Picking a row on the planet menu. Your own planet means "stay in
  // orbit and fly free"; anywhere else lays in a course and the
  // autopilot takes it from there - no aiming needed.
  function chooseCourse(ix) {
    if (!space) return;
    space.menu = false;
    space.course = null;
    if (ix === planetIx || ix < 0 || ix >= PLANETS.length) return;
    for (const pl of space.planets) {
      if (pl.ix === ix) space.course = pl;
    }
    tone(520, 780, 0.18, 0.16, 'triangle');
    tone(780, 1100, 0.2, 0.1, 'triangle');
  }

  function landShip(crashed) {
    const earned = space.earned;
    state = 'play';
    space = null;
    questWord = crashed
      ? 'SHIP DOWN!  -  you crawled out with ' + earned + ' scrap'
      : 'BACK ON THE DIRT  -  ' + earned + ' scrap from orbit';
    questFlash = 6;
    if (!crashed) playLand();
  }

  // ---- ONE FRAME IN ORBIT -------------------------------------------
  function updateSpace(dt) {
    const s = space;
    s.t += dt;
    s.cool -= dt;
    s.flash = Math.max(0, s.flash - dt * 3);

    // Which way is the ship pointing? Wherever you're steering it.
    const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
    const fx = Math.sin(player.yaw) * cp, fy = sp, fz = Math.cos(player.yaw) * cp;
    const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);  // your right

    // During the first two seconds you're still climbing - the world
    // rumbles, the stars accelerate, nothing attacks yet.
    const climbing = s.t < 2.2;
    if (climbing) shake = Math.max(shake, 0.5 * (1 - s.t / 2.2));
    const step = SHIP_SPEED * dt * (climbing ? s.t / 2.2 : 1);

    // ---- STARS STREAM PAST ----------------------------------------
    for (let i = 0; i < s.stars.length; i++) {
      const st = s.stars[i];
      st.x -= fx * step; st.y -= fy * step; st.z -= fz * step;
      if (st.x * fx + st.y * fy + st.z * fz < -40 ||
          Math.hypot(st.x, st.y, st.z) > 420) {
        s.stars[i] = randomStar(false);
      }
    }

    // While you're reading the menu, space politely holds its fire -
    // stars keep streaming, but nothing spawns, nothing shoots.
    if (s.menu) return;

    // ---- THINGS TURN UP -------------------------------------------
    if (!climbing) {
      s.spawnT -= dt;
      if (s.spawnT <= 0) {
        s.spawnT = 1.1 + Math.random() * 1.2;
        const offA = (Math.random() - 0.5) * 130;
        const offB = (Math.random() - 0.5) * 110;
        if (Math.random() < 0.55 && s.rocks.length < 10) {
          // A meteorite, way out ahead, tumbling in.
          const d = 240 + Math.random() * 90;
          const size = 2.5 + Math.random() * 4;
          s.rocks.push({
            x: fx * d + rx * offA, y: fy * d + offB, z: fz * d + rz * offA,
            size: size, hp: Math.ceil(size * 1.5),
            spin: Math.random() * 6, twirl: (Math.random() - 0.5) * 3
          });
        } else if (s.foes.length < 6) {
          // An alien, closer, that WEAVES.
          const d = 130 + Math.random() * 60;
          s.foes.push({
            x: fx * d + rx * offA * 0.6, y: fy * d + offB * 0.6,
            z: fz * d + rz * offA * 0.6,
            hp: 4, phase: Math.random() * 6, cool: 2 + Math.random() * 2
          });
        }
      }
    }

    // ---- METEORITES: swept past by your speed, drifting at you ----
    for (const r of s.rocks) {
      r.spin += r.twirl * dt;
      const d = Math.hypot(r.x, r.y, r.z) || 1;
      r.x -= (fx * step) + (r.x / d) * 14 * dt;
      r.y -= (fy * step) + (r.y / d) * 14 * dt;
      r.z -= (fz * step) + (r.z / d) * 14 * dt;

      if (d < r.size + 3.5) {
        // THUD. A meteorite in the windscreen.
        s.hull -= 15; s.flash = 1;
        shake = Math.max(shake, 1.1);
        boomAt(r, [[150, 138, 120], [110, 100, 88], [255, 170, 60]], 18);
        r.hp = 0; r.gone = true;
        playSpaceBoom();
      } else if (r.x * fx + r.y * fy + r.z * fz < -30) {
        r.gone = true;      // sailed past, no harm done
      }
    }
    s.rocks = s.rocks.filter(function (r) { return !r.gone && r.hp > 0; });

    // ---- ALIENS: they match your speed and WEAVE ------------------
    for (const f of s.foes) {
      // Each one chases its own wobbling spot in front of the ship,
      // so the flock swirls instead of queueing up.
      const wob = Math.sin(s.t * 1.3 + f.phase) * 42;
      const bob = Math.cos(s.t * 0.9 + f.phase * 2) * 26;
      const tx = fx * 55 + rx * wob, ty = fy * 55 + bob, tz = fz * 55 + rz * wob;
      f.x += (tx - f.x) * 0.9 * dt;
      f.y += (ty - f.y) * 0.9 * dt;
      f.z += (tz - f.z) * 0.9 * dt;

      f.cool -= dt;
      if (f.cool <= 0 && s.t > 5) {
        f.cool = 2.2 + Math.random() * 1.6;
        const d = Math.hypot(f.x, f.y, f.z) || 1;
        s.foeBolts.push({
          x: f.x, y: f.y, z: f.z,
          vx: -f.x / d * 95, vy: -f.y / d * 95, vz: -f.z / d * 95,
          life: 3
        });
        playZap();
      }
    }

    // ---- THEIR SHOTS AT YOU ---------------------------------------
    for (const b of s.foeBolts) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      b.life -= dt;
      if (Math.hypot(b.x, b.y, b.z) < 3.5) {
        b.life = 0;
        s.hull -= 7; s.flash = 1;
        shake = Math.max(shake, 0.5);
        playOw();
      }
    }
    s.foeBolts = s.foeBolts.filter(function (b) { return b.life > 0; });

    // ---- YOUR BLASTERS --------------------------------------------
    if ((firing || touchFire) && s.cool <= 0 && !climbing) {
      s.cool = BLASTER_COOL;
      s.side = -s.side;      // left barrel, right barrel, left barrel...
      s.shots.push({
        x: rx * 2.2 * s.side, y: -1.4, z: rz * 2.2 * s.side,
        vx: fx * 260, vy: fy * 260, vz: fz * 260,
        life: 1.5
      });
      playBlaster();
    }

    for (const sh of s.shots) {
      sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.z += sh.vz * dt;
      sh.life -= dt;
      if (sh.life <= 0) continue;

      for (const r of s.rocks) {
        if (Math.hypot(sh.x - r.x, sh.y - r.y, sh.z - r.z) < r.size + 1.8) {
          sh.life = 0;
          r.hp -= BLASTER_HURT;
          boomAt(sh, [[150, 138, 120], [200, 190, 170]], 5);
          if (r.hp <= 0) {
            const bounty = Math.max(2, Math.round(r.size));
            s.kills++; s.earned += bounty; player.scrap += bounty;
            boomAt(r, [[150, 138, 120], [110, 100, 88], [255, 200, 90]], 22);
            playSpaceBoom();
          }
          break;
        }
      }
      if (sh.life <= 0) continue;

      for (const f of s.foes) {
        if (Math.hypot(sh.x - f.x, sh.y - f.y, sh.z - f.z) < 4.2) {
          sh.life = 0;
          f.hp -= BLASTER_HURT;
          boomAt(sh, [[140, 255, 120], [255, 120, 220]], 5);
          if (f.hp <= 0) {
            f.gone = true;
            s.kills++; s.earned += 5; player.scrap += 5;
            boomAt(f, [[110, 220, 90], [70, 160, 200], [255, 120, 220]], 24);
            playSpaceBoom();
          }
          break;
        }
      }
    }
    s.shots = s.shots.filter(function (sh) { return sh.life > 0; });
    s.foes = s.foes.filter(function (f) { return !f.gone; });

    // ---- SPARKS AND WRECKAGE --------------------------------------
    for (const sp2 of s.sparks) {
      sp2.x += sp2.vx * dt; sp2.y += sp2.vy * dt; sp2.z += sp2.vz * dt;
      sp2.life -= dt;
    }
    s.sparks = s.sparks.filter(function (sp2) { return sp2.life > 0; });

    // ---- SETTING COURSE FOR ANOTHER WORLD -------------------------
    // Point the nose at a planet and you're flying there: its distance
    // winds down. Look away and you drift off course - the distance
    // creeps back up. Reach zero and you're THERE.
    for (const pl of s.planets) {
      const aimed = fx * pl.dx + fy * pl.dy + fz * pl.dz > 0.965;
      // The autopilot flies whatever the menu chose, aimed or not.
      // Aiming by hand still works for pilots who like doing it.
      if ((aimed || pl === s.course) && !climbing) {
        pl.dist -= SHIP_SPEED * 1.3 * dt;
        if (pl.dist <= 0) {
          travelTo(pl.ix);
          const earned = s.earned;
          state = 'play';
          space = null;
          questWord = 'WELCOME TO ' + PLANETS[planetIx].name +
                      (earned ? '  -  +' + earned + ' scrap from the flight' : '');
          questFlash = 7;
          playLand();
          return;
        }
      } else {
        pl.dist = Math.min(400, pl.dist + 30 * dt);
      }
    }

    // ---- OUT OF HULL? ---------------------------------------------
    if (s.hull <= 0) {
      playCrash();
      landShip(true);
    }
  }

  // An explosion where something was. No gravity up here - the bits
  // just fly apart forever, which is what real space wreckage does.
  function boomAt(at, colours, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const b = (Math.random() - 0.5) * Math.PI;
      const v = 8 + Math.random() * 26;
      space.sparks.push({
        x: at.x, y: at.y, z: at.z,
        vx: Math.sin(a) * Math.cos(b) * v,
        vy: Math.sin(b) * v,
        vz: Math.cos(a) * Math.cos(b) * v,
        size: 0.4 + Math.random() * 1.3,
        life: 0.5 + Math.random() * 0.9,
        colour: colours[Math.floor(Math.random() * colours.length)]
      });
    }
  }

  // ---- DRAWING ORBIT ------------------------------------------------
  function drawSpace() {
    const s = space;

    // Deep space, very slightly blue at the bottom so "down" exists.
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#030308');
    g.addColorStop(1, '#0a0a1e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // You ARE the ship: the camera sits at zero and turns with you.
    cam.x = 0; cam.y = 0; cam.z = 0;
    cam.yaw = player.yaw; cam.pitch = player.pitch;
    if (shake > 0) {
      cam.x += (Math.random() - 0.5) * shake * 0.5;
      cam.y += (Math.random() - 0.5) * shake * 0.5;
    }

    faces = [];
    groundY = 0;               // no hills in orbit
    // No fog in space. seeFar lets faces past the fog line live, and
    // fogResist 1 stops them being tinted wasteland-tan.
    seeFar = true; fogResist = 1;

    for (const st of s.stars) {
      const d = Math.hypot(st.x, st.y, st.z);
      const glow = clamp(1.5 - d / 320, 0.25, 1.2);
      addBox(st.x, st.y, st.z, 1.2, 1.2, 1.2, shade([210, 215, 255], glow));
    }

    // ---- THE OTHER WORLDS -----------------------------------------
    // Each planet hangs in its fixed direction, painted its own
    // colour, and GROWS as you close the distance - so flying at one
    // feels like arriving, not like waiting.
    for (const pl of s.planets) {
      const px = pl.dx * 300, py = pl.dy * 300, pz = pl.dz * 300;
      const size = clamp(64 - pl.dist * 0.145, 8, 60);
      const colour = PLANETS[pl.ix].orb;
      addBox(px, py, pz, size * 1.5, size * 1.5, 2, shade(colour, 0.30));
      addBox(px, py, pz, size, size, size, colour);
    }

    for (const r of s.rocks) {
      // Two crossed boxes tumbling = one convincing lumpy meteorite.
      addBox(r.x, r.y, r.z, r.size * 2, r.size * 1.5, r.size * 1.7,
             [128, 116, 102], r.spin);
      addBox(r.x, r.y, r.z, r.size * 1.5, r.size * 1.9, r.size * 1.4,
             [100, 92, 82], r.spin + 0.8);
    }

    for (const f of s.foes) {
      const yaw = Math.atan2(-f.x, -f.z);          // always facing you
      const flap = Math.sin(clock * 9 + f.phase) * 1.4;
      addBox(f.x, f.y, f.z, 3.2, 2.4, 3.6, [110, 220, 90], yaw);       // body
      addBox(f.x, f.y + 1.6, f.z, 1.6, 1.2, 1.6, [88, 190, 74], yaw);  // head
      const wco = Math.cos(yaw), wsi = Math.sin(yaw);
      addBox(f.x - 2.6 * wco, f.y + flap, f.z + 2.6 * wsi,
             2.2, 0.5, 2.8, [70, 160, 200], yaw);                       // wings
      addBox(f.x + 2.6 * wco, f.y - flap, f.z - 2.6 * wsi,
             2.2, 0.5, 2.8, [70, 160, 200], yaw);
      addBox(f.x - 1.1 * wsi, f.y + 1.7, f.z - 1.1 * wco,
             0.9, 0.5, 0.2, [255, 120, 220], yaw);                      // the eye
    }

    for (const b of s.foeBolts) {
      addBox(b.x, b.y, b.z, 1.1, 1.1, 1.1, [180, 255, 150]);
      addBox(b.x, b.y, b.z, 1.8, 0.5, 1.8, [90, 230, 110]);
    }

    for (const sh of s.shots) {
      // A long thin streak lying along its own path.
      addBox(sh.x, sh.y, sh.z, 0.5, 0.5, 6,
             [140, 255, 160], Math.atan2(sh.vx, sh.vz));
    }

    for (const sp2 of s.sparks) {
      addBox(sp2.x, sp2.y, sp2.z, sp2.size, sp2.size, sp2.size, sp2.colour);
    }

    seeFar = false; fogResist = 0;

    // Furthest painted first - same painter, different planet.
    faces.sort(function (a, b) { return b.depth - a.depth; });
    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) {
        ctx.lineTo(f.points[i].x, f.points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }

    // Name tags float over the planets - flat 2D text asked where to
    // stand by the same project() that placed the 3D orb.
    const cp2 = Math.cos(player.pitch), sp2 = Math.sin(player.pitch);
    const fwd = { x: Math.sin(player.yaw) * cp2, y: sp2,
                  z: Math.cos(player.yaw) * cp2 };
    for (const pl of s.planets) {
      const pr = project(pl.dx * 300, pl.dy * 300, pl.dz * 300);
      if (pr.depth < 2) continue;
      const aimed = fwd.x * pl.dx + fwd.y * pl.dy + fwd.z * pl.dz > 0.965 ||
                    pl === s.course;
      const size = clamp(64 - pl.dist * 0.145, 8, 60);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + (aimed ? 16 : 12) + 'px system-ui, sans-serif';
      ctx.fillStyle = aimed ? '#ffffff' : 'rgba(255,255,255,0.55)';
      ctx.fillText(PLANETS[pl.ix].name, pr.x, pr.y - size * 1.2 - 8);
      if (aimed) {
        ctx.font = 'bold 13px system-ui, sans-serif';
        ctx.fillStyle = '#8fffa0';
        ctx.fillText('ON COURSE  -  ' + Math.ceil(pl.dist), pr.x,
                     pr.y - size * 1.2 + 8);
      }
    }

    drawCockpit(s);
  }

  // The inside of your ship: dark corner panels, a couple of struts,
  // and the instruments. All flat 2D drawn OVER the 3D - the same way
  // the gun and the minimap work down on the surface.
  function drawCockpit(s) {
    ctx.fillStyle = 'rgba(14,16,22,0.92)';

    ctx.beginPath();                       // left panel
    ctx.moveTo(0, 0); ctx.lineTo(W * 0.10, 0);
    ctx.lineTo(W * 0.04, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();                       // right panel
    ctx.moveTo(W, 0); ctx.lineTo(W * 0.90, 0);
    ctx.lineTo(W * 0.96, H); ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();

    ctx.beginPath();                       // the console under the glass
    ctx.moveTo(0, H); ctx.lineTo(W, H);
    ctx.lineTo(W * 0.86, H * 0.86); ctx.lineTo(W * 0.14, H * 0.86);
    ctx.closePath(); ctx.fill();

    // Getting hit flashes the glass red.
    if (s.flash > 0) {
      ctx.fillStyle = 'rgba(255,60,40,' + (s.flash * 0.25) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // Crosshair.
    const mx = W / 2, my = H / 2;
    ctx.strokeStyle = '#8fffa0';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(mx - 16, my); ctx.lineTo(mx - 6, my);
    ctx.moveTo(mx + 6, my);  ctx.lineTo(mx + 16, my);
    ctx.moveTo(mx, my - 16); ctx.lineTo(mx, my - 6);
    ctx.moveTo(mx, my + 6);  ctx.lineTo(mx, my + 16);
    ctx.stroke();

    // Hull bar, bottom left, on the console.
    const bw = Math.min(W * 0.24, 220), bx = W * 0.16, by = H * 0.925;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(bx, by, bw, 13);
    const frac = Math.max(0, s.hull / 100);
    ctx.fillStyle = frac > 0.5 ? '#6ee87a' : frac > 0.25 ? '#e0a83c' : '#e04a3c';
    ctx.fillRect(bx, by, bw * frac, 13);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 13);
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillStyle = '#cfe8d2';
    ctx.fillText('HULL', bx, by - 5);

    // Score, bottom right.
    ctx.textAlign = 'right';
    ctx.fillStyle = '#cfe8d2';
    ctx.fillText(s.kills + ' destroyed   +' + s.earned + ' scrap',
                 W * 0.84, by + 10);

    // The way home.
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(160,220,170,0.85)';
    ctx.fillText(touchMode ? 'TAP HERE TO FLY HOME' : 'PRESS E TO FLY HOME',
                 W / 2, H * 0.64);
    ctx.font = Math.min(W * 0.024, 14) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(160,220,170,0.6)';
    ctx.fillText(touchMode ? 'tap the top of the screen for the planet menu'
                           : 'P: planet menu  -  or aim at a planet yourself',
                 W / 2, H * 0.675);

    // The course readout, when the autopilot has one laid in.
    if (s.course) {
      ctx.font = 'bold ' + Math.min(W * 0.028, 17) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#8fffa0';
      ctx.fillText('COURSE: ' + PLANETS[s.course.ix].name + '  -  ' +
                   Math.ceil(s.course.dist), W / 2, H * 0.12);
    }

    if (s.t < 2.2) {
      ctx.font = 'bold ' + Math.min(W * 0.08, 54) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,220,150,' + (1 - s.t / 2.2) + ')';
      ctx.fillText('LAUNCH!', W / 2, H * 0.32);
    }

    // ---- THE PLANET MENU ------------------------------------------
    if (s.menu) drawPlanetMenu(s);
  }

  // One row per world, your own marked. The same shape of screen as
  // the jobs board: numbers on a keyboard, taps on a phone.
  function planetRowBox(i) {
    const w = Math.min(W * 0.64, 500), rh = Math.min(H * 0.094, 58);
    return { x: W / 2 - w / 2, y: H * 0.17 + i * (rh + 6), w: w, h: rh };
  }

  function drawPlanetMenu(s) {
    ctx.fillStyle = 'rgba(6,8,14,0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.05, 30) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#d8ffe0';
    ctx.fillText('CHOOSE A PLANET', W / 2, H * 0.12);

    for (let i = 0; i < PLANETS.length; i++) {
      const b = planetRowBox(i);
      const here = (i === planetIx);

      ctx.fillStyle = here ? 'rgba(110,232,122,0.12)' : 'rgba(20,26,38,0.85)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = here ? '#6ee87a' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = here ? 2 : 1;
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      // The planet's own colour, as a little moon on the row.
      const oc = PLANETS[i].orb;
      ctx.beginPath();
      ctx.arc(b.x + b.h * 0.55, b.y + b.h * 0.5, b.h * 0.26, 0, Math.PI * 2);
      ctx.fillStyle = 'rgb(' + oc[0] + ',' + oc[1] + ',' + oc[2] + ')';
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.03, 19) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#f0f4ff';
      ctx.fillText((i + 1) + '.  ' + PLANETS[i].name,
                   b.x + b.h * 1.1, b.y + b.h * 0.62);

      ctx.textAlign = 'right';
      ctx.font = Math.min(W * 0.024, 14) + 'px system-ui, sans-serif';
      ctx.fillStyle = here ? '#8fffa0' : 'rgba(255,255,255,0.55)';
      ctx.fillText(here ? 'YOU ARE HERE  -  stay and fly' : 'set course',
                   b.x + b.w - 14, b.y + b.h * 0.62);
    }

    ctx.textAlign = 'center';
    ctx.font = Math.min(W * 0.026, 16) + 'px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(216,255,224,0.75)';
    ctx.fillText(touchMode ? 'tap a planet' : 'press 1 to 6',
                 W / 2, H * 0.17 + PLANETS.length * (planetRowBox(0).h + 6) + 24);
  }

  function playJump() {
    tone(220, 420, 0.12, 0.1, 'triangle');
  }

  function playLaunch() {
    noise(2.0, 160, 900, 0.5);
    tone(50, 260, 2.2, 0.4, 'sawtooth');
    tone(90, 380, 2.0, 0.2, 'square');
  }

  function playBlaster() {
    tone(880, 180, 0.09, 0.11, 'square');
  }

  function playSpaceBoom() {
    noise(0.3, 800, 90, 0.32);
    tone(140, 40, 0.35, 0.2, 'sawtooth');
  }

  function playLand() {
    tone(320, 90, 0.7, 0.25, 'triangle');
    noise(0.8, 500, 120, 0.2);
  }

  function playCrash() {

    tone(130, 28, 1.1, 0.4, 'sawtooth');
  }


// -------------------------------------------------------------------
//  SOUND
// -------------------------------------------------------------------

  let audio = null;

  function startAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audio = new AC();
  }

  function tone(freq, freq2, dur, vol, type) {
    if (!audio) return;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, freq2),
                                             audio.currentTime + dur);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur + 0.02);
  }

  function noise(dur, from, to, vol) {
