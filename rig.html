    if (!audio) return;
    const buf = audio.createBuffer(1, Math.floor(audio.sampleRate * dur),
                                   audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    const src = audio.createBufferSource();
    src.buffer = buf;
    const f = audio.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(from, audio.currentTime);
    f.frequency.exponentialRampToValueAtTime(Math.max(60, to),
                                             audio.currentTime + dur);
    const g = audio.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(audio.destination);
    src.start();
  }

  function playShot() { tone(320, 60, 0.12, 0.22, 'square'); noise(0.16, 4000, 500, 0.3); }
  function playHit()  { tone(500, 220, 0.08, 0.12, 'triangle'); }
  function playKill() { tone(180, 40, 0.5, 0.28, 'sawtooth'); noise(0.5, 1800, 120, 0.28); }
  function playZap()  { tone(900, 300, 0.18, 0.12, 'sine'); }
  function playOw()   { tone(220, 90, 0.3, 0.24, 'sawtooth'); noise(0.3, 1200, 200, 0.22); }

  // ---- TRUCK NOISES -------------------------------------------------
  function thud()   { tone(90, 34, 0.16, 0.22, 'square'); noise(0.16, 700, 90, 0.2); }
  function crunch() { tone(140, 40, 0.45, 0.3, 'sawtooth'); noise(0.5, 2400, 140, 0.34); }
  function payDay() { tone(520, 780, 0.16, 0.2, 'sine');
                      setTimeout(function () { tone(780, 1180, 0.3, 0.2, 'sine'); }, 130); }

  // THE ENGINE. One low note that never stops, whose pitch simply IS
  // your speed. No samples, no timers - it rises because you did.
  let engine = null, engineGain = null;

  function startEngine() {
    if (!audio || engine) return;
    engine = audio.createOscillator();
    engineGain = audio.createGain();
    const wob = audio.createOscillator(), wobGain = audio.createGain();

    engine.type = 'sawtooth';
    engine.frequency.value = 40;
    wob.type = 'sine'; wob.frequency.value = 7; wobGain.gain.value = 6;
    wob.connect(wobGain); wobGain.connect(engine.frequency);

    engineGain.gain.value = 0;
    engine.connect(engineGain); engineGain.connect(audio.destination);
    engine.start(); wob.start();
  }

  function updateEngineNote() {
    if (!audio) return;
    startEngine();
    if (!engine) return;
    const t = Math.abs(rig.speed) / TOP_SPEED;
    engine.frequency.setTargetAtTime(34 + t * 78, audio.currentTime, 0.12);
    // Silent the moment you step out, so a parked truck isn't idling
    // in your ear from half a mile away.
    engineGain.gain.setTargetAtTime(driving ? 0.04 + t * 0.09 : 0,
                                    audio.currentTime, 0.15);
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const keys = {};
  let locked = false;
  let firing = false;
  let jumpQueued = false;   // space was pressed; jump on the next update

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();

    // ---- THE BOARD --------------------------------------------------
    if (state === 'board') {
      if (k === 'e' || k === 'escape') { state = 'play'; }
      else if (k >= '1' && k <= '3')   { takeQuest(Number(k) - 1); }
      else if (k === '4')              { buyGuards(); }
      else if (k === '5')              { hireGuard(); }
      else if (k === '6')              { if (atBoard) loadCargo(atBoard); }
      e.preventDefault();
      return;                        // reading, not shooting
    }

    if (k === 'e' && atBoard && state === 'play') {
      state = 'board';
      e.preventDefault();
      return;
    }

    // In orbit: numbers work the planet menu, P reopens it, E is the
    // way home.
    if (state === 'space') {
      if (space && space.menu && k >= '1' && k <= '6') {
        chooseCourse(Number(k) - 1);
        e.preventDefault();
        return;
      }
      if (k === 'p') {
        space.menu = !space.menu;
        e.preventDefault();
        return;
      }
      if (k === 'e') {
        landShip(false);
        e.preventDefault();
        return;
      }
    }

    // E does whatever you're stood next to: a tower calls a pod, a
    // waiting marine joins the squad. The board got first dibs above.
    if (k === 'e' && state === 'play') {
      // The seat comes first. If you're sat in it, E gets you out -
      // otherwise you could never leave without something else nearby.
      if (driving)                                exitRig();
      else if (flying)                            exitJet();
      else if (atRig)                             enterRig();
      else if (atJet)                             enterJet();
      else if (nearRecruit)                       recruitMarine(nearRecruit);
      else if (atGear)                            buyGear();
      else if (atPad)                             launchShip();
      else if (atRadio && clock >= atRadio.podReadyAt &&
               squadSize() < MARINE_MAX)          summonPod(atRadio);
    }

    // R at a radio tower calls a kill rig in. Its own key, because E
    // is already the pod and a tower that did two different things
    // depending on the weather would be maddening.
    if (k === 'r' && state === 'play' && atRadio && canCallKillRig(atRadio)) {
      callKillRig(atRadio);
      e.preventDefault();
      return;
    }

    keys[k] = true;
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    if (k === ' ' && state === 'play') jumpQueued = true;
    if (k === 'r' && state === 'dead') restart();

    // SECRET TEST KEY (just while we build the marines): press M and a
    // pod drops 30 paces dead ahead, no tower needed. Handy for testing,
    // and Maximus can delete it when it feels like cheating.
    if (k === 'm' && state === 'play') {
      pods.push({ x: player.x + Math.sin(player.yaw) * 30,
                  z: player.z + Math.cos(player.yaw) * 30,
                  y: POD_START_Y, landed: false,
                  spin: Math.random() * Math.PI * 2 });
    }
  });

  function takeQuest(i) {
    if (!atBoard || !atBoard.quests) return;
    const q = atBoard.quests[i];
    if (!q || q.done) return;

    // Fresh start on the count - taking a job means doing it from here,
    // not cashing in kills you already had.
    q.count = 0;
    quest = q;
    state = 'play';

    tone(440, 660, 0.2, 0.16, 'triangle');
  }

  function hireGuard() {
    if (!atBoard) return;

    const manned = onDuty(atBoard);
    if (manned >= atBoard.guards.length) return;    // every post is taken

    const cost = hireCost(atBoard);
    if (player.scrap < cost) return;

    player.scrap -= cost;
    atBoard.manned = manned + 1;

    questWord = 'ANOTHER RIFLE ON THE WALL  -  ' + atBoard.manned + ' guards';
    questFlash = 5;

    tone(380, 540, 0.25, 0.18, 'square');
  }

  function buyGuards() {
    if (!atBoard) return;

    const lvl = atBoard.guardLevel || 0;
    if (lvl >= GUARD_MAX_LEVEL) return;

    const cost = guardCost(lvl);
    if (player.scrap < cost) return;      // can't afford it, nothing happens

    player.scrap -= cost;
    atBoard.guardLevel = lvl + 1;

    questWord = 'THE GUARDS ARE BETTER ARMED  -  level ' + atBoard.guardLevel;
    questFlash = 5;

    tone(300, 620, 0.35, 0.2, 'square');
    tone(600, 1000, 0.3, 0.12, 'triangle');
  }
  window.addEventListener('keyup', function (e) {
    keys[e.key.toLowerCase()] = false;
  });

  function held(a, b) { return keys[a] || keys[b]; }

  canvas.addEventListener('mousedown', function () {
    if (touchMode) return;      // a thumb already dealt with this
    startAudio();
    if (!locked) {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
      return;
    }
    if (state === 'dead') { restart(); return; }
    firing = true;
    shoot();
  });

  window.addEventListener('mouseup', function () { firing = false; });

  document.addEventListener('pointerlockchange', function () {
    locked = (document.pointerLockElement === canvas);
    if (!locked) firing = false;
  });

  const LOOK = 0.0022;

  window.addEventListener('mousemove', function (e) {
    if (!locked) return;

    // IN THE CAB THE MOUSE IS THE STEERING WHEEL. Exactly the racer's
    // line, exactly the racer's sensitivity. It used to turn your head
    // instead, which is a different game - this one you drive.
    if (driving) {
      mouseSteer = clamp(mouseSteer + e.movementX * MOUSE_SENS, -1, 1);
      return;
    }

    player.yaw += e.movementX * LOOK;
    player.pitch = clamp(player.pitch - e.movementY * LOOK, -0.9, 0.9);
  });


// -------------------------------------------------------------------
//  PHONES AND TABLETS
// -------------------------------------------------------------------
//  A first-person shooter needs three things happening AT ONCE - look,
//  move, and shoot - and you have two thumbs. So:
//
//    LEFT THUMB, anywhere on the left half: a stick that appears where
//    you put your thumb down. Drag away from that spot to walk. Push it
//    right out to run.
//
//    RIGHT THUMB, anywhere on the right: drag to look, exactly like the
//    mouse. Same numbers, same feel.
//
//    FIRE: the big circle, bottom right.
//
//  Unlike the racer, this can't rebuild everything from all the fingers
//  each event - a stick has to remember WHERE IT STARTED, and "look"
//  needs to know where that finger was last frame. So every touch gets
//  filed under its own identifier and keeps its own notes.
// -------------------------------------------------------------------

  const TOUCH_LOOK = 0.0042;    // thumbs are coarser than mice
  const STICK_MAX  = 55;        // pixels from the origin for full speed
  const STICK_RUN  = 0.75;      // push past this much and you run

  let touchMode = false;
  const roles = {};             // touch identifier -> what that finger is doing

  const stick = { on: false, ox: 0, oy: 0, dx: 0, dy: 0, push: 0 };
  let touchFire = false;

  function fireButton() {
    const r = Math.min(W, H) * 0.115;
    return { x: W - r * 1.35, y: H - r * 1.35, r: r };
  }

  // JUMP, sat just above FIRE so the same thumb reaches both.
  //
  // Space bar has been able to jump for a while and there was no way to
  // do it on a phone at all - the whole action simply didn't exist for
  // anyone playing on glass. Smaller than FIRE, because you press it far
  // less often and it must never be hit by mistake mid-fight.
  function jumpButton() {
    const r = Math.min(W, H) * 0.115;
    return { x: W - r * 1.35, y: H - r * 3.35, r: r * 0.72 };
  }

  function touchPoint(t) {
    const box = canvas.getBoundingClientRect();
    return { x: t.clientX - box.left, y: t.clientY - box.top };
  }

  function inCircle(px, py, b) {
    return Math.hypot(px - b.x, py - b.y) < b.r;
  }

  function onTouchStart(e) {
    if (!touchMode) {
      touchMode = true;
      const h = document.getElementById('hud');
      if (h) h.style.display = 'none';    // that hint is wrong now
    }
    startAudio();

    for (const t of e.changedTouches) {
      const p = touchPoint(t);

      if (state === 'dead') { restart(); break; }

      // ---- IN ORBIT ---------------------------------------------------
      // Fire button fires, right side steers, and the middle of the
      // screen is the way home. The left-half walk stick means nothing
      // up here - the ship flies itself forward.
      if (state === 'space') {
        // Menu open: taps pick planets, and nothing else.
        if (space && space.menu) {
          for (let i = 0; i < PLANETS.length; i++) {
            const b = planetRowBox(i);
            if (p.y >= b.y && p.y <= b.y + b.h &&
                p.x >= b.x && p.x <= b.x + b.w) {
              chooseCourse(i);
              break;
            }
          }
          continue;
        }

        if (p.y < H * 0.18 && Math.abs(p.x - W / 2) < W * 0.3) {
          space.menu = true;              // top of the screen = the chart
        } else if (p.y > H * 0.55 && p.y < H * 0.72 &&
            Math.abs(p.x - W / 2) < W * 0.25) {
          landShip(false);
        } else if (inCircle(p.x, p.y, fireButton())) {
          roles[t.identifier] = { role: 'fire' };
          touchFire = true;
        } else {
          roles[t.identifier] = { role: 'look', lx: p.x, ly: p.y };
        }
        continue;
      }

      // ---- READING THE BOARD -----------------------------------------
      if (state === 'board') {
        let took = false;
        const list = atBoard ? atBoard.quests : [];

        // Five rows - three jobs, arming, and hiring.
        for (let i = 0; i < 5; i++) {
          const b = boardRowBox(i);      // the very same box that got drawn
          if (p.y >= b.y && p.y <= b.y + b.h && p.x >= b.x && p.x <= b.x + b.w) {
            if (i < list.length)  takeQuest(i);
            else if (i === 3)     buyGuards();
            else                  hireGuard();
            took = true;
          }
        }
        if (!took) state = 'play';       // tapped anywhere else = go back
        break;
      }

      // A SECOND STRIP, just below the first, for the kill rig - lined
      // up with where its line of text is drawn, so on a phone you tap
      // the words you can actually see.
      if (atRadio && canCallKillRig(atRadio) &&
          p.y >= H * 0.72 && p.y < H * 0.82 &&
          Math.abs(p.x - W / 2) < W * 0.3) {
        callKillRig(atRadio);
        break;
      }

      // Tapping the bottom-middle does whatever you're stood at: the
      // board, a radio tower, or a marine waiting to be recruited.
      if ((atBoard || atRadio || nearRecruit || atGear || atPad) &&
          p.y > H * 0.55 && p.y < H * 0.72 &&
          Math.abs(p.x - W / 2) < W * 0.25) {
        if (atBoard)          state = 'board';
        else if (nearRecruit) recruitMarine(nearRecruit);
        else if (atGear)      buyGear();
        else if (atPad)       launchShip();
        else if (clock >= atRadio.podReadyAt && squadSize() < MARINE_MAX) {
          summonPod(atRadio);
        }
        break;
      }

      // Checked BEFORE the fire button and before the look half, or a
      // thumb landing on JUMP would be read as "look around" instead.
      if (inCircle(p.x, p.y, jumpButton())) {
        roles[t.identifier] = { role: 'jump' };
        jumpQueued = true;
      } else if (inCircle(p.x, p.y, fireButton())) {
        roles[t.identifier] = { role: 'fire' };
        touchFire = true;
        shoot();
      } else if (p.x < W * 0.5) {
        // THE STICK APPEARS WHERE YOUR THUMB LANDS, rather than sitting
        // in a fixed spot you have to find. You never have to look down.
        roles[t.identifier] = { role: 'move' };
        stick.on = true;
        stick.ox = p.x; stick.oy = p.y;
        stick.dx = 0; stick.dy = 0; stick.push = 0;
      } else {
        roles[t.identifier] = { role: 'look', lx: p.x, ly: p.y };
      }
    }
    e.preventDefault();
  }

  function onTouchMove(e) {
    for (const t of e.changedTouches) {
      const r = roles[t.identifier];
      if (!r) continue;
      const p = touchPoint(t);

      if (r.role === 'move') {
        let dx = p.x - stick.ox, dy = p.y - stick.oy;
        const len = Math.hypot(dx, dy);

        // Clamp to the edge of the ring, so shoving your thumb to the
        // corner of the screen isn't faster than a normal push.
        if (len > STICK_MAX) { dx *= STICK_MAX / len; dy *= STICK_MAX / len; }

        stick.dx = dx; stick.dy = dy;
        stick.push = Math.min(1, len / STICK_MAX);

      } else if (r.role === 'look') {
        player.yaw += (p.x - r.lx) * TOUCH_LOOK;
        player.pitch = clamp(player.pitch - (p.y - r.ly) * TOUCH_LOOK, -0.9, 0.9);
        r.lx = p.x; r.ly = p.y;
      }
    }
    e.preventDefault();
  }

  function onTouchEnd(e) {
    for (const t of e.changedTouches) {
      const r = roles[t.identifier];
      if (!r) continue;

      if (r.role === 'move') { stick.on = false; stick.push = 0; }
      if (r.role === 'fire') touchFire = false;

      delete roles[t.identifier];
    }
    e.preventDefault();
  }

  canvas.addEventListener('touchstart',  onTouchStart, { passive: false });
  canvas.addEventListener('touchmove',   onTouchMove,  { passive: false });
  canvas.addEventListener('touchend',    onTouchEnd,   { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd,   { passive: false });

  function drawThumbPad() {
    if (!touchMode || state !== 'play') return;

    // ---- THE STICK, only while a thumb is down --------------------
    if (stick.on) {
      ctx.beginPath();
      ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(stick.ox + stick.dx, stick.oy + stick.dy, STICK_MAX * 0.38,
              0, Math.PI * 2);
      ctx.fillStyle = stick.push > STICK_RUN
        ? 'rgba(255,217,160,0.42)' : 'rgba(255,255,255,0.24)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.stroke();
    }

    // ---- FIRE -------------------------------------------------------
    const b = fireButton();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = touchFire ? 'rgba(255,120,60,0.38)' : 'rgba(0,0,0,0.32)';
    ctx.fill();
    ctx.lineWidth = touchFire ? 4 : 2;
    ctx.strokeStyle = touchFire ? '#ffb070' : 'rgba(255,255,255,0.42)';
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (b.r * 0.34) + 'px system-ui, sans-serif';
    ctx.fillStyle = touchFire ? '#ffd9a0' : '#dfe4ee';
    ctx.fillText('FIRE', b.x, b.y + b.r * 0.12);

    // ---- JUMP -------------------------------------------------------
    const j = jumpButton();
    const jumping = player.feetY > 0.05 || player.vy > 0;

    ctx.beginPath();
    ctx.arc(j.x, j.y, j.r, 0, Math.PI * 2);
    ctx.fillStyle = jumping ? 'rgba(140,220,255,0.34)' : 'rgba(0,0,0,0.32)';
    ctx.fill();
    ctx.lineWidth = jumping ? 3 : 2;
    ctx.strokeStyle = jumping ? '#8fd4ff' : 'rgba(255,255,255,0.42)';
    ctx.stroke();

    ctx.font = 'bold ' + (j.r * 0.38) + 'px system-ui, sans-serif';
    ctx.fillStyle = jumping ? '#c8ecff' : '#dfe4ee';
    ctx.fillText('JUMP', j.x, j.y + j.r * 0.14);
  }

  // IF YOU'RE STANDING INSIDE SOMETHING, GET OUT.
  //
  // You start at 0,0 - and hash2(0,0) works out to exactly zero, which
  // is below the tower threshold. So square (0,0) is ALWAYS a tower,
  // every single game, and you can spawn buried in solid concrete.
  //
  // A number that happens to be zero landing in the "yes" end of every
  // range is a classic. Worth remembering next time a random world has
  // something odd at its very middle.
  function pushOutOfWalls() {
    for (let i = 0; i < 8; i++) {
      const w = blockedAt(player.x, player.z, PLAYER_R);
      if (!w) return;

      const dx = player.x - w.x, dz = player.z - w.z;
      const g = Math.hypot(dx, dz);

      // Dead centre? Then there's no direction to push along, so pick
      // one. Otherwise we'd divide by zero and you'd become NaN.
      const ux = g > 0.01 ? dx / g : 1;
      const uz = g > 0.01 ? dz / g : 0;

      const want = w.solid + PLAYER_R + 0.6;
      player.x = w.x + ux * want;
      player.z = w.z + uz * want;
    }
  }

  function restart() {
    player.x = 0; player.z = 0;
    player.yaw = 0; player.pitch = 0;
    pushOutOfWalls();
    player.maxHealth = 100;      // upgrades were earned by the last life
    player.gunDamage = 1;
    player.marineRifle = false;  // the gear died with you too
    player.marineArmour = false;
    player.scrap = 0;
    player.health = player.maxHealth;
    player.kills = 0;
    player.hurtFlash = 0;
    player.feetY = 0; player.vy = 0; jumpQueued = false;

    // Drop the job you were on - but LEAVE THE BOARDS ALONE. Work that
    // got done stays done. Quietly un-finishing every job because you
    // died would make the whole board meaningless.
    quest = null; atBoard = null; questFlash = 0;
    enemies = []; bolts = []; gibs = []; tracers = [];

    // ---- A FRESH TRUCK, PARKED WHERE YOU CAN SEE IT ------------------
    // You always start with a rig. Losing it because you wrecked it is
    // fair; starting a new life on foot with no way to get one is not.
    driving = false;
    rig.x = 26; rig.z = 14; rig.yaw = 0;
    rig.speed = 0; rig.steer = 0;
    rig.health = rig.maxHealth;
    rig.kills = 0; rig.ramFlash = 0;
    rig.cargo = null; rig.hauls = 0; rig.earned = 0;
    rig.bumpCool = 0;
    mouseSteer = 0; rigSay = ''; rigSayT = 0;
    atMechanic = null; repairGlow = 0;
    others = []; otherTimer = 22;
    flying = false; atJet = null;
    jet.x = 26; jet.z = -34; jet.y = 0; jet.yaw = 0;
    jet.speed = 0; jet.steer = 0; jet.health = jet.maxHealth;
    jet.kills = 0; jet.hitCool = 0; jet.ramFlash = 0;
    setHelp();

    // The squad dies with you - marines are something you EARN each
    // life, like your kills. But the radio towers stay found, and the
    // ones you already used stay on cooldown.
    pods = []; marines = [];
    atRadio = null; nearRecruit = null; atGear = null; atPad = null;
    space = null;
    healing = false; healGlow = 0;
    spawnTimer = 1.5;
    hordeTimer = HORDE_FIRST; hordeWarn = 0;
    hordeSize = 0; hordeGiants = 0; hordeBoss = false;
    clock = 0;
    state = 'play';
    seedTheField();
  }

  // A few already halfway here.
  //
  // Now that they set off from beyond the fog, a zombie takes about
  // twenty-four seconds to walk in. Without this the game would open
  // with almost half a minute of empty wasteland while the first lot
  // trudged over, which is atmospheric exactly once.
  //
  // So we drop a handful in already on their way. Everything after this
  // comes out of the haze properly.
  function seedTheField() {
    for (let i = 0; i < 4; i++) spawnEnemy(75 + Math.random() * 60);
  }


// -------------------------------------------------------------------
//  UPDATE
// -------------------------------------------------------------------

  function update(dt) {
    clock += dt;

    if (player.hurtFlash > 0) player.hurtFlash = Math.max(0, player.hurtFlash - dt * 1.6);
    if (flash > 0) flash = Math.max(0, flash - dt * 9);
    if (shake > 0) shake = Math.max(0, shake - dt * 2.2);
    if (player.cool > 0) player.cool -= dt;

    updateGibs(dt);
    if (questFlash > 0) questFlash -= dt;

    // Reading the board stops the world. You're inside a settlement to
    // do it, which is the one safe place there is, so nothing is being
    // dodged by standing here.
    if (state === 'board') return;

    // In orbit, a different game runs. The wasteland below holds its
    // breath - zombies, hordes, timers, all frozen - until you land.
    if (state === 'space') { updateSpace(dt); return; }

    if (state === 'dead') {
      deadTimer += dt;
      cam.x = player.x; cam.z = player.z;
      cam.y = player.feetY + 1.0;      // you're on the floor now
      cam.yaw = player.yaw;
      cam.pitch = clamp(player.pitch, -0.9, 0.2);
      return;
    }

    if (rigSayT > 0) rigSayT -= dt;

    // ---- IN THE SEAT ------------------------------------------------
    // Driving REPLACES walking. Everything else in the game - zombies,
    // hordes, marines, quests - carries on exactly as before, because
    // updateRig keeps player.x and player.z sat on the truck.
    if (driving) updateRig(dt);
    if (flying)  updateJet(dt);

    // ---- WALKING ----------------------------------------------------
    // Forwards means "the way you're looking", so the same keys do
    // different things depending on where the mouse has put you.
    if (!driving && !flying) {
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
    const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);

    let mx = 0, mz = 0;
    if (held('w', 'arrowup'))    { mx += fx; mz += fz; }
    if (held('s', 'arrowdown'))  { mx -= fx; mz -= fz; }
    if (held('d', 'arrowright')) { mx += rx; mz += rz; }
    if (held('a', 'arrowleft'))  { mx -= rx; mz -= rz; }

    // The thumb stick pushes in the SAME two directions the keys do -
    // forwards and sideways from where you're looking. On screen it's
    // up/down/left/right; in the world it's whichever way you're facing.
    // Up on the stick is up the screen, which is why dy is subtracted.
    if (stick.on && stick.push > 0.06) {
      const sx = stick.dx / STICK_MAX, sy = -stick.dy / STICK_MAX;
      mx += fx * sy + rx * sx;
      mz += fz * sy + rz * sx;
    }

    const len = Math.hypot(mx, mz);
    if (len > 0) {
      // Divide by the length, or walking diagonally would be 1.4 times
      // faster than walking straight - which is a bug in a LOT of games.
      mx /= len; mz /= len;

      // Shove the stick right out to the edge and you run. One control
      // doing two jobs, so there's no second button to hunt for.
      const running = keys['shift'] || (stick.on && stick.push > STICK_RUN);
      const speed = running ? RUN : WALK;
      const nx = player.x + mx * speed * dt;
      const nz = player.z + mz * speed * dt;

      // ---- WALKING INTO THINGS ------------------------------------
      // Try the whole move. If something's in the way, try it one
      // direction at a time - and whichever half is clear still
      // happens. That's why you SLIDE along a wall instead of
      // sticking to it the moment you brush it, and it's three lines.
      // A cliff counts as "something in the way" too. You can step up a
      // kerb; you cannot step up a cliff. Jump for it, or walk round.
      //
      // Only while your boots are DOWN - in mid-air the rule is off, so
      // a jump can carry you onto a ledge. That's the whole reason to
      // jump on this planet.
      const grounded = player.feetY <= terrainAt(player.x, player.z) + 0.01;

      function canStand(tx, tz) {
        if (blockedAt(tx, tz, PLAYER_R)) return false;

        // On foot you can manage a kerb. In the air you can only move
        // over ground that's already below your boots - so a jump gets
        // you onto a ledge you've cleared, and never through the side
        // of one.
        return terrainAt(tx, tz) <= player.feetY + (grounded ? STEP_UP : 0.5);
      }

      if (canStand(nx, nz)) {
        player.x = nx; player.z = nz;
      } else {
        if (canStand(nx, player.z)) player.x = nx;
        if (canStand(player.x, nz)) player.z = nz;
      }

      player.bob += dt * speed * 0.36;
    }

    // ---- HILLS UNDER YOUR BOOTS, AND JUMPING ------------------------
    // feetY is how high your boots are, in the world. On the ground it
    // simply IS the terrain height, so walking uphill carries you up.
    // Jumping trades that for honest physics: an upward kick, gravity
    // every frame, and the ground catches you where it happens to be -
    // which off the edge of a cliff is a long way down.
    {
      const ground = terrainAt(player.x, player.z);
      const airborne = player.feetY > ground + 0.01 || player.vy > 0;

      if (jumpQueued && !airborne) {
        player.vy = 15;
        playJump();
      }
      jumpQueued = false;

      if (airborne || player.vy !== 0) {
        player.vy -= 42 * dt;                  // gravity
        player.feetY += player.vy * dt;
        if (player.feetY <= ground) {          // touchdown
          player.feetY = ground;
          player.vy = 0;
        }
      } else {
        player.feetY = ground;                 // boots glued to the hill
      }
    }

    }   // end of the on-foot movement - skipped entirely while driving

    if (firing || touchFire) shoot();

    // ---- CAN YOU REACH A SEAT? --------------------------------------
    atRig = !driving && !flying &&
            Math.hypot(player.x - rig.x, player.z - rig.z) < 12 ? rig : null;
    atJet = !driving && !flying && !atRig &&
            Math.hypot(player.x - jet.x, player.z - jet.z) < 16 ? jet : null;

    // ---- HAVE YOU ARRIVED? ------------------------------------------
    checkDelivery();

    // ---- IS SOMEBODY FIXING THE RIG? --------------------------------
    updateMechanic(dt);

    // ---- OTHER TRUCKS ON THE ROAD -----------------------------------
    updateOthers(dt);

    // ---- ARE YOU STOOD AT A BOARD? ----------------------------------
    atBoard = null;
    const camp = insideSettlement();
    if (camp && camp.quests) {
      refreshBoard(camp);       // any job whose minute is up goes back on
      const bd = boardWorld(camp);
      if (Math.hypot(player.x - bd.x, player.z - bd.z) < 7) atBoard = camp;
    }

    // ---- OR AT A RADIO TOWER? OR NEXT TO A WAITING MARINE? ----------
    // Worked out fresh every frame, same as the board. The E key and
    // the on-screen hint both read these instead of hunting again.
    atRadio = null;
    {
      const gx0 = Math.round(player.x / CELL), gz0 = Math.round(player.z / CELL);
      for (let gx = gx0 - 1; gx <= gx0 + 1 && !atRadio; gx++) {
        for (let gz = gz0 - 1; gz <= gz0 + 1; gz++) {
          const p = propAt(gx, gz);
          if (p && p.kind === 'radio' &&
              Math.hypot(player.x - p.x, player.z - p.z) < 16) {
            atRadio = p;
            break;
          }
        }
      }
    }

    nearRecruit = null;
    for (const m of marines) {
      if (m.state !== 'wait') continue;
      if (Math.hypot(player.x - m.x, player.z - m.z) < 7) {
        nearRecruit = m;
        break;
      }
    }

    // ---- OR STOOD AT THE DROPSHIP? ----------------------------------
    atPad = null;
    {
      const gx0 = Math.round(player.x / CELL), gz0 = Math.round(player.z / CELL);
      for (let gx = gx0 - 1; gx <= gx0 + 1 && !atPad; gx++) {
        for (let gz = gz0 - 1; gz <= gz0 + 1; gz++) {
          const p = propAt(gx, gz);
          if (p && p.kind === 'pad' &&
              Math.hypot(player.x - p.x, player.z - p.z) < 17) {
            atPad = p;
            break;
          }
        }
      }
    }

    // ---- OR SHOPPING AT A FORT ARMOURY? -----------------------------
    atGear = null;
    {
      const gx0 = Math.round(player.x / CELL), gz0 = Math.round(player.z / CELL);
      for (let gx = gx0 - 1; gx <= gx0 + 1 && !atGear; gx++) {
        for (let gz = gz0 - 1; gz <= gz0 + 1 && !atGear; gz++) {
          const p = propAt(gx, gz);
          if (!p || p.kind !== 'fort') continue;
          const st = fortStations(p);
          if (!player.marineRifle &&
              Math.hypot(player.x - st.rifle.x, player.z - st.rifle.z) < 6) {
            atGear = { kind: 'rifle', cost: GEAR_COST.rifle };
          } else if (!player.marineArmour &&
              Math.hypot(player.x - st.armour.x, player.z - st.armour.z) < 6) {
            atGear = { kind: 'armour', cost: GEAR_COST.armour };
          }
        }
      }
    }

    // ---- PATCHED UP INSIDE THE WALLS --------------------------------
    // Ten health a second while you're inside a settlement. Somebody in
    // there knows what they're doing with a bandage.
    //
    // Multiplied by dt, like everything else that moves, so it's ten a
    // second on a fast computer AND a slow one. Write it without the
    // dt and it becomes ten per FRAME - six hundred a second - and you
    // would be immortal on a good machine and not on a bad one.
    healing = false;
    if (insideSettlement() && player.health < player.maxHealth) {
      player.health = Math.min(player.maxHealth, player.health + HEAL_RATE * dt);
      healing = true;
      healGlow = Math.min(1, healGlow + dt * 4);
    }
    if (!healing) healGlow = Math.max(0, healGlow - dt * 2.5);

    // ---- MORE OF THEM, ALL THE TIME ---------------------------------
    // ---- IS A HORDE DUE? --------------------------------------------
    if (hordeWarn > 0) hordeWarn -= dt;

    hordeTimer -= dt;
    if (hordeTimer <= 0) {
      spawnHorde();
      // A little random, so you can never quite set your watch by it.
      hordeTimer = HORDE_EVERY * (0.8 + Math.random() * 0.4);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      // The gap between spawns shrinks the longer you live. It never
      // quite reaches zero, so it gets harder forever without ever
      // becoming impossible all at once.
      spawnTimer = Math.max(0.55, 2.6 - clock * 0.012);
    }

    updateEnemies(dt);
    updateGuards(dt);
    updatePods(dt);
    updateMarines(dt);
    updateBolts(dt);

    enemies = enemies.filter(function (e) { return !e.dead; });

    // ---- THE CAMERA -------------------------------------------------
    // Driving has its own camera (behind the truck, and it lags). If
    // this ran anyway it would snap the view back into your head every
    // single frame and the chase cam would never be seen at all.
    if (driving || flying) return;

    cam.x = player.x;
    cam.z = player.z;
    cam.y = player.feetY + EYE_H + Math.sin(player.bob) * 0.14;   // head nods as you walk
    cam.yaw = player.yaw;
    cam.pitch = player.pitch;
  }


// -------------------------------------------------------------------
//  DRAW
// -------------------------------------------------------------------

  function drawSky() {
    const horizon = H / 2 + focal() * Math.tan(cam.pitch);

    if (horizon > 0) {
      const sky = ctx.createLinearGradient(0, 0, 0, horizon);
      sky.addColorStop(0, SKY_TOP);
      sky.addColorStop(1, SKY_LOW);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, horizon);
    }

    // Below the horizon is pure fog colour, so the ground rings fade
    // into something instead of ending at a hard edge.
    ctx.fillStyle = 'rgb(' + FOG[0] + ',' + FOG[1] + ',' + FOG[2] + ')';
    ctx.fillRect(0, Math.max(0, horizon), W, H);
  }

// -------------------------------------------------------------------
//  YOUR RIFLE
// -------------------------------------------------------------------
//  It used to lie across the corner of the screen at an angle, which
//  looked like a gun somebody had dropped. Now it POINTS - the butt is
//  down near your shoulder, and the barrel runs away from you towards
//  the crosshair.
//
//  The trick is that we don't draw a rectangle. We walk from the butt
//  to the muzzle, and at each step the gun is NARROWER than the step
//  before. Things shrink as they get further away, so a shape that
//  shrinks along its length reads as pointing away from you - even
//  though it's flat 2D shapes painted on the screen.
// -------------------------------------------------------------------

  function drawGun() {
    const u = Math.min(W, H) * 0.055;

    const sway  = Math.sin(player.bob) * u * 0.16;
    const sway2 = Math.abs(Math.cos(player.bob)) * u * 0.12;
    const kick  = flash * u * 1.1;        // shoved back towards you

    // The two ends of the gun. The muzzle sits just below and right of
    // the crosshair, which is what makes it feel aimed at what you're
    // pointing at.
    const buttX = W * 0.62 + sway,       buttY = H * 1.06 + sway2 + kick;
    const tipX  = W * 0.532 + sway * 0.3, tipY = H * 0.545 + sway2 * 0.3 + kick * 0.35;

    // The line from butt to muzzle, and the direction across it.
    const ax = tipX - buttX, ay = tipY - buttY;
    const alen = Math.hypot(ax, ay) || 1;
    const px = -ay / alen, py = ax / alen;      // perpendicular

    // A slice of gun: from t0 to t1 along the barrel, w0 wide at the
    // near end and w1 at the far end. One function draws every part of
    // it, because every part is the same shape.
    function slice(t0, t1, w0, w1, colour, offset) {
      const o = (offset || 0) * u;

      const x0 = buttX + ax * t0 + px * o, y0 = buttY + ay * t0 + py * o;
      const x1 = buttX + ax * t1 + px * o, y1 = buttY + ay * t1 + py * o;

      ctx.beginPath();
      ctx.moveTo(x0 - px * w0 * u, y0 - py * w0 * u);
      ctx.lineTo(x0 + px * w0 * u, y0 + py * w0 * u);
      ctx.lineTo(x1 + px * w1 * u, y1 + py * w1 * u);
      ctx.lineTo(x1 - px * w1 * u, y1 - py * w1 * u);
      ctx.closePath();
      ctx.fillStyle = colour;
      ctx.fill();
    }

    // Two paint jobs, one gun shape. Buy the marine rifle and the
    // rusty scrap colours swap for marine steel with an orange stripe.
    const mr = player.marineRifle;
    slice(0.00, 0.30, 1.05, 0.85, mr ? '#232a33' : '#241f1c');   // stock
    slice(0.26, 0.62, 0.88, 0.60, mr ? '#39434f' : '#332e29');   // body
    slice(0.40, 0.52, 1.30, 1.05, mr ? '#2c343e' : '#2b2622', -0.55); // magazine
    slice(0.60, 1.00, 0.40, 0.17, mr ? '#55636f' : '#4a423a');   // barrel
    slice(0.62, 0.70, 0.20, 0.18, mr ? '#e08a30' : '#6a5f54', 0.45); // sight
    if (mr) slice(0.28, 0.60, 0.10, 0.08, '#e08a30', 0.30);      // the stripe

    // ---- MUZZLE FLASH ------------------------------------------------
    // Right at the tip, so the bang happens where you're looking rather
    // than down in the corner where you aren't.
    if (flash > 0.12) {
      const r = u * (1.0 + flash * 2.2);
      const g = ctx.createRadialGradient(tipX, tipY, 0, tipX, tipY, r);
      g.addColorStop(0, 'rgba(255,244,205,' + flash + ')');
      g.addColorStop(0.45, 'rgba(255,170,50,' + (flash * 0.7) + ')');
      g.addColorStop(1, 'rgba(255,120,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(tipX, tipY, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Which settlement are you standing at, if any? Only the nine squares
  // around you can possibly be close enough.
  function nearestSettlement() {
    const gx = Math.round(player.x / CELL), gz = Math.round(player.z / CELL);

    for (let ax = gx - 1; ax <= gx + 1; ax++) {
      for (let az = gz - 1; az <= gz + 1; az++) {
        const p = propAt(ax, az);
        if (!p || p.kind !== 'bunker') continue;
        if (Math.hypot(p.x - player.x, p.z - player.z) < p.half + 26) return p;
      }
    }
    return null;
  }

  // ARE YOU ACTUALLY INSIDE THE WALLS?
  //
  // Not the same question as "are you near it", and it needs different
  // maths. A compound is a SQUARE. Measuring plain distance from the
  // middle draws a CIRCLE - and a circle that fits inside a square
  // misses all four corners. You'd be stood well inside the walls, in a
  // corner, and the game would insist you were out in the wasteland.
  //
  // So we spin your position backwards into the settlement's own
  // directions, which turns its tilted square into a straight one, and
  // then it's just two easy comparisons.
  function insideSettlement() {
    const gx = Math.round(player.x / CELL), gz = Math.round(player.z / CELL);

    for (let ax = gx - 1; ax <= gx + 1; ax++) {
      for (let az = gz - 1; az <= gz + 1; az++) {
        const p = propAt(ax, az);
        if (!p || p.kind !== 'bunker') continue;

        const dx = player.x - p.x, dz = player.z - p.z;
        const co = Math.cos(p.spin), si = Math.sin(p.spin);

        // The exact opposite of the spin bunkerParts does on the way out.
        const lx = dx * co - dz * si;
        const lz = dx * si + dz * co;

        const edge = p.half - 1.5;
        if (Math.abs(lx) < edge && Math.abs(lz) < edge) return p;
      }
    }
    return null;
  }

// -------------------------------------------------------------------
//  THE MINIMAP
// -------------------------------------------------------------------
//  Top right. You're the arrow in the middle, always, and the WORLD
//  turns around you - so straight up the map is straight ahead, and a
//  blip above the arrow is a thing in front of your face.
//
//  That's why the compass letters move. If the map turned and N stayed
//  put, N would be lying. Everything that's stuck to the world has to
//  turn with the world, letters included.
//
//  It reaches 320 paces, which is further than you can see through the
//  fog on purpose. A horde forms at about 250, so you get to watch it
//  gather as a smear of dots before there's anything to look at.
// -------------------------------------------------------------------

  const MAP_RANGE = 320;

  const MAP_COLOUR = {
    zombie:        '#7ad05a',
    robot:         '#6ecdff',
    giant:         '#ff5a3c',
    zombieMarine:  '#d05aff',   // evil purple - nothing else on the map has it
    zombieBoss:    '#ff2a2a',   // pure alarm red
    // the locals of the other five planets
    ashWraith:     '#d0d0da',  ashSpitter:   '#f0f0f8',  ashGiant: '#a8a8b4',
    rotCrawler:    '#c6d84a',  sporeSpitter: '#8fe0a0',  rotGiant: '#9fcf4f',
    bloodFiend:    '#ff6a5a',  bloodSpitter: '#ff9040',  bloodGiant: '#ff3a2a',
    frostShambler: '#c8e4f8',  frostSpitter: '#5ab0e8',  frostGolem: '#8fd0ff',
    voidWalker:    '#c08aff',  voidFloater:  '#e0a0ff',  voidGiant: '#a050ff'
  };

  function drawMiniMap() {
    const r  = Math.min(W, H) * 0.135;
    const cx = W - r - 16;
    const cy = r + 16;
    const scale = r / MAP_RANGE;

    const sy = Math.sin(player.yaw), cyaw = Math.cos(player.yaw);

    // TURN A SPOT IN THE WORLD INTO A SPOT ON THE MAP.
    //
    // The same two sums as the 3D camera: how far in FRONT of you it is,
    // and how far to the RIGHT. Forward goes up the screen, which is why
    // it's subtracted - screen y grows downwards.
    function toMap(wx, wz) {
      const dx = wx - player.x, dz = wz - player.z;
      return {
        x: cx + (dx * cyaw - dz * sy) * scale,
        y: cy - (dx * sy + dz * cyaw) * scale,
        d: Math.hypot(dx, dz)
      };
    }

    // ---- THE DISC ---------------------------------------------------
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(24,16,10,0.62)';
    ctx.fill();

    // Everything from here until restore() is trimmed to that circle, so
    // a settlement half off the edge gets cut instead of spilling out
    // across the sky.
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    // ---- SETTLEMENTS ------------------------------------------------
    const reach = Math.ceil(MAP_RANGE / CELL);
    const gx0 = Math.round(player.x / CELL), gz0 = Math.round(player.z / CELL);
    const home = insideSettlement();

    for (let gx = gx0 - reach; gx <= gx0 + reach; gx++) {
      for (let gz = gz0 - reach; gz <= gz0 + reach; gz++) {
        const p = propAt(gx, gz);
        if (!p) continue;

        // ---- LANDING PADS: a little green SHUTTLE, nose up, wings
        // out. Maximus asked for the actual ship on the map - and he's
        // right, a shape you recognise beats a dot you have to learn.
        if (p.kind === 'pad') {
          const m = toMap(p.x, p.z);
          if (m.d > MAP_RANGE) continue;

          ctx.beginPath();
          ctx.moveTo(m.x,       m.y - 6);      // nose
          ctx.lineTo(m.x + 2,   m.y - 1);
          ctx.lineTo(m.x + 5.5, m.y + 3);      // right wingtip
          ctx.lineTo(m.x + 1.7, m.y + 2.2);
          ctx.lineTo(m.x + 1.7, m.y + 5);      // right tail
          ctx.lineTo(m.x - 1.7, m.y + 5);      // left tail
          ctx.lineTo(m.x - 1.7, m.y + 2.2);
          ctx.lineTo(m.x - 5.5, m.y + 3);      // left wingtip
          ctx.lineTo(m.x - 2,   m.y - 1);
          ctx.closePath();
          ctx.fillStyle = '#6ee87a';
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(0,0,0,0.55)';
          ctx.stroke();
          continue;
        }

        // ---- MARINE FORTS: a steel-blue square, drawn at real size.
        if (p.kind === 'fort') {
          const m = toMap(p.x, p.z);
          if (m.d > MAP_RANGE) continue;
          const s = Math.max(4, p.half * scale);
          ctx.fillStyle = 'rgba(130,170,230,0.20)';
          ctx.fillRect(m.x - s, m.y - s, s * 2, s * 2);
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#9ec4f0';
          ctx.strokeRect(m.x - s, m.y - s, s * 2, s * 2);
          continue;
        }

        // ---- RADIO TOWERS: a little red triangle, like an antenna.
        // Bright when it's charged, grey while it's recharging.
        if (p.kind === 'radio') {
          const m = toMap(p.x, p.z);
          if (m.d > MAP_RANGE) continue;

          ctx.beginPath();
          ctx.moveTo(m.x, m.y - 4.5);
          ctx.lineTo(m.x + 4, m.y + 3.5);
          ctx.lineTo(m.x - 4, m.y + 3.5);
          ctx.closePath();
          ctx.fillStyle = clock >= p.podReadyAt ? '#ff5a4a' : '#7a5a52';
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.stroke();
          continue;
        }

        if (p.kind !== 'bunker') continue;

        const m = toMap(p.x, p.z);
        if (m.d > MAP_RANGE) continue;

        // Drawn at its REAL size, so a big compound looks big. The ring
        // is the wall; you can see whether you're inside it.
        const wall = Math.max(4, p.half * scale);

        ctx.beginPath();
        ctx.arc(m.x, m.y, wall, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,200,90,0.20)';
        ctx.fill();
        ctx.lineWidth = (p === home) ? 3 : 1.5;
        ctx.strokeStyle = (p === home) ? '#ffe08a' : 'rgba(255,200,90,0.75)';
        ctx.stroke();
      }
    }

    // ---- YOUR SQUAD -------------------------------------------------
    // Marines are visor-orange. A waiting one BLINKS, so a fresh drop
    // is easy to walk back to.
    for (const mn of marines) {
      const m = toMap(mn.x, mn.z);
      if (m.d > MAP_RANGE) continue;
      if (mn.state === 'wait' && Math.sin(clock * 6) < 0) continue;

      ctx.beginPath();
      ctx.arc(m.x, m.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffb444';
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.stroke();
    }

    // A pod still falling is a white blink - something incoming.
    for (const pd of pods) {
      if (pd.landed) continue;
      if (Math.sin(clock * 12) < 0) continue;
      const m = toMap(pd.x, pd.z);
      if (m.d > MAP_RANGE) continue;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    // ---- WHERE YOU LEFT THE JET -------------------------------------
    if (!flying) {
      const m = toMap(jet.x, jet.z);
      if (m.d <= MAP_RANGE) {
        ctx.fillStyle = jet.health > 0 ? '#9ed8ff' : '#54708a';
        ctx.beginPath();
        ctx.moveTo(m.x, m.y - 5);
        ctx.lineTo(m.x + 4.5, m.y + 4);
        ctx.lineTo(m.x - 4.5, m.y + 4);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.stroke();
      }
    }

    // ---- WHERE YOU PARKED IT ----------------------------------------
    // Only worth showing when you're NOT sat in it - otherwise it's a
    // marker permanently stuck under the arrow that means "you".
    if (!driving) {
      const m = toMap(rig.x, rig.z);
      if (m.d <= MAP_RANGE) {
        ctx.fillStyle = rig.health > 0 ? '#e8b060' : '#7a5a3a';
        ctx.fillRect(m.x - 3.5, m.y - 3.5, 7, 7);
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.strokeRect(m.x - 3.5, m.y - 3.5, 7, 7);
      }
    }

    // ---- WHERE THE LOAD IS GOING -------------------------------------
    // Pinned to the RIM when it's off the edge of the map, so it always
    // points the way even when the place is miles away. Without this
    // you'd be driving into empty fog and hoping.
    if (rig.cargo) {
      const m = toMap(rig.cargo.to.x, rig.cargo.to.z);
      let px = m.x, py = m.y;
      const dx = m.x - cx, dy = m.y - cy;
      const away = Math.hypot(dx, dy) || 1;
      if (away > r - 8) { px = cx + dx / away * (r - 8); py = cy + dy / away * (r - 8); }

      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = Math.sin(clock * 5) > 0 ? '#ffd9a0' : '#e8a54c';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.stroke();
    }

    // ---- THE OTHER TRUCKS -------------------------------------------
    // Bigger than a person on the map, because a truck IS bigger and
    // you want to see one coming well before it arrives.
    for (const o of others) {
      const m = toMap(o.x, o.z);
      if (m.d > MAP_RANGE) continue;
      const big = o.side === 'kill';
      const r2 = big ? 7 : 4;
      ctx.fillStyle = big ? '#bfe4ff' : o.side === 'marine' ? '#7fc0f0' : '#d05a4a';
      ctx.fillRect(m.x - r2, m.y - r2, r2 * 2, r2 * 2);
      ctx.lineWidth = big ? 2 : 1.2;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeRect(m.x - r2, m.y - r2, r2 * 2, r2 * 2);
    }

    // ---- EVERYTHING THAT WANTS YOU ----------------------------------
    for (const e of enemies) {
      if (e.dead) continue;

      const m = toMap(e.x, e.z);
      if (m.d > MAP_RANGE) continue;

      const size = e.k.big ? 4.2 : 2.1;

      ctx.beginPath();
      ctx.arc(m.x, m.y, size, 0, Math.PI * 2);
      ctx.fillStyle = MAP_COLOUR[e.kind] || '#ffffff';
      ctx.fill();

      // A ring round the giants, so one is never lost in a crowd.
      if (e.k.big) {
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = '#ffd0c0';
        ctx.stroke();
      }
    }

    ctx.restore();

    // ---- YOU ---------------------------------------------------------
    // An arrow, pointing up, always. You never turn on this map - the
    // world does.
    ctx.beginPath();
    ctx.moveTo(cx, cy - 7);
    ctx.lineTo(cx + 5, cy + 6);
    ctx.lineTo(cx, cy + 3);
    ctx.lineTo(cx - 5, cy + 6);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.stroke();

    // ---- THE RIM AND THE COMPASS -------------------------------------
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,217,160,0.55)';
    ctx.stroke();

    // North is +z in this world - the way you're facing when the game
    // starts. Each letter goes through the SAME turning as everything
    // else, which is what keeps them honest as you spin.
    const COMPASS = [
      { s: 'N', x:  0, z:  1 },
      { s: 'E', x:  1, z:  0 },
      { s: 'S', x:  0, z: -1 },
      { s: 'W', x: -1, z:  0 }
    ];

    ctx.textAlign = 'center';
    ctx.font = 'bold 12px system-ui, sans-serif';

    for (const c of COMPASS) {
      const px = cx + (c.x * cyaw - c.z * sy) * r * 0.84;
      const py = cy - (c.x * sy + c.z * cyaw) * r * 0.84;

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillText(c.s, px + 1, py + 5);
      ctx.fillStyle = (c.s === 'N') ? '#ffd9a0' : 'rgba(230,214,190,0.8)';
      ctx.fillText(c.s, px, py + 4);
    }
  }

  // Where row i of the board sits. Used BOTH to draw it and to work out
  // what a thumb landed on, so the row you see is the row you get.
  // Five rows now, not four - so the rows had to get shorter and start
  // higher. Worked out rather than eyeballed: five rows at 0.10 of the
  // height with 8 between them, starting at 0.24, ends at 0.74 plus 32
  // pixels. The footer sits at 0.88. It fits, on a short window too.
  function boardRowBox(i) {
    const w = Math.min(W * 0.7, 520);
    const h = H * 0.10;
    return { x: W / 2 - w / 2, y: H * 0.24 + i * (h + 8), w: w, h: h };
  }

  function questLine(q) {
    // "zombies" on The Rust, "ash wraiths" on Ashfall - the board
    // names whatever fills the zombie job on THIS planet.
    const localName = KINDS[PLANETS[planetIx].kinds.melee].plural || 'zombies';
    return 'Kill ' + q.target + ' ' +
           (q.kind === 'zombie' ? localName : 'of them');
  }

  function drawBoardScreen() {
    ctx.fillStyle = 'rgba(14,9,5,0.88)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.06, 40) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd9a0';
    ctx.fillText('JOBS ON THE BOARD', W / 2, H * 0.18);

    ctx.font = Math.min(W * 0.028, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#a89880';
    ctx.fillText(atBoard ? atBoard.souls + ' people here are counting on somebody'
                         : '', W / 2, H * 0.225);

    const list = atBoard ? atBoard.quests : [];

    for (let i = 0; i < list.length; i++) {
      const q = list[i];
      const b = boardRowBox(i);
      const mine = (q === quest);

      ctx.fillStyle = q.done ? 'rgba(60,90,50,0.35)'
                    : mine   ? 'rgba(255,217,160,0.16)'
                    :          'rgba(0,0,0,0.4)';
      ctx.fillRect(b.x, b.y, b.w, b.h);

      ctx.lineWidth = mine ? 3 : 1.5;
      ctx.strokeStyle = q.done ? 'rgba(140,200,120,0.6)'
                      : mine   ? '#ffe08a'
                      :          'rgba(255,255,255,0.2)';
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.036, 23) + 'px system-ui, sans-serif';
      ctx.fillStyle = q.done ? '#9ad07a' : mine ? '#ffe08a' : '#e6dcc8';
      ctx.fillText((i + 1) + '.  ' + questLine(q), b.x + 16, b.y + b.h * 0.42);

      ctx.font = Math.min(W * 0.026, 16) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a89880';
      ctx.fillText(q.done
        ? 'done  -  new job in ' + Math.max(0, Math.ceil(q.readyAt - clock)) + 's'
        : 'pays: ' + REWARD_TEXT[q.reward],
        b.x + 16, b.y + b.h * 0.75);

      if (mine && !q.done) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffe08a';
        ctx.font = 'bold ' + Math.min(W * 0.03, 19) + 'px system-ui, sans-serif';
        ctx.fillText(q.count + ' / ' + q.target, b.x + b.w - 16, b.y + b.h * 0.6);
      }
    }

    // ---- PAY FOR BETTER GUARDS --------------------------------------
    if (atBoard) {
      const lvl = atBoard.guardLevel || 0;
      const b = boardRowBox(3);
      const maxed = lvl >= GUARD_MAX_LEVEL;
      const cost = guardCost(lvl);
      const canAfford = !maxed && player.scrap >= cost;

      ctx.fillStyle = canAfford ? 'rgba(110,205,255,0.16)' : 'rgba(0,0,0,0.4)';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.lineWidth = canAfford ? 3 : 1.5;
      ctx.strokeStyle = canAfford ? '#6ecdff' : 'rgba(255,255,255,0.2)';
      ctx.strokeRect(b.x, b.y, b.w, b.h);

      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.036, 23) + 'px system-ui, sans-serif';
      ctx.fillStyle = canAfford ? '#a8e4ff' : '#9a9284';
      ctx.fillText('4.  Arm the guards  -  level ' + lvl + '/' + GUARD_MAX_LEVEL,
                   b.x + 16, b.y + b.h * 0.42);

      ctx.font = Math.min(W * 0.026, 16) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a89880';
      ctx.fillText(maxed
        ? 'these guards are as good as they get'
        : 'costs ' + cost + ' scrap  -  ' + guardHurt(lvl) + ' damage becomes ' +
          guardHurt(lvl + 1) + ', and they reach further',
        b.x + 16, b.y + b.h * 0.75);

      ctx.textAlign = 'right';
      ctx.font = 'bold ' + Math.min(W * 0.03, 19) + 'px system-ui, sans-serif';
      ctx.fillStyle = canAfford ? '#a8e4ff' : '#8c7c66';
      ctx.fillText('you have ' + player.scrap, b.x + b.w - 16, b.y + b.h * 0.6);

      // ---- HIRE ANOTHER GUARD ---------------------------------------
      const manned = onDuty(atBoard);
      const posts = atBoard.guards.length;
      const full = manned >= posts;
      const hc = hireCost(atBoard);
      const canHire = !full && player.scrap >= hc;
      const b2 = boardRowBox(4);

      ctx.fillStyle = canHire ? 'rgba(140,220,120,0.16)' : 'rgba(0,0,0,0.4)';
      ctx.fillRect(b2.x, b2.y, b2.w, b2.h);
      ctx.lineWidth = canHire ? 3 : 1.5;
      ctx.strokeStyle = canHire ? '#8fd45c' : 'rgba(255,255,255,0.2)';
      ctx.strokeRect(b2.x, b2.y, b2.w, b2.h);

      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.034, 22) + 'px system-ui, sans-serif';
      ctx.fillStyle = canHire ? '#b6e89a' : '#9a9284';
      ctx.fillText('5.  Hire a guard  -  ' + manned + ' of ' + posts + ' posts manned',
                   b2.x + 16, b2.y + b2.h * 0.42);

      ctx.font = Math.min(W * 0.025, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a89880';
      ctx.fillText(full ? 'every post on this wall has somebody on it'
                        : 'costs ' + hc + ' scrap  -  one more rifle covering the gate',
                   b2.x + 16, b2.y + b2.h * 0.76);
    }

    ctx.textAlign = 'center';
    ctx.font = Math.min(W * 0.028, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8c7c66';
    ctx.fillText(touchMode
      ? 'tap a line to choose it, or tap down here to go back'
      : '1 2 3 take a job    4 arm the guards    5 hire one    6 load the truck    E to go back',
      W / 2, H * 0.88);

    // ---- THE HAULING LINE -------------------------------------------
    // The board is where you take work, so it's where you pick up a
    // load too. It says what's in the trailer and where it's going,
    // or it offers you something to carry.
    ctx.font = Math.min(W * 0.032, 19) + 'px system-ui, sans-serif';
    ctx.fillStyle = rig.cargo ? '#ffd9a0' : '#9ec4f0';
    ctx.fillText(rig.cargo
      ? 'HAULING ' + rig.cargo.what + '  -  ' +
        Math.round(Math.hypot(rig.cargo.to.x - rig.x, rig.cargo.to.z - rig.z)) +
        ' paces still to go'
      : 'press 6 to load the truck  -  somebody out there is waiting on it',
      W / 2, H * 0.83);
  }

  function drawHud() {
    // ---- CROSSHAIR --------------------------------------------------
    // No crosshair in the cab - you aren't aiming anything, and a sight
    // floating over the trailer just looks like a mistake.
    const mx = W / 2, my = H / 2, gap = 6, arm = 11;
    for (const pass of (driving || flying) ? []
         : [{ w: 4, c: 'rgba(0,0,0,0.5)' }, { w: 1.6, c: '#ffd9a0' }]) {
      ctx.lineWidth = pass.w;
      ctx.strokeStyle = pass.c;
      ctx.beginPath();
      ctx.moveTo(mx - gap - arm, my); ctx.lineTo(mx - gap, my);
      ctx.moveTo(mx + gap, my);       ctx.lineTo(mx + gap + arm, my);
      ctx.moveTo(mx, my - gap - arm); ctx.lineTo(mx, my - gap);
      ctx.moveTo(mx, my + gap);       ctx.lineTo(mx, my + gap + arm);
      ctx.stroke();
    }

    // ---- WHAT THE RIG IS DOING --------------------------------------
    // The RIGHT of the screen already has scrap, kills, the horde timer
    // and the clock on it. Putting the speed there too just stacked
    // numbers on top of numbers, so the driving read-out lives on the
    // LEFT, above your health bar, where there was room all along.
    if (driving) {
      const lx = W * 0.05;

      // SAY WHAT YOU WANT. The canvas remembers textAlign from whatever
      // drew last, and something before us leaves it on 'center' - which
      // centred this text on the left edge and chopped its front off.
      ctx.textAlign = 'left';

      // Speed, and whether it's enough. The whole game in one number:
      // above the line you're a truck, below it you're dinner.
      const fast = Math.abs(rig.speed) >= RAM_SPEED;
      // Label ABOVE the number, not beside it. Side by side, a two-digit
      // speed at 44px ran straight into the "P" of PLOUGHING.
      ctx.font = Math.min(W * 0.026, 16) + 'px system-ui, sans-serif';
      ctx.fillStyle = fast ? '#8fe07a' : '#e08a5c';
      ctx.fillText(fast ? 'PLOUGHING THROUGH' : 'TOO SLOW - THEY CAN GET ON',
                   lx, H - 118);

      ctx.font = 'bold ' + Math.min(W * 0.055, 40) + 'px system-ui, sans-serif';
      ctx.fillStyle = fast ? '#8fe07a' : '#e0a83c';
      ctx.fillText(Math.round(Math.abs(rig.speed)), lx, H - 82);

      // The rig's own health, just under yours - there are two things
      // that can die out here now, and you need to watch both.
      const rw = Math.min(W * 0.28, 260), ry = H - 68;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(lx, ry, rw, 9);
      const rf = rig.health / rig.maxHealth;
      // Green while the mechanic is working on it, so you can see it
      // filling rather than having to watch a number.
      ctx.fillStyle = repairGlow > 0 ? '#8fe07a'
                    : rf > 0.5 ? '#9ec4f0' : rf > 0.25 ? '#e0a83c' : '#d64a3c';
      ctx.fillRect(lx, ry, rw * rf, 9);

      ctx.font = Math.min(W * 0.022, 13) + 'px system-ui, sans-serif';
      ctx.fillStyle = repairGlow > 0 ? '#8fe07a' : 'rgba(255,255,255,0.55)';
      ctx.fillText(Math.round(rig.health) + ' / ' + rig.maxHealth + '  RIG',
                   lx + rw + 8, ry + 9);
    }

    // ---- WHAT THE JET IS DOING ---------------------------------------
    if (flying) {
      const lx = W * 0.05;
      ctx.textAlign = 'left';

      const up = Math.round(jet.y - terrainAt(jet.x, jet.z));
      const off = up > 2;

      ctx.font = Math.min(W * 0.026, 16) + 'px system-ui, sans-serif';
      ctx.fillStyle = off ? '#9ed8ff' : '#e0a83c';
      ctx.fillText(off ? 'AIRBORNE  -  ' + up + ' up' : 'ON THE DIRT  -  throttle up',
                   lx, H - 118);

      ctx.font = 'bold ' + Math.min(W * 0.055, 40) + 'px system-ui, sans-serif';
      ctx.fillStyle = off ? '#9ed8ff' : '#e0a83c';
      ctx.fillText(Math.round(jet.speed), lx, H - 82);

      const rw = Math.min(W * 0.28, 260), ry = H - 68;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(lx, ry, rw, 9);
      const jf = jet.health / jet.maxHealth;
      ctx.fillStyle = repairGlow > 0 ? '#8fe07a'
                    : jf > 0.5 ? '#9ed8ff' : jf > 0.25 ? '#e0a83c' : '#d64a3c';
      ctx.fillRect(lx, ry, rw * jf, 9);

      ctx.font = Math.min(W * 0.022, 13) + 'px system-ui, sans-serif';
      ctx.fillStyle = repairGlow > 0 ? '#8fe07a' : 'rgba(255,255,255,0.55)';
      ctx.fillText(Math.round(jet.health) + ' / ' + jet.maxHealth + '  JET',
                   lx + rw + 8, ry + 9);
    }

    // ---- CLIMB IN THE JET ---------------------------------------------
    if (atJet && !flying && !driving) {
      ctx.textAlign = 'center';
      ctx.font = Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9ed8ff';
      ctx.fillText('E  -  get in the jet', W / 2, H * 0.66);
      ctx.textAlign = 'left';
    }

    // ---- THE MECHANIC HAS YOUR TRUCK ---------------------------------
    if (repairGlow > 0) {
      ctx.textAlign = 'center';
      ctx.font = Math.min(W * 0.034, 21) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(150,235,150,' + repairGlow + ')';
      ctx.fillText(rig.health >= rig.maxHealth
        ? 'THE MECHANIC IS DONE  -  GOOD AS NEW'
        : 'THE MECHANIC IS FIXING THE RIG  -  ' + Math.round(rig.health) +
          ' / ' + rig.maxHealth,
        W / 2, H * 0.61);
      ctx.textAlign = 'left';
    }

    // ---- THE LOAD ----------------------------------------------------
    if (rig.cargo) {
      const far = Math.hypot(rig.cargo.to.x - rig.x, rig.cargo.to.z - rig.z);
      ctx.textAlign = 'center';
      ctx.font = Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd9a0';
      ctx.fillText('HAULING ' + rig.cargo.what + '  -  ' + Math.round(far) +
                   ' paces to ' +
                   (rig.cargo.to.kind === 'fort' ? 'the marine fort' : 'the settlement'),
                   W / 2, 30);
      ctx.textAlign = 'left';
    }

    // ---- WHAT THE RIG WANTED TO TELL YOU -----------------------------
    if (rigSayT > 0) {
      ctx.textAlign = 'center';
      ctx.font = Math.min(W * 0.032, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,225,180,' + Math.min(1, rigSayT) + ')';
      ctx.fillText(rigSay, W / 2, H * 0.72);
      ctx.textAlign = 'left';
    }

    // ---- CLIMB IN ----------------------------------------------------
    if (atRig && !driving) {
      ctx.textAlign = 'center';
      ctx.font = Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9ec4f0';
      ctx.fillText('E  -  get in the rig', W / 2, H * 0.66);
      ctx.textAlign = 'left';
    }

    // ---- HEALTH -----------------------------------------------------
    const bw = Math.min(W * 0.28, 260), bx = W * 0.05, by = H - 46;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 16);

    const frac = player.health / player.maxHealth;
    ctx.fillStyle = frac > 0.5 ? '#7fc45c' : frac > 0.25 ? '#e0a83c' : '#d64a3c';
    ctx.fillRect(bx, by, bw * frac, 16);

    // Wearing marine armour? The bar gets a steel-blue case around it,
    // so you can always see you've got it on.
    ctx.strokeStyle = player.marineArmour ? '#8fb8e8' : 'rgba(255,255,255,0.3)';
    ctx.lineWidth = player.marineArmour ? 2.5 : 1;
    ctx.strokeRect(bx, by, bw, 16);

    ctx.textAlign = 'left';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillStyle = '#e8dcc8';
    ctx.fillText(Math.ceil(player.health) + ' HP' +
                 (player.marineArmour ? '  +  MARINE ARMOUR' : ''),
                 bx, by - 6);

    // ---- KILLS AND TIME ---------------------------------------------
    // On a phone the FIRE and JUMP buttons live in this exact corner,
    // and the score was printing straight through them - both unreadable.
    // So the whole column shifts left of the buttons when there are
    // buttons to shift left of. Worked out from the button's own size
    // rather than a guessed number, so it stays clear on any screen.
    const RX = touchMode
      ? W - Math.min(W, H) * 0.115 * 2.9
      : W * 0.95;

    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.05, 30) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd9a0';
    ctx.fillText(player.kills, RX, H - 46);

    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = '#b8a68c';
    ctx.fillText('KILLS', RX, H - 28);

    ctx.fillStyle = '#a8e4ff';
    ctx.fillText(player.scrap + ' scrap', RX, H - 94);
    ctx.fillText(Math.floor(clock) + 's survived on ' + PLANETS[planetIx].name,
                 RX, H - 62);

    // ---- WHEN'S THE NEXT ONE? ----------------------------------------
    // Worth showing now they come every half a minute. It turns "run
    // around and hope" into a decision: can I get to that beacon before
    // the next lot arrive, or do I hold here?
    if (state === 'play') {
      const soon = hordeTimer < 8;
      ctx.fillStyle = soon ? '#ff8a6a' : '#8c7c66';
      ctx.fillText(soon
        ? 'HORDE IN ' + Math.ceil(hordeTimer)
        : 'next horde ' + Math.ceil(hordeTimer) + 's', RX, H - 78);
    }

    if (state === 'board') { drawBoardScreen(); return; }

    if (state === 'play') drawMiniMap();

    // ---- THE JOB YOU'RE ON --------------------------------------------
    if (quest && state === 'play') {
      ctx.textAlign = 'left';
      ctx.font = 'bold ' + Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd9a0';
      ctx.fillText(questLine(quest), W * 0.05, H * 0.075);

      const bw = Math.min(W * 0.24, 220), bx = W * 0.05, by = H * 0.09;
      const frac = Math.min(1, quest.count / quest.target);

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx, by, bw, 9);
      ctx.fillStyle = '#e0a83c';
      ctx.fillRect(bx, by, bw * frac, 9);

      ctx.font = Math.min(W * 0.026, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#cbb894';
      ctx.fillText(quest.count + ' / ' + quest.target, bx + bw + 8, by + 9);
    }

    if (questFlash > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.04, 26) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(150,230,130,' + Math.min(1, questFlash) + ')';
      ctx.fillText(questWord, W / 2, H * 0.42);
    }

    if (state === 'play') {
      // One hint line, bottom-middle. Whatever you're stood at gets it.
      let hint = null;
      if (atBoard) {
        hint = touchMode ? 'TAP HERE FOR JOBS' : 'PRESS E FOR JOBS';
      } else if (nearRecruit) {
        hint = squadSize() >= MARINE_MAX
          ? 'ARMY FULL  -  twelve marines is an army'
          : (touchMode ? 'TAP HERE TO RECRUIT THE MARINE'
                       : 'PRESS E TO RECRUIT THE MARINE');
      } else if (atGear) {
        const name = atGear.kind === 'rifle' ? 'MARINE RIFLE' : 'MARINE ARMOUR';
        hint = player.scrap < atGear.cost
          ? name + '  -  need ' + atGear.cost + ' scrap, you have ' + player.scrap
          : (touchMode ? 'TAP HERE TO TAKE THE ' : 'PRESS E TO TAKE THE ') +
            name + '  -  ' + atGear.cost + ' scrap';
      } else if (atPad) {
        hint = touchMode ? 'TAP HERE TO LAUNCH INTO SPACE'
                         : 'PRESS E TO LAUNCH INTO SPACE';
      } else if (atRadio) {
        if (squadSize() >= MARINE_MAX)      hint = 'ARMY FULL  -  twelve marines is an army';
        else if (clock < atRadio.podReadyAt) {
          hint = 'TOWER RECHARGING  -  ' +
                 Math.ceil(atRadio.podReadyAt - clock) + 's';
        } else {
          hint = touchMode ? 'TAP HERE TO CALL A DROP POD'
                           : 'PRESS E TO CALL A DROP POD';
        }
      }

      // ---- AND THE SECOND LINE: THE KILL RIG --------------------------
      // Its own line under the pod one, because the tower does two
      // separate things and squeezing both into one sentence would
      // hide whichever you weren't thinking about.
      if (atRadio) {
        let line2;
        if (others.some(function (q) { return q.side === 'kill'; })) {
          line2 = 'A KILL RIG IS ALREADY OUT THERE';
        } else if (clock < (atRadio.killReadyAt || 0)) {
          line2 = 'KILL RIG UNAVAILABLE  -  ' +
                  Math.ceil(atRadio.killReadyAt - clock) + 's';
        } else {
          line2 = touchMode ? 'TAP LOW TO CALL A KILL RIG'
                            : 'PRESS R TO CALL A KILL RIG';
        }
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + Math.min(W * 0.030, 19) + 'px system-ui, sans-serif';
        ctx.fillStyle = canCallKillRig(atRadio) ? '#9ed8ff' : 'rgba(158,216,255,0.45)';
        ctx.fillText(line2, W / 2, H * 0.68);
        ctx.textAlign = 'left';
      }

      if (hint) {
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + Math.min(W * 0.034, 21) + 'px system-ui, sans-serif';
        ctx.fillStyle = '#ffd9a0';
        ctx.fillText(hint, W / 2, H * 0.63);
      }
    }

    // ---- HEALTH BARS OVER THE BIG ONES -------------------------------
    // Fifty hits is eight seconds of shooting. Without a bar you have
    // no idea whether you're winning or wasting your time, and eight
    // seconds of not knowing is long enough to give up and run.
    //
    // project() is the same function that puts the whole 3D world on
    // screen - we just ask it where the giant's head lands and paint a
    // flat bar there. 3D thing, 2D bar, one shared answer.
    if (state === 'play') {
      for (const e of enemies) {
        if (e.dead || !e.k.big) continue;

        const away = e.away || Math.hypot(e.x - player.x, e.z - player.z);
        if (away > 150) continue;

        const s = project(e.x, e.k.height * 1.15, e.z);
        if (s.depth < 2) continue;                 // behind you
        if (s.x < -60 || s.x > W + 60) continue;   // off the side

        const bw = Math.max(40, 2400 / away);
        const bh = Math.max(5, bw * 0.10);
        const frac = Math.max(0, e.hp / e.k.hp);

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(s.x - bw / 2, s.y, bw, bh);

        ctx.fillStyle = frac > 0.5 ? '#8fd45c' : frac > 0.22 ? '#e0a83c' : '#e04a3c';
        ctx.fillRect(s.x - bw / 2, s.y, bw * frac, bh);

        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 1;
        ctx.strokeRect(s.x - bw / 2, s.y, bw, bh);

        if (away < 70) {
          ctx.textAlign = 'center';
          ctx.font = 'bold 12px system-ui, sans-serif';
          ctx.fillStyle = '#ffd9a0';
          ctx.fillText((e.k.name || 'GIANT') + '  ' + Math.ceil(e.hp),
                       s.x, s.y - 5);
        }
      }
    }

    // ---- A HORDE IS COMING -------------------------------------------
    if (hordeWarn > 0 && state === 'play') {
      const beat = 0.55 + Math.sin(clock * 7) * 0.45;

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.08, 52) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, hordeWarn) + ')';
      ctx.fillText('HORDE', W / 2 + 4, H * 0.30 + 4);
      ctx.fillStyle = 'rgba(255,' + (70 + 60 * beat | 0) + ',50,' +
                      Math.min(1, hordeWarn) + ')';
      ctx.fillText('HORDE', W / 2, H * 0.30);

      ctx.font = Math.min(W * 0.034, 21) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,210,180,' + Math.min(1, hordeWarn) + ')';
      ctx.fillText(hordeSize + ' of them, on the horizon' +
                   (hordeBoss ? '  -  and something TERRIBLE' :
                    hordeGiants ? '  -  and something big' : '') +
                   '  -  find a settlement',
                   W / 2, H * 0.355);
    }

    // ---- ARE YOU AT A SETTLEMENT? ------------------------------------
    // Walk close enough and it tells you how many people are in there.
    const camp = nearestSettlement();
    if (camp) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.038, 23) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd9a0';
      ctx.fillText('SETTLEMENT', W / 2, H * 0.085);

      ctx.font = Math.min(W * 0.03, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#cbb894';
      ctx.fillText(camp.souls + ' people inside  -  the guards will cover you',
                   W / 2, H * 0.12);

      if (healing) {
        // Pulsing, because a still line of text next to a health bar
        // creeping up by ten a second is easy to miss when something is
        // trying to eat you.
        const beat = 0.6 + Math.sin(clock * 6) * 0.4;
        ctx.font = 'bold ' + Math.min(W * 0.036, 22) + 'px system-ui, sans-serif';
        ctx.fillStyle = 'rgba(140,240,150,' + beat + ')';
        ctx.fillText('+' + HEAL_RATE + ' HEALTH A SECOND', W / 2, H * 0.155);
      }
    }

    // ---- BEING PATCHED UP ---------------------------------------------
    // Green from the edges - the exact opposite of the red you get when
    // something bites you, so the two can never be confused.
    if (healGlow > 0.01) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.34,
                                         W / 2, H / 2, H * 0.85);
      g.addColorStop(0, 'rgba(60,190,90,0)');
      g.addColorStop(1, 'rgba(60,190,90,' + (healGlow * 0.34) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- GETTING HURT ------------------------------------------------
    if (player.hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28,
                                         W / 2, H / 2, H * 0.8);
      g.addColorStop(0, 'rgba(150,10,10,0)');
      g.addColorStop(1, 'rgba(150,10,10,' + (player.hurtFlash * 0.85) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // ---- CLICK TO PLAY ------------------------------------------------
    if (!locked && !touchMode && state === 'play') {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.045, 28) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffd9a0';
      ctx.fillText('CLICK TO LOOK AROUND', W / 2, H * 0.62);
    }

    // ---- DEAD ---------------------------------------------------------
    if (state === 'dead') {
      ctx.fillStyle = 'rgba(60,6,6,' + Math.min(0.72, deadTimer * 0.8) + ')';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.12, 84) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#000';
      ctx.fillText('THEY GOT YOU', W / 2 + 4, H * 0.42 + 4);
      ctx.fillStyle = '#ffb08a';
      ctx.fillText('THEY GOT YOU', W / 2, H * 0.42);

      ctx.font = Math.min(W * 0.035, 21) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#f0e2ce';
      ctx.fillText(player.kills + ' put down in ' + Math.floor(clock) + ' seconds',
                   W / 2, H * 0.53);
      ctx.fillText(touchMode ? 'tap anywhere to go again'
                             : 'press R or click to go again',
                   W / 2, H * 0.60);
    }
  }

// -------------------------------------------------------------------
//  DRIVING
// -------------------------------------------------------------------

  // Climbing in and out. The seat is just a flag - everything else in
  // the game keeps running exactly as it did, it only reads this flag
  // to decide whether to move your boots or the truck.
  // The help bar at the bottom of the screen has to say the truth about
  // whichever set of controls you're actually using right now.
  const HELP_FOOT  = 'MOUSE = look &nbsp;&nbsp; W A S D = move &nbsp;&nbsp; ' +
                     'CLICK = shoot &nbsp;&nbsp; SHIFT = run &nbsp;&nbsp; E = drive';
  const HELP_DRIVE = 'W = throttle &nbsp;&nbsp; S = brake / reverse &nbsp;&nbsp; ' +
                     'MOUSE = the wheel &nbsp;&nbsp; A D = steer too &nbsp;&nbsp; E = get out';

  const HELP_FLY = 'W = throttle (and it CLIMBS) &nbsp;&nbsp; S = slow down to land ' +
                   '&nbsp;&nbsp; MOUSE = the stick &nbsp;&nbsp; E = get out';

  function setHelp() {
    const el = document.getElementById('hud');
    if (el) el.innerHTML = flying ? HELP_FLY : driving ? HELP_DRIVE : HELP_FOOT;
  }

  function enterRig() {
    driving = true;
    mouseSteer = 0;
    player.pitch = 0;          // eyes level with the road, not the sky
    setHelp();
    say('IN THE CAB  -  W to pull away,  E to get out');
  }

  // GETTING OUT PUTS THE WASTELAND BACK EXACTLY AS IT WAS.
  //
  // Everything the cab changed has to be handed back here: the truck is
  // parked, the engine goes quiet, your boots are on real ground, and
  // you are stood somewhere you can actually stand. Miss any one of
  // those and it isn't "the same as the first wasteland" any more - it's
  // the wasteland with a bug in it.
  function exitRig() {
    driving = false;

    // HANDBRAKE. Left rolling, the truck would keep whatever speed it
    // had forever - frozen mid-move, because nothing updates it now.
    rig.speed = 0;
    rig.steer = 0;

    // ---- SOMEWHERE YOU CAN ACTUALLY STAND -----------------------------
    // Always stepping out of the left door drops you inside a wall if
    // you happened to park against one. So try the doors in order and
    // take the first one that's clear: left, right, behind, in front.
    const co = Math.cos(rig.yaw), si = Math.sin(rig.yaw);
    // Out beside the CAB, and far enough back that the trailer isn't
    // filling your whole view. Seven paces from the middle of a
    // nineteen-pace lorry left you nose-to-paint with your own load.
    const doors = [
      [ co * 11 + si * 3, -si * 11 + co * 3],   // left door
      [-co * 11 + si * 3,  si * 11 + co * 3],   // right door
      [-si * 17, -co * 17],                     // out the back
      [ si * 15,  co * 15]                      // over the bonnet
    ];

    let put = false;
    for (const d of doors) {
      const tx = rig.x + d[0], tz = rig.z + d[1];
      if (!blockedAt(tx, tz, PLAYER_R)) {
        player.x = tx; player.z = tz;
        put = true;
        break;
      }
    }
    // Every door blocked? Stand you on the truck itself rather than
    // inside a wall - pushOutOfWalls will sort it from there.
    if (!put) { player.x = rig.x; player.z = rig.z; pushOutOfWalls(); }

    // Boots back on the ground, not still falling from wherever the
    // truck was, and no leftover jump.
    player.feetY = terrainAt(player.x, player.z);
    player.vy = 0;
    jumpQueued = false;
    player.yaw = rig.yaw;
    player.pitch = 0;

    mouseSteer = 0;
    updateEngineNote();      // and the engine shuts up
    setHelp();
    say('OUT ON FOOT');
  }

  function say(words) { rigSay = words; rigSayT = 3.2; }
