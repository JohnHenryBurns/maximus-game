  // THE CONTROLS. ONE COPY, FOR EVERYTHING YOU CAN CLIMB INTO.
  //
  // Maximus asked for the jet to fly exactly the way the truck drives.
  // The way to be SURE of that is not to write it twice carefully - it's
  // to write it once and have both call it. Then they can't drift apart,
  // ever, however much either vehicle changes afterwards.
  //
  //   v    - anything with speed, steer and yaw
  //   top  - how fast this one goes flat out
  //   low  - how far it'll go backwards (0 for things that can't)
  function driveControls(v, top, low, dt) {
    // ---- THE SAME CONTROLS, WITH A THUMB ------------------------------
    // Push the stick forward for the throttle, back for the brake, and
    // sideways to steer - and the sideways part feeds the SAME
    // mouseSteer the mouse does, so the wheel fights a thumb back
    // exactly as hard as it fights a mouse. One driving model.
    pedalGo = pedalBrake = false;
    if (stick.on && stick.push > 0.06) {
      const sy = -stick.dy / STICK_MAX, sx = stick.dx / STICK_MAX;
      if (sy >  0.25) pedalGo    = true;
      if (sy < -0.25) pedalBrake = true;
      mouseSteer = clamp(mouseSteer + sx * 3.2 * dt, -1, 1);
    }

    // ---- THE PEDALS ---------------------------------------------------
    // The racer's rules exactly: throttle adds, brake takes away, and
    // with your foot off nothing at all you coast down on DRAG.
    const goPedal    = keys['w'] || keys['arrowup']   || pedalGo;
    const brakePedal = keys['s'] || keys['arrowdown'] || pedalBrake;

    if (goPedal)         v.speed += ACCEL * dt;
    else if (brakePedal) v.speed -= BRAKE * dt;
    else {
      // Coast to a stop from either direction - the racer only ever
      // rolls forwards, but this one can be backing out of a wreck.
      const slow = DRAG * dt;
      if (Math.abs(v.speed) < slow) v.speed = 0;
      else v.speed -= Math.sign(v.speed) * slow;
    }
    v.speed = clamp(v.speed, low, top);

    // ---- THE WHEEL FIGHTS BACK ----------------------------------------
    // Two things make it heavy, and they multiply together:
    //
    //   1. HOW FAR ROUND IT IS. Near straight it barely resists. At
    //      full lock it's shoving hard. So little corrections stay
    //      easy and big ones have to be held.
    //
    //   2. HOW FAST YOU'RE GOING. Standing still it's light; flat out
    //      it's heavy.
    const heavy = 1 + Math.abs(mouseSteer) * MOUSE_HEAVY;
    const grip  = 0.5 + (Math.abs(v.speed) / top) * MOUSE_GRIP;

    mouseSteer -= mouseSteer * Math.min(1, MOUSE_RETURN * heavy * grip * dt);

    let want = mouseSteer;
    if (keys['a'] || keys['arrowleft'])  want -= 1;
    if (keys['d'] || keys['arrowright']) want += 1;
    want = clamp(want, -1, 1);

    // And the wheel itself is heavier to turn than it is to let go of.
    const windSpeed = (want === 0) ? 6 : 2.8;
    v.steer += (want - v.steer) * Math.min(1, windSpeed * dt);

    // ---- TURNING ------------------------------------------------------
    // Multiplying by speed is the important part. Standing still you
    // can't turn at all, which is exactly right - a truck turns because
    // it's MOVING, not because the wheel is round. A jet is the same:
    // parked on the dirt, the stick does nothing.
    v.yaw += v.steer * 1.5 * (v.speed / top) * dt;
  }

  function updateRig(dt) {
    // ---- THE SAME CONTROLS, WITH A THUMB ------------------------------
    // Push the stick forward for the throttle, back for the brake, and
    // sideways to steer - and the sideways part feeds the SAME
    // mouseSteer the mouse does, so the wheel fights a thumb back
    // exactly as hard as it fights a mouse. One driving model.
    pedalGo = pedalBrake = false;
    if (stick.on && stick.push > 0.06) {
      const sy = -stick.dy / STICK_MAX, sx = stick.dx / STICK_MAX;
      if (sy >  0.25) pedalGo    = true;
      if (sy < -0.25) pedalBrake = true;
      mouseSteer = clamp(mouseSteer + sx * 3.2 * dt, -1, 1);
    }

    driveControls(rig, TOP_SPEED, -REVERSE, dt);

    // ---- ACTUALLY MOVING ----------------------------------------------
    const nx = rig.x + Math.sin(rig.yaw) * rig.speed * dt;
    const nz = rig.z + Math.cos(rig.yaw) * rig.speed * dt;

    // A truck is wider than a person, so it needs more room than PLAYER_R.
    //
    // SLIDING, not stopping. The first version just killed your speed
    // whenever anything was in the way - which meant the moment you
    // touched a wall head-on you were WEDGED THERE FOREVER: the throttle
    // built up a little speed, that speed put you back into the wall,
    // and it got killed again, every frame, for as long as you tried.
    //
    // So: try the whole move, and if that's blocked try one direction at
    // a time. Whichever half is clear still happens, and you scrape
    // along the wall instead of welding yourself to it. Same three lines
    // that stop you sticking to walls on foot.
    const R = RIG_HALF_W + 1.5;
    if (!blockedAt(nx, nz, R)) {
      rig.x = nx; rig.z = nz;
    } else {
      const slideX = !blockedAt(nx, rig.z, R);
      const slideZ = !blockedAt(rig.x, nz, R);
      if (slideX) rig.x = nx;
      if (slideZ) rig.z = nz;

      // A real head-on hit: nothing was clear. That's the one that
      // dents the rig - and it costs you most of your speed, not all
      // of it, so you can always reverse back out.
      if (!slideX && !slideZ) {
        if (Math.abs(rig.speed) > 18 && rig.bumpCool <= 0) {
          hurtRig(Math.abs(rig.speed) * 0.3);
          shake = Math.max(shake, 0.7);
          crunch();
          rig.bumpCool = 0.5;      // one crunch per hit, not sixty
        }
        // A DEFINITE SHOVE BACKWARDS, not a fraction of what you had.
        // Multiplying the speed instead left it buzzing against the
        // obstacle: the throttle added a little, the wall took it away,
        // over and over, and the truck never actually backed off. Now
        // it physically comes off the thing it hit, so you're never
        // welded to a wreck wondering what you did wrong.
        rig.speed = -Math.max(4, Math.min(9, Math.abs(rig.speed) * 0.3));
      } else {
        rig.speed *= 0.94;         // scraping down the side slows you a bit
      }
    }
    if (rig.bumpCool > 0) rig.bumpCool -= dt;

    // The driver rides along with the truck, so getting out, dying, and
    // every distance check in the game still works without a special case.
    player.x = rig.x;
    player.z = rig.z;
    player.feetY = terrainAt(rig.x, rig.z);

    runThemDown(dt);
    if (rig.ramFlash > 0) rig.ramFlash -= dt * 2.4;

    aimCamera(dt);
    updateEngineNote();
  }

  // WHAT THE BULL BARS ARE TOUCHING.
  //
  // Every zombie gets turned into the RIG'S own directions - "how far
  // in front of me" and "how far off to my side" - instead of north
  // and east. Once you're in the truck's frame the test is just a
  // rectangle, which is two comparisons, however the truck is pointing.
  function runThemDown(dt) {
    const co = Math.cos(rig.yaw), si = Math.sin(rig.yaw);

    for (const z of enemies) {
      if (z.dead) continue;
      const dx = z.x - rig.x, dz = z.z - rig.z;
      if (Math.abs(dx) > 24 || Math.abs(dz) > 24) continue;   // cheap reject

      const along  = dx * si + dz * co;
      const across = dx * co - dz * si;

      const wide = RIG_HALF_W + (z.k.radius || 1.4);
      if (across < -wide || across > wide) continue;
      if (along < -9 || along > RIG_NOSE) continue;

      if (Math.abs(rig.speed) >= RAM_SPEED) {
        // SPEED IS ARMOUR. Straight through.
        killEnemy(z);
        rig.kills++;
        rig.ramFlash = 1;
        // ...but each one costs you a little speed, and enough of them
        // will drag you back under the line while you're still in the
        // middle of the crowd. That is the trap.
        rig.speed *= (z.k.hp > 40 ? 0.86 : 0.985);
        thud();
      } else if (z.cool <= 0) {
        // TOO SLOW. They get hold of you.
        z.cool = 1.1;
        hurtRig(6);
      }
    }
  }

  function hurtRig(amount) {
    rig.health -= amount;
    shake = Math.max(shake, 0.4);
    if (rig.health <= 0) {
      rig.health = 0;
      rig.speed = 0;
      exitRig();
      say('THE RIG IS DEAD  -  you are walking now');
    }
  }

  // IN THE CAB, LOOKING OUT.
  //
  // Your eye sits just in FRONT of the windscreen glass, up where a
  // lorry driver's head actually is. Put it behind the glass and the
  // windscreen - which is a solid box like everything else in this
  // game - fills the whole screen with blue.
  //
  // From here you can see your own bonnet and the bull bars below you,
  // which is exactly what tells you where the front of the truck is.
  // WHERE THE DRIVER'S HEAD IS. Properly in the seat, behind the glass
  // - the cab box and windscreen simply aren't drawn while you're in
  // there, so there's nothing to see through.
  //
  // Pushing the eye out in FRONT of the cab instead was the first try,
  // and it worked right up until you noticed the whole lorry had
  // vanished: from out there your own bonnet is entirely below the
  // bottom of the screen, and you're a camera flying over the dirt.
  const EYE_ALONG  = 2.2;    // sat in the seat
  const EYE_UP     = 5.3;    // high up, like a lorry
  const EYE_ACROSS = -1.3;   // the driver's side, not the middle

  function aimCamera(dt) {
    const co = Math.cos(rig.yaw), si = Math.sin(rig.yaw);

    // No lag and no smoothing - your head is bolted to the cab, so the
    // world turns the instant the truck does. That IS first person.
    cam.x = rig.x + EYE_ACROSS * co + EYE_ALONG * si;
    cam.z = rig.z - EYE_ACROSS * si + EYE_ALONG * co;

    // A shudder that grows with speed. Sat still it's dead steady; flat
    // out the cab shakes, and that does more for how fast 60 FEELS than
    // any number on the screen.
    const rough = Math.abs(rig.speed) / TOP_SPEED;
    cam.y = terrainAt(rig.x, rig.z) + EYE_UP
          + Math.sin(clock * 26) * rough * 0.16
          + Math.sin(clock * 11) * rough * 0.10;

    // You look where the truck is pointed, same as the racer. The mouse
    // is the wheel now, so there is no separate "look" to add on - and
    // if there were, the window and the wheel could disagree, which is
    // how you drive into a tower without noticing.
    cam.yaw   = rig.yaw;
    cam.pitch = -0.02;
  }


// -------------------------------------------------------------------
//  THE JET
// -------------------------------------------------------------------
//
//  Same controls as the truck - literally the same function - but it
//  leaves the ground.
//
//  AND THAT'S THE CLEVER BIT: there is no extra climb button, because
//  driving hasn't got one. YOUR SPEED IS YOUR HEIGHT. Open the throttle
//  and it lifts; ease off and it settles back onto the dirt. Two
//  controls, exactly like the truck, and landing is just slowing down.

  const JET_TOP    = 190;    // a jet is a jet
  const JET_LIFT   = 34;     // how fast it climbs to where it wants to be
  const JET_CEIL   = 95;     // how high it rides flat out
  const JET_FLY    = 55;     // below this it comes down and lands
  const JET_HP     = 800;

  const jet = {
    x: 26, z: -34, y: 0, yaw: 0,
    speed: 0, steer: 0,
    health: JET_HP, maxHealth: JET_HP,
    kills: 0, hitCool: 0, ramFlash: 0
  };

  let flying = false;
  let atJet  = null;

  function enterJet() {
    flying = true;
    mouseSteer = 0;
    player.pitch = 0;
    setHelp();
    say('IN THE JET  -  throttle up to leave the ground');
  }

  function exitJet() {
    flying = false;
    jet.speed = 0;

    // Stepping out at four hundred feet would be a very short game, so
    // you come down with it - the jet settles and you climb out.
    jet.y = terrainAt(jet.x, jet.z);

    const co = Math.cos(jet.yaw), si = Math.sin(jet.yaw);
    const doors = [[co * 14, -si * 14], [-co * 14, si * 14],
                   [-si * 20, -co * 20], [si * 20, co * 20]];
    let put = false;
    for (const d of doors) {
      const tx = jet.x + d[0], tz = jet.z + d[1];
      if (!blockedAt(tx, tz, PLAYER_R)) { player.x = tx; player.z = tz; put = true; break; }
    }
    if (!put) { player.x = jet.x; player.z = jet.z; pushOutOfWalls(); }

    player.feetY = terrainAt(player.x, player.z);
    player.vy = 0;
    jumpQueued = false;
    player.yaw = jet.yaw;
    player.pitch = 0;
    mouseSteer = 0;
    setHelp();
    say('OUT ON FOOT');
  }

  function updateJet(dt) {
    // The truck's controls. Not "the same as" - the same code.
    // A jet has no reverse gear, so its floor is zero.
    driveControls(jet, JET_TOP, 0, dt);

    // ---- HEIGHT COMES FROM SPEED --------------------------------------
    const ground = terrainAt(jet.x, jet.z);
    const fast   = Math.max(0, jet.speed - JET_FLY) / (JET_TOP - JET_FLY);
    const wantY  = ground + fast * JET_CEIL;
    jet.y += (wantY - jet.y) * Math.min(1, JET_LIFT / 34 * dt * 1.6);

    const airborne = jet.y > ground + 2;

    // ---- MOVING --------------------------------------------------------
    const nx = jet.x + Math.sin(jet.yaw) * jet.speed * dt;
    const nz = jet.z + Math.cos(jet.yaw) * jet.speed * dt;

    // UP IN THE AIR NOTHING IS IN THE WAY. That's the whole point of
    // flying, and it's one line: only ask about walls when you're low
    // enough for walls to matter.
    if (airborne || !blockedAt(nx, nz, 4)) {
      jet.x = nx; jet.z = nz;
    } else {
      if (Math.abs(jet.speed) > 30 && jet.hitCool <= 0) {
        hurtJet(Math.abs(jet.speed) * 0.4);
        jet.hitCool = 0.5;
        shake = Math.max(shake, 1);
        crunch();
      }
      jet.speed *= 0.2;
    }
    if (jet.hitCool > 0) jet.hitCool -= dt;
    if (jet.ramFlash > 0) jet.ramFlash -= dt * 2.4;

    // The pilot rides with it, so every distance check in the game -
    // spawning, hordes, settlements, the mechanic - still works with no
    // special case for "but he's in the sky".
    player.x = jet.x;
    player.z = jet.z;
    player.feetY = jet.y;

    // ---- ANYTHING ON THE RUNWAY ---------------------------------------
    // Low and fast is a strafing run. High up you fly straight over
    // their heads, which is exactly what you'd expect.
    if (!airborne && jet.speed >= RAM_SPEED) {
      const co = Math.cos(jet.yaw), si = Math.sin(jet.yaw);
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - jet.x, dz = e.z - jet.z;
        if (Math.abs(dx) > 26 || Math.abs(dz) > 26) continue;
        const along  = dx * si + dz * co;
        const across = dx * co - dz * si;
        if (across < -7 || across > 7) continue;      // the wings are wide
        if (along < -6 || along > 11) continue;
        killEnemy(e);
        jet.kills++;
        jet.ramFlash = 1;
        thud();
      }
    }

    aimJetCamera(dt);
    updateEngineNote();
  }

  function hurtJet(amount) {
    jet.health -= amount;
    shake = Math.max(shake, 0.5);
    if (jet.health <= 0) {
      jet.health = 0;
      burst(jet.x, jet.y + 3, jet.z, [[150, 90, 40], [70, 66, 62]], 50, 30);
      exitJet();
      say('THE JET IS DOWN  -  you are walking now');
    }
  }

  // Sat in the cockpit, up at the front where the glass is.
  function aimJetCamera(dt) {
    const co = Math.cos(jet.yaw), si = Math.sin(jet.yaw);
    // ON TOP OF THE FUSELAGE, not inside it. The body box reaches up to
    // 3.1 and the eye was at 3.0 - so the camera sat INSIDE its own
    // aeroplane and the screen was a grey slab. Same mistake as the
    // truck's cab, and the same tell: a wall of one flat colour.
    cam.x = jet.x + 6.5 * si;
    cam.z = jet.z + 6.5 * co;

    const rough = jet.speed / JET_TOP;
    cam.y = jet.y + 4.3 + Math.sin(clock * 24) * rough * 0.12;

    cam.yaw = jet.yaw;
    // Look down a touch, so you can see the ground going past. Flat out
    // there's nothing but sky and it stops feeling like speed at all.
    cam.pitch = -0.10 - rough * 0.06;
  }

  const JET_BODY = [122, 130, 138], JET_DARK = [78, 86, 96];
  const JET_GLASS = [96, 150, 180], JET_BURN = [255, 170, 80];

  function drawJet() {
    const co = Math.cos(jet.yaw), si = Math.sin(jet.yaw);
    function part(across, up, along, w, h, d, rgb) {
      addBox(jet.x + across * co + along * si, jet.y + up,
             jet.z - across * si + along * co, w, h, d, rgb, jet.yaw);
    }

    const hurt = 1 - (1 - jet.health / jet.maxHealth) * 0.5;

    // Nose and body. The cockpit glass isn't drawn while you're sat
    // inside it, same reason as the truck's cab.
    part(0, 2.0, 2.0, 3.4, 2.2, 17.0, shade(JET_BODY, hurt));
    part(0, 2.0, 10.4, 1.8, 1.4, 4.0, shade(JET_BODY, hurt));      // nose cone
    if (!flying) part(0, 3.4, 5.2, 2.4, 1.4, 4.4, JET_GLASS);

    // Delta wings - wide, so a low pass sweeps a proper swathe.
    for (const s of [-1, 1]) {
      part(s * 5.6, 1.9, -1.0, 8.0, 0.7, 7.0, shade(JET_DARK, hurt));
      part(s * 9.2, 1.9, -3.0, 2.0, 0.6, 3.0, shade(JET_DARK, hurt));
      part(s * 3.0, 1.2, -2.0, 1.6, 1.6, 5.0, JET_DARK);           // engine pod
    }

    // Tail fins.
    part(0, 4.4, -7.4, 0.6, 4.0, 4.0, shade(JET_DARK, hurt));
    for (const s of [-1, 1]) part(s * 2.6, 2.0, -7.6, 4.0, 0.6, 3.0, shade(JET_DARK, hurt));

    // AFTERBURNERS. They grow with the throttle, so how hard you're
    // pushing is something you can SEE out of the back.
    const burn = Math.max(0, jet.speed / JET_TOP);
    if (burn > 0.05) {
      for (const s of [-3.0, 3.0]) {
        part(s, 1.2, -5.0 - burn * 2.2, 1.3, 1.3, 1.0 + burn * 5.0,
             burn > 0.6 ? [255, 240, 200] : JET_BURN);
      }
    }

    // Undercarriage, down only when it's actually on the ground.
    if (jet.y <= terrainAt(jet.x, jet.z) + 2.2) {
      for (const p of [[0, 8.0], [-3.4, -2.0], [3.4, -2.0]]) {
        part(p[0], 0.5, p[1], 0.7, 1.6, 0.7, JET_DARK);
      }
    }
  }


// -------------------------------------------------------------------
//  OTHER TRUCKS ON THE ROAD
// -------------------------------------------------------------------
//
//  MARINE RIGS come out of the forts. They hunt zombies, they'll take
//  on a zombie rig, and they leave you alone - a friendly pair of
//  headlights on the horizon.
//
//  ZOMBIE RIGS hunt YOU. The dead got hold of a lorry, welded spikes on
//  the front, and worked out what a steering wheel does. They ram.
//
//  Both drive with the same code and the same rules you do. The only
//  difference is what they're pointed at, which is one line each.

  // -----------------------------------------------------------------
  //  THE KILL RIG
  // -----------------------------------------------------------------
  //  Two giant tractors side by side, hauling a platform the size of a
  //  house on eight wheels, with up to ten marines stood on it firing
  //  off the sides. A moving wall. It comes out of the marine forts and
  //  it does not stop for anything.
  const KILL_HP      = 2600;
  const KILL_HALF_W  = 11.0;    // how wide the platform flattens
  const KILL_NOSE    = 26;      // how far in front the bull bars reach
  const KILL_CREW    = 10;      // marines aboard - Maximus picked the number
  const KILL_REACH   = 105;     // how far the crew can shoot
  const KILL_HURT    = 3;
  const KILL_COOL    = 0.55;    // seconds between each marine's shots
  const KILL_TOP     = 0.42;    // how fast, as a share of your top speed

  const OTHER_MAX     = 4;      // never more than this on the map at once
  const OTHER_SEE     = 300;    // how far they can pick a target
  const RAM_DAMAGE    = 0.9;    // damage per unit of closing speed
  const MARINE_RIG_HP = 220;
  const ZOMBIE_RIG_HP = 260;

  let others = [];
  let otherTimer = 22;

  function makeOther(side, x, z, yaw) {
    const hp = side === 'kill'   ? KILL_HP
             : side === 'marine' ? MARINE_RIG_HP : ZOMBIE_RIG_HP;
    const o = {
      side: side,                       // 'marine', 'zombie' or 'kill'
      x: x, z: z, yaw: yaw,
      speed: 20, steer: 0,
      health: hp, maxHealth: hp,
      ramFlash: 0, hitCool: 0, kills: 0,
      runT: 0, runYaw: 0, lock: null, lockT: 0
    };

    // THE CREW. Ten of them, each with their own trigger finger, so
    // they don't all fire on the same beat like one big gun.
    if (side === 'kill') {
      o.crew = [];
      for (let i = 0; i < KILL_CREW; i++) {
        o.crew.push({
          // Five down each side of the platform, facing outwards.
          //
          // The deck runs from -31 to +3 along. Spacing them 9.5 apart
          // from -20 put the front two of each row at +8.5 and +18 -
          // out past the end of the platform, stood on nothing, firing
          // from mid-air above the drawbar. These numbers keep all ten
          // of them on the boards.
          across: (i < 5 ? -1 : 1) * 7.4,
          along:  -28 + (i % 5) * 7.0,
          side:   (i < 5 ? -1 : 1),
          yaw: 0, cool: Math.random() * KILL_COOL, flash: 0, bob: Math.random() * 6
        });
      }
    }
    return o;
  }

  // WHERE A CREWMAN IS STANDING, in the world. One function, so the
  // marine you SEE and the marine that SHOOTS are in the same place -
  // otherwise tracers come out of thin air beside the platform.
  function crewSpot(o, c) {
    const co = Math.cos(o.yaw), si = Math.sin(o.yaw);
    return { x: o.x + c.across * co + c.along * si,
             z: o.z - c.across * si + c.along * co };
  }

  // The ten of them firing. Same rules as a settlement's wall guards -
  // nearest thing in range, one shot each on its own cooldown.
  function updateKillCrew(o, dt) {
    for (const c of o.crew) {
      c.flash = Math.max(0, c.flash - dt * 9);
      c.cool -= dt;
      c.bob += dt * 0.7;

      const at = crewSpot(o, c);
      let best = null, bestD = KILL_REACH;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - at.x, e.z - at.z);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (!best) continue;

      c.yaw = Math.atan2(best.x - at.x, best.z - at.z);
      if (c.cool > 0) continue;
      c.cool = KILL_COOL;
      c.flash = 1;

      tracers.push({
        x1: at.x, y1: terrainAt(o.x, o.z) + 9.4, z1: at.z,
        x2: best.x, y2: best.k.height * 0.6, z2: best.z,
        life: 0.07
      });

      best.hp -= KILL_HURT;
      best.hitFlash = 1;
      burst(best.x, best.k.height * 0.6, best.z, best.k.gib, 5, 6);

      if (best.hp <= 0 && !best.dead) {
        best.dead = true;
        o.kills++;
        burst(best.x, best.k.height * 0.5, best.z, best.k.gib, 20, 16);
      }
    }
  }

  // Marine rigs come OUT OF a fort if there's one about; zombie rigs
  // just come out of the fog behind you, like everything else does.
  function spawnOther(side) {
    if (others.length >= OTHER_MAX) return;

    // WHERE THIS KIND OF TRUCK COMES FROM.
    //
    // Kill rigs are the SETTLEMENTS' doing - fifty to a hundred people
    // behind those walls, and this is what they built to keep the road
    // open. They roll out of the gates of a bunker. Marine rigs still
    // come out of the forts.
    if (side === 'marine' || side === 'kill') {
      const isKill = (side === 'kill');
      const want   = isKill ? 'bunker' : 'fort';

      // Look further for a kill rig. Settlements are one square in 300,
      // so a five-square glance round you finds one less than half the
      // time - and the rest of the time it quietly gave up and spawned
      // out of the fog instead, which is not where they live.
      const homes = placesNear(rig.x, rig.z, isKill ? 13 : 5)
        .filter(function (p) { return p.kind === want; });

      if (homes.length) {
        // The nearest one, so it turns up somewhere you might see it
        // rather than a mile off in the fog.
        homes.sort(function (a2, b2) {
          return Math.hypot(a2.x - rig.x, a2.z - rig.z)
               - Math.hypot(b2.x - rig.x, b2.z - rig.z);
        });
        const h = homes[0];

        // OUTSIDE THE WALLS, and a kill rig needs a lot of room - it's
        // sixty long. Spawned too close it would start life sat on top
        // of somebody's settlement.
        const out = h.half + (isKill ? 52 : 26);

        // AND OUTSIDE EVERYBODY ELSE'S WALLS TOO. Clearing its own gate
        // isn't enough - settlements have neighbours, and one spawn in
        // a hundred was landing inside the one next door. So try a few
        // ways round the ring and take the first that's clear of every
        // camp nearby.
        let sx = 0, sz = 0, a = 0;
        for (let attempt = 0; attempt < 8; attempt++) {
          a  = Math.random() * Math.PI * 2;
          sx = h.x + Math.sin(a) * out;
          sz = h.z + Math.cos(a) * out;
          const clash = placesNear(sx, sz, 2).some(function (p) {
            return Math.hypot(p.x - sx, p.z - sz) < (p.half || 16) + 20;
          });
          if (!clash) break;
        }

        // This used to say makeOther('marine', ...) whatever was asked
        // for, so a kill rig born at a fort quietly came out as an
        // ordinary marine rig. It's `side` now.
        others.push(makeOther(side, sx, sz, a));
        return;
      }
    }

    const a = Math.random() * Math.PI * 2;
    const d = 200 + Math.random() * 90;
    others.push(makeOther(side, rig.x + Math.sin(a) * d, rig.z + Math.cos(a) * d,
                          a + Math.PI));
  }

  // WHAT IS THIS TRUCK POINTED AT? The whole difference between a
  // friend and an enemy, in one function.
  function otherTarget(o) {
    // The rig object itself, not a copy of where it is - so a locked-on
    // zombie rig keeps tracking you instead of charging the spot you
    // were standing in three seconds ago.
    if (o.side === 'zombie') return rig;
    // A kill rig hunts the same things a marine rig does.

    // A marine rig goes for the nearest zombie rig, and failing that
    // the crowd.
    let best = null, bestD = OTHER_SEE;
    for (const q of others) {
      if (q === o || q.side !== 'zombie') continue;
      const d = Math.hypot(q.x - o.x, q.z - o.z);
      if (d < bestD) { bestD = d; best = q; }
    }
    if (best) return best;

    // NEAREST IS NOT THE SAME AS BEST.
    //
    // Going for whichever zombie is closest, a lorry kills one, then
    // hauls its enormous turning circle right round to the next one,
    // and spends the whole fight turning. Four kills in thirty seconds.
    //
    // So a target that's straight ahead is worth going a long way for.
    // Sixty paces' worth: that's how much distance a hard turn has to
    // save before it's worth making. The rig lines up a row of them
    // and drives THROUGH it, which is what a truck is for.
    let bestScore = 1e9;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = Math.hypot(e.x - o.x, e.z - o.z);
      if (d > OTHER_SEE) continue;

      let turn = Math.atan2(e.x - o.x, e.z - o.z) - o.yaw;
      while (turn >  Math.PI) turn -= Math.PI * 2;
      while (turn < -Math.PI) turn += Math.PI * 2;

      // 20, not 60. At sixty, a target straight ahead was worth so much
      // that the rig ignored the crowd right beside it and drove off
      // into the distance after one far-away zombie. One kill in thirty
      // seconds - WORSE than having no preference at all.
      const score = d + Math.abs(turn) * 20;
      if (score < bestScore) { bestScore = score; best = e; }
    }
    return best;
  }

  function updateOthers(dt) {
    // More of them as the game goes on, same as everything else here.
    otherTimer -= dt;
    if (otherTimer <= 0) {
      // ONE kill rig at a time, ever. Two would stop being a sight and
      // start being traffic.
      const haveKill = others.some(function (q) { return q.side === 'kill'; });
      if (!haveKill && Math.random() < 0.3) {
        spawnOther('kill');
        otherTimer = 40 + Math.random() * 30;
        return;
      }
      // Zombie rigs get commoner the longer you last; marine rigs don't.
      spawnOther(Math.random() < Math.min(0.7, 0.3 + clock / 400) ? 'zombie' : 'marine');
      otherTimer = 26 + Math.random() * 22;
    }

    for (const o of others) {
      if (o.hitCool > 0) o.hitCool -= dt;
      if (o.ramFlash > 0) o.ramFlash -= dt * 2.4;

      // ---- PICK ONE, AND STICK WITH IT --------------------------------
      // Re-choosing the "best" target every frame is what sent these
      // rigs round in perfect circles. As the truck moved, a different
      // zombie kept winning, so the heading it was lining up on quietly
      // rotated - and a lorry that never chases the same thing for two
      // seconds running never catches anything at all. Measured: steer
      // pinned at -0.95, for ever.
      //
      // So: choose a target, and stay committed to it until it's dead,
      // out of sight, or three seconds are up.
      if (!(o.lockT > 0 && o.lock && !o.lock.dead &&
            Math.hypot(o.lock.x - o.x, o.lock.z - o.z) < OTHER_SEE)) {
        o.lock  = otherTarget(o);
        o.lockT = 3;
        o.runT  = 0;
      }
      o.lockT -= dt;
      const t = o.lock;

      // ---- STEER AT IT ----------------------------------------------
      // Turn towards the target the SHORT way round, and only as fast
      // as a lorry can - which is what stops them pirouetting on the
      // spot like something on ice.
      let want = 0;
      if (t) {
        want = Math.atan2(t.x - o.x, t.z - o.z) - o.yaw;
        while (want >  Math.PI) want -= Math.PI * 2;
        while (want < -Math.PI) want += Math.PI * 2;

        // THE ATTACK RUN.
        //
        // Steering straight at the target every frame looks obviously
        // right and is obviously wrong. As the rig closes in, the
        // bearing swings faster than a lorry can follow, so it ends up
        // ORBITING its prey - measured at seven paces out, for ever,
        // when the bull bars only reach five and a half to the side.
        // Eight kills in five seconds and then nothing, all day. Just
        // easing off the wheel didn't fix it either; it orbited wider.
        //
        // What a driver actually does is LINE UP and commit. So inside
        // sixty paces the rig picks its heading ONCE and holds it for
        // two seconds - straightening onto the line and driving all the
        // way through - then looks up and picks a new one. Chasing is
        // for things that can turn. A lorry aims.
        const close = Math.hypot(t.x - o.x, t.z - o.z);

        // YOU CANNOT TURN ONTO SOMETHING THAT IS ALREADY BESIDE YOU.
        //
        // At 35 this lorry's turning circle is about twenty-two paces
        // across. A zombie eight paces off the side is INSIDE that
        // circle - no amount of steering reaches it, and every attempt
        // just carries the truck round it in a ring. Measured: eight
        // paces away, for twenty seconds, never once in the bull bars.
        //
        // So when the target is close AND off to the side, the rig
        // stops steering, drives on to open the gap, and only turns in
        // once it has room to make the corner. Getting further away is
        // how you get closer. That's real, and it's why lorries reverse
        // out of streets they can't turn in.
        if (close < 34 && Math.abs(want) > 0.7) {
          o.steer *= 0.8;
          o.runT = 0;
        } else if (close < 30) {
          if (o.runT <= 0) {
            o.runYaw = Math.atan2(t.x - o.x, t.z - o.z);
            o.runT = 1.4;
          }
          o.runT -= dt;
          want = o.runYaw - o.yaw;
          while (want >  Math.PI) want -= Math.PI * 2;
          while (want < -Math.PI) want += Math.PI * 2;
        } else {
          o.runT = 0;             // out of range - go back to following it
        }

        o.steer += (clamp(want * 1.6, -1, 1) - o.steer) * Math.min(1, dt * 5);
      } else {
        o.steer *= 0.9;
      }

      // These drivers are better than the physics alone would allow -
      // 1.8 times your turn rate. Without it a truck doing 48 needs a
      // circle 48 paces WIDE, which is wider than most of the crowds
      // it's trying to get into, so it just swings round the outside.
      // The racer's turning rule, same as yours now - turn rate is the
      // wheel times the speed, so a stopped truck cannot pivot. Times
      // 1.8 because these drivers are better than you; without it a
      // truck doing 90 needs a circle wider than most of the crowds
      // it's trying to get into, and it swings round the outside.
      o.yaw += o.steer * 1.5 * (o.speed / TOP_SPEED) * dt * 1.8;

      // ---- FOOT DOWN -------------------------------------------------
      // Slower than you flat out, so a chase is always winnable.
      let top = o.side === 'kill'   ? TOP_SPEED * KILL_TOP
              : o.side === 'zombie' ? TOP_SPEED * 0.86 : TOP_SPEED * 0.78;

      // EASE OFF FOR A HARD TURN, like anybody driving something this
      // big would. Slower means a tighter circle - but never below the
      // speed that flattens things, or it would arrive harmless.
      if (Math.abs(want) > 0.7) top = Math.max(RAM_SPEED + 8, top * 0.62);

      o.speed += (top - o.speed) * Math.min(1, dt * 0.5);

      const nx = o.x + Math.sin(o.yaw) * o.speed * dt;
      const nz = o.z + Math.cos(o.yaw) * o.speed * dt;
      // A KILL RIG DOES NOT GO ROUND THINGS. It weighs as much as a
      // building and it is not turning aside for a dead tree.
      const R = o.side === 'kill' ? 0 : RIG_HALF_W + 1.5;
      if (o.side === 'kill' || !blockedAt(nx, nz, R)) {
        o.x = nx; o.z = nz;
      } else {
        // Same slide-or-bounce rule your truck gets, so they can't
        // weld themselves to a wreck and sit there for ever.
        if (!blockedAt(nx, o.z, R)) o.x = nx;
        else if (!blockedAt(o.x, nz, R)) o.z = nz;
        else { o.speed = -8; o.yaw += 0.5; }
      }

      // ---- MARINE RIGS FLATTEN THE DEAD -------------------------------
      if (o.side === 'marine') otherRunsThemDown(o, dt);

      // ---- AND A KILL RIG DOES BOTH -----------------------------------
      if (o.side === 'kill') {
        otherRunsThemDown(o, dt, KILL_HALF_W, KILL_NOSE);
        updateKillCrew(o, dt);
      }

      // ---- RAMMING ----------------------------------------------------
      otherRams(o, dt);
    }

    // Wrecks blow up and leave the road.
    for (const o of others) {
      if (o.health > 0) continue;
      burst(o.x, 4, o.z, [[60, 56, 52], [150, 90, 40], [90, 84, 78]], 40, 26);
      crunch();
      if (o.side === 'zombie') {
        player.scrap += 30;
        questWord = 'ZOMBIE RIG WRECKED  -  30 scrap';
        questFlash = 3;
      }
    }
    others = others.filter(function (o) {
      // Anything a long way behind you is gone - it isn't part of the
      // game any more and it costs a frame to keep pretending.
      return o.health > 0 &&
             Math.hypot(o.x - rig.x, o.z - rig.z) < (o.side === 'kill' ? 900 : 620);
    });
  }

  // A marine rig ploughing through the crowd. Same rectangle test as
  // yours, so it obeys the same speed-is-armour rule you do.
  function otherRunsThemDown(o, dt, halfW, nose) {
    // A kill rig's platform is three times as wide as a lorry, so the
    // rectangle it sweeps has to be passed in rather than assumed.
    halfW = halfW || RIG_HALF_W;
    nose  = nose  || RIG_NOSE;
    const co = Math.cos(o.yaw), si = Math.sin(o.yaw);
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - o.x, dz = e.z - o.z;
      if (Math.abs(dx) > nose + 26 || Math.abs(dz) > nose + 26) continue;

      const along  = dx * si + dz * co;
      const across = dx * co - dz * si;
      const wide = halfW + (e.k.radius || 1.4);
      if (across < -wide || across > wide) continue;
      if (along < -halfW * 2.6 || along > nose) continue;

      if (Math.abs(o.speed) >= RAM_SPEED) {
        e.dead = true;
        o.kills++;
        o.ramFlash = 1;
        o.speed *= o.side === 'kill' ? (e.k.hp > 40 ? 0.97 : 0.998)
                                     : (e.k.hp > 40 ? 0.86 : 0.985);
        burst(e.x, e.k.height * 0.5, e.z, e.k.gib, 22, 18);
      }
    }
  }

  // TRUCK MEETS TRUCK.
  //
  // What decides it is CLOSING SPEED - how fast the gap between them is
  // shutting - not who is faster in a straight line. Two lorries going
  // the same way and touching is a scrape; head-on at sixty each is a
  // hundred and twenty, and somebody is not driving home.
  function otherRams(o, dt) {
    // Against your rig.
    if (o.side === 'zombie' && o.hitCool <= 0) {
      const gap = Math.hypot(o.x - rig.x, o.z - rig.z);
      if (gap < 13) {
        const closing = Math.abs(o.speed) + Math.abs(rig.speed) *
          // Facing each other? Add the speeds. Same way? Take them off.
          (Math.cos(o.yaw - rig.yaw) < 0 ? 1 : -1);
        const force = Math.max(6, Math.abs(closing));

        hurtRig(force * RAM_DAMAGE);
        o.health -= force * RAM_DAMAGE * 0.8;   // it hurts them too
        o.hitCool = 0.8;
        o.ramFlash = 1;
        rig.ramFlash = 1;
        shake = Math.max(shake, 0.9);
        crunch();

        // Shove them apart, or they'd sit inside each other grinding.
        const away = Math.atan2(rig.x - o.x, rig.z - o.z);
        rig.x += Math.sin(away) * 5; rig.z += Math.cos(away) * 5;
        o.x   -= Math.sin(away) * 5; o.z   -= Math.cos(away) * 5;
        rig.speed *= 0.55;
        o.speed *= 0.55;
      }
    }

    // Marine rig against zombie rig - the fight you get to watch.
    if (o.side !== 'marine' || o.hitCool > 0) return;
    for (const q of others) {
      if (q.side !== 'zombie' || q.hitCool > 0) continue;
      if (Math.hypot(o.x - q.x, o.z - q.z) > 13) continue;

      const force = Math.max(6, Math.abs(o.speed) + Math.abs(q.speed) *
        (Math.cos(o.yaw - q.yaw) < 0 ? 1 : -1));
      o.health -= force * RAM_DAMAGE * 0.7;
      q.health -= force * RAM_DAMAGE * 0.9;     // the marines drive better
      o.hitCool = q.hitCool = 0.8;
      o.ramFlash = q.ramFlash = 1;
      crunch();

      const away = Math.atan2(o.x - q.x, o.z - q.z);
      o.x += Math.sin(away) * 5; o.z += Math.cos(away) * 5;
      q.x -= Math.sin(away) * 5; q.z -= Math.cos(away) * 5;
      o.speed *= 0.55; q.speed *= 0.55;
    }
  }


// -------------------------------------------------------------------
//  THE MECHANIC
// -------------------------------------------------------------------
//
//  Every settlement and every marine fort has one: a repair bay with
//  somebody in it who knows what they're doing with a rig.
//
//  Drive into the bay and it fixes your truck, the same way standing
//  inside the walls fixes YOU. No key to press and nothing to buy -
//  getting there is the price, and getting there is the whole game.

  const REPAIR_REACH = 24;   // how close the rig has to be parked
  const REPAIR_RATE  = 30;   // health a second - a wreck takes ten

  let atMechanic  = null;
  let repairGlow  = 0;

  // WHERE THE BAY IS. One function, so the thing that DRAWS it and the
  // thing that decides you're in it can never drift apart - if they
  // did you'd get an invisible repair bay in the corner of a field
  // and a mechanic who won't look at your truck.
  //
  // Works for a settlement and a fort alike, because both know their
  // own middle, their own size and which way round they're built.
  function mechanicSpot(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    const lx = p.half * 0.44, lz = -p.half * 0.46;   // opposite the board
    return { x: p.x + lx * co + lz * si, z: p.z - lx * si + lz * co };
  }

  function nearestMechanic() {
    // Wherever YOU are, in whatever you're sat in.
    const me = flying ? jet : rig;
    const gx0 = Math.round(me.x / CELL), gz0 = Math.round(me.z / CELL);
    for (let gx = gx0 - 1; gx <= gx0 + 1; gx++) {
      for (let gz = gz0 - 1; gz <= gz0 + 1; gz++) {
        const p = propAt(gx, gz);
        if (!p || (p.kind !== 'bunker' && p.kind !== 'fort')) continue;
        const m = mechanicSpot(p);
        if (Math.hypot(me.x - m.x, me.z - m.z) < REPAIR_REACH) return p;
      }
    }
    return null;
  }

  function updateMechanic(dt) {
    atMechanic = nearestMechanic();

    // The bay takes whatever you park in it. A jet is somebody else's
    // problem to fix, but out here they're not fussy.
    if (atMechanic && flying && jet.health < jet.maxHealth) {
      jet.health = Math.min(jet.maxHealth, jet.health + REPAIR_RATE * dt);
      repairGlow = Math.min(1, repairGlow + dt * 4);
    } else if (atMechanic && rig.health < rig.maxHealth) {
      // Multiplied by dt like everything else that changes over time,
      // so it's thirty a second on a fast computer AND a slow one.
      rig.health = Math.min(rig.maxHealth, rig.health + REPAIR_RATE * dt);
      repairGlow = Math.min(1, repairGlow + dt * 4);
    } else {
      repairGlow = Math.max(0, repairGlow - dt * 2.5);
    }
  }

  const BAY_STEEL = [96, 92, 88], BAY_RUST = [122, 76, 46];
  const OVERALLS  = [58, 78, 92];

  function drawMechanic(p) {
    const m = mechanicSpot(p);
    const away = Math.hypot(m.x - player.x, m.z - player.z);
    if (away > 190) return;                     // too far to bother drawing

    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    function bit(lx, y, lz, w, h, d, rgb) {
      addBox(m.x + lx * co + lz * si, y, m.z - lx * si + lz * co,
             w, h, d, rgb, p.spin);
    }

    // ---- THE BAY ------------------------------------------------------
    // Two ramps to drive up onto, so the bay reads as somewhere a TRUCK
    // goes rather than somewhere a person stands.
    for (const s of [-4.4, 4.4]) bit(s, 0.35, 0, 2.6, 0.7, 15, BAY_STEEL);

    // A gantry over the top, because a lorry is worked on from above.
    for (const s of [-6.4, 6.4]) {
      bit(s, 4.0, -6.0, 1.0, 8.0, 1.0, BAY_RUST);
      bit(s, 4.0,  6.0, 1.0, 8.0, 1.0, BAY_RUST);
    }
    bit(0, 8.2, -6.0, 14.4, 0.9, 1.0, BAY_RUST);
    bit(0, 8.2,  6.0, 14.4, 0.9, 1.0, BAY_RUST);
    bit(0, 8.6, 0, 1.1, 0.8, 12.6, BAY_STEEL);          // the rail between

    // ---- THE BENCH, AND THE JUNK ON IT --------------------------------
    bit(-8.6, 1.5, -2.0, 1.2, 3.0, 7.0, [86, 68, 50]);
    bit(-8.6, 3.3, -2.0, 2.0, 0.6, 7.4, [104, 84, 62]);
    bit(-8.6, 3.9, -4.2, 1.4, 1.2, 1.4, [140, 60, 46]);   // red toolbox
    bit(-8.6, 3.8, -0.4, 0.9, 0.9, 2.2, BAY_STEEL);       // bits and pieces
    for (const d of [0.6, 1.6, 2.6]) bit(-9.4, 4.6, d, 0.22, 1.5, 0.22, BAY_STEEL);

    // A stack of tyres, which is what a repair bay looks like from far off.
    for (let i = 0; i < 3; i++) bit(8.8, 0.9 + i * 1.5, -4.6, 3.4, 1.4, 3.4, [42, 38, 36]);

    // ---- THE SPANNER SIGN ----------------------------------------------
    // A high, bright marker so you can pick the bay out from across the
    // settlement instead of driving round the inside of the walls.
    bit(0, 5.0, -8.6, 0.7, 10.0, 0.7, BAY_STEEL);
    const lit = repairGlow > 0 && atMechanic === p;
    bit(0, 10.4, -8.6, 5.0, 2.4, 0.5,
        lit ? [150, 235, 150] : [190, 170, 90]);

    // ---- THE MECHANIC --------------------------------------------------
    // Faces the bay, and shuffles about a bit so they aren't a statue.
    const sway = Math.sin(clock * 1.3 + p.x) * 0.5;
    drawPerson(m.x + (-6.6 + sway) * co, 0, m.z - (-6.6 + sway) * si,
               p.spin + Math.PI * 0.5, OVERALLS, false, 0);
  }


// -------------------------------------------------------------------
//  CARGO
// -------------------------------------------------------------------
//
//  A load, and somewhere to take it. The settlements have 50 to 100
//  people in them and nothing to eat; the marine forts have everything
//  and nobody. Driving the gap between them is the job.

  const LOADS = [
    { what: 'WATER',    colour: [86, 132, 158] },
    { what: 'MEDICINE', colour: [198, 200, 190] },
    { what: 'AMMO',     colour: [140, 116, 70]  },
    { what: 'FOOD',     colour: [150, 122, 74]  },
    { what: 'FUEL',     colour: [176, 96, 44]   },
    { what: 'SCRAP',    colour: [110, 104, 98]  }
  ];

  const HAUL_SEARCH = 16;    // how many squares out to look for somewhere to go
  const HAUL_MIN    = 420;   // any closer than this isn't a haul, it's a stroll
  const PAY_PER_100 = 22;    // scrap for every hundred paces of the trip

  // EVERYWHERE YOU COULD TAKE A LOAD.
  //
  // Settlements AND marine forts both count - that's what makes the map
  // feel joined up instead of being a set of separate places.
  function placesNear(x, z, reach) {
    const gx0 = Math.round(x / CELL), gz0 = Math.round(z / CELL);
    const found = [];
    for (let gx = gx0 - reach; gx <= gx0 + reach; gx++) {
      for (let gz = gz0 - reach; gz <= gz0 + reach; gz++) {
        const p = propAt(gx, gz);
        if (p && (p.kind === 'bunker' || p.kind === 'fort')) found.push(p);
      }
    }
    return found;
  }

  function loadCargo(from) {
    if (rig.cargo) { say('THE TRAILER IS ALREADY FULL'); return; }

    // Somewhere far enough away to be worth the diesel, and not here.
    const options = placesNear(from.x, from.z, HAUL_SEARCH).filter(function (p) {
      if (p === from) return false;
      return Math.hypot(p.x - from.x, p.z - from.z) > HAUL_MIN;
    });

    if (!options.length) {
      say('NOBODY OUT THERE NEEDS ANYTHING TODAY');
      return;
    }

    // The nearest one that still counts as a proper trip.
    options.sort(function (a, b) {
      return Math.hypot(a.x - from.x, a.z - from.z)
           - Math.hypot(b.x - from.x, b.z - from.z);
    });
    const to = options[0];

    const load = LOADS[Math.floor(Math.random() * LOADS.length)];
    const far  = Math.hypot(to.x - from.x, to.z - from.z);

    rig.cargo = {
      what: load.what, colour: load.colour,
      to: to, pay: Math.round(far / 100 * PAY_PER_100), far: far
    };

    say('LOADED ' + load.what + '  ->  ' +
        (to.kind === 'fort' ? 'MARINE FORT' : 'SETTLEMENT') +
        ', ' + Math.round(far) + ' paces  -  ' + rig.cargo.pay + ' scrap');
  }

  // DID YOU GET THERE? Checked every frame, on foot or driving - so
  // walking the last bit with the truck bogged down still counts.
  function checkDelivery() {
    if (!rig.cargo) return;
    const to = rig.cargo.to;
    const near = (to.half || 16) + 14;
    if (Math.hypot(rig.x - to.x, rig.z - to.z) > near) return;

    player.scrap += rig.cargo.pay;
    rig.earned += rig.cargo.pay;
    rig.hauls++;
    questWord = 'DELIVERED ' + rig.cargo.what + '  -  ' +
                rig.cargo.pay + ' scrap  -  haul number ' + rig.hauls;
    questFlash = 3.5;
    payDay();
    rig.cargo = null;
  }


  const CAB_A = [126, 74, 52], CAB_B = [96, 56, 40];
  const STEEL = [104, 100, 96], DARKR = [42, 38, 36];
  const GLASS = [92, 128, 148];

  // ONE FUNCTION DRAWS EVERY TRUCK IN THE GAME.
  //
  // Yours, the marines', and the ones the dead are driving are all the
  // same lorry - the paint is different and each one gets a few bits of
  // its own bolted on. Written three times it would have been three
  // times the work AND three chances for them to drift apart, so that
  // one day the zombie rig has wheels that stick out and yours doesn't.
  //
  //   t    - anything with x, z, yaw, health and maxHealth
  //   skin - what colour it's painted
  //   you  - true only for the player's, which hides the cab you're
  //          sat inside and shows the load you're hauling
  function drawTruck(t, skin, you) {
    const co = Math.cos(t.yaw), si = Math.sin(t.yaw);
    const base = terrainAt(t.x, t.z);

    // Put a box on the truck, measured in the TRUCK'S directions -
    // "so far to the side, so far up, so far along" - so the whole
    // lorry is written once and turns as one thing.
    function part(across, up, along, w, h, d, rgb) {
      addBox(t.x + across * co + along * si, base + up,
             t.z - across * si + along * co, w, h, d, rgb, t.yaw);
    }

    // ---- BULL BARS - the business end --------------------------------
    const barCol = t.ramFlash > 0
      ? shade(skin.bar, 1 + t.ramFlash * 0.7) : skin.bar;
    part(0, 2.0, 6.4, 7.6, 0.8, 0.9, barCol);
    part(0, 3.4, 6.4, 7.6, 0.8, 0.9, barCol);
    for (const a of [-2.6, 0, 2.6]) part(a, 2.7, 6.4, 0.8, 2.6, 0.9, barCol);
    for (const a of [-3.4, 3.4]) part(a, 2.6, 5.2, 0.7, 3.2, 2.6, shade(skin.bar, 0.8));

    // Spikes on the front of a zombie rig, so you know at a glance that
    // the thing coming at you is NOT here to help.
    if (skin.spikes) {
      for (const a of [-2.9, -1.0, 1.0, 2.9]) {
        part(a, 2.8, 7.6, 0.5, 0.5, 2.6, shade(skin.bar, 0.7));
      }
    }

    // ---- CAB ----------------------------------------------------------
    // Scorched as it gets wrecked, so you can SEE how bad it is without
    // reading the number.
    const hurt = 1 - (1 - t.health / t.maxHealth) * 0.55;

    // The bonnet. Always drawn - from the driver's seat this is the
    // long brown nose stretching away in front of you, and it's what
    // tells you where your own front end is.
    part(0, 2.6, 2.4, 6.4, 3.4, 8.4, shade(skin.body, hurt));

    // THE BOX ROUND YOUR HEAD, AND THE GLASS YOU LOOK THROUGH.
    // From outside these are the cab and the windscreen. From the
    // driver's seat your eye is INSIDE them, and a solid box you are
    // sat inside just paints the whole screen its own colour. So while
    // you're driving, they aren't drawn at all - which is exactly what
    // it's like to be in a cab: you see out, not in.
    if (!(you && driving)) {
      part(0, 5.0, 1.2, 5.8, 2.6, 5.0, shade(skin.trim, hurt));
      part(0, 5.2, 3.5, 5.0, 1.8, 0.5, skin.glass);             // windscreen
    }
    for (const a of [-2.95, 2.95]) part(a, 5.2, 1.4, 0.5, 1.6, 3.0, skin.glass);
    part(0, 6.5, 0.6, 4.4, 0.5, 3.6, shade(skin.trim, 1.1 * hurt));
    for (const a of [-1.6, 1.6]) part(a, 7.2, 0.4, 0.4, 1.4, 0.4, DARKR);  // stacks

    // ---- TRAILER ------------------------------------------------------
    part(0, 3.6, -6.6, 6.8, 5.2, 11.0, shade(skin.trim, 0.85 * hurt));
    for (let i = 0; i < 4; i++) {
      part(0, 3.6, -2.4 - i * 2.9, 7.0, 5.4, 0.5, shade(skin.bar, 0.7));
    }
    part(0, 6.4, -6.6, 6.4, 0.5, 10.6, skin.bar);

    // A load riding on the back, so you can see you're carrying something.
    if (you && rig.cargo) {
      part(0, 7.3, -6.6, 5.4, 1.6, 8.6, rig.cargo.colour);
      part(0, 8.2, -6.6, 4.0, 0.4, 7.0, shade(rig.cargo.colour, 0.75));
    }

    // ---- WHEELS -------------------------------------------------------
    // They have to stick out PAST the body (3.4 to the side) or they
    // just look like dark patches painted on the trailer.
    for (const a of [-3.9, 3.9]) {
      for (const b of [4.0, -1.6, -7.0, -10.0]) {
        part(a, 1.6, b, 1.6, 3.2, 3.2, DARKR);
        part(a * 1.18, 1.6, b, 0.3, 1.4, 1.4, shade(skin.bar, 0.9));  // hub cap
      }
    }

    // ---- HEADLIGHTS ---------------------------------------------------
    for (const a of [-2.4, 2.4]) part(a, 3.0, 6.5, 1.2, 0.9, 0.3, skin.lamp);

    // ---- WHO'S RIDING ON IT --------------------------------------------
    // A marine standing on the roof with a rifle, or the dead clinging
    // to the sides. Same idea either way: you should be able to tell
    // what a truck is from a long way off, before it's close enough to
    // matter.
    if (skin.crew === 'marine') {
      drawPerson(t.x + 0.6 * si, base + 6.8, t.z + 0.6 * co,
                 t.yaw + Math.sin(clock * 0.7) * 0.5, MARINE_COAT, true, 0);
    } else if (skin.crew === 'dead') {
      for (const s of [-1, 1]) {
        const bob = Math.sin(clock * 5 + s * 2 + t.x) * 0.22;
        drawPerson(t.x + (s * 4.4) * co + (-3.0) * si, base + 3.6 + bob,
                   t.z - (s * 4.4) * si + (-3.0) * co,
                   t.yaw + s * 1.5, ZOM_COAT, false, 0);
      }
    }
  }

  const MARINE_COAT = [64, 88, 118];
  const ZOM_COAT    = [84, 102, 66];

  // The three paint jobs. Everything that makes a truck LOOK like what
  // it is lives here, so making a fourth kind one day is a few colours
  // and not a new function.
  const SKIN_YOU = {
    body: CAB_A, trim: CAB_B, bar: STEEL, glass: GLASS,
    lamp: [255, 226, 160], crew: null, spikes: false
  };
  const SKIN_MARINE = {
    body: [72, 96, 124], trim: [56, 76, 100], bar: [128, 140, 152],
    glass: [140, 200, 230], lamp: [210, 236, 255],
    crew: 'marine', spikes: false
  };
  const SKIN_ZOMBIE = {
    body: [70, 74, 52], trim: [54, 58, 42], bar: [108, 84, 52],
    glass: [40, 52, 34], lamp: [150, 220, 130],
    crew: 'dead', spikes: true
  };

  function drawRig() { drawTruck(rig, SKIN_YOU, true); }


  // THE KILL RIG.
  //
  // Two giant tractors side by side with a platform slung between and
  // behind them, on eight wheels, with ten marines stood on it. It is
  // drawn at TWICE the scale of everything else on the map, which is
  // the whole point - you should be able to tell what it is from the
  // horizon, and be glad it's on your side.
  const KILL_STEEL = [118, 128, 140], KILL_DARK = [54, 62, 72];
  const KILL_PLATE = [86, 96, 108],   KILL_TYRE = [38, 36, 34];

  function drawKillRig(o) {
    const co = Math.cos(o.yaw), si = Math.sin(o.yaw);
    const base = terrainAt(o.x, o.z);

    function part(across, up, along, w, h, d, rgb) {
      addBox(o.x + across * co + along * si, base + up,
             o.z - across * si + along * co, w, h, d, rgb, o.yaw);
    }

    const hurt = 1 - (1 - o.health / o.maxHealth) * 0.45;

    // ---- THE TWO TRACTORS ---------------------------------------------
    // Side by side out in front, each one about twice your lorry.
    for (const s of [-1, 1]) {
      const a = s * 7.0;

      // Bull bars, and they are enormous.
      const bar = o.ramFlash > 0 ? shade(KILL_STEEL, 1 + o.ramFlash * 0.6) : KILL_STEEL;
      part(a, 3.6, 25.0, 11.0, 1.6, 1.8, bar);
      part(a, 6.6, 25.0, 11.0, 1.6, 1.8, bar);
      for (const k of [-3.6, 0, 3.6]) part(a + k, 5.1, 25.0, 1.6, 4.6, 1.8, bar);

      part(a, 4.8, 17.0, 9.4, 6.2, 15.0, shade([96, 106, 118], hurt));   // bonnet
      part(a, 9.6, 14.0, 8.6, 5.0, 9.0, shade(KILL_PLATE, hurt));        // cab
      part(a, 10.2, 18.2, 7.4, 3.2, 0.8, [110, 160, 190]);               // glass
      for (const k of [-2.4, 2.4]) part(a + k, 13.4, 12.0, 0.8, 3.0, 0.8, KILL_DARK);
      for (const k of [-3.0, 3.0]) part(a + k, 5.4, 25.4, 2.0, 1.6, 0.5, [255, 226, 160]);

      // Six wheels per tractor.
      for (const b of [21.0, 15.0, 11.0]) {
        for (const w of [-1, 1]) {
          part(a + w * 5.6, 2.8, b, 2.6, 5.6, 5.6, KILL_TYRE);
        }
      }
    }

    // The drawbar joining them to the load.
    part(0, 5.0, 6.0, 20.0, 1.6, 6.0, KILL_DARK);

    // ---- THE PLATFORM --------------------------------------------------
    // A flat deck the size of a house, with a rail round the edge so the
    // crew aren't just stood on a table.
    part(0, 6.4, -14.0, 22.0, 2.0, 34.0, shade(KILL_PLATE, hurt));
    part(0, 7.6, -14.0, 21.0, 0.6, 33.0, shade([104, 114, 126], hurt));

    for (const s of [-1, 1]) {
      part(s * 10.6, 9.2, -14.0, 0.9, 3.0, 34.0, KILL_STEEL);   // side rails
    }
    part(0, 9.2, -30.6, 21.0, 3.0, 0.9, KILL_STEEL);            // back rail

    // Crates and a fuel drum riding down the middle, so the deck isn't
    // just a grey rectangle.
    part(0, 9.4, -6.0, 5.0, 4.0, 7.0, [92, 82, 66]);
    part(0, 9.8, -20.0, 4.0, 5.0, 4.0, [128, 74, 44]);

    // Eight wheels under the deck.
    for (const b of [-2.0, -10.0, -18.0, -26.0]) {
      for (const w of [-1, 1]) {
        part(w * 9.4, 3.0, b, 2.8, 6.0, 6.0, KILL_TYRE);
      }
    }

    // ---- THE CREW -------------------------------------------------------
    // SPACE MARINES. The real ones - the same steel-blue plate, the
    // same pauldrons and backpack, the same orange visor as the squads
    // that come down in the drop pods. Not people in coats.
    //
    // Drawn from the SAME crewSpot the shooting uses, so every tracer
    // comes out of a marine you can actually see.
    const deck = base + 7.6;
    for (const c of o.crew) {
      const at = crewSpot(o, c);
      drawMarine({
        x: at.x, z: at.z,
        yaw: c.yaw,
        step: c.bob,          // the shift of weight as they brace
        flash: c.flash,       // muzzle flash, already ticking down
        state: 'crew',        // not 'wait', so no recruit marker over them
        baseY: deck + Math.sin(c.bob) * 0.1
      });
    }

    // groundY is a global that every box adds itself to, and drawMarine
    // has just set it to the deck. Leave it there and the NEXT thing
    // drawn this frame is built nine feet in the air.
    groundY = 0;
  }


  function draw() {
    // A different planet, a different painter.
    if (state === 'space') { drawSpace(); return; }

    const savedX = cam.x, savedY = cam.y;
    if (shake > 0) {
      cam.x += (Math.random() - 0.5) * shake * 0.5;
      cam.y += (Math.random() - 0.5) * shake * 0.5;
    }

    drawSky();

    faces = [];
    drawGround();
    drawFarBeacons();
    drawScenery();
    drawDust();
    for (const p of pods) drawPod(p);
    for (const m of marines) drawMarine(m);
    for (const e of enemies) drawEnemy(e);
    drawRig();
    drawJet();
    for (const o of others) {
      // Anything past the fog is a waste of a hundred faces.
      // A kill rig is enormous - worth drawing from much further away,
      // because seeing one on the horizon is half of what it's for.
      const far = Math.hypot(o.x - cam.x, o.z - cam.z);
      if (far > (o.side === 'kill' ? 700 : 400)) continue;
      if (o.side === 'kill') drawKillRig(o);
      else drawTruck(o, o.side === 'marine' ? SKIN_MARINE : SKIN_ZOMBIE, false);
    }
    drawBolts();
    drawTracers();
    drawGibs();

    // Furthest away painted FIRST, so near things cover far things.
    faces.sort(function (a, b) { return b.depth - a.depth; });

    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) {
        ctx.lineTo(f.points[i].x, f.points[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }

    cam.x = savedX; cam.y = savedY;

    // Both hands are on the wheel. The gun (and its crosshair) belong to
    // your eyes, and while you're driving the camera isn't in your head.
    if (state === 'play' && !driving && !flying) drawGun();
    drawHud();
    drawThumbPad();
  }


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000 || 0.016));
    last = now;

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  fitScreen();
  pushOutOfWalls();      // don't start the game inside a building
  seedTheField();        // and don't start it in an empty one either
  requestAnimationFrame(loop);

</script>
</body>
</html>
