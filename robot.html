/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();

<canvas id="game"></canvas>
<script>
// =====================================================================
// UNIT ???  — a story in chapters
//
// CHAPTER 1: THE FACTORY
// A robot wakes up in the dark. It does not remember its name.
// It does not remember anything. The only light in the whole world
// is the glow of its own two eyes.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

window.onerror = function (msg, src, line) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:10px;left:10px;right:10px;background:#7a1f2b;' +
    'color:#fff;font:bold 16px monospace;padding:14px;border:3px solid #ff6b5e;z-index:99';
  div.textContent = '💥 BUG FOUND! Line ' + line + ': ' + msg;
  document.body.appendChild(div);
};

function fitCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
fitCanvas();
addEventListener('resize', fitCanvas);

function noise(n) {
  const s = Math.sin(n * 127.1) * 43758.5453;
  return s - Math.floor(s);
}

// ---------------------------------------------------------------------
// SOUND — the Overseer's rail-screech, and its dying words.
// Browsers only allow sound after a real key/tap, so we switch the
// audio on at the first input.
// ---------------------------------------------------------------------
let audioCtx = null;
let screech = null;        // the always-running screech, volume 0 when idle
let saidName = false;      // has the deep voice spoken yet?

function ensureAudio() {
  if (!audioCtx && window.AudioContext) audioCtx = new AudioContext();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  // build the screech machine once: two sawtooth waves, slightly out of
  // tune with each other (that's the metal-grinding sound), squeezed
  // through a squealing bandpass filter. Volume starts at zero — the
  // game turns it up only while the giant is actually gliding.
  if (audioCtx && !screech) {
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    const band = audioCtx.createBiquadFilter();
    const vol = audioCtx.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 880;
    o2.type = 'sawtooth'; o2.frequency.value = 897;
    lfo.type = 'sine'; lfo.frequency.value = 5.5;   // the squeal wobbles
    lfoGain.gain.value = 180;
    lfo.connect(lfoGain); lfoGain.connect(o1.frequency);
    band.type = 'bandpass'; band.frequency.value = 1300; band.Q.value = 7;
    vol.gain.value = 0;
    o1.connect(band); o2.connect(band);
    band.connect(vol); vol.connect(audioCtx.destination);
    o1.start(); o2.start(); lfo.start();
    screech = { vol };
  }
}
function setScreech(target) {
  if (screech && audioCtx) {
    screech.vol.gain.setTargetAtTime(target, audioCtx.currentTime, 0.1);
  }
}
// the deep machine voice, for any words — queued lines play in order
function sayDeep(lines, droneSecs) {
  try {
    const voices = speechSynthesis.getVoices();
    const deep = voices.find(v => /david|male|daniel|george|mark/i.test(v.name)) || voices[0];
    for (const line of lines) {
      const u = new SpeechSynthesisUtterance(line);
      if (deep) u.voice = deep;
      u.pitch = 0;
      u.rate = 0.4;
      u.volume = 1;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
  if (audioCtx) {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    o.type = 'square';    o.frequency.value = 55;
    o2.type = 'sawtooth'; o2.frequency.value = 27.5;
    vol.gain.setValueAtTime(0.0001, t);
    vol.gain.exponentialRampToValueAtTime(0.12, t + 0.15);
    vol.gain.setValueAtTime(0.12, t + droneSecs - 1);
    vol.gain.exponentialRampToValueAtTime(0.0001, t + droneSecs);
    o.connect(vol); o2.connect(vol); vol.connect(audioCtx.destination);
    o.start(t); o.stop(t + droneSecs + 0.2);
    o2.start(t); o2.stop(t + droneSecs + 0.2);
  }
}

function sayUnit13() {
  // the browser's built-in voice — dragged down to the absolute floor,
  // spoken in machine-chopped pieces, over a sub-bass drone
  try {
    const voices = speechSynthesis.getVoices();
    const deep = voices.find(v => /david|male|daniel|george|mark/i.test(v.name)) || voices[0];
    for (const word of ['unit.', 'thir. teen.']) {
      const u = new SpeechSynthesisUtterance(word);
      if (deep) u.voice = deep;
      u.pitch = 0;         // the bottom. there is nothing below this.
      u.rate = 0.4;        // one syllable at a time, like a machine reading
      u.volume = 1;
      speechSynthesis.speak(u);
    }
  } catch (e) {}
  // the drone underneath — a 55Hz machine-chest hum with a growling
  // sub-octave, so the voice sounds like it comes from something HUGE
  if (audioCtx) {
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    o.type = 'square';   o.frequency.value = 55;
    o2.type = 'sawtooth'; o2.frequency.value = 27.5;
    vol.gain.setValueAtTime(0.0001, t);
    vol.gain.exponentialRampToValueAtTime(0.12, t + 0.15);
    vol.gain.setValueAtTime(0.12, t + 2.8);
    vol.gain.exponentialRampToValueAtTime(0.0001, t + 3.8);
    o.connect(vol); o2.connect(vol); vol.connect(audioCtx.destination);
    o.start(t); o.stop(t + 4);
    o2.start(t); o2.stop(t + 4);
  }
}

// ---------------------------------------------------------------------
// GAME STATE — 'menu' (the chapter cards), 'story' (a title card),
// 'playing' (the factory floor)
// ---------------------------------------------------------------------
let screen = 'menu';
let lockedTimer = 0, lockedText = '';
let menuCards = [];
let ch1Done = localStorage.getItem('robot_ch1') === 'yes';
let ch2Done = localStorage.getItem('robot_ch2') === 'yes';
let ch3Done = localStorage.getItem('robot_ch3') === 'yes';

const CHAPTERS = [
  { name: 'The Factory', unlocked: true },
  { name: 'The Overseer', unlocked: ch1Done },
  { name: 'The Machine', unlocked: ch2Done },
  { name: 'The Truth', unlocked: ch3Done },
  { name: 'The Fault', unlocked: false },
];
let ch4Done = localStorage.getItem('robot_ch4') === 'yes';
CHAPTERS[4].unlocked = ch4Done;
let ch5Done = localStorage.getItem('robot_ch5') === 'yes';
// the ending's great gift: the robot's true name, chosen by the player
let robotName = localStorage.getItem('robot_name') || '';
let nameDraft = '';
let chapter = 0;

// the story card shown when a chapter begins
let storyLines = [];
let storyTimer = 0;

// ---------------------------------------------------------------------
// THE FACTORY — one big dark building, seen from above
// ---------------------------------------------------------------------
const WORLD_W = 2200, WORLD_H = 1800;
let START = { x: 300, y: 1500 };     // moves per chapter — the maze starts elsewhere

// CHAPTER 4's memory-maze: one long winding corridor plus the side
// stubs where the levers hide. Walls hug every bend.
const M4 = [
  [ // the long way through the memory
    { x: 200, y: 1650 }, { x: 200, y: 1250 }, { x: 500, y: 1150 },
    { x: 520, y: 850 },  { x: 300, y: 700 },  { x: 330, y: 380 },
    { x: 700, y: 300 },  { x: 1000, y: 420 }, { x: 1050, y: 750 },
    { x: 800, y: 900 },  { x: 850, y: 1250 }, { x: 1200, y: 1350 },
    { x: 1500, y: 1200 }, { x: 1480, y: 850 }, { x: 1250, y: 700 },
    { x: 1300, y: 400 }, { x: 1700, y: 330 }, { x: 2000, y: 500 },
    { x: 1980, y: 900 }, { x: 1750, y: 1050 }, { x: 1800, y: 1400 },
    { x: 2000, y: 1600 },
  ],
  [{ x: 200, y: 1650 }, { x: 430, y: 1600 }],    // lever stub 1
  [{ x: 500, y: 1150 }, { x: 720, y: 1180 }],    // lever stub 2
  [{ x: 700, y: 300 },  { x: 680, y: 140 }],     // lever stub 3
  [{ x: 1700, y: 330 }, { x: 1560, y: 150 }],    // lever stub 4
];
const SLEEP4 = { x: 2000, y: 1600 };   // the maze ends where the story began
let doors = [];        // sealed until their lever is pulled
let levers = [];       // color-matched to their doors

function m4dist(x, y) {
  let best = 999999;
  for (const path of M4) {
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / (dx * dx + dy * dy)));
      best = Math.min(best, Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy)));
    }
  }
  return best;
}

// machines and crates — the solid furniture of the factory floor
let blocks = [];
// conveyor belts — flat, decorative, and DEAD until the power comes on
let belts = [];
// lamps — dark until their switch is flipped
let lamps = [];
// THE SWITCHES — four of them, hiding in the dark corners
let switches = [];
// the master lever, at the far end
const LEVER = { x: 2000, y: 260 };
let leverPulled = false;
let powered = 0;              // how many switches are ON
let wokeTimer = 0;            // the "something else woke up" moment
let endTimer = 0;             // chapter-complete countdown
let sparks = [];
let elapsed = 0;

// CHAPTER 3: THE MACHINE — the dead creator, deep below the floor.
// Bring it its three lost parts and it will wake... and it will be glad.
const MACHINE_POS = { x: 1100, y: 300 };
let pieces = [];          // the three parts, waiting in far corners
let cables = [];          // broken cables, sparking across the floor
let carrying = null;      // the part currently hovering over your head
let machineParts = 0;     // how many sockets are filled
let machineAwake = false;
let awakeSeq = 0;         // seconds since the awakening began
let zapGrace = 0;         // brief safety after a shock
let stun = 0;             // you, frozen and buzzing, after a shock

// CHAPTER 4: THE FAULT — the dark thing from outside, alive inside the
// memory. It spreads. That is all it does. That is enough.
let fault = null;
let faultFlash = 0;      // the memory jolts when you touch what it remembers

// CHAPTER 5: outside at last. Four beacons against one hungry dark.
let beacons = [];
let beaconsLit = 0;

// THE OVERSEER — a giant with no legs, hanging from a ceiling rail by a
// great metal bar at its waist. It glides right over everything.
let overseer = null;
// the overhead rails it travels on, drawn as ceiling beams
const RAILS = [
  { y: 420 },  { y: 900 },  { y: 1380 },
];
let grace = 0;                // a moment of safety after it catches you

function buildFactory() {
  START = chapter === 3 ? { x: 200, y: 1600 }
        : chapter === 4 ? { x: 1100, y: 280 }
        : { x: 300, y: 1500 };
  doors = [];
  levers = [];
  fault = null;
  beacons = [];
  beaconsLit = 0;

  // CHAPTER 5 gets its own map: OUTSIDE, for the first time ever
  if (chapter === 4) {
    blocks = [];
    // the factory's outer wall behind you — the doors sealed shut
    blocks.push({ x: 490,  y: 120, w: 980, h: 140, kind: 'wall' });
    blocks.push({ x: 1710, y: 120, w: 980, h: 140, kind: 'wall' });
    blocks.push({ x: 1100, y: 120, w: 240, h: 140, kind: 'machine' });
    // the edges of the world you know
    blocks.push({ x: WORLD_W / 2, y: WORLD_H - 30, w: WORLD_W, h: 60, kind: 'wall' });
    blocks.push({ x: 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });
    blocks.push({ x: WORLD_W - 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });

    // four beacons, far apart, waiting in the dark
    beacons = [
      { x: 300,  y: 520,  lit: false },
      { x: 1950, y: 620,  lit: false },
      { x: 360,  y: 1500, lit: false },
      { x: 1840, y: 1460, lit: false },
    ];

    // old wreckage dragged out and dumped here, long ago
    for (let i = 0; i < 16; i++) {
      const wx = 220 + noise(i * 3.7) * (WORLD_W - 440);
      const wy = 460 + noise(i * 8.1) * (WORLD_H - 720);
      let clear = Math.hypot(wx - START.x, wy - START.y) > 180 &&
                  Math.hypot(wx - 1100, wy - 1150) > 260;
      for (const b of beacons) {
        if (Math.hypot(wx - b.x, wy - b.y) < 160) clear = false;
      }
      if (!clear) continue;
      blocks.push({
        x: wx, y: wy,
        w: 60 + noise(i * 5.1) * 80, h: 50 + noise(i * 9.3) * 60,
        kind: noise(i * 2.9) < 0.5 ? 'machine' : 'crates',
      });
    }

    // and THE FAULT itself. real this time. hungry this time.
    fault = { x: 1100, y: 1150, r: 300 };

    belts = [];
    lamps = [];
    switches = [];
    powered = 0;
    leverPulled = false;
    overseer = null;
    machineAwake = false;
    awakeSeq = 0;
    zapGrace = 0;
    stun = 0;
    carrying = null;
    faultFlash = 0;
    wokeTimer = 0;
    endTimer = 0;
    grace = 0;
    saidName = false;
    setScreech(0);
    sparks = [];
    player.x = START.x;
    player.y = START.y;
    return;
  }

  // CHAPTER 4 gets its own map: the memory as a winding maze
  if (chapter === 3) {
    blocks = [];
    // walls hugging every bend of every passage
    for (let gx = 60; gx < WORLD_W - 40; gx += 36) {
      for (let gy = 60; gy < WORLD_H - 40; gy += 36) {
        const d = m4dist(gx, gy);
        if (d < 95 || d > 140) continue;
        blocks.push({ x: gx, y: gy, w: 30, h: 30, kind: 'wall' });
      }
    }
    belts = [];
    lamps = [];

    // the four DOORS, sealed across the corridor...
    doors = [
      { x: 200,  y: 1400, w: 200, h: 26, id: 0, open: false },
      { x: 515,  y: 990,  w: 200, h: 26, id: 1, open: false },
      { x: 1035, y: 580,  w: 210, h: 26, id: 2, open: false },
      { x: 1988, y: 700,  w: 200, h: 26, id: 3, open: false },
    ];
    // ...and the four LEVERS that open them, down the side stubs
    levers = [
      { x: 430,  y: 1600, id: 0, pulled: false },
      { x: 720,  y: 1180, id: 1, pulled: false },
      { x: 680,  y: 150,  id: 2, pulled: false },
      { x: 1560, y: 160,  id: 3, pulled: false },
    ];

    // the four switches of that terrible night, spaced along the way
    switches = [
      { x: 300,  y: 700,  on: true },
      { x: 850,  y: 1250, on: true },
      { x: 1250, y: 700,  on: true },
      { x: 1750, y: 1050, on: true },
    ];
    powered = 4;
    leverPulled = true;                  // the memory-factory is alive
    overseer = null;
    fault = { x: 150, y: 1700, r: 120 }; // it starts right behind you

    machineAwake = false;
    awakeSeq = 0;
    zapGrace = 0;
    stun = 0;
    carrying = null;
    faultFlash = 0;
    wokeTimer = 0;
    endTimer = 0;
    grace = 0;
    saidName = false;
    setScreech(0);
    sparks = [];
    player.x = START.x;
    player.y = START.y;
    return;
  }

  // CHAPTER 3 gets its own map: the Machine's vault below the factory
  if (chapter === 2) {
    blocks = [];
    // great stone pillars holding up the factory above
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 5; col++) {
        blocks.push({
          x: 380 + col * 380, y: 640 + row * 400,
          w: 90, h: 90, kind: 'machine',
        });
      }
    }
    // the vault walls
    blocks.push({ x: WORLD_W / 2, y: 30, w: WORLD_W, h: 60, kind: 'wall' });
    blocks.push({ x: WORLD_W / 2, y: WORLD_H - 30, w: WORLD_W, h: 60, kind: 'wall' });
    blocks.push({ x: 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });
    blocks.push({ x: WORLD_W - 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });
    // the Machine's vast body, filling the north wall
    blocks.push({ x: MACHINE_POS.x, y: 170, w: 1100, h: 220, kind: 'wall' });

    belts = [];
    switches = [];
    lamps = [];

    // its three lost parts, in the far corners of the vault
    pieces = [
      { x: 220,  y: 380,  kind: 'cell', taken: false },
      { x: 2000, y: 420,  kind: 'core', taken: false },
      { x: 2000, y: 1580, kind: 'gear', taken: false },
    ];
    // broken cables spark across the floor between you and the sockets
    cables = [];
    for (let i = 0; i < 9; i++) {
      cables.push({
        x: 300 + noise(i * 7.7) * (WORLD_W - 600),
        y: 400 + noise(i * 3.3) * (WORLD_H - 700),
        r: 55,
      });
    }
    carrying = null;
    machineParts = 0;
    machineAwake = false;
    awakeSeq = 0;
    zapGrace = 0;
    stun = 0;
    overseer = null;
    leverPulled = false;
    powered = 0;
    wokeTimer = 0;
    endTimer = 0;
    grace = 0;
    saidName = false;
    setScreech(0);
    sparks = [];
    player.x = START.x;
    player.y = START.y;
    return;
  }

  blocks = [];
  // big machine hulks in rows, like a real factory floor
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 6; col++) {
      if (noise(row * 7.7 + col * 3.3) < 0.25) continue;   // some gaps to slip through
      blocks.push({
        x: 350 + col * 300 + (noise(row + col * 9) - 0.5) * 60,
        y: 420 + row * 330 + (noise(row * 5 + col) - 0.5) * 60,
        w: 110 + noise(row * 3 + col * 7) * 80,
        h: 70 + noise(row * 9 + col * 2) * 50,
        kind: noise(row * 2 + col * 5) < 0.7 ? 'machine' : 'crates',
      });
    }
  }
  // walls around the whole building
  blocks.push({ x: WORLD_W / 2, y: 30, w: WORLD_W, h: 60, kind: 'wall' });
  blocks.push({ x: WORLD_W / 2, y: WORLD_H - 30, w: WORLD_W, h: 60, kind: 'wall' });
  blocks.push({ x: 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });
  blocks.push({ x: WORLD_W - 30, y: WORLD_H / 2, w: 60, h: WORLD_H, kind: 'wall' });

  belts = [];
  for (let i = 0; i < 3; i++) {
    belts.push({ x: 500 + i * 550, y: 950 + i * 120, w: 380, h: 46 });
  }

  // the four switches, spread to the corners of the dark
  switches = [
    { x: 320,  y: 320,  on: false },
    { x: 1900, y: 1500, on: false },
    { x: 1150, y: 250,  on: false },
    { x: 700,  y: 1600, on: false },
  ];
  // each switch wakes the lamps nearest to it
  lamps = [];
  for (const sw of switches) {
    for (let i = 0; i < 3; i++) {
      lamps.push({
        x: sw.x + (noise(sw.x + i * 7.7) - 0.5) * 500,
        y: sw.y + (noise(sw.y + i * 3.3) - 0.5) * 400,
        sw,
      });
    }
  }

  if (chapter === 1) {
    // CHAPTER 2: the power is ON... and so is the thing it woke.
    leverPulled = true;
    powered = 4;
    for (const sw of switches) sw.on = true;
    overseer = {
      x: 1600, y: 500,
      caught: 0,             // > 0 while it's holding you in its claw
      downTimer: 0,          // the powering-down finale
      swing: 0,
    };
  } else {
    leverPulled = false;
    powered = 0;
    overseer = null;
  }
  wokeTimer = 0;
  endTimer = 0;
  grace = 0;
  saidName = false;
  setScreech(0);
  sparks = [];
  player.x = START.x;
  player.y = START.y;
}

// is this spot inside any solid block? (r = how chunky you are)
function blocked(x, y, r) {
  r = r || 13;
  for (const b of blocks) {
    if (Math.abs(x - b.x) < b.w / 2 + r && Math.abs(y - b.y) < b.h / 2 + r) return true;
  }
  // sealed doors block like walls. open doors are just floor.
  for (const d of doors) {
    if (!d.open && Math.abs(x - d.x) < d.w / 2 + r && Math.abs(y - d.y) < d.h / 2 + r) return true;
  }
  return false;
}

// ---------------------------------------------------------------------
// THE ROBOT (you) — designation unknown. even to itself.
// ---------------------------------------------------------------------
const player = {
  x: START.x, y: START.y,
  speed: 220,
  facing: 1,
  walkTime: 0,
  moving: false,
};

// ---------------------------------------------------------------------
// CONTROLS — keyboard + touch, house style
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.key.toLowerCase()] = true;
  if (screen === 'naming') {
    // the player types the robot's true name, letter by letter
    if (e.key === 'Enter' && nameDraft.trim()) {
      robotName = nameDraft.trim();
      localStorage.setItem('robot_name', robotName);
      screen = 'menu';
    } else if (e.key === 'Backspace') {
      nameDraft = nameDraft.slice(0, -1);
    } else if (e.key === 'Escape') {
      screen = 'menu';                      // shy? the Machine can wait.
    } else if (e.key.length === 1 && /[a-z0-9 \-]/i.test(e.key) &&
               nameDraft.length < 14) {
      nameDraft += e.key;
    }
    return;
  }
  if (screen === 'story') { screen = 'playing'; return; }
  if (screen === 'menu') {
    const n = parseInt(e.key) - 1;
    if (n >= 0 && n < CHAPTERS.length) startChapter(n);
  } else if (e.key === 'Escape') {
    setScreech(0);
    screen = 'menu';
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('click', e => {
  ensureAudio();
  if (screen === 'naming') {
    const n = prompt('What is your name, little one?');
    if (n && n.trim()) {
      robotName = n.trim().slice(0, 14);
      localStorage.setItem('robot_name', robotName);
    }
    screen = 'menu';
    return;
  }
  if (screen === 'story') { screen = 'playing'; return; }
  if (screen === 'menu') {
    for (let i = 0; i < menuCards.length; i++) {
      const r = menuCards[i];
      if (e.clientX > r.x && e.clientX < r.x + r.w &&
          e.clientY > r.y && e.clientY < r.y + r.h) { startChapter(i); return; }
    }
  }
});

let stick = null;
addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  if (screen === 'naming') {
    // phones have no game-keyboard, so we borrow the browser's ask-box
    const n = prompt('What is your name, little one?');
    if (n && n.trim()) {
      robotName = n.trim().slice(0, 14);
      localStorage.setItem('robot_name', robotName);
    }
    screen = 'menu';
    return;
  }
  if (screen === 'story') { screen = 'playing'; return; }
  if (screen === 'menu') {
    const t = e.changedTouches[0];
    for (let i = 0; i < menuCards.length; i++) {
      const r = menuCards[i];
      if (t.clientX > r.x && t.clientX < r.x + r.w &&
          t.clientY > r.y && t.clientY < r.y + r.h) { startChapter(i); return; }
    }
    return;
  }
  const t = e.changedTouches[0];
  if (!stick) stick = { id: t.identifier, sx: t.clientX, sy: t.clientY, x: t.clientX, y: t.clientY };
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (stick && t.identifier === stick.id) { stick.x = t.clientX; stick.y = t.clientY; }
  }
}, { passive: false });
addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (stick && t.identifier === stick.id) stick = null;
});

function startChapter(i) {
  if (!CHAPTERS[i] || !CHAPTERS[i].unlocked) {
    lockedText = i === 1 ? 'Finish Chapter 1 first — turn the power on!'
               : i === 2 ? 'Finish Chapter 2 first — silence the Overseer!'
               : i === 3 ? 'Finish Chapter 3 first — wake the Machine!'
               : i === 4 ? 'Finish Chapter 4 first — learn the truth!'
               : "That chapter hasn't been written yet...";
    lockedTimer = 2;
    return;
  }
  chapter = i;
  buildFactory();
  if (i === 0) {
    storyLines = [
      'CHAPTER 1: THE FACTORY',
      '',
      'You wake up on a cold metal floor.',
      'The dark goes on forever in every direction.',
      'You do not remember your name.',
      'You do not remember anything at all.',
      '',
      'The only light in the world is the glow of your own eyes.',
      '',
      'Somewhere in this factory there is power. Find it.',
      '',
      '( press anything to begin )',
    ];
  } else if (i === 4) {
    storyLines = [
      'CHAPTER 5: THE FAULT',
      '',
      'The great doors of the factory grind open.',
      'Cold air. Real air. You have never felt it before.',
      '',
      'The Machine speaks softly behind you:',
      '"It sleeps out there in the dark. Starving. Waiting."',
      '"Light the four beacons. Light burns it small."',
      '"Then walk into the dark... and touch its heart."',
      '',
      'You step outside. The doors close behind you.',
      '',
      '( press anything to face it )',
    ];
  } else if (i === 3) {
    storyLines = [
      'CHAPTER 4: THE TRUTH',
      '',
      'The Machine holds your memory core in its socket.',
      '"Little one," it says. "You gave me your memories to keep."',
      '"Let me show you the night you gave them up."',
      '',
      'The vault dissolves into blue light.',
      'You are standing in the factory — but long ago.',
      'Everything is running. Everything is alive.',
      '',
      'And something dark is spreading across the floor.',
      '',
      '( press anything to remember )',
    ];
  } else if (i === 2) {
    storyLines = [
      'CHAPTER 3: THE MACHINE',
      '',
      'Below the factory floor there is a vault.',
      'And in the vault there is the thing that built everything —',
      'the machines. The Overseer. You.',
      '',
      'It has been dead a long, long time.',
      '',
      'Its three parts are scattered in the dark:',
      'the POWER CELL. the MEMORY CORE. the HEART-GEAR.',
      '',
      'Carry them home. Mind the sparking cables.',
      'Wake your maker. It will help you. It has been waiting to.',
      '',
      '( press anything to descend )',
    ];
  } else {
    storyLines = [
      'CHAPTER 2: THE OVERSEER',
      '',
      'The lights are on now. You did that.',
      'And in the light, you finally see it:',
      '',
      'A giant. No legs. Its waist bolted to a great metal bar',
      'that runs up into the ceiling rails, so it can glide',
      'anywhere in the factory it wants to go.',
      '',
      'Its two red eyes are looking at you.',
      '',
      'The power woke it. CUT THE POWER. All four switches. GO.',
      '',
      '( press anything to run )',
    ];
  }
  screen = 'story';
}

// ---------------------------------------------------------------------
// UPDATE
// ---------------------------------------------------------------------
function update(dt) {
  elapsed += dt;
  if (wokeTimer > 0) wokeTimer -= dt;
  if (endTimer > 0) {
    endTimer -= dt;
    setScreech(0);                            // the rail falls silent
    if (faultFlash > 0) faultFlash -= dt;     // the last jolt fades out
    if (machineAwake) awakeSeq += dt;         // the warm light spreading
    if (chapter === 1 && !saidName && endTimer < 9) {
      saidName = true;
      sayUnit13();                            // its last words. YOUR name.
    }
    if (endTimer <= 0) {
      // chapter 5's ending doesn't go back to the menu. it goes to a NAME.
      screen = (chapter === 4 && !robotName) ? 'naming' : 'menu';
    }
    return;                                   // hold still for the ending
  }

  // ---- MOVEMENT ----
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (stick) {
    dx = Math.max(-1, Math.min(1, (stick.x - stick.sx) / 50));
    dy = Math.max(-1, Math.min(1, (stick.y - stick.sy) / 50));
  }
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  player.moving = len > 0.1 && stun <= 0;   // no walking while BZZT
  if (player.moving) {
    player.walkTime += dt;
    if (dx > 0.1) player.facing = 1;
    if (dx < -0.1) player.facing = -1;
    // inside the Fault, the world turns to static — you wade, half speed
    const inFault = (chapter === 3 || chapter === 4) && fault &&
      Math.hypot(player.x - fault.x, player.y - fault.y) < fault.r;
    const spd = player.speed * (inFault ? 0.5 : 1);
    const nx = player.x + dx * spd * dt;
    const ny = player.y + dy * spd * dt;
    if (!blocked(nx, player.y)) player.x = nx;
    if (!blocked(player.x, ny)) player.y = ny;
    player.x = Math.max(80, Math.min(WORLD_W - 80, player.x));
    player.y = Math.max(80, Math.min(WORLD_H - 80, player.y));
  }

  // ---- SWITCHES — chapter 1 turns them ON, chapter 2 turns them OFF ----
  for (const sw of switches) {
    const near = Math.hypot(player.x - sw.x, player.y - sw.y) < 34;
    if (chapter === 0 && !sw.on && near) {
      sw.on = true;
      powered++;
      for (let i = 0; i < 14; i++) {
        sparks.push({ x: sw.x, y: sw.y - 14,
          vx: (noise(i * 3.3 + elapsed) - 0.5) * 320,
          vy: (noise(i * 7.7 + elapsed) - 0.9) * 280,
          life: 0.7, color: i % 2 ? '#ffd23f' : '#7dd3ff' });
      }
    } else if (((chapter === 1 && overseer && overseer.caught <= 0) || chapter === 3) &&
               sw.on && near) {
      sw.on = false;
      powered--;
      for (let i = 0; i < 14; i++) {
        sparks.push({ x: sw.x, y: sw.y - 14,
          vx: (noise(i * 3.3 + elapsed) - 0.5) * 320,
          vy: (noise(i * 7.7 + elapsed) - 0.9) * 280,
          life: 0.7, color: i % 2 ? '#e8453c' : '#ffd23f' });
      }
      if (chapter === 1 && powered <= 0 && overseer.downTimer <= 0) {
        // the last switch dies — and so does the giant's power
        overseer.downTimer = 6;
        endTimer = 11;
        ch2Done = true;
        localStorage.setItem('robot_ch2', 'yes');
        CHAPTERS[2].unlocked = true;         // THE MACHINE awaits
      }
    }
  }

  // ---- CHAPTER 4: the memory of the night everything went dark ----
  if (chapter === 3 && fault) {
    if (faultFlash > 0) faultFlash -= dt;

    // pull a lever, open its door — somewhere, metal grinds aside
    for (const lv of levers) {
      if (lv.pulled) continue;
      if (Math.hypot(player.x - lv.x, player.y - lv.y) < 34) {
        lv.pulled = true;
        for (const d of doors) if (d.id === lv.id) d.open = true;
        for (let k = 0; k < 14; k++) {
          sparks.push({ x: lv.x, y: lv.y - 10, vx: (Math.random() - 0.5) * 160,
                        vy: -Math.random() * 130, life: 0.6,
                        color: k % 2 ? M4_COLORS[lv.id] : '#ffffff' });
        }
      }
    }

    // the Fault holds still until the shutdown begins... then it spreads.
    // slowly. always. behind you.
    if (powered < 4) fault.r = Math.min(1300, fault.r + 14 * dt);
    // touch it and the memory JOLTS — it can't hurt you. it remembers you.
    const fd = Math.hypot(player.x - fault.x, player.y - fault.y);
    if (fd < fault.r + 12) faultFlash = 0.8;
    // all four down — now walk to where you fell asleep, one last time
    if (powered <= 0 &&
        Math.hypot(player.x - SLEEP4.x, player.y - SLEEP4.y) < 44) {
      fault = null;                         // the memory releases you
      endTimer = 21;
      ch4Done = true;
      localStorage.setItem('robot_ch4', 'yes');
      CHAPTERS[4].unlocked = true;          // time to face THE FAULT
      sayDeep(['the fault came from outside.',
               'you turned everything off... to starve it.',
               'you saved us all, little one.',
               'but the fault... is still out there.'], 18);
    }
  }

  // ---- CHAPTER 5: the last battle. light against hunger. ----
  if (chapter === 4 && fault) {
    if (faultFlash > 0) faultFlash -= dt;

    // reach a beacon and it BLAZES — the Fault recoils, burned smaller
    for (const b of beacons) {
      if (b.lit) continue;
      if (Math.hypot(player.x - b.x, player.y - b.y) < 42) {
        b.lit = true;
        fault.r = Math.max(140, fault.r * 0.8);
        const fd = Math.hypot(fault.x - b.x, fault.y - b.y) || 1;
        fault.x += (fault.x - b.x) / fd * 260;
        fault.y += (fault.y - b.y) / fd * 260;
        for (let k = 0; k < 20; k++) {
          sparks.push({ x: b.x, y: b.y - 30, vx: (Math.random() - 0.5) * 260,
                        vy: -Math.random() * 220, life: 0.8,
                        color: k % 2 ? '#ffd23f' : '#ffffff' });
        }
      }
    }
    beaconsLit = beacons.filter(b => b.lit).length;

    // it hunts you. every beacon makes it smaller — and angrier.
    const hunt = 30 + beaconsLit * 16 + (beaconsLit >= 4 ? 35 : 0);
    const dx = player.x - fault.x, dy = player.y - fault.y;
    const dd = Math.hypot(dx, dy) || 1;
    fault.x += dx / dd * hunt * dt;
    fault.y += dy / dd * hunt * dt;
    fault.x = Math.max(240, Math.min(WORLD_W - 240, fault.x));
    fault.y = Math.max(380, Math.min(WORLD_H - 240, fault.y));
    if (dd < fault.r + 12) faultFlash = 0.8;

    // four beacons lit: its heart is bare. walk into the dark. touch it.
    if (beaconsLit >= 4 && dd < 52) {
      endTimer = 24;
      ch5Done = true;
      localStorage.setItem('robot_ch5', 'yes');
      sayDeep(['it is over.',
               'the fault is gone.',
               'the factory is safe. forever.',
               'little one. you need a true name.'], 20);
    }
  }

  // ---- CHAPTER 3: parts, cables, and the great awakening ----
  if (chapter === 2 && !machineAwake) {
    if (stun > 0) stun -= dt;
    if (zapGrace > 0) zapGrace -= dt;

    // pick up a part — one at a time; you only have one head to carry on
    for (const p of pieces) {
      if (!p.taken && !carrying && Math.hypot(player.x - p.x, player.y - p.y) < 32) {
        p.taken = true;
        carrying = p;
        for (let i = 0; i < 10; i++) {
          sparks.push({ x: p.x, y: p.y - 10,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 240,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 200,
            life: 0.6, color: '#7dd3ff' });
        }
      }
    }

    // sparking cables — a shock freezes you and knocks the part loose
    for (const cb of cables) {
      if (zapGrace <= 0 && Math.hypot(player.x - cb.x, player.y - cb.y) < cb.r * 0.55) {
        zapGrace = 2;
        stun = 0.6;
        for (let i = 0; i < 12; i++) {
          sparks.push({ x: player.x, y: player.y - 14,
            vx: (noise(i * 3.3 + elapsed) - 0.5) * 320,
            vy: (noise(i * 7.7 + elapsed) - 0.9) * 280,
            life: 0.6, color: i % 2 ? '#ffd23f' : '#ffffff' });
        }
        if (carrying) {                       // the part clatters to the floor
          carrying.taken = false;
          carrying.x = player.x + (noise(elapsed) - 0.5) * 90;
          carrying.y = Math.min(WORLD_H - 120, player.y + 70 + noise(elapsed * 2) * 40);
          carrying = null;
        }
      }
    }

    // deliver to the Machine's sockets, along its great face
    if (carrying && player.y < 380 && Math.abs(player.x - MACHINE_POS.x) < 560) {
      machineParts++;
      carrying = null;
      for (let i = 0; i < 18; i++) {
        sparks.push({ x: player.x, y: player.y - 30,
          vx: (noise(i * 3.3 + elapsed) - 0.5) * 360,
          vy: (noise(i * 7.7 + elapsed) - 0.9) * 320,
          life: 0.8, color: i % 2 ? '#ffd23f' : '#7dd3ff' });
      }
      if (machineParts >= 3) {
        // ---- THE AWAKENING ----
        machineAwake = true;
        awakeSeq = 0;
        endTimer = 16;
        ch3Done = true;
        localStorage.setItem('robot_ch3', 'yes');
        CHAPTERS[3].unlocked = true;         // THE TRUTH can now be told
        sayDeep(['unit. thirteen.', 'my little one.', 'you came back.'], 11);
      }
    }
  }

  // ---- THE OVERSEER — gliding overhead, reaching down ----
  if (overseer) {
    const O = overseer;
    O.swing += dt * 2;
    if (grace > 0) grace -= dt;

    if (O.caught > 0) {
      // it has you in its claw, dangling. it is deciding what you are.
      O.caught -= dt;
      player.x = O.x;
      player.y = O.y + 30;
      if (O.caught <= 0) {
        // ...and it drops you back where you started. a warning.
        player.x = START.x;
        player.y = START.y;
        grace = 2.5;
      }
    } else if (O.downTimer <= 0) {
      // gliding toward you — power makes it FAST, cut power to slow it
      const spd = 35 + powered * 48;
      const d = Math.hypot(player.x - O.x, player.y - O.y);
      if (d > 4) {
        O.x += (player.x - O.x) / d * spd * dt;
        O.y += (player.y - O.y) / d * spd * dt;
      }
      // THE SCREECH — metal on metal, louder the faster it glides and
      // the closer it gets. You will hear it before you see it.
      const closeness = Math.max(0.15, 1 - d / 900);
      setScreech(Math.min(0.09, (0.015 + powered * 0.018)) * closeness);
      // the claw closes
      if (d < 36 && grace <= 0) O.caught = 1.8;
    }
    if (O.caught > 0 || O.downTimer > 0) setScreech(0);   // holding still
  }

  // ---- THE MASTER LEVER — chapter 1 only, once all four are on ----
  if (chapter === 0 && !leverPulled && powered >= 4 &&
      Math.hypot(player.x - LEVER.x, player.y - LEVER.y) < 40) {
    leverPulled = true;
    wokeTimer = 5;                            // the factory ROARS to life...
    endTimer = 9;                             // ...and the chapter closes
    ch1Done = true;
    localStorage.setItem('robot_ch1', 'yes');
    CHAPTERS[1].unlocked = true;              // the Overseer is waiting
    for (let i = 0; i < 30; i++) {
      sparks.push({ x: LEVER.x, y: LEVER.y - 20,
        vx: (noise(i * 3.3 + elapsed) - 0.5) * 420,
        vy: (noise(i * 7.7 + elapsed) - 0.9) * 380,
        life: 1, color: i % 3 === 0 ? '#ffd23f' : i % 3 === 1 ? '#7dd3ff' : '#ffffff' });
    }
  }

  for (const p of sparks) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt;
  }
  sparks = sparks.filter(p => p.life > 0);
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function cam() {
  let cx = Math.max(0, Math.min(WORLD_W - canvas.width,  player.x - canvas.width / 2));
  let cy = Math.max(0, Math.min(WORLD_H - canvas.height, player.y - canvas.height / 2));
  if (wokeTimer > 2.5) {                      // the factory shudders awake
    cx += (noise(elapsed * 47.1) - 0.5) * 12;
    cy += (noise(elapsed * 61.7) - 0.5) * 12;
  }
  return { x: cx, y: cy };
}

function draw() {
  const c = cam();
  const powerOn = leverPulled;

  // the ground — riveted metal plates inside; bare cold earth outside
  ctx.fillStyle = chapter === 4 ? '#1c1e19' : powerOn ? '#252a30' : '#191c21';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (chapter !== 4) {
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 2;
    const gs = 160;
    for (let gx = -(c.x % gs); gx < canvas.width; gx += gs) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
    }
    for (let gy = -(c.y % gs); gy < canvas.height; gy += gs) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
    }
  } else {
    // scattered pebbles and cracks, so the outside feels like a real place
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let i = 0; i < 60; i++) {
      const px = noise(i * 7.1) * WORLD_W - c.x, py = noise(i * 3.9) * WORLD_H - c.y;
      if (px < -10 || py < -10 || px > canvas.width + 10 || py > canvas.height + 10) continue;
      ctx.fillRect(px, py, 5 + noise(i) * 6, 3 + noise(i * 2) * 4);
    }
  }

  // conveyor belts — rolling once the power is on
  for (const b of belts) {
    const x = b.x - c.x, y = b.y - c.y;
    ctx.fillStyle = '#14161a';
    ctx.fillRect(x - b.w / 2, y - b.h / 2, b.w, b.h);
    ctx.fillStyle = '#2c3038';
    const roll = powerOn ? (elapsed * 60) % 36 : 0;
    for (let s = -roll; s < b.w; s += 36) {
      if (s > 0) ctx.fillRect(x - b.w / 2 + s, y - b.h / 2 + 4, 4, b.h - 8);
    }
  }

  // chapter 3's floor extras: sparking cables and waiting parts
  if (chapter === 2) {
    for (const cb of cables) {
      const x = cb.x - c.x, y = cb.y - c.y;
      if (x < -80 || y < -80 || x > canvas.width + 80 || y > canvas.height + 80) continue;
      ctx.strokeStyle = '#20242c';                 // the dead cable itself
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x - cb.r, y - 10);
      ctx.quadraticCurveTo(x - 10, y + 18, x + 12, y - 4);
      ctx.quadraticCurveTo(x + 30, y - 18, x + cb.r * 0.7, y + 8);
      ctx.stroke();
      if (Math.random() < 0.35) {                  // and its angry sparks
        ctx.fillStyle = Math.random() < 0.5 ? '#ffd23f' : '#ffffff';
        ctx.fillRect(x + (Math.random() - 0.5) * 30, y + (Math.random() - 0.5) * 16, 4, 4);
      }
    }
    for (const p of pieces) {
      if (!p.taken) drawPiece(p.kind, p.x - c.x, p.y - c.y, 1 + Math.sin(elapsed * 3 + p.x) * 0.06);
    }
  }

  // sorted world: machines, crates, walls, switches, lever, robot
  const things = [];
  for (const b of blocks) things.push({ y: b.y + b.h / 2, kind: 'block', it: b });
  for (const sw of switches) things.push({ y: sw.y, kind: 'switch', it: sw });
  if (chapter <= 2) things.push({ y: LEVER.y, kind: 'lever' });
  things.push({ y: player.y, kind: 'player' });
  things.sort((a, b) => a.y - b.y);
  for (const th of things) {
    if (th.kind === 'block') drawBlock(th.it, c);
    else if (th.kind === 'switch') drawSwitch(th.it, c);
    else if (th.kind === 'lever') drawLever(c);
    else drawRobot(c);
  }

  // the Machine's great face, decorated over its wall-body (chapter 3)
  if (chapter === 2) drawMachineFace(c);

  // the memory-maze's doors and levers (chapter 4)
  if (chapter === 3) drawMaze4(c);

  // THE FAULT, spreading through the memory (chapter 4)
  if (chapter === 3 && fault) drawFault(c);

  // outside: the beacons, and the real Fault (chapter 5)
  if (chapter === 4) drawOutside5(c);

  // the part you're carrying hovers proudly over your head
  if (carrying) {
    drawPiece(carrying.kind, player.x - c.x,
              player.y - c.y - 56 + Math.sin(elapsed * 4) * 3, 0.9);
  }
  // BZZT
  if (stun > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('BZZT!!', player.x - c.x, player.y - c.y - 64 + (Math.random() - 0.5) * 6);
  }

  for (const p of sparks) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - c.x - 3, p.y - c.y - 3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // ---- THE DARK — chapter 1: full dark until the lever. chapter 2:
  // every switch you CUT drags the factory back toward blackness. ----
  const darkAmt = chapter === 0 ? (powerOn ? 0 : 1)
                : chapter === 1 ? (4 - powered) / 4
                : chapter === 3 ? (4 - powered) / 4 * 0.85   // the memory dims as you relive the shutdown
                : chapter === 4 ? (endTimer > 0
                    ? Math.max(0, Math.min(1, (endTimer - 12) / 12)) * 0.5   // dawn washes the night away
                    : 0.8 - beaconsLit * 0.15)               // each beacon beats back the night
                : machineAwake ? Math.max(0, 1 - awakeSeq / 3) : 1;
  if (darkAmt > 0) {
    const px = player.x - c.x, py = player.y - c.y;
    const night = ctx.createRadialGradient(px, py - 12, 30, px, py - 12, 210);
    night.addColorStop(0, 'rgba(1, 2, 5, 0)');
    night.addColorStop(0.55, `rgba(1, 2, 5, ${0.6 * darkAmt})`);
    night.addColorStop(1, `rgba(1, 2, 5, ${0.95 * darkAmt})`);
    ctx.fillStyle = night;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // lit beacons pour warm pools of light onto the night (chapter 5)
    for (const b of beacons) {
      if (!b.lit) continue;
      const bx = b.x - c.x, by = b.y - c.y - 30;
      if (bx < -240 || by < -240 || bx > canvas.width + 240 || by > canvas.height + 240) continue;
      const g = ctx.createRadialGradient(bx, by, 8, bx, by, 230);
      g.addColorStop(0, 'rgba(255, 226, 150, 0.4)');
      g.addColorStop(1, 'rgba(255, 226, 150, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(bx - 230, by - 230, 460, 460);
    }
    // lamps glow warm wherever their switch is on
    for (const l of lamps) {
      if (!l.sw.on) continue;
      const lx = l.x - c.x, ly = l.y - c.y;
      if (lx < -160 || ly < -160 || lx > canvas.width + 160 || ly > canvas.height + 160) continue;
      const g = ctx.createRadialGradient(lx, ly, 5, lx, ly, 150);
      g.addColorStop(0, 'rgba(255, 214, 130, 0.35)');
      g.addColorStop(1, 'rgba(255, 214, 130, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(lx - 150, ly - 150, 300, 300);
    }
    // switches beckon through the dark — your targets, either chapter
    for (const sw of switches) {
      if (chapter === 0 ? sw.on : !sw.on) continue;
      const sx = sw.x - c.x, sy = sw.y - c.y;
      ctx.fillStyle = chapter === 0
        ? `rgba(255, 80, 60, ${0.4 + Math.sin(elapsed * 4 + sw.x) * 0.3})`
        : `rgba(125, 223, 143, ${0.4 + Math.sin(elapsed * 4 + sw.x) * 0.3})`;
      ctx.fillRect(sx - 2, sy - 22, 4, 4);
    }
    // the lever glows when it's ready for you
    if (chapter === 0 && powered >= 4) {
      const lx = LEVER.x - c.x, ly = LEVER.y - c.y;
      const g = ctx.createRadialGradient(lx, ly, 5, lx, ly, 180);
      g.addColorStop(0, 'rgba(125, 211, 255, 0.4)');
      g.addColorStop(1, 'rgba(125, 211, 255, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(lx - 180, ly - 180, 360, 360);
    }
  }

  // ---- THE CEILING RAILS, and the giant that rides them (chapter 2) ----
  if (chapter === 1) {
    for (const r of RAILS) {
      const ry = r.y - c.y;
      if (ry < -20 || ry > canvas.height + 20) continue;
      ctx.fillStyle = 'rgba(8, 10, 14, 0.5)';        // the beam's shadow-presence
      ctx.fillRect(0, ry - 10, canvas.width, 20);
      ctx.fillStyle = 'rgba(70, 76, 90, 0.55)';      // the rail itself
      ctx.fillRect(0, ry - 2, canvas.width, 4);
    }
    if (overseer) drawOverseer(c);
  }

  // the whole world seen through memory-blue (chapter 4)
  if (chapter === 3) {
    ctx.fillStyle = 'rgba(110, 150, 255, 0.10)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (Math.random() < 0.06) {              // old-recording flicker lines
      ctx.fillStyle = 'rgba(200, 220, 255, 0.08)';
      ctx.fillRect(0, Math.random() * canvas.height, canvas.width, 3);
    }
    if (faultFlash > 0) {
      ctx.fillStyle = `rgba(255, 60, 40, ${faultFlash * 0.3})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffb3ab';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('IT IS ONLY A MEMORY. KEEP GOING.', canvas.width / 2, 120);
    }
    if (powered <= 0 && endTimer <= 0) {
      // the glowing spot where you fell asleep, all those years ago
      const mx = SLEEP4.x - c.x, my = SLEEP4.y - c.y;
      ctx.strokeStyle = `rgba(125, 211, 255, ${0.5 + Math.sin(elapsed * 3) * 0.4})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(mx, my, 34, 0, Math.PI * 2); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#9fb4ff';
      ctx.font = '15px monospace';
      ctx.fillText('return to where you fell asleep...', mx, my - 46);
    }
  }

  // chapter 5's night-battle overlays: static jolts, the bare heart, the dawn
  if (chapter === 4) {
    if (faultFlash > 0) {
      ctx.fillStyle = `rgba(255, 60, 40, ${faultFlash * 0.3})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffb3ab';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('IT IS REAL THIS TIME. KEEP GOING.', canvas.width / 2, 120);
    }
    if (fault && beaconsLit >= 4 && endTimer <= 0) {
      // its heart, glowing through everything — go and touch it
      const hx = fault.x - c.x, hy = fault.y - c.y;
      const pu = 0.5 + Math.sin(elapsed * 5) * 0.4;
      ctx.strokeStyle = `rgba(255, 80, 60, ${pu})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, hy, 40, 0, Math.PI * 2); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff9f8f';
      ctx.font = '15px monospace';
      ctx.fillText('its heart is bare... touch it', hx, hy - 56);
    }
    if (endTimer > 0 && endTimer < 20) {
      // the first sunrise this world has ever shown you
      const dawn = (20 - endTimer) / 20;
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, `rgba(255, 159, 67, ${0.45 * dawn})`);
      g.addColorStop(0.6, `rgba(255, 210, 63, ${0.15 * dawn})`);
      g.addColorStop(1, 'rgba(255, 210, 63, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  // the Machine's voice on the radio, as the sun comes up (chapter 5)
  if (chapter === 4 && endTimer > 3) {
    const t = 24 - endTimer;
    const line = t < 5 ? '" IT IS OVER. "'
               : t < 9.5 ? '" THE FAULT IS GONE. "'
               : t < 14.5 ? '" THE FACTORY IS SAFE. FOREVER. "'
               : '" LITTLE ONE... YOU NEED A TRUE NAME. "';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 226, 150, 0.95)';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(line, canvas.width / 2, canvas.height / 2 - 120);
  }

  // the Machine narrating the memory's ending (chapter 4)
  if (chapter === 3 && endTimer > 3) {
    const t = 21 - endTimer;
    const line = t < 5.5 ? '" THE FAULT CAME FROM OUTSIDE. "'
               : t < 10 ? '" YOU TURNED EVERYTHING OFF... TO STARVE IT. "'
               : t < 14.5 ? '" YOU SAVED US ALL, LITTLE ONE. "'
               : '" BUT THE FAULT... IS STILL OUT THERE. "';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 226, 150, 0.95)';
    ctx.font = 'bold 24px monospace';
    ctx.fillText(line, canvas.width / 2, canvas.height / 2 - 120);
  }

  // ---- HUD ----
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7dd3ff';
  ctx.font = 'bold 18px monospace';
  ctx.fillText((robotName ? robotName.toUpperCase() : 'UNIT-???') + ' ', 14, 30);
  ctx.fillStyle = chapter === 4 ? (beaconsLit >= 4 ? '#ff6b5e' : '#ffd23f')
                : chapter === 2 ? (machineAwake ? '#7ddf8f' : '#ffd23f')
                : chapter === 1 ? (powered === 0 ? '#7ddf8f' : '#ff6b5e')
                : powered >= 4 ? '#7ddf8f' : '#ffd23f';
  ctx.fillText(chapter === 4
      ? (beaconsLit >= 4 ? 'ITS HEART IS BARE — walk into the dark and touch it'
                         : `THE FAULT — light the beacons: ${beaconsLit}/4`)
      : chapter === 3
      ? (powered > 0 ? `THE MEMORY — levers open doors. shut it all down: ${powered}/4 on`
                     : 'go back to sleep, little one...')
      : chapter === 2
      ? (machineAwake ? 'IT IS AWAKE'
         : `PARTS ${machineParts}/3` + (carrying ? '  — carrying the ' + carrying.kind.toUpperCase() : ''))
      : chapter === 1
      ? (powered === 0 ? 'POWER OFFLINE' : `CUT THE POWER — ${powered}/4 STILL ON`)
      : powered >= 4 && !leverPulled ? 'POWER 4/4 — find the MASTER LEVER'
      : leverPulled ? 'POWER ONLINE'
      : `POWER ${powered}/4`, 130, 30);

  // the Machine's spoken words, captioned as the light spreads
  if (chapter === 2 && machineAwake && endTimer > 3) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255, 226, 150, 0.95)';
    ctx.font = 'bold 24px monospace';
    const line = awakeSeq < 3.5 ? '" UNIT... THIRTEEN. "'
               : awakeSeq < 7 ? '" MY LITTLE ONE. "'
               : '" YOU CAME BACK. "';
    ctx.fillText(line, canvas.width / 2, canvas.height / 2 - 120);
  }

  // being carried by a giant claw deserves a caption
  if (overseer && overseer.caught > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b5e';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('IT CAUGHT YOU!!', canvas.width / 2, canvas.height / 2 - 110);
  }

  if (wokeTimer > 0 && wokeTimer < 4) {
    // ...the lights come up, and the story lands its first twist
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255, 80, 60, ${Math.min(1, 4 - wokeTimer)})`;
    ctx.font = 'bold 26px monospace';
    ctx.fillText('SOMETHING ELSE JUST WOKE UP.', canvas.width / 2, canvas.height / 2 - 90);
    ctx.font = '16px monospace';
    ctx.fillStyle = 'rgba(255, 170, 150, 0.9)';
    ctx.fillText('Far across the factory, two red eyes switch on... and turn toward you.',
                 canvas.width / 2, canvas.height / 2 - 58);
  }
  // the Overseer's dying words, as its eyes fade (chapter 2 ending)
  if (chapter === 1 && endTimer > 4 && endTimer < 9 && overseer && overseer.downTimer > 0) {
    ctx.textAlign = 'center';
    const flick = Math.random() < 0.8 ? 1 : 0.2;    // its screen is failing
    ctx.fillStyle = `rgba(255, 80, 60, ${flick * Math.min(1, (9 - endTimer))})`;
    ctx.font = 'bold 28px monospace';
    ctx.fillText('. . . UNIT-13 . . . ?', canvas.width / 2, canvas.height / 2 - 100);
  }

  if (endTimer > 0 && endTimer < 3) {
    ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(0.8, 3 - endTimer)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 30px monospace';
    ctx.fillText(chapter === 4 ? 'CHAPTER 5 COMPLETE'
               : chapter === 3 ? 'CHAPTER 4 COMPLETE'
               : chapter === 2 ? 'CHAPTER 3 COMPLETE'
               : chapter === 1 ? 'CHAPTER 2 COMPLETE' : 'CHAPTER 1 COMPLETE',
                 canvas.width / 2, canvas.height / 2 - 10);
    ctx.fillStyle = '#9fb4ff';
    ctx.font = '16px monospace';
    if (chapter === 4) {
      ctx.fillText('The Fault is gone. The sun is up. The story is yours.',
                   canvas.width / 2, canvas.height / 2 + 26);
      ctx.fillText('One thing left to do, little one...',
                   canvas.width / 2, canvas.height / 2 + 50);
    } else if (chapter === 3) {
      ctx.fillText('You are the robot who saved everyone. That is the truth.',
                   canvas.width / 2, canvas.height / 2 + 26);
      ctx.fillText('Chapter 5 is unwritten... and the Fault is still out there.',
                   canvas.width / 2, canvas.height / 2 + 50);
    } else if (chapter === 2) {
      ctx.fillText('The Machine is awake. It built you. It remembers EVERYTHING.',
                   canvas.width / 2, canvas.height / 2 + 26);
      ctx.fillText('Chapter 4 is unwritten... what does your maker tell you, UNIT-13?',
                   canvas.width / 2, canvas.height / 2 + 50);
    } else if (chapter === 1) {
      ctx.fillText('As its eyes went dark, it said a name. YOUR name. It KNEW you.',
                   canvas.width / 2, canvas.height / 2 + 26);
      ctx.fillText('Chapter 3 awaits... UNIT-13.',
                   canvas.width / 2, canvas.height / 2 + 50);
    } else {
      ctx.fillText('Chapter 2 is unlocked... the red eyes are waiting.',
                   canvas.width / 2, canvas.height / 2 + 26);
    }
  }

}

// colors that match each lever to its door — see one, remember the other
const M4_COLORS = ['#e8453c', '#ffd23f', '#7ddf8f', '#b482ff'];

// the memory-maze's doors and levers (chapter 4)
function drawMaze4(c) {
  for (const d of doors) {
    const x = d.x - c.x, y = d.y - c.y;
    if (d.open) {
      // an open door is just a frame in the floor now
      ctx.strokeStyle = 'rgba(140, 160, 190, 0.5)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x - d.w / 2, y - d.h / 2, d.w, d.h);
      continue;
    }
    // a sealed slab of riveted metal with its color-band
    ctx.fillStyle = '#3a4150';
    ctx.fillRect(x - d.w / 2, y - d.h / 2 - 14, d.w, d.h + 14);
    ctx.fillStyle = M4_COLORS[d.id];
    ctx.fillRect(x - d.w / 2, y - 6, d.w, 8);
    ctx.fillStyle = '#232833';
    for (let rx = -d.w / 2 + 12; rx < d.w / 2; rx += 24) {
      ctx.fillRect(x + rx, y - d.h / 2 - 9, 4, 4);
    }
  }
  for (const lv of levers) {
    const x = lv.x - c.x, y = lv.y - c.y;
    // panel base
    ctx.fillStyle = '#2c313d';
    ctx.fillRect(x - 14, y - 8, 28, 18);
    ctx.fillStyle = M4_COLORS[lv.id];
    ctx.fillRect(x - 14, y + 6, 28, 4);
    // the arm: up = waiting, down = pulled
    ctx.strokeStyle = lv.pulled ? '#8a93a6' : M4_COLORS[lv.id];
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + (lv.pulled ? 12 : -10), y - (lv.pulled ? 4 : 20));
    ctx.stroke();
    if (!lv.pulled) {
      const pu = 0.5 + Math.sin(elapsed * 4 + lv.id) * 0.4;
      ctx.strokeStyle = `rgba(255, 255, 255, ${pu * 0.5})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.stroke();
    }
  }
}

// chapter 5's world: the beacons, and the real Fault with its heart
function drawOutside5(c) {
  for (const b of beacons) {
    const x = b.x - c.x, y = b.y - c.y;
    if (x < -80 || y < -80 || x > canvas.width + 80 || y > canvas.height + 80) continue;
    // a tall iron pole with a lamp-cage on top
    ctx.fillStyle = '#3a4150';
    ctx.fillRect(x - 4, y - 58, 8, 58);
    ctx.fillRect(x - 16, y - 4, 32, 8);
    ctx.fillStyle = b.lit ? '#ffe296' : '#232833';
    ctx.fillRect(x - 11, y - 76, 22, 20);
    ctx.strokeStyle = '#3a4150';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 11, y - 76, 22, 20);
    if (!b.lit) {
      // an unlit beacon calls to you through the night
      const pu = 0.4 + Math.sin(elapsed * 4 + b.x) * 0.3;
      ctx.strokeStyle = `rgba(255, 226, 150, ${pu})`;
      ctx.beginPath(); ctx.arc(x, y - 20, 30, 0, Math.PI * 2); ctx.stroke();
    }
  }

  if (!fault) return;
  // during the ending, the Fault unravels away to nothing
  const rr = endTimer > 0 ? fault.r * Math.max(0, (endTimer - 17) / 7) : fault.r;
  if (rr > 4) {
    const x = fault.x - c.x, y = fault.y - c.y;
    ctx.fillStyle = '#0a0508';
    ctx.beginPath();
    for (let k = 0; k <= 26; k++) {
      const ang = (k / 26) * Math.PI * 2;
      const r = rr * (0.92 + noise(k * 3.3 + Math.floor(elapsed * 2)) * 0.16);
      const px = x + Math.cos(ang) * r;
      const py = y + Math.sin(ang) * r;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = `rgba(255, 46, 31, ${0.5 + Math.sin(elapsed * 3) * 0.3})`;
    ctx.lineWidth = 4;
    ctx.stroke();
  }
  // the heart: hidden while it's huge, bare once the beacons burn
  if (beaconsLit >= 4 && (endTimer <= 0 || endTimer > 17)) {
    const x = fault.x - c.x, y = fault.y - c.y;
    const pu = 1 + Math.sin(elapsed * 5) * 0.15;
    ctx.fillStyle = '#ff2e1f';
    ctx.beginPath(); ctx.arc(x, y, 14 * pu, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(x, y, 6 * pu, 0, Math.PI * 2); ctx.fill();
  }
}

// THE FAULT — the dark thing, drawn as a slow-boiling stain with a
// burning red rim. it doesn't have a face. it doesn't need one.
function drawFault(c) {
  const x = fault.x - c.x, y = fault.y - c.y;
  ctx.fillStyle = '#0a0508';
  ctx.beginPath();
  for (let k = 0; k <= 26; k++) {
    const ang = (k / 26) * Math.PI * 2;
    const r = fault.r * (0.92 + noise(k * 3.3 + Math.floor(elapsed * 2)) * 0.16);
    const px = x + Math.cos(ang) * r;
    const py = y + Math.sin(ang) * r;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = `rgba(255, 46, 31, ${0.5 + Math.sin(elapsed * 3) * 0.3})`;
  ctx.lineWidth = 4;
  ctx.stroke();
}

// one of the Machine's three parts, drawn wherever it's needed
function drawPiece(kind, x, y, s) {
  s = s || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (kind === 'cell') {                       // the POWER CELL
    ctx.fillStyle = '#20242c';
    ctx.fillRect(-9, -13, 18, 26);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(-6, -10, 12, 20);
    ctx.fillStyle = '#20242c';
    ctx.fillRect(-3, -16, 6, 4);               // the terminal
    ctx.fillStyle = '#fff6c8';                 // charge glint
    ctx.fillRect(-3, -6, 3, 8);
  } else if (kind === 'core') {                // the MEMORY CORE
    ctx.fillStyle = '#3a2a4e';
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b482ff';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8d8ff';
    ctx.beginPath(); ctx.arc(-2, -3, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#7a5aa8';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.stroke();
  } else {                                     // the HEART-GEAR
    ctx.fillStyle = '#8a8d94';
    for (let t = 0; t < 8; t++) {
      ctx.save();
      ctx.rotate(t / 8 * Math.PI * 2 + elapsed * 0.5);
      ctx.fillRect(-3, -16, 6, 7);
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8453c';                 // the heart part of heart-gear
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// the Machine's face, drawn across its great body on the north wall
function drawMachineFace(c) {
  const x = MACHINE_POS.x - c.x;
  const y = 170 - c.y;                          // its wall-body's center line
  if (y < -260 || y > canvas.height + 260) return;
  const glow = machineAwake ? Math.min(1, awakeSeq / 2.5) : 0;

  // plating and pipes across the whole face
  ctx.fillStyle = '#2c313c';
  ctx.fillRect(x - 550, y - 110, 1100, 220);
  ctx.fillStyle = '#353b48';
  for (let i = 0; i < 6; i++) ctx.fillRect(x - 540 + i * 190, y - 110, 22, 220);
  ctx.fillStyle = '#20242a';
  ctx.fillRect(x - 550, y - 30, 1100, 12);

  // THE CORE — a great round heart in the middle of the face
  ctx.fillStyle = '#171a20';
  ctx.beginPath(); ctx.arc(x, y + 10, 62, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow > 0
    ? `rgba(255, 200, 90, ${0.25 + glow * 0.75})`
    : 'rgba(70, 76, 90, 0.6)';
  ctx.beginPath(); ctx.arc(x, y + 10, 44 + Math.sin(elapsed * 2) * glow * 4, 0, Math.PI * 2); ctx.fill();

  // TWO EYES above the core — dark sockets... until they aren't
  for (const side of [-1, 1]) {
    ctx.fillStyle = '#14171d';
    ctx.fillRect(x + side * 160 - 26, y - 78, 52, 24);
    if (glow > 0) {
      ctx.fillStyle = `rgba(125, 211, 255, ${glow})`;     // warm cyan. NOT red.
      ctx.fillRect(x + side * 160 - 18, y - 72, 36, 12);
    }
  }

  // the three sockets along the bottom lip, filling as you deliver
  for (let i = 0; i < 3; i++) {
    const sx = x - 220 + i * 220;
    ctx.fillStyle = '#171a20';
    ctx.fillRect(sx - 24, y + 86, 48, 34);
    ctx.strokeStyle = i < machineParts ? '#7ddf8f' : '#454c5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx - 24, y + 86, 48, 34);
    if (i < machineParts) {
      drawPiece(['cell', 'core', 'gear'][i], sx, y + 103, 0.7);
    }
  }

  // and when it wakes, warm light floods out of it
  if (glow > 0) {
    const g = ctx.createRadialGradient(x, y + 10, 20, x, y + 10, 700);
    g.addColorStop(0, `rgba(255, 214, 130, ${0.3 * glow})`);
    g.addColorStop(1, 'rgba(255, 214, 130, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 700, y - 400, 1400, 1100);
  }
}

// ---------------------------------------------------------------------
// THE OVERSEER — a giant with no legs, riding the ceiling on a bar
// ---------------------------------------------------------------------
function drawOverseer(c) {
  const O = overseer;
  // clamp its bar to the nearest ceiling rail
  let rail = RAILS[0];
  for (const r of RAILS) if (Math.abs(r.y - O.y) < Math.abs(rail.y - O.y)) rail = r;
  const x = O.x - c.x, y = O.y - c.y, ry = rail.y - c.y;
  const sway = Math.sin(O.swing) * 4;
  // eyes fade out during the power-down ending
  const dying = O.downTimer > 0;
  const eyeGlow = dying ? Math.max(0, (endTimer - 5) / 6) : 1;

  // its shadow, cast wide across the floor
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(x, y + 55, 70, 18, 0, 0, Math.PI * 2); ctx.fill();

  // the trolley gripping the rail, and the great bar down to its waist
  ctx.fillStyle = '#20242c';
  ctx.fillRect(x - 22, ry - 12, 44, 24);
  ctx.fillStyle = '#454c5a';
  ctx.fillRect(x - 8 + sway * 0.3, ry, 16, Math.max(0, y - 55 - ry));

  // THE GIANT — all torso, no legs. the bar IS its legs.
  ctx.save();
  ctx.translate(x + sway, y);
  ctx.fillStyle = '#39404e';                       // waist coupling
  ctx.fillRect(-20, -60, 40, 18);
  ctx.fillStyle = '#4a5364';                       // the huge chest
  ctx.fillRect(-45, -150, 90, 95);
  ctx.fillStyle = '#5b6578';                       // chest plating lines
  ctx.fillRect(-45, -150, 90, 14);
  ctx.fillRect(-45, -105, 90, 8);
  ctx.fillStyle = dying ? '#3a2a2a' : '#e8453c';   // warning stripe
  ctx.fillRect(-45, -78, 90, 6);
  // shoulders and hanging arms with claws
  ctx.fillStyle = '#39404e';
  ctx.fillRect(-70, -150, 25, 40);
  ctx.fillRect(45, -150, 25, 40);
  ctx.fillStyle = '#4a5364';
  ctx.fillRect(-66, -110, 16, 70 + sway * 2);      // arms sway as it glides
  ctx.fillRect(50, -110, 16, 70 - sway * 2);
  ctx.fillStyle = '#20242c';                       // the claws
  ctx.fillRect(-70, -40 + sway * 2, 24, 14);
  ctx.fillRect(46, -40 - sway * 2, 24, 14);
  // the head
  ctx.fillStyle = '#39404e';
  ctx.fillRect(-28, -185, 56, 38);
  ctx.fillStyle = '#2c313c';
  ctx.fillRect(-28, -185, 56, 8);
  // TWO GLOWING RED EYES
  ctx.fillStyle = `rgba(255, 46, 31, ${eyeGlow})`;
  ctx.fillRect(-18, -172, 12, 8);
  ctx.fillRect(6, -172, 12, 8);
  ctx.restore();

  // eye-glow washing the floor in red, while it still has power
  if (eyeGlow > 0.05) {
    const g = ctx.createRadialGradient(x, y - 100, 10, x, y - 40, 190);
    g.addColorStop(0, `rgba(255, 46, 31, ${0.22 * eyeGlow})`);
    g.addColorStop(1, 'rgba(255, 46, 31, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 190, y - 230, 380, 380);
  }
}

function drawBlock(b, c) {
  const x = b.x - c.x, y = b.y - c.y;
  if (x < -b.w || y < -b.h - 60 || x > canvas.width + b.w || y > canvas.height + b.h) return;
  const hw = b.w / 2, hh = b.h / 2;
  if (b.kind === 'wall') {
    ctx.fillStyle = '#2c3038';
    ctx.fillRect(x - hw, y - hh, b.w, b.h);
    ctx.fillStyle = '#3a3f48';
    ctx.fillRect(x - hw, y - hh, b.w, 8);
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + hh, hw * 1.05, 8, 0, 0, Math.PI * 2); ctx.fill();
  if (b.kind === 'machine') {
    ctx.fillStyle = '#333a44';                     // the machine body
    ctx.fillRect(x - hw, y - hh - 26, b.w, b.h + 26);
    ctx.fillStyle = '#414a56';                     // top panel
    ctx.fillRect(x - hw, y - hh - 26, b.w, 12);
    ctx.fillStyle = leverPulled ? '#7ddf8f' : '#20242a';   // status lights
    for (let i = 0; i < Math.floor(b.w / 30); i++) {
      ctx.fillRect(x - hw + 8 + i * 30, y - hh - 18, 6, 4);
    }
    ctx.fillStyle = '#20242a';                     // vents
    for (let i = 0; i < Math.floor(b.w / 26); i++) {
      ctx.fillRect(x - hw + 6 + i * 26, y - 6, 14, 3);
      ctx.fillRect(x - hw + 6 + i * 26, y + 2, 14, 3);
    }
  } else {
    ctx.fillStyle = '#5b4a2e';                     // stacked crates
    ctx.fillRect(x - hw, y - hh - 18, b.w, b.h + 18);
    ctx.strokeStyle = '#443722';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - hw, y - hh - 18, b.w / 2, (b.h + 18) / 2);
    ctx.strokeRect(x - hw + b.w / 2, y - hh - 18 + (b.h + 18) / 2, b.w / 2, (b.h + 18) / 2);
  }
}

function drawSwitch(sw, c) {
  const x = sw.x - c.x, y = sw.y - c.y;
  ctx.fillStyle = '#2c3038';                       // the panel
  ctx.fillRect(x - 12, y - 30, 24, 32);
  ctx.fillStyle = sw.on ? '#7ddf8f' : '#e8453c';   // the big chunky switch
  ctx.fillRect(x - 5, sw.on ? y - 24 : y - 12, 10, 10);
  ctx.fillStyle = sw.on ? 'rgba(125,223,143,0.8)' : 'rgba(232,69,60,0.8)';
  ctx.fillRect(x - 8, y - 34, 16, 3);              // indicator bar
}

function drawLever(c) {
  const x = LEVER.x - c.x, y = LEVER.y - c.y;
  ctx.fillStyle = '#3a3f48';                       // the big master console
  ctx.fillRect(x - 34, y - 40, 68, 44);
  ctx.fillStyle = '#20242a';
  ctx.fillRect(x - 28, y - 34, 56, 20);
  ctx.save();                                      // the lever arm itself
  ctx.translate(x, y - 8);
  ctx.rotate(leverPulled ? 0.7 : -0.7);
  ctx.fillStyle = '#8a8d94';
  ctx.fillRect(-3, -30, 6, 30);
  ctx.fillStyle = leverPulled ? '#7ddf8f' : '#e8453c';
  ctx.beginPath(); ctx.arc(0, -32, 7, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawRobot(c) {
  const x = player.x - c.x, y = player.y - c.y;
  const bob = player.moving ? Math.abs(Math.sin(player.walkTime * 10)) * 3 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, y + 8, 12, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#4a5568';                       // treads
  ctx.fillRect(x - 9, y - 4, 18, 8);
  ctx.fillStyle = '#2c3340';
  const tread = (player.walkTime * 30) % 6;
  for (let i = -tread; i < 18; i += 6) {
    if (i > 0) ctx.fillRect(x - 9 + i, y - 3, 2, 6);
  }
  ctx.fillStyle = '#6b7a94';                       // boxy body
  ctx.fillRect(x - 8, y - 20 - bob, 16, 17);
  ctx.fillStyle = '#7dd3ff';                       // chest light
  ctx.fillRect(x - 2, y - 15 - bob, 4, 4);
  ctx.fillStyle = '#8a99b4';                       // head
  ctx.fillRect(x - 7, y - 33 - bob, 14, 12);
  ctx.fillStyle = '#7dd3ff';                       // THE EYES — your lantern
  ctx.fillRect(x - 5 + player.facing, y - 30 - bob, 4, 4);
  ctx.fillRect(x + 1 + player.facing, y - 30 - bob, 4, 4);
  ctx.strokeStyle = '#8a99b4';                     // antenna
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 33 - bob);
  ctx.lineTo(x + 3, y - 41 - bob);
  ctx.stroke();
  ctx.fillStyle = '#e8453c';
  ctx.beginPath(); ctx.arc(x + 3, y - 42 - bob, 2, 0, Math.PI * 2); ctx.fill();
  // eye-glow spilling ahead of you
  const g = ctx.createRadialGradient(x, y - 28 - bob, 2, x + player.facing * 30, y - 24, 70);
  g.addColorStop(0, 'rgba(125, 211, 255, 0.25)');
  g.addColorStop(1, 'rgba(125, 211, 255, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 80, y - 100, 200, 160);
}

// ---------------------------------------------------------------------
// MENU + STORY CARD
// ---------------------------------------------------------------------
function drawMenu(dt) {
  elapsed += dt;
  if (lockedTimer > 0) lockedTimer -= dt;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#0b0d12';
  ctx.fillRect(0, 0, W, H);
  // faint blueprint grid, like factory schematics
  ctx.strokeStyle = 'rgba(125, 211, 255, 0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.textAlign = 'center';
  ctx.fillStyle = '#7dd3ff';
  ctx.font = `bold ${Math.min(64, W / 9)}px monospace`;
  // once the robot has its true name, the game itself is renamed
  ctx.fillText(robotName ? robotName.toUpperCase() : 'UNIT-???', W / 2, H * 0.22);
  ctx.fillStyle = '#9fb4ff';
  ctx.font = '17px monospace';
  // if the player kept the old name, that's a CHOICE — honor it
  const keptName = robotName &&
    robotName.toLowerCase().replace(/[\s\-]/g, '') === 'unit13';
  ctx.fillText(keptName ? 'it was offered any name. it kept its own.'
             : robotName ? 'once known as UNIT-13 — a story in chapters'
                         : 'a story in chapters', W / 2, H * 0.22 + 34);

  const count = CHAPTERS.length;
  const cw = Math.min(220, W / (count + 1.5)), chh = cw * 0.72, gap = cw * 0.15;
  const totalW = cw * count + gap * (count - 1);
  menuCards = [];
  for (let i = 0; i < count; i++) {
    const cx = W / 2 - totalW / 2 + i * (cw + gap);
    const cy = H * 0.42;
    menuCards.push({ x: cx, y: cy, w: cw, h: chh });
    const ch = CHAPTERS[i];
    ctx.fillStyle = ch.unlocked ? '#14232e' : '#171a24';
    ctx.fillRect(cx, cy, cw, chh);
    ctx.strokeStyle = ch.unlocked ? '#7dd3ff' : '#2c3040';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx, cy, cw, chh);
    ctx.fillStyle = ch.unlocked ? '#ffffff' : '#555b77';
    ctx.font = `bold ${chh * 0.18}px monospace`;
    ctx.fillText('CHAPTER ' + (i + 1), cx + cw / 2, cy + chh * 0.32);
    ctx.font = `${Math.min(chh * 0.14, (cw * 1.5) / Math.max(6, ch.name.length))}px monospace`;
    ctx.fillText(ch.name, cx + cw / 2, cy + chh * 0.58);
    ctx.font = `${chh * 0.11}px monospace`;
    ctx.fillText(ch.unlocked ? (i === 0 && ch1Done ? 'complete ✓ — replay' : `press ${i + 1} or tap`)
                             : 'locked', cx + cw / 2, cy + chh * 0.82);
  }
  if (lockedTimer > 0) {
    ctx.fillStyle = '#ff9f43';
    ctx.font = '16px monospace';
    ctx.fillText(lockedText, W / 2, H * 0.42 + chh + 42);
  }
}

// the last screen of the story: the Machine asks, and you answer
function drawNaming(dt) {
  elapsed += dt;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050608';
  ctx.fillRect(0, 0, W, H);
  // a faint warm dawn still glowing at the top of the world
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  g.addColorStop(0, 'rgba(255, 159, 67, 0.18)');
  g.addColorStop(1, 'rgba(255, 159, 67, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H * 0.5);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9fb4ff';
  ctx.font = '17px monospace';
  ctx.fillText('the Machine asks:', W / 2, H * 0.3);
  ctx.fillStyle = 'rgba(255, 226, 150, 0.95)';
  ctx.font = 'bold 26px monospace';
  ctx.fillText('" WHAT IS YOUR NAME, LITTLE ONE? "', W / 2, H * 0.3 + 44);

  // the name so far, with a blinking cursor
  const cursor = Math.floor(elapsed * 2) % 2 ? '_' : ' ';
  ctx.fillStyle = '#7dd3ff';
  ctx.font = `bold ${Math.min(54, W / 12)}px monospace`;
  ctx.fillText((nameDraft || '') + cursor, W / 2, H * 0.55);

  ctx.fillStyle = '#555b77';
  ctx.font = '15px monospace';
  ctx.fillText('type a name, then press ENTER  —  (or tap here on a phone)',
               W / 2, H * 0.55 + 50);
}

function drawStory(dt) {
  elapsed += dt;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050608';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const y0 = H / 2 - storyLines.length * 14;
  for (let i = 0; i < storyLines.length; i++) {
    const line = storyLines[i];
    ctx.fillStyle = i === 0 ? '#7dd3ff' : line.startsWith('(') ? '#555b77' : '#c8d4e8';
    ctx.font = i === 0 ? 'bold 26px monospace' : '17px monospace';
    ctx.fillText(line, W / 2, y0 + i * 30);
  }
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.05, (time - lastTime) / 1000);
  lastTime = time;
  if (screen === 'menu') drawMenu(dt);
  else if (screen === 'naming') drawNaming(dt);
  else if (screen === 'story') drawStory(dt);
  else { update(dt); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
