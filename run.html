<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RUN!</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RUN!">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #141020; color: #ffe9c8;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; cursor: pointer; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 6px;
    text-align: center; font-size: 14px; color: #6f6288;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="screen"></canvas>
<div id="hud">SPACE or CLICK to jump &nbsp;&nbsp; hold it for the full 3 squares &nbsp;&nbsp; press again in the air to double jump</div>

<script>
// ===================================================================
//  RUN!
//
//  THIS ONE IS 2D, and that is the whole point of it.
//
//  Every other game in Max's arcade is built the same way: work out
//  where a 3D corner lands on the screen, make a list of flat faces,
//  sort them furthest-away-first and fill them in. None of that here.
//  In 2D a thing at x,y IS at x,y - you subtract where the camera is
//  and draw a rectangle. No maths in between.
//
//  What that buys you is speed and certainty. What it costs you is
//  depth, so the sense of SPEED has to come from somewhere else: from
//  layers moving at different rates, from the ground streaking past,
//  and from the enormous thing behind you eating the scenery.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function groundY() { return H * 0.78; }     // where the pavement is


// -------------------------------------------------------------------
//  THE NUMBERS
// -------------------------------------------------------------------

  const START_SPEED = 380;     // pixels a second at the start
  const TOP_SPEED   = 900;     // and it never gets faster than this
  const SPEED_UP    = 9;       // how much quicker per second survived

  // -----------------------------------------------------------------
  //  THE GRID, AND A JUMP THAT ALWAYS FITS IT
  // -----------------------------------------------------------------
  //
  //  Maximus wanted the ground to be a grid you can read, and a jump
  //  that goes exactly THREE squares across and TWO squares up. So you
  //  can look at a gap, count the squares, and KNOW.
  //
  //  The trouble is you speed up as you run, and a jump that carries
  //  you three squares at walking pace carries you six at full pelt.
  //  So the jump isn't fixed - it's worked out FROM your speed, every
  //  time, to land on exactly the promise.
  //
  //  If you want to be three squares wide, you must be in the air for
  //  time  t = 3 * GRID / speed.  A jump that takes t seconds and gets
  //  h high needs:
  //
  //      gravity = 8h / t*t        and       kick = gravity * t / 2
  //
  //  Put h = 2 grids in and the whole thing falls out. Three across and
  //  two up, at 380 pixels a second or at 900.
  const JUMP_ACROSS = 3;       // squares of HOLE you can clear
  const JUMP_UP     = 2;       // squares of BLOCK you can clear

  // A LITTLE MORE THAN THE PROMISE.
  //
  // Built to exactly three and two, the arc measured 2.97 across and
  // 1.87 up - so the widest hole and the tallest block were each a hair
  // TOO BIG, and a perfect run died at 23 metres. Clearing a three-wide
  // hole isn't reaching the far edge, it's landing your feet past it.
  // So the arc is built a bit bigger than the promise, and the promise
  // then comes true.
  const OVER_ACROSS = 0.55;
  const OVER_UP     = 0.4;

  function GRID() { return Math.round(clamp(H * 0.105, 42, 78)); }

  function airTime() { return (JUMP_ACROSS + OVER_ACROSS) * GRID() / speed; }
  function gravity() { const t = airTime();
                       return 8 * ((JUMP_UP + OVER_UP) * GRID()) / (t * t); }
  function jumpKick() { return gravity() * airTime() / 2; }

  const PLAYER_W = 26, PLAYER_H = 44;

  // HOW CLOSE THE MONSTER IS. This is the whole game in one number:
  // 0 means it's got you, 1 means it's a long way back.
  const LEAD_START = 0.72;
  const LEAD_BACK  = 0.055;    // you claw this much back per second, running clean
  const HIT_COST   = 0.26;     // and lose this much every time you clatter into something


// -------------------------------------------------------------------
//  THE WORLD
// -------------------------------------------------------------------
//
//  It's made as you go and thrown away behind you. Nothing is stored
//  for a place you'll never see again - the whole world is a couple of
//  short lists that keep getting topped up in front and trimmed off
//  the back.

  let camX = 0;
  let dist = 0;            // how far you've run, in metres
  let speed = START_SPEED;
  let lead = LEAD_START;
  let clock = 0;
  let state = 'ready';     // 'ready', 'run', 'dead'
  let best = 0;

  let blocks = [];         // things to jump over
  let pits = [];           // holes in the pavement
  let scenery = [];        // buildings behind, for the monster to eat
  let bits = [];           // flying debris
  let crates = [];         // still falling out of the sky
  let crateTimer = 3.5;
  let booms = [];          // the flashes going off behind you
  let flash = 0;           // the whole screen going white, like Bob's
  let shake = 0;           // and the whole screen jolting
  let lastHalf = 0;        // the last half-square you crossed

  const player = {
    x: 0, y: 0, vy: 0,
    onGround: true,
    jumps: 0,              // how many jumps used since last touching the ground
    holding: 0,            // how long the button has been held this jump
    stumble: 0,            // slowed down after clattering into something
    run: 0                 // the leg-swing timer
  };

  // Where the front of the monster is, in world x. Everything behind
  // this line is gone.
  function monsterX() {
    // These two numbers decide how much of it you can SEE, and the
    // first go had it fully off the left of the screen until you were
    // nearly dead - which rather wastes a monster. Now its teeth are
    // in shot from the very first stride, and it fills more and more
    // of the screen as it gains.
    return player.x - lead * (W * 0.42) - 60;
  }

  function reset() {
    camX = 0; dist = 0; speed = START_SPEED; lead = LEAD_START; clock = 0;
    blocks = []; pits = []; scenery = []; bits = []; crates = []; booms = [];
    crateTimer = 3.5; lastHalf = 0; flash = 0; shake = 0;
    player.x = 0; player.y = 0; player.vy = 0;
    player.onGround = true; player.jumps = 0; player.holding = 0;
    player.stumble = 0; player.run = 0;
    madeTo = 0;
    // Fill the road ahead so you're never running at an empty screen.
    while (madeTo < 3000) makeMore();
    state = 'ready';
  }

  // ---- MAKING THE ROAD AHEAD ------------------------------------------
  let madeTo = 0;

  function makeMore() {
    // EVERYTHING IS WHOLE SQUARES. A hole is 1, 2 or 3 wide and a block
    // is 1 or 2 high, so nothing is ever a hair too big to clear - you
    // can count it off the floor before you get there.
    const g = GRID();
    const hard = Math.min(1, dist / 900);

    // Gaps between things, in squares. Four to seven squares LOOKS like
    // plenty on paper and isn't: a jump is in the air for nearly four
    // squares' worth, so you land and have to take off again with no
    // stride in between. A perfect run died at 93 metres. Seven to
    // twelve gives you room to land, run, and set up the next one.
    madeTo += (7 + Math.floor(Math.random() * 6)) * g;

    const roll = Math.random();

    if (roll < 0.16 + hard * 0.12) {
      // A HOLE. Never wider than the jump - THREE squares is the most
      // there will ever be, and three squares is exactly what you have.
      const wide = 1 + Math.floor(Math.random() * (hard > 0.5 ? 3 : 2));
      pits.push({ x: madeTo, w: wide * g, squares: wide });
      madeTo += wide * g;
    } else if (roll < 0.52) {
      // A BLOCK, one or two squares tall - and two is exactly your
      // jump, so the tallest thing here is always just clearable.
      const tall = 1 + (Math.random() < 0.35 + hard * 0.3 ? 1 : 0);
      blocks.push({ x: madeTo, w: g * 0.7, h: tall * g, hit: false, squares: tall });
    } else if (roll < 0.78) {
      // A PLATFORM. Wide enough to land on and run along, one or two
      // squares up. You can go over it OR along the top of it, and
      // going along the top is faster because you skip what's beside it.
      const tall = 1 + (Math.random() < 0.45 ? 1 : 0);
      const wide = 3 + Math.floor(Math.random() * 4);
      blocks.push({ x: madeTo, w: wide * g, h: tall * g,
                    hit: false, squares: tall, platform: true });
      madeTo += wide * g;

      // Sometimes a second one, a step up - so you can climb.
      if (Math.random() < 0.45) {
        const w2 = 3 + Math.floor(Math.random() * 3);
        blocks.push({ x: madeTo + 3 * g, w: w2 * g, h: Math.min(2, tall + 1) * g,
                      hit: false, squares: Math.min(2, tall + 1), platform: true });
        madeTo += 3 * g + w2 * g;
      }
    } else {
      // TWO BLOCKS, five squares apart. Three squares looked like the
      // right answer because three is the jump - but a jump is IN THE
      // AIR for three and a half, so you were still coming down when
      // the second one arrived. Five leaves you a stride to land and
      // take off again.
      blocks.push({ x: madeTo, w: g * 0.7, h: g, hit: false, squares: 1 });
      blocks.push({ x: madeTo + 5 * g, w: g * 0.7, h: g * 2, hit: false, squares: 2 });
      madeTo += 5 * g;
    }

    // Something in the background for the monster to smash.
    scenery.push({
      x: madeTo - GRID() * 3,
      w: 90 + Math.random() * 140,
      h: 120 + Math.random() * 260,
      shade: 0.5 + Math.random() * 0.4,
      gone: false
    });
  }

  function tidyUp() {
    // Anything behind the monster is gone for good.
    const back = monsterX() - 400;
    blocks  = blocks.filter(function (b) { return b.x + b.w > back; });
    pits    = pits.filter(function (p) { return p.x + p.w > back; });
    scenery = scenery.filter(function (s) { return s.x + s.w > back; });
    bits    = bits.filter(function (b) { return b.life > 0 && b.x > back - 300; });
    if (bits.length > BITS_MAX) bits = bits.slice(bits.length - BITS_MAX);
    while (madeTo < player.x + W + 1600) makeMore();
  }


// -------------------------------------------------------------------
//  JUMPING
// -------------------------------------------------------------------

  let held = false;

  function jump() {
    if (state === 'ready') { state = 'run'; return; }
    if (state === 'dead')  { reset(); state = 'run'; return; }

    // Two jumps: one off the ground, one in mid-air. The second one is
    // what makes a double block clearable instead of just cruel.
    if (player.jumps >= 2) return;
    player.jumps++;
    player.vy = -jumpKick();
    player.onGround = false;
  }

  // Is there pavement under a given world x?
  function floorAt(x) {
    for (const p of pits) {
      if (x > p.x && x < p.x + p.w) return false;
    }
    return true;
  }

  // WHAT IS UNDER HIS FEET.
  //
  // Remember y is upside down here: 0 is the pavement and NEGATIVE is
  // higher up. So a platform one square tall has its top at -GRID.
  //
  // Only surfaces at or below the feet count. Stood on the pavement
  // beside a two-square platform, that platform is over your head, not
  // under your boots - and forgetting that is how you get a player who
  // teleports onto things by walking past them.
  function supportUnder(x, feetY) {
    let best = null;
    for (const b of blocks) {
      if (x < b.x || x > b.x + b.w) continue;
      const top = -b.h;
      if (top >= feetY - 2) {
        if (best === null || top < best) best = top;
      }
    }
    if (best !== null) return best;
    return floorAt(x) ? 0 : null;
  }


// -------------------------------------------------------------------
//  THE CLOCK
// -------------------------------------------------------------------

  function update(dt) {
    if (state !== 'run') { clock += dt; return; }
    clock += dt;

    // ---- SPEED ---------------------------------------------------------
    speed = Math.min(TOP_SPEED, speed + SPEED_UP * dt);
    if (player.stumble > 0) player.stumble -= dt;
    const now = speed * (player.stumble > 0 ? 0.55 : 1);

    player.x += now * dt;
    dist += now * dt / 30;             // 30 pixels to a metre
    player.run += dt * now * 0.02;

    // ---- UP AND DOWN ---------------------------------------------------
    // Holding the button keeps pushing you up for a moment, so a tap is
    // a hop and a hold is a proper leap. One button, two jumps.
    const wasY = player.y;
    player.vy += gravity() * dt;
    player.y += player.vy * dt;

    const mid = player.x + PLAYER_W / 2;

    // ---- COMING DOWN ONTO SOMETHING ------------------------------------
    // Only ever from above, and only while falling. Landing is crossing
    // a surface downwards; anything else is walking into its side.
    let landed = false;
    if (player.vy >= 0) {
      const sup = supportUnder(mid, wasY);
      if (sup !== null && wasY <= sup + 2 && player.y >= sup) {
        player.y = sup; player.vy = 0;
        player.onGround = true; player.jumps = 0;
        landed = true;
      }
    }

    // ---- WALKING OFF THE END OF ONE ------------------------------------
    if (!landed && player.onGround) {
      const still = supportUnder(mid, player.y);
      if (still === null || Math.abs(still - player.y) > 3) {
        player.onGround = false;      // nothing there now - over you go
        player.jumps = Math.max(player.jumps, 1);   // no free ground-jump
      }
    }

    if (!landed && player.y >= 0) {
      // Only land if there is actually pavement here.
      if (floorAt(player.x) && floorAt(player.x + PLAYER_W)) {
        player.y = 0; player.vy = 0;
        player.onGround = true;
        player.jumps = 0;
      } else {
        // DOWN THE HOLE. Not instant death - the monster simply catches
        // up while you climb out, which is a punishment you can see.
        player.onGround = false;
        if (player.y > 220) {
          lead -= HIT_COST * 1.6;
          bump(player.x, 0, [[120, 96, 60], [90, 74, 50]], 14);

          // OUT THE FAR SIDE, on solid ground. The first version put you
          // back at y = -260, which is 260 pixels UP - so falling down a
          // hole fired you into the sky. A hole should cost you time,
          // not turn into a trampoline.
          let landing = player.x + 60;
          for (const q of pits) {
            if (player.x > q.x - 30 && player.x < q.x + q.w + 30) {
              landing = Math.max(landing, q.x + q.w + 34);
            }
          }
          player.x = landing;
          player.y = 0; player.vy = 0;
          player.onGround = true; player.jumps = 0;
          player.stumble = 0.4;
        }
      }
    }

    // ---- CLATTERING INTO THINGS ----------------------------------------
    for (const b of blocks) {
      if (b.hit) continue;
      if (player.x + PLAYER_W < b.x || player.x > b.x + b.w) continue;
      // Stood ON it, or over the top of it? Then you didn't hit it -
      // you cleared it, or you're running along it.
      if (-player.y > b.h - 6) continue;
      b.hit = true;
      player.stumble = 0.55;
      lead -= HIT_COST;
      bump(b.x + b.w / 2, b.h / 2, [[190, 120, 70], [140, 88, 54]], 16);
    }

    // ---- THE MONSTER ---------------------------------------------------
    // Run clean and you pull away. Every mistake hands ground back.
    // NEVER BELOW ZERO. Left unclamped it kept falling after you died,
    // and since the monster's front edge is worked out FROM lead, it
    // quietly slid past you and stood in front - which is not where
    // the thing chasing you should be.
    lead = clamp(lead + LEAD_BACK * dt, 0, 1);
    if (lead <= 0) {
      state = 'dead';
      best = Math.max(best, Math.floor(dist));
      bump(player.x, 30, [[210, 90, 110], [150, 60, 80]], 26);
    }

    // ---- WHAT THE MONSTER HAS EATEN ------------------------------------
    const mx = monsterX();
    for (const s of scenery) {
      if (s.gone || s.x > mx) continue;
      s.gone = true;
      // A building coming down is the whole reason you can feel it
      // behind you without ever turning round.
      for (let i = 0; i < 18; i++) {
        bits.push({
          x: s.x + Math.random() * s.w,
          y: -Math.random() * s.h,
          vx: 120 + Math.random() * 260,
          vy: -180 - Math.random() * 420,
          size: 6 + Math.random() * 16,
          life: 1.1 + Math.random() * 0.8,
          spin: Math.random() * 6,
          col: [80 + Math.random() * 60, 70 + Math.random() * 40, 96 + Math.random() * 50]
        });
      }
    }

    // ---- DEBRIS ---------------------------------------------------------
    for (const b of bits) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.vy += gravity() * 0.55 * dt;
      b.spin += dt * 5;
      b.life -= dt;
      if (b.y > 0) { b.y = 0; b.vy *= -0.35; b.vx *= 0.7; }
    }

    updateCrates(dt);
    updateBooms(dt);

    camX = player.x - W * 0.32;
    tidyUp();
  }

  // -------------------------------------------------------------------
  //  CRATES OUT OF THE SKY
  // -------------------------------------------------------------------
  //
  //  Everything else in this game is sitting there waiting for you.
  //  A crate ARRIVES - it drops in front of you while you're running,
  //  so you get a hazard that changes the road as you're reading it.
  //
  //  A shadow marks where it's going to land, and it darkens as the
  //  crate gets lower. That shadow is the whole fairness of it: you're
  //  never hit by something you couldn't see coming.
  //
  //  And once it lands it just becomes an ordinary solid. Everything
  //  the platforms already do - landing on top, clattering into the
  //  side, the grid drawn across it - works on a crate with no new code
  //  at all. That's the payoff for having one list of solid things.

  function updateCrates(dt) {
    const g = GRID();

    crateTimer -= dt;
    if (crateTimer <= 0) {
      crateTimer = 2.6 + Math.random() * 3.4;
      const tall = 1 + (Math.random() < 0.35 ? 1 : 0);
      // HOW FAR AHEAD, IN TIME - not in squares.
      //
      // Seven to fourteen squares sounds generous, and at a walk it is:
      // two seconds' warning. At full pelt those same squares are half
      // a second, and the crate lands a tenth of a second before you
      // reach it, which is not a hazard, it's an ambush. So the drop
      // point is measured in SECONDS ahead, and the warning is the same
      // however fast you're going.
      crates.push({
        x: player.x + speed * (1.1 + Math.random() * 0.7),
        y: -H * 1.2,                 // y is upside down: this is high up
        vy: 0,
        w: g * 0.9,
        h: tall * g,
        squares: tall
      });
    }

    for (const c of crates) {
      if (c.dead) continue;
      c.vy += gravity() * 0.5 * dt;
      c.y += c.vy * dt;

      // ---- DOES IT LAND ON YOU? --------------------------------------
      if (player.x + PLAYER_W > c.x && player.x < c.x + c.w &&
          c.y > player.y - PLAYER_H && c.y - c.h < player.y) {
        c.dead = true;
        player.stumble = 0.55;
        lead -= HIT_COST;
        bump(c.x + c.w / 2, -c.y, [[190, 140, 80], [140, 100, 56]], 20);
        continue;
      }

      // ---- OR ON THE GROUND? ------------------------------------------
      const rest = supportUnder(c.x + c.w / 2, c.y);
      if (rest === null) {
        // Straight down a hole. Gone.
        if (c.y > 400) c.dead = true;
        continue;
      }
      if (c.y >= rest) {
        c.dead = true;
        const stack = -rest + c.h;

        // NOTHING IN THIS WORLD MAY BE TALLER THAN THE JUMP.
        //
        // A crate coming down on a two-square platform would stack to
        // THREE squares - taller than you can ever get, so a wall you
        // simply cannot pass. It smashes instead. That's better than
        // fair, it's satisfying.
        if (stack > JUMP_UP * GRID() + 2) {
          bump(c.x + c.w / 2, -rest - c.h, [[190, 140, 80], [140, 100, 56]], 22);
          shake = 1;
          continue;
        }

        // Otherwise it IS the scenery from here on - one of the solid
        // things, with all their rules, and none written twice.
        blocks.push({ x: c.x, w: c.w, h: stack,
                      hit: false, squares: c.squares, crate: true });
        bump(c.x + c.w / 2, -rest, [[190, 140, 80], [140, 100, 56]], 10);
        shake = 1;
      }
    }
    crates = crates.filter(function (c) {
      return !c.dead && c.x > player.x - 400;
    });
  }

  // -------------------------------------------------------------------
  //  EVERYTHING BEHIND YOU GOES UP
  // -------------------------------------------------------------------
  //
  //  Every HALF SQUARE you travel, something behind you detonates. At
  //  full pelt that's about twenty-five a second, which is not a bang -
  //  it's a wall of fire following you down the street. Exactly the
  //  point, so it stays.
  //
  //  Which means each one has to be CHEAP. Twenty-five big explosions a
  //  second would bury the frame rate in a few seconds, so each is a
  //  handful of specks and a short flash, and the whole lot is capped.
  //  The effect comes from how MANY there are, not how big each one is.

  // BOB'S EXPLOSION, EXACTLY.
  //
  // Bob the Robot Pirate's first bang - the missile - is 70 chunks
  // thrown at power 20 to 75 in these four colours, with a full-screen
  // flash and a screen shake. Maximus wanted these the same size, so
  // these ARE the same numbers.
  const BOOM_CHUNKS = 70;
  const FIRE = [[255, 240, 160], [255, 170, 40], [255, 90, 30], [180, 60, 30]];

  // And 70 chunks twenty-five times a second is 1750 a second going in.
  // The cap is what stops that becoming a slideshow: the oldest specks
  // get thrown away to make room, so the screen stays full of fire
  // without the list ever growing without end.
  const BITS_MAX = 900;

  function blowUpBehind() {
    const front = monsterX();
    const room = player.x - 40 - front;
    if (room < 30) return;                 // it's right on top of you

    // Somewhere between the monster's teeth and your heels, leaning
    // towards just-behind-you, which is where you'll actually see it.
    const x = player.x - 40 - Math.pow(Math.random(), 1.7) * room;

    // A block or crate caught in it is simply gone - but PLATFORMS
    // STAND. They're the thing you get up onto and run along, so
    // blowing them up takes away the one bit of the road you can
    // actually use. Blast the obstacles, leave the road.
    for (let i = blocks.length - 1; i >= 0; i--) {
      const b = blocks[i];
      if (b.platform) continue;
      if (b.x + b.w < x - 40 || b.x > x + 40) continue;
      bits.push({ x: b.x + b.w / 2, y: -b.h / 2,
                  vx: (Math.random() - 0.4) * 300, vy: -260 - Math.random() * 300,
                  size: 8 + Math.random() * 14, life: 0.7 + Math.random() * 0.5,
                  spin: Math.random() * 6,
                  col: b.crate ? [176, 124, 62] : [150, 98, 58] });
      blocks.splice(i, 1);
      break;                                // one thing per bang
    }

    booms.push({ x: x, y: -8 - Math.random() * 30, r: 0, life: 0.28 });

    // ---- HOW HARD TO THROW THEM ---------------------------------------
    //
    // Maximus wants these to reach the TOP OF THE SCREEN, so that isn't
    // a number to guess at - it's one to work out. A thing thrown up at
    // speed v climbs v*v / 2g before gravity wins, so to climb a given
    // height you must be thrown at:
    //
    //     v = sqrt( 2 * gravity * height )
    //
    // Height here is the whole way from the pavement to the sky, and a
    // bit over, so the fastest chunks go straight off the top.
    //
    // It has to be recomputed every bang, because gravity in this game
    // is worked out from your speed - so the throw gets harder exactly
    // as gravity does, and they always reach the top however fast
    // you're running.
    const gUp = gravity() * 0.55;
    const toTop = Math.sqrt(2 * gUp * groundY() * 1.35);

    // SEVENTY CHUNKS. Bob's number, Bob's colours, Bob's lifetimes -
    // and they need the long lifetimes now, because a chunk that climbs
    // the whole screen and falls back is a good two seconds in the air.
    for (let i = 0; i < BOOM_CHUNKS; i++) {
      const a = Math.random() * Math.PI * 2;
      const power = (20 + Math.random() * 55) * 11;

      // Every one goes UP, some far harder than others - the weak ones
      // spray around your heels, the strong ones leave the screen.
      const up = 0.32 + Math.random() * 0.68;

      bits.push({
        x: x, y: -6,
        vx: Math.cos(a) * power * 0.55,
        vy: -toTop * up,
        size: 5 + Math.random() * 18,
        life: 1.4 + Math.random() * 1.2,
        spin: Math.random() * 6,
        col: FIRE[Math.floor(Math.random() * 4)]
      });
    }

    // The flash and the shake, same as Bob's - except his goes off once
    // and these go off twenty-five times a second, so they ADD UP
    // instead of each slamming to full. A constant roar, not a fit.
    flash = Math.min(0.55, flash + 0.12);
    shake = Math.min(0.5, shake + 0.09);
  }

  function updateBooms(dt) {
    // ONE BANG PER HALF SQUARE, however fast the frame rate is. Counting
    // boundaries instead of counting frames means a slow computer gets
    // exactly the same number of explosions as a fast one - it just gets
    // several of them in the same frame.
    const half = GRID() * 0.5;
    const nowHalf = Math.floor(player.x / half);
    let owed = nowHalf - lastHalf;
    lastHalf = nowHalf;
    if (owed > 6) owed = 6;                // after a stumble, don't flood
    while (owed-- > 0) blowUpBehind();

    if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
    if (shake > 0) shake = Math.max(0, shake - dt * 1.6);

    for (const b of booms) { b.life -= dt; b.r += dt * 520; }
    booms = booms.filter(function (b) { return b.life > 0; });
  }

  function bump(x, y, cols, n) {
    for (let i = 0; i < n; i++) {
      bits.push({
        x: x, y: -y,
        vx: (Math.random() - 0.3) * 420,
        vy: -120 - Math.random() * 420,
        size: 4 + Math.random() * 10,
        life: 0.6 + Math.random() * 0.6,
        spin: Math.random() * 6,
        col: cols[Math.floor(Math.random() * cols.length)]
      });
    }
  }


// -------------------------------------------------------------------
//  DRAWING - flat shapes, no maths
// -------------------------------------------------------------------

  function rgb(c) { return 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')'; }

  // World x to screen x. THIS IS THE WHOLE OF 2D. Everything else is
  // just rectangles.
  function sx(x) { return x - camX; }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, groundY());
    g.addColorStop(0, '#241a3a');
    g.addColorStop(1, '#5b3350');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, groundY());

    // A moon, parked. It doesn't scroll, which quietly tells your eye
    // it's a very long way away.
    ctx.fillStyle = 'rgba(255,238,200,0.85)';
    ctx.beginPath();
    ctx.arc(W * 0.78, H * 0.16, Math.min(W, H) * 0.055, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- LAYERS ---------------------------------------------------------
  // The far hills crawl, the buildings walk, the pavement sprints. Three
  // speeds is all it takes for flat shapes to feel deep - and it's the
  // only trick this game has for depth, so it does a lot of work.
  function drawHills() {
    ctx.fillStyle = '#2b1f42';
    const step = 260;
    const off = (camX * 0.18) % step;
    ctx.beginPath();
    ctx.moveTo(-step, groundY());
    for (let i = -1; i < W / step + 2; i++) {
      const x = i * step - off;
      ctx.lineTo(x, groundY() - 90 - ((i * 37) % 70));
      ctx.lineTo(x + step / 2, groundY() - 30);
    }
    ctx.lineTo(W + step, groundY());
    ctx.closePath();
    ctx.fill();
  }

  function drawScenery() {
    for (const s of scenery) {
      if (s.gone) continue;
      const x = sx(s.x) * 0.72 + W * 0.14;    // walks slower than the road
      if (x > W + 200 || x + s.w < -200) continue;
      const base = groundY() - 6;
      ctx.fillStyle = rgb([54 * s.shade + 26, 44 * s.shade + 22, 84 * s.shade + 30]);
      ctx.fillRect(x, base - s.h, s.w, s.h);

      // Windows. Some lit, some not, and always the same ones for a
      // given building - worked out from its position, not from
      // Math.random(), or they would flicker every single frame.
      for (let wy = 0; wy < Math.floor(s.h / 34); wy++) {
        for (let wx = 0; wx < Math.floor(s.w / 30); wx++) {
          const lit = ((Math.floor(s.x) + wx * 7 + wy * 13) % 5) < 2;
          ctx.fillStyle = lit ? 'rgba(255,214,130,0.75)' : 'rgba(20,16,32,0.5)';
          ctx.fillRect(x + 10 + wx * 30, base - s.h + 14 + wy * 34, 13, 18);
        }
      }
    }
  }

  function drawGround() {
    const gy = groundY();
    ctx.fillStyle = '#1d1730';
    ctx.fillRect(0, gy, W, H - gy);

    // The pavement, with the holes left out of it.
    ctx.fillStyle = '#3a2f52';
    let cut = [];
    for (const p of pits) cut.push([sx(p.x), sx(p.x + p.w)]);
    cut.sort(function (a, b) { return a[0] - b[0]; });
    let at = 0;
    for (const c of cut) {
      if (c[0] > at) ctx.fillRect(at, gy, Math.min(c[0], W) - at, 16);
      at = Math.max(at, c[1]);
    }
    if (at < W) ctx.fillRect(at, gy, W - at, 16);

    // ---- THE GRID ---------------------------------------------------
    // The squares are the whole point: a hole is so many squares wide
    // and your jump is three, so you can COUNT whether you'll make it
    // instead of guessing and hoping.
    const g = GRID();
    const off2 = camX % g;
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = -1; i < W / g + 2; i++) {
      const x = i * g - off2;
      ctx.moveTo(x, gy); ctx.lineTo(x, H);
    }
    for (let r = 1; r * g < H - gy; r++) {
      ctx.moveTo(0, gy + r * g); ctx.lineTo(W, gy + r * g);
    }
    ctx.stroke();

    // HOW HIGH YOU CAN GET. Two faint lines in the air at one and two
    // squares - the second one is your ceiling, so anything under it
    // is clearable and you can see that at a glance.
    ctx.setLineDash([10, 12]);
    for (let up = 1; up <= JUMP_UP; up++) {
      ctx.strokeStyle = up === JUMP_UP ? 'rgba(255,214,130,0.30)'
                                       : 'rgba(255,255,255,0.10)';
      ctx.beginPath();
      ctx.moveTo(0, gy - up * g); ctx.lineTo(W, gy - up * g);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Streaks tearing past, so the speed is something you can see even
    // when the ground is otherwise plain.
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    const period = g;
    const off3 = camX % period;
    for (let i = -1; i < W / period + 2; i++) {
      ctx.fillRect(i * period - off3, gy + g * 0.42, g * 0.5, 3);
    }
  }

  function drawBlocks() {
    for (const b of blocks) {
      const x = sx(b.x);
      if (x > W + 60 || x + b.w < -60) continue;
      const gy = groundY(), g = GRID();

      if (b.platform) {
        // A PLATFORM: pale stone with a bright top edge. It has to look
        // DIFFERENT from a block at a glance, because one of them you
        // get over and the other one you get ON, and deciding which is
        // which at full speed is the whole skill.
        ctx.fillStyle = '#6b5a86';
        ctx.fillRect(x, gy - b.h, b.w, b.h);
        ctx.fillStyle = '#b9a3dd';
        ctx.fillRect(x, gy - b.h, b.w, 9);

        // The grid carries on across it, so you can still count squares
        // when you're up on top.
        ctx.strokeStyle = 'rgba(255,255,255,0.13)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 1; i * g < b.w; i++) {
          ctx.moveTo(x + i * g, gy - b.h + 9);
          ctx.lineTo(x + i * g, gy);
        }
        ctx.stroke();
      } else if (b.crate) {
        // A crate that has landed. It's an ordinary solid now - you can
        // jump it or stand on it like anything else - but it still
        // looks like the thing that fell out of the sky.
        ctx.fillStyle = b.hit ? '#7a5a30' : '#b6803f';
        ctx.fillRect(x, gy - b.h, b.w, b.h);
        ctx.fillStyle = b.hit ? '#57401f' : '#8a5f2c';
        ctx.fillRect(x, gy - b.h, b.w, 8);
        ctx.strokeStyle = '#6d4a21';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, gy - b.h); ctx.lineTo(x + b.w, gy);
        ctx.moveTo(x + b.w, gy - b.h); ctx.lineTo(x, gy);
        ctx.stroke();
      } else {
        ctx.fillStyle = b.hit ? '#6b4a3a' : '#a8703f';
        ctx.fillRect(x, gy - b.h, b.w, b.h);
        ctx.fillStyle = b.hit ? '#4d362a' : '#7d5330';
        ctx.fillRect(x, gy - b.h, b.w, 7);
      }

      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, gy - b.h, b.w, b.h);
    }
  }

  // A crate in the air, and the mark on the ground where it's going.
  function drawCrates() {
    const gy = groundY();

    for (const c of crates) {
      if (c.dead) continue;
      const x = sx(c.x);
      if (x < -120 || x > W + 120) continue;

      // ---- THE SHADOW -------------------------------------------------
      // Where it will land, and how soon. It's small and faint when the
      // crate is miles up and big and dark just before it arrives - so
      // you can never be hit by something you had no way of seeing.
      const rest = supportUnder(c.x + c.w / 2, 0);
      if (rest !== null) {
        const drop = clamp(1 - (-c.y) / (H * 1.1), 0, 1);
        const wide = c.w * (0.5 + drop * 0.8);
        ctx.fillStyle = 'rgba(0,0,0,' + (0.12 + drop * 0.42) + ')';
        ctx.beginPath();
        ctx.ellipse(x + c.w / 2, gy + rest + 4, wide / 2, 7 + drop * 5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ---- THE CRATE --------------------------------------------------
      const y = gy + c.y - c.h;
      const spin = Math.sin(c.y * 0.004) * 0.09;
      ctx.save();
      ctx.translate(x + c.w / 2, y + c.h / 2);
      ctx.rotate(spin);
      ctx.fillStyle = '#b6803f';
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.fillStyle = '#8a5f2c';
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, 7);
      // Two planks crossed over the front - what makes it read "crate"
      // instead of "brown rectangle".
      ctx.strokeStyle = '#6d4a21';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-c.w / 2, -c.h / 2); ctx.lineTo(c.w / 2, c.h / 2);
      ctx.moveTo(c.w / 2, -c.h / 2);  ctx.lineTo(-c.w / 2, c.h / 2);
      ctx.stroke();
      ctx.strokeRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
  }

  // The flash of each bang - a bright ring that swells and vanishes.
  // Drawn UNDER the debris so the specks fly out of the middle of it.
  function drawBooms() {
    const gy = groundY();
    for (const b of booms) {
      const x = sx(b.x);
      if (x < -80 || x > W + 80) continue;
      const fade = clamp(b.life / 0.28, 0, 1);
      ctx.globalAlpha = fade * 0.85;
      ctx.fillStyle = 'rgb(255,' + Math.round(150 + 90 * fade) + ',80)';
      ctx.beginPath();
      ctx.arc(x, gy + b.y, 6 + b.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = fade * 0.4;
      ctx.strokeStyle = '#fff2c8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, gy + b.y, 8 + b.r * 0.6, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawBits() {
    // NINE HUNDRED OF THESE, EVERY FRAME.
    //
    // Turning each one costs a save, a translate, a rotate and a
    // restore - four times the work of just drawing a square, nine
    // hundred times over. So only the BIG chunks turn, where you can
    // actually see them turning; the small ones are plain squares and
    // nobody will ever know. Same picture, a fraction of the work.
    const gy = groundY();
    for (const b of bits) {
      const x = sx(b.x), y = gy + b.y;
      if (x < -60 || x > W + 60) continue;
      ctx.globalAlpha = clamp(b.life, 0, 1);
      ctx.fillStyle = rgb(b.col);

      if (b.size > 9) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(b.spin);
        ctx.fillRect(-b.size / 2, -b.size / 2, b.size, b.size);
        ctx.restore();
      } else {
        ctx.fillRect(x - b.size / 2, y - b.size / 2, b.size, b.size);
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---- THE RUNNER ------------------------------------------------------
  function drawPlayer() {
    const x = sx(player.x), y = groundY() + player.y;
    const swing = Math.sin(player.run) * 12;
    const air = !player.onGround;

    ctx.fillStyle = '#2a2340';
    // legs
    if (air) {
      ctx.fillRect(x + 3, y - 16, 8, 18);
      ctx.fillRect(x + 15, y - 20, 8, 18);
    } else {
      ctx.fillRect(x + 5 + swing * 0.4, y - 16, 8, 17);
      ctx.fillRect(x + 13 - swing * 0.4, y - 16, 8, 17);
    }

    ctx.fillStyle = player.stumble > 0 ? '#e0705a' : '#f2e2c8';
    ctx.fillRect(x, y - PLAYER_H, PLAYER_W, 30);       // body
    ctx.fillStyle = '#d8b48a';
    ctx.fillRect(x + 5, y - PLAYER_H - 16, 17, 17);    // head
    ctx.fillStyle = '#3a2f52';
    ctx.fillRect(x + 3, y - PLAYER_H - 20, 21, 7);     // hair

    // An arm pumping, or thrown up in the air.
    ctx.fillStyle = '#d8b48a';
    if (air) ctx.fillRect(x + 20, y - PLAYER_H - 8, 8, 20);
    else     ctx.fillRect(x + 19, y - PLAYER_H + 4 - swing * 0.5, 8, 18);
  }

  // ---- THE THING BEHIND YOU ---------------------------------------------
  //
  // Deliberately not a clear picture of anything. A big dark shape with
  // eyes and teeth is far more frightening than a drawing, and it can't
  // be nightmare fuel because there's nothing to look at properly.
  function drawMonster() {
    const front = sx(monsterX());
    if (front < -W) return;

    const gy = groundY();
    const top = H * 0.06;

    // Everything to the LEFT of the front line is monster.
    ctx.fillStyle = '#160f22';
    ctx.beginPath();
    ctx.moveTo(front, gy + 30);
    // A lumpy, moving edge - it should look like it's boiling forward.
    for (let y = gy + 30; y > top; y -= 26) {
      const wob = Math.sin(y * 0.05 + clock * 6) * 26 +
                  Math.sin(y * 0.13 - clock * 9) * 12;
      ctx.lineTo(front + wob - 20, y);
    }
    ctx.lineTo(front - 90, top);
    ctx.lineTo(-W, top);
    ctx.lineTo(-W, gy + 30);
    ctx.closePath();
    ctx.fill();

    // TEETH along the leading edge.
    ctx.fillStyle = '#f4ecd8';
    for (let y = gy; y > H * 0.22; y -= 62) {
      const wob = Math.sin(y * 0.05 + clock * 6) * 26 - 20;
      const len = 26 + Math.sin(y * 0.4 + clock * 3) * 12;
      ctx.beginPath();
      ctx.moveTo(front + wob, y);
      ctx.lineTo(front + wob + len, y - 16);
      ctx.lineTo(front + wob, y - 32);
      ctx.closePath();
      ctx.fill();
    }

    // EYES. Two of them, and they follow you.
    for (const e of [[0.30, 0.34], [0.18, 0.52]]) {
      const ex = front - W * e[0] * 0.5 - 40;
      const ey = H * e[1];
      const r = Math.min(W, H) * 0.035;
      ctx.fillStyle = '#ffb340';
      ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a0c06';
      ctx.beginPath(); ctx.arc(ex + r * 0.4, ey, r * 0.45, 0, Math.PI * 2); ctx.fill();
    }

    // The closer it gets, the redder the edge of the screen.
    const near = clamp(1 - lead / LEAD_START, 0, 1);
    if (near > 0.02) {
      const g = ctx.createLinearGradient(0, 0, W * 0.55, 0);
      g.addColorStop(0, 'rgba(190,40,60,' + (near * 0.55) + ')');
      g.addColorStop(1, 'rgba(190,40,60,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W * 0.55, H);
    }
  }

  function drawHud() {
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.05, 44) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffe9c8';
    ctx.fillText(Math.floor(dist) + ' m', 20, 54);

    if (best > 0) {
      ctx.font = Math.min(W * 0.024, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#8f7fb0';
      ctx.fillText('best ' + best + ' m', 22, 78);
    }

    // HOW CLOSE IT IS. The bar you actually watch.
    const bw = Math.min(W * 0.3, 300), bx = W - bw - 20, by = 30;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(bx, by, bw, 16);
    const t = clamp(lead / LEAD_START, 0, 1);
    ctx.fillStyle = t > 0.6 ? '#8fe07a' : t > 0.3 ? '#e0c83c' : '#e05a4a';
    ctx.fillRect(bx + bw * (1 - t), by, bw * t, 16);
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.022, 14) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8f7fb0';
    ctx.fillText('HOW CLOSE IT IS', W - 20, by - 6);

    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.font = 'bold ' + Math.min(W * 0.07, 62) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffe9c8';
      ctx.fillText('RUN!', W / 2, H * 0.36);
      ctx.font = Math.min(W * 0.03, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a595c4';
      ctx.fillText('press SPACE or click to start', W / 2, H * 0.44);
    }
    if (state === 'dead') {
      ctx.font = 'bold ' + Math.min(W * 0.07, 62) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#e05a4a';
      ctx.fillText('IT GOT YOU', W / 2, H * 0.34);
      ctx.font = 'bold ' + Math.min(W * 0.04, 30) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ffe9c8';
      ctx.fillText(Math.floor(dist) + ' metres', W / 2, H * 0.43);
      ctx.font = Math.min(W * 0.03, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#a595c4';
      ctx.fillText('press SPACE or click to go again', W / 2, H * 0.51);
    }
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'w' || k === 'arrowup') {
      if (!held) jump();
      held = true;
      e.preventDefault();
    }
  });
  // LETTING GO CUTS THE JUMP SHORT. Hold it all the way and you get
  // the full three across and two up; a quick tap is a little hop. One
  // button, and how long you hold it is the only other control there is.
  function release() {
    held = false;
    if (state === 'run' && player.vy < 0) player.vy *= 0.42;
  }

  window.addEventListener('keyup', function (e) {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'w' || k === 'arrowup') release();
  });

  canvas.addEventListener('mousedown', function () { jump(); held = true; });
  canvas.addEventListener('mouseup',   function () { release(); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault(); jump(); held = true;
  }, { passive: false });
  canvas.addEventListener('touchend',  function () { release(); });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    update(dt);

    ctx.save();
    if (shake > 0) {
      // The world jolts, the HUD does NOT - a score that jumps about is
      // just hard to read, and it isn't part of the explosion anyway.
      ctx.translate((Math.random() - 0.5) * shake * 26,
                    (Math.random() - 0.5) * shake * 18);
    }

    drawSky();
    drawHills();
    drawScenery();
    drawGround();
    drawBlocks();
    drawCrates();
    drawBooms();
    drawBits();
    drawPlayer();
    drawMonster();
    ctx.restore();

    // THE WHOLE SCREEN GOING WHITE. Bob does this on his missile and
    // it's half of why that bang lands - the picture itself flinches.
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,214,150,' + (flash * 0.55) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    drawHud();

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

</script>
</body>
</html>
