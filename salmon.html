<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SALMON</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1c26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salmon">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b1c26; color: #dff0f6;
    font-family: system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 6px;
    text-align: center; font-size: 14px; color: #5e8496;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="screen"></canvas>
<div id="hud">W S to swim &nbsp;&nbsp; A D to change lane &nbsp;&nbsp; SPACE to leap</div>

<script>
// ===================================================================
//  SALMON
//
//  You are a fish going the wrong way up a river, and the river does
//  not care. The whole game is that one idea: the water is ALWAYS
//  pushing you back down, so standing still means losing ground. Stop
//  swimming and you're washed away.
//
//  Looking straight down at the river, so you can see its whole width -
//  which is what the choices are about: which side to pass a rock,
//  which bank the bear is on, whether the middle is worth the fast
//  water.
//
//  Same box painter as the cavern, the wasteland and the pizza shop:
//  a list of flat faces, sorted furthest-away-first, filled in order.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


// -------------------------------------------------------------------
//  LOOKING DOWN AT THE RIVER
// -------------------------------------------------------------------
//
//  High up and behind, tilted steeply down, following the fish. It
//  never turns - upstream is always up the screen. A view that spun
//  with the fish would make "which bank is the bear on" impossible to
//  answer at a glance, and that question IS the game.

  // STRAIGHT DOWN. Not tilted - pitch is a dead quarter turn.
  //
  // At exactly this angle the maths falls out beautifully: how far a
  // thing is from the camera stops depending on where it is along the
  // river and depends only on HOW TALL IT IS. So the whole river is one
  // flat scale - a rock forty metres upstream is exactly the same size
  // as one right beside you, which is what makes a map readable.
  //
  // And things that stick UP are nearer the camera, so they're bigger:
  // the bears loom a little and the eagles loom a lot. That's not an
  // effect anyone had to add, it's just what looking down does.
  const cam = { x: 0, y: 0, z: 0, pitch: -Math.PI / 2 };
  // How high the camera floats, which IS the zoom now - straight down,
  // the scale is simply focal / height.
  //
  // And it sits a little way UPSTREAM of the fish rather than behind
  // it, so the fish rides low on the screen and most of what you can
  // see is the water you're about to swim into.
  // Sitting 42 ahead meant you could only see 46 units of river BEHIND
  // you - so the wave chasing you was invisible until it was almost on
  // top of you, which is no warning at all. Higher, and less far ahead:
  // about 88 behind and 113 in front.
  const CAM_UP = 166, LOOK_AHEAD = 12;

  function focal() { return Math.min(H, W) * 0.82; }

  function project(x, y, z) {
    const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const fz = dz * cp + dy * sp;
    const fy = dy * cp - dz * sp;
    if (fz < 1) return null;
    const f = focal() / fz;
    return { x: W / 2 + dx * f, y: H / 2 - fy * f, depth: fz };
  }


// -------------------------------------------------------------------
//  BOXES
// -------------------------------------------------------------------

  let faces = [];

  function shade(rgb, amount) {
    return [clamp(rgb[0] * amount, 0, 255),
            clamp(rgb[1] * amount, 0, 255),
            clamp(rgb[2] * amount, 0, 255)];
  }
  function rgbText(c) {
    return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';
  }

  function addBox(cx, cy, cz, w, h, d, rgb, spin) {
    spin = spin || 0;
    const co = Math.cos(spin), si = Math.sin(spin);
    const hw = w / 2, hh = h / 2, hd = d / 2;

    const pts = [];
    for (const sx of [-1, 1])
      for (const sy of [-1, 1])
        for (const sz of [-1, 1]) {
          const lx = sx * hw, lz = sz * hd;
          pts.push(project(cx + lx * co + lz * si, cy + sy * hh,
                           cz - lx * si + lz * co));
        }
    for (const p of pts) if (!p) return;

    const sides = [
      { pts: [2, 3, 7, 6], light: 1.18 },   // top - we're above it
      { pts: [0, 1, 5, 4], light: 0.55 },
      { pts: [0, 2, 6, 4], light: 0.92 },
      { pts: [1, 3, 7, 5], light: 0.72 },
      { pts: [0, 1, 3, 2], light: 0.80 },
      { pts: [4, 5, 7, 6], light: 0.86 }
    ];

    for (const s of sides) {
      const p = s.pts.map(function (i) { return pts[i]; });
      let depth = 0;
      for (const q of p) depth += q.depth;
      faces.push({ points: p, depth: depth / 4, colour: rgbText(shade(rgb, s.light)) });
    }
  }

  function paint() {
    faces.sort(function (a, b) { return b.depth - a.depth; });
    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) ctx.lineTo(f.points[i].x, f.points[i].y);
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }
  }


// -------------------------------------------------------------------
//  THE RIVER
// -------------------------------------------------------------------
//
//  Upstream is +z, which is up the screen. The current pushes you the
//  other way, always, and harder in the rapids.

  // 72, not 56. Straight down on a wide screen, a 56-wide river left
  // more than half the picture as riverbank - and the bank is the one
  // place you can never go. The river should be the thing you're
  // looking at.
  const RIVER_HALF = 72;      // how far the water reaches either side
  const SWIM       = 44;      // how fast you can swim
  const CURRENT    = 26;      // how hard the water pushes back
  const RAPID_MUL  = 2.0;     // ...and how much worse a rapid is

  // HOW STRONG THE WATER IS HERE.
  //
  // One function, and the drawing, the pushing and the "is this a
  // rapid" test all ask it - so the white water you can SEE is exactly
  // the water that's shoving you.
  function currentAt(z) {
    // Long smooth stretches with faster runs between them. Two waves at
    // different lengths, so it never falls into an obvious pattern.
    const a = Math.sin(z * 0.0032);
    const b = Math.sin(z * 0.0111 + 1.7);
    const mix = a * 0.65 + b * 0.35;
    // 0.55, not 0.35. At 0.35 the river was rapid from about twenty
    // metres in - so swimming flat out from the start gained ONE metre
    // a second instead of eighteen, and it felt broken rather than
    // hard. Rapids have to be stretches you come to, not the default.
    return mix > 0.55 ? RAPID_MUL : 1;
  }

  // The banks close in on the rapids, which is what makes them feel
  // fast and gives the bears somewhere to stand.
  function bankAt(z) {
    return RIVER_HALF * (currentAt(z) > 1 ? 0.62 : 1);
  }

  // ---- FOUR LANES ----------------------------------------------------
  //
  //  The river is four lanes wide and you snap between them instantly.
  //  That turns steering into CHOOSING - you aren't nudging a fish
  //  sideways any more, you're picking which channel to take, and you
  //  can see all four of them at once from up here.
  //
  //  Lane centres are worked out from the bank width, so when the river
  //  narrows into a rapid the four lanes squeeze together with it. One
  //  function, used by the fish, the rocks, the bears and the lines
  //  drawn on the water - so a rock "in lane 2" is exactly where lane 2
  //  is drawn, always.
  const LANES = 4;

  function laneX(lane, z) {
    const w = bankAt(z) * 2 / LANES;
    return (lane - (LANES - 1) / 2) * w;
  }


// -------------------------------------------------------------------
//  THE FISH
// -------------------------------------------------------------------

  // 80, not 46. At 46 a salmon cleared the water by eight units - a
  // hop, when the whole reason anyone knows what a salmon IS happens to
  // be the leap. Height comes out as v*v / 2g, so this is about 25.
  const LEAP_UP   = 80;       // how hard a leap throws you upwards
  const GRAVITY   = 130;
  const LEAP_PUSH = 34;       // and how much forward shove it gives

  const fish = {
    x: 0, z: 0, y: 0, vy: 0,
    lane: 1,                  // which of the four channels you're in
    yaw: 0,
    tail: 0,
    stun: 0,                  // knocked silly by a rock
    leaping: false,
    caught: 0
  };

  // -----------------------------------------------------------------
  //  THE WAVE
  // -----------------------------------------------------------------
  //  A wall of white water coming up the river behind you, and it never
  //  stops. It was always there in spirit - the old game killed you if
  //  you slipped too far back - but it was an invisible rule. Now it's
  //  a thing you can SEE, and being chased is very different from being
  //  told off by a number.
  //
  //  It speeds up the further you get, so a run always ends.
  const WAVE_START = 12;      // how fast it comes, at the start
  const WAVE_GAIN  = 0.016;   // and how much faster per metre you make
  const WAVE_LEAD  = 300;     // how far back it starts

  const wave = { z: -WAVE_LEAD, foam: 0 };
  function waveSpeed() { return WAVE_START + dist * WAVE_GAIN; }

  let best = 0;
  let dist = 0;               // how far upstream, in metres
  let clock = 0;
  let state = 'ready';        // 'ready', 'swim', 'dead'
  let deadWhy = '';
  let says = '', saysT = 0;
  function say(w) { says = w; saysT = 2.6; }


// -------------------------------------------------------------------
//  WHAT IS IN THE RIVER
// -------------------------------------------------------------------

  // ---- LOGS ----------------------------------------------------------
  //  Rocks sit still and wait for you. LOGS COME AT YOU - they float
  //  down while you're swimming up, so the two of you close fast, and
  //  the gap you picked a second ago may not be there when you arrive.
  //
  //  They're long: one or two lanes wide, never more. Two lanes shut is
  //  a decision; four would just be a wall.
  //
  //  And they ride low in the water, so a leap clears them. That's a
  //  third job for the leap, and every one of them is a reason to spend
  //  a jump you might want later.
  // ---- GEYSERS --------------------------------------------------------
  //  Everything else in this river is trying to STOP you. A geyser is
  //  the one thing that helps: sit over one as it blows and it throws
  //  you up and a long way upstream, right over a rapid.
  //
  //  But being in the air is exactly what an eagle is waiting for. So
  //  the best thing in the game and the worst thing in the game are the
  //  same thing, and which one it turns out to be depends on whether
  //  you looked up first.
  const GEYSER_UP    = 132;    // far harder than your own leap of 80
  const GEYSER_ON    = 0.9;    // how long it blows for
  const GEYSER_WARN  = 0.8;    // how long it bubbles before it blows
  let geysers = [];

  // ---- TACOS ----------------------------------------------------------
  //  Somebody drops their lunch in the river. You eat it. It has
  //  consequences, and the consequences are propulsion.
  //
  //  It's the only thing in the game you go TOWARDS, which is worth
  //  something on its own - up to now every single object has been a
  //  reason to change lane, and a river of nothing but "avoid that"
  //  gets tiring. A taco makes a lane worth wanting.
  const BOOST_SPEED = 82;      // on top of your own swimming
  const BOOST_TIME  = 1.2;     // per taco, and they stack
  let tacos = [];

  const LOG_EVERY = 2.4;
  let logs = [];
  let logTimer = 1.6;

  // ---- ROCKS OUT OF THE SKY ------------------------------------------
  //  Everything else in this river you can plan around. These ARRIVE.
  //
  //  A ring on the water shows where one is going to land, and it
  //  tightens and brightens as the rock drops - that ring is the whole
  //  fairness of it, because you are never hit by something you had no
  //  way of seeing.
  //
  //  AND YOU CANNOT LEAP ONE. A rock falling out of the sky doesn't care
  //  that you're in the air - it would hit you there too. So the only
  //  answer is to be in another lane, which makes it the one hazard the
  //  leap is no use against at all.
  const FALL_EVERY = 3.2;
  const FALL_TIME  = 1.35;      // how long it takes to come down
  let fallers = [];
  let fallTimer = 2.4;

  let rocks = [];
  let bears = [];
  let eagles = [];
  let madeTo = 0;
  let bits = [];

  function makeMore() {
    madeTo += 90 + Math.random() * 130;
    const z = madeTo;
    const half = bankAt(z);

    // ---- ROCKS, ONE TO A LANE ---------------------------------------
    // Never all four - at least one lane is always open, and finding it
    // is the game. A wall you cannot pass isn't difficulty, it's a dead
    // end. With lanes this is easy to guarantee instead of hoping.
    const open = Math.floor(Math.random() * LANES);
    for (let l = 0; l < LANES; l++) {
      if (l === open) continue;
      if (Math.random() < 0.45) continue;            // and often fewer
      rocks.push({ lane: l, z: z + (Math.random() - 0.5) * 30,
                   r: 9 + Math.random() * 8, spin: Math.random() * 6 });
    }

    // ---- BEARS ------------------------------------------------------
    // Stood on a bank, swiping at whatever comes near their side.
    if (Math.random() < 0.42) {
      const side = Math.random() < 0.5 ? -1 : 1;
      // A bear can only reach the lane nearest its own bank. Which
      // means a bear doesn't block the river, it CLOSES A LANE - and
      // that's a much better thing for it to do.
      bears.push({ lane: side < 0 ? 0 : LANES - 1, z: z, side: side,
                   swipe: 0, cool: 1 + Math.random() * 2, got: false });
    }

    // ---- A TACO ------------------------------------------------------
    // Often out on the edges, so the safe middle lane isn't also the
    // rewarding one. You should have to go and GET it.
    if (Math.random() < 0.5) {
      const edge = Math.random() < 0.6;
      tacos.push({ lane: edge ? (Math.random() < 0.5 ? 0 : LANES - 1)
                              : Math.floor(Math.random() * LANES),
                   z: z + (Math.random() - 0.5) * 70, bob: Math.random() * 6,
                   eaten: false });
    }

    // ---- GEYSERS ----------------------------------------------------
    if (Math.random() < 0.34) {
      const cycle = 2.6 + Math.random() * 2.4;
      geysers.push({ lane: Math.floor(Math.random() * LANES), z: z,
                     cycle: cycle, t: Math.random() * cycle, on: 0 });
    }

    // ---- EAGLES -----------------------------------------------------
    // Circling. They only ever take a fish that's OUT OF THE WATER, so
    // leaping is a real decision and not a free button.
    if (Math.random() < 0.3) {
      eagles.push({ lane: Math.floor(Math.random() * LANES), z: z,
                    a: Math.random() * 6, dive: 0 });
    }
  }

  function tidy() {
    const back = fish.z - 260;
    logs = logs.filter(function (l) { return l.z > back; });
    fallers = fallers.filter(function (f) { return f.z > back && !f.gone; });
    geysers = geysers.filter(function (g) { return g.z > back; });
    tacos = tacos.filter(function (t) { return t.z > back && !t.eaten; });
    rocks  = rocks.filter(function (r) { return r.z > back; });
    bears  = bears.filter(function (b) { return b.z > back; });
    eagles = eagles.filter(function (e) { return e.z > back; });
    bits   = bits.filter(function (b) { return b.life > 0; });
    while (madeTo < fish.z + 900) makeMore();
  }

  function splash(x, z, n, cols) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const p = 14 + Math.random() * 40;
      bits.push({
        x: x, y: 2 + Math.random() * 6, z: z,
        vx: Math.cos(a) * p, vy: 18 + Math.random() * 40, vz: Math.sin(a) * p,
        size: 1.4 + Math.random() * 3.4,
        life: 0.5 + Math.random() * 0.6,
        col: cols[Math.floor(Math.random() * cols.length)]
      });
    }
  }

  function reset() {
    fish.x = 0; fish.z = 0; fish.y = 0; fish.vy = 0;
    fish.yaw = 0; fish.tail = 0; fish.stun = 0;
    fish.leaping = false; fish.caught = 0; fish.lane = 1;
    fish.boost = 0; fish.parp = 0;
    dist = 0; clock = 0; deadWhy = '';
    wave.z = -WAVE_LEAD; wave.foam = 0;
    rocks = []; bears = []; eagles = []; bits = []; logs = []; fallers = [];
    geysers = []; tacos = [];
    logTimer = 1.6; fallTimer = 2.4;
    madeTo = 120;
    while (madeTo < 900) makeMore();
    cam.x = 0; cam.z = LOOK_AHEAD; cam.y = CAM_UP;
    state = 'ready';
    says = ''; saysT = 0;
  }


// -------------------------------------------------------------------
//  SWIMMING
// -------------------------------------------------------------------

  const keys = {};

  // INSTANTLY. No sliding, no animation to wait through - press it and
  // you're there, which is the whole appeal of lanes.
  function goLane(dir) {
    if (state !== 'swim' || fish.stun > 0) return;
    const want = clamp(fish.lane + dir, 0, LANES - 1);
    if (want === fish.lane) return;
    fish.lane = want;
    splash(fish.x, fish.z, 6, [[210, 235, 245], [170, 210, 228]]);
  }

  function leap() {
    if (state === 'ready') { state = 'swim'; return; }
    if (state === 'dead')  { reset(); state = 'swim'; return; }
    if (fish.leaping || fish.stun > 0) return;
    fish.leaping = true;
    fish.vy = LEAP_UP;
    splash(fish.x, fish.z, 14, [[210, 235, 245], [170, 210, 228]]);
  }

  function update(dt) {
    clock += dt;
    if (saysT > 0) saysT -= dt;
    if (state !== 'swim') { camera(dt); return; }

    const strong = currentAt(fish.z);

    // ---- SWIMMING ----------------------------------------------------
    // ---- FORWARD AND BACK, and that's all the steering there is ------
    let mz = 0;
    if (keys['w'] || keys['arrowup'])    mz += 1;
    if (keys['s'] || keys['arrowdown'])  mz -= 1;
    if (stick.on && -stick.dy / STICK_MAX > 0.25) mz += 1;
    if (stick.on && -stick.dy / STICK_MAX < -0.25) mz -= 1;

    if (mz !== 0 && fish.stun <= 0) {
      fish.z += mz * SWIM * dt;
      fish.tail += dt * 16;
    } else {
      fish.tail += dt * 5;               // still flicking, just drifting
    }

    // ---- AND THE LANE YOU'RE IN --------------------------------------
    // Snapped, not slid. The fish IS wherever its lane is, worked out
    // fresh every frame - so when the river narrows into a rapid the
    // fish is carried in with it rather than ending up on the bank.
    fish.x = laneX(fish.lane, fish.z);
    fish.yaw = 0;

    // ---- THE WATER PUSHING BACK --------------------------------------
    // In the air you're out of the current - that's what a leap is FOR.
    if (!fish.leaping) {
      fish.z -= CURRENT * strong * dt;
      // Fast water also shoves you towards the middle, where the rocks
      // are. It isn't only slower, it's more dangerous.
      if (strong > 1) fish.x -= Math.sign(fish.x) * 8 * dt;
    }

    if (fish.stun > 0) fish.stun -= dt;

    // ---- LEAPING -------------------------------------------------------
    if (fish.leaping) {
      fish.z += LEAP_PUSH * dt;
      fish.vy -= GRAVITY * dt;
      fish.y += fish.vy * dt;
      if (fish.y <= 0) {
        fish.y = 0; fish.vy = 0; fish.leaping = false;
        splash(fish.x, fish.z, 16, [[210, 235, 245], [150, 195, 216]]);
      }
    }

    // ---- ROCKS ---------------------------------------------------------
    // Only if you're IN the water. Sail over them if you're in the air.
    if (!fish.leaping) {
      for (const r of rocks) {
        // SAME LANE, and close along the river. With lanes the whole
        // question becomes "are we in the same channel" - no measuring
        // across, no near-misses that were really hits.
        if (r.lane !== fish.lane) continue;
        if (Math.abs(r.z - fish.z) > r.r + 8) continue;
        if (fish.stun > 0) continue;
        fish.stun = 0.7;
        fish.z -= 14;
        splash(fish.x, fish.z, 12, [[210, 235, 245], [140, 120, 110]]);
        say('OW');
      }
    }

    // ---- BEARS ----------------------------------------------------------
    for (const b of bears) {
      if (b.swipe > 0) b.swipe -= dt;
      b.cool -= dt;

      const near = Math.abs(b.z - fish.z) < 26 && b.lane === fish.lane;
      if (near && b.cool <= 0 && !b.got) {
        b.cool = 1.4;
        b.swipe = 0.35;
        // A bear can't reach a fish in the air. Leaping past a bear is
        // the right answer, and it's the same button that gets you
        // eaten by an eagle - so you have to pick.
        if (!fish.leaping) {
          b.got = true;
          state = 'dead';
          deadWhy = 'A BEAR GOT YOU';
          best = Math.max(best, Math.floor(dist));
          splash(fish.x, fish.z, 30, [[220, 90, 90], [210, 235, 245]]);
        }
      }
    }

    // ---- EAGLES -----------------------------------------------------------
    for (const e of eagles) {
      e.a += dt * 1.5;
      // They hold station over ONE lane, drifting up and down it, and
      // only ever stoop on a fish that has left the water.
      e.cz = e.z + Math.sin(e.a) * 30;
      e.cx = laneX(e.lane, e.cz);

      if (fish.leaping && fish.y > 6 && e.lane === fish.lane &&
          Math.abs(e.cz - fish.z) < 26) {
        e.dive = 1;
        state = 'dead';
        deadWhy = 'AN EAGLE TOOK YOU';
        best = Math.max(best, Math.floor(dist));
        splash(fish.x, fish.z, 30, [[220, 90, 90], [230, 220, 200]]);
      }
    }

    // ---- HOW FAR -----------------------------------------------------------
    dist = Math.max(dist, fish.z / 10);

    // ---- LUNCH --------------------------------------------------------
    for (const t of tacos) {
      if (t.eaten) continue;
      t.bob += dt * 2.2;
      if (t.lane !== fish.lane) continue;
      if (Math.abs(t.z - fish.z) > 14) continue;
      t.eaten = true;
      // THEY STACK. Eat three in a row and you get three times the
      // trumping, which is the correct reward for going out of your way
      // three times.
      fish.boost += BOOST_TIME;
      fish.parp = 1;
      say('PARP!');
      splash(fish.x, fish.z, 10, [[196, 216, 90], [232, 196, 84]]);
    }

    // ---- THE CONSEQUENCES ---------------------------------------------
    if (fish.boost > 0) {
      fish.boost -= dt;
      fish.z += BOOST_SPEED * dt;
      if (fish.parp > 0) fish.parp -= dt * 2;

      // A trail of, ah, bubbles. Behind you, obviously.
      if (Math.random() < 0.8) {
        splash(fish.x + (Math.random() - 0.5) * 8, fish.z - 16, 1,
               [[176, 206, 96], [206, 226, 128]]);
      }
    }

    // ---- GEYSERS ------------------------------------------------------
    for (const g of geysers) {
      if (g.on > 0) {
        g.on -= dt;
        // Bubbles the whole time it's up.
        if (Math.random() < 0.6) {
          splash(laneX(g.lane, g.z) + (Math.random() - 0.5) * 14, g.z, 1,
                 [[236, 250, 254], [180, 220, 236]]);
        }
        continue;
      }

      g.t -= dt;
      if (g.t > 0) continue;

      // ---- IT BLOWS ---------------------------------------------------
      g.on = GEYSER_ON;
      g.t = g.cycle;
      splash(laneX(g.lane, g.z), g.z, 18, [[236, 250, 254], [150, 200, 220]]);

      // Over it when it goes? Up you go - and it does NOT care whether
      // you were already in the air, because a column of water hitting
      // you is a column of water hitting you.
      if (g.lane === fish.lane && Math.abs(g.z - fish.z) < 20 && fish.stun <= 0) {
        fish.leaping = true;
        fish.vy = GEYSER_UP;
        say('WHOOSH!');
      }
    }

    // ---- ROCKS COMING DOWN OUT OF THE SKY -----------------------------
    fallTimer -= dt;
    if (fallTimer <= 0) {
      fallTimer = FALL_EVERY + Math.random() * FALL_EVERY;
      fallers.push({
        lane: Math.floor(Math.random() * LANES),
        z: fish.z + 60 + Math.random() * 180,
        // 60 up, not 150. Looking STRAIGHT down, a thing 150 up is
        // nearly at the camera - so it drew three times the size and
        // slid right off the side of the screen, nowhere near the ring
        // marking where it was going to land. From 60 it stays over its
        // own ring and just grows as it comes.
        y: 60, t: FALL_TIME,
        r: 9 + Math.random() * 8,
        spin: Math.random() * 6
      });
    }

    for (const fr of fallers) {
      if (fr.gone) continue;
      fr.t -= dt;
      fr.y = 60 * clamp(fr.t / FALL_TIME, 0, 1);

      if (fr.t > 0) continue;
      fr.gone = true;

      // ---- IT LANDS ---------------------------------------------------
      splash(laneX(fr.lane, fr.z), fr.z, 22, [[230, 245, 250], [150, 140, 132]]);

      // On your head? Being in the air is no help at all.
      if (fr.lane === fish.lane && Math.abs(fr.z - fish.z) < fr.r + 10) {
        if (fish.stun <= 0) {
          fish.stun = 1.0;
          fish.z -= 26;
          say('ROCKFALL!');
        }
      }

      // From here on it IS a rock. Everything rocks already do - the
      // lane collision, the drawing, being cleared away behind you -
      // works on it with no new code at all.
      rocks.push({ lane: fr.lane, z: fr.z, r: fr.r, spin: fr.spin });
    }

    // ---- LOGS COMING DOWN ---------------------------------------------
    logTimer -= dt;
    if (logTimer <= 0) {
      logTimer = LOG_EVERY + Math.random() * LOG_EVERY;
      const span = Math.random() < 0.4 ? 2 : 1;
      const lane = Math.floor(Math.random() * (LANES - span + 1));
      logs.push({ lane: lane, span: span,
                  z: fish.z + 380 + Math.random() * 220,
                  bob: Math.random() * 6, spin: (Math.random() - 0.5) * 0.25 });
    }

    for (const l of logs) {
      // They float at the water's own speed, and a bit over - so even
      // holding station, one is always closing on you. In a rapid they
      // come down twice as fast, which is exactly when you can least
      // afford to be looking.
      l.z -= CURRENT * currentAt(l.z) * 1.15 * dt;
      l.bob += dt * 1.6;

      if (fish.leaping) continue;            // you're over the top of it
      if (Math.abs(l.z - fish.z) > 12) continue;
      if (fish.lane < l.lane || fish.lane > l.lane + l.span - 1) continue;
      if (fish.stun > 0) continue;

      fish.stun = 0.8;
      fish.z -= 20;
      splash(fish.x, fish.z, 14, [[210, 235, 245], [126, 92, 60]]);
      say('THUMP');
    }

    // ---- THE WAVE ---------------------------------------------------
    wave.z += waveSpeed() * dt;
    wave.foam += dt;

    // Spray thrown off the front of it, so you can hear it coming with
    // your eyes.
    if (Math.random() < 0.5 && wave.z > fish.z - 200) {
      const half = bankAt(wave.z);
      splash((Math.random() * 2 - 1) * half, wave.z + 6, 2,
             [[230, 245, 250], [190, 220, 235]]);
    }

    // It doesn't care whether you're in the air. There is no leaping
    // over a wall of water the width of the river.
    if (wave.z >= fish.z - 4) {
      state = 'dead';
      deadWhy = 'THE WAVE TOOK YOU';
      best = Math.max(best, Math.floor(dist));
      splash(fish.x, fish.z, 40, [[230, 245, 250], [188, 92, 78]]);
    }

    // ---- SPLASHES ----------------------------------------------------------
    for (const b of bits) {
      b.x += b.vx * dt; b.z += b.vz * dt;
      b.y += b.vy * dt; b.vy -= 150 * dt;
      b.life -= dt;
      if (b.y < 0) { b.y = 0; b.vy = 0; }
    }

    tidy();
    camera(dt);
  }

  function camera(dt) {
    const k = Math.min(1, dt * 5);
    cam.x += (fish.x * 0.5 - cam.x) * k;
    cam.z += (fish.z + LOOK_AHEAD - cam.z) * k;
    cam.y = CAM_UP;
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  const WATER  = [38, 96, 124];
  const FAST   = [92, 150, 174];
  const BANK   = [122, 112, 92];
  const GRASS  = [64, 96, 56];
  const ROCK   = [110, 106, 100];
  const FUR    = [92, 66, 46];
  const SALMON = [188, 92, 78];

  function drawRiver() {
    const TILE = 30;
    const cz = Math.round(fish.z / TILE), cx = Math.round(fish.x / TILE);

    for (let gz = cz - 4; gz <= cz + 12; gz++) {
      const z = gz * TILE;
      const half = bankAt(z);
      const strong = currentAt(z);

      for (let gx = cx - 5; gx <= cx + 5; gx++) {
        const x = gx * TILE;
        if (Math.abs(x) > half + TILE * 2.5) continue;

        if (Math.abs(x) < half) {
          // WATER. It's paler and it MOVES in the rapids - the white
          // water you can see is exactly the water that's shoving you,
          // because both come out of currentAt().
          const flow = Math.sin(z * 0.06 + clock * (strong > 1 ? 7 : 2.4)) * 0.5 + 0.5;
          const base = strong > 1 ? FAST : WATER;
          addBox(x, -1, z, TILE, 2, TILE, shade(base, 0.86 + flow * 0.3));
        } else {
          const tint = ((gx + gz) % 2 === 0) ? 1 : 0.92;
          addBox(x, 0.6, z, TILE, 3, TILE, shade(Math.abs(x) < half + TILE * 1.2
                                                 ? BANK : GRASS, tint));
        }
      }
    }
  }

  // The four channels, marked on the water. You can't choose a lane you
  // can't see, and these come from the same laneX() everything else
  // uses - so the line you aim at is the line the rocks sit on.
  function drawLanes() {
    const TILE = 30;
    const cz = Math.round(fish.z / TILE);
    for (let gz = cz - 3; gz <= cz + 11; gz++) {
      const z = gz * TILE;
      for (let l = 0; l <= LANES; l++) {
        const w = bankAt(z) * 2 / LANES;
        const x = laneX(0, z) - w / 2 + l * w;
        addBox(x, 0.25, z, 1.2, 1, TILE * 0.62, [150, 200, 220]);
      }
    }

    // And a brighter pair of marks under the fish, so which lane you're
    // in is never a question.
    for (const s2 of [-1, 1]) {
      const w = bankAt(fish.z) * 2 / LANES;
      addBox(fish.x + s2 * w / 2, 0.4, fish.z, 2, 1.2, 26, [225, 245, 252]);
    }
  }

  function drawRocks() {
    for (const r of rocks) {
      if (r.z < fish.z - 120 || r.z > fish.z + 700) continue;
      const x = laneX(r.lane, r.z);
      addBox(x, 3, r.z, r.r * 1.7, 8, r.r * 1.7, ROCK, r.spin);
      addBox(x, 6, r.z, r.r * 1.1, 5, r.r * 1.1, shade(ROCK, 1.18), r.spin);
    }
  }

  // A rock still in the air, and the ring on the water marking where
  // it's going to land. The ring tightens and brightens as it drops.
  // A geyser: a churn of bubbles that you can see coming, then a column
  // of white water. The bubbling IS the warning - it's the difference
  // between a boost you chose and one that happened to you.
  // A taco, bobbing in the river. Shell, filling, and a bit of lettuce.
  function drawTacos() {
    for (const t of tacos) {
      if (t.eaten) continue;
      if (t.z < fish.z - 120 || t.z > fish.z + 700) continue;
      const x = laneX(t.lane, t.z);
      const bob = Math.sin(t.bob) * 1.2;
      const tip = Math.sin(t.bob * 0.7) * 0.18;

      // The shell: two sides leaning together.
      for (const sgn of [-1, 1]) {
        addBox(x + sgn * 3.4, 4 + bob, t.z, 3, 9, 13, [232, 190, 84], tip);
      }
      addBox(x, 7.5 + bob, t.z, 9, 3, 13, [214, 168, 70], tip);   // the fold
      addBox(x, 5.6 + bob, t.z, 5.5, 3, 12, [178, 66, 52], tip);  // the filling
      addBox(x, 7 + bob, t.z, 6.5, 1.6, 10, [124, 178, 70], tip); // the lettuce

      // A little shine on top so it reads as a THING TO GET rather than
      // as one more lump in the water to dodge.
      const glow = 0.5 + Math.sin(clock * 4 + t.bob) * 0.5;
      addBox(x, 11 + bob, t.z, 3, 1.4, 3, [255, 240 - glow * 60, 120]);
    }
  }

  function drawGeysers() {
    for (const g of geysers) {
      if (g.z < fish.z - 120 || g.z > fish.z + 700) continue;
      const x = laneX(g.lane, g.z);

      if (g.on > 0) {
        // UP. Slabs stacked into a column, tallest in the middle of the
        // blow and dying away at the end.
        const left = g.on / GEYSER_ON;
        const tall = 54 * Math.sin(left * Math.PI) + 8;
        for (let i = 0; i < 5; i++) {
          const up = tall * (i / 5);
          const wob = Math.sin(clock * 18 + i) * 2.5;
          addBox(x + wob, up + tall / 10, g.z, 15 - i * 1.6, tall / 4,
                 15 - i * 1.6, [232, 248, 253]);
        }
        continue;
      }

      // Bubbling, and it churns harder the closer it is to going.
      const soon = clamp(1 - g.t / GEYSER_WARN, 0, 1);
      if (soon <= 0) {
        // Resting: just a patch of paler water so you know it's there.
        addBox(x, 0.5, g.z, 15, 1, 15, [92, 150, 176]);
        continue;
      }
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2 + clock * 4;
        const r = 7 * (1 - soon * 0.4);
        addBox(x + Math.cos(a) * r, 1 + Math.sin(clock * 9 + i) * soon * 2.5,
               g.z + Math.sin(a) * r, 3.4, 2.4, 3.4,
               [190 + soon * 46, 226 + soon * 22, 240]);
      }
    }
  }

  function drawFallers() {
    for (const fr of fallers) {
      if (fr.gone) continue;
      if (fr.z < fish.z - 120 || fr.z > fish.z + 700) continue;
      const x = laneX(fr.lane, fr.z);
      const soon = clamp(1 - fr.t / FALL_TIME, 0, 1);

      // THE RING. Eight marks in a circle, closing in.
      const ring = fr.r * (2.6 - soon * 1.4);
      const bright = 120 + soon * 135;
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + soon * 2;
        addBox(x + Math.cos(a) * ring, 0.6, fr.z + Math.sin(a) * ring,
               3, 1.4, 3, [bright, bright * 0.62, 60]);
      }

      // And the rock itself, tumbling down.
      addBox(x, fr.y + 5, fr.z, fr.r * 1.6, 8, fr.r * 1.6, ROCK, fr.spin + fr.y * 0.05);
      addBox(x, fr.y + 9, fr.z, fr.r * 1.0, 5, fr.r * 1.0,
             shade(ROCK, 1.18), fr.spin + fr.y * 0.05);
    }
  }

  function drawLogs() {
    for (const l of logs) {
      if (l.z < fish.z - 120 || l.z > fish.z + 700) continue;
      const w = bankAt(l.z) * 2 / LANES;
      // Centre of the lanes it covers, from the same laneX() as
      // everything else - so a log that LOOKS like it shuts lanes 1 and
      // 2 is the log that shuts lanes 1 and 2.
      const x = (laneX(l.lane, l.z) + laneX(l.lane + l.span - 1, l.z)) / 2;
      const long = w * l.span * 0.94;
      const bob = Math.sin(l.bob) * 0.7;

      addBox(x, 2.4 + bob, l.z, long, 7, 11, [104, 74, 48], l.spin);
      addBox(x, 4.6 + bob, l.z, long * 0.96, 3, 8, [130, 96, 62], l.spin);
      // The cut ends, paler, so it reads as a log and not a plank.
      for (const e of [-1, 1]) {
        addBox(x + e * long / 2, 2.6 + bob, l.z, 2.5, 8, 10,
               [166, 132, 92], l.spin);
      }
      // A couple of stubs of branch.
      addBox(x + long * 0.18, 3 + bob, l.z + 8, 3, 4, 9, [92, 66, 42], l.spin);
    }
  }

  function drawBears() {
    for (const b of bears) {
      if (b.z < fish.z - 120 || b.z > fish.z + 700) continue;
      const lean = b.swipe > 0 ? 16 : 0;
      // Stood on its own bank, reaching for the lane it guards.
      const px = b.side * (bankAt(b.z) + 16) - b.side * lean;

      addBox(px, 7, b.z, 20, 14, 26, FUR);                       // body
      addBox(px - b.side * 4, 15, b.z + 11, 12, 11, 12, shade(FUR, 1.12));  // head
      for (const s of [-1, 1]) addBox(px - b.side * 4 + s * 4, 21, b.z + 11, 4, 4, 4, shade(FUR, 0.8));
      // The paw, out over the water when it swipes.
      addBox(px - b.side * (14 + lean), 8, b.z + 8, 10, 6, 10,
             b.swipe > 0 ? [150, 110, 80] : shade(FUR, 0.9));
    }
  }

  function drawEagles() {
    for (const e of eagles) {
      if (e.z < fish.z - 120 || e.z > fish.z + 700) continue;
      const z = e.cz !== undefined ? e.cz : e.z;
      const x = e.cx !== undefined ? e.cx : laneX(e.lane, z);
      const hi = 48 + Math.sin(e.a * 1.3) * 6;

      // The shadow on the water is the warning. It's directly under the
      // bird, so you can read where it is without looking up.
      addBox(x, 0.4, z, 14, 1, 14, [16, 40, 54]);

      addBox(x, hi, z, 7, 5, 16, [64, 52, 44]);
      const flap = Math.sin(clock * 7 + e.a) * 4;
      for (const s of [-1, 1]) {
        addBox(x + s * 15, hi + flap * s, z, 24, 2, 9, [78, 64, 52]);
      }
      addBox(x, hi + 2, z - 9, 5, 4, 5, [222, 216, 204]);        // white head
    }
  }

  // A WALL OF WATER, right across the river. Tall enough that it reads
  // as a wall from straight above - and it's built from the same
  // bankAt() as everything else, so it always exactly spans the river,
  // narrow bits included.
  function drawWave() {
    if (wave.z < fish.z - 300 || wave.z > fish.z + 400) return;
    const half = bankAt(wave.z) + 14;

    // The face of it, in slabs across the river, each rearing a
    // different amount so the crest is ragged rather than a ruler.
    const n = 14;
    for (let i = 0; i < n; i++) {
      const x = -half + (i + 0.5) * (half * 2 / n);
      const rear = 16 + Math.sin(i * 1.7 + wave.foam * 6) * 5;
      addBox(x, rear / 2, wave.z, half * 2 / n + 2, rear, 26, [116, 176, 200]);
      // White water on top of the crest.
      addBox(x, rear, wave.z + 8, half * 2 / n + 2, 5,
             12 + Math.sin(i * 2.3 + wave.foam * 8) * 5, [236, 248, 252]);
    }

    // And the dark water piled up behind it.
    addBox(0, 6, wave.z - 40, half * 2, 12, 70, [52, 104, 132]);
  }

  function drawFish() {
    // The, ahem, exhaust. Only while it's working.
    if (fish.boost > 0) {
      for (let i = 0; i < 4; i++) {
        const puff = 12 + i * 7;
        const wob = Math.sin(clock * 14 + i * 1.3) * 2.4;
        addBox(fish.x + wob, 2 + i * 0.6, fish.z - puff,
               7 - i, 5 - i * 0.7, 7 - i,
               [150 + i * 14, 190 + i * 10, 80 + i * 12]);
      }
    }

    const co = Math.cos(fish.yaw), si = Math.sin(fish.yaw);
    function bit(ox, oy, oz, w, h, d, rgb) {
      addBox(fish.x + ox * co + oz * si, fish.y + oy, fish.z - ox * si + oz * co,
             w, h, d, rgb, fish.yaw);
    }
    const flick = Math.sin(fish.tail) * 0.5;
    const hurt = fish.stun > 0 ? 1.5 : 1;

    bit(0, 2, 2, 9, 6, 20, shade(SALMON, hurt));                 // body
    bit(0, 3.6, 4, 6, 3, 14, shade([232, 150, 130], hurt));      // belly stripe
    bit(0, 2, 12, 6, 5, 7, shade(SALMON, 0.9 * hurt));           // head
    bit(2.4, 3, 14, 1.6, 1.6, 1.6, [24, 20, 18]);                // eye
    bit(-2.4, 3, 14, 1.6, 1.6, 1.6, [24, 20, 18]);

    // The tail sweeps side to side, and that's the whole animation.
    bit(flick * 5, 2, -10, 3, 8, 8, shade(SALMON, 0.8 * hurt));
    bit(flick * 8, 2, -14, 2, 11, 5, shade(SALMON, 0.7 * hurt));
    for (const s of [-1, 1]) bit(s * 5, 1.4, 2, 7, 1.5, 5, shade(SALMON, 0.85 * hurt));
  }

  function drawBits() {
    for (const b of bits) {
      addBox(b.x, b.y, b.z, b.size, b.size, b.size, b.col);
    }
  }


// -------------------------------------------------------------------
//  THE WRITING ON TOP
// -------------------------------------------------------------------

  const STICK_MAX = 52;
  const stick = { on: false, ox: 0, oy: 0, dx: 0, dy: 0, push: 0, flicked: false };
  const roles = {};
  let touchMode = false;

  function leapBtn() {
    const r = Math.min(W, H) * 0.11;
    return { x: W - r - 26, y: H - r - 26, r: r };
  }

  function drawHud() {
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.05, 44) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#dff0f6';
    ctx.fillText(Math.floor(dist) + ' m upstream', 20, 52);

    if (best > 0) {
      ctx.font = Math.min(W * 0.024, 15) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#5e8496';
      ctx.fillText('best ' + best + ' m', 22, 76);
    }

    // HOW FAST THE WATER IS HERE. The thing you plan around.
    const strong = currentAt(fish.z);
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.026, 17) + 'px system-ui, sans-serif';
    ctx.fillStyle = strong > 1 ? '#ffd76a' : '#5e8496';
    ctx.fillText(strong > 1 ? 'RAPIDS' : 'calm water', W - 20, 40);

    // HOW CLOSE THE WAVE IS. The bar you actually watch.
    const slack = clamp((fish.z - wave.z) / WAVE_LEAD, 0, 1);
    const bw = Math.min(W * 0.3, 300), bx = W - bw - 20, by = 52;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bx, by, bw, 12);
    ctx.fillStyle = slack > 0.6 ? '#7fd0a0' : slack > 0.3 ? '#e0c83c' : '#e05a4a';
    ctx.fillRect(bx + bw * (1 - slack), by, bw * slack, 12);
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.02, 13) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#5e8496';
    ctx.fillText('THE WAVE', W - 20, by + 26);

    ctx.textAlign = 'center';
    if (saysT > 0) {
      ctx.font = 'bold ' + Math.min(W * 0.03, 20) + 'px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(223,240,246,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, H * 0.72);
    }

    if (state === 'ready') {
      ctx.font = 'bold ' + Math.min(W * 0.07, 60) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#dff0f6';
      ctx.fillText('SALMON', W / 2, H * 0.34);
      ctx.font = Math.min(W * 0.028, 19) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#7fa8bb';
      ctx.fillText('swim up the river. it will not help you.', W / 2, H * 0.41);
      ctx.fillText(touchMode ? 'tap to start' : 'press SPACE to start', W / 2, H * 0.47);
    }
    if (state === 'dead') {
      ctx.font = 'bold ' + Math.min(W * 0.06, 52) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#e05a4a';
      ctx.fillText(deadWhy, W / 2, H * 0.34);
      ctx.font = 'bold ' + Math.min(W * 0.04, 30) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#dff0f6';
      ctx.fillText(Math.floor(dist) + ' metres upstream', W / 2, H * 0.42);
      ctx.font = Math.min(W * 0.028, 19) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#7fa8bb';
      ctx.fillText(touchMode ? 'tap to go again' : 'press SPACE to go again', W / 2, H * 0.49);
    }
  }

  function drawPads() {
    if (!touchMode) return;

    const b = leapBtn();
    const can = state === 'swim' && !fish.leaping && fish.stun <= 0;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = can ? 'rgba(127,208,160,0.22)' : 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = can ? '#7fd0a0' : 'rgba(255,255,255,0.3)';
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.round(b.r * 0.38) + 'px system-ui, sans-serif';
    ctx.fillStyle = can ? '#7fd0a0' : '#5e8496';
    ctx.fillText('LEAP', b.x, b.y + b.r * 0.14);

    if (!stick.on) return;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_MAX, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath();
    ctx.arc(stick.ox + stick.dx, stick.oy + stick.dy, STICK_MAX * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(223,240,246,0.45)';
    ctx.fill();
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const HELP_KEYS  = 'W S to swim &nbsp;&nbsp; A D to change lane &nbsp;&nbsp; SPACE to leap';
  const HELP_TOUCH = 'DRAG up to swim &nbsp;&nbsp; FLICK sideways for a lane &nbsp;&nbsp; LEAP to jump';

  function setHelpLine() {
    const el = document.getElementById('hud');
    if (el) el.innerHTML = touchMode ? HELP_TOUCH : HELP_KEYS;
  }

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'space') { leap(); e.preventDefault(); return; }

    // ONE LANE PER PRESS, not per frame. Without the `keys[k]` guard,
    // holding left would fly you across all four lanes in a twentieth
    // of a second and you could never pick the second one.
    if ((k === 'a' || k === 'arrowleft')  && !keys[k]) goLane(-1);
    if ((k === 'd' || k === 'arrowright') && !keys[k]) goLane(1);

    keys[k] = true;
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function nearBtn(mx, my, b) { return Math.hypot(mx - b.x, my - b.y) < b.r * 1.35; }

  // MOBILE FROM THE START. Every finger gets a role kept by its
  // identifier, so swimming while pressing LEAP works and lifting one
  // doesn't cancel the other.
  function readTouches(e) {
    for (const t of e.changedTouches) {
      const x = t.clientX, y = t.clientY;

      if (e.type === 'touchstart') {
        if (state !== 'swim') { leap(); continue; }     // tap to start or retry
        if (nearBtn(x, y, leapBtn())) {
          roles[t.identifier] = 'leap';
          leap();
        } else {
          roles[t.identifier] = 'swim';
          stick.on = true;
          stick.ox = x; stick.oy = y;
          stick.dx = 0; stick.dy = 0; stick.push = 0;
        }
      } else if (e.type === 'touchmove') {
        if (roles[t.identifier] !== 'swim') continue;
        let dx = x - stick.ox, dy = y - stick.oy;
        const len = Math.hypot(dx, dy);
        if (len > STICK_MAX) { dx *= STICK_MAX / len; dy *= STICK_MAX / len; }
        stick.dx = dx; stick.dy = dy;
        stick.push = Math.min(1, len / STICK_MAX);

        // A FLICK SIDEWAYS IS ONE LANE. The thumb has to come back
        // towards the middle before it moves you again - otherwise
        // holding it over slides you across all four lanes at once,
        // which is the same bug the keyboard guard prevents.
        const sideways = stick.dx / STICK_MAX;
        if (!stick.flicked && sideways >  0.5) { goLane(1);  stick.flicked = true; }
        if (!stick.flicked && sideways < -0.5) { goLane(-1); stick.flicked = true; }
        if (Math.abs(sideways) < 0.25) stick.flicked = false;
      } else {
        if (roles[t.identifier] === 'swim') {
          stick.on = false; stick.push = 0; stick.dx = 0; stick.dy = 0;
          stick.flicked = false;
        }
        delete roles[t.identifier];
      }
    }
  }

  canvas.addEventListener('mousedown', function () { leap(); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (!touchMode) { touchMode = true; setHelpLine(); }
    readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault(); readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    e.preventDefault(); readTouches(e);
  }, { passive: false });
  canvas.addEventListener('touchcancel', function (e) { readTouches(e); }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;

    update(dt);

    ctx.fillStyle = '#0b1c26';
    ctx.fillRect(0, 0, W, H);

    faces = [];
    drawRiver();
    drawLanes();
    drawTacos();
    drawRocks();
    drawLogs();
    drawGeysers();
    drawFallers();
    drawBears();
    drawEagles();
    drawWave();
    drawBits();
    drawFish();
    paint();

    drawHud();
    drawPads();

    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

</script>
</body>
</html>
