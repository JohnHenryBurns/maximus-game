<!-- ADD TO HOME SCREEN / CAST TO THE TELLY
     This game has its OWN manifest, so "Add to Home Screen" gives it its own

<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #080c14; color: #dfe8f5;

<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
  font-size: 13px !important; font-weight: 600 !important; letter-spacing: 0.3px !important;
  line-height: 1 !important; text-decoration: none !important; text-transform: none !important;
  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;
  background: rgba(40, 22, 44, 0.78) !important;
  color: #fff5e8 !important;
}
a.arcade-pill .ah-arrow { font-size: 14px !important; opacity: 0.9 !important; }
/* the floating version, for games that had nowhere to put it */
a.arcade-pill.arcade-float {
  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;
  z-index: 2147483000 !important;
}
</style>

<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

<canvas id="screen"></canvas>

<script>
// ===================================================================
//  THE LOST SHIP
//
//  You are in a spacesuit, walking the decks of a ship nobody came
//  back from. The robots still work. They do not want you here.
//
//  Every one you scrap makes you a little stronger, and the deeper
//  into the ship you get the nastier they are - so the question is
//  never "can I beat this one" but "am I strong enough YET".
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Same number in, same number out, for ever. The woods are built from
  // this, so the trees and platforms 500 paces ahead are already decided
  // and do not shuffle about when you walk back.
  function hash(n) {
    n = Math.sin(n * 127.1) * 43758.5453;
    return n - Math.floor(n);
  }


// -------------------------------------------------------------------
//  THE WORLD
// -------------------------------------------------------------------

  const GROUND = 0.78;             // how far down the screen the floor is
  const GRAV = 2100;
  const JUMP = 720;
  const RUN = 250;

  function groundY() { return H * GROUND; }

  // A corridor, not a field. The deck head is barely taller than a jump,
  // which is the whole point: you cannot simply hop over anything.
  const CEIL_H = 200;
  const SUIT_H = 84;                 // boots to the top of the helmet
  function ceilingY() { return groundY() - CEIL_H; }

  // Platforms are worked out from where they are, not stored in a list,
  // so the world can go on for ever without remembering any of it.
  const PLAT_EVERY = 340;
  function platformAt(i) {
    const r = hash(i * 3.7);
    if (r < 0.42) return null;                       // not every slot has one
    const x = i * PLAT_EVERY + hash(i * 9.1) * 120;
    const w = 90 + hash(i * 5.3) * 110;
    // Low enough to stand on without your helmet in the ceiling.
    const up = 54 + hash(i * 2.9) * 44;
    return { x: x, y: groundY() - up, w: w, h: 16 };
  }
  function platformsNear(x0, x1) {
    const out = [];
    const from = Math.floor(x0 / PLAT_EVERY) - 1, to = Math.floor(x1 / PLAT_EVERY) + 1;
    for (let i = from; i <= to; i++) {
      const p = platformAt(i);
      if (p) out.push(p);
    }
    return out;
  }


// -------------------------------------------------------------------
//  BULKHEAD DOORS
//
//  Sealed doors across the deck. You cannot squeeze past one - you open
//  it by rewiring the panel beside it, and once a door is open it stays
//  open.
// -------------------------------------------------------------------

  const DOOR_EVERY = 900;
  const WIRE_COLS = [
    { name: 'RED',   col: [235,  90,  90] },
    { name: 'GREEN', col: [110, 220, 130] },
    { name: 'BLUE',  col: [110, 175, 255] }
  ];

  let opened = {};                 // which doors you have already done

  function doorX(i) { return i * DOOR_EVERY + 520; }
  function doorsNear(x0, x1) {
    const out = [];
    const from = Math.floor(x0 / DOOR_EVERY) - 1, to = Math.floor(x1 / DOOR_EVERY) + 1;
    for (let i = Math.max(0, from); i <= to; i++) out.push({ i: i, x: doorX(i) });
    return out;
  }

  // The nearest door you are actually standing at, or nothing.
  function doorAtHand() {
    for (const d of doorsNear(you.x - 200, you.x + 200)) {
      if (opened[d.i]) continue;
      if (Math.abs(d.x - you.x) < 90) return d;
    }
    return null;
  }

  // The right-hand sockets are shuffled, so the wires always cross in a
  // different way. Worked out from the door number, so walking away and
  // coming back gives you the SAME puzzle rather than a fresh one.
  function puzzleFor(i) {
    const right = [0, 1, 2];
    for (let k = 2; k > 0; k--) {
      const j = Math.floor(hash(i * 5.5 + k) * (k + 1));
      const t = right[k]; right[k] = right[j]; right[j] = t;
    }
    return { left: [0, 1, 2], right: right, joined: [-1, -1, -1], pick: -1, buzz: 0 };
  }

  let puzzle = null, puzzleDoor = -1;

  function openPanel(d) {
    puzzle = puzzleFor(d.i);
    puzzleDoor = d.i;
    say('match the colours - tap one side, then the other');
  }


// -------------------------------------------------------------------
//  WHAT LIVES OUT THERE
//
//  hp and hit grow with how deep into the woods they are, so the same
//  three monsters stay dangerous the whole way.
// -------------------------------------------------------------------

  const KINDS = [
    { name: 'SPARKBOT', hp: 10, hit: 4,  speed: 60,  xp: 5,  col: [120, 200, 230], r: 26, flies: false },
    { name: 'DRONE',    hp: 7,  hit: 3,  speed: 130, xp: 7,  col: [235, 180,  90], r: 21, flies: true },
    { name: 'CRUSHER',  hp: 30, hit: 9,  speed: 45,  xp: 18, col: [230, 100, 110], r: 36, flies: false }
  ];

  // One metre is 40 pixels. How far in is what makes everything harder.
  function depthOf(x) { return Math.max(0, Math.floor(x / 40)); }
  function meanness(x) { return 1 + depthOf(x) / 220; }


// -------------------------------------------------------------------
//  GUNS
//
//  A gun goes in the same hand as the blade, and fires with the same
//  button - so a phone never grows a fifth thumb. What the HIT button
//  does depends on what you are holding.
//
//  Ammo always runs out, and then the blade is still there. A gun is a
//  treat, not a replacement.
// -------------------------------------------------------------------

  const GUNS = [
    { name: 'PISTOL',  dmg: 7,  rate: 4.0, ammo: 34, speed: 780, shots: 1, spread: 0,
      col: [150, 220, 255] },
    { name: 'SCATTER', dmg: 5,  rate: 1.6, ammo: 20, speed: 640, shots: 3, spread: 0.20,
      col: [255, 190, 110] },
    { name: 'RAILGUN', dmg: 26, rate: 0.9, ammo: 12, speed: 1500, shots: 1, spread: 0,
      pierce: true, col: [220, 150, 255] }
  ];

  let shotsOut = [];             // bullets in the air


// -------------------------------------------------------------------
//  YOU
// -------------------------------------------------------------------

  const you = {
    x: 0, y: 0, vx: 0, vy: 0, onGround: false, face: 1,
    hp: 20, max: 20, lv: 1, xp: 0, dmg: 6,
    swing: 0, cool: 0, hurt: 0, coins: 0, best: 0,
    gun: -1, ammo: 0
  };

  let mobs = [], drops = [], bits = [], floats = [];
  let camX = 0, dead = false, says = '', saysT = 0, shake = 0;
  let spawnedTo = 0;

  function say(w) { says = w; saysT = 2.6; }

  function xpNeeded(lv) { return 20 + (lv - 1) * 18; }

  function reset() {
    you.x = 60; you.y = groundY() - 40; you.vx = 0; you.vy = 0;
    you.hp = 20; you.max = 20; you.lv = 1; you.xp = 0; you.dmg = 6;
    you.swing = 0; you.cool = 0; you.hurt = 0; you.coins = 0;
    you.gun = -1; you.ammo = 0;
    mobs = []; drops = []; bits = []; floats = []; shotsOut = [];
    camX = 0; dead = false; spawnedTo = 0;
    say('walk right. cut through them.');
  }

  function levelUp() {
    you.xp -= xpNeeded(you.lv);
    you.lv++;
    you.max += 6;
    you.hp = you.max;                       // a level up puts you right
    you.dmg += 3;
    say('LEVEL ' + you.lv + '!  stronger, and patched up');
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 200;
      bits.push({ x: you.x, y: you.y - 20, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                  life: 0.7, col: [255, 220, 120] });
    }
  }

  function giveXp(n) {
    you.xp += n;
    while (you.xp >= xpNeeded(you.lv)) levelUp();
  }


// -------------------------------------------------------------------
//  MONSTERS
// -------------------------------------------------------------------

  // They are put out ahead of you as you go, never behind - so walking
  // back down the path you have cleared stays cleared.
  function spawnAhead() {
    const upTo = you.x + W + 400;
    while (spawnedTo < upTo) {
      // The ship fills up the deeper in you get. Near the airlock they
      // are spread out; a long way in it is a crowd. Making it crowded
      // everywhere put eleven robots on screen at level one.
      const packed = clamp(1 - depthOf(spawnedTo) / 250, 0, 1);
      spawnedTo += (80 + hash(spawnedTo * 1.7) * 150) * (1 + 1.3 * packed);
      if (spawnedTo < 320) continue;                 // a quiet start
      // Never right on a doorway, or you open a door into a face.
      let onDoor = false;
      for (const d of doorsNear(spawnedTo - 200, spawnedTo + 200)) {
        if (Math.abs(d.x - spawnedTo) < 130) onDoor = true;
      }
      if (onDoor) continue;
      const r = hash(spawnedTo * 4.3);
      const deep = depthOf(spawnedTo);
      let kind = 0;
      if (r > 0.55) kind = 1;
      if (r > 0.84 && deep > 25) kind = 2;
      const k = KINDS[kind];
      const m = meanness(spawnedTo);

      // A knot of two or three, once you are properly inside.
      const pack = (depthOf(spawnedTo) > 45 && hash(spawnedTo * 6.1) > 0.72)
                 ? 2 + Math.floor(hash(spawnedTo * 2.2) * 2) : 1;
      for (let n = 0; n < pack; n++) {
        const px = spawnedTo + n * (34 + hash(spawnedTo + n) * 26);

        // Check EVERY one of the knot against the doors, not just the
        // first - the others are shoved sideways and three of them ended
        // up standing in a doorway.
        let blocksDoor = false;
        for (const d of doorsNear(px - 200, px + 200)) {
          if (Math.abs(d.x - px) < 130) blocksDoor = true;
        }
        if (blocksDoor) continue;

        mobs.push({
          kind: kind, x: px, y: k.flies ? groundY() - 62 - hash(px) * 58
                                        : groundY() - k.r,
          vy: 0, hp: Math.round(k.hp * m), max: Math.round(k.hp * m),
          hit: Math.round(k.hit * m), t: hash(px * 8.1) * 6, hurt: 0
        });
      }
    }
  }

  function pop(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 220;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                  life: 0.4 + Math.random() * 0.4, col: col });
    }
    if (bits.length > 260) bits.splice(0, bits.length - 260);
  }

  // Everything that finishes a robot goes through here, so the blade and
  // a bullet cannot drift apart in what a kill is worth or what it drops.
  function killMob(m) {
    const idx = mobs.indexOf(m);
    if (idx < 0) return;                    // something already got it
    const k = KINDS[m.kind];
    pop(m.x, m.y, k.col, 16);
    giveXp(Math.round(k.xp * meanness(m.x)));

    const roll = hash(m.x * 13.3);
    if (roll < 0.10) {
      // A gun, and which one leans on how deep in you are - the heavy
      // stuff is further into the ship.
      const deep = depthOf(m.x);
      const g2 = hash(m.x * 21.7);
      let which = 0;
      if (deep > 60 && g2 > 0.55) which = 1;
      if (deep > 140 && g2 > 0.85) which = 2;
      drops.push({ x: m.x, y: m.y, kind: 'gun', gun: which, t: 0 });
    }
    else if (roll < 0.34) drops.push({ x: m.x, y: m.y, kind: 'heart', t: 0 });
    else if (roll < 0.74) drops.push({ x: m.x, y: m.y, kind: 'coin', t: 0 });

    mobs.splice(idx, 1);
  }

  function hurtYou(n) {
    if (you.hurt > 0 || dead) return;         // a moment of mercy after a hit
    you.hp -= n;
    you.hurt = 0.8;
    shake = 0.3;
    floats.push({ x: you.x, y: you.y - 40, text: '-' + n, life: 1, col: [255, 120, 120] });
    if (you.hp <= 0) {
      you.hp = 0; dead = true;
      you.best = Math.max(you.best, depthOf(you.x));
      say('suit breached - tap to try again');
    }
  }


// -------------------------------------------------------------------
//  THE HEARTBEAT
//
//  Your own heart, through the helmet. It is not decoration: it beats
//  faster the closer you are to dead, so you can HEAR how much trouble
//  you are in without looking at the bar.
//
//  A browser will not make a sound until you have touched the screen -
//  that is a rule of the web, not a bug - so the sound kit is built on
//  your first tap rather than when the page loads.
// -------------------------------------------------------------------

  const CALM_BPM = 66, PANIC_BPM = 152;

  let ac = null, master = null, soundOn = true;
  let beatT = 0, beatPhase = 0;

  function ensureAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;                       // no sound on this machine
    ac = new Ctx();
    master = ac.createGain();
    master.gain.value = 0.9;                // loud, as asked
    master.connect(ac.destination);
  }

  // One thump. A low sine that drops in pitch as it fades is what a
  // heartbeat sounds like; the little click on top is what makes it
  // audible on a phone speaker, which cannot really do 60Hz.
  function thump(at, level, from, to) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(from, at);
    o.frequency.exponentialRampToValueAtTime(to, at + 0.16);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.26);
    o.connect(g); g.connect(master);
    o.start(at); o.stop(at + 0.3);

    const c = ac.createOscillator(), cg = ac.createGain();
    c.type = 'triangle';
    c.frequency.setValueAtTime(from * 2.6, at);
    cg.gain.setValueAtTime(0.0001, at);
    cg.gain.exponentialRampToValueAtTime(level * 0.32, at + 0.008);
    cg.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
    c.connect(cg); cg.connect(master);
    c.start(at); c.stop(at + 0.12);
  }

  // Lub-DUB. Two thumps close together, then the wait.
  function beat(hard) {
    if (!ac || !soundOn) return;
    const now = ac.currentTime;
    thump(now, 0.55 * hard, 62, 30);
    thump(now + 0.17, 0.38 * hard, 52, 26);
  }

  function heartRate() {
    const left = clamp(you.hp / you.max, 0, 1);
    return CALM_BPM + (PANIC_BPM - CALM_BPM) * (1 - left);
  }

  function stepHeart(dt) {
    if (!ac || !soundOn || dead) return;
    beatT -= dt;
    if (beatT <= 0) {
      // Harder as well as faster when you are in trouble.
      const left = clamp(you.hp / you.max, 0, 1);
      beat(0.75 + (1 - left) * 0.5);
      beatT = 60 / heartRate();
      beatPhase = 1;
    }
    if (beatPhase > 0) beatPhase -= dt * 3.5;
  }

  function soundBox() {
    const r = 22;
    return { x: W - 16 - r, y: 74 + r, r: r };
  }
  function inCircle(mx, my, b) {
    const dx = mx - b.x, dy = my - b.y;
    return dx * dx + dy * dy < (b.r * 1.4) * (b.r * 1.4);
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const keys = {};
  window.addEventListener('keydown', function (e) {
    ensureAudio();
    if (e.key.toLowerCase() === 'm') soundOn = !soundOn;   // M for mute
    keys[e.key.toLowerCase()] = true;
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  // Thumbs first: two on the left to walk, two on the right to jump and
  // swing. Everything else in the game is drawn around what is left.
  // The size comes FROM the room available, not from a guess. Four
  // circles at 3.1 radii apart need 8.2 radii plus the margins to fit
  // across - guessing 62 made the RIGHT and JUMP buttons overlap on a
  // 430px phone, so one thumb would have pressed both.
  const SPREAD = 3.1;
  function padR() {
    return Math.max(22, Math.min(W * 0.12, (W - 52) / (SPREAD * 2 + 2), 62));
  }
  function padY() { return H - padR() - 24; }
  function btnLeft()  { return { x: 20 + padR(), y: padY(), r: padR() }; }
  function btnRight() { return { x: 20 + padR() * SPREAD, y: padY(), r: padR() }; }
  function btnJump()  { return { x: W - 24 - padR() * SPREAD, y: padY(), r: padR() }; }
  function btnHit()   { return { x: W - 24 - padR(), y: padY(), r: padR() }; }

  let held = { left: false, right: false, jump: false, hit: false };
  const touches = {};

  function whichButton(x, y) {
    const list = [['left', btnLeft()], ['right', btnRight()],
                  ['jump', btnJump()], ['hit', btnHit()]];
    if (doorAtHand() && !puzzle) list.push(['use', btnUse()]);
    for (const [name, b] of list) {
      const dx = x - b.x, dy = y - b.y;
      // A generous circle - a thumb is not a pixel.
      if (dx * dx + dy * dy < (b.r * 1.25) * (b.r * 1.25)) return name;
    }
    return null;
  }

  function refreshHeld() {
    held = { left: false, right: false, jump: false, hit: false, use: false };
    for (const id in touches) {
      const name = touches[id];
      if (name) held[name] = true;
    }
  }

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    ensureAudio();
    for (const t of e.changedTouches) {
      if (inCircle(t.clientX, t.clientY, soundBox())) { soundOn = !soundOn; return; }
    }
    if (dead) { reset(); return; }
    if (puzzle) {                        // the panel takes every tap
      for (const t of e.changedTouches) panelTap(t.clientX, t.clientY);
      return;
    }
    for (const t of e.changedTouches) {
      touches[t.identifier] = whichButton(t.clientX, t.clientY);
    }
    refreshHeld();
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) {
      touches[t.identifier] = whichButton(t.clientX, t.clientY);
    }
    refreshHeld();
  }, { passive: false });

  function endTouch(e) {
    e.preventDefault();
    for (const t of e.changedTouches) delete touches[t.identifier];
    refreshHeld();
  }
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });

  canvas.addEventListener('mousedown', function (e) {
    ensureAudio();
    if (inCircle(e.clientX, e.clientY, soundBox())) { soundOn = !soundOn; return; }
    if (dead) { reset(); return; }
    if (puzzle) { panelTap(e.clientX, e.clientY); return; }
    const b = whichButton(e.clientX, e.clientY);
    if (b) { touches['mouse'] = b; refreshHeld(); }
  });
  window.addEventListener('mouseup', function () {
    delete touches['mouse']; refreshHeld();
  });

  function wantLeft()  { return held.left  || keys['arrowleft']  || keys['a']; }
  function wantRight() { return held.right || keys['arrowright'] || keys['d']; }
  function wantJump()  { return held.jump  || keys[' '] || keys['arrowup'] || keys['w']; }
  function wantHit()   { return held.hit   || keys['j'] || keys['k'] || keys['f']; }

  // E on a keyboard, and a button that appears at a door on a phone -
  // because a phone has no E.
  function btnUse() {
    const r = padR() * 0.78;
    // ABOVE the thumb row, not between the two clusters - down there it
    // overlapped both RIGHT and JUMP, so one thumb hit two buttons.
    return { x: W / 2, y: padY() - padR() - r - 14, r: r };
  }
  let useWasDown = false;
  function useDown() { return held.use || keys['e']; }


// -------------------------------------------------------------------
//  THE GAME
// -------------------------------------------------------------------

  const SWING_TIME = 0.18, SWING_COOL = 0.34, REACH = 78;

  // ---- the wiring panel -------------------------------------------------
  function panelBox() {
    const w = Math.min(W - 40, 380), h = Math.min(H - 120, 380);
    return { x: (W - w) / 2, y: (H - h) / 2, w: w, h: h };
  }
  // side 0 is the left column, side 1 the right.
  function socketAt(side, row) {
    const p = panelBox();
    // Sized from the panel's HEIGHT as well as its width - on a phone
    // held sideways the panel is short, and width alone had the three
    // sockets touching each other.
    const r = Math.max(20, Math.min(p.w * 0.085, p.h * 0.074, 26));
    const x = side === 0 ? p.x + p.w * 0.18 : p.x + p.w * 0.82;
    // Rows sit higher and tighter, so the line of instructions at the
    // bottom has somewhere to go - it was printed through the last
    // socket before.
    const y = p.y + p.h * 0.28 + row * p.h * 0.16;
    return { x: x, y: y, r: r };
  }
  function panelDoneBox() {
    const p = panelBox();
    return { x: p.x + p.w * 0.28, y: p.y + p.h - 52, w: p.w * 0.44, h: 40 };
  }

  function panelTap(mx, my) {
    if (!puzzle) return;

    if (inBoxXY(mx, my, panelDoneBox())) { puzzle = null; return; }

    for (let side = 0; side < 2; side++) {
      for (let row = 0; row < 3; row++) {
        const sk = socketAt(side, row);
        const dx = mx - sk.x, dy = my - sk.y;
        if (dx * dx + dy * dy > (sk.r * 1.6) * (sk.r * 1.6)) continue;

        if (side === 0) {
          // Picking a left socket that is already wired unhooks it again,
          // so a mistake is never permanent.
          if (puzzle.joined[row] >= 0) { puzzle.joined[row] = -1; puzzle.pick = -1; return; }
          puzzle.pick = (puzzle.pick === row) ? -1 : row;
          return;
        }

        if (puzzle.pick < 0) { puzzle.buzz = 0.4; return; }   // nothing held
        const wantCol = puzzle.left[puzzle.pick];
        const gotCol = puzzle.right[row];
        const taken = puzzle.joined.indexOf(row) >= 0;
        if (taken) { puzzle.buzz = 0.4; return; }
        if (wantCol !== gotCol) { puzzle.buzz = 0.5; puzzle.pick = -1; return; }

        puzzle.joined[puzzle.pick] = row;
        puzzle.pick = -1;

        if (puzzle.joined.every(function (v) { return v >= 0; })) {
          opened[puzzleDoor] = true;
          puzzle = null;
          say('the door grinds open');
          for (let i = 0; i < 26; i++) {
            const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
            bits.push({ x: doorX(puzzleDoor), y: groundY() - 60,
                        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                        life: 0.7, col: [150, 230, 255] });
          }
        }
        return;
      }
    }
  }

  function inBoxXY(mx, my, b) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  }

  function swordBox() {
    return { x: you.x + (you.face > 0 ? 8 : -REACH - 8), y: you.y - 60,
             w: REACH, h: 66 };
  }

  function hits(b, mx, my, r) {
    return mx + r > b.x && mx - r < b.x + b.w && my + r > b.y && my - r < b.y + b.h;
  }

  function update(dt) {
    if (saysT > 0) saysT -= dt;
    stepHeart(dt);

    if (puzzle) {
      // The ship waits while you are elbow-deep in the wiring.
      if (puzzle.buzz > 0) puzzle.buzz -= dt;
      return;
    }

    // E opens the panel - on the press, not while held down.
    const useNow = useDown();
    if (useNow && !useWasDown) {
      const d = doorAtHand();
      if (d) openPanel(d);
    }
    useWasDown = useNow;
    if (shake > 0) shake -= dt * 2;

    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt; b.vy += GRAV * 0.35 * dt;
    }
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y -= dt * 46;
    }

    if (dead) return;

    // ---- you ------------------------------------------------------------
    if (you.hurt > 0) you.hurt -= dt;
    if (you.cool > 0) you.cool -= dt;
    if (you.swing > 0) you.swing -= dt;

    let move = 0;
    if (wantLeft()) move -= 1;
    if (wantRight()) move += 1;
    if (move) you.face = move;
    you.vx = move * RUN;

    if (wantJump() && you.onGround) { you.vy = -JUMP; you.onGround = false; }

    if (wantHit() && you.cool <= 0 && you.gun >= 0 && you.ammo > 0) {
      // ---- firing --------------------------------------------------
      const g4 = GUNS[you.gun];
      you.cool = 1 / g4.rate;
      you.ammo--;
      you.swing = 0.08;                        // a little recoil flash
      shake = 0.12;

      for (let n = 0; n < g4.shots; n++) {
        const off = g4.shots > 1 ? (n - (g4.shots - 1) / 2) * g4.spread : 0;
        shotsOut.push({ x: you.x + you.face * 26, y: you.y - 44,
                        vx: you.face * g4.speed, vy: off * g4.speed,
                        dmg: g4.dmg, pierce: !!g4.pierce, col: g4.col,
                        life: 1.4, hitAlready: [] });
      }
      if (you.ammo <= 0) {
        say(g4.name + ' is empty - back to the blade');
        you.gun = -1;
      }

    } else if (wantHit() && you.cool <= 0) {
      you.swing = SWING_TIME;
      you.cool = SWING_COOL;

      const box = swordBox();
      for (let i = mobs.length - 1; i >= 0; i--) {
        const m = mobs[i], k = KINDS[m.kind];
        if (!hits(box, m.x, m.y, k.r)) continue;
        m.hp -= you.dmg;
        m.hurt = 0.25;
        floats.push({ x: m.x, y: m.y - k.r, text: '-' + you.dmg, life: 0.9,
                      col: [255, 220, 140] });
        pop(m.x, m.y, k.col, 6);
        if (m.hp <= 0) killMob(m);
      }
    }

    const wasX = you.x;
    you.x += you.vx * dt;

    // A shut door is a wall. You are stopped just short of it, either
    // side, so you can walk back the way you came.
    for (const d of doorsNear(you.x - 300, you.x + 300)) {
      if (opened[d.i]) continue;
      if (wasX <= d.x - 26 && you.x > d.x - 26) you.x = d.x - 26;
      else if (wasX >= d.x + 26 && you.x < d.x + 26) you.x = d.x + 26;
    }
    you.vy += GRAV * dt;
    you.y += you.vy * dt;
    if (you.x < 20) you.x = 20;

    // Helmet on the ceiling. Stops you dead rather than bouncing, so a
    // jump under a low deck head is just a short jump.
    if (you.y - SUIT_H < ceilingY()) {
      you.y = ceilingY() + SUIT_H;
      if (you.vy < 0) you.vy = 0;
    }

    // land on the ground, or on a platform on the way down
    you.onGround = false;
    if (you.y >= groundY()) { you.y = groundY(); you.vy = 0; you.onGround = true; }
    if (you.vy >= 0) {
      for (const p of platformsNear(camX - 200, camX + W + 200)) {
        const wasAbove = you.y - you.vy * dt <= p.y + 2;
        if (wasAbove && you.y >= p.y && you.y <= p.y + 26 &&
            you.x > p.x - 14 && you.x < p.x + p.w + 14) {
          you.y = p.y; you.vy = 0; you.onGround = true;
        }
      }
    }

    // ---- bullets -----------------------------------------------------
    for (let i = shotsOut.length - 1; i >= 0; i--) {
      const b = shotsOut[i];
      b.life -= dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // A shut door stops a bullet, same as it stops you.
      let stopped = b.life <= 0;
      for (const d of doorsNear(b.x - 60, b.x + 60)) {
        if (!opened[d.i] && Math.abs(d.x - b.x) < 20) stopped = true;
      }

      for (const m of mobs) {
        if (b.hitAlready.indexOf(m) >= 0) continue;
        const k = KINDS[m.kind];
        if (Math.abs(m.x - b.x) > k.r || Math.abs(m.y - b.y) > k.r + 14) continue;

        m.hp -= b.dmg;
        m.hurt = 0.25;
        b.hitAlready.push(m);
        floats.push({ x: m.x, y: m.y - k.r, text: '-' + b.dmg, life: 0.9, col: b.col });
        pop(m.x, m.y, b.col, 5);
        if (m.hp <= 0) killMob(m);
        if (!b.pierce) { stopped = true; break; }
      }

      if (stopped) shotsOut.splice(i, 1);
    }

    // ---- the monsters ----------------------------------------------------
    spawnAhead();
    for (const m of mobs) {
      const k = KINDS[m.kind];
      if (m.hurt > 0) m.hurt -= dt;
      m.t += dt;

      const gap = you.x - m.x;
      const near = Math.abs(gap) < W * 0.7;
      if (near) {
        const dir = gap > 0 ? 1 : -1;
        m.x += dir * k.speed * dt;
        if (k.flies) {
          // Bats bob, so they are awkward to time.
          // Bobbing, but never up into the ceiling.
          m.y = groundY() - 96 + Math.sin(m.t * 2.4) * 34;
        }
      }

      if (Math.abs(m.x - you.x) < k.r + 16 && Math.abs(m.y - you.y + 22) < k.r + 26) {
        hurtYou(m.hit);
      }
    }

    // ---- picking things up ------------------------------------------------
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.t += dt;
      if (Math.abs(d.x - you.x) < 34 && Math.abs(d.y - you.y + 20) < 44) {
        if (d.kind === 'gun') {
          const g3 = GUNS[d.gun];
          you.gun = d.gun;
          you.ammo = g3.ammo;                  // a fresh one, fully loaded
          you.cool = 0;
          say(g3.name + '!  ' + g3.ammo + ' shots - the HIT button fires it');
          floats.push({ x: you.x, y: you.y - 50, text: g3.name, life: 1.2, col: g3.col });
        } else if (d.kind === 'heart') {
          you.hp = Math.min(you.max, you.hp + 8);
          floats.push({ x: you.x, y: you.y - 50, text: '+8', life: 1, col: [140, 255, 150] });
        } else {
          you.coins++;
          floats.push({ x: you.x, y: you.y - 50, text: '+1', life: 1, col: [255, 215, 120] });
        }
        drops.splice(i, 1);
      }
    }

    // ---- the camera --------------------------------------------------------
    const want = you.x - W * 0.34;
    camX += (want - camX) * Math.min(1, dt * 6);
    if (camX < 0) camX = 0;

    you.best = Math.max(you.best, depthOf(you.x));
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  // Crates, barrels, terminals and signs, worked out from where they are
  // so the ship remembers nothing and never rearranges itself. Purely
  // scenery - you walk straight through it, because a crate you can trip
  // over in a fight is a crate that gets you killed unfairly.
  function drawClutter() {
    const step = 96;
    const from = Math.floor(camX / step) - 1;
    for (let i = from; i < from + Math.ceil(W / step) + 3; i++) {
      const r = hash(i * 11.3);
      if (r < 0.22) continue;
      const x = i * step - camX + hash(i * 4.9) * 50;
      const g = groundY();

      if (r < 0.56) {                                 // stacked crates
        const n = 1 + Math.floor(hash(i * 3.1) * 3);
        for (let c = 0; c < n; c++) {
          const sz = 42 - c * 6;
          const ty = g - sz * (c + 1) - c * 2;
          ctx.fillStyle = c % 2 ? '#4a5f85' : '#56709c';
          ctx.fillRect(x - sz / 2, ty, sz, sz);
          ctx.fillStyle = '#6b86b5';                   // lit top edge
          ctx.fillRect(x - sz / 2, ty, sz, 4);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';          // strapping
          ctx.fillRect(x - sz / 2, ty + sz * 0.44, sz, 5);
          ctx.fillStyle = '#e8b13f';
          ctx.fillRect(x - 4, ty + sz * 0.2, 8, 8);    // a stencil mark
        }
      } else if (r < 0.74) {                          // a barrel
        ctx.fillStyle = '#5d7a49';
        ctx.fillRect(x - 17, g - 52, 34, 52);
        ctx.fillStyle = '#7a9c61';
        ctx.fillRect(x - 17, g - 52, 34, 4);
        ctx.fillStyle = '#42583a';
        ctx.fillRect(x - 17, g - 40, 34, 6);
        ctx.fillRect(x - 17, g - 18, 34, 6);
        ctx.fillStyle = '#e8b13f';
        ctx.fillRect(x - 7, g - 34, 14, 11);
      } else if (r < 0.88) {                          // a wall terminal
        ctx.fillStyle = '#33456a';
        ctx.fillRect(x - 22, g - 118, 44, 54);
        ctx.fillStyle = '#465c85';
        ctx.fillRect(x - 22, g - 118, 44, 4);
        ctx.fillStyle = hash(i * 7.7) > 0.5 ? '#5fd0e8' : '#7ee0a0';
        ctx.fillRect(x - 16, g - 111, 32, 26);
        ctx.fillStyle = '#0d1524';
        for (let l = 0; l < 4; l++) ctx.fillRect(x - 13, g - 107 + l * 6, 22, 2);
        ctx.fillStyle = '#3b4f74';
        ctx.fillRect(x - 5, g - 64, 10, 64);          // its stand
      } else {                                        // a hazard sign
        ctx.fillStyle = '#3b4f74';
        ctx.fillRect(x - 4, g - 58, 8, 58);
        ctx.fillStyle = '#f0bd44';
        ctx.beginPath();
        ctx.moveTo(x, g - 96); ctx.lineTo(x + 23, g - 56); ctx.lineTo(x - 23, g - 56);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1a2437';
        ctx.fillRect(x - 3, g - 84, 6, 16);
        ctx.fillRect(x - 3, g - 65, 6, 5);
      }
    }
  }

  function drawShip() {
    const g = groundY(), c = ceilingY(), band = g - c;

    // ---- the far wall of the corridor, and windows onto the black -----
    ctx.fillStyle = '#0c1424';
    ctx.fillRect(-30, c, W + 60, band);

    const step0 = 230;
    const from0 = Math.floor((camX * 0.12) / step0) - 1;
    for (let i = from0; i < from0 + Math.ceil(W / step0) + 3; i++) {
      const x = i * step0 - camX * 0.12;
      if (hash(i * 3.3) < 0.35) continue;             // not every bay
      const wy = c + band * 0.16, wh = band * 0.44;
      ctx.fillStyle = '#05070d';
      ctx.fillRect(x, wy, 130, wh);
      for (let k = 0; k < 8; k++) {
        const sx = x + 8 + hash(i * 7.7 + k) * 114;
        const sy = wy + 6 + hash(i * 3.1 + k * 2.3) * (wh - 12);
        ctx.fillStyle = 'rgba(220,235,255,' + (0.35 + hash(i + k * 5.5) * 0.6) + ')';
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.strokeStyle = '#22314e';
      ctx.lineWidth = 6;
      ctx.strokeRect(x, wy, 130, wh);
    }

    // ---- ribs of the hull, floor to ceiling ---------------------------
    const step1 = 165;
    const from1 = Math.floor((camX * 0.34) / step1) - 1;
    for (let i = from1; i < from1 + Math.ceil(W / step1) + 3; i++) {
      const x = i * step1 - camX * 0.34;
      ctx.fillStyle = '#16213a';
      ctx.fillRect(x - 17, c, 34, band);
      ctx.fillStyle = hash(i * 4.4) > 0.6 ? '#2e6c8a' : '#20304a';
      ctx.fillRect(x - 6, c + band * 0.72, 12, 12);
    }

    // ---- wall panels along the near side -------------------------------
    const step2 = 104;
    const from2 = Math.floor((camX * 0.55) / step2) - 1;
    for (let i = from2; i < from2 + Math.ceil(W / step2) + 3; i++) {
      const x = i * step2 - camX * 0.55;
      ctx.fillStyle = '#18233a';
      ctx.fillRect(x, c + band * 0.66, 74, band * 0.24);
      ctx.fillStyle = '#0d1524';
      ctx.fillRect(x + 6, c + band * 0.74, 62, 5);
    }
    ctx.fillStyle = '#22314e';
    ctx.fillRect(-30, g - 26, W + 60, 11);            // a pipe at knee height
  }

  // Everything ABOVE the corridor: the guts of the deck overhead. It
  // fills whatever screen is left, which is what makes the ceiling read
  // as LOW rather than as an empty sky.
  function drawCeiling() {
    const c = ceilingY();

    ctx.fillStyle = '#0a1020';
    ctx.fillRect(-30, -30, W + 60, c + 30);

    // The guts of the deck overhead. A low ceiling on a tall screen
    // leaves a LOT of room up here, and two flat bands read as an empty
    // wall rather than as machinery - so it is packed with runs of duct
    // and cable at five different depths, each drifting at its own speed.
    const RUNS = [
      { at: 0.14, thick: 0.10, col: '#0f1728', speed: 0.16 },
      { at: 0.32, thick: 0.15, col: '#131d31', speed: 0.24 },
      { at: 0.52, thick: 0.09, col: '#18243c', speed: 0.34 },
      { at: 0.68, thick: 0.17, col: '#1a2740', speed: 0.44 },
      { at: 0.88, thick: 0.07, col: '#22314e', speed: 0.56 }
    ];

    for (const run of RUNS) {
      const y = c * (1 - run.at) - c * run.thick * 0.5;
      const th = c * run.thick;
      ctx.fillStyle = run.col;
      ctx.fillRect(-30, y, W + 60, th);

      // bands round the duct, and the odd valve
      const step = 130, from = Math.floor((camX * run.speed) / step) - 1;
      for (let i = from; i < from + Math.ceil(W / step) + 3; i++) {
        const x = i * step - camX * run.speed;
        ctx.fillStyle = 'rgba(0,0,0,0.32)';
        ctx.fillRect(x, y, 10, th);
        if (hash(i * 8.8 + run.at) > 0.72) {
          ctx.fillStyle = '#2f4468';
          ctx.fillRect(x + 24, y - 7, 22, th + 14);
        }
        if (hash(i * 5.1 + run.at) > 0.88) {
          ctx.fillStyle = '#e8b13f';
          ctx.fillRect(x + 60, y + th * 0.3, 9, 9);   // a warning light
        }
      }
    }

    // cable bundles slung between the runs
    const cstep = 96, cfrom = Math.floor((camX * 0.3) / cstep) - 1;
    for (let i = cfrom; i < cfrom + Math.ceil(W / cstep) + 3; i++) {
      if (hash(i * 12.7) < 0.55) continue;
      const x = i * cstep - camX * 0.3;
      const y0 = c * 0.28, y1 = c * 0.62;
      ctx.strokeStyle = '#0c1322';
      ctx.lineWidth = 5;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.moveTo(x + k * 7, y0);
        ctx.quadraticCurveTo(x + 26 + k * 7, (y0 + y1) / 2, x + k * 7, y1);
        ctx.stroke();
      }
    }

    // a vent grille here and there, right up in the dark
    const vstep = 260, vfrom = Math.floor((camX * 0.2) / vstep) - 1;
    for (let i = vfrom; i < vfrom + Math.ceil(W / vstep) + 3; i++) {
      if (hash(i * 15.3) < 0.5) continue;
      const x = i * vstep - camX * 0.2;
      ctx.fillStyle = '#111a2c';
      ctx.fillRect(x, c * 0.06, 84, 44);
      ctx.fillStyle = '#0a1120';
      for (let l = 0; l < 5; l++) ctx.fillRect(x + 6, c * 0.06 + 6 + l * 7, 72, 4);
    }

    // the ceiling plate itself, ribbed
    ctx.fillStyle = '#1b2740';
    ctx.fillRect(-30, c - 20, W + 60, 26);
    ctx.fillStyle = '#26355a';
    ctx.fillRect(-30, c - 4, W + 60, 6);
    const step3 = 78, from3 = Math.floor(camX / step3) - 1;
    for (let i = from3; i < from3 + Math.ceil(W / step3) + 3; i++) {
      const x = i * step3 - camX;
      ctx.fillStyle = '#121c30';
      ctx.fillRect(x, c - 20, 7, 24);

      // strip lights every few ribs, throwing a little glow down
      if (hash(i * 6.6) > 0.66) {
        ctx.fillStyle = '#cfe9ff';
        ctx.fillRect(x + 14, c - 8, 44, 6);
        const glow = ctx.createLinearGradient(0, c, 0, c + 90);
        glow.addColorStop(0, 'rgba(180,225,255,0.16)');
        glow.addColorStop(1, 'rgba(180,225,255,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(x + 4, c, 64, 90);
      }
      // and the odd hanging cable
      if (hash(i * 9.2) > 0.82) {
        ctx.strokeStyle = '#101a2c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 30, c + 4);
        ctx.quadraticCurveTo(x + 38, c + 26, x + 46, c + 8);
        ctx.stroke();
      }
    }
  }

  function drawHero() {
    const x = you.x - camX, y = you.y;
    const flash = you.hurt > 0 && Math.floor(you.hurt * 20) % 2 === 0;
    ctx.globalAlpha = flash ? 0.4 : 1;

    // A spacesuit: life support on the back, padded body, round helmet
    // with the ship reflected in the visor.
    ctx.fillStyle = '#8f99ab';
    ctx.fillRect(x - (you.face > 0 ? 22 : 8), y - 50, 14, 30);
    ctx.fillStyle = '#5fd0e8';
    ctx.fillRect(x - (you.face > 0 ? 20 : 6), y - 46, 10, 5);

    ctx.fillStyle = '#e6ecf5';                       // suit
    ctx.fillRect(x - 16, y - 52, 32, 38);
    ctx.fillStyle = '#e8913f';                       // hazard stripe
    ctx.fillRect(x - 16, y - 34, 32, 7);
    ctx.fillStyle = '#aab6c8';                       // shoulder seam
    ctx.fillRect(x - 16, y - 52, 32, 5);

    ctx.fillStyle = '#cfd8e6';                       // helmet
    ctx.beginPath();
    ctx.arc(x, y - 66, 17, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#12203a';                       // visor
    ctx.beginPath();
    ctx.ellipse(x + you.face * 3, y - 67, 12, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(140,220,255,0.7)';         // shine on the glass
    ctx.beginPath();
    ctx.ellipse(x + you.face * 6, y - 70, 4, 2.5, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#dfe6f0';                       // boots
    ctx.fillRect(x - 13, y - 16, 10, 16);
    ctx.fillRect(x + 3, y - 16, 10, 16);
    ctx.fillStyle = '#8f99ab';
    ctx.fillRect(x - 13, y - 4, 10, 4);
    ctx.fillRect(x + 3, y - 4, 10, 4);

    // What you are holding. A gun sits in your fist and flashes when it
    // goes off; the blade sweeps an arc.
    if (you.gun >= 0) {
      const g5 = GUNS[you.gun];
      ctx.save();
      ctx.translate(x, y - 44);
      ctx.scale(you.face, 1);
      ctx.fillStyle = '#6b7688';
      ctx.fillRect(2, -6, 30, 12);
      ctx.fillRect(6, 2, 9, 14);
      ctx.fillStyle = rgb(g5.col);
      ctx.fillRect(26, -4, 10, 8);
      if (you.swing > 0) {                     // muzzle flash
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(36, 0); ctx.lineTo(52, -11); ctx.lineTo(50, 0);
        ctx.lineTo(52, 11); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // The blade, swung as an arc so you can see the reach.
    if (you.gun < 0 && you.swing > 0) {
      const t = 1 - you.swing / SWING_TIME;
      const a = (-0.9 + t * 1.9) * you.face;
      ctx.save();
      ctx.translate(x, y - 44);
      ctx.rotate(a);
      // A blade of light, with a handle behind it.
      ctx.fillStyle = 'rgba(120,235,255,0.35)';
      ctx.fillRect(0, -9, you.face > 0 ? REACH : -REACH, 18);
      ctx.fillStyle = '#bff2ff';
      ctx.fillRect(0, -4, you.face > 0 ? REACH : -REACH, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -1.5, you.face > 0 ? REACH : -REACH, 3);
      ctx.fillStyle = '#6b7688';
      ctx.fillRect(you.face > 0 ? -11 : 0, -6, 11, 12);
      ctx.restore();

      ctx.strokeStyle = 'rgba(150,230,255,0.4)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(x, y - 44, REACH * 0.85,
              you.face > 0 ? -0.9 : Math.PI + 0.9,
              you.face > 0 ? 0.9 : Math.PI - 0.9, you.face < 0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawMob(m) {
    const k = KINDS[m.kind];
    const x = m.x - camX, y = m.y;
    const col = m.hurt > 0 ? [255, 255, 255] : k.col;

    if (m.kind === 0) {                              // SPARKBOT
      ctx.fillStyle = rgb(col);                      // a squat box on rollers
      ctx.fillRect(x - k.r, y - k.r * 1.05, k.r * 2, k.r * 0.8);
      ctx.fillStyle = rgb([col[0] * 0.55, col[1] * 0.55, col[2] * 0.6]);
      ctx.fillRect(x - k.r, y - k.r * 0.3, k.r * 2, k.r * 0.3);
      for (let w = 0; w < 3; w++) {
        ctx.beginPath();
        ctx.arc(x - k.r * 0.6 + w * k.r * 0.6, y - k.r * 0.14, k.r * 0.16, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = rgb(col); ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, y - k.r * 1.05); ctx.lineTo(x, y - k.r * 1.5); ctx.stroke();
      ctx.fillStyle = '#ff8a7a';
      ctx.beginPath(); ctx.arc(x, y - k.r * 1.55, 3.5, 0, Math.PI * 2); ctx.fill();

    } else if (m.kind === 1) {                       // DRONE
      const spin = m.t * 16;
      ctx.fillStyle = rgb(col);
      ctx.beginPath(); ctx.arc(x, y, k.r * 0.72, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = rgb([col[0] * 0.6, col[1] * 0.6, col[2] * 0.6]);
      ctx.lineWidth = 3;
      for (let a2 = 0; a2 < 2; a2++) {               // two rotors, blurring
        const px = x + (a2 ? 1 : -1) * k.r * 1.1;
        ctx.beginPath(); ctx.moveTo(x, y - 3); ctx.lineTo(px, y - 10); ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(px, y - 10, k.r * 0.7, 3 + Math.abs(Math.sin(spin)) * 3,
                    0, 0, Math.PI * 2);
        ctx.fill();
      }

    } else {                                         // CRUSHER
      ctx.fillStyle = rgb(col);
      ctx.fillRect(x - k.r, y - k.r * 1.5, k.r * 2, k.r * 1.1);
      ctx.fillStyle = rgb([col[0] * 0.6, col[1] * 0.6, col[2] * 0.62]);
      ctx.fillRect(x - k.r * 0.8, y - k.r * 0.45, k.r * 0.5, k.r * 0.45);
      ctx.fillRect(x + k.r * 0.3, y - k.r * 0.45, k.r * 0.5, k.r * 0.45);
      ctx.fillStyle = rgb(col);                      // arms
      ctx.fillRect(x - k.r * 1.35, y - k.r * 1.3, k.r * 0.4, k.r * 0.9);
      ctx.fillRect(x + k.r * 0.95, y - k.r * 1.3, k.r * 0.4, k.r * 0.9);
      ctx.fillStyle = '#2a1620';
      ctx.fillRect(x - k.r * 0.75, y - k.r * 1.42, k.r * 1.5, k.r * 0.32);
    }

    // Glowing optics - the one thing every robot in here has.
    for (let e = -1; e <= 1; e += 2) {
      const ey = y - k.r * (m.kind === 2 ? 1.26 : m.kind === 1 ? 0.1 : 0.72);
      ctx.fillStyle = 'rgba(255,120,110,0.35)';
      ctx.beginPath(); ctx.arc(x + e * k.r * 0.32, ey, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff6a5a';
      ctx.beginPath(); ctx.arc(x + e * k.r * 0.32, ey, 3.4, 0, Math.PI * 2); ctx.fill();
    }

    if (m.hp < m.max) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(x - k.r, y - k.r * 1.9 - 12, k.r * 2, 5);
      ctx.fillStyle = '#8fe07a';
      ctx.fillRect(x - k.r, y - k.r * 1.9 - 12, k.r * 2 * (m.hp / m.max), 5);
    }
  }

  function ring(b, label, on, col) {
    ctx.fillStyle = on ? 'rgba(255,255,255,0.20)' : 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = on ? col : 'rgba(255,255,255,0.22)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + b.r * 0.62 + 'px system-ui, sans-serif';
    ctx.fillStyle = on ? col : 'rgba(231,240,228,0.75)';
    ctx.fillText(label, b.x, b.y + b.r * 0.22);
  }

  function drawPanel() {
    const p = panelBox();

    ctx.fillStyle = 'rgba(4,8,16,0.86)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#16223a';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.lineWidth = 3;
    ctx.strokeStyle = puzzle.buzz > 0 ? '#ff6a5a' : '#7ee0ff';
    ctx.strokeRect(p.x, p.y, p.w, p.h);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.04, 21) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#dfe8f5';
    ctx.fillText('JOIN THE COLOURS', p.x + p.w / 2, p.y + 34);

    // The wires you have already run.
    for (let row = 0; row < 3; row++) {
      const to = puzzle.joined[row];
      if (to < 0) continue;
      const a = socketAt(0, row), b = socketAt(1, to);
      ctx.strokeStyle = rgb(WIRE_COLS[puzzle.left[row]].col);
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.bezierCurveTo(a.x + p.w * 0.3, a.y, b.x - p.w * 0.3, b.y, b.x, b.y);
      ctx.stroke();
    }

    // A dangling lead from whichever one you are holding.
    if (puzzle.pick >= 0) {
      const a = socketAt(0, puzzle.pick);
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 7]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(p.x + p.w * 0.82, a.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    for (let side = 0; side < 2; side++) {
      for (let row = 0; row < 3; row++) {
        const sk = socketAt(side, row);
        const colIdx = side === 0 ? puzzle.left[row] : puzzle.right[row];
        const wired = side === 0 ? puzzle.joined[row] >= 0
                                 : puzzle.joined.indexOf(row) >= 0;
        ctx.fillStyle = '#0b1322';
        ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.r * 1.35, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = rgb(WIRE_COLS[colIdx].col);
        ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.r, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = (side === 0 && puzzle.pick === row) ? '#ffffff'
                        : wired ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.r, 0, Math.PI * 2); ctx.stroke();
        if (!wired) {
          ctx.fillStyle = '#0b1322';
          ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.r * 0.38, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    ctx.textAlign = 'center';
    ctx.font = Math.min(W * 0.03, 15) + 'px system-ui, sans-serif';
    ctx.fillStyle = puzzle.buzz > 0 ? '#ff8a7a' : '#8fa3c0';
    ctx.fillText(puzzle.buzz > 0 ? 'wrong colour!' :
                 puzzle.pick >= 0 ? 'now tap the same colour on the right'
                                  : 'tap a socket on the left',
                 p.x + p.w / 2, p.y + p.h - 72);

    const db = panelDoneBox();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(db.x, db.y, db.w, db.h);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.strokeRect(db.x, db.y, db.w, db.h);
    ctx.font = 'bold ' + Math.min(W * 0.032, 16) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#8fa3c0';
    ctx.fillText('BACK', db.x + db.w / 2, db.y + db.h * 0.66);
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16,
                                 (Math.random() - 0.5) * shake * 16);

    const sky = ctx.createLinearGradient(0, 0, 0, groundY());
    sky.addColorStop(0, '#0a1120');
    sky.addColorStop(1, '#121c2e');
    ctx.fillStyle = sky;
    ctx.fillRect(-30, -30, W + 60, groundY() + 30);

    drawShip();
    drawCeiling();

    drawClutter();

    ctx.fillStyle = '#1a2437';
    ctx.fillRect(-30, groundY(), W + 60, H - groundY() + 30);
    ctx.fillStyle = '#334765';
    ctx.fillRect(-30, groundY(), W + 60, 8);
    // Deck plates, with the seams marching past as you walk.
    const plate = 74, fromP = Math.floor(camX / plate) - 1;
    for (let i = fromP; i < fromP + Math.ceil(W / plate) + 3; i++) {
      const px = i * plate - camX;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, groundY() + 8); ctx.lineTo(px, H); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.fillRect(px + 8, groundY() + 18, 8, 8);
      ctx.fillRect(px + plate - 20, groundY() + 18, 8, 8);
    }

    for (const p of platformsNear(camX - 200, camX + W + 200)) {
      ctx.fillStyle = '#2a3a56';                     // catwalk
      ctx.fillRect(p.x - camX, p.y, p.w, p.h);
      ctx.fillStyle = '#43597f';
      ctx.fillRect(p.x - camX, p.y, p.w, 5);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';            // grating
      for (let g = 6; g < p.w - 4; g += 12) {
        ctx.fillRect(p.x - camX + g, p.y + 6, 5, p.h - 8);
      }
    }

    // ---- bulkhead doors ---------------------------------------------
    for (const d of doorsNear(camX - 200, camX + W + 200)) {
      const x = d.x - camX;
      if (x < -140 || x > W + 140) continue;
      const top = ceilingY(), hgt = CEIL_H;         // floor to ceiling

      ctx.fillStyle = '#101a2c';                     // the frame
      ctx.fillRect(x - 34, top - 14, 68, hgt + 14);
      ctx.fillStyle = '#2a3a56';
      ctx.fillRect(x - 34, top - 14, 68, 12);

      if (opened[d.i]) {
        // Open: the two halves have slid into the frame.
        ctx.fillStyle = '#1c2b44';
        ctx.fillRect(x - 32, top, 8, hgt);
        ctx.fillRect(x + 24, top, 8, hgt);
        ctx.fillStyle = '#7ee0a0';
        ctx.fillRect(x - 4, top - 10, 8, 6);         // green light
      } else {
        ctx.fillStyle = '#3a4c6d';                   // shut
        ctx.fillRect(x - 30, top, 60, hgt);
        ctx.fillStyle = '#2b3a56';
        for (let b2 = 0; b2 * 36 + 10 < hgt; b2++) ctx.fillRect(x - 30, top + 10 + b2 * 36, 60, 6);
        ctx.fillStyle = '#101a2c';                   // the seam down the middle
        ctx.fillRect(x - 2, top, 4, hgt);
        ctx.fillStyle = '#ff8a7a';
        ctx.fillRect(x - 4, top - 10, 8, 6);         // red light

        // The wiring box beside it.
        ctx.fillStyle = '#22304a';
        ctx.fillRect(x + 34, top + 60, 26, 34);
        for (let c2 = 0; c2 < 3; c2++) {
          ctx.fillStyle = rgb(WIRE_COLS[c2].col);
          ctx.fillRect(x + 38, top + 66 + c2 * 9, 18, 5);
        }
      }
    }

    for (const d of drops) {
      const x = d.x - camX, y = d.y - 10 + Math.sin(d.t * 3) * 5;
      if (d.kind === 'gun') {                      // a gun on the deck
        const g6 = GUNS[d.gun];
        ctx.fillStyle = 'rgba(' + (g6.col[0]|0) + ',' + (g6.col[1]|0) + ',' +
                        (g6.col[2]|0) + ',0.22)';
        ctx.beginPath(); ctx.arc(x, y + 2, 20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6b7688';
        ctx.fillRect(x - 13, y - 4, 24, 9);
        ctx.fillRect(x - 9, y + 4, 7, 10);
        ctx.fillStyle = rgb(g6.col);
        ctx.fillRect(x + 7, y - 3, 9, 7);
      } else if (d.kind === 'heart') {             // a repair cell
        ctx.fillStyle = '#7ee0a0';
        ctx.fillRect(x - 8, y - 9, 16, 20);
        ctx.fillStyle = '#0d1a14';
        ctx.fillRect(x - 3, y - 5, 6, 12);
        ctx.fillRect(x - 6, y - 1, 12, 4);
        ctx.fillStyle = '#cfeee0';
        ctx.fillRect(x - 5, y - 12, 10, 4);
      } else {                                       // a bolt of scrap
        ctx.fillStyle = '#ffd76a';
        ctx.beginPath();
        for (let a3 = 0; a3 < 6; a3++) {
          const ang = a3 * Math.PI / 3;
          const px = x + Math.cos(ang) * 9, py = y + Math.sin(ang) * 9;
          if (a3 === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#8a6a20';
        ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const m of mobs) {
      if (m.x - camX < -120 || m.x - camX > W + 120) continue;
      drawMob(m);
    }
    drawHero();

    for (const b of shotsOut) {
      const x = b.x - camX;
      ctx.strokeStyle = 'rgba(' + (b.col[0]|0) + ',' + (b.col[1]|0) + ',' +
                        (b.col[2]|0) + ',0.45)';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(x - b.vx * 0.012, b.y - b.vy * 0.012);
      ctx.lineTo(x, b.y);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - b.vx * 0.008, b.y - b.vy * 0.008);
      ctx.lineTo(x, b.y);
      ctx.stroke();
    }

    for (const b of bits) {
      ctx.fillStyle = 'rgba(' + (b.col[0]|0) + ',' + (b.col[1]|0) + ',' + (b.col[2]|0) +
                      ',' + clamp(b.life * 2, 0, 1) + ')';
      ctx.fillRect(b.x - camX, b.y, 4, 4);
    }
    for (const f of floats) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(' + f.col[0] + ',' + f.col[1] + ',' + f.col[2] + ',' +
                      clamp(f.life, 0, 1) + ')';
      ctx.fillText(f.text, f.x - camX, f.y);
    }

    ctx.restore();

    // ---- the bar along the top --------------------------------------------
    const bw = Math.min(W * 0.42, 240);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(14, 14, bw, 18);
    ctx.fillStyle = you.hp < you.max * 0.3 ? '#ff6a6a' : '#7ee08f';
    ctx.fillRect(14, 14, bw * clamp(you.hp / you.max, 0, 1), 18);

    // The bar flashes on every beat, so the heartbeat is something you
    // can SEE as well as hear - which matters if the sound is off.
    if (beatPhase > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(beatPhase, 0, 1) * 0.4 + ')';
      ctx.fillRect(14, 14, bw * clamp(you.hp / you.max, 0, 1), 18);
    }
    ctx.textAlign = 'left';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillStyle = '#080c14';
    ctx.fillText(Math.ceil(you.hp) + ' / ' + you.max, 20, 27);

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(14, 36, bw, 8);
    ctx.fillStyle = '#8ab4ff';
    ctx.fillRect(14, 36, bw * clamp(you.xp / xpNeeded(you.lv), 0, 1), 8);

    ctx.font = 'bold ' + Math.min(W * 0.04, 20) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#dfe8f5';
    ctx.fillText('LV ' + you.lv, 18 + bw, 30);

    // What is in your hand, and how much of it is left.
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.03, 15) + 'px system-ui, sans-serif';
    if (you.gun >= 0) {
      const g7 = GUNS[you.gun];
      ctx.fillStyle = rgb(g7.col);
      ctx.fillText(g7.name + '  ' + you.ammo, 16, 62);
      const bw2 = Math.min(W * 0.30, 150);
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(16, 68, bw2, 5);
      ctx.fillStyle = rgb(g7.col);
      ctx.fillRect(16, 68, bw2 * clamp(you.ammo / g7.ammo, 0, 1), 5);
    } else {
      ctx.fillStyle = '#7d8ca3';
      ctx.fillText('PLASMA BLADE', 16, 62);
    }

    // A little heart beside the bar, squeezing in time.
    // On the XP-bar line, not the HP line - up there it was printed
    // straight over the LV number and the two read as one word.
    const sq = 1 + clamp(beatPhase, 0, 1) * 0.35;
    const hx = 14 + bw + 18, hy = 48;
    ctx.fillStyle = you.hp < you.max * 0.3 ? '#ff6a6a' : '#ff8a9a';
    ctx.beginPath();
    ctx.arc(hx - 4 * sq, hy - 2 * sq, 4.5 * sq, 0, Math.PI * 2);
    ctx.arc(hx + 4 * sq, hy - 2 * sq, 4.5 * sq, 0, Math.PI * 2);
    ctx.moveTo(hx - 8.5 * sq, hy);
    ctx.lineTo(hx, hy + 9 * sq);
    ctx.lineTo(hx + 8.5 * sq, hy);
    ctx.closePath();
    ctx.fill();
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = '#7d8ca3';
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(heartRate()) + ' bpm', hx + 14, 52);

    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.045, 24) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText(you.coins, W - 16, 30);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#8fa08a';
    ctx.fillText(depthOf(you.x) + 'm in', W - 16, 46);

    // ---- sound on or off ----------------------------------------------
    const sb = soundBox();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = soundOn ? 'rgba(223,232,245,0.45)' : 'rgba(255,138,122,0.6)';
    ctx.beginPath(); ctx.arc(sb.x, sb.y, sb.r, 0, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = soundOn ? '#dfe8f5' : '#7d8ca3';
    ctx.fillRect(sb.x - 9, sb.y - 4, 5, 8);            // the speaker
    ctx.beginPath();
    ctx.moveTo(sb.x - 4, sb.y - 4); ctx.lineTo(sb.x + 2, sb.y - 10);
    ctx.lineTo(sb.x + 2, sb.y + 10); ctx.lineTo(sb.x - 4, sb.y + 4);
    ctx.closePath(); ctx.fill();
    if (soundOn) {
      ctx.strokeStyle = '#dfe8f5';
      ctx.lineWidth = 2;
      for (let w = 1; w <= 2; w++) {
        ctx.beginPath();
        ctx.arc(sb.x + 3, sb.y, 3 + w * 4, -0.7, 0.7);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = '#ff8a7a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sb.x + 5, sb.y - 7); ctx.lineTo(sb.x + 14, sb.y + 7);
      ctx.stroke();
    }

    // ---- the buttons -------------------------------------------------------
    ring(btnLeft(), '<', wantLeft(), '#dfe8f5');
    ring(btnRight(), '>', wantRight(), '#dfe8f5');
    ring(btnJump(), 'JUMP', wantJump(), '#8ab4ff');
    ring(btnHit(), 'HIT', wantHit(), '#ffd76a');

    // ---- standing at a door -------------------------------------------
    const at = doorAtHand();
    if (at && !puzzle && !dead) {
      ring(btnUse(), 'E', useDown(), '#7ee0ff');
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.034, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#7ee0ff';
      ctx.fillText('SEALED - press E to open', W / 2, btnUse().y - btnUse().r - 14);
    }

    if (puzzle) drawPanel();

    if (saysT > 0 && !puzzle) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.038, 20) + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      const y = H * 0.2;
      ctx.fillStyle = 'rgba(14,20,16,' + clamp(saysT, 0, 1) * 0.85 + ')';
      ctx.fillRect(W / 2 - wid / 2 - 14, y - 22, wid + 28, 30);
      ctx.fillStyle = 'rgba(231,240,228,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, y);
    }

    if (dead) {
      ctx.fillStyle = 'rgba(14,20,16,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.1, 56) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#ff8a7a';
      ctx.fillText('SUIT BREACHED', W / 2, H * 0.42);
      ctx.font = 'bold ' + Math.min(W * 0.045, 24) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#dfe8f5';
      ctx.fillText('level ' + you.lv + '  -  ' + depthOf(you.x) + 'm in', W / 2, H * 0.5);
      ctx.font = Math.min(W * 0.035, 18) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#8fa08a';
      ctx.fillText('best so far: ' + you.best + 'm', W / 2, H * 0.56);
      ctx.fillText('tap anywhere to go back in', W / 2, H * 0.63);
    }
  }


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

</script>
</body>
</html>
