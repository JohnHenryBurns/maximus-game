<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Reincarnated</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* The same "back to the arcade" pill every game has, in the same corner. */
    a.arcade-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #ffffff; text-decoration: none;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 7px 13px; border-radius: 999px;
      position: fixed; z-index: 10;
      top: calc(8px + env(safe-area-inset-top, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      -webkit-tap-highlight-color: transparent;
    }
    /* SKIP BUTTONS: back, play/pause, forward. Top middle. */
    #controls {
      position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
      top: calc(8px + env(safe-area-inset-top, 0px));
      display: flex; gap: 8px; opacity: 0.85;
    }
    #controls button {
      font: 700 18px system-ui, sans-serif; color: #fff;
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px; width: 48px; height: 40px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #controls button:hover { background: rgba(93, 255, 143, 0.35); }

    /* THE VOICE STUDIO: a button in the top-right corner, and a big panel. */
    #studioButton {
      position: fixed; z-index: 10;
      top: calc(8px + env(safe-area-inset-top, 0px));
      right: calc(10px + env(safe-area-inset-right, 0px));
      font: 700 16px system-ui, sans-serif; color: #000;
      background: #5dff8f; border: none; border-radius: 999px; padding: 10px 16px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #studio {
      position: fixed; inset: 0; z-index: 20; overflow-y: auto;
      background: rgba(5, 4, 12, 0.96); color: #fff;
      font: 18px system-ui, sans-serif; padding: 20px 16px 40px;
    }
    #studio[hidden] { display: none; }
    #studio .inside { max-width: 760px; margin: 0 auto; }
    #studio h1 { color: #5dff8f; margin: 10px 0; }
    #studio .note { color: #aaa; font-size: 15px; }
    #studio .line { background: #1a1628; border-radius: 14px; padding: 14px; margin: 12px 0; }
    #studio .line.recording { outline: 3px solid #ff4d4d; }
    #studio .who { color: #5dff8f; font-weight: 700; font-size: 14px; }
    #studio .say { font-size: 22px; margin: 6px 0 10px; }
    #studio button {
      font: 700 17px system-ui, sans-serif; border: none; border-radius: 10px;
      padding: 10px 14px; margin: 4px 6px 4px 0; cursor: pointer;
    }
    #studio .rec { background: #ff4d4d; color: #fff; }
    #studio .play { background: #3fe0ff; color: #000; }
    #studio .del { background: #444; color: #fff; }
    #studio .status { font-size: 15px; color: #aaa; margin-left: 4px; }
    #studio .done { background: #5dff8f; color: #000; font-size: 20px; padding: 14px 22px; }
  </style>
</head>
<body>
<a id="back" class="arcade-pill" href="index.html"><span>&larr;</span>Arcade</a>
<canvas id="show"></canvas>
<div id="controls">
  <button id="skipBack" title="Skip back (← key)">⏮</button>
  <button id="playPause" title="Play / pause (space)">⏯</button>
  <button id="skipForward" title="Skip forward (→ key)">⏭</button>
</div>
<button id="studioButton">🎙️ Voice Studio</button>
<div id="studio" hidden>
  <div class="inside">
    <h1>🎙️ Voice Studio</h1>
    <p>You're the voice actor! Tap <b>● Record</b>, say the line, then tap <b>■ Stop</b>.
       Lines you don't record use the computer's voice.</p>
    <p class="note">🔒 Your recordings stay on THIS computer only. They don't go on the website.</p>
    <div id="lineList"></div>
    <button class="done" id="studioDone">✓ Done! Watch the show</button>
  </div>
</div>
<script>
/* The show grabs every tap, which would swallow a tap on the Arcade pill.
   So the pill handles its own taps first and stops them going any further. */
(function () {
  var pill = document.getElementById('back');
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<script>
// =====================================================================
//  REINCARNATED  -  a cartoon by Max, starring TEST SUBJECT 1
//
//  A cartoon is just pictures that change a tiny bit, really fast.
//  Every frame we ask: "how many seconds into the show are we?"
//  and then draw what the scene should look like at that moment.
// =====================================================================

const canvas = document.getElementById('show');
const ctx = canvas.getContext('2d');

// We draw everything on a pretend "stage" that is always 1600 wide and
// 900 tall (the same shape as a TV). Then we stretch the stage to fit
// whatever screen you're watching on: a laptop, a phone, anything.
const STAGE_W = 1600;
const STAGE_H = 900;
let W, H, dpr, stageScale, stageX, stageY;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  stageScale = Math.min(W / STAGE_W, H / STAGE_H);
  stageX = (W - STAGE_W * stageScale) / 2;   // black bars on the sides...
  stageY = (H - STAGE_H * stageScale) / 2;   // ...or on the top and bottom
}
window.addEventListener('resize', resize);
resize();

// Little maths helpers.
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, u) { return a + (b - a) * u; }                 // "go u of the way from a to b"
function ease(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); } // starts slow, ends slow: smooth!

// ---------------------------------------------------------------------
//  SOUNDS. Made by the computer, no sound files.
// ---------------------------------------------------------------------
let audio = null;
function startAudio() {
  if (!audio) {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    // The lab machine HUMS the whole time, low and creepy.
    const hum = audio.createOscillator();
    const filter = audio.createBiquadFilter();
    const vol = audio.createGain();
    hum.type = 'sawtooth';
    hum.frequency.value = 55;
    filter.type = 'lowpass';
    filter.frequency.value = 180;
    vol.gain.value = 0.05;
    hum.connect(filter).connect(vol).connect(audio.destination);
    hum.start();
  }
  audio.resume();
}

// One beep that slides from one pitch to another.
function beep(fromPitch, toPitch, seconds, wave, volume, wait) {
  if (!audio) return;
  const start = audio.currentTime + (wait || 0);
  const osc = audio.createOscillator();
  const vol = audio.createGain();
  osc.type = wave;
  osc.frequency.setValueAtTime(fromPitch, start);
  osc.frequency.exponentialRampToValueAtTime(toPitch, start + seconds);
  vol.gain.setValueAtTime(volume, start);
  vol.gain.exponentialRampToValueAtTime(0.0001, start + seconds);
  osc.connect(vol).connect(audio.destination);
  osc.start(start);
  osc.stop(start + seconds + 0.05);
}

// THUNDER is just random noise (like TV static) with the high bits taken out.
function thunderSound() {
  if (!audio) return;
  const seconds = 2.5;
  const noise = audio.createBuffer(1, audio.sampleRate * seconds, audio.sampleRate);
  const data = noise.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const source = audio.createBufferSource();
  source.buffer = noise;
  const filter = audio.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 350;
  const vol = audio.createGain();
  vol.gain.setValueAtTime(0.9, audio.currentTime);
  vol.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + seconds);
  source.connect(filter).connect(vol).connect(audio.destination);
  source.start();
}

function clickSound()    { beep(2400, 1800, 0.05, 'square', 0.08); }                   // glasses: click!
function bubbleSound()   { beep(400 + Math.random() * 500, 900 + Math.random() * 600, 0.07, 'sine', 0.04); }
function screenOnSound() { beep(200, 1600, 0.4, 'square', 0.04); beep(60, 60, 0.6, 'sawtooth', 0.05); }
function talkBlip(who) {
  if (englishVoices().length) return;   // a real voice is talking, so no blips
  // No real voices on this computer? Then every character beeps at their own pitch.
  if (who === 'THE SCIENTIST') beep(110 + Math.random() * 40, 90, 0.07, 'square', 0.05);
  if (who === 'TEST SUBJECT 1') beep(200 + Math.random() * 40, 170, 0.07, 'square', 0.05);
  if (who === 'ROBOT GUARD') beep(300, 300, 0.07, 'square', 0.05);
}
// BONK! A deep thud (head meets wall) plus a little cartoon "bonk" on top.
function bonkSound() {
  beep(170, 55, 0.22, 'sine', 0.4);
  beep(700, 350, 0.08, 'square', 0.05);
}
// WOOF! A bark is a short, rough sound that drops in pitch, really fast.
// (wait = how many seconds from now to bark)
function barkSound(wait) {
  beep(520, 260, 0.13, 'sawtooth', 0.14, wait);
  beep(330, 160, 0.16, 'square', 0.07, wait);
}
// GRUMBLE... a very hungry tummy.
function growlSound() {
  beep(85, 55, 0.9, 'sawtooth', 0.07);
  beep(60, 95, 0.7, 'sawtooth', 0.06, 0.6);
}
// Dun... dun... DUNNNN!
function stingSound() {
  beep(98, 98, 0.35, 'sawtooth', 0.12, 0);
  beep(92, 92, 0.35, 'sawtooth', 0.12, 0.45);
  beep(73, 62, 1.8, 'sawtooth', 0.14, 0.9);
}
// SMASH! A super deep BOOM with a crunchy crash on top.
function smashSound() {
  beep(140, 28, 0.8, 'sine', 0.7);
  beep(260, 50, 0.35, 'sawtooth', 0.2);
  beep(900, 120, 0.15, 'square', 0.08);
}
// SHING! Metal blades sliding out. (Three high, ringy notes.)
function shingSound() {
  beep(3200, 2600, 0.5, 'triangle', 0.06);
  beep(4100, 3500, 0.4, 'triangle', 0.04, 0.12);
  beep(2700, 2300, 0.6, 'triangle', 0.05, 0.25);
}
// POWER UP! A sound that climbs higher and higher...
function powerUpSound() {
  beep(70, 700, 2.2, 'sawtooth', 0.08);
  beep(140, 1400, 2.2, 'square', 0.03);
}
// BOING! A muscle popping bigger.
function boingSound() { beep(180, 520, 0.18, 'sine', 0.3); }
// KA-BOOM! A fist through a brick wall: a SMASH plus crumbling rubble.
function wallBreakSound() { smashSound(); thunderSound(); }
// WEE-OOO WEE-OOO! The prison alarm.
function alarmSound() {
  for (let k = 0; k < 4; k++) {
    beep(700, 1000, 0.35, 'square', 0.025, k * 0.7);
    beep(1000, 700, 0.35, 'square', 0.025, k * 0.7 + 0.35);
  }
}
// A punch on a robot: a deep THUNK, a metal CLANG, and the robot powering
// down (bzzzoooww...).
function robotHitSound() {
  beep(160, 40, 0.3, 'sine', 0.6);
  beep(1300, 700, 0.3, 'square', 0.06);
  beep(700, 50, 0.7, 'sawtooth', 0.05, 0.1);
}
// TA-DA-DA-DAAAA! A victory tune: four notes, each one higher.
function victorySound() {
  [523, 659, 784, 1046].forEach(function (pitch, k) {
    beep(pitch, pitch, k === 3 ? 0.8 : 0.15, 'square', 0.06, k * 0.15);
  });
}
// CLANG! A heavy robot part slamming into place.
function clangSound() {
  beep(220, 70, 0.35, 'sine', 0.45);
  beep(950, 620, 0.45, 'square', 0.05);
  beep(1400, 1100, 0.3, 'triangle', 0.04, 0.05);
}
// BOOM. A giant robot footstep.
function stompSound() { beep(75, 30, 0.35, 'sine', 0.55); }
// WHOOSH! A sword swinging through the air.
function swooshSound() { beep(1400, 180, 0.25, 'sawtooth', 0.035); }
// BZZZZZZZ! Laser eyes. (Two buzzy notes that go on and on.)
function laserSound() {
  beep(1500, 1400, 7, 'sawtooth', 0.025);
  beep(760, 720, 7, 'square', 0.02);
}
// boop.
function boopSound() { beep(800, 1300, 0.12, 'sine', 0.25); }
// Wheeeeeooooo... something falling from the sky. The pitch goes DOWN as it falls.
function fallingSound() { beep(2200, 500, 1.1, 'sine', 0.12); }
// THUD. Landing on your feet.
function thudSound() { beep(160, 45, 0.25, 'sine', 0.5); }

// ---------------------------------------------------------------------
//  HEAVY METAL! A whole band, made out of math. No music files!
//
//  The GUITAR is three buzzy "sawtooth" notes played together (a "power
//  chord"), pushed through DISTORTION. Distortion squashes the sound wave
//  so hard it gets crunchy and fuzzy. That crunch IS the metal sound.
//  The DRUMS are a falling "boom" (kick) and bursts of static (snare,
//  hi-hat and the big CRASH cymbal).
// ---------------------------------------------------------------------
const METAL_BEAT = 0.2;   // seconds per note. Smaller = FASTER and more metal!
// The riff: which note each chug is. 0 = the lowest E. Bigger numbers = higher.
const METAL_RIFF = [0, 0, 0, 0, 3, 0, 0, 5,  0, 0, 0, 0, 6, 5, 3, 0];
let metalBus = null;      // the volume knob for the whole band (so we can stop it)
let noiseSound = null;    // one second of static, for the drums

function stopMetal() {
  if (metalBus) metalBus.disconnect();   // unplug the band!
  metalBus = null;
}

// The intro's music: 11 seconds, loud, with a HUGE crash on the SMASH.
function metalMusic() { playMetal(INTRO.end, 0.45, INTRO.smash - 0.01); }

// Play the metal band for "length" seconds. bigCrashAt: when to hit a
// HUGE cymbal crash (or null for none).
function playMetal(length, volume, bigCrashAt) {
  if (!audio) return;
  stopMetal();
  const bus = audio.createGain();
  bus.gain.value = volume;
  bus.connect(audio.destination);
  metalBus = bus;

  // The distortion pedal: a "curve" that squashes the wave flat at the top and bottom.
  const pedal = audio.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh((i / 512 - 1) * 30);
  pedal.curve = curve;
  const tone = audio.createBiquadFilter();   // take off the fizzy top so it's not too screechy
  tone.type = 'lowpass';
  tone.frequency.value = 2800;
  const guitarVolume = audio.createGain();
  guitarVolume.gain.value = 0.16;
  pedal.connect(tone).connect(guitarVolume).connect(bus);

  if (!noiseSound) {
    noiseSound = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseSound.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }

  const start = audio.currentTime + 0.02;
  const end = length - 0.6;     // stop chugging just before the end

  // Play one power chord: the note, the note a "fifth" up, and the note an octave up.
  function chord(time, note, seconds) {
    const freq = 82.41 * Math.pow(2, note / 12);   // 82.41 = the low E on a guitar
    [1, 1.5, 2].forEach(function (times) {
      const osc = audio.createOscillator();
      const vol = audio.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = freq * times;
      osc.detune.value = Math.random() * 10 - 5;   // a tiny bit out of tune = sounds real
      vol.gain.setValueAtTime(1, time);
      vol.gain.exponentialRampToValueAtTime(0.001, time + seconds);
      osc.connect(vol).connect(pedal);
      osc.start(time);
      osc.stop(time + seconds + 0.05);
    });
  }
  function kick(time) {
    const osc = audio.createOscillator();
    const vol = audio.createGain();
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(45, time + 0.15);
    vol.gain.setValueAtTime(0.9, time);
    vol.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(vol).connect(bus);
    osc.start(time);
    osc.stop(time + 0.25);
  }
  // Static through a filter: high = hi-hat, middle = snare, long = CRASH.
  function hiss(time, lowestPitch, volume, seconds) {
    const source = audio.createBufferSource();
    source.buffer = noiseSound;
    const filter = audio.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = lowestPitch;
    const vol = audio.createGain();
    vol.gain.setValueAtTime(volume, time);
    vol.gain.exponentialRampToValueAtTime(0.001, time + seconds);
    source.connect(filter).connect(vol).connect(bus);
    source.start(time);
    source.stop(time + seconds + 0.05);
  }

  hiss(start, 4000, 0.3, 1.5);                 // CRASH to start!
  if (bigCrashAt !== null) hiss(start + bigCrashAt, 3000, 0.5, 2.5);   // a HUGE crash
  for (let i = 0; i * METAL_BEAT < end; i++) {
    const time = start + i * METAL_BEAT;
    chord(time, METAL_RIFF[i % METAL_RIFF.length], METAL_BEAT * 0.85);   // chug!
    if (i % 2 === 0) kick(time);
    if (i % 4 === 2) hiss(time, 1500, 0.35, 0.15);   // snare
    hiss(time, 7000, 0.08, 0.04);                    // tss
  }
  // The last chord rings out LOUD and long... then fades away.
  chord(start + end, 0, 1.4);
  kick(start + end);
  hiss(start + end, 3000, 0.4, 1.5);
}

// ---------------------------------------------------------------------
//  REAL TALKING VOICES.
//
//  Browsers come with talking voices built in ("speech synthesis"): you
//  give it words and it reads them out loud. Every computer has different
//  voices, so each character has a list of favourites, best first, and
//  uses the first one this computer has.
//    - "Natural" voices (in Edge) sound like real people.
//    - "Google" voices are in Chrome. "Daniel" is on iPhones and iPads.
//    - "David" and "Mark" are old Windows voices that sound a bit robot-y.
//
//  pitch: how high or low (1 is normal). Go too low and it sounds like a robot!
//  rate:  how fast it talks (1 is normal, 0.8 is slow and dramatic).
// ---------------------------------------------------------------------
const VOICES = {
  'THE SCIENTIST': {
    favourites: ['Ryan Online (Natural)', 'Thomas Online (Natural)', 'Google UK English Male',
                 'Daniel', 'Christopher Online (Natural)', 'Natural', 'George', 'David'],
    pitch: 0.85,
    rate: 0.85,
  },
  'TEST SUBJECT 1': {
    favourites: ['Andrew Online (Natural)', 'Brian Online (Natural)', 'Eric Online (Natural)',
                 'Google US English', 'Natural', 'Mark', 'David'],
    pitch: 1.05,
    rate: 0.7,
  },
  // Robot guards: the LOWEST pitch a voice can go. It sounds like a robot!
  'ROBOT GUARD': {
    favourites: ['Guy Online (Natural)', 'Eric Online (Natural)', 'Google US English', 'Natural', 'David'],
    pitch: 0.1,
    rate: 0.9,
  },
  // The scientist's giant robot: super low AND super slow. Creepy!
  'BIG ROBOT': {
    favourites: ['Guy Online (Natural)', 'Eric Online (Natural)', 'Google US English', 'Natural', 'David'],
    pitch: 0.1,
    rate: 0.6,
  },
  // The narrator (lines with no name) gets a deep "movie trailer" voice.
  '': {
    favourites: ['Guy Online (Natural)', 'Christopher Online (Natural)', 'Eric Online (Natural)',
                 'Natural', 'Google US English', 'Mark', 'David'],
    pitch: 0.9,
    rate: 0.85,
  },
};

function englishVoices() {
  if (!window.speechSynthesis) return [];
  return window.speechSynthesis.getVoices().filter(function (v) { return v.lang.indexOf('en') === 0; });
}
function pickVoice(favourites) {
  const english = englishVoices();
  for (const name of favourites) {
    const found = english.find(function (v) { return v.name.indexOf(name) !== -1; });
    if (found) return found;
  }
  return english[0] || null;   // no favourites? any English voice will do.
}
// The list of voices loads a moment after the page does, so ask for it now.
if (window.speechSynthesis) window.speechSynthesis.getVoices();

let voiceTalking = false;   // is the scientist's voice making sound RIGHT NOW?

function sayOutLoud(line) {
  // Did you record this line? Then play YOUR voice!
  const mine = recordings[voiceKey(line)];
  if (mine && audio) { playMyVoice(line, mine); return; }
  // Ruff is a dog. Dogs don't say the word "woof", they BARK!
  // One bark for every word, 0.4 seconds apart.
  if (line.who === 'RUFF') {
    barkWords(line).forEach(function (word, i) { barkSound(i * BARK_GAP); });
    return;
  }
  if (!window.speechSynthesis) return;     // some browsers can't talk. that's OK.
  const who = VOICES[line.who] || VOICES[''];
  // Lowercase, because some voices spell out CAPITALS letter by letter: "R-E-A-D-Y".
  const words = new SpeechSynthesisUtterance(line.say.toLowerCase());
  const voice = pickVoice(who.favourites);
  if (voice) { words.voice = voice; words.lang = voice.lang; }
  words.pitch = who.pitch;
  words.rate = who.rate;
  // The mouth moves only while the voice is really talking.
  words.onstart = function () { voiceTalking = line.who !== ''; };   // the narrator has no mouth!
  words.onend = function () { voiceTalking = false; };
  words.onerror = function () { voiceTalking = false; };
  window.speechSynthesis.resume();         // in case it got stuck on "pause"
  window.speechSynthesis.speak(words);
}
const BARK_GAP = 0.4;     // seconds between Ruff's barks
function barkWords(line) { return line.say.split(' ').filter(function (w) { return w; }); }

function stopTalking() {
  voiceTalking = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (myVoice) { try { myVoice.source.stop(); } catch (e) {} myVoice = null; }
}

// ---------------------------------------------------------------------
//  YOUR VOICE! Recordings from the Voice Studio.
//
//  Each recording is saved in the browser's own little storage box (it's
//  called IndexedDB). It lives on THIS computer, nowhere else.
//  Each line's recording is found by its "key": who says it + the words.
//  So if you change the words of a line, you'll need to record it again!
// ---------------------------------------------------------------------
function voiceKey(line) { return line.who + '|' + line.say; }

// Open the storage box. (It's a bit fiddly, so it's all in this one function.)
function openVoiceBox() {
  return new Promise(function (resolve, reject) {
    const request = indexedDB.open('testSubject1', 1);
    request.onupgradeneeded = function () { request.result.createObjectStore('voices'); };
    request.onsuccess = function () { resolve(request.result); };
    request.onerror = function () { reject(request.error); };
  });
}
// Do one thing with the box: 'get', 'put' or 'delete'.
function storageBox(job, key, recording) {
  return openVoiceBox().then(function (box) {
    return new Promise(function (resolve, reject) {
      const store = box.transaction('voices', 'readwrite').objectStore('voices');
      const request = job === 'put' ? store.put(recording, key) : store[job](key);
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  });
}

// Some browsers have a storage box that never answers! So recordings are
// ALSO kept in the page's memory. Memory always works (but forgets when
// you close the page), and the storage box remembers for next time.
const voicesInMemory = {};   // key -> recording (or null if you deleted it)
function voiceBox(job, key, recording) {
  if (job === 'put') voicesInMemory[key] = recording;
  if (job === 'delete') voicesInMemory[key] = null;
  if (job === 'get' && key in voicesInMemory) return Promise.resolve(voicesInMemory[key]);
  // Ask the storage box... but only wait 1.5 seconds for an answer.
  const tooSlow = new Promise(function (resolve) { setTimeout(resolve, 1500); });
  let asking;
  try { asking = storageBox(job, key, recording).catch(function () {}); } catch (e) { asking = tooSlow; }
  return Promise.race([asking, tooSlow]).then(function (answer) {
    if (job === 'get') voicesInMemory[key] = answer || null;
    return answer;
  });
}

// Every line in the whole show, in order.
// (If a line is said more than once, like "food...", it's only listed once,
// so you only have to record it once.)
function allLines() {
  const lines = [], seen = {};
  SHOTS.forEach(function (shot) {
    shot.lines.forEach(function (l) {
      if (seen[voiceKey(l)]) return;
      seen[voiceKey(l)] = true;
      lines.push(l);
    });
  });
  return lines;
}

// Before the show plays, turn every recording into sound the show can play.
let recordings = {};   // voiceKey -> the sound, ready to play
function loadRecordings() {
  recordings = {};
  if (!window.indexedDB || !audio) return;
  allLines().forEach(function (line) {
    const key = voiceKey(line);
    voiceBox('get', key).then(function (blob) {
      if (!blob) return;
      return blob.arrayBuffer().then(function (bytes) { return audio.decodeAudioData(bytes); })
        .then(function (sound) { recordings[key] = sound; });
    }).catch(function () {});
  });
}

// Play YOUR recording of a line. The "analyser" listens to it while it
// plays, so we can tell how LOUD you are (that's what moves the mouth).
let myVoice = null;
function playMyVoice(line, sound) {
  const source = audio.createBufferSource();
  source.buffer = sound;
  const analyser = audio.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser).connect(audio.destination);
  source.start();
  const me = { source: source, analyser: analyser, who: line.who };
  source.onended = function () { if (myVoice === me) myVoice = null; };
  myVoice = me;
}

// How loud is your voice right now? 0 = silent, 1 = SHOUTING.
const loudnessData = new Float32Array(512);
function myLoudness() {
  myVoice.analyser.getFloatTimeDomainData(loudnessData);
  let total = 0;
  for (let i = 0; i < loudnessData.length; i++) total += loudnessData[i] * loudnessData[i];
  return Math.min(1, Math.sqrt(total / loudnessData.length) * 6);
}

// Make the 12 shots. Each one is one part of the battle.
BEAT_TIMES.slice(0, -1).forEach(function (start, i) {
  const end = BEAT_TIMES[i + 1];
  const inThisPart = function (item) { return item[0] >= start && item[0] < end; };
  const sounds = BATTLE_SOUNDS.filter(inThisPart).map(function (snd) { return { at: snd[0] - start, play: snd[1] }; });
  // Heavy metal for the fighting! (Part 1 starts it when the robot bursts out.)
  if (i === 0) sounds.push({ at: 7.05, play: function () { playMetal(7, 0.28, null); } });
  if (i >= 1 && i <= 10) sounds.push({ at: 0.01, play: function () { playMetal(end - start, 0.28, null); } });
  SHOTS.push({
    length: end - start,
    follow: function (t) {
      return { x: keyAt(CAM_X, start + t), y: 450, zoom: keyAt(CAM_ZOOM, start + t) };
    },
    lines: BATTLE_LINES.filter(inThisPart).map(function (l) { return { at: l[0] - start, who: l[1], say: l[2] }; }),
    sounds: sounds,
    draw: function (t) { drawBattle(start + t); },
  });
});

// How long is the whole episode? Add up every shot.
const EPISODE_LENGTH = SHOTS.reduce(function (sum, shot) { return sum + shot.length; }, 0);

// Which shot is on at this moment, and how far into it are we?
function findShot(time) {
  let start = 0;
  for (const shot of SHOTS) {
    if (time < start + shot.length) return { shot: shot, t: time - start, start: start };
    start += shot.length;
  }
  const last = SHOTS[SHOTS.length - 1];
  return { shot: last, t: last.length, start: EPISODE_LENGTH - last.length };
}

// THE GIANT MACHINE: a big glowing ring right behind the scientist.
// Nobody knows what it does yet...
function drawMachine(t) {
  const cx = 800, cy = 380, r = 240;
  const pulse = 0.5 + 0.5 * Math.sin(t * 2);
  ctx.lineWidth = 34;
  ctx.strokeStyle = '#2a2342';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  // The glowing purple inside of the ring.
  ctx.save();
  ctx.shadowColor = '#b066ff';
  ctx.shadowBlur = 30 + pulse * 20;
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(176,102,255,' + (0.45 + pulse * 0.3) + ')';
  ctx.beginPath(); ctx.arc(cx, cy, r - 22, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  // Bolts around the ring.
  ctx.fillStyle = '#4a4068';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 7, 0, Math.PI * 2); ctx.fill();
  }
  // Its legs, down to the floor.
  ctx.fillStyle = '#1f1a33';
  ctx.fillRect(cx - 200, 560, 40, 150);
  ctx.fillRect(cx + 160, 560, 40, 150);
}

// THREE TUBES full of bubbling green goo.
function drawTubes(t) {
  for (let i = 0; i < 3; i++) {
    const x = 90 + i * 150, top = 250, bottom = 690, w = 100;
    // A green glow on the floor underneath.
    const glow = ctx.createRadialGradient(x + w / 2, 700, 10, x + w / 2, 700, 160);
    glow.addColorStop(0, 'rgba(80,255,140,0.25)');
    glow.addColorStop(1, 'rgba(80,255,140,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 120, 600, w + 240, 200);
    // The goo.
    ctx.save();
    ctx.shadowColor = '#5dff8f';
    ctx.shadowBlur = 40;
    ctx.fillStyle = 'rgba(60,230,120,0.55)';
    ctx.fillRect(x, top + 50, w, bottom - top - 50);
    ctx.restore();
    // BUBBLES. Each one floats up, and when it reaches the top it starts
    // again at the bottom. (The % sign does the "start again" part.)
    ctx.fillStyle = 'rgba(210,255,220,0.8)';
    for (let k = 0; k < 8; k++) {
      const speed = 60 * (1 + (k % 3) * 0.4);
      const rise = (t * speed + k * 53 + i * 91) % (bottom - top - 60);
      const bx = x + 15 + ((k * 37 + i * 20) % 70);
      ctx.beginPath(); ctx.arc(bx, bottom - rise, 4 + (k % 3) * 2, 0, Math.PI * 2); ctx.fill();
    }
    // The glass, and the metal caps on the top and bottom.
    ctx.strokeStyle = 'rgba(200,255,230,0.35)';
    ctx.lineWidth = 4;
    ctx.strokeRect(x, top, w, bottom - top);
    ctx.fillStyle = '#2b2740';
    ctx.fillRect(x - 10, top - 25, w + 20, 30);
    ctx.fillRect(x - 10, bottom - 5, w + 20, 25);
  }
}

// The screen flickers when it first turns on: on, off, on, off... ON.
function flicker(t) {
  if (t > 0.6) return 1;
  return Math.floor(t * 20) % 3 === 0 ? 0.2 : 1;
}

// THE SCREEN on the wall. When it's on, it shows the mystery person.
function drawScreen(t, on) {
  const x = 1150, y = 160, w = 330, h = 220;
  ctx.fillStyle = '#2b2740';
  ctx.fillRect(x - 14, y - 14, w + 28, h + 28);   // the frame
  ctx.fillStyle = '#05060a';
  ctx.fillRect(x, y, w, h);
  if (on <= 0) return;
  ctx.save();
  ctx.globalAlpha = on;
  ctx.shadowColor = '#3fe0ff';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#0a3a4a';
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;
  // The mystery person: just a shape. Who could it be?
  ctx.fillStyle = '#3fe0ff';
  ctx.beginPath(); ctx.arc(x + w / 2, y + 85, 36, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + 175, 70, 50, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#0a3a4a';
  ctx.font = 'bold 50px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('?', x + w / 2, y + 103);

  if (Math.floor(t * 2) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 26px monospace';
    ctx.fillText('TEST SUBJECT 1', x + w / 2, y + h - 14);
  }
  // Stripy TV lines.
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let sy = y; sy < y + h; sy += 6) ctx.fillRect(x, sy, w, 2);

}

// ---------------------------------------------------------------------
//  THE MYSTERIOUS SCIENTIST.
//  We only ever see their shadow... plus their glasses and their grin.
//    look.glasses: 0 = dark, 1 = glowing
//    look.grin:    0 = no grin, 1 = big grin
//    look.hands:   'down', 'rub' (evil hand rubbing) or 'point'
// ---------------------------------------------------------------------
const SHADOW = '#050409';

function drawScientist(t, look) {
  ctx.save();
  // A green glow round the edges, from the tubes, so you can see the shape.
  ctx.shadowColor = 'rgba(90,255,150,0.55)';
  ctx.shadowBlur = 25;
  ctx.fillStyle = SHADOW;
  ctx.strokeStyle = SHADOW;
  ctx.lineCap = 'round';

  // Breathing: the whole body bobs up and down a tiny bit.
  const breathe = Math.sin(t * 2) * 3;

  // The lab coat.
  ctx.beginPath();
  ctx.moveTo(745, 485 + breathe);
  ctx.lineTo(855, 485 + breathe);
  ctx.lineTo(900, 760);
  ctx.lineTo(700, 760);
  ctx.closePath();
  ctx.fill();

  // The arms. Where are the hands?
  let left, right;
  if (look.hands === 'rub') {
    // Hands go round and round in little circles: evil hand rubbing.
    const spin = t * 9;
    left = { x: 788 + Math.cos(spin) * 10, y: 550 + Math.sin(spin) * 6 };
    right = { x: 812 - Math.cos(spin) * 10, y: 550 - Math.sin(spin) * 6 };
  } else if (look.hands === 'point') {
    left = { x: 730, y: 640 };
    right = { x: 1000, y: 400 };   // pointing at the screen!
  } else {
    left = { x: 730, y: 640 };
    right = { x: 870, y: 640 };
  }
  ctx.lineWidth = 28;
  ctx.beginPath(); ctx.moveTo(752, 500 + breathe); ctx.lineTo(left.x, left.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(848, 500 + breathe); ctx.lineTo(right.x, right.y); ctx.stroke();
  ctx.beginPath(); ctx.arc(left.x, left.y, 15, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(right.x, right.y, 15, 0, Math.PI * 2); ctx.fill();

  // The head, and WILD spiky hair.
  const headX = 800, headY = 430 + breathe;
  ctx.beginPath(); ctx.arc(headX, headY, 55, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  for (let i = 0; i <= 14; i++) {
    const a = Math.PI * (0.95 + i / 14 * 1.1);        // from the left side, over the top, to the right
    const len = i % 2 === 0 ? 55 : 88;               // in, out, in, out: spikes!
    ctx.lineTo(headX + Math.cos(a) * len, headY + Math.sin(a) * len);
  }
  ctx.fill();

  ctx.restore();

  // THE GLASSES. When they're on, they glow.
  if (look.glasses > 0) {
    ctx.save();
    ctx.shadowColor = '#7dffb0';
    ctx.shadowBlur = 30 * look.glasses;
    ctx.fillStyle = 'rgba(200,255,220,' + look.glasses + ')';
    [-22, 22].forEach(function (side) {
      ctx.beginPath(); ctx.arc(headX + side, headY - 5, 16, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    // Every few seconds, a shiny GLINT slides across the glasses.
    const glint = (t % 3) / 0.35;
    if (glint < 1) {
      ctx.strokeStyle = 'rgba(255,255,255,' + look.glasses + ')';
      ctx.lineWidth = 4;
      [-22, 22].forEach(function (side) {
        const gx = headX + side - 14 + glint * 28;
        ctx.beginPath(); ctx.moveTo(gx - 4, headY - 14); ctx.lineTo(gx + 4, headY + 4); ctx.stroke();
      });
    }
  }

  // THE GRIN. When the scientist is talking, the mouth moves.
  if (look.grin > 0) {
    let open = talking ? 0.3 + 0.7 * Math.abs(Math.sin(t * 18)) : 0.2;
    // Your recording is playing? The louder you are, the wider it opens!
    if (myVoice && myVoice.who === 'THE SCIENTIST') open = 0.2 + 0.8 * myLoudness();
    ctx.fillStyle = 'rgba(255,255,255,' + look.grin + ')';
    ctx.beginPath();
    ctx.moveTo(headX - 28, headY + 22);
    ctx.quadraticCurveTo(headX, headY + 34 + open * 18, headX + 28, headY + 22);
    ctx.quadraticCurveTo(headX, headY + 30, headX - 28, headY + 22);
    ctx.fill();
  }
}

const WALL_X = 1140;   // where the right-hand wall starts (the one he bonks)

// How long ago was the last bonk? (A big number if there hasn't been one yet.)
function sinceBonk(t, bonks) {
  let since = 99;
  bonks.forEach(function (b) { if (t >= b) since = Math.min(since, t - b); });
  return since;
}

function drawCell(t, bonks, cellNumber) {
  // Every BONK shakes the whole picture, just for a moment.
  const since = sinceBonk(t, bonks);
  if (since < 0.15) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8);

  // The back wall: grey bricks.
  ctx.fillStyle = '#3b404b';
  ctx.fillRect(-400, -200, 2400, 960);

  ctx.fillRect(-400, 760, 2400, 400);

  ctx.fillStyle = '#0d1430';
  ctx.fillRect(250, 150, 150, 100);
  ctx.fillStyle = '#f4f1d0';
  ctx.beginPath(); ctx.arc(355, 185, 18, 0, Math.PI * 2); ctx.fill();   // the moon!
  ctx.fillStyle = '#666c78';
  for (let x = 270; x < 400; x += 30) ctx.fillRect(x, 150, 8, 100);
  ctx.fillStyle = 'rgba(190,210,255,0.07)';
  ctx.beginPath();
  ctx.moveTo(250, 250); ctx.lineTo(400, 250); ctx.lineTo(640, 760); ctx.lineTo(330, 760);
  ctx.fill();

  // The metal bed.
  ctx.fillStyle = '#555b66';
  ctx.fillRect(120, 640, 360, 22);
  ctx.fillRect(130, 662, 14, 98);
  ctx.fillRect(456, 662, 14, 98);
  ctx.fillStyle = '#7d7a6e';                       // a thin, lumpy mattress
  ctx.fillRect(125, 615, 350, 28);
  ctx.fillStyle = '#9a967f';                       // the flattest pillow ever
  ctx.fillRect(135, 600, 80, 18);

  // The door, with a little slot where food comes through (when it comes...)
  ctx.fillStyle = '#4b505c';
  ctx.fillRect(560, 360, 200, 400);
  ctx.strokeStyle = '#2a2d34';
  ctx.lineWidth = 6;
  ctx.strokeRect(560, 360, 200, 400);
  ctx.fillStyle = '#1b1d22';
  ctx.fillRect(610, 400, 100, 60);                 // the peephole window
  ctx.fillStyle = '#666c78';
  for (let x = 625; x < 710; x += 25) ctx.fillRect(x, 400, 6, 60);
  ctx.fillStyle = '#2a2d34';
  ctx.fillRect(605, 620, 110, 26);                 // the food slot
  ctx.fillStyle = '#8a8f9a';
  ctx.beginPath(); ctx.arc(735, 560, 9, 0, Math.PI * 2); ctx.fill();   // the handle
  // The cell's number, on a little metal sign.
  ctx.fillStyle = '#c9ccd2';
  ctx.fillRect(630, 490, 60, 50);
  ctx.fillStyle = '#1b1d22';
  ctx.font = 'bold 40px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(cellNumber || 1), 660, 530);

  // The EMPTY food bowl... with a fly buzzing round it.
  ctx.fillStyle = '#9aa0ab';
  ctx.beginPath(); ctx.ellipse(850, 748, 45, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5d626d';
  ctx.beginPath(); ctx.ellipse(850, 744, 34, 8, 0, 0, Math.PI * 2); ctx.fill();
  if (cellNumber === 2) {                          // a DOG bowl, with his name on it
    ctx.fillStyle = '#c0392b';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('RUFF', 850, 762);
  }
  const flyX = 850 + Math.cos(t * 5) * 45, flyY = 700 + Math.sin(t * 7.3) * 18;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  const flap = Math.sin(t * 80) * 3;               // wings flapping SUPER fast
  ctx.beginPath(); ctx.ellipse(flyX - 3, flyY - 5 - flap, 4, 6, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(flyX + 3, flyY - 5 + flap, 4, 6, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(flyX, flyY, 4, 0, Math.PI * 2); ctx.fill();

  // The right-hand wall: the one he keeps bonking. It sticks out towards us.
  ctx.fillStyle = '#30343e';
  ctx.fillRect(WALL_X, -200, 800, 960);
  drawBricks(WALL_X, -200, 800, 960, '#262931');
  ctx.fillStyle = '#4a505c';
  ctx.fillRect(WALL_X, -200, 6, 960);              // its edge catches the light
  // A shadow on the floor in front of it.
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(WALL_X, 760, 800, 400);

  // Dust falls from the wall after every bonk.
  if (since < 1) {
    ctx.fillStyle = 'rgba(200,200,200,' + (1 - since) + ')';
    for (let i = 0; i < 6; i++) {
      ctx.fillRect(WALL_X - 4 - (i % 3) * 6, 380 + i * 17 + since * 220, 4, 4);
    }
  }
}

// Bricks: rows of rectangles, and every other row slides over by half a
// brick, just like a real wall.
function drawBricks(x, y, w, h, mortar) {
  ctx.strokeStyle = mortar;
  ctx.lineWidth = 4;
  let row = 0;
  for (let by = y; by < y + h; by += 45) {
    ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + w, by); ctx.stroke();
    for (let bx = x + (row % 2) * 55; bx < x + w; bx += 110) {
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + 45); ctx.stroke();
    }
    row++;
  }
}

// ---------------------------------------------------------------------
//  TEST SUBJECT 1. We see him from the side, facing the wall.
//
//  HOW THE BONK WORKS: his body tips around his hips, like a door on a
//  hinge. "lean" says how far: -1 = leaning way back (winding up),
//  0 = standing up, 1 = forehead on the wall. BONK!
// ---------------------------------------------------------------------
// He's all WHITE, with BLACK outlines. Like a doodle that came to life.
const DUDE_WHITE = '#ffffff';
const DUDE_LINE = '#000000';
const DUDE_LINE_WIDTH = 5;

function leanAt(t, bonks) {
  for (const b of bonks) {
    const u = t - (b - 0.9);                       // 0.9 seconds before the bonk...
    if (u >= 0 && u < 0.7) return -ease(u / 0.7);  // ...slowly lean back...
    if (u >= 0.7 && u < 0.9) return -1 + 2 * ((u - 0.7) / 0.2);   // ...then SWING forward!
    if (t >= b && t < b + 0.5) return 1 - ease((t - b) / 0.5);    // ...and bounce back off.
  }
  return Math.sin(t * 1.5) * 0.04;                 // otherwise: just swaying sadly
}

function drawPrisoner(t, bonks) {
  const lean = leanAt(t, bonks);
  const tip = lean > 0 ? lean * 0.67 : lean * 0.3;    // how many "radians" to tip
  const hipX = 1000, hipY = 640;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = DUDE_LINE_WIDTH;
  ctx.strokeStyle = DUDE_LINE;

  // Legs: two black lines, with little feet (these don't tip over).
  ctx.beginPath(); ctx.moveTo(hipX - 16, hipY - 5); ctx.lineTo(hipX - 18, 748); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hipX + 16, hipY - 5); ctx.lineTo(hipX + 16, 748); ctx.stroke();
  dudeCircle(hipX - 12, 752, 12, 7);
  dudeCircle(hipX + 24, 752, 12, 7);

  // Everything above the hips tips over together.
  ctx.save();
  ctx.translate(hipX, hipY);
  ctx.rotate(tip);
  ctx.lineWidth = DUDE_LINE_WIDTH;
  ctx.strokeStyle = DUDE_LINE;

  // The back arm goes BEHIND the body, so we draw it first.
  const swing = Math.sin(t * 3) * 5 - lean * 10;   // a floppy arm, too hungry to lift it
  dudeArm(-6, -95, -14 - swing, -30);

  // The body: a rectangle.
  ctx.fillStyle = DUDE_WHITE;
  ctx.fillRect(-35, -125, 70, 125);
  ctx.strokeRect(-35, -125, 70, 125);

  // The head: a bald circle.
  dudeCircle(0, -170, 42, 42);

  // A tired eye: a black dot with a droopy eyelid line over it.
  ctx.fillStyle = DUDE_LINE;
  ctx.beginPath(); ctx.arc(20, -175, 5, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(10, -184); ctx.lineTo(30, -181); ctx.stroke();

  // The mouth. It opens when he talks.
  let open = talking && talker === 'TEST SUBJECT 1' ? 0.3 + 0.7 * Math.abs(Math.sin(t * 12)) : 0;
  if (myVoice && myVoice.who === 'TEST SUBJECT 1') open = myLoudness();
  if (open > 0.05) {
    ctx.beginPath(); ctx.ellipse(27, -150, 7, 1 + open * 8, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(20, -150); ctx.lineTo(33, -151); ctx.stroke();   // closed: a flat, hungry line
  }

  // The front arm goes IN FRONT of the body, so we draw it last.
  ctx.lineWidth = DUDE_LINE_WIDTH;
  dudeArm(8, -95, 18 + swing, -28);
  ctx.restore();

  // STARS spin round his head after every bonk.
  const since = sinceBonk(t, bonks);
  if (since < 1.3) {
    const headX = hipX + Math.sin(tip) * 170, headY = hipY - Math.cos(tip) * 170 - 50;
    for (let k = 0; k < 3; k++) {
      const a = since * 7 + k * 2.1;
      drawStar(headX + Math.cos(a) * 55, headY + Math.sin(a) * 14, 13, '#ffe14d');
    }
  }
}

// ---------------------------------------------------------------------
//  RUFF, the dog in Cell 2. He never, EVER stops running.
// ---------------------------------------------------------------------
const RUFF_SPEED = 430;          // how fast he runs (stage pixels per second)
const RUFF_LEFT = 200;           // he turns round here...
const RUFF_RIGHT = 1040;         // ...and here (just before the wall)
const RUFF_BROWN = '#a0622d';
const RUFF_DARK = '#6b3e1a';

// Where is Ruff at time t, and which way is he facing?
// He runs right... turns round... runs left... turns round... forever.
// The % ("remainder") makes the trip start over every time he gets back.
function ruffSpot(t) {
  const trip = RUFF_RIGHT - RUFF_LEFT;
  const p = (t * RUFF_SPEED) % (trip * 2);
  if (p < trip) return { x: RUFF_LEFT + p, facing: 1 };       // going right
  return { x: RUFF_RIGHT - (p - trip), facing: -1 };          // coming back
}

// where: (optional) tell Ruff exactly where to be: {x, y, facing, size}.
// Leave it out and he does his normal back-and-forth.
function drawRuff(t, where) {
  const spot = where || ruffSpot(t);
  const floorY = spot.y || 760;
  const size = spot.size || 1;
  const moving = !spot.still;          // still: true = he stands still (no running legs)
  const hop = moving ? -Math.abs(Math.sin(t * 14)) * 14 : 0;   // boing, boing, boing
  ctx.save();
  ctx.translate(spot.x, floorY + hop);
  ctx.scale(spot.facing * size, size);   // facing left? Just draw him BACKWARDS! (a mirror)
  ctx.lineCap = 'round';

  // STANDING UP: when Ruff grows his arms, he stands up on his back legs
  // like a person. upright = 0 is on all fours, 1 is standing up tall.
  // His body tips up around his back hips, like a door on a hinge.
  const upright = clamp(spot.arms || 0, 0, 1);
  const tip = -upright * 1.35;            // how far to tip (1.35 radians is nearly straight up)
  const HIP_X = -35, HIP_Y = -55;         // the hinge: his back hips
  // Where does a spot on his body end up after he tips up?
  // (This is the math for turning a point around a hinge.)
  function bodyPoint(x, y) {
    const dx = x - HIP_X, dy = y - HIP_Y;
    return { x: HIP_X + dx * Math.cos(tip) - dy * Math.sin(tip),
             y: HIP_Y + dx * Math.sin(tip) + dy * Math.cos(tip) };
  }

  // Legs, running like crazy. Each pair swings the opposite way.
  const run = moving ? t * 14 : 0.3;
  function leg(hipX, swing, color, length) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 13;
    ctx.beginPath();
    ctx.moveTo(hipX, -55);
    ctx.lineTo(hipX + Math.sin(swing) * 22 * length, -55 + 51 * length);
    ctx.stroke();
  }
  // BACK legs: these never tip. They always stand on the floor.
  leg(-40, run + Math.PI, RUFF_DARK, 1);   // far legs are darker (they're in the shadow)
  leg(-30, run, RUFF_BROWN, 1);

  // The far muscle arm goes BEHIND his body, so we draw it first.
  if (spot.arms) {
    const shoulder = bodyPoint(22, -72);
    muscleArm(t, shoulder.x, shoulder.y, spot.arms, spot.punch || 0, RUFF_DARK);
  }

  // Now tip the paper, and draw everything that tips up with him.
  ctx.save();
  ctx.translate(HIP_X, HIP_Y);
  ctx.rotate(tip);
  ctx.translate(-HIP_X, -HIP_Y);

  // His tail. Wag, wag, wag.
  const wag = Math.sin(t * 25) * 0.6;
  ctx.strokeStyle = RUFF_BROWN;
  ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(-58, -70);
  ctx.lineTo(-58 - Math.cos(1 + wag) * 40, -70 - Math.sin(1 + wag) * 40);
  ctx.stroke();

  // FRONT legs: they shrink away as the muscle arms grow. (1 - upright:
  // when he's all the way up, they're 0 long. Gone!)
  if (upright < 1) {
    leg(38, run, RUFF_DARK, 1 - upright);
    leg(46, run + Math.PI, RUFF_BROWN, 1 - upright);
  }

  // His body.
  ctx.fillStyle = RUFF_BROWN;
  ctx.beginPath(); ctx.ellipse(0, -65, 66, 30, 0, 0, Math.PI * 2); ctx.fill();
  // A red collar.
  ctx.strokeStyle = '#d63031';
  ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(44, -88); ctx.lineTo(56, -66); ctx.stroke();
  ctx.fillStyle = '#ffd24d';
  ctx.beginPath(); ctx.arc(54, -60, 6, 0, Math.PI * 2); ctx.fill();   // his name tag
  ctx.restore();   // stop tipping

  // His HEAD does NOT tip (or he'd be staring at the ceiling!). We just
  // move it to where his neck ended up, and scoot it forward a bit so
  // it sits on top of his body.
  const neck = bodyPoint(66, -102);
  ctx.save();
  ctx.translate(neck.x + upright * 30 - 66, neck.y + 102);

  // His head and snout.
  ctx.fillStyle = RUFF_BROWN;
  ctx.beginPath(); ctx.arc(66, -102, 29, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c58a4f';
  ctx.beginPath(); ctx.ellipse(92, -94, 20, 13, 0, 0, Math.PI * 2); ctx.fill();

  // His mouth. When he barks, it opens WIDE (and you can see his tongue).
  let open = talking && talker === 'RUFF' ? (Math.sin(t * 16) > 0 ? 1 : 0.15) : 0;
  if (myVoice && myVoice.who === 'RUFF') open = myLoudness();
  if (open > 0.05) {
    ctx.fillStyle = '#5a1f1f';
    ctx.beginPath(); ctx.ellipse(94, -80, 14, 2 + open * 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff7b9c';
    ctx.beginPath(); ctx.ellipse(96, -76 + open * 3, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
  // Nose and eye.
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(111, -98, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(72, -110, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(74, -112, 1.8, 0, Math.PI * 2); ctx.fill();
  // A floppy ear that flaps as he runs.
  ctx.fillStyle = RUFF_DARK;
  ctx.save();
  ctx.translate(55, -122);
  ctx.rotate(0.5 + Math.sin(t * 14) * 0.35);
  ctx.beginPath(); ctx.ellipse(0, 20, 11, 24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();   // done with the head

  // The near arm goes in FRONT of everything.
  if (spot.arms) {
    const shoulder = bodyPoint(44, -62);
    muscleArm(t, shoulder.x, shoulder.y, spot.arms, spot.punch || 0, RUFF_BROWN);
  }
  ctx.restore();

  // WOOF! Comic-book words pop out when he barks.
  if (talking && open > 0.5) {
    ctx.save();
    ctx.font = '900 44px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#ffd24d';
    const wordX = spot.x + spot.facing * 120, wordY = floorY + hop - 150;
    ctx.strokeText('WOOF!', wordX, wordY);
    ctx.fillText('WOOF!', wordX, wordY);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
//  THE INTRO. Everything happens at a TIME (seconds from the start).
//  Change these numbers to make things happen sooner or later!
// ---------------------------------------------------------------------
const INTRO_CENTER = 800;     // where Test Subject 1 stands
// The sign: a giant block covered in light bulbs.
const SIGN_HALF_WIDTH = 650;  // half as wide as the sign
const SIGN_ABOVE = 165;       // how far the sign goes ABOVE the bottom of the letters
const SIGN_BELOW = 25;        // ...and how far BELOW
const WORD_FLOOR = 760 - SIGN_BELOW;      // the bottom of the letters, when the sign is on the floor
const WORD_TOP = WORD_FLOOR - SIGN_ABOVE; // the top of the sign (he lands here)
const BULB_GAP = 13;          // how far apart the bulbs are. Smaller = MORE bulbs!
// How fast Ruff goes round. This number makes him do exactly 2 and a quarter
// laps before INTRO.runAway, so he ends up right in FRONT of Test Subject 1.
const CIRCLE_SPEED = (Math.PI * 4.5) / INTRO.runAway;

// Where is Ruff in the intro?
function introRuffSpot(t) {
  if (t < INTRO.runAway) {
    // Going round in a circle, seen from the side: he goes left and right,
    // and he's either BEHIND Test Subject 1 (higher up and a bit smaller,
    // because he's further away) or IN FRONT (lower and bigger).
    const a = t * CIRCLE_SPEED;
    const inFront = Math.sin(a) > 0;
    return {
      x: INTRO_CENTER - Math.cos(a) * 330,
      y: 760 + Math.sin(a) * 30,
      size: 0.95 + Math.sin(a) * 0.1,
      facing: inFront ? 1 : -1,
      inFront: inFront,
    };
  }
  // Coming BACK (after the blades drop): run in from the right...
  if (t >= INTRO.ruffBack && t < INTRO.ruffJump) {
    const u = (t - INTRO.ruffBack) / (INTRO.ruffJump - INTRO.ruffBack);
    return { x: lerp(STAGE_W + 150, 1290, u), y: 790, size: 1.05, facing: -1, returning: true };
  }
  // ...JUMP up in an arc (Math.sin makes the bump in the middle)...
  if (t >= INTRO.ruffJump && t < INTRO.ruffOnSign) {
    const u = (t - INTRO.ruffJump) / (INTRO.ruffOnSign - INTRO.ruffJump);
    return { x: lerp(1290, 1160, u), y: lerp(790, WORD_TOP, u) - Math.sin(u * Math.PI) * 130,
             size: 1, facing: -1, returning: true };
  }
  // ...and stand on top of the sign, next to Test Subject 1.
  if (t >= INTRO.ruffOnSign) {
    return { x: 1160, y: WORD_TOP, size: 1, facing: -1, returning: true };
  }
  // Running away to the right, FAST.
  return { x: INTRO_CENTER + (t - INTRO.runAway) * 950, y: 790, size: 1.05, facing: 1, inFront: true };
}

function drawIntro(t) {
  // Shake the whole picture for half a second after the SMASH.
  const shake = t > INTRO.smash && t < INTRO.smash + 0.5 ? (1 - (t - INTRO.smash) / 0.5) * 22 : 0;
  ctx.save();
  ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // A dark stage with a spotlight in the middle.
  ctx.fillStyle = '#07070d';
  ctx.fillRect(-100, -100, STAGE_W + 200, STAGE_H + 200);
  const light = ctx.createRadialGradient(INTRO_CENTER, 600, 50, INTRO_CENTER, 600, 650);
  light.addColorStop(0, 'rgba(120,255,170,0.25)');
  light.addColorStop(1, 'rgba(120,255,170,0)');
  ctx.fillStyle = light;
  ctx.fillRect(-100, -100, STAGE_W + 200, STAGE_H + 200);
  ctx.fillStyle = '#16161f';
  ctx.fillRect(-100, 760, STAGE_W + 200, 300);   // the floor

  drawHangingBlades(t - INTRO.smash);

  // Ruff (if he's still on screen). When he's BEHIND, we draw him first,
  // so Test Subject 1 covers him up. That's how you fake "behind" in 2D!
  const ruff = introRuffSpot(t);
  const ruffHere = ruff.x < STAGE_W + 200;
  if (ruffHere && !ruff.inFront && !ruff.returning) drawRuff(t, ruff);

  // Standing there, before the SMASH: he's behind the word.
  if (t < INTRO.smash) drawIntroDude(t);

  if (ruffHere && ruff.inFront && !ruff.returning) drawRuff(t, ruff);

  drawIntroWord(t);
  // After the SMASH we draw him AFTER the word, so he shows up in FRONT of it:
  // squished out from under it like toothpaste, and then lying on top of it.
  if (t >= INTRO.smash) drawIntroDude(t);
  // When Ruff comes back, he's in front of everything (even the sign).
  if (ruff.returning) drawRuff(t, ruff);
  drawDust(t - INTRO.smash);
  ctx.restore();
}

// Test Subject 1 in the intro: standing... SMUSHED... falling... FACEPLANT.
function drawIntroDude(t) {
  // drawPrisoner always draws him standing at x=1000 with his feet at y=760.
  // So before he's drawn, we MOVE, SQUASH and TURN the paper, and he ends up
  // however we want him. (That's called a "transform".)
  ctx.save();
  if (t < INTRO.smash) {
    // Just standing there. (Ruff is making him dizzy.)
    ctx.translate(INTRO_CENTER, 760);
  } else if (t < INTRO.fallStart) {
    // SMUSHED flat as a pancake, squeezing out from under the word.
    ctx.translate(INTRO_CENTER, 760);
    ctx.scale(3, 0.2);            // 3 times wider, and only a fifth as tall!
  } else {
    // Falling out of the sky, tumbling over... and landing FLAT ON HIS FACE.
    // He's lying down, so his feet are on the left and his head is on the right.
    const u = clamp((t - INTRO.fallStart) / (INTRO.land - INTRO.fallStart), 0, 1);
    const lieY = WORD_TOP - 42;   // 42 = half his head, so his FACE touches the sign
    let y = lerp(-400, lieY, u * u);   // u * u = faster and faster (like gravity!)
    const since = t - INTRO.land;
    if (since > 0 && since < 0.35) y -= Math.sin(since / 0.35 * Math.PI) * 25;   // a little bounce
    ctx.translate(INTRO_CENTER - 110, y);
    // Turn him a quarter turn (that's Math.PI / 2) so his FACE points DOWN.
    // He spins a bit while he falls, and finishes the turn as he lands.
    ctx.rotate(lerp(-Math.PI, Math.PI / 2, ease(u)));
  }
  ctx.translate(-1000, -760);
  drawPrisoner(t, []);
  ctx.restore();

  // SPLAT! Dizzy stars spin over his head after the faceplant.
  const since = t - INTRO.land;
  if (since > 0 && since < 2.5) {
    for (let k = 0; k < 3; k++) {
      const a = since * 6 + k * 2.1;
      drawStar(INTRO_CENTER + 60 + Math.cos(a) * 55, WORD_TOP - 110 + Math.sin(a) * 14, 13, '#ffe14d');
    }
  }
}

// ---------------------------------------------------------------------
//  THE LIGHT BULB SIGN.
//  Where do the bulbs go? We cheat! We secretly write REINCARNATED on a
//  hidden canvas, then check spots in a grid: if a spot is ON a letter,
//  a bulb goes there. We only do this once, then remember the answer.
// ---------------------------------------------------------------------
let letterBulbs = null;    // [{x, y}, ...] measured from the middle-bottom of the word
let edgeBulbs = null;      // the bulbs around the edge of the sign
function findBulbs() {
  const hidden = document.createElement('canvas');
  hidden.width = SIGN_HALF_WIDTH * 2;
  hidden.height = 200;
  const pen = hidden.getContext('2d');
  pen.font = '900 150px system-ui, sans-serif';
  pen.textAlign = 'center';
  pen.fillText('REINCARNATED', SIGN_HALF_WIDTH, 170);
  const pixels = pen.getImageData(0, 0, hidden.width, hidden.height).data;
  letterBulbs = [];
  for (let y = BULB_GAP / 2; y < hidden.height; y += BULB_GAP) {
    for (let x = BULB_GAP / 2; x < hidden.width; x += BULB_GAP) {
      // Each pixel is 4 numbers: red, green, blue, and "alpha" (how see-through).
      const alpha = pixels[(Math.floor(y) * hidden.width + Math.floor(x)) * 4 + 3];
      if (alpha > 128) letterBulbs.push({ x: x - SIGN_HALF_WIDTH, y: y - 170 });
    }
  }
  // Bulbs all the way round the edge, like an old theater sign.
  edgeBulbs = [];
  const left = -SIGN_HALF_WIDTH + 14, right = SIGN_HALF_WIDTH - 14;
  const top = -SIGN_ABOVE + 14, bottom = SIGN_BELOW - 12;
  for (let x = left; x <= right; x += 32) { edgeBulbs.push({ x: x, y: top }); }
  for (let y = top + 32; y <= bottom; y += 32) { edgeBulbs.push({ x: right, y: y }); }
  for (let x = right - 32; x >= left; x -= 32) { edgeBulbs.push({ x: x, y: bottom }); }
  for (let y = bottom - 32; y > top; y -= 32) { edgeBulbs.push({ x: left, y: y }); }
}

// One bulb. lit = 0 (off) up to 1 (fully ON).
function drawBulb(x, y, size, lit) {
  if (lit > 0) {
    // The glow: a big see-through yellow circle behind it.
    ctx.fillStyle = 'rgba(255,220,90,' + (0.28 * lit) + ')';
    ctx.beginPath(); ctx.arc(x, y, size * 2.3, 0, Math.PI * 2); ctx.fill();
  }
  // The glass: dark grey when it's off, bright yellow-white when it's on.
  ctx.fillStyle = lit > 0.5 ? '#fff6c8' : '#3a3a40';
  ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
  if (lit <= 0.5) {
    // A little shine, so an OFF bulb still looks like glass.
    ctx.fillStyle = '#6a6a72';
    ctx.beginPath(); ctx.arc(x - size * 0.35, y - size * 0.35, size * 0.35, 0, Math.PI * 2); ctx.fill();
  }
}

// The sign, dropping out of the sky like a giant brick.
function drawIntroWord(t) {
  if (t < INTRO.wordDrop) return;
  if (!letterBulbs) findBulbs();
  const u = Math.min(1, (t - INTRO.wordDrop) / (INTRO.smash - INTRO.wordDrop));
  const y = lerp(-250, WORD_FLOOR, u * u);
  ctx.save();
  ctx.translate(INTRO_CENTER, y);

  // The block: dark metal with a lighter frame and bolts in the corners.
  ctx.fillStyle = '#4a4a52';
  ctx.fillRect(-SIGN_HALF_WIDTH, -SIGN_ABOVE, SIGN_HALF_WIDTH * 2, SIGN_ABOVE + SIGN_BELOW);
  ctx.fillStyle = '#1c1c22';
  ctx.fillRect(-SIGN_HALF_WIDTH + 28, -SIGN_ABOVE + 28, SIGN_HALF_WIDTH * 2 - 56, SIGN_ABOVE + SIGN_BELOW - 52);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 6;
  ctx.strokeRect(-SIGN_HALF_WIDTH, -SIGN_ABOVE, SIGN_HALF_WIDTH * 2, SIGN_ABOVE + SIGN_BELOW);

  // ON or OFF? After the SMASH, the bulbs switch on starting from the
  // middle (where Test Subject 1 got squished!) and racing out to the ends.
  const since = t - INTRO.smash;
  letterBulbs.forEach(function (b) {
    const turnOnAt = Math.abs(b.x) / SIGN_HALF_WIDTH * 0.35;   // middle first, ends last
    let lit = since >= turnOnAt ? 1 : 0;
    if (lit && since > 1) lit = 0.85 + 0.15 * Math.sin(t * 9 + b.x * 0.05);   // a little shimmer
    drawBulb(b.x, b.y, 5, lit);
  });
  // The edge bulbs CHASE round and round: every third one is on, and it moves.
  edgeBulbs.forEach(function (b, i) {
    const lit = since > 0.35 && (i + Math.floor(t * 10)) % 3 === 0 ? 1 : 0;
    drawBulb(b.x, b.y, 6, lit);
  });

  // A white FLASH right when it lights up.
  if (since > 0 && since < 0.3) {
    ctx.fillStyle = 'rgba(255,255,230,' + (0.6 * (1 - since / 0.3)) + ')';
    ctx.fillRect(-SIGN_HALF_WIDTH, -SIGN_ABOVE, SIGN_HALF_WIDTH * 2, SIGN_ABOVE + SIGN_BELOW);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
//  SWINGING BLADES! When the sign hits the ground, axes, swords and
//  knives drop down on strings and swing back and forth.
//    x:    where its string is tied to the ceiling
//    kind: 'axe', 'sword' or 'knife'
//    len:  how long its string is (the ones in the middle are SHORT,
//          so they swing over Test Subject 1's head, not into him)
// ---------------------------------------------------------------------
const HANGING_BLADES = [
  { x: 210,  kind: 'axe',   len: 300 },
  { x: 350,  kind: 'knife', len: 380 },
  { x: 490,  kind: 'sword', len: 250 },
  { x: 640,  kind: 'knife', len: 200 },
  { x: 790,  kind: 'axe',   len: 130 },
  { x: 950,  kind: 'sword', len: 110 },
  { x: 1100, kind: 'knife', len: 290 },
  { x: 1240, kind: 'axe',   len: 240 },
  { x: 1390, kind: 'sword', len: 320 },
];

function drawHangingBlades(since) {
  if (since < 0) return;
  HANGING_BLADES.forEach(function (blade, i) {
    const u = since - i * 0.06;          // they drop one after another, really fast
    if (u < 0) return;
    // DROP: the string gets longer, overshoots, and bounces like a yo-yo.
    // (Math.exp makes the bounce get smaller and smaller until it stops.)
    const length = blade.len * (1 - Math.exp(-6 * u) * Math.cos(12 * u));
    // SWING: like a pendulum. Long strings swing SLOWER than short ones,
    // just like a real swing set! (That's real physics.)
    const speed = Math.sqrt(1500 / blade.len);
    const angle = 0.45 * Math.sin(u * speed + (i % 2 ? Math.PI : 0)) * Math.min(1, u * 2);

    ctx.save();
    ctx.translate(blade.x, -10);         // the ceiling (just off the top of the screen)
    ctx.rotate(angle);
    // The string.
    ctx.strokeStyle = '#c9c2a8';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, length); ctx.stroke();
    // The blade, hanging off the end, pointing down.
    ctx.translate(0, length);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#000';
    ctx.lineJoin = 'round';
    if (blade.kind === 'axe') drawAxe();
    if (blade.kind === 'sword') drawSword();
    if (blade.kind === 'knife') drawKnife();
    ctx.restore();
  });
}

// Each of these draws one thing, hanging from the top of its handle (0, 0).
const BLADE_SILVER = '#d4dae3';
function drawAxe() {
  ctx.fillStyle = '#8a5a2b';             // wooden handle
  ctx.fillRect(-6, 0, 12, 135); ctx.strokeRect(-6, 0, 12, 135);
  ctx.fillStyle = BLADE_SILVER;          // a big curved blade on one side
  ctx.beginPath();
  ctx.moveTo(6, 80);
  ctx.quadraticCurveTo(40, 70, 62, 55);
  ctx.quadraticCurveTo(48, 105, 62, 150);
  ctx.quadraticCurveTo(40, 135, 6, 125);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function drawSword() {
  ctx.fillStyle = '#e8b931';             // gold knob on the end
  ctx.beginPath(); ctx.arc(0, 7, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#5a2e1a';             // the grip
  ctx.fillRect(-6, 14, 12, 34); ctx.strokeRect(-6, 14, 12, 34);
  ctx.fillStyle = '#e8b931';             // the crossguard
  ctx.fillRect(-30, 48, 60, 11); ctx.strokeRect(-30, 48, 60, 11);
  ctx.fillStyle = BLADE_SILVER;          // the long blade, with a point
  ctx.beginPath();
  ctx.moveTo(-10, 59); ctx.lineTo(10, 59); ctx.lineTo(10, 195); ctx.lineTo(0, 222); ctx.lineTo(-10, 195);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#9aa3b0';           // a groove down the middle
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 66); ctx.lineTo(0, 195); ctx.stroke();
}
function drawKnife() {
  ctx.fillStyle = '#2d2d33';             // the handle
  ctx.fillRect(-7, 0, 14, 42); ctx.strokeRect(-7, 0, 14, 42);
  ctx.fillStyle = BLADE_SILVER;          // straight on one side, curved on the other
  ctx.beginPath();
  ctx.moveTo(-7, 42); ctx.lineTo(9, 42);
  ctx.quadraticCurveTo(12, 90, -7, 118);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}

// Puffs of dust that blast out sideways from the SMASH.
function drawDust(since) {
  if (since < 0 || since > 1) return;
  ctx.fillStyle = 'rgba(180,180,190,' + (1 - since) + ')';
  for (let k = 0; k < 8; k++) {
    const side = k % 2 ? 1 : -1;
    const x = INTRO_CENTER + side * (SIGN_HALF_WIDTH + 20 + since * (150 + k * 30));
    const y = 740 - k * 6 - since * 40;
    ctx.beginPath(); ctx.arc(x, y, 20 + since * 40, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------------------------------------------------------------------
//  RUFF'S MUSCLE ARMS.
//    grow:  0 = no arm at all, 1 = HUGE
//    punch: 0 = flexing (fist up by his head), 1 = punching straight out
//  The arm is 3 parts: the upper arm (with a bulging bicep!), the
//  forearm, and a big fist. We work out where the elbow and the fist go,
//  then draw thick lines between them.
// ---------------------------------------------------------------------
function muscleArm(t, shoulderX, shoulderY, grow, punch, color) {
  if (grow <= 0) return;
  // Where the elbow and fist go when FLEXING (fist up above his head)...
  // and when PUNCHING (straight out in front).
  const elbowX = lerp(75, 70, punch),  elbowY = lerp(15, -5, punch);
  const fistX  = lerp(85, 150, punch), fistY  = lerp(-100, -8, punch);
  // Grow: everything is measured from the shoulder, so a small arm is
  // just a big arm shrunk down towards the shoulder.
  const ex = shoulderX + elbowX * grow, ey = shoulderY + elbowY * grow;
  const fx = shoulderX + fistX * grow,  fy = shoulderY + fistY * grow;
  const midX = (shoulderX + ex) / 2, midY = (shoulderY + ey) / 2;
  // The BICEP pumps up and down when he flexes.
  const pump = punch < 0.5 ? 1 + Math.sin(t * 8) * 0.15 : 1;

  // We draw the whole arm TWICE: first a bit fatter in dark brown (that
  // makes an outline), then the real color on top. Now you can see the
  // arm even when it's in front of his brown body!
  function armShape(paint, extra) {
    ctx.strokeStyle = paint;
    ctx.fillStyle = paint;
    ctx.lineCap = 'round';
    ctx.lineWidth = 36 * grow + extra;                      // upper arm
    ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath();                                       // the bicep bump
    ctx.ellipse(midX, midY - 10 * grow, 30 * grow * pump + extra / 2, 21 * grow * pump + extra / 2, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 28 * grow + extra;                      // forearm
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.beginPath();                                       // the big fist
    ctx.arc(fx, fy, 25 * grow + extra / 2, 0, Math.PI * 2);
    ctx.fill();
  }
  armShape('#2b1608', 8);
  armShape(color, 0);

  // Knuckle lines on the fist.
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 3 * grow;
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(fx + 10 * grow, fy + k * 9 * grow);
    ctx.lineTo(fx + 22 * grow, fy + k * 9 * grow);
    ctx.stroke();
  }
  // A shiny spot on the bicep, so it looks ROUND and STRONG.
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(midX - 5 * grow, midY - 18 * grow, 11 * grow, 6 * grow, 0.6, 0, Math.PI * 2);
  ctx.fill();
}

// How big are Ruff's arms, t seconds into the power-up shot?
// They grow in three BOINGs: each one jumps bigger, wobbles, and settles.
function armSize(t) {
  let size = 0;
  ARM_BOINGS.forEach(function (b, i) {
    if (t >= b) {
      const since = t - b;
      const target = (i + 1) / ARM_BOINGS.length;          // 1/3, then 2/3, then FULL
      const wobble = Math.exp(-8 * since) * Math.sin(since * 30) * 0.15;
      size = target + wobble;
    }
  });
  return size;
}

// ---------------------------------------------------------------------
//  BUSTING OUT: the hole in the wall, and the bricks flying everywhere.
// ---------------------------------------------------------------------
const HOLE_X = WALL_X + 130, HOLE_Y = 625;  // the middle of the hole
// The jagged edge of the hole: how far out each point is. It looks random,
// but it's always the SAME, so the hole doesn't wiggle every frame.
const HOLE_EDGE = [1, 0.8, 1.1, 0.9, 1.2, 0.85, 1.05, 0.75, 1.15, 0.9, 1, 0.8];

// Traces the hole's outline. (Doesn't start a new path, so you can add it
// to other shapes. That's handy for the stencil trick below.)
function traceHole(size) {
  HOLE_EDGE.forEach(function (r, i) {
    const a = i / HOLE_EDGE.length * Math.PI * 2;
    const x = HOLE_X + Math.cos(a) * 130 * r * size;
    const y = Math.min(760, HOLE_Y + Math.sin(a) * 150 * r * size);   // flat on the floor
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
}

function drawHole(since) {
  if (since < 0) return;
  const size = Math.min(1, since / 0.12);   // it bursts open super fast
  ctx.beginPath(); traceHole(size);
  ctx.fillStyle = '#07080b';                // dark on the other side...
  ctx.fill();
  ctx.save();
  ctx.clip();                               // ...with some hallway light coming through
  const light = ctx.createRadialGradient(HOLE_X + 60, HOLE_Y, 10, HOLE_X + 60, HOLE_Y, 200);
  light.addColorStop(0, 'rgba(255,230,160,0.35)');
  light.addColorStop(1, 'rgba(255,230,160,0)');
  ctx.fillStyle = light;
  ctx.fillRect(HOLE_X - 200, HOLE_Y - 200, 400, 400);
  ctx.restore();
  ctx.beginPath(); traceHole(size);         // a broken, lighter edge
  ctx.strokeStyle = '#555b66';
  ctx.lineWidth = 8;
  ctx.stroke();
}

// A pretend "random" number that's always the same for the same i.
function wobbly(i) { const x = Math.sin(i * 127.1) * 43758.5; return x - Math.floor(x); }

function drawFlyingBricks(since) {
  if (since < 0 || since > 2.5) return;
  for (let i = 0; i < 18; i++) {
    const startX = WALL_X + 20 + wobbly(i) * 200, startY = 500 + wobbly(i + 50) * 250;
    const speedX = 200 + wobbly(i + 100) * 900;        // flying AWAY from Ruff's fist
    const speedY = -300 - wobbly(i + 150) * 600;       // and UP...
    const x = startX + speedX * since;
    const y = startY + speedY * since + 0.5 * 2200 * since * since;   // ...then gravity pulls them down
    if (y > 1000) continue;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(since * (wobbly(i + 200) * 14 - 7));    // tumbling
    ctx.fillStyle = '#3b404b';
    ctx.fillRect(-28, -12, 56, 24);
    ctx.strokeStyle = '#262931';
    ctx.lineWidth = 4;
    ctx.strokeRect(-28, -12, 56, 24);
    ctx.restore();
  }
}

// Where is Ruff in the bust-out shot?
function bustOutRuff(t) {
  if (t < PUNCH_AT) {     // CHARGE at the wall!
    return { x: lerp(560, WALL_X - 60, ease(t / PUNCH_AT)), facing: 1, arms: 1, punch: 0 };
  }
  if (t < 1.5) {          // POW! (the punch shoots out super fast, then holds)
    return { x: WALL_X - 60, facing: 1, arms: 1, punch: Math.min(1, (t - PUNCH_AT) / 0.08), still: true };
  }
  // Run out through the hole!
  return { x: WALL_X - 60 + (t - 1.5) * 700, facing: 1, arms: 1, punch: 0 };
}

function drawBustOut(t) {
  const since = t - PUNCH_AT;
  ctx.save();
  // The KA-BOOM shakes everything.
  if (since > 0 && since < 0.6) {
    const shake = (1 - since / 0.6) * 25;
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawCell(t + 30, [], 2);
  drawHole(since);
  // THE STENCIL TRICK ("clip"): after the punch, Ruff can only be seen
  // in front of the wall (left of it)... or inside the hole. So when he
  // runs into the hole, the wall hides the rest of him. Like he went through!
  ctx.save();
  if (since > 0) {
    ctx.beginPath();
    ctx.rect(-400, -300, WALL_X + 400, 1500);   // everything left of the wall
    traceHole(1);                               // PLUS the hole
    ctx.clip();
  }
  drawRuff(t, bustOutRuff(t));
  ctx.restore();
  drawFlyingBricks(since);
  // POW! in big comic-book letters.
  if (since > 0 && since < 0.8) {
    const pop = 0.6 + Math.min(1, since / 0.1) * 0.6;
    ctx.save();
    ctx.translate(WALL_X - 20, 430);
    ctx.rotate(-0.15);
    ctx.scale(pop, pop);
    ctx.font = '900 110px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#ffd24d';
    ctx.strokeText('POW!', 0, 0);
    ctx.fillText('POW!', 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
//  SCENE 4: THE HALLWAY, and the ROBOT GUARDS.
// ---------------------------------------------------------------------

// Where is Ruff in the hallway, and is he punching?
function ruffHallSpot(t) {
  const spot = { x: HALL_START, y: 760, facing: 1, arms: 1, punch: 0 };
  if (t < HALL_GO) { spot.still = true; return spot; }   // flexing in front of the hole
  let fromX = HALL_START, fromT = HALL_GO;
  for (const h of HALL_HITS) {
    if (t < h.arrive) {                                  // running to the next robot
      spot.x = lerp(fromX, h.stopX, (t - fromT) / (h.arrive - fromT));
      return spot;
    }
    if (t < h.arrive + HALL_PUNCH_TIME) {                // POW! (punch out... and back)
      const u = t - h.arrive;
      spot.x = h.stopX;
      spot.still = true;
      spot.punch = u < 0.35 ? Math.min(1, u / 0.08) : Math.max(0, 1 - (u - 0.35) / 0.15);
      return spot;
    }
    fromX = h.stopX;
    fromT = h.arrive + HALL_PUNCH_TIME;
  }
  if (t < HALL_DONE) {                                   // the last run, to Cell 1
    spot.x = lerp(fromX, DOOR_STOP, (t - fromT) / (HALL_DONE - fromT));
    return spot;
  }
  spot.x = DOOR_STOP;                                    // made it!
  spot.still = true;
  return spot;
}

// One cell door in the hallway.
function hallDoor(x, number, glow) {
  if (glow) {
    // A light shining on Cell 1's door, so you know it's the important one.
    const light = ctx.createRadialGradient(x, 520, 20, x, 520, 260);
    light.addColorStop(0, 'rgba(255,240,180,0.25)');
    light.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = light;
    ctx.fillRect(x - 260, 260, 520, 500);
  }
  ctx.fillStyle = '#4b505c';
  ctx.fillRect(x - 80, 430, 160, 330);
  ctx.strokeStyle = '#2a2d34';
  ctx.lineWidth = 6;
  ctx.strokeRect(x - 80, 430, 160, 330);
  ctx.fillStyle = '#1b1d22';
  ctx.fillRect(x - 40, 460, 80, 50);                 // peephole window
  ctx.fillStyle = '#666c78';
  for (let bx = x - 30; bx < x + 40; bx += 20) ctx.fillRect(bx, 460, 5, 50);
  ctx.fillStyle = glow ? '#ffe9a8' : '#c9ccd2';       // the number sign
  ctx.fillRect(x - 25, 540, 50, 44);
  ctx.fillStyle = '#1b1d22';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(String(number), x, 575);
}

// The hallway itself. openSince: how long ago Cell 1's door got busted
// open (a negative number = it's still shut).
function drawHallBack(t, openSince) {
  // The back wall (bricks, all the way down the hall) and the floor.
  ctx.fillStyle = '#343944';
  ctx.fillRect(-400, -200, CELL1_DOOR_X + 2000, 960);
  drawBricks(-400, -200, CELL1_DOOR_X + 2000, 960, '#2a2e37');
  ctx.fillStyle = '#1e2128';
  ctx.fillRect(-400, 760, CELL1_DOOR_X + 2000, 400);
  ctx.fillStyle = '#2c3039';
  ctx.fillRect(-400, 760, CELL1_DOOR_X + 2000, 8);   // where the wall meets the floor

  // Ceiling lamps, each one shining a cone of light down.
  for (let x = 400; x < CELL1_DOOR_X + 1400; x += 500) {
    ctx.fillStyle = 'rgba(255,240,190,0.06)';
    ctx.beginPath();
    ctx.moveTo(x - 30, 70); ctx.lineTo(x + 30, 70); ctx.lineTo(x + 200, 760); ctx.lineTo(x - 200, 760);
    ctx.fill();
    ctx.fillStyle = '#ffeebb';
    ctx.fillRect(x - 35, 55, 70, 14);
  }

  // The hole Ruff just punched (he comes out of it), with rubble on the floor.
  ctx.fillStyle = '#07080b';
  ctx.beginPath();
  HOLE_EDGE.forEach(function (r, i) {
    const a = i / HOLE_EDGE.length * Math.PI * 2;
    const x = HALL_START - 40 + Math.cos(a) * 120 * r, y = Math.min(760, 620 + Math.sin(a) * 140 * r);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#555b66';
  ctx.lineWidth = 8;
  ctx.stroke();
  ctx.fillStyle = '#3b404b';
  for (let i = 0; i < 6; i++) ctx.fillRect(HALL_START - 120 + wobbly(i) * 260, 742 + wobbly(i + 9) * 14, 46, 20);

  // The cell doors... and Cell 1 at the very end, glowing.
  [3, 4, 5, 6, 7, 8].forEach(function (number, i) { hallDoor(700 + i * 600, number, false); });
  if (openSince < 0) hallDoor(CELL1_DOOR_X, 1, true);
  else openDoorway(CELL1_DOOR_X);
  drawExit();

  // ALARM! Everything flashes red.
  const flash = Math.max(0, Math.sin(t * 6));
  ctx.fillStyle = 'rgba(255,30,30,' + (0.12 * flash) + ')';
  ctx.fillRect(-400, -200, CELL1_DOOR_X + 2000, 1400);

}

function drawHallway(t) {
  drawHallBack(t, -1);
  // The robots, then Ruff in front of them.
  HALL_HITS.forEach(function (h, i) { drawRobot(t, h, i); });
  drawRuff(t, ruffHallSpot(t));

  // Comic-book words for every punch.
  const WORDS = ['BAM!', 'KRUNCH!', 'WHAM!', 'BONK!', 'KAPOW!', 'CLANG!'];
  HALL_HITS.forEach(function (h, i) {
    const since = t - h.hit;
    if (since < 0 || since > 0.7) return;
    const pop = 0.6 + Math.min(1, since / 0.1) * 0.5;
    ctx.save();
    ctx.translate(h.robotX + 40, 400);
    ctx.rotate(i % 2 ? 0.15 : -0.15);
    ctx.scale(pop, pop);
    ctx.font = '900 90px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = i % 2 ? '#ff7b3a' : '#ffd24d';
    ctx.strokeText(WORDS[i % WORDS.length], 0, 0);
    ctx.fillText(WORDS[i % WORDS.length], 0, 0);
    ctx.restore();
  });
}

// ---------------------------------------------------------------------
//  A ROBOT GUARD. Boxy metal body, wheels, a red eye that scans side to
//  side, and an antenna with a blinking light. It waves its arms: STOP!
//  When Ruff punches it, it flies back, crashes on the floor, and its
//  head POPS OFF.
// ---------------------------------------------------------------------
const ROBOT_METAL = '#9aa3ad', ROBOT_DARK = '#6b737d';

// Draws a shape twice: a black outline, then the color. (Same trick as Ruff's arms.)
function outlinedLine(x1, y1, x2, y2, width, color) {
  [['#000', width + 6], [color, width]].forEach(function (pass) {
    ctx.strokeStyle = pass[0];
    ctx.lineWidth = pass[1];
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  });
}

function robotHead(t, on) {
  ctx.fillStyle = '#b8c0c9';
  ctx.fillRect(-35, -28, 70, 56);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeRect(-35, -28, 70, 56);
  // The antenna, with a light on top that blinks.
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, -50); ctx.stroke();
  ctx.fillStyle = on && Math.sin(t * 10) > 0 ? '#ff3b3b' : '#5a2020';
  ctx.beginPath(); ctx.arc(0, -54, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // The visor, with a red eye scanning back and forth. When a robot is
  // talking, the eye goes BIG and BRIGHT.
  ctx.fillStyle = '#111';
  ctx.fillRect(-26, -10, 52, 16);
  if (on) {
    const loud = talking && talker === 'ROBOT GUARD';
    ctx.fillStyle = '#ff2a2a';
    ctx.fillRect(-6 + Math.sin(t * 4) * 14 - (loud ? 6 : 0), -8, loud ? 24 : 12, 12);
  }
}

function drawRobot(t, h, i) {
  const since = t - h.hit;
  const hit = since >= 0;
  let x = h.robotX, y = 760, tipOver = 0, air = 0;
  if (hit) {
    x += 260 * (1 - Math.exp(-5 * since));                 // flies back...
    const u = Math.min(1, since / 0.45);
    air = Math.sin(u * Math.PI) * 110;                     // ...up in the air...
    tipOver = u * Math.PI / 2;                             // ...and lands flat on its back
  }
  const lift = 52 * Math.sin(tipOver);                     // (so it lies ON the floor, not in it)

  ctx.save();
  ctx.translate(x, y - air - lift);
  ctx.rotate(tipOver);
  ctx.lineCap = 'round';
  // Arms: waving STOP! ...or floppy, after it's been punched.
  const wave = Math.sin(t * 7 + i) * 18;
  if (hit) {
    outlinedLine(-50, -130, -75, -80, 12, ROBOT_DARK);
    outlinedLine(50, -130, 75, -80, 12, ROBOT_DARK);
  } else {
