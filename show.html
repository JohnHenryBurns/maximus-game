    outlinedLine(-50, -130, -95, -180 + wave, 12, ROBOT_DARK);
    outlinedLine(50, -130, 90, -170 - wave, 12, ROBOT_DARK);
    ctx.fillStyle = ROBOT_DARK;                            // claw hands
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(-95, -180 + wave, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(90, -170 - wave, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // Wheels and the base.
  ctx.fillStyle = '#2b2b30';
  ctx.beginPath(); ctx.arc(-25, -14, 14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(25, -14, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ROBOT_DARK;
  ctx.fillRect(-40, -42, 80, 22);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeRect(-40, -42, 80, 22);
  // The body, with blinky lights on its chest.
  ctx.fillStyle = ROBOT_METAL;
  ctx.fillRect(-50, -150, 100, 110);
  ctx.strokeRect(-50, -150, 100, 110);
  ['#ff3b3b', '#ffd24d', '#5dff8f'].forEach(function (color, k) {
    const on = !hit && Math.sin(t * 5 + k * 2 + i) > 0;
    ctx.fillStyle = on ? color : '#444';
    ctx.fillRect(-30 + k * 22, -125, 14, 14);
  });
  ctx.fillStyle = ROBOT_DARK;
  ctx.fillRect(-30, -95, 60, 36);                          // a speaker grille
  ctx.strokeStyle = '#3a3f46';
  ctx.lineWidth = 3;
  for (let k = 0; k < 4; k++) {
    ctx.beginPath(); ctx.moveTo(-26, -88 + k * 8); ctx.lineTo(26, -88 + k * 8); ctx.stroke();
  }
  // Its head, while it's still attached.
  if (!hit) {
    ctx.save();
    ctx.translate(0, -180 + Math.sin(t * 3 + i) * 3);
    robotHead(t, true);
    ctx.restore();
  }
  ctx.restore();

  if (!hit) return;

  // POP! The head flies off: up... spinning... then CLUNK onto the floor.
  // (Gravity again: the 0.5 * 2200 * s * s part pulls it down faster and faster.)
  const landAt = 0.81;                       // how long the head is in the air
  const s = Math.min(since, landAt);
  const headX = h.robotX + 40 + 330 * s;
  const headY = Math.min(732, 580 - 700 * s + 0.5 * 2200 * s * s);
  ctx.save();
  ctx.translate(headX, headY);
  ctx.rotate(s / landAt * Math.PI * 2);      // one full spin, so it lands right way up
  robotHead(t, false);
  ctx.restore();

  // SPARKS fly out of its neck.
  if (since < 0.6) {
    const neckX = x + 160 * Math.sin(tipOver), neckY = y - air - lift - 160 * Math.cos(tipOver);
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = 3;
    for (let k = 0; k < 8; k++) {
      const a = wobbly(k + i * 10) * Math.PI * 2;
      const r1 = since * 200, r2 = r1 + 18;
      ctx.beginPath();
      ctx.moveTo(neckX + Math.cos(a) * r1, neckY + Math.sin(a) * r1);
      ctx.lineTo(neckX + Math.cos(a) * r2, neckY + Math.sin(a) * r2);
      ctx.stroke();
    }
  }
}

// ---------------------------------------------------------------------
//  SCENE 5: THE ESCAPE.
// ---------------------------------------------------------------------
const EXIT_X = CELL1_DOOR_X + 850;   // the way OUT, at the end of the hallway
const RUN_AWAY = 4.2;                // when they start running for the exit
const ESCAPE_SPEED = 450;

// Cell 1's doorway, with the door GONE. Dark inside.
function openDoorway(x) {
  ctx.fillStyle = '#0b0c10';
  ctx.fillRect(x - 80, 430, 160, 330);
  ctx.strokeStyle = '#2a2d34';
  ctx.lineWidth = 10;
  ctx.strokeRect(x - 80, 430, 160, 330);
}

// The EXIT: a doorway full of sunshine, blue sky and grass.
function drawExit() {
  // Sunlight spilling out onto the hallway floor.
  ctx.fillStyle = 'rgba(255,250,200,0.18)';
  ctx.beginPath();
  ctx.moveTo(EXIT_X - 100, 760); ctx.lineTo(EXIT_X + 100, 760);
  ctx.lineTo(EXIT_X + 260, 900); ctx.lineTo(EXIT_X - 260, 900);
  ctx.fill();
  // The sky.
  const sky = ctx.createLinearGradient(0, 400, 0, 760);
  sky.addColorStop(0, '#8fd3ff');
  sky.addColorStop(1, '#fff6d0');
  ctx.fillStyle = sky;
  ctx.fillRect(EXIT_X - 100, 400, 200, 360);
  ctx.fillStyle = '#fff3a0';                                  // the sun
  ctx.beginPath(); ctx.arc(EXIT_X + 40, 470, 28, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5dbb63';                                  // grass!
  ctx.fillRect(EXIT_X - 100, 725, 200, 35);
  ctx.strokeStyle = '#2a2d34';
  ctx.lineWidth = 10;
  ctx.strokeRect(EXIT_X - 100, 400, 200, 360);
  // The glowing green EXIT sign.
  ctx.fillStyle = '#1f9d55';
  ctx.fillRect(EXIT_X - 70, 320, 140, 52);
  ctx.fillStyle = '#eafff0';
  ctx.font = 'bold 38px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', EXIT_X, 360);
}

// Where are they? They wait at Cell 1... then RUN for the exit.
function escapeTS1X(t) {
  return CELL1_DOOR_X + Math.max(0, t - RUN_AWAY) * ESCAPE_SPEED;
}
function escapeRuffSpot(t) {
  const spot = { x: DOOR_STOP, y: 760, facing: 1, arms: 1, punch: 0, still: true };
  const u = t - DOOR_PUNCH;
  if (u > 0 && u < 0.5) spot.punch = u < 0.35 ? Math.min(1, u / 0.08) : 1 - (u - 0.35) / 0.15;
  if (t > RUN_AWAY) {
    spot.x = DOOR_STOP + (t - RUN_AWAY) * ESCAPE_SPEED;
    spot.still = false;
  }
  return spot;
}
// Going into the exit: they shrink (they're getting further away)
// and fade into the light. 0 = not yet, 1 = gone!
function intoTheLight(x) { return clamp((x - (EXIT_X - 60)) / 120, 0, 1); }

function drawEscape(t) {
  const since = t - DOOR_PUNCH - 0.08;   // how long ago the door got busted
  ctx.save();
  if (since > 0 && since < 0.5) {        // shake!
    const shake = (1 - since / 0.5) * 22;
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawHallBack(t + 20, since);
  HALL_HITS.forEach(function (h, i) { drawRobot(HALL_DONE + 10, h, i); });   // still knocked out

  // Test Subject 1: he was behind the door the whole time!
  if (since > 0) {
    const x = escapeTS1X(t);
    const gone = intoTheLight(x);
    const hop = t > RUN_AWAY ? -Math.abs(Math.sin(t * 12)) * 14 : 0;
    ctx.save();
    ctx.globalAlpha = 1 - gone;
    ctx.translate(x, 760 + hop);
    ctx.scale(1 - gone * 0.4, 1 - gone * 0.4);
    ctx.translate(-1000, -760);
    drawPrisoner(t, []);
    ctx.restore();
  }

  // Ruff.
  const ruff = escapeRuffSpot(t);
  const ruffGone = intoTheLight(ruff.x);
  ruff.size = 1 - ruffGone * 0.4;
  ctx.save();
  ctx.globalAlpha = 1 - ruffGone;
  drawRuff(t, ruff);
  ctx.restore();

  // The door: punched clean off its hinges, it flies away SPINNING,
  // up and off the screen. (Only for the first 1.5 seconds; after that
  // it's long gone!)
  if (since > 0 && since < 1.5) {
    ctx.save();
    ctx.translate(CELL1_DOOR_X + 1500 * since,
                  595 - 900 * since + 0.5 * 1400 * since * since);   // up... then gravity
    ctx.rotate(since * 8);
    ctx.translate(-CELL1_DOOR_X, -595);
    hallDoor(CELL1_DOOR_X, 1, false);
    ctx.restore();
  }

  // SMASH! in comic letters.
  if (since > 0 && since < 0.7) {
    const pop = 0.6 + Math.min(1, since / 0.1) * 0.5;
    ctx.save();
    ctx.translate(CELL1_DOOR_X, 380);
    ctx.rotate(-0.12);
    ctx.scale(pop, pop);
    ctx.font = '900 100px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 13;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#ffd24d';
    ctx.strokeText('SMASH!', 0, 0);
    ctx.fillText('SMASH!', 0, 0);
    ctx.restore();
  }
  ctx.restore();

  // They're free! Everything fades into bright white light.
  if (t > 7) {
    ctx.fillStyle = 'rgba(255,255,255,' + ease((t - 7) / 1.5) + ')';
    ctx.fillRect(-2000, -2000, 10000, 6000);
  }
}

// ---------------------------------------------------------------------
//  SCENE 6: THE SCIENTIST'S GIANT ROBOT, with SWORDS FOR HANDS.
// ---------------------------------------------------------------------
const BIG_DARK = '#3d4450', BIG_MID = '#59616e', BIG_LIGHT = '#7d8694';

// The scientist always stands in the middle of the lab... so to move him
// to the left, we slide the paper over before he's drawn!
function scientistOnTheLeft(t, look) {
  ctx.save();
  ctx.translate(-420, 0);
  drawScientist(t, look);
  ctx.restore();
}

// A filled shape with a thick black outline, from a list of points.
function chunkyShape(points, color) {
  ctx.beginPath();
  points.forEach(function (pt, i) { if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  ctx.stroke();
}
function chunkyCircle(x, y, r, color) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.stroke();
}

// How far ABOVE its spot is robot part number i? (null = not built yet.)
// Each part drops from the sky and slams down. CLANG!
function partDrop(built, i) {
  const since = built - ROBOT_BUILD[i];
  if (since < 0) return null;
  const u = Math.min(1, since / 0.35);
  return -700 * (1 - u) * (1 - u);
}

// One arm with a SWORD on the end. side: -1 = left, 1 = right.
// raise: 0 = arms down, 1 = swords up high!
function bigArm(t, side, raise, on, armDrop, swordDrop) {
  const cx = 800;
  const sx = cx + side * 205, sy = 230;                                 // shoulder
  const ex = cx + side * lerp(265, 335, raise), ey = lerp(385, 300, raise);   // elbow
  const wx = cx + side * lerp(280, 300, raise), wy = lerp(525, 140, raise);   // wrist
  // Which way the sword points: down and a bit out... or UP and out.
  let dx = side * lerp(0.25, 0.5, raise), dy = lerp(1, -1, raise);
  const len = Math.hypot(dx, dy);
  dx /= len; dy /= len;

  if (armDrop !== null) {
    ctx.save();
    ctx.translate(0, armDrop);
    ctx.lineCap = 'round';
    outlinedLine(sx, sy, ex, ey, 46, BIG_DARK);                         // upper arm
    chunkyCircle(ex, ey, 28, BIG_MID);                                  // elbow
    outlinedLine(ex, ey, wx, wy, 40, BIG_DARK);                         // forearm
    chunkyCircle(wx, wy, 25, BIG_MID);                                  // wrist
    chunkyCircle(sx, sy, 58, BIG_MID);                                  // big shoulder pad
    chunkyShape([[sx - 20, sy - 50], [sx + side * 10, sy - 100], [sx + 20, sy - 50]], BIG_LIGHT);   // with a spike!
    ctx.restore();
  }
  if (swordDrop !== null && armDrop !== null) {
    ctx.save();
    ctx.translate(0, swordDrop);
    const px = -dy, py = dx;                 // "sideways" from the blade (for its width)
    const at = function (along, across) { return [wx + dx * along + px * across, wy + dy * along + py * across]; };
    // The blade: long and silver, with a sharp point.
    chunkyShape([at(25, 14), at(290, 14), at(340, 0), at(290, -14), at(25, -14)], '#d4dae3');
    ctx.strokeStyle = '#9aa3b0';             // a groove down the middle
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(at(35, 0)[0], at(35, 0)[1]); ctx.lineTo(at(280, 0)[0], at(280, 0)[1]); ctx.stroke();
    // A gold crossguard, right where the hand would be.
    chunkyShape([at(18, 48), at(32, 48), at(32, -48), at(18, -48)], '#e8b931');
    // When it's switched on, a shine slides up and down the blade. GLINT!
    if (on > 0.5) {
      const g = at(40 + ((t * 260) % 240), 0);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(g[0], g[1], 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

// THE GIANT ROBOT.
//   built: how far along the building is (seconds), so parts appear one by one
//   on:    0 = switched off, 1 = eyes and chest glowing
//   raise: 0 = arms down, 1 = SWORDS UP
function drawBigRobot(t, look) {
  const legs = partDrop(look.built, 0), body = partDrop(look.built, 1);
  const leftArm = partDrop(look.built, 2), rightArm = partDrop(look.built, 3);
  const swords = partDrop(look.built, 4), head = partDrop(look.built, 5);
  const on = look.on;

  if (legs !== null) {
    ctx.save();
    ctx.translate(0, legs);
    chunkyShape([[695, 480], [770, 480], [770, 692], [695, 692]], BIG_DARK);
    chunkyShape([[830, 480], [905, 480], [905, 692], [830, 692]], BIG_DARK);
    chunkyCircle(732, 585, 24, BIG_MID);                     // knees
    chunkyCircle(868, 585, 24, BIG_MID);
    chunkyShape([[665, 690], [785, 690], [785, 724], [665, 724]], BIG_MID);   // big feet
    chunkyShape([[815, 690], [935, 690], [935, 724], [815, 724]], BIG_MID);
    ctx.restore();
  }
  if (body !== null) {
    ctx.save();
    ctx.translate(0, body);
    chunkyShape([[675, 432], [925, 432], [925, 485], [675, 485]], BIG_MID);   // hips
    chunkyShape([[595, 195], [1005, 195], [925, 440], [675, 440]], BIG_DARK); // chest
    ctx.strokeStyle = BIG_LIGHT;                                              // chest plates
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(650, 245); ctx.lineTo(950, 245); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(800, 245); ctx.lineTo(800, 430); ctx.stroke();
    // The POWER CORE in its chest: dark when it's off, glowing red when it's on.
    ctx.save();
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 50 * on;
    chunkyCircle(800, 320, 40, on > 0 ? 'rgb(' + Math.round(42 + 213 * on) + ',' + Math.round(20 + 39 * on) + ',' + Math.round(20 + 39 * on) + ')' : '#2a1414');
    ctx.restore();
    [[625, 215], [975, 215], [700, 420], [900, 420]].forEach(function (b) {   // bolts
      ctx.fillStyle = BIG_LIGHT;
      ctx.beginPath(); ctx.arc(b[0], b[1], 6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  }
  // Arms (and swords). They go on top of the body.
  // Each arm can move on its own (raiseL, raiseR), or both together (raise).
  bigArm(t, -1, look.raiseL !== undefined ? look.raiseL : look.raise, on, leftArm, swords);
  bigArm(t, 1, look.raiseR !== undefined ? look.raiseR : look.raise, on, rightArm, swords);

  if (head !== null) {
    ctx.save();
    ctx.translate(0, head);
    chunkyShape([[775, 190], [825, 190], [825, 205], [775, 205]], BIG_MID);   // neck
    chunkyShape([[745, 92], [728, 50], [765, 92]], BIG_LIGHT);                // two little horns
    chunkyShape([[855, 92], [872, 50], [835, 92]], BIG_LIGHT);
    chunkyShape([[728, 90], [872, 90], [872, 195], [728, 195]], BIG_MID);     // the head
    ctx.fillStyle = '#111';
    ctx.fillRect(745, 118, 110, 38);                                          // the visor
    // ANGRY EYES: slanted down towards the middle. Glowing red when it's on.
    ctx.save();
    ctx.shadowColor = '#ff2a2a';
    ctx.shadowBlur = 25 * on;
    ctx.fillStyle = on > 0 ? 'rgba(255,42,42,' + (0.25 + 0.75 * on) + ')' : '#3a1010';
    [[[752, 126], [792, 138], [792, 150], [752, 148]], [[848, 126], [808, 138], [808, 150], [848, 148]]].forEach(function (eye) {
      ctx.beginPath();
      eye.forEach(function (pt, i) { if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
    // DIZZY? Then its eyes turn into spinning spirals!
    if (look.dizzy) {
      ctx.fillStyle = '#111';
      ctx.fillRect(745, 118, 110, 38);
      ctx.strokeStyle = '#ffe14d';
      ctx.lineWidth = 3;
      [775, 825].forEach(function (cx) {
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 5; a += 0.3) {
          const r = a * 1.1;
          const x = cx + Math.cos(a + t * 8) * r, y = 137 + Math.sin(a + t * 8) * r * 0.9;
          if (a === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });
    }
    ctx.strokeStyle = '#111';                                                 // mouth grille
    ctx.lineWidth = 4;
    for (let k = 0; k < 4; k++) {
      ctx.beginPath(); ctx.moveTo(765 + k * 23, 168); ctx.lineTo(765 + k * 23, 186); ctx.stroke();
    }
    ctx.restore();
  }

  // SPARKS fly every time a part CLANGS into place.
  const SPARK_SPOTS = [[800, 690], [800, 440], [560, 300], [1040, 300], [800, 560], [800, 195]];
  ROBOT_BUILD.forEach(function (time, i) {
    const since = look.built - time - 0.35;   // (0.35 = once it's landed)
    if (since < 0 || since > 0.6) return;
    const spot = SPARK_SPOTS[i];
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = 4;
    for (let k = 0; k < 12; k++) {
      const a = wobbly(k + i * 20) * Math.PI * 2;
      const r1 = since * 320, r2 = r1 + 22;
      ctx.beginPath();
      ctx.moveTo(spot[0] + Math.cos(a) * r1, spot[1] + Math.sin(a) * r1);
      ctx.lineTo(spot[0] + Math.cos(a) * r2, spot[1] + Math.sin(a) * r2);
      ctx.stroke();
    }
  });
}

// ---------------------------------------------------------------------
//  KEYFRAME HELPERS
// ---------------------------------------------------------------------
// keyAt: where should something be at time T? Find the two keyframes T
// is between, and go the right fraction of the way from one to the next.
function keyAt(track, T) {
  if (T <= track[0][0]) return track[0][1];
  for (let i = 0; i < track.length - 1; i++) {
    const a = track[i], b = track[i + 1];
    if (T < b[0]) return lerp(a[1], b[1], (T - a[0]) / (b[0] - a[0]));
  }
  return track[track.length - 1][1];
}
// stepAt: like keyAt, but it SNAPS to each new value (for things like
// which way someone faces, that don't slide smoothly).
function stepAt(track, T) {
  let value = track[0][1];
  track.forEach(function (k) { if (T >= k[0]) value = k[1]; });
  return value;
}
// bumpsAt: jumps! Each [start, end, height] makes a hop that goes up and down.
function bumpsAt(list, T) {
  let up = 0;
  list.forEach(function (j) {
    if (T > j[0] && T < j[1]) up += Math.sin((T - j[0]) / (j[1] - j[0]) * Math.PI) * j[2];
  });
  return up;
}
function isMoving(track, T) { return Math.abs(keyAt(track, T + 0.03) - keyAt(track, T - 0.03)) > 1; }

// ---------------------------------------------------------------------
//  THE BATTLE: who is where, at time T?
// ---------------------------------------------------------------------
// Test Subject 1's CLEVER PLAN: run round and round the robot, faster and
// faster. (a = the angle around the circle.)
const CIRCLE_START = 172, CIRCLE_END = 196;
function circleAngle(T) {
  const s = T - CIRCLE_START;
  return Math.PI + 2 * s + 0.125 * s * s;   // speed goes up and up!
}
const CIRCLE_TOP_SPEED = 2 + 0.25 * (CIRCLE_END - CIRCLE_START);
// The robot keeps spinning after he stops... and slows down, and stops
// facing the front (a whole number of turns). How long does that take?
const SPIN_AT_END = circleAngle(CIRCLE_END) - Math.PI;
const SPIN_STOP = Math.ceil((SPIN_AT_END + CIRCLE_TOP_SPEED * 2.5) / (Math.PI * 2)) * Math.PI * 2;
const SPIN_SLOWDOWN_TIME = 2 * (SPIN_STOP - SPIN_AT_END) / CIRCLE_TOP_SPEED;
const ROBOT_STILL_AT = CIRCLE_END + SPIN_SLOWDOWN_TIME;

function robotPose(T) {
  const pose = { x: keyAt(BOT_X, T), bob: 0, spin: 0, tilt: 0,
                 raiseL: keyAt(ARM_L, T), raiseR: keyAt(ARM_R, T),
                 on: keyAt([[0, 1], [212.5, 1], [215, 0]], T), dizzy: T > 188 && T < 215 };
  BOT_WALKS.forEach(function (w) {                       // stomping makes it bob
    if (T > w[0] && T < w[1]) pose.bob = Math.abs(Math.sin((T - w[0]) / 0.55 * Math.PI)) * 10;
  });
  BOT_TWIRLS.forEach(function (w) {                      // turning round
    if (T > w[0] && T < w[1]) pose.spin = ease((T - w[0]) / (w[1] - w[0])) * Math.PI * 2;
  });
  if (T >= CIRCLE_START && T < CIRCLE_END) pose.spin = circleAngle(T) - Math.PI;   // following him round
  if (T >= CIRCLE_END && T < ROBOT_STILL_AT) {           // ...still spinning, slowing down
    const s = T - CIRCLE_END;
    pose.spin = SPIN_AT_END + CIRCLE_TOP_SPEED * s - 0.5 * (CIRCLE_TOP_SPEED / SPIN_SLOWDOWN_TIME) * s * s;
  }
  if (T >= ROBOT_STILL_AT && T < 208) pose.tilt = Math.sin(T * 3.2) * 0.08;   // wobble, wobble...
  if (T >= 208) {                                        // ...TIMBERRRR!
    const u = Math.min(1, (T - 208) / 3.5);
    pose.tilt = u * u * Math.PI / 2;                     // u * u: slow at first, then FAST
    if (T > 211.5 && T < 211.8) pose.tilt -= Math.sin((T - 211.5) / 0.3 * Math.PI) * 0.05;   // bounce
  }
  return pose;
}

function ts1Pose(T) {
  const pose = { x: keyAt(TS1_X, T), lift: bumpsAt(TS1_JUMPS, T), facing: stepAt(TS1_FACING, T),
                 flip: 0, squash: 1, lean: 0, size: 1, yOff: 0, behind: false,
                 moving: isMoving(TS1_X, T), hidden: T > TS1_HIDDEN[0] && T < TS1_HIDDEN[1] };
  DODGES.forEach(function (when, k) {                    // backflips!
    if (k % 2 === 1 && T > when - 0.1 && T < when + 0.4) pose.flip = -((T - when + 0.1) / 0.5) * Math.PI * 2;
  });
  if (T > 115.2 && T < 123) pose.squash = 0.7;           // crouching behind the rock
  if (T >= CIRCLE_START && T < CIRCLE_END) {             // running round the robot
    const a = circleAngle(T);
    pose.x = 1100 + Math.cos(a) * 380;
    pose.behind = Math.sin(a) < 0;                       // round the back = behind the robot
    pose.yOff = Math.sin(a) * 25;                        // further away = a bit higher up...
    pose.size = 1 + Math.sin(a) * 0.08;                  // ...and a bit smaller
    pose.facing = Math.sin(a) > 0 ? -1 : 1;
    pose.moving = true;
  }
  if (T >= CIRCLE_END && T < 199) {
    pose.x = lerp(1100 + Math.cos(circleAngle(CIRCLE_END)) * 380, 800, (T - CIRCLE_END) / 3);
    pose.facing = pose.x > 800 ? -1 : 1;
    pose.moving = true;
  }
  if (T >= 199 && T < 232) pose.facing = 1;
  if (T > 206.8 && T < 207.6) pose.lean = Math.sin((T - 206.8) / 0.8 * Math.PI) * 0.25;   // boop!
  if (pose.moving) pose.lift += Math.abs(Math.sin(T * 12)) * 12;   // running bounce
  return pose;
}

function ruffPose(T) {
  const pose = { x: keyAt(RUFF_X, T), lift: bumpsAt(RUFF_JUMPS, T), facing: stepAt(RUFF_FACING, T),
                 spin: 0, lying: 0, moving: isMoving(RUFF_X, T), punch: 0,
                 arms: T > 131.5 ? lerp(1, 1.35, ease((T - 131.5) / 3)) : 1, glow: T > 131.5 };
  if (T > 33.3 && T < 36) pose.lift += Math.abs(Math.sin((T - 33.3) * 9)) * 35;   // OW OW OW hops
  RUFF_FLIGHTS.forEach(function (f) {                    // tumbling through the air
    if (T > f[0] && T < f[1]) { pose.spin = (T - f[0]) / (f[1] - f[0]) * Math.PI * 4; pose.moving = false; }
  });
  RUFF_LYING.forEach(function (l) {                      // knocked out... then getting up
    if (T >= l[1] && T < l[2]) pose.lying = 1 - (T - l[1]) / (l[2] - l[1]);
    else if (T >= l[0] && T < l[1]) pose.lying = 1;
  });
  RUFF_PUNCHES.forEach(function (when) {
    const u = T - when;
    if (u > -0.02 && u < 0.35) pose.punch = Math.min(1, (u + 0.02) / 0.08);
    else if (u >= 0.35 && u < 0.5) pose.punch = Math.max(pose.punch, 1 - (u - 0.35) / 0.15);
  });
  return pose;
}

// ---------------------------------------------------------------------
//  THE BATTLE: drawing it all.
// ---------------------------------------------------------------------
function drawField(T) {
  // The sky, which turns into a SUNSET at the very end.
  const sunset = clamp((T - 222) / 14, 0, 1);
  const sky = ctx.createLinearGradient(0, -400, 0, 760);
  sky.addColorStop(0, sunset > 0 ? mixColor([126, 200, 255], [255, 130, 80], sunset) : '#7ec8ff');
  sky.addColorStop(1, sunset > 0 ? mixColor([216, 240, 255], [255, 214, 130], sunset) : '#d8f0ff');
  ctx.fillStyle = sky;
  ctx.fillRect(-1200, -600, 4800, 1500);
  ctx.fillStyle = sunset > 0 ? mixColor([255, 243, 160], [255, 120, 60], sunset) : '#fff3a0';
  ctx.beginPath(); ctx.arc(2000, lerp(120, 560, sunset), 70, 0, Math.PI * 2); ctx.fill();   // the sun
  // Far-away hills.
  ctx.fillStyle = '#86c98a';
  [[200, 300], [900, 380], [1700, 320], [2500, 400]].forEach(function (h) {
    ctx.beginPath(); ctx.ellipse(h[0], 760, h[1] * 1.6, h[1] * 0.55, 0, Math.PI, 0); ctx.fill();
  });

  // THE PRISON (where they escaped from).
  ctx.fillStyle = '#5f6472';
  ctx.fillRect(-600, 150, 1200, 610);
  drawBricks(-600, 150, 1200, 610, '#4d515d');
  ctx.fillStyle = '#3c404a';
  ctx.fillRect(-620, 130, 1240, 30);                       // roof edge
  ctx.fillStyle = '#0b0c10';
  ctx.fillRect(470, 480, 110, 280);                        // the EXIT they ran out of
  ctx.fillStyle = '#1f9d55';
  ctx.fillRect(470, 430, 110, 38);
  ctx.fillStyle = '#eafff0';
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', 525, 459);
  if (T >= 7) {                                            // the giant hole the robot smashed
    ctx.fillStyle = '#07080b';
    ctx.beginPath();
    HOLE_EDGE.forEach(function (r, i) {
      const a = i / HOLE_EDGE.length * Math.PI * 2;
      const x = 330 + Math.cos(a) * 200 * r, y = Math.min(760, 470 + Math.sin(a) * 310 * r);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fill();
  }

  // Grass.
  ctx.fillStyle = '#5dbb63';
  ctx.fillRect(-1200, 760, 4800, 500);
  ctx.fillStyle = '#4ea654';
  ctx.fillRect(-1200, 760, 4800, 10);
}

// Mix two colors: u = 0 is the first one, 1 is the second.
function mixColor(a, b, u) {
  return 'rgb(' + Math.round(lerp(a[0], b[0], u)) + ',' + Math.round(lerp(a[1], b[1], u)) + ',' + Math.round(lerp(a[2], b[2], u)) + ')';
}

// The big rock they hide behind. After the lasers hit it: KABLAM, pieces everywhere!
const ROCK_X = 1750, ROCK_BOOM = 123;
const ROCK_SHAPE = [[-120, 0], [-130, -70], [-80, -150], [10, -175], [90, -140], [130, -60], [120, 0]];
function drawRock(T) {
  if (T < ROCK_BOOM) {
    chunkyShape(ROCK_SHAPE.map(function (pt) { return [ROCK_X + pt[0], 760 + pt[1]]; }), '#8a8f99');
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.ellipse(ROCK_X - 30, 650, 40, 22, -0.4, 0, Math.PI * 2); ctx.fill();
    return;
  }
  const since = T - ROCK_BOOM;
  for (let k = 0; k < 10; k++) {
    const s = Math.min(since, 1.0);   // pieces fly for a second, then lie on the ground
    const x = ROCK_X - 60 + wobbly(k + 300) * 120 + (wobbly(k + 310) - 0.5) * 900 * s;
    const y = Math.min(745, 680 - (300 + wobbly(k + 320) * 500) * s + 0.5 * 2200 * s * s);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(s * (wobbly(k + 330) * 12 - 6));
    chunkyShape([[-22, 12], [-26, -8], [0, -22], [24, -10], [20, 12]], '#8a8f99');
    ctx.restore();
  }
}

function drawBattleRobot(T, pose) {
  if (T < 7) return;                       // still inside the prison!
  let squeeze = Math.cos(pose.spin);       // SPINNING: squish it sideways (that's how you fake 3D turning!)
  if (Math.abs(squeeze) < 0.1) squeeze = squeeze < 0 ? -0.1 : 0.1;
  ctx.save();
  ctx.translate(pose.x, 760 - pose.bob - Math.sin(pose.tilt) * 205 * BIG_SCALE);
  ctx.rotate(pose.tilt);
  ctx.scale(squeeze * BIG_SCALE, BIG_SCALE);
  ctx.translate(-800, -724);
  drawBigRobot(T, { built: 99, on: pose.on, raiseL: pose.raiseL, raiseR: pose.raiseR, dizzy: pose.dizzy });
  ctx.restore();
  // Dizzy stars round its head.
  if (pose.dizzy && pose.tilt < 0.5) {
    for (let k = 0; k < 4; k++) {
      const a = T * 5 + k * Math.PI / 2;
      drawStar(pose.x + Math.cos(a) * 110, 760 - 600 * BIG_SCALE + Math.sin(a) * 20, 16, '#ffe14d');
    }
  }
}

function drawLasers(T, pose) {
  if (T < 116 || T > ROCK_BOOM) return;
  const aimX = keyAt(LASER_AIM, T), aimY = T > 121.5 ? 680 : 745;
  [772, 828].forEach(function (eyeX) {
    const fromX = pose.x + (eyeX - 800) * BIG_SCALE, fromY = 760 - pose.bob + (138 - 724) * BIG_SCALE;
    ctx.lineCap = 'round';
    [['rgba(255,40,40,0.35)', 22], ['#ff3030', 10], ['#fff2f2', 4]].forEach(function (beam) {
      ctx.strokeStyle = beam[0];
      ctx.lineWidth = beam[1];
      ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(aimX + (eyeX - 800) * 0.3, aimY); ctx.stroke();
    });
  });
  // Where they hit: a fizzing hot spot with sparks.
  ctx.fillStyle = 'rgba(255,220,120,0.8)';
  ctx.beginPath(); ctx.arc(aimX, aimY, 18 + Math.sin(T * 40) * 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffe14d';
  ctx.lineWidth = 3;
  for (let k = 0; k < 6; k++) {
    const a = -Math.PI * wobbly(k + Math.floor(T * 20)), r = 30 + wobbly(k + 50) * 25;
    ctx.beginPath(); ctx.moveTo(aimX, aimY); ctx.lineTo(aimX + Math.cos(a) * r, aimY + Math.sin(a) * r); ctx.stroke();
  }
}

function drawBattleTS1(T, pose) {
  if (pose.hidden) return;
  ctx.save();
  ctx.translate(pose.x, 760 + pose.yOff - pose.lift);
  ctx.scale(pose.facing * pose.size, pose.size);
  ctx.translate(0, -110); ctx.rotate(pose.flip); ctx.translate(0, 110);   // backflip round his middle
  ctx.rotate(pose.lean);
  ctx.scale(1 / Math.sqrt(pose.squash), pose.squash);
  ctx.translate(-1000, -760);
  drawPrisoner(T, []);
  ctx.restore();
}

function drawBattleRuff(T, pose) {
  const y = 760 - pose.lift;
  if (pose.glow) {                                         // POWERED UP: a glowing aura!
    const glow = ctx.createRadialGradient(pose.x, y - 130, 20, pose.x, y - 130, 190);
    glow.addColorStop(0, 'rgba(255,230,90,' + (0.35 + Math.sin(T * 8) * 0.1) + ')');
    glow.addColorStop(1, 'rgba(255,230,90,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(pose.x - 200, y - 330, 400, 400);
  }
  // Tumbling or lying down: turn him round his middle.
  const turn = pose.spin + pose.lying * -Math.PI / 2;
  ctx.save();
  ctx.translate(pose.x, y - 110 + pose.lying * 55);
  ctx.rotate(turn);
  ctx.translate(-pose.x, -(y - 110));
  drawRuff(T, { x: pose.x, y: y, facing: pose.facing, arms: pose.arms, punch: pose.punch, still: !pose.moving });
  ctx.restore();
  if (pose.lying > 0.5) {                                  // knocked out: dizzy stars
    for (let k = 0; k < 3; k++) {
      const a = T * 6 + k * 2.1;
      drawStar(pose.x + 60 + Math.cos(a) * 50, 690 + Math.sin(a) * 12, 13, '#ffe14d');
    }
  }
}

// Pop-up words, dust and sparks.
function drawBattleEffects(T) {
  POP_WORDS.forEach(function (w, i) {
    const since = T - w[0];
    if (since < 0 || since > 0.75) return;
    const pop = 0.6 + Math.min(1, since / 0.1) * 0.5;
    ctx.save();
    ctx.translate(w[1], w[2]);
    ctx.rotate(i % 2 ? 0.14 : -0.14);
    ctx.scale(pop, pop);
    ctx.font = '900 80px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 11;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = ['#ffd24d', '#ff7b3a', '#7dffb0', '#ff5d8f'][i % 4];
    ctx.strokeText(w[3], 0, 0);
    ctx.fillText(w[3], 0, 0);
    ctx.restore();
  });
  // Dust where swords slam into the ground.
  SLASHES.concat([73.05]).forEach(function (when, k) {
    const since = T - when - 0.08;
    if (since < 0 || since > 0.9) return;
    const tipX = keyAt(BOT_X, when) + 310;
    ctx.fillStyle = 'rgba(160,140,110,' + (0.8 * (1 - since / 0.9)) + ')';
    for (let j = 0; j < 6; j++) {
      const side = j % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.arc(tipX + side * (20 + since * (80 + j * 20)), 750 - j * 4 - since * 30, 14 + since * 26, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  // A HUGE dust cloud when the robot crashes down.
  const crash = T - 211.5;
  if (crash > 0 && crash < 1.5) {
    ctx.fillStyle = 'rgba(160,140,110,' + (0.85 * (1 - crash / 1.5)) + ')';
    for (let j = 0; j < 14; j++) {
      ctx.beginPath();
      ctx.arc(1100 + j * 50 + (j % 2 ? 1 : -1) * crash * 60, 740 - (j % 3) * 15 - crash * 50, 30 + crash * 50, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // Sparks when fist meets sword.
  CLASHES.forEach(function (when) {
    const since = T - when;
    if (since < 0 || since > 0.4) return;
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = 4;
    for (let k = 0; k < 10; k++) {
      const a = wobbly(k + when * 10) * Math.PI * 2, r1 = since * 300, r2 = r1 + 20;
      ctx.beginPath();
      ctx.moveTo(1255 + Math.cos(a) * r1, 625 + Math.sin(a) * r1);
      ctx.lineTo(1255 + Math.cos(a) * r2, 625 + Math.sin(a) * r2);
      ctx.stroke();
    }
  });
  // Bricks bursting out of the prison wall.
  const burst = T - 7;
  if (burst > 0 && burst < 2) {
    for (let i = 0; i < 16; i++) {
      const x = 330 + (wobbly(i + 400) - 0.3) * 1100 * burst;
      const y = 300 + wobbly(i + 410) * 400 - (200 + wobbly(i + 420) * 500) * burst + 0.5 * 2200 * burst * burst;
      if (y > 1000) continue;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(burst * (wobbly(i + 430) * 14 - 7));
      ctx.fillStyle = '#5f6472';
      ctx.fillRect(-28, -12, 56, 24);
      ctx.strokeStyle = '#4d515d';
      ctx.lineWidth = 4;
      ctx.strokeRect(-28, -12, 56, 24);
      ctx.restore();
    }
  }
  // HIGH FIVE! A burst of stars.
  const five = T - 219.5;
  if (five > 0 && five < 0.8) {
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * Math.PI * 2;
      drawStar(1010 + Math.cos(a) * five * 200, 560 + Math.sin(a) * five * 200, 14, '#ffe14d');
    }
  }
}

function drawBattle(T) {
  ctx.save();
  // Shake the camera for every BOOM, CLANG and CRASH.
  let shake = 0;
  SHAKES.forEach(function (sh) {
    const since = T - sh[0];
    if (since > 0 && since < 0.5) shake = Math.max(shake, (1 - since / 0.5) * sh[1]);
  });
  BOT_WALKS.forEach(function (w) {
    if (T > w[0] && T < w[1] && ((T - w[0]) % 0.55) < 0.12) shake = Math.max(shake, 6);
  });
  ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  drawField(T);
  const robot = robotPose(T), ts1 = ts1Pose(T), ruff = ruffPose(T);
  if (ts1.behind) drawBattleTS1(T, ts1);     // round the back of the robot? Draw him FIRST.
  drawBattleRobot(T, robot);
  drawBattleRuff(T, ruff);
  if (!ts1.behind) drawBattleTS1(T, ts1);
  drawRock(T);                               // the rock goes in FRONT, so they can hide behind it
  drawLasers(T, robot);
  drawBattleEffects(T);
  ctx.restore();

  // The end: fade to black.
  if (T > 237) {
    ctx.fillStyle = 'rgba(0,0,0,' + ease((T - 237) / 3) + ')';
    ctx.fillRect(-2000, -2000, 10000, 6000);
  }
}

// A white circle (or oval) with a black outline: his head, hands and feet.
function dudeCircle(x, y, width, height) {
  ctx.fillStyle = DUDE_WHITE;
  ctx.beginPath(); ctx.ellipse(x, y, width, height, 0, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = DUDE_LINE_WIDTH;
  ctx.strokeStyle = DUDE_LINE;
  ctx.stroke();
}
// An arm: a black line from the shoulder, with a little circle hand on the end.
function dudeArm(shoulderX, shoulderY, handX, handY) {
  ctx.lineWidth = DUDE_LINE_WIDTH;
  ctx.strokeStyle = DUDE_LINE;
  ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY); ctx.lineTo(handX, handY); ctx.stroke();
  dudeCircle(handX, handY, 9, 9);
}

// A five-pointed star.
function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const len = i % 2 === 0 ? r : r * 0.45;         // points out, points in, out, in...
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
  }
  ctx.closePath();
  ctx.fill();
}

// LIGHTNING: the whole screen flashes white, then fades.
function drawLightning(t) {
  if (t < 0 || t > 1.2) return;
  let bright = Math.max(0, 1 - t / 0.6);
  if (t > 0.15 && t < 0.25) bright = 0.2;            // a quick flicker in the middle
  ctx.fillStyle = 'rgba(255,255,255,' + bright + ')';
  ctx.fillRect(-2000, -2000, 6000, 6000);
}

// THE TITLE CARD.
function drawTitleCard(t) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  const grow = ease(t / 0.8);                          // the title zooms in
  ctx.save();
  ctx.translate(STAGE_W / 2, 420);
  ctx.scale(0.6 + grow * 0.4, 0.6 + grow * 0.4);
  ctx.globalAlpha = grow;
  ctx.shadowColor = '#5dff8f';
  ctx.shadowBlur = 40;
  ctx.fillStyle = '#d8ffe4';
  ctx.textAlign = 'center';
  ctx.font = '900 150px system-ui, sans-serif';
  ctx.fillText('REINCARNATED', 0, 0);
  ctx.restore();
  if (t > 1.5) {
    ctx.globalAlpha = ease((t - 1.5) / 0.5);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '600 50px system-ui, sans-serif';
    ctx.fillText('Episode 1', STAGE_W / 2, 540);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------
//  WORDS AT THE BOTTOM (subtitles). The letters appear one at a time,
//  like someone is typing, and each letter makes a little talking blip.
// ---------------------------------------------------------------------
const LETTERS_PER_SECOND = 15;   // about as fast as the voice talks
let talking = false;          // is someone mid-sentence? (makes the mouth move)
let talker = '';              // WHO is talking (so only THEIR mouth moves)
let lettersShown = {};        // how many letters of each line we've typed so far

function drawWords(now) {
  talking = false;
  const here = findShot(showTime);
  const line = here.shot.lines.filter(function (l) { return here.t >= l.at; }).pop();
  if (!line) return;
  talker = line.who;
  if (line.say === '') return;   // an empty line = no words on screen at all
  const count = Math.min(line.say.length, Math.floor((here.t - line.at) * LETTERS_PER_SECOND));
  const key = here.start + ':' + line.at;
  // A brand new line? SAY IT out loud!
  if (mode === 'playing' && lettersShown[key] === undefined) {
    lettersShown[key] = 0;
    sayOutLoud(line);
  }
  // A blip for every new letter (but not for spaces).
  if (mode === 'playing' && count > (lettersShown[key] || 0)) {
    const letter = line.say[count - 1];
    if (letter !== ' ' && count % 2 === 0) talkBlip(line.who);
    lettersShown[key] = count;
  }
  // Is the scientist's mouth moving? With a real voice: while it's talking.
  // Without one: while the letters are still appearing.
  if (myVoice) talking = false;            // your voice moves the mouth by itself
  else if (englishVoices().length) talking = voiceTalking;
  else if (line.who && count < line.say.length) talking = true;
  if (line.who === 'RUFF' && !myVoice) {
    talking = here.t - line.at < barkWords(line).length * BARK_GAP;
  }

  // The dark box.
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(120, 760, 1360, 110);
  // Who's talking (no name means it's the narrator).
  if (line.who) {
    ctx.fillStyle = '#5dff8f';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(line.who, 150, 748);
  }
  ctx.fillStyle = '#ffffff';
  ctx.font = (line.who ? '' : 'italic ') + '46px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(line.say.slice(0, count), STAGE_W / 2, 832);
}

// ---------------------------------------------------------------------
//  PLAYING THE SHOW: play, pause, watch again.
// ---------------------------------------------------------------------
let mode = 'ready';           // 'ready', 'playing', 'paused' or 'done'
let showTime = 0;             // how many seconds into the episode we are
let lastFrame = performance.now();

function press() {
  startAudio();
  if (mode === 'ready' || mode === 'done') {
    showTime = 0;
    lettersShown = {};
    stopTalking();
    stopMetal();
    loadRecordings();
    mode = 'playing';
  } else if (mode === 'playing') {
    mode = 'paused';
    if (audio) audio.suspend();   // pausing the show pauses the sound too...
    if (window.speechSynthesis) window.speechSynthesis.pause();   // ...and the voice
  } else if (mode === 'paused') {
    mode = 'playing';
    if (window.speechSynthesis) window.speechSynthesis.resume();
  }
}
// ---------------------------------------------------------------------
//  SKIPPING. The show is just "how many seconds in are we?" (showTime),
//  so skipping is easy: change that number, and the next picture we
//  draw is from the new moment!
// ---------------------------------------------------------------------

// When does each shot start? (Shot 1 at 0 seconds, shot 2 at 6 seconds...)
function shotStarts() {
  const starts = [];
  let start = 0;
  SHOTS.forEach(function (shot) { starts.push(start); start += shot.length; });
  return starts;
}

function jumpTo(time) {
  startAudio();
  stopTalking();               // stop whatever someone was saying
  stopMetal();                 // and stop the band
  lettersShown = {};           // so the line we land on gets said from the start
  showTime = clamp(time, 0, EPISODE_LENGTH);
  if (mode === 'ready' || mode === 'done') { loadRecordings(); mode = 'playing'; }
  if (showTime >= EPISODE_LENGTH) mode = 'done';
}

// ⏭ Skip forward: to the start of the NEXT shot.
function skipForward() {
  const next = shotStarts().find(function (start) { return start > showTime + 0.01; });
  jumpTo(next === undefined ? EPISODE_LENGTH : next);
}

// ⏮ Skip back: to the start of THIS shot. Already at the start? Then the one before.
function skipBack() {
  const starts = shotStarts();
  const now = mode === 'done' ? EPISODE_LENGTH : showTime;
  let target = 0;
  starts.forEach(function (start) { if (start < now - 1.5) target = start; });
  jumpTo(target);
}

document.getElementById('skipForward').addEventListener('click', skipForward);
document.getElementById('skipBack').addEventListener('click', skipBack);
document.getElementById('playPause').addEventListener('click', press);
['pointerdown', 'touchstart', 'mousedown'].forEach(function (t) {
  document.getElementById('controls').addEventListener(t, function (e) { e.stopPropagation(); });
});

// Tapping the screen: on the progress bar, jump there. Anywhere else: play/pause.
canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  const stageTapX = (e.clientX - stageX) / stageScale;   // where you tapped, on the stage
  const stageTapY = (e.clientY - stageY) / stageScale;
  if (stageTapY > STAGE_H - 50 && stageTapY <= STAGE_H + 30 && mode !== 'ready') {
    jumpTo(EPISODE_LENGTH * clamp(stageTapX / STAGE_W, 0, 1));
  } else {
    press();
  }
});
window.addEventListener('keydown', function (e) {
  if (!studio.hidden) return;             // keys in the studio aren't for the show
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
  if (e.code === 'KeyR') { mode = 'ready'; press(); }        // R = start again
  if (e.code === 'ArrowRight') skipForward();
  if (e.code === 'ArrowLeft') skipBack();
});

// ---------------------------------------------------------------------
//  THE VOICE STUDIO SCREEN.
// ---------------------------------------------------------------------
const studio = document.getElementById('studio');
const studioButton = document.getElementById('studioButton');
let microphone = null;      // the microphone, once you've said it's OK to use it
let recorder = null;        // the thing that records, while it's recording
let recordingKey = null;    // which line is being recorded right now
let listening = null;       // a recording playing in the studio

studioButton.addEventListener('click', function (e) {
  e.stopPropagation();
  mode = 'ready';
  showTime = 0;
  stopTalking();
  studio.hidden = false;
  fillStudio();
});
document.getElementById('studioDone').addEventListener('click', function () {
  if (recorder) recorder.stop();
  // Turn the microphone off, so the "recording" light on the computer goes off too.
  if (microphone) { microphone.getTracks().forEach(function (t) { t.stop(); }); microphone = null; }
  studio.hidden = true;
});
['pointerdown', 'touchstart', 'mousedown'].forEach(function (t) {
  studio.addEventListener(t, function (e) { e.stopPropagation(); });
  studioButton.addEventListener(t, function (e) { e.stopPropagation(); });
});

// Draw a box for every line, with its buttons.
function fillStudio() {
  const list = document.getElementById('lineList');
  list.innerHTML = '';
  allLines().forEach(function (line) {
    const key = voiceKey(line);
    const box = document.createElement('div');
    box.className = 'line' + (recordingKey === key ? ' recording' : '');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = line.who || 'THE NARRATOR';
    const say = document.createElement('div');
    say.className = 'say';
    say.textContent = line.say;
    box.appendChild(who);
    box.appendChild(say);
    list.appendChild(box);

    voiceBox('get', key).then(function (blob) {
      const rec = document.createElement('button');
      rec.className = 'rec';
      rec.textContent = recordingKey === key ? '■ Stop' : (blob ? '● Record again' : '● Record');
      rec.onclick = function () { recordingKey === key ? recorder.stop() : startRecording(key); };
      box.appendChild(rec);
      if (blob) {
        const play = document.createElement('button');
        play.className = 'play';
        play.textContent = '▶ Listen';
        play.onclick = function () {
          if (listening) listening.pause();
          listening = new Audio(URL.createObjectURL(blob));
          listening.play();
        };
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '🗑 Delete';
        del.onclick = function () { voiceBox('delete', key).then(fillStudio); };
        box.appendChild(play);
        box.appendChild(del);
      }
      const status = document.createElement('span');
      status.className = 'status';
      status.textContent = recordingKey === key ? '🔴 RECORDING... say it now!'
                         : blob ? '🎙️ your voice' : '🤖 computer voice';
      box.appendChild(status);
    }).catch(function () {
      say.textContent += '  (This browser cannot save recordings 😢)';
    });
  });
}

// RECORD! The first time, the browser asks: "Can this page use the microphone?"
function startRecording(key) {
  if (recorder) recorder.stop();
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    alert('Sorry, this browser cannot record. 😢');
    return;
  }
  const getMic = microphone ? Promise.resolve(microphone)
                            : navigator.mediaDevices.getUserMedia({ audio: true });
  getMic.then(function (mic) {
    microphone = mic;
    const pieces = [];                      // the recording comes out in little pieces
    const thisOne = new MediaRecorder(mic);
    recorder = thisOne;
    recordingKey = key;
    thisOne.ondataavailable = function (e) { pieces.push(e.data); };
    thisOne.onstop = function () {
      // Glue the pieces together into one recording, and save it.
      const blob = new Blob(pieces, { type: thisOne.mimeType });
      // (Only say "nothing's recording" if a newer recording hasn't started.)
      if (recorder === thisOne) { recorder = null; recordingKey = null; }
      voiceBox('put', key, blob).then(fillStudio);
    };
    thisOne.start();
    fillStudio();
  }).catch(function () {
    alert('The microphone said no. 🎙️❌ Check that a microphone is plugged in, and that you tapped "Allow".');
  });
}

// Play any sound effects whose time came up since the last frame.
function playSounds(before, after) {
  let start = 0;
  SHOTS.forEach(function (shot) {
    shot.sounds.forEach(function (s) {
      if (before < start + s.at && start + s.at <= after) s.play();
    });
    (shot.bonks || []).forEach(function (b) {
      if (before < start + b && start + b <= after) bonkSound();
    });
    start += shot.length;
  });
}

function frame(nowMs) {
  const dt = Math.min(0.1, (nowMs - lastFrame) / 1000);
  lastFrame = nowMs;
  if (mode === 'playing') {
    const before = showTime;
    showTime = Math.min(EPISODE_LENGTH, showTime + dt);
    playSounds(before, showTime);
    // Bubble sounds now and then, while we're in the lab.
    if (labOnScreen && Math.random() < dt * 2.5) bubbleSound();
    if (showTime >= EPISODE_LENGTH) mode = 'done';
  }
  studioButton.style.display = mode === 'playing' ? 'none' : '';
  draw();
  requestAnimationFrame(frame);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Move onto the stage, and don't let anything draw outside it.
  ctx.save();
  ctx.translate(stageX, stageY);
  ctx.scale(stageScale, stageScale);
  ctx.beginPath(); ctx.rect(0, 0, STAGE_W, STAGE_H); ctx.clip();

  // THE CAMERA: slide and zoom from where the shot starts to where it ends.
  const here = findShot(showTime);
  let cam;
  if (here.shot.follow) {
    cam = here.shot.follow(here.t);              // a camera that chases someone
  } else {
    const from = here.shot.cam[0];
    const to = here.shot.cam[1] || from;
    const u = ease(here.t / here.shot.length);
    cam = { x: lerp(from.x, to.x, u), y: lerp(from.y, to.y, u), zoom: lerp(from.zoom, to.zoom, u) };
  }
  ctx.save();
  ctx.translate(STAGE_W / 2, STAGE_H / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
  labOnScreen = false;
  here.shot.draw(here.t);
  ctx.restore();

  drawWords();

  // Before it starts (or after it ends): a big PLAY button.
  if (mode === 'ready' || mode === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    ctx.textAlign = 'center';
    if (mode === 'done') {
      ctx.fillStyle = '#5dff8f';
      ctx.font = '900 70px system-ui, sans-serif';
      ctx.fillText('TO BE CONTINUED...', STAGE_W / 2, 250);
    }
    ctx.fillStyle = '#5dff8f';
    ctx.beginPath(); ctx.arc(STAGE_W / 2, 450, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(STAGE_W / 2 - 30, 400); ctx.lineTo(STAGE_W / 2 + 50, 450); ctx.lineTo(STAGE_W / 2 - 30, 500);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '600 40px system-ui, sans-serif';
    ctx.fillText(mode === 'done' ? 'Tap to watch again' : 'Tap to watch', STAGE_W / 2, 610);
    ctx.font = '30px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('A cartoon by Max', STAGE_W / 2, 660);
  }
  if (mode === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    ctx.fillStyle = '#fff';
    ctx.fillRect(STAGE_W / 2 - 50, 380, 35, 140);   // the two bars of the pause sign
    ctx.fillRect(STAGE_W / 2 + 15, 380, 35, 140);
    ctx.textAlign = 'center';
    ctx.font = '600 36px system-ui, sans-serif';
    ctx.fillText('Paused: tap to keep watching', STAGE_W / 2, 590);
  }

  // How far through the episode are we? A green bar along the bottom.
  // (Tap it to jump!) The little lines show where each shot starts.
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0, STAGE_H - 14, STAGE_W, 14);
  ctx.fillStyle = '#5dff8f';
  ctx.fillRect(0, STAGE_H - 14, STAGE_W * showTime / EPISODE_LENGTH, 14);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  shotStarts().forEach(function (start) {
    if (start > 0) ctx.fillRect(STAGE_W * start / EPISODE_LENGTH - 2, STAGE_H - 14, 4, 14);
  });
  ctx.restore();
}

requestAnimationFrame(frame);
</script>
</body>
</html>
