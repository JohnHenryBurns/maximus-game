<canvas id="game"></canvas>
<script>
// =====================================================================
// SNAKE FIGHT - two snakes, one box, one keyboard.
//
// GREEN plays with W A S D.  PINK plays with the arrow keys.
// Hit a wall, your own tail, or THEIRS, and you lose the round.
// First to five wins the match.
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---- the arena, measured in squares ----
const COLS = 39, ROWS = 25;      // odd numbers, so there is a middle square
const WIN_SCORE = 5;
const START_LEN = 5;
const GROW_EVERY = 16;           // both snakes grow anyway, so rounds always end
// About three squares in every hundred hold an apple. Worked out from
// the arena size rather than typed in, so the board stays this busy even
// if COLS and ROWS ever change.
const FOOD_COUNT = Math.round(COLS * ROWS * 0.03);

// =====================================================================
// THE SKINS.
//
// A skin is just a few colours plus a PATTERN - a rule for what colour
// each segment should be. The rule is applied by segColor() further
// down, so adding a brand new look here needs no new drawing code at
// all, unless you invent a whole new kind of pattern.
// =====================================================================
const SKINS = [
  { id: 'green',  name: 'GREEN',     body: '#7fdf3f', alt: '#5cb02a', head: '#c6ff6a', pattern: 'solid' },
  { id: 'pink',   name: 'BUBBLEGUM', body: '#ff5fa8', alt: '#d63d84', head: '#ffa8d2', pattern: 'solid' },
  { id: 'tiger',  name: 'TIGER',     body: '#ff9d1f', alt: '#2b1a08', head: '#ffc45c', pattern: 'stripe' },
  { id: 'fire',   name: 'FIRE',      body: '#ffe14a', alt: '#e01b1b', head: '#fff2a0', pattern: 'fade' },
  { id: 'ice',    name: 'ICE',       body: '#eaffff', alt: '#2b8fd6', head: '#ffffff', pattern: 'fade' },
  { id: 'slime',  name: 'SLIME',     body: '#8ce33f', alt: '#3d7a1a', head: '#c4ff8a', pattern: 'spots' },
  { id: 'robot',  name: 'ROBOT',     body: '#b8c0c8', alt: '#3ad6e0', head: '#e8f0f4', pattern: 'stripe' },
  { id: 'ghost',  name: 'GHOST',     body: '#dfe8ff', alt: '#9aa8d0', head: '#ffffff', pattern: 'solid', alpha: 0.5 },
  { id: 'stinker', name: 'STINKER',  body: '#9a8b3f', alt: '#6f5f22', head: '#c8b85a', pattern: 'spots' },
  { id: 'shadow', name: 'SHADOW',    body: '#2a2a3a', alt: '#5a5a7a', head: '#8a8ab0', pattern: 'stripe' },
  // ---- these two have to be earned ----
  { id: 'gold',   name: 'GOLD',      body: '#f2c236', alt: '#fff3b0', head: '#fff8d0', pattern: 'stripe',
    lock: 'win a whole match' },
  { id: 'rainbow', name: 'RAINBOW',  body: '#ff0000', alt: '#00ff00', head: '#ffffff', pattern: 'rainbow',
    lock: 'win a match 5-0' },
];
let unlocked = {};
try { unlocked = JSON.parse(localStorage.getItem('snake_unlocks')) || {}; } catch (e) { unlocked = {}; }
function isUnlocked(sk) { return !sk.lock || unlocked[sk.id]; }
function unlock(id, why) {
  if (unlocked[id]) return false;
  unlocked[id] = true;
  localStorage.setItem('snake_unlocks', JSON.stringify(unlocked));
  newlyUnlocked = { id, why };
  return true;
}
let newlyUnlocked = null;

// mix two colours together - used by the FADE pattern
function mixHex(a, b, f) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * f)).join(',') + ')';
}
function darker(hex, f) {
  const p = [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * f));
  return 'rgb(' + p.join(',') + ')';
}
// THE PATTERN RULE: what colour is segment number j?
function segColor(sk, j, len, t) {
  switch (sk.pattern) {
    case 'stripe':  return (j % 2) ? sk.alt : sk.body;
    case 'spots':   return (j % 4 === 1) ? sk.alt : sk.body;
    case 'fade':    return mixHex(sk.body, sk.alt, Math.min(1, j / Math.max(1, len - 1)));
    case 'rainbow': return 'hsl(' + Math.floor((j * 22 + t * 90) % 360) + ', 92%, 58%)';
    default:        return sk.body;
  }
}

// which skin each player is wearing right now
let picks = [0, 1];
try {
  const saved = JSON.parse(localStorage.getItem('snake_picks'));
  if (Array.isArray(saved) && saved.length === 2) picks = saved;
} catch (e) {}
function skinOf(i) { return SKINS[picks[i]] || SKINS[i]; }

// ---- the two players ----
// Everything about a player lives in one object. Want a third snake one
// day? Add a third object - the rest of the code already loops over them.
const PLAYERS = [
  { name: 'GREEN', body: '#7fdf3f', head: '#c6ff6a', dead: '#3a5c22',
    keys: { w: 'up', a: 'left', s: 'down', d: 'right' },
    start: { x: 6, y: 12 }, dir: 'right', side: 'left' },
  { name: 'PINK', body: '#ff5fa8', head: '#ffa8d2', dead: '#5c2240',
    keys: { ArrowUp: 'up', ArrowLeft: 'left', ArrowDown: 'down', ArrowRight: 'right' },
    start: { x: COLS - 7, y: 12 }, dir: 'left', side: 'right' },
];
const STEPS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

let snakes = [];                 // the live snakes, one per player
let foods = [];                  // apples, all over the place
let scores = [0, 0];
let screen = 'title';            // 'title' | 'countdown' | 'play' | 'roundover' | 'matchover'
let countdown = 0;
let roundTimer = 0;
let stepTimer = 0;
let stepTime = 0.125;            // seconds between moves - lower is faster
let ticks = 0;
let particles = [];
let shake = 0;
let lastResult = null;           // what happened at the end of the round
let touchMode = false;           // switches the thumb pads on
let headbutt = null;             // set when a round ends nose to nose
let skinRects = [];              // the tappable < > arrows on the title screen
</script>
<script>
// ---------------------------------------------------------------------
// SOUND - all made out of maths, no files to download
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, len, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol === undefined ? 0.08 : vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + len);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + len + 0.02);
}
function crashSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(320, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, audio.currentTime + 0.4);
  g.gain.setValueAtTime(0.18, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.45);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.5);
}
function thud() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(120, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(55, audio.currentTime + 0.18);
  g.gain.setValueAtTime(0.25, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.25);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.3);
}
function winJingle() {
  [523, 659, 784, 1047].forEach((n, i) => {
    setTimeout(() => beep(n, 0.18, 'square', 0.1), i * 110);
  });
}

// ---------------------------------------------------------------------
// STARTING A ROUND
// ---------------------------------------------------------------------
function newSnake(p) {
  // built facing the way it will travel, tail trailing behind the head
  const body = [];
  const [dx, dy] = STEPS[p.dir];
  for (let i = 0; i < START_LEN; i++) {
    body.push({ x: p.start.x - dx * i, y: p.start.y - dy * i });
  }
  return { p, body, dir: p.dir, next: p.dir, grow: 0, alive: true };
}
// find one empty square: not a snake, not already an apple
function freeSquare() {
  for (let tries = 0; tries < 400; tries++) {
    const x = 1 + Math.floor(Math.random() * (COLS - 2));
    const y = 1 + Math.floor(Math.random() * (ROWS - 2));
    if (snakes.some(s => s.body.some(b => b.x === x && b.y === y))) continue;
    if (foods.some(f => f.x === x && f.y === y)) continue;
    // a random pop means they do not all pulse in time with each other
    return { x, y, pop: Math.random() * 6 };
  }
  return null;                   // board is stuffed - no room left
}
// keep the orchard topped up. Called at the start, and every time one
// gets eaten, so the board never runs dry.
function topUpFood() {
  let guard = 0;
  while (foods.length < FOOD_COUNT && guard++ < FOOD_COUNT * 2) {
    const f = freeSquare();
    if (!f) break;
    foods.push(f);
  }
}
function startRound() {
  snakes = PLAYERS.map(newSnake);
  foods = [];
  topUpFood();
  ticks = 0;
  stepTimer = 0;
  particles = [];
  lastResult = null;
  countdown = 3.0;
  screen = 'countdown';
}
function startMatch() {
  newlyUnlocked = null;
  scores = [0, 0];
  stepTime = 0.125;
  startRound();
}

// ---------------------------------------------------------------------
// ONE MOVE OF THE GAME
//
// Both snakes move at the SAME MOMENT. That matters: it means we work
// out both new heads first, and only then ask who crashed. Do it one
// snake at a time and whoever moves first would win every head-on.
// ---------------------------------------------------------------------
function occupied(cell, ignoreTails) {
  for (const s of snakes) {
    // the last segment is about to move away, so it does not count
    // (unless that snake is growing this move and keeps it)
    const end = ignoreTails && !s.grow ? s.body.length - 1 : s.body.length;
    for (let i = 0; i < end; i++) {
      if (s.body[i].x === cell.x && s.body[i].y === cell.y) return true;
    }
  }
  return false;
}
function step() {
  ticks++;
  // 1. everybody turns
  for (const s of snakes) {
    if (OPPOSITE[s.next] !== s.dir) s.dir = s.next;   // no turning back on yourself
  }
  // 2. work out where every head is going, before judging anyone
  const heads = snakes.map(s => {
    const [dx, dy] = STEPS[s.dir];
    return { x: s.body[0].x + dx, y: s.body[0].y + dy };
  });
  // 3. everyone about to eat keeps their tail this move. This has to
  // happen BEFORE we judge crashes, because a growing snake holds on to
  // its tail, so that square is not free for anyone else.
  heads.forEach((h, i) => {
    if (foods.some(f => f.x === h.x && f.y === h.y)) snakes[i].grow += 4;
  });
  if (ticks % GROW_EVERY === 0) snakes.forEach(s => { s.grow += 1; });
  // 4. NOW judge the crashes
  const doomed = [false, false];
  heads.forEach((h, i) => {
    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS) doomed[i] = true;
    else if (occupied(h, true)) doomed[i] = true;
  });
  // =====================================================================
  // THE HEAD-BUTT.
  //
  // Nose to nose, both snakes crashed into a head at the very same
  // instant - so "whoever hits a head wins" needs a tie-break, or they
  // would both win at once. The tie-break is LENGTH: the bigger snake
  // shoves the smaller one off and takes the round.
  //
  // That is what makes the apples matter. Every one you eat is another
  // segment of head-butting power. And if you are exactly the same
  // length, neither of you wins - you both go, which is only fair.
  // =====================================================================
  headbutt = null;
  if (heads[0].x === heads[1].x && heads[0].y === heads[1].y) {
    const len0 = snakes[0].body.length, len1 = snakes[1].body.length;
    if (len0 === len1) {
      doomed[0] = doomed[1] = true;                    // dead heat, both go
    } else {
      const winner = len0 > len1 ? 0 : 1;
      doomed[1 - winner] = true;                       // the smaller one loses
      headbutt = { winner, len0, len1 };
    }
  }
  // 5. move everyone who survived
  heads.forEach((h, i) => {
    const s = snakes[i];
    if (doomed[i]) return;
    s.body.unshift(h);
    if (s.grow > 0) s.grow--; else s.body.pop();
    const bite = foods.findIndex(f => f.x === h.x && f.y === h.y);
    if (bite >= 0) {
      foods.splice(bite, 1);
      topUpFood();                 // one gone, another appears elsewhere
      beep(880, 0.07, 'square', 0.09);
      beep(1320, 0.05, 'square', 0.05);
    }
  });
  if (doomed[0] || doomed[1]) endRound(doomed);
}
</script>
<script>
// ---------------------------------------------------------------------
// ENDING A ROUND
// ---------------------------------------------------------------------
function boom(cell, color) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 40 + Math.random() * 260;
    particles.push({
      x: cell.x + 0.5, y: cell.y + 0.5,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5 + Math.random() * 0.5, color,
    });
  }
}
function endRound(doomed) {
  doomed.forEach((d, i) => {
    if (!d) return;
    snakes[i].alive = false;
    boom(snakes[i].body[0], skinOf(i).head);
  });
  crashSound();
  shake = 16;
  if (doomed[0] && doomed[1]) {
    lastResult = { draw: true, text: 'DEAD HEAT! same length, both go.' };
  } else {
    const winner = doomed[0] ? 1 : 0;
    scores[winner]++;
    if (headbutt) {
      // a head-butt deserves a bigger bang than an ordinary crash
      shake = 26;
      boom(snakes[winner].body[0], '#ffffff');
      thud();
      lastResult = { winner,
        text: skinOf(winner).name + ' HEAD-BUTTS! ' +
              headbutt[winner === 0 ? 'len0' : 'len1'] + ' vs ' +
              headbutt[winner === 0 ? 'len1' : 'len0'] };
    } else {
      lastResult = { winner, text: skinOf(winner).name + ' WINS THE ROUND' };
    }
  }
  roundTimer = 1.8;
  screen = 'roundover';
}
function afterRound() {
  if (scores[0] >= WIN_SCORE || scores[1] >= WIN_SCORE) {
    screen = 'matchover';
    winJingle();
    // rewards for the winner
    unlock('gold', 'you won a whole match');
    if (Math.min(scores[0], scores[1]) === 0) unlock('rainbow', 'a 5-0 whitewash!');
    // confetti in the winner's colour
    const w = scores[0] > scores[1] ? 0 : 1;
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * COLS, y: -1 - Math.random() * 6,
        vx: (Math.random() - 0.5) * 60, vy: 60 + Math.random() * 140,
        life: 3, color: Math.random() < 0.5 ? skinOf(w).head : skinOf(w).body,
      });
    }
    return;
  }
  // rounds speed up a little as the match goes on
  stepTime = Math.max(0.075, stepTime - 0.004);
  startRound();
}

// ---------------------------------------------------------------------
// UPDATING
// ---------------------------------------------------------------------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  for (const pt of particles) {
    pt.x += pt.vx * dt / 24;
    pt.y += pt.vy * dt / 24;
    pt.vy += dt * 9;
    pt.life -= dt;
  }
  particles = particles.filter(pt => pt.life > 0);
  for (const f of foods) f.pop += dt;

  if (screen === 'countdown') {
    const was = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== was && now > 0) beep(440, 0.12, 'square', 0.08);
    if (countdown <= 0) { beep(880, 0.2, 'square', 0.1); screen = 'play'; }
    return;
  }
  if (screen === 'roundover') {
    roundTimer -= dt;
    if (roundTimer <= 0) afterRound();
    return;
  }
  if (screen !== 'play') return;
  stepTimer += dt;
  while (stepTimer >= stepTime) {
    stepTimer -= stepTime;
    if (screen === 'play') step();
  }
}

// ---------------------------------------------------------------------
// DRAWING
// ---------------------------------------------------------------------
function layout() {
  const W = canvas.width, H = canvas.height;
  const hud = Math.min(74, H * 0.11);
  const pad = 10;
  const cell = Math.floor(Math.min((W - pad * 2) / COLS, (H - hud - pad * 2) / ROWS));
  const gw = cell * COLS, gh = cell * ROWS;
  return { W, H, hud, cell, ox: Math.floor((W - gw) / 2), oy: hud + Math.floor((H - hud - gh) / 2), gw, gh };
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
</script>
<script>
function draw() {
  const L = layout();
  const { W, H, cell, ox, oy, gw, gh } = L;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b1410';
  ctx.fillRect(0, 0, W, H);
  // the whole arena wobbles when somebody crashes
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // ---- the box they fight in ----
  ctx.fillStyle = '#101d17';
  ctx.fillRect(ox, oy, gw, gh);
  ctx.strokeStyle = '#2b4a38';
  ctx.lineWidth = 1;
  for (let x = 1; x < COLS; x++) {
    ctx.beginPath(); ctx.moveTo(ox + x * cell, oy); ctx.lineTo(ox + x * cell, oy + gh); ctx.stroke();
  }
  for (let y = 1; y < ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(ox, oy + y * cell); ctx.lineTo(ox + gw, oy + y * cell); ctx.stroke();
  }
  ctx.strokeStyle = '#7fdf8f';
  ctx.lineWidth = 3;
  ctx.strokeRect(ox - 1.5, oy - 1.5, gw + 3, gh + 3);

  // ---- the apples ----
  for (const f of foods) {
    const pulse = 1 + Math.sin(f.pop * 6) * 0.12;
    const s = cell * 0.66 * pulse;
    const cx = ox + f.x * cell + cell / 2, cy = oy + f.y * cell + cell / 2;
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath(); ctx.arc(cx, cy, s / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';       // a little shine
    ctx.beginPath(); ctx.arc(cx - s * 0.16, cy - s * 0.16, s * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fdf3f';
    ctx.fillRect(cx - 1.5, cy - s / 2 - cell * 0.14, 3, cell * 0.16);
  }

  // ---- the snakes ----
  const now = Date.now() / 1000;
  snakes.forEach((s, i) => {
    const sk = skinOf(i);
    ctx.globalAlpha = sk.alpha || 1;
    s.body.forEach((b, j) => {
      const x = ox + b.x * cell, y = oy + b.y * cell;
      const inset = j === 0 ? 1 : 2;
      const live = j === 0 ? sk.head : segColor(sk, j, s.body.length, now);
      ctx.fillStyle = s.alive ? live : darker(sk.body, 0.32);
      roundRect(x + inset, y + inset, cell - inset * 2, cell - inset * 2, Math.max(2, cell * 0.28));
      ctx.fill();
      if (j === 0 && s.alive) {
        ctx.globalAlpha = 1;
        // eyes, looking where it is going
        const [dx, dy] = STEPS[s.dir];
        const ex = x + cell / 2 + dx * cell * 0.18, ey = y + cell / 2 + dy * cell * 0.18;
        const sx = Math.abs(dx) ? 0 : cell * 0.18, sy = Math.abs(dy) ? 0 : cell * 0.18;
        ctx.fillStyle = '#0b1410';
        ctx.beginPath();
        ctx.arc(ex - sx, ey - sy, Math.max(1.4, cell * 0.1), 0, Math.PI * 2);
        ctx.arc(ex + sx, ey + sy, Math.max(1.4, cell * 0.1), 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = sk.alpha || 1;
      }
    });
    ctx.globalAlpha = 1;
  });

  // ---- sparks ----
  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
    ctx.fillStyle = pt.color;
    ctx.fillRect(ox + pt.x * cell - 2, oy + pt.y * cell - 2, 5, 5);
  }
  ctx.globalAlpha = 1;

  // ---- the scoreboard ----
  ctx.textAlign = 'center';
  const midY = L.hud * 0.52;
  PLAYERS.forEach((p, i) => {
    const sk = skinOf(i);
    const x = i === 0 ? W * 0.26 : W * 0.74;
    ctx.fillStyle = sk.head;
    ctx.font = 'bold ' + Math.min(20, W / 26) + 'px monospace';
    ctx.fillText(sk.name, x, midY - 6);
    // one pip per round won
    const pips = WIN_SCORE, size = Math.min(13, W / 44), gap = size * 1.7;
    for (let k = 0; k < pips; k++) {
      const px = x - (pips - 1) * gap / 2 + k * gap;
      ctx.fillStyle = k < scores[i] ? sk.body : 'rgba(255,255,255,0.14)';
      ctx.beginPath(); ctx.arc(px, midY + 14, size / 2, 0, Math.PI * 2); ctx.fill();
    }
  });
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = 'bold ' + Math.min(15, W / 34) + 'px monospace';
  ctx.fillText('FIRST TO ' + WIN_SCORE, W / 2, midY + 6);

  drawScreens(L);
  if (touchMode && (screen === 'play' || screen === 'countdown')) drawPads(L);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
</script>
<script>
// ---- the title, countdown, and end-of-round messages ----
function drawScreens(L) {
  const { W, H } = L;
  ctx.textAlign = 'center';
  if (screen === 'title') {
    ctx.fillStyle = 'rgba(6, 12, 9, 0.9)';
    ctx.fillRect(0, 0, W, H);
    const big = Math.min(52, W / 11);
    ctx.fillStyle = '#7fdf3f';
    ctx.font = 'bold ' + big + 'px monospace';
    ctx.fillText('SNAKE', W / 2 - big * 1.6, H * 0.13);
    ctx.fillStyle = '#ff5fa8';
    ctx.fillText('FIGHT', W / 2 + big * 1.6, H * 0.13);

    // ---- one wardrobe each ----
    skinRects = [];
    PLAYERS.forEach((p, i) => {
      const cx = i === 0 ? W * 0.27 : W * 0.73;
      const sk = skinOf(i);
      const top = H * 0.26;
      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      roundRect(cx - W * 0.21, top - 26, W * 0.42, H * 0.36, 12);
      ctx.fill();
      ctx.strokeStyle = sk.body;
      ctx.lineWidth = 3;
      roundRect(cx - W * 0.21, top - 26, W * 0.42, H * 0.36, 12);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = 'bold ' + Math.min(15, W / 42) + 'px monospace';
      ctx.fillText(i === 0 ? 'PLAYER 1   -   W A S D' : 'PLAYER 2   -   ARROW KEYS', cx, top);

      // a little snake, wearing the skin, wriggling
      const cellP = Math.min(26, W / 34);
      const t = Date.now() / 1000;
      const segs = 7;
      ctx.globalAlpha = sk.alpha || 1;
      for (let j = segs - 1; j >= 0; j--) {
        const sx = cx - (segs - 1) * cellP / 2 + j * cellP;
        const sy = top + H * 0.11 + Math.sin(t * 3 + j * 0.7) * cellP * 0.42;
        ctx.fillStyle = j === 0 ? sk.head : segColor(sk, j, segs, t);
        roundRect(sx - cellP / 2 + 2, sy - cellP / 2 + 2, cellP - 4, cellP - 4, cellP * 0.3);
        ctx.fill();
        if (j === 0) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#0b1410';
          ctx.beginPath();
          ctx.arc(sx + cellP * 0.12, sy - cellP * 0.14, cellP * 0.11, 0, Math.PI * 2);
          ctx.arc(sx + cellP * 0.12, sy + cellP * 0.14, cellP * 0.11, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = sk.alpha || 1;
        }
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = sk.head;
      ctx.font = 'bold ' + Math.min(26, W / 26) + 'px monospace';
      ctx.fillText(sk.name, cx, top + H * 0.21);

      // the arrows you press to change it (and can tap on a phone)
      const ay = top + H * 0.21 - Math.min(9, W / 90);
      const ar = Math.min(20, W / 40);
      [[-1, cx - W * 0.16], [1, cx + W * 0.16]].forEach(([dir, ax]) => {
        ctx.fillStyle = 'rgba(255,255,255,0.09)';
        ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = sk.body;
        ctx.font = 'bold ' + ar * 1.1 + 'px monospace';
        ctx.fillText(dir < 0 ? '<' : '>', ax, ay + ar * 0.38);
        skinRects.push({ x: ax, y: ay, r: ar * 1.4, player: i, step: dir });
      });
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = Math.min(13, W / 48) + 'px monospace';
      ctx.fillText(i === 0 ? 'A / D to change' : 'left / right to change', cx, top + H * 0.28);
    });

    // ---- the rules, in one line each ----
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = Math.min(14, W / 40) + 'px monospace';
    ctx.fillText('wall, your own tail, or theirs - you lose the round', W / 2, H * 0.7);
    ctx.fillStyle = '#ffd83d';
    ctx.fillText('HEAD TO HEAD? the LONGER snake wins - so EAT', W / 2, H * 0.7 + 22);
    ctx.fillStyle = '#ff6b60';
    ctx.fillText(FOOD_COUNT + ' apples on the board. first to ' + WIN_SCORE + ' rounds.',
                 W / 2, H * 0.7 + 44);
    const locked = SKINS.filter(sk => !isUnlocked(sk));
    if (locked.length) {
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('locked: ' + locked.map(sk => sk.name + ' (' + sk.lock + ')').join('   '),
                   W / 2, H * 0.7 + 66);
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
    ctx.font = 'bold ' + Math.min(24, W / 24) + 'px monospace';
    ctx.fillText('SPACE  /  TAP THE MIDDLE  =  FIGHT', W / 2, H * 0.93);
  } else if (screen === 'countdown') {
    const n = Math.ceil(countdown);
    const grow = 1 + (Math.ceil(countdown) - countdown) * 0.5;
    ctx.save();
    ctx.translate(W / 2, H * 0.5);
    ctx.scale(grow, grow);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(96, W / 6) + 'px monospace';
    ctx.fillText(n > 0 ? String(n) : 'GO!', 0, 0);
    ctx.restore();
  } else if (screen === 'roundover' && lastResult) {
    ctx.fillStyle = 'rgba(6, 12, 9, 0.55)';
    ctx.fillRect(0, H * 0.38, W, H * 0.16);
    ctx.fillStyle = lastResult.draw ? '#ffd83d' : skinOf(lastResult.winner).head;
    ctx.font = 'bold ' + Math.min(40, W / 15) + 'px monospace';
    ctx.fillText(lastResult.text, W / 2, H * 0.49);
  } else if (screen === 'matchover') {
    const w = scores[0] > scores[1] ? 0 : 1;
    ctx.fillStyle = 'rgba(6, 12, 9, 0.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = skinOf(w).head;
    ctx.font = 'bold ' + Math.min(56, W / 11) + 'px monospace';
    ctx.fillText(skinOf(w).name + ' WINS!', W / 2, H * 0.42);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.min(30, W / 20) + 'px monospace';
    ctx.fillText(scores[0] + '  -  ' + scores[1], W / 2, H * 0.53);
    if (newlyUnlocked) {
      const sk = SKINS.find(x => x.id === newlyUnlocked.id);
      const throb = 1 + Math.sin(Date.now() / 160) * 0.07;
      ctx.save();
      ctx.translate(W / 2, H * 0.63);
      ctx.scale(throb, throb);
      ctx.fillStyle = '#ffd83d';
      ctx.font = 'bold ' + Math.min(26, W / 24) + 'px monospace';
      ctx.fillText('NEW SKIN UNLOCKED: ' + sk.name + '!', 0, 0);
      ctx.font = Math.min(15, W / 38) + 'px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(newlyUnlocked.why, 0, 24);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + Math.sin(Date.now() / 300) * 0.35) + ')';
    ctx.font = 'bold ' + Math.min(22, W / 26) + 'px monospace';
    ctx.fillText('SPACE  /  TAP  =  REMATCH   (arrows change skins)', W / 2, H * 0.75);
  }
  ctx.textAlign = 'left';
}

// ---- thumb pads, one per player, so two people can play on a phone ----
let padRects = [];
function drawPads(L) {
  const { W, H } = L;
  const r = Math.min(38, W / 11);
  padRects = [];
  PLAYERS.forEach((p, i) => {
    const cx = i === 0 ? r * 2.9 : W - r * 2.9;
    const cy = H - r * 2.6;
    [['up', 0, -1], ['down', 0, 1], ['left', -1, 0], ['right', 1, 0]].forEach(([dir, dx, dy]) => {
      const x = cx + dx * r * 1.5, y = cy + dy * r * 1.5;
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.strokeStyle = skinOf(i).body;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = skinOf(i).head;
      ctx.font = 'bold ' + r * 0.6 + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText({ up: '▲', down: '▼', left: '◀', right: '▶' }[dir], x, y + r * 0.2);
      padRects.push({ x, y, r: r * 0.78, player: i, dir });
    });
  });
  ctx.textAlign = 'left';
}
</script>
<script>
// ---------------------------------------------------------------------
// CONTROLS
//
// Each player has their own set of keys, written down in PLAYERS above.
// We just look the pressed key up in both lists - so adding a third
// player later would need no new code down here at all.
// ---------------------------------------------------------------------
function turn(playerIndex, dir) {
  const s = snakes[playerIndex];
  if (!s || !s.alive) return;
  // You may not turn back on yourself. We compare against the direction
  // actually MOVED, not the one queued, or a quick double-tap could spin
  // you into your own neck.
  if (OPPOSITE[dir] === s.dir) return;
  s.next = dir;
}
// Step to the next skin you are allowed to wear: skip the locked ones,
// and skip whatever the other player is already wearing, so you can
// never end up as two identical snakes.
function cycleSkin(player, step) {
  const other = picks[1 - player];
  let i = picks[player];
  for (let tries = 0; tries < SKINS.length; tries++) {
    i = (i + step + SKINS.length) % SKINS.length;
    if (i !== other && isUnlocked(SKINS[i])) {
      picks[player] = i;
      localStorage.setItem('snake_picks', JSON.stringify(picks));
      beep(500 + player * 160, 0.05, 'square', 0.06);
      return;
    }
  }
}

function anyKeyScreens() {
  if (screen === 'title') { startMatch(); return true; }
  if (screen === 'matchover') { startMatch(); return true; }
  return false;
}
addEventListener('keydown', e => {
  ensureAudio();
  // On the title and win screens, left/right browses your wardrobe and
  // SPACE starts the fight. In game, the very same keys steer.
  if (screen === 'title' || screen === 'matchover') {
    if (e.key === ' ') { startMatch(); e.preventDefault(); return; }
    PLAYERS.forEach((p, i) => {
      const dir = p.keys[e.key] || p.keys[e.key.toLowerCase()];
      if (dir === 'left') { cycleSkin(i, -1); e.preventDefault(); }
      if (dir === 'right') { cycleSkin(i, 1); e.preventDefault(); }
    });
    return;
  }
  PLAYERS.forEach((p, i) => {
    const dir = p.keys[e.key] || p.keys[e.key.toLowerCase()];
    if (dir) { turn(i, dir); e.preventDefault(); }
  });
});

// ---- touch: thumb pads, plus swipe anywhere on your half ----
const swipes = new Map();
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  touchMode = touchMode || e.pointerType === 'touch';
  if (screen === 'title' || screen === 'matchover') {
    for (const b of skinRects) {
      if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r) {
        cycleSkin(b.player, b.step);
        return;
      }
    }
    startMatch();                 // tapped anywhere else: fight
    return;
  }
  // did they hit one of the pad buttons?
  for (const b of padRects) {
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r) {
      turn(b.player, b.dir);
      return;
    }
  }
  // otherwise start tracking a swipe, on whichever half they touched
  swipes.set(e.pointerId, { x: e.clientX, y: e.clientY,
                            player: e.clientX < canvas.width / 2 ? 0 : 1 });
});
canvas.addEventListener('pointermove', e => {
  const sw = swipes.get(e.pointerId);
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.abs(dx) < 26 && Math.abs(dy) < 26) return;      // not a swipe yet
  turn(sw.player, Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? 'right' : 'left')
    : (dy > 0 ? 'down' : 'up'));
  swipes.delete(e.pointerId);
});
canvas.addEventListener('pointerup', e => swipes.delete(e.pointerId));
canvas.addEventListener('pointercancel', e => swipes.delete(e.pointerId));
addEventListener('touchstart', () => { touchMode = true; }, { passive: true });

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
snakes = PLAYERS.map(newSnake);      // something to look at behind the title
topUpFood();
requestAnimationFrame(loop);
</script>
