<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DEEP BLACK</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #04060d; overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 10px;
    text-align: center; color: #8fa8c8; font-size: 14px;
    pointer-events: none; text-shadow: 0 2px 6px #000;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud">MOUSE = steer &nbsp;&nbsp; W = thrust &nbsp;&nbsp; S = brake &nbsp;&nbsp; A D = roll &nbsp;&nbsp; <b>Q = lock on</b> &nbsp;&nbsp; T = auto-aim &nbsp;&nbsp; CLICK = shoot</div>

<script>
// ===================================================================
//  DEEP BLACK
// ===================================================================
//  No gravity. No brakes. No up.
//
//  That last one is why this game is built differently from every other
//  one in the arcade. Bob, the racer and the wasteland all store which
//  way you're facing as two ANGLES - yaw and pitch - and that works
//  perfectly while there's a floor under you and "up" never moves.
//
//  Point straight up in space and angles fall apart. Yaw stops meaning
//  anything, because spinning about a pole you're already pointing
//  along does nothing at all. It's a real thing with a real name -
//  gimbal lock - and it has crashed actual spacecraft.
//
//  So your ship doesn't remember angles. It remembers THREE ARROWS:
//  which way is forward, which way is up, which way is right. Turning
//  tips the arrows. There is no pole to get stuck at, because there is
//  no pole.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;

  function fitScreen() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fitScreen);

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // The same always-the-same random you've used in every game since the
  // racer. Now it takes three numbers, because space has three
  // directions to be lost in instead of two.
  function hash(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }
  function hash3(a, b, c) {
    return hash(a * 374.761 + b * 668.265 + c * 155.109);
  }


// -------------------------------------------------------------------
//  ARROWS
// -------------------------------------------------------------------
//  An arrow is just three numbers: how far along x, y and z. Everything
//  below is what you can do with them.
// -------------------------------------------------------------------

  function vec(x, y, z) { return { x: x, y: y, z: z }; }

  function add(a, b)    { return vec(a.x + b.x, a.y + b.y, a.z + b.z); }
  function sub(a, b)    { return vec(a.x - b.x, a.y - b.y, a.z - b.z); }
  function mul(a, k)    { return vec(a.x * k, a.y * k, a.z * k); }
  function dot(a, b)    { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function len(a)       { return Math.sqrt(dot(a, a)); }

  function norm(a) {
    const l = len(a) || 1;
    return vec(a.x / l, a.y / l, a.z / l);
  }

  // The cross product: give it two arrows and it hands back one at
  // right angles to BOTH. It's how we work out "right" from "forward"
  // and "up" without ever mentioning an angle.
  function cross(a, b) {
    return vec(a.y * b.z - a.z * b.y,
               a.z * b.x - a.x * b.z,
               a.x * b.y - a.y * b.x);
  }

  // TURN ONE ARROW TOWARDS ANOTHER.
  //
  // This is the whole steering system. Give it two arrows at right
  // angles and an angle, and it spins them both round in the flat sheet
  // they share - like turning a steering wheel that happens to be
  // floating in space at some odd tilt.
  //
  //   forward and right, spun about up    = yaw
  //   forward and up,    spun about right = pitch
  //   right and up,      spun about forward = roll
  //
  // Three uses of one function, and not an angle stored anywhere.
  function spinPair(a, b, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return [
      vec(a.x * c + b.x * s, a.y * c + b.y * s, a.z * c + b.z * s),
      vec(b.x * c - a.x * s, b.y * c - a.y * s, b.z * c - a.z * s)
    ];
  }

  // Tiny rounding errors build up over thousands of turns until the
  // three arrows aren't quite at right angles any more and the ship
  // starts to smear. This nudges them straight again. Cheap insurance,
  // run every frame, and you would spend a very long time hunting the
  // bug it prevents.
  function tidy(o) {
    o.fwd = norm(o.fwd);
    o.right = norm(cross(o.up, o.fwd));
    o.up = cross(o.fwd, o.right);
  }


// -------------------------------------------------------------------
//  THE CAMERA - and why it's simpler than the other games'
// -------------------------------------------------------------------
//  Every other game's project() spins the world by a yaw angle, then
//  tilts it by a pitch angle. This one doesn't spin anything. It asks
//  three questions with three dot products:
//
//     how far to my RIGHT is it?
//     how far ABOVE me?
//     how far in FRONT?
//
//  A dot product answers exactly that: how much of one arrow points
//  along another. Three of them and you're done - and because it never
//  mentions an angle, it works upside down, sideways, spinning, any
//  way at all.
// -------------------------------------------------------------------

  const cam = {
    pos: vec(0, 0, 0),
    fwd: vec(0, 0, 1), up: vec(0, 1, 0), right: vec(1, 0, 0)
  };

  function focal() { return H * 0.78; }

  function project(p) {
    const d = sub(p, cam.pos);
    const z = dot(d, cam.fwd);
    return {
      x: W / 2 + dot(d, cam.right) * focal() / z,
      y: H / 2 - dot(d, cam.up) * focal() / z,
      depth: z
    };
  }


// -------------------------------------------------------------------
//  THE FACE LIST - furthest first, same as always
// -------------------------------------------------------------------

  const SEE = 1400;          // how far you can see before it's just black

  let faces = [];

  function shade(rgb, k) { return [rgb[0] * k, rgb[1] * k, rgb[2] * k]; }

  // Out here things don't fade into fog, they fade into the DARK. Same
  // slide-between-two-things sum, mixing towards black instead.
  function dim(rgb, depth) {
    const t = clamp(depth / SEE, 0, 1);
    const k = 1 - t * 0.88;
    return 'rgb(' + (rgb[0] * k | 0) + ',' +
                    (rgb[1] * k | 0) + ',' +
                    (rgb[2] * k | 0) + ')';
  }

  function addFace(pts, rgb) {
    const flat = [];
    let total = 0;

    for (const p of pts) {
      const s = project(p);
      if (s.depth < 0.6) return;      // behind you - the maths breaks
      flat.push(s);
      total += s.depth;
    }

    const depth = total / flat.length;
    if (depth > SEE) return;

    faces.push({ points: flat, depth: depth, colour: dim(rgb, depth) });
  }

  // A BOX THAT CAN POINT ANY WAY AT ALL.
  //
  // The other games' boxes could spin left and right and nod up and
  // down. Out here a thing can be at any tilt in any direction, so
  // instead of angles we hand it the same three arrows the ship uses:
  // its own forward, up and right. Then a corner is just
  //
  //     middle + right*a + up*b + forward*c
  //
  // which is three multiplies and an add, and works at any attitude.
  function addBox(mid, o, w, h, d, rgb) {
    const hw = w / 2, hh = h / 2, hd = d / 2;

    function corner(a, b, c) {
      return vec(
        mid.x + o.right.x * a + o.up.x * b + o.fwd.x * c,
        mid.y + o.right.y * a + o.up.y * b + o.fwd.y * c,
        mid.z + o.right.z * a + o.up.z * b + o.fwd.z * c);
    }

    const c = [
      corner(-hw, -hh, -hd), corner(hw, -hh, -hd),
      corner(hw, -hh,  hd),  corner(-hw, -hh, hd),
      corner(-hw,  hh, -hd), corner(hw,  hh, -hd),
      corner(hw,  hh,  hd),  corner(-hw,  hh, hd)
    ];

    addFace([c[4], c[5], c[6], c[7]], shade(rgb, 1.18));   // top
    addFace([c[0], c[3], c[2], c[1]], shade(rgb, 0.55));   // bottom
    addFace([c[0], c[1], c[5], c[4]], shade(rgb, 0.80));   // back
    addFace([c[3], c[7], c[6], c[2]], shade(rgb, 1.00));   // front
    addFace([c[0], c[4], c[7], c[3]], shade(rgb, 0.68));   // left
    addFace([c[1], c[2], c[6], c[5]], shade(rgb, 0.90));   // right
  }

  // A box that isn't tilted at all - handy for things that don't care.
  const FLAT = { right: vec(1, 0, 0), up: vec(0, 1, 0), fwd: vec(0, 0, 1) };


// -------------------------------------------------------------------
//  YOUR SHIP
// -------------------------------------------------------------------

  const ship = {
    pos: vec(0, 0, 0),
    vel: vec(0, 0, 0),

    fwd: vec(0, 0, 1), up: vec(0, 1, 0), right: vec(1, 0, 0),

    health: 100,
    cool: 0,
    hurtFlash: 0,
    thrusting: 0,
    kills: 0
  };

  const THRUST   = 34;     // how hard the engine pushes
  const BOOST    = 78;
  const BRAKE    = 1.7;    // how fast the retros kill your drift
  const TOP      = 190;    // fastest you can go
  const TURN     = 1.9;    // how fast you can swing the nose
  const ROLL     = 2.6;
  const GUN_COOL = 0.13;
  const BOLT_SPD = 420;

  let clock = 0;
  let state = 'play';
  let deadTimer = 0;
  let shake = 0;


// -------------------------------------------------------------------
//  ASTEROIDS
// -------------------------------------------------------------------
//  Space is chopped into invisible CUBES - the same trick as the
//  wasteland's squares, with one more direction to it. For every cube
//  near you we ask hash3: is there a rock here, how big, which way is
//  it tumbling?
//
//  Nothing is stored. It goes on forever in six directions.
// -------------------------------------------------------------------

  // A 3D GRID IS A DIFFERENT ANIMAL TO A 2D ONE.
  //
  // The wasteland checked a square of cells around you - 11 by 11 was
  // 121. Space has a third direction, so the same reach is 11 by 11 by
  // 11, which is 1,331. Reaching twice as far costs EIGHT times as much
  // out here instead of four.
  //
  // First try was 105-unit cells out to 1400: 29 cubed, 24,389 cells,
  // every frame. Bigger cells and a shorter reach bring that to 1,331 -
  // eighteen times less work for a view you can't tell apart.
  const CELL = 150;
  const ROCK_SEE = 780;

  const ROCK_GREY = [104, 100, 96];
  const ROCK_WARM = [116, 96, 78];
  const ROCK_COLD = [88, 96, 112];
  const ROCK_ORE  = [150, 120, 70];

  // Worked out once per cell and remembered, same as the wasteland's
  // props - the answer can't change, so asking twice is wasted breath.
  const rockCache = new Map();

  function rockAt(gx, gy, gz) {
    const key = gx + ',' + gy + ',' + gz;
    if (rockCache.has(key)) return rockCache.get(key);
    if (rockCache.size > 9000) rockCache.clear();

    const rk = buildRock(gx, gy, gz);
    rockCache.set(key, rk);
    return rk;
  }

  function buildRock(gx, gy, gz) {
    const r = hash3(gx, gy, gz);
    if (r > 0.18) return null;                 // most of space is empty

    const size = 8 + hash3(gx + 7, gy, gz) * 26;

    return {
      pos: vec(
        gx * CELL + (hash3(gx + 1, gy, gz) - 0.5) * CELL * 0.7,
        gy * CELL + (hash3(gx, gy + 1, gz) - 0.5) * CELL * 0.7,
        gz * CELL + (hash3(gx, gy, gz + 1) - 0.5) * CELL * 0.7),
      size: size,
      ore: hash3(gx + 3, gy + 3, gz + 3) > 0.86,
      spin: hash3(gx + 5, gy, gz) * 0.5 + 0.05,
      tilt: hash3(gx, gy + 5, gz) * 6.28,
      colour: [ROCK_GREY, ROCK_WARM, ROCK_COLD][
        Math.floor(hash3(gx + 9, gy, gz) * 3)]
    };
  }

  // The rock's own three arrows, tumbling slowly as time goes on.
  function rockFrame(rk) {
    const a = rk.tilt + clock * rk.spin;
    const o = {
      right: vec(1, 0, 0), up: vec(0, 1, 0), fwd: vec(0, 0, 1)
    };
    let p = spinPair(o.fwd, o.right, a);
    o.fwd = p[0]; o.right = p[1];
    p = spinPair(o.fwd, o.up, a * 0.6);
    o.fwd = p[0]; o.up = p[1];
    tidy(o);
    return o;
  }

  // THE ROCKS NEAR YOU, WORKED OUT ONCE A FRAME.
  //
  // Everything wants this list - the drawing, your hull, and every
  // single bolt in the air. Before this, each bolt swept its own cube
  // of space, which with a dozen bolts up was thousands of cells of the
  // same question asked over and over.
  //
  // Ask once. Hand everybody the answer.
  let nearRocks = [];

  function gatherRocks() {
    nearRocks.length = 0;

    const reach = Math.ceil(ROCK_SEE / CELL);
    const cx = Math.round(ship.pos.x / CELL);
    const cy = Math.round(ship.pos.y / CELL);
    const cz = Math.round(ship.pos.z / CELL);

    for (let gx = cx - reach; gx <= cx + reach; gx++) {
      for (let gy = cy - reach; gy <= cy + reach; gy++) {
        for (let gz = cz - reach; gz <= cz + reach; gz++) {
          const rk = rockAt(gx, gy, gz);
          if (!rk) continue;

          const d = len(sub(rk.pos, ship.pos));
          if (d > ROCK_SEE) continue;

          rk.away = d;
          nearRocks.push(rk);
        }
      }
    }
  }

  function drawRocks() {
    for (const rk of nearRocks) {
      // Behind you? Don't build it. addFace would bin it anyway, but
      // only after doing the maths for all eight corners of every lump.
      if (dot(sub(rk.pos, ship.pos), cam.fwd) < -rk.size * 2) continue;

      const o = rockFrame(rk);
      const s = rk.size;

      // Far off it's one lump. Close up it's a lump with lumps on it.
      addBox(rk.pos, o, s, s * 0.86, s * 0.94, rk.colour);

      if (rk.away < 330) {
        for (let i = 0; i < 4; i++) {
          const a = hash3(rk.pos.x + i, rk.pos.y, rk.pos.z) * 6.28;
          const b = hash3(rk.pos.x, rk.pos.y + i, rk.pos.z) * 3.14;
          const bump = mul(vec(Math.cos(a) * Math.sin(b),
                               Math.cos(b),
                               Math.sin(a) * Math.sin(b)), s * 0.42);
          const bs = s * (0.3 + hash3(rk.pos.x, rk.pos.y, rk.pos.z + i) * 0.3);
          addBox(add(rk.pos, bump), o, bs, bs, bs, shade(rk.colour, 0.9));
        }

        // A seam of something worth having.
        if (rk.ore) addBox(rk.pos, o, s * 1.02, s * 0.22, s * 0.24, ROCK_ORE);
      }
    }
  }


// -------------------------------------------------------------------
//  STARS
// -------------------------------------------------------------------
//  Infinitely far away, so they never get closer no matter how hard you
//  burn. That's the point of them: they're the only thing out here that
//  tells you you're turning, because everything else is too far away to
//  slide past.
// -------------------------------------------------------------------

  const STARS = [];
  for (let i = 0; i < 420; i++) {
    const a = hash(i * 3 + 1) * 6.28;
    const b = Math.acos(hash(i * 7 + 2) * 2 - 1);
    STARS.push({
      dir: vec(Math.cos(a) * Math.sin(b), Math.cos(b), Math.sin(a) * Math.sin(b)),
      bright: 0.35 + hash(i * 11 + 3) * 0.65
    });
  }

  function drawStars() {
    for (const st of STARS) {
      const z = dot(st.dir, cam.fwd);
      if (z <= 0.05) continue;                 // behind you

      const x = W / 2 + dot(st.dir, cam.right) * focal() / z;
      const y = H / 2 - dot(st.dir, cam.up) * focal() / z;
      if (x < 0 || x > W || y < 0 || y > H) continue;

      const g = 150 + st.bright * 105 | 0;
      ctx.fillStyle = 'rgb(' + g + ',' + g + ',' + (g + 12) + ')';
      ctx.fillRect(x, y, st.bright > 0.8 ? 2 : 1, st.bright > 0.8 ? 2 : 1);
    }
  }


// -------------------------------------------------------------------
//  THINGS THAT SHOOT BACK
// -------------------------------------------------------------------

  const ENEMY_HP    = 4;
  const ENEMY_SPEED = 74;
  const ENEMY_TURN  = 1.15;
  const ENEMY_RANGE = 560;
  const ENEMY_MAX   = 7;

  // HOW BIG THEY ARE. Maximus wanted them bigger, so this went from 1
  // to 2.4 - about two and a half times.
  //
  // And THE HITBOX IS WORKED OUT FROM IT, not typed in separately. The
  // shot test used to be a flat 11, which was about right for the old
  // size and would have been a hole you could fly a bolt through once
  // the ship was two and a half times wider. You'd have been shooting
  // at the middle of something and watching it sail on.
  //
  // One number, one source. Grow the ship and the target grows with it.
  const ENEMY_SCALE = 2.4;
  const ENEMY_R     = 11 * ENEMY_SCALE;

  let enemies = [];
  let bolts   = [];
  let bits    = [];

  let spawnTimer = 3;

  function spawnEnemy() {
    if (enemies.length >= ENEMY_MAX) return;

    // Somewhere on a sphere around you, well out of sight.
    const a = Math.random() * 6.28;
    const b = Math.acos(Math.random() * 2 - 1);
    const dir = vec(Math.cos(a) * Math.sin(b), Math.cos(b), Math.sin(a) * Math.sin(b));

    enemies.push({
      pos: add(ship.pos, mul(dir, 700 + Math.random() * 400)),
      vel: vec(0, 0, 0),
      fwd: vec(0, 0, 1), up: vec(0, 1, 0), right: vec(1, 0, 0),
      hp: ENEMY_HP,
      cool: Math.random() * 2,
      hitFlash: 0
    });
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      e.hitFlash = Math.max(0, e.hitFlash - dt * 4);

      const toYou = sub(ship.pos, e.pos);
      const d = len(toYou) || 1;
      const want = mul(toYou, 1 / d);

      // ---- TURN TOWARDS YOU ---------------------------------------
      // How far off is he? Steer by however much of "the way to you"
      // points along his own right and up. No angles, no atan2 - just
      // two dot products saying "you're a bit that way".
      const offRight = dot(want, e.right);
      const offUp    = dot(want, e.up);

      let p = spinPair(e.fwd, e.right, clamp(offRight, -1, 1) * ENEMY_TURN * dt);
      e.fwd = p[0]; e.right = p[1];
      p = spinPair(e.fwd, e.up, clamp(offUp, -1, 1) * ENEMY_TURN * dt);
      e.fwd = p[0]; e.up = p[1];
      tidy(e);

      // ---- FLY ------------------------------------------------------
      // Hangs back at about 330. That went up with their size - at the
      // old 260 a ship two and a half times bigger fills the screen and
      // you can't see the fight for the enemy.
      const push = d > 330 ? 1 : -0.5;
      e.vel = add(e.vel, mul(e.fwd, ENEMY_SPEED * push * dt));

      const sp = len(e.vel);
      if (sp > 150) e.vel = mul(e.vel, 150 / sp);

      e.pos = add(e.pos, mul(e.vel, dt));

      // ---- SHOOT ----------------------------------------------------
      e.cool -= dt;
      if (e.cool <= 0 && d < ENEMY_RANGE && dot(e.fwd, want) > 0.96) {
        e.cool = 1.1 + Math.random() * 0.6;
        bolts.push({
          pos: add(e.pos, mul(e.fwd, 14)),
          vel: mul(e.fwd, BOLT_SPD * 0.55),
          life: 3.5, mine: false, colour: [255, 120, 90]
        });
        beep(220, 90, 0.16, 0.1);
      }
    }
  }

  // A dart. Long body, two swept wings, an engine that burns when the
  // throttle's open.
  //
  // EVERY number is multiplied by k, so one value grows or shrinks the
  // whole ship without it coming apart - the gaps stretch by exactly as
  // much as the pieces do. Same idea as CANNON_SIZE on Bob.
  function drawShipModel(o, pos, body, glow, thrust, k) {
    k = k || 1;

    addBox(pos, o, 3.2 * k, 2.0 * k, 13 * k, body);
    addBox(add(pos, mul(o.fwd, 6.5 * k)), o,
           1.8 * k, 1.3 * k, 4.5 * k, shade(body, 1.15));

    for (const side of [-1, 1]) {
      addBox(add(add(pos, mul(o.right, side * 4.4 * k)), mul(o.fwd, -1.5 * k)),
             o, 6.0 * k, 0.7 * k, 5.5 * k, shade(body, 0.85));
      addBox(add(add(pos, mul(o.right, side * 7.0 * k)), mul(o.fwd, -3.0 * k)),
             o, 1.0 * k, 2.6 * k, 3.0 * k, shade(body, 0.7));
    }

    addBox(add(pos, mul(o.up, 1.4 * k)), o, 2.0 * k, 1.2 * k, 3.4 * k, glow);

    if (thrust > 0.02) {
      const flare = (3 + thrust * 9) * k;
      addBox(add(pos, mul(o.fwd, -7 * k - flare * 0.4)), o,
             2.0 * k, 2.0 * k, flare,
             [120 + 130 * thrust, 180 + 60 * thrust, 255]);
    }
  }

  // WHAT YOU CAN SEE OF YOUR OWN SHIP FROM INSIDE IT.
  //
  // Not the whole model - most of it is behind your head. Just the nose
  // out in front and the wings off to either side, which is exactly what
  // you'd have in view sat in the seat.
  //
  // These matter more than they look. They're the only things on screen
  // that stay put while everything else moves, and without them your eye
  // has nothing to hold on to - you stop feeling like a ship and start
  // feeling like a floating eyeball.
  function drawCockpitParts() {
    const o = ship;
    const p = ship.pos;

    // EVERYTHING HERE HAD TO MOVE FORWARD, and it's the same reason
    // twice. Things get bigger the closer they are - that's the divide
    // in project(). The nose started 5 units from the eye and came out
    // 384 pixels across, a slab over the middle of the screen. And the
    // wings started BEHIND the camera, so they were culled and never
    // appeared at all.
    //
    // Pushed out to 13 and 18 they land where they belong: a small nose
    // at the bottom and two wings in the lower corners.

    addBox(add(add(p, mul(o.fwd, 18)), mul(o.up, -2.8)), o,
           2.0, 1.2, 8.0, [78, 112, 152]);
    addBox(add(add(p, mul(o.fwd, 23.5)), mul(o.up, -2.9)), o,
           1.2, 0.9, 4.0, [96, 132, 172]);

    for (const side of [-1, 1]) {
      addBox(add(add(add(p, mul(o.right, side * 7.0)), mul(o.fwd, 13)),
                 mul(o.up, -3.4)), o,
             7.0, 0.7, 6.5, [70, 100, 138]);

      // The gun pod on the tip - and it's where the bolts really come
      // from, so your own shots leave from the right place.
      addBox(add(add(add(p, mul(o.right, side * 9.8)), mul(o.fwd, 15.5)),
                 mul(o.up, -3.4)), o,
             1.1, 1.1, 5.0, [50, 74, 104]);
    }

    // No engine flare out here: the engines are behind your head, and a
    // thing behind the camera can't be drawn. The dashboard glow does
    // that job instead.
  }

  function drawEnemies() {
    for (const e of enemies) {
      const body = e.hitFlash > 0.1
        ? [255, 220, 220]
        : [150, 60, 60];
      drawShipModel(e, e.pos, body, [255, 150, 70], 0.5, ENEMY_SCALE);
    }
  }


// -------------------------------------------------------------------
//  TARGET LOCK
// -------------------------------------------------------------------
//  Press Q and the computer picks whoever's most worth shooting - close,
//  and roughly in front. Press it again to move on to the next one.
//
//  The box round them is the small part. The useful part is the LEAD
//  MARKER: a second ring showing where to point so that your bolt and
//  their ship turn up in the same place at the same moment.
//
//  You cannot hit a moving thing by aiming at it. By the time your shot
//  arrives it has gone somewhere else. Every gunner in history has had
//  to solve this, and out here it matters even more, because nothing
//  slows down - a ship drifting sideways keeps drifting sideways.
// -------------------------------------------------------------------

  let target = null;
  const LOCK_RANGE = 1200;

  // How good a target is this? Being in front counts for more than
  // being close, because something behind you cannot be shot at all.
  function lockScore(e) {
    const to = sub(e.pos, ship.pos);
    const d = len(to);
    if (d > LOCK_RANGE) return -1;

    const ahead = dot(mul(to, 1 / (d || 1)), ship.fwd);
    if (ahead < 0.15) return -1;          // off to the side or behind

    return ahead * 2 - d / LOCK_RANGE;
  }

  function cycleTarget() {
    const list = enemies
      .filter(function (e) { return lockScore(e) > -1; })
      .sort(function (a, b) { return lockScore(b) - lockScore(a); });

    if (!list.length) { target = null; beep(180, 120, 0.1, 0.08); return; }

    // Already locked onto one? Step to the next in the list, and wrap
    // round the end - the same % trick as Bob's attack order.
    const at = list.indexOf(target);
    target = list[(at + 1) % list.length];

    beep(880, 1250, 0.09, 0.11, 'triangle');
  }

  // WHERE TO AIM. Work out roughly how long a bolt takes to get there,
  // then ask where the target will BE by then.
  //
  // Their speed is measured against YOURS, because your bolt is already
  // carrying your speed with it - so what matters is how fast they're
  // sliding relative to you, not how fast either of you is going.
  function leadPoint(e) {
    const to = sub(e.pos, ship.pos);
    const dist = len(to);

    const relVel = sub(e.vel, ship.vel);
    const t = dist / BOLT_SPD;

    return add(e.pos, mul(relVel, t));
  }

// -------------------------------------------------------------------
//  THE TARGETING COMPUTER
// -------------------------------------------------------------------
//  With a lock on, the guns don't fire straight down the nose any more.
//  They fire at the LEAD POINT - the spot the computer already worked
//  out for the yellow ring - so a shot lands as long as you're roughly
//  pointed the right way.
//
//  ROUGHLY is the important word. It only helps inside a cone about 35
//  degrees wide. Outside that the guns go back to firing straight ahead
//  and you're on your own, so you still have to fly the ship at the
//  fight. A gun that hits anything anywhere isn't a game, it's a button.
//
//  T turns it off if you'd rather do it yourself, and AIM_CONE below is
//  how forgiving it is - 1 would be dead ahead only, 0 would be
//  everywhere in front.
// -------------------------------------------------------------------

  const AIM_CONE = 0.82;      // the cosine of about 35 degrees
  let aimBot = true;

  // Is the computer able to help with this shot?
  function autoAimDir() {
    if (!aimBot || !target) return null;

    const dir = norm(sub(leadPoint(target), ship.pos));
    if (dot(dir, ship.fwd) < AIM_CONE) return null;   // too far off the nose

    return dir;
  }

  function keepTargetHonest() {
    if (!target) return;
    // Dead, or wandered too far, and the lock drops itself.
    if (target.hp <= 0 || len(sub(target.pos, ship.pos)) > LOCK_RANGE * 1.3) {
      target = null;
    }
  }


// -------------------------------------------------------------------
//  SHOOTING
// -------------------------------------------------------------------

  function shoot() {
    if (state !== 'play' || ship.cool > 0) return;
    ship.cool = GUN_COOL;

    // The computer takes the shot if it can. If not, straight ahead and
    // good luck.
    const helped = autoAimDir();
    const aim = helped || ship.fwd;

    // Fired from the wingtips, and the bolt inherits your speed - it
    // leaves the gun at 420 ON TOP of however fast you were already
    // going. That's how it works in real life and it's why you can't
    // outrun your own shots.
    for (const side of [-1, 1]) {
      bolts.push({
        pos: add(add(ship.pos, mul(ship.right, side * 5)), mul(ship.fwd, 6)),
        vel: add(ship.vel, mul(aim, BOLT_SPD)),
        life: 2.2, mine: true,
        colour: helped ? [190, 255, 190] : [140, 240, 255]
      });
    }

    beep(helped ? 900 : 760, 300, 0.09, 0.12);
    shake = Math.max(shake, 0.1);
  }

  function updateBolts(dt) {
    for (const b of bolts) {
      b.pos = add(b.pos, mul(b.vel, dt));
      b.life -= dt;

      if (b.mine) {
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (len(sub(b.pos, e.pos)) < ENEMY_R) {
            e.hp--;
            e.hitFlash = 1;
            b.life = 0;
            burst(b.pos, [[255, 200, 140], [255, 130, 80]], 8, 30);
            if (e.hp <= 0) killEnemy(e);
            break;
          }
        }
      } else if (len(sub(b.pos, ship.pos)) < 9) {
        b.life = 0;
        hurt(9);
      }

      // Rocks stop bolts too - both yours and theirs. Reading the list
      // we already built, rather than each bolt sweeping space again.
      if (b.life > 0) {
        for (const rk of nearRocks) {
          if (rk.away > 340) continue;
          if (len(sub(b.pos, rk.pos)) < rk.size * 0.62) {
            b.life = 0;
            burst(b.pos, [[190, 180, 170], [140, 130, 120]], 6, 24);
            break;
          }
        }
      }
    }
    bolts = bolts.filter(function (b) { return b.life > 0; });
  }

  function killEnemy(e) {
    e.hp = -1;
    ship.kills++;
    burst(e.pos, [[255, 190, 110], [255, 120, 60], [150, 60, 60]], 40, 90);
    beep(180, 40, 0.6, 0.28);
    shake = Math.max(shake, 0.6);
    enemies = enemies.filter(function (x) { return x.hp > 0; });
  }

  function burst(p, cols, n, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28;
      const b = Math.acos(Math.random() * 2 - 1);
      const dir = vec(Math.cos(a) * Math.sin(b), Math.cos(b), Math.sin(a) * Math.sin(b));

      bits.push({
        pos: vec(p.x, p.y, p.z),
        vel: mul(dir, power * (0.3 + Math.random())),
        size: 0.5 + Math.random() * 1.8,
        life: 0.5 + Math.random() * 0.9,
        colour: cols[Math.floor(Math.random() * cols.length)]
      });
    }
  }

  function updateBits(dt) {
    for (const b of bits) {
      // NOTHING SLOWS THEM DOWN. No air out here, so a chunk blown off
      // something keeps going at exactly the speed it left at, forever,
      // until we stop drawing it.
      b.pos = add(b.pos, mul(b.vel, dt));
      b.life -= dt;
    }
    bits = bits.filter(function (b) { return b.life > 0; });
  }

  function hurt(n) {
    if (state !== 'play') return;
    ship.health -= n;
    ship.hurtFlash = 1;
    shake = Math.max(shake, 0.5);
    beep(140, 60, 0.3, 0.22);

    if (ship.health <= 0) {
      ship.health = 0;
      state = 'dead';
      deadTimer = 0;
      burst(ship.pos, [[255, 200, 120], [255, 120, 60]], 60, 110);
    }
  }


// -------------------------------------------------------------------
//  SOUND
// -------------------------------------------------------------------

  let audio = null;

  function startAudio() {
    if (audio) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audio = new AC();
  }

  function beep(f1, f2, dur, vol, type) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f1, audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), audio.currentTime + dur);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur + 0.02);
  }


// -------------------------------------------------------------------
//  CONTROLS
// -------------------------------------------------------------------

  const keys = {};
  let locked = false, firing = false;

  window.addEventListener('keydown', function (e) {
    keys[e.key.toLowerCase()] = true;
    if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
    if (e.key.toLowerCase() === 'r' && state === 'dead') restart();

    if ((e.key.toLowerCase() === 'q' || e.key === 'Tab') && state === 'play') {
      cycleTarget();
      e.preventDefault();      // or Tab jumps out of the game entirely
    }

    if (e.key.toLowerCase() === 't' && state === 'play') {
      aimBot = !aimBot;
      beep(aimBot ? 620 : 300, aimBot ? 980 : 200, 0.14, 0.12, 'triangle');
    }
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function held(a, b) { return keys[a] || keys[b]; }

  let mouseX = 0, mouseY = 0;      // how much the mouse moved this frame

  canvas.addEventListener('mousedown', function () {
    startAudio();
    if (!locked) { if (canvas.requestPointerLock) canvas.requestPointerLock(); return; }
    if (state === 'dead') { restart(); return; }
    firing = true;
    shoot();
  });
  window.addEventListener('mouseup', function () { firing = false; });

  document.addEventListener('pointerlockchange', function () {
    locked = (document.pointerLockElement === canvas);
    if (!locked) firing = false;
  });

  window.addEventListener('mousemove', function (e) {
    if (!locked) return;
    mouseX += e.movementX;
    mouseY += e.movementY;
  });

  function restart() {
    ship.pos = vec(0, 0, 0);
    ship.vel = vec(0, 0, 0);
    ship.fwd = vec(0, 0, 1); ship.up = vec(0, 1, 0); ship.right = vec(1, 0, 0);
    ship.health = 100;
    ship.kills = 0;
    ship.hurtFlash = 0;
    enemies = []; bolts = []; bits = [];
    target = null;
    spawnTimer = 3;
    clock = 0;
    state = 'play';
  }


// -------------------------------------------------------------------
//  FLYING
// -------------------------------------------------------------------

  function update(dt) {
    clock += dt;

    if (ship.hurtFlash > 0) ship.hurtFlash = Math.max(0, ship.hurtFlash - dt * 1.6);
    if (shake > 0) shake = Math.max(0, shake - dt * 2.4);
    if (ship.cool > 0) ship.cool -= dt;

    updateBits(dt);

    // Once, up front, for everybody.
    gatherRocks();

    if (state === 'dead') {
      deadTimer += dt;
      updateBolts(dt);
      // Your wreck keeps drifting. Nothing stops it.
      ship.pos = add(ship.pos, mul(ship.vel, dt));
      aimCamera(dt);
      return;
    }

    // ---- STEERING ----------------------------------------------------
    // Mouse right yaws right, mouse forward pitches the nose down, A
    // and D roll. Each one spins a PAIR of the ship's arrows about the
    // third, and that's all turning is here.
    const yaw   = mouseX * 0.0022;
    const pitch = -mouseY * 0.0022;
    mouseX = 0; mouseY = 0;

    let roll = 0;
    if (held('a', 'arrowleft'))  roll += ROLL * dt;
    if (held('d', 'arrowright')) roll -= ROLL * dt;

    let p;
    if (yaw) {
      p = spinPair(ship.fwd, ship.right, yaw * TURN);
      ship.fwd = p[0]; ship.right = p[1];
    }
    if (pitch) {
      p = spinPair(ship.fwd, ship.up, pitch * TURN);
      ship.fwd = p[0]; ship.up = p[1];
    }
    if (roll) {
      p = spinPair(ship.right, ship.up, roll);
      ship.right = p[0]; ship.up = p[1];
    }
    tidy(ship);

    // ---- THE ENGINE ---------------------------------------------------
    // Thrust does NOT set your speed. It changes it. Let go and you keep
    // going exactly as you were - there is nothing out here to slow you
    // down, which is the whole reason this game feels different to the
    // racer.
    const boosting = keys['shift'];
    if (held('w', 'arrowup')) {
      ship.vel = add(ship.vel, mul(ship.fwd, (boosting ? BOOST : THRUST) * dt));
      ship.thrusting = Math.min(1, ship.thrusting + dt * 4);
    } else {
      ship.thrusting = Math.max(0, ship.thrusting - dt * 3);
    }

    // The brake is retro-rockets: it drags your speed towards nothing in
    // whatever direction you happen to be drifting.
    if (held('s', 'arrowdown')) {
      ship.vel = mul(ship.vel, Math.max(0, 1 - BRAKE * dt));
    }

    const sp = len(ship.vel);
    if (sp > TOP) ship.vel = mul(ship.vel, TOP / sp);

    ship.pos = add(ship.pos, mul(ship.vel, dt));

    if (firing) shoot();

    // ---- FLYING INTO A ROCK -------------------------------------------
    for (const rk of nearRocks) {
      const d = rk.away;
      const hitAt = rk.size * 0.6 + 5;
      if (d > hitAt) continue;

      // Shove yourself back out, kill the speed you had going in, and
      // take it on the hull.
      const out = norm(sub(ship.pos, rk.pos));
      ship.pos = add(rk.pos, mul(out, hitAt));

      const into = dot(ship.vel, out);
      if (into < 0) {
        ship.vel = sub(ship.vel, mul(out, into * 1.5));
        hurt(Math.min(30, Math.abs(into) * 0.22));
        burst(ship.pos, [[200, 190, 170], [255, 180, 120]], 14, 40);
      }
    }

    // ---- FLYING INTO ONE ----------------------------------------------
    // They're big enough now that sliding straight through one would
    // look ridiculous. Same shove-apart as the rocks: push yourself back
    // out, kill the speed you had going in, and take it on the hull.
    for (const e of enemies) {
      const to = sub(ship.pos, e.pos);
      const d = len(to);
      const hitAt = ENEMY_R + 6;
      if (d > hitAt) continue;

      const out = mul(to, 1 / (d || 1));
      ship.pos = add(e.pos, mul(out, hitAt));

      const into = dot(ship.vel, out);
      if (into < 0) {
        ship.vel = sub(ship.vel, mul(out, into * 1.4));
        hurt(Math.min(26, Math.abs(into) * 0.20));
        burst(ship.pos, [[255, 190, 120], [210, 100, 70]], 16, 42);
      }
    }

    updateEnemies(dt);
    updateBolts(dt);
    keepTargetHonest();

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(2.5, 9 - clock * 0.05);
    }

    aimCamera(dt);
  }

  // ---- YOU'RE IN THE SEAT ---------------------------------------------
  // The camera IS the ship now - same place, same three arrows, no lag
  // at all.
  //
  // The chase camera used to trail a little behind, which softened hard
  // turns. In the seat that softening becomes a lie: the stars would
  // swing a moment after you moved the stick, and your eyes would tell
  // you the ship was loose. Welded to the ship is the only honest
  // option from inside it.
  function aimCamera(dt) {
    cam.pos = add(add(ship.pos, mul(ship.fwd, 2.0)), mul(ship.up, 1.3));
    cam.fwd = ship.fwd;
    cam.up = ship.up;
    cam.right = ship.right;
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function drawBits() {
    for (const b of bits) addBox(b.pos, FLAT, b.size, b.size, b.size, b.colour);
  }

  function drawBolts() {
    for (const b of bolts) {
      const o = { fwd: norm(b.vel), up: vec(0, 1, 0), right: vec(1, 0, 0) };
      tidy(o);
      addBox(b.pos, o, 0.5, 0.5, 9, b.colour);
    }
  }

  // ---- THE CANOPY ---------------------------------------------------
  // Painted flat on top of everything: struts round the edge and a dash
  // along the bottom. It's a frame you're looking through, and it turns
  // "a view of space" into "a view of space FROM SOMEWHERE".
  function drawCanopy() {
    ctx.fillStyle = '#0a1018';

    // Dashboard along the bottom, curving up at the corners.
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H * 0.84);
    ctx.quadraticCurveTo(W * 0.5, H * 0.965, W, H * 0.84);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // Two struts sweeping up from the corners of the dash.
    ctx.strokeStyle = '#0d141e';
    ctx.lineWidth = Math.max(9, W * 0.017);
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.02);
    ctx.quadraticCurveTo(W * 0.20, H * 0.52, W * 0.055, H * 0.92);
    ctx.moveTo(W + 10, H * 0.02);
    ctx.quadraticCurveTo(W * 0.80, H * 0.52, W * 0.945, H * 0.92);
    ctx.stroke();

    // THE THROTTLE GLOW. The engines are behind your head where you can
    // never see them, so the dashboard tells you instead - it lifts as
    // you open up and dies away when you let go.
    if (ship.thrusting > 0.02) {
      const g = ctx.createLinearGradient(0, H * 0.88, 0, H);
      g.addColorStop(0, 'rgba(90,190,255,0)');
      g.addColorStop(1, 'rgba(90,190,255,' + (ship.thrusting * 0.30) + ')');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.84);
      ctx.quadraticCurveTo(W * 0.5, H * 0.965, W, H * 0.84);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }

    // A thin bright edge on the inside of each strut, so they read as
    // metal catching the light rather than as smears of nothing.
    ctx.strokeStyle = 'rgba(130,180,220,0.28)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-10, H * 0.02);
    ctx.quadraticCurveTo(W * 0.20, H * 0.52, W * 0.055, H * 0.92);
    ctx.moveTo(W + 10, H * 0.02);
    ctx.quadraticCurveTo(W * 0.80, H * 0.52, W * 0.945, H * 0.92);
    ctx.stroke();
  }

  function drawLock() {
    if (!target || state !== 'play') return;

    const dist = len(sub(target.pos, ship.pos));
    const s = project(target.pos);

    // ---- BEHIND YOU, OR OFF THE SIDE --------------------------------
    // An arrow pinned to the edge, pointing the way you need to turn.
    // Space is the one place this really matters: the thing hunting you
    // can be in a direction you have no word for.
    const onScreen = s.depth > 1 && s.x > 30 && s.x < W - 30 &&
                                    s.y > 30 && s.y < H - 30;

    if (!onScreen) {
      const to = sub(target.pos, ship.pos);
      let ax = dot(to, cam.right), ay = dot(to, cam.up);

      // Behind? Then flip it, or the arrow points the wrong way round.
      if (dot(to, cam.fwd) < 0) { ax = -ax; ay = -ay; }

      const l = Math.hypot(ax, ay) || 1;
      const r = Math.min(W, H) * 0.34;
      const ex = W / 2 + (ax / l) * r;
      const ey = H / 2 - (ay / l) * r;
      const ang = Math.atan2(-(ay / l), ax / l);

      ctx.save();
      ctx.translate(ex, ey);
      ctx.rotate(ang);
      ctx.fillStyle = '#ff8a5a';
      ctx.beginPath();
      ctx.moveTo(14, 0); ctx.lineTo(-8, 8); ctx.lineTo(-8, -8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      ctx.textAlign = 'center';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillStyle = '#ff8a5a';
      ctx.fillText(Math.round(dist), ex, ey + 26);
      return;
    }

    // ---- THE BOX ----------------------------------------------------
    // Sized by distance, so it shrinks as they run and swells as they
    // close - you can read the range without looking at the number.
    const r = clamp(2600 / dist, 12, 90);

    ctx.strokeStyle = '#ff8a5a';
    ctx.lineWidth = 2;
    for (const c of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const cx = s.x + c[0] * r, cy = s.y + c[1] * r;
      ctx.beginPath();
      ctx.moveTo(cx, cy - c[1] * r * 0.42);
      ctx.lineTo(cx, cy);
      ctx.lineTo(cx - c[0] * r * 0.42, cy);
      ctx.stroke();
    }

    // Their hull, above the box.
    const bw = r * 1.5, hp = Math.max(0, target.hp / ENEMY_HP);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(s.x - bw / 2, s.y - r - 14, bw, 5);
    ctx.fillStyle = hp > 0.5 ? '#8fd45c' : '#e04a3c';
    ctx.fillRect(s.x - bw / 2, s.y - r - 14, bw * hp, 5);

    ctx.textAlign = 'center';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.fillStyle = '#ff8a5a';
    ctx.fillText(Math.round(dist), s.x, s.y + r + 18);

    // ---- WHERE TO ACTUALLY AIM --------------------------------------
    const lead = project(leadPoint(target));
    if (lead.depth <= 1) return;

    // Only worth drawing when it's somewhere DIFFERENT from the target.
    // Sat still relative to you, the lead is the target, and two rings
    // on top of each other just look like a mistake.
    if (Math.hypot(lead.x - s.x, lead.y - s.y) > 6) {
      ctx.strokeStyle = 'rgba(255,240,150,0.55)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(lead.x, lead.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ---- IS THE COMPUTER ON THIS SHOT? ------------------------------
    // Green means the guns will take it themselves. Yellow means you're
    // outside the cone and it's down to you. You should never have to
    // guess which - a helper you can't see is worse than none.
    const helped = autoAimDir() !== null;
    const onIt = Math.hypot(lead.x - W / 2, lead.y - H / 2) < 16;

    ctx.strokeStyle = helped ? '#8fff9a' : '#ffec96';
    ctx.lineWidth = helped || onIt ? 3 : 2;
    ctx.beginPath();
    ctx.arc(lead.x, lead.y, 9, 0, 6.28);
    ctx.stroke();

    if (helped) {
      // A second ring, breathing, so a locked-up gun looks alive.
      const pulse = 12 + Math.sin(clock * 9) * 3;
      ctx.strokeStyle = 'rgba(143,255,154,0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(lead.x, lead.y, pulse, 0, 6.28);
      ctx.stroke();

      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillStyle = '#8fff9a';
      ctx.textAlign = 'center';
      ctx.fillText('GUNS LOCKED', lead.x, lead.y - 20);
    } else if (onIt) {
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillStyle = '#ffec96';
      ctx.textAlign = 'center';
      ctx.fillText('FIRE', lead.x, lead.y - 16);
    }
  }

  function drawHud() {
    // ---- CROSSHAIR ----------------------------------------------------
    // Dead centre, and it can be, because the camera IS the ship now.
    // It used to be projected out along the nose - it had to be, with a
    // chase camera trailing behind, since the middle of the screen
    // wasn't where you were pointing. From the seat those are the same
    // place, so the maths simply goes away.
    const cx = W / 2, cy = H / 2;
    ctx.strokeStyle = '#7fe4ff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, 6.28);
    ctx.moveTo(cx - 22, cy); ctx.lineTo(cx - 7, cy);
    ctx.moveTo(cx + 7, cy);  ctx.lineTo(cx + 22, cy);
    ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy - 7);
    ctx.moveTo(cx, cy + 7);  ctx.lineTo(cx, cy + 22);
    ctx.stroke();

    // ---- HULL ---------------------------------------------------------
    const bw = Math.min(W * 0.26, 240), bx = W * 0.05, by = H - 44;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, bw, 15);
    const frac = ship.health / 100;
    ctx.fillStyle = frac > 0.5 ? '#5cc8e0' : frac > 0.25 ? '#e0a83c' : '#e04a3c';
    ctx.fillRect(bx, by, bw * frac, 15);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, by, bw, 15);

    ctx.textAlign = 'left';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillStyle = '#cfe4f4';
    ctx.fillText(Math.ceil(ship.health) + '  HULL', bx, by - 6);

    // ---- SPEED --------------------------------------------------------
    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.05, 30) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#7fe4ff';
    ctx.fillText(Math.round(len(ship.vel)), W * 0.95, H - 44);
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = '#7f93aa';
    ctx.fillText('SPEED', W * 0.95, H - 27);
    ctx.fillText(ship.kills + ' shot down', W * 0.95, H - 62);

    ctx.fillStyle = aimBot ? '#8fff9a' : '#6c7f92';
    ctx.fillText(aimBot ? 'targeting computer ON' : 'targeting computer OFF',
                 W * 0.95, H - 78);

    // ---- HIT ----------------------------------------------------------
    if (ship.hurtFlash > 0) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.8);
      g.addColorStop(0, 'rgba(170,20,20,0)');
      g.addColorStop(1, 'rgba(170,20,20,' + (ship.hurtFlash * 0.8) + ')');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    if (!locked && state === 'play') {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.045, 28) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#7fe4ff';
      ctx.fillText('CLICK TO FLY', W / 2, H * 0.62);
    }

    if (state === 'dead') {
      ctx.fillStyle = 'rgba(30,4,6,' + Math.min(0.75, deadTimer * 0.7) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.12, 84) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#000';
      ctx.fillText('HULL BREACH', W / 2 + 4, H * 0.42 + 4);
      ctx.fillStyle = '#ffb08a';
      ctx.fillText('HULL BREACH', W / 2, H * 0.42);
      ctx.font = Math.min(W * 0.035, 21) + 'px system-ui, sans-serif';
      ctx.fillStyle = '#e8f0f8';
      ctx.fillText(ship.kills + ' shot down before they got you', W / 2, H * 0.53);
      ctx.fillText('press R or click to fly again', W / 2, H * 0.60);
    }
  }

  function draw() {
    ctx.fillStyle = '#04060d';
    ctx.fillRect(0, 0, W, H);

    const saved = cam.pos;
    if (shake > 0) {
      cam.pos = add(cam.pos, mul(vec(Math.random() - 0.5, Math.random() - 0.5,
                                     Math.random() - 0.5), shake * 1.6));
    }

    drawStars();

    faces = [];
    drawRocks();
    drawEnemies();
    drawBolts();
    drawBits();
    if (state === 'play') drawCockpitParts();

    faces.sort(function (a, b) { return b.depth - a.depth; });

    for (const f of faces) {
      ctx.beginPath();
      ctx.moveTo(f.points[0].x, f.points[0].y);
      for (let i = 1; i < f.points.length; i++) ctx.lineTo(f.points[i].x, f.points[i].y);
      ctx.closePath();
      ctx.fillStyle = f.colour;
      ctx.fill();
    }

    cam.pos = saved;

    // Canopy first, then the readouts - so the numbers sit ON the
    // dashboard instead of underneath it.
    if (state === 'play') drawCanopy();
    drawLock();
    drawHud();
  }


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;

  function loop(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000 || 0.016));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  fitScreen();
  restart();
  requestAnimationFrame(loop);

</script>
</body>
</html>
