<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>STICK ARENA</title>

<!-- ADD TO HOME SCREEN / CAST TO THE TELLY
     This game has its OWN manifest, so "Add to Home Screen" gives it its own
     icon that opens straight into this game - not the arcade menu. display is
     "fullscreen", so it launches with no browser bar at all, which is also
     what makes it look right mirrored onto a TV. -->
<link rel="manifest" href="stick.webmanifest">
<meta name="theme-color" content="#10131a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stick Arena">
<link rel="icon" href="icon-stick.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-stick.svg">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #10131a; }
  canvas { display: block; touch-action: none; }
</style>

<style>
/* ==== THE ARCADE PILL — every game in the arcade wears this ============
   One look, one place, one way home. The appearance is forced (!important)
   because these pages were written separately and each has its own ideas
   about what a link should look like; this is the one thing they agree on. */
a.arcade-pill {
  display: inline-flex !important; align-items: center !important; gap: 6px !important;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif !important;
  font-size: 13px !important; font-weight: 600 !important; letter-spacing: 0.3px !important;
  line-height: 1 !important; text-decoration: none !important; text-transform: none !important;
  color: #ffe0c4 !important;
  background: rgba(24, 14, 28, 0.62) !important;
  border: 1px solid rgba(255, 200, 150, 0.42) !important;
  padding: 7px 13px !important; border-radius: 999px !important;
  cursor: pointer !important; white-space: nowrap !important;
  -webkit-backdrop-filter: blur(5px) !important; backdrop-filter: blur(5px) !important;
  -webkit-tap-highlight-color: transparent !important;
  transition: transform 0.12s, border-color 0.12s, background 0.12s !important;
}
a.arcade-pill:hover, a.arcade-pill:active, a.arcade-pill:focus-visible {
  transform: scale(1.05) !important;
  border-color: rgba(255, 200, 150, 0.9) !important;
  background: rgba(40, 22, 44, 0.78) !important;
  color: #fff5e8 !important;
}
a.arcade-pill .ah-arrow { font-size: 14px !important; opacity: 0.9 !important; }
/* the floating version, for games that had nowhere to put it */
a.arcade-pill.arcade-float {
  position: fixed !important;
  top: calc(8px + env(safe-area-inset-top, 0px)) !important;
  left: calc(10px + env(safe-area-inset-left, 0px)) !important;
  z-index: 2147483000 !important;
}
</style>
</head>
<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>
<canvas id="game"></canvas>
<script>
// =====================================================================
// STICK ARENA — build the arena. upgrade the fighter. WIN THE BATTLE.
//
// Three rooms in one game:
//   BATTLE  — you vs a bot that gets meaner every round
//   BUILD   — paint your own arena, grid-style
//   UPGRADE — spend hard-won coins on POWER, SPEED, HEALTH, JUMP
// =====================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', fit);
fit();

window.onerror = (msg, src, line) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;' +
    'color:#fff;font:14px monospace;padding:8px;z-index:9';
  d.textContent = '🐛 BUG on line ' + line + ': ' + msg;
  document.body.appendChild(d);
};

// ---------------------------------------------------------------------
// SOUND
// ---------------------------------------------------------------------
let audio = null;
function ensureAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type, vol) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'square';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.1, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + 0.02);
}
function swishSound() { beep(700, 0.06, 'sawtooth', 0.05); }
function hissSound() {
  beep(1800, 0.08, 'sawtooth', 0.04);
  setTimeout(() => beep(1400, 0.12, 'sawtooth', 0.04), 60);
}
function shotgunSound() {
  beep(90, 0.12, 'sawtooth', 0.2);
  beep(160, 0.08, 'square', 0.15);
  setTimeout(() => beep(70, 0.1, 'triangle', 0.12), 40);
}
function paintSound() { beep(520, 0.05, 'sine', 0.12); setTimeout(() => beep(320, 0.08, 'sine', 0.1), 40); }
function portalSound() {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(280, audio.currentTime);
  o.frequency.exponentialRampToValueAtTime(900, audio.currentTime + 0.12);
  o.frequency.exponentialRampToValueAtTime(320, audio.currentTime + 0.26);
  g.gain.setValueAtTime(0.14, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.3);
  o.connect(g); g.connect(audio.destination);
  o.start(); o.stop(audio.currentTime + 0.35);
}
function bonkSound() { beep(200, 0.1, 'square', 0.15); beep(120, 0.16, 'triangle', 0.15); }
function koSound() { [400, 300, 200, 120].forEach((n, i) => setTimeout(() => beep(n, 0.15, 'square', 0.12), i * 90)); }
function winSound() { [523, 659, 784, 1047].forEach((n, i) => setTimeout(() => beep(n, 0.2, 'square', 0.1), i * 110)); }
function coinSound() { beep(988, 0.06, 'square', 0.08); setTimeout(() => beep(1319, 0.15, 'square', 0.08), 50); }

// ---------------------------------------------------------------------
// SAVING — your coins and upgrades live in the browser
// ---------------------------------------------------------------------
const TILE = 46;
let save = { coins: 0, round: 1, hp: 0, spd: 0, pow: 0, jmp: 0 };
try {
  const s = JSON.parse(localStorage.getItem('stick_save'));
  if (s) save = Object.assign(save, s);
} catch (err) {}
function persist() { localStorage.setItem('stick_save', JSON.stringify(save)); }

// the arena: a set of ground cells plus the two starting corners
let arena = { tiles: new Set(), spikes: [], snakes: [], you: [3, 9], enemy: [16, 9] };
function defaultArena() {
  arena = { tiles: new Set(), spikes: [], snakes: [], you: [3, 9], enemy: [16, 9] };
  for (let i = 0; i < 20; i++) arena.tiles.add(i + ',10');
  for (let i = 4; i < 8; i++) arena.tiles.add(i + ',7');
  for (let i = 12; i < 16; i++) arena.tiles.add(i + ',7');
}
defaultArena();
function saveArena() {
  localStorage.setItem('stick_arena', JSON.stringify({
    tiles: [...arena.tiles], spikes: arena.spikes, snakes: arena.snakes,
    you: arena.you, enemy: arena.enemy }));
}
try {
  const a = JSON.parse(localStorage.getItem('stick_arena'));
  if (a && a.tiles && a.tiles.length) {
    arena = { tiles: new Set(a.tiles), spikes: a.spikes || [],
              snakes: a.snakes || [],
              you: a.you || [3, 9], enemy: a.enemy || [16, 9] };
  }
} catch (err) {}

// ---------------------------------------------------------------------
// UPGRADES — what your coins buy
// ---------------------------------------------------------------------
const UPGRADES = [
  { key: 'pow', name: 'POWER', desc: 'hit harder',
    base: 12, per: 4 },
  { key: 'spd', name: 'SPEED', desc: 'run faster',
    base: 240, per: 18 },
  { key: 'hp', name: 'HEALTH', desc: 'take more hits',
    base: 100, per: 25 },
  { key: 'jmp', name: 'JUMP', desc: 'jump higher',
    base: 700, per: 45 },
];
function upCost(level) { return 20 + level * 15; }
function stat(key) {
  const u = UPGRADES.find(u => u.key === key);
  return u.base + save[key] * u.per;
}

// ---------------------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------------------
let screen = 'menu';    // 'menu' | 'battle' | 'build' | 'shop'
let uiRects = [];
let elapsed = 0;
let solids = [];
let levelBottom = 0;
let worldW = 2000, worldH = 1200;
let fighters = [];      // [you, bot]
let hitFx = [];         // little impact stars
let banner = null;      // { text, timer, coins } after a KO
let camX = 0, camY = 0;
let pellets = [];       // shotgun pellets in flight
let fxRings = [];       // portal rings and other round sparkles
let blastCounter = 0;   // so one shotgun blast can't hit twice
let weaponNotice = 0;   // "you drew: ..." timer at battle start
let snakes = [];        // the arena's slithering third party
const WEAPONS = ['shotgun', 'brush', 'portal'];

let spikeRects = [];
function buildSolids() {
  solids = [];
  let maxX = 900, maxBottom = 500;
  for (const key of arena.tiles) {
    const [cx, cy] = key.split(',').map(Number);
    solids.push({ x: cx * TILE, y: cy * TILE, w: TILE, h: TILE,
                  lid: !arena.tiles.has(cx + ',' + (cy - 1)) });
    maxX = Math.max(maxX, cx * TILE + TILE);
    maxBottom = Math.max(maxBottom, cy * TILE + TILE);
  }
  spikeRects = arena.spikes.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + 4, y: cy * TILE + TILE * 0.45, w: TILE - 8, h: TILE * 0.55 };
  });
  worldW = maxX + 300;
  levelBottom = maxBottom;
}

function makeFighter(cellX, cellY, isBot) {
  const round = save.round;
  return {
    x: cellX * TILE + 8, y: cellY * TILE - 60,
    w: 26, h: 56, vx: 0, vy: 0,
    onGround: false, facing: isBot ? -1 : 1,
    hp: isBot ? 50 + round * 14 : stat('hp'),
    maxHp: isBot ? 50 + round * 14 : stat('hp'),
    speed: isBot ? Math.min(300, 190 + round * 8) : stat('spd'),
    jump: isBot ? 720 : stat('jmp'),
    power: isBot ? 6 + round * 2 : stat('pow'),
    attack: 0,          // seconds left of the current swing
    cooldown: 0,
    hurtFlash: 0,
    ko: false, koSpin: 0,
    walk: 0,
    bot: isBot,
    think: 0,           // the bot re-decides a few times a second
    wantDir: 0, wantJump: false,
    lastBlast: 0,       // which shotgun blast already hit this fighter
    gunCd: 0, portalCd: 0, paintCd: 0, paint: isBot ? 10 : 15,
  };
}

function startBattle() {
  buildSolids();
  fighters = [makeFighter(arena.you[0], arena.you[1], false),
              makeFighter(arena.enemy[0], arena.enemy[1], true)];
  // the weapon lottery — BOTH fighters draw, every battle
  const you = fighters[0];
  you.weapon = WEAPONS[Math.floor(Math.random() * WEAPONS.length)];
  fighters[1].weapon = ['sword'].concat(WEAPONS)[Math.floor(Math.random() * 4)];
  pellets = [];
  fxRings = [];
  weaponNotice = 3;
  hitFx = [];
  banner = null;
  snakes = arena.snakes.map(k => {
    const [cx, cy] = k.split(',').map(Number);
    return { x: cx * TILE + 1, y: cy * TILE + TILE - 14, w: 44, h: 14,
             vy: 0, dir: Math.random() < 0.5 ? -1 : 1, dead: false, grace: 0 };
  });
  screen = 'battle';
}

// one blow lands — damage, knockback, drama, maybe a KO
function damageFighter(t, amt, dir) {
  t.hp -= amt;
  t.hurtFlash = 0.35;
  t.vx = dir * 260;
  t.x += dir * 10;
  t.vy = Math.min(t.vy, -180);
  bonkSound();
  hitFx.push({ x: t.x + t.w / 2, y: t.y + 14, t: 0.35 });
  if (t.hp <= 0 && !t.ko) { t.ko = true; t.vy = -560; t.vx = dir * 220; koSound(); }
}

// ---- the three weapons — either fighter can wield any of them ----
function fireShotgun(f, wx, wy) {
  if (f.ko || f.gunCd > 0 || banner) return;
  f.gunCd = f.bot ? 1.3 : 0.9;         // the bot reloads a touch slower
  const ang = Math.atan2(wy - (f.y + 20), wx - (f.x + f.w / 2));
  f.facing = Math.cos(ang) >= 0 ? 1 : -1;
  blastCounter++;
  for (let i = -1; i <= 1; i++) {
    const a = ang + i * 0.11;
    pellets.push({ x: f.x + f.w / 2 + Math.cos(a) * 22,
                   y: f.y + 20 + Math.sin(a) * 22,
                   vx: Math.cos(a) * 950, vy: Math.sin(a) * 950,
                   life: 0.5, blast: blastCounter,
                   ownerIdx: f.bot ? 1 : 0 });
  }
  shotgunSound();
}

function paintAt(f, wx, wy) {
  if (f.ko || banner) return;
  const who = f.bot ? 'bot' : 'you';
  const cx = Math.floor(wx / TILE), cy = Math.floor(wy / TILE);
  const cell = { x: cx * TILE, y: cy * TILE, w: TILE, h: TILE };
  // painting YOUR OWN wall a second time makes it SPIKY
  const idx = solids.findIndex(s => s.painted === who && s.x === cell.x && s.y === cell.y);
  if (idx >= 0) {
    solids.splice(idx, 1);
    spikeRects.push({ x: cell.x + 4, y: cell.y + TILE * 0.45,
                      w: TILE - 8, h: TILE * 0.55 });
    paintSound();
    return;
  }
  if (f.paint <= 0) return;
  if (solids.some(s => overlaps(cell, s))) return;          // no double-painting
  if (overlaps(cell, fighters[0]) || overlaps(cell, fighters[1])) return;
  solids.push({ ...cell, lid: true, painted: who });
  f.paint--;
  paintSound();
}

function teleportTo(f, wx, wy) {
  if (f.ko || f.portalCd > 0 || banner) return false;
  const dest = { x: wx - f.w / 2, y: wy - f.h / 2, w: f.w, h: f.h };
  if (solids.some(s => overlaps(dest, s))) {                // no zapping into rock
    if (!f.bot) beep(120, 0.15, 'square', 0.08);
    return false;
  }
  fxRings.push({ x: f.x + f.w / 2, y: f.y + f.h / 2, t: 0.4, color: '#ff9f43' });
  f.x = dest.x;
  f.y = dest.y;
  f.vy = Math.min(f.vy, 0);
  f.portalCd = f.bot ? 3 : 2.5;
  fxRings.push({ x: wx, y: wy, t: 0.4, color: f.bot ? '#ff6b5e' : '#7dd3ff' });
  portalSound();
  return true;
}

// ---------------------------------------------------------------------
// INPUT
// ---------------------------------------------------------------------
const keys = {};
addEventListener('keydown', e => {
  ensureAudio();
  keys[e.key.toLowerCase()] = true;
  if (screen === 'battle' && (e.key.toLowerCase() === 'j' || e.key.toLowerCase() === 'x')) {
    tryAttack(fighters[0]);
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let touchLeft = false, touchRight = false, touchJump = false, touchHitLatch = false;
function readTouches(e) {
  touchLeft = touchRight = touchJump = false;
  if (screen !== 'battle') return;
  for (const t of e.touches) {
    const W = canvas.width, H = canvas.height;
    if (t.clientY < 70) continue;
    if (t.clientX < W * 0.22) touchLeft = true;
    else if (t.clientX < W * 0.44) touchRight = true;
    else if (t.clientX > W * 0.6 && t.clientY < H * 0.6) touchJump = true;
    else if (t.clientX > W * 0.6) {
      if (!touchHitLatch) { touchHitLatch = true; tryAttack(fighters[0]); }
    }
  }
  if (![...e.touches].some(t => t.clientX > canvas.width * 0.6 && t.clientY >= canvas.height * 0.6)) {
    touchHitLatch = false;
  }
}
addEventListener('touchstart', e => { e.preventDefault(); ensureAudio(); readTouches(e); }, { passive: false });
addEventListener('touchmove', e => { e.preventDefault(); readTouches(e); }, { passive: false });
addEventListener('touchend', e => { e.preventDefault(); readTouches(e); }, { passive: false });

// build-mode state (same builder muscles as the fart cave)
let tool = 'ground';
let toolbarH = 96;      // how tall the builder's button bar is right now
let editCamX = -100, editCamY = 100;
let painting = false, panLast = null, hoverPt = null;
let resetArmUntil = 0;
const pointers = new Map();
function pointerMid() {
  let mx = 0, my = 0;
  for (const p of pointers.values()) { mx += p.x; my += p.y; }
  return { x: mx / pointers.size, y: my / pointers.size };
}

function uiAction(id) {
  if (id === 'battle') { startBattle(); return; }
  if (id === 'build') { screen = 'build'; return; }
  if (id === 'shop') { screen = 'shop'; return; }
  if (id === 'menu') { screen = 'menu'; return; }
  if (id === 'reset') {
    if (performance.now() < resetArmUntil) { defaultArena(); saveArena(); resetArmUntil = 0; }
    else resetArmUntil = performance.now() + 3000;
    return;
  }
  resetArmUntil = 0;
  if (id.startsWith('buy_')) {
    const key = id.slice(4);
    const cost = upCost(save[key]);
    if (save.coins >= cost && save[key] < 12) {
      save.coins -= cost;
      save[key]++;
      persist();
      coinSound();
    }
    return;
  }
  tool = id;
}

function applyTool(sx, sy) {
  if (sy < toolbarH) return;
  const cx = Math.floor((sx + editCamX) / TILE);
  const cy = Math.floor((sy + editCamY) / TILE);
  const key = cx + ',' + cy;
  if (tool === 'ground') {
    arena.tiles.add(key);
    arena.spikes = arena.spikes.filter(k => k !== key);
    arena.snakes = arena.snakes.filter(k => k !== key);
  } else if (tool === 'spike') {
    if (!arena.tiles.has(key) && !arena.spikes.includes(key)) arena.spikes.push(key);
  } else if (tool === 'snake') {
    if (!arena.tiles.has(key) && !arena.snakes.includes(key)) arena.snakes.push(key);
  } else if (tool === 'you') arena.you = [cx, cy];
  else if (tool === 'enemy') arena.enemy = [cx, cy];
  else if (tool === 'erase') {
    arena.tiles.delete(key);
    arena.spikes = arena.spikes.filter(k => k !== key);
    arena.snakes = arena.snakes.filter(k => k !== key);
  }
  saveArena();
}

addEventListener('pointerdown', e => {
  ensureAudio();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  for (const r of uiRects) {
    if (e.clientX > r.x && e.clientX < r.x + r.w &&
        e.clientY > r.y && e.clientY < r.y + r.h) { uiAction(r.id); return; }
  }
  if (screen === 'battle') {
    if (banner) {
      if (banner.timer > 0.8) screen = 'menu';    // tap-to-continue works now
      return;
    }
    const you = fighters[0];
    const wx = e.clientX + camX, wy = e.clientY + camY;
    if (e.pointerType === 'touch') {
      // fingers mostly use the zones — but the middle band of the
      // screen is the weapon-aiming area for touch players
      const fx = e.clientX / canvas.width;
      if (fx < 0.44 || fx > 0.6) return;
      if (you.weapon === 'shotgun') fireShotgun(you, wx, wy);
      else if (you.weapon === 'portal') teleportTo(you, wx, wy);
      else if (you.weapon === 'brush') paintAt(you, wx, wy);
      return;
    }
    // mouse: the click IS the weapon
    if (you.weapon === 'shotgun') fireShotgun(you, wx, wy);
    else if (you.weapon === 'portal') teleportTo(you, wx, wy);
    else if (you.weapon === 'brush') paintAt(you, wx, wy);
    else tryAttack(you);
    return;
  }
  if (screen !== 'build') return;
  if (pointers.size >= 2) { painting = false; panLast = pointerMid(); return; }
  if (tool === 'pan' || e.button === 2) { panLast = { x: e.clientX, y: e.clientY }; return; }
  painting = true;
  applyTool(e.clientX, e.clientY);
});
addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (screen !== 'build') return;
  hoverPt = { x: e.clientX, y: e.clientY };
  if (pointers.size >= 2) {
    const mid = pointerMid();
    if (panLast) { editCamX -= mid.x - panLast.x; editCamY -= mid.y - panLast.y; }
    panLast = mid;
    return;
  }
  if (panLast) {
    editCamX -= e.clientX - panLast.x;
    editCamY -= e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
  } else if (painting) applyTool(e.clientX, e.clientY);
});
function dropPointer(e) { pointers.delete(e.pointerId); painting = false; panLast = null; }
addEventListener('pointerup', dropPointer);
addEventListener('pointercancel', dropPointer);
addEventListener('contextmenu', e => e.preventDefault());

// ---------------------------------------------------------------------
// THE FIGHT
// ---------------------------------------------------------------------
const GRAVITY = 2100;

function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function tryAttack(f) {
  if (!f || f.ko || banner) return;
  // the attack button speaks whatever weapon you're holding
  if (!f.bot && f.weapon === 'shotgun') {
    fireShotgun(f, f.x + f.w / 2 + f.facing * 400, f.y + 20);
    return;
  }
  if (!f.bot && f.weapon === 'portal') {
    teleportTo(f, f.x + f.w / 2 + f.facing * 230, f.y + f.h / 2);
    return;
  }
  if (f.cooldown > 0) return;
  f.attack = 0.18;
  f.cooldown = 0.42;
  swishSound();
}

function fighterPhysics(f, dt, dir, jumpHeld) {
  if (f.ko) {
    // a KO'd stickman flops off the stage with cartoon dignity
    f.koSpin += dt * 9;
    f.vy += GRAVITY * dt;
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    return;
  }
  f.vx = dir * f.speed;
  if (dir !== 0) { f.facing = dir; f.walk += dt; }
  if (jumpHeld && f.onGround) {
    f.vy = -f.jump;
    f.onGround = false;
    f.flipA = 0.0001;                  // every jump is a BACKFLIP. obviously.
  }
  f.vy += GRAVITY * dt;
  f.x += f.vx * dt;
  for (const s of solids) {
    if (!overlaps(f, s)) continue;
    if (f.vx > 0) f.x = s.x - f.w;
    else if (f.vx < 0) f.x = s.x + s.w;
  }
  f.y += f.vy * dt;
  f.onGround = false;
  for (const s of solids) {
    if (!overlaps(f, s)) continue;
    if (f.vy > 0) { f.y = s.y - f.h; f.vy = 0; f.onGround = true; }
    else if (f.vy < 0) { f.y = s.y + s.h; f.vy = 0; }
  }
  if (f.cooldown > 0) f.cooldown -= dt;
  if (f.attack > 0) f.attack -= dt;
  if (f.hurtFlash > 0) f.hurtFlash -= dt;
  // the backflip spins through a full circle while airborne,
  // and sticks the landing the moment feet touch ground
  if (!f.onGround && f.flipA > 0) {
    f.flipA = Math.min(Math.PI * 2, f.flipA + dt * 9);
  }
  if (f.onGround) f.flipA = 0;
}

function attackBox(f) {
  // where the swing can reach: a box in front of the fighter
  return { x: f.facing > 0 ? f.x + f.w : f.x - 44, y: f.y - 6, w: 44, h: f.h + 6 };
}

function update(dt) {
  elapsed += dt;
  if (screen !== 'battle') return;
  const you = fighters[0], bot = fighters[1];

  if (banner) { banner.timer += dt; return; }

  // ---- your controls ----
  const dir = ((keys['arrowright'] || keys['d'] || touchRight) ? 1 : 0) -
              ((keys['arrowleft'] || keys['a'] || touchLeft) ? 1 : 0);
  const jump = keys[' '] || keys['arrowup'] || keys['w'] || touchJump;
  fighterPhysics(you, dt, you.ko ? 0 : dir, jump);

  // ---- the bot's tiny brain: chase, jump when stuck, and USE its
  // weapon the way that weapon wants to be used ----
  bot.think -= dt;
  if (bot.think <= 0 && !bot.ko) {
    bot.think = 0.15 + Math.random() * 0.2;
    const dx = (you.x + you.w / 2) - (bot.x + bot.w / 2);
    const dist = Math.abs(dx);
    bot.wantDir = dist < 30 ? 0 : Math.sign(dx);
    if (bot.weapon === 'shotgun') {
      // a gunslinger keeps its distance and shoots the gap
      if (dist < 240) bot.wantDir = -Math.sign(dx);
      else if (dist < 420) bot.wantDir = 0;
      if (dist < 540 && Math.abs(you.y - bot.y) < 220 && bot.gunCd <= 0 && !you.ko) {
        fireShotgun(bot, you.x + you.w / 2, you.y + 20);
      }
    }
    if (bot.weapon === 'portal' && dist < 130 && bot.portalCd <= 0) {
      // you got too close — it panics and blinks somewhere surprising
      for (let tries = 0; tries < 6; tries++) {
        const tx = you.x + (Math.random() < 0.5 ? -1 : 1) * (180 + Math.random() * 240);
        const ty = bot.y + 20 - Math.random() * 120;
        if (teleportTo(bot, tx, ty)) break;
      }
    }
    if (bot.weapon === 'brush' && bot.paintCd <= 0 && bot.paint > 0 &&
        dist > 80 && dist < 330) {
      // a panicked artist walls itself off from you
      bot.paintCd = 2.5;
      paintAt(bot, bot.x + bot.w / 2 + Math.sign(dx) * 64, bot.y + 24);
    }
    // jump if you're above, or if a wall is in the way, or for drama
    const wallAhead = solids.some(s =>
      overlaps({ x: bot.x + bot.wantDir * 20, y: bot.y, w: bot.w, h: bot.h - 6 }, s));
    bot.wantJump = (you.y + you.h < bot.y - 20 && dist < 260) ||
                   wallAhead || Math.random() < 0.05;
    if (dist < 62 && Math.abs(you.y - bot.y) < 60 && !you.ko) tryAttack(bot);
  }
  fighterPhysics(bot, dt, bot.ko ? 0 : bot.wantDir, bot.wantJump);
  if (bot.wantJump && bot.onGround === false) bot.wantJump = false;

  // ---- swings connect ----
  for (const [striker, target] of [[you, bot], [bot, you]]) {
    if (striker.attack > 0.09 && !target.ko && target.hurtFlash <= 0 &&
        overlaps(attackBox(striker), target)) {
      target.hp -= striker.power;
      target.hurtFlash = 0.35;
      target.vx = striker.facing * 260;             // cartoon knockback
      target.x += striker.facing * 14;
      target.vy = Math.min(target.vy, -180);
      bonkSound();
      hitFx.push({ x: target.x + target.w / 2, y: target.y + 14, t: 0.35 });
      if (target.hp <= 0) {
        target.ko = true;
        target.vy = -560;
        target.vx = striker.facing * 220;
        koSound();
      }
    }
  }
  for (const fx of hitFx) fx.t -= dt;
  hitFx = hitFx.filter(fx => fx.t > 0);

  // ---- weapon housekeeping, for both fighters ----
  for (const f of fighters) {
    if (f.gunCd > 0) f.gunCd -= dt;
    if (f.portalCd > 0) f.portalCd -= dt;
    if (f.paintCd > 0) f.paintCd -= dt;
  }
  if (weaponNotice > 0) weaponNotice -= dt;
  for (const r of fxRings) r.t -= dt;
  fxRings = fxRings.filter(r => r.t > 0);

  // ---- shotgun pellets fly, hit whoever they were fired AT, or
  // fizzle on the rocks ----
  for (const p of pellets) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    const box = { x: p.x - 3, y: p.y - 3, w: 6, h: 6 };
    const target = fighters[1 - p.ownerIdx];
    if (!target.ko && target.lastBlast !== p.blast && overlaps(box, target)) {
      target.lastBlast = p.blast;                  // one blast = one hit of 7
      damageFighter(target, 7, Math.sign(p.vx) || 1);
      p.life = 0;
      continue;
    }
    // pellets also work on snakes — shotgun pest control
    for (const sn of snakes) {
      if (!sn.dead && overlaps(box, sn)) {
        sn.dead = true;
        fxRings.push({ x: sn.x + sn.w / 2, y: sn.y + sn.h / 2, t: 0.4, color: '#7ddf8f' });
        p.life = 0;
        break;
      }
    }
    for (const s of solids) {
      if (overlaps(box, s)) { p.life = 0; break; }
    }
  }
  pellets = pellets.filter(p => p.life > 0);

  // ---- snakes: the arena's slithering third party. they bite
  // EVERYONE, and everyone's weapons work on THEM. ----
  for (const sn of snakes) {
    if (sn.dead) continue;
    if (sn.grace > 0) sn.grace -= dt;
    sn.x += sn.dir * 60 * dt;
    // gravity, so snakes placed in the air find the floor
    sn.vy += GRAVITY * dt;
    sn.y += sn.vy * dt;
    for (const s of solids) {
      if (!overlaps(sn, s)) continue;
      if (sn.vy > 0) { sn.y = s.y - sn.h; sn.vy = 0; }
    }
    // turn at walls and at the edge of a drop
    const aheadX = sn.dir > 0 ? sn.x + sn.w + 2 : sn.x - 2;
    let wall = false, floorAhead = false;
    for (const s of solids) {
      if (aheadX > s.x && aheadX < s.x + s.w) {
        if (sn.y + sn.h > s.y && sn.y < s.y + s.h) wall = true;
        if (Math.abs(s.y - (sn.y + sn.h)) < 8) floorAhead = true;
      }
    }
    if (wall || !floorAhead) { sn.dir *= -1; sn.x += sn.dir * 2; }
    // CHOMP
    for (const f of fighters) {
      if (f.ko || f.hurtFlash > 0 || sn.grace > 0) continue;
      if (overlaps(sn, f)) {
        damageFighter(f, 6, sn.dir);
        sn.grace = 0.8;
        hissSound();
      }
    }
    // a sword swing squishes a snake
    for (const f of fighters) {
      if (f.attack > 0.09 && overlaps(attackBox(f), sn)) {
        sn.dead = true;
        fxRings.push({ x: sn.x + sn.w / 2, y: sn.y + sn.h / 2, t: 0.4, color: '#7ddf8f' });
        beep(300, 0.1, 'triangle', 0.12);
      }
    }
  }

  // ---- spikes don't care WHOSE team you're on ----
  for (const f of fighters) {
    if (f.ko || f.hurtFlash > 0) continue;
    for (const sp of spikeRects) {
      if (!overlaps(f, sp)) continue;
      f.hp -= 8;
      f.hurtFlash = 0.5;
      f.vy = -450;                                   // OW. up you go.
      bonkSound();
      hitFx.push({ x: f.x + f.w / 2, y: f.y + 14, t: 0.35 });
      if (f.hp <= 0) { f.ko = true; f.vy = -560; koSound(); }
      break;
    }
  }

  // ---- falling off the arena is a RING-OUT ----
  for (const f of fighters) {
    if (!f.ko && f.y > levelBottom + 320) {
      f.ko = true;
      koSound();
    }
  }

  // ---- somebody down? ----
  if (bot.ko && !banner) {
    const reward = 10 + save.round * 6;
    banner = { text: 'ROUND ' + save.round + ' — YOU WIN!', coins: reward, timer: 0 };
    save.coins += reward;
    save.round++;
    persist();
    winSound();
  } else if (you.ko && !banner) {
    banner = { text: 'KNOCKED OUT...', coins: 0, timer: 0 };
  }

  // ---- camera keeps both fighters in frame ----
  const midX = (you.x + bot.x) / 2;
  camX = Math.max(0, Math.min(Math.max(0, worldW - canvas.width), midX - canvas.width / 2));
  camY = Math.min(levelBottom + 60 - canvas.height, 0);
  camY = Math.max(camY, Math.min(you.y, bot.y) - canvas.height * 0.4);
  camY = Math.min(camY, levelBottom + 60 - canvas.height);
}

// ---------------------------------------------------------------------
// DRAWING — stick figures with genuine attitude
// ---------------------------------------------------------------------
function drawStickman(f, color) {
  const cx = f.x + f.w / 2;
  const top = f.y;
  ctx.save();
  if (f.ko) {
    ctx.translate(cx, f.y + f.h / 2);
    ctx.rotate(f.koSpin);
    ctx.translate(-cx, -(f.y + f.h / 2));
  } else if (f.flipA > 0) {
    // mid-backflip: rotate the whole fighter BACKWARD around its middle
    ctx.translate(cx, f.y + f.h / 2);
    ctx.rotate(-f.facing * f.flipA);
    ctx.translate(-cx, -(f.y + f.h / 2));
  }
  ctx.strokeStyle = f.hurtFlash > 0 && Math.floor(elapsed * 20) % 2 ? '#ffffff' : color;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  // head
  ctx.beginPath();
  ctx.arc(cx, top + 10, 10, 0, Math.PI * 2);
  ctx.stroke();
  // body
  ctx.beginPath();
  ctx.moveTo(cx, top + 20);
  ctx.lineTo(cx, top + 38);
  ctx.stroke();
  // legs: scissor while running, together while flying
  const step = f.onGround && f.vx !== 0 ? Math.sin(f.walk * 13) * 9 : (f.onGround ? 0 : 5);
  ctx.beginPath();
  ctx.moveTo(cx, top + 38);
  ctx.lineTo(cx - 8 - step, top + 56);
  ctx.moveTo(cx, top + 38);
  ctx.lineTo(cx + 8 + step, top + 56);
  ctx.stroke();
  // arms: one swings the stick-sword during an attack
  const swing = f.attack > 0 ? (0.18 - f.attack) / 0.18 : 0;
  ctx.beginPath();
  ctx.moveTo(cx, top + 26);
  ctx.lineTo(cx - f.facing * 10, top + 34);        // back arm
  ctx.stroke();
  const ang = swing > 0 ? -1.9 + swing * 2.6 : -0.5;   // the swing arc
  const ax = cx + f.facing * Math.cos(ang) * 16;
  const ay = top + 26 + Math.sin(ang) * 16;
  ctx.beginPath();
  ctx.moveTo(cx, top + 26);
  ctx.lineTo(ax, ay);
  ctx.stroke();
  // whatever this fighter is holding
  const tipX = ax + f.facing * Math.cos(ang - 0.2) * 26;
  const tipY = ay + Math.sin(ang - 0.2) * 26;
  if (f.weapon === 'shotgun') {
    ctx.strokeStyle = '#8a7a5a';                    // a chunky boom-stick
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + f.facing * 30, ay - 2);
    ctx.stroke();
    ctx.strokeStyle = '#5a5040';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ax + f.facing * 30, ay - 2);
    ctx.lineTo(ax + f.facing * 40, ay - 3);
    ctx.stroke();
  } else if (f.weapon === 'brush') {
    ctx.strokeStyle = '#c8c0b0';                    // brush handle...
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.fillStyle = '#7dd3ff';                      // ...with a paint-loaded tip
    ctx.beginPath();
    ctx.arc(tipX, tipY, 6, 0, Math.PI * 2);
    ctx.fill();
  } else if (f.weapon === 'portal') {
    ctx.strokeStyle = '#c8c0b0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax + f.facing * 20, ay - 4);
    ctx.stroke();
    ctx.strokeStyle = '#ff9f43';                    // the humming portal ring
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(ax + f.facing * 26, ay - 5, 7, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    ctx.strokeStyle = '#c8c0b0';                    // the trusty stick-sword
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
  }
  ctx.restore();
}

function drawArenaWorld() {
  for (const s of solids) {
    if (s.x + s.w < camX - 40 || s.x > camX + canvas.width + 40) continue;
    // painted walls wear their painter's color — blue yours, red the bot's
    ctx.fillStyle = s.painted === 'bot' ? '#5a1e28'
                  : s.painted ? '#1e4a5a' : '#2a3040';
    ctx.fillRect(s.x, s.y, s.w, s.h);
    if (s.lid) {
      ctx.fillStyle = s.painted === 'bot' ? '#ff6b5e'
                    : s.painted ? '#7dd3ff' : '#4a5a78';
      ctx.fillRect(s.x, s.y, s.w, 8);
    }
  }
  for (const sp of spikeRects) drawSpikeCell(sp.x - 4, sp.y - TILE * 0.45);
}

// a snake: a wavy green line with a head, a flicking tongue, and
// absolutely no loyalty to anyone
function drawSnake(sn, t) {
  const headX = sn.dir > 0 ? sn.x + sn.w - 4 : sn.x + 4;
  ctx.strokeStyle = '#5aa845';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 8; i++) {
    const px = sn.x + (sn.w - 8) * (i / 8) + 4;
    const py = sn.y + sn.h - 5 + Math.sin(t * 10 + i * 1.3 + sn.x) * 3.5;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.fillStyle = '#5aa845';                          // the head
  ctx.beginPath();
  ctx.arc(headX, sn.y + sn.h - 6, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffd23f';                          // beady little eye
  ctx.beginPath();
  ctx.arc(headX + sn.dir * 2, sn.y + sn.h - 8, 1.8, 0, Math.PI * 2);
  ctx.fill();
  if (Math.sin(t * 6 + sn.x) > 0.4) {                 // tongue check
    ctx.strokeStyle = '#e8453c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(headX + sn.dir * 6, sn.y + sn.h - 6);
    ctx.lineTo(headX + sn.dir * 13, sn.y + sn.h - 8);
    ctx.moveTo(headX + sn.dir * 10, sn.y + sn.h - 7);
    ctx.lineTo(headX + sn.dir * 13, sn.y + sn.h - 4);
    ctx.stroke();
  }
}

// a cell of gleaming arena spikes — impartial and very pointy
function drawSpikeCell(x, y) {
  ctx.fillStyle = '#8a8378';
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const sx = x + 4 + i * 13;
    ctx.moveTo(sx, y + TILE);
    ctx.lineTo(sx + 6.5, y + TILE * 0.2);
    ctx.lineTo(sx + 13, y + TILE);
  }
  ctx.fill();
  ctx.fillStyle = '#d8d2c8';
  for (let i = 0; i < 3; i++) {
    const sx = x + 4 + i * 13;
    ctx.fillRect(sx + 4.5, y + TILE * 0.2, 4, 8);
  }
}

function drawBattle() {
  const W = canvas.width, H = canvas.height;
  uiRects = [];
  // arena night sky + distant crowd sparkles
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#10131a');
  bg.addColorStop(1, '#232a3a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 40; i++) {
    const tw = Math.sin(elapsed * 2 + i * 7) > 0.6 ? 1 : 0;
    if (tw) ctx.fillRect((i * 97) % W, (i * 53) % (H / 2), 2, 2);
  }

  ctx.save();
  ctx.translate(-camX, -camY);
  drawArenaWorld();
  for (const sn of snakes) {
    if (!sn.dead) drawSnake(sn, elapsed);
  }
  drawStickman(fighters[0], '#7dd3ff');
  drawStickman(fighters[1], '#ff6b5e');
  // shotgun pellets, hot and yellow
  ctx.fillStyle = '#ffd23f';
  for (const p of pellets) {
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  }
  // portal rings, blooming open
  for (const r of fxRings) {
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = r.t / 0.4;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 12 + (0.4 - r.t) * 110, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // impact stars
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 26px monospace';
  ctx.textAlign = 'center';
  for (const fx of hitFx) {
    ctx.globalAlpha = fx.t / 0.35;
    ctx.fillText(['POW', 'BONK', 'WHAM'][Math.floor(fx.x) % 3], fx.x, fx.y - (0.35 - fx.t) * 60);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // health bars
  const you = fighters[0], bot = fighters[1];
  function bar(x, f, color, name) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(x, 14, 240, 22);
    ctx.fillStyle = color;
    ctx.fillRect(x + 2, 16, 236 * Math.max(0, f.hp / f.maxHp), 18);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(name, x + 6, 30);
  }
  bar(14, you, '#3a9ad9', 'YOU');
  bar(canvas.width - 254, bot, '#d94a3a', 'BOT ' + save.round);

  // what you're holding, and whether it's ready
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 13px monospace';
  const wtxt = you.weapon === 'shotgun'
      ? '🔫 SHOTGUN — click to blast' + (you.gunCd > 0 ? ' (reloading...)' : '')
    : you.weapon === 'portal'
      ? '🌀 PORTAL GUN — click to teleport' + (you.portalCd > 0 ? ' (' + you.portalCd.toFixed(1) + 's)' : '')
    : you.weapon === 'brush'
      ? '🖌 PAINT BRUSH — paint: ' + you.paint + ' — click=wall, click your wall=SPIKES, J=swing'
    : 'STICK SWORD';
  ctx.fillText(wtxt, 14, 52);

  if (weaponNotice > 0 && !banner) {
    const wname = w => w === 'shotgun' ? 'the SHOTGUN' : w === 'portal' ? 'the PORTAL GUN'
                     : w === 'brush' ? 'the PAINT BRUSH' : 'the STICK SWORD';
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, weaponNotice);
    ctx.fillStyle = '#ffd23f';
    ctx.font = `bold ${Math.min(30, canvas.width / 20)}px monospace`;
    ctx.fillText('you drew: ' + wname(you.weapon) + '!', canvas.width / 2, canvas.height * 0.22);
    ctx.fillStyle = '#ff6b5e';
    ctx.font = `bold ${Math.min(22, canvas.width / 28)}px monospace`;
    ctx.fillText('the bot drew: ' + wname(bot.weapon) + '...', canvas.width / 2, canvas.height * 0.22 + 36);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '13px monospace';
  ctx.fillText('move: ←→/AD   jump: ↑/W/space   attack: J / X / click', canvas.width / 2, 30);
  if ('ontouchstart' in window) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = 'bold 34px monospace';
    ctx.fillText('◀', canvas.width * 0.11, canvas.height - 40);
    ctx.fillText('▶', canvas.width * 0.33, canvas.height - 40);
    ctx.fillText('⤴', canvas.width * 0.8, canvas.height * 0.5);
    ctx.fillText('⚔', canvas.width * 0.8, canvas.height - 40);
  }

  if (banner) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = banner.coins ? '#ffd23f' : '#ff6b5e';
    ctx.font = `bold ${Math.min(46, canvas.width / 14)}px monospace`;
    ctx.fillText(banner.text, canvas.width / 2, canvas.height / 2 - 20);
    ctx.fillStyle = '#fff';
    ctx.font = '18px monospace';
    if (banner.coins) ctx.fillText('+' + banner.coins + ' coins!', canvas.width / 2, canvas.height / 2 + 20);
    if (banner.timer > 0.8) {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('tap to continue', canvas.width / 2, canvas.height / 2 + 54);
    }
  }
}

// ---------------------------------------------------------------------
// MENU + SHOP + BUILDER SCREENS
// ---------------------------------------------------------------------
function bigButton(x, y, w, h, id, label, sub, color) {
  uiRects.push({ x, y, w, h, id });
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.font = `bold ${Math.min(26, w / 9)}px monospace`;
  ctx.fillText(label, x + w / 2, y + h / 2 - 4);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '13px monospace';
  ctx.fillText(sub, x + w / 2, y + h / 2 + 20);
}

function drawMenu() {
  const W = canvas.width, H = canvas.height;
  uiRects = [];
  ctx.fillStyle = '#10131a';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7dd3ff';
  ctx.font = `bold ${Math.min(58, W / 10)}px monospace`;
  ctx.fillText('STICK ARENA', W / 2, H * 0.2);
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('coins: ' + save.coins + '   round: ' + save.round, W / 2, H * 0.2 + 34);

  const bw = Math.min(W - 60, 380), bh = 74;
  const bx = W / 2 - bw / 2;
  bigButton(bx, H * 0.34, bw, bh, 'battle', '⚔  BATTLE', 'round ' + save.round + ' awaits', '#ff6b5e');
  bigButton(bx, H * 0.34 + 90, bw, bh, 'build', '🔨  BUILD ARENA', 'paint your own battleground', '#7ddf8f');
  bigButton(bx, H * 0.34 + 180, bw, bh, 'shop', '⬆  UPGRADE', 'spend coins, grow stronger', '#ffd23f');

  // two little stickmen posing under the title
  const t = elapsed;
  fightersPose(W / 2 - 120, H * 0.27, '#7dd3ff', Math.sin(t * 2) * 0.2);
  fightersPose(W / 2 + 120, H * 0.27, '#ff6b5e', Math.sin(t * 2 + 3) * 0.2);
}
function fightersPose(x, y, color, tilt) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, -26, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-7, 16); ctx.moveTo(0, 0); ctx.lineTo(7, 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-12, -4); ctx.moveTo(0, -12); ctx.lineTo(14, -18); ctx.stroke();
  ctx.restore();
}

function drawShop() {
  const W = canvas.width, H = canvas.height;
  uiRects = [];
  ctx.fillStyle = '#10131a';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd23f';
  ctx.font = `bold ${Math.min(40, W / 14)}px monospace`;
  ctx.fillText('UPGRADES', W / 2, 60);
  ctx.font = 'bold 18px monospace';
  ctx.fillText('coins: ' + save.coins, W / 2, 92);

  const cw = Math.min(W - 40, 460), ch = 84;
  const cx0 = W / 2 - cw / 2;
  UPGRADES.forEach((u, i) => {
    const y = 120 + i * (ch + 14);
    const level = save[u.key];
    const cost = upCost(level);
    const maxed = level >= 12;
    const can = !maxed && save.coins >= cost;
    uiRects.push({ x: cx0, y, w: cw, h: ch, id: 'buy_' + u.key });
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(cx0, y, cw, ch);
    ctx.strokeStyle = maxed ? '#7ddf8f' : can ? '#ffd23f' : '#4a5060';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx0, y, cw, ch);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.fillText(u.name, cx0 + 16, y + 32);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '13px monospace';
    ctx.fillText(u.desc + '  —  now: ' + stat(u.key), cx0 + 16, y + 56);
    // level pips
    for (let p = 0; p < 12; p++) {
      ctx.fillStyle = p < level ? '#7ddf8f' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(cx0 + 16 + p * 14, y + 66, 10, 6);
    }
    ctx.textAlign = 'right';
    ctx.fillStyle = maxed ? '#7ddf8f' : can ? '#ffd23f' : '#7a8090';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(maxed ? 'MAX!' : cost + ' coins', cx0 + cw - 16, y + 40);
  });
  ctx.textAlign = 'center';
  bigButton(W / 2 - 90, 120 + 4 * 98 + 10, 180, 54, 'menu', '← MENU', '', '#7dd3ff');
}

const TOOLS = [
  ['ground', 'GROUND'], ['spike', 'SPIKE'], ['snake', 'SNAKE'],
  ['you', 'YOU'], ['enemy', 'ENEMY'],
  ['erase', 'ERASE'], ['pan', 'PAN'],
];
function drawBuild() {
  const W = canvas.width, H = canvas.height;
  uiRects = [];
  if (keys['arrowleft'] || keys['a']) editCamX -= 10;
  if (keys['arrowright'] || keys['d']) editCamX += 10;
  if (keys['arrowup'] || keys['w']) editCamY -= 10;
  if (keys['arrowdown'] || keys['s']) editCamY += 10;

  ctx.fillStyle = '#151922';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-editCamX, -editCamY);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const gx0 = Math.floor(editCamX / TILE) * TILE, gy0 = Math.floor(editCamY / TILE) * TILE;
  for (let gx = gx0; gx < editCamX + W + TILE; gx += TILE) {
    ctx.beginPath(); ctx.moveTo(gx, editCamY); ctx.lineTo(gx, editCamY + H); ctx.stroke();
  }
  for (let gy = gy0; gy < editCamY + H + TILE; gy += TILE) {
    ctx.beginPath(); ctx.moveTo(editCamX, gy); ctx.lineTo(editCamX + W, gy); ctx.stroke();
  }
  for (const key of arena.tiles) {
    const [cx, cy] = key.split(',').map(Number);
    ctx.fillStyle = '#2a3040';
    ctx.fillRect(cx * TILE, cy * TILE, TILE, TILE);
    if (!arena.tiles.has(cx + ',' + (cy - 1))) {
      ctx.fillStyle = '#4a5a78';
      ctx.fillRect(cx * TILE, cy * TILE, TILE, 8);
    }
  }
  for (const key of arena.spikes) {
    const [cx, cy] = key.split(',').map(Number);
    drawSpikeCell(cx * TILE, cy * TILE);
  }
  for (const key of arena.snakes) {
    const [cx, cy] = key.split(',').map(Number);
    drawSnake({ x: cx * TILE + 1, y: cy * TILE + TILE - 14, w: 44, h: 14, dir: 1 }, elapsed);
  }
  fightersPose(arena.you[0] * TILE + TILE / 2, arena.you[1] * TILE + TILE / 2, '#7dd3ff', 0);
  fightersPose(arena.enemy[0] * TILE + TILE / 2, arena.enemy[1] * TILE + TILE / 2, '#ff6b5e', 0);
  if (hoverPt && hoverPt.y > toolbarH && tool !== 'pan') {
    const hcx = Math.floor((hoverPt.x + editCamX) / TILE);
    const hcy = Math.floor((hoverPt.y + editCamY) / TILE);
    ctx.strokeStyle = 'rgba(255, 210, 63, 0.8)';
    ctx.lineWidth = 2;
    ctx.strokeRect(hcx * TILE, hcy * TILE, TILE, TILE);
  }
  ctx.restore();

  // toolbar — measured first so it can GROW when buttons wrap on
  // narrow screens (no more hidden ERASE button!)
  const resetArmed = performance.now() < resetArmUntil;
  const all = TOOLS.concat([['battle', '⚔ FIGHT'], ['menu', 'MENU'],
                            ['reset', resetArmed ? 'REALLY?' : 'RESET']]);
  const places = [];
  let bx = 8, by = 8;
  for (const [id, label] of all) {
    const bw = Math.max(64, label.length * 11 + 20);
    if (bx + bw > W - 8) { bx = 8; by += 42; }
    places.push({ id, label, x: bx, y: by, w: bw });
    bx += bw + 8;
  }
  toolbarH = by + 38 + 26;
  ctx.fillStyle = 'rgba(8, 10, 14, 0.9)';
  ctx.fillRect(0, 0, W, toolbarH);
  for (const p of places) {
    uiRects.push({ x: p.x, y: p.y, w: p.w, h: 38, id: p.id });
    const active = tool === p.id;
    const danger = p.id === 'reset' && resetArmed;
    ctx.fillStyle = danger ? 'rgba(232, 69, 60, 0.35)'
                  : p.id === 'battle' ? 'rgba(255, 107, 94, 0.2)'
                  : active ? 'rgba(255, 210, 63, 0.25)' : 'rgba(255,255,255,0.07)';
    ctx.fillRect(p.x, p.y, p.w, 38);
    ctx.strokeStyle = danger ? '#e8453c' : p.id === 'battle' ? '#ff6b5e'
                    : active ? '#ffd23f' : '#5a5450';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, 38);
    ctx.fillStyle = danger ? '#ff9f97' : p.id === 'battle' ? '#ff6b5e'
                  : active ? '#ffd23f' : '#c8c0b8';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.label, p.x + p.w / 2, p.y + 25);
  }
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '13px monospace';
  ctx.fillText('paint the arena — YOU and ENEMY place the fighters — two-finger swipe (or right-drag) to look around',
               10, toolbarH - 10);
}

// ---------------------------------------------------------------------
// THE GAME LOOP
// ---------------------------------------------------------------------
let lastTime = 0;
function loop(time) {
  const dt = Math.min(0.03, (time - lastTime) / 1000);
  lastTime = time;
  update(dt);                                // update() ticks `elapsed` for every screen
  if (screen === 'menu') drawMenu();
  else if (screen === 'shop') drawShop();
  else if (screen === 'build') drawBuild();
  else drawBattle();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
