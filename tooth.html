<body>
<!-- THE WAY HOME. Every game in the arcade has this same pill in the same
     corner, so wherever you are you can always get back to the menu. -->
<a id="back" class="arcade-pill arcade-float" href="index.html"
   aria-label="Back to Max's Arcade"><span class="ah-arrow">&larr;</span>Arcade</a>
<script>
/* Games grab every touch on the window and call preventDefault, which would
   swallow a tap on this link. So the pill handles its own tap first and
   stops the event going any further. */
(function () {
  var pill = document.getElementById('back');
  if (!pill) return;
  var go = function (e) { e.stopPropagation(); e.preventDefault(); location.href = 'index.html'; };
  ['click', 'touchend'].forEach(function (t) { pill.addEventListener(t, go, { passive: false }); });
  ['mousedown', 'touchstart', 'pointerdown'].forEach(function (t) {
    pill.addEventListener(t, function (e) { e.stopPropagation(); }, { passive: false });
  });
})();
</script>

<canvas id="screen"></canvas>

<script>
// ===================================================================
//  DEFEND THE TOOTH
//
//  Germs march down the road towards your tooth. You cannot move them
//  and you cannot block them - the road is the road. All you can do is
//  put things BESIDE it that shoot.
//
//  Which makes the whole game one question, asked over and over:
//  where does a tower see the most road?
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;
  function resize() {
    W = canvas.width  = canvas.clientWidth  = window.innerWidth;
    H = canvas.height = canvas.clientHeight = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function dist(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }


// -------------------------------------------------------------------
//  THE MAP
// -------------------------------------------------------------------

  // Tall and narrow, because a phone is. A 15-wide map left the
  // board filling only the top third of the screen.
  const COLS = 10, ROWS = 15;

  // How many hits the armoured ones take. Not how much damage - HITS.
  const MEGA_HITS = 50;
  const ULTRA_HITS = 200;

  // And how often the ULTRA turns up: on the CLOCK, not on the wave
  // count. Fifteen real minutes.
  const ULTRA_EVERY = 15 * 60;

  let road = [];      // the cells the germs walk, start to tooth
  let isRoad = [];    // quick lookup: is this cell part of the road?

  // A road that always gets from the top edge to the bottom without ever
  // crossing itself. It goes down a bit, then left or right a bit, and
  // never turns sideways twice in the same row - which is what stops it
  // walking back over its own tail.
  function makeRoad() {
    let r = 0, c = 2 + Math.floor(Math.random() * (COLS - 4));
    const cells = [{ c: c, r: r }];

    while (r < ROWS - 1) {
      const run = 1 + Math.floor(Math.random() * 3);
      for (let k = 0; k < run && r < ROWS - 1; k++) { r++; cells.push({ c: c, r: r }); }

      const dir = Math.random() < 0.5 ? -1 : 1;
      const hrun = Math.floor(Math.random() * 4);
      for (let k = 0; k < hrun; k++) {
        const nc = c + dir;
        if (nc < 1 || nc > COLS - 2) break;
        c = nc;
        cells.push({ c: c, r: r });
      }
    }

    isRoad = [];
    for (let y = 0; y < ROWS; y++) {
      const row = [];
      for (let x = 0; x < COLS; x++) row.push(false);
      isRoad.push(row);
    }
    for (const cell of cells) isRoad[cell.r][cell.c] = true;
    return cells;
  }


// -------------------------------------------------------------------
//  WHAT YOU CAN BUILD
//
//  range is in squares. rate is shots per second. Everything else in
//  the game is worked out from these three numbers.
// -------------------------------------------------------------------

  const TOWERS = [
    { name: 'BRUSH', cost: 20, range: 2.2, rate: 2.4, dmg: 4,
      col: [110, 200, 255], blurb: 'quick, short reach' },
    { name: 'FLOSS', cost: 45, range: 4.2, rate: 0.8, dmg: 14,
      col: [190, 150, 255], blurb: 'slow, hits hard, sees far' },

    // ---- THE PASTE TUBE ------------------------------------------------
    // It squirts, and toothpaste SPLATTERS. Everything within splash of
    // where the blob lands gets hit, not just what it was aimed at.
    //
    // Which is the answer to the thing the other two are bad at: a mega
    // germ bursts into four at once, and a brush can only hit one of
    // them at a time. Against armour every germ splashed counts as its
    // own hit, so one squirt into a huddle is worth four.
    { name: 'PASTE', cost: 35, range: 2.9, rate: 1.1, dmg: 6, splash: 1.15,
      col: [120, 235, 200], blurb: 'squirts - splatters everything nearby' }
  ];

  const GERMS = [
    { name: 'GERM',   hp: 14,  speed: 1.9, cash: 4,  col: [120, 220, 130], r: 0.30 },
    { name: 'SUGAR',  hp: 9,   speed: 3.4, cash: 5,  col: [255, 210, 120], r: 0.26 },
    { name: 'PLAQUE', hp: 52,  speed: 1.1, cash: 12, col: [200, 190, 150], r: 0.40 },

    // ---- THE MEGA GERM -------------------------------------------------
    // It does not care how HARD you hit it, only how OFTEN. Every shot
    // takes exactly one off, whatever fired it - so fifty hits, always.
    //
    // Which turns the towers upside down. FLOSS hits for 14 and is the
    // best thing you own against everything else; against this it is the
    // worst, because 14 damage and 4 damage are both worth one hit. Four
    // cheap BRUSHES firing fast beat one expensive FLOSS.
    // And killing it does not end the problem - it BURSTS into four
    // ordinary germs, right where it stood. So the fifty hits only buy
    // you the mega; you still have to deal with what falls out.
    { name: 'MEGA GERM', hp: MEGA_HITS, speed: 0.75, cash: 60,
      col: [230, 110, 190], r: 0.62, armour: true, splits: 4, into: 0 },

    // ---- THE ULTRA MEGA GERM ---------------------------------------
    // Two hundred hits, and when it finally goes it leaves TWO mega
    // germs - which are fifty hits each and burst into four apiece. So
    // one of these is 200 + 100 hits and eight germs at the end of it.
    { name: 'ULTRA MEGA', hp: ULTRA_HITS, speed: 0.55, cash: 250,
      col: [255, 80, 80], r: 0.92, armour: true, splits: 2, into: 3 }
  ];


// -------------------------------------------------------------------
//  THE STATE OF PLAY
// -------------------------------------------------------------------

  const START_CASH = 70, START_TEETH = 12;

  let towers = [], germs = [], shots = [], bits = [];
  let cash = START_CASH, teeth = START_TEETH, wave = 0;
  let picked = 0;                 // which tower you have selected
  let running = false;            // is a wave marching?
  let toSpawn = [], spawnT = 0;
  let says = '', saysT = 0;
  let lost = false;
  let clock = 0;                  // real seconds of playing, all runs
  let ultrasDue = 0;              // how many are waiting to be sent in

  function say(w) { says = w; saysT = 2.8; }

  function reset() {
    road = makeRoad();
    towers = []; germs = []; shots = []; bits = [];
    cash = START_CASH; teeth = START_TEETH; wave = 0;
    picked = 0; running = false; toSpawn = []; lost = false;
    // The ULTRA clock is NOT reset here, on purpose. It counts the whole
    // time you have been playing, not one go - because a run only lasts
    // about eleven minutes and the ULTRA is due at fifteen, so resetting
    // it every game meant it could never arrive at all. Measured: 0 of
    // 15 runs ever saw one. Now it turns up while you are playing, even
    // if you died and started again on the way there.
    say('put a brush next to the road, then send them in');
  }

  // Wave 1 is a handful of germs. Later waves are bigger, faster and
  // bring the tough ones - worked out from the wave number so there is
  // no long list to keep in step.
  function buildWave(n) {
    const list = [];
    const count = 5 + n * 2;
    for (let i = 0; i < count; i++) {
      let kind = 0;
      if (n >= 2 && i % 4 === 3) kind = 1;              // sugar rushes
      if (n >= 3 && i % 7 === 6) kind = 2;              // and the fat ones
      list.push(kind);
    }
    // MEGA GERMS bring up the rear from wave 5, and another one every
    // four waves after that.
    if (n >= 5) {
      const megas = 1 + Math.floor((n - 5) / 4);
      for (let m = 0; m < megas; m++) list.push(3);
    }
    return list;
  }

  // Each wave's germs are 18% beefier than the last. That multiply is
  // the whole difficulty curve, and it is a measured number: a player
  // who fills every good spot beside the road reaches roughly wave 18
  // before the tooth goes. Adding a flat amount each wave never caught
  // up at all - 30 games, 30 of them still going strong at wave 30.
  //   flat +0.35  -> never loses      x1.25 -> dies wave 15
  //   x1.18       -> dies wave 18-20  x1.40 -> dies wave 10
  function toughness(n) { return Math.pow(1.18, n - 1); }

  function startWave() {
    if (running || lost) return;
    wave++;
    toSpawn = buildWave(wave);
    // Anything the clock has queued up joins this wave, at the back.
    while (ultrasDue > 0) { toSpawn.push(4); ultrasDue--; }
    spawnT = 0;
    running = true;
    say('wave ' + wave + ' - ' + toSpawn.length + ' of them');
  }

  function spawnGerm(kind, at) {
    const g = GERMS[kind];
    // An armoured one is exactly MEGA_HITS hits, in wave 5 and in wave
    // 25. Scaling that with the wave would have meant 250 hits by the
    // end, which is not a monster, it is a wait.
    const hp = g.armour ? g.hp : g.hp * toughness(wave);
    germs.push({ kind: kind, at: at || 0, hp: hp, max: hp, speed: g.speed,
                 armour: !!g.armour, wob: Math.random() * 6 });
  }

  // Where a germ is on the map right now, in cell coordinates.
  function germCell(g) {
    const i = Math.floor(g.at);
    const f = g.at - i;
    const a = road[Math.min(i, road.length - 1)];
    const b = road[Math.min(i + 1, road.length - 1)];
    return { c: a.c + (b.c - a.c) * f, r: a.r + (b.r - a.r) * f };
  }

  // What falls out of a mega germ when it goes. They come out strung
  // BACKWARDS along the road from where it died, so they spill out
  // behind it rather than all landing on the same spot - and never past
  // the tooth, which would be a free hit.
  function burst(g) {
    const spec = GERMS[g.kind];
    if (!spec.splits) return;
    for (let i = 0; i < spec.splits; i++) {
      const at = clamp(g.at - i * 0.5, 0, road.length - 1.02);
      spawnGerm(spec.into, at);
    }
  }

  // Everything that damages a germ goes through here, so a splash and a
  // single shot cannot drift apart in what they do when one dies.
  function hurtGerm(g, amount) {
    g.hp -= g.armour ? 1 : amount;      // armour counts hits, not damage
    if (g.hp > 0) return;

    const idx = germs.indexOf(g);
    if (idx < 0) return;                // something already finished it
    cash += GERMS[g.kind].cash;

    const b = board(), p = germCell(g);
    pop(b.x + (p.c + 0.5) * b.s, b.y + (p.r + 0.5) * b.s, GERMS[g.kind].col);
    germs.splice(idx, 1);

    if (GERMS[g.kind].splits) {
      pop(b.x + (p.c + 0.5) * b.s, b.y + (p.r + 0.5) * b.s, GERMS[g.kind].col);
      burst(g);
      say('it burst into ' + GERMS[g.kind].splits + '!');
    }
  }

  function pop(x, y, col) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
      bits.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                  life: 0.4 + Math.random() * 0.3, col: col });
    }
    if (bits.length > 300) bits.splice(0, bits.length - 300);
  }


// -------------------------------------------------------------------
//  BUILDING
// -------------------------------------------------------------------

  function towerAt(c, r) {
    for (const t of towers) if (t.c === c && t.r === r) return t;
    return null;
  }

  function place(c, r) {
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;

    const there = towerAt(c, r);
    if (there) {                       // tap your own tower to sell it
      const half = Math.floor(TOWERS[there.kind].cost / 2);
      towers.splice(towers.indexOf(there), 1);
      cash += half;
      say('sold for ' + half);
      return;
    }

    if (isRoad[r][c]) { say('that is the road - they walk there'); return; }

    const spec = TOWERS[picked];
    if (cash < spec.cost) { say('not enough - ' + spec.name + ' costs ' + spec.cost); return; }

    cash -= spec.cost;
    towers.push({ kind: picked, c: c, r: r, cool: 0, aim: 0 });
  }


// -------------------------------------------------------------------
//  THE WAVE
// -------------------------------------------------------------------

  function update(dt) {
    if (saysT > 0) saysT -= dt;

    // The ULTRA runs on a real clock, so it keeps ticking whether you
    // are fighting or still deciding where to put a brush.
    if (!lost) {
      const was = Math.floor(clock / ULTRA_EVERY);
      clock += dt;
      if (Math.floor(clock / ULTRA_EVERY) > was) {
        ultrasDue++;
        say('SOMETHING BIG IS COMING');
        if (running) toSpawn.push(4);        // straight into this wave
      }
    }

    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.life <= 0) { bits.splice(i, 1); continue; }
      b.x += b.vx * dt; b.y += b.vy * dt;
    }
    for (let i = shots.length - 1; i >= 0; i--) {
      shots[i].life -= dt;
      if (shots[i].life <= 0) shots.splice(i, 1);
    }

    if (!running) return;

    // ---- send them in, one at a time ----------------------------------
    spawnT -= dt;
    if (toSpawn.length && spawnT <= 0) {
      spawnGerm(toSpawn.shift());
      spawnT = 0.75;
    }

    // ---- they march ----------------------------------------------------
    for (let i = germs.length - 1; i >= 0; i--) {
      const g = germs[i];
      g.at += g.speed * dt;
      if (g.at >= road.length - 1) {
        // It reached the tooth. That hurts.
        germs.splice(i, 1);
        teeth--;
        say('OW! a germ got through');
        if (teeth <= 0) {
          teeth = 0; lost = true; running = false;
          say('your tooth has had it - tap to start again');
        }
      }
    }

    // ---- and the towers shoot -----------------------------------------
    for (const t of towers) {
      const spec = TOWERS[t.kind];
      t.cool -= dt;
      if (t.cool > 0) continue;

      // Aim at whatever is FURTHEST along the road - the one closest to
      // your tooth is the one worth killing.
      let best = null, bestAt = -1;
      for (const g of germs) {
        const p = germCell(g);
        if (dist(p.c, p.r, t.c, t.r) > spec.range) continue;
        if (g.at > bestAt) { bestAt = g.at; best = g; }
      }
      if (!best) continue;

      t.cool = 1 / spec.rate;
      const p = germCell(best);
      t.aim = Math.atan2(p.r - t.r, p.c - t.c);
      shots.push({ fromC: t.c, fromR: t.r, toC: p.c, toR: p.r,
                   life: spec.splash ? 0.16 : 0.09, col: spec.col,
                   splash: spec.splash || 0 });

      // Who catches it. Work the whole list out BEFORE hurting anybody,
      // because a germ bursting adds new ones and we do not want the
      // same squirt hitting the bits it just created.
      let caught = [best];
      if (spec.splash) {
        caught = [];
        for (const g of germs) {
          const q = germCell(g);
          if (dist(q.c, q.r, p.c, p.r) <= spec.splash) caught.push(g);
        }
      }
      for (const g of caught) hurtGerm(g, spec.dmg);
    }

    // ---- wave over? -----------------------------------------------------
    if (running && !toSpawn.length && !germs.length) {
      running = false;
      cash += 15 + wave * 5;
      say('wave ' + wave + ' beaten  -  build, then send the next');
    }
  }


// -------------------------------------------------------------------
//  WHERE EVERYTHING IS
// -------------------------------------------------------------------

  function barH() { return 62; }
  function btnH() { return 56; }
  function btnRow() { return H - btnH() - 12; }

  function board() {
    const top = barH() + 6, bottom = btnRow() - 28;
    const room = bottom - top;
    const s = Math.min((W - 20) / COLS, room / ROWS);
    // Sat in the middle of its room rather than jammed against the top,
    // so a wide screen does not leave a hole under the map.
    return { s: s, x: (W - s * COLS) / 2, y: top + (room - s * ROWS) / 2 };
  }

  function towerBox(i) {
    const n = TOWERS.length + 1;                 // the tools plus SEND
    const gap = 8;
    const w = (W - 24 - gap * (n - 1)) / n;
    return { x: 12 + i * (w + gap), y: btnRow(), w: w, h: btnH() };
  }
  function sendBox() { return towerBox(TOWERS.length); }

  function cellAt(mx, my) {
    const b = board();
    const c = Math.floor((mx - b.x) / b.s);
    const r = Math.floor((my - b.y) / b.s);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return null;
    return { c: c, r: r };
  }


// -------------------------------------------------------------------
//  DRAWING
// -------------------------------------------------------------------

  function rgb(v) { return 'rgb(' + (v[0]|0) + ',' + (v[1]|0) + ',' + (v[2]|0) + ')'; }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawMap() {
    const b = board();

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = b.x + c * b.s, y = b.y + r * b.s;
        ctx.fillStyle = (c + r) % 2 === 0 ? '#172233' : '#14202f';
        ctx.fillRect(x, y, b.s, b.s);
      }
    }

    // The road, drawn as one fat line so the corners join up properly.
    ctx.strokeStyle = '#c9b6a0';
    ctx.lineWidth = b.s * 0.72;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < road.length; i++) {
      const x = b.x + (road[i].c + 0.5) * b.s, y = b.y + (road[i].r + 0.5) * b.s;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.14)';
    ctx.lineWidth = b.s * 0.10;
    ctx.setLineDash([b.s * 0.25, b.s * 0.25]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Where they come in.
    const s0 = road[0];
    ctx.fillStyle = '#7ee08f';
    ctx.font = 'bold ' + b.s * 0.4 + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('IN', b.x + (s0.c + 0.5) * b.s, b.y + (s0.r + 0.66) * b.s);

    // And the tooth they are marching at.
    const e = road[road.length - 1];
    drawTooth(b.x + (e.c + 0.5) * b.s, b.y + (e.r + 0.5) * b.s, b.s * 0.9);
  }

  function drawTooth(cx, cy, s) {
    const hurt = 1 - teeth / START_TEETH;
    ctx.fillStyle = 'rgb(' + Math.round(255 - hurt * 90) + ',' +
                             Math.round(255 - hurt * 110) + ',' +
                             Math.round(245 - hurt * 130) + ')';
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.34, cy - s * 0.30);
    ctx.quadraticCurveTo(cx, cy - s * 0.52, cx + s * 0.34, cy - s * 0.30);
    ctx.lineTo(cx + s * 0.26, cy + s * 0.18);
    ctx.quadraticCurveTo(cx + s * 0.14, cy + s * 0.42, cx + s * 0.06, cy + s * 0.14);
    ctx.quadraticCurveTo(cx, cy - s * 0.02, cx - s * 0.06, cy + s * 0.14);
    ctx.quadraticCurveTo(cx - s * 0.14, cy + s * 0.42, cx - s * 0.26, cy + s * 0.18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#12212f';
    for (let e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.arc(cx + e * s * 0.13, cy - s * 0.10, s * 0.05, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = '#12212f';
    ctx.lineWidth = Math.max(1.5, s * 0.035);
    ctx.beginPath();
    if (teeth <= 3) ctx.arc(cx, cy + s * 0.14, s * 0.09, Math.PI, 2 * Math.PI);
    else ctx.arc(cx, cy + s * 0.04, s * 0.09, 0, Math.PI);
    ctx.stroke();
  }

  function drawTower(t, b) {
    const spec = TOWERS[t.kind];
    const x = b.x + (t.c + 0.5) * b.s, y = b.y + (t.r + 0.5) * b.s;

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(x, y + b.s * 0.06, b.s * 0.34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(spec.col);
    ctx.beginPath(); ctx.arc(x, y, b.s * 0.32, 0, Math.PI * 2); ctx.fill();

    // A little barrel pointing wherever it last shot.
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t.aim);
    ctx.fillStyle = '#0d1520';
    if (t.kind === 0) {
      ctx.fillRect(0, -b.s * 0.09, b.s * 0.42, b.s * 0.18);   // brush head
      ctx.fillStyle = '#eaf2ff';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(b.s * (0.18 + i * 0.08), -b.s * 0.07, b.s * 0.04, b.s * 0.14);
      }
    } else if (t.kind === 1) {
      ctx.lineWidth = Math.max(1.5, b.s * 0.05);              // floss thread
      ctx.strokeStyle = '#0d1520';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(b.s * 0.46, 0); ctx.stroke();
      ctx.fillStyle = '#0d1520';
      ctx.beginPath(); ctx.arc(b.s * 0.46, 0, b.s * 0.07, 0, Math.PI * 2); ctx.fill();
    } else {
      // A squeezed tube with a nozzle.
      ctx.fillStyle = '#0d1520';
      ctx.fillRect(-b.s * 0.05, -b.s * 0.11, b.s * 0.38, b.s * 0.22);
      ctx.beginPath();
      ctx.moveTo(b.s * 0.33, -b.s * 0.08);
      ctx.lineTo(b.s * 0.5, -b.s * 0.05);
      ctx.lineTo(b.s * 0.5, b.s * 0.05);
      ctx.lineTo(b.s * 0.33, b.s * 0.08);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#eaf2ff';
      ctx.fillRect(-b.s * 0.02, -b.s * 0.05, b.s * 0.1, b.s * 0.1);
    }
    ctx.restore();
  }

  function drawGerms(b) {
    for (const g of germs) {
      const spec = GERMS[g.kind];
      const p = germCell(g);
      const x = b.x + (p.c + 0.5) * b.s, y = b.y + (p.r + 0.5) * b.s;
      const rad = b.s * spec.r;
      const wob = Math.sin(g.wob + g.at * 5) * rad * 0.12;

      ctx.fillStyle = rgb(spec.col);
      ctx.beginPath(); ctx.arc(x, y + wob, rad, 0, Math.PI * 2); ctx.fill();

      // Wobbly bumps, so a germ looks like a germ and not a dot.
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      for (let i = 0; i < 4; i++) {
        const a = g.wob + i * 1.6 + g.at;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * rad * 0.55, y + wob + Math.sin(a) * rad * 0.55,
                rad * 0.22, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#0d1520';
      for (let e = -1; e <= 1; e += 2) {
        ctx.beginPath();
        ctx.arc(x + e * rad * 0.32, y + wob - rad * 0.1, rad * 0.16, 0, Math.PI * 2);
        ctx.fill();
      }

      if (g.armour) {
        // A spiky crust, so you can see at a glance this is the one that
        // does not care how hard you hit it.
        ctx.strokeStyle = 'rgba(255,255,255,0.55)';
        ctx.lineWidth = Math.max(1.5, rad * 0.10);
        for (let i = 0; i < 10; i++) {
          const a = g.wob * 0.3 + i * (Math.PI * 2 / 10);
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * rad * 0.9, y + wob + Math.sin(a) * rad * 0.9);
          ctx.lineTo(x + Math.cos(a) * rad * 1.22, y + wob + Math.sin(a) * rad * 1.22);
          ctx.stroke();
        }
        // Hits left, in plain numbers - a bar cannot tell you it is 37.
        ctx.textAlign = 'center';
        ctx.font = 'bold ' + rad * 0.75 + 'px system-ui, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(Math.ceil(g.hp), x, y + wob - rad - b.s * 0.06);
      } else if (g.hp < g.max) {                // a health bar once hurt
        const bw = rad * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(x - bw / 2, y - rad - b.s * 0.16, bw, b.s * 0.08);
        ctx.fillStyle = '#7ee08f';
        ctx.fillRect(x - bw / 2, y - rad - b.s * 0.16, bw * (g.hp / g.max), b.s * 0.08);
      }
    }
  }

  function drawButton(b, label, sub, on, col) {
    ctx.fillStyle = on ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.03)';
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.lineWidth = on ? 3 : 2;
    ctx.strokeStyle = on ? col : 'rgba(255,255,255,0.14)';
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.stroke();

    ctx.textAlign = 'center';
    let fs = Math.min(W * 0.036, 18);
    ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
    const room = b.w - 10, wide = ctx.measureText(label).width;
    if (wide > room) { fs *= room / wide; ctx.font = 'bold ' + fs + 'px system-ui, sans-serif'; }
    ctx.fillStyle = on ? col : '#63708a';
    ctx.fillText(label, b.x + b.w / 2, b.y + (sub ? b.h * 0.44 : b.h * 0.62));

    if (sub) {
      let ss = Math.min(W * 0.028, 14);
      ctx.font = ss + 'px system-ui, sans-serif';
      const w2 = ctx.measureText(sub).width;
      if (w2 > room) { ss *= room / w2; ctx.font = ss + 'px system-ui, sans-serif'; }
      ctx.fillStyle = on ? 'rgba(234,242,255,0.7)' : '#4c586e';
      ctx.fillText(sub, b.x + b.w / 2, b.y + b.h * 0.78);
    }
  }

  function draw() {
    ctx.fillStyle = '#0d1520';
    ctx.fillRect(0, 0, W, H);

    const b = board();
    drawMap();

    // Show what the selected tower would cover, before you commit.
    if (!running && cash >= TOWERS[picked].cost) {
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
    }

    for (const t of towers) drawTower(t, b);
    drawGerms(b);

    for (const s of shots) {
      ctx.strokeStyle = rgb(s.col);
      ctx.lineWidth = Math.max(2, b.s * (s.splash ? 0.14 : 0.09));
      ctx.beginPath();
      ctx.moveTo(b.x + (s.fromC + 0.5) * b.s, b.y + (s.fromR + 0.5) * b.s);
      ctx.lineTo(b.x + (s.toC + 0.5) * b.s, b.y + (s.toR + 0.5) * b.s);
      ctx.stroke();

      // A blob of paste where it landed, showing exactly what got
      // splattered - so the splash is something you can SEE, not just
      // something the numbers do.
      if (s.splash) {
        ctx.fillStyle = 'rgba(' + (s.col[0]|0) + ',' + (s.col[1]|0) + ',' +
                        (s.col[2]|0) + ',0.45)';
        ctx.beginPath();
        ctx.arc(b.x + (s.toC + 0.5) * b.s, b.y + (s.toR + 0.5) * b.s,
                s.splash * b.s, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (const p of bits) {
      ctx.fillStyle = 'rgba(' + (p.col[0]|0) + ',' + (p.col[1]|0) + ',' + (p.col[2]|0) +
                      ',' + clamp(p.life * 3, 0, 1) + ')';
      ctx.fillRect(p.x, p.y, 3, 3);
    }

    // ---- the bar along the top ------------------------------------------
    ctx.textAlign = 'left';
    ctx.font = 'bold ' + Math.min(W * 0.05, 28) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText(cash, 16, 38);
    ctx.font = Math.min(W * 0.026, 13) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#63708a';
    ctx.fillText('coins', 16, 54);

    ctx.textAlign = 'center';
    ctx.font = 'bold ' + Math.min(W * 0.04, 22) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#eaf2ff';
    ctx.fillText('WAVE ' + wave, W / 2, 36);

    // The ULTRA countdown, so it is never a nasty surprise out of
    // nowhere - you can watch it coming and save up.
    const left = Math.max(0, ULTRA_EVERY - (clock % ULTRA_EVERY));
    const mm = Math.floor(left / 60), ss = Math.floor(left % 60);
    ctx.font = Math.min(W * 0.026, 13) + 'px system-ui, sans-serif';
    if (running) {
      ctx.fillStyle = '#63708a';
      ctx.fillText((toSpawn.length + germs.length) + ' left', W / 2, 54);
    } else {
      ctx.fillStyle = left < 60 ? '#ff8a7a' : '#63708a';
      ctx.fillText('ULTRA in ' + mm + ':' + (ss < 10 ? '0' : '') + ss, W / 2, 54);
    }

    ctx.textAlign = 'right';
    ctx.font = 'bold ' + Math.min(W * 0.05, 28) + 'px system-ui, sans-serif';
    ctx.fillStyle = teeth <= 3 ? '#ff8a7a' : '#eaf2ff';
    ctx.fillText(teeth, W - 16, 38);
    ctx.font = Math.min(W * 0.026, 13) + 'px system-ui, sans-serif';
    ctx.fillStyle = '#63708a';
    ctx.fillText('tooth left', W - 16, 54);

    // ---- the buttons -----------------------------------------------------
    for (let i = 0; i < TOWERS.length; i++) {
      const spec = TOWERS[i];
      drawButton(towerBox(i), spec.name, spec.cost + ' coins',
                 picked === i && cash >= spec.cost, rgb(spec.col));
    }
    drawButton(sendBox(), lost ? 'AGAIN' : running ? '...' : 'SEND WAVE ' + (wave + 1),
               lost ? 'start over' : running ? 'they are coming' : 'when you are ready',
               !running || lost, lost ? '#ff8a7a' : '#7ee08f');

    if (saysT > 0) {
      ctx.textAlign = 'center';
      ctx.font = 'bold ' + Math.min(W * 0.032, 17) + 'px system-ui, sans-serif';
      const wid = ctx.measureText(says).width;
      const y = btnRow() - 12;
      ctx.fillStyle = 'rgba(13,21,32,' + clamp(saysT, 0, 1) * 0.9 + ')';
      ctx.fillRect(W / 2 - wid / 2 - 12, y - 18, wid + 24, 26);
      ctx.fillStyle = 'rgba(234,242,255,' + clamp(saysT, 0, 1) + ')';
      ctx.fillText(says, W / 2, y);
    }
  }


// -------------------------------------------------------------------
//  TAPPING
// -------------------------------------------------------------------

  function inBox(mx, my, b) {
    return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  }

  function tap(mx, my) {
    if (lost) {
      if (inBox(mx, my, sendBox())) reset();
      return;
    }
    for (let i = 0; i < TOWERS.length; i++) {
      if (inBox(mx, my, towerBox(i))) { picked = i; say(TOWERS[i].blurb); return; }
    }
    if (inBox(mx, my, sendBox())) { startWave(); return; }

    const cell = cellAt(mx, my);
    if (cell) place(cell.c, cell.r);
  }

  canvas.addEventListener('mousedown', function (e) { tap(e.clientX, e.clientY); });
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (const t of e.changedTouches) tap(t.clientX, t.clientY);
  }, { passive: false });


// -------------------------------------------------------------------
//  THE LOOP
// -------------------------------------------------------------------

  let last = 0;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.0005, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);

</script>
</body>
</html>
