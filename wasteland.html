<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>THE WASTELAND</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a120c; overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 10px;
    text-align: center; color: #d8c4a8; font-size: 14px;
    pointer-events: none; text-shadow: 0 2px 6px #000;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud">MOUSE = look &nbsp;&nbsp; W A S D = move &nbsp;&nbsp; CLICK = shoot &nbsp;&nbsp; SHIFT = run</div>

<script>
// ===================================================================
//  THE WASTELAND
// ===================================================================
//  Dead open ground under a sick orange sky. Ruined towers, burnt-out
//  cars, dust you can taste. Zombies shamble at you. Robots walk at you
//  and shoot back.
//
//  The 3D is the same engine as Bob and the racer - project(), the face
//  list, the painter's sort. Third game on it now, and it hasn't needed
//  changing once.
//
//  The ONE new thing here is FOG, and it does two jobs at the same time:
//  it makes the place feel enormous and choking, and it hides the fact
//  that the world stops about 170 paces away.
// ===================================================================

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0;

  function fitScreen() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', fitScreen);

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // A random number that is always the same for the same input. This is
  // what lets the whole wasteland exist without being stored anywhere -
  // every ruin, every wreck, every tree is worked out fresh each frame
  // and comes out identical every time.
  function hash(n) {
    const x = Math.sin(n * 12.9898) * 43758.5453;
    return x - Math.floor(x);
  }

  // Two numbers in, one out. For grid squares, which need an x AND a z.
  // WHICH PLANET the maths is building. Feed the same hash one extra
  // number and a COMPLETELY different wasteland falls out - different
  // settlements, forts, towers, everything. Seed 0 is the world this
  // game has always had. Changing this one number IS interplanetary
  // travel; the shuttle is just the ceremony around it.
  let PLANET_SEED = 0;

  function hash2(a, b) {
    return hash(a * 374.761 + b * 668.265 + PLANET_SEED * 1237.173);
  }


// -------------------------------------------------------------------
//  THE LOOK OF THE PLACE
// -------------------------------------------------------------------

  let FOG        = [178, 136, 88];    // the colour everything fades into
                                      // ("let", because other planets
                                      //  have other weather)
  const FOG_NEAR = 22;                // fog starts biting here
  const FOG_FAR  = 168;               // and swallows everything by here

  let SKY_TOP  = '#3a2214';
  let SKY_LOW  = '#c9955a';

  let GROUND_TAN = [186, 156, 112];   // the tan Maximus asked for

  const EYE_H = 3.4;                  // how tall you are


// -------------------------------------------------------------------
//  YOU
// -------------------------------------------------------------------

  const player = {
    x: 0, z: 0,
    yaw: 0, pitch: 0,
    health: 100,
    maxHealth: 100,      // quests can raise this
    gunDamage: 1,        // ...and this
    scrap: 0,            // salvage off the things you kill. Buys guards.
    marineRifle: false,  // bought at a marine fort - faster, harder gun
    marineArmour: false, // bought at a marine fort - halves all damage
    bob: 0,              // ticks up while walking, to nod the camera
    kills: 0,
    cool: 0,             // counts down between shots
    hurtFlash: 0
  };

  const WALK     = 20;
  const RUN      = 33;
  const PLAYER_R = 1.7;      // how fat you are, for bumping into things
  const GUN_COOL  = 0.16;    // seconds between shots
  const GUN_RANGE = 150;
  const GUN_AIM   = 0.20;    // how forgiving the aim is, up and down

  let state = 'play';        // 'play', 'board' or 'dead'

  let quest     = null;      // the job you're on, or nothing
  let atBoard   = null;      // the settlement whose board you're stood at
  let atRadio     = null;    // the radio tower you're stood at
  let nearRecruit = null;    // the waiting marine you're stood next to
  let atGear      = null;    // the fort armoury station you're stood at
  let atPad       = null;    // the landing pad whose ship you're stood by
  let questFlash = 0;        // "job done" message
  let questWord  = '';
  let deadTimer = 0;
  let clock = 0;
  let shake = 0;
  let flash = 0;             // muzzle flash


// -------------------------------------------------------------------
//  PROJECT - Bob's, unchanged, for the third time
// -------------------------------------------------------------------

  const cam = { x: 0, y: EYE_H, z: 0, yaw: 0, pitch: 0 };

  // HOW WIDE YOU CAN SEE.
  //
  // This was H * 0.9, which works out to about 80 degrees across. That
  // is NARROW - most first-person games use 90 to 100 - and it's why
  // Maximus kept missing bunkers that were only 69 degrees off centre.
  // They were real, they were drawn, they were simply past the edge of
  // the screen. A smaller number here means a wider view.
  function focal() { return H * 0.72; }

  function project(x, y, z) {
    const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;

    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const rx = dx * cy - dz * sy;
    const rz = dx * sy + dz * cy;
    const ry = dy;

    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const fz = rz * cp + ry * sp;
    const fy = ry * cp - rz * sp;

    return {
      x: W / 2 + rx * focal() / fz,
      y: H / 2 - fy * focal() / fz,
      depth: fz
    };
  }


// -------------------------------------------------------------------
//  THE FACE LIST, NOW WITH FOG
// -------------------------------------------------------------------
//  Fog is one line of maths done to a colour: the further away a thing
//  is, the more of it we replace with the colour of the haze.
//
//     mixed = colour + (fog - colour) * howFarAway
//
//  That's the same slide-between-two-things sum as everything else in
//  every one of your games. At 0 you get the real colour, at 1 you get
//  pure haze, and the whole feeling of standing in a huge dusty dead
//  place falls out of it for free.
// -------------------------------------------------------------------

  let faces = [];

  // SOME THINGS PUNCH THROUGH THE HAZE.
  //
  // Set this to 0.8 and whatever gets drawn next only takes a fifth of
  // the fog it should. That's not cheating - it's how a bright light in
  // fog actually behaves. Everything else out there fades because it's
  // only reflecting a dim sky; a lamp is making its own.
  //
  // Without it, a beacon 150 paces off comes out as [187,147,92]
  // against a fog of [178,136,88]. Nine points of difference. Invisible.
  let fogResist = 0;

  // Normally anything past the fog isn't drawn at all - that's what
  // makes the fog the edge of the world. Beacons are the one exception,
  // because a settlement 800 paces away is no use to you if you can't
  // tell it's there.
  let seeFar = false;

  function fogMix(rgb, depth) {
    const t = clamp((depth - FOG_NEAR) / (FOG_FAR - FOG_NEAR), 0, 1)
              * (1 - fogResist);
    return 'rgb(' +
      ((rgb[0] + (FOG[0] - rgb[0]) * t) | 0) + ',' +
      ((rgb[1] + (FOG[1] - rgb[1]) * t) | 0) + ',' +
      ((rgb[2] + (FOG[2] - rgb[2]) * t) | 0) + ')';
  }

  function shade(rgb, amount) {
    return [rgb[0] * amount, rgb[1] * amount, rgb[2] * amount];
  }

  function addFace(points3d, rgb, lift) {
    const flat = [];
    let total = 0;

    for (const p of points3d) {
      const s = project(p[0], p[1], p[2]);
      if (s.depth < 0.4) return;      // behind the camera - the maths breaks
      flat.push(s);
      total += s.depth;
    }

    const depth = total / flat.length;
    if (depth > FOG_FAR && !seeFar) return;   // past the fog it's invisible
                                              // anyway - don't draw it

    faces.push({
      points: flat,
      depth: depth - (lift || 0),
      colour: fogMix(rgb, depth)
    });
  }

  function addBox(cx, cy, cz, w, h, d, rgb, spin) {
    spin = spin || 0;
    const hw = w / 2, hh = h / 2, hd = d / 2;
    const co = Math.cos(spin), si = Math.sin(spin);

    const local = [
      [-hw, -hh, -hd], [ hw, -hh, -hd], [ hw, -hh,  hd], [-hw, -hh,  hd],
      [-hw,  hh, -hd], [ hw,  hh, -hd], [ hw,  hh,  hd], [-hw,  hh,  hd]
    ];

    const c = local.map(function (v) {
      return [cx + v[0] * co + v[2] * si, cy + v[1], cz - v[0] * si + v[2] * co];
    });

    addFace([c[4], c[5], c[6], c[7]], shade(rgb, 1.18));   // top
    addFace([c[0], c[1], c[5], c[4]], shade(rgb, 0.78));   // back
    addFace([c[3], c[2], c[6], c[7]], shade(rgb, 1.00));   // front
    addFace([c[0], c[3], c[7], c[4]], shade(rgb, 0.64));   // left
    addFace([c[1], c[2], c[6], c[5]], shade(rgb, 0.88));   // right
  }


// -------------------------------------------------------------------
//  THE GROUND
// -------------------------------------------------------------------
//  Drawn as RINGS around you rather than a flat grid, because a grid
//  would need thousands of squares to reach the fog and most of them
//  would be behind your head.
//
//  Rings get wider the further out they go - which is exactly right,
//  because distant things are small on screen and nobody can tell that
//  the far ones are enormous.
//
//  The COLOUR comes from the square's place IN THE WORLD, not from
//  which ring it is. If we shaded it by ring, the pattern would slide
//  around with you like a carpet glued to your feet.
// -------------------------------------------------------------------

// -------------------------------------------------------------------
//  SMOOTH RANDOMNESS - the same stone as Cursed Cavern
// -------------------------------------------------------------------
//  Straight from cavern.html. Plain Math.random() gives you TV static:
//  every dot unrelated to the one beside it. Rock isn't like that -
//  it's lumpy, and the lumps have a size.
//
//  So: scatter random dots on a coarse grid, then for any spot in
//  between, BLEND the four nearest dots. Nearby spots blend almost the
//  same four, so they come out almost the same - and that's smooth
//  instead of static.
//
//  Then stack three of those at different sizes: big slow lumps, medium
//  lumps, fine grain. Adding them is what turns "blobs" into "stone".
//
//  The cavern paints this onto pixels. We use it to pick the SHADE of
//  each patch of ground instead - same maths, different job.
// -------------------------------------------------------------------

  function makeNoiseGrid(size) {
    const grid = new Float32Array(size * size);
    for (let i = 0; i < grid.length; i++) grid[i] = Math.random();
    return grid;
  }

  function noiseAt(grid, size, x, y) {
    const fx = x * size, fy = y * size;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);

    let tx = fx - x0, ty = fy - y0;

    // This curve eases the blend in and out. Blending in a straight
    // line leaves visible diamond shapes - this one line is the
    // difference between "rock" and "quilt".
    tx = tx * tx * (3 - 2 * tx);
    ty = ty * ty * (3 - 2 * ty);

    // Wrap at the edges so the pattern tiles with no seam.
    function corner(cx, cy) {
      const wx = ((cx % size) + size) % size;
      const wy = ((cy % size) + size) % size;
      return grid[wy * size + wx];
    }

    const a = corner(x0,     y0);
    const b = corner(x0 + 1, y0);
    const c = corner(x0,     y0 + 1);
    const d = corner(x0 + 1, y0 + 1);

    const top = a + (b - a) * tx;
    const bot = c + (d - c) * tx;
    return top + (bot - top) * ty;
  }

  // Three layers: big lumps, medium lumps, fine grit.
  const STONE = [
    { grid: makeNoiseGrid(6),  size: 6,  weight: 0.50 },
    { grid: makeNoiseGrid(14), size: 14, weight: 0.32 },
    { grid: makeNoiseGrid(34), size: 34, weight: 0.18 }
  ];

  const STONE_REPEAT = 220;    // how far before the pattern comes round again

  function stoneAt(wx, wz) {
    const x = wx / STONE_REPEAT, y = wz / STONE_REPEAT;
    let total = 0;
    for (const layer of STONE) {
      total += noiseAt(layer.grid, layer.size, x, y) * layer.weight;
    }
    return total;               // roughly 0 to 1
  }


// -------------------------------------------------------------------
//  THE GROUND
// -------------------------------------------------------------------
//  TWO different grounds joined at 52 paces, and the reason is subtle.
//
//  Close up it's a grid of squares FIXED IN THE WORLD. It has to be
//  fixed, because the shade comes from the stone pattern - and if the
//  squares moved with you while the pattern stayed put, the ground
//  would crawl and shimmer under your feet like a bad carpet.
//
//  Far away it's rings around you, which move with you - but out there
//  the fog has eaten almost all the colour anyway, so nobody can tell.
//
//  Cheap where it doesn't matter, correct where it does.
// -------------------------------------------------------------------

  const TILE      = 5;      // one near-ground square
  const NEAR_EDGE = 52;     // where squares stop and rings take over

  const RINGS  = [NEAR_EDGE, 74, 104, 138, FOG_FAR];
  const SPOKES = 26;

  function groundShade(wx, wz) {
    // 0.72 to 1.20 - dark dips and pale raised bits, like weathered rock.
    return shade(GROUND_TAN, 0.72 + stoneAt(wx, wz) * 0.48);
  }

  function drawGround() {
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);

    // ---- NEAR: world-locked squares --------------------------------
    const gx0 = Math.floor((player.x - NEAR_EDGE) / TILE);
    const gx1 = Math.floor((player.x + NEAR_EDGE) / TILE);
    const gz0 = Math.floor((player.z - NEAR_EDGE) / TILE);
    const gz1 = Math.floor((player.z + NEAR_EDGE) / TILE);

    for (let gx = gx0; gx <= gx1; gx++) {
      for (let gz = gz0; gz <= gz1; gz++) {
        const x0 = gx * TILE, z0 = gz * TILE;
        const mx = x0 + TILE * 0.5, mz = z0 + TILE * 0.5;

        const dx = mx - player.x, dz = mz - player.z;
        if (Math.hypot(dx, dz) > NEAR_EDGE) continue;      // outside the disc
        if (dx * fx + dz * fz < -TILE * 2) continue;       // behind your head

        addFace([
          [x0, 0, z0], [x0 + TILE, 0, z0],
          [x0 + TILE, 0, z0 + TILE], [x0, 0, z0 + TILE]
        ], groundShade(mx, mz));
      }
    }

    // ---- FAR: rings ------------------------------------------------
    for (let r = 0; r < RINGS.length - 1; r++) {
      const r0 = RINGS[r], r1 = RINGS[r + 1];

      for (let s = 0; s < SPOKES; s++) {
        const a0 = (s / SPOKES) * Math.PI * 2;
        const a1 = ((s + 1) / SPOKES) * Math.PI * 2;

        const c0 = Math.cos(a0), s0 = Math.sin(a0);
        const c1 = Math.cos(a1), s1 = Math.sin(a1);

        const mr = (r0 + r1) * 0.5, ma = (a0 + a1) * 0.5;
        const wx = player.x + Math.cos(ma) * mr;
        const wz = player.z + Math.sin(ma) * mr;

        if ((wx - player.x) * fx + (wz - player.z) * fz < -r1 * 0.4) continue;

        const px = player.x, pz = player.z;
        addFace([
          [px + c0 * r0, 0, pz + s0 * r0],
          [px + c1 * r0, 0, pz + s1 * r0],
          [px + c1 * r1, 0, pz + s1 * r1],
          [px + c0 * r1, 0, pz + s0 * r1]
        ], groundShade(wx, wz));
      }
    }
  }


// -------------------------------------------------------------------
//  THE RUINS
// -------------------------------------------------------------------
//  The world is divided into big invisible squares. For each square
//  near you we ask hash2: is there something here, and what? Nothing is
//  stored, nothing is generated in advance, and it goes on forever in
//  every direction.
//
//  This is the same trick as the wrecks in the racer, except now it's
//  in two directions instead of one.
// -------------------------------------------------------------------

  // How big one invisible square is. This went up from 34 when the
  // bunkers became settlements - a compound 60 across simply doesn't
  // fit in a 34 square, and its walls would have swallowed whatever was
  // standing in the next one along.
  const CELL = 48;

  // HOW RARE A SETTLEMENT IS. One square in 300 - which works out at
  // roughly one every 830 paces, about 25 seconds of running. Most of
  // the wasteland is empty, and a light on the horizon is worth going
  // to look at. Maximus picked the number.
  const BUNKER_CHANCE = 1 / 300;
  const RADIO_CHANCE  = 1 / 130;   // radio towers - commoner than settlements
  const FORT_CHANCE   = 1 / 450;   // marine forts - rarer than ANYTHING
  const PAD_CHANCE    = 1 / 100;   // landing pads everywhere - Maximus
                                   // wants the sky within walking distance

  const RUBBLE = [104, 94, 84];
  const CONCRETE = [138, 128, 116];
  const METAL = [104, 96, 92];
  const DEADWOOD = [78, 62, 46];
  const RUST = [128, 74, 44];

  // WHAT IS IN SQUARE (gx, gz)? Returns null for empty, or everything
  // there is to know about the thing standing there.
  //
  // This used to be worked out inside the drawing loop. It had to come
  // out, because now TWO things need the answer: the drawing, and
  // walking into it. If they each worked it out for themselves they
  // would drift apart, and you'd get invisible walls in empty ground
  // and towers you could stroll through. One function, one answer.
  //
  // "solid" is how far out you're stopped. Zero means walk right over
  // it - rubble and barrels aren't worth blocking on.
  // REMEMBER THE ANSWERS.
  //
  // propAt now gets asked hundreds of times a frame - once per square
  // on screen for the drawing, plus nine more every time you or any
  // enemy takes a step. And a bunker builds a list of twenty-one wall
  // posts each time it's asked.
  //
  // But the answer for a given square NEVER CHANGES. It's all worked
  // out from hash(), which is the whole point of hash(). So work it out
  // once, keep it, and hand back the same answer forever.
  //
  // The clear-out stops it eating memory as you walk. Losing the
  // answers costs nothing - we just work them out again.
  const propCache = new Map();

  function propAt(gx, gz) {
    const key = gx + ',' + gz;
    if (propCache.has(key)) return propCache.get(key);

    if (propCache.size > 6000) propCache.clear();

    const p = buildProp(gx, gz);
    propCache.set(key, p);
    return p;
  }

  function buildProp(gx, gz) {
    const r = hash2(gx, gz);

    const home = Math.max(Math.abs(gx), Math.abs(gz));

    // ---- IS THIS ONE OF THE RARE ONES? ------------------------------
    // Settlements get their OWN coin toss, out of a completely different
    // corner of the hash, and it's checked before anything else - even
    // before "is this square empty".
    //
    // Carving a one-in-300 sliver out of the r range instead would have
    // been a band 0.0033 wide. Any small unevenness in the hash could
    // swallow a sliver that thin whole, and settlements would vanish
    // from whole regions of the map for no findable reason.
    if (home > 1 && hash2(gx + 9137, gz + 4271) < BUNKER_CHANCE) {
      const b = {
        gx: gx, gz: gz, kind: 'bunker', solid: 0,
        x: gx * CELL + (hash2(gx + 7, gz) - 0.5) * CELL * 0.8,
        z: gz * CELL + (hash2(gx, gz + 7) - 0.5) * CELL * 0.8,
        spin: hash2(gx + 3, gz + 3) * Math.PI * 2,
        half: 20 + hash2(gx + 17, gz) * 10,         // 40 to 60 across
        souls: 50 + Math.floor(hash2(gx + 21, gz + 21) * 51)
      };
      b.parts  = bunkerParts(b);
      b.guards = bunkerGuards(b);
      b.manned = Math.ceil(b.guards.length / GUARD_EVERY);   // the rest are hires
      b.quests = questsFor(gx, gz);
      return b;
    }

    // ---- OR A LANDING PAD? ------------------------------------------
    // A concrete pad with a marine dropship squatting on it, fuelled
    // and pointing at the sky. Walk up, press E, and leave the planet.
    if (home > 1 && hash2(gx + 8111, gz + 941) < PAD_CHANCE) {
      return {
        gx: gx, gz: gz, kind: 'pad',
        x: gx * CELL + (hash2(gx + 7, gz) - 0.5) * CELL * 0.8,
        z: gz * CELL + (hash2(gx, gz + 7) - 0.5) * CELL * 0.8,
        spin: hash2(gx + 3, gz + 3) * Math.PI * 2,
        solid: 8, tall: 9
      };
    }

    // ---- OR A MARINE FORT? ------------------------------------------
    // The rarest thing on the map. A neat steel compound the marines
    // built when they first landed, with an armoury inside: a rifle
    // rack and an armour stand, and both are FOR SALE for scrap.
    if (home > 1 && hash2(gx + 6427, gz + 1861) < FORT_CHANCE) {
      const f = {
        gx: gx, gz: gz, kind: 'fort', solid: 0,
        x: gx * CELL + (hash2(gx + 7, gz) - 0.5) * CELL * 0.8,
        z: gz * CELL + (hash2(gx, gz + 7) - 0.5) * CELL * 0.8,
        spin: hash2(gx + 3, gz + 3) * Math.PI * 2,
        half: 16
      };
      f.parts = fortParts(f);
      return f;
    }

    // ---- OR A RADIO TOWER? ------------------------------------------
    // Same trick as the settlements: its own coin toss out of its own
    // corner of the hash, so it can land on any square. Stand at one
    // and you can radio the marines in orbit to send a drop pod down.
    if (home > 1 && hash2(gx + 3313, gz + 7717) < RADIO_CHANCE) {
      return {
        gx: gx, gz: gz, kind: 'radio',
        x: gx * CELL + (hash2(gx + 7, gz) - 0.5) * CELL * 0.8,
        z: gz * CELL + (hash2(gx, gz + 7) - 0.5) * CELL * 0.8,
        spin: hash2(gx + 3, gz + 3) * Math.PI * 2,
        solid: 2.4, tall: 20,
        podReadyAt: 0            // when the tower can call the NEXT pod
      };
    }

    if (r > 0.62) return null;               // most squares are empty

    // ---- KEEP THE STARTING PATCH CLEAR ------------------------------
    // hash2(0, 0) is exactly zero, which lands in the tower band. So
    // EVERY game began with a forty-foot slab of concrete shoved
    // against your face, hiding most of what was nearby.
    //
    // This is what Maximus was really hitting. He wasn't missing
    // bunkers - he was standing behind a wall, looking at it. Pushing
    // him out of the tower fixed being stuck inside it and did nothing
    // whatever about the view.
    if (home === 0) return null;                  // somewhere to stand
    if (home === 1 && r < 0.15) return null;      // and no towers next door

    // Jiggle it off the exact grid corner, or the whole wasteland
    // looks like graph paper.
    const p = {
      gx: gx, gz: gz,
      x: gx * CELL + (hash2(gx + 7, gz) - 0.5) * CELL * 0.8,
      z: gz * CELL + (hash2(gx, gz + 7) - 0.5) * CELL * 0.8,
      spin: hash2(gx + 3, gz + 3) * Math.PI * 2
    };

    // The old bunker band is gone from here, so the 13% it used to take
    // is shared out among everything else. Leave it out and one square
    // in eight would quietly become bare ground.
    // "tall" is how high the solid part reaches. A bolt flying under
    // that gets stopped; one flying over it sails past. Without it,
    // every burnt-out car in the wasteland would be a force field.
    if (r < 0.15) {
      p.kind = 'tower';
      p.w = 8 + hash2(gx, gz + 1) * 6;
      p.solid = p.w * 0.62;
      p.tall = 14 + hash2(gx + 1, gz) * 26;    // drawTower uses this too
    } else if (r < 0.30) {
      p.kind = 'wreck';  p.solid = 4.4;  p.tall = 2.4;
    } else if (r < 0.44) {
      p.kind = 'tree';   p.solid = 1.4;  p.tall = 7 + hash2(gx + 2, gz) * 9;
    } else if (r < 0.54) {
      p.kind = 'rubble'; p.solid = 0;    p.tall = 0;
    } else {
      p.kind = 'barrels'; p.solid = 0;   p.tall = 0;
    }

    return p;
  }


// -------------------------------------------------------------------
//  SCRAP BUNKERS
// -------------------------------------------------------------------
//  Somebody welded whatever they could find into a box and hid in it.
//  Corrugated sheet, a car door, road signs, planks, sandbags, tyres.
//
//  It is HOLLOW, with a doorway - so it's real cover. Duck inside and a
//  robot's bolt hits the wall instead of you.
//
//  Which means one solid circle won't do. A bunker's walls are a RING
//  of solid lumps with a hole in one side, and the hole is what makes
//  it a building instead of a rock.
// -------------------------------------------------------------------

  const POST_STEP = 5.6;     // how far apart the wall panels stand
  const POST_R    = 3.0;     // and how fat each one is
  const WALL_TALL = 5.4;     // the height of the SHORTEST panel

  // THE WALL, as a list of local (x, z) posts.
  //
  // The posts overlap slightly on purpose - 5.6 apart with a radius of
  // 3 each means no gap anywhere, so nothing can squeeze between two
  // panels. Everything gets in through the gate or not at all.
  function bunkerPosts(p) {
    const S = p.half;
    const n = Math.max(6, Math.round(S * 2 / POST_STEP));
    const out = [];

    for (let i = 0; i <= n; i++) {
      const t = -S + (i / n) * S * 2;

      out.push([t, -S]);                                 // back wall

      // The front wall has a GATE in the middle of it. That gap is the
      // whole reason this is a settlement and not a lump of rock.
      if (Math.abs(t) > S * 0.26) out.push([t, S]);

      if (i > 0 && i < n) {                              // the two sides
        out.push([-S, t]);
        out.push([ S, t]);
      }
    }
    return out;
  }

// -------------------------------------------------------------------
//  THE QUEST BOARD
// -------------------------------------------------------------------
//  A plank of scrap by the gate of every settlement, with three jobs
//  nailed to it. Small, middling, and one that will take you most of
//  the game.
//
//  The jobs come out of hash2 like everything else, so a settlement's
//  board never changes - walk away, come back an hour later, same three
//  jobs. And every settlement offers something different, which is a
//  reason to go and find another one.
// -------------------------------------------------------------------

  const QUEST_TIERS = [
    { lo: 12,  hi: 40,  kind: 'zombie', reward: 'heal' },
    { lo: 60,  hi: 150, kind: 'any',    reward: 'health' },
    { lo: 200, hi: 400, kind: 'any',    reward: 'gun' }
  ];

  const REWARD_TEXT = {
    heal:   'patched up, and +10 top health',
    health: '+30 top health',
    gun:    'your rifle hits twice as hard'
  };

  function questsFor(gx, gz) {
    const out = [];

    for (let i = 0; i < QUEST_TIERS.length; i++) {
      const t = QUEST_TIERS[i];
      const roll = hash2(gx + 41 + i * 13, gz + 67 + i * 7);

      out.push({
        target: t.lo + Math.floor(roll * (t.hi - t.lo + 1)),
        kind: t.kind,
        reward: t.reward,
        count: 0,
        gen: 0,          // which printing of this job we're on
        readyAt: 0       // when a finished one goes back up
      });
    }
    return out;
  }

  const QUEST_REGEN = 60;    // a minute before a done job is reposted

  // Put a fresh job up in the same slot.
  //
  // The new target comes from hash2 again, but with the printing number
  // stirred into the seed - so job 3 on THIS board is a different number
  // every time round, and still exactly the same number if you walk away
  // and come back. Random when it should be, fixed when it should be.
  function rerollQuest(p, i) {
    const q = p.quests[i];
    const t = QUEST_TIERS[i];

    q.gen++;
    const roll = hash2(p.gx + 41 + i * 13 + q.gen * 131,
                       p.gz + 67 + i * 7  + q.gen * 57);

    q.target  = t.lo + Math.floor(roll * (t.hi - t.lo + 1));
    q.count   = 0;
    q.done    = false;
    q.readyAt = 0;
  }

  // Anything finished long enough ago goes back on the board.
  function refreshBoard(p) {
    if (!p || !p.quests) return;
    for (let i = 0; i < p.quests.length; i++) {
      const q = p.quests[i];
      if (q.done && clock >= q.readyAt) rerollQuest(p, i);
    }
  }

  // Where the board stands, inside the gate.
  function boardWorld(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    const lx = -p.half * 0.34, lz = p.half * 0.55;
    return { x: p.x + lx * co + lz * si, z: p.z - lx * si + lz * co };
  }

  function bunkerParts(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    return bunkerPosts(p).map(function (q) {
      return {
        x: p.x + q[0] * co + q[1] * si,
        z: p.z - q[0] * si + q[1] * co,
        r: POST_R
      };
    });
  }


// -------------------------------------------------------------------
//  THE GUARDS
// -------------------------------------------------------------------
//  Somebody has to be keeping fifty to a hundred people alive out here,
//  and it isn't luck. Every settlement has people on the wall with
//  rifles, and anything that shambles too close gets dropped.
//
//  They stand at fixed posts just inside the wall. They pick the
//  nearest thing in range, turn to it, and fire. That's the whole
//  brain - simpler than the racing rival's.
//
//  Stand near a wall and let the zombies come to you. It's the closest
//  thing to a safe place in the whole game.
// -------------------------------------------------------------------

  const HEAL_RATE = 10;      // health per second inside the walls

  let healing  = false;
  let healGlow = 0;          // green wash, fades in and out on its own

  const GUARD_RANGE = 62;
  const GUARD_COOL  = 0.5;     // seconds between shots
  const GUARD_HURT  = 2;       // damage per shot
  const GUARD_EVERY = 3;       // one guard per this many wall posts

// -------------------------------------------------------------------
//  PAYING FOR BETTER GUARDS
// -------------------------------------------------------------------
//  Every settlement keeps its own guardLevel, and you buy it up with
//  scrap you've salvaged off the things you killed. Better rifles,
//  faster hands, further reach.
//
//  It's PER SETTLEMENT, not global. Pour scrap into one place and it
//  becomes a fortress you can fall back to; spread it thin and you have
//  four mediocre ones. That's a decision, which is the point.
//
//  These three read the level and work out the numbers. Nothing else
//  in the game knows a level exists - updateGuards just asks.
// -------------------------------------------------------------------

  const GUARD_MAX_LEVEL = 5;

  function guardCost(level)  { return 30 + level * 45; }
  function guardHurt(level)  { return GUARD_HURT + level; }
  function guardCool(level)  { return Math.max(0.16, GUARD_COOL - level * 0.062); }
  function guardReach(level) { return GUARD_RANGE + level * 11; }

  // EVERY WALL POST IS A GUARD POST. Most of them just aren't manned.
  //
  // The list is built in a deliberate ORDER: every third post first,
  // then the ones between them, then the rest. So the guards a
  // settlement starts with are spread evenly round the whole wall, and
  // each one you hire quietly fills in a gap rather than clumping up in
  // a corner. Hiring never needs to think about where to put anybody -
  // the order already decided.
  function bunkerGuards(p) {
    const posts = bunkerPosts(p);
    const co = Math.cos(p.spin), si = Math.sin(p.spin);

    const order = [];
    for (let off = 0; off < GUARD_EVERY; off++) {
      for (let i = off; i < posts.length; i += GUARD_EVERY) order.push(i);
    }

    return order.map(function (i) {
      // Stand them just INSIDE the wall, not on top of it.
      const lx = posts[i][0] * 0.88, lz = posts[i][1] * 0.88;

      return {
        x: p.x + lx * co + lz * si,
        z: p.z - lx * si + lz * co,
        yaw: p.spin,
        cool: hash2(p.gx + i, p.gz + i) * GUARD_COOL,   // not all at once
        flash: 0,
        bob: hash2(p.gx, p.gz + i) * 6
      };
    });
  }

  // How many are actually on duty. Everything past this is an empty post.
  function onDuty(p) {
    return p.manned !== undefined ? p.manned : 0;
  }

  // How many a settlement starts with, before you've hired anybody.
  function guardsIncluded(p) {
    return Math.ceil(p.guards.length / GUARD_EVERY);
  }

  // PRICED ON WHAT YOU'VE HIRED, not on how many are up there.
  //
  // First attempt charged by total guards on the wall - and a big
  // settlement already has thirteen, so the very first hire cost 207
  // scrap. That's 207 zombies for one man. The maths was right and the
  // meaning was wrong: you were being billed for the thirteen people
  // who were already there before you arrived.
  function hireCost(p) {
    return 25 + (onDuty(p) - guardsIncluded(p)) * 20;
  }

  let tracers = [];

  function updateGuards(dt) {
    for (const t of tracers) t.life -= dt;
    tracers = tracers.filter(function (t) { return t.life > 0; });

    if (enemies.length === 0) return;

    const reach = Math.ceil(FOG_FAR / CELL) + 1;
    const cx = Math.round(player.x / CELL), cz = Math.round(player.z / CELL);

    for (let gx = cx - reach; gx <= cx + reach; gx++) {
      for (let gz = cz - reach; gz <= cz + reach; gz++) {
        const p = propAt(gx, gz);
        if (!p || p.kind !== 'bunker' || !p.guards) continue;

        // Far-off settlements are defending nothing - the enemies all
        // live near you. Skipping them costs nothing and saves plenty.
        if (Math.hypot(p.x - player.x, p.z - player.z) > FOG_FAR) continue;

        // Whatever this settlement has been paid for.
        const lvl   = p.guardLevel || 0;
        const reach = guardReach(lvl);
        const hurt  = guardHurt(lvl);
        const cool  = guardCool(lvl);

        const manned = onDuty(p);

        for (let gi = 0; gi < manned; gi++) {
          const g = p.guards[gi];
          g.flash = Math.max(0, g.flash - dt * 9);
          g.cool -= dt;
          g.bob += dt * 0.7;

          // Nearest thing worth shooting.
          let best = null, bestD = reach;
          for (const e of enemies) {
            if (e.dead) continue;
            const d = Math.hypot(e.x - g.x, e.z - g.z);
            if (d < bestD) { bestD = d; best = e; }
          }
          if (!best) continue;

          g.yaw = Math.atan2(best.x - g.x, best.z - g.z);

          if (g.cool > 0) continue;
          g.cool = cool;
          g.flash = 1;

          tracers.push({
            x1: g.x, y1: 2.7, z1: g.z,
            x2: best.x, y2: best.k.height * 0.6, z2: best.z,
            life: 0.07
          });

          best.hp -= hurt;
          best.hitFlash = 1;
          burst(best.x, best.k.height * 0.6, best.z, best.k.gib, 5, 6);

          // The kill goes to the guard, not to you. Your counter is for
          // things YOU shot - handing you other people's work would
          // make the number a lie.
          if (best.hp <= 0 && !best.dead) {
            best.dead = true;
            burst(best.x, best.k.height * 0.5, best.z, best.k.gib, 26, 17);
            playKill();
          }
        }
      }
    }
  }

  function drawTracers() {
    for (const t of tracers) {
      const dx = t.x2 - t.x1, dz = t.z2 - t.z1;
      const len = Math.hypot(dx, dz);
      if (len < 0.5) continue;

      // One long thin box lying along the shot. It's only on screen for
      // seven hundredths of a second, which is exactly why you believe
      // it was a bullet.
      addBox((t.x1 + t.x2) * 0.5, (t.y1 + t.y2) * 0.5, (t.z1 + t.z2) * 0.5,
             0.2, 0.2, len, [255, 238, 176], Math.atan2(dx, dz));
    }
  }

  // One person with a rifle. Used for the guards; the civilians inside
  // are the same body with the gun left off.
  function drawPerson(x, y, z, yaw, coat, armed, flash) {
    const co = Math.cos(yaw), si = Math.sin(yaw);

    function bit(ox, oy, oz, w, h, d, rgb) {
      addBox(x + ox * co + oz * si, y + oy, z - ox * si + oz * co,
             w, h, d, rgb, yaw);
    }

    bit(-0.42, 0.55, 0, 0.55, 1.1, 0.55, [52, 46, 42]);      // legs
    bit( 0.42, 0.55, 0, 0.55, 1.1, 0.55, [52, 46, 42]);
    bit(0, 1.72, 0, 1.5, 1.3, 0.95, coat);                    // body
    bit(0, 2.62, 0, 0.85, 0.75, 0.85, [188, 152, 118]);       // head
    bit(0, 3.02, 0, 1.05, 0.28, 1.05, [64, 58, 48]);          // hat

    if (armed) {
      bit(0.75, 1.95, -1.1, 0.3, 0.3, 2.4, [42, 38, 36]);     // rifle
      if (flash > 0.1) {
        bit(0.75, 1.95, -2.5, 0.9 * flash, 0.9 * flash, 0.9 * flash,
            [255, 232, 150]);                                  // muzzle flash
      }
    }
  }

  // IS THIS SPOT INSIDE SOMETHING SOLID?
  //
  // We only ask the nine squares around the spot. Nothing can reach in
  // from further than one square away, so checking the whole wasteland
  // would be nine answers and several thousand wasted questions.
  function blockedAt(x, z, radius) {
    const gx = Math.round(x / CELL), gz = Math.round(z / CELL);

    for (let ax = gx - 1; ax <= gx + 1; ax++) {
      for (let az = gz - 1; az <= gz + 1; az++) {
        const p = propAt(ax, az);
        if (!p) continue;

        // A bunker isn't one lump, it's a ring of them with a gap. Check
        // each post, and hand back whichever one you're inside - shaped
        // like a solid so the pushing-out code can't tell the difference.
        if (p.parts) {
          for (const q of p.parts) {
            if (Math.hypot(x - q.x, z - q.z) < q.r + radius) {
              // WALL_TALL, not the panel's own height. Panels vary from
              // 5.4 to 9.6 and we want the SHORTEST one - a wall is only
              // as high as its lowest bit, and promising cover the wall
              // doesn't actually have would be worse than no cover.
              return { x: q.x, z: q.z, solid: q.r, tall: WALL_TALL };
            }
          }
          continue;
        }

        if (p.solid <= 0) continue;
        if (Math.hypot(x - p.x, z - p.z) < p.solid + radius) return p;
      }
    }
    return null;
  }

// -------------------------------------------------------------------
//  LIGHTS ON THE HORIZON
// -------------------------------------------------------------------
//  Settlements are one square in three hundred now - about 830 paces
//  apart - which is five times further than you can see. Without this
//  you'd be wandering blind and hoping.
//
//  So their beacons are drawn WAY past the fog, as a single bright
//  speck. And the speck GROWS with distance, which is a bare-faced lie
//  about perspective - but a lamp that shrank honestly would be a
//  fraction of a pixel at 800 paces, which is the same as not being
//  there. Lying to keep something visible is a normal thing for a game
//  to do. Lying about where it IS would not be.
// -------------------------------------------------------------------

  const BEACON_FAR = 940;

  function drawFarBeacons() {
    const reach = Math.ceil(BEACON_FAR / CELL);
    const cx = Math.round(player.x / CELL), cz = Math.round(player.z / CELL);
    const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);

    for (let gx = cx - reach; gx <= cx + reach; gx++) {
      for (let gz = cz - reach; gz <= cz + reach; gz++) {
        const p = propAt(gx, gz);
        if (!p || (p.kind !== 'bunker' && p.kind !== 'radio' &&
                   p.kind !== 'fort' && p.kind !== 'pad')) continue;

        const dx = p.x - player.x, dz = p.z - player.z;
        const d = Math.hypot(dx, dz);

        if (d <= FOG_FAR || d > BEACON_FAR) continue;   // near ones drawn normally
        if (dx * fx + dz * fz < 0) continue;            // behind you

        const pulse = 0.55 + Math.sin(clock * 2.2 + p.gz) * 0.45;
        const size = (p.kind === 'radio' ? 2.2 : 3) + d * 0.036;

        // Which way is it from you? We need this to shove the outline
        // slightly further away than the light, so the sorting puts it
        // behind rather than fighting over which goes on top.
        const ux = dx / d, uz = dz / d;

        seeFar = true;

        // A dark halo FIRST, then the light on top of it. Exactly the
        // trick your crosshair in Bob uses - draw it fat and dark, then
        // thin and bright - and for the same reason: without an outline
        // an orange light vanishes into an orange sky.
        // A FLAT PLATE, not a cube - and that matters. My first try was
        // a big cube around the light, and because it was nearly twice
        // as wide, its front face poked out CLOSER to you than the
        // light did. The sorting did exactly as it was told and painted
        // the dark box over the top. A plate has almost no thickness,
        // so it can never get in front of what it's behind.
        fogResist = 0.75;
        addBox(p.x + ux * 2, 31, p.z + uz * 2,
               size * 1.9, size * 1.9, 0.3, [30, 18, 12],
               Math.atan2(ux, uz));

        // A faint pole under it, so it reads as a mast with a lamp on
        // top rather than a box hanging in the air.
        fogResist = 0.42;
        addBox(p.x + ux * 1.2, 15, p.z + uz * 1.2,
               size * 0.35, 30, size * 0.35, [58, 44, 34]);

        // The light itself: almost white-hot, because the sky out there
        // is already orange and an orange lamp against it is nothing.
        // Radio towers burn RED instead - red against orange still
        // stands out, and it tells you which kind of light it is
        // before you've walked a single pace towards it.
        fogResist = 0.96;
        if (p.kind === 'radio') {
          addBox(p.x, 31, p.z, size, size, size,
                 [255, 60 + 70 * pulse, 40 + 30 * pulse]);
        } else if (p.kind === 'fort') {
          // Marine forts burn a cold blue-white. Amber = shelter,
          // red = reinforcements, blue = shopping.
          addBox(p.x, 31, p.z, size, size, size,
                 [150 + 60 * pulse, 190 + 50 * pulse, 255]);
        } else if (p.kind === 'pad') {
          // Landing pads burn GREEN. Four colours of light now:
          // amber = shelter, red = reinforcements, blue = shopping,
          // green = a ride off this entire planet.
          addBox(p.x, 31, p.z, size, size, size,
                 [110 + 40 * pulse, 255, 130 + 60 * pulse]);
        } else {
          addBox(p.x, 31, p.z, size, size, size,
                 [225 + 30 * pulse, 205 + 45 * pulse, 140 + 90 * pulse]);
        }

        fogResist = 0;
        seeFar = false;
      }
    }
  }

  function drawScenery() {
    const reach = Math.ceil(FOG_FAR / CELL);
    const cx = Math.round(player.x / CELL);
    const cz = Math.round(player.z / CELL);

    for (let gx = cx - reach; gx <= cx + reach; gx++) {
      for (let gz = cz - reach; gz <= cz + reach; gz++) {

        const p = propAt(gx, gz);
        if (!p) continue;

        const dx = p.x - player.x, dz = p.z - player.z;

        // Don't bother if it's past the fog.
        if (Math.hypot(dx, dz) > FOG_FAR) continue;

        // ...or if it's behind your head. addFace would throw these
        // away anyway, but only after doing all the maths for every
        // corner of every box. Checking once here, before we build
        // anything, skips about half the entire wasteland for free.
        if (dx * Math.sin(player.yaw) + dz * Math.cos(player.yaw) < -26) continue;

        if      (p.kind === 'tower')  drawTower(p);
        else if (p.kind === 'bunker') drawBunker(p);
        else if (p.kind === 'radio')  drawRadio(p);
        else if (p.kind === 'fort')   drawFort(p);
        else if (p.kind === 'pad')    drawPad(p);
        else if (p.kind === 'wreck')  drawWreck(p);
        else if (p.kind === 'tree')   drawDeadTree(p);
        else if (p.kind === 'rubble') drawRubble(p);
        else                          drawBarrels(p);
      }
    }
  }

  // THE RADIO TOWER. A skinny lattice mast someone welded back together
  // after the war, with a generator shack at the bottom and a red light
  // on top. Red on purpose - settlements blink AMBER, so from half the
  // map away you can already tell which kind of light you're walking to.
  //
  // The light is the message: blinking red = ready to call a pod.
  // Dim = it's recharging, come back in a bit.
  function drawRadio(p) {
    const x = p.x, z = p.z, spin = p.spin;

    // The mast: four stacked segments, each thinner than the last.
    for (let s = 0; s < 4; s++) {
      const w = 2.2 - s * 0.42;
      addBox(x, s * 5 + 2.5, z, w, 5, w, s % 2 ? RUST : METAL, spin);
      // A crossbar arm at each joint, so it reads as a radio mast and
      // not a flag pole.
      addBox(x, s * 5 + 4.6, z, 3.6 - s * 0.5, 0.4, 0.4, METAL, spin + 0.4 * s);
    }

    // The generator shack and the dish leaning against it.
    addBox(x + 3.4 * Math.cos(spin), 1.4, z - 3.4 * Math.sin(spin),
           3.2, 2.8, 2.6, DEADWOOD, spin);
    addBox(x - 3.0 * Math.cos(spin), 1.6, z + 3.0 * Math.sin(spin),
           0.5, 3.2, 3.2, METAL, spin + 0.5);

    // The light on top. fogResist so it glows through the haze - that
    // is its whole job.
    const ready = clock >= p.podReadyAt;
    const pulse = 0.55 + Math.sin(clock * 3.1 + p.gx) * 0.45;
    fogResist = 0.9;
    if (ready) addBox(x, 21.2, z, 1.4, 1.4, 1.4, [255, 40 + 80 * pulse, 36]);
    else       addBox(x, 21.2, z, 1.1, 1.1, 1.1, [110, 42, 34]);
    fogResist = 0;
  }

  // A tower with its top blown off. The break is what makes it a ruin -
  // a neat box is a building, a jagged one is a war.
  function drawTower(p) {
    const x = p.x, z = p.z, gx = p.gx, gz = p.gz, spin = p.spin;
    const h = p.tall;              // the SAME height bolts are stopped by
    const w = p.w;                 // and the SAME width collision uses

    addBox(x, h * 0.5, z, w, h, w, CONCRETE, spin);

    // Broken teeth around the top.
    for (let i = 0; i < 4; i++) {
      const t = hash2(gx + i, gz + i);
      if (t < 0.35) continue;
      const ox = (i < 2 ? -1 : 1) * w * 0.33;
      const oz = (i % 2 ? -1 : 1) * w * 0.33;
      addBox(x + ox * Math.cos(spin) + oz * Math.sin(spin),
             h + t * 3.0,
             z - ox * Math.sin(spin) + oz * Math.cos(spin),
             w * 0.3, t * 6, w * 0.3, shade(CONCRETE, 0.9), spin);
    }

    // Dark holes where the windows were.
    for (let f = 1; f * 6 < h - 3; f++) {
      addBox(x, f * 6, z - w * 0.51, w * 0.5, 2.2, 0.3, [26, 22, 20], spin);
    }
  }

  // Everything anybody could scavenge, in one list. Picking randomly
  // from it is what stops the walls looking manufactured - real scrap
  // is mismatched, and mismatched is the whole look.
  const SCRAP = [
    [128, 84, 52],    // rust
    [146, 146, 152],  // galvanised sheet
    [92, 96, 104],    // dark steel
    [126, 66, 56],    // faded red paint
    [74, 90, 104],    // faded blue paint
    [110, 88, 60],    // old plank
    [150, 138, 96]    // road sign
  ];

  function drawBunker(p) {
    const co = Math.cos(p.spin), si = Math.sin(p.spin);
    const S = p.half;

    // ---- HOW MUCH DETAIL IS WORTH IT? -------------------------------
    // A fully detailed bunker is about 460 flat shapes. Three of them
    // on screen at once would be more work than the entire rest of the
    // wasteland put together.
    //
    // So: two tiers. Far off you get walls and a roof. Up close you get
    // the ribbing and the sandbags. You genuinely cannot see the
    // difference at 60 paces - and the ones you can't see are free.
    const away  = Math.hypot(p.x - player.x, p.z - player.z);
    const near  = away < 88;     // tyres, the lean-to, people inside
    const close = away < 40;     // corrugation and sandbags

    function part(lx, lz, y, w, h, d, rgb, lean) {
      addBox(p.x + lx * co + lz * si, y, p.z - lx * si + lz * co,
             w, h, d, rgb, p.spin + (lean || 0));
    }

    // ---- THE WALLS --------------------------------------------------
    const posts = bunkerPosts(p);

    for (let i = 0; i < posts.length; i++) {
      const lx = posts[i][0], lz = posts[i][1];

      // Every panel is a different height, a different colour and
      // slightly crooked. Three tiny wobbles, and it stops being a box.
      //
      // These used to be 3.8 to 7.0 - barely taller than your eye at
      // 3.4. From forty paces a bunker was a low brown lump on brown
      // ground in brown fog, and Maximus walked straight past two of
      // them without seeing either. Now they're properly wall-height.
      const h    = 5.4 + hash2(p.gx + i, p.gz) * 4.2;
      const lean = (hash2(p.gx, p.gz + i) - 0.5) * 0.16;
      const col  = SCRAP[Math.floor(hash2(p.gx + i * 3, p.gz + i) * SCRAP.length)];

      // Which way is this panel facing? Along the wall it sits on.
      const flat = Math.abs(lz) > Math.abs(lx);
      const w = flat ? 4.6 : 1.0;
      const d = flat ? 1.0 : 4.6;

      part(lx, lz, h * 0.5, w, h, d, col, lean);

      // Corrugation - two darker ribs down the face. Cheap, and it's
      // what makes flat metal look like sheet metal.
      if (close) {
        for (const rib of [-1.2, 1.2]) {
          part(lx + (flat ? rib : 0), lz + (flat ? 0 : rib),
               h * 0.5, flat ? 0.35 : 1.1, h * 0.92, flat ? 1.1 : 0.35,
               shade(col, 0.78), lean);
        }
      }

      // A sandbag or two shoved against the bottom.
      if (close && hash2(p.gx + i, p.gz + 5) > 0.45) {
        part(lx * 1.16, lz * 1.16, 0.5, 2.2, 1.0, 1.6,
             [104, 96, 74], lean * 2);
      }
    }

    // NO ROOF. It's a walled compound, not a shed - you're meant to be
    // able to see down into it from outside, and the people living in
    // there need the sky.

    // ---- THE BEACON -------------------------------------------------
    // Every bunker gets one, and it is drawn AT ANY DISTANCE - it's the
    // whole reason you can find these things.
    //
    // A vertical line breaks a flat horizon better than anything else,
    // and a bright colour cuts through fog that has eaten everything
    // else. Whoever built this wanted it found. So do we.
    const mastX = (hash2(p.gx, p.gz + 11) - 0.5) * S * 0.8;

    // THE MAST GOES UP TO 30. Towers are 14 to 40, so this stands with
    // them on the skyline instead of hiding behind the rubble. A
    // landmark you have to already be near is not a landmark.
    fogResist = 0.86;

    // Thick, not thin. A half-unit mast is a hairline at a hundred
    // paces - one pixel wide, which may as well be nothing at all.
    part(mastX, -S * 0.55, 20.0, 1.2, 21.0, 1.2, [104, 108, 118]);

    // A rag of a flag, swinging. Tied to the clock so every bunker's
    // flag moves, which catches your eye from much further off than a
    // still one would.
    const flap = Math.sin(clock * 1.8 + p.gx) * 0.28;
    part(mastX + 2.1, -S * 0.55, 27.4, 4.0, 2.8, 0.3,
         [214, 72, 46], flap);

    // And a lamp on top that breathes. Movement in the corner of your
    // eye is what actually makes you turn your head.
    // pulse runs 0.1 to 1.0, and the colours are written so that even
    // at full brightness nothing goes past 255. A colour channel over
    // 255 doesn't error - the browser just quietly clamps it - which
    // means the lamp would stop pulsing at the top end and you'd never
    // be told why.
    const pulse = 0.55 + Math.sin(clock * 2.2 + p.gz) * 0.45;
    part(mastX, -S * 0.55, 31.4, 4.2, 4.2, 4.2,
         [150 + 105 * pulse, 70 + 150 * pulse, 30 + 40 * pulse]);

    fogResist = 0;      // back to normal for everything after this

    // ---- THE GUARDS ON THE WALL -------------------------------------
    // Drawn a fair way out, because armed people on a wall is the thing
    // that tells you this place is alive rather than abandoned.
    if (away < 115) {
      const manned = onDuty(p);
      for (let gi = 0; gi < manned; gi++) {
        const g = p.guards[gi];
        drawPerson(g.x, 0, g.z, g.yaw, [86, 92, 66], true, g.flash);
      }
    }

    if (!near) return;

    // ---- THE PEOPLE INSIDE ------------------------------------------
    // We draw about a dozen. There are fifty to a hundred in there -
    // the rest are in the shelters, or asleep, or round the back. You
    // cannot draw a hundred people at sixty frames a second, and you
    // don't have to: a busy dozen reads as a crowd.
    // Ten, not fourteen. Every person is 25 flat shapes and a settlement
    // was pushing 2,700 of them - which is a lot of work for a machine
    // to get through sixty times a second. Ten still reads as a crowd.
    const shown = 10;
    for (let i = 0; i < shown; i++) {
      // Each one drifts slowly round its own circle, at its own speed
      // and its own distance out. Nobody walks in step with anybody.
      const speed = 0.10 + hash2(p.gx + i, p.gz + i * 2) * 0.16;
      const dir   = hash2(p.gx + i * 5, p.gz) > 0.5 ? 1 : -1;
      const a     = hash2(p.gx + i * 3, p.gz + i) * 6.28 + clock * speed * dir;
      const rad   = S * (0.18 + hash2(p.gx + i, p.gz + 9) * 0.55);

      const lx = Math.cos(a) * rad, lz = Math.sin(a) * rad;
      const coat = SCRAP[Math.floor(hash2(p.gx + i * 7, p.gz + i) * SCRAP.length)];

      drawPerson(p.x + lx * co + lz * si, 0, p.z - lx * si + lz * co,
                 a + Math.PI * 0.5 * dir, shade(coat, 0.8), false, 0);
    }

    // ---- SHELTERS AND A FIRE ----------------------------------------
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * 6.28 + hash2(p.gx, p.gz + i) * 0.7;
      const rad = S * 0.66;
      const lx = Math.cos(a) * rad, lz = Math.sin(a) * rad;
      const col = SCRAP[Math.floor(hash2(p.gx + i * 11, p.gz) * SCRAP.length)];

      part(lx, lz, 1.6, 5.0, 3.2, 4.4, shade(col, 0.85), a);      // shack
      part(lx, lz, 3.5, 5.6, 0.4, 5.0, shade(col, 1.05), a);      // its roof
    }

    // ---- THE QUEST BOARD --------------------------------------------
    // Two legs and a plank, with pale scraps of paper pinned to it.
    const bd = boardWorld(p);
    const bs = p.spin;

    addBox(bd.x - 1.9 * co, 1.3, bd.z + 1.9 * si, 0.4, 2.6, 0.4, [72, 56, 40], bs);
    addBox(bd.x + 1.9 * co, 1.3, bd.z - 1.9 * si, 0.4, 2.6, 0.4, [72, 56, 40], bs);
    addBox(bd.x, 3.3, bd.z, 5.2, 3.4, 0.35, [96, 74, 50], bs);

    for (let i = 0; i < 3; i++) {
      addBox(bd.x + (i - 1) * 1.5 * co, 3.4 + (hash2(p.gx, p.gz + i) - 0.5) * 0.5,
             bd.z - (i - 1) * 1.5 * si,
             1.1, 1.4, 0.12, [216, 208, 186], bs);
    }

    // A cooking fire in the middle, breathing.
    const fire = 0.6 + Math.sin(clock * 5 + p.gx) * 0.4;
    part(0, 0, 0.4, 2.6, 0.5, 2.6, [46, 40, 36]);
    part(0, 0, 1.1 + fire * 0.4, 1.3 + fire, 1.6 + fire, 1.3 + fire,
         [220, 120 + 90 * fire, 40]);

    // ---- THE JUNK ROUND THE OUTSIDE ---------------------------------
    // Tyres stacked at the corners.
    for (const c of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      if (hash2(p.gx + c[0] * 3, p.gz + c[1] * 3) < 0.4) continue;
      const stack = 1 + Math.floor(hash2(p.gx + c[0], p.gz + c[1]) * 3);
      for (let t = 0; t < stack; t++) {
        part(c[0] * (S + 1.9), c[1] * (S + 1.9), 0.5 + t * 0.9,
             2.8, 0.9, 2.8, [40, 38, 40], t * 0.4);
      }
    }

    // A chimney pipe, elbowed over. (The tall mast is drawn further up,
    // outside this block, because it has to be visible from anywhere.)
    if (hash2(p.gx + 11, p.gz) > 0.4) {
      const px2 = (hash2(p.gx + 2, p.gz) - 0.5) * S;
      part(px2, -S * 0.2, 11.4, 0.7, 2.8, 0.7, [72, 66, 62]);
      part(px2 + 0.9, -S * 0.2, 12.6, 2.0, 0.7, 0.7, [72, 66, 62]);
    }

    // Something propped against the outside of the back wall.
    if (hash2(p.gx + 13, p.gz + 13) > 0.5) {
      part(S * 0.4, -S - 1.3, 2.0, 3.2, 4.0, 0.4,
           SCRAP[Math.floor(hash2(p.gx, p.gz + 13) * SCRAP.length)], 0.22);
    }
  }

  function drawWreck(p) {
    const x = p.x, z = p.z, gx = p.gx, gz = p.gz, spin = p.spin;
    addBox(x, 1.3, z, 4.4, 2.0, 8.6, RUST, spin);
    addBox(x, 2.8, z + 0.6, 3.6, 1.2, 3.8, [46, 40, 38], spin);

    const co = Math.cos(spin), si = Math.sin(spin);
    for (const ox of [-2.1, 2.1]) {
      for (const oz of [-2.8, 3.0]) {
        if (hash2(gx + ox, gz + oz) < 0.25) continue;    // some wheels gone
        addBox(x + ox * co + oz * si, 0.8, z - ox * si + oz * co,
               0.8, 1.6, 2.0, [38, 34, 34], spin);
      }
    }
  }

  function drawDeadTree(p) {
    const x = p.x, z = p.z, gx = p.gx, gz = p.gz;
    const h = 7 + hash2(gx + 2, gz) * 9;
    addBox(x, h * 0.5, z, 1.4, h, 1.4, DEADWOOD);

    // Three bare branches, each pointing a different way.
    for (let i = 0; i < 3; i++) {
      const a = hash2(gx + i * 5, gz + i) * Math.PI * 2;
      const up = h * (0.55 + i * 0.14);
      addBox(x + Math.cos(a) * 2.2, up, z + Math.sin(a) * 2.2,
             4.5, 0.7, 0.7, DEADWOOD, -a);
    }
  }

  function drawRubble(p) {
    const x = p.x, z = p.z, gx = p.gx, gz = p.gz;
    const lumps = 3 + Math.floor(hash2(gx + 4, gz) * 4);
    for (let i = 0; i < lumps; i++) {
      const a = hash2(gx + i, gz + i * 3) * Math.PI * 2;
      const d = hash2(gx + i * 2, gz) * 6;
      const s = 1.6 + hash2(gx, gz + i) * 3.4;
      addBox(x + Math.cos(a) * d, s * 0.35, z + Math.sin(a) * d,
             s * 1.6, s * 0.7, s * 1.4, RUBBLE, a);
    }
  }

  function drawBarrels(p) {
    const x = p.x, z = p.z, gx = p.gx, gz = p.gz;
    const n = 1 + Math.floor(hash2(gx + 6, gz) * 3);
    for (let i = 0; i < n; i++) {
      const a = hash2(gx + i * 4, gz + i) * Math.PI * 2;
      const d = hash2(gx, gz + i * 4) * 4;
      const fallen = hash2(gx + i, gz + 9) > 0.7;
      if (fallen) {
        addBox(x + Math.cos(a) * d, 0.9, z + Math.sin(a) * d,
               1.8, 1.8, 3.2, RUST, a);
      } else {
        addBox(x + Math.cos(a) * d, 1.6, z + Math.sin(a) * d,
               2.0, 3.2, 2.0, RUST, a);
        addBox(x + Math.cos(a) * d, 3.3, z + Math.sin(a) * d,
               2.2, 0.3, 2.2, shade(RUST, 0.75), a);
      }
    }
  }


// -------------------------------------------------------------------
//  DUST
// -------------------------------------------------------------------
//  Specks hanging in the air right in front of your face. There aren't
//  many and they're tiny, but without them the air is empty glass and
//  the place looks clean. Cheapest atmosphere there is.
// -------------------------------------------------------------------

  const MOTES = 55;

  function drawDust() {
    for (let i = 0; i < MOTES; i++) {
      // Each speck drifts on its own little loop, and wraps round a
      // 40-unit box that follows you - so you're always inside the dust
      // and it never runs out.
      const dx = ((hash(i) * 40 + clock * 2.4) % 40) - 20;
      const dz = ((hash(i + 99) * 40 + clock * 1.1) % 40) - 20;
      const dy = ((hash(i + 55) * 12 + clock * 0.7) % 12);

      // ANYTHING TOO CLOSE TO YOUR EYE HAS TO GO.
      //
      // Things get bigger on screen the nearer they are - that's the
      // divide in project(). A speck this small half a pace from your
      // face works out at over two hundred pixels across. A grey slab
      // would slap over the screen and you'd never guess it was dust.
      if (Math.hypot(dx, dz) < 3.5) continue;

      addBox(player.x + dx, dy + 0.5, player.z + dz,
             0.16, 0.16, 0.16, [206, 176, 130]);
    }
  }

    // when there are ninety others walking at you.
    //
    // Every single thing that makes it different from a zombie is a
    // number on this list. There is no giant-drawing code anywhere -
    // drawEnemy reads the sizes and colours out of here and builds
    // whatever it's told. That was the whole point of doing it this way.
    giant: {
      hp: 50, speed: 5.2, radius: 5.6, height: 16.5, reach: 7.0,
      body: [70, 96, 54], limb: [54, 76, 44], head: [122, 134, 88],
      eye: [255, 92, 38],
      gib: [[96, 128, 62], [72, 100, 50], [140, 150, 104], [58, 80, 44]],
      bite: 26, biteEvery: 1.5, ranged: false,

      // Barely flinches when you shoot it, and barely gets shoved by
      // the little ones. Something this size should feel like weather.
      knock: 0.12, shove: 0.10, scrap: 15,
      big: true
    },

    // THE ZOMBIE BOSS. Maximus's design, his numbers: a giant
    // four-armed zombie in a horned helmet, 1000 hp, 10 damage a hit.
    //
    // A THOUSAND hits. Twenty giants' worth. Even a marine-rifle
    // squad-of-four pile-on takes a quarter of a minute of everyone
    // firing at once, and he does not care AT ALL about being shot -
    // knock 0.05 means your gun moves him about as much as rain moves
    // a mountain. His bite is gentle for his size (10 - Maximus's
    // call), so the fight is long instead of sudden: a siege, not an
    // ambush.
    // Round two of Maximus's design: longer arms (armLen), a fatter
    // body (wide), and a GIANT SHOTGUN. Six pellets a blast, five
    // damage each - stand close and eat all six, or keep your
    // distance and most of the fan misses. He still bites things
    // that get within reach, because he has two spare arms for it.
    zombieBoss: {
      hp: 1000, speed: 4.6, radius: 7.5, height: 20, reach: 8.5,
      body: [64, 88, 50], limb: [50, 70, 42], head: [116, 128, 84],
      eye: [255, 60, 30],
      gib: [[96, 128, 62], [72, 100, 50], [140, 150, 104], [200, 190, 170]],
      bite: 10, biteEvery: 1.2,
      ranged: true, fireEvery: 2.4, bolt: 52, boltHurt: 5,
      pellets: 6, boltY: 6.5, boltColour: [255, 150, 50],
      knock: 0.05, shove: 0.06, scrap: 60,
      big: true, arms4: true, helmet: true,
      wide: 1.8, armLen: 5.6, shotgun: true,
      name: 'ZOMBIE BOSS'
    }
  };

  let enemies = [];
  let bolts   = [];
  let gibs    = [];

  // WHERE THEY COME FROM.
  //
  // These used to be 70 and 130 - both INSIDE the fog, which ends at
  // 168. So things blinked into existence in plain sight, a hundred
  // paces away, out of nothing. Now they start past the fog entirely,
  // where nothing is drawn at all, and the first you know about one is
  // a shape walking out of the haze towards you.
  //
  // Nothing about them changed. They were always walking at you from a
  // distance. They were just starting that walk somewhere you could
  // watch them appear.
  const SPAWN_MIN = 176;
  const SPAWN_MAX = 240;

  // A ceiling, so a long game can't bury the frame rate. It's high
  // because a horde alone can be a hundred.
  const MAX_ENEMIES = 150;

  let spawnTimer = 1.5;

  // Returns true if one actually turned up. It won't when the field is
  // full, and callers that care - like the horde - need to be told
  // rather than left assuming.
  function spawnEnemy(atDistance, atAngle, forceKind) {
    if (enemies.length >= MAX_ENEMIES) return false;

    // MOSTLY IN FRONT OF YOU, so you get to see them coming out of the
    // fog - but not always, or you could pick one direction and camp
    // there forever.
    const a = (atAngle !== undefined) ? atAngle
      : (Math.random() < 0.7)
        ? player.yaw + (Math.random() - 0.5) * 2.6   // roughly where you look
        : Math.random() * Math.PI * 2;               // anywhere at all

    const d = atDistance || (SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN));

    // Shooters get commoner the longer you last. At the start it's
    // almost all crowd monsters; after two minutes, half and half.
    // WHICH monsters depends on the planet - every world fills the
    // same three jobs with its own locals.
    //
    // Zombie marines are NOT in this mix - Maximus ruled they only
    // march in with hordes, like officers leading the crowd. spawnHorde
    // asks for them by name.
    const local = PLANETS[planetIx].kinds;
    const robotChance = Math.min(0.5, clock / 240);
    const kind = forceKind ||
                 (Math.random() < robotChance ? local.ranged : local.melee);
    const k = KINDS[kind];

    enemies.push({
      kind: kind, k: k,
      // SIN FOR X, COS FOR Z - the same way round as everything else
      // that has a direction in this game. It was cos/sin, which is
      // ninety degrees out, and that never showed up while the angle
      // was completely random. The moment it got aimed at where you're
      // LOOKING, it started aiming ninety degrees to your right instead.
      x: player.x + Math.sin(a) * d,
      z: player.z + Math.cos(a) * d,
      yaw: 0,
      hp: k.hp,
      step: Math.random() * 6,      // so they aren't all in lockstep
      hitFlash: 0,
      cool: Math.random() * 2
    });

    return true;
  }

// -------------------------------------------------------------------
//  HORDES
// -------------------------------------------------------------------
//  Every so often, forty-five to a hundred of them come over the
//  horizon at once, all from the same direction, in a wide ragged line.
//
//  They start beyond the fog like everything else - but a horde is
//  drawn out there anyway, as a crowd of dark specks on the skyline.
//  That is the whole point of a horde: you're supposed to see it coming
//  and have to decide what to do about it long before it arrives.
//
//  What you should do about it is run for a settlement.
// -------------------------------------------------------------------

  const HORDE_MIN   = 45;
  const HORDE_MAX   = 100;
  // HOW OFTEN THEY COME. Maximus wanted them relentless, so these went
  // from 55 and 95 down to 18 and 30.
  //
  // Thirty seconds between hordes, and a zombie takes about twenty-four
  // to walk in from beyond the fog - so one lot is still arriving as the
  // next lot sets off. There is never a moment when nothing is coming.
  const HORDE_FIRST = 18;    // seconds before the first one
  const HORDE_EVERY = 30;    // and roughly this long between them

  let hordeTimer = HORDE_FIRST;
  let hordeWarn   = 0;       // how long the warning stays on screen
  let hordeSize   = 0;
  let hordeGiants = 0;
  let hordeBoss   = false;   // did THIS horde bring the big one?

  // CLEAR OUT SOME STRAGGLERS SO A HORDE CAN ACTUALLY ARRIVE.
  //
  // Found by simulating three minutes of play: hordes came at 30, 60,
  // 90, 120... and the sizes went 73, 53, 0, 0, 0, 0. After two hordes
  // the game was pinned at the 150 cap and every horde after that
  // delivered nothing at all. "Really often" would quietly have meant
  // "twice, then never again", with the game still cheerfully sounding
  // the horn.
  //
  // So we make room - but ONLY by removing ones that are past the fog,
  // furthest first. Nobody can watch a zombie wink out at 300 paces in
  // thick haze. Deleting one you were looking at would be a cheat you'd
  // notice; deleting one nobody can see is just housekeeping.
  function makeRoomFor(n) {
    const need = (enemies.length + n) - MAX_ENEMIES;
    if (need <= 0) return;

    const far = enemies
      .filter(function (e) {
        return !e.dead &&
               Math.hypot(e.x - player.x, e.z - player.z) > FOG_FAR;
      })
      .sort(function (a, b) {
        return Math.hypot(b.x - player.x, b.z - player.z) -
               Math.hypot(a.x - player.x, a.z - player.z);
      });

    const drop = Math.min(need, far.length);
    for (let i = 0; i < drop; i++) far[i].gone = true;

    if (drop > 0) enemies = enemies.filter(function (e) { return !e.gone; });
  }

  function spawnHorde() {
    const want = HORDE_MIN + Math.floor(Math.random() * (HORDE_MAX - HORDE_MIN + 1));

    // ONE direction for the whole crowd - that's what makes it a horde
    // and not just a busy afternoon. Slightly off from where you're
    // looking, so you have to spot it.
    const from = player.yaw + (Math.random() - 0.5) * 2.2;

    makeRoomFor(want);

    const before = enemies.length;

    for (let i = 0; i < want; i++) {
      // A wide, shallow band: spread far more across than deep, so it
      // reads as a LINE coming over a ridge rather than a blob.
      const across = (Math.random() - 0.5) * 1.15;
      const deep   = 215 + Math.random() * 85;
      spawnEnemy(deep, from + across, PLANETS[planetIx].kinds.melee);
    }

    // ---- AND SOMETHING BIG AT THE FRONT -----------------------------
    // Most hordes bring one or two giants, walking in with the crowd.
    // At the front, not wandering about on their own - a giant on its
    // own is a nuisance, a giant with ninety zombies behind it is a
    // problem you have to solve.
    //
    // And after four minutes, one horde in four brings the ZOMBIE BOSS
    // instead. A thousand hits, walking at you with the crowd around
    // his knees. The warning text changes when it's him - if it says
    // "something terrible", believe it.
    hordeGiants = 0;
    hordeBoss = false;
    if (clock > 240 && Math.random() < 0.25) {
      hordeBoss = spawnEnemy(205 + Math.random() * 20,
                             from + (Math.random() - 0.5) * 0.3,
                             'zombieBoss');
    } else if (Math.random() < 0.7) {
      const big = 1 + (Math.random() < 0.35 ? 1 : 0);
      for (let i = 0; i < big; i++) {
        if (spawnEnemy(198 + Math.random() * 30,
                       from + (Math.random() - 0.5) * 0.5,
                       PLANETS[planetIx].kinds.big)) {
          hordeGiants++;
        }
      }
    }

    // ---- AND, LATE ON, THE CORRUPTED SQUAD --------------------------
    // After two and a half minutes, half of all hordes march in with
    // two or three zombie marines at the front. A wall of shamblers is
    // a problem for your trigger finger; a wall of shamblers with
    // armoured riflemen in it is a problem for your BRAIN.
    if (clock > 150 && Math.random() < 0.5) {
      const dead = 2 + (Math.random() < 0.4 ? 1 : 0);
      for (let i = 0; i < dead; i++) {
        spawnEnemy(205 + Math.random() * 25,
                   from + (Math.random() - 0.5) * 0.7, 'zombieMarine');
      }
    }

    // HOW MANY ACTUALLY TURNED UP, not how many we asked for. With
    // hordes this frequent the 150 cap gets hit constantly, and
    // spawnEnemy quietly declines once it's full. Announcing "90 of
    // them" while twelve walked over the hill would be the screen
    // telling you something that isn't true.
    hordeSize = enemies.length - before;

    if (hordeSize > 0) {
      hordeWarn = 5;
      playHorde();
    }
  }

  function playHorde() {
    tone(90, 55, 2.6, 0.32, 'sawtooth');
    tone(136, 82, 2.4, 0.20, 'square');
    noise(2.2, 700, 120, 0.22);
  }

  function updateEnemies(dt) {
    // Work out ONCE, up front, who is close enough to matter. Every
    // enemy also remembers how far away it is, because the drawing
    // wants the same number and working it out twice is just work.
    const nearby = [];
    for (const e of enemies) {
      if (e.dead) continue;
      e.away = Math.hypot(player.x - e.x, player.z - e.z);
      if (e.away < 90) nearby.push(e);
    }

    for (const e of enemies) {
      // Already dead? Then he doesn't get to keep walking and biting
      // just because we haven't swept him off the list yet.
      if (e.dead) continue;

      e.hitFlash = Math.max(0, e.hitFlash - dt * 4);

      const dx = player.x - e.x, dz = player.z - e.z;
      const gap = e.away || 1;

      e.yaw = Math.atan2(dx, dz);           // always facing you

      // ---- WALK AT YOU --------------------------------------------
      // Stop at arm's length instead of climbing inside you.
      if (gap > e.k.reach) {
        e.x += (dx / gap) * e.k.speed * dt;
        e.z += (dz / gap) * e.k.speed * dt;
        e.step += dt * (e.k.speed * 0.55);
      }

      // ---- THEY CAN'T WALK THROUGH TOWERS EITHER ------------------
      // No clever route-finding - if he ends up inside something, we
      // shove him back out along the line from its middle. He's still
      // aiming at you every frame, so he shuffles round the edge on
      // his own. Looks like he's going round it. Close enough.
      const wall = blockedAt(e.x, e.z, e.k.radius);
      if (wall) {
        const wx = e.x - wall.x, wz = e.z - wall.z;
        const wg = Math.hypot(wx, wz) || 1;
        const want = wall.solid + e.k.radius;
        e.x = wall.x + (wx / wg) * want;
        e.z = wall.z + (wz / wg) * want;
      }

      // ---- PUSH EACH OTHER APART ----------------------------------
      // Without this they stack into one thick zombie and you can't
      // tell how many you're actually fighting.
      //
      // ONLY THE CLOSE ONES. This compares every enemy against every
      // other, which is fine for twenty and is 22,500 sums a frame for
      // a hundred and fifty. Out past 90 paces they're a few pixels
      // tall in the fog and nobody alive can tell whether two of them
      // are overlapping, so we simply don't ask.
      if (gap < 90) {
        for (const o of nearby) {
          if (o === e) continue;
          const ox = e.x - o.x, oz = e.z - o.z;
          const og = Math.hypot(ox, oz);
          const want = e.k.radius + o.k.radius;
          if (og < want && og > 0.01) {
            // Multiplied by how shovable THIS one is. A zombie bounces
            // off a giant; a giant walks through a crowd of zombies
            // barely noticing. Same line of code, one extra number.
            const push = (want - og) * 0.5 * e.k.shove;
            e.x += (ox / og) * push;
            e.z += (oz / og) * push;
          }
        }
      }

      e.cool -= dt;

      // ---- HURT YOU -----------------------------------------------
      // A ranged thing with a bite (the boss) uses teeth when you're
      // inside its reach and the gun the rest of the time. Robots
      // have bite 0, so nothing changes for them.
      const inReach = gap <= e.k.reach + 0.6;
      if (e.k.ranged && !(inReach && e.k.bite > 0)) {
        if (gap < 90 && e.cool <= 0) {
          e.cool = e.k.fireEvery;
          fireBolt(e);
        }
      } else if (inReach && e.cool <= 0) {
        e.cool = e.k.biteEvery;
        hurtPlayer(e.k.bite);
      }
    }
  }

  function fireBolt(e) {
    const dx = player.x - e.x, dz = player.z - e.z;
    const aim = Math.atan2(dx, dz);

    // Most things fire ONE bolt. A shotgun fires a FAN: the middle
    // pellet flies straight at you and the rest spread half a radian
    // wide. Stand close and all six hit; keep your distance and most
    // of the fan sails past. The spread IS the weapon.
    const n = e.k.pellets || 1;
    for (let i = 0; i < n; i++) {
      const a = aim + (n > 1 ? (i / (n - 1) - 0.5) * 0.5 : 0);
      bolts.push({
        x: e.x, y: e.k.boltY || e.k.height * 0.62, z: e.z,
        vx: Math.sin(a) * e.k.bolt,
        vz: Math.cos(a) * e.k.bolt,
        hurt: e.k.boltHurt,
        col: e.k.boltColour,      // zombie marines shoot RED. Robots
        life: 3.5                 // leave this empty and get the old blue.
      });
    }

    if (n > 1) {
      // A shotgun does not go "zap". A shotgun goes BOOM.
      noise(0.35, 600, 70, 0.4);
      tone(95, 45, 0.45, 0.3, 'sawtooth');
    } else {
      playZap();
    }
  }

  function updateBolts(dt) {
    for (const b of bolts) {
      b.x += b.vx * dt;
      b.z += b.vz * dt;
      b.life -= dt;

      // ---- DID IT HIT A WALL? -----------------------------------------
      // Solid things now know how HIGH they are, and that matters: a
      // bolt flying at head height should be stopped by a settlement
      // wall and should sail straight over a burnt-out car. Without the
      // height check every wreck in the wasteland becomes a force field.
      const wall = blockedAt(b.x, b.z, 0.4);
      if (wall && b.y < wall.tall) {
        b.life = 0;
        sparkBolt(b);
        continue;                 // it's gone - it can't also hit you
      }

      if (Math.hypot(b.x - player.x, b.z - player.z) < 2.2) {
        b.life = 0;
        hurtPlayer(b.hurt);
      }
    }
    bolts = bolts.filter(function (b) { return b.life > 0; });
  }

  // A bolt splashing off something solid. Reusing the gib system again -
  // it's just bits flying, and bits flying is bits flying.
  function sparkBolt(b) {
    burst(b.x, b.y, b.z, [[150, 230, 255], [90, 190, 240], [230, 250, 255]],
          8, 7);
    tone(720, 200, 0.09, 0.10, 'square');
  }

  function drawBolts() {
    for (const b of bolts) {
      if (b.col) {
        addBox(b.x, b.y, b.z, 0.9, 0.9, 0.9, [255, 200, 160]);
        addBox(b.x, b.y, b.z, 1.5, 0.4, 1.5, b.col);
      } else {
        addBox(b.x, b.y, b.z, 0.9, 0.9, 0.9, [140, 230, 255]);
        addBox(b.x, b.y, b.z, 1.5, 0.4, 1.5, [80, 180, 240]);
      }
    }
  }

  // ---- DRAWING ONE OF THEM ------------------------------------------
  // Both kinds are drawn by the SAME function. It reads the sizes and
  // colours out of e.k, so a zombie and a robot are the same shape put
  // together from different numbers - which is why adding a third kind
  // needs no drawing code at all.
  const HORDE_SEE = 340;     // how far a horde is visible on the skyline

  function drawEnemy(e) {
    const k = e.k;
    const s = e.yaw;
    const co = Math.cos(s), si = Math.sin(s);

    const away = e.away !== undefined
      ? e.away : Math.hypot(player.x - e.x, player.z - e.z);

    // ---- HOW MUCH OF HIM IS WORTH DRAWING? --------------------------
    // A full enemy is thirteen boxes, which is sixty-five flat shapes.
    // A hundred of those is six and a half thousand, and the game would
    // crawl. So the further off he is, the less of him gets built.
    //
    // At two hundred paces he's a few pixels tall. Nobody has ever been
    // able to count a distant zombie's legs.

    // BEYOND THE FOG: one dark speck, so a horde shows on the horizon.
    // This is the only reason you get to see one coming.
    if (away > FOG_FAR) {
      if (away > HORDE_SEE) return;

      seeFar = true;
      fogResist = 0.35;      // mostly swallowed - a shape, not a zombie

      // Grown a little with distance so it stays a visible speck.
      const w = 1.6 + away * 0.006;
      addBox(e.x, k.height * 0.45, e.z, w, k.height * 0.75, w,
             shade(k.body, 0.6), s);

      fogResist = 0;
      seeFar = false;
      return;
    }

    // HOW BIG IS HE ON SCREEN, not how far away is he.
    //
    // A giant is three times a zombie's height, so at ninety paces he
    // still fills as much screen as a zombie at thirty. Judging detail
    // by raw distance would strip a giant down to three boxes while he
    // was still looming over you. Dividing by his height fixes that in
    // one line, for every kind, including any we add later.
    const lod = away / (k.height / 5.4);

    // FAR: body and head. Three boxes instead of thirteen.
    if (lod > 78) {
      addBox(e.x, k.height * 0.30, e.z, 2.2, k.height * 0.6, 1.5, k.limb, s);
      addBox(e.x, k.height * 0.68, e.z, 3.0 * (k.wide || 1), k.height * 0.3,
             1.9 * (k.wide || 1), k.body, s);
      addBox(e.x, k.height * 0.88, e.z, 1.9, 1.8, 1.8, k.head, s);
      return;
    }

    // MIDDLE DISTANCE: legs that swing, a body, a head, and the eyes.
    // No arms, no rust stripe, no belt. Six boxes.
    //
    // This tier exists because of a measurement: a hundred of them at
    // full detail came to 4,535 shapes in one frame. Most of a horde
    // sits in this band, so most of a horde now costs half as much.
    if (lod > 34) {
      const sw = Math.sin(e.step) * 1.1;
      addBox(e.x - 0.9 * co, k.height * 0.20, e.z + 0.9 * si,
